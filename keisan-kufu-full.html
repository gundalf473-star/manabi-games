function file(){try{return decodeURIComponent(location.pathname.split('/').pop()||'');}catch(e){return '';}}
function load(){try{var h=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(h)?h:[];}catch(e){return [];}}
function save(){if(!S||(!S.a&&S.s==null))return;try{var h=load(),i=-1;for(var j=h.length-1;j>=0&&j>=h.length-60;j--){if(h[j].id===S.id){i=j;break;}}

if(i>=0)h[i]=e;else h.push(e);if(h.length>3000)h=h.slice(-3000);localStorage.setItem(KEY,JSON.stringify(h));}catch(x){}}

<script>
/* 有料版の利用コード（まなびゲーム箱）。サーバー（site.json の apiBase）に利用コードを確かめてもらい、
   期限内のときだけ問題データを受け取ります。この端末には「利用コード・期限・通行証」だけを保存します。 */
(function(){
var API="", KEY='mn-access', DEV='mn-device';
var SUBJ={'国語':'kokugo','算数':'sansu','社会':'shakai','理科':'rika'}, SNAME={kokugo:'国語',sansu:'算数',shakai:'社会',rika:'理科',all:'全教科'};
var PNAME={d1:'1日',w1:'1週間',m1:'1ヵ月',y1:'1年'};
function ls(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function device(){var d=ls(DEV,'');if(!d){var a=new Uint8Array(12);crypto.getRandomValues(a);d=Array.from(a,function(b){return b.toString(16).padStart(2,'0');}).join('');lsSet(DEV,d);}return d;}
function list(){var l=ls(KEY,[]);return Array.isArray(l)?l:[];}
function save(l){lsSet(KEY,l);}
function upsert(e){var l=list().filter(function(x){return x.code!==e.code;});l.push(e);save(l);return e;}
function remove(code){save(list().filter(function(x){return x.code!==code;}));}
function fmt(t){var d=new Date(t);return (d.getFullYear()!==new Date().getFullYear()?d.getFullYear()+'年':'')+(d.getMonth()+1)+'月'+d.getDate()+'日 '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');}
function left(t){var ms=t-Date.now();if(ms<=0)return '終了';var d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);return d>0?'あと'+d+'日'+(d<3?h+'時間':''):h>0?'あと'+h+'時間'+m+'分':'あと'+m+'分';}
var ERR={not_found:'この利用コードは見つかりません。文字をもう一度確かめてください。',expired:'この利用コードは、利用期間が終わっています。',revoked:'この利用コードは使えなくなっています。',
  devices:'この利用コードは、すでに3台の端末で使われています。ほかの端末で使うときは、お問い合わせください。',bad_code:'利用コードは「MN-」から始まる12文字です。',subject:'このプランでは、この教科のゲームは使えません。',
  no_data:'問題データの準備中です。しばらくしてからもう一度ためしてください。',net:'通信できませんでした。インターネットにつながっているか確かめてください。',noapi:'有料版の販売は準備中です。'};
function call(path,opt){
  if(!API)return Promise.reject({error:'noapi'});
  return fetch(API.replace(/\/$/,'')+path,opt).then(function(r){return r.json().catch(function(){return {};}).then(function(d){if(!r.ok){d=d||{};d.status=r.status;throw d;}return d;});},function(){throw {error:'net'};});
}
function activate(code){
  return call('/api/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code,device:device()})})
    .then(function(d){return upsert({code:d.code,s:d.subject,p:d.period,exp:d.exp,token:d.token});});
}
function covers(e,s){return e.s==='all'||e.s===s;}
function pageSubject(){var m=document.querySelector('meta[name="game:subject"]');return m?SUBJ[m.content]||'':'';}
/* ゲームのデータを受け取る。使えるプランがなければ {error} を投げる */
function load(game,subject){
  var s=subject||pageSubject(), now=Date.now();
  var cand=list().filter(function(e){return covers(e,s);});
  var live=cand.filter(function(e){return e.exp>now;}).sort(function(a,b){return b.exp-a.exp;});
  if(!live.length)return Promise.reject(cand.length?{error:'expired',exp:Math.max.apply(null,cand.map(function(e){return e.exp;}))}:{error:'none'});
  var i=0, lastErr=null;
  function tryOne(){
    if(i>=live.length)return Promise.reject(lastErr||{error:'none'});
    var e=live[i++];
    var get=function(tok){return call('/api/pack/'+game,{headers:{Authorization:'Bearer '+tok}});};
    return get(e.token).catch(function(err){
      if(err.error==='renew'||err.error==='bad_token') return activate(e.code).then(function(n){return get(n.token);});
      throw err;
    }).catch(function(err){
      if(err.error==='net'||err.error==='no_data')throw err;
      if(err.error==='expired'){e.exp=Math.min(e.exp,Date.now());upsert(e);}
      if(err.error==='revoked'||err.error==='not_found')remove(e.code);
      lastErr=err; return tryOne();
    });
  }
  return tryOne();
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function base(){var p=location.pathname;return p.indexOf('/games/')>=0?'../':'';}
/* 利用コードを入れる画面。opt: {game, err, onOpen, free(無料版のファイル名)} */
function lock(el,opt){
  var s=pageSubject(), err=opt.err||{}, b=base();
  var msg=err.error==='expired'?'利用期間が終わりました'+(err.exp?'（'+fmt(err.exp)+'まで）':'')+'。続けて使うときは、新しいプランをお買い求めください。':
          err.error&&err.error!=='none'?(ERR[err.error]||'うまく読みこめませんでした。'):'';
  el.innerHTML='<div class="mn-lock" style="display:flex;flex-direction:column;gap:12px">'
   +'<div style="font-size:12px;font-weight:700;letter-spacing:.1em;opacity:.8">有料版</div>'
   +'<p style="margin:0;font-weight:700">この有料版は「'+esc(SNAME[s]||'')+'」または「全教科」のプランで使えます。購入したときの<b>利用コード</b>を入れてください。</p>'
   +'<form id="mn-f" autocomplete="off" style="display:flex;flex-direction:column;gap:10px">'
   +'<label for="mn-code" style="font-weight:700">利用コード</label>'
   +'<input id="mn-code" inputmode="latin" autocapitalize="characters" spellcheck="false" placeholder="MN-XXXX-XXXX-XXXX" style="font:inherit;font-size:20px;letter-spacing:.05em;padding:10px 12px;border:2px solid currentColor;border-radius:8px;background:transparent;color:inherit;width:100%;box-sizing:border-box;opacity:.9">'
   +'<p id="mn-err" role="alert" style="margin:0;min-height:1.5em;font-size:14px;color:#c8352d;font-weight:700">'+esc(msg)+'</p>'
   +'<div><button id="mn-go" type="submit" style="font:inherit;font-weight:700;border:0;border-radius:8px;padding:10px 22px;cursor:pointer;background:var(--fg,#1f2a37);color:var(--surface,#fff)">使う</button></div></form>'
   +'<div style="border-radius:8px;padding:12px 14px;font-size:14px;background:rgba(127,127,127,.12);line-height:1.8">'
   +(API?'<a href="'+b+'buy.html?s='+(s||'all')+'" style="font-weight:700;color:inherit">料金プランを見る・購入する</a><br>':'有料版の販売は準備中です。<br>')
   +'<a href="'+b+'plan.html" style="color:inherit">利用中のプランを確かめる</a>'
   +(opt.free?'<br>無料版は <a href="'+esc(opt.free)+'" style="color:inherit">こちら</a> で遊べます。':'')+'</div></div>';
  var f=el.querySelector('#mn-f');
  f.onsubmit=function(ev){ev.preventDefault();
    var v=el.querySelector('#mn-code').value, bt=el.querySelector('#mn-go'), er=el.querySelector('#mn-err');
    if(!v.trim()){er.textContent='利用コードを入れてください。';return;}
    bt.disabled=true;bt.textContent='確かめています…';
    activate(v).then(function(e){
      if(!covers(e,s)){bt.disabled=false;bt.textContent='使う';er.textContent='この利用コードは「'+SNAME[e.s]+'」のプランです。このゲームは「'+SNAME[s]+'」のプランで使えます。';return;}
      try{window.mnTrack&&mnTrack('unlock',{product:opt.game,plan:e.s+'-'+e.p});}catch(x){}
      return opt.onOpen();
    }).catch(function(e){bt.disabled=false;bt.textContent='使う';er.textContent=ERR[e&&e.error]||'うまくいきませんでした。もう一度ためしてください。';});
  };
}
window.mnAccess={api:API,list:list,remove:remove,activate:activate,load:load,lock:lock,fmt:fmt,left:left,SNAME:SNAME,PNAME:PNAME,ERR:ERR,device:device,call:call};
})();
</script>

<script>
(function(){
/* くふうの種類 */
const IDEAS={
  wake:'かけられる数をキリのよい数に分けて、分配法則を使う',
  matome:'同じ数でまとめて、分配法則を使う',
  hyaku:'25×4＝100、125×8＝1000 を作る',
  kumi:'たして10や100になる組を作る',
  chosei:'たし算・ひき算で、キリのよい数にしてから、あとで調整する',
  pair:'はじめと終わりを組にしてたす',
  junban:'かけ算とわり算の順番を入れかえる',
  shosu:'小数を分数に直す（0.25＝1/4 など）',
  warizan:'わる数とわられる数に同じ数をかけて、キリのよい数でわる',
  bubun:'分数を「1/□−1/△」に分けて、消し合う'};
/* 問題データ: e=式, i=くふう, f=[正しい式の変え方, まちがい, まちがい], a=答え（分数は "4/5" の形）, s=計算の流れ, t=ひとこと, lv=1基本 2標準 3発展 */
const PAID=true;
let QS=[];
/* 同じ問題で両方えらべてしまう、まぎらわしい組み合わせ（いっしょに選択肢に出さない） */
const NEAR={wake:['chosei','hyaku'],chosei:['wake'],hyaku:['junban','shosu','warizan','wake'],junban:['hyaku'],kumi:['pair'],pair:['kumi'],shosu:['hyaku','warizan'],warizan:['hyaku','shosu']};
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const fmt=n=>typeof n==='string'?n:Number(n).toLocaleString('ja-JP',{maximumFractionDigits:4});
const num=v=>{v=String(v);if(v.includes('/')){const [a,b]=v.split('/');return Number(a)/Number(b);}return Number(v);};
// 「1/2」「1/(2×3)」を分数の形で表示する
const fr=s=>esc(s).replace(/(\d+)\/(\(([^()]*)\)|\d+)/g,(m,n,d,inner)=>`<span class="fr"><span>${n}</span><span>${inner!=null?inner:d}</span></span>`);
const norm=s=>s.normalize('NFKC').toLowerCase().replace(/[\s\-ー－]/g,'');
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let shopUrl='', course=null, rec=store.get('kufu-p-rec',{});
const saveRec=()=>store.set('kufu-p-rec',rec);
const qkey=q=>q.e;
const state=q=>{const r=rec[qkey(q)];if(!r)return 'new';if(r[0]>=2&&r[0]>r[1])return 'master';if(r[1]>0)return 'weak';return 'try';};
const record=(q,ok)=>{if(!PAID)return false;const before=state(q);const r=rec[qkey(q)]||[0,0];r[ok?0:1]++;rec[qkey(q)]=r;saveRec();return state(q)==='master'&&before!=='master';};
const LV={1:['基本','分配法則、25×4、たして100 など、まず覚えたいくふう。'],2:['標準','小数のくふう（0.25＝1/4）、わり算のきまり、奇数の和 など。'],3:['発展','分数の「1/□−1/△」、99×99、まとめる数を作りかえる問題 など入試レベル。']};
const PAIDLINK=`<a class="paid" href="keisan-kufu-full.html" id="paid-link"><span class="pt">もっと練習したい人へ　<b>計算のくふう 50問</b>（有料版）</span><span class="pd">無料版の10問もふくむ全50問。基本・標準・発展の3コース、小数・分数のくふうと、苦手だけの復習つき。</span></a>`;
async function decrypt(){ return mnAccess.load('keisan-kufu'); }
function lockScreen(err){ mnAccess.lock(app,{game:'keisan-kufu',err:err,free:'keisan-kufu.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
function homePaid(){
  const cnt={master:0,weak:0,new:0,try:0}; QS.forEach(q=>cnt[state(q)]++);
  const pools={1:QS.filter(q=>q.lv===1),2:QS.filter(q=>q.lv===2),3:QS.filter(q=>q.lv===3)};
  const weak=QS.filter(q=>state(q)==='weak'), fresh=QS.filter(q=>state(q)==='new');
  app.innerHTML=`<div class="master"><div class="tp"><span class="label" style="font-size:14px;color:var(--fg)">マスターした問題（★3つを2回）</span><span class="cnt">${cnt.master}<small> / ${QS.length}問</small></span></div>
      <div class="mbar" aria-hidden="true"><i class="m" style="width:${cnt.master/QS.length*100}%"></i><i class="w2" style="width:${cnt.weak/QS.length*100}%"></i></div>
      <div class="mleg"><span style="--c:var(--ok)">マスター ${cnt.master}</span><span style="--c:var(--star)">にがて ${cnt.weak}</span><span style="--c:var(--rule)">まだ ${cnt.new}</span></div></div>
    <div class="label">コースをえらぶ（1回10問）</div>
    <div class="courses">${[1,2,3].map(l=>`<button class="course" data-l="${l}"><span class="nm">${LV[l][0]}</span><span class="ds">${LV[l][1]}（${pools[l].length}問）</span><span class="stars">${best&&best['lv'+l]!=null?`ベスト ★${best['lv'+l]} / 30`:''}</span></button>`).join('')}
      <button class="course" data-l="weak" ${weak.length?'':'disabled'}><span class="nm">にがて</span><span class="ds">★が足りなかったことのある問題（${weak.length}問）</span></button>
      <button class="course" data-l="fresh" ${fresh.length?'':'disabled'}><span class="nm">まだやっていない</span><span class="ds">一度も出ていない問題（${fresh.length}問）</span></button></div>
    <details><summary style="cursor:pointer;font-weight:800;font-size:14px">出てくるくふう（10種類）</summary><ul class="ideas" style="margin-top:8px">${Object.values(IDEAS).map(v=>`<li>${fr(v)}</li>`).join('')}</ul></details>
    <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
  app.querySelectorAll('.course').forEach(b=>b.onclick=()=>{
    const l=b.dataset.l; course=l;
    const pool=l==='weak'?weak:l==='fresh'?fresh:pools[l];
    start(shuffle(pool).slice(0,10).map(q=>QS.indexOf(q)));
  });
  document.getElementById('reset').onclick=()=>{
    document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
    document.getElementById('yes').onclick=()=>{rec={};saveRec();homePaid();};
    document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
  };
}
let best=store.get(PAID?'kufu-p-best':'kufu-best',PAID?{}:null), G=null;

function home(){
  G=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>
    <ol class="howto"><li><b>くふうをえらぶ</b>：どうすれば計算がかんたんになるか。</li><li><b>式を変える</b>：正しい式の変え方をえらぶ。</li><li><b>答える</b>：数字のボタンで答えを入れる。</li></ol>
    <p class="note">1問で最大★3つ。全部で★30をめざそう。</p>
    <div class="label">出てくるくふう</div>
    <ul class="ideas">${[...new Set(QS.map(q=>q.i))].map(k=>`<li>${fr(IDEAS[k])}</li>`).join('')}</ul>
    <div class="row"><button class="btn go" id="go">はじめる（${QS.length}問）</button>${best!=null?`<span class="stars">ベスト ★${best} / 30</span>`:''}</div>${PAIDLINK}`;
  document.getElementById('go').onclick=()=>start(shuffle(QS.map((q,i)=>i)));
}
function start(list){
  G={list,i:0,stars:0,miss:[],n:list.length};
  track('level_start',{level_name:PAID?'kufu-p-'+course:'kufu'});
  newQ();
}
function newQ(){
  const q=QS[G.list[G.i]];
  const others=shuffle(Object.keys(IDEAS).filter(k=>k!==q.i&&!(NEAR[q.i]||[]).includes(k))).slice(0,3);
  G.q={step:1,ideaCh:shuffle([q.i,...others]),formCh:shuffle([0,1,2]),idea:null,form:null,val:'',ans:null,r:[null,null,null]};
  render();
}
function render(){
  const q=QS[G.list[G.i]], s=G.q;
  const st=(k,title,body)=>{const cls=s.step===k?'now':s.step<k?'lock':'';const r=s.r[k-1];
    return `<div class="step ${cls}"><h3><span class="no">${k}</span>${title}${r!=null?`<span class="res ${r?'o':'x'}">${r?'〇 ★1':'×'}</span>`:''}</h3>${s.step>=k?body:''}</div>`;};
  const step1=`<div class="opts">${s.ideaCh.map(k=>`<button class="opt ${s.idea!=null?(k===q.i?'right':k===s.idea?'wrong':''):''}" data-k="${k}" ${s.idea!=null?'disabled':''}>${fr(IDEAS[k])}</button>`).join('')}</div>
    ${s.idea!=null&&!s.r[0]?`<p class="fb x">この式では「${fr(IDEAS[q.i])}」がぴったりです。</p>`:''}`;
  const step2=`<div class="opts">${s.formCh.map(j=>`<button class="opt f ${s.form!=null?(j===0?'right':j===s.form?'wrong':''):''}" data-j="${j}" ${s.form!=null?'disabled':''}>${q.e.length>14?'＝ ':fr(q.e)+' ＝ '}${fr(q.f[j])}</button>`).join('')}</div>
    ${s.form!=null&&!s.r[1]?`<p class="fb x">正しい式の変え方は「${fr(q.f[0])}」です。</p>`:''}`;
  const done3=s.ans!=null;
  const step3=`<div class="disp"><span class="note">${fr(q.f[0])} ＝</span><span class="val ${done3?(s.r[2]?'o':'x'):''}" aria-live="polite">${s.val&&s.val.includes('/')&&!s.val.endsWith('/')?fr(s.val):esc(s.val||'')}</span></div>
    ${done3?'':`<div class="pad">${['1','2','3','4','5','6','7','8','9','0','.','/','00'].map(c=>`<button data-c="${c}" ${c==='/'?'aria-label="分数の線"':''}>${c==='/'?'／':c}</button>`).join('')}<button class="del" data-c="del">けす</button><button class="del" data-c="clr">ぜんぶ</button></div>
      <p class="note">分数は「4／5」のように、分子 → ／ → 分母の順に入れます。</p>
      <div class="row"><button class="btn go" id="ok" ${s.val?'':'disabled'}>こたえる</button></div>`}`;
  app.innerHTML=`<div class="top"><div class="prog" aria-hidden="true"><i style="width:${G.i/G.n*100}%"></i></div><span class="nums">${G.i+1} / ${G.n}</span><span class="stars">★${G.stars}</span></div>
    <p class="expr">${fr(q.e)}</p>
    ${st(1,'どのくふうを使う？',step1)}
    ${st(2,'式をどう変える？',step2)}
    ${st(3,'答えは？',step3)}
    <div id="after"></div>`;
  app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{if(s.idea!=null)return;s.idea=b.dataset.k;s.r[0]=s.idea===q.i;s.step=2;render();});
  app.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{if(s.form!=null)return;s.form=+b.dataset.j;s.r[1]=s.form===0;s.step=3;render();});
  app.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>{const c=b.dataset.c;
    if(c==='del')s.val=s.val.slice(0,-1); else if(c==='clr')s.val=''; else if(c==='.'){if(!s.val.includes('.')&&!s.val.includes('/'))s.val=(s.val||'0')+'.';} else if(c==='/'){if(s.val&&!s.val.includes('/')&&!s.val.includes('.'))s.val+='/';} else if(s.val.length<10)s.val=(s.val==='0'&&c!=='.')?c.replace(/^0+/,'')||'0':s.val+c;
    render();});
  const ok=document.getElementById('ok'); if(ok)ok.onclick=answer;
  if(done3)explain();
}
function answer(){
  const q=QS[G.list[G.i]], s=G.q;
  s.ans=num(s.val); s.r[2]=isFinite(s.ans)&&Math.abs(s.ans-num(q.a))<1e-9;
  const got=s.r.filter(Boolean).length; G.stars+=got;
  if(got<3)G.miss.push(G.list[G.i]);
  G.newM=record(q,got===3);
  track('answer_question',{category:'kufu-'+q.i,question:q.e,correct:s.r[2],idea_ok:s.r[0],form_ok:s.r[1],stars:got});
  s.step=4; render();
}
function explain(){
  const q=QS[G.list[G.i]], s=G.q, last=G.i===G.n-1, got=s.r.filter(Boolean).length;
  document.getElementById('after').innerHTML=`<div class="box" style="padding:14px;gap:10px;border-color:${got===3?'var(--ok)':'var(--rule)'}">
    <div class="row" style="justify-content:space-between"><span style="font-family:var(--display);font-size:22px">${got===3?'かんぺき！':s.r[2]?'答えは正解！':'答えは '+fr(fmt(q.a))}${G.newM?'<span style="font-size:13px;margin-left:8px;color:var(--ok);font-family:var(--body);font-weight:800">マスター！</span>':''}</span><span class="stars" style="font-size:20px">${'★'.repeat(got)}${'☆'.repeat(3-got)}</span></div>
    <div class="explain"><span class="t">${fr(IDEAS[q.i])}</span><ol>${q.s.map(x=>`<li>${fr(x)}</li>`).join('')}</ol><div class="tip">${fr(q.t)}</div></div>
    <div class="row"><button class="btn go" id="next">${last?'結果を見る':'次の問題へ'}</button></div></div>`;
  const nx=document.getElementById('next'); nx.onclick=next; nx.focus({preventScroll:true});
}
function next(){ if(++G.i<G.n)newQ(); else result(); }
function result(){
  const n=G.n, s=G.stars, max=n*3, r=s/max;
  const rank=r===1?'満点':r>=.8?'特選':r>=.6?'入選':r>=.4?'佳作':'もう一歩';
  track('level_end',{level_name:PAID?'kufu-p-'+course:'kufu',success:s===max,score:s,total:max});
  if(PAID){ if(/^[123]$/.test(course)&&n===10&&(best['lv'+course]==null||s>best['lv'+course])){best['lv'+course]=s;store.set('kufu-p-best',best);} }
  else if(n===QS.length&&(best==null||s>best)){best=s;store.set('kufu-best',best);}
  app.innerHTML=`<div class="label">結果</div>
    <div class="score"><div class="big">★${s}<small> / ${max}</small></div><div class="seal">${rank}</div></div>
    <p style="margin:0">${r===1?'全部のくふうを使いこなせました！':r>=.6?'よくできました。★が足りなかった問題の、くふうの考え方を見直そう。':'まずは「25×4＝100」「同じ数でまとめる」など、くふうの名前と形を覚えよう。'}</p>
    <div class="row"><button class="btn go" id="again">${PAID?'コースをえらぶ':'もう一度'}</button>${G.miss.length?'<button class="btn" id="retry">★が足りなかった問題だけ</button>':''}</div>
    ${PAID?'':PAIDLINK}
    ${G.miss.length?`<div class="label" style="color:var(--fg)">★が足りなかった問題</div>${G.miss.map(k=>{const q=QS[k];return `<div class="rv"><b>${fr(q.e)} ＝ ${fr(q.f[0])} ＝ ${fr(fmt(q.a))}</b><br>${fr(IDEAS[q.i])}</div>`;}).join('')}`:''}`;
  document.getElementById('again').onclick=home;
  const rt=document.getElementById('retry'); if(rt)rt.onclick=()=>{course='retry';start(G.miss.slice());};
}
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>

<script>
(function(){
var CFG=null;            // site.json の feedbackForm から作った設定（なければ null）
var base=window.mnTrack, lastQ=null, lastLv='';
function file(){try{return decodeURIComponent(location.pathname.split('/').pop()||'');}catch(e){return '';}}
function clean(s){return String(s).replace(/\{(.+?)\}/g,'【$1】');}
function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function formUrl(kind,q){
  var u=CFG.base+'?usp=pp_url';
  if(CFG.type)u+='&'+CFG.type+'='+encodeURIComponent(kind==='q'?CFG.machigai:CFG.kansou);
  if(CFG.game)u+='&'+CFG.game+'='+encodeURIComponent(document.title);
  if(CFG.question&&q)u+='&'+CFG.question+'='+encodeURIComponent(q);
  return u;
}
var sheet=el('<div class="mnfb-sheet" role="dialog" aria-label="ご意見" hidden></div>');
document.body.appendChild(sheet);
function close(){sheet.hidden=true;sheet.innerHTML='';}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!sheet.hidden)close();});
// わくの外をさわったら閉じる（評価は「答えなかった」として、その日はもう出さない）
document.addEventListener('click',function(e){
  if(sheet.hidden||sheet.contains(e.target)||(e.target.closest&&e.target.closest('.mnfb-btn')))return;
  if(sheet.dataset.k==='rate')markRated();
  close();
},true);

// 1・2. ご意見ボタン（感想フォーム／いまの問題のまちがいを知らせる）
if(CFG){
  var btn=el('<button class="mnfb-btn" type="button" aria-haspopup="dialog">ご意見</button>');
  document.body.appendChild(btn);
  btn.onclick=function(){
    if(!sheet.hidden&&sheet.dataset.k==='menu'){close();return;}
    var q=lastQ||(lastLv?'コース：'+lastLv:'');
    sheet.dataset.k='menu';
    sheet.innerHTML='<div class="mnfb-h"><span>ご意見をお聞かせください</span><button class="mnfb-x" type="button" aria-label="閉じる">×</button></div>'
      +(lastQ?'<a class="mnfb-opt" data-kind="question" target="_blank" rel="noopener" href="'+esc(formUrl('q',q))+'">いまの問題のまちがいを知らせる<small>'+esc(q)+'</small></a>':'')
      +'<a class="mnfb-opt" data-kind="comment" target="_blank" rel="noopener" href="'+esc(formUrl('k',lastLv?'コース：'+lastLv:''))+'">感想・ご意見を送る<small>'+esc(document.title)+'</small></a>'
      +'<p class="mnfb-note">保護者の方向けのフォームが新しいページで開きます。お子さんのお名前や学校名は書かないでください。</p>';
    sheet.hidden=false;
    sheet.querySelector('.mnfb-x').onclick=close;
    sheet.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){try{base&&base('feedback_open',{kind:a.dataset.kind});}catch(e){}setTimeout(close,0);});});
  };
}

// 3. ワンタップ評価（ゲームを1回終えたとき。同じゲームは1日1回まで）
function rated(){try{var r=JSON.parse(localStorage.getItem('mn-rated')||'{}');return r[file()]===new Date().toDateString();}catch(e){return false;}}
function markRated(){try{var r=JSON.parse(localStorage.getItem('mn-rated')||'{}');r[file()]=new Date().toDateString();localStorage.setItem('mn-rated',JSON.stringify(r));}catch(e){}}
function askRating(lv){
  if(rated()||!sheet.hidden)return;
  sheet.dataset.k='rate';
  sheet.innerHTML='<div class="mnfb-h"><span>このゲーム、どうだった？</span><button class="mnfb-x" type="button" aria-label="閉じる">×</button></div>'
    +'<div class="mnfb-rate"><button type="button" data-r="fun"><span>😊</span>たのしかった</button><button type="button" data-r="ok"><span>🙂</span>ふつう</button><button type="button" data-r="hard"><span>😣</span>むずかしすぎた</button></div>';
  sheet.hidden=false;
  sheet.querySelector('.mnfb-x').onclick=function(){markRated();close();};
  sheet.querySelectorAll('[data-r]').forEach(function(b){b.onclick=function(){
    try{base&&base('game_rating',{rating:b.dataset.r,level_name:lv||''});}catch(e){}
    markRated();
    sheet.innerHTML='<div class="mnfb-h"><span>ありがとう！</span></div>';
    setTimeout(function(){if(sheet.dataset.k==='rate')close();},1200);
  };});
}
window.mnTrack=function(n,p){p=p||{};try{base&&base(n,p);}catch(e){}
  try{
    if(n==='level_start'){lastLv=String(p.level_name||'');if(sheet.dataset.k==='rate')close();}
    else if(n==='answer_question'){if(sheet.dataset.k==='rate')close();if(p.question!=null)lastQ=clean(p.question).slice(0,120);}
    else if(n==='level_end'){if(p.level_name)lastLv=String(p.level_name);setTimeout(function(){askRating(lastLv);},700);}
  }catch(e){}};
})();
</script>

</body></html>
