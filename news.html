<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>お知らせ | {{SITE_NAME}}</title>
<meta name="description" content="{{SITE_NAME}}の運営からのお知らせ。新しいゲームの公開や、問題を直したところなど。">
{{GA}}
<style>
:root{--bg:#f2f5f9;--surface:#fff;--fg:#1d2b3d;--muted:#5d6a7c;--rule:#d6dde7;--ink:#1f3a6e;--new:#d4432a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10151d;--surface:#18212d;--fg:#e4e9f1;--muted:#9aa6b8;--rule:#2a3546;--ink:#8fb0f0;--new:#f07a62;color-scheme:dark}}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;line-height:1.8;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(24px + env(safe-area-inset-top,0px)) 40px}
main{max-width:42em;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-size:26px;color:var(--ink);margin:0}
a{color:var(--ink)}
.small{color:var(--muted);font-size:13px;margin:0}
.item{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.item time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.item h2{font-size:17px;margin:2px 0 4px;color:var(--fg);line-height:1.5}
.item p{margin:0;white-space:pre-line}
.item .more{display:inline-block;margin-top:6px;font-weight:700;font-size:14px}
.item .new{display:none;font-size:11px;font-weight:700;color:#fff;background:var(--new);border-radius:4px;padding:0 6px;margin-left:8px;vertical-align:2px}
.item.unread .new{display:inline-block}
.top{font-size:14px}
</style>
</head>
<body>
<main>
<p class="top"><a href="index.html">← ゲーム一覧</a></p>
<a href="index.html" class="mn-brand" style="display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;line-height:1;text-decoration:none;color:inherit;opacity:.85;margin:0 0 10px"><picture><source srcset="logo-dark.svg" media="(prefers-color-scheme: dark)"><img src="logo.svg" alt="" width="30" height="22" style="display:block"></picture>{{SITE_NAME}}</a>
<h1>お知らせ</h1>
<p class="small">運営からのお知らせです。新しいものが上にあります。</p>
{{NEWS}}
</main>
<script>
/* この端末で前に見た日より新しいお知らせに「NEW」を付け、見た日を覚えておく（一覧の「お知らせ」の点が消える） */
(function(){try{var K='mn-news-seen',seen=localStorage.getItem(K)||'',latest='';
document.querySelectorAll('.item').forEach(function(el){var d=el.getAttribute('data-date');if(d>latest)latest=d;if(seen&&d>seen)el.classList.add('unread');});
if(latest)localStorage.setItem(K,latest);}catch(e){}})();
</script>
</body>
</html>
