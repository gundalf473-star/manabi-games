<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>毎日の計算ドリル | {{SITE_NAME}}</title>
<meta name="description" content="毎日5問、日がわりで出る計算ドリル。小4・小5・小6のレベルから選べて、タイムと続けた日数が記録されます。整数・小数・分数・逆算。">
{{GA}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@500&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: 1列。レベル選択と記録 → 問題（式・答えの欄・数字キー）→ 結果 */
:root{
  --bg:#f2f5f9; --surface:#ffffff; --fg:#1d2b3d; --muted:#5d6a7c; --rule:#d6dde7; --ink:#1f3a6e; --accent:#d4432a;
  --ok:#1d8150; --oksoft:#e0f1e6; --ng:#c8352d; --ngsoft:#f8e3e1; --gold:#c98a12; --pick:#e9eef5;
  --display:"Kiwi Maru","Hiragino Maru Gothic ProN",serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10151d; --surface:#18212d; --fg:#e4e9f1; --muted:#9aa6b8; --rule:#2a3546; --ink:#8fb0f0; --accent:#f07a62;
  --ok:#4cc184; --oksoft:#1b3326; --ng:#f07468; --ngsoft:#3a2220; --gold:#e8b54a; --pick:#222c3a; color-scheme:dark}}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:500;font-size:clamp(28px,7vw,38px);line-height:1.2;margin:0;color:var(--ink)}
.lead{margin:4px 0 0;color:var(--muted)}
a{color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gr{border:2px solid var(--rule);background:var(--surface);border-radius:10px;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0}
.gr .nm{font-weight:700;font-size:18px}
.gr .ds{font-size:12px;color:var(--muted);text-align:center;line-height:1.4}
.gr .st{font-size:12px;font-weight:700;color:var(--ok);min-height:18px}
.gr[aria-pressed="true"]{border-color:var(--ink);background:var(--pick)}
.streak{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.streak .n{font-family:var(--display);font-size:40px;line-height:1;color:var(--accent)}
.streak .n small{font-size:16px;color:var(--fg);margin-left:2px}
.streak .s{color:var(--muted);font-size:14px}
.btn{display:inline-block;border:0;border-radius:99px;padding:10px 22px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--surface);text-decoration:none}
.btn.sub{background:var(--pick);color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.top{display:flex;justify-content:space-between;align-items:center;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--rule)}
.dots i.ok{background:var(--ok)} .dots i.ng{background:var(--ng)} .dots i.now{outline:2px solid var(--ink);outline-offset:1px}
.expr{font-size:clamp(22px,6.4vw,30px);font-weight:700;text-align:center;font-variant-numeric:tabular-nums;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
.ans{display:flex;align-items:center;justify-content:center;gap:8px;font-size:24px}
.ans output{min-width:160px;min-height:48px;border:2px solid var(--ink);border-radius:10px;padding:4px 12px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;background:var(--bg)}
.ans output.ok{border-color:var(--ok);background:var(--oksoft)} .ans output.ng{border-color:var(--ng);background:var(--ngsoft)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys button{border:1px solid var(--rule);background:var(--pick);border-radius:10px;min-height:52px;font-size:22px;font-weight:700;cursor:pointer;touch-action:manipulation}
.keys button.go{background:var(--ink);color:var(--surface);font-size:18px}
.keys button:active{filter:brightness(.92)}
.fb{min-height:28px;text-align:center;font-weight:700}
.fb.ok{color:var(--ok)} .fb.ng{color:var(--ng)}
.hint{font-size:13px;color:var(--muted);margin:0;text-align:center}
.big{font-family:var(--display);font-size:44px;line-height:1.1;color:var(--accent);text-align:center}
.list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.list li{border-left:4px solid var(--ok);padding:2px 0 2px 10px;font-variant-numeric:tabular-nums}
.list li.ng{border-color:var(--ng)}
.list small{color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:0}
footer{color:var(--muted);font-size:12px;border-top:1px solid var(--rule);padding-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>毎日の計算ドリル</h1>
    <p class="lead" id="date"></p>
  </header>
  <div id="app"></div>
  <section class="box"><p class="note">毎日5問、日がわりで出ます（同じ日・同じ学年なら同じ問題）。分数は「3/4」、帯分数は「1と3/4」のように入れます。約分していない答えも正解になりますが、約分した形も見ておきましょう。記録はこの端末の中だけにあります。</p></section>
  <footer><a href="index.html">← ゲーム一覧へ</a>　・　<a href="daily.html">今日の1問</a>　・　<a href="parent.html">保護者ページ</a></footer>
</div>
<script>
(function(){
window.mnTitle='毎日の計算ドリル';
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const KEY='mn-drill';
const jst=t=>new Date(t+9*36e5).toISOString().slice(0,10);
const today=jst(Date.now());
const dayNo=k=>Math.round(Date.parse(k)/864e5);
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'{}');return v&&typeof v==='object'?v:{};}catch(e){return {};}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){}}
let D=load(); D.days=D.days||{}; D.g=D.g||{}; D.best=D.best||{};
const [y,m,d]=today.split('-').map(Number), WD='日月火水木金土';
document.getElementById('date').textContent=`${y}年${m}月${d}日（${WD[new Date(Date.UTC(y,m-1,d)).getUTCDay()]}）の5問`;
function streak(){let n=0,k=dayNo(today);if(D.days[today]==null)k--;while(D.days[new Date(k*864e5).toISOString().slice(0,10)]!=null){n++;k--;}return n;}

/* 分数の計算（いつも約分した形で持つ） */
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;};
const fr=(n,d=1)=>{if(d<0){n=-n;d=-d;}const g=gcd(n,d);return [n/g,d/g];};
const add=(a,b)=>fr(a[0]*b[1]+b[0]*a[1],a[1]*b[1]), sub=(a,b)=>fr(a[0]*b[1]-b[0]*a[1],a[1]*b[1]);
const mul=(a,b)=>fr(a[0]*b[0],a[1]*b[1]), div=(a,b)=>fr(a[0]*b[1],a[1]*b[0]);
const eq=(a,b)=>a[0]===b[0]&&a[1]===b[1];
const dec=(s)=>{const [i,f='']=String(s).split('.');return fr(+(i+f),10**f.length);};
const terminating=v=>{let t=v[1];while(t%2===0)t/=2;while(t%5===0)t/=5;return t===1;};
/* 表し方 */
const showF=(v)=>{const [n,dd]=v;if(dd===1)return String(n);if(n>dd){const w=Math.floor(n/dd);return `${w}と${n-w*dd}/${dd}`;}return `${n}/${dd}`;};
const showD=(v)=>{const s=(v[0]/v[1]).toFixed(6).replace(/0+$/,'').replace(/\.$/,'');return s;};
const showA=(v,kind)=>kind==='d'&&terminating(v)?showD(v):showF(v);
/* 入力を読む */
function parse(s){s=s.trim();let m;
  if((m=s.match(/^(\d+)と(\d+)\/(\d+)$/))&&+m[3]>0)return add(fr(+m[1]),fr(+m[2],+m[3]));
  if((m=s.match(/^(\d+)\/(\d+)$/))&&+m[2]>0)return fr(+m[1],+m[2]);
  if(/^\d+(\.\d+)?$/.test(s))return dec(s);
  if(/^\.\d+$/.test(s))return dec('0'+s);
  return null;}

/* 日付と学年で決まる乱数 */
function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return (h>>>0)/4294967296;};}
let R=Math.random;
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const pk=a=>a[Math.floor(R()*a.length)];
const dstr=(n,p)=>showD(fr(n,10**p)); /* 整数n を 10のp乗でわった小数で（44.0 は 44 と書く） */
const F=v=>showF(v);

/* 問題を作る。q：式（文字）、v：答え、k：答えの表し方（'d'なら小数で見せる） */
const rc=n=>{let k;do k=ri(1,n-1);while(gcd(k,n)!==1);return k;}; /* 分母と約分できない分子 */
const G={
 '4':[
  ()=>{const a=ri(12,39),b=ri(11,29);return {q:`${a} × ${b}`,v:fr(a*b)};},
  ()=>{const b=ri(3,9),c=ri(102,999/b|0);return {q:`${b*c} ÷ ${b}`,v:fr(c)};},
  ()=>{const b=ri(2,9),c=ri(2,9),a=ri(b*c+1,99);const t=pk([0,1]);
     return t?{q:`${a} − ${b} × ${c}`,v:fr(a-b*c)}:{q:`${a} ＋ ${b*c} ÷ ${b}`,v:fr(a+c)};},
  ()=>{const a=ri(3,9),b=ri(2,12),c=ri(2,9);return {q:`（${b} ＋ ${c}） × ${a}`,v:fr((b+c)*a)};},
  ()=>{const p=pk([1,2]),a=ri(11,999),b=ri(11,999);const t=pk([0,1]);
     if(t){const [x,y]=a>=b?[a,b]:[b,a];return {q:`${dstr(x,p)} − ${dstr(y,p)}`,v:fr(x-y,10**p),k:'d'};}
     return {q:`${dstr(a,p)} ＋ ${dstr(b,p)}`,v:fr(a+b,10**p),k:'d'};},
  ()=>{const dd=pk([5,7,8,9,10,12]),a=rc(dd),b=rc(dd);const t=pk([0,1]);
     if(t){const [x,y]=a>=b?[a,b]:[b,a];const w=ri(1,3);return {q:`${w}と${x}/${dd} − ${y}/${dd}`.replace('と0/','と'),v:sub(fr(w*dd+x,dd),fr(y,dd))};}
     return {q:`${a}/${dd} ＋ ${b}/${dd}`,v:fr(a+b,dd)};},
 ],
 '5':[
  ()=>{const a=ri(12,99),b=ri(2,49);return {q:`${dstr(a,1)} × ${dstr(b,1)}`,v:fr(a*b,100),k:'d'};},
  ()=>{const b=ri(2,9),c=ri(12,99);return {q:`${dstr(b*c,2)} ÷ ${dstr(b,1)}`,v:fr(c,10),k:'d'};},
  ()=>{const ds=[[2,3],[3,4],[4,6],[2,5],[3,5],[4,5],[6,8],[5,6],[3,8],[6,9],[4,10],[8,12]];const [p,q]=pk(ds);const a=rc(p),b=rc(q);
     const A=fr(a,p),B=fr(b,q);const t=pk([0,1]);
     if(t&&A[0]*B[1]!==B[0]*A[1]){const [x,y,xs,ys]=A[0]*B[1]>B[0]*A[1]?[A,B,`${a}/${p}`,`${b}/${q}`]:[B,A,`${b}/${q}`,`${a}/${p}`];return {q:`${xs} − ${ys}`,v:sub(x,y)};}
     return {q:`${a}/${p} ＋ ${b}/${q}`,v:add(A,B)};},
  ()=>{const p=pk([3,4,6,8,9]),a=rc(p),w=ri(1,3),c=pk([2,3,4,6]);return {q:`${w}と${a}/${p} × ${c}`,v:mul(fr(w*p+a,p),fr(c))};},
  ()=>{const a=ri(2,9),b=ri(2,9),c=ri(11,49);return {q:`${dstr(c,1)} ＋ ${a} × ${showD(fr(b*5,10))}`,v:add(fr(c,10),fr(a*b*5,10)),k:'d'};},
  ()=>{const p=pk([2,3,4,5]),q=pk([3,4,6]),a=rc(p),b=rc(q),w=ri(2,4);const A=add(fr(w),fr(a,p)),B=fr(b,q);return {q:`${w}と${a}/${p} − 1と${b}/${q}`,v:sub(A,add(fr(1),B))};},
 ],
 '6':[
  ()=>{const a=ri(1,8),b=ri(a+1,9),c=ri(1,8),dd=ri(c+1,9);return {q:`${F(fr(a,b))} × ${F(fr(c,dd))}`,v:mul(fr(a,b),fr(c,dd))};},
  ()=>{const a=ri(1,8),b=ri(a+1,9),c=ri(1,8),dd=ri(c+1,9);return {q:`${F(fr(a,b))} ÷ ${F(fr(c,dd))}`,v:div(fr(a,b),fr(c,dd))};},
  ()=>{const ds=[['0.5',fr(1,2)],['0.25',fr(1,4)],['0.75',fr(3,4)],['1.5',fr(3,2)],['0.2',fr(1,5)],['1.25',fr(5,4)],['0.4',fr(2,5)]];const [s,v]=pk(ds);
     const b=pk([3,6,8,9,12]),a=rc(b);const t=pk([0,1,2]);
     return t===0?{q:`${s} × ${F(fr(a,b))}`,v:mul(v,fr(a,b))}:t===1?{q:`${F(fr(a,b))} ÷ ${s}`,v:div(fr(a,b),v)}:{q:`${s} ＋ ${F(fr(a,b))}`,v:add(v,fr(a,b))};},
  ()=>{const x=ri(2,15),a=ri(2,9),b=ri(1,Math.min(20,x*a-1));const t=pk([0,1,2]);
     return t===0?{q:`（□ ＋ ${b}） × ${a} ＝ ${(x+b)*a}`,v:fr(x),box:1}:t===1?{q:`□ × ${a} − ${b} ＝ ${x*a-b}`,v:fr(x),box:1}:{q:`${x*a+b} − □ × ${a} ＝ ${b}`,v:fr(x),box:1};},
  ()=>{const p=pk([2,3,4,5,6]),a=rc(p),q=pk([2,3,4,5]),b=rc(q);const X=fr(a,p),B=fr(b,q);const t=pk([0,1]);
     return t?{q:`□ ＋ ${F(B)} ＝ ${F(add(X,B))}`,v:X,box:1}:{q:`□ × ${F(B)} ＝ ${F(mul(X,B))}`,v:X,box:1};},
  ()=>{const a=ri(1,5),b=pk([2,3,4,6]),c=ri(1,5),dd=pk([3,4,5,6]),e=pk([2,3,4]);const A=fr(a,b),C=fr(c,dd);
     return {q:`${F(A)} ＋ ${F(C)} × ${e}`,v:add(A,mul(C,fr(e)))};},
 ]};
const GL={'4':['小4','整数・小数・同じ分母の分数'],'5':['小5','小数のかけ算わり算・分母のちがう分数'],'6':['小6','分数のかけ算わり算・逆算']};
function makeSet(g,seed){R=seed?rng(seed):Math.random;const fs=G[g].slice();const out=[];const seen=new Set();
  /* 5問：ちがう種類からえらぶ */
  for(let i=fs.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[fs[i],fs[j]]=[fs[j],fs[i]];}
  for(let i=0;out.length<5&&i<50;i++){const p=fs[i%fs.length]();if(p.v[0]<=0||seen.has(p.q))continue;seen.add(p.q);out.push(p);}
  R=Math.random;return out;}

const app=document.getElementById('app');
let grade=D.grade||'5';
let S=null,timer=null;
function home(){
  const n=streak();
  app.innerHTML=`<section class="box"><div class="streak"><span class="n">${n}<small>日連続</small></span><span class="s">${D.days[today]!=null?'今日の5問はおわりました。':'今日の5問にちょうせんしよう。'}</span></div>
    <div class="grades">${Object.entries(GL).map(([k,[nm,ds]])=>{const r=D.g[today+'-'+k];return `<button class="gr" data-g="${k}" aria-pressed="${k===grade}"><span class="nm">${nm}</span><span class="ds">${ds}</span><span class="st">${r?`今日 ${r[0]}/5・${r[1]}秒`:D.best[k]?`ベスト ${D.best[k]}秒`:''}</span></button>`;}).join('')}</div>
    <div class="row"><button class="btn" id="go">${D.g[today+'-'+grade]?'もう一度とく（記録は1回目）':'スタート'}</button><button class="btn sub" id="more">べつの5問で練習</button></div></section>`;
  app.querySelectorAll('.gr').forEach(b=>b.onclick=()=>{grade=b.dataset.g;D.grade=grade;save();home();});
  document.getElementById('go').onclick=()=>start(makeSet(grade,today+'#'+grade),true);
  document.getElementById('more').onclick=()=>start(makeSet(grade,null),false);
}
function start(set,daily){
  S={set,daily,i:0,res:[],t0:Date.now(),inp:''};track('drill_start',{grade,daily});draw();
  clearInterval(timer);timer=setInterval(()=>{const e=document.getElementById('tm');if(e)e.textContent=sec()+'秒';},500);
}
const sec=()=>Math.round((Date.now()-S.t0)/1000);
function draw(){
  const p=S.set[S.i];
  app.innerHTML=`<section class="box"><div class="top"><span>${GL[grade][0]}　${S.i+1} / 5</span><div class="dots">${S.set.map((_,j)=>`<i class="${j<S.i?(S.res[j].ok?'ok':'ng'):j===S.i?'now':''}"></i>`).join('')}</div><span id="tm">${sec()}秒</span></div>
    <div class="expr">${p.box?p.q:p.q+' ＝'}</div>
    <div class="ans">${p.box?'□ ＝':''}<output id="out" aria-live="polite">${S.inp||'&nbsp;'}</output></div>
    <div class="fb" id="fb"></div>
    <div class="keys">${['7','8','9','⌫','4','5','6','/','1','2','3','と','0','.','C','OK'].map(k=>`<button data-k="${k}" class="${k==='OK'?'go':''}" aria-label="${k==='⌫'?'1文字けす':k==='C'?'ぜんぶけす':k}">${k==="OK"?"答える":k}</button>`).join('')}</div>
    <p class="hint">${p.k==='d'?'小数で答えましょう':'分数は 3/4、帯分数は 1と3/4 のように入れます'}</p></section>`;
  app.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>key(b.dataset.k));
}
function key(k){
  if(S.lock)return;
  if(k==='OK')return answer();
  if(k==='⌫')S.inp=S.inp.slice(0,-1);else if(k==='C')S.inp='';else if(S.inp.length<12)S.inp+=k;
  document.getElementById('out').innerHTML=S.inp||'&nbsp;';
}
document.addEventListener('keydown',e=>{if(!S||!document.getElementById('out'))return;
  if(/^[0-9./]$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('⌫');else if(e.key==='Enter')key('OK');else if(e.key==='t'||e.key==='と')key('と');});
function answer(){
  const p=S.set[S.i], v=parse(S.inp), out=document.getElementById('out'), fb=document.getElementById('fb');
  if(!v){fb.className='fb ng';fb.textContent='数の形で入れてね（例：12、0.5、3/4、1と1/2）';return;}
  const ok=eq(v,p.v), A=showA(p.v,p.k);
  S.res.push({q:p.q,box:p.box,a:A,inp:S.inp,ok});S.lock=true;
  out.className=ok?'ok':'ng';fb.className='fb '+(ok?'ok':'ng');
  fb.textContent=ok?(S.inp.replace(/\s/g,'')!==A&&S.inp!==showF(p.v)?`せいかい！（${A} とも書けます）`:'せいかい！'):`ざんねん。答えは ${A}`;
  setTimeout(()=>{S.lock=false;S.inp='';S.i++;if(S.i<5)draw();else done();},ok?700:1800);
}
function done(){
  clearInterval(timer);const t=sec(),sc=S.res.filter(r=>r.ok).length;let note='';
  if(S.daily){const k=today+'-'+grade;
    if(!D.g[k]){D.g[k]=[sc,t];if(D.days[today]==null)D.days[today]=t;
      if(sc===5&&(D.best[grade]==null||t<D.best[grade])){D.best[grade]=t;note='ベスト記録です！';}save();}
    else note='（今日の記録は1回目のものです）';}
  track('drill_done',{grade,daily:S.daily,score:sc,sec:t});
  app.innerHTML=`<section class="box"><div class="big">${sc} / 5</div><p style="text-align:center;margin:0;font-weight:700">タイム ${t}秒　${note}</p>
    <ul class="list">${S.res.map(r=>`<li class="${r.ok?'':'ng'}">${r.box?r.q:r.q+' ＝ '+r.a}${r.box?`　□＝${r.a}`:''}${r.ok?'':`<br><small>あなたの答え：${r.inp}</small>`}</li>`).join('')}</ul>
    <div class="row"><button class="btn" id="back">もどる</button><button class="btn sub" id="again">べつの5問で練習</button><a class="btn sub" href="games/sansu/gyakusan.html">計算と逆算クイズへ</a></div></section>`;
  document.getElementById('back').onclick=()=>{S=null;home();};
  document.getElementById('again').onclick=()=>start(makeSet(grade,null),false);
}
home();
})();
</script>
</body>
</html>
