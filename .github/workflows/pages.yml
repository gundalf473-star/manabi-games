name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: find
        name: Find site folder
        run: |
          f=$(find . -path ./node_modules -prune -o -path '*/scripts/build.mjs' -print | head -1)
          if [ -z "$f" ]; then echo "scripts/build.mjs was not found. Please upload the scripts folder."; ls -R | head -50; exit 1; fi
          root=$(dirname "$(dirname "$f")")
          echo "site folder: $root"
          echo "root=$root" >> "$GITHUB_OUTPUT"
      - name: Build
        run: node "${{ steps.find.outputs.root }}/scripts/build.mjs"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.find.outputs.root }}/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
