async function decrypt(pass){
  const p=JSON.parse(document.getElementById('data').textContent);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(pass)),'PBKDF2',false,['deriveKey']);

function lockScreen(msg){
  app.innerHTML=`<section class="box">
    <h2 class="h2">合言葉を入れてください</h2>
    <p class="note" style="font-size:14px">ご購入時にお知らせした合言葉を入れると、全${'173'}問で遊べます。一度入れれば、この端末では次から入力はいりません。</p>
    <form id="f" class="lock" autocomplete="off" style="display:flex;flex-direction:column;gap:12px">
      <label for="pass" style="font-weight:700">合言葉</label>
      <input id="pass" name="pass" inputmode="latin" autocapitalize="off" spellcheck="false" placeholder="例：kanji-xxxx-xxxx">
      <p class="err" id="err" role="alert">${msg||''}</p>
      <div class="row" style="justify-content:flex-start"><button class="btn go" id="open" type="submit">ひらく</button></div>
    </form>
    <div class="shop">合言葉をお持ちでない方へ：${shopUrl?`<a href="${esc(shopUrl)}" target="_blank" rel="noopener">こちらから購入できます</a>`:'販売ページは準備中です。'}<br>無料版（40問）は <a href="yojikanji.html">四字熟語 漢字えらび</a> で遊べます。</div>
  </section>`;
  document.getElementById('f').onsubmit=async e=>{
    e.preventDefault();
    const v=document.getElementById('pass').value; if(!norm(v)){document.getElementById('err').textContent='合言葉を入れてください。';return;}
    const b=document.getElementById('open'); b.disabled=true; b.textContent='確かめています…';
    try{ W=await decrypt(v); store.set(PREFIX+'-pass',v); track('unlock',{product:'yojikanji'}); home(); }
    catch(err){ b.disabled=false; b.textContent='ひらく'; document.getElementById('err').textContent='合言葉がちがいます。全角・半角や、つづりを確かめてもう一度入れてください。'; }
  };
}

let rec=store.get(PREFIX+'-rec',{});
const saveRec=()=>store.set(PREFIX+'-rec',rec);
const state=w=>{const r=rec[w[0]];if(!r)return 'new';if(r[0]>=2&&r[0]>r[1])return 'master';if(r[1]>0)return 'weak';return 'try';};
const THEMES={all:['ぜんぶ',w=>true],lv1:['基本',w=>w[4]===1],lv2:['標準',w=>w[4]===2],lv3:['発展',w=>w[4]===3],
  ...(PAID?{weak:['にがて',w=>state(w)==='weak'],fresh:['まだやっていない',w=>state(w)==='new']}:{})};
const MODES={normal:['じっくり','時間を気にせず、1問ずつ考えて答える。'],speed:['スピード','1問10秒。時間内に正しい字を見ぬこう。']};
let theme='all', G=null, best=store.get(PREFIX+'-best',{}), timer=null;
const PAIDLINK=`<a class="paid" href="yojikanji-full.html" id="paid-link"><span class="pt">もっと練習したい人へ　<b>四字熟語 漢字えらび（有料版）</b></span><span class="pd">入試で出やすい「書きまちがい」を173問。苦手な問題だけの復習と、覚えた熟語の記録つき。</span></a>`;

function home(){
  G=null; clearInterval(timer);
  const pool=W.filter(THEMES[theme][1]);
  let recHTML='';
  if(PAID){
    const cnt={master:0,weak:0,new:0,try:0}; W.forEach(w=>cnt[state(w)]++);
    recHTML=`<div class="master"><div class="top"><span class="h2">覚えた熟語</span><span class="cnt">${cnt.master}<small> / ${W.length}問</small></span></div>
      <div class="mbar" aria-hidden="true"><i class="m" style="width:${cnt.master/W.length*100}%"></i><i class="w" style="width:${cnt.weak/W.length*100}%"></i></div>
      <div class="mleg"><span style="--c:var(--ok)">覚えた ${cnt.master}</span><span style="--c:var(--gold)">にがて ${cnt.weak}</span><span style="--c:var(--rule)">まだ ${cnt.new}</span></div></div>`;
  }
  app.innerHTML=`<section class="box">${recHTML}
    <div><div class="h2" style="margin-bottom:8px">レベル</div>
      <div class="chips">${Object.entries(THEMES).map(([k,[nm,f]])=>{const n=W.filter(f).length;return `<button class="chip" id="th-${k}" data-t="${k}" aria-pressed="${k===theme}" ${n?'':'disabled'}>${nm}（${n}）</button>`;}).join('')}</div></div>
    <div><div class="h2" style="margin-bottom:8px">あそびかた</div>
      <div class="modes">${Object.entries(MODES).map(([k,[nm,ds]])=>`<button class="mode" id="mode-${k}" data-m="${k}" ${pool.length?'':'disabled'}><span class="nm">${nm}</span><span class="ds">${ds}</span><span class="best">${best[k+'-'+theme]!=null?`ベスト ${best[k+'-'+theme]}/${Math.min(ROUND,pool.length)}`:''}</span></button>`).join('')}</div></div>
    <p class="note">四字熟語の中の1字が空らんになっています。読みと意味をヒントに、まぎらわしい4つの漢字から正しい字をえらぼう。</p>
    ${PAID?'<div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>':PAIDLINK}
  </section>`;
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{theme=b.dataset.t;home();});
  app.querySelectorAll('.mode').forEach(b=>b.onclick=()=>start(b.dataset.m));
  const rs=document.getElementById('reset');
  if(rs)rs.onclick=()=>{
    document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
    document.getElementById('yes').onclick=()=>{rec={};saveRec();home();};
    document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
  };
}
function start(mode,list){
  const pool=W.filter(THEMES[theme][1]);
  const qs=(list||shuffle(pool).slice(0,ROUND)).map(w=>({w,ch:shuffle([w[0][w[1]],...w[2]])}));
  G={mode,qs,i:0,score:0,combo:0,maxCombo:0,miss:[],done:false,newly:[],retry:!!list};
  track('level_start',{level_name:`${PREFIX}-${mode}-${theme}`});
  show();
}
const sheet=(w,fill,cls)=>`<div class="sheet" aria-label="四字熟語">${[...w[0]].map((c,i)=>i===w[1]?`<div class="sq ${fill?cls:'q'}">${fill?esc(fill):'？'}</div>`:`<div class="sq">${esc(c)}</div>`).join('')}</div>`;
function show(){
  const it=G.qs[G.i], w=it.w;
  app.innerHTML=`<section class="box">
    <div class="bar"><div class="prog" aria-hidden="true"><i style="width:${G.i/G.qs.length*100}%"></i></div>
      <span class="nums">${G.i+1} / ${G.qs.length}</span>${G.combo>=2?`<span class="combo">${G.combo}連続</span>`:''}${G.mode==='speed'?`<span class="timer" id="tm">${LIMIT}秒</span>`:''}</div>
    <div id="sheet">${sheet(w)}</div>
    <div class="yomi">${esc(w[5])}</div>
    <div class="meaning"><div class="lab">意味</div><p>${esc(w[6])}</p></div>
    <div class="kch">${it.ch.map((c,j)=>`<button class="kc" id="kc${j}" data-j="${j}">${esc(c)}</button>`).join('')}</div>
    <div id="after"></div></section>`;
  app.querySelectorAll('.kc').forEach(b=>b.onclick=()=>judge(+b.dataset.j));
  if(G.mode==='speed'){
    let t=LIMIT; clearInterval(timer);
    timer=setInterval(()=>{t--; const el=document.getElementById('tm'); if(el)el.textContent=t+'秒'; if(t<=0){clearInterval(timer);judge(-1);}},1000);
  }
}
function judge(j){
  if(G.done)return; G.done=true; clearInterval(timer);
  const it=G.qs[G.i], w=it.w, right=w[0][w[1]], ok=j>=0&&it.ch[j]===right, before=PAID?state(w):null;
  app.querySelectorAll('.kc').forEach((b,k)=>{b.disabled=true; if(it.ch[k]===right)b.classList.add('right'); else if(k===j)b.classList.add('wrong'); else b.classList.add('dim');});
  document.getElementById('sheet').innerHTML=sheet(w,right,ok?'ok':'ng');
  let nowMaster=false;
  if(PAID){const r=rec[w[0]]||[0,0]; r[ok?0:1]++; rec[w[0]]=r; saveRec(); nowMaster=state(w)==='master'&&before!=='master'; if(nowMaster)G.newly.push(w);}
  if(ok){G.score++;G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);}else{G.combo=0;G.miss.push(w);}
  track('answer_question',{category:`${PREFIX}-${G.mode}`,question:w[0],correct:ok,picked:j>=0?it.ch[j]:'timeout'});
  const last=G.i===G.qs.length-1;
  document.getElementById('after').innerHTML=`<div class="verdict ${ok?'ok':'ng'}">${ok?'正解！':j<0?'時間切れ':'ざんねん'}${nowMaster?'<span class="newmark">覚えた！</span>':''}</div>
    <div class="exp"><b>${esc(w[0])}</b>（${esc(w[5])}）<div class="point">${esc(w[3])}${!ok&&j>=0?`<br>えらんだ「${esc(it.ch[j])}」は、この熟語では使いません。`:''}</div></div>
    <div class="row"><button class="btn go" id="next">${last?'結果を見る':'次の問題へ'}</button></div>`;
  const nx=document.getElementById('next'); nx.onclick=next; nx.focus({preventScroll:true});
}
function next(){ G.done=false; if(++G.i<G.qs.length)show(); else result(); }
function result(){
  const n=G.qs.length,s=G.score,r=s/n;
  const rank=r===1?'満点':r>=.8?'特選':r>=.6?'入選':r>=.4?'佳作':'もう一歩';
  const k=G.mode+'-'+theme; let isNew=false;
  if(!G.retry&&(best[k]==null||s>best[k])){best[k]=s;store.set(PREFIX+'-best',best);isNew=true;}
  track('level_end',{level_name:`${PREFIX}-${G.mode}-${theme}`,success:s===n,score:s,total:n});
  const m=PAID?W.filter(w=>state(w)==='master').length:0;
  app.innerHTML=`<section class="box">
    <h2 class="h2">${MODES[G.mode][0]}・${THEMES[theme][0]}の結果</h2>
    <div class="score"><div class="big">${s}<small> / ${n}問</small></div><div class="seal">${rank}</div></div>
    <p style="margin:0">${PAID?`${G.newly.length?`新しく${G.newly.length}語を覚えました。`:''}覚えた熟語は ${m} / ${W.length}問です。`:(r===1?'全問正解！書きまちがいに強いですね。':r>=.6?'よくできました。まちがえた字は、意味といっしょに覚えよう。':'1字1字の意味を考えると、正しい字が選びやすくなります。')}${G.maxCombo>=3?`　最高${G.maxCombo}連続正解！`:''}${isNew&&s>0?'　自己ベスト更新！':''}</p>
    <div class="row" style="justify-content:flex-start"><button class="btn go" id="again">もう一度</button>${G.miss.length?'<button class="btn" id="retry">まちがえた問題だけ</button>':''}<button class="btn" id="home">はじめにもどる</button></div>
    ${PAID?'':PAIDLINK}
    ${G.miss.length?`<div class="h2" style="font-size:17px">おぼえておこう</div><div class="review">${G.miss.map(w=>`<div class="rv"><span class="w">${esc(w[0])}</span>　<span class="note">${esc(w[5])}</span><div>${esc(w[3])}</div></div>`).join('')}</div>`:''}
  </section>`;
  document.getElementById('again').onclick=()=>start(G.mode);
  document.getElementById('home').onclick=home;
  const rt=document.getElementById('retry'); if(rt)rt.onclick=()=>start(G.mode,shuffle(G.miss));
}
document.addEventListener('keydown',e=>{
  if(!G||G.done)return;
  const k={'1':0,'2':1,'3':2,'4':3}[e.key]; if(k!=null)judge(k);
});
(async()=>{
  if(!PAID){ W=JSON.parse(document.getElementById('data').textContent); home(); return; }
  try{const d=await (await fetch('../games.json',{cache:'no-cache'})).json(); shopUrl=(d.site&&d.site.shopUrl)||'';}catch(e){}
  const saved=store.get(PREFIX+'-pass','');
  if(saved){ try{ W=await decrypt(saved); home(); return; }catch(e){ store.set(PREFIX+'-pass',''); lockScreen('合言葉が変わりました。新しい合言葉を入れてください。'); return; } }
  lockScreen();
})();
})();
</script>
