<script>/* 間をあけた解き直し：まちがえた問題を 1日後・3日後・7日後・14日後 にもう一度出す（この端末だけに保存） */
(function(){var K='mn-review',IV=[1,3,7,14];
function day(){var d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5);}
function ld(){try{return JSON.parse(localStorage.getItem(K))||{};}catch(e){return {};}}
function sv(o){try{localStorage.setItem(K,JSON.stringify(o));}catch(e){}}
window.mnReview={
 mark:function(g,k,ok){var o=ld(),m=o[g]||(o[g]={}),r=m[k],t=day();
  if(!ok){m[k]={s:0,d:t+IV[0]};}
  else if(r&&r.d<=t){var s=r.s+1;if(s>=IV.length)delete m[k];else m[k]={s:s,d:t+IV[s]};}
  else return;
  if(!Object.keys(m).length)delete o[g];sv(o);},
 isDue:function(g,k){var r=(ld()[g]||{})[k];return !!r&&r.d<=day();},
 due:function(g){var m=ld()[g]||{},t=day(),n=0;for(var k in m)if(m[k].d<=t)n++;return n;}
};})();</script>
