<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>料金プラン | {{SITE_NAME}}</title>
<meta name="description" content="{{SITE_NAME}}の有料版の料金プラン。教科と利用期間をえらんで買う、自動更新なしのプランです。">
{{GA}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@500&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: 1列。教科の札 → 期間の札（値段つき）→ 最終確認の表 → 支払いへ。支払いのあとは利用コードを大きく表示 */
:root{
  --bg:#f2f5f9; --surface:#ffffff; --fg:#1d2b3d; --muted:#5d6a7c; --rule:#d6dde7; --ink:#1f3a6e; --accent:#d4432a; --accentsoft:#fbe7e2;
  --ok:#1d8150; --oksoft:#e0f1e6; --ng:#c8352d; --gold:#a97c12; --pick:#e9eef5;
  --display:"Kiwi Maru","Hiragino Maru Gothic ProN",serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10151d; --surface:#18212d; --fg:#e4e9f1; --muted:#9aa6b8; --rule:#2a3546; --ink:#8fb0f0; --accent:#f07a62; --accentsoft:#3a241f;
  --ok:#4cc184; --oksoft:#1b3326; --ng:#f07468; --gold:#e1b44a; --pick:#222c3a; color-scheme:dark}}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:500;font-size:clamp(28px,7vw,40px);line-height:1.2;margin:0;color:var(--ink)}
h2{font-family:var(--display);font-weight:500;font-size:20px;margin:0;color:var(--ink)}
.lead{margin:6px 0 0;color:var(--muted)}
a{color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.label{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--accent)}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.opts.five{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:560px){.opts,.opts.five{grid-template-columns:1fr 1fr}}
.opt{border:2px solid var(--rule);background:var(--surface);border-radius:10px;padding:12px 10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.opt:hover{border-color:var(--ink)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accentsoft)}
.opt .nm{font-weight:700;font-size:17px}
.opt .ds{font-size:12px;color:var(--muted);line-height:1.5}
.opt .pr{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;color:var(--fg)}
.opt .pr small{font-size:12px;font-family:var(--body);color:var(--muted)}
.games{font-size:13px;color:var(--muted);margin:0}
table.conf{border-collapse:collapse;width:100%;font-size:15px}
table.conf th{text-align:left;color:var(--muted);font-weight:700;padding:6px 12px 6px 0;vertical-align:top;white-space:nowrap;width:1%}
table.conf td{padding:6px 0;border-bottom:1px solid var(--rule)}
table.conf th{border-bottom:1px solid var(--rule)}
.total{font-family:var(--display);font-size:28px;color:var(--accent)}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.agree input{width:20px;height:20px;margin-top:3px;flex:none}
.btn{border:0;border-radius:8px;padding:12px 22px;font-weight:700;cursor:pointer;background:var(--fg);color:var(--surface);font-size:17px}
.btn:disabled{opacity:.4;cursor:default}
.btn.sub{background:var(--pick);color:var(--fg);font-size:15px;padding:10px 16px}
.note{font-size:13px;color:var(--muted);margin:0}
.err{color:var(--ng);font-weight:700;margin:0}
.test{background:#fff4d6;color:#6b4e00;border-radius:8px;padding:10px 14px;font-size:14px;font-weight:700}
@media (prefers-color-scheme:dark){.test{background:#3a3016;color:#f0d68a}}
.code{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:clamp(22px,6vw,32px);font-weight:700;letter-spacing:.06em;background:var(--pick);border-radius:8px;padding:12px 16px;text-align:center;user-select:all;overflow-wrap:anywhere}
.done{border:2px solid var(--ok)}
.compare{font-size:14px;width:100%;border-collapse:collapse}
.compare th,.compare td{padding:6px 8px;white-space:nowrap;border-bottom:1px solid var(--rule);text-align:right;font-variant-numeric:tabular-nums}
.compare th:first-child,.compare td:first-child{text-align:left}
.compare thead th{color:var(--muted);font-size:12px}
footer{color:var(--muted);font-size:12px;border-top:1px solid var(--rule);padding-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>料金プラン</h1>
    <p class="lead">有料版は、<b>教科</b>と<b>利用期間</b>をえらんで買う「買い切り」です。自動更新はありません。期間が終わると、自動的に使えなくなります。</p>
  </header>
  <div id="app" style="display:flex;flex-direction:column;gap:18px"><p class="note">読みこんでいます…</p></div>
  <footer><a href="index.html">ゲーム一覧</a>　・　<a href="plan.html">利用中のプラン・利用コードの入力</a>　・　<a href="tokushoho.html">特定商取引法に基づく表記</a>　・　<a href="contact.html">お問い合わせ</a>　・　<a href="privacy.html">プライバシーポリシー</a></footer>
</div>
{{ACCESS}}
<script>
(function(){
const A=window.mnAccess, app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yen=n=>n.toLocaleString('ja-JP')+'円';
const q=new URLSearchParams(location.search);
// サーバーが使えないとき（準備中）に見せる料金表。値段はサーバー（server/worker.js）の PRICES が正です
const FALLBACK={subjects:{kokugo:'国語',sansu:'算数',rika:'理科',shakai:'社会',shikou:'思考力',all:'全教科'},periods:{d1:'1日',w1:'1週間',m1:'1ヵ月（30日）',y1:'1年（365日）'},
  prices:{kokugo:{d1:1000,w1:2000,m1:4000,y1:20000},sansu:{d1:1000,w1:2000,m1:4000,y1:20000},rika:{d1:1000,w1:2000,m1:4000,y1:20000},shakai:{d1:1000,w1:2000,m1:4000,y1:20000},shikou:{d1:1000,w1:2000,m1:4000,y1:20000},all:{d1:2000,w1:4000,m1:8000,y1:40000}},maxDevices:3,test:false};
let PL=null, GAMES=[], sel={s:['kokugo','sansu','rika','shakai','all'].includes(q.get('s'))?q.get('s'):'all',p:'m1'}, agreed=false;
const SUBJ_JA={kokugo:'国語',sansu:'算数',rika:'理科',shakai:'社会',shikou:'思考力'};

async function boot(){
  try{ const d=await (await fetch('games.json',{cache:'no-cache'})).json(); GAMES=d.games.filter(g=>g.paid); }catch(e){}
  if(q.get('session_id')) return thanks(q.get('session_id'));
  try{ PL=await A.call('/api/plans'); }catch(e){ PL=null; }
  render();
}
function gamesOf(s){ return GAMES.filter(g=>s==='all'||g.subject===SUBJ_JA[s]); }
function render(){
  const P=PL||FALLBACK, ready=!!PL, price=P.prices[sel.s][sel.p];
  const single=P.prices.kokugo[sel.p];
  app.innerHTML=`
    ${q.get('canceled')?'<div class="box"><p class="err" style="margin:0">支払いは完了していません。もう一度えらび直すことができます。</p></div>':''}
    ${ready&&P.test?'<div class="test">テストモード：本物のお金は動きません。カード番号 4242 4242 4242 4242（期限は未来の日付、ほかは何でも可）で試せます。</div>':''}
    ${ready?'':'<div class="box"><p class="err" style="margin:0">有料版の販売は準備中です。料金表だけご覧いただけます。</p></div>'}
    <section class="box"><div class="label">1. 教科をえらぶ</div>
      <div class="opts five">${Object.entries(P.subjects).map(([k,v])=>`<button class="opt" data-s="${k}" aria-pressed="${k===sel.s}"><span class="nm">${esc(v)}</span><span class="ds">${k==='all'?'国語・算数・理科・社会・思考力のすべて':'有料版 '+gamesOf(k).length+'本'}</span></button>`).join('')}</div>
      <p class="games">${sel.s==='all'?'すべての有料版':esc(P.subjects[sel.s])+'の有料版'}（${gamesOf(sel.s).length}本）：${gamesOf(sel.s).map(g=>esc(g.title)).join('、')||'—'}</p>
      ${sel.s==='all'?'<p class="note">全教科は、2教科分の値段で5教科（国語・算数・理科・社会・思考力）すべてが使えます。</p>':''}
    </section>
    <section class="box"><div class="label">2. 利用期間をえらぶ</div>
      <div class="opts">${Object.entries(P.periods).map(([k,v])=>`<button class="opt" data-p="${k}" aria-pressed="${k===sel.p}"><span class="nm">${esc(v)}</span><span class="pr">${yen(P.prices[sel.s][k])}<small>（税込）</small></span></button>`).join('')}</div>
      <p class="note">利用期間は、<b>はじめて利用コードを入れたとき</b>から始まります。購入から180日以内に使い始めてください。</p>
    </section>
    <section class="box"><div class="label">3. 内容を確かめる</div>
      <table class="conf">
        <tr><th>商品</th><td>${esc(document.title.split('|').pop().trim())} 有料版（${esc(P.subjects[sel.s])}）</td></tr>
        <tr><th>使えるゲーム</th><td>${sel.s==='all'?'すべての教科の有料版':esc(P.subjects[sel.s])+'の有料版すべて'}（${gamesOf(sel.s).length}本）。期間中に追加された有料版も使えます。</td></tr>
        <tr><th>利用期間</th><td>${esc(P.periods[sel.p])}。はじめて利用コードを入れたときから数えます。</td></tr>
        <tr><th>値段</th><td><span class="total">${yen(price)}</span>（税込）</td></tr>
        <tr><th>自動更新</th><td>ありません。期間が終わったら自動的に使えなくなり、追加の支払いは発生しません。</td></tr>
        <tr><th>支払い方法・時期</th><td>クレジットカードなど（Stripeの決済画面）。注文のときにお支払いいただきます。</td></tr>
        <tr><th>お渡し</th><td>支払いが終わるとすぐ、画面に利用コードを表示します。</td></tr>
        <tr><th>使える端末</th><td>1つの利用コードで${P.maxDevices}台まで</td></tr>
        <tr><th>キャンセル・返金</th><td>デジタルコンテンツのため、購入後のキャンセル・返金はできません。ただし、こちらの不具合で使えない場合は対応します。くわしくは<a href="tokushoho.html" target="_blank">特定商取引法に基づく表記</a>をご覧ください。</td></tr>
      </table>
      <label class="agree"><input type="checkbox" id="agree" ${agreed?'checked':''} ${ready?'':'disabled'}><span>上の内容と、<a href="tokushoho.html" target="_blank">特定商取引法に基づく表記</a>を確認しました。</span></label>
      <div><button class="btn" id="pay" ${ready&&agreed?'':'disabled'}>${yen(price)}を支払う</button></div>
      <p class="err" id="err" role="alert"></p>
      <p class="note">「支払う」を押すと、決済サービス Stripe の画面に移ります。カード番号はStripeが管理し、当サイトには届きません。</p>
    </section>
    <section class="box"><div class="label">料金表（円・税込）</div>
      <table class="compare"><thead><tr><th></th>${Object.values(P.periods).map(v=>`<th>${esc(v.replace(/（.*）/,''))}</th>`).join('')}</tr></thead>
      <tbody>${Object.entries(P.subjects).map(([k,v])=>`<tr><td>${esc(v)}</td>${Object.keys(P.periods).map(pk=>`<td>${P.prices[k][pk].toLocaleString('ja-JP')}</td>`).join('')}</tr>`).join('')}</tbody></table>
      <p class="note">無料版はいつでも無料で遊べます。まず無料版でためしてから、有料版を選ぶことをおすすめします。</p>
    </section>`;
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sel.s=b.dataset.s;render();});
  app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{sel.p=b.dataset.p;render();});
  const ag=document.getElementById('agree'); ag.onchange=()=>{agreed=ag.checked;document.getElementById('pay').disabled=!(ready&&agreed);};
  document.getElementById('pay').onclick=async()=>{
    const bt=document.getElementById('pay'); bt.disabled=true; bt.textContent='決済画面を開いています…';
    try{ const d=await A.call('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subject:sel.s,period:sel.p})});
      try{window.mnTrack&&mnTrack('begin_checkout',{plan:sel.s+'-'+sel.p,value:price,currency:'JPY'});}catch(e){}
      location.href=d.url;
    }catch(e){ bt.disabled=false; bt.textContent=yen(price)+'を支払う'; document.getElementById('err').textContent=(A.ERR[e.error]||'決済画面を開けませんでした。時間をおいてもう一度ためしてください。')+(e.message?'（くわしく：'+e.message+'）':''); }
  };
}
async function thanks(id){
  app.innerHTML='<div class="box"><p style="margin:0">支払いを確かめています…</p></div>';
  let o=null;
  for(let i=0;i<8&&!o;i++){ try{ o=await A.call('/api/order?session_id='+encodeURIComponent(id)); }catch(e){ if(e.error!=='not_paid'&&e.error!=='net'&&i>1)break; await new Promise(r=>setTimeout(r,2000)); } }
  if(!o){ app.innerHTML='<div class="box"><p class="err">支払いの確認ができませんでした。</p><p style="margin:0">カードの手続きが終わっていない可能性があります。しばらくしてからこのページを読みこみ直してください。それでも利用コードが出ないときは、お問い合わせください（<a href="tokushoho.html">連絡先</a>）。</p></div>'; return; }
  const P={kokugo:'国語',sansu:'算数',rika:'理科',shakai:'社会',shikou:'思考力',all:'全教科'}, PN={d1:'1日',w1:'1週間',m1:'1ヵ月',y1:'1年'};
  let act=null; try{ act=await A.activate(o.code); }catch(e){}
  /* 購入の記録（Googleアナリティクス）。テスト決済（受付番号が cs_test_ で始まる）は送らない。
     お礼の画面を読みこみ直しても2回送らないよう、送った受付番号をこの端末に覚えておく */
  try{
    const SENT='mn-purchase-sent'; let sent=[]; try{ sent=JSON.parse(localStorage.getItem(SENT)||'[]'); if(!Array.isArray(sent))sent=[]; }catch(e){}
    if(!/^cs_test_/.test(id) && !sent.includes(id)){
      window.mnTrack&&mnTrack('purchase',{plan:o.subject+'-'+o.period,transaction_id:id});
      sent.push(id); try{ localStorage.setItem(SENT,JSON.stringify(sent.slice(-50))); }catch(e){}
    }
  }catch(e){}
  app.innerHTML=`<section class="box done"><h2>ご購入ありがとうございます</h2>
    <p style="margin:0">プラン：<b>${esc(P[o.subject])}・${esc(PN[o.period])}</b></p>
    <div class="label">あなたの利用コード</div>
    <div class="code" id="code">${esc(o.code)}</div>
    <div class="row" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn sub" id="copy">コードをコピー</button></div>
    <p style="margin:0;font-weight:700;color:var(--ng)">この利用コードは、ほかの端末で使うときや、ブラウザの記録を消したときに必要です。必ずメモするか、画面を保存してください。</p>
    ${act?`<p style="margin:0">この端末では、もう使えるようになっています。利用期間は <b>${A.fmt(act.exp)}</b> までです。</p>`:'<p style="margin:0">有料版のゲームを開いて、この利用コードを入れてください。</p>'}
    <p class="note">1つの利用コードで3台まで使えます。ほかの端末では、有料版を開いたときに利用コードを入れてください。</p>
    <div><a class="btn" href="index.html" style="display:inline-block;text-decoration:none">ゲーム一覧へ</a></div></section>`;
  document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(o.code);document.getElementById('copy').textContent='コピーしました';}catch(e){}};
  history.replaceState(null,'',location.pathname+'?session_id='+encodeURIComponent(id));
}
boot();
})();
</script>
</body>
</html>
