"あらしのふく三室山のもみじ葉は、竜田川の水面に散って、まるで錦のおり物のようだ。", "x": 1}, {"n": 73, "au": "前権中納言匡房", "k": "高砂の 尾の上の桜 咲きにけり", "s": "外山の霞 立たずもあらなむ", "m": "遠くの高い山のみねの桜がさいたなあ。近くの山のかすみよ、どうか立たないでほしい（桜が見えなくなるから）。", "x": 1}, {"n": 96, "au": "入道前太政大臣", "k": "花さそふ 嵐の庭の 雪ならで", "s": "ふりゆくものは わが身なりけり", "m": "桜の花をさそって散らすあらしの庭は、雪がふったようだが、ほんとうに古りゆく（年をとっていく）のは、わたし自身なのだなあ。", "x": 1}];

const norm=s=>s.normalize('NFKC').toLowerCase().replace(/[\s\-ー－]/g,'');

const qkey=q=>`${q.n}番 ${q.k} ${q.s}`;   // 保護者ページの「まちがえた問題」と同じ書き方にそろえる
const state=q=>{const r=rec[qkey(q)];if(!r)return 'new';if(r[0]>=2&&r[0]>r[1])return 'master';if(r[1]>0)return 'weak';return 'try';};
const record=(q,ok)=>{if(!PAID)return false;const before=state(q);const r=rec[qkey(q)]||[0,0];r[ok?0:1]++;rec[qkey(q)]=r;saveRec();return state(q)==='master'&&before!=='master';};

// まぎらわしい札をえらぶ：同じ言葉や字が多い歌ほど、えらばれやすくする
const PLAIN='のにはをてもがとやかなりけるしつぬれば　 ';
function sim(a,b){
  let s=0; const A=new Set([...a].filter(c=>!PLAIN.includes(c)));
  [...new Set(b)].forEach(c=>{if(A.has(c))s+=/[一-鿿]/.test(c)?2:1;});
  if(a[0]===b[0])s+=3;
  if(a.slice(-3)===b.slice(-3))s+=3;
  return s+Math.random()*2;
}
function choicesFor(q){
  const key=dir==='ks'?'s':'k';
  const others=QS.filter(p=>p.n!==q.n).map(p=>[p,sim(q[key],p[key])]).sort((a,b)=>b[1]-a[1]).slice(0,7).map(x=>x[0]);
  return shuffle([q,...shuffle(others).slice(0,3)]);
}

async function decrypt(pass){
  const p=JSON.parse(document.getElementById('data').textContent);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(pass)),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(p.salt),iterations:p.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(p.iv)},k,b64(p.data))));
}

      <label for="pass" style="font-weight:700">合言葉</label>
      <input id="pass" name="pass" inputmode="latin" autocapitalize="off" spellcheck="false" placeholder="例：hyaku-xxxx-xxxx">
      <p class="err" id="err" role="alert">${msg||''}</p>
      <div class="row"><button class="btn go" id="open" type="submit">ひらく</button></div>
    </form>
    <div class="shop">合言葉をお持ちでない方へ：${shopUrl?`<a href="${esc(shopUrl)}" target="_blank" rel="noopener">こちらから購入できます</a>`:'販売ページは準備中です。'}<br>無料版（5首）は <a href="hyakunin.html">百人一首クイズ</a> で遊べます。</div>`;
  document.getElementById('f').onsubmit=async e=>{
    e.preventDefault();
    const v=document.getElementById('pass').value; if(!norm(v)){document.getElementById('err').textContent='合言葉を入れてください。';return;}
    const bt=document.getElementById('open'); bt.disabled=true; bt.textContent='確かめています…';
    try{ QS=await decrypt(v); store.set('hyakunin-p-pass',v); track('unlock',{product:'hyakunin'}); home(); }
    catch(err){ bt.disabled=false; bt.textContent='ひらく'; document.getElementById('err').textContent='合言葉がちがいます。全角・半角や、つづりを確かめてもう一度入れてください。'; }
  };
}
const DIRSEG=()=>`<div class="row"><span class="note" style="font-weight:700;color:var(--fg)">問題の形</span><div class="seg" role="group" aria-label="問題の形">
  <button data-d="ks" aria-pressed="${dir==='ks'}">上の句 → 下の句</button><button data-d="sk" aria-pressed="${dir==='sk'}">下の句 → 上の句</button></div></div>`;
function bindSeg(){app.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{dir=b.dataset.d;store.set('hyakunin-dir',dir);home();});}
function home(){
  G=null;
  if(PAID)return homePaid();
  const P=POEMS();
  app.innerHTML=`<div class="label">あそびかた</div>
    <ol class="howto"><li>上の句（5・7・5）を読みます。</li><li>つづく下の句（7・7）を、4まいの取り札からえらびます。</li><li>答えたあとに、歌の意味を確かめよう。</li></ol>
    ${DIRSEG()}
    <div class="row"><button class="btn go" id="go">はじめる（${P.length}首）</button></div>
    <p class="note">出てくる歌：${P.map(p=>`${p.n}番 ${esc(p.au)}`).join('、')}</p>${PAIDLINK}`;
  bindSeg();
  document.getElementById('go').onclick=()=>{course='free';start(shuffle(P));};
}
function homePaid(){
  const cnt={master:0,weak:0,new:0,try:0}; QS.forEach(q=>cnt[state(q)]++);
  const weak=QS.filter(q=>state(q)==='weak'), fresh=QS.filter(q=>state(q)==='new');
  app.innerHTML=`<div class="master"><div class="tp"><span class="label" style="font-size:14px;color:var(--fg)">覚えた歌</span><span class="cnt">${cnt.master}<small> / 100首</small></span></div>
      <div class="mbar" aria-hidden="true"><i class="m" style="width:${cnt.master}%"></i><i class="w2" style="width:${cnt.weak}%"></i></div>
      <div class="mleg"><span style="--c:var(--ok)">覚えた ${cnt.master}</span><span style="--c:var(--gold)">にがて ${cnt.weak}</span><span style="--c:var(--rule)">まだ ${cnt.new}</span></div></div>
    ${DIRSEG()}
    <div class="label">コースをえらぶ（1回10首）</div>
    <div class="courses">${RANGES.map(([a,b],i)=>{const m=QS.filter(q=>q.n>=a&&q.n<=b&&state(q)==='master').length;return `<button class="course" data-l="r${i}"><span class="nm">${a}〜${b}番</span><span class="ds">覚えた ${m} / 20首</span><span class="best">${best['r'+i]!=null?`ベスト ${best['r'+i]}/10`:''}</span></button>`;}).join('')}
      <button class="course" data-l="all"><span class="nm">100首からランダム</span><span class="ds">どこから出るかわからない10首。</span><span class="best">${best.all!=null?`ベスト ${best.all}/10`:''}</span></button>
      <button class="course" data-l="weak" ${weak.length?'':'disabled'}><span class="nm">にがて</span><span class="ds">まちがえたことのある歌だけ（${weak.length}首）</span></button>
      <button class="course" data-l="fresh" ${fresh.length?'':'disabled'}><span class="nm">まだやっていない</span><span class="ds">一度も出ていない歌だけ（${fresh.length}首）</span></button></div>
    <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
  bindSeg();
  app.querySelectorAll('.course').forEach(b=>b.onclick=()=>{
    const l=b.dataset.l; course=l;
    let pool=l==='weak'?weak:l==='fresh'?fresh:l==='all'?QS:(()=>{const [a,z]=RANGES[+l.slice(1)];return QS.filter(q=>q.n>=a&&q.n<=z);})();
    start(shuffle(pool).slice(0,10));
  });
  document.getElementById('reset').onclick=()=>{
    document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
    document.getElementById('yes').onclick=()=>{rec={};saveRec();homePaid();};
    document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
  };
}
function start(list){
  G={list,i:0,score:0,miss:[],n:list.length};
  track('level_start',{level_name:(PAID?'hyakunin-p-':'hyakunin-')+course+'-'+dir});
  newQ();
}
function newQ(){ const q=G.list[G.i]; G.ch=choicesFor(q); G.done=false; G.pick=null; render(); }
const cols=t=>t.split(' ').map(x=>`<span>${esc(x)}</span>`).join('');
function render(){
  const q=G.list[G.i], d=G.done, ks=dir==='ks';
  const shown=ks?q.k:q.s;
  app.innerHTML=`<div class="top"><div class="prog" aria-hidden="true"><i style="width:${G.i/G.n*100}%"></i></div><span class="nums">${G.i+1} / ${G.n}</span></div>
    <div class="yomi"><span class="au">${q.n}番　${esc(q.au)}</span>
      <div class="tx">${ks?cols(shown)+'<span class="blank">……</span>':'<span class="blank">……</span>'+cols(shown)}</div></div>
    <p class="q">${ks?'つづく下の句はどれですか。':'この下の句の、上の句はどれですか。'}</p>
    <div class="fuda ${ks?'':'sk'}" role="group" aria-label="取り札">${G.ch.map(p=>`<button class="fd ${d?(p.n===q.n?'right':p.n===G.pick?'wrong':''):''}" data-n="${p.n}" ${d?'disabled':''} aria-label="${esc(ks?p.s:p.k)}"><span class="v">${cols(ks?p.s:p.k)}</span></button>`).join('')}</div>
    <div id="after"></div>`;
  app.querySelectorAll('.fd').forEach(b=>b.onclick=()=>pick(+b.dataset.n));
  if(d)explain();
}
function pick(n){
  if(G.done)return;
  const q=G.list[G.i];
  G.done=true; G.pick=n; G.ok=n===q.n; G.newM=record(q,G.ok);
  if(G.ok)G.score++; else G.miss.push(q);
  track('answer_question',{category:'hyakunin-'+dir,question:`${q.n}番 ${q.k} ${q.s}`,correct:G.ok,picked:n});
  render();
}
function explain(){
  const q=G.list[G.i], last=G.i===G.n-1, me=QS.find(p=>p.n===G.pick), ks=dir==='ks';
  document.getElementById('after').innerHTML=`<div class="box" style="padding:14px;gap:10px;border-color:${G.ok?'var(--ok)':'var(--ng)'}">
    <div class="verdict ${G.ok?'ok':'ng'}">${G.ok?'正解！':'ざんねん'}${G.newM?'<span style="font-size:13px;margin-left:8px;color:var(--ok);font-family:var(--body);font-weight:700">覚えた！</span>':''}</div>
    <p class="uta">${ks?esc(q.k)+'<br><span class="lo">'+esc(q.s)+'</span>':'<span class="lo">'+esc(q.k)+'</span><br>'+esc(q.s)}</p>
    <span class="meta">${q.n}番　${esc(q.au)}</span>
    <div class="tip">${esc(q.m)}</div>
    ${G.ok||!me?'':`<div class="mine">あなたがえらんだ札は、${me.n}番（${esc(me.au)}）の${ks?'下の句':'上の句'}です。<br><b>${esc(me.k)}　${esc(me.s)}</b></div>`}
    <div class="row"><button class="btn go" id="next">${last?'結果を見る':'次の歌へ'}</button></div></div>`;
  const nx=document.getElementById('next'); nx.onclick=next; nx.focus({preventScroll:true});
}
function next(){ if(++G.i<G.n)newQ(); else result(); }
function result(){
  const n=G.n,s=G.score,r=s/n;
  const rank=r===1?'満点':r>=.8?'特選':r>=.6?'入選':r>=.4?'佳作':'もう一歩';
  track('level_end',{level_name:(PAID?'hyakunin-p-':'hyakunin-')+course+'-'+dir,success:s===n,score:s,total:n});
  const bk=PAID?(/^r\d$/.test(course)||course==='all'?course:null):'free';
  if(bk&&(best[bk]==null||s>best[bk])){best[bk]=s;store.set(PAID?'hyakunin-p-best':'hyakunin-best',best);}
  app.innerHTML=`<div class="label">結果</div>
    <div class="score"><div class="big">${s}<small> / ${n}首</small></div><div class="seal">${rank}</div></div>
    <p style="margin:0">${r===1?'全問正解！上の句と下の句がしっかりつながっています。':r>=.6?'よくできました。まちがえた歌は、声に出して読むと覚えやすくなります。':'歌の意味といっしょに覚えると、上の句と下の句がつながりやすくなります。'}</p>
    <div class="row"><button class="btn go" id="again">${PAID?'コースをえらぶ':'もう一度'}</button>${G.miss.length?'<button class="btn" id="retry">まちがえた歌だけ</button>':''}</div>
    ${PAID?'':PAIDLINK}
    ${G.miss.length?`<div class="label" style="color:var(--fg)">まちがえた歌</div>${G.miss.map(q=>`<div class="rv"><span class="meta">${q.n}番　${esc(q.au)}</span><br><b>${esc(q.k)}<br>${esc(q.s)}</b></div>`).join('')}`:''}`;
  document.getElementById('again').onclick=()=>PAID?home():(course='free',start(shuffle(POEMS())));
  const rt=document.getElementById('retry'); if(rt)rt.onclick=()=>{course='retry';start(shuffle(G.miss));};
}
(async()=>{
  if(!PAID){ home(); return; }
  try{const d=await (await fetch('games.json',{cache:'no-cache'})).json(); shopUrl=(d.site&&d.site.shopUrl)||'';}catch(e){}
  const saved=store.get('hyakunin-p-pass','');
  if(saved){ try{ QS=await decrypt(saved); home(); return; }catch(e){ store.set('hyakunin-p-pass',''); lockScreen('合言葉が変わりました。新しい合言葉を入れてください。'); return; } }
  lockScreen();
})();
})();
</script>

<a href="index.html" style="position:fixed;left:calc(10px + env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:99;background:#1d2b45;color:#fff;font:700 13px/1 system-ui,sans-serif;padding:9px 12px;border-radius:99px;text-decoration:none;opacity:.88">← ゲーム一覧</a>
<!-- ご意見ボタン・問題のお知らせ・ワンタップ評価。build.mjs が全ゲームの最後に自動で入れます。 -->
<style>
.mnfb-btn{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:99;background:#1d2b45;color:#fff;font:700 13px/1 system-ui,sans-serif;padding:9px 12px;border-radius:99px;border:0;opacity:.88;cursor:pointer}
.mnfb-sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(52px + env(safe-area-inset-bottom,0px));z-index:100;box-sizing:border-box;width:min(420px,calc(100vw - 24px));background:#fff;color:#1d2b3d;border:1px solid #d6dde7;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.2);padding:14px 16px;font:15px/1.6 "BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;display:flex;flex-direction:column;gap:10px;text-align:left}
.mnfb-sheet[hidden]{display:none}
.mnfb-sheet .mnfb-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.mnfb-sheet .mnfb-x{border:0;background:none;color:#5d6a7c;font:700 20px/1 system-ui,sans-serif;cursor:pointer;padding:2px 6px}
.mnfb-sheet .mnfb-note{font-size:12px;color:#5d6a7c;margin:0}
.mnfb-sheet .mnfb-opt{display:block;width:100%;box-sizing:border-box;text-align:left;border:1px solid #d6dde7;background:#f2f5f9;color:#1d2b3d;border-radius:8px;padding:10px 12px;font:700 15px/1.5 inherit;font-family:inherit;cursor:pointer;text-decoration:none}
.mnfb-sheet .mnfb-opt small{display:block;font-weight:400;font-size:12px;color:#5d6a7c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mnfb-sheet .mnfb-opt:hover{border-color:#1f3a6e}
.mnfb-rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mnfb-rate button{border:1px solid #d6dde7;background:#f2f5f9;color:#1d2b3d;border-radius:10px;padding:8px 4px;font:700 13px/1.3 inherit;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.mnfb-rate button span{font-size:26px;line-height:1.1}
.mnfb-rate button:hover{border-color:#1f3a6e}
.mnfb-btn:focus-visible,.mnfb-sheet button:focus-visible,.mnfb-sheet a:focus-visible{outline:3px solid #c98a12;outline-offset:2px}
@media (prefers-color-scheme:dark){
  .mnfb-sheet{background:#18212d;color:#e4e9f1;border-color:#2a3546}
  .mnfb-sheet .mnfb-note,.mnfb-sheet .mnfb-x,.mnfb-sheet .mnfb-opt small{color:#9aa6b8}
  .mnfb-sheet .mnfb-opt,.mnfb-rate button{background:#10151d;color:#e4e9f1;border-color:#2a3546}
}
@media print{.mnfb-btn,.mnfb-sheet{display:none!important}}
</style>
<script>
(function(){
var CFG=null;            // site.json の feedbackForm から作った設定（なければ null）
var base=window.mnTrack, lastQ=null, lastLv='';
function file(){try{return decodeURIComponent(location.pathname.split('/').pop()||'');}catch(e){return '';}}
function clean(s){return String(s).replace(/\{(.+?)\}/g,'【$1】');}
function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function formUrl(kind,q){
  var u=CFG.base+'?usp=pp_url';
  if(CFG.type)u+='&'+CFG.type+'='+encodeURIComponent(kind==='q'?CFG.machigai:CFG.kansou);
  if(CFG.game)u+='&'+CFG.game+'='+encodeURIComponent(document.title);
  if(CFG.question&&q)u+='&'+CFG.question+'='+encodeURIComponent(q);
  return u;
}
var sheet=el('<div class="mnfb-sheet" role="dialog" aria-label="ご意見" hidden></div>');
document.body.appendChild(sheet);
function close(){sheet.hidden=true;sheet.innerHTML='';}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!sheet.hidden)close();});
// わくの外をさわったら閉じる（評価は「答えなかった」として、その日はもう出さない）
document.addEventListener('click',function(e){
  if(sheet.hidden||sheet.contains(e.target)||(e.target.closest&&e.target.closest('.mnfb-btn')))return;
  if(sheet.dataset.k==='rate')markRated();
  close();
},true);

// 1・2. ご意見ボタン（感想フォーム／いまの問題のまちがいを知らせる）
if(CFG){
  var btn=el('<button class="mnfb-btn" type="button" aria-haspopup="dialog">ご意見</button>');
  document.body.appendChild(btn);
  btn.onclick=function(){
    if(!sheet.hidden&&sheet.dataset.k==='menu'){close();return;}
    var q=lastQ||(lastLv?'コース：'+lastLv:'');
    sheet.dataset.k='menu';
    sheet.innerHTML='<div class="mnfb-h"><span>ご意見をお聞かせください</span><button class="mnfb-x" type="button" aria-label="閉じる">×</button></div>'
      +(lastQ?'<a class="mnfb-opt" data-kind="question" target="_blank" rel="noopener" href="'+esc(formUrl('q',q))+'">いまの問題のまちがいを知らせる<small>'+esc(q)+'</small></a>':'')
      +'<a class="mnfb-opt" data-kind="comment" target="_blank" rel="noopener" href="'+esc(formUrl('k',lastLv?'コース：'+lastLv:''))+'">感想・ご意見を送る<small>'+esc(document.title)+'</small></a>'
      +'<p class="mnfb-note">保護者の方向けのフォームが新しいページで開きます。お子さんのお名前や学校名は書かないでください。</p>';
    sheet.hidden=false;
    sheet.querySelector('.mnfb-x').onclick=close;
    sheet.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){try{base&&base('feedback_open',{kind:a.dataset.kind});}catch(e){}setTimeout(close,0);});});
  };
}

// 3. ワンタップ評価（ゲームを1回終えたとき。同じゲームは1日1回まで）
function rated(){try{var r=JSON.parse(localStorage.getItem('mn-rated')||'{}');return r[file()]===new Date().toDateString();}catch(e){return false;}}
function markRated(){try{var r=JSON.parse(localStorage.getItem('mn-rated')||'{}');r[file()]=new Date().toDateString();localStorage.setItem('mn-rated',JSON.stringify(r));}catch(e){}}
function askRating(lv){
  if(rated()||!sheet.hidden)return;
  sheet.dataset.k='rate';
  sheet.innerHTML='<div class="mnfb-h"><span>このゲーム、どうだった？</span><button class="mnfb-x" type="button" aria-label="閉じる">×</button></div>'
    +'<div class="mnfb-rate"><button type="button" data-r="fun"><span>😊</span>たのしかった</button><button type="button" data-r="ok"><span>🙂</span>ふつう</button><button type="button" data-r="hard"><span>😣</span>むずかしすぎた</button></div>';
  sheet.hidden=false;
  sheet.querySelector('.mnfb-x').onclick=function(){markRated();close();};
  sheet.querySelectorAll('[data-r]').forEach(function(b){b.onclick=function(){
    try{base&&base('game_rating',{rating:b.dataset.r,level_name:lv||''});}catch(e){}
    markRated();
    sheet.innerHTML='<div class="mnfb-h"><span>ありがとう！</span></div>';
    setTimeout(function(){if(sheet.dataset.k==='rate')close();},1200);
  };});
}
window.mnTrack=function(n,p){p=p||{};try{base&&base(n,p);}catch(e){}
  try{
    if(n==='level_start'){lastLv=String(p.level_name||'');if(sheet.dataset.k==='rate')close();}
    else if(n==='answer_question'){if(sheet.dataset.k==='rate')close();if(p.question!=null)lastQ=clean(p.question).slice(0,120);}
    else if(n==='level_end'){if(p.level_name)lastLv=String(p.level_name);setTimeout(function(){askRating(lastLv);},700);}
  }catch(e){}};
})();
</script>
