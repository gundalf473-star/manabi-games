<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{SITE_NAME}}｜中学受験の算数・国語・理科・社会・思考力を学べる無料ゲーム</title>
<meta name="description" content="{{SITE_DESCRIPTION}}">
{{GA}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@500&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: 時間割のように教科の札（大分類）→ 単元のチップ（中分類）→ ゲームのカード */
:root{
  --bg:#f2f5f9; --surface:#ffffff; --fg:#1d2b3d; --muted:#5d6a7c; --rule:#d6dde7; --ink:#1f3a6e;
  --s1:#2667d6; --s2:#d4432a; --s3:#1d8150; --s4:#8a5bc7; --s5:#c98a12; --s6:#127f8a;
  --display:"Kiwi Maru","Hiragino Maru Gothic ProN",serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10151d; --surface:#18212d; --fg:#e4e9f1; --muted:#9aa6b8; --rule:#2a3546; --ink:#8fb0f0;
  --s1:#6c9ff0; --s2:#f07a62; --s3:#4cc184; --s4:#b493ea; --s5:#e8b54a; --s6:#4fc3cc; color-scheme:dark}}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:500;font-size:clamp(30px,7vw,44px);line-height:1.2;margin:0;color:var(--ink);text-wrap:balance}
.lead{margin:6px 0 0;color:var(--muted);max-width:36em}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--s5);outline-offset:2px}
.label{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
.subjects{display:flex;gap:8px;flex-wrap:wrap}
.subj{border:2px solid var(--rule);background:var(--surface);border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:700;display:flex;align-items:center;gap:8px}
.subj .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.subj .sw{width:10px;height:10px;border-radius:2px;background:var(--c,var(--ink))}
.subj[aria-pressed="true"]{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:var(--surface)}
.subj[aria-pressed="true"] .n{color:var(--surface);opacity:.85}
.subj[aria-pressed="true"] .sw{background:var(--surface)}
.units{display:flex;gap:6px;flex-wrap:wrap}
.unit{border:1px solid var(--rule);background:transparent;border-radius:99px;padding:3px 12px;cursor:pointer;font-size:14px}
.unit[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.group{display:flex;flex-direction:column;gap:10px}
.gh{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--c);padding-bottom:4px}
.gh h2{margin:0;font-family:var(--display);font-weight:500;font-size:20px;color:var(--c)}
.gh span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;min-width:0}
.card:hover{border-color:var(--c)}
.card .tag{font-size:12px;font-weight:700;color:var(--c);border:1px solid var(--c);border-radius:4px;padding:0 6px}
.card .tags{display:flex;gap:6px}
.card .tag.paid{color:var(--surface);background:var(--c);}
.card h3{margin:0;font-family:var(--display);font-weight:500;font-size:19px;line-height:1.35}
.card p{margin:0;font-size:14px;color:var(--muted);flex:1}
.card .meta{display:flex;gap:12px;font-size:12px;color:var(--muted)}
.card .play{font-weight:700;color:var(--c);font-size:14px}
.empty{color:var(--muted)}
.topnav{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.topnav a{font-size:14px;font-weight:700;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:99px;padding:4px 14px;text-decoration:none}
.topnav a:hover{border-color:var(--ink)}
.topnav a .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--s2);margin-left:6px;vertical-align:2px}
.card .tag.new{color:#fff;background:var(--s2);border-color:var(--s2)}
/* トップの「今日の1問・つづきから・にがて復習」 */
.mine2{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.mine2 .row{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.mi{background:var(--surface);border:1px solid var(--rule);border-left:5px solid var(--c);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mi .k{font-size:12px;font-weight:700;color:var(--c)}
.mi a.t{font-family:var(--display);font-size:17px;font-weight:700;color:inherit;text-decoration:none;line-height:1.4;overflow-wrap:anywhere}
.mi .s{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.mi .due{color:#fff;background:var(--s3);border-radius:4px;padding:0 6px;font-weight:700;font-size:12px}
.mi .go{margin-left:auto;font-weight:700;color:var(--c);text-decoration:none;font-size:14px}
.starb{border:1px solid var(--rule);background:var(--surface);border-radius:6px;cursor:pointer;font:inherit;font-size:13px;font-weight:700;padding:2px 8px;margin-left:auto;color:var(--muted)}
.starb[aria-pressed="true"]{color:#fff;background:var(--s3);border-color:var(--s3)}
.mine2 .hint{font-size:13px;color:var(--muted);margin:0}
.card .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.card .btns a{flex:1;min-width:110px;text-align:center;border-radius:8px;padding:7px 10px;font-weight:700;font-size:14px;text-decoration:none;border:2px solid var(--c);color:var(--c)}
.card .btns a.p{background:var(--c);color:var(--surface)}
.mine{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.mine a.m{background:var(--surface);border:1px solid var(--rule);border-left:5px solid var(--c,var(--ink));border-radius:10px;padding:10px 14px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:2px;min-width:0}
.mine a.m:hover{border-color:var(--c,var(--ink))}
.mine .k{font-size:12px;font-weight:700;color:var(--c,var(--ink));letter-spacing:.05em}
.mine .t{font-family:var(--display);font-size:18px;line-height:1.35;overflow-wrap:anywhere}
.mine .s{font-size:13px;color:var(--muted)}
.mine .big{font-family:var(--display);font-size:26px;color:var(--s2);line-height:1.1}
.topnav button.inst{font-size:14px;font-weight:700;color:var(--ink);background:var(--surface);border:1px dashed var(--ink);border-radius:99px;padding:4px 14px;cursor:pointer}
.chuko{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--rule);border-left:5px solid #0e7c7b;border-radius:10px;padding:12px 16px;text-decoration:none;color:inherit}
.chuko:hover{border-color:#0e7c7b}
.chuko .k{font-size:12px;font-weight:700;color:#0e7c7b;letter-spacing:.05em}
.chuko .t{font-family:var(--display);font-size:19px;line-height:1.35}
.chuko .s{font-size:13px;color:var(--muted)}
.chuko .go{margin-left:auto;font-weight:700;color:#0e7c7b;white-space:nowrap}
.howto{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;font-size:14px}
footer{color:var(--muted);font-size:12px;border-top:1px solid var(--rule);padding-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>{{SITE_NAME}}</h1>
    <p class="lead">{{SITE_DESCRIPTION}}</p>
    <nav class="topnav"><a href="news.html" id="newslink">お知らせ</a><a href="buy.html">料金プラン</a><a href="plan.html">利用コードを入れる</a><a href="parent.html">保護者ページ</a><button class="inst" id="inst" hidden>ホーム画面に追加</button></nav>
    <div class="howto" id="howto" hidden></div>
  </header>
  <a class="chuko" id="chukoentry" href="chuko/index.html" hidden><span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span class="k">中学生になったら</span><span class="t">中高一貫コース</span><span class="s">入学準備から、中学の数学・英語・国語まで。算数で身につけた力を、そのまま中学の勉強へ。</span></span><span class="go">見る →</span></a>
  <section id="minebox"><div class="mine2" id="mine2" style="margin:0 0 12px"></div><div class="mine" id="mine"></div></section>
  <section>
    <div class="label">教科</div>
    <div class="subjects" id="subjects"></div>
  </section>
  <section id="unitbox" hidden>
    <div class="label">単元</div>
    <div class="units" id="units"></div>
  </section>
  <main id="list"><p class="empty">ゲームを読みこんでいます…</p></main>
  <footer id="foot"></footer>
</div>
<script>
(async function(){
  const COLORS=['--s1','--s2','--s3','--s4','--s5','--s6'];
  let data;
  try{ data=await (await fetch('games.json',{cache:'no-cache'})).json(); }
  catch(e){ document.getElementById('list').innerHTML='<p class="empty">ゲームの一覧を読みこめませんでした。ページを再読みこみしてください。</p>'; return; }
  const games=data.games.filter(g=>g.course!=='chuko'), subjects=[...new Set(games.map(g=>g.subject))];
  const color=s=>`var(${COLORS[subjects.indexOf(s)%COLORS.length]})`;
  const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  /* 公開して14日以内のゲームに NEW（日本時間の今日で数える） */
  const today=new Date(Date.now()+9*36e5).toISOString().slice(0,10);
  const isNew=g=>g.added&&(Date.parse(today)-Date.parse(g.added))/864e5<14;
  /* まだ読んでいないお知らせがあれば、「お知らせ」に点を付ける */
  try{ const latest=(data.site&&data.site.newsLatest)||'', seen=localStorage.getItem('mn-news-seen')||'';
    if(latest&&latest>seen){ const a=document.getElementById('newslink'); a.insertAdjacentHTML('beforeend','<span class="dot" aria-label="新しいお知らせがあります"></span>'); } }catch(e){}
  /* 無料版と有料版を1つの単元にまとめる（file の -full を取ったものが同じなら同じ単元） */
  const base=f=>String(f).replace(/-full(\.html)$/,'$1'), UM={}, units=[];
  games.forEach(g=>{const k=base(g.file);if(!UM[k]){UM[k]={k,subject:g.subject,unit:g.unit};units.push(UM[k]);}UM[k][g.paid?'paid':'free']=g;});
  units.forEach(u=>{const g=u.free||u.paid;u.title=u.free?u.free.title:u.paid.title.replace(/\s*\d+問$/,'');u.desc=g.description;u.grade=g.grade||'';u.players=g.players||'';u.added=(u.paid||g).added;});
  const LS=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k)||'null');return v==null?d:v;}catch(e){return d;}};
  let fav=LS('mn-fav-j',[]); if(!Array.isArray(fav))fav=[];
  const favIdx=k=>fav.findIndex(f=>base(f)===k);
  const hist=(()=>{const h=LS('mn-history',[]);return Array.isArray(h)?h:[];})();
  const playedPaid=k=>hist.some(e=>e&&e.f===k.replace(/\.html$/,'-full.html'));
  function toggleFav(k){const i=favIdx(k);if(i>=0)fav.splice(i,1);else{if(fav.length>=8){note('「わたしの単元」に入れられるのは8つまでです。どれかを外してください。');return;}const u=UM[k];fav.unshift(u&&u.paid&&(playedPaid(k)||!u.free)?u.paid.file:k);}
    try{localStorage.setItem('mn-fav-j',JSON.stringify(fav));}catch(e){note('この端末では保存できませんでした。');}window.mnMine&&window.mnMine();render();}
  function note(t){const m=document.getElementById('mine2');const p=document.createElement('p');p.className='hint';p.style.color='var(--s3)';p.textContent=t;m.prepend(p);setTimeout(()=>p.remove(),3000);}
  let subj=decodeURIComponent(location.hash.slice(1))||'すべて', unit='すべて';
  if(subj!=='すべて'&&!subjects.includes(subj))subj='すべて';

  function render(){
    const S=document.getElementById('subjects');
    S.innerHTML=['すべて',...subjects].map(s=>{const n=s==='すべて'?units.length:units.filter(u=>u.subject===s).length;
      return `<button class="subj" style="--c:${s==='すべて'?'var(--ink)':color(s)}" aria-pressed="${s===subj}" data-s="${esc(s)}">${s==='すべて'?'':'<span class="sw"></span>'}${esc(s)}<span class="n">${n}</span></button>`;}).join('');
    S.querySelectorAll('.subj').forEach(b=>b.onclick=()=>{subj=b.dataset.s;unit='すべて';history.replaceState(null,'',subj==='すべて'?location.pathname:'#'+encodeURIComponent(subj));render();});

    const ub=document.getElementById('unitbox'), U=document.getElementById('units');
    if(subj==='すべて'){ub.hidden=true;}
    else{
      const units=[...new Set(games.filter(g=>g.subject===subj).map(g=>g.unit))];
      ub.hidden=units.length<2;
      U.innerHTML=['すべて',...units].map(u=>`<button class="unit" aria-pressed="${u===unit}" data-u="${esc(u)}">${esc(u)}</button>`).join('');
      U.querySelectorAll('.unit').forEach(b=>b.onclick=()=>{unit=b.dataset.u;render();});
    }

    const shown=units.filter(u=>(subj==='すべて'||u.subject===subj)&&(unit==='すべて'||u.unit===unit));
    const groups=[...new Set(shown.map(u=>u.subject))];
    const L=document.getElementById('list');
    L.innerHTML= shown.length? groups.map(s=>{
      const us=shown.filter(u=>u.subject===s);
      return `<section class="group" style="--c:${color(s)}"><div class="gh"><h2>${esc(s)}</h2><span>${us.length}本</span></div>
        <div class="grid">${us.map(u=>{const on=favIdx(u.k)>=0;return `<div class="card">
          <span class="tags"><span class="tag">${esc(u.unit)}</span>${isNew(u)?'<span class="tag new">NEW</span>':''}<button type="button" class="starb" data-k="${esc(u.k)}" aria-pressed="${on}" title="いちばん上の「わたしの単元」に入れる">${on?'★':'☆'} わたしの単元</button></span><h3>${esc(u.title)}</h3><p>${esc(u.desc)}</p>
          <div class="meta">${u.grade?`<span>${esc(u.grade)}</span>`:''}${u.players?`<span>${esc(u.players)}</span>`:''}</div>
          <div class="btns">${u.free?`<a href="${u.free.url}">${u.paid?'無料であそぶ':'あそぶ →'}</a>`:''}${u.paid?`<a class="p" href="${u.paid.url}">有料版（全問）</a>`:''}</div></div>`;}).join('')}</div></section>`;
    }).join('<div style="height:16px"></div>') : '<p class="empty">この単元のゲームはまだありません。</p>';
    L.querySelectorAll('.starb').forEach(b=>b.onclick=()=>toggleFav(b.dataset.k));
  }
  render();
  /* 今日の1問・前回のつづき・にがて復習（この端末の記録から。どこにも送りません） */
  (function(){
    const rd=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}};
    const byFile={}; games.forEach(g=>{byFile[g.file]=g;});
    const out=[];
    const D=rd('mn-daily',{days:{}})||{days:{}}, days=D.days||{};
    let n=0,k=Math.round(Date.parse(today)/864e5); if(days[today]==null)k--; while(days[new Date(k*864e5).toISOString().slice(0,10)]!=null){n++;k--;}
    out.push(`<a class="m" href="daily.html" style="--c:var(--s2)"><span class="k">今日の1問</span><span class="t">${days[today]!=null?'今日はおわり。またあした！':'今日の問題にちょうせん'}</span><span class="s">${n?`<span class="big">${n}</span> 日連続`:'毎日1問、日がわりで出ます'}</span></a>`);
    const st=s=>{if(!s)return 'new';if(s[0]>=2&&s[0]>s[1])return 'master';if(s[1]>0)return 'weak';return 'try';};
    const weak=[]; Object.entries(data.rec||{}).forEach(([key,o])=>{const r=rd(key,null);if(!r||typeof r!=='object'||!byFile[o.f])return;
      const w=Object.values(r).filter(v=>st(v)==='weak').length; if(w)weak.push([byFile[o.f],w]);});
    weak.sort((a,b)=>b[1]-a[1]);
    const weakBy={};weak.forEach(([g,w])=>{weakBy[base(g.file)]=(weakBy[base(g.file)]||0)+w;});
    const R0=rd('mn-review',{})||{},td0=Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5),dueBy=k=>{const m=R0[k.replace(/\.html$/,'')];return m&&typeof m==='object'?Object.values(m).filter(r=>r&&r.d<=td0).length:0;};
    const mineKeys=new Set();
    window.mnMine=function(){const box=document.getElementById('mine2'),items=[],seen=mineKeys;seen.clear();
      fav.forEach(f=>{const k=base(f),u=UM[k];if(u&&!seen.has(k)){seen.add(k);items.push({u,f,star:true});}});
      let rc=0;for(let i=hist.length-1;i>=0&&rc<3;i--){const e=hist[i];if(!e||!e.f||e.f==='daily.html')continue;const k=base(e.f),u=UM[k];if(!u||seen.has(k))continue;seen.add(k);items.push({u,f:e.f,star:false,t:e.t,sc:e.n!=null?`${e.s} / ${e.n}問`:e.a?`${e.k} / ${e.a}問`:''});rc++;}
      if(!items.length){box.innerHTML='<div class="label">わたしの単元</div><p class="hint">ゲームのカードや画面で「☆ わたしの単元」を押すと、ここにならびます。遊んだゲームも、ここに出ます。</p>';return;}
      box.innerHTML='<div class="label">わたしの単元</div><div class="row">'+items.map(({u,f,star,t,sc})=>{const g=(f.includes('-full')?u.paid:u.free)||u.free||u.paid,n=dueBy(u.k),w=weakBy[u.k]||0,d=t?new Date(t):null;
        return `<div class="mi" style="--c:${color(u.subject)}"><span class="k">${star?'★ ':'最近 '}${esc(u.subject)}・${esc(u.unit)}</span><a class="t" href="${g.url}">${esc(u.title)}</a><span class="s">${n?`<span class="due">今日の解き直し ${n}問</span>`:''}${w?`<span class="due" style="background:var(--s5)">にがて ${w}問</span>`:''}${d?`<span>${d.getMonth()+1}月${d.getDate()}日${sc?'・'+sc:''}</span>`:''}${u.paid&&u.free?(g.paid?'<span>有料版</span>':'<span>無料版</span>'):''}<button type="button" class="starb" aria-pressed="${star}" data-k="${esc(u.k)}">${star?'★ 外す':'☆ 入れる'}</button><a class="go" href="${g.url}">あそぶ →</a></span></div>`;}).join('')+'</div>';
      box.querySelectorAll('.starb').forEach(b=>b.onclick=()=>toggleFav(b.dataset.k));};
    window.mnMine();
    if(weak.length&&!mineKeys.has(base(weak[0][0].file))){const [g,w]=weak[0], all=weak.reduce((s,x)=>s+x[1],0);
      out.push(`<a class="m" href="${g.url}" style="--c:${color(g.subject)}"><span class="k">にがて復習</span><span class="t">${esc(g.title)}</span><span class="s">にがて ${w}問${weak.length>1?`（ぜんぶで ${all}問・<span style="text-decoration:underline">保護者ページ</span>で一覧）`:''}</span></a>`);}
    {const R=rd('mn-review',{})||{}, td=Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5); const due=[];
      Object.entries(R).forEach(([id,m])=>{const g=byFile[id+'-full.html']||byFile[id+'.html'];if(!g||!m||typeof m!=='object')return;
        const n=Object.values(m).filter(r=>r&&r.d<=td).length; if(n)due.push([g,n]);});
      due.sort((a,b)=>b[1]-a[1]);
      if(due.length&&!mineKeys.has(base(due[0][0].file))){const [g,n]=due[0], all=due.reduce((s,x)=>s+x[1],0);
        out.push(`<a class="m" href="${g.url}" style="--c:${color(g.subject)}"><span class="k">今日の解き直し</span><span class="t">${esc(g.title)}</span><span class="s">${n}問${due.length>1?`（ぜんぶで ${all}問・${due.length}本）`:''}　「今日の解き直し」をえらんでね</span></a>`);}}
    {const x=rd('mn-ichibun',{})||{},d=x.days||{};let n=0,k=Math.round(Date.parse(today)/864e5);if(d[today]==null)k--;while(d[new Date(k*864e5).toISOString().slice(0,10)]!=null){n++;k--;}
      out.splice(1,0,`<a class="m" href="ichibun.html" style="--c:var(--s3)"><span class="k">毎日の一文要約</span><span class="t">${d[today]!=null?'今日はおわり。またあした！':'今日の文章を一文にまとめよう'}</span><span class="s">${n?`<span class="big">${n}</span> 日連続`:'国語・自分で書いて確かめる'}</span></a>`);}
    out.splice(1,0,`<a class="m" href="drill.html" style="--c:var(--s1)"><span class="k">毎日の計算ドリル</span><span class="t">${(()=>{const x=rd('mn-drill',{})||{};return x.days&&x.days[today]?'今日はおわり。タイム '+x.days[today]+'秒':'今日の5問にちょうせん';})()}</span><span class="s">${(()=>{const x=rd('mn-drill',{})||{},d=x.days||{};let n=0,k=Math.round(Date.parse(today)/864e5);if(d[today]==null)k--;while(d[new Date(k*864e5).toISOString().slice(0,10)]!=null){n++;k--;}return n?`<span class="big">${n}</span> 日連続`:'小4・小5・小6から選べます';})()}</span></a>`);
    document.getElementById('mine').innerHTML=out.join('');
  })();
  /* ホーム画面に追加 */
  (function(){
    const b=document.getElementById('inst'), how=document.getElementById('howto');
    const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
    if(standalone)return;
    let ev=null; addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;b.hidden=false;});
    const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    const mobile=ios||/android/i.test(navigator.userAgent); if(mobile)b.hidden=false;
    b.onclick=async()=>{ try{window.mnTrack&&mnTrack('install_click',{});}catch(e){}
      if(ev){ev.prompt();try{await ev.userChoice;}catch(e){}ev=null;return;}
      how.hidden=!how.hidden;
      how.innerHTML=ios?'<b>iPhone・iPad</b>：Safariで、画面の下（または上）の <b>共有ボタン</b>（□に↑）をおして、<b>「ホーム画面に追加」</b>をえらびます。'
        :'<b>Android</b>：Chromeで、右上の <b>︙（メニュー）</b>をおして、<b>「ホーム画面に追加」</b>または<b>「アプリをインストール」</b>をえらびます。';};
  })();
  const fb=(data.site&&data.site.feedback)||null;
  document.getElementById('foot').innerHTML=`ゲーム ${games.length}本　・　${fb?`<a href="${esc(fb.base+'?usp=pp_url'+(fb.type?'&'+fb.type+'='+encodeURIComponent(fb.kansou):'')+(fb.game?'&'+fb.game+'='+encodeURIComponent('サイト全体'):''))}" target="_blank" rel="noopener" style="color:inherit">ご意見・ご感想</a>　・　`:''}<a href="parent.html" style="color:inherit">保護者ページ（学習の記録）</a>　・　<a href="contact.html" style="color:inherit">お問い合わせ</a>　・　<a href="privacy.html" style="color:inherit">プライバシーポリシー</a>　・　<a href="tokushoho.html" style="color:inherit">特定商取引法に基づく表記</a>`;
})();
