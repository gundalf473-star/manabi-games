  --flow:#1c2638; --flowline:#9cc0f0; color-scheme:dark}

  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 64px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,7.5vw,40px);line-height:1.2;margin:0;color:var(--ink)}

h1 .ns{font-size:.5em;letter-spacing:.02em;white-space:nowrap;display:inline-block}
.lead{margin:4px 0 0;color:var(--muted);font-size:14px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
ruby rt{font-size:.5em;font-weight:400}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px}
.label{font-size:12px;font-weight:700;color:var(--seal);letter-spacing:.1em}
.note{font-size:13px;color:var(--muted);margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:8px;padding:12px 22px;font-size:16px;font-weight:700;cursor:pointer;background:var(--pick)}
.btn.go{background:var(--fg);color:var(--surface)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.top{display:flex;align-items:center;gap:10px}

.prog i{display:block;height:100%;background:var(--ink);transition:width .3s}
.whochip{font-size:12px;font-weight:700;color:var(--ink);border:1px solid var(--ink);border-radius:4px;padding:0 6px;white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}
.yr{align-self:flex-start;font-weight:700;font-size:15px;color:var(--ink);border:2px solid var(--ink);border-radius:6px;padding:0 10px;line-height:1.6;font-variant-numeric:tabular-nums}
.pic{background:#fff;border:1px solid var(--rule);border-radius:10px;overflow:hidden;line-height:0}
.pic svg{display:block;width:100%;height:auto}
.txt{margin:0;white-space:pre-line;font-size:17px;line-height:1.95}
.ask{margin:0;font-size:18px;font-weight:700;color:var(--ink);line-height:1.8}
.ch{display:grid;gap:8px}
.op{border:2px solid var(--rule);background:var(--surface);border-radius:8px;padding:12px 14px;font-size:16px;line-height:1.75;text-align:left;font-weight:700;cursor:pointer;display:flex;gap:12px;align-items:center;min-height:56px}

.op .k{flex:none;width:28px;height:28px;border-radius:50%;background:var(--pick);display:grid;place-items:center;font-size:14px}

.sw .swp svg{display:block;width:100%;height:auto}
.sw .swt{margin:0;font-size:17px;font-weight:700}

.stars{font-size:26px;color:var(--gold);letter-spacing:.1em;line-height:1}

.flow li{position:relative;border:2px solid var(--flowline);background:var(--flow);border-radius:8px;padding:6px 12px 6px 44px;font-weight:700;font-size:15px;line-height:1.6;counter-increment:fl}

.flow li:not(:last-child)::after{content:"";position:absolute;left:50%;bottom:-19px;transform:translateX(-50%);border:8px solid transparent;border-top:11px solid var(--flowline);border-bottom:0}

.figrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.fc{border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--surface);font-size:12px;line-height:1.5;display:flex;flex-direction:column}

.fc .fr{padding:0 8px 6px;color:var(--muted)}
.fc.no .fp{display:grid;place-items:center;aspect-ratio:3/2;background:var(--pick);font-size:28px;line-height:1;color:var(--muted)}
.list{display:grid;gap:8px}

.st .no{display:block;font-size:12px;font-weight:700;color:var(--seal);letter-spacing:.08em;line-height:1.4}

.st .bd.new{background:var(--pick);color:var(--muted)}

function head(o){ const n=(o&&o.n)||0; return `<div class="top"><button class="linkbtn" id="back">← 章をえらぶ</button><div class="prog" aria-hidden="true"><i style="width:${Math.round(n/G.s.len*100)}%"></i></div>${G.who?`<span class="whochip">${esc(G.who)}</span>`:''}</div>`; }
function show(id){

  if(o.k==='e')return ending(o);

}
function switchCard(id){

  app.innerHTML=`${head(o)}<div class="sw" role="group" aria-label="役割の交代">
    <div class="swl">第${s.no}章　${rb(s.title)}　${nth?nth+'人目の役割':''}</div>
    ${prev?`<p class="got">✓「${esc(prev)}」の役割カードを手に入れた！</p>`:''}
    <div class="swp">${f[3]}</div>
    <p class="swt">${prev?'ここからは、あなたは':'あなたは'}</p>
    <p class="swy">${esc(f[1])}</p><p class="swn">${esc(f[0])}。</p>
    <p class="swr">${rb(f[2])}</p>
    <button class="btn go" id="nx">この役割で進む ▶</button></div>`;
  document.getElementById('back').onclick=home;
  const nx=document.getElementById('nx'); nx.onclick=()=>o.k==='e'?ending(o):render(id);
  top0(); nx.focus({preventScroll:true});
}
function render(id){
  const s=G.s, o=s.sc[id];
  const ch=o.k==='q'?shuffle(o.c):null;
  app.innerHTML=`${head(o)}${o.y!=null?`<span class="yr">${esc(fy(o.y))}</span>`:''}<div class="pic">${o.p}</div><p class="txt">${rb(o.t)}</p>
    ${o.k==='q'?`<p class="ask">${rb(o.a)}</p><div class="ch">${ch.map((c,i)=>`<button class="op" data-i="${i}"><span class="k">${'アイウ'[i]}</span>${c[2]?`<span class="ic">${c[2]}</span>`:''}<span>${rb(c[0])}</span></button>`).join('')}</div>`
      :`<div class="row"><button class="btn go" id="nx">次へ ▶</button></div>`}`;
  document.getElementById('back').onclick=home;
  if(ch)app.querySelectorAll('.op').forEach(b=>b.onclick=()=>{const c=ch[+b.dataset.i];const ok=s.sc[c[1]].k!=='x';
    track('answer_question',{category:'k-itnari-'+s.id,question:id,correct:ok});
    if(!ok){G.from=id;G.pick=c[0];G.overs++;bump(s.id,1);} show(c[1]);});
  else document.getElementById('nx').onclick=()=>show(o.nx);
  top0();
}
function over(o){
  const s=G.s;
  app.innerHTML=`${head(s.sc[G.from]||{})}<div class="over"><h2>おっと、ちがうみたい！</h2>
    <p class="pick">あなたが選んだのは：<b>${rb(G.pick)}</b></p>
    <div class="pic">${o.p}</div><p class="txt">${rb(o.t)}</p>${o.h?`<p class="hint"><b>覚えておこう</b>${rb(o.h)}</p>`:''}
    <div class="row"><button class="btn go" id="retry">この場面からやりなおす</button><button class="btn" id="first">最初から</button></div>
    <div><button class="linkbtn" id="list">章をえらぶ</button></div></div>`;
  document.getElementById('back').onclick=home;
  const rt=document.getElementById('retry');rt.onclick=()=>render(G.from);
  document.getElementById('first').onclick=()=>{G.who=null;show(s.start);};
  document.getElementById('list').onclick=home;
  top0(); rt.focus({preventScroll:true});
}
function ending(o){
  const s=G.s, stars=G.overs===0?3:G.overs<=2?2:1;
  if(G.who)collect(s.id,G.who);
  bump(s.id,0);
  track('level_end',{level_name:'k-itnari-'+s.id,success:true,score:stars});
  const ix=ST.indexOf(s), nx=ST[ix+1];
  app.innerHTML=`${head(o)}<p class="endh">🎉 第${s.no}章「${rb(s.title)}」クリア！</p>${o.y!=null?`<span class="yr">${esc(fy(o.y))}</span>`:''}<div class="pic">${o.p}</div><p class="txt">${rb(o.t)}</p>
    <p class="lesson"><b>この章のまとめ</b>${rb(o.l)}</p>
    <div class="row"><span class="stars" aria-label="星 ${stars}こ">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</span><span class="note">${G.overs?'ゲームオーバー '+G.overs+'回。次はノーミスをめざそう！':'ノーミスで最後まで進めた！'}</span></div>
    <div class="label">この章のポイント　${rb(s.area)}</div>
    <ol class="flow">${s.flow.map(e=>`<li>${rb(e)}</li>`).join('')}</ol>
    <div class="label">覚えておきたい用語</div>
    <ul class="words">${s.words.map(w=>`<li><b>${rb(w[0])}</b>${rb(w[1])}</li>`).join('')}</ul>
    <div class="label">参考にした情報</div>
    <ul class="src">${(s.src||[]).map(e=>`<li>${esc(e[0])} <span class="u">${esc(e[1])}</span></li>`).join('')}</ul>
    <p class="note">${esc(NOTE)}</p>
    <div class="label">なりきった役割（役割カード ${nCards()} / ${ALLROLE.length}まい）</div><div class="figrow">${s.roles.map(f=>roleCard(s,f)).join('')}</div>
    <div class="row">${nx?`<button class="btn go" id="next">次の章「${rb(nx.title)}」</button>`:''}<button class="btn${nx?'':' go'}" id="list">章をえらぶ</button><button class="linkbtn" id="again">もう一度この章を</button></div>${PAID?'':PAIDLINK}`;
  document.getElementById('back').onclick=home;
  if(nx)document.getElementById('next').onclick=()=>play(nx);
  document.getElementById('list').onclick=home;
  document.getElementById('again').onclick=()=>play(s);
  top0();
}
async function decrypt(){ return mnAccess.load('k-itnari'); }
function lockScreen(err){ mnAccess.lock(app,{game:'k-itnari',err:err,free:'k-itnari.html',onOpen:async()=>{ ST=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ ST=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
