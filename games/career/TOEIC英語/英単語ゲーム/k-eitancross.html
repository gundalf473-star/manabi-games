*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.7;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 76px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,8vw,40px);line-height:1.15;margin:0;color:var(--ink)}
h1 small{display:block;font-family:var(--body);font-weight:700;font-size:13px;color:var(--accent);letter-spacing:.2em;margin-bottom:4px}
h2{font-size:17px;margin:0;color:var(--ink)}
.lead{margin:4px 0 0;color:var(--muted);font-size:14px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
rt{font-size:.55em;letter-spacing:0}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.label{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.1em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--rule);border-radius:10px;padding:10px 16px;min-height:44px;font-weight:700;cursor:pointer;background:var(--pick);color:var(--fg)}
.btn.go{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.go{color:#0b1a18}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.go{color:#0b1a18}}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--rule);background:var(--surface);border-radius:99px;padding:8px 14px;min-height:42px;font-weight:700;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0b1a18}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0b1a18}}
.note{font-size:13px;color:var(--muted);margin:0}
.seat{display:grid;grid-template-columns:14px 1fr;gap:6px 8px;align-items:center;border:1px solid var(--rule);border-radius:10px;padding:8px 10px}
.seat .dot{width:14px;height:14px;border-radius:50%}
.seat input{width:100%;min-width:0;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--bg);min-height:42px}
.seat select{border:1px solid var(--rule);border-radius:8px;padding:8px;background:var(--bg);min-height:42px;width:100%}
.seat .ctl{grid-column:2;display:flex;gap:6px;align-items:center}
.rec{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.rec b{font-size:20px;color:var(--ink)}
/* ゲーム画面 */
.scores{display:flex;gap:6px;flex-wrap:wrap}
.sc{flex:1 1 0;min-width:72px;border:2px solid var(--rule);border-radius:10px;padding:4px 8px;background:var(--surface);line-height:1.25;position:relative}
.sc.on{border-color:var(--pc);box-shadow:0 0 0 2px var(--pc) inset}
.sc .nm{font-size:12px;font-weight:700;color:var(--pc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.sc .pt{font-size:22px;font-weight:700;font-family:var(--tilefont)}
.sc .pt small{font-size:11px;color:var(--muted);font-weight:400;margin-left:2px}
.sc .sub{display:block;font-size:11px;color:var(--muted)}
.info{display:flex;justify-content:space-between;align-items:center;gap:4px 8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools .btn{min-height:36px;padding:4px 10px;font-size:13px}
.msg{min-height:46px;border-radius:10px;padding:8px 12px;background:var(--accentsoft);font-size:14px;line-height:1.55}
.msg.ng{background:var(--ngsoft);color:var(--fg)}
.msg.ok{background:var(--oksoft)}
.boardwrap{width:100%;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
.board{display:grid;gap:2px;width:100%;max-width:min(560px,max(300px,calc(100vh - 300px)));margin:0 auto;background:var(--cellline);border:2px solid var(--cellline);border-radius:10px;padding:0;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.boardwrap.zoom .board{width:calc(var(--n) * 42px);max-width:none}
.cell{aspect-ratio:1;border:0;background:var(--cell);padding:0;margin:0;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;min-width:0;border-radius:3px;font-family:var(--tilefont);font-weight:700;color:var(--tileink)}
.cell.mid{background:var(--center)}
.cell.t{background:var(--tile);box-shadow:inset 0 -4px 0 var(--oc,var(--tileedge));font-size:var(--fs,16px);cursor:default}
.cell.t.pend{box-shadow:inset 0 0 0 2px var(--accent),inset 0 -4px 0 var(--accent);cursor:pointer}
.cell.t.pend.new{animation:pop .18s ease-out}
.cell.t.cpu{animation:pop .22s ease-out}
.cell.hint{outline:3px dashed var(--gold);outline-offset:-3px;color:var(--gold);font-size:var(--fs,16px)}
.cell.last{box-shadow:inset 0 -4px 0 var(--oc,var(--tileedge)),inset 0 0 0 2px var(--oc)}
.cell.drop{outline:3px solid var(--accent);outline-offset:-3px}

.acts .wide{grid-column:span 3}
.sub2{display:flex;gap:6px;flex-wrap:wrap;justify-content:space-between}
.ghost{position:fixed;pointer-events:none;z-index:200;opacity:.9}

.cover{text-align:center;align-items:center}

.wd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.wd .jp{font-size:18px}
.wd.small .en{font-size:22px}
.wd.small .jp{font-size:15px}
.say{border:1px solid var(--rule);background:var(--pick);border-radius:99px;min-width:44px;min-height:40px;font-size:18px;cursor:pointer}
.gain{font-weight:700;color:var(--ok)}
.rules ol,.rules ul{margin:0;padding-left:1.3em}
.rules li{margin:2px 0}
.rules h3{font-size:15px;margin:8px 0 2px;color:var(--accent)}
.rank{display:flex;flex-direction:column;gap:6px}
.rk{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;border:1px solid var(--rule);border-left:6px solid var(--pc);border-radius:10px;padding:8px 10px;background:var(--surface)}
.rk .n{font-family:var(--display);font-size:22px;color:var(--ink);text-align:center}
.rk .s{font-size:24px;font-weight:700;font-family:var(--tilefont)}
.rk .d{font-size:12px;color:var(--muted)}
.wlist{display:flex;flex-direction:column;gap:2px}
.wl{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--rule);padding:4px 0}
.wl .en{font-family:var(--tilefont);font-weight:700;min-width:6.5em}
.wl .jp{flex:1;font-size:14px}
.wl .say{min-height:36px;min-width:40px;font-size:16px}
details.pw{border:1px solid var(--rule);border-left:6px solid var(--pc);border-radius:10px;padding:8px 12px;background:var(--surface)}
details.pw summary{cursor:pointer;font-weight:700;min-height:32px}
.hide{display:none!important}
/* 低学年：大きめのボタンと文字 */
body.big{font-size:17px}
body.big .btn{min-height:52px;font-size:17px}
body.big .acts .btn{font-size:16px}
body.big .tl{width:min(50px,calc((100vw - 32px - 14px - 35px) / 8));height:56px;font-size:28px}
body.big .seg button{min-height:48px;font-size:16px}
@media (min-width:700px){.tl{width:52px;height:56px;font-size:28px}}
</style>

const PCOL = ['var(--p0)', 'var(--p1)', 'var(--p2)', 'var(--p3)'];
const RB = /(?:｜([^｜《》]+)|([一-鿿々〆ヶ]+))《([^《》]+)》/g;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// ふりがな： 低学年のページはルビ、それ以外は漢字だけ
const H = (s) => esc(s).replace(RB, (m, a, b, r) => KANA ? '<ruby>' + (a || b) + '<rt>' + r + '</rt></ruby>' : (a || b));
const HB = (s) => H(s).replace(/&lt;(\/?)b&gt;/g, '<$1b>');   // ルールの太字（<b>だけ通す）
const P = (s) => String(s).replace(RB, (m, a, b) => a || b);   // 属性やalert用（ルビなし）
const UP = (w) => w.toUpperCase();
const track = (n, p) => { try { window.mnTrack && window.mnTrack(n, p); } catch (e) {} };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};
const REC_KEY = 'eitan-cross-' + CFG.course + '-rec', SET_KEY = 'eitan-cross-' + CFG.course + '-setup';
const ID = CFG.id;
const meaningOf = (x) => (KANA ? (x.k || x.m) : x.m);

/* ---------- 音声（英語の読み上げ） ---------- */
const TTS = (() => { try { return 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined'; } catch (e) { return false; } })();
let enVoice = null;
function pickVoice() { try { const vs = speechSynthesis.getVoices() || []; enVoice = vs.find((v) => v.lang === 'en-US') || vs.find((v) => /^en/i.test(v.lang)) || null; } catch (e) {} }
if (TTS) { pickVoice(); try { speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {} }
function speak(w) {
  if (!TTS) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(w); u.lang = 'en-US'; u.rate = 0.85; if (enVoice) u.voice = enVoice; speechSynthesis.speak(u); } catch (e) {}
}
const sayBtn = (w) => TTS ? `<button type="button" class="say" data-say="${esc(w)}" aria-label="${esc(w)} の発音を聞く">🔊</button>` : '';
document.addEventListener('click', (ev) => { const b = ev.target.closest('[data-say]'); if (b) { ev.preventDefault(); speak(b.getAttribute('data-say')); } });

/* ---------- 設定 ---------- */
const defSeats = (mode) => mode === 'solo'
  ? [{ name: 'あなた', kind: 'human', cpu: 'normal' }, { name: 'コンピューターA', kind: 'cpu', cpu: 'normal' }]
  : [{ name: 'プレイヤー1', kind: 'human', cpu: 'normal' }, { name: 'プレイヤー2', kind: 'human', cpu: 'normal' }, { name: 'プレイヤー3', kind: 'human', cpu: 'normal' }];
let S = Object.assign({ mode: 'solo', seats: defSeats('solo'), level: CFG.level, rule: CFG.rule, theme: -1, bonus: true }, store.get(SET_KEY, {}) || {});
if (!CFG.levels.includes(S.level)) S.level = CFG.level;
if (!Array.isArray(S.seats) || S.seats.length < 2 || S.seats.length > 4) S.seats = defSeats(S.mode);
S.seats = S.seats.map((x) => ({ name: String(x.name || '').slice(0, 12) || 'プレイヤー', kind: x.kind === 'cpu' ? 'cpu' : 'human', cpu: CPU_LV[x.cpu] ? x.cpu : 'normal' }));
if (S.rule !== 'adv') S.rule = 'easy';
const saveSetup = () => store.set(SET_KEY, S);
const themeOK = (L) => E.themeCounts(DATA, L).map((n) => n >= 60);
function fixTheme() { if (S.theme >= 0 && !themeOK(S.level)[S.theme]) S.theme = -1; }

function renderSetup() {
  fixTheme();
  const rec = store.get(REC_KEY, null) || {};
  const ok = themeOK(S.level);
  const levelBtns = CFG.levels.map((L) => `<button type="button" data-lv="${L}" aria-pressed="${S.level === L}">${H(LEVELS[L])}</button>`).join('');
  const themeBtns = [`<button type="button" data-th="-1" aria-pressed="${S.theme < 0}">すべて</button>`]
    .concat(THEMES.map((t, i) => ok[i] ? `<button type="button" data-th="${i}" aria-pressed="${S.theme === i}">${H(t)}</button>` : '')).join('');
  const nTheme = ok.filter(Boolean).length;
  const seats = S.seats.map((s, i) => `<div class="seat" style="--pc:${PCOL[i]}"><span class="dot" style="background:${PCOL[i]}"></span>
      <input type="text" maxlength="12" value="${esc(s.name)}" data-name="${i}" aria-label="${i + 1}人目の名前">
      <span class="ctl"><select data-kind="${i}" aria-label="${i + 1}人目は人かコンピューターか"><option value="human"${s.kind === 'human' ? ' selected' : ''}>${P('人《ひと》')}</option>
        <option value="cpu:weak"${s.kind === 'cpu' && s.cpu === 'weak' ? ' selected' : ''}>コンピューター（よわい）</option>
        <option value="cpu:normal"${s.kind === 'cpu' && s.cpu === 'normal' ? ' selected' : ''}>コンピューター（ふつう）</option>
        <option value="cpu:strong"${s.kind === 'cpu' && s.cpu === 'strong' ? ' selected' : ''}>コンピューター（つよい）</option></select></span></div>`).join('');
  const nH = S.seats.filter((s) => s.kind === 'human').length;
  app.innerHTML = `
  <header>
    <h1><small>${H(CFG.kicker)}</small>えいたんクロス</h1>
    <p class="lead">${H('アルファベットのタイルで、英単語《えいたんご》をたて・よこに組《く》み立《た》てよう。ばんの上《うえ》の文字《もじ》を1つ使《つか》って単語《たんご》を作《つく》り、たくさんタイルを置《お》いた人《ひと》の勝《か》ち！')}</p>
  </header>
  <section class="box">
    <div class="label">${H('だれと あそぶ？')}</div>
    <div class="seg" id="mode"><button type="button" data-mode="solo" aria-pressed="${S.mode === 'solo'}">${H('ひとりで（コンピューターと）')}</button><button type="button" data-mode="group" aria-pressed="${S.mode === 'group'}">${H('みんなで（1台《だい》を回《まわ》す）')}</button></div>
    <div style="display:flex;flex-direction:column;gap:6px">${seats}</div>
    <div class="row"><button type="button" class="btn sm" id="addseat" ${S.seats.length >= 4 ? 'disabled' : ''}>＋ ${H('人数《にんずう》をふやす')}</button><button type="button" class="btn sm" id="delseat" ${S.seats.length <= 2 ? 'disabled' : ''}>− ${H('へらす')}</button></div>
    <p class="note">${nH === 0 ? H('人《ひと》が｜1人《ひとり》もいません。｜1人《ひとり》は「人《ひと》」にしてね。') : nH >= 2 ? H('人《ひと》が｜2人《ふたり》以上《いじょう》のときは、番《ばん》がかわるたびに「つぎは○○さん」の画面《がめん》が出《で》ます。手《て》もとのタイルを見《み》せないように、交代《こうたい》してね。') : H('コンピューターの強《つよ》さは よわい・ふつう・つよい からえらべます。')}</p>
  </section>
  <section class="box">
    <div class="label">${H('単語《たんご》のレベル')}</div>
    <div class="seg" id="levels">${levelBtns}</div>
    <p class="note">${H('えらんだレベルと、それよりやさしいレベルの単語《たんご》が使《つか》えます。')}（${E.buildDict(DATA, { level: S.level, theme: -1 }).list.length}${H('語《ご》')}）</p>
    <div class="label">${H('ルール')}</div>
    <div class="seg" id="rules"><button type="button" data-rule="easy" aria-pressed="${S.rule === 'easy'}">${H('簡単《かんたん》ルール')}</button><button type="button" data-rule="adv" aria-pressed="${S.rule === 'adv'}">${H('上級《じょうきゅう》ルール')}</button></div>
    <p class="note">${S.rule === 'easy' ? H('簡単《かんたん》：ばんの文字《もじ》1つと交《まじ》わるように、たてか よこに1語《ご》。となりにくっついたら、そこも単語《たんご》になっていればOK。') : H('上級《じょうきゅう》：くっつけて置《お》いてもOK。できた たて・よこのならびが、ぜんぶ単語《たんご》になっていること。')}</p>
    <div class="label">${H('テーマ')}</div>
    <div class="seg" id="themes">${themeBtns}</div>
    ${nTheme ? '' : `<p class="note">${H('このレベルには、テーマモードに使《つか》えるだけの単語《たんご》（60語《ご》以上《いじょう》）があるテーマがありません。')}</p>`}
    <div class="label">${H('ボーナス（5文字《もじ》以上《いじょう》の単語《たんご》）')}</div>
    <div class="seg" id="bonus"><button type="button" data-bonus="1" aria-pressed="${S.bonus}">${H('ボーナスあり')}</button><button type="button" data-bonus="0" aria-pressed="${!S.bonus}">${H('ボーナスなし')}</button></div>
  </section>
  <div class="row"><button type="button" class="btn go" id="start" style="flex:1;font-size:18px" ${nH ? '' : 'disabled'}>${H('はじめる')}</button><button type="button" class="btn" id="showrules">${H('ルール')}</button></div>
  ${rec.games ? `<section class="box"><div class="label">${H('この端末《たんまつ》の記録《きろく》')}</div><div class="rec"><span>${H('ベスト')} <b>${rec.best || 0}</b> ${H('点《てん》')}</span><span>${H('つくった単語《たんご》')} <b>${rec.words || 0}</b> ${H('語《ご》')}</span><span>${H('あそんだ回数《かいすう》')} <b>${rec.games}</b></span></div></section>` : ''}`;
  app.querySelectorAll('[data-mode]').forEach((b) => b.onclick = () => { if (S.mode === b.dataset.mode) return; S.mode = b.dataset.mode; S.seats = defSeats(S.mode); saveSetup(); renderSetup(); });
  app.querySelectorAll('[data-lv]').forEach((b) => b.onclick = () => { S.level = +b.dataset.lv; saveSetup(); renderSetup(); });
  app.querySelectorAll('[data-th]').forEach((b) => b.onclick = () => { S.theme = +b.dataset.th; saveSetup(); renderSetup(); });
  app.querySelectorAll('[data-rule]').forEach((b) => b.onclick = () => { S.rule = b.dataset.rule; saveSetup(); renderSetup(); });
  app.querySelectorAll('[data-bonus]').forEach((b) => b.onclick = () => { S.bonus = b.dataset.bonus === '1'; saveSetup(); renderSetup(); });
  app.querySelectorAll('[data-name]').forEach((inp) => inp.oninput = () => { S.seats[+inp.dataset.name].name = inp.value.slice(0, 12); saveSetup(); });
  app.querySelectorAll('[data-kind]').forEach((sel) => sel.onchange = () => { const s = S.seats[+sel.dataset.kind], v = sel.value; if (v === 'human') s.kind = 'human'; else { s.kind = 'cpu'; s.cpu = v.split(':')[1]; }
    if (s.kind === 'cpu' && /^プレイヤー|^あなた/.test(s.name)) s.name = 'コンピューター' + 'ABCD'[+sel.dataset.kind];
    if (s.kind === 'human' && /^コンピューター/.test(s.name)) s.name = 'プレイヤー' + (+sel.dataset.kind + 1);
    saveSetup(); renderSetup(); });
  document.getElementById('addseat').onclick = () => { const i = S.seats.length; S.seats.push(S.mode === 'solo' ? { name: 'コンピューター' + 'ABCD'[i], kind: 'cpu', cpu: 'normal' } : { name: 'プレイヤー' + (i + 1), kind: 'human', cpu: 'normal' }); saveSetup(); renderSetup(); };
  document.getElementById('delseat').onclick = () => { S.seats.pop(); saveSetup(); renderSetup(); };
  document.getElementById('start').onclick = startGame;
  document.getElementById('showrules').onclick = showRules;
}

/* ---------- ルールの画面 ---------- */

function showRules() {
  overlay(`<h2>${H('ルール')}</h2>${rulesHtml()}<button type="button" class="btn go" data-close>${H('とじる')}</button>`);
}
let ovEl = null;
function overlay(html, opt) {
  closeOverlay();
  opt = opt || {};
  ovEl = document.createElement('div');
  ovEl.className = 'ov';
  ovEl.innerHTML = `<div class="card ${opt.cls || ''}" role="dialog" aria-modal="true" ${opt.style ? `style="${opt.style}"` : ''}>${html}</div>`;
  document.body.appendChild(ovEl);
  ovEl.addEventListener('click', (ev) => { const c = ev.target.closest('[data-close]'); if (c) { closeOverlay(); opt.onclose && opt.onclose(); } });
  const f = ovEl.querySelector('[data-close],.btn'); if (f) setTimeout(() => { try { f.focus(); } catch (e) {} }, 30);
  return ovEl;
}
function closeOverlay() { if (ovEl) { ovEl.remove(); ovEl = null; } }

/* ---------- ゲーム ---------- */
let G = null;
function startGame() {
  const dict = E.buildDict(DATA, { level: S.level, theme: S.theme, plural: S.rule === 'adv' });
  if (dict.list.length < 20) { alert('単語が少なすぎます。テーマを「すべて」にしてください。'); return; }
  const players = S.seats.map((s, i) => ({ name: (s.name || '').trim() || (s.kind === 'cpu' ? 'コンピューター' : 'プレイヤー' + (i + 1)), kind: s.kind, cpu: s.cpu, color: PCOL[i] }));
  const st = E.newGame({ dict, rule: S.rule, bonus: S.bonus, N: CFG.N, handSize: CFG.hand, noQXZ: CFG.noQXZ, players });
  G = { st, pend: [], sel: null, mode: 'place', swapSel: [], hint: null, busy: false, msg: '', msgCls: '', zoom: false, last: [], cpuShow: [] };
  G.humans = players.filter((p) => p.kind === 'human').length;
  track('level_start', { level_name: ID + '-' + LVKEY[S.level] + '-' + S.rule + (S.theme >= 0 ? '-t' + S.theme : '') });
  setMsg(H(`はじめの単語《たんご》は「${UP(st.startWord)}」（${meaningOf(dict.get(st.startWord))}）。`), '');
  beginTurn();
}
function setMsg(html, cls) { G.msg = html; G.msgCls = cls || ''; const m = document.getElementById('msg'); if (m) { m.innerHTML = html; m.className = 'msg ' + (cls || ''); } }
const curP = () => G.st.players[G.st.turn];

function beginTurn() {
  const st = G.st;
  G.pend = []; G.sel = null; G.mode = 'place'; G.swapSel = []; G.hint = null;
  const p = curP();
  if (p.kind === 'cpu') { renderGame(); cpuTurn(); return; }
  if (G.humans >= 2) {
    renderGame(true);
    overlay(`<div class="cover" style="--pc:${p.color};display:flex;flex-direction:column;gap:10px;align-items:center">
      <p class="note">${H(`ラウンド ${st.round} / ${st.roundCap}`)}</p>
      <div class="big">${H('つぎは')} ${esc(p.name)} ${H('さん')}</div>
      <p class="note">${H('ほかの人《ひと》は、画面《がめん》を見《み》ないでね。')}</p>
      ${G.lastNote ? `<p class="msg" style="width:100%">${G.lastNote}</p>` : ''}
      <button type="button" class="btn go" data-close style="min-width:12em">${H('はじめる')}</button></div>`, { cls: 'cover', onclose: () => { renderGame(); } });
    return;
  }
  renderGame();
}

function scoresHtml() {
  const st = G.st;
  return st.players.map((p, i) => `<div class="sc ${i === st.turn && !st.over ? 'on' : ''}" style="--pc:${p.color}"><span class="nm">${i === st.turn && !st.over ? '▶ ' : ''}${esc(p.name)}</span>
    <span class="pt">${p.score}<small>${H('点《てん》')}</small></span><span class="sub">${H('手《て》もと')} ${p.hand.length}${H('枚《まい》')}${p.kind === 'cpu' ? '・' + CPU_LV[p.cpu] : ''}</span></div>`).join('');
}
function renderGame(hidden) {
  const st = G.st, p = curP(), N = st.N, human = p.kind === 'human';
  const pk = new Map(G.pend.map((t) => [t.r * N + t.c, t]));
  const hk = new Map(G.hint ? G.hint.tiles.map((t) => [t.r * N + t.c, t]) : []);
  const ck = new Map(G.cpuShow.map((t) => [t.r * N + t.c, t]));
  const lastK = new Set(G.last);
  const mid = Math.floor(N / 2);
  let cells = '';
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const k = r * N + c, b = st.board[r][c], pd = pk.get(k), h = hk.get(k), cp = ck.get(k);
    const lbl = `${r + 1}行${c + 1}列`;
    if (b) {
      const oc = b.o >= 0 ? st.players[b.o].color : 'var(--pstart)';
      cells += `<div class="cell t${lastK.has(k) ? ' last' : ''}" style="--oc:${oc}" role="img" aria-label="${lbl} ${UP(b.ch)}">${UP(b.ch)}</div>`;
    } else if (pd) cells += `<button type="button" class="cell t pend${pd.n ? ' new' : ''}" style="--oc:${p.color}" data-cell="${k}" aria-label="${lbl} ${UP(pd.ch)}（タップでもどす）">${UP(pd.ch)}</button>`;
    else if (cp) cells += `<div class="cell t cpu" style="--oc:${p.color}" aria-label="${lbl} ${UP(cp.ch)}">${UP(cp.ch)}</div>`;
    else cells += `<button type="button" class="cell${r === mid && c === mid ? ' mid' : ''}${h ? ' hint' : ''}" data-cell="${k}" aria-label="${lbl}${h ? ' ヒント ' + UP(h.ch) : ' あき'}">${h ? UP(h.ch) : ''}</button>`;
  }
  G.pend.forEach((t) => { t.n = false; });
  const used = new Set(G.pend.map((t) => t.hi));
  let rack = '';
  if (hidden) rack = p.hand.map(() => `<span class="tl back">?</span>`).join('');
  else if (!human) rack = p.hand.map(() => `<span class="tl back" aria-hidden="true">?</span>`).join('') + `<span class="note" style="width:100%;text-align:center">${esc(p.name)} ${H('の番《ばん》です')}</span>`;
  else rack = p.hand.map((ch, i) => used.has(i) ? '' : `<button type="button" class="tl" data-hi="${i}" style="--pcol:${p.color}" aria-pressed="${G.mode === 'swap' ? G.swapSel.includes(i) : G.sel === i}" aria-label="タイル ${UP(ch)}">${UP(ch)}</button>`).join('') || `<span class="note">${H('ぜんぶ置《お》いたよ。「決定《けってい》」をおしてね')}</span>`;
  const dis = !human || G.busy || hidden ? 'disabled' : '';
  let acts;
  if (G.mode === 'swap') {
    acts = `<button type="button" class="btn go wide" id="doswap" ${dis} ${G.swapSel.length ? '' : 'disabled'}>${H(`この${G.swapSel.length}枚《まい》を交換《こうかん》する`)}</button>
      <button type="button" class="btn wide" id="cancelswap" ${dis}>${H('交換《こうかん》をやめる')}</button>`;
  } else {
    acts = `<button type="button" class="btn go wide" id="ok" ${dis} ${G.pend.length ? '' : 'disabled'}>${H('決定《けってい》')}</button>
      <button type="button" class="btn" id="undo" ${dis} ${G.pend.length ? '' : 'disabled'}>${H('もどす')}</button>
      <button type="button" class="btn" id="hint" ${dis}>${H('ヒント')}<small style="font-weight:400">（−1）</small></button>
      <button type="button" class="btn" id="mix" ${dis}>${H('まぜる')}</button>
      <button type="button" class="btn" id="pass" ${dis}>${H('パス')}<small style="font-weight:400">${st.bag.length ? H('（＋1枚《まい》）') : ''}</small></button>
      <button type="button" class="btn" id="swap" ${dis} ${st.bag.length ? '' : 'disabled'}>${H('交換《こうかん》')}</button>
      ${G.hint ? `<button type="button" class="btn" id="usehint" ${dis}>${H('ヒントどおり置《お》く')}</button>` : '<span></span>'}`;
  }
  const lvName = H(LEVELS[S.level]) + (S.theme >= 0 ? '・' + H(THEMES[S.theme]) : '') + '・' + (st.rule === 'easy' ? H('簡単《かんたん》') : H('上級《じょうきゅう》'));
  app.innerHTML = `
  <div class="scores" aria-live="polite">${scoresHtml()}</div>
  <div class="info"><span>${lvName}・${H('ふくろ')} ${st.bag.length}${H('枚《まい》')}・${H('ラウンド')} ${st.round}/${st.roundCap}</span>
    <span class="tools"><button type="button" class="btn sm" id="zoom">${G.zoom ? H('ばんを戻《もど》す') : H('ばんを大《おお》きく')}</button><button type="button" class="btn sm" id="rulesbtn">${H('ルール')}</button><button type="button" class="btn sm" id="quit">${H('やめる')}</button></span></div>
  <div id="msg" class="msg ${G.msgCls}" aria-live="polite">${G.msg}</div>
  <div class="boardwrap${G.zoom ? ' zoom' : ''}" id="bw"><div class="board" id="board" style="--n:${N};grid-template-columns:repeat(${N},1fr)">${cells}</div></div>
  <div class="rack" id="rack">${rack}</div>
  <div class="acts">${acts}</div>`;
  fitFont();
  bindGame();
}
function fitFont() {
  const b = document.getElementById('board'); if (!b) return;
  const w = b.getBoundingClientRect().width / G.st.N;
  b.style.setProperty('--fs', Math.max(11, Math.round(w * 0.58)) + 'px');
}
addEventListener('resize', () => { if (G && document.getElementById('board')) fitFont(); });

function bindGame() {
  const st = G.st, p = curP();
  const q = (id) => document.getElementById(id);
  q('zoom').onclick = () => { G.zoom = !G.zoom; renderGame(); };
  q('rulesbtn').onclick = showRules;
  q('quit').onclick = () => {
    overlay(`<h2>${H('ゲームをやめますか？')}</h2><p>${H('ここまでの結果《けっか》を見《み》て、おわりにします。')}</p>
      <div class="row"><button type="button" class="btn go" id="qyes">${H('やめて結果《けっか》を見《み》る')}</button><button type="button" class="btn" data-close>${H('つづける')}</button></div>`);
    document.getElementById('qyes').onclick = () => { closeOverlay(); st.over = true; st.reason = 'quit'; renderEnd(); };
  };
  if (p.kind !== 'human' || G.busy) return;
  const board = q('board');
  board.onclick = (ev) => {
    const c = ev.target.closest('[data-cell]'); if (!c) return;
    const k = +c.dataset.cell, r = Math.floor(k / st.N), cc = k % st.N;
    tapCell(r, cc);
  };
  q('rack').onclick = (ev) => {
    const t = ev.target.closest('[data-hi]'); if (!t) return;
    if (G._dragged) { G._dragged = false; return; }
    const i = +t.dataset.hi;
    if (G.mode === 'swap') {
      const j = G.swapSel.indexOf(i);
      if (j >= 0) G.swapSel.splice(j, 1);
      else if (G.swapSel.length < Math.min(3, st.bag.length)) G.swapSel.push(i);
      else setMsg(H(`交換《こうかん》できるのは${Math.min(3, st.bag.length)}枚《まい》までです。`), 'ng');
      renderGame(); return;
    }
    G.sel = G.sel === i ? null : i;
    if (G.sel != null && !G.pend.length) setMsg(H(`「${UP(p.hand[i])}」をえらんだよ。置《お》きたいマスをタップしてね。`), '');
    renderGame();
  };
  bindDrag();
  if (G.mode === 'swap') {
    q('doswap').onclick = doSwap;
    q('cancelswap').onclick = () => { G.mode = 'place'; G.swapSel = []; setMsg(H('交換《こうかん》をやめました。'), ''); renderGame(); };
    return;
  }
  q('ok').onclick = submit;
  q('undo').onclick = () => { G.pend = []; G.sel = null; setMsg(H('タイルを手《て》もとにもどしたよ。'), ''); renderGame(); };
  q('hint').onclick = doHint;
  q('mix').onclick = () => { if (G.pend.length) { G.pend = []; } G.sel = null; E.shuffle(p.hand, Math.random); renderGame(); };
  q('pass').onclick = doPass;
  q('swap').onclick = () => { G.pend = []; G.sel = null; G.mode = 'swap'; G.swapSel = []; setMsg(H(`交換《こうかん》するタイルを${Math.min(3, st.bag.length)}枚《まい》までえらんでね。`), ''); renderGame(); };
  if (q('usehint')) q('usehint').onclick = () => {
    const h = G.hint; G.pend = []; const usedI = new Set();
    for (const t of h.tiles) { const i = p.hand.findIndex((ch, j) => ch === t.ch && !usedI.has(j)); if (i < 0) return; usedI.add(i); G.pend.push({ r: t.r, c: t.c, ch: t.ch, hi: i }); }
    G.hint = null; setMsg(H('ヒントのとおりに置《お》いたよ。「決定《けってい》」をおしてね。'), ''); renderGame();
  };
}
function tapCell(r, c) {
  const st = G.st, p = curP();
  if (G.mode === 'swap') return;
  const pi = G.pend.findIndex((t) => t.r === r && t.c === c);
  if (pi >= 0) { G.pend.splice(pi, 1); renderGame(); return; }
  if (st.board[r][c]) return;
  if (G.sel == null) {
    const free = p.hand.map((_, i) => i).filter((i) => !G.pend.some((t) => t.hi === i));
    if (!free.length) return;
    setMsg(H('先《さき》に、下《した》のタイルを1枚《まい》えらんでね。'), ''); return;
  }
  G.pend.push({ r, c, ch: p.hand[G.sel], hi: G.sel, n: true });
  G.sel = null;
  // つぎのタイルを自動《じどう》ではえらばない（まちがえて置《お》かないように）
  renderGame();
}
/* パソコンのマウスでは、タイルをドラッグしてマスに置ける */
function bindDrag() {
  const rack = document.getElementById('rack');
  rack.querySelectorAll('[data-hi]').forEach((el) => {
    el.addEventListener('pointerdown', (ev) => {
      if (ev.pointerType !== 'mouse' || ev.button !== 0 || G.mode !== 'place') return;
      const i = +el.dataset.hi, sx = ev.clientX, sy = ev.clientY; let gh = null, over = null;
      const mv = (e) => {
        if (!gh && Math.hypot(e.clientX - sx, e.clientY - sy) < 6) return;
        if (!gh) { gh = el.cloneNode(true); gh.classList.add('ghost'); document.body.appendChild(gh); }
        gh.style.left = (e.clientX - 23) + 'px'; gh.style.top = (e.clientY - 25) + 'px';
        const t = document.elementFromPoint(e.clientX, e.clientY), c = t && t.closest && t.closest('.cell[data-cell]');
        if (over && over !== c) over.classList.remove('drop');
        over = c && !c.classList.contains('t') ? c : null; if (over) over.classList.add('drop');
      };
      const up = (e) => {
        removeEventListener('pointermove', mv); removeEventListener('pointerup', up);
        if (gh) { gh.remove(); G._dragged = true; setTimeout(() => { G._dragged = false; }, 0);
          if (over) { const k = +over.dataset.cell; G.sel = i; tapCell(Math.floor(k / G.st.N), k % G.st.N); } }
      };
      addEventListener('pointermove', mv); addEventListener('pointerup', up);
    });
  });
}

const ERR = {
  none: '下《した》のタイルをえらんで、ばんのマスに置《お》いてね。',
  out: 'そこには置《お》けないよ。', occupied: 'そこには置《お》けないよ。',
  line: 'タイルは、たてか よこの1列《れつ》にならべてね。',
  gap: 'タイルとタイルの間《あいだ》があいているよ。つづけて置《お》いてね。',
  noBoardEasy: 'ばんの上《うえ》の文字《もじ》を1つ使《つか》って、交《まじ》わるように単語《たんご》を作《つく》ってね。',
  noBoardAdv: 'ばんの上《うえ》のタイルに、くっつけて置《お》いてね。',
  tooMany: '簡単《かんたん》ルールでは、ばんの文字《もじ》はちょうど1つだけ使《つか》うよ（単語《たんご》の前《まえ》や後《うし》ろにつなげて長《なが》くするのもなし）。',
  hand: 'そのタイルは持《も》っていないよ。',
};
function submit() {
  const st = G.st, p = curP();
  const tiles = G.pend.map((t) => ({ r: t.r, c: t.c, ch: t.ch }));
  const res = E.place(st, tiles);
  if (!res.ok) {
    if (res.err === 'notWord') {
      G.pend = []; G.sel = null;
      setMsg(H(`${res.cross ? 'となりとくっついてできた' : ''}「${UP(res.word)}」は、このレベルの単語《たんご》リストにないみたい。タイルを手《て》もとにもどしたよ。もう一度《いちど》やってみよう！`), 'ng');
    } else setMsg(H(ERR[res.err === 'noBoard' ? (st.rule === 'easy' ? 'noBoardEasy' : 'noBoardAdv') : res.err] || ERR.none), 'ng');
    renderGame(); return;
  }
  G.last = tiles.map((t) => t.r * st.N + t.c);
  G.pend = [];
  for (const w of res.words) track('answer_question', { correct: true, question: w.w });
  showWord(res, p, false, () => advance(`${esc(p.name)}：${UP(res.main)}（+${res.gain}${H('点《てん》')}）`));
}
function wordRows(res, small) {
  return res.words.map((w) => `<div class="wd ${small || !w.main ? 'small' : ''}"><span class="en" lang="en">${esc(w.w)}</span>${sayBtn(w.w)}<span class="jp">${esc(meaningOf(w.entry))}</span></div>`).join('');
}
function showWord(res, p, auto, cb) {
  const gainTxt = `+${res.gain}${H('点《てん》')}（${H('タイル')}${res.tilesUsed}${H('枚《まい》')}${res.bonus ? '＋' + H('ボーナス') + res.bonus : ''}）`;
  overlay(`<div style="--pc:${p.color}"><p class="note" style="color:${p.color};font-weight:700">${esc(p.name)}</p></div>
    ${wordRows(res)}
    <p class="gain">${gainTxt}</p>
    <button type="button" class="btn go" data-close>${auto ? H('つぎへ') : H('OK')}</button>`, { onclose: () => { clearTimeout(G._t); cb && cb(); } });
  if (!auto) speak(res.main);
  if (auto) G._t = setTimeout(() => { if (ovEl) { closeOverlay(); cb && cb(); } }, 2200);
}
function info(html, cb, auto) {
  overlay(`${html}<button type="button" class="btn go" data-close>${H('OK')}</button>`, { onclose: () => { clearTimeout(G._t); cb && cb(); } });
  if (auto) G._t = setTimeout(() => { if (ovEl) { closeOverlay(); cb && cb(); } }, auto);
}
function doHint() {
  const st = G.st;
  G.pend = []; G.sel = null;
  if (G.hint) {   // 同じ番に2回おしても、同じヒントをもう一度見せるだけ（2回目は点数をへらさない）
    const e0 = st.dict.get(G.hint.word);
    setMsg(H(`ヒント：「${UP(G.hint.word)}」（${meaningOf(e0)}）を、点線《てんせん》のマスに置《お》けるよ。`), '');
    renderGame(); return;
  }
  const m = E.hint(st);
  if (!m) { setMsg(H('いまの手《て》もとでは、置《お》ける場所《ばしょ》が見《み》つからないよ。パスか交換《こうかん》をしよう（点数《てんすう》はへらないよ）。'), ''); renderGame(); return; }
  E.useHint(st);
  G.hint = m;
  const e = st.dict.get(m.word);
  setMsg(H(`ヒント：「${UP(m.word)}」（${meaningOf(e)}）を、点線《てんせん》のマスに置《お》けるよ。（−1点《てん》）`), '');
  renderGame();
}
function doPass() {
  const st = G.st, p = curP();
  G.pend = []; G.sel = null;
  const full = st.bag.length && p.hand.length >= st.maxHand;
  const r = E.pass(st);
  const txt = r.drew ? H('パスして、タイルを1枚《まい》もらったよ。') : full ? H(`手《て》もとが${st.maxHand}枚《まい》でいっぱいなので、もらわずにパスしたよ。`) : H('ふくろが空《から》なので、そのままパスしたよ。');
  info(`<h2>${H('パス')}</h2><p>${txt}</p>`, () => advance(`${esc(p.name)}：${H('パス')}`));
}
function doSwap() {
  const st = G.st, p = curP();
  const r = E.swap(st, G.swapSel);
  G.mode = 'place'; G.swapSel = [];
  if (!r.ok) { setMsg(H('交換《こうかん》できませんでした。'), 'ng'); renderGame(); return; }
  info(`<h2>${H('交換《こうかん》')}</h2><p>${H(`${r.n}枚《まい》を交換《こうかん》したよ。`)}</p><p style="font-family:var(--tilefont);font-size:22px;font-weight:700">${r.out.map(UP).join(' ')} → ${r.got.map(UP).join(' ')}</p>`, () => advance(`${esc(p.name)}：${H('交換《こうかん》')} ${r.n}${H('枚《まい》')}`));
}
function advance(note) {
  const st = G.st;
  G.lastNote = note || '';
  if (st.over) { renderEnd(); return; }
  E.next(st);
  if (st.over) { renderEnd(); return; }
  setMsg(note || '', '');
  beginTurn();
}

/* ---------- コンピューターの番 ---------- */
function cpuTurn() {
  const st = G.st, p = curP();
  G.busy = true;
  setMsg(esc(p.name) + H(' が考《かんが》えています…'), '');
  renderGame();
  setTimeout(() => {
    const ch = E.cpuChoose(st, p.cpu);
    if (ch.type === 'place') {
      const tiles = ch.move.tiles.slice();
      let k = 0;
      const step = () => {
        if (k < tiles.length) { G.cpuShow.push(tiles[k++]); renderGame(); setTimeout(step, 260); return; }
        G.cpuShow = [];
        const res = E.place(st, tiles);
        G.busy = false;
        if (!res.ok) { advance(); return; }   // 念のため
        G.last = tiles.map((t) => t.r * st.N + t.c);
        renderGame();
        showWord(res, p, true, () => advance(`${esc(p.name)}：${UP(res.main)}（+${res.gain}${H('点《てん》')}）`));
      };
      step();
    } else if (ch.type === 'swap') {
      const r = E.swap(st, ch.idx);
      G.busy = false;
      info(`<p><b style="color:${p.color}">${esc(p.name)}</b> ${H(`は タイルを${r.n || 0}枚《まい》交換《こうかん》しました。`)}</p>`, () => advance(`${esc(p.name)}：${H('交換《こうかん》')}`), 1500);
    } else {
      const r = E.pass(st);
      G.busy = false;
      info(`<p><b style="color:${p.color}">${esc(p.name)}</b> ${r.drew ? H('は パスして、タイルを1枚《まい》もらいました。') : H('は パスしました。')}</p>`, () => advance(`${esc(p.name)}：${H('パス')}`), 1500);
    }
  }, 650);
}

/* ---------- おわり ---------- */
function renderEnd() {
  closeOverlay();
  const st = G.st;
  const R = E.ranking(st);
  const why = { out: 'タイルを使《つか》いきった人《ひと》がいたので、おわり！', pass: 'ふくろが空《から》で、全員《ぜんいん》がパスしたので、おわり！', cap: '30ラウンドになったので、おわり！', stall: '全員《ぜんいん》が2回《かい》つづけてパスしたので、おわり！', quit: 'ゲームをやめました。' }[st.reason] || 'おわり！';
  // 記録（この端末だけ）
  const humans = st.players.filter((p) => p.kind === 'human');
  const rec = store.get(REC_KEY, null) || {};
  const best = Math.max(rec.best || 0, ...humans.map((p) => p.score));
  const newBest = humans.some((p) => p.score > (rec.best || 0) && p.score > 0);
  const nw = humans.reduce((a, p) => a + p.words.length, 0);
  store.set(REC_KEY, { best, words: (rec.words || 0) + nw, games: (rec.games || 0) + 1, last: new Date().toISOString().slice(0, 10) });
  track('level_end', { level_name: ID + '-' + LVKEY[S.level] + '-' + st.rule + (S.theme >= 0 ? '-t' + S.theme : ''), success: true });
  const top = R.filter((x) => x.rank === 1).map((x) => esc(x.p.name));
  const rows = R.map((x) => `<div class="rk" style="--pc:${x.p.color}"><span class="n">${x.rank}</span><span><b>${esc(x.p.name)}</b>${x.p.kind === 'cpu' ? `<span class="d">（${CPU_LV[x.p.cpu]}）</span>` : ''}<br>
      <span class="d">${H('タイル')} ${x.p.tiles}${H('枚《まい》')}・${H('ボーナス')} ${x.p.bonus}・${H('ヒント')} ${x.p.hints}${H('回《かい》')}・${H('単語《たんご》')} ${x.p.words.length}</span></span><span class="s">${x.p.score}<small style="font-size:12px">${H('点《てん》')}</small></span></div>`).join('');
  const lists = st.players.map((p, i) => {
    const seen = new Set(), ws = p.words.filter((w) => !seen.has(w.w) && seen.add(w.w));
    return `<details class="pw" style="--pc:${p.color}" ${p.kind === 'human' || st.players.every((q) => q.kind === 'cpu') ? 'open' : ''}><summary>${esc(p.name)}（${ws.length}${H('語《ご》')}）</summary>
      <div class="wlist">${ws.length ? ws.map((w) => `<div class="wl"><span class="en" lang="en">${esc(w.w)}</span>${sayBtn(w.w)}<span class="jp">${esc(KANA ? (w.k || w.m) : w.m)}</span></div>`).join('') : `<p class="note">${H('まだ単語《たんご》はありません。')}</p>`}</div></details>`;
  }).join('');
  app.innerHTML = `
  <header><h1><small>${H('結果《けっか》')}</small>${top.length > 1 ? H('同点《どうてん》で') + ' ' + top.join('・') + ' ' + H('の勝《か》ち！') : top[0] + ' ' + H('の勝《か》ち！')}</h1>
  <p class="lead">${H(why)}</p></header>
  ${newBest ? `<div class="msg ok">${H(`この端末《たんまつ》のベスト記録《きろく》（${best}点《てん》）！`)}</div>` : ''}
  <section class="rank">${rows}</section>
