const FEM=/female|samantha|zira|aria|jenny|ava|allison|susan|karen|victoria|joanna|salli|kendra|kimberly|ivy|emma|michelle/i, MAL=/(^|\W)male|david|mark|guy|alex|fred|daniel|tom|matthew|joey|justin|christopher|eric|roger|steffan|aaron/i;
const pickV=()=>{try{const v=speechSynthesis.getVoices().filter(x=>/^en[-_]US/i.test(x.lang));const all=speechSynthesis.getVoices();
  V0=v[0]||all.find(x=>/^en/i.test(x.lang))||null; VF=v.find(x=>FEM.test(x.name)&&!/male/i.test(x.name.replace(/female/i,'')))||null; VM=v.find(x=>MAL.test(x.name)&&!/female/i.test(x.name))||null;}catch(e){}};
if(TTS){pickV();try{speechSynthesis.addEventListener('voiceschanged',pickV);}catch(e){}}
const spk=t=>String(t).replace(/(\d)-(\d)/g,'$1 $2').replace(/[“”]/g,'');
let tok=0;
const stopTalk=()=>{tok++;clearTimeout(G&&G.tm);try{TTS&&speechSynthesis.cancel();}catch(e){}};
function utter(text,who){const v=VOICE[who||'']||VOICE[''];const u=new SpeechSynthesisUtterance(spk(text));u.lang='en-US';
  const vo=(v[2]==='m'?VM:VF)||V0; if(vo)u.voice=vo; u.pitch=v[0]; u.rate=v[1]*(slow?.72:1); return u;}
/* items=[[who,text,j]]、onLine(j) で光らせる、onDone はさいごまで読んだら */
function talk(items,onLine,onDone){
  stopTalk(); const my=tok; let k=0;
  const step=()=>{ if(my!==tok)return; if(k>=items.length){onLine(-1);onDone&&onDone();return;}
    const [who,text,j]=items[k++]; onLine(j);
    if(!TTS){ G.tm=setTimeout(step,(1000+45*text.length)*(slow?1.4:1)); return; }
    let done=false; const fin=()=>{if(done)return;done=true;clearTimeout(sf);if(my===tok)G.tm=setTimeout(step,300);};
    const u=utter(text,who); u.onend=fin; u.onerror=fin;
    const sf=setTimeout(fin,(2500+text.length*130)*(slow?1.5:1));
    try{speechSynthesis.speak(u);}catch(e){fin();} };
  G.tm=setTimeout(step,TTS?80:200);
}
const say1=(t,who)=>{ if(!TTS)return; stopTalk(); setTimeout(()=>{try{speechSynthesis.speak(utter(t,who));}catch(e){}},60); };
app.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.say');if(b){e.preventDefault();e.stopPropagation();say1(b.dataset.t,b.dataset.w||'');}});
const sayBtn=(t,w)=>TTS?`<button class="say" type="button" data-t="${esc(t)}" data-w="${w||''}" aria-label="英語を聞く">🔊</button>`:'';
const top0=()=>{try{const y=app.getBoundingClientRect().top+window.scrollY-8;if(window.scrollY>y)window.scrollTo(0,y);}catch(e){}};
let G={tm:0};
const recOf=id=>{const r=rec[id];return r&&typeof r==='object'?r:{c:0,b:-1,l:-1};};
/* ---------- 話をえらぶ ---------- */
function home(){
  stopTalk(); auto=false; G={tm:0};
  const has=id=>ST.some(e=>e.id===id);
  const row=([id,no,title,ja,gr,ok])=>{const e=ST.find(x=>x.id===id);
    if(e){const r=recOf(id);
      return `<button class="st" data-id="${id}"><span class="th">${e.panels[0].p}</span><span><span class="no">第${no}話　${esc(gr.join('・'))}</span>
        <span class="nm"><span class="en" lang="en">${esc(title)}</span><br>${esc(ja)}</span>
        ${r.c?`<span class="bd ok">✓ クリア</span> <span class="ds" style="display:inline">クイズ最高 ${r.b} / 5</span>`:'<span class="bd new">まだ</span>'}</span></button>`;}
    if(!PAID)return `<a class="st lockd" href="${GID}-full.html"><span class="th">🔒</span><span><span class="no">第${no}話</span><span class="nm"><span class="en" lang="en">${esc(title)}</span><br>${esc(ja)}</span><span class="ds">利用コードで読めます</span></span></a>`;
    return `<div class="st soon"><span class="th">⏳</span><span><span class="no">第${no}話</span><span class="nm"><span class="en" lang="en">${esc(title)}</span><br>${esc(ja)}</span><span class="ds">じゅんび中</span></span></div>`;};
  const done=ST.filter(e=>recOf(e.id).c>0).length;
  app.innerHTML=`<div class="label">あそびかた</div>
    <p style="margin:0">みなと町の中学3年生ハナが、おじいちゃんの古いカメラを見つけたことから始まる、英語の連続ドラマです。1話ずつ、絵を見ながら英語を聞いて読もう（🔊 で読み上げ、「日本語訳」で訳が出ます）。下線の文が<b>今日の例文</b>。読みおわったら例文の文法をたしかめて、5問のクイズに答えよう。英語は英検3級（中学卒業程度）の単語と文法で書いた、オリジナルの物語です。</p>
    ${TTS?'':'<p class="note">このブラウザでは英語の読み上げ（🔊）が使えません。英文を読んで進めてください。</p>'}
    <details><summary>登場人物</summary><div class="cast" style="margin-top:8px">${CAST.map(c=>`<div>${c[4]}<span><b><span class="en" lang="en">${esc(c[1])}</span>（${esc(c[2])}）</b>${esc(c[3])}</span></div>`).join('')}</div></details>
    <div class="row" style="justify-content:space-between"><span class="label">話をえらぶ</span><span class="note">クリアした話 ${done} / ${ST.length}</span></div>
    ${PAID?'':`<p class="free">第1話は無料。🔒の話は<b>利用コードで全${TITLES.length}話</b>読めます。</p>`}
    <div class="list">${TITLES.map(row).join('')}</div>
    ${PAID?`<div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`:PAIDLINK}`;
  app.querySelectorAll('button.st').forEach(b=>b.onclick=()=>start(ST.find(e=>e.id===b.dataset.id)));
  const rs=document.getElementById('reset');
  if(rs)rs.onclick=()=>{document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
    document.getElementById('yes').onclick=()=>{rec={};saveRec();home();};document.getElementById('no').onclick=home;};
}
function start(e){ stopTalk(); auto=false; G={tm:0,e:e,i:0}; track('level_start',{level_name:GID+'-'+e.id}); panel(0); }
function head(label){ const e=G.e; return `<div class="top"><button class="linkbtn" id="back">← 話をえらぶ</button><span class="ep">第${e.no}話</span>${label}</div>`; }
const nm=w=>w?NAMES[w]:'';
/* ---------- 紙芝居 ---------- */
function panel(i){
  stopTalk(); const e=G.e, P=e.panels; G.i=i; const p=P[i], last=i===P.length-1, fin=last&&!p.h&&!e.teaser;
  const dots=`<div class="dots" aria-hidden="true">${P.map((x,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div><span class="pg">${i+1} / ${P.length}</span>`;
  app.innerHTML=`${head(dots)}
   <div class="stage" id="stage">
    <div class="pic">${p.p}${p.h?'<span class="tz">つづく…</span>':''}${fin?'<span class="tz end">おわり</span>':''}</div>
    <div class="lines" aria-live="off">${p.s.map((l,j)=>`<p class="ln ${l[0]?'sp':'nar'}" data-j="${j}">${l[0]?`<span class="who" style="--c:${COLOR[l[0]]}" lang="en">${esc(nm(l[0]))}</span>`:''}<span class="en" lang="en">${l[3]?'<u>'+esc(l[1])+'</u><span class="kt">例文</span>':esc(l[1])}</span>${showJa?`<span class="ja">${esc(l[2])}</span>`:''}</p>`).join('')}</div>
    ${p.g.length?`<p class="gloss">語注　${p.g.map(g=>`<b>${esc(g[0])}</b>＝${esc(g[1])}`).join('　')}</p>`:''}
    ${p.h?`<p class="yokoku"><b>次回予告</b>${esc(e.teaser)}</p>`:''}
   </div>
   <div class="ctrl"><button id="pv" aria-label="前の絵" ${i?'':'disabled'}>◀</button><button id="rd">${TTS?'🔊 読む':'▶ 順に光らせる'}</button><button id="nx" class="${last?'last':''}" aria-label="${last?'今日の例文へ':'次の絵'}">${last?'例文へ ▶':'▶'}</button></div>
   <div class="tog"><button id="tja" aria-pressed="${showJa}">日本語訳</button><button id="tsl" aria-pressed="${slow}">ゆっくり</button><button id="tau" aria-pressed="${auto}">自動めくり</button></div>
   ${TTS?'':'<p class="note">読み上げが使えないので、自動めくりは文を順に光らせて進みます。</p>'}`;
  document.getElementById('back').onclick=home;
  const hl=j=>app.querySelectorAll('.ln').forEach(x=>x.classList.toggle('now',+x.dataset.j===j));
  const readAll=then=>talk(p.s.map((l,j)=>[l[0],l[1],j]),hl,then);
  const goNext=()=>{ if(i<P.length-1)panel(i+1); else examples(); };
  document.getElementById('pv').onclick=()=>{auto=false;if(i)panel(i-1);};
  document.getElementById('nx').onclick=()=>{ if(last)auto=false; goNext(); };
  document.getElementById('rd').onclick=()=>readAll(null);
  app.querySelectorAll('.ln').forEach(x=>x.onclick=()=>{const j=+x.dataset.j;talk([[p.s[j][0],p.s[j][1],j]],hl,null);});
  document.getElementById('tja').onclick=()=>{showJa=!showJa;store.set(JAK,showJa);const keep=auto;panel(i);if(keep)autoRun();};
  document.getElementById('tsl').onclick=b=>{slow=!slow;store.set(SLOWK,slow);b.currentTarget.setAttribute('aria-pressed',String(slow));};
  document.getElementById('tau').onclick=b=>{auto=!auto;b.currentTarget.setAttribute('aria-pressed',String(auto));if(auto)autoRun();else stopTalk();};
  const autoRun=()=>readAll(()=>{ G.tm=setTimeout(()=>{ if(!auto)return; if(last){auto=false;examples();} else panel(i+1); },1100); });
  const st=document.getElementById('stage'); let sx=null,sy=null;
  st.addEventListener('touchstart',ev=>{const t=ev.touches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
  st.addEventListener('touchend',ev=>{if(sx==null)return;const t=ev.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;sx=null;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){auto=false;if(dx<0)goNext();else if(i)panel(i-1);}},{passive:true});
  top0();
  if(auto)autoRun();
}
document.addEventListener('keydown',ev=>{ if(!G.e||!document.getElementById('stage')||ev.target.closest('input,textarea'))return;
  if(ev.key==='ArrowRight'){auto=false;document.getElementById('nx').click();} if(ev.key==='ArrowLeft'&&G.i){auto=false;panel(G.i-1);} });
/* ---------- 今日の例文 ---------- */
function examples(){
  stopTalk(); const e=G.e;
  app.innerHTML=`${head('<span class="label" style="flex:1">今日の例文</span>')}
    <p class="note" style="margin:0">第${e.no}話「${esc(e.ja)}」で出てきた例文です。文法：${esc(e.gr.join('・'))}</p>
    ${e.keys.map(k=>`<div class="ex"><span><span class="en" lang="en">${esc(k[0])}</span>${sayBtn(k[0])}</span><span class="ja">${esc(k[1])}</span>
      <p class="pt"><b>文法</b>${esc(k[2])}</p><p class="more"><b>同じ形の例文</b><span class="en" lang="en">${esc(k[3])}</span>${sayBtn(k[3])}<br><span class="ja">${esc(k[4])}</span></p></div>`).join('')}
    <div class="row"><button class="btn" id="bk">◀ 紙芝居にもどる</button><button class="btn go" id="qz">たしかめクイズへ ▶</button></div>`;
  document.getElementById('back').onclick=home;
  document.getElementById('bk').onclick=()=>panel(e.panels.length-1);
  document.getElementById('qz').onclick=()=>{G.q=0;G.score=0;G.order=e.quiz.map(q=>shuffle(q.c));quiz();};
  top0();
}
/* ---------- たしかめクイズ ---------- */
function quiz(){
  stopTalk(); const e=G.e, qi=G.q, q=e.quiz[qi], ch=G.order[qi]; let tries=0, solved=false;
  let body='';
  if(q.t==='story') body=`<p class="qq">${/[ぁ-ん]/.test(q.q)?esc(q.q):`<span class="en" lang="en">${esc(q.q)}</span>`}</p>`;
  if(q.t==='mean') body=`<p class="qs"><span class="en" lang="en">${esc(q.s)}</span>${sayBtn(q.s)}</p><p class="qq">この英文の意味は？</p>`;
  if(q.t==='fill') body=`<p class="qq">(　　)に入るものは？</p><p class="qs"><span class="en" lang="en">${esc(q.q)}</span></p>`;
  if(q.t==='listen') body=TTS?`<button class="play" id="pl" type="button">🔊 英語を聞く</button><p class="qq">聞こえた英文の意味は？</p>`
     :`<p class="note">このブラウザでは読み上げが使えないので、英文を読んで答えよう。</p><p class="qs"><span class="en" lang="en">${esc(q.s)}</span></p><p class="qq">この英文の意味は？</p>`;
  if(q.t==='order') body=`<p class="qq">「${esc(q.ja)}」を正しい順番の英語にすると？</p>`;
  const en=x=>!/[ぁ-ゖァ-ヺ一-鿿]/.test(x);
  app.innerHTML=`${head(`<span class="pg" style="flex:1;text-align:right">クイズ ${qi+1} / ${e.quiz.length}</span>`)}
    <span class="qt">${QNAME[q.t]}</span>${body}
    <div class="ch">${ch.map((c,k)=>`<button class="op" data-k="${k}"><span class="k">${'アイウ'[k]}</span><span>${en(c)?`<span class="en" lang="en">${esc(c)}</span>`:esc(c)}</span></button>`).join('')}</div>
    <div id="fb"></div>`;
  document.getElementById('back').onclick=home;
  const pl=document.getElementById('pl'); if(pl){pl.onclick=()=>say1(q.s,'');}
  app.querySelectorAll('.op').forEach(b=>b.onclick=()=>{ if(solved)return; const c=ch[+b.dataset.k], ok=c===q.c[0]; tries++;
    track('answer_question',{category:GID+'-'+e.id,question:qi+1,correct:ok});
    const fb=document.getElementById('fb');
    if(ok){ solved=true; if(tries===1)G.score++; b.classList.add('ok'); app.querySelectorAll('.op').forEach(x=>x.disabled=true);
      fb.innerHTML=`<p class="fb ok"><b>${tries===1?'⭕ 正解！':'⭕ 正解！（2回目以降）'}</b>${esc(q.why)}</p><div class="row" style="margin-top:10px"><button class="btn go" id="qn">${qi<e.quiz.length-1?'次の問題 ▶':'結果を見る ▶'}</button>${q.s?sayBtn(q.s):''}</div>`;
      document.getElementById('qn').onclick=()=>{ if(qi<e.quiz.length-1){G.q++;quiz();} else result(); };
      document.getElementById('qn').focus({preventScroll:true});
    } else { b.classList.add('ng'); b.disabled=true;
      fb.innerHTML=`<p class="fb ng"><b>✖ ちがうよ。もう一度えらぼう</b>${esc(q.hint)}</p>`; }
  });
  top0();
}
function result(){
  stopTalk(); const e=G.e, s=G.score, r=recOf(e.id);
  r.c=(r.c||0)+1; r.l=s; r.b=Math.max(r.b==null?-1:r.b,s); rec[e.id]=r; saveRec();
  track('level_end',{level_name:GID+'-'+e.id,success:true,score:s});
  const ix=ST.indexOf(e), nx=ST[ix+1], nt=TITLES[e.no], stars=s>=5?3:s>=3?2:1;
  app.innerHTML=`${head('<span class="label" style="flex:1">結果</span>')}
    <p style="margin:0;font-weight:700">第${e.no}話「${esc(e.ja)}」クリア！</p>
    <div class="row"><span class="score">${s}<small> / 5問（1回目で正解）</small></span><span class="stars" aria-label="星 ${stars}こ">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</span></div>
    <p class="note">これまでの最高 ${r.b} / 5問。${s<5?'まちがえた問題の例文を、もう一度🔊で聞いてみよう。':'全問、1回目で正解！'}</p>
    ${e.teaser?`<p class="yokoku"><b>次回予告</b>${esc(e.teaser)}</p>`:'<p class="yokoku"><b>完結</b>「ハナと古いカメラ」全10話、おしまい。読んでくれてありがとう！</p>'}
    <div class="row">${nx?`<button class="btn go" id="next">第${nx.no}話「${esc(nx.ja)}」へ ▶</button>`:''}<button class="btn${nx?'':' go'}" id="list">話をえらぶ</button><button class="linkbtn" id="again">もう一度この話を読む</button></div>
    ${!nx&&nt&&!PAID?`<p class="free">第${nt[1]}話「${esc(nt[3])}」からは有料版で読めます。</p>${PAIDLINK}`:''}`;
  document.getElementById('back').onclick=home;
  if(nx)document.getElementById('next').onclick=()=>start(nx);
  document.getElementById('list').onclick=home;
  document.getElementById('again').onclick=()=>start(e);
  top0();
}
async function decrypt(){ return mnAccess.load('c-eiken3drama'); }
function lockScreen(err){ mnAccess.lock(app,{game:'c-eiken3drama',err:err,free:'c-eiken3drama.html',onOpen:async()=>{ ST=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ ST=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
