<title>ユウキとロボット部　英語の連続ドラマ紙芝居（英検4級）</title>

<meta name="game:unit" content="英検4級対策">
<meta name="game:grade" content="中1〜中2">
<meta name="game:players" content="1人">
<meta name="description" content="あおぞら町の中学2年生ユウキは、はずかしがりや。部員が1人しかいないロボット部を守るため、留学生のサムや部長のリク、元エンジニアのハヤシさんと、町のロボット大会をめざす英語の連続ドラマ紙芝居（全10話）。絵を見ながら英語の読み上げ（🔊・人ごとに声が変わる）を聞き、日本語訳・ゆっくり・自動めくりも使えます。各話の例文で英検4級の文法を学び、ストーリー・空所補充・リスニング・並べかえのクイズでたしかめます。無料版は第1話「ロボット部のポスター」（過去形・There is / are）。英語はすべてオリジナル。">

  --en:#8cc4f2; --ensoft:#1a2a3a; --key:#e1b44a; --now:#4a3f1c; --nowfg:#fff6dc; color-scheme:dark}

.lead{margin:4px 0 0;color:var(--muted);font-size:14px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.label{font-size:12px;font-weight:700;color:var(--seal);letter-spacing:.1em}
.note{font-size:13px;color:var(--muted);margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:8px;padding:12px 20px;font-size:16px;font-weight:700;cursor:pointer;background:var(--pick)}
.btn.go{background:var(--fg);color:var(--surface)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.en{font-family:var(--latin);color:var(--en);font-weight:700;letter-spacing:.005em}
.say{border:1px solid var(--en);background:var(--ensoft);color:var(--en);border-radius:99px;font-size:13px;line-height:1;padding:4px 8px;margin-left:6px;cursor:pointer;vertical-align:2px}

.list{display:grid;gap:8px}
.st{box-sizing:border-box;border:2px solid var(--rule);background:var(--surface);border-radius:10px;padding:8px;cursor:pointer;text-align:left;display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--fg);width:100%}
.st:hover{border-color:var(--ink)}
.st .th{flex:none;width:112px;border-radius:6px;overflow:hidden;line-height:0;border:1px solid var(--rule);background:#fff}
.st .th svg{width:112px;height:70px;display:block}
.st .no{display:block;font-size:12px;font-weight:700;color:var(--seal);letter-spacing:.08em;line-height:1.4}
.st .nm{font-weight:700;font-size:16px;display:block;line-height:1.4}
.st .nm .en{font-size:15px}
.st .ds{font-size:12px;color:var(--muted);display:block;line-height:1.6}
.bd{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:0 10px;margin-top:2px}
.bd.ok{background:var(--oksoft);color:var(--ok)} .bd.new{background:var(--pick);color:var(--muted)}
.st.lockd .th{display:grid;place-items:center;height:70px;background:var(--pick);font-size:24px;line-height:1}
.st.lockd{opacity:.8} .st.soon{opacity:.55;cursor:default}
.free{border:1px dashed var(--seal);border-radius:8px;padding:8px 12px;font-size:14px;margin:0;background:var(--sealsoft)}
.cast{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.cast div{display:flex;gap:8px;align-items:center;border:1px solid var(--rule);border-radius:8px;padding:6px;font-size:12px;line-height:1.5}
.cast svg{flex:none;width:52px;height:38px;border-radius:6px;display:block}
.cast b{display:block;font-size:13px}
details summary{cursor:pointer;font-weight:700;font-size:14px}

.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top .ep{font-size:13px;font-weight:700;color:var(--seal)}
.dots{flex:1;display:flex;gap:3px;min-width:80px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--rule)} .dots i.on{background:var(--seal)}
.pg{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stage{display:flex;flex-direction:column;gap:12px;touch-action:pan-y}
.pic{position:relative;background:#fff;border:3px solid #6b4f36;border-radius:6px;overflow:hidden;line-height:0;box-shadow:0 3px 0 #00000022}
.pic svg{display:block;width:100%;height:auto;aspect-ratio:16/10}
.tz{position:absolute;right:10px;bottom:10px;background:#1f1a2e;color:#fff;font-family:var(--display);font-size:clamp(18px,5vw,26px);line-height:1;padding:8px 14px;border-radius:6px;transform:rotate(-3deg);letter-spacing:.1em}

.lines{display:flex;flex-direction:column;gap:6px;min-height:96px}

.ln .who::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.ln .en{font-size:19px;line-height:1.6}
.ln.nar .en{font-weight:500;color:var(--fg);font-style:italic}
.ln.now.nar .en{color:var(--nowfg)}
.ln u{text-decoration:underline;text-decoration-color:var(--key);text-decoration-thickness:3px;text-underline-offset:4px}
.kt{font-family:var(--body);font-style:normal;font-size:11px;font-weight:700;color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:3px;white-space:nowrap}
.ln .ja{display:block;font-size:14px;color:var(--muted);line-height:1.7;margin-top:2px}
.gloss{margin:0;font-size:13px;color:var(--muted);border-top:1px dashed var(--rule);padding-top:6px}
.gloss b{color:var(--fg);font-family:var(--latin)}
.yokoku{margin:0;border:2px solid var(--ink);border-radius:8px;padding:8px 12px;font-size:15px;font-weight:700}
.yokoku b{display:block;font-size:12px;color:var(--ink);letter-spacing:.12em}
.ctrl{display:grid;grid-template-columns:64px 1fr minmax(64px,auto);gap:8px}

.ctrl #rd{background:var(--en);color:var(--surface)}
.ctrl #nx.last{background:var(--fg);color:var(--surface);font-size:15px;padding:12px 14px;white-space:nowrap}

.fb.ok{background:var(--oksoft)} .fb.ok b{color:var(--ok)} .fb.ng{background:var(--ngsoft)} .fb.ng b{color:var(--ng)}

  st.addEventListener('touchstart',ev=>{const t=ev.touches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
  st.addEventListener('touchend',ev=>{if(sx==null)return;const t=ev.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;sx=null;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){auto=false;if(dx<0)goNext();else if(i)panel(i-1);}},{passive:true});
  top0();
  if(auto)autoRun();
}
document.addEventListener('keydown',ev=>{ if(!G.e||!document.getElementById('stage')||ev.target.closest('input,textarea'))return;
  if(ev.key==='ArrowRight'){auto=false;document.getElementById('nx').click();} if(ev.key==='ArrowLeft'&&G.i){auto=false;panel(G.i-1);} });
/* ---------- 今日の例文 ---------- */
function examples(){
  stopTalk(); const e=G.e;
  app.innerHTML=`${head('<span class="label" style="flex:1">今日の例文</span>')}
    <p class="note" style="margin:0">第${e.no}話「${esc(e.ja)}」で出てきた例文です。文法：${esc(e.gr.join('・'))}</p>
    ${e.keys.map(k=>`<div class="ex"><span><span class="en" lang="en">${esc(k[0])}</span>${sayBtn(k[0])}</span><span class="ja">${esc(k[1])}</span>
      <p class="pt"><b>文法</b>${esc(k[2])}</p><p class="more"><b>同じ形の例文</b><span class="en" lang="en">${esc(k[3])}</span>${sayBtn(k[3])}<br><span class="ja">${esc(k[4])}</span></p></div>`).join('')}
    <div class="row"><button class="btn" id="bk">◀ 紙芝居にもどる</button><button class="btn go" id="qz">たしかめクイズへ ▶</button></div>`;
  document.getElementById('back').onclick=home;
  document.getElementById('bk').onclick=()=>panel(e.panels.length-1);
  document.getElementById('qz').onclick=()=>{G.q=0;G.score=0;G.order=e.quiz.map(q=>shuffle(q.c));quiz();};
  top0();
}
/* ---------- たしかめクイズ ---------- */
function quiz(){
  stopTalk(); const e=G.e, qi=G.q, q=e.quiz[qi], ch=G.order[qi]; let tries=0, solved=false;
  let body='';
  if(q.t==='story') body=`<p class="qq">${/[ぁ-ん]/.test(q.q)?esc(q.q):`<span class="en" lang="en">${esc(q.q)}</span>`}</p>`;
  if(q.t==='mean') body=`<p class="qs"><span class="en" lang="en">${esc(q.s)}</span>${sayBtn(q.s)}</p><p class="qq">この英文の意味は？</p>`;
  if(q.t==='fill') body=`<p class="qq">(　　)に入るものは？</p><p class="qs"><span class="en" lang="en">${esc(q.q)}</span></p>`;
  if(q.t==='listen') body=TTS?`<button class="play" id="pl" type="button">🔊 英語を聞く</button><p class="qq">聞こえた英文の意味は？</p>`
     :`<p class="note">このブラウザでは読み上げが使えないので、英文を読んで答えよう。</p><p class="qs"><span class="en" lang="en">${esc(q.s)}</span></p><p class="qq">この英文の意味は？</p>`;
  if(q.t==='order') body=`<p class="qq">「${esc(q.ja)}」を正しい順番の英語にすると？</p>`;
  const en=x=>!/[ぁ-ゖァ-ヺ一-鿿]/.test(x);
  app.innerHTML=`${head(`<span class="pg" style="flex:1;text-align:right">クイズ ${qi+1} / ${e.quiz.length}</span>`)}
    <span class="qt">${QNAME[q.t]}</span>${body}
    <div class="ch">${ch.map((c,k)=>`<button class="op" data-k="${k}"><span class="k">${'アイウ'[k]}</span><span>${en(c)?`<span class="en" lang="en">${esc(c)}</span>`:esc(c)}</span></button>`).join('')}</div>
    <div id="fb"></div>`;
  document.getElementById('back').onclick=home;
  const pl=document.getElementById('pl'); if(pl){pl.onclick=()=>say1(q.s,'');}
  app.querySelectorAll('.op').forEach(b=>b.onclick=()=>{ if(solved)return; const c=ch[+b.dataset.k], ok=c===q.c[0]; tries++;
    track('answer_question',{category:GID+'-'+e.id,question:qi+1,correct:ok});
    const fb=document.getElementById('fb');
    if(ok){ solved=true; if(tries===1)G.score++; b.classList.add('ok'); app.querySelectorAll('.op').forEach(x=>x.disabled=true);
      fb.innerHTML=`<p class="fb ok"><b>${tries===1?'⭕ 正解！':'⭕ 正解！（2回目以降）'}</b>${esc(q.why)}</p><div class="row" style="margin-top:10px"><button class="btn go" id="qn">${qi<e.quiz.length-1?'次の問題 ▶':'結果を見る ▶'}</button>${q.s?sayBtn(q.s):''}</div>`;
      document.getElementById('qn').onclick=()=>{ if(qi<e.quiz.length-1){G.q++;quiz();} else result(); };
      document.getElementById('qn').focus({preventScroll:true});
    } else { b.classList.add('ng'); b.disabled=true;
      fb.innerHTML=`<p class="fb ng"><b>✖ ちがうよ。もう一度えらぼう</b>${esc(q.hint)}</p>`; }
  });
  top0();
}
function result(){
  stopTalk(); const e=G.e, s=G.score, r=recOf(e.id);
  r.c=(r.c||0)+1; r.l=s; r.b=Math.max(r.b==null?-1:r.b,s); rec[e.id]=r; saveRec();
  track('level_end',{level_name:GID+'-'+e.id,success:true,score:s});
  const ix=ST.indexOf(e), nx=ST[ix+1], nt=TITLES[e.no], stars=s>=5?3:s>=3?2:1;
  app.innerHTML=`${head('<span class="label" style="flex:1">結果</span>')}
    <p style="margin:0;font-weight:700">第${e.no}話「${esc(e.ja)}」クリア！</p>
    <div class="row"><span class="score">${s}<small> / 5問（1回目で正解）</small></span><span class="stars" aria-label="星 ${stars}こ">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</span></div>
    <p class="note">これまでの最高 ${r.b} / 5問。${s<5?'まちがえた問題の例文を、もう一度🔊で聞いてみよう。':'全問、1回目で正解！'}</p>
    ${e.teaser?`<p class="yokoku"><b>次回予告</b>${esc(e.teaser)}</p>`:'<p class="yokoku"><b>完結</b>「ユウキとロボット部」全10話、おしまい。読んでくれてありがとう！</p>'}
    <div class="row">${nx?`<button class="btn go" id="next">第${nx.no}話「${esc(nx.ja)}」へ ▶</button>`:''}<button class="btn${nx?'':' go'}" id="list">話をえらぶ</button><button class="linkbtn" id="again">もう一度この話を読む</button></div>
    ${!nx&&nt&&!PAID?`<p class="free">第${nt[1]}話「${esc(nt[3])}」からは有料版で読めます。</p>${PAIDLINK}`:''}`;
  document.getElementById('back').onclick=home;
  if(nx)document.getElementById('next').onclick=()=>start(nx);
  document.getElementById('list').onclick=home;
  document.getElementById('again').onclick=()=>start(e);
  top0();
}
async function decrypt(){ return mnAccess.load('c-eiken4drama'); }
function lockScreen(err){ mnAccess.lock(app,{game:'c-eiken4drama',err:err,free:'c-eiken4drama.html',onOpen:async()=>{ ST=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ ST=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
