function ending(o){
  const s=G.s, stars=G.overs===0?3:G.overs<=2?2:1;
  if(G.who)collect(s.id,G.who);
  bump(s.id,0);
  track('level_end',{level_name:GID+'-'+s.id,success:true,score:stars});
  const ix=ST.indexOf(s), nx=ST[ix+1];
  app.innerHTML=`${head(o)}<p class="endh">🎉 第${s.no}章「${rb(s.title)}」クリア！</p><div class="pic">${o.p}</div><p class="txt">${rb(o.t)}</p>
    <p class="lesson"><b>この章のまとめ</b>${rb(o.l)}</p>
    <div class="row"><span class="stars" aria-label="星 ${stars}こ">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</span><span class="note">${G.overs?'ゲームオーバー '+G.overs+'回。次はノーミスをめざそう！':'ノーミスで最後まで進めた！'}</span></div>
    <div class="label">使えるフレーズ</div>
    <ul class="phr">${s.ph.map(p=>`<li><span class="en" lang="en">${esc(p[0])}</span>${sayBtn(esc(p[0]))}<span class="ja">${rb(p[1])}</span></li>`).join('')}</ul>
    <div class="label">文法ポイント</div>
    <ul class="words">${s.gr.map(w=>`<li><b>${rb(w[0])}</b>${rb(w[1])}</li>`).join('')}</ul>
    <div class="label">案内スタンプ（${nCards()} / ${ALLFIG.length}こ）</div><div class="figrow">${s.spots.map(f=>figCard(s,f)).join('')}</div>
    <div class="label">参考にした資料</div><ul class="srcs">${s.src.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
    <div class="row">${nx?`<button class="btn go" id="next">次の章「${rb(nx.title)}」</button>`:''}<button class="btn${nx?'':' go'}" id="list">章をえらぶ</button><button class="linkbtn" id="again">もう一度この章を</button></div>${PAID?'':PAIDLINK}`;
  document.getElementById('back').onclick=home;
  if(nx)document.getElementById('next').onclick=()=>play(nx);
  document.getElementById('list').onclick=home;
  document.getElementById('again').onclick=()=>play(s);
  top0();
}
async function decrypt(){ return mnAccess.load('c-eiken5nari'); }
function lockScreen(err){ mnAccess.lock(app,{game:'c-eiken5nari',err:err,free:'c-eiken5nari.html',onOpen:async()=>{ ST=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ ST=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
