    <p style="margin:0">あなたは中国の戦国時代の兵士（農家の三男）。仕える国や人（主君）をえらんで、歴史を進めよう。出陣の命令が出たら「参加する」か「参加しない」かを決める。ヒントと、それまでの話が手がかりだ。</p>
    <details class="how"><summary>ルールをくわしく見る</summary>${RULES}</details>
    <div class="row" style="justify-content:space-between"><span class="label" style="color:var(--fg)">スタンプ</span><span class="cnt">${nStamps()}<small> / ${STAMPS.length}こ</small></span></div>
    <div class="navrow"><button class="btn" id="stbook">スタンプ帳</button><button class="btn" id="nenpyo">年表（見た戦い ${BLIST.filter(b=>seen[b[0]]).length} / ${BLIST.length}）</button></div>
    <div class="label">主君をえらぶ（仕える国・人）</div>
    ${PAID?'':`<p class="free">無料版は韓のみちすじ。🔒の主君には<b>利用コードで（全${META.length}主君）</b>仕えられます。</p>`}
    <div class="lordrow">${rows}</div>
    <p class="note">旗の字と絵は、このゲームのために作ったかんたんなものです。人物の顔や服は想像で、実在の肖像ではありません。項羽・劉邦は、秦の統一のあとのみちすじです。</p>
    ${PAID?`<div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`:PAIDLINK}`;
  app.querySelectorAll('button.lc').forEach(b=>b.onclick=()=>start(b.dataset.id));
  document.getElementById('stbook').onclick=stampBook;
  document.getElementById('nenpyo').onclick=nenpyo;
  const rs=document.getElementById('reset');
  if(rs)rs.onclick=()=>{document.getElementById('resetq').innerHTML='本当に消しますか？（スタンプと年表も消えます） <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
    document.getElementById('yes').onclick=()=>{rec={};stamps={};seen={};store.set(REC,rec);store.set(STK,stamps);store.set(SEENK,seen);home();};document.getElementById('no').onclick=home;};
}
function start(id){ G={L:id,i:0,rice:0,trust:TRUST0,log:[]}; track('level_start',{level_name:GID+'-'+id}); go(); }
function go(){
  const o=LO().route[G.i];
  if(!o)return ending();
  if(o.k==='s')return story(o);
  if(o.k==='b')return battle(o);
  if(o.k==='c')return campaign(o);
  if(o.k==='kg')return katana(o);
}
function next(){ G.i++; go(); }
function story(o){
  app.innerHTML=`${head(o.y)}<span class="yr">${Y(o.y)}</span><div class="pic">${o.p}</div><p class="ttl">${rb(o.ti)}</p><p class="txt">${rb(o.tx)}</p>
    <div class="row"><button class="btn go" id="nx">次へ ▶</button></div>${o.sw?'<button class="linkbtn leave" id="leave">この主君のもとを去る…</button>':''}`;
  bindBack();
  const nx=document.getElementById('nx'); nx.onclick=next;
  if(o.sw)document.getElementById('leave').onclick=()=>switchScreen(o.sw,'mid',o.y);
  top0(); nx.focus({preventScroll:true});
}
function battle(o){
  const b=D.battles[o.id];
  SNAP=clone(G); see(o.id);
  app.innerHTML=`${head(b.y)}<span class="yr">${Y(b.y)}${b.ynote?` <small style="font-size:11px">（${esc(b.ynote)}）</small>`:''}</span><div class="pic">${b.pq}</div>
    <p class="bq">${Y(b.y)}、<b>${rb(b.name)}</b>。出陣の命令が出た。参加する？</p>
    <p class="txt">${rb(o.tx)}</p>
    <p class="note">${rb(b.full)}（${rb(b.pref)}）</p>
    <p class="hintbox"><b>ヒント</b>${rb(b.hint)}</p>
    <div class="dec"><button class="btn join" id="join">参加する<small>主君の軍で戦う</small></button><button class="btn" id="rest">参加しない<small>理由を言って休む</small></button></div>`;
  bindBack();
  document.getElementById('join').onclick=()=>{
    track('answer_question',{category:GID+'-'+G.L,question:o.id,correct:o.oc!=='loss'});
    G.log.push([o.id,G.L,o.oc,1]);
    if(o.oc==='loss'){ bump(G.L,1); return gameover('loss',o,b); }
    G.rice+=b.pay; G.trust=Math.min(TRUSTMAX,G.trust+1);
    result('join',o,b);
  };
  document.getElementById('rest').onclick=()=>{
    track('answer_question',{category:GID+'-'+G.L,question:o.id,correct:o.oc==='loss'});
    G.log.push([o.id,G.L,o.oc,0]);
    G.trust--;
    if(G.trust<=0){ bump(G.L,1); return gameover('fire',o,b); }
    result('rest',o,b);
  };
  top0();
}
function realBox(b){ return `<p class="real"><b>実際には…</b>${rb(b.real)}</p>${b.legend?`<p class="legend">※ ${rb(b.legend)}</p>`:''}`; }
function result(mode,o,b){
  let cls='', h='', msg='', gain='';
    if(mode==='join'&&o.oc==='win'){ h='戦いのあと ― 味方の軍の勝ち！'; msg='あなたは隊の仲間と、持ち場を守りぬいた。'; gain=`<span>粟 +${b.pay}石</span><span>信用 +1</span>`; }
  else if(mode==='join'){ cls=' draw'; h='戦いのあと ― 勝敗ははっきりしない'; msg='勝ち負けのはっきりしない戦いだった。参加してもゲームオーバーにはならない。'; gain=`<span>粟 +${b.pay}石</span><span>信用 +1</span>`; }
  else { cls=' skip'; h=o.oc==='loss'?'休んで正解！ 味方の軍は負けた':o.oc==='win'?'休んでいるあいだに、味方の軍は勝った':'休んでいるあいだに…勝敗ははっきりしなかった';
    msg=o.oc==='loss'?'あなたは理由を言って休み、無事だった。':o.oc==='win'?'参加していれば、粟がもらえたのに。':'参加していても大丈夫だった。';
    gain='<span class="zero">粟 ±0</span><span class="minus">信用 −1</span>'; }
  let extra='';
  if(mode==='join'&&o.id===GASSHO&&o.oc==='win'){ const n=getStamp('gassho'); extra=`<div class="stampbig"><div class="sv">${stampOf('gassho')[2]}</div><p class="${n?'new':'note'}">${n?'✓「合従」のスタンプを手に入れた！':'「合従」のスタンプはもう持っている'}</p></div>`; }
  app.innerHTML=`${head(b.y)}<div class="after${cls}"><h2>${h}</h2><div class="pic">${b.pr}</div>
    <p class="txt">${msg}</p><div class="gain">${gain}</div>${realBox(b)}${extra}
    <div class="row"><button class="btn go" id="nx">次へ ▶</button></div></div>`;
  bindBack();
  const nx=document.getElementById('nx'); nx.onclick=next; top0(); nx.focus({preventScroll:true});
}
function gameover(kind,o,b){
  track('level_end',{level_name:GID+'-'+G.L,success:false});
  const fire=kind==='fire';
  app.innerHTML=`${head(b.y)}<div class="over"><h2>${fire?'主君から暇《いとま》を出されました':'兵士をやめて村に帰りました'}</h2>
    <p class="pick">${fire?'何度も戦いを休んだので、主君の信用を失ってしまった。':'味方の軍は負けてしまった。命からがら逃げのびたあなたは、兵士をやめて村に帰り、田畑を耕すことにした。'}</p>
    <div class="pic">${fire?PICS.fire:PICS.home}</div>${realBox(b)}
    <p class="hint"><b>覚えておこう</b>${fire?'勝つ戦いには参加して、信用をためておこう。休めるのは信用があるうちだけ。':rb(Y(b.y)+'の'+b.name+'は、'+b.sides[b.win][0]+'の勝ち。')}</p>
    <div class="row"><button class="btn go" id="retry">この戦いの前からやりなおす</button><button class="btn" id="list">主君えらびにもどる</button></div></div>`
    .replace('暇《いとま》','<ruby>暇<rt>いとま</rt></ruby>');
  bindBack();
  const rt=document.getElementById('retry'); rt.onclick=()=>{G=clone(SNAP); battle(o);};
  document.getElementById('list').onclick=home;
  top0(); rt.focus({preventScroll:true});
}
function campaign(o){
  const b=D.battles[o.id], c=b.c; SNAP=clone(G); see(o.id);
  app.innerHTML=`${head(b.y)}<span class="yr">${Y(b.y)}</span><div class="pic">${b.pq}</div>
    <p class="bq">${Y(b.y)}、<b>${rb(b.name)}</b>。${rb(c.q)}</p>
    <p class="txt">${rb(o.tx)}</p><p class="note">${rb(b.full)}（${rb(b.pref)}）</p><p class="hintbox"><b>考えよう</b>${rb(b.hint)}</p>
    <div class="dec"><button class="btn" id="go">${rb(c.go[0])}<small>${rb(c.go[1])}</small></button><button class="btn" id="stay">${rb(c.stay[0])}<small>${rb(c.stay[1])}</small></button></div>`;
  bindBack();
  const pick=g=>{ G.log.push([o.id,G.L,'none',g?1:0]);
    app.innerHTML=`${head(b.y)}<div class="after skip"><h2>戦いは起こらなかった</h2><div class="pic">${b.pr}</div>
      <p class="txt">${rb(g?c.got:c.stayt)}</p>
      <div class="gain"><span class="zero">粟 ±0</span><span class="zero">信用 ±0</span></div>${realBox(b)}
      <div class="row"><button class="btn go" id="nx">次へ ▶</button></div></div>`;
    bindBack(); const nx=document.getElementById('nx'); nx.onclick=next; top0(); nx.focus({preventScroll:true}); };
  document.getElementById('go').onclick=()=>pick(true);
  document.getElementById('stay').onclick=()=>pick(false);
  top0();
}
function katana(o){
  app.innerHTML=`${head(o.y)}<span class="yr">${Y(o.y)}</span><div class="pic">${o.p}</div><p class="ttl">${rb(o.ti)}</p><p class="txt">${rb(o.tx)}</p>
    <div class="dec"><button class="btn" id="stay">兵士を続ける<small>主君に仕えて、戦いの道を進む</small></button><button class="btn go" id="farm">兵をやめて、鉄の農具で田畑を耕す<small>鉄の農具エンディング</small></button></div>`;
  bindBack();
  document.getElementById('stay').onclick=next;
  document.getElementById('farm').onclick=tetsu;
  top0();
}
function runNenpyo(){
  if(!G.log.length)return '<p class="note">この旅では、まだ戦いを見ていません。</p>';
  return `<ul class="tl">${G.log.map(([id,lid,oc,j])=>{const b=D.battles[id];
    return `<li><span class="y">${YN(b.y)}</span><span class="n">${rb(b.name)}<span class="tag ${OCC[oc]}">${esc(metaOf(lid)[1])}側：${OCL[oc]}</span>${j?'<span class="tag j">参加</span>':''}</span><span class="r">${rb(b.pref)}</span></li>`;}).join('')}</ul>`;
}
function wordsList(ws){ return `<ul class="words">${ws.map(w=>`<li><b>${rb(w[0])}</b>${rb(w[1])}</li>`).join('')}</ul>`; }
function ending(){
  const Lr=LO(), e=Lr.end, isNew=getStamp(G.L);
  bump(G.L,0); track('level_end',{level_name:GID+'-'+G.L,success:true,score:G.rice});
  app.innerHTML=`${head(e.y)}<p class="endh">🎉 「${rb(e.ti)}」を見とどけた！</p><span class="yr">${Y(e.y)}</span><div class="pic">${e.p}</div>
    <p class="ttl">${rb(e.ti)}</p><p class="txt">${rb(e.tx)}</p>
    <div class="stampbig"><div class="sv">${stampOf(G.L)[2]}</div><p class="${isNew?'new':'note'}">${isNew?(G.L===BEST?'✓ 金のスタンプ「秦の統一」を手に入れた！':'✓ スタンプを手に入れた！'):'このスタンプはもう持っている'}</p><span class="note">スタンプ ${nStamps()} / ${STAMPS.length}　粟 ${G.rice}石</span></div>
    <div class="label">この旅の年表</div>${runNenpyo()}
    <div class="label">おさえておきたい用語</div>${wordsList(Lr.words)}
    <div class="label">このあと、どうする？</div>
    <div class="dec">${e.sw.length?`<button class="btn go" id="more">次の主君をさがす<small>${Y(e.y)}から、ほかの国や人に仕える（信用・粟はそのまま）</small></button>`:''}<button class="btn" id="farm">村に帰る<small>ここで旅をおえる</small></button></div>
    <div><button class="linkbtn" id="list">主君えらびへ</button></div>${PAID?'':PAIDLINK}`;
  bindBack();
  if(e.sw.length)document.getElementById('more').onclick=()=>switchScreen(e.sw,'after',e.y);
  document.getElementById('farm').onclick=home; document.getElementById('list').onclick=home;
  top0();
}
function tetsu(){
  const h=D.tetsu, isNew=getStamp('tetsu');
  track('level_end',{level_name:GID+'-tetsu',success:true,score:G.rice});
  app.innerHTML=`${head(LO().route[G.i].y)}<p class="endh">🌾 ${rb(h.ti)}</p><div class="pic">${h.p}</div><p class="txt">${rb(h.tx)}</p>
    <div class="stampbig"><div class="sv">${stampOf('tetsu')[2]}</div><p class="${isNew?'new':'note'}">${isNew?'✓「鉄の農具」のスタンプを手に入れた！':'このスタンプはもう持っている'}</p><span class="note">スタンプ ${nStamps()} / ${STAMPS.length}</span></div>
    <div class="label">この旅の年表</div>${runNenpyo()}
    <div class="label">おさえておきたい用語</div>${wordsList(h.words)}
    <div class="row"><button class="btn go" id="list">主君えらびへ</button></div>${PAID?'':PAIDLINK}`;
  bindBack(); document.getElementById('list').onclick=home; top0();
}
function switchScreen(sw,mode,y){
  const rows=sw.map(([id,i,bet,y0])=>{const m=metaOf(id), ok=has(id);
    const ex=`<span class="ds">${y0>y?Y(y0)+'から（'+(y0-y)+'年後）':Y(y0)+'から'}</span>${bet&&mode==='mid'?'<span class="bd bad">⚠ 裏切りになる：信用は1から</span> ':''}${stamps[id]?'<span class="bd ok">✓ スタンプ</span>':''}${!ok&&!PAID?'<span class="bd new">🔒 利用コードで</span>':''}`;
    return lordCard(m, ex, `data-id="${id}" data-i="${i}" data-b="${bet}"`, !ok);}).join('');
  app.innerHTML=`${head(y)}<p class="ttl">${mode==='after'?'次の主君をさがす':'この主君のもとを去る'}</p>
    <ul class="rules">${mode==='after'?'<li>主君の最後を見とどけたので、信用と粟はそのまま。</li>':'<li>とちゅうで去ると、信用が1へる。この時代、遊説家や食客が国を移るのはよくあった。</li><li>すぐあとの戦いで今の主君と敵どうしになる主君に移るのは<b class="warn">裏切り</b>。信用は1からやりなおし。</li>'}<li>まだ戦いが残っている主君にだけ仕えられる。</li></ul>
    ${PAID?'':`<p class="free">無料版では、ほかの主君には仕えられません（🔒）。<b>利用コード</b>で全${META.length}主君に仕えられます。</p>`}
    <div class="lordrow">${rows}</div>
    <div class="row"><button class="btn" id="cancel">${mode==='mid'?'やめて、今の主君に仕え続ける':'村に帰る（旅をおえる）'}</button></div>${PAID?'':PAIDLINK}`;
  bindBack();
  app.querySelectorAll('button.lc').forEach(b=>b.onclick=()=>serve(b.dataset.id,+b.dataset.i,+b.dataset.b,mode,y));
  document.getElementById('cancel').onclick=mode==='mid'?go:home;
  top0();
}
function serve(id,i,bet,mode,y){
  const betray=mode==='mid'&&bet;
  if(mode==='mid')G.trust=betray?1:Math.max(1,G.trust-1);
  G.L=id; G.i=i; const m=metaOf(id);
  track('level_start',{level_name:GID+'-'+id});
  app.innerHTML=`${head(y)}<div class="sw" role="group" aria-label="仕官"><div class="swl">仕官</div><div class="swp">${m[5]}</div>
    <p class="swt">ここからは、あなたは</p><p class="swn"><ruby>${esc(m[1])}<rt>${esc(m[2])}</rt></ruby>の兵士。</p><p class="swr">${rb(m[4])}</p>
    ${betray?'<p class="warn" style="margin:0">裏切り者とうたがわれ、信用は1から。</p>':mode==='mid'?'<p class="note">とちゅうで去ったので、信用が1へった。</p>':''}
    <button class="btn go" id="nx">仕える ▶</button></div>`;
  bindBack(); const nx=document.getElementById('nx'); nx.onclick=go; top0(); nx.focus({preventScroll:true});
}
function stampBook(){
  const cells=STAMPS.map(([id,lab,svg,how])=>{const got=!!stamps[id], m=metaOf(id);
    const tip=m?`「${esc(how)}」を見とどける`:esc(how);
    return got?`<div class="sp"><span class="sv">${svg}</span><b>${esc(lab)}</b><span>${tip}</span></div>`
              :`<div class="sp no"><span class="sv">？</span><b>${esc(lab)}</b><span>${tip}</span></div>`;}).join('');
  app.innerHTML=`<div class="top"><button class="linkbtn" id="back">← 主君えらび</button></div><p class="ttl">スタンプ帳　${nStamps()} / ${STAMPS.length}</p>
    <div class="stamps">${cells}</div><p class="note">主君のスタンプは、その国（人）の歴史どおりの最後を、ゲームオーバーにならずに見とどけるともらえます。秦の統一は金のスタンプ。</p>${PAID?'':PAIDLINK}`;
  bindBack(); top0();
}
function nenpyo(){
  const n=BLIST.filter(b=>seen[b[0]]).length;
  const items=BLIST.map(([id,t,y,name])=>{
    if(!seen[id])return `<li class="no"><span class="y">${YN(y)}</span><span class="n">？？？</span><span class="r">まだ見ていない戦い</span></li>`;
    const b=D&&D.battles&&D.battles[id];
    if(!b)return `<li><span class="y">${YN(y)}</span><span class="n">${rb(name)}</span><span class="r">くわしくは有料版で</span></li>`;
    const res=b.win===0||b.win===1?esc(b.sides[b.win][0])+'の勝ち':b.win==='draw'?'勝敗ははっきりしない':'戦わずに降伏';
    return `<li><span class="y">${YN(y)}</span><span class="n">${rb(name)}<span class="tag ${b.win==='draw'||b.win==='none'?'d':'w'}">${res}</span></span><span class="r">${rb(b.full)}（${rb(b.pref)}）</span></li>`;}).join('');
  app.innerHTML=`<div class="top"><button class="linkbtn" id="back">← 主君えらび</button></div><p class="ttl">年表　見た戦い ${n} / ${BLIST.length}</p>
    <p class="note">どの主君に仕えたときでも、一度見た戦いはここに記録されます。</p><ul class="tl">${items}</ul>${PAID?'':PAIDLINK}`;
  bindBack(); top0();
}
async function decrypt(){ return mnAccess.load('c-shinheishi'); }
function lockScreen(err){ mnAccess.lock(app,{game:'c-shinheishi',err:err,free:'c-shinheishi.html',onOpen:async()=>{ D=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ D=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
