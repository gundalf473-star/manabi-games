function plan(order){
  const d=G.d; let t=d.t0, at='S'; const rows=[['start',t,d.start]], bad=[];
  for(const it of order){
    if(it==='L'){t=Math.max(t,d.win[0]);const ok=t<=d.win[1];rows.push(['lunch',t,t+d.lunch,ok?0:1]);if(!ok)bad.push(['lunch',t]);t+=d.lunch;continue;}
    const [m,mode]=d.tr[at][it]; rows.push(['move',t,m,mode]); t+=m;
    const s=site(it), late=s.cl!=null&&t>s.cl?1:0; if(late)bad.push(['close',it,t,s.cl]);
    rows.push(['site',t,t+s.v,it,late]); t+=s.v; at=it;

  rows.push(['end',t,d.end,t>d.meet?1:0]); if(t>d.meet)bad.push(['late',t,t-d.meet]);

  return {rows,bad,end:t};
}

      <div class="row" style="margin-top:10px"><button class="btn go" id="nq">${last?(G.step+1<G.order.length?'次の行き先へ ▶':esc(G.d.end)+'へもどる ▶'):'もう1つ質問が… ▶'}</button></div>`;
    const m=app.querySelector('.meter');if(m)m.outerHTML=meter();
    const nq=document.getElementById('nq'); nq.focus({preventScroll:true});
    nq.onclick=()=>{if(!last){G.qi++;ask();}else{G.step++;trip();}};
  });
}
function rankOf(p){return p>=90?['ベテラン添乗員','お客さまから「またあなたのツアーに参加したい！」の声。']:p>=70?['たよれる添乗員','質問にしっかり答えて、お客さまも楽しそうでした。']:p>=50?['がんばり添乗員','もう一度案内すると、もっと答えられそう！']:['見習い添乗員','報告書を読みなおして、もう一度案内してみよう！'];}
function ending(){
  const d=G.d, r=G.plan, p=G.total?Math.round(G.score/G.total*100):0, rk=rankOf(p);
  bump(d.id,0);
  const old=stamps[d.id]; stamps[d.id]=[old?old[0]:Date.now(),Math.max(p,old&&old[1]!=null?old[1]:0)]; store.set(STK,stamps);
  track('level_end',{level_name:GID+'-'+d.id,success:true,score:G.score,total:G.total});
  const vis=G.order.filter(x=>x!=='L').map(site);
  const kw=[...new Set([...vis.flatMap(s=>s.kw),...d.words.map(w=>w[0])])];
  const ix=ST.indexOf(d), nx=ST[ix+1];
  app.innerHTML=`${head(5)}<div class="good"><h2>ツアー、大成功！</h2>${say(FACE.boss,BOSS,`おつかれさまでした。お客さま全員、${hm(r.end)}に${esc(d.end)}へもどれました。${G.fails?'計画の立てなおし '+G.fails+'回。':'計画は一発で合格！'}`)}</div>
    <div class="shiori" id="shiori"><h2>ツアー報告書</h2><p class="sub">${esc(d.pref)}　${rb(d.days)}</p>
      <div class="dest"><span class="dn"><small>案内した町</small>${esc(d.name)}<small>${esc(d.pref)}</small></span><span class="stamp" aria-label="${esc(d.stamp)}のスタンプ">${stampSvg(d.stamp)}</span></div>
      <p class="theme"><small>テーマ</small>${rb(d.theme)}</p>
      <h3>行程（時間は目安）</h3>${ttHtml(r.rows)}
      <h3>お客さまが学んだこと</h3><ul class="kws">${kw.map(k=>`<li>${rb(k)}</li>`).join('')}</ul>
      <h3>キーワード</h3><ul class="words">${d.words.map(w=>`<li><b>${rb(w[0])}</b>${rb(w[1])}</li>`).join('')}</ul>
      <h3>年表</h3><dl class="timeline">${d.nen.map(e=>`<dt>${esc(e[1])}</dt><dd>${rb(e[2])}</dd>`).join('')}</dl>
      <p class="lesson"><b>まとめ</b>${rb(d.lesson)}</p>
      ${d.next?`<div class="nextday"><span class="th">${d.next[1]}</span><span><span class="label">あすの予定</span><br>${rb(d.next[0])}</span></div>`:''}
      <div class="rank"><span class="label">満足度 ${p}%（${G.score} / ${G.total}問 正解）</span><span class="rn">${esc(rk[0])}</span><span>${esc(rk[1])}</span></div>
    </div>
    <div class="row noprint"><button class="btn" id="print">報告書を印刷する</button></div>
    <div class="row noprint">${nx?`<button class="btn go" id="next">次の行き先「${esc(nx.name)}」へ</button>`:''}<button class="btn${nx?'':' go'}" id="list">行き先をえらぶ</button><button class="linkbtn" id="again">もう一度この行き先を</button></div>${PAID?'':PAIDLINK}`;
  bindBack();
  document.getElementById('print').onclick=()=>{try{window.print();}catch(e){}};
  if(nx)document.getElementById('next').onclick=()=>play(nx);
  document.getElementById('list').onclick=home;
  document.getElementById('again').onclick=()=>play(d);
  top0();
}
async function decrypt(){ return mnAccess.load('c-tour'); }
function lockScreen(err){ mnAccess.lock(app,{game:'c-tour',err:err,free:'c-tour.html',onOpen:async()=>{ ST=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ ST=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
