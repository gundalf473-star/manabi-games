  const d=G.d;

    <span class="tg">見学 ${s.v}分（目安）</span>${s.cl!=null?`<span class="tg">受付 〜${hm(s.cl)}（目安）</span>`:''}</span></button>`;};
  app.innerHTML=`${head(2)}<p class="theme"><small>テーマ</small>${rb(d.theme)}</p>
    <p class="note">テーマに合う観光先を <b>${d.n}か所</b> えらぼう。カードをタップすると、えらぶ／やめる。</p>
    <div class="cands">${d.sites.map(card).join('')}</div>
    <div class="bar"><span class="cnt">${G.pick.length}<small> / ${d.n}か所</small></span><button class="btn go" id="ok" ${G.pick.length===d.n?'':'disabled'}>この${d.n}か所で決定</button></div>`;
  bindBack();
  app.querySelectorAll('.cd').forEach(b=>b.onclick=()=>{const id=b.dataset.id,i=G.pick.indexOf(id);
    if(i>=0)G.pick.splice(i,1);else if(G.pick.length<d.n)G.pick.push(id);else return;
    b.setAttribute('aria-pressed',G.pick.includes(id));
    app.querySelector('.bar .cnt').innerHTML=`${G.pick.length}<small> / ${d.n}か所</small>`;
    document.getElementById('ok').disabled=G.pick.length!==d.n;});
  document.getElementById('ok').onclick=()=>{const bad=G.pick.map(site).filter(s=>!s.f);
    if(bad.length)return mismatch(bad);
    G.order=[];route();};
}
function mismatch(bad){
  G.fails++; bump(G.d.id,1);
  track('answer_question',{category:GID+'-'+G.d.id,question:'theme:'+bad.map(s=>s.id).join(','),correct:false});
  app.innerHTML=`${head(2)}<div class="fail"><h2>お客さまの希望とどう関係しますか？</h2>
    ${say(FACE.boss,BOSS,`「${bad.map(s=>esc(s.nm)).join('」と「')}」は、ツアーのテーマ「${rb(G.d.theme)}」と、お客さまの希望とどう関係しますか？`)}
    ${bad.map(s=>`<div class="say"><span class="fc">${FACE.me}</span><p class="bub"><b class="who">考えてみると…</b>${rb(s.why)}</p></div>`).join('')}
    <p class="hint"><b>計画のコツ</b>観光先をえらぶときは「その場所で、テーマのどんなことをお客さまに見てもらえるか」を説明できるかを考えよう。</p>
    <div class="row"><button class="btn go" id="re">観光先をえらびなおす</button></div></div>`;
  bindBack();
  document.getElementById('re').onclick=()=>{G.pick=G.pick.filter(id=>site(id).f);choose();};
  top0();
}
/* 時刻の計算（gen_shugaku.py の schedule と同じ） */
function plan(order){
  const d=G.d; let t=d.t0, at='S'; const rows=[['start',t,d.start]], bad=[];
  for(const it of order){
    if(it==='L'){t=Math.max(t,d.win[0]);const ok=t<=d.win[1];rows.push(['lunch',t,t+d.lunch,ok?0:1]);if(!ok)bad.push(['lunch',t]);t+=d.lunch;continue;}
    const [m,mode]=d.tr[at][it]; rows.push(['move',t,m,mode]); t+=m;
    const s=site(it), late=s.cl!=null&&t>s.cl?1:0; if(late)bad.push(['close',it,t,s.cl]);
    rows.push(['site',t,t+s.v,it,late]); t+=s.v; at=it;
  }
  const [m,mode]=d.tr[at].E; rows.push(['move',t,m,mode]); t+=m;
  rows.push(['end',t,d.end,t>d.meet?1:0]); if(t>d.meet)bad.push(['late',t,t-d.meet]);
  for(const [a,b,why] of d.rules)if(order.includes(a)&&order.includes(b)&&order.indexOf(a)>order.indexOf(b))bad.push(['rule',a,b,why]);
  return {rows,bad,end:t};
}
window.__sgPlan=o=>plan(o);
function ttHtml(rows){
  return `<ol class="tt">${rows.map(r=>{
    if(r[0]==='start')return `<li><span class="t">${hm(r[1])}</span><span>${esc(r[2])} を出発</span></li>`;
    if(r[0]==='move')return `<li class="mv"><span class="t">↓</span><span>${esc(r[3])} ${r[2]}分</span></li>`;
    if(r[0]==='lunch')return `<li class="${r[3]?'bad':''}"><span class="t">${hm(r[1])}</span><span>昼食（〜${hm(r[2])}）</span></li>`;
    if(r[0]==='site'){const s=site(r[3]);return `<li class="${r[4]?'bad':''}"><span class="t">${hm(r[1])}</span><span>${esc(s.nm)}　見学（〜${hm(r[2])}）</span></li>`;}
    return `<li class="${r[3]?'bad':''}"><span class="t">${hm(r[1])}</span><span>${esc(r[2])} に集合（${hm(G.d.meet)}まで）</span></li>`;}).join('')}</ol>`;
}
function mapSvg(order){
  const d=G.d,P=d.pos; let lines='',marks='';
  const pts=['S',...order.filter(x=>x!=='L')]; if(order.length===G.pick.length+1)pts.push('E');
  for(let i=0;i+1<pts.length;i++){const a=P[pts[i]],b=P[pts[i+1]],m=d.tr[pts[i]][pts[i+1]];
    lines+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#c2402a" stroke-width="3" stroke-dasharray="${m[1]==='徒歩'?'2 5':'0'}" stroke-linecap="round" opacity=".85"/>`;
    const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;
    lines+=`<rect x="${mx-17}" y="${my-8}" width="34" height="15" rx="7" fill="#fff" stroke="#c2402a" stroke-width="1"/><text x="${mx}" y="${my+3.5}" font-size="10" text-anchor="middle" fill="#c2402a" font-weight="700" font-family="sans-serif">${m[0]}分</text>`;}
  const se=P.S, ee=P.E;
  marks+=`<rect x="${se[0]-7}" y="${se[1]-7}" width="14" height="14" rx="3" fill="#1f4e5a"/><text x="${se[0]}" y="${se[1]+22}" font-size="10" text-anchor="middle" fill="#1f4e5a" font-weight="700" font-family="sans-serif">${esc(d.start)}</text>`;
  if(d.end!==d.start)marks+=`<rect x="${ee[0]-7}" y="${ee[1]-7}" width="14" height="14" rx="3" fill="#1f4e5a"/><text x="${ee[0]}" y="${ee[1]+22}" font-size="10" text-anchor="middle" fill="#1f4e5a" font-weight="700" font-family="sans-serif">${esc(d.end)}（集合）</text>`;
  for(const id of G.pick){const s=site(id),p=P[id],k=order.filter(x=>x!=='L').indexOf(id);
    marks+=`<circle cx="${p[0]}" cy="${p[1]}" r="9" fill="${k>=0?'#c2402a':'#fff'}" stroke="#c2402a" stroke-width="2"/>`
      +(k>=0?`<text x="${p[0]}" y="${p[1]+3.5}" font-size="11" text-anchor="middle" fill="#fff" font-weight="700" font-family="sans-serif">${k+1}</text>`:'')
      +`<text x="${p[0]+s.lab[0]}" y="${p[1]+s.lab[1]}" font-size="11" text-anchor="middle" fill="#26302a" font-weight="700" font-family="sans-serif" paint-order="stroke" stroke="#f4f1e6" stroke-width="3">${esc(s.sn)}</text>`;}
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" aria-label="${esc(d.name)}の地図"><rect width="360" height="240" fill="#f4f1e6"/>${d.map}${lines}${marks}</svg>`;
}
function route(){
  const d=G.d, o=G.order, at=o.filter(x=>x!=='L').slice(-1)[0]||'S';
  const left=[...G.pick.filter(id=>!o.includes(id)),...(o.includes('L')?[]:['L'])];
  const seq=o.map(x=>x==='L'?'昼食':site(x).sn);
  app.innerHTML=`${head(3)}<p class="note">地図を見て、回る順番をタップで決めよう。<b>昼食</b>も入れること。線の数字は移動時間（目安）。</p>
    <div class="mapw">${mapSvg(o)}</div><p class="note" style="margin-top:-8px">地図はおおまかな位置です（実際のきょりとはちがいます）。点線は徒歩。</p>
    <dl class="conds"><dt>出発</dt><dd>${hm(d.t0)} ${esc(d.start)}</dd><dt>集合</dt><dd>${hm(d.meet)} ${esc(d.end)}</dd><dt>昼食</dt><dd>${d.lunch}分（${hm(d.win[0])}〜${hm(d.win[1])}に始める）</dd></dl>
    <ul class="seq"><li>${esc(d.start)}</li>${seq.map(x=>`<li class="arrow">→</li><li>${esc(x)}</li>`).join('')}${left.length?'<li class="arrow">→ …</li>':`<li class="arrow">→</li><li>${esc(d.end)}</li>`}</ul>
    ${left.length?`<div class="label">${o.length+1}番目に行く所</div><div class="ord">${left.map(x=>x==='L'?`<button class="ob lunch" data-x="L"><span>🍙 昼食（${d.lunch}分）</span><small>今いる所の近くで</small></button>`
      :`<button class="ob" data-x="${x}"><span>${esc(site(x).nm)}</span><small>${esc(d.tr[at][x][1])} ${d.tr[at][x][0]}分・見学 ${site(x).v}分${site(x).cl!=null?'・受付〜'+hm(site(x).cl):''}</small></button>`).join('')}</div>`
      :`<div class="row"><button class="btn go" id="go">この計画で決定</button></div>`}
    <div class="row">${o.length?'<button class="btn" id="undo">1つもどす</button><button class="linkbtn" id="clr">順番をはじめから</button>':''}<button class="linkbtn" id="repick">観光先をえらびなおす</button></div>
    <p class="meyasu">移動・見学の時間は目安です。</p>`;
  bindBack();
  app.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{G.order.push(b.dataset.x);route();});
  const u=document.getElementById('undo');if(u)u.onclick=()=>{G.order.pop();route();};
  const c=document.getElementById('clr');if(c)c.onclick=()=>{G.order=[];route();};
  document.getElementById('repick').onclick=()=>{G.order=[];choose();};
  const g=document.getElementById('go');if(g)g.onclick=check;
}
function check(){
  const d=G.d, r=plan(G.order);
  if(r.bad.length){
    G.fails++; bump(d.id,1);
    track('answer_question',{category:GID+'-'+d.id,question:'plan:'+G.order.join('>'),correct:false});
    const msg=b=>b[0]==='late'?`集合時刻 ${hm(d.meet)} に対して、${esc(d.end)} にもどるのは <b>${hm(b[1])}</b>（${b[2]}分おくれ）。`
      :b[0]==='lunch'?`昼食を始めるのが <b>${hm(b[1])}</b>。${hm(d.win[1])}までに始めたい。`
      :b[0]==='close'?`${esc(site(b[1]).nm)}に着くのが <b>${hm(b[2])}</b>。受付の目安（〜${hm(b[3])}）に間に合わない。`
      :`「${esc(site(b[1]).nm)}」より先に「${esc(site(b[2]).nm)}」へ行っています。${rb(b[3])}。`;
    const hint=r.bad.some(b=>b[0]==='late')?'地図で近い所どうしを続けて回ると、移動の時間がへります。遠い所へ行ったり来たりしていないかな？'
      :r.bad.some(b=>b[0]==='close')?'受付が早く終わる見学先は、先に回ろう。':r.bad.some(b=>b[0]==='lunch')?'昼食を何番目に入れるかで、昼食の時刻が変わります。':'きまりを思い出そう。';
    app.innerHTML=`${head(3)}<div class="fail"><h2>時間が足りません</h2>
      ${say(FACE.boss,BOSS,'この計画だと、うまくいかない所があるようです。')}
      <ul class="probs">${r.bad.map(b=>`<li>${msg(b)}</li>`).join('')}</ul>${ttHtml(r.rows)}
      <p class="hint"><b>計画のコツ</b>${hint}</p>
      <div class="row"><button class="btn go" id="re">順番を考えなおす</button><button class="btn" id="repick">観光先からえらびなおす</button></div></div>`;
    bindBack();
    document.getElementById('re').onclick=()=>{G.order=[];route();};
    document.getElementById('repick').onclick=()=>{G.order=[];choose();};
    return top0();
  }
  G.plan=r;
  const sl=d.meet-r.end;
  app.innerHTML=`${head(3)}<div class="good"><h2>よい計画です！</h2>
    ${say(FACE.boss,BOSS,`テーマに合った観光先で、時間もだいじょうぶ。集合時刻の${sl}分前にもどれますね。${sl>=30?'少し時間の余裕もあるので、お客さまも安心です。':''}`)}
    ${ttHtml(r.rows)}<div class="row"><button class="btn go" id="go">ツアーに出発！ ▶</button></div></div>`;
  bindBack(); document.getElementById('go').onclick=()=>{G.step=0;G.total=G.order.filter(x=>x!=='L').reduce((a,id)=>a+site(id).q.length,0);trip();}; top0();
}
function meter(){const p=G.total?Math.round(G.score/G.total*100):0;return `<div class="meter"><span>満足度</span><span class="mb"><i style="width:${p}%"></i></span><span>${p}%</span></div>`;}
function trip(){
  const d=G.d, it=G.order[G.step];
  if(it===undefined)return ending();
  const rows=G.plan.rows;
  if(it==='L'){const r=rows.find(x=>x[0]==='lunch');
    app.innerHTML=`${head(4)}${meter()}<div class="arr"><span class="tm">${hm(r[1])}</span><span class="an">昼食</span></div>
      <div class="pic">${LUNCHPIC}</div>${say(FACE.kids[G.step%4],KIDS[G.step%4],rb(d.food))}
      <div class="row"><button class="btn go" id="nx">午後の観光へ ▶</button></div>`;
    bindBack(); document.getElementById('nx').onclick=()=>{G.step++;trip();}; return top0();}
  const s=site(it), r=rows.find(x=>x[0]==='site'&&x[3]===it);
  G.qi=0; G.cur=s;
  app.innerHTML=`${head(4)}${meter()}<div class="arr"><span class="tm">${hm(r[1])}</span><span class="an">${rb(s.nr)}</span><span class="note">に到着</span></div>
    <div class="pic">${s.p}</div><p class="txt">${rb(s.d)}</p><div id="qa"></div>`;
  bindBack(); ask(); top0();
}
function ask(){
  const s=G.cur, q=s.q[G.qi], box=document.getElementById('qa');
  const ch=shuffle([q[2],...q[3]]);
  box.innerHTML=`<div style="display:flex;flex-direction:column;gap:12px">${say(FACE.kids[q[0]],KIDS[q[0]],`添乗員さん、${rb(q[1])}`)}
    <div class="ch">${ch.map((c,i)=>`<button class="op" data-i="${i}"><span class="k">${'アイウ'[i]}</span><span>${rb(c)}</span></button>`).join('')}</div><div id="res"></div></div>`;
  box.querySelectorAll('.op').forEach(b=>b.onclick=()=>{
    const c=ch[+b.dataset.i], ok=c===q[2];
    box.querySelectorAll('.op').forEach(x=>{x.disabled=true;if(ch[+x.dataset.i]===q[2])x.classList.add('right');});
    if(!ok)b.classList.add('wrong');
    if(ok)G.score++;
    G.log.push([s.id,G.qi,ok]); G.qn++;
    track('answer_question',{category:GID+'-'+G.d.id,question:pl(q[1]).slice(0,60),correct:ok});
    const last=G.qi+1>=s.q.length;
    document.getElementById('res').innerHTML=`<p class="res ${ok?'ok':'ng'}"><b>${ok?'正解！ お客さまの満足度アップ':'実際には…'}</b>${ok?'':'答えは「'+rb(q[2])+'」。'}${rb(q[4])}</p>
      <div class="row" style="margin-top:10px"><button class="btn go" id="nq">${last?(G.step+1<G.order.length?'次の行き先へ ▶':esc(G.d.end)+'へもどる ▶'):'もう1つ質問が… ▶'}</button></div>`;
    const m=app.querySelector('.meter');if(m)m.outerHTML=meter();
    const nq=document.getElementById('nq'); nq.focus({preventScroll:true});
    nq.onclick=()=>{if(!last){G.qi++;ask();}else{G.step++;trip();}};
  });
}
function rankOf(p){return p>=90?['ベテラン添乗員','お客さまから「またあなたのツアーに参加したい！」の声。']:p>=70?['たよれる添乗員','質問にしっかり答えて、お客さまも楽しそうでした。']:p>=50?['がんばり添乗員','もう一度案内すると、もっと答えられそう！']:['見習い添乗員','報告書を読みなおして、もう一度案内してみよう！'];}
function ending(){
  const d=G.d, r=G.plan, p=G.total?Math.round(G.score/G.total*100):0, rk=rankOf(p);
  bump(d.id,0);
  const old=stamps[d.id]; stamps[d.id]=[old?old[0]:Date.now(),Math.max(p,old&&old[1]!=null?old[1]:0)]; store.set(STK,stamps);
  track('level_end',{level_name:GID+'-'+d.id,success:true,score:G.score,total:G.total});
  const vis=G.order.filter(x=>x!=='L').map(site);
  const kw=[...new Set([...vis.flatMap(s=>s.kw),...d.words.map(w=>w[0])])];
  const ix=ST.indexOf(d), nx=ST[ix+1];
  app.innerHTML=`${head(5)}<div class="good"><h2>ツアー、大成功！</h2>${say(FACE.boss,BOSS,`おつかれさまでした。お客さま全員、${hm(r.end)}に${esc(d.end)}へもどれました。${G.fails?'計画の立てなおし '+G.fails+'回。':'計画は一発で合格！'}`)}</div>
    <div class="shiori" id="shiori"><h2>ツアー報告書</h2><p class="sub">${esc(d.pref)}　${rb(d.days)}</p>
      <div class="dest"><span class="dn"><small>案内した町</small>${esc(d.name)}<small>${esc(d.pref)}</small></span><span class="stamp" aria-label="${esc(d.stamp)}のスタンプ">${stampSvg(d.stamp)}</span></div>
      <p class="theme"><small>テーマ</small>${rb(d.theme)}</p>
      <h3>行程（時間は目安）</h3>${ttHtml(r.rows)}
      <h3>お客さまが学んだこと</h3><ul class="kws">${kw.map(k=>`<li>${rb(k)}</li>`).join('')}</ul>
      <h3>キーワード</h3><ul class="words">${d.words.map(w=>`<li><b>${rb(w[0])}</b>${rb(w[1])}</li>`).join('')}</ul>
      <h3>年表</h3><dl class="timeline">${d.nen.map(e=>`<dt>${esc(e[1])}</dt><dd>${rb(e[2])}</dd>`).join('')}</dl>
      <p class="lesson"><b>まとめ</b>${rb(d.lesson)}</p>
      ${d.next?`<div class="nextday"><span class="th">${d.next[1]}</span><span><span class="label">あすの予定</span><br>${rb(d.next[0])}</span></div>`:''}
      <div class="rank"><span class="label">満足度 ${p}%（${G.score} / ${G.total}問 正解）</span><span class="rn">${esc(rk[0])}</span><span>${esc(rk[1])}</span></div>
    </div>
    <div class="row noprint"><button class="btn" id="print">報告書を印刷する</button></div>
    <div class="row noprint">${nx?`<button class="btn go" id="next">次の行き先「${esc(nx.name)}」へ</button>`:''}<button class="btn${nx?'':' go'}" id="list">行き先をえらぶ</button><button class="linkbtn" id="again">もう一度この行き先を</button></div>${PAID?'':PAIDLINK}`;
  bindBack();
  document.getElementById('print').onclick=()=>{try{window.print();}catch(e){}};
  if(nx)document.getElementById('next').onclick=()=>play(nx);
  document.getElementById('list').onclick=home;
  document.getElementById('again').onclick=()=>play(d);
  top0();
}
