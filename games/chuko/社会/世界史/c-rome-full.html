}
function head(){const s=P.s,t=Math.min(P.st.t,s.turns.length);
  return `<div class="top"><button class="linkbtn" id="back">← シナリオ一覧</button><div class="prog" aria-hidden="true"><i style="width:${Math.round(t/s.turns.length*100)}%"></i></div><span class="tn">${Math.min(t+1,s.turns.length)}/${s.turns.length}</span></div>`;}
function advisor(st,text,warn){
  const md=st.v.mood>=60?'happy':st.v.mood<35?'worried':'ok';const pic=(G.advisor.pics&&G.advisor.pics[md])||G.advisor.pic;
  return `<div class="adv"><span class="advp">${pic}</span><div class="advb"><span class="advn">${rb(G.advisor.name)}<small>（相談役）</small></span><p>${rb(text)}</p>${warn?`<p class="warn">⚠ ${rb(warn)}</p>`:''}</div></div>`;}
function warnOf(st){const e=SIM.envOf(G,st);for(const w of (G.warn||[])){if(SIM.ev(w[0],e))return w[1];}return '';}

/* ---- 一覧 ---- */
function stampBook(){
  const got=G.ranks.filter(r=>Object.keys(stamps).some(k=>k.split(':')[1]===r.k));
  return `<div class="row" style="justify-content:space-between"><span class="label">はんこ帳</span><span class="note">${got.length} / ${G.ranks.length}しゅるい</span></div>
    <div class="stamps">${G.ranks.map(r=>{const has=got.includes(r);return `<div class="stp${has?'':' no'}" title="${esc(r.t)}">${r.pic}<span>${has?esc(r.name):'？？？'}</span></div>`;}).join('')}</div>`;}
function home(){
  P=null;
  const row=([id,no,title,years,sub,isFree])=>{const s=SCN.find(c=>c.id===id);
    if(s){const r=rec[id]||[0,0];const my=G.ranks.filter(x=>stamps[id+':'+x.k]);
      return `<button class="st" data-id="${id}"><span class="th">${s.pic}</span><span><span class="no">シナリオ${no}　${esc(years)}</span><span class="nm">${rb(title)}</span><span class="ds">${rb(sub)}</span>
        ${r[0]?`<span class="bd ok">✓ 最後まで${r[0]>1?'（'+r[0]+'回）':''}</span>`:'<span class="bd new">まだ</span>'}${my.length?` <span class="bd st2">はんこ ${my.map(x=>esc(x.name)).join('・')}</span>`:''}</span></button>`;}
    if(!PAID)return `<a class="st lockd" href="${ID}-full.html"><span class="th">🔒</span><span><span class="no">シナリオ${no}　${esc(years)}</span><span class="nm">${rb(title)}</span><span class="ds">${rb(sub)}<br>利用コードで遊べます</span></span></a>`;
    return `<div class="st soon"><span class="th">⏳</span><span><span class="no">シナリオ${no}</span><span class="nm">${rb(title)}</span><span class="ds">じゅんび中</span></span></div>`;};
  const has=t=>SCN.some(c=>c.id===t[0]);
  const rows=PAID?TITLES.map(row).join(''):TITLES.filter(has).map(row).join('')+`<div class="label" style="margin-top:6px">利用コードで遊べるシナリオ</div>`+TITLES.filter(t=>!has(t)).map(row).join('');
  app.innerHTML=`<div class="label">あそびかた</div><p style="margin:0">${rb(G.howto)}</p>
    <div class="row" style="justify-content:space-between"><span class="label">シナリオをえらぶ</span></div>
    ${PAID?'':`<p class="free">シナリオ1は無料。🔒のシナリオは<b>利用コードで全${TITLES.length}シナリオ</b>遊べます。</p>`}
    <div class="list">${rows}</div>${stampBook()}
    ${PAID?`<div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`:PAIDLINK}`;
  app.querySelectorAll('button.st').forEach(b=>b.onclick=()=>intro(SCN.find(s=>s.id===b.dataset.id)));
  on('reset',()=>{document.getElementById('resetq').innerHTML='本当に消しますか？（はんこも消えます） <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
    on('yes',()=>{rec={};stamps={};store.set(REC,rec);store.set(STK,stamps);home();});on('no',home);});
}
/* ---- はじめ ---- */
function intro(s){
  const st=SIM.newState(G,s);
  P={s:s,st:st,snaps:[],alloc:Object.assign({},G.start),tax:st.tax,chosen:null};
  for(const c of G.cats)if(P.alloc[c.k]==null)P.alloc[c.k]=0;
  app.innerHTML=`${head()}<p class="endh" style="color:var(--ink)">シナリオ${s.no}「${rb(s.title)}」</p><span class="yr">${esc(s.years)}</span>
    <div class="pic">${s.pic}</div>${advisor(st,s.intro,'')}
    <p class="note">あなたは<b>${rb(G.you)}</b>。全${s.turns.length}ターン。1ターンは1年〜数年です。</p>
    <div class="row"><button class="btn go" id="go">${RULER}として はじめる ▶</button></div>`;
  on('back',home); on('go',()=>{track('level_start',{level_name:ID+'-'+s.id});news();});
  top0();
}
/* ---- ターンのはじめ：できごと・決める ---- */
function news(){
  const s=P.s, st=P.st, T=s.turns[st.t];
  if(P.snaps.length===st.t)P.snaps.push({st:clone(st),alloc:clone(P.alloc)});
  P.chosen=null;
  app.innerHTML=`${head()}<span class="yr">${yspan(T.y,T.yrs)}${T.yrs>1?`<small>（${T.yrs}年間）</small>`:''}</span>
    <h2 class="nt">${rb(T.title)}</h2><div class="pic">${T.pic}</div><p class="txt">${rb(T.news)}</p>
    ${T.ch?`<p class="ask">${rb(T.ch.ask)}</p><div class="ch">${T.ch.opts.map((o,i)=>`<button class="op" data-i="${i}"><span class="k">${'アイウ'[i]}</span><span>${rb(o.t)}</span></button>`).join('')}</div>`
      :`<div class="row"><button class="btn go" id="nx">予算を決める ▶</button></div>`}`;
  on('back',home);
  if(T.ch)app.querySelectorAll('.op').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;SIM.choose(G,s,st,i);P.chosen=i;chosen();});
  else on('nx',budget);
  top0();
}
function chosen(){
  const T=P.s.turns[P.st.t], o=T.ch.opts[P.chosen];
  app.innerHTML=`${head()}<span class="yr">${yspan(T.y,T.yrs)}</span><h2 class="nt">${rb(T.title)}</h2>
    <p class="pick">あなたが選んだのは：<b>${rb(o.t)}</b></p><p class="say">${rb(o.say)}</p>
    <div class="real"><b>実際には…</b><p>${rb(T.ch.real.replace(/^実際には、?/,''))}</p></div>
    <div class="row"><button class="btn go" id="nx">予算を決める ▶</button></div>`;
  on('back',home); on('nx',budget); top0();
}
/* ---- 予算を配る ---- */
function sumA(){let n=0;for(const c of G.cats)n+=P.alloc[c.k]||0;return n;}
function preview(){
  const st=clone(P.st), T=P.s.turns[st.t];
  if(sumA()!==10)return '<p class="note">合計を100%にすると、このターンの見通しが出ます。</p>';
  const r=SIM.step(G,P.s,st,P.alloc,P.tax,false);
  const ar=k=>{const d=r.d[k]/SD[k].bar;return d>0.08?['↑↑','up']:d>0.01?['↑','up']:d<-0.08?['↓↓','dn']:d<-0.01?['↓','dn']:['→','eq'];};
  const items=MAIN.concat(SUB).map(s=>{const a=ar(s.k);return `<span class="pv ${a[1]}">${esc(s.name)} <b>${a[0]}</b></span>`;}).join('');
  const later=P.st.q.length+G.cats.filter(c=>(P.alloc[c.k]||0)&&c.fx.some(f=>f[2]>0)).length;
  return `<div class="label">この配分だと、このターンは（できごとの前）</div><div class="pvs">${items}</div>${later?`<p class="note">⏳ ${esc(LATER)}</p>`:''}`;
}
function budget(){
  const s=P.s, st=P.st, T=s.turns[st.t];
  const rem=10-sumA(), foc=T.focus||[];
  const cats=G.cats.map(c=>{const v=P.alloc[c.k]||0;
    return `<div class="cat${foc.includes(c.k)?' rec':''}"><div class="ct"><b>${rb(c.name)}</b>${foc.includes(c.k)?`<span class="rcm">${esc(G.advisor.name)}のおすすめ</span>`:''}<span class="pct">${v*10}%</span></div>
      <div class="cs">${rb(c.say)}</div>
      <div class="cc"><button class="pm" data-k="${c.k}" data-d="-1" aria-label="${esc(plain(c.name))}を10%へらす"${v?'':' disabled'}>−</button>
      <div class="cells">${Array.from({length:10},(_,i)=>`<button class="cell${i<v?' on':''}" data-k="${c.k}" data-n="${i+1}" aria-label="${esc(plain(c.name))}を${(i+1)*10}%にする" tabindex="-1"></button>`).join('')}</div>
      <button class="pm" data-k="${c.k}" data-d="1" aria-label="${esc(plain(c.name))}を10%ふやす"${rem?'':' disabled'}>＋</button></div></div>`;}).join('');
  const tx=G.tax?`<div class="label">${esc(G.tax.name)}</div><div class="taxs" role="radiogroup" aria-label="${esc(G.tax.name)}">${G.tax.opts.map(o=>`<button class="tx${o[0]===P.tax?' on':''}" role="radio" aria-checked="${o[0]===P.tax}" data-v="${o[0]}"><b>${esc(o[1])}</b>${G.tax.unit===''?'':`<small>${o[0]}${G.tax.unit!=null?esc(G.tax.unit):'%'}</small>`}</button>`).join('')}</div>
    <p class="note">${esc((G.tax.opts.find(o=>o[0]===P.tax)||G.tax.opts[0])[2])}</p>`:'';
  app.innerHTML=`${head()}<span class="yr">${yspan(T.y,T.yrs)}${T.yrs>1?`<small>（${T.yrs}年間）</small>`:''}</span>
    ${status(st)}<div class="pic map">${G.map}</div>${advisor(st,T.hint,warnOf(st))}
    ${tx}<div class="sum${rem?'':' full'}" id="sum"><span>予算の配分</span><b>${(10-rem)*10}%</b><span>${rem?`のこり ${rem*10}%`:'✓ 100%'}</span></div>
    <div class="cats">${cats}</div><div id="pv">${preview()}</div>
    <div class="row"><button class="btn go" id="run"${rem?' disabled':''}>この配分で ${T.yrs}${esc(G.turn)}すすめる ▶</button></div>${rem?`<p class="note">あと${rem*10}%配ると、すすめられます。</p>`:''}`;
  paintMap(app,st);
  on('back',home);
  app.querySelectorAll('.pm').forEach(b=>b.onclick=()=>{const k=b.dataset.k,d=+b.dataset.d;const v=P.alloc[k]||0;
    if(d>0&&10-sumA()<=0)return; P.alloc[k]=Math.max(0,Math.min(10,v+d)); keep(()=>budget(),b);});
  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{const k=b.dataset.k,n=+b.dataset.n,v=P.alloc[k]||0;
    let t=n===v?n-1:n; t=Math.min(t,v+10-sumA()); P.alloc[k]=Math.max(0,t); keep(()=>budget(),b);});
  app.querySelectorAll('.tx').forEach(b=>b.onclick=()=>{P.tax=+b.dataset.v; keep(()=>budget(),b);});
  on('run',run);
}
/* 画面を書きかえても、スクロールの位置と押したボタンを保つ */
function keep(f,btn){const y=window.scrollY, key=btn&&(btn.className.split(' ')[0]+'|'+(btn.dataset.k||'')+'|'+(btn.dataset.d||btn.dataset.v||btn.dataset.n||''));
  f(); window.scrollTo(0,y);
  if(key){const [c,k,d]=key.split('|');const el=[...app.querySelectorAll('.'+c)].find(x=>(x.dataset.k||'')===k&&((x.dataset.d||x.dataset.v||x.dataset.n||'')===d));
    if(el&&!el.disabled)el.focus({preventScroll:true});}}
/* ---- すすめる → 結果 ---- */
function run(){
  const s=P.s, st=P.st, T=s.turns[st.t], before=clone(st.v);
  const r=SIM.step(G,s,st,Object.assign({},P.alloc),P.tax,true);
  const rows=MAIN.concat(SUB).map(x=>{const d=st.v[x.k]-before[x.k];const small=Math.abs(d)<0.5*Math.pow(10,-x.d);
    return `<tr><th>${esc(x.name)}</th><td>${fmt(x.k,before[x.k])}</td><td>→</td><td><b>${fmt(x.k,st.v[x.k])}</b>${esc(x.unit)}</td><td class="${small?'eq':d>0?'up':'dn'}">${small?'±0':(d>0?'+':'')+fmt(x.k,d)}</td></tr>`;}).join('');
  const E=T.ev;
  const evh=E?`<div class="evc"><span class="yr">${yf(E.y)}年</span><h2 class="nt">${rb(E.title)}</h2><div class="pic">${E.pic}</div><p class="txt">${rb(E.t)}</p>${r.case?`<p class="case">${rb(r.case)}</p>`:''}</div>`:'';
  if(r.fail)return fail(r,evh);
  const last=st.done;
  app.innerHTML=`${head()}<span class="yr">${yspan(T.y,T.yrs)} の結果</span>${evh}
    <div class="label">${T.yrs>1?T.yrs+'年間で':'この1年で'}、${REALM}はこう変わった</div><table class="chg">${rows}</table>
    <div class="pic map">${G.map}</div>
    <div class="row"><button class="btn go" id="nx">${last?'通信簿を見る ▶':'次へ ▶'}</button></div>`;
  paintMap(app,st);
  on('back',home); on('nx',last?report:news); top0();
}
/* ---- 失敗（やさしい説明と、3ターン前から） ---- */
function fail(r,evh){
  const s=P.s, f=G.fails.find(x=>x.k===r.fail), ti=P.st.log[P.st.log.length-1].t, back=Math.max(0,ti-2);
  bump(s.id,1);
  app.innerHTML=`${head()}${evh}<div class="over"><h2>${rb(f.title)}</h2><div class="pic">${f.pic}</div><p class="txt">${rb(f.t)}</p>
    <div class="real"><b>実際にも…</b><p>${rb(s.fail_t[f.k].replace(/^実際にも、?/,''))}</p></div>
    <p class="note">このシナリオは、ここで終わりです。でも、だいじょうぶ。配り方を変えて、もう一度ためしてみよう。</p>
    <div class="row"><button class="btn go" id="retry">${ti-back+1}ターン前（${yf(s.turns[back].y)}年）からやりなおす</button><button class="btn" id="first">最初から</button></div>
    <div><button class="linkbtn" id="list">シナリオ一覧</button></div></div>`;
  on('back',home); on('list',home);
  on('retry',()=>restore(back)); on('first',()=>restore(0));
  top0(); const b=document.getElementById('retry'); b&&b.focus({preventScroll:true});
}
function restore(i){const sn=P.snaps[i];P.st=clone(sn.st);P.alloc=clone(sn.alloc);P.tax=P.st.tax;P.snaps=P.snaps.slice(0,i);news();}
/* ---- 通信簿 ---- */
function report(){
  const s=P.s, st=P.st, rep=SIM.report(G,st), rk=G.ranks.find(x=>x.k===rep.rank)||G.ranks[G.ranks.length-1];
  const key=s.id+':'+rk.k, isNew=!stamps[key]; if(isNew){stamps[key]=Date.now();store.set(STK,stamps);}
  bump(s.id,0);
  const tot=rep.axes.reduce((a,x)=>a+x[2],0), stars=tot>=6?3:tot>=3?2:1;
  track('level_end',{level_name:ID+'-'+s.id,success:true,score:stars});
  const mark=['△ もう少し','○ ふつう','◎ よくできた'];
  const axes=rep.axes.map((a,i)=>`<div class="ax"><div class="axh"><b>${esc(a[0])}</b><span class="g g${a[2]}">${mark[a[2]]}</span></div>
     <span class="bar big" aria-hidden="true"><i style="width:${Math.round(a[1])}%"></i></span><p class="axs">${esc(G.axes[i].say||'')}</p>
     <p class="axr"><b>${REALW}では</b>${rb(s.real[i])}</p></div>`).join('');
  const st0=P.snaps[0]?P.snaps[0].st.v:st.s0;
  const cmp=MAIN.map(x=>`<tr><th>${esc(x.name)}</th><td>${fmt(x.k,st0[x.k])}</td><td>→</td><td><b>${fmt(x.k,st.v[x.k])}</b>${esc(x.unit)}</td></tr>`).join('');
  const nen=[];
  s.turns.forEach(T=>{nen.push([yspan(T.y,1),T.title]); if(T.ev&&plain(T.ev.title)!==plain(T.title))nen.push([yf(T.ev.y)+'年',T.ev.title]);});
  const ix=SCN.indexOf(s), nx=SCN[ix+1];
  app.innerHTML=`${head()}<p class="endh">🎉 シナリオ${s.no}「${rb(s.title)}」おしまい！</p>
    <div class="rank"><span class="rp">${rk.pic}</span><div><span class="label">あなたは</span><p class="rn">${esc(rk.name)}</p><p class="note" style="color:var(--fg)">${esc(rk.t)}</p>${isNew?'<p class="got">✓ 新しいはんこを手に入れた！</p>':''}
      <span class="stars" aria-label="星 ${stars}こ">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</span></div></div>
    <div class="label">通信簿　あなたの${REALM} と ${REALW}</div><div class="axes">${axes}</div>
    <div class="label">はじめ → おわり</div><table class="chg">${cmp}</table>
    <p class="lesson"><b>まとめ</b>${rb(s.real_end)}</p>
    <div class="label">年表　${esc(s.years)}</div><dl class="timeline">${nen.map(e=>`<dt>${esc(e[0])}</dt><dd>${rb(e[1])}</dd>`).join('')}</dl>
    <div class="label">${esc(G.words_label||'用語')}</div><ul class="words">${s.words.map(w=>`<li><b>${rb(w[0])}</b>${rb(w[1])}</li>`).join('')}</ul>
    <div class="row">${nx?`<button class="btn go" id="next">次のシナリオ「${rb(nx.title)}」</button>`:''}<button class="btn${nx?'':' go'}" id="list">シナリオ一覧</button><button class="linkbtn" id="again">もう一度このシナリオを</button></div>${PAID?'':PAIDLINK}`;
  on('back',home); on('list',home); on('again',()=>intro(s)); if(nx)on('next',()=>intro(nx));
  top0();
}
return {home:home};
})();
async function decrypt(){ return mnAccess.load(GAME.id); }
function lockScreen(err){ mnAccess.lock(app,{game:GAME.id,err:err,free:GAME.id+'.html',onOpen:async()=>{ SCN=await decrypt(); UI.home(); }}); }
(async()=>{
  if(!PAID){ UI.home(); return; }
  try{ SCN=await decrypt(); UI.home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
