<div class="wrap">
  <header>

    <p class="lead">情報の特性・知的財産権・個人情報とSNS・情報セキュリティ・情報デザイン。5つのレベルから1問ずつ。全5問。</p>

<script type="application/json" id="data">{}</script>
<script>
(function(){
/* 問題データ: c=分野, lv=難しさ（1基本 2標準 3発展）, q=問題, a=正解, d=まちがいの選択肢3つ, e=解説 */
const PAID=false;
let QS=[{"c":"L1","lv":1,"q":"SNSに投稿した写真を自分で消しても、ほかの人が保存していれば残り続ける。これは情報のどの性質による？","a":"残存性","d":["伝播性","可用性","一覧性"],"e":"情報は一度発信すると完全に消すのが難しく、残り続けます。これを残存性といいます。"},{"c":"L2","lv":2,"q":"日本の著作権の保護期間は、原則としていつまで？","a":"著作者の死後70年","d":["著作者の死後50年","創作から20年","創作から10年"],"e":"著作権の保護期間は、原則として著作者の死後70年までです。"},{"c":"L3","lv":3,"q":"個人情報保護法でいう「個人情報」の説明として正しいものは？","a":"生存する個人に関する情報で、特定の個人を識別できるもの","d":["有名人についての情報だけ","会社や団体についての情報","亡くなった人についての情報だけ"],"e":"個人情報は、生きている個人に関する情報で、氏名・顔写真などから特定の個人を識別できるものです。"},{"c":"L4","lv":4,"q":"次のうち、安全なパスワードのつけ方として最も適切なものは？","a":"長く推測されにくいものにし、サービスごとに変える","d":["覚えやすいように誕生日にする","すべてのサービスで同じものを使う","短くして毎日紙に書いて持ち歩く"],"e":"パスワードは長く、推測されにくく、使い回さないことが基本です。"},{"c":"L5","lv":5,"q":"年齢・障害の有無・国籍などにかかわらず、はじめからだれもが使いやすいように設計する考え方を何という？","a":"ユニバーサルデザイン","d":["バリアフリー","インフォグラフィックス","ステルスマーケティング"],"e":"ユニバーサルデザインは、できるだけ多くの人が使いやすいように最初から設計する考え方です。"}];
const CATS={L1:["レベル1 情報の特性とメディアリテラシー","残存性・複製性・伝播性、情報源の確かめ方"],L2:["レベル2 知的財産権","著作権・産業財産権・引用・クリエイティブ・コモンズ"],L3:["レベル3 個人情報とSNS","個人情報・肖像権・SNSのトラブル"],L4:["レベル4 情報セキュリティ","パスワード・多要素認証・フィッシング・マルウェア"],L5:["レベル5 情報デザインと問題解決","ユニバーサルデザイン・ピクトグラム・問題解決の手順"]};
const LVN={1:'基本',2:'標準',3:'発展'};
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const qhtml=s=>esc(s).replace(/(正しくないもの|あてはまらないもの)/g,'<em>$1</em>').split('\n').map(l=>'<span class="ln">'+(l||'&nbsp;')+'</span>').join('');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const norm=s=>s.normalize('NFKC').toLowerCase().replace(/[\s\-ー－]/g,'');
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let G=null, shopUrl='', course=null;
let best=store.get(PAID?'c-joho1-p-best':'c-joho1-best',{}), rec=store.get('c-joho1-p-rec',{});
const saveRec=()=>store.set('c-joho1-p-rec',rec);
const qkey=q=>q.q;
const state=q=>{const r=rec[qkey(q)];if(!r)return 'new';if(r[0]>=2&&r[0]>r[1])return 'master';if(r[1]>0)return 'weak';return 'try';};
const RVID=location.pathname.split('/').pop().replace(/(-full)?(\.html)?$/,'');
const record=(q,ok)=>{if(!PAID)return false;window.mnReview&&mnReview.mark(RVID,qkey(q),ok);const before=state(q);const r=rec[qkey(q)]||[0,0];r[ok?0:1]++;rec[qkey(q)]=r;saveRec();return state(q)==='master'&&before!=='master';};
const PAIDLINK=`<a class="paid" href="c-joho1-full.html" id="paid-link"><span class="pt">もっと練習したい人へ　<b>情報社会と情報モラル 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。情報の特性とメディアリテラシー、知的財産権、個人情報とSNS、情報セキュリティ、情報デザインと問題解決の5段階、各20問。</span></a>`;
const TIMELINE=`<dl class="matome"><dt>情報の特性</dt><dd>残存性（消えずに残る・人に渡しても手元からなくならない）、複製性（簡単にコピーでき、デジタルなら劣化しにくい）、伝播性（短時間で広い範囲に伝わる）</dd><dt>メディアリテラシー</dt><dd>メディアの情報をうのみにせず、発信者・日時・根拠を確かめる。複数の情報源でクロスチェック。一次情報（当事者や直接の観察）にあたる</dd><dt>著作権</dt><dd>創作した時点で自動的に発生（届け出不要）。保護期間は原則、著作者の死後70年。著作者人格権（公表権・氏名表示権・同一性保持権）は譲渡できない</dd><dt>産業財産権</dt><dd>特許庁に出願・登録して得る。特許権（発明・出願から20年）、実用新案権（考案・出願から10年）、意匠権（デザイン）、商標権（マーク・登録から10年、更新できる）</dd><dt>引用</dt><dd>必要な範囲で、自分の文章が主・引用は従。かぎかっこなどで区別し、出典を示し、内容を変えない</dd><dt>クリエイティブ・コモンズ</dt><dd>作者が利用の条件を示すしくみ。BY（表示）・NC（非営利）・ND（改変禁止）・SA（継承）</dd><dt>個人情報</dt><dd>生存する個人を特定できる情報。第三者に渡すときは原則本人の同意が必要。写真の位置情報や写りこみにも注意</dd><dt>情報セキュリティ</dt><dd>機密性・完全性・可用性。パスワードは長く・推測されにくく・使い回さない。多要素認証は知識・所持・生体のうち2種類以上を組み合わせる</dd><dt>情報デザインと問題解決</dt><dd>抽象化・可視化・構造化。ユニバーサルデザイン、アクセシビリティ。問題の発見→明確化→解決案の検討→実行→評価（PDCA）</dd></dl>`;

async function decrypt(){ return mnAccess.load('c-joho1'); }
function lockScreen(err){ mnAccess.lock(app,{game:'c-joho1',err:err,free:'c-joho1.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
function home(){
  G=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>
    <p style="margin:0">4つの中から正しいものをえらぼう。答えたあとに解説が出ます。</p>
    <details><summary style="cursor:pointer;font-weight:700;font-size:14px">情報社会と情報モラルのまとめを見る</summary><div style="margin-top:8px">${TIMELINE}</div></details>
    <div class="row"><button class="btn go" id="go">はじめる（${QS.length}問）</button>${best.free!=null?`<span class="note">ベスト ${best.free} / ${QS.length}</span>`:''}</div>${PAIDLINK}`;
  document.getElementById('go').onclick=()=>{course='free';start(shuffle(QS));};
}
function homePaid(){
  const cnt={master:0,weak:0,new:0,try:0}; QS.forEach(q=>cnt[state(q)]++);
  const weak=QS.filter(q=>state(q)==='weak'), fresh=QS.filter(q=>state(q)==='new');
  app.innerHTML=`<div class="master"><div class="tp"><span class="label" style="font-size:14px;color:var(--fg)">覚えた問題</span><span class="cnt">${cnt.master}<small> / ${QS.length}問</small></span></div>
      <div class="mbar" aria-hidden="true"><i class="m" style="width:${cnt.master/QS.length*100}%"></i><i class="w2" style="width:${cnt.weak/QS.length*100}%"></i></div>
      <div class="mleg"><span style="--c:var(--ok)">覚えた ${cnt.master}</span><span style="--c:var(--gold)">にがて ${cnt.weak}</span><span style="--c:var(--rule)">まだ ${cnt.new}</span></div></div>
    <div class="label">レベルをえらぶ（1回10問）</div>
    <div class="cats">${Object.entries(CATS).map(([k,[nm,ds]])=>{const m=QS.filter(q=>q.c===k&&state(q)==='master').length;const n=QS.filter(q=>q.c===k).length;
        return `<button class="cat" data-l="${k}"><span class="nm">${nm}</span><span class="ds">${ds}<br>覚えた ${m} / ${n}問</span><span class="best">${best[k]!=null?`ベスト ${best[k]}/10`:''}</span></button>`;}).join('')}
      <button class="cat" data-l="all"><span class="nm">情報社会と情報モラルまるごと</span><span class="ds">5つのレベルからランダムに10問</span><span class="best">${best.all!=null?`ベスト ${best.all}/10`:''}</span></button>
      ${window.mnReview?(()=>{const n=QS.filter(q=>mnReview.isDue(RVID,qkey(q))).length;return `<button class="cat" data-l="review" ${n?'':'disabled'}><span class="nm">今日の解き直し</span><span class="ds">前にまちがえた問題を、日をあけてもう一度（${n}問）</span></button>`;})():''}
      <button class="cat" data-l="weak" ${weak.length?'':'disabled'}><span class="nm">にがて</span><span class="ds">まちがえたことのある問題（${weak.length}問）</span></button>
      <button class="cat" data-l="fresh" ${fresh.length?'':'disabled'}><span class="nm">まだやっていない</span><span class="ds">一度も出ていない問題（${fresh.length}問）</span></button></div>
    <details><summary style="cursor:pointer;font-weight:700;font-size:14px">情報社会と情報モラルのまとめを見る</summary><div style="margin-top:8px">${TIMELINE}</div></details>
    <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
  app.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{
    const l=b.dataset.l; course=l;
    const pool=l==='review'?QS.filter(q=>mnReview.isDue(RVID,qkey(q))):l==='weak'?weak:l==='fresh'?fresh:l==='all'?QS:QS.filter(q=>q.c===l);
    start(shuffle(pool).slice(0,10));
  });
  document.getElementById('reset').onclick=()=>{
    document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
    document.getElementById('yes').onclick=()=>{rec={};saveRec();homePaid();};
    document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
  };
}
function start(list){
  G={list,i:0,score:0,miss:[],n:list.length};
  track('level_start',{level_name:(PAID?'c-joho1-p-':'c-joho1-')+course});
  newQ();
}
function figSVG(f){
  if(f.tbl){ const t=f.tbl; return `<div class="tblw">${t.cap?`<p class="tblcap">${esc(t.cap)}</p>`:''}<table class="dtbl"><tr>${t.head.map((h,i)=>`<th${i?'':' class="rh"'}>${esc(h)}</th>`).join('')}</tr>${t.rows.map(r=>`<tr>${r.map((c,i)=>i?`<td>${esc(c)}</td>`:`<th class="rh">${esc(c)}</th>`).join('')}</tr>`).join('')}</table></div>`; }
  /* てこ・棒・ばねの図。線は濃い色、おもりは四角、ばねばかりの引く力は矢印 */
  const L=(a,b,c,d)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}"/>`;
  const T=(x,y,t,cls,anc)=>`<text x="${x}" y="${y}" class="${cls||'lb'}" text-anchor="${anc||'middle'}">${esc(t)}</text>`;
  const W=(x,y,lb)=>`<rect x="${x-14}" y="${y}" width="28" height="20" rx="2" fill="#dfe3ea"/>`+T(x,y+36,lb);
  const UP=(x,y1,y2,lb)=>L(x,y1,x,y2)+`<path d="M${x-6},${y2+9} L${x},${y2} L${x+6},${y2+9}"/>`+T(x,y2-6,lb);
  const DN=(x,y1,y2,lb)=>L(x,y1,x,y2)+`<path d="M${x-6},${y2-9} L${x},${y2} L${x+6},${y2-9}"/>`+T(x,y2+16,lb);
  const spr=(x,y1,y2)=>{const n=8,h=(y2-y1-12)/n;let d=`M${x},${y1} L${x},${y1+6}`;for(let i=0;i<n;i++)d+=` L${x+(i%2?-9:9)},${y1+6+h*(i+.5)}`;d+=` L${x},${y2-6} L${x},${y2}`;return `<path d="${d}"/>`;};
  const sprH=(x1,x2,y)=>{const n=8,w=(x2-x1-12)/n;let d=`M${x1},${y} L${x1+6},${y}`;for(let i=0;i<n;i++)d+=` L${x1+6+w*(i+.5)},${y+(i%2?-9:9)}`;d+=` L${x2-6},${y} L${x2},${y}`;return `<path d="${d}"/>`;};
  const ceil=(a,b)=>L(a,14,b,14)+Array.from({length:Math.floor((b-a)/12)},(_,i)=>L(a+6+i*12,14,a+i*12,6)).join('');
  let g='',vb='0 0 320 170';
  if(f.lev){ const o=f.lev,c=160,u=22,y=48; vb='0 0 320 140';
    g+=`<rect x="${c-6*u-10}" y="${y-3}" width="${12*u+20}" height="6" rx="2" fill="#c9ced8"/>`;
    for(let i=1;i<=6;i++){ g+=L(c-i*u,y-3,c-i*u,y+3)+L(c+i*u,y-3,c+i*u,y+3)+T(c-i*u,y-9,String(i),'tk')+T(c+i*u,y-9,String(i),'tk'); }
    g+=`<path d="M${c},${y+3} L${c-10},${y+28} L${c+10},${y+28} Z" fill="#c9ced8"/>`+L(c-15,y+28,c+15,y+28);
    const hang=(x,lb,k)=>{ if(lb[0]==='↓') return DN(x,y+3,y+60,lb.slice(1)); return L(x,y+3,x,y+42+k*0)+W(x,y+42,lb); };
    o.L.forEach(([p,lb])=>g+=hang(c-p*u,lb,0)); o.R.forEach(([p,lb])=>g+=hang(c+p*u,lb,0));
  }
  if(f.bar){ const o=f.bar,x0=30,x1=290,y=74,X=p=>x0+p/o.len*(x1-x0); vb='0 0 320 175';
    g+=`<rect x="${x0}" y="${y-4}" width="${x1-x0}" height="8" rx="2" fill="#c9ced8"/>`+T(160,y-34,'棒の長さ '+o.len+'cm','tk');
    g+=L(x0,y-24,x0,y-16)+L(x1,y-24,x1,y-16)+L(x0,y-20,x1,y-20);
    if(o.f!=null){ const fx=X(o.f); g+=`<path d="M${fx},${y+4} L${fx-12},${y+28} L${fx+12},${y+28} Z" fill="#c9ced8"/>`+T(fx,y+42,'支点','tk'); if(o.f>0&&o.f<o.len) g+=T((x0+fx)/2,y+18,o.f+'cm','tk'); }
    if(o.m) g+=`<circle cx="160" cy="${y}" r="3.5" fill="#232a36" stroke="none"/>`+T(160,y+60,'棒の重さ '+o.m+'（一様）','tk');
    (o.w||[]).forEach(([p,lb])=>{const x=X(p); g+=L(x,y+4,x,y+20)+W(x,y+20,lb); if(p>0&&p<o.len) g+=T((x0+x)/2,y+18,p+'cm','tk');});
    (o.up||[]).forEach(([p,lb])=>{const x=X(p); g+=UP(x,y-4,y-46+12,lb).replace('','');});
  }
  if(f.spr){ const o=f.spr,w=o.w; vb='0 0 320 200';
    if(o.t==='one') g+=ceil(130,190)+spr(160,14,110)+W(160,110,w[0]);
    if(o.t==='ser') g+=ceil(130,190)+spr(160,14,72)+`<circle cx="160" cy="76" r="4" fill="#232a36" stroke="none"/>`+spr(160,80,140)+W(160,140,w[0])+T(184,48,'A','tk','start')+T(184,114,'A','tk','start');
    if(o.t==='ser2') g+=ceil(130,190)+spr(160,14,66)+`<rect x="146" y="66" width="28" height="20" rx="2" fill="#dfe3ea"/>`+T(186,81,w[0],'lb','start')+spr(160,86,142)+W(160,142,w[1]);
    if(o.t==='par') g+=ceil(80,240)+spr(110,14,104)+spr(210,14,104)+`<rect x="90" y="104" width="140" height="6" rx="2" fill="#c9ced8"/>`+L(160,110,160,124)+W(160,124,w[0]);
    if(o.t==='paroff') g+=ceil(80,240)+spr(100,14,104)+spr(220,14,104)+`<rect x="96" y="104" width="128" height="6" rx="2" fill="#c9ced8"/>`+L(140,110,140,124)+W(140,124,w[0])+T(120,100,'10cm','tk')+T(180,100,'20cm','tk');
    if(o.t==='wall') g+=sprH(100,220,40)+L(70,40,100,40)+L(220,40,250,40)+`<circle cx="70" cy="52" r="12"/><circle cx="250" cy="52" r="12"/>`+L(58,52,58,110)+L(262,52,262,110)+W(58,110,w[0])+W(262,110,w[1])+L(70,64,250,64);
  }
  return `<div class="fig"><svg viewBox="${vb}" role="img" aria-label="問題の図"><g stroke="#232a36" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">${g}</g></svg></div>`;
}
function newQ(){ const q=G.list[G.i]; G.ch=shuffle([q.a,...q.d]); G.done=false; G.pick=null; render(); }
function render(){
  const q=G.list[G.i], d=G.done;
  app.innerHTML=`<div class="top"><div class="prog" aria-hidden="true"><i style="width:${G.i/G.n*100}%"></i></div><span class="nums">${G.i+1} / ${G.n}</span><span class="tag">${CATS[q.c][0]}</span></div>
    <p class="q">${qhtml(q.q)}</p>
    ${q.fig?figSVG(q.fig):''}
    <div class="ch">${G.ch.map((c,i)=>`<button class="op ${d?(c===q.a?'right':c===G.pick?'wrong':''):''}" data-i="${i}" ${d?'disabled':''}><span class="k">${'アイウエ'[i]}</span><span>${esc(c)}</span></button>`).join('')}</div>
    <div id="after"></div>`;
  app.querySelectorAll('.op').forEach(b=>b.onclick=()=>pick(G.ch[+b.dataset.i]));
  if(d)explain();
}
function pick(c){
  if(G.done)return;
  const q=G.list[G.i];
  G.done=true; G.pick=c; G.ok=c===q.a; G.newM=record(q,G.ok);
  if(G.ok)G.score++; else G.miss.push(q);
  track('answer_question',{category:'c-joho1-'+q.c,question:q.q.slice(0,90),correct:G.ok});
  render();
}
function explain(){
  const q=G.list[G.i], last=G.i===G.n-1;
  document.getElementById('after').innerHTML=`<div class="box" style="padding:14px;gap:12px;border-color:${G.ok?'var(--ok)':'var(--ng)'}">
    <div class="res"><div class="seal ${G.ok?'':'x'}" aria-hidden="true">${G.ok?'正':'惜'}</div>
      <div class="t"><span class="v ${G.ok?'ok':'ng'}">${G.ok?'正解！':'ざんねん'}${G.newM?'<span style="font-size:13px;margin-left:8px;color:var(--ok);font-family:var(--body);font-weight:700">覚えた！</span>':''}</span>
      <span>答え：<b>${esc(q.a)}</b></span></div></div>
    <div class="ex">${esc(q.e)}</div>
    <div class="row"><button class="btn go" id="next">${last?'結果を見る':'次の問題へ'}</button></div></div>`;
  const nx=document.getElementById('next'); nx.onclick=next; nx.focus({preventScroll:true});
}
function next(){ if(++G.i<G.n)newQ(); else result(); }
function result(){
  const n=G.n,s=G.score,r=s/n;
  const rank=r===1?'満点':r>=.8?'特選':r>=.6?'入選':r>=.4?'佳作':'もう一歩';
  track('level_end',{level_name:(PAID?'c-joho1-p-':'c-joho1-')+course,success:s===n,score:s,total:n});
  const bk=PAID?(CATS[course]||course==='all'?course:null):'free';
  if(bk&&(best[bk]==null||s>best[bk])){best[bk]=s;store.set(PAID?'c-joho1-p-best':'c-joho1-best',best);}
  app.innerHTML=`<div class="label">結果</div>
    <div class="score"><div class="big">${s}<small> / ${n}問</small></div><div class="rank">${rank}</div></div>
    <p style="margin:0">${r===1?'全問正解！情報社会と情報モラルはばっちりです。':r>=.6?'よくできました。まちがえた問題の解説を読み直そう。':'まちがえた問題の解説を読み直して、もう一度ちょうせんしよう。'}</p>
    <div class="row"><button class="btn go" id="again">${PAID?'分野をえらぶ':'もう一度'}</button>${G.miss.length?'<button class="btn" id="retry">まちがえた問題だけ</button>':''}</div>
    ${PAID?'':PAIDLINK}
    ${G.miss.length?`<div class="label" style="color:var(--fg)">まちがえた問題</div>${G.miss.map(q=>`<div class="rv">${esc(q.q)}<br>→ <b>${esc(q.a)}</b></div>`).join('')}`:''}`;
  document.getElementById('again').onclick=()=>PAID?home():(course='free',start(shuffle(QS)));
  const rt=document.getElementById('retry'); if(rt)rt.onclick=()=>{course='retry';start(shuffle(G.miss));};
}
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
