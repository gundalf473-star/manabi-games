<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>カタカナへんしん 100問</h1>
    <p class="lead">カタカナのことばの字を1つかえて、べつのことばにへんしんさせよう。5つのレベルに20問ずつ。ヒントやまちがいなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=true;
let QS=[];
const ID='katakanahenshin';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>カタカナへんしん 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* カタカナへんしん：kind='one'（s→t を1回で。ops:'c'かえる 'cad'かえる・たす・ひく, pal:使える字, clue:tの意味）
   'mean'（dir:'k2j' カタカナ→意味 / 'j2k' 意味→カタカナ, w, a, ds）
   'chain'（path:[s,…,g], pal, clues:[とちゅう…ゴールの意味], near:[i番目から道をはずれたことば], hide:とちゅうの意味をかくす） */
const HINTWORD='ヒントやまちがい';
const LVD={1:'1文字かえる（2〜3文字）',2:'かえる・たす・ひく',3:'カタカナのことばと日本語の意味',4:'2回へんしん（意味のヒントつき）',5:'3回へんしん（ゴールだけ）'};
const RULES=`<ol class="rules">
  <li>カタカナのことばの<b>字をタップ</b>してえらび、下の字をタップすると<b>その字にかわります</b>。</li>
  <li>レベル2からは、字と字の間の「<b>＋</b>」で<b>字をたす</b>、「<b>この字をけす</b>」で<b>字をひく</b>こともできます。</li>
  <li>1回のへんしんで変えられるのは<b>1文字だけ</b>。へんしんしたら、いつも<b>本当にあることば</b>になるようにしよう。</li>
  <li>レベル3は、カタカナのことばと日本語の意味を4つからえらびます。</li>
  <li>レベル4・5は、何回かへんしんして<b>ゴールのことば</b>にたどりつこう。</li></ol>`;
const rb=s=>esc(s).replace(/\{([^|}]+)\|([^}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>');
const plain=s=>String(s).replace(/\{([^|}]+)\|([^}]+)\}/g,'$1');
function opOf(a,b){a=[...a];b=[...b];
  if(a.length===b.length){const d=a.map((c,i)=>c!==b[i]?i:-1).filter(i=>i>=0);return d.length===1?{t:'c',i:d[0],ch:b[d[0]],old:a[d[0]]}:null;}
  if(b.length===a.length+1){for(let i=0;i<b.length;i++)if(b.slice(0,i).concat(b.slice(i+1)).join('')===a.join(''))return {t:'a',i,ch:b[i]};}
  if(a.length===b.length+1){for(let i=0;i<a.length;i++)if(a.slice(0,i).concat(a.slice(i+1)).join('')===b.join(''))return {t:'d',i,old:a[i]};}
  return null;}
const opText=(a,b)=>{const o=opOf(a,b);if(!o)return '';
  if(o.t==='c')return `「${o.old}」を「${o.ch}」にかえる`;
  if(o.t==='a')return `${o.i===0?'いちばん前':o.i===[...a].length?'いちばん後ろ':`${o.i}文字目のあと`}に「${o.ch}」をたす`;
  return `「${o.old}」をけす`;};
function startStage(p){P=p;S={hints:0,done:false,msg:'',msgc:'',sel:null,step:0,w:[...(p.kind==='chain'?p.path[0]:p.s||'')],hk:0,hstep:-1,
  opts:p.kind==='mean'?shuffle([p.a,...p.ds]):null,wrong:[],hint:false};begin(p);draw();}
const goalNow=()=>P.kind==='chain'?P.path[S.step+1]:P.t;
function wordEd(){
  const w=S.w,add=P.ops.includes('a'),base=P.kind==='chain'&&P.hide&&S.step+1<P.path.length-1?1:0,hk=S.hstep===S.step?S.hk-base:0,o=hk>0?opOf(w.join(''),goalNow()):null;
  let h='';
  for(let i=0;i<=w.length;i++){
    if(add){const on=S.sel&&S.sel.t==='a'&&S.sel.i===i,hl=o&&o.t==='a'&&o.i===i;
      h+=`<button class="khgap ${on?'on':''} ${hl?'hl':''}" data-a="${i}" aria-label="${i+1}番目に字をたす">＋</button>`;}
    if(i<w.length){const on=S.sel&&S.sel.t==='c'&&S.sel.i===i,hl=o&&o.t!=='a'&&o.i===i;
      h+=`<button class="khch ${on?'on':''} ${hl?'hl':''}" data-c="${i}" aria-label="${i+1}文字目">${esc(w[i])}</button>`;}
  }
  return `<div class="khword ${add?'add':''} ${w.length>=4?'n4':''}">${h}</div>`;
}
function palette(){
  const can=!!S.sel,del=P.ops.includes('d')&&S.sel&&S.sel.t==='c'&&S.w.length>1;
  return `<div class="khpal">${P.pal.map(ch=>`<button class="khp" data-p="${esc(ch)}" ${can?'':'disabled'}>${esc(ch)}</button>`).join('')}</div>
    ${P.ops.includes('d')?`<div class="row" style="justify-content:center"><button class="btn" id="del" ${del?'':'disabled'}>この字をけす</button></div>`:''}`;
}
function selMsg(){
  if(!S.sel)return P.ops.includes('a')?'かえたい字か、字をたしたい「＋」をタップしよう。':'かえたい字をタップしよう。';
  if(S.sel.t==='a')return '「＋」のところに入れる字を、下からえらぼう。';
  return P.ops.includes('d')?`「${S.w[S.sel.i]}」を、下の字にかえるか、けそう。`:`「${S.w[S.sel.i]}」を、下のどの字にかえる？`;
}
function chainBar(){
  const p=P.path,k=p.length-1;
  return `<div class="khchain">${p.map((w,i)=>{const known=i<=S.step||i===k||S.done;
    return `${i?'<span class="kharr">→</span>':''}<span class="khnode ${i===S.step&&!S.done?'cur':''} ${known?'':'q'} ${i===k?'g':''}">${known?esc(w):'？'}</span>`;}).join('')}</div>`;
}
function clueBox(){
  if(P.kind==='one')return `<div class="khq"><span class="khtag">${P.ops==='c'?'1文字かえる':'かえる・たす・ひく（1回）'}</span>
    <p class="khbig">「<b>${esc(P.s)}</b>」を<b>1回</b>へんしんさせて、つぎのことばにしよう。</p><p class="khclue">${esc(P.clue)}</p></div>`;
  const k=P.path.length-1,left=k-S.step,nxt=S.step+1;
  const showClue=!P.hide||nxt===k||(S.hstep===S.step&&S.hk>=1);
  return `<div class="khq"><span class="khtag">${k}回へんしん</span>
    <p class="khbig">「<b>${esc(P.path[0])}</b>」から「<b>${esc(P.path[k])}</b>」へ</p>
    ${chainBar()}
    ${S.done?'':`<p class="note" style="margin:0">あと <b>${left}回</b>。次のことば${nxt===k?'（ゴール）':''}：</p><p class="khclue">${showClue?esc(P.clues[S.step]):'？？？（ヒントを使うと意味が出ます）'}</p>`}</div>`;
}
function hintBtn(){
  if(P.kind==='mean')return `<button class="btn" id="hint" ${S.hint?'disabled':''}>ヒント</button>`;
  const max=P.kind==='chain'&&P.hide&&S.step+1<P.path.length-1?3:2,hk=S.hstep===S.step?S.hk:0;
  return `<button class="btn" id="hint" ${hk>=max?'disabled':''}>ヒント</button><button class="btn" id="reset">やりなおす</button>`;
}
function hintText(){
  if(P.kind==='mean')return P.dir==='k2j'?'英語などから来たことばです。ことばが使われている場面を思いうかべよう。':'その意味のことばを、英語などで何と言うか思い出そう。ほかの3つの意味も考えて、ちがうものを消していこう。';
  const hk=S.hstep===S.step?S.hk:0;if(!hk)return '';
  const o=opOf(S.w.join(''),goalNow());if(!o)return '';const base=P.kind==='chain'&&P.hide&&S.step+1<P.path.length-1?1:0;
  if(hk<=base)return '次のことばの意味を出しました。';
  const where=o.t==='c'?`${o.i+1}文字目の「${o.old}」をかえる`:o.t==='a'?'光っている「＋」に字をたす':`${o.i+1}文字目の「${o.old}」をけす`;
  if(hk===base+1)return `光っているところを見よう：${where}。`;
  return `${where}。${o.t==='d'?'':`入れる字は「${o.ch}」。`}`;
}
function meanTxt(s){return P.dir==='k2j'?(P.kind==='mean'&&s===P.w?esc(s):rb(s)):esc(s);}
function draw(){
  if(P.kind==='mean')return drawMean();
  const ht=S.done?'':hintText();
  app.innerHTML=`${topBar()}
    ${clueBox()}
    ${S.done?'':`<div class="boardw khbw">${wordEd()}</div>
    ${palette()}
    ${ht?`<p class="hintbox">${ht}</p>`:''}
    <p class="msg ${S.msgc}" id="msg">${S.msg||selMsg()}</p>
    <div class="row">${hintBtn()}</div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){
    let ex;
    if(P.kind==='one')ex=`<p style="margin:0">「${esc(P.s)}」の${esc(opText(P.s,P.t))}と「<b>${esc(P.t)}</b>」。${esc(P.clue)}。</p>`;
    else ex=`<p style="margin:0">${P.path.slice(1).map((w,i)=>`${esc(P.path[i])} → <b>${esc(w)}</b>（${esc(opText(P.path[i],w))}）`).join('<br>')}</p><p class="note" style="margin:0">この字だけを使って、${P.path.length-1}回でとどく道はこの1本だけです。</p>`;
    showClear(ex);return;}
  app.querySelectorAll('.khch').forEach(b=>b.onclick=()=>{const i=+b.dataset.c;S.sel=S.sel&&S.sel.t==='c'&&S.sel.i===i?null:{t:'c',i};S.msg='';S.msgc='';draw();});
  app.querySelectorAll('.khgap').forEach(b=>b.onclick=()=>{const i=+b.dataset.a;S.sel=S.sel&&S.sel.t==='a'&&S.sel.i===i?null:{t:'a',i};S.msg='';S.msgc='';draw();});
  app.querySelectorAll('.khp').forEach(b=>b.onclick=()=>{if(!S.sel)return;const ch=b.dataset.p,w=S.w.slice();
    if(S.sel.t==='c'){if(w[S.sel.i]===ch){S.msg='同じ字です。ちがう字をえらぼう。';S.msgc='ng';draw();return;}w[S.sel.i]=ch;}else w.splice(S.sel.i,0,ch);
    tryWord(w);});
  const del=document.getElementById('del');if(del)del.onclick=()=>{if(!S.sel||S.sel.t!=='c'||S.w.length<2)return;const w=S.w.slice();w.splice(S.sel.i,1);tryWord(w);};
  document.getElementById('hint').onclick=()=>{if(S.hstep!==S.step){S.hstep=S.step;S.hk=0;}S.hk++;S.hints++;
    const o=opOf(S.w.join(''),goalNow());if(S.hk>=(P.kind==='chain'&&P.hide&&S.step+1<P.path.length-1?2:1))S.sel={t:o.t==='a'?'a':'c',i:o.i};S.msg='';S.msgc='';draw();};
  document.getElementById('reset').onclick=()=>{S.step=0;S.w=[...(P.kind==='chain'?P.path[0]:P.s)];S.sel=null;S.hstep=-1;S.hk=0;S.msg='';S.msgc='';draw();};
}
function tryWord(w){
  const nw=w.join(''),goal=goalNow();S.sel=null;
  if(nw===goal){
    if(P.kind==='one'){S.w=w;S.done=true;draw();return;}
    S.step++;S.w=w;S.hstep=-1;S.hk=0;
    if(S.step===P.path.length-1){S.done=true;}else{S.msg=`「${nw}」にへんしん！　つぎは あと${P.path.length-1-S.step}回。`;S.msgc='ok';}
    draw();return;}
  S.hints++;
  if(P.kind==='one')S.msg=`「${nw}」では、ヒントのことばになりません。もう一度考えよう。`;
  else if(S.step>0&&nw===P.path[S.step-1])S.msg=`「${nw}」は、1つ前のことばにもどってしまいます。先へ進むへんしんを考えよう。`;
  else if(P.near[S.step].includes(nw))S.msg=`「${nw}」はことばだけど、そこからでは、あと${P.path.length-2-S.step}回でゴールにとどきません。べつのへんしんを考えよう。`;
  else if(P.hide&&S.step+1<P.path.length-1&&!(S.hstep===S.step&&S.hk>=1))S.msg=`「${nw}」では、ゴールへの道になりません。べつのへんしんを考えよう。`;
  else S.msg=`「${nw}」では、ヒントに合うことばになりません。もう一度考えよう。`;
  S.msgc='ng';draw();
}
function drawMean(){
  const q=P.dir==='k2j'?`「<b>${esc(P.w)}</b>」は、日本語で言うと どれ？`:`「<b>${rb(P.w)}</b>」を、カタカナのことばで言うと どれ？`;
  app.innerHTML=`${topBar()}
    <div class="khq"><span class="khtag">${P.dir==='k2j'?'カタカナ → 意味':'意味 → カタカナ'}</span><p class="khbig" style="font-size:20px">${q}</p></div>
    <div class="opts4 txt">${S.opts.map((o,i)=>`<button class="ob ${S.done&&o===P.a?'right':''} ${S.wrong.includes(i)?'wrong':''}" data-i="${i}" ${S.done||S.wrong.includes(i)?'disabled':''}><span class="k">${'アイウエ'[i]}</span><b style="font-size:20px">${P.dir==='k2j'?rb(o):esc(o)}</b></button>`).join('')}</div>
    ${S.hint&&!S.done?`<p class="hintbox">${hintText()}</p>`:''}
    ${S.done?'':`<p class="msg ${S.msgc}" id="msg">${S.msg||''}</p><div class="row">${hintBtn()}</div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){const k=P.dir==='k2j'?P.w:P.a,j=P.dir==='k2j'?P.a:P.w;showClear(`<p style="margin:0">「${esc(k)}」は「${rb(j)}」という意味です。</p>`);return;}
  app.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(S.opts[i]===P.a){S.done=true;}else{S.wrong.push(i);S.hints++;S.msg='ちがいます。もう一度考えてみよう。';S.msgc='ng';}drawMean();});
  document.getElementById('hint').onclick=()=>{S.hint=true;S.hints++;S.msg='';drawMean();};
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
