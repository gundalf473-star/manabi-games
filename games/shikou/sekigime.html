時計回りに2つ目","★から時計回りに3つ目","★から時計回りに4つ目","★から時計回りに5つ目"],"id":"5-01","lv":5}];

const bindBack=()=>{document.getElementById('back').onclick=home;};

/* ======== パズルごとの部分 ======== */

const SKA={'うさぎ':['#ffffff','#f5b8c8'],'くま':['#b07a4a','#7a4f2a'],'ねこ':['#d6d0c8','#7d756b'],'きつね':['#f0953a','#ffffff'],'たぬき':['#a08a74','#4a3b2e'],'パンダ':['#ffffff','#2a2520']};

    bg=`<rect x="20" y="8" width="${W-40}" height="26" rx="6" fill="#c4b5fd"/><text x="${W/2}" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#3b2f6b" font-family="sans-serif">前（ステージ）</text>
      <rect x="6" y="118" width="${W-12}" height="12" rx="6" fill="#d9c3a5"/>
      <text x="10" y="146" font-size="12" font-weight="700" fill="#6a625a" font-family="sans-serif">← 左</text><text x="${W-10}" y="146" text-anchor="end" font-size="12" font-weight="700" fill="#6a625a" font-family="sans-serif">右 →</text>`;}
  else if(P.L==='round'){H=300;const cx=W/2,cy=150,r=112;
    for(let s=0;s<n;s++){const a=-Math.PI/2+2*Math.PI*s/n;pts.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}
    bg=`<circle cx="${cx}" cy="${cy}" r="64" fill="#e9d7bd" stroke="#b08a5a" stroke-width="3"/>
      <path d="M${cx+(19.0)},${cy+(-32.9)} A38,38 0 1,1 ${cx+(-35.7)},${cy+(-13.0)}" fill="none" stroke="#7c3aed" stroke-width="3"/>
      <polygon points="${cx+(-31.9)},${cy+(-23.3)} ${cx+(-41.3)},${cy+(-15.0)} ${cx+(-30.1)},${cy+(-10.9)}" fill="#7c3aed"/>
      <text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6" font-family="sans-serif">時計回り</text>
      <text x="${pts[0][0]+36}" y="${pts[0][1]-14}" text-anchor="middle" font-size="22" fill="#d4a017" font-family="sans-serif">★</text>`;}
  else{H=248;const xs=[104,192,280],ys=[96,184];
    for(let s=0;s<6;s++)pts.push([xs[s%3],ys[Math.floor(s/3)]]);
    bg=`<rect x="40" y="8" width="${W-80}" height="30" rx="4" fill="#2f5d46" stroke="#8b5a2b" stroke-width="3"/><text x="${W/2}" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="sans-serif">黒板（前）</text>
      ${xs.map((x,c)=>`<text x="${x}" y="${H-4}" text-anchor="middle" font-size="12" fill="#6a625a" font-family="sans-serif">${['左はし','まん中','右はし'][c]}</text>`).join('')}
      <text x="8" y="${ys[0]+5}" font-size="12" font-weight="700" fill="#6a625a" font-family="sans-serif">前の列</text><text x="4" y="${ys[1]+5}" font-size="12" font-weight="700" fill="#6a625a" font-family="sans-serif">後ろの列</text>`;}
  return {W,H,pts,bg};
}
function startStage(p){P=p;S={pos:Array(p.n).fill(null),lock:{},sel:null,hints:0,done:false,msg:'',msgc:'',bad:[]};begin(p);draw();}
const who=s=>S.pos.indexOf(s);
function tok(x,inSeat){
  return `<button class="sktok ${S.sel===x?'sel':''} ${S.lock[x]?'lock':''} ${inSeat?'in':''}" data-x="${x}" aria-label="${esc(P.names[x])}">${skFace(P.names[x],inSeat?30:34)}<span>${esc(P.names[x])}</span></button>`;
}
function draw(){
  const {W,H,pts,bg}=layout(), all=S.pos.every(v=>v!=null);
  const seats=pts.map(([x,y],s)=>{const o=who(s);
    return `<div class="skseat ${P.L} n${P.n} ${o<0?'empty':''}" data-s="${s}" style="left:${x/W*100}%;top:${y/H*100}%">${o>=0?tok(o,true):`<span class="sknum">${P.L==='round'&&s===0?'★':''}</span>`}</div>`;}).join('');
  const conv=P.L==='round'?'★の席から、<b>矢印の向き（時計回り）</b>に数えます。':'<b>左・右</b>は、図で見たときの左・右です（前を向いてすわった人から見た左右と同じ）。';
  app.innerHTML=`${topBar()}
    <p class="note" style="margin:0">${conv}</p>
    <div class="sklab">手がかり</div>
    <ol class="skclues">${P.clues.map((c,i)=>`<li class="${S.bad.includes(i)?'bad':''}"><b>${CN[i]}</b><span>${esc(c.txt)}</span></li>`).join('')}</ol>
    <div class="skboard" id="board"><svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${bg}</svg>${seats}</div>
    ${S.done?'':`<div class="sktray" id="tray">${P.names.map((_,x)=>S.pos[x]==null?tok(x,false):'').join('')||'<span class="note">全員すわりました。</span>'}</div>
    <p class="msg ${S.msgc}" id="msg">${S.msg||'カードを席までドラッグしよう（タップ→席タップでもOK）。'}</p>
    <div class="row"><button class="btn go" id="chk" ${all?'':'disabled'}>答え合わせ</button><button class="btn" id="hint">ヒント</button><button class="btn" id="clr">やりなおす</button></div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(explain());return;}
  bindDrag();
  document.getElementById('chk').onclick=check;
  document.getElementById('hint').onclick=hint;
  document.getElementById('clr').onclick=()=>{S.pos=S.pos.map((v,x)=>S.lock[x]?v:null);S.sel=null;S.bad=[];S.msg='';S.msgc='';draw();};
}
function place(x,s){
  if(S.lock[x])return;
  if(s==null){S.pos[x]=null;}
  else{const o=who(s);if(o===x)return;if(o>=0){if(S.lock[o])return;S.pos[o]=S.pos[x];}S.pos[x]=s;}
  S.sel=null;S.bad=[];if(S.msgc==='ng'){S.msg='';S.msgc='';}draw();
}
function bindDrag(){
  let drag=null;
  app.querySelectorAll('.sktok').forEach(b=>{
    b.addEventListener('pointerdown',ev=>{const x=+b.dataset.x;if(S.lock[x])return;
      drag={x,sx:ev.clientX,sy:ev.clientY,ghost:null,el:b};b.setPointerCapture(ev.pointerId);});
    b.addEventListener('pointermove',ev=>{if(!drag||drag.el!==b)return;
      if(!drag.ghost&&Math.hypot(ev.clientX-drag.sx,ev.clientY-drag.sy)>6){
        const g=b.cloneNode(true);g.classList.add('ghost');document.body.appendChild(g);drag.ghost=g;b.style.opacity='.35';}
      if(drag.ghost){drag.ghost.style.left=ev.clientX+'px';drag.ghost.style.top=ev.clientY+'px';
        app.querySelectorAll('.skseat').forEach(s=>s.classList.remove('over'));
        const t=hitSeat(ev.clientX,ev.clientY);if(t)t.classList.add('over');}
      ev.preventDefault();});
    const end=ev=>{if(!drag||drag.el!==b)return;const d=drag;drag=null;
      if(d.ghost){d.ghost.remove();const t=hitSeat(ev.clientX,ev.clientY);
        if(t)place(d.x,+t.dataset.s);else if(hitTray(ev.clientX,ev.clientY))place(d.x,null);else draw();}
      else{ /* タップ：えらぶ／えらびなおす */
        if(S.sel!=null&&S.sel!==d.x&&S.pos[d.x]!=null){place(S.sel,S.pos[d.x]);return;}
        S.sel=S.sel===d.x?null:d.x;draw();}};
    b.addEventListener('pointerup',end);
    b.addEventListener('pointercancel',()=>{if(drag&&drag.ghost)drag.ghost.remove();drag=null;draw();});
  });
  app.querySelectorAll('.skseat.empty').forEach(s=>s.addEventListener('click',()=>{if(S.sel!=null)place(S.sel,+s.dataset.s);}));
  const tray=document.getElementById('tray');
  tray.addEventListener('click',ev=>{if(ev.target.closest('.sktok'))return;if(S.sel!=null&&S.pos[S.sel]!=null)place(S.sel,null);});
}
function hitSeat(cx,cy){let best=null,bd=1e9;app.querySelectorAll('.skseat').forEach(s=>{const r=s.getBoundingClientRect();
  const d=Math.hypot(cx-(r.left+r.width/2),cy-(r.top+r.height/2));if(d<Math.max(r.width,r.height)*0.75&&d<bd){bd=d;best=s;}});return best;}
function hitTray(cx,cy){const r=document.getElementById('tray').getBoundingClientRect();return cx>=r.left&&cx<=r.right&&cy>=r.top-10&&cy<=r.bottom+10;}
function evalClue(c,pos){
  const n=P.n,x=pos[c.x],y=c.y!=null?pos[c.y]:null,t=c.t;
  if(P.L==='row'){
    if(t==='at')return x===c.k; if(t==='adj')return Math.abs(x-y)===1; if(t==='radj')return y===x+1;
    if(t==='right')return x>y; if(t==='gap1')return Math.abs(x-y)===2; if(t==='notadj')return Math.abs(x-y)!==1; if(t==='notend')return x>0&&x<n-1;}
  if(P.L==='round'){const d=y==null?null:((y-x)%n+n)%n;
    if(t==='star')return x===0; if(t==='adj')return d===1||d===n-1; if(t==='notadj')return !(d===1||d===n-1);
    if(t==='opp')return d===n/2; if(t==='cw')return d===1;}
  if(P.L==='class'){const xr=Math.floor(x/3),xc=x%3,yr=y==null?0:Math.floor(y/3),yc=y==null?0:y%3;
    if(t==='seat')return x===c.k; if(t==='rowf')return xr===c.k; if(t==='col')return xc===c.k;
    if(t==='behind')return xc===yc&&xr===yr+1; if(t==='hadj')return xr===yr&&Math.abs(xc-yc)===1;
    if(t==='diag')return Math.abs(xr-yr)===1&&Math.abs(xc-yc)===1; if(t==='notadj')return !(xr===yr&&Math.abs(xc-yc)===1); if(t==='right')return xc>yc;}
  return false;
}
function check(){
  const bad=P.clues.map((c,i)=>evalClue(c,S.pos)?-1:i).filter(i=>i>=0);
  if(!bad.length){S.done=true;draw();return;}
  S.bad=bad;S.hints++;S.msg=`手がかり ${bad.map(i=>CN[i]).join('・')} に合っていません。赤い手がかりを見直そう。`;S.msgc='ng';draw();
}
function reason(st,first){const [cs,,,alone]=st;const s=cs.map(i=>CN[i]).join('と');
  if(!cs.length)return 'ここまでに決まった席から';
  return `手がかり${s}${alone||first?'':'と、ここまでに決まった席'}から`;}
function hint(){
  const k=P.steps.findIndex(([,x,s])=>S.pos[x]!==s);
  if(k<0){S.msg='全員正しくすわっています。「答え合わせ」をおそう。';S.msgc='';draw();return;}
  S.pos=S.pos.map((s,x)=>s!=null&&s!==P.sol[x]?null:s);
  const [,x,s]=P.steps[k];S.pos[x]=s;S.lock[x]=1;S.hints++;S.sel=null;S.bad=[];
  S.msg=`ヒント：${reason(P.steps[k],k===0)}、${P.names[x]}は ${P.seatnames[s]}と決まります。`;S.msgc='';draw();
}
function explain(){
  const lines=P.steps.map((st,k)=>`<li>${reason(st,k===0)}、${P.names[st[1]]}は ${P.seatnames[st[2]]}。</li>`).join('');
  return `<p style="margin:0">すわり方は、この1通りだけです。</p>
  <details><summary style="cursor:pointer;font-weight:700;font-size:14px">決まっていく順番を見る</summary><ol class="sksteps">${lines}</ol></details>`;
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
