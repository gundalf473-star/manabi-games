<title>並べかえ名人</title>
<meta name="game:subject" content="思考力">

</style>

<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>並べかえ名人</h1>
    <p class="lead">数字のカードを入れかえて、小さい順にならべよう。最短の手数でそろえると★3つ。5つのレベルから1問ずつ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=false;
let QS=[{"id":"1-01","lv":1,"c":[1,6,5,8],"op":"adj","opt":1},{"id":"2-01","lv":2,"c":[15,10,28,24,27],"op":"adj","opt":3},{"id":"3-01","lv":3,"c":[37,39,9,41,49,27],"op":"adj","opt":6},{"id":"4-01","lv":4,"c":[42,1,24,59,8,34],"op":"swap","opt":3},{"id":"5-01","lv":5,"c":[10,3,23,25,2],"op":"flip","opt":3}];
const ID='narabe';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>並べかえ名人 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* 並べかえ名人：p={c:[カードの数], op:'adj'|'swap'|'flip', opt:最短手数}。小さい順（左がいちばん小さい）にならべる */
const HINTWORD='ヒントや手数のオーバー';
const LVD={1:'となりと交換・4まい',2:'となりと交換・5まい',3:'となりと交換・6まい',4:'どの2まいでも交換',5:'左はしから逆の順にする'};
const RULES=`<ol class="rules">
  <li>数字のカードを、<b>左から小さい順</b>にならべよう（左はしがいちばん小さい数）。</li>
  <li>レベル1〜3：<b>となりどうし</b>の2まいだけ入れかえられます。カードの間の「⇄」をタップするか、となりの2まいをつづけてタップします。</li>
  <li>レベル4：<b>どの2まいでも</b>入れかえられます。1まいめ、2まいめの順にタップします。</li>
  <li>レベル5：カードを1まいタップすると、<b>左はしからそのカードまで</b>をえらびます。「逆の順にする」で、その部分の順番が逆になります。</li>
  <li>問題ごとに<b>最短の手数</b>があります。最短でそろえると★3つ。</li></ol>`;
const CW=52,GP=14,CH=74,M=8;
const CC=['#fca5a5','#fdba74','#fcd34d','#bef264','#6ee7b7','#67e8f9','#a5b4fc','#f0abfc'];
let DT=null;
function nbrs(s,op){const n=s.length,o=[];
  if(op==='adj')for(let i=0;i<n-1;i++){const t=s.slice();[t[i],t[i+1]]=[t[i+1],t[i]];o.push([t,[i,i+1]]);}
  else if(op==='swap'){for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const t=s.slice();[t[i],t[j]]=[t[j],t[i]];o.push([t,[i,j]]);}}
  else for(let k=2;k<=n;k++)o.push([s.slice(0,k).reverse().concat(s.slice(k)),[k-1]]);
  return o;}
/* 完成形から幅優先探索：どの並びが、あと何手でそろうか（どの操作も、もう一度同じことをすると元にもどる） */
function table(n,op){const g=[...Array(n).keys()],d=new Map([[g.join(','),0]]),q=[g];
  for(let h=0;h<q.length;h++){const s=q[h],ds=d.get(s.join(','));for(const [t] of nbrs(s,op)){const k=t.join(',');if(!d.has(k)){d.set(k,ds+1);q.push(t);}}}return d;}
const rk=a=>{const so=a.slice().sort((x,y)=>x-y);return a.map(v=>so.indexOf(v));};
function startStage(p){P=p;DT=table(p.c.length,p.op);
  S={c:p.c.slice(),moves:0,hint:0,hints:0,done:false,msg:'',sel:-1,last:[],hl:[]};begin(p);draw();}
const sorted=a=>a.every((v,i)=>i===0||a[i-1]<v);
function cardsSVG(){
  const n=S.c.length,W=n*CW+(n-1)*GP+2*M,adj=P.op==='adj',H=CH+2*M+(adj?44:P.op==='flip'?22:0);
  const so=S.c.slice().sort((a,b)=>a-b);let o='';
  S.c.forEach((v,i)=>{const x=M+i*(CW+GP),y=M,sel=S.sel===i||(P.op==='flip'&&S.sel>=i),hl=S.hl.includes(i),last=S.last.includes(i);
    o+=`<g class="cd" data-i="${i}" style="cursor:pointer"><rect x="${x}" y="${y+(sel?-0:0)}" width="${CW}" height="${CH}" rx="8" fill="${CC[so.indexOf(v)%8]}" stroke="${hl?'#7c3aed':sel?'#3b2f6b':last?'#a97c12':'rgba(0,0,0,.25)'}" stroke-width="${hl||sel?4:last?3:1.5}" ${hl?'stroke-dasharray="7 4"':''}/>
      <rect x="${x+6}" y="${y+6}" width="${CW-12}" height="${CH*0.22}" rx="5" fill="#fff" opacity=".35"/>
      <text x="${x+CW/2}" y="${y+CH/2+11}" text-anchor="middle" font-size="${v>=10?28:32}" font-weight="700" fill="#2a2520" font-family="sans-serif">${v}</text></g>`;});
  if(adj)for(let i=0;i<n-1;i++){const cx=M+i*(CW+GP)+CW+GP/2,cy=M+CH+24,h=S.hl.length===2&&S.hl[0]===i;
    o+=`<g class="gp" data-i="${i}" style="cursor:pointer"><circle cx="${cx}" cy="${cy}" r="17" fill="${h?'#ede4fd':'#fff'}" stroke="${h?'#7c3aed':'#a59c90'}" stroke-width="${h?3:2}"/><text x="${cx}" y="${cy+6}" text-anchor="middle" font-size="18" font-weight="700" fill="#3b2f6b" font-family="sans-serif">⇄</text></g>`;}
  if(P.op==='flip'&&S.sel>=1){const x2=M+S.sel*(CW+GP)+CW;o+=`<path d="M${M},${M+CH+8} v8 H${x2} v-8" fill="none" stroke="#3b2f6b" stroke-width="3"/>`;}
  return `<svg id="bd" viewBox="0 0 ${W} ${H}" style="max-width:${Math.min(W*1.15,560)}px" role="img" aria-label="数字のカード">${o}</svg>`;
}
function guide(){
  if(P.op==='adj')return 'カードの間の「⇄」をタップすると、となりどうしが入れかわります。';
  if(P.op==='swap')return S.sel<0?'入れかえるカードを1まいタップしよう。':`${S.c[S.sel]} と入れかえるカードをタップしよう（同じカードをタップするとやめます）。`;
  return S.sel<1?'左はしから、どこまでを逆にするか、さいごのカードをタップしよう。':`左はしから ${S.sel+1}まいをえらびました。「逆の順にする」をおすか、同じカードをもう一度タップしよう。`;
}
function draw(){
  app.innerHTML=`${topBar()}
    <p class="note" style="text-align:center">左から<b>小さい順</b>にならべよう</p>
    <div class="boardw">${cardsSVG()}</div>
    <div class="row" style="justify-content:center"><span class="note">手数 <b style="font-size:17px">${S.moves}</b>　・　最短 ${P.opt}手</span></div>
    ${S.done?'':`${P.op==='flip'?`<div class="row" style="justify-content:center"><button class="btn go" id="flip" ${S.sel<1?'disabled':''}>${S.sel<1?'逆の順にする':`左から${S.sel+1}まいを逆の順にする`}</button></div>`:''}
    <p class="msg ${S.msgc||''}" id="msg">${S.msg||guide()}</p>
    <div class="row"><button class="btn" id="hint">ヒント（次の一手）</button><button class="btn" id="reset">やりなおす</button></div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){S.hints=S.hint+(S.moves>P.opt?1:0)+(S.moves>=P.opt*2?1:0);showClear(explain());return;}
  app.querySelectorAll('.cd').forEach(g=>g.addEventListener('pointerdown',e=>{e.preventDefault();tapCard(+g.dataset.i);}));
  app.querySelectorAll('.gp').forEach(g=>g.addEventListener('pointerdown',e=>{e.preventDefault();doMove([+g.dataset.i,+g.dataset.i+1]);}));
  if(P.op==='flip')document.getElementById('flip').onclick=()=>{if(S.sel>=1)doMove([S.sel]);};
  document.getElementById('hint').onclick=hint;
  document.getElementById('reset').onclick=()=>{S.c=P.c.slice();S.moves=0;S.sel=-1;S.last=[];S.hl=[];S.msg='';S.msgc='';draw();};
}
function tapCard(i){
  S.hl=[];S.msg='';S.msgc='';
  if(P.op==='flip'){if(i===0){S.sel=-1;S.msg='2まい以上えらんでね。左はしのカード1まいだけでは、順番は変わりません。';}else if(S.sel===i)return doMove([i]);else S.sel=i;draw();return;}
  if(S.sel<0||S.sel===i){S.sel=S.sel===i?-1:i;draw();return;}
  const a=S.sel,b=i;
  if(P.op==='adj'&&Math.abs(a-b)!==1){S.sel=i;S.msg='となりどうしのカードだけ入れかえられます。';S.msgc='ng';draw();return;}
  doMove([Math.min(a,b),Math.max(a,b)]);
}
function doMove(m){
  if(P.op==='flip'){const k=m[0]+1;S.c=S.c.slice(0,k).reverse().concat(S.c.slice(k));S.last=[...Array(k).keys()];}
  else{const [a,b]=m;[S.c[a],S.c[b]]=[S.c[b],S.c[a]];S.last=[a,b];}
  S.moves++;S.sel=-1;S.hl=[];S.msg='';S.msgc='';
  if(sorted(S.c))S.done=true;draw();
}
function hint(){
  const r=rk(S.c),d=DT.get(r.join(','));
  for(const [t,m] of nbrs(r,P.op)){if(DT.get(t.join(','))===d-1){S.hint++;S.sel=-1;
    if(P.op==='flip'){S.hl=[...Array(m[0]+1).keys()];S.msg=`ヒント：左はしから ${m[0]+1}まい（点線のカード）を逆の順にしよう。あと最短 ${d}手（ヒント ${S.hint}回）。`;}
    else{S.hl=m;S.msg=`ヒント：点線の ${S.c[m[0]]} と ${S.c[m[1]]} を入れかえよう。あと最短 ${d}手（ヒント ${S.hint}回）。`;}
    S.msgc='';draw();return;}}
}
function explain(){
  const res=`<p style="margin:0">あなたは ${S.moves}手、最短は ${P.opt}手でした。${S.moves===P.opt?'最短でそろえました！':'最短の手数を目指して、もう一度やってみよう。'}</p>`;
  if(P.op==='adj')return res+`<p style="margin:0"><b>考え方：</b>はじめの並びで、<b>大きい数が小さい数より左にある組</b>を数えると ${P.opt}組あります。となりどうしを1回入れかえると、この組は1つずつしかへりません。だから最短は ${P.opt}手。となりの「大きい・小さい」を見つけては入れかえる、をくり返すと必ずそろいます（<b>バブルソート</b>という並べかえ方です）。</p>`;
  if(P.op==='swap')return res+`<p style="margin:0"><b>考え方：</b>左はしから順に、「ここに来るべきカード」をさがして1回で入れかえると、1手で1まいずつ正しい場所に決まります（<b>選択ソート</b>）。さいごの1まいは自然にそろうので、手数はまい数より少なくてすみます。カードどうしが「AはBの場所、BはCの場所、CはAの場所」のように<b>輪</b>になっているとき、輪1つは（輪のまい数−1）手でそろいます。</p>`;
  return res+`<p style="margin:0"><b>考え方：</b>まず、いちばん大きいカードまでを逆の順にすると、そのカードが左はしに来ます。つぎに、まだそろっていない部分の全体を逆の順にすると、そのカードを右はしに送れます。これを大きい順にくり返すと、必ずそろいます（<b>パンケーキ・ソート</b>）。でも、それより少ない手数でできることも多く、最短は全部の並び方を調べて決めています。</p>`;
}

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
