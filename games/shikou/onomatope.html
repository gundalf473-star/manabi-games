<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>音とようすのことば</h1>
    <p class="lead">「ザーザー」「きらきら」「ころころ」。場面にぴったりの、音やようすをあらわすことばはどれ？　ペアあわせやなかまはずれもあるよ。5つのレベルから1問ずつ。ヒントやまちがいなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=false;
let QS=[{"kind":"scene","q":"大雨だ。雨が（　）と、はげしくふっている。","a":"ザーザー","ds":["もぐもぐ","さらさら","ぐうぐう"],"svg":"rain","ex":"「ザーザー」は、雨がはげしくふるようすにぴったりのことばです。","lv":1,"id":"1-01"},{"kind":"pair","pairs":[["ワンワン","いぬの鳴き声"],["ころころ","小さな玉がころがる"],["ザーザー","雨がはげしくふる"]],"ex":"「ワンワン」→いぬの鳴き声、「ころころ」→小さな玉がころがる、「ザーザー」→雨がはげしくふる","lv":2,"id":"2-01"},{"kind":"odd","opts":["くすくす","にこにこ","げらげら","ぷるぷる"],"a":"ぷるぷる","ds":["くすくす","にこにこ","げらげら"],"ex":"「くすくす」「にこにこ」「げらげら」は、どれもわらうようすをあらわすことば。「ぷるぷる」だけがちがいます。","lv":3,"id":"3-01"},{"kind":"scene","q":"大きな岩が、山の上から（　）と ころがり落ちてきた。","a":"ごろごろ","ds":["ころころ","ぴょんぴょん","ゆらゆら"],"svg":null,"ex":"「ごろごろ」は、大きな岩がころがるようすにぴったりのことばです。","lv":4,"id":"4-01"},{"kind":"odd","opts":["ぴかぴか","うろうろ","ぐんぐん","ざあざあ"],"a":"ざあざあ","ds":["ぴかぴか","うろうろ","ぐんぐん"],"snd":"look","ex":"「ぴかぴか」「うろうろ」「ぐんぐん」は、どれも ようすをあらわすことば（音はしない）。「ざあざあ」は雨の音をあらわす、音のことばです。","lv":5,"id":"5-01"}];
const ID='onomatope';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>音とようすのことば 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* 音とようすのことば：p={kind:'scene'(q:（　）入りの文, svg?), 'word'(w:ことば, a/ds:場面), 'odd'(opts, a), 'pair'(pairs:[[ことば,場面]…])} */
const HINTWORD='ヒントやまちがい';
const LVD={1:'鳴き声と、場面に合うことば',2:'ことばと場面・ペアあわせ',3:'なかまはずれ・にたことば',4:'ころころ？ごろごろ？',5:'音のことば・ようすのことば'};
const RULES=`<ol class="rules">
  <li>「ザーザー」「きらきら」のように、<b>音</b>や<b>ようす</b>をあらわすことばのクイズです。</li>
  <li>文の（　）に<b>いちばんぴったり</b>のことばや、ことばに合う場面を、4つの中からえらぼう。</li>
  <li>「ペアあわせ」は、<b>ことば</b>をタップしてから、合う<b>場面</b>をタップ。全部つなげたらクリア。</li>
  <li>「なかまはずれ」は、3つが同じなかまです。1つだけちがうものをえらぼう。</li>
  <li>ヒントを見たり、まちがえたりすると、星がへります。</li></ol>`;
const OM_HINT={
  scene:'文の中の、ようすがわかることば（「はげしく」「小さな」「かるく」など）に気をつけよう。（　）にそれぞれのことばを入れて、声に出して読んでみよう。',
  word:'そのことばを使って、みじかい文を作ってみよう。いちばん しぜんに言える場面はどれかな？',
  odd:'4つのことばが、それぞれ何をするときのようすか考えよう。3つに共通することは何かな？',
  odd_snd:'耳で聞こえる<b>音</b>をあらわすことば（いぬの声、たたく音など）と、音はしないけれど<b>ようす</b>をあらわすことば（顔つき、動き方など）に分けてみよう。',
  pair:''};
function omSVG(k){
  const W=`viewBox="0 0 200 120" style="width:100%;max-width:220px" role="img"`;
  if(k==='rain'){let s='';for(let i=0;i<14;i++){const x=24+i*12+(i%2)*4,y=60+(i%3)*10;s+=`<line x1="${x}" y1="${y}" x2="${x-8}" y2="${y+26}" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>`;}
    return `<svg ${W} aria-label="はげしい雨"><ellipse cx="70" cy="38" rx="44" ry="24" fill="#94a3b8"/><ellipse cx="120" cy="32" rx="46" ry="28" fill="#94a3b8"/><ellipse cx="150" cy="46" rx="34" ry="20" fill="#94a3b8"/>${s}</svg>`;}
  if(k==='star'){const st=(cx,cy,r)=>{let p=[];for(let i=0;i<10;i++){const rr=i%2?r*0.42:r,t=-Math.PI/2+i*Math.PI/5;p.push(`${cx+rr*Math.cos(t)},${cy+rr*Math.sin(t)}`);}return `<polygon points="${p.join(' ')}" fill="#fcd34d" stroke="#b45309" stroke-width="1.5"/>`;};
    return `<svg ${W} aria-label="夜空の星"><rect x="0" y="0" width="200" height="120" rx="10" fill="#1e293b"/>${st(100,60,30)}${st(40,32,10)}${st(160,30,12)}${st(150,92,8)}${st(46,94,7)}<g stroke="#fef3c7" stroke-width="2.5" stroke-linecap="round"><line x1="100" y1="16" x2="100" y2="24"/><line x1="140" y1="60" x2="148" y2="60"/><line x1="52" y1="60" x2="60" y2="60"/></g></svg>`;}
  if(k==='ball')return `<svg ${W} aria-label="ころがる小さな玉"><line x1="10" y1="100" x2="190" y2="100" stroke="#a89a80" stroke-width="4"/><circle cx="130" cy="88" r="12" fill="#ef4444" stroke="#7f1d1d" stroke-width="1.5"/><circle cx="126" cy="84" r="3" fill="#fff" opacity=".8"/><g fill="none" stroke="#6a625a" stroke-width="2.5" stroke-linecap="round"><path d="M100 78 q-10 10 0 20"/><path d="M84 78 q-10 10 0 20" opacity=".6"/><path d="M68 78 q-10 10 0 20" opacity=".35"/></g></svg>`;
  if(k==='smile')return `<svg ${W} aria-label="うれしそうな顔"><circle cx="100" cy="60" r="44" fill="#fde2c4" stroke="#b07a4a" stroke-width="2"/><path d="M78 52 q8 -10 16 0" fill="none" stroke="#2a2520" stroke-width="3" stroke-linecap="round"/><path d="M106 52 q8 -10 16 0" fill="none" stroke="#2a2520" stroke-width="3" stroke-linecap="round"/><path d="M80 72 q20 18 40 0" fill="none" stroke="#2a2520" stroke-width="3" stroke-linecap="round"/><circle cx="72" cy="70" r="6" fill="#f9a8a8" opacity=".7"/><circle cx="128" cy="70" r="6" fill="#f9a8a8" opacity=".7"/></svg>`;
  if(k==='sleep')return `<svg ${W} aria-label="ねむる赤ちゃん"><rect x="30" y="74" width="140" height="30" rx="12" fill="#bfdbfe"/><circle cx="72" cy="66" r="26" fill="#fde2c4" stroke="#b07a4a" stroke-width="2"/><path d="M58 66 q6 5 12 0" fill="none" stroke="#2a2520" stroke-width="2.5" stroke-linecap="round"/><path d="M76 66 q6 5 12 0" fill="none" stroke="#2a2520" stroke-width="2.5" stroke-linecap="round"/><text x="110" y="50" font-size="22" font-weight="700" fill="#7c3aed" font-family="sans-serif">z</text><text x="128" y="34" font-size="28" font-weight="700" fill="#7c3aed" font-family="sans-serif">z</text></svg>`;
  return '';
}
function startStage(p){
  P=p;S={hints:0,done:false,msg:'',msgc:'',hint:false,wrong:[]};
  if(p.kind==='pair'){S.ws=shuffle(p.pairs.map(x=>x[0]));S.ss=shuffle(p.pairs.map(x=>x[1]));S.got=[];S.sel=null;}
  else if(p.kind==='odd')S.opts=shuffle(p.opts);
  else S.opts=shuffle([p.a,...p.ds]);
  begin(p);draw();
}
function sentence(fill){
  const parts=P.q.split('（　）');
  return `${esc(parts[0])}<span class="om-blank ${fill?'on':''}">${fill?esc(fill):'？'}</span>${esc(parts[1]||'')}`;
}
function card(){
  const p=P;
  if(p.kind==='scene')return `<div class="om-card">${p.svg?`<div style="display:flex;justify-content:center">${omSVG(p.svg)}</div>`:''}<p class="om-sen">${sentence(S.done?p.a:'')}</p></div><p class="qq">（　）に いちばんぴったりのことばは どれ？</p>`;
  if(p.kind==='word')return `<div class="om-card"><div class="om-big">${esc(p.w)}</div></div><p class="qq">「${esc(p.w)}」が いちばんぴったり合う場面は どれ？</p>`;
  if(p.kind==='odd')return p.snd?`<p class="qq">4つのことばを、<b>音</b>をあらわすことばと、<b>ようす</b>をあらわすことばに分けます。1つだけ ちがうなかまになるのは どれ？</p>`:`<p class="qq">3つは同じなかまのことばです。<b>なかまはずれ</b>は どれ？</p>`;
  return `<p class="qq">ことばと場面を<b>ペア</b>にしよう。ことばをタップしてから、合う場面をタップ。</p>`;
}
function draw(){
  const p=P;
  app.innerHTML=`${topBar()}${card()}
    ${p.kind==='pair'?pairHTML():`<div class="opts4 txt">${S.opts.map((o,i)=>`<button class="ob ${S.done&&o===p.a?'right':''} ${S.wrong.includes(i)?'wrong':''}" data-i="${i}" ${S.done||S.wrong.includes(i)?'disabled':''}><span class="k">${'アイウエ'[i]}</span><b class="${p.kind==='word'?'om-sc':'om-w1'}">${esc(o)}</b></button>`).join('')}</div>`}
    ${S.hint&&!S.done&&p.kind!=='pair'?`<p class="hintbox">${OM_HINT[p.kind==='odd'&&p.snd?'odd_snd':p.kind]}</p>`:''}
    ${S.done?'':`<p class="msg ${S.msgc}" id="msg">${S.msg||(p.kind==='pair'?'ことば → 場面 の順にタップ。':'4つの中からえらぼう。')}</p><div class="row"><button class="btn" id="hint" ${S.hint&&p.kind!=='pair'?'disabled':''}>ヒント</button>${p.kind==='pair'?'<span class="note">ヒントで1組つながります</span>':''}</div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(`<p style="margin:0">${p.kind==='scene'?`<b>${esc(p.q.replace('（　）',p.a))}</b><br>`:''}${esc(p.ex)}</p>`);return;}
  document.getElementById('hint').onclick=()=>{S.hint=true;S.hints++;S.msg='';S.msgc='';draw();};
  if(p.kind==='pair'){
    document.getElementById('hint').disabled=false;
    document.getElementById('hint').onclick=()=>{const w=p.pairs.map(x=>x[0]).find(x=>!S.got.includes(x));S.hints++;S.got.push(w);S.sel=null;S.bad=null;
      S.msg=`ヒント：「${w}」→「${p.pairs.find(x=>x[0]===w)[1]}」をつなぎました。`;S.msgc='';if(S.got.length===p.pairs.length)S.done=true;draw();};
    bindPair();return;}
  app.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
    if(S.opts[i]===p.a)S.done=true;else{S.wrong.push(i);S.hints++;S.msg='ざんねん！ もう一度考えてみよう。';S.msgc='ng';}draw();});
}
function pairHTML(){
  const p=P,num=w=>S.got.indexOf(w)+1, sOf=w=>p.pairs.find(x=>x[0]===w)[1];
  const gotS=S.got.map(sOf);
  return `<div class="om-pair"><div class="om-col">${S.ws.map(w=>{const n=num(w);return `<button class="om-w ${n?'got':''} ${S.sel===w?'sel':''}" data-w="${esc(w)}" ${n?'disabled':''}>${n?`<i>${n}</i>`:''}${esc(w)}</button>`;}).join('')}</div>
    <div class="om-col">${S.ss.map(s=>{const k=gotS.indexOf(s)+1;return `<button class="om-s ${k?'got':''} ${S.bad===s?'bad':''}" data-s="${esc(s)}" ${k?'disabled':''}>${k?`<i>${k}</i>`:''}${esc(s)}</button>`;}).join('')}</div></div>`;
}
function bindPair(){
  const p=P;
  app.querySelectorAll('.om-w').forEach(b=>b.onclick=()=>{S.sel=b.dataset.w;S.bad=null;S.msg=`「${S.sel}」に合う場面をタップしよう。`;S.msgc='';draw();});
  app.querySelectorAll('.om-s').forEach(b=>b.onclick=()=>{
    if(!S.sel){S.msg='先に、左のことばをタップしよう。';S.msgc='';draw();return;}
    const s=b.dataset.s,ok=p.pairs.some(x=>x[0]===S.sel&&x[1]===s);
    if(ok){S.got.push(S.sel);S.sel=null;S.bad=null;S.msg='せいかい！';S.msgc='ok';if(S.got.length===p.pairs.length)S.done=true;}
    else{S.hints++;S.bad=s;S.msg=`「${S.sel}」と「${s}」は合いません。べつの場面をさがそう。`;S.msgc='ng';}
    draw();});
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
