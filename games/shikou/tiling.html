const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>しきつめもよう 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* しきつめもよう：p.kind='paint'（もようのつづきをぬる）,'alone','meet','angle','gap','combo','around','vconf','howmany','third'
   図のしきつめはすべて gen_tiling.py で格子から作り、重なり・すきま・1点の角の合計360°を確かめてある。 */
const HINTWORD='ヒントやまちがい';
const LVD={1:'四角のもよう・しきつめられる形',2:'三角のもよう・何まい集まる？',3:'六角形のもよう・1つの角の大きさ',4:'すきまにはまる形・組み合わせ',5:'角の計算・3色のもよう'};
const RULES=`<ol class="rules">
  <li>同じ形を、<b>すきまも重なりもなく</b>ならべることを「しきつめ」といいます。</li>
  <li>「もようのつづき」では、色を1つえらんで、<b>？のマス</b>をタップしてぬります。同じもようが<b>くり返す</b>ように完成させよう。</li>
  <li>そのほかの問題は、4つの中から答えをえらびます。</li>
  <li><b>1つの点のまわりは360°</b>。集まった角の合計がぴったり360°になると、すきまなくうまります。</li>
  <li>ヒントを使ったり、まちがえたりすると、星がへります。</li></ol>`;
const TN={0:'円',3:'正三角形',4:'正方形',5:'正五角形',6:'正六角形',7:'正七角形',8:'正八角形',9:'正九角形',10:'正十角形',12:'正十二角形'};
const TF={3:'#fcd34d',4:'#93c5fd',5:'#fdba74',6:'#fca5a5',7:'#a5f3fc',8:'#86efac',9:'#fde68a',10:'#f9a8d4',12:'#d9f99d',0:'#e5e7eb'};
const PC=['#3b82f6','#f59e0b','#ef4444','#22c55e'], PCN=['あお','きいろ','あか','みどり'];
const tA=n=>180*(n-2)/n;
const tDeg=n=>{const a=tA(n);return Number.isInteger(a)?a+'°':'約'+(Math.round(a*10)/10)+'°';};
const tPts=a=>{let s='';for(let i=0;i<a.length;i+=2)s+=a[i]+','+a[i+1]+' ';return s;};
const tPtsF=a=>{let s='';for(let i=0;i<a.length;i+=2)s+=a[i]+','+(-a[i+1])+' ';return s;};
function tIcon(n,px){
  px=px||54;
  if(n===0)return `<svg viewBox="-1.2 -1.2 2.4 2.4" width="${px}" height="${px}" style="width:${px}px;height:${px}px;flex:none" aria-hidden="true"><circle r="1" fill="${TF[0]}" stroke="#2a2520" stroke-width="0.05"/></svg>`;
  const R=1,pts=[];for(let k=0;k<n;k++){const t=-Math.PI/2+Math.PI/n*(n%2?0:1)+2*Math.PI*k/n;pts.push((R*Math.cos(t)).toFixed(3)+','+(R*Math.sin(t)).toFixed(3));}
  return `<svg viewBox="-1.2 -1.2 2.4 2.4" width="${px}" height="${px}" style="width:${px}px;height:${px}px;flex:none" aria-hidden="true"><polygon points="${pts.join(' ')}" fill="${TF[n]}" stroke="#2a2520" stroke-width="0.05"/></svg>`;
}
function tPatch(f,o){
  o=o||{};let s='';
  f.t.forEach((t,i)=>{s+=`<polygon points="${tPtsF(t[1])}" fill="${o.hl===i?'#7c3aed':TF[t[0]]}" stroke="#2a2520" stroke-width="0.05" stroke-linejoin="round"/>`;});
  if(o.dot)s+=`<circle cx="${o.dot[0]}" cy="${o.dot[1]}" r="0.16" fill="#c8352d" stroke="#fff" stroke-width="0.05"/>`;
  const w=f.w,h=f.h;
  return `<svg viewBox="${-w/2} ${-h/2} ${w} ${h}" style="width:100%;max-width:${o.px||420}px;display:block" role="img" aria-label="しきつめもよう"><defs><clipPath id="tc${o.id||0}"><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="0.2"/></clipPath></defs><g clip-path="url(#tc${o.id||0})">${s}</g></svg>`;
}
function tAngleFig(n){
  /* 正n角形と1つの角のしるし（いちばん上の左の頂点） */
  const R=1.3,pts=[];for(let k=0;k<n;k++){const t=-Math.PI/2-Math.PI/n+2*Math.PI*k/n;pts.push([R*Math.cos(t),R*Math.sin(t)]);}
  const v=pts[0],a=pts[1],b=pts[n-1];
  const ua=Math.atan2(a[1]-v[1],a[0]-v[0]),ub=Math.atan2(b[1]-v[1],b[0]-v[0]),r=n>6?0.36:0.3;
  const p1=[v[0]+r*Math.cos(ua),v[1]+r*Math.sin(ua)],p2=[v[0]+r*Math.cos(ub),v[1]+r*Math.sin(ub)];
  let d=ub-ua;while(d>Math.PI)d-=2*Math.PI;while(d<=-Math.PI)d+=2*Math.PI;const sw=d>0?1:0;
  const f=x=>x.toFixed(3);
  let s=`<polygon points="${pts.map(p=>f(p[0])+','+f(p[1])).join(' ')}" fill="${TF[n]}" stroke="#2a2520" stroke-width="0.04" stroke-linejoin="round"/>`;
  s+=`<path d="M${f(v[0])},${f(v[1])} L${f(p1[0])},${f(p1[1])} A${r},${r} 0 0 ${sw} ${f(p2[0])},${f(p2[1])} Z" fill="#c8352d" opacity=".8"/>`;
  const L=Math.hypot(v[0],v[1]),lx=v[0]-v[0]/L*0.72,ly=v[1]-v[1]/L*0.72;
  s+=`<text x="${f(lx)}" y="${f(ly+0.1)}" text-anchor="middle" font-size="0.3" font-weight="700" fill="#c8352d">？°</text>`;
  return `<svg viewBox="-1.5 -1.5 3 3" style="width:100%;max-width:220px;display:block" role="img" aria-label="${TN[n]}">${s}</svg>`;
}
function tGapFig(p){
  let s='';
  p.polys.forEach(t=>{s+=`<polygon points="${tPts(t[1])}" fill="${TF[t[0]]}" stroke="#2a2520" stroke-width="0.04" stroke-linejoin="round"/>`;});
  const [a0,a1]=p.gap,R=1.25,rad=x=>x*Math.PI/180;
  const P0=[R*Math.cos(rad(a0)),-R*Math.sin(rad(a0))],P1=[R*Math.cos(rad(a1)),-R*Math.sin(rad(a1))];
  s+=`<path d="M0,0 L${P0[0]},${P0[1]} A${R},${R} 0 ${a1-a0>180?1:0} 0 ${P1[0]},${P1[1]} Z" fill="#ffffff" stroke="#7c3aed" stroke-width="0.04" stroke-dasharray="0.08 0.06"/>`;
  const am=rad((a0+a1)/2);
  s+=`<text x="${0.75*Math.cos(am)}" y="${-0.75*Math.sin(am)+0.14}" text-anchor="middle" font-size="0.42" font-weight="700" fill="#7c3aed">？</text>`;
  s+=`<circle cx="0" cy="0" r="0.07" fill="#c8352d"/>`;
  /* 範囲 */
  let xs=[-1.3,1.3],ys=[-1.3,1.3];p.polys.forEach(t=>{for(let i=0;i<t[1].length;i+=2){xs.push(t[1][i]);ys.push(t[1][i+1]);}});
  const x0=Math.min(...xs)-0.15,x1=Math.max(...xs)+0.15,y0=Math.min(...ys)-0.15,y1=Math.max(...ys)+0.15;
  return `<svg viewBox="${x0} ${y0} ${x1-x0} ${y1-y0}" style="width:100%;max-width:300px;max-height:300px;display:block" role="img" aria-label="1つの点のまわり">${s}</svg>`;
}
function tPaintFig(){
  const p=P;let s='';
  p.cells.forEach((c,i)=>{
    const hid=p.hide.includes(i),v=hid?S.g[i]:p.col[i];
    const fill=v==null?'#ffffff':PC[v];
    s+=`<polygon data-i="${i}" points="${tPts(c)}" fill="${fill}" stroke="${hid?'#7c3aed':'#2a2520'}" stroke-width="${hid?0.06:0.03}" ${hid?'style="cursor:pointer"':''} stroke-linejoin="round"/>`;
    if(hid&&v==null){let cx=0,cy=0;for(let k=0;k<c.length;k+=2){cx+=c[k];cy+=c[k+1];}cx/=c.length/2;cy/=c.length/2;
      s+=`<text x="${cx}" y="${cy+0.13}" text-anchor="middle" font-size="${p.grid==='sq'?0.42:0.34}" font-weight="700" fill="#7c3aed" pointer-events="none">？</text>`;}
  });
  p.hide.forEach(i=>{s+=`<polygon points="${tPts(p.cells[i])}" fill="none" stroke="#7c3aed" stroke-width="0.07" pointer-events="none" stroke-linejoin="round"/>`;});
  if(S.hl!=null){const c=p.cells[S.hl];s+=`<polygon points="${tPts(c)}" fill="none" stroke="#a97c12" stroke-width="0.12" pointer-events="none"/>`;}
  const m=0.12;
  return `<svg id="bd" viewBox="${-m} ${-m} ${p.w+2*m} ${p.h+2*m}" style="max-width:440px" role="img" aria-label="もよう">${s}</svg>`;
}
const tCombo=c=>{const m={};c.forEach(n=>m[n]=(m[n]||0)+1);return Object.keys(m).map(Number).sort((a,b)=>a-b).map(n=>`${TN[n]}${m[n]}まい`).join('・');};
const tComboIcons=c=>{const m={};c.forEach(n=>m[n]=(m[n]||0)+1);return Object.keys(m).map(Number).sort((a,b)=>a-b).map(n=>`<span style="display:inline-flex;align-items:center;gap:1px">${tIcon(n,30)}<b>×${m[n]}</b></span>`).join(' ');};
const tSum=c=>c.map(n=>tDeg(n).replace('約','')).join('＋');

function startStage(p){
  P=p;S={hints:0,done:false,msg:'',msgc:'',wrong:[],hint:false,hl:null};
  if(p.kind==='paint'){S.g={};p.hide.forEach(i=>S.g[i]=null);S.col=0;}
  else S.opts=shuffle([p.a,...p.ds]);
  begin(p);draw();
}
function qText(){
  const p=P;
  switch(p.kind){
    case 'paint':return 'もようの<b>つづき</b>をかこう。同じもようがくり返すように、<b>？のマス</b>に色をぬってね。';
    case 'alone':return p.mode==='can'?'同じ形を何まいもならべて、<b>すきまも重なりもなく</b>しきつめられるのは どれ？':'同じ形だけをならべて、すきまなく<b>しきつめられない</b>のは どれ？';
    case 'meet':return `${TN[p.n]}をしきつめました。<b style="color:#c8352d">赤い点</b>のまわりには、${TN[p.n]}が<b>何まい</b>集まっている？`;
    case 'angle':return `${TN[p.n]}の<b>1つの角</b>は何度？`;
    case 'gap':return '1つの点のまわりに、正多角形をすきまなくならべます。<b>？</b>にぴったり入るのは どれ？';
    case 'combo':return '1つの点のまわりに、<b>すきまも重なりもなく、ぴったり</b>集まるのは どれ？';
    case 'around':return `このしきつめもようで、<b style="color:#7c3aed">むらさきの${TN[p.x]}</b>1まいに、<b>辺でくっついている</b>${TN[p.y]}は何まい？`;
    case 'vconf':return 'このしきつめもようで、<b>1つの点のまわり</b>に集まっている形は どれ？';
    case 'howmany':return `${tCombo(p.given)}と、${TN[p.f]}を何まいか使って、1つの点のまわりをすきまなくうめます。${TN[p.f]}は<b>何まい</b>？`;
    case 'third':return `${tCombo(p.given)}と、<b>もう1まいの正多角形</b>で、1つの点のまわりがぴったりうまります。もう1まいは どれ？`;
  }
}
function fig(){
  const p=P;
  switch(p.kind){
    case 'paint':return tPaintFig();
    case 'meet':return tPatch(p.fig,{dot:p.dot,px:380});
    case 'angle':return tAngleFig(p.n);
    case 'gap':return tGapFig(p);
    case 'around':return tPatch(p.fig,{hl:p.hl,px:420});
    case 'vconf':return tPatch(p.fig,{px:420});
    case 'howmany':case 'third':return `<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center">${p.given.map(n=>tIcon(n,58)).join('')}${p.kind==='howmany'?`<b style="font-size:20px">＋</b>${tIcon(p.f,46)}<b style="font-size:20px">×？</b>`:`<b style="font-size:20px">＋</b><span style="font-size:34px;font-weight:700;color:#7c3aed">？</span>`}</div>`;
  }
  return '';
}
const shapeKinds={alone:1,gap:1,third:1};
function optHTML(o,i){
  const p=P,right=S.done&&JSON.stringify(o)===JSON.stringify(p.a),wr=S.wrong.includes(i);
  let inner;
  if(shapeKinds[p.kind])inner=`${tIcon(o,50)}<b style="font-size:16px">${TN[o]}</b>`;
  else if(p.kind==='combo'||p.kind==='vconf')inner=`<span style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:17px" aria-label="${tCombo(o)}">${tComboIcons(o)}</span>`;
  else if(p.kind==='angle')inner=`<b style="font-size:20px">${o}°</b>`;
  else inner=`<b style="font-size:20px">${o}まい</b>`;
  return `<button class="ob ${right?'right':''} ${wr?'wrong':''}" data-i="${i}" ${S.done||wr?'disabled':''}><span class="k">${'アイウエ'[i]}</span>${inner}</button>`;
}
function hintText(){
  const p=P;
  switch(p.kind){
    case 'alone':return '1つの点のまわりは360°。形の1つの角を何こか合わせて、ちょうど360°になるかな？　正方形の角は90°、正三角形は60°、正六角形は120°です。';
    case 'meet':return '赤い点にさわっている形を、1まいずつ指でさして数えよう。';
    case 'angle':return `${TN[p.n]}は、1つの点から線を引くと、三角形${p.n-2}こに分けられます。三角形の角の合計は180°。全部の角の合計を${p.n}こで分けよう。`;
    case 'gap':return `1つの点のまわりは360°。いまある角の合計は ${tSum(p.have)}＝${p.have.reduce((s,n)=>s+tA(n),0)}°。のこりは何度かな？`;
    case 'combo':return '角の大きさ：正三角形60°、正方形90°、正五角形108°、正六角形120°、正八角形135°、正十角形144°、正十二角形150°。合計が360°になるのはどれ？';
    case 'around':return `むらさきの${TN[p.x]}の辺を1本ずつたどって、となりが${TN[p.y]}かどうか数えよう。`;
    case 'vconf':return '形の角がたくさん集まっている点を1つえらんで、まわりの形を数えよう。';
    case 'howmany':case 'third':return `${tCombo(p.given)}の角の合計は ${p.given.reduce((s,n)=>s+tA(n),0)}°。360°まで、あと何度？`;
  }
  return '';
}
function explain(){
  const p=P;
  switch(p.kind){
    case 'paint':return `もようは、横やななめに同じならびが<b>くり返し</b>ています。くり返しを見つけると、見えないところの色もわかります。`;
    case 'alone':{
      if(p.mode==='can'){const k=360/tA(p.a);return `${TN[p.a]}の1つの角は${tDeg(p.a)}。${tDeg(p.a)}×${k}＝360°なので、1つの点のまわりに${k}まいでぴったりうまります。${p.figs[p.a]?tPatch(p.figs[p.a],{px:300,id:9}):''}`;}
      const a=tA(p.a);return `${TN[p.a]}の1つの角は${tDeg(p.a)}。何まい集めても360°ちょうどにはならず、すきまや重なりができます。1つの形だけでしきつめられる正多角形は、<b>正三角形・正方形・正六角形</b>の3つだけです。`;}
    case 'meet':return `${TN[p.n]}の1つの角は${tDeg(p.n)}。360÷${tA(p.n)}＝${p.a}で、${p.a}まい集まります。`;
    case 'angle':return `三角形${p.n-2}こ分で 180×${p.n-2}＝${180*(p.n-2)}°。それを${p.n}こに分けて、${180*(p.n-2)}÷${p.n}＝<b>${p.a}°</b>です。`;
    case 'gap':{const s=p.have.reduce((t,n)=>t+tA(n),0);return `${tSum(p.have)}＝${s}°。のこりは 360−${s}＝${360-s}°。1つの角が${360-s}°なのは<b>${TN[p.a]}</b>です。`;}
    case 'combo':return `${tSum(p.a)}＝360°で、ぴったりです。ほかは、合計が360°になりません（${p.ds.map(d=>tSum(d)+'＝'+d.reduce((t,n)=>t+tA(n),0)+'°').join('、')}）。`;
    case 'around':return `${TN[p.x]}1まいのまわりには、${TN[p.y]}が<b>${p.a}まい</b>くっついています。`;
    case 'vconf':return `どの点のまわりも、${tCombo(p.a)}。${tSum(p.a)}＝360°で、ぴったりです。`;
    case 'howmany':{const s=p.given.reduce((t,n)=>t+tA(n),0);return `のこりは 360−${s}＝${360-s}°。${TN[p.f]}の角は${tA(p.f)}°なので、${360-s}÷${tA(p.f)}＝<b>${p.a}まい</b>です。`;}
    case 'third':{const s=p.given.reduce((t,n)=>t+tA(n),0);return `のこりは 360−${s}＝${360-s}°。1つの角が${360-s}°の正多角形は<b>${TN[p.a]}</b>です。`;}
  }
  return '';
}
function draw(){
  const p=P,paint=p.kind==='paint',f=fig();
  app.innerHTML=`${topBar()}
    <p class="qq">${qText()}</p>
    ${f?`<div class="boardw">${f}</div>`:''}
    ${paint?paintCtl():`<div class="opts4 ${shapeKinds[p.kind]?'':'txt'}">${S.opts.map(optHTML).join('')}</div>
      ${S.hint&&!S.done?`<p class="hintbox">${hintText()}</p>`:''}
      ${S.done?'':`<p class="msg ${S.msgc}" id="msg">${S.msg||'4つの中からえらぼう。'}</p><div class="row"><button class="btn" id="hint" ${S.hint?'disabled':''}>ヒント</button></div>`}`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(`<div style="margin:0">${explain()}</div>`);return;}
  if(paint){bindPaint();return;}
  app.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,o=S.opts[i];
    if(JSON.stringify(o)===JSON.stringify(p.a)){S.done=true;}else{S.wrong.push(i);S.hints++;S.msg='ちがいます。もう一度考えてみよう。';S.msgc='ng';}draw();});
  document.getElementById('hint').onclick=()=>{S.hint=true;S.hints++;S.msg='';S.msgc='';draw();};
}
function paintCtl(){
  if(S.done)return '';
  return `<div class="row ts-pal" style="justify-content:center">${PC.slice(0,P.nc).map((c,k)=>`<button class="ts-c ${S.col===k?'on':''}" data-k="${k}"><span style="background:${c}"></span>${PCN[k]}</button>`).join('')}<button class="ts-c ${S.col===-1?'on':''}" data-k="-1"><span style="background:#fff"></span>けす</button></div>
    <p class="msg ${S.msgc}" id="msg">${S.msg||'色をえらんで、？のマスをタップしよう。'}</p>
    <div class="row" style="justify-content:center"><button class="btn" id="hint">ヒント</button><button class="btn" id="reset">やりなおす</button></div>
    <p class="note">ヒントを使うと、？のマスを1つ正しい色にします（星がへります）。</p>`;
}
function bindPaint(){
  const p=P;
  app.querySelectorAll('.ts-c').forEach(b=>b.onclick=()=>{S.col=+b.dataset.k;draw();});
  document.getElementById('bd').addEventListener('click',e=>{
    const t=e.target.closest('[data-i]');if(!t)return;const i=+t.dataset.i;if(!p.hide.includes(i))return;
    S.g[i]=S.col<0?null:(S.g[i]===S.col?null:S.col);S.hl=null;check();});
  document.getElementById('reset').onclick=()=>{p.hide.forEach(i=>S.g[i]=null);S.msg='';S.msgc='';S.hl=null;draw();};
  document.getElementById('hint').onclick=()=>{
    S.hints++;const bad=p.hide.find(i=>S.g[i]!=null&&S.g[i]!==p.col[i]),emp=p.hide.find(i=>S.g[i]==null),i=bad!=null?bad:emp;
    if(i!=null){S.g[i]=p.col[i];S.hl=i;S.msg=`ヒント：わくのマスは ${PCN[p.col[i]]} です（ヒント ${S.hints}回）。`;S.msgc='';}
    check(true);};
}
function check(fromHint){
  const p=P,full=p.hide.every(i=>S.g[i]!=null);
  if(full){
    if(p.hide.every(i=>S.g[i]===p.col[i])){S.done=true;}
    else if(!fromHint){S.hints++;S.msg='ちがうマスがあります。くり返しのもようを、もう一度よく見よう。';S.msgc='ng';}
  }else if(!fromHint){S.msg='';S.msgc='';}
  draw();
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
