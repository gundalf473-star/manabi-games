.sk-w.on{background:var(--pick);color:var(--muted);border-style:dashed}

</style>

<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>スケルトン 100問</h1>
    <p class="lead">カギのないクロスワード。リストのことばを、ぜんぶ空の盤に入れよう。5つのレベルに20問ずつ。ヒントなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=true;
let QS=[];
const ID='skeleton';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>スケルトン 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* スケルトン：p={h,w,grid:['ひまわり','こ###',…]（#は黒マス、字は答え）, words:[入れることば], slots:[[r,c,'a'|'d',L]], given:[[r,c]]（はじめから見えている字）} */
const HINTWORD='ヒント';
const LVD={1:'ことば3つ・小さな盤',2:'ことば4〜5つ',3:'ことば6〜7つ',4:'ことば8〜10こ・6×6まで',5:'ことば11〜14こ・7×7まで'};
const RULES=`<ol class="rules">
  <li>下のリストのことばを、<b>ぜんぶ</b>盤に入れよう。ことばは<b>よこ</b>（左→右）か<b>たて</b>（上→下）に入ります。</li>
  <li>ことばを<b>タップ</b>してえらび、次に、入れたい場所の<b>はじまりのマス</b>（点のついたマス）をタップ。たても よこも入るマスでは、向きをえらびます。</li>
  <li>白いマスがたて・よこに2つ以上つながっているところには、リストのことばが1つずつ入ります。どのことばも<b>1回ずつ</b>使います。</li>
  <li>交わるマスの字は同じです。<b>同じ字数のことばが少ない</b>ところから考えるのがコツ。答えは1通りに決まります。</li>
  <li>入れたことばをもう一度タップすると、べつの場所に動かしたり、はずしたりできます。</li></ol>`;
function startStage(p){P=p;S={place:{},sel:null,choice:null,hints:0,done:false,msg:'',msgc:'',bad:null};begin(p);draw();}
const slotCells=i=>{const [r,c,d,L]=P.slots[i];return Array.from({length:L},(_,k)=>d==='a'?[r,c+k]:[r+k,c]);};
const isGiven=(r,c)=>P.given.some(([a,b])=>a===r&&b===c);
const solOf=i=>slotCells(i).map(([r,c])=>P.grid[r][c]).join('');
function letters(skip){const L={};P.given.forEach(([r,c])=>{L[r+','+c]=P.grid[r][c];});
  for(const i in S.place){if(+i===skip)continue;const w=S.place[i];slotCells(+i).forEach(([r,c],k)=>{L[r+','+c]=w[k];});}return L;}
const slotOfWord=w=>{for(const i in S.place)if(S.place[i]===w)return +i;return -1;};
function boardSVG(){
  const U=50,M=3,{h,w}=P;const L=letters(-1);let o='';
  const starts={};if(S.sel)P.slots.forEach(([r,c,d,len],i)=>{if(len===S.sel.length)starts[r+','+c]=1;});
  const badset=new Set(S.bad!=null?slotCells(S.bad).map(x=>x+''):[]);
  for(let r=0;r<h;r++)for(let c=0;c<w;c++){const x=M+c*U,y=M+r*U;
    if(P.grid[r][c]==='#'){o+=`<rect x="${x+1}" y="${y+1}" width="${U-2}" height="${U-2}" rx="3" fill="#d9d2ea"/>`;continue;}
    const st=starts[r+','+c],ch=L[r+','+c],gv=isGiven(r,c);
    const fill=S.done?'#e0f0e6':badset.has([r,c]+'')?'#f8e3e1':st?'#ede4fd':'#fff';
    o+=`<g class="sk-cell" data-r="${r}" data-c="${c}" style="cursor:pointer"><rect x="${x}" y="${y}" width="${U}" height="${U}" fill="${fill}" stroke="#3b2f6b" stroke-width="2"/>`;
    if(st)o+=`<circle cx="${x+9}" cy="${y+9}" r="5" fill="#7c3aed"/>`;
    if(ch)o+=`<text x="${x+U/2}" y="${y+U/2+11}" text-anchor="middle" font-size="30" font-weight="700" fill="${gv?'#7c3aed':'#2a2520'}" font-family="'BIZ UDPGothic',sans-serif">${ch}</text>`;
    if(gv)o+=`<rect x="${x+3}" y="${y+3}" width="${U-6}" height="${U-6}" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="3 3"/>`;
    o+='</g>';}
  const W=w*U+2*M,H=h*U+2*M;
  return `<svg id="bd" viewBox="0 0 ${W} ${H}" style="max-width:${Math.min(360,w*64)}px" role="img" aria-label="スケルトンの盤">${o}</svg>`;
}
function listHTML(){
  const byL={};P.words.forEach(w=>{(byL[w.length]=byL[w.length]||[]).push(w);});
  return Object.keys(byL).sort((a,b)=>a-b).map(L=>`<div class="sk-g"><span class="sk-gl">${L}文字</span>${byL[L].map(w=>{const on=slotOfWord(w)>=0;
    return `<button class="sk-w ${on?'on':''} ${S.sel===w?'sel':''}" data-w="${w}">${w}${on?'<i>✓</i>':''}</button>`;}).join('')}</div>`).join('');
}
function draw(){
  const nPl=Object.keys(S.place).length;
  app.innerHTML=`${topBar()}
    <div class="boardw">${boardSVG()}</div>
    ${S.done?'':`${S.choice?`<div class="row" style="justify-content:center">${S.choice.map(i=>`<button class="btn on" data-ci="${i}">${P.slots[i][2]==='a'?'よこに入れる →':'たてに入れる ↓'}</button>`).join('')}<button class="btn" id="cc">やめる</button></div>`:''}
    <p class="msg ${S.msgc||''}" id="msg">${S.msg||(S.sel?`「${S.sel}」（${S.sel.length}文字）を入れる はじまりのマスを タップしよう。`:'リストから ことばを えらぼう。')}</p>
    <div class="row" style="justify-content:space-between"><span class="label">ことばのリスト</span><span class="note">${nPl} / ${P.words.length}こ 入れた</span></div>
    <div class="sk-list">${listHTML()}</div>
    <div class="row">${S.sel&&slotOfWord(S.sel)>=0?'<button class="btn" id="rm">「'+S.sel+'」をはずす</button>':''}<button class="btn" id="hint">ヒント</button><button class="btn" id="reset" ${nPl?'':'disabled'}>全部はずす</button></div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(`<p style="margin:0">リストのことば${P.words.length}こが、ぴったり入りました。</p>`);return;}
  app.querySelectorAll('.sk-cell').forEach(g=>g.onclick=()=>tapCell(+g.dataset.r,+g.dataset.c));
  app.querySelectorAll('.sk-w').forEach(b=>b.onclick=()=>{const w=b.dataset.w;S.sel=S.sel===w?null:w;S.choice=null;S.bad=null;S.msg='';S.msgc='';draw();});
  app.querySelectorAll('[data-ci]').forEach(b=>b.onclick=()=>put(+b.dataset.ci));
  const cc=document.getElementById('cc');if(cc)cc.onclick=()=>{S.choice=null;draw();};
  const rm=document.getElementById('rm');if(rm)rm.onclick=()=>{delete S.place[slotOfWord(S.sel)];S.msg=`「${S.sel}」をはずしました。`;S.msgc='';S.sel=null;S.bad=null;draw();};
  document.getElementById('hint').onclick=hint;
  document.getElementById('reset').onclick=()=>{S.place={};S.sel=null;S.choice=null;S.bad=null;S.msg='';draw();};
}
function tapCell(r,c){
  S.bad=null;S.choice=null;
  if(!S.sel){S.msg='先に、下のリストから ことばを えらんでね。';S.msgc='';draw();return;}
  const ok=P.slots.map((s,i)=>i).filter(i=>P.slots[i][0]===r&&P.slots[i][1]===c&&P.slots[i][3]===S.sel.length);
  if(!ok.length){
    const any=P.slots.some(s=>s[0]===r&&s[1]===c);
    S.msg=any?`ここから はじまる場所は、${S.sel.length}文字ではありません。点のついたマスをえらぼう。`:`ここは ことばの はじまりではありません。点のついたマスをタップしよう。`;S.msgc='';draw();return;}
  if(ok.length===2){S.choice=ok;S.msg='よこ・たて、どちらに入れる？';S.msgc='';draw();return;}
  put(ok[0]);
}
function put(i){
  const w=S.sel;S.choice=null;
  const L=letters(i);const old=slotOfWord(w);
  /* 動かすときは、もとの場所の字を数えない */
  const L2=old>=0&&old!==i?(()=>{const t=Object.assign({},S.place);delete t[old];const keep=S.place;S.place=t;const x=letters(i);S.place=keep;return x;})():L;
  const cs=slotCells(i);const bad=cs.findIndex(([r,c],k)=>L2[r+','+c]&&L2[r+','+c]!==w[k]);
  if(bad>=0){const [r,c]=cs[bad];S.bad=i;S.msg=`${bad+1}文字目が、もう入っている「${L2[r+','+c]}」と合いません。ほかの場所をさがそう。`;S.msgc='ng';draw();return;}
  if(old>=0)delete S.place[old];
  const prev=S.place[i];S.place[i]=w;S.sel=null;
  S.msg=prev&&prev!==w?`「${w}」を入れて、「${prev}」はリストにもどしました。`:`「${w}」を入れました。`;S.msgc='';
  if(Object.keys(S.place).length===P.slots.length)S.done=true;
  draw();
}
function hint(){
  S.hints++;S.choice=null;S.bad=null;
  /* まちがった場所のことばがあれば、それを1つはずす */
  for(const i in S.place){if(S.place[i]!==solOf(+i)){const w=S.place[i];delete S.place[i];S.sel=null;
    S.msg=`ヒント：「${w}」は、そこではありません。はずしました（ヒント ${S.hints}回）。`;S.msgc='';draw();return;}}
  /* なければ、正しいことばを1つ入れる（交わる字が多い場所から） */
  const free=P.slots.map((s,i)=>i).filter(i=>S.place[i]===undefined);
  const L=letters(-1);free.sort((a,b)=>slotCells(b).filter(([r,c])=>L[r+','+c]).length-slotCells(a).filter(([r,c])=>L[r+','+c]).length);
  const i=free[0];S.place[i]=solOf(i);S.sel=null;
  S.msg=`ヒント：「${solOf(i)}」を入れました（ヒント ${S.hints}回）。`;S.msgc='';
  if(Object.keys(S.place).length===P.slots.length)S.done=true;
  draw();
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
