<title>さかさピラミッド 100問</title>

.sp-card{min-width:40px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;border:2px solid #f59e0b;background:#fffbeb;color:#92400e;border-radius:8px;font-size:20px;font-weight:700;box-shadow:0 2px 0 #f59e0b}
.sp-card.used{opacity:.35;box-shadow:none}
</style>

<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>さかさピラミッド 100問</h1>
    <p class="lead">上の数から、いちばん下の段の数をさかのぼって見つけよう。5つのレベルに20問ずつ。ヒントなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=true;
let QS=[];
const ID='sakasapyramid';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>さかさピラミッド 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* さかさピラミッド：どのブロックも、すぐ下の2つの数の和。子どもは「いちばん下の段」の空いた数だけを入れ、
   上の段は自動で計算される。むらさきのブロック（目標）の数とぴったり合えばクリア（保存した答えとはくらべない）。
   cons: none / same（下の段はみんな同じ数）/ seq（左から1ずつふえる）/ cards（set のカードを1回ずつ） */
const HINTWORD='ヒント';
const LVD={1:'3段・ひき算でさかのぼる',2:'3段・4段・2〜3こさがす',3:'まん中は2回たされる',4:'4段・1ずつふえる数・カード',5:'5段・むずかしい逆算'};
const RULES=`<ol class="rules">
  <li>どのブロックの数も、<b>すぐ下の2つの数の和</b>です。</li>
  <li><b>むらさきのブロック</b>が目標の数です。<b>いちばん下の段</b>の空いたブロックに数を入れて、目標の数にぴったり合わせよう。</li>
  <li>下の段に数を入れると、上の段は<b>自動で計算</b>されます。合うと緑、ちがうと赤になります。</li>
  <li>下の段に入る数は、どれも<b>1以上</b>の整数です。答えは1つに決まります。</li></ol>`;
const SP_W=n=>{const W=[1];for(let k=1;k<n;k++)W.push(W[k-1]*(n-k)/k);return W;};
function spIdx(n){const I=[];let k=0;for(let r=0;r<n;r++){I.push([]);for(let j=0;j<n-r;j++)I[r].push(k++);}return I;}
function startStage(p){const n=p.n;
  S={b:p.sol.slice(0,n).map((x,i)=>p.g[i]?String(x):''),sel:null,hints:0,done:false,msg:'',msgc:'',bad:[],hl:-1,lock:{},hint:false,fact:0};
  S.sel=[...Array(n).keys()].find(i=>!p.g[i]);S.maxlen=2;/* 答えのけた数で入力をしばらない（しばると答えのヒントになり、10以上をためせなくなる）。下の段の数はどれも100より小さい */P=p;begin(p);draw();}
function spVals(){const n=P.n,I=spIdx(n),v=Array(P.sol.length).fill(null);
  for(let j=0;j<n;j++)v[j]=S.b[j]===''?null:+S.b[j];
  for(let r=1;r<n;r++)for(let j=0;j<n-r;j++){const a=v[I[r-1][j]],b=v[I[r-1][j+1]];v[I[r][j]]=a!=null&&b!=null?a+b:null;}
  return v;}
function consBad(){const n=P.n,b=S.b.map(x=>x===''?null:+x),bad=new Set();
  if(P.cons==='cards'){const cnt={};b.forEach((x,i)=>{if(x!=null)(cnt[x]=cnt[x]||[]).push(i);});
    Object.entries(cnt).forEach(([x,is])=>{if(is.length>1||!P.set.includes(+x))is.forEach(i=>{if(!P.g[i])bad.add(i);});});}
  if(P.cons==='same'){const f=b.find(x=>x!=null);b.forEach((x,i)=>{if(x!=null&&x!==f)bad.add(i);});}
  if(P.cons==='seq'){for(let i=0;i<n-1;i++)if(b[i]!=null&&b[i+1]!=null&&b[i+1]-b[i]!==1){bad.add(i);bad.add(i+1);}}
  return bad;}
function solvedNow(){const n=P.n;if(S.b.some(x=>x===''))return false;const b=S.b.map(Number);if(b.some(x=>x<1))return false;
  const v=spVals();for(let i=n;i<P.sol.length;i++)if(P.g[i]&&v[i]!==P.sol[i])return false;
  if(consBad().size)return false;
  if(P.cons==='cards'&&[...b].sort((x,y)=>x-y).join()!==[...P.set].sort((x,y)=>x-y).join())return false;
  return true;}
function boardSVG(){const n=P.n,BW=n>=5?62:n===4?70:80,BH=n>=5?48:54,I=spIdx(n),v=spVals(),cb=consBad();let s='';const W=n*BW+8,H=n*BH+8;
  for(let r=0;r<n;r++)for(let j=0;j<n-r;j++){const i=I[r][j],x=4+r*BW/2+j*BW,y=4+(n-1-r)*BH,cx=x+BW/2,cy=y+BH/2;
    if(r===0){const g=P.g[i],sel=S.sel===i&&!S.done,bad=S.bad.includes(i)||cb.has(i);
      s+=`<rect x="${x+2}" y="${y+2}" width="${BW-4}" height="${BH-4}" rx="6" fill="${g?'#efeae1':S.hl===i?'#fef3c7':sel?'#ede4fd':'#fff'}" stroke="${bad?'#c8352d':sel?'#7c3aed':'#b9ae9c'}" stroke-width="${sel||bad?3.5:1.5}" ${g?'':'stroke-dasharray="0"'}/>`;
      if(S.b[i]!=='')s+=`<text x="${cx}" y="${cy+8}" text-anchor="middle" font-size="23" font-weight="700" fill="${bad?'#c8352d':g?'#2a2520':S.lock[i]?'#a97c12':'#7c3aed'}" font-family="sans-serif">${S.b[i]}</text>`;
      else if(!S.done)s+=`<text x="${cx}" y="${cy+7}" text-anchor="middle" font-size="20" fill="#cbbfa8" font-family="sans-serif">？</text>`;
      if(!g&&!S.done)s+=`<rect class="hit" data-i="${i}" x="${x}" y="${y}" width="${BW}" height="${BH}" fill="transparent" style="cursor:pointer"/>`;}
    else if(P.g[i]){const t=P.sol[i],now=v[i],ok=now===t,ng=now!=null&&now!==t;
      s+=`<rect x="${x+2}" y="${y+2}" width="${BW-4}" height="${BH-4}" rx="6" fill="${ok?'#dcfce7':'#ede4fd'}" stroke="${ok?'#1d7a4c':ng?'#c8352d':'#7c3aed'}" stroke-width="${ng||ok?3.5:2.5}"/>`;
      s+=`<text x="${cx}" y="${cy+(ng?3:8)}" text-anchor="middle" font-size="${t>=100?20:23}" font-weight="700" fill="${ok?'#1d7a4c':'#3b2f6b'}" font-family="sans-serif">${t}</text>`;
      if(ng)s+=`<text x="${cx}" y="${y+BH-6}" text-anchor="middle" font-size="11" font-weight="700" fill="#c8352d" font-family="sans-serif">いま ${now}</text>`;}
    else{s+=`<rect x="${x+2}" y="${y+2}" width="${BW-4}" height="${BH-4}" rx="6" fill="#fbfaf6" stroke="#ddd6cb" stroke-width="1.2"/>`;
      if(v[i]!=null)s+=`<text x="${cx}" y="${cy+7}" text-anchor="middle" font-size="${v[i]>=100?18:20}" fill="#8a7f72" font-family="sans-serif">${v[i]}</text>`;}
  }
  return `<svg id="bd" viewBox="0 0 ${W} ${H}" style="max-width:${Math.min(W*1.15,420)}px" role="img" aria-label="さかさピラミッド">${s}</svg>`;}
function info(){const W=SP_W(P.n).join('・');
  let t='<b>むらさきの目標</b>に合うように、<b>いちばん下の段</b>の「？」に数を入れよう。';
  if(P.cons==='same')t+=`<br>下の段の数は、<b>みんな同じ数</b>です。`;
  if(P.cons==='seq')t+=`<br>下の段の数は、左から<b>1ずつ大きく</b>なっています（例：3, 4, 5）。`;
  if(P.cons==='cards')t+=`<br>下の段には、<b>カード ${P.set.join('・')}</b> を1まいずつ使います。`;
  return t;}
function cardsRow(){if(P.cons!=='cards')return '';const used=S.b.filter(x=>x!=='').map(Number);
  return `<div class="sp-cards">${P.set.map(c=>`<span class="sp-card ${used.includes(c)?'used':''}">${c}</span>`).join('')}</div>`;}
function hintText(){const n=P.n,W=SP_W(n);
  if(P.way==='direct')return '目標の数から、<b>すぐ下の2つのうち、わかっている数をひく</b>と、もう1つの数がわかります。上から下へ、さかのぼろう。';
  const w=`いちばん下の段の数は、いちばん上までに<b>何回もたされます</b>。${n}段なら、左から <b>${W.join('回・')}回</b>。`;
  if(P.way==='weight')return w+(n===3?'まん中の数は2回たされるので、いちばん上の数から両はしの数をひいて、2でわろう。':'わかっている数を何回ずつたしたかを計算して、目標の数からひいてみよう。');
  if(P.way==='same')return w+`下の段がみんな□なら、いちばん上は □×${W.reduce((a,b)=>a+b,0)} です。`;
  if(P.way==='seq')return w+'いちばん左を□とすると、となりは □＋1、その次は □＋2 …。□にためしの数を入れて、いちばん上がどう変わるか見てもよい。';
  return w+'まん中に近いところに大きいカードをおくと、いちばん上は大きくなります。むらさきの目標の数も手がかりにしよう。';}
function draw(){
  app.innerHTML=`${topBar()}
    <p class="qq" style="font-size:15px;font-weight:400">${info()}</p>
    <div class="boardw">${boardSVG()}</div>
    ${S.done?'':cardsRow()+`<div class="pad">${[1,2,3,4,5,6,7,8,9,0].map(d=>`<button data-v="${d}">${d}</button>`).join('')}<button data-v="-1" class="er">消す</button></div>
    ${S.hint?`<p class="hintbox">${hintText()}</p>`:''}
    <p class="msg ${S.msgc||''}" id="msg">${S.msg||'下の段の「？」をえらんで、数字ボタンで入れよう。'}</p>
    <div class="row"><button class="btn" id="hint">ヒント</button><button class="btn" id="reset">やりなおす</button></div>
    <p class="note">ヒントは、はじめは考え方を出し、2回目からは下の段の数を1つずつ、理由といっしょに入れます（星がへります）。</p>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(`<div class="sp-ex"><b>解き方の例</b><ol>${P.steps.filter(s=>P.cons!=='cards'||s.i<0).map(s=>`<li>${esc(s.t)}</li>`).join('')}</ol><p class="note" style="margin:0">${P.n}段のピラミッドでは、いちばん下の数は左から ${SP_W(P.n).join('回・')}回 たされて、いちばん上の数になります。</p></div>`);return;}
  app.querySelectorAll('#bd .hit').forEach(h=>h.onclick=()=>{S.sel=+h.dataset.i;S.msg='';S.msgc='';S.bad=[];draw();});
  app.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>put(+b.dataset.v));
  document.getElementById('hint').onclick=hint;
  document.getElementById('reset').onclick=()=>{S.b=S.b.map((x,i)=>P.g[i]||S.lock[i]?x:'');S.msg='';S.bad=[];S.hl=-1;draw();};
}
function after(){
  if(S.b.every(x=>x!=='')){if(solvedNow())S.done=true;else{S.msg='全部入りましたが、目標の数と合いません。赤いところを見なおそう。';S.msgc='ng';}}
}
function put(d){const i=S.sel,n=P.n;if(i==null||i<0||P.g[i])return;
  if(S.lock[i]){S.msg='ヒントで入れたマスは変えられません。';S.msgc='';draw();return;}
  S.bad=[];S.hl=-1;S.msg='';S.msgc='';
  if(d<0)S.b[i]=S.b[i].slice(0,-1);
  else{const cur=S.b[i].length>=S.maxlen?'':S.b[i];const t=String(+(cur+d));S.b[i]=t==='0'?'':t;
    if(S.b[i].length>=S.maxlen){for(let k=1;k<n;k++){const j=(i+k)%n;if(!P.g[j]&&!S.lock[j]&&S.b[j]===''){S.sel=j;break;}}}}
  after();draw();}
function hint(){const n=P.n;S.hints++;
  if(!S.hint){S.hint=true;S.msg='';draw();return;}
  const bad=[...Array(n).keys()].filter(i=>!P.g[i]&&S.b[i]!==''&&+S.b[i]!==P.sol[i]);
  if(bad.length){S.bad=bad;S.msg=`ヒント：ちがう数が ${bad.length}こ あります（赤い枠）。消してから考えなおそう（ヒント ${S.hints}回）。`;S.msgc='ng';draw();return;}
  const k=P.steps.findIndex(s=>s.i>=0&&S.b[s.i]!==String(s.v));if(k<0){S.hints--;return;}
  const st=P.steps[k],facts=P.steps.slice(S.fact,k).filter(s=>s.i<0).map(s=>s.t);S.fact=k+1;
  S.b[st.i]=String(st.v);S.lock[st.i]=true;S.sel=st.i;S.hl=st.i;
  S.msg=`ヒント（${S.hints}回）：${facts.map(t=>esc(t)+' ').join('')}${esc(st.t)}`;S.msgc='';
  after();draw();}
document.addEventListener('keydown',e=>{if(!S||S.done||!P||!document.getElementById('bd'))return;
  if(/^[0-9]$/.test(e.key))put(+e.key);else if(e.key==='Backspace'||e.key==='Delete')put(-1);});

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
