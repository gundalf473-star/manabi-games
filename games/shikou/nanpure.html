<style>

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --ink:#b3a6f0; --seal:#b79cff; --sealsoft:#271c40; --ok:#4cc184; --oksoft:#1b3326; --ng:#f07468; --ngsoft:#3a2220; --gold:#e1b44a; --pick:#28241e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15130f; --surface:#1e1b17; --fg:#ece6dc; --muted:#a59c90; --rule:#34302a;
  --ink:#b3a6f0; --seal:#b79cff; --sealsoft:#271c40; --ok:#4cc184; --oksoft:#1b3326; --ng:#f07468; --ngsoft:#3a2220; --gold:#e1b44a; --pick:#28241e; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.75;

.ob:hover:not(:disabled){border-color:var(--ink)}

.ccard,.pcard{border:2px solid #93c5fd;background:#eff6ff;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:#1e3a8a}
.pcard{align-self:flex-start;padding:3px 10px}
.ccard.loop,.pcard.loop{border-color:#fbbf24;background:#fffbeb;color:#92400e}
.ccard span,.pcard span{font-size:18px}
.ccard:disabled,.pcard:disabled{opacity:.45;cursor:default}

</style>

<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>ナンプレ</h1>
    <p class="lead">たて・横・太いわくに、数字を1つずつ入れよう。4×4から9×9まで、5つのレベルから1問ずつ。ヒントなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=false;
let QS=[{"id":"1-01","lv":1,"n":4,"p":[[3,4,0,0],[1,2,3,0],[0,0,0,3],[4,3,1,0]],"sol":[[3,4,2,1],[1,2,3,4],[2,1,4,3],[4,3,1,2]],"k":9},{"id":"2-01","lv":2,"n":6,"p":[[0,3,5,0,6,0],[6,4,1,3,5,0],[3,5,0,6,0,4],[4,1,0,0,3,0],[5,6,0,0,0,3],[0,0,3,5,0,0]],"sol":[[2,3,5,4,6,1],[6,4,1,3,5,2],[3,5,2,6,1,4],[4,1,6,2,3,5],[5,6,4,1,2,3],[1,2,3,5,4,6]],"k":20},{"id":"3-01","lv":3,"n":6,"p":[[6,1,0,2,0,0],[0,4,0,0,1,5],[0,0,0,0,0,6],[0,0,6,5,0,4],[2,0,0,0,5,0],[5,0,1,0,6,0]],"sol":[[6,1,5,2,4,3],[3,4,2,6,1,5],[4,5,3,1,2,6],[1,2,6,5,3,4],[2,6,4,3,5,1],[5,3,1,4,6,2]],"k":15},{"id":"4-01","lv":4,"n":9,"p":[[0,3,0,0,0,2,0,9,0],[6,0,0,3,0,9,5,1,2],[0,0,0,8,5,1,7,0,6],[5,0,7,0,9,0,0,4,0],[0,0,0,0,1,7,8,0,3],[2,1,0,5,8,0,0,0,0],[7,5,2,0,3,6,0,0,4],[0,0,4,1,0,0,3,2,0],[3,9,0,0,2,8,0,0,0]],"sol":[[1,3,5,7,6,2,4,9,8],[6,7,8,3,4,9,5,1,2],[4,2,9,8,5,1,7,3,6],[5,8,7,6,9,3,2,4,1],[9,4,6,2,1,7,8,5,3],[2,1,3,5,8,4,9,6,7],[7,5,2,9,3,6,1,8,4],[8,6,4,1,7,5,3,2,9],[3,9,1,4,2,8,6,7,5]],"k":40},{"id":"5-01","lv":5,"n":9,"p":[[9,0,0,0,1,7,4,0,6],[0,0,6,0,0,3,5,0,0],[0,0,7,0,6,0,0,0,9],[0,2,9,0,3,0,0,0,0],[0,5,0,7,0,0,0,0,0],[0,0,3,2,0,8,7,0,5],[5,0,1,0,7,0,0,8,0],[0,0,0,4,8,0,1,0,0],[4,7,0,0,0,6,9,0,0]],"sol":[[9,3,5,8,1,7,4,2,6],[1,4,6,9,2,3,5,7,8],[2,8,7,5,6,4,3,1,9],[7,2,9,6,3,5,8,4,1],[8,5,4,7,9,1,2,6,3],[6,1,3,2,4,8,7,9,5],[5,9,1,3,7,2,6,8,4],[3,6,2,4,8,9,1,5,7],[4,7,8,1,5,6,9,3,2]],"k":32}];
const ID='nanpure';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>ナンプレ 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* ナンプレ：p={n, p:[[0は空き]], sol}。たて・横・太わくの中に、1〜nを1つずつ */
const HINTWORD='ヒント';
const LVD={1:'4×4',2:'6×6 ・ 数字多め',3:'6×6',4:'9×9 ・ 数字多め',5:'9×9'};
const RULES=`<ol class="rules">
  <li>どの<b>たての列</b>・<b>横の行</b>・<b>太い線で囲まれたわく</b>にも、1〜（マスの数）の数字が<b>1つずつ</b>入ります。</li>
  <li>空いているマスをタップしてえらび、下の数字ボタンで入れよう。</li>
  <li>同じ列・行・わくに同じ数字があると、赤くなります。</li>
  <li>答えは1つに決まります。</li></ol>`;
const BX={4:[2,2],6:[2,3],9:[3,3]};
function startStage(p){P=p;S={g:p.p.map(r=>r.slice()),lock:p.p.map(r=>r.map(()=>false)),sel:null,hints:0,done:false,msg:''};
  const n=p.n;for(let r=0;r<n&&!S.sel;r++)for(let c=0;c<n;c++)if(!p.p[r][c]){S.sel=[r,c];break;}
  begin(p);draw();}
const given=(r,c)=>!!P.p[r][c];
function dup(r,c){const v=S.g[r][c],n=P.n;if(!v)return false;const [bh,bw]=BX[n];
  for(let k=0;k<n;k++){if(k!==c&&S.g[r][k]===v)return true;if(k!==r&&S.g[k][c]===v)return true;}
  const br=Math.floor(r/bh)*bh,bc=Math.floor(c/bw)*bw;for(let a=br;a<br+bh;a++)for(let b=bc;b<bc+bw;b++)if((a!==r||b!==c)&&S.g[a][b]===v)return true;return false;}
function solved(){return S.g.every((row,r)=>row.every((v,c)=>v===P.sol[r][c]));}
function boardSVG(){
  const n=P.n,U=n===9?40:n===6?52:66,M=4,W=n*U+2*M,[bh,bw]=BX[n];let s='';
  const sv=S.sel?S.g[S.sel[0]][S.sel[1]]:0;
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){const x=M+c*U,y=M+r*U,v=S.g[r][c],sel=S.sel&&S.sel[0]===r&&S.sel[1]===c;
    const near=S.sel&&(S.sel[0]===r||S.sel[1]===c||(Math.floor(S.sel[0]/bh)===Math.floor(r/bh)&&Math.floor(S.sel[1]/bw)===Math.floor(c/bw)));
    const d=dup(r,c);
    s+=`<rect x="${x}" y="${y}" width="${U}" height="${U}" fill="${sel?'#ddd0fb':d?'#f8e3e1':v&&v===sv?'#ece4fd':near?'#f6f2fb':'#fff'}" stroke="#cfc5b3" stroke-width="1"/>`;
    if(v)s+=`<text x="${x+U/2}" y="${y+U*0.68}" text-anchor="middle" font-size="${U*0.55}" font-weight="700" fill="${d?'#c8352d':given(r,c)?'#2a2520':S.lock[r][c]?'#a97c12':'#7c3aed'}" font-family="sans-serif">${v}</text>`;
    s+=`<rect class="hit" data-r="${r}" data-c="${c}" x="${x}" y="${y}" width="${U}" height="${U}" fill="transparent" style="cursor:pointer"/>`;}
  for(let k=0;k<=n;k++){const th=k%bw===0?3:0, tv=k%bh===0?3:0;
    if(th)s+=`<line x1="${M+k*U}" y1="${M}" x2="${M+k*U}" y2="${M+n*U}" stroke="#2a2520" stroke-width="${th}"/>`;
    if(tv)s+=`<line x1="${M}" y1="${M+k*U}" x2="${M+n*U}" y2="${M+k*U}" stroke="#2a2520" stroke-width="${tv}"/>`;}
  return `<svg id="bd" viewBox="0 0 ${W} ${W}" style="max-width:${Math.min(W*1.2,440)}px" role="img" aria-label="ナンプレの盤">${s}</svg>`;
}
function draw(){
  const n=P.n, left=S.g.flat().filter(v=>!v).length;
  app.innerHTML=`${topBar()}
    <div class="boardw">${boardSVG()}</div>
    ${S.done?'':`<div class="pad">${[...Array(n).keys()].map(i=>`<button data-v="${i+1}">${i+1}</button>`).join('')}<button data-v="0" class="er">消す</button></div>
    <p class="msg ${S.msgc||''}" id="msg">${S.msg||`のこり ${left}マス。マスをえらんで数字を入れよう。`}</p>
    <div class="row"><button class="btn" id="hint">ヒント</button><button class="btn" id="reset">やりなおす</button></div>
    <p class="note">黒い数字ははじめからある数字です。ヒントは、えらんでいるマス（えらんでいなければ空いているマス）の答えを入れます（星がへります）。</p>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear();return;}
  app.querySelectorAll('#bd .hit').forEach(h=>h.onclick=()=>{S.sel=[+h.dataset.r,+h.dataset.c];S.msg='';S.msgc='';draw();});
  app.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>put(+b.dataset.v));
  document.getElementById('hint').onclick=hint;
  document.getElementById('reset').onclick=()=>{S.g=S.g.map((row,r)=>row.map((v,c)=>given(r,c)||S.lock[r][c]?v:0));S.msg='';draw();};
}
function put(v){
  if(!S.sel)return;const [r,c]=S.sel;
  if(given(r,c)||S.lock[r][c]){S.msg='このマスは変えられません。';S.msgc='';draw();return;}
  S.g[r][c]=v;S.msg='';S.msgc='';
  if(S.g.every(row=>row.every(x=>x))){if(solved())S.done=true;else{S.msg='全部うまりましたが、どこかちがいます。赤いところを見なおそう。';S.msgc='ng';}}
  draw();
}
function hint(){
  const n=P.n;let t=null;
  if(S.sel&&S.g[S.sel[0]][S.sel[1]]!==P.sol[S.sel[0]][S.sel[1]])t=S.sel;
  if(!t)for(let r=0;r<n&&!t;r++)for(let c=0;c<n;c++)if(S.g[r][c]&&S.g[r][c]!==P.sol[r][c]){t=[r,c];break;}
  if(!t)for(let r=0;r<n&&!t;r++)for(let c=0;c<n;c++)if(!S.g[r][c]){t=[r,c];break;}
  if(!t)return;const [r,c]=t;S.g[r][c]=P.sol[r][c];S.lock[r][c]=true;S.hints++;S.sel=t;
  S.msg=`ヒント：1マス入れました（ヒント ${S.hints}回）。`;S.msgc='';if(solved())S.done=true;draw();
}
document.addEventListener('keydown',e=>{if(!S||S.done||!P||P.n==null||!document.getElementById('bd'))return;
  if(/^[1-9]$/.test(e.key)&&+e.key<=P.n)put(+e.key);else if(e.key==='Backspace'||e.key==='Delete'||e.key==='0')put(0);
  else{const d={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];if(d&&S.sel){e.preventDefault();S.sel=[(S.sel[0]+d[0]+P.n)%P.n,(S.sel[1]+d[1]+P.n)%P.n];draw();}}});

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD} ${S.hints}回でクリアしました。${HINTWORD}なしなら ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
