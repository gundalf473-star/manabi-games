  boxes.forEach(b=>{b.style.transition='none';b.style.transform='none';}); void el.offsetWidth;
  let i=0;const next=()=>{if(i>=ops.length||!el.isConnected)return;const b=boxes[i];b.style.transition='transform .9s ease';b.style.transform=KTCSS[ops[i]];i++;setTimeout(next,1050);};
  setTimeout(next,200);
}

function startStage(p){P=p;
  S={hints:0,done:false,msg:'',wrong:[],hint:false,g:p.g?p.g.slice():null,moves:0,busy:false,
     opts:p.kind==='pick'?shuffle([p.a,...p.ds].map((f,i)=>({f,ok:i===0}))):null};
  begin(p);draw();}

function qtext(){
  const a=P.ask;
  if(a==='pic')return `この絵を<b>${ktOps(P.ops)}</b>と、どうなる？`;
  if(a==='times')return `この絵を<b>${P.dir==='R'?'右':'左'}に90°ずつ、${P.k}回</b>回すと、どうなる？`;
  if(a==='match')return `見本の絵を<b>回したもの</b>はどれ？（うら返したものは、だめです）`;
  if(a==='digit')return `デジタル数字の<b>「${P.src}」</b>を<b>${KTOP[P.ops[0]][0]}</b>と、どの数字に見える？`;
  if(a==='num')return `この数を<b>180°回す</b>（さかさまにする）と、いくつに見える？`;
  if(a==='same')return `180°回しても、<b>同じ数</b>に見えるのはどれ？`;
  if(a==='letturn')return `この文字を<b>${KTOP[P.ops[0]][0]}</b>と、どの文字に見える？`;
  return P.txt;
}
function hintText(){
  const a=P.ask;
  if(a==='pic'||a==='times')return `${a==='times'?'4回回すと、もとの向きにもどります。だから、'+P.k+'回は'+(P.k%4)+'回と同じです。':''}目じるしのマス（色のついた角など）を1つ決めて、それがどこへ動くか追いかけよう。右に90°なら、上にあったものが右へ動きます。`;
  if(a==='match')return 'うら返した絵は、どう回しても見本とは重なりません。色のならびが、時計回りか反時計回りかをくらべてみよう。';
  if(a==='digit')return '7本の線のどこが光っているかを見て、上と下（左と右）を入れかえてみよう。';
  if(a==='num'||a==='same'||a==='diff')return '180°回すと、1つ1つの数字がさかさまになるだけでなく、<b>ならぶ順番も逆</b>になります（左はしの数字が右はしへ）。さかさまにして数字に見えるのは 0・1・2・5・6・8・9 で、6と9は入れかわります。';
  if(a==='count')return 'さかさまにして同じに見える数字は 0・1・2・5・8。6と9は入れかわって組になります。左はしと右はしを組にして、何通りあるか数えよう。';
  if(a==='which')return P.mode==='mirror'?'鏡にうつすと、左と右が入れかわります。左右が同じ形の数字はどれかな。':'さかさまにすると、上と下、左と右が入れかわります。紙に書いて回してみてもいいよ。';
  if(a==='letter'||a==='letturn')return '頭の中で回すのがむずかしければ、紙に大きく書いて、回したりすかしたりしてみよう。';
  return '';
}
function explain(){
  const a=P.ask, ok=P.a;
  if(a==='pic'||a==='times')return `<p style="margin:0">「見る」をおすと、見本の絵が動きます。</p><div class="kt-ex" id="kx">${ktAnimBox(ktFig(P.fig,96),a==='times'?Array(P.k).fill(P.dir==='R'?'r90':'r270'):P.ops)}<span class="kt-arr">→</span>${ktFig(ok,96)}</div><button class="btn" id="kplay">▶ 見る</button>`;
  if(a==='match'){let k=0,g=P.fig.g;while(!ktSame(g,ok.g)&&k<4){g=ktPix.r90(g);k++;}
    return `<p style="margin:0">正解は、見本を<b>右に${k*90}°</b>回したものです。ほかの3つは、うら返しになっているので、どう回しても重なりません。</p><div class="kt-ex" id="kx">${ktAnimBox(ktFig(P.fig,96),Array(k).fill('r90'))}<span class="kt-arr">→</span>${ktFig(ok,96)}</div><button class="btn" id="kplay">▶ 見る</button>`;}
  if(a==='digit'||a==='num'||a==='letturn'){const rf=P.fig.k==='seg'?ktSeg(P.ops[0],P.fig):P.fig;
    return `<p style="margin:0">${KTOP[P.ops[0]][0]}と、こう見えます${a==='num'?'（数字の順番も逆になります）':''}。</p><div class="kt-ex" id="kx">${ktAnimBox(ktFig(P.fig,64),P.ops)}<span class="kt-arr">→</span>${ktFig(rf,64)}</div><button class="btn" id="kplay">▶ 見る</button>`;}
  if(a==='which'||a==='same'||a==='letter'){const op=a==='which'?(P.mode==='mirror'?'mlr':'r180'):a==='same'?'r180':(P.mode==='mlr'?'mlr':P.mode==='mud'?'mud':'r180');
    return `<p style="margin:0">正解の形を${KTOP[op][0]}と、${P.mode==='notdigit'?'数字に見えなくなります':P.mode==='notsame'?'同じ文字になりません':P.mode==='other'?'べつの数字に見えます':'同じに見えます'}。</p><div class="kt-ex" id="kx">${ktAnimBox(ktFig(ok,64),[op])}<span class="kt-arr">→</span>${ktFig(ktSeg(op,ok),64)}</div><button class="btn" id="kplay">▶ 見る</button>`;}
  if(a==='count')return `<p style="margin:0">答えは${P.n}こ。${P.why}<br><span class="note">${P.ex.join('、')}</span></p>`;
  if(a==='diff')return `<p style="margin:0">${P.ans}を180°回すと${P.t}に見えます。${P.t}−${P.ans}＝${P.d}です。</p>`;
  return '';
}
function animOps(){const a=P.ask;if(a==='times')return Array(P.k).fill(P.dir==='R'?'r90':'r270');
  if(a==='match'){let k=0,g=P.fig.g;while(!ktSame(g,P.a.g)&&k<4){g=ktPix.r90(g);k++;}return Array(k).fill('r90');}
  if(a==='which'||a==='same'||a==='letter')return [a==='which'?(P.mode==='mirror'?'mlr':'r180'):a==='same'?'r180':(P.mode==='mlr'?'mlr':P.mode==='mud'?'mud':'r180')];
  return P.ops||[];}
const REF10={k:'seg',w:29,h:4,s:[]};
function ktRef(){ /* 0〜9のデジタル数字（見本） */
  const SG={a:[0,0,2,0],b:[2,0,2,2],c:[2,2,2,4],d:[0,4,2,4],e:[0,2,0,4],f:[0,0,0,2],g:[0,2,2,2]},D=['abcdef','bc','abged','abgcd','fgbc','afgcd','afgedc','abc','abcdefg','abcdfg'];
  const s=[];D.forEach((d,i)=>[...d].forEach(k=>{const [a,b,c,e]=SG[k];s.push([a+i*3,b,c+i*3,e]);}));
  return `<div style="display:flex;flex-direction:column;align-items:center;gap:2px"><span class="note">デジタル数字（0〜9）</span>${ktFig({k:'seg',w:29,h:4,s},44)}</div>`;
}
function figArea(){
  const a=P.ask;
  if(a==='count'||a==='diff')return ktRef();
  if(a==='which'||a==='same'||a==='letter')return '';
  const lab=a==='match'?'見本':(a==='times'?`${P.dir==='R'?'↻ 右':'↺ 左'}に90°ずつ ${P.k}回`:P.ops.map(o=>KTOP[o][2]+' '+KTOP[o][3]).join(' → '));
  return `<figure class="kt-main">${ktFig(P.fig,P.fig.k==='pix'?120:(P.fig.w>3?80:96))}<figcaption><span class="kt-op">${lab}</span></figcaption></figure>`;
}
function optHTML(o,i){
  const right=S.done&&o.ok, dis=S.done||S.wrong.includes(i);
  const px=o.f.k==='pix'?104:o.f.k==='seg'&&o.f.let?66:o.f.w>3?52:70;
  return `<button class="ob kt-o ${right?'right':''} ${S.wrong.includes(i)?'wrong':''}" data-i="${i}" ${dis?'disabled':''}><span class="k">${'アイウエ'[i]}</span>${ktFig(o.f,px)}</button>`;
}
function drawPick(){
  const fa=figArea();
  app.innerHTML=`${topBar()}
    ${fa?`<div class="boardw kt-bw">${fa}</div>`:''}
    <p class="qq">${qtext()}</p>
    <div class="opts4">${S.opts.map(optHTML).join('')}</div>
    ${S.hint&&!S.done?`<p class="hintbox">${hintText()}</p>`:''}
    ${S.done?'':`<p class="msg ${S.msgc||''}" id="msg">${S.msg||''}</p><div class="row"><button class="btn" id="hint" ${S.hint?'disabled':''}>ヒント</button></div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(explain());const b=document.getElementById('kplay');if(b){b.onclick=()=>ktPlay(document.getElementById('kx'),animOps());ktPlay(document.getElementById('kx'),animOps());}return;}
  app.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
    if(S.opts[i].ok){S.done=true;draw();}else{S.wrong.push(i);S.hints++;S.msg='ちがいます。もう一度考えてみよう。';S.msgc='ng';draw();}});
  document.getElementById('hint').onclick=()=>{S.hint=true;S.hints++;S.msg='';draw();};
}
/* ---- 回して同じ向きに ---- */
const KTM={r:['↻','右に回す','r90'],l:['↺','左に回す','r270'],f:['⇆','うら返す','mlr']};
function ktBest(){ /* いまの向きから見本までの最少の手（幅優先） */
  const key=g=>g.join('|'),T=key(P.t),seen=new Map([[key(S.g),null]]);let fr=[S.g];
  while(fr.length){const nf=[];for(const g of fr){if(key(g)===T){let k=T,first=null;while(seen.get(k)){first=seen.get(k);k=first.from;}return first?first.m:null;}
    for(const m of P.ops){const x=ktPix[KTM[m][2]](g),kx=key(x);if(!seen.has(kx)){seen.set(kx,{from:key(g),m});nf.push(x);}}}fr=nf;}
  return null;}
function drawTurn(){
  const ok=ktSame(S.g,P.t);
  app.innerHTML=`${topBar()}
    <p class="qq">ボタンで絵を回して、<b>見本と同じ向き</b>にしよう。</p>
    <div class="boardw kt-turn"><figure><figcaption>見本</figcaption>${ktFig({k:'pix',g:P.t},118)}</figure>
      <figure><figcaption>あなたの絵</figcaption><div id="kme" class="kt-me">${ktFig({k:'pix',g:S.g},118)}</div></figure></div>
    ${S.done?'':`<div class="kt-btns">${[...P.ops].map(m=>`<button class="btn kt-mv ${S.hl===m?'kt-hl':''}" data-m="${m}"><span>${KTM[m][0]}</span>${KTM[m][1]}</button>`).join('')}</div>
    <p class="msg ${S.msgc||''}" id="msg">${S.msg||`回した回数：${S.moves}回`}</p>
    <div class="row"><button class="btn" id="hint">ヒント</button><button class="btn" id="reset">はじめから</button></div>
    ${P.ops.includes('f')?'<p class="note">「うら返す」は、絵を左右に裏返します（鏡にうつしたような形）。</p>':''}`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(`<p style="margin:0">${S.moves}回で同じ向きになりました。いちばん少ない回数は<b>${P.mn}回</b>です。${S.moves>P.mn?'もっと少ない回数でもできるよ。':'さいたん！'}</p>`);return;}
  app.querySelectorAll('.kt-mv').forEach(b=>b.onclick=()=>{if(S.busy)return;const m=b.dataset.m,el=document.querySelector('#kme');S.busy=true;S.hl=null;
    el.style.transition='transform .35s ease';el.style.transform=KTCSS[KTM[m][2]];
    setTimeout(()=>{S.g=ktPix[KTM[m][2]](S.g);S.moves++;S.busy=false;S.msg='';if(ktSame(S.g,P.t))S.done=true;draw();},380);});
  document.getElementById('hint').onclick=()=>{const m=ktBest();S.hints++;S.hl=m;S.msg=m?`ヒント：つぎは「${KTM[m][1]}」をおそう（光っているボタン）。`:'';S.msgc='';draw();};
  document.getElementById('reset').onclick=()=>{S.g=P.g.slice();S.moves=0;S.msg='';S.hl=null;draw();};
}
function draw(){ if(P.kind==='turn')drawTurn(); else drawPick(); }

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
