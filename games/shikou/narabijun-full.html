<script>
(function(){
const PAID=true;
let QS=[];
const ID='narabijun';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>ならび順推理 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* ならび順推理：p={names:[動物], clues:[[種類,A,(B|k),(k)]...], ans:[前からの答え]}
   ヒントの種類 pos(k番目) npos(k番目ではない) jf(すぐ前) fr(より前) adj(となり) nadj(となりではない) gap(間にkひき) end(はし) nend(はしではない)。kは0始まり。 */
const HINTWORD='ヒントやまちがい';
const LVD={1:'3びき・ヒント2つ',2:'4ひき・「より前」',3:'4ひき・「となり」「ではない」',4:'5ひき・「間に○ひき」',5:'6ぴき・むずかしいヒント'};
const RULES=`<ol class="rules">
  <li>動物たちが<b>1列</b>にならんでいます。左が<b>いちばん前</b>（1番目）です。</li>
  <li>下の<b>ヒント</b>を全部まもる、ならび順を考えよう。答えは1つだけです。</li>
  <li>動物を<b>タップ</b>すると、前から順にあいている場所に入ります。<b>ドラッグ</b>すると好きな場所に入れたり、入れかえたりできます。列の動物をタップすると、下にもどります。</li>
  <li>「<b>すぐ前</b>」は1つ前のとなり。「<b>より前</b>」は、前ならはなれていてもよい。「<b>間に1ぴき</b>」は、2ひきの間にちょうど1ぴきいることです。</li>
  <li>全部ならべたら「こたえあわせ」。ヒントボタンを使うと、1ぴきが正しい場所に入ります（星がへります）。</li></ol>`;
const AC={'うさぎ':'#f9a8d4','ねこ':'#fb923c','いぬ':'#c08457','くま':'#8b5e3c','ぶた':'#f9b4c4','ひよこ':'#facc15'};
function face(a,cx,cy,s){const c=AC[a],k='#2a2520',r=s*0.36;let o='';
  if(a==='うさぎ')o+=`<ellipse cx="${cx-r*0.45}" cy="${cy-r*1.25}" rx="${r*0.24}" ry="${r*0.62}" fill="#fff" stroke="${k}" stroke-width="1.5"/><ellipse cx="${cx+r*0.45}" cy="${cy-r*1.25}" rx="${r*0.24}" ry="${r*0.62}" fill="#fff" stroke="${k}" stroke-width="1.5"/><ellipse cx="${cx-r*0.45}" cy="${cy-r*1.22}" rx="${r*0.1}" ry="${r*0.42}" fill="${c}"/><ellipse cx="${cx+r*0.45}" cy="${cy-r*1.22}" rx="${r*0.1}" ry="${r*0.42}" fill="${c}"/>`;
  if(a==='ねこ')o+=`<polygon points="${cx-r*0.95},${cy-r*0.3} ${cx-r*0.75},${cy-r*1.2} ${cx-r*0.2},${cy-r*0.85}" fill="${c}" stroke="${k}" stroke-width="1.5"/><polygon points="${cx+r*0.95},${cy-r*0.3} ${cx+r*0.75},${cy-r*1.2} ${cx+r*0.2},${cy-r*0.85}" fill="${c}" stroke="${k}" stroke-width="1.5"/>`;
  if(a==='くま')o+=`<circle cx="${cx-r*0.75}" cy="${cy-r*0.75}" r="${r*0.33}" fill="${c}" stroke="${k}" stroke-width="1.5"/><circle cx="${cx+r*0.75}" cy="${cy-r*0.75}" r="${r*0.33}" fill="${c}" stroke="${k}" stroke-width="1.5"/>`;
  if(a==='ぶた')o+=`<polygon points="${cx-r*0.85},${cy-r*0.45} ${cx-r*0.7},${cy-r*1.1} ${cx-r*0.25},${cy-r*0.9}" fill="${c}" stroke="${k}" stroke-width="1.5"/><polygon points="${cx+r*0.85},${cy-r*0.45} ${cx+r*0.7},${cy-r*1.1} ${cx+r*0.25},${cy-r*0.9}" fill="${c}" stroke="${k}" stroke-width="1.5"/>`;
  if(a==='ひよこ')o+=`<path d="M${cx-r*0.1},${cy-r*0.95} q${r*0.1},${-r*0.45} ${r*0.3},${-r*0.25} M${cx+r*0.05},${cy-r*0.98} q${r*0.25},${-r*0.35} ${r*0.4},${-r*0.05}" fill="none" stroke="${k}" stroke-width="1.5"/>`;
  o+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${a==='うさぎ'?'#fff':c}" stroke="${k}" stroke-width="1.6"/>`;
  if(a==='いぬ')o+=`<ellipse cx="${cx-r*0.92}" cy="${cy-r*0.05}" rx="${r*0.28}" ry="${r*0.55}" fill="#7c4a26" stroke="${k}" stroke-width="1.5" transform="rotate(18 ${cx-r*0.92} ${cy})"/><ellipse cx="${cx+r*0.92}" cy="${cy-r*0.05}" rx="${r*0.28}" ry="${r*0.55}" fill="#7c4a26" stroke="${k}" stroke-width="1.5" transform="rotate(-18 ${cx+r*0.92} ${cy})"/><ellipse cx="${cx}" cy="${cy+r*0.35}" rx="${r*0.42}" ry="${r*0.3}" fill="#f1dcc4"/>`;
  if(a==='くま')o+=`<ellipse cx="${cx}" cy="${cy+r*0.35}" rx="${r*0.4}" ry="${r*0.3}" fill="#d8b892"/>`;
  o+=`<circle cx="${cx-r*0.36}" cy="${cy-r*0.12}" r="${r*0.11}" fill="${k}"/><circle cx="${cx+r*0.36}" cy="${cy-r*0.12}" r="${r*0.11}" fill="${k}"/>`;
  if(a==='ぶた')o+=`<ellipse cx="${cx}" cy="${cy+r*0.35}" rx="${r*0.34}" ry="${r*0.24}" fill="#f48fb1" stroke="${k}" stroke-width="1.2"/><circle cx="${cx-r*0.12}" cy="${cy+r*0.35}" r="${r*0.06}" fill="${k}"/><circle cx="${cx+r*0.12}" cy="${cy+r*0.35}" r="${r*0.06}" fill="${k}"/>`;
  else if(a==='ひよこ')o+=`<polygon points="${cx-r*0.18},${cy+r*0.15} ${cx+r*0.18},${cy+r*0.15} ${cx},${cy+r*0.42}" fill="#ea580c"/>`;
  else o+=`<ellipse cx="${cx}" cy="${cy+r*0.22}" rx="${r*0.11}" ry="${r*0.08}" fill="${k}"/><path d="M${cx-r*0.2},${cy+r*0.42} q${r*0.2},${r*0.16} ${r*0.2},${-r*0.1} q0,${r*0.26} ${r*0.2},${r*0.1}" fill="none" stroke="${k}" stroke-width="1.3"/>`;
  if(a==='ねこ')o+=`<path d="M${cx-r*0.4},${cy+r*0.25}h${-r*0.5}M${cx-r*0.4},${cy+r*0.4}l${-r*0.48},${r*0.12}M${cx+r*0.4},${cy+r*0.25}h${r*0.5}M${cx+r*0.4},${cy+r*0.4}l${r*0.48},${r*0.12}" stroke="${k}" stroke-width="1.1"/>`;
  if(a==='うさぎ')o+=`<circle cx="${cx-r*0.55}" cy="${cy+r*0.2}" r="${r*0.13}" fill="#f9a8d4" opacity=".8"/><circle cx="${cx+r*0.55}" cy="${cy+r*0.2}" r="${r*0.13}" fill="#f9a8d4" opacity=".8"/>`;
  return o;}
const nm=a=>`<b class="nj-n" style="background:${AC[a]}55">${a}</b>`;
const ord=(k,n)=>k===0?'いちばん前':k===n-1?'いちばん後ろ':`前から${k+1}番目`;
function clueText(c,n){const [t,a,b,k]=c;
  if(t==='pos')return `${nm(a)}は ${ord(b,n)}。`;
  if(t==='npos')return `${nm(a)}は ${ord(b,n)}では ない。`;
  if(t==='jf')return `${nm(a)}は ${nm(b)}の <b>すぐ前</b>。`;
  if(t==='fr')return `${nm(a)}は ${nm(b)}より 前に いる。`;
  if(t==='adj')return `${nm(a)}と ${nm(b)}は となりどうし。`;
  if(t==='nadj')return `${nm(a)}と ${nm(b)}は となりでは ない。`;
  if(t==='gap')return `${nm(a)}と ${nm(b)}の 間に ${k}ひき いる。`;
  if(t==='end')return `${nm(a)}は 列の はし（いちばん前か いちばん後ろ）。`;
  if(t==='nend')return `${nm(a)}は 列の はしでは ない。`;}
function holds(c,pos,n){const [t,a,b,k]=c;
  if(t==='pos')return pos[a]===b; if(t==='npos')return pos[a]!==b;
  if(t==='jf')return pos[a]===pos[b]-1; if(t==='fr')return pos[a]<pos[b];
  if(t==='adj')return Math.abs(pos[a]-pos[b])===1; if(t==='nadj')return Math.abs(pos[a]-pos[b])!==1;
  if(t==='gap')return Math.abs(pos[a]-pos[b])===k+1;
  if(t==='end')return pos[a]===0||pos[a]===n-1; if(t==='nend')return pos[a]!==0&&pos[a]!==n-1;}
function perms(a){if(a.length<2)return [a.slice()];const o=[];a.forEach((x,i)=>{perms(a.slice(0,i).concat(a.slice(i+1))).forEach(r=>o.push([x,...r]));});return o;}
const TW=64;
function startStage(p){P=p;S={hints:0,done:false,msg:'',line:Array(p.names.length).fill(null),fixed:[],bad:null,drag:null};begin(p);draw();}
const slotX=i=>4+i*TW, poolX=i=>4+i*TW;
function tokenPos(a){const i=S.line.indexOf(a);if(i>=0)return [slotX(i)+TW/2,66];return [poolX(P.names.indexOf(a))+TW/2,182];}
function boardSVG(){
  const n=P.names.length,W=n*TW+8;let s='';
  s+=`<text x="6" y="14" font-size="15" fill="#7c3aed" font-weight="700">◀ 前</text><text x="${W-6}" y="14" font-size="15" fill="#6a625a" text-anchor="end">後ろ</text>`;
  for(let i=0;i<n;i++){const x=slotX(i);
    s+=`<rect class="nj-slot" data-s="${i}" x="${x+3}" y="22" width="${TW-6}" height="92" rx="9" fill="${S.fixed.includes(i)?'#ede4fd':'#fffdf7'}" stroke="#c9bfae" stroke-width="2" stroke-dasharray="${S.line[i]?'0':'5 4'}"/>`;
    s+=`<text x="${x+TW/2}" y="${132}" text-anchor="middle" font-size="15" fill="#3b2f6b" font-weight="700">${i+1}番目</text>`;}
  s+=`<rect x="2" y="142" width="${W-4}" height="${86}" rx="10" fill="#f2efe8"/>`;
  if(S.line.every(x=>x))s+=`<text x="${W/2}" y="190" text-anchor="middle" font-size="13" fill="#6a625a">全部ならびました</text>`;
  P.names.forEach(a=>{const [cx,cy]=tokenPos(a),fx=S.fixed.includes(S.line.indexOf(a));
    s+=`<g class="nj-tok" data-a="${a}" style="cursor:${fx?'default':'grab'}" transform="translate(0,0)"><rect x="${cx-TW/2+5}" y="${cy-40}" width="${TW-10}" height="80" rx="8" fill="transparent"/>${face(a,cx,cy-6,TW-4)}<text x="${cx}" y="${cy+34}" text-anchor="middle" font-size="14" font-weight="700" fill="#2a2520">${a}</text>${fx?`<text x="${cx+TW/2-12}" y="${cy-28}" font-size="12" fill="#7c3aed">●</text>`:''}</g>`;});
  return `<svg id="bd" viewBox="0 0 ${W} 232" style="max-width:${Math.min(W*1.25,460)}px" role="img" aria-label="ならび順の列">${s}</svg>`;
}
function cluesHTML(){const n=P.names.length,pos={};S.line.forEach((a,i)=>{if(a)pos[a]=i;});
  return `<ol class="nj-cl">${P.clues.map((c,i)=>{let m='';if(S.bad){m=S.bad.includes(i)?'<span class="nj-x">×</span>':'<span class="nj-o">○</span>';}
    return `<li class="${S.bad&&S.bad.includes(i)?'bad':''}">${clueText(c,n)}${m}</li>`;}).join('')}</ol>`;}
function draw(){
  const full=S.line.every(x=>x);
  app.innerHTML=`${topBar()}
    <div class="label">ヒント</div>${cluesHTML()}
    <div class="boardw">${boardSVG()}</div>
    ${S.done?'':`<p class="msg ${S.msgc||''}" id="msg">${S.msg||'動物をタップかドラッグして、列にならべよう。'}</p>
    <div class="row nj-row"><button class="btn go" id="chk" ${full?'':'disabled'}>こたえあわせ</button><button class="btn" id="hint">ヒント</button><button class="btn" id="clr">やりなおす</button></div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(explain());return;}
  bindBoard();
  document.getElementById('chk').onclick=check;
  document.getElementById('hint').onclick=hint;
  document.getElementById('clr').onclick=()=>{S.line=S.line.map((a,i)=>S.fixed.includes(i)?a:null);S.bad=null;S.msg='';draw();};
}
function place(a,i){ /* a を i番目へ。そこにいた動物は a のいた場所へ */
  if(S.fixed.includes(i))return false;const from=S.line.indexOf(a);if(from>=0&&S.fixed.includes(from))return false;
  const other=S.line[i];if(from>=0)S.line[from]=other;else if(other)S.line[S.line.indexOf(other)]=null;
  S.line[i]=a;return true;}
function bindBoard(){
  const svg=document.getElementById('bd');
  const pt=e=>{const m=svg.getScreenCTM().inverse();const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(m);return [q.x,q.y];};
  svg.querySelectorAll('.nj-tok').forEach(g=>g.addEventListener('pointerdown',e=>{const a=g.dataset.a;
    if(S.fixed.includes(S.line.indexOf(a)))return;e.preventDefault();
    S.drag={a,g,p0:pt(e),moved:false};g.setPointerCapture(e.pointerId);g.parentNode.appendChild(g);}));
  svg.addEventListener('pointermove',e=>{const d=S.drag;if(!d)return;const [x,y]=pt(e);const dx=x-d.p0[0],dy=y-d.p0[1];
    if(Math.hypot(dx,dy)>6)d.moved=true;if(d.moved)d.g.setAttribute('transform',`translate(${dx},${dy})`);});
  const up=e=>{const d=S.drag;if(!d)return;S.drag=null;const a=d.a;S.bad=null;S.msg='';S.msgc='';
    if(!d.moved){const i=S.line.indexOf(a);if(i>=0)S.line[i]=null;else{const j=S.line.findIndex((x,k)=>!x&&!S.fixed.includes(k));if(j>=0)S.line[j]=a;}draw();return;}
    const [x,y]=pt(e);const n=P.names.length;
    if(y<138){const i=Math.max(0,Math.min(n-1,Math.floor((x-4)/TW)));place(a,i);}
    else{const i=S.line.indexOf(a);if(i>=0)S.line[i]=null;}
    draw();};
  svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
}
function check(){const n=P.names.length,pos={};S.line.forEach((a,i)=>pos[a]=i);
  const bad=P.clues.map((c,i)=>holds(c,pos,n)?-1:i).filter(i=>i>=0);
  if(!bad.length){S.done=true;draw();return;}
  S.bad=bad;S.hints++;S.msg=`×のヒントに合っていません（${bad.length}つ）。ならびを見なおそう。`;S.msgc='ng';draw();}
function hint(){const n=P.names.length;
  const cand=[];P.clues.forEach(c=>{if(c[0]==='pos'||c[0]==='end')cand.push(c[1]);});P.clues.forEach(c=>{if(c[0]==='jf')cand.push(c[1],c[2]);});P.ans.forEach(a=>cand.push(a));
  const a=cand.find(x=>!S.fixed.includes(P.ans.indexOf(x)));if(!a)return;const i=P.ans.indexOf(a);
  const cur=S.line.indexOf(a),other=S.line[i];if(cur>=0)S.line[cur]=other||null;S.line[i]=a;
  S.fixed.push(i);S.hints++;S.bad=null;S.msg=`ヒント：${a}は ${ord(i,n)}です（●がついた動物は動きません）。`;S.msgc='';draw();}
function explain(){const n=P.names.length;let all=perms(P.names);const steps=[all.length];
  const cl=P.clues.slice().map(c=>[c,0]);
  /* ヒントを、ならび方をたくさん消せる順に使う */
  let rest=cl.map(x=>x[0]);const used=[];
  while(rest.length){let best=null,bl=null;rest.forEach(c=>{const l=all.filter(pm=>{const pos={};pm.forEach((a,i)=>pos[a]=i);return holds(c,pos,n);});if(!bl||l.length<bl.length){best=c;bl=l;}});
    all=bl;used.push(best);steps.push(all.length);rest=rest.filter(c=>c!==best);}
  return `<p style="margin:0">前から <b>${P.ans.join(' → ')}</b> の順です。</p>
    <p class="note" style="font-size:14px">${n}ひきのならび方は、全部で${steps[0]}通り。ヒントを1つ使うたびに、ありえるならび方は <b>${steps.join(' → ')}</b> 通りとへって、最後に1通りだけのこりました。${n>=5?'「いちばん前」「すぐ前」のような、場所がしぼれるヒントから考えるのがコツです。':''}</p>`;}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
