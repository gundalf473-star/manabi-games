<title>カード当て推理 100問</title>
<meta name="game:paid" content="利用コード">
<meta name="game:subject" content="思考力">
<meta name="game:unit" content="論理・推理">
<meta name="game:grade" content="小2〜">
<meta name="game:players" content="1人">
<meta name="description" content="カード当て推理の有料版。3人・カード1〜3から、4人でカードがあまる問題、かけ算や3人の和の話まで、5つのレベルに20問ずつ、全100問。どの問題も、すべての持ち方を調べて、答えが1通りに決まり、話にむだがないことを確かめています。">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Old+Mincho:wght@700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: 1列。上に盤、下に操作。紫を差し色に（思考力シリーズ） */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --fg:#2a2520; --muted:#6a625a; --rule:#ddd6cb;
  --ink:#3b2f6b; --seal:#7c3aed; --sealsoft:#ede4fd; --ok:#1d7a4c; --oksoft:#e0f0e6; --ng:#c8352d; --ngsoft:#f8e3e1; --gold:#a97c12; --pick:#efeae1;
  --display:"Dela Gothic One","Hiragino Kaku Gothic StdN",sans-serif;
  --mincho:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15130f; --surface:#1e1b17; --fg:#ece6dc; --muted:#a59c90; --rule:#34302a;
  --ink:#b3a6f0; --seal:#b79cff; --sealsoft:#271c40; --ok:#4cc184; --oksoft:#1b3326; --ng:#f07468; --ngsoft:#3a2220; --gold:#e1b44a; --pick:#28241e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15130f; --surface:#1e1b17; --fg:#ece6dc; --muted:#a59c90; --rule:#34302a;
  --ink:#b3a6f0; --seal:#b79cff; --sealsoft:#271c40; --ok:#4cc184; --oksoft:#1b3326; --ng:#f07468; --ngsoft:#3a2220; --gold:#e1b44a; --pick:#28241e; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 64px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,7.5vw,40px);line-height:1.15;margin:0;color:var(--ink)}
h1 small{display:block;font-family:var(--mincho);font-size:15px;color:var(--seal);letter-spacing:.3em;margin-bottom:4px}
.lead{margin:4px 0 0;color:var(--muted);font-size:14px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px}
.label{font-size:12px;font-weight:700;color:var(--seal);letter-spacing:.1em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--pick)}
.btn.go{background:var(--fg);color:var(--surface)}
.btn.on{background:var(--seal);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.note{font-size:13px;color:var(--muted);margin:0}
.rules{margin:0;padding-left:1.3em;font-size:15px}
.rules li{margin:2px 0}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;color:var(--ink);border:1px solid var(--ink);border-radius:4px;padding:0 6px;white-space:nowrap}
.back{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;padding:0;margin-left:auto}
.boardw{display:flex;justify-content:center;background:#fbfaf6;border:1px solid var(--rule);border-radius:10px;padding:8px}
.boardw svg{width:100%;height:auto;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.msg{font-size:14px;min-height:1.6em;margin:0;color:var(--muted)}
.msg.ok{color:var(--ok);font-weight:700} .msg.ng{color:var(--ng);font-weight:700}
.clear{border:2px solid var(--ok);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--oksoft)}
.clear .v{font-family:var(--display);font-size:24px;color:var(--ok)}
.stars{color:var(--gold);font-size:24px;letter-spacing:2px}
.stars .off{opacity:.25}
.lvtabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lvtabs button{border:2px solid var(--rule);background:var(--surface);border-radius:8px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.lvtabs button b{font-size:15px}
.lvtabs button small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.lvtabs button.cur{border-color:var(--seal);background:var(--sealsoft)}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stg{border:2px solid var(--rule);background:var(--surface);border-radius:8px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.stg b{font-size:17px;font-variant-numeric:tabular-nums}
.stg small{font-size:11px;color:var(--gold);letter-spacing:1px;min-height:1.2em}
.stg.done{border-color:var(--ok)}
.freelist{display:grid;gap:8px}
.freelist .stg{flex-direction:row;justify-content:space-between;padding:10px 14px;text-align:left}
.freelist .stg span{font-weight:700}
.sum{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
.sum .big{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums}
.sum .big small{font-size:14px;font-family:var(--body);color:var(--muted)}
.paid{display:flex;flex-direction:column;gap:2px;border:2px solid var(--seal);border-radius:8px;padding:12px 14px;text-decoration:none;color:var(--fg);background:var(--sealsoft)}
.paid .pt{font-size:15px} .paid .pt b{font-family:var(--display);font-weight:400;color:var(--seal)}
.paid .pd{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.pad{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pad button{min-width:48px;min-height:50px;border:1px solid var(--rule);background:var(--pick);border-radius:10px;font-size:21px;font-weight:700;cursor:pointer;touch-action:manipulation}
.pad button.er{font-size:15px;min-width:60px}
.qq{margin:0;font-size:17px;font-weight:700;line-height:1.7}
.opts4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opts4.txt{grid-template-columns:1fr 1fr}
.ob{border:2px solid var(--rule);background:var(--surface);border-radius:10px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px;justify-content:center}
.ob .k{align-self:flex-start;font-size:12px;font-weight:700;width:22px;height:22px;border-radius:50%;background:var(--pick);display:grid;place-items:center}
.ob:hover:not(:disabled){border-color:var(--ink)}
.ob.right{border-color:var(--ok);background:var(--oksoft)} .ob.wrong{border-color:var(--ng);background:var(--ngsoft);opacity:.6}
.ob:disabled{cursor:default}
.views{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;align-items:flex-end}
.views figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.scales{display:flex;flex-direction:column;gap:2px;align-items:center;width:100%}
.hintbox{margin:0;font-size:14px;background:var(--sealsoft);border-radius:8px;padding:8px 12px}
.prog{min-height:52px;border:2px dashed var(--rule);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;background:#fbfaf6}
.prog .ph{color:var(--muted);font-size:13px}
.palette{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ccard,.pcard{border:2px solid #93c5fd;background:#eff6ff;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:#1e3a8a}
.pcard{align-self:flex-start;padding:3px 10px}
.ccard.loop,.pcard.loop{border-color:#fbbf24;background:#fffbeb;color:#92400e}
.ccard span,.pcard span{font-size:18px}
.ccard:disabled,.pcard:disabled{opacity:.45;cursor:default}
.cdlab{font-size:12px;font-weight:700;color:var(--seal);letter-spacing:.05em;margin-bottom:-8px}
.cdclues{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.cdclues li{font-size:16px;line-height:1.55;font-weight:700;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:6px 8px;display:flex;gap:6px;align-items:flex-start}
.cdclues li b{color:var(--seal);flex:none}
.cdclues li svg{flex:none;margin-top:-2px}
.cdclues li span{word-break:keep-all;overflow-wrap:anywhere}
.cdclues li small{display:block;font-size:11px;color:var(--muted);font-weight:700;line-height:1.2}
.cdclues li.bad{border-color:var(--ng);background:var(--ngsoft)}
.cdkids{display:grid;gap:6px;background:#fbfaf6;border:1px solid var(--rule);border-radius:10px;padding:10px 6px}
.cdkids.n3{grid-template-columns:repeat(3,1fr)} .cdkids.n4{grid-template-columns:repeat(4,1fr)}
.cdkid{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;color:#2a2520}
.cdslot{width:58px;height:74px;border-radius:10px;border:2px solid #b9a88f;background:#f3e9d8;display:grid;place-items:center;margin-top:4px}
.cdslot.empty{border-style:dashed;cursor:pointer}
.cdslot.empty span{font-size:26px;font-weight:700;color:#c9b9a0}
.cdslot.over{border-color:var(--seal);box-shadow:0 0 0 4px var(--sealsoft)}
.cdtray{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;min-height:84px;border:2px dashed var(--rule);border-radius:10px;padding:8px}
.cdcard{width:50px;height:66px;border-radius:8px;border:2px solid #3b2f6b;background:#fff;color:#3b2f6b;font-family:var(--display);font-size:30px;line-height:1;display:grid;place-items:center;cursor:grab;touch-action:none;padding:0;box-shadow:0 2px 0 #c4b5fd}
.cdcard.sel{border-color:var(--seal);background:#ede4fd;box-shadow:0 0 0 4px var(--sealsoft)}
.cdcard.lock{cursor:default;border-color:var(--ok);color:var(--ok);box-shadow:none}
.cdcard.ghost{position:fixed;z-index:50;transform:translate(-50%,-50%);pointer-events:none;opacity:.92;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.cdmemo summary{cursor:pointer;font-weight:700;font-size:14px}
.cdmscroll{overflow-x:auto;margin-top:8px}
.cdmt{border-collapse:collapse;margin:0 auto;background:var(--surface)}
.cdmt th{font-size:14px;padding:2px 4px;border:1px solid var(--rule);background:var(--pick)}
.cdmt td{border:1px solid var(--rule);padding:0}
.cdmn{display:flex;align-items:center;gap:2px;font-size:12px!important;white-space:nowrap;border:0!important}
.cdm{width:40px;height:38px;border:0;background:var(--surface);font-size:22px;font-weight:700;cursor:pointer;padding:0;touch-action:manipulation}
.cdm.m1{color:#6a625a}.cdm.m2{color:var(--ng)}
.cdsteps{margin:6px 0 0;padding-left:1.4em;font-size:14px}
</style>

<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>カード当て推理 100問</h1>
    <p class="lead">だれが どの数字のカードを持っている？ どうぶつたちの話から、カードを当てよう。5つのレベルに20問ずつ。ヒントやまちがいなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=true;
let QS=[];
const ID='cardate';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>カード当て推理 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* カード当て推理：p={n,names,cards:[場のカード],clues:[{t,x,y,z,k,sp,txt}],sol:[人ごとの数],steps:[[話…],人,数,単独で決まるか]} */
const HINTWORD='ヒントやまちがい';
const LVD={1:'3人・カード1〜3',2:'3人・たし算やちがい',3:'4人・カード4まい',4:'4人・1まいあまる',5:'4人・かけ算や3人の和も'};
const RULES=`<ol class="rules">
  <li>どうぶつたちが、数字のカードを<b>1まいずつ</b>持っています。みんな<b>ほんとうのこと</b>を言っています。</li>
  <li>話を読んで、カードを<b>どうぶつの下までドラッグ</b>しよう（カードをタップしてから、置きたい場所をタップしてもOK）。</li>
  <li><b>奇数</b>は 1・3・5・7・9 のように2でわり切れない数、<b>偶数</b>は 2・4・6・8 のように2でわり切れる数です。</li>
  <li>レベル4からは、カードが<b>あまります</b>。あまったカードは、だれも持っていません。</li>
  <li>全員にカードをわたしたら「答え合わせ」。持ち方は1通りに決まります。</li></ol>`;
const CDC={'くま':['#b07a4a','#7a4f2a'],'うさぎ':['#ffffff','#f5b8c8'],'ねこ':['#d6d0c8','#7d756b'],'きつね':['#f0953a','#ffffff']};
function cdFace(nm,sz){
  const [a,b]=CDC[nm]||['#ddd','#999'];let e='',f='';
  if(nm==='うさぎ')e=`<ellipse cx="17" cy="11" rx="5" ry="12" fill="${a}" stroke="#8a7a70" stroke-width="1.5"/><ellipse cx="31" cy="11" rx="5" ry="12" fill="${a}" stroke="#8a7a70" stroke-width="1.5"/><ellipse cx="17" cy="12" rx="2" ry="7" fill="${b}"/><ellipse cx="31" cy="12" rx="2" ry="7" fill="${b}"/>`;
  if(nm==='くま')e=`<circle cx="12" cy="17" r="7" fill="${a}" stroke="${b}" stroke-width="1.5"/><circle cx="36" cy="17" r="7" fill="${a}" stroke="${b}" stroke-width="1.5"/><circle cx="12" cy="17" r="3" fill="${b}"/><circle cx="36" cy="17" r="3" fill="${b}"/>`;
  if(nm==='ねこ'||nm==='きつね')e=`<polygon points="9,7 12,28 23,20" fill="${a}" stroke="#6a5a4a" stroke-width="1.5"/><polygon points="39,7 36,28 25,20" fill="${a}" stroke="#6a5a4a" stroke-width="1.5"/>`;
  f=`<circle cx="24" cy="30" r="15" fill="${a}" stroke="#6a5a4a" stroke-width="1.5"/>`;
  if(nm==='きつね')f+=`<ellipse cx="24" cy="37" rx="9" ry="7" fill="${b}"/>`;
  if(nm==='くま')f+=`<ellipse cx="24" cy="36" rx="7" ry="5" fill="#e3c49e"/>`;
  if(nm==='ねこ')f+=`<path d="M8,33 L17,34 M8,37 L17,36 M40,33 L31,34 M40,37 L31,36" stroke="#6a5a4a" stroke-width="1.2"/>`;
  f+=`<circle cx="18" cy="28" r="2" fill="#2a2520"/><circle cx="30" cy="28" r="2" fill="#2a2520"/><circle cx="24" cy="34" r="2" fill="#2a2520"/>`;
  return `<svg viewBox="0 0 48 48" width="${sz}" height="${sz}" aria-hidden="true">${e}${f}</svg>`;
}
const CN='①②③④⑤⑥⑦⑧';
function startStage(p){P=p;S={a:Array(p.n).fill(null),lock:{},sel:null,hints:0,done:false,msg:'',msgc:'',bad:[],memo:{},memoOpen:false};begin(p);draw();}
const holder=v=>S.a.indexOf(v);
function card(v,inSlot){
  return `<button class="cdcard ${S.sel===v?'sel':''} ${S.lock[v]?'lock':''} ${inSlot?'in':''}" data-v="${v}" aria-label="${v}のカード">${v}</button>`;
}
function memoHTML(){
  const cell=(x,v)=>{const m=S.memo[x+'-'+v]||0;return `<td><button class="cdm m${m}" data-mx="${x}" data-mv="${v}" aria-label="${esc(P.names[x])}と${v}">${['','×','○'][m]}</button></td>`;};
  return `<details class="cdmemo" id="memo" ${S.memoOpen?'open':''}><summary>メモ表（タップで ×→○→空白）</summary>
    <div class="cdmscroll"><table class="cdmt"><tr><th></th>${P.cards.map(v=>`<th>${v}</th>`).join('')}</tr>
    ${P.names.map((nm,x)=>`<tr><th class="cdmn">${cdFace(nm,22)}${esc(nm)}</th>${P.cards.map(v=>cell(x,v)).join('')}</tr>`).join('')}</table></div>
    <p class="note">メモ表は答え合わせには使いません。考えるための表です。</p></details>`;
}
function draw(){
  const all=S.a.every(v=>v!=null), extra=P.cards.length-P.n;
  const kids=P.names.map((nm,x)=>`<div class="cdkid"><div class="cdface">${cdFace(nm,P.n===4?50:58)}</div><b>${esc(nm)}</b>
     <div class="cdslot ${S.a[x]==null?'empty':''}" data-x="${x}">${S.a[x]!=null?card(S.a[x],true):'<span>?</span>'}</div></div>`).join('');
  const tray=P.cards.filter(v=>holder(v)<0);
  app.innerHTML=`${topBar()}
    <p class="note" style="margin:0">みんな <b>ほんとうのこと</b>を言っています。カードは ${P.cards.join('・')} の${P.cards.length}まい${extra?`で、<b>${extra}まい あまります</b>`:''}。</p>
    <div class="cdlab">みんなの話</div>
    <ol class="cdclues">${P.clues.map((c,i)=>`<li class="${S.bad.includes(i)?'bad':''}"><b>${CN[i]}</b>${cdFace(P.names[c.sp],30)}<span><small>${esc(P.names[c.sp])}</small>「${esc(c.txt)}」</span></li>`).join('')}</ol>
    <div class="cdkids n${P.n}">${kids}</div>
    ${S.done?'':`<div class="cdtray" id="tray">${tray.length?tray.map(v=>card(v,false)).join(''):''}${extra&&all?'<span class="note">← あまったカード</span>':''}${!tray.length?'<span class="note">カードを全部わたしました。</span>':''}</div>
    <p class="msg ${S.msgc}" id="msg">${S.msg||'カードを どうぶつの下の「？」までドラッグしよう。'}</p>
    <div class="row"><button class="btn go" id="chk" ${all?'':'disabled'}>答え合わせ</button><button class="btn" id="hint">ヒント</button><button class="btn" id="clr">やりなおす</button></div>
    ${memoHTML()}`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(explain());return;}
  bindDrag();
  document.getElementById('chk').onclick=check;
  document.getElementById('hint').onclick=hint;
  document.getElementById('clr').onclick=()=>{S.a=S.a.map(v=>v!=null&&S.lock[v]?v:null);S.sel=null;S.bad=[];S.msg='';S.msgc='';draw();};
  const md=document.getElementById('memo');md.addEventListener('toggle',()=>{S.memoOpen=md.open;});
  app.querySelectorAll('.cdm').forEach(b=>b.onclick=()=>{const k=b.dataset.mx+'-'+b.dataset.mv;S.memo[k]=((S.memo[k]||0)+1)%3;b.className='cdm m'+S.memo[k];b.textContent=['','×','○'][S.memo[k]];});
}
function place(v,x){
  if(S.lock[v])return;
  const h=holder(v);
  if(x==null){if(h>=0)S.a[h]=null;}
  else{if(h===x)return;const o=S.a[x];if(o!=null&&S.lock[o])return;
    if(h>=0)S.a[h]=o; S.a[x]=v;}
  S.sel=null;S.bad=[];if(S.msgc==='ng'){S.msg='';S.msgc='';}draw();
}
function bindDrag(){
  let drag=null;
  app.querySelectorAll('.cdcard').forEach(b=>{
    b.addEventListener('pointerdown',ev=>{const v=+b.dataset.v;if(S.lock[v])return;
      drag={v,sx:ev.clientX,sy:ev.clientY,ghost:null,el:b};b.setPointerCapture(ev.pointerId);});
    b.addEventListener('pointermove',ev=>{if(!drag||drag.el!==b)return;
      if(!drag.ghost&&Math.hypot(ev.clientX-drag.sx,ev.clientY-drag.sy)>6){
        const g=b.cloneNode(true);g.classList.add('ghost');document.body.appendChild(g);drag.ghost=g;b.style.opacity='.35';}
      if(drag.ghost){drag.ghost.style.left=ev.clientX+'px';drag.ghost.style.top=ev.clientY+'px';
        app.querySelectorAll('.cdslot').forEach(s=>s.classList.remove('over'));
        const t=hitSlot(ev.clientX,ev.clientY);if(t)t.classList.add('over');}
      ev.preventDefault();});
    const end=ev=>{if(!drag||drag.el!==b)return;const d=drag;drag=null;
      if(d.ghost){d.ghost.remove();const t=hitSlot(ev.clientX,ev.clientY);
        if(t)place(d.v,+t.dataset.x);else if(hitTray(ev.clientX,ev.clientY))place(d.v,null);else draw();}
      else{
        if(S.sel!=null&&S.sel!==d.v&&holder(d.v)>=0){place(S.sel,holder(d.v));return;}
        S.sel=S.sel===d.v?null:d.v;draw();}};
    b.addEventListener('pointerup',end);
    b.addEventListener('pointercancel',()=>{if(drag&&drag.ghost)drag.ghost.remove();drag=null;draw();});
  });
  app.querySelectorAll('.cdslot.empty').forEach(s=>s.addEventListener('click',()=>{if(S.sel!=null)place(S.sel,+s.dataset.x);}));
  const tray=document.getElementById('tray');
  tray.addEventListener('click',ev=>{if(ev.target.closest('.cdcard'))return;if(S.sel!=null&&holder(S.sel)>=0)place(S.sel,null);});
}
function hitSlot(cx,cy){let best=null,bd=1e9;app.querySelectorAll('.cdslot').forEach(s=>{const r=s.getBoundingClientRect();
  const d=Math.hypot(cx-(r.left+r.width/2),cy-(r.top+r.height/2));if(d<Math.max(r.width,r.height)*0.9&&d<bd){bd=d;best=s;}});return best;}
function hitTray(cx,cy){const r=document.getElementById('tray').getBoundingClientRect();return cx>=r.left&&cx<=r.right&&cy>=r.top-10&&cy<=r.bottom+10;}
function evalClue(c,a){
  const t=c.t,g=q=>a[c[q]],rest=P.cards.filter(v=>!a.includes(v));
  switch(t){
    case 'gt':return g('x')>g('y'); case 'odd':return g('x')%2===1; case 'even':return g('x')%2===0;
    case 'sum':return g('x')+g('y')===c.k; case 'diff':return Math.abs(g('x')-g('y'))===c.k; case 'dbl':return g('x')===2*g('y');
    case 'max':return g('x')===Math.max(...a); case 'min':return g('x')===Math.min(...a);
    case 'not':return g('x')!==c.k; case 'is':return g('x')===c.k;
    case 'sum3':return g('x')+g('y')+g('z')===c.k; case 'sumeq':return g('x')+g('y')===g('z'); case 'mul':return g('x')*g('y')===c.k;
    case 'unused':return rest.includes(c.k); case 'restodd':return rest.every(v=>v%2===1); case 'resteven':return rest.every(v=>v%2===0);
    case 'restsum':return rest.reduce((s,v)=>s+v,0)===c.k;}
  return false;
}
function check(){
  const bad=P.clues.map((c,i)=>evalClue(c,S.a)?-1:i).filter(i=>i>=0);
  if(!bad.length){S.done=true;draw();return;}
  S.bad=bad;S.hints++;S.msg=`話 ${bad.map(i=>CN[i]).join('・')} に合っていません。赤い話を見直そう。`;S.msgc='ng';draw();
}
function reason(st,first){const [cs,,,alone]=st;const s=cs.map(i=>CN[i]).join('と');
  if(!cs.length)return 'ここまでに決まったカードから';
  return `話${s}${alone||first?'':'と、ここまでに決まったカード'}から`;}
function hint(){
  const k=P.steps.findIndex(([,x,v])=>S.a[x]!==v);
  if(k<0){S.msg='全員正しいカードです。「答え合わせ」をおそう。';S.msgc='';draw();return;}
  S.a=S.a.map((v,x)=>v!=null&&v!==P.sol[x]?null:v);
  const [,x,v]=P.steps[k];const h=holder(v);if(h>=0)S.a[h]=null;S.a[x]=v;S.lock[v]=1;S.hints++;S.sel=null;S.bad=[];
  S.msg=`ヒント：${reason(P.steps[k],k===0)}、${P.names[x]}のカードは ${v}と決まります。`;S.msgc='';draw();
}
function explain(){
  const lines=P.steps.map((st,k)=>`<li>${reason(st,k===0)}、${P.names[st[1]]}は ${st[2]}。</li>`).join('');
  const rest=P.cards.filter(v=>!P.sol.includes(v));
  return `<p style="margin:0">持ち方は、この1通りだけです。${rest.length?`あまったカードは ${rest.join('と')}。`:''}</p>
  <details><summary style="cursor:pointer;font-weight:700;font-size:14px">決まっていく順番を見る</summary><ol class="cdsteps">${lines}</ol></details>`;
}

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
