<title>お金パズル</title>
<meta name="game:subject" content="思考力">
<meta name="game:unit" content="数のパズル">
<meta name="game:grade" content="小2〜">
<meta name="game:players" content="1人">
<meta name="description" content="1円玉から500円玉、1000円札までのお金をタップして、ちょうどの金がくをはらう数のパズル。いちばん少ない枚数・おつり・はらい方の数え上げも。5つのレベルから1問ずつ、全5問。">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Old+Mincho:wght@700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --ink:#b3a6f0; --seal:#b79cff; --sealsoft:#271c40; --ok:#4cc184; --oksoft:#1b3326; --ng:#f07468; --ngsoft:#3a2220; --gold:#e1b44a; --pick:#28241e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15130f; --surface:#1e1b17; --fg:#ece6dc; --muted:#a59c90; --rule:#34302a;
  --ink:#b3a6f0; --seal:#b79cff; --sealsoft:#271c40; --ok:#4cc184; --oksoft:#1b3326; --ng:#f07468; --ngsoft:#3a2220; --gold:#e1b44a; --pick:#28241e; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 64px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.label{font-size:12px;font-weight:700;color:var(--seal);letter-spacing:.1em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.paid .pd{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.pad{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

.opts4.txt{grid-template-columns:1fr 1fr}
.ob{border:2px solid var(--rule);background:var(--surface);border-radius:10px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px;justify-content:center}
.ob .k{align-self:flex-start;font-size:12px;font-weight:700;width:22px;height:22px;border-radius:50%;background:var(--pick);display:grid;place-items:center}
.ob:hover:not(:disabled){border-color:var(--ink)}
.ob.right{border-color:var(--ok);background:var(--oksoft)} .ob.wrong{border-color:var(--ng);background:var(--ngsoft);opacity:.6}

.views{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;align-items:flex-end}
.views figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.scales{display:flex;flex-direction:column;gap:2px;align-items:center;width:100%}
.hintbox{margin:0;font-size:14px;background:var(--sealsoft);border-radius:8px;padding:8px 12px}
.prog{min-height:52px;border:2px dashed var(--rule);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;background:#fbfaf6}
.prog .ph{color:var(--muted);font-size:13px}
.palette{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ccard,.pcard{border:2px solid #93c5fd;background:#eff6ff;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:#1e3a8a}
.pcard{align-self:flex-start;padding:3px 10px}
.ccard.loop,.pcard.loop{border-color:#fbbf24;background:#fffbeb;color:#92400e}
.ccard span,.pcard span{font-size:18px}
.ccard:disabled,.pcard:disabled{opacity:.45;cursor:default}
.okfig{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;border:1px solid var(--rule);border-radius:10px;padding:10px;background:var(--bg)}
.okfig.col{flex-direction:column;align-items:stretch}
.okrow{display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.okrow small{margin-left:6px;font-weight:700;font-size:13px;color:var(--muted)}
.okone{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted)}
.okx{font-weight:700}
.tagp{border:2px solid var(--ng);color:var(--ng);border-radius:6px 16px 16px 6px;padding:2px 14px;font-weight:700;font-size:20px;background:var(--surface)}
.goal{font-size:16px;text-align:center}
.goal small{display:block;font-size:13px;color:var(--seal);font-weight:700}
.goal b{font-family:var(--display);font-weight:400;font-size:24px;color:var(--ink)}
.tray{border:2px dashed var(--rule);border-radius:12px;padding:8px 10px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.trayh{display:flex;justify-content:space-between;align-items:baseline}
.tot{font-size:15px}.tot b{font-size:22px;font-variant-numeric:tabular-nums}
.coins{display:flex;flex-wrap:wrap;gap:4px;min-height:52px;align-items:center}
.coins .ph{color:var(--muted);font-size:13px}
.cn,.wc{border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.wallet{display:flex;flex-wrap:wrap;gap:10px 12px;justify-content:center}
.wc{border:2px solid var(--rule);background:var(--surface);border-radius:12px;padding:6px 6px 4px;min-width:62px;min-height:66px;justify-content:center}
.wc small{font-size:11px;color:var(--muted);min-height:1em}
.wc:disabled{opacity:.35;cursor:default}
.ans{display:flex;align-items:center;justify-content:center;gap:8px;font-size:22px;font-weight:700}
.ans output{min-width:110px;min-height:46px;border:2px solid var(--ink);border-radius:10px;padding:2px 12px;text-align:center;font-variant-numeric:tabular-nums;background:var(--bg)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px;margin:0 auto;width:100%}
.keys button{border:1px solid var(--rule);background:var(--pick);border-radius:10px;min-height:50px;font-size:21px;font-weight:700;cursor:pointer;touch-action:manipulation}
.keys button.go{background:var(--fg);color:var(--surface);font-size:17px}
.ex{font-size:15px;border-left:4px solid var(--ok);padding:2px 0 2px 12px;background:var(--surface);border-radius:4px}
@media (max-width:420px){#app.box{padding:12px}}
</style>

<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>お金パズル</h1>
    <p class="lead">お金をタップして、ぴったりはらおう。いちばん少ない枚数や、はらい方が何通りあるかも考えよう。5つのレベルから1問ずつ。ヒントやまちがいなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=false;
let QS=[{"id":"1-01","kind":"pay","mode":"pay","N":12,"use":[10,1],"cnt":null,"fewest":false,"min":3,"sol":[10,1,1],"q":"\u003cb>12円\u003c/b>を、ぴったりはらおう。下のお金をタップして、おさらにのせてね。","hint":"12円は、10円が1つと、あと2円。まず10円玉を1枚のせよう。","ex":"たとえば 10円玉1枚、1円玉2枚 で、12円になります。（ほかののせ方でも、12円ならせいかい）","lv":1},{"id":"2-01","kind":"pay","mode":"pay","N":87,"use":[500,100,50,10,5,1],"cnt":null,"fewest":true,"min":7,"sol":[50,10,10,10,5,1,1],"q":"\u003cb>87円\u003c/b>を、\u003cb>いちばん少ない枚数\u003c/b>でぴったりはらおう。","hint":"大きいお金から順に考えよう。使える500円玉は何枚？　つぎに100円玉は何枚？…と進めます。","ex":"50円玉1枚、10円玉3枚、5円玉1枚、1円玉2枚の、全部で7枚がいちばん少ない枚数です。大きいお金から順に使うと少なくなります。","lv":2},{"id":"3-01","kind":"ways","mode":"num","N":100,"use":[50,10],"cnt":null,"a":3,"q":"50円玉・10円玉を使って、\u003cb>100円\u003c/b>をちょうどはらいます。はらい方は\u003cb>何通り\u003c/b>？（何枚使ってもよい。使わないお金があってもよい）","hint":"いちばん大きいお金を何枚使うかで分けて、表に書いて数えよう。（50円玉を0枚、1枚、2枚…）","ex":"全部で3通り：50円玉2枚 ／ 50円玉1枚、10円玉5枚 ／ 10円玉10枚","lv":3},{"id":"4-01","kind":"lways","mode":"num","N":300,"use":[100,50,10],"cnt":{"100":4,"50":3,"10":7},"a":4,"q":"100円玉が4枚、50円玉が3枚、10円玉が7枚あります。この中から何枚か使って、\u003cb>300円\u003c/b>をちょうどはらう方法は\u003cb>何通り\u003c/b>？","hint":"100円玉を何枚使うかで分けて、表に書いて数えよう。枚数が足りるかにも気をつけて。","ex":"全部で4通り：100円玉3枚 ／ 100円玉2枚、50円玉2枚 ／ 100円玉2枚、50円玉1枚、10円玉5枚 ／ 100円玉1枚、50円玉3枚、10円玉5枚","lv":4},{"id":"5-01","kind":"amount","mode":"num","a":11,"cnt":{"100":2,"10":1,"5":1},"use":[100,10,5],"q":"100円玉が2枚、10円玉が1枚、5円玉が1枚あります。この中から1枚以上を使って、ちょうどはらえる\u003cb>金がくは何通り\u003c/b>？","hint":"出し方の数ではなく、金がくの数です。同じ金がくになる出し方（たとえば50円玉2枚と100円玉1枚）は、1通りと数えます。","ex":"それぞれのお金を何枚使うかで、出し方は3×2×2−1＝11通り（「全部0枚」をのぞく）。どの出し方も金がくがちがうので、答えは11通りです。","lv":5}];
const ID='okane';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>お金パズル 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* お金パズル：p.mode='pay'（N円ちょうどにする。fewest なら min 枚で）／'saifu'（出したあとさいふの枚数を min に）／'num'（数を答える）
   pay・saifu は、のせたお金の合計と枚数で判定するので、どんな出し方でも条件に合えば正解 */
const HINTWORD='ヒントやまちがい';
const LVD={1:'ぴったりはらおう',2:'いちばん少ない枚数・おつり',3:'はらい方は何通り・さいふの中だけで',4:'枚数に決まり・いっしょに出すお金',5:'はらえる金がく・さいふをかるくする出し方'};
const RULES=`<ol class="rules">
  <li>お金をタップすると、<b>おさら</b>にのります。おさらのお金をタップすると、もどります。</li>
  <li>ちょうどの金がくになったらクリア。「<b>いちばん少ない枚数</b>」の問題は、枚数も少なくしよう。</li>
  <li>「何通り？」「何円？」の問題は、数字を入力して答えます。</li>
  <li>お金は 1円・5円・10円・50円・100円・500円玉と、1000円札。おつりは、いちばん少ない枚数でもらえるものとします。</li></ol>`;
const OK_D=[1000,500,100,50,10,5,1];
const OK_C={1:['#eceef1','#9ca3af',17],5:['#f6dc85','#b8901f',18],10:['#dca06a','#9a5b2a',19],50:['#e6e8ec','#8b919a',18],100:['#d5d9df','#6b7280',20],500:['#f0c95c','#a97c12',22]};
function okCoin(d,sc){sc=sc||1;
  if(d===1000){const w=64*sc,h=34*sc;return `<svg viewBox="0 0 ${w+4} ${h+4}" width="${w+4}" height="${h+4}" aria-label="1000円札"><rect x="2" y="2" width="${w}" height="${h}" rx="4" fill="#dbe9d6" stroke="#4f7a45" stroke-width="2"/><rect x="${6*sc}" y="${6*sc}" width="${w-8*sc}" height="${h-8*sc}" rx="2" fill="none" stroke="#4f7a45" stroke-width="1" opacity=".5"/><text x="${2+w/2}" y="${2+h/2+6*sc}" text-anchor="middle" font-size="${16*sc}" font-weight="700" fill="#2f5a22" font-family="sans-serif">1000</text></svg>`;}
  const [f,s,r0]=OK_C[d],r=r0*sc;
  return `<svg viewBox="0 0 ${2*r+4} ${2*r+4}" width="${2*r+4}" height="${2*r+4}" aria-label="${d}円玉"><circle cx="${r+2}" cy="${r+2}" r="${r}" fill="${f}" stroke="${s}" stroke-width="2"/><circle cx="${r+2}" cy="${r+2}" r="${r-4*sc}" fill="none" stroke="${s}" stroke-width="1" opacity=".45"/><text x="${r+2}" y="${r+2+(d>=100?5:6)*sc}" text-anchor="middle" font-size="${(d>=100?15:17)*sc}" font-weight="700" fill="#2a2520" font-family="sans-serif">${d}</text></svg>`;}
const okNM=d=>d===1000?'1000円札':d+'円玉';
const okSum=a=>a.reduce((x,y)=>x+y,0);
function okGreedy(n){const o=[];for(const d of OK_D){while(n>=d){o.push(d);n-=d;}}return o;}
function okCnt(){return P.cnt?Object.fromEntries(Object.entries(P.cnt).map(([k,v])=>[+k,v])):null;}
function startStage(p){P=p;S={hints:0,done:false,msg:'',tray:[],inp:'',hint:false,res:null};begin(p);draw();}
function left(d){const c=okCnt();if(!c)return Infinity;return (c[d]||0)-S.tray.filter(x=>x===d).length;}
function figHTML(){
  const c=okCnt();
  if(P.kind==='extra'||P.kind==='ccount')return `<div class="okfig"><div class="tagp">${P.price}円</div><span class="okx">を</span>${okCoin(1000,1.2)}<span class="okx">${P.kind==='extra'?'＋ ？円 で買う':'で買う'}</span></div>`;
  if(P.mode==='num'){
    if(!c)return `<div class="okfig">${P.use.map(d=>`<span class="okone">${okCoin(d,1.1)}<small>何枚でも</small></span>`).join('')}</div>`;
    return `<div class="okfig col">${P.use.map(d=>`<div class="okrow">${Array.from({length:c[d]},()=>okCoin(d,0.85)).join('')}<small>${okNM(d)} ${c[d]}枚</small></div>`).join('')}</div>`;}
  return '';
}
function trayHTML(){
  const t=okSum(S.tray),lab=P.mode==='saifu'?'出したお金':'おさら';
  const sorted=S.tray.map((d,i)=>[d,i]).sort((a,b)=>b[0]-a[0]);
  return `<div class="tray"><div class="trayh"><span class="label">${lab}</span><span class="tot">いま <b>${t}</b>円${S.tray.length?`・${S.tray.length}枚`:''}</span></div>
    <div class="coins">${sorted.length?sorted.map(([d,i])=>`<button class="cn" data-i="${i}" ${S.done?'disabled':''} aria-label="${okNM(d)}をもどす">${okCoin(d,0.9)}</button>`).join(''):'<span class="ph">ここにお金がのります</span>'}</div></div>`;
}
function walletHTML(){
  return `<div class="label">${P.cnt?'さいふの中':'つかえるお金'}</div><div class="wallet">${P.use.map(d=>{const l=left(d);return `<button class="wc" data-d="${d}" ${S.done||l<=0?'disabled':''}>${okCoin(d)}<small>${l===Infinity?'':'のこり'+l+'枚'}</small></button>`;}).join('')}</div>`;
}
function keysHTML(){return `<div class="ans"><output id="inp">${S.inp||'&nbsp;'}</output><span>${P.kind==='extra'?'円':P.kind==='ccount'?'枚':'通り'}</span></div>
  <div class="keys">${['7','8','9','⌫','4','5','6','C','1','2','3','','0','OK'].map(k=>k===''?'<span></span>':`<button data-k="${k}" class="${k==='OK'?'go':''}" ${k==='OK'?'style="grid-column:span 2"':''}>${k==='OK'?'答える':k}</button>`).join('')}</div>`;}
function checkPay(){
  const t=okSum(S.tray);
  if(t<P.N){S.msg=P.lv<=1?`あと ${P.N-t}円！`:'';S.msgc='';return;}
  if(t>P.N){S.msg=`${t-P.N}円 多すぎます。おさらのお金をタップして、もどそう。`;S.msgc='ng';return;}
  if(P.fewest&&S.tray.length>P.min){S.hints++;S.msg=`ぴったり${P.N}円！　でも ${S.tray.length}枚より<b>少ない枚数</b>でもはらえます。`;S.msgc='ng';return;}
  S.done=true;
}
function payS(){ /* さいふ：出したお金 → おつり → のこりの枚数 */
  const t=okSum(S.tray);
  if(t<P.price){S.hints++;S.msg=`${P.price-t}円 足りません。`;S.msgc='ng';draw();return;}
  const chg=okGreedy(t-P.price),tot=Object.values(okCnt()).reduce((a,b)=>a+b,0),after=tot-S.tray.length+chg.length;
  S.res={t,chg,after,keep:tot-S.tray.length};
  if(after<=P.min){S.done=true;draw();return;}
  S.hints++;S.msg=`おつりは ${t-P.price}円（${chg.length}枚）。さいふの中は、のこり${tot-S.tray.length}枚＋おつり${chg.length}枚＝<b>${after}枚</b>になります。もっと少なくできるよ。`;S.msgc='ng';draw();
}
function draw(){
  const M=P.mode;
  app.innerHTML=`${topBar()}
    <p class="qq">${P.q}</p>
    ${figHTML()}
    ${M==='pay'?`${P.kind==='change'?`<div class="okfig"><div class="tagp">${P.price}円</div><span class="okx">を</span>${okCoin(1000,1.1)}<span class="okx">で買った</span></div>`:''}<div class="goal">${P.kind==='change'?'おつり':'はらう金がく'} <b>${P.N}円</b>${P.fewest?`<small>いちばん少ない枚数で</small>`:''}</div>${trayHTML()}${S.done?'':walletHTML()}`:''}
    ${M==='saifu'?`<div class="goal">代金 <b>${P.price}円</b><small>いま、さいふの中は全部で ${Object.values(okCnt()).reduce((a,b)=>a+b,0)}枚</small></div>${trayHTML()}${S.done?'':walletHTML()+`<div class="row"><button class="btn go" id="pay">このお金を出す</button></div>`}`:''}
    ${M==='num'&&!S.done?keysHTML():''}
    ${M==='num'&&S.done?`<div class="ans"><output>${P.a}</output></div>`:''}
    ${S.hint&&!S.done?`<p class="hintbox">${P.hint}</p>`:''}
    ${S.done?'':`<p class="msg ${S.msgc||''}" id="msg">${S.msg||''}</p><div class="row">${M!=='num'?`<button class="btn" id="clr">全部もどす</button>`:''}<button class="btn" id="hint" ${S.hint&&M==='num'?'disabled':''}>ヒント</button></div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){let ex=P.ex;if(M==='pay'){const g={};S.tray.forEach(d=>g[d]=(g[d]||0)+1);ex=Object.keys(g).map(Number).sort((a,b)=>b-a).map(d=>`${okNM(d)}${g[d]}枚`).join('、')+`で ${P.N}円${P.fewest?`。全部で${S.tray.length}枚が、いちばん少ない枚数です`:''}。`+(P.fewest&&!P.cnt?'大きいお金から順に使うと、枚数が少なくなります。':'');}
    if(M==='saifu'&&S.res)ex=`${S.res.t}円を出して、おつりは${S.res.t-P.price}円（${S.res.chg.length?S.res.chg.length+'枚':'なし'}）。さいふの中は、のこり${S.res.keep}枚＋おつり${S.res.chg.length}枚＝${S.res.after}枚で、いちばん少ない枚数です。`+P.ex.replace(/^たとえば.*?。/,'');
    showClear(`<p class="ex" style="margin:0">${ex}</p>`);return;}
  app.querySelectorAll('.wc').forEach(b=>b.onclick=()=>{const d=+b.dataset.d;if(left(d)<=0)return;S.tray.push(d);S.res=null;S.msg='';if(M==='pay')checkPay();draw();});
  app.querySelectorAll('.cn').forEach(b=>b.onclick=()=>{S.tray.splice(+b.dataset.i,1);S.res=null;S.msg='';if(M==='pay')checkPay();draw();});
  if(M==='saifu')document.getElementById('pay').onclick=payS;
  if(M!=='num')document.getElementById('clr').onclick=()=>{S.tray=[];S.msg='';S.res=null;draw();};
  if(M==='num')app.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;
    if(k==='C')S.inp='';else if(k==='⌫')S.inp=S.inp.slice(0,-1);
    else if(k==='OK'){if(!S.inp)return;if(+S.inp===P.a){S.done=true;draw();return;}S.inp='';S.hints++;S.msg='ちがいます。もう一度考えてみよう。';S.msgc='ng';draw();return;}
    else if(S.inp.length<4)S.inp=(S.inp+k).replace(/^0+(?=\d)/,'');
    document.getElementById('inp').innerHTML=S.inp||'&nbsp;';});
  document.getElementById('hint').onclick=()=>{S.hints++;S.msgc='';
    if(M==='num'){S.hint=true;S.msg='';draw();return;}
    /* お金の問題：はじめに文のヒント、2回目からは正しい出し方を前から少しずつのせる */
    if(!S.hint){S.hint=true;S.msg='';draw();return;}
    S.hs=(S.hs||0)+1;const k=Math.min(P.sol.length,Math.ceil(P.sol.length*S.hs/3));S.tray=P.sol.slice(0,k);S.res=null;
    S.msg=`ヒント：はじめの${k}枚をのせました。${k>=P.sol.length?(M==='saifu'?'「このお金を出す」をおそう。':''):'つづきを考えよう。'}`;
    if(M==='pay'){const m=S.msg;checkPay();if(!S.done)S.msg=m;}draw();};
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
