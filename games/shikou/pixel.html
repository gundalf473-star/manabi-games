:root[data-theme="dark"]{

.chip.w{background:#fff;color:#2a2520}.chip.b{background:#2a2520;color:#fff}.chip.q{background:var(--sealsoft);color:var(--seal);border-color:var(--seal);border-style:dashed;min-width:60px}

.mini{margin-left:auto}
#pg{touch-action:none;-webkit-user-select:none;user-select:none}

<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>ドット絵プログラム</h1>
    <p class="lead">白と黒の数や「→3」などの命令を読んで、マスをぬって絵をかこう。5つのレベルから1問ずつ。ヒントなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=false;
let QS=[{"kind":"rl","w":5,"h":5,"name":"にこにこ顔","rows":[[5],[1,1,1,1,1],[5],[0,1,3,1],[1,3,1]],"tgt":[".....",".#.#.",".....","#...#",".###."],"id":"1-01","lv":1},{"kind":"cmd","w":5,"h":5,"start":[4,4],"cmds":[["L",2],["U",2],["R",2]],"tgt":[".....",".....","..###","..#..","..###"],"id":"2-01","lv":2},{"kind":"cmd","w":6,"h":6,"start":[3,1],"cmds":[["L",1],["D",1],["R",3],["D",1],["R",2]],"tgt":["......","......","......","##....","####..","...###"],"id":"3-01","lv":3},{"kind":"rl","w":8,"h":8,"name":"ハート","rows":[[1,2,2,2,1],[0,8],[0,8],[0,8],[1,6,1],[2,4,2],[3,2,3],[8]],"tgt":[".##..##.","########","########","########",".######.","..####..","...##...","........"],"id":"4-01","lv":4},{"kind":"cmd","w":8,"h":8,"start":[6,6],"cmds":[{"rep":3,"body":[["L",2],["U",1]]},["R",3]],"tgt":["........","........","........","####....","###.....","..###...","....###.","........"],"id":"5-01","lv":5}];
const ID='pixel';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>ドット絵プログラム 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* ドット絵プログラム
   p={kind:'rl', w,h, name, rows:[[白,黒,白,…]], tgt:['..#..',…]}        … 白と黒の数の命令を見て、マスをぬる
   p={kind:'cmd', w,h, start:[r,c], cmds:[['R',3],…,{rep,body}], tgt}  … ペンの命令を見て、マスをぬる
   p={kind:'pick', w,h, start, tgt, a:命令, ds:ほかの3つ}               … 絵になる命令をえらぶ
   p={kind:'fill', w,h, name, rows, tgt, miss:？の行, a:その行の命令, ds} … ？の行の命令をえらぶ
   ぬる問題は「ぬったマスが絵とぴったり同じか」で判定。4択は gen_pixel.py で4つを全部動かし、絵になるのが1つだけと確かめてある */
let HINTWORD='ヒント';
const LVD={1:'5×5・白と黒の数',2:'ペンの命令・6×6',3:'命令をえらぶ・？の行',4:'8×8・長い命令',5:'くり返しの命令'};
const RULES=`<ol class="rules">
  <li>マスを<b>タップ</b>するとぬれます（もう一度タップで消える）。指でなぞると続けてぬれます。</li>
  <li><b>白と黒の数</b>：行ごとに、左から順に <span class="chip w">2</span> は「白いマスが2つ」、<span class="chip b">3</span> は「ぬるマスが3つ」ならぶ、という意味です。</li>
  <li><b>ペンの命令</b>：ペンは <b>●</b> のマスから出発します（●のマスははじめからぬってあります）。<span class="cm">→3</span> は「右へ3マス進みながらぬる」。←・↑・↓ も同じです。</li>
  <li><b>くり返す3回［ ］</b>は、［ ］の中の命令を3回つづけてやります。</li>
  <li>ぬったマスが命令のとおりになったらクリア。4択の問題は、絵になる命令をえらぼう。</li></ol>`;
const AR={R:'→',L:'←',U:'↑',D:'↓'},DV={R:[0,1],L:[0,-1],U:[-1,0],D:[1,0]};
const PU=40,PM=6;
const flatC=cmds=>{const o=[];cmds.forEach(c=>{if(Array.isArray(c))o.push(c);else for(let k=0;k<c.rep;k++)o.push(...c.body);});return o;};
function tracePath(start,cmds,w,h){let [r,c]=start;const path=[[r,c]],segs=[];for(const [d,n] of flatC(cmds)){const seg=[];for(let k=0;k<n;k++){r+=DV[d][0];c+=DV[d][1];if(r<0||c<0||r>=h||c>=w)return null;path.push([r,c]);seg.push([r,c]);}segs.push(seg);}return {path,segs};}
function picOf(start,cmds,w,h){const t=tracePath(start,cmds,w,h);if(!t)return null;const g=Array.from({length:h},()=>Array(w).fill('.'));t.path.forEach(([r,c])=>g[r][c]='#');return g.map(x=>x.join(''));}
const unrl=runs=>runs.map((n,i)=>(i%2?'#':'.').repeat(n)).join('');
const cmdHTML=cmds=>cmds.map(c=>Array.isArray(c)?`<span class="cm">${AR[c[0]]}${c[1]}</span>`:`<span class="rp">くり返す${c.rep}回［${c.body.map(b=>`<span class="cm">${AR[b[0]]}${b[1]}</span>`).join('')}］</span>`).join('');
const chipsSVG=(runs,x,y)=>{let s='',k=0;runs.forEach((n,i)=>{if(!n)return;const b=i%2===1;s+=`<rect x="${x+k*29}" y="${y}" width="26" height="28" rx="6" fill="${b?'#2a2520':'#fff'}" stroke="#2a2520" stroke-width="1.6"/><text x="${x+k*29+13}" y="${y+20}" text-anchor="middle" font-size="18" font-weight="700" fill="${b?'#fff':'#2a2520'}" font-family="sans-serif">${n}</text>`;k++;});return s;};
const chipsHTML=runs=>runs.map((n,i)=>n?`<span class="chip ${i%2?'b':'w'}">${n}</span>`:'').join('');
const shownRuns=runs=>runs.filter(n=>n).length;
function layoutRL(){ /* 命令を絵の右にならべるか、下に書くか */
  if(!P.rows)return 'none';const mr=Math.max(...P.rows.map(shownRuns));return P.w*PU+2*PM+12+mr*29<=430?'right':'below';}
/* 盤の絵：g は 2次元配列（true=ぬってある）。opt.hl=ハイライトする行, opt.path=線をかく */
function gridSVG(g,o){
  o=o||{};const w=P.w,h=P.h,lay=o.lay||'none',lm=lay==='below'?24:0;let s='';
  const W=lm+2*PM+w*PU+(lay==='right'?12+Math.max(...P.rows.map(shownRuns))*29:0),H=2*PM+h*PU;
  for(let r=0;r<h;r++){
    if(o.hlRow===r)s+=`<rect x="${lm}" y="${PM+r*PU}" width="${W-lm}" height="${PU}" fill="#fde68a" opacity=".55"/>`;
    for(let c=0;c<w;c++){const x=lm+PM+c*PU,y=PM+r*PU,on=g[r][c];
      s+=`<rect class="cell" data-r="${r}" data-c="${c}" x="${x+1}" y="${y+1}" width="${PU-2}" height="${PU-2}" rx="4" fill="${on?(o.col||'#2a2520'):'#fff'}" stroke="#c9c0b2" stroke-width="1"/>`;}
    if(lm)s+=`<text x="${lm-4}" y="${PM+r*PU+PU*0.66}" text-anchor="end" font-size="15" font-weight="700" fill="#8a8174" font-family="sans-serif">${r+1}</text>`;
    if(lay==='right'){const runs=o.miss===r?null:P.rows[r];
      if(runs)s+=chipsSVG(runs,lm+2*PM+w*PU+12,PM+r*PU+6);
      else s+=`<rect x="${lm+2*PM+w*PU+12}" y="${PM+r*PU+6}" width="70" height="28" rx="6" fill="#ede4fd" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4 3"/><text x="${lm+2*PM+w*PU+47}" y="${PM+r*PU+27}" text-anchor="middle" font-size="19" font-weight="700" fill="#7c3aed" font-family="sans-serif">？</text>`;}}
  for(let i=0;i<=w;i+=1){}
  if(P.start){const [r,c]=P.start;s+=`<circle cx="${lm+PM+c*PU+PU/2}" cy="${PM+r*PU+PU/2}" r="${PU*0.22}" fill="#f59e0b" stroke="#fff" stroke-width="3"/>`;}
  if(o.path){const t=tracePath(P.start,o.path,w,h);if(t){const pts=t.path.map(([r,c])=>`${lm+PM+c*PU+PU/2},${PM+r*PU+PU/2}`).join(' ');
    s+=`<polyline points="${pts}" fill="none" stroke="#a78bfa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>`;const [er,ec]=t.path[t.path.length-1];
    s+=`<circle cx="${lm+PM+ec*PU+PU/2}" cy="${PM+er*PU+PU/2}" r="6" fill="#a78bfa"/>`;
    if(P.start){const [r,c]=P.start;s+=`<circle cx="${lm+PM+c*PU+PU/2}" cy="${PM+r*PU+PU/2}" r="${PU*0.22}" fill="#f59e0b" stroke="#fff" stroke-width="3"/>`;}}}
  return `<svg ${o.id?`id="${o.id}"`:''} viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${o.max||Math.min(W,440)}px" role="img" aria-label="${o.label||'ドット絵のマス'}">${s}</svg>`;
}
const tgtGrid=()=>P.tgt.map(r=>[...r].map(ch=>ch==='#'));
const isDraw=()=>P.kind==='rl'||P.kind==='cmd';
function startStage(p){P=p;HINTWORD=(p.kind==='rl'||p.kind==='cmd')?'ヒント':'ヒントやまちがい';
  const g=Array.from({length:p.h},()=>Array(p.w).fill(false));if(p.kind==='cmd')g[p.start[0]][p.start[1]]=true;
  S={hints:0,done:false,msg:'',msgc:'',g,hshow:false,opts:p.ds?shuffle([p.a,...p.ds]):null,wrong:[],hlRow:-1};begin(p);draw();}
const same=()=>S.g.every((row,r)=>row.every((v,c)=>v===(P.tgt[r][c]==='#')));
function qtext(){
  if(P.kind==='rl')return '白と黒の数のとおりに、マスをぬろう。<br><span class="chip w">2</span>は「ぬらないマスが2つ」、<span class="chip b">3</span>は「ぬるマスが3つ」だよ。';
  if(P.kind==='cmd')return '<b>●</b>からペンを動かして、命令のとおりにマスをぬろう。';
  if(P.kind==='pick')return 'ペンを<b>●</b>から動かして、この絵をかく命令はどれ？';
  return `<b>${P.miss+1}行目</b>（？の行）の命令はどれ？`;
}
function hintText(){
  if(P.kind==='pick'){const f=flatC(P.a)[0];return `●からの線を目でたどろう。はじめは <span class="cm">${AR[f[0]]}${f[1]}</span> です。そのあと、どちらへ何マス進んでいるかな？`;}
  const row=P.tgt[P.miss];return `${P.miss+1}行目を左から見て、白いマスと黒いマスがいくつずつならんでいるか数えよう。はじめの白は ${row.indexOf('#')}つです。`;
}
function codeBlock(){
  if(P.kind==='cmd')return `<div class="label">プログラム</div><div class="prg">${cmdHTML(P.cmds)}</div>`;
  if((P.kind==='rl'||P.kind==='fill')&&layoutRL()==='below')
    return `<div class="rlc">${P.rows.map((r,i)=>`<div class="rlr ${S.hlRow===i?'hl':''}"><b>${i+1}</b>${P.kind==='fill'&&i===P.miss&&!S.done?'<span class="chip q">？</span>':chipsHTML(r)}</div>`).join('')}</div>`;
  return '';
}
function optHTML(o,i){
  if(P.kind==='fill')return `<span class="k">${'アイウエ'[i]}</span><span>${chipsHTML(o)}</span>`;
  const mini=S.done?`<span class="mini">${miniSVG(picOf(P.start,o,P.w,P.h))}</span>`:'';
  return `<span class="k">${'アイウエ'[i]}</span><span class="prg sm">${cmdHTML(o)}</span>${mini}`;
}
function miniSVG(pic){const u=8,w=P.w,h=P.h;let s='';pic.forEach((row,r)=>[...row].forEach((ch,c)=>{s+=`<rect x="${c*u}" y="${r*u}" width="${u-1}" height="${u-1}" fill="${ch==='#'?'#2a2520':'#eee8dc'}"/>`;}));return `<svg viewBox="0 0 ${w*u} ${h*u}" width="${w*u}" height="${h*u}" aria-label="この命令でかける絵">${s}</svg>`;}
function draw(){
  const lay=layoutRL();
  let board;
  if(isDraw())board=gridSVG(S.g,{lay:P.kind==='rl'?lay:'none',id:'pg',hlRow:S.hlRow,path:S.done&&P.kind==='cmd'?P.cmds:null});
  else if(P.kind==='pick')board=gridSVG(tgtGrid(),{path:S.done?P.a:null,label:'かきたい絵'});
  else board=gridSVG(tgtGrid(),{lay,miss:S.done?-1:P.miss,hlRow:P.miss});
  app.innerHTML=`${topBar()}<p class="qq">${qtext()}</p>
    ${P.kind==='cmd'?codeBlock():''}
    <div class="boardw pxw">${board}</div>
    ${P.kind!=='cmd'?codeBlock():''}
    ${isDraw()?(S.done?'':`<p class="msg ${S.msgc}" id="msg">${S.msg||'マスをタップしてぬろう。なぞると続けてぬれます。'}</p>
      <div class="row"><button class="btn" id="hint">ヒント</button><button class="btn" id="clr">全部消す</button></div>`)
    :`<div class="opts1">${S.opts.map((o,i)=>`<button class="ob ${S.done&&JSON.stringify(o)===JSON.stringify(P.a)?'right':''} ${S.wrong.includes(i)?'wrong':''}" data-i="${i}" ${S.done||S.wrong.includes(i)?'disabled':''}>${optHTML(o,i)}</button>`).join('')}</div>
      ${S.hshow&&!S.done?`<p class="hintbox">${hintText()}</p>`:''}
      ${S.done?'':`<p class="msg ${S.msgc}" id="msg">${S.msg}</p><div class="row"><button class="btn" id="hint" ${S.hshow?'disabled':''}>ヒント</button></div>`}`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(`<p style="margin:0">${explain()}</p>`);return;}
  if(isDraw()){bindPaint();
    document.getElementById('hint').onclick=hint;
    document.getElementById('clr').onclick=()=>{S.g=S.g.map(r=>r.map(()=>false));if(P.kind==='cmd')S.g[P.start[0]][P.start[1]]=true;S.hlRow=-1;S.msg='';draw();};
    return;}
  app.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
    if(JSON.stringify(S.opts[i])===JSON.stringify(P.a)){S.done=true;draw();}
    else{S.wrong.push(i);S.hints++;S.msg='ちがいます。もう一度たしかめよう。';S.msgc='ng';draw();}});
  document.getElementById('hint').onclick=()=>{S.hshow=true;S.hints++;S.msg='';draw();};
}
function explain(){
  if(P.kind==='rl')return `できあがったのは「<b>${P.name}</b>」の絵です。白と黒の数だけで、絵をつたえることができました。`;
  if(P.kind==='cmd')return `むらさきの線が、ペンの通った道です。命令を1つずつ実行すると、絵ができあがります。`;
  if(P.kind==='pick')return `ほかの命令でかける絵も、小さく出しました。むきや数が1つちがうだけで、絵がかわります。`;
  return `${P.miss+1}行目は ${chipsHTML(P.a)} です。絵は「${P.name}」でした。`;
}
function cellFromEvent(svg,e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const m=svg.getScreenCTM();if(!m)return null;const q=pt.matrixTransform(m.inverse());
  const lm=layoutRL()==='below'&&P.kind==='rl'?24:0;const c=Math.floor((q.x-lm-PM)/PU),r=Math.floor((q.y-PM)/PU);
  if(r<0||c<0||r>=P.h||c>=P.w)return null;return [r,c];}
function bindPaint(){
  const svg=document.getElementById('pg');let mode=null,last='';
  const apply=(rc)=>{if(!rc)return;const [r,c]=rc;const k=r+','+c;if(k===last)return;last=k;
    if(P.kind==='cmd'&&r===P.start[0]&&c===P.start[1])return;
    if(mode===null)mode=!S.g[r][c];
    S.g[r][c]=mode;const el=svg.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);if(el)el.setAttribute('fill',mode?'#2a2520':'#fff');};
  svg.addEventListener('pointerdown',e=>{e.preventDefault();mode=null;last='';try{svg.setPointerCapture(e.pointerId);}catch(_){} apply(cellFromEvent(svg,e));});
  svg.addEventListener('pointermove',e=>{if(mode===null&&last==='')return;if(e.buttons===0&&e.pointerType==='mouse')return;apply(cellFromEvent(svg,e));});
  const end=()=>{if(last===''&&mode===null)return;mode=null;last='';if(same()){S.done=true;draw();}else{const m=document.getElementById('msg');if(m&&S.hlRow<0){m.textContent='マスをタップしてぬろう。なぞると続けてぬれます。';}}};
  svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
}
function hint(){
  S.hints++;
  if(P.kind==='rl'){for(let r=0;r<P.h;r++){const ok=S.g[r].every((v,c)=>v===(P.tgt[r][c]==='#'));if(!ok){S.g[r]=[...P.tgt[r]].map(ch=>ch==='#');S.hlRow=r;S.msg=`ヒント：${r+1}行目を正しくぬりました（ヒント ${S.hints}回）。`;break;}}}
  else{/* まちがってぬったマスを消し、まだの命令を1つぶんぬる */
    const t=tracePath(P.start,P.cmds,P.w,P.h);let wrong=0;
    for(let r=0;r<P.h;r++)for(let c=0;c<P.w;c++)if(S.g[r][c]&&P.tgt[r][c]!=='#'){S.g[r][c]=false;wrong++;}
    const fc=flatC(P.cmds);const k=t.segs.findIndex(seg=>seg.some(([r,c])=>!S.g[r][c]));
    if(k>=0){t.segs[k].forEach(([r,c])=>S.g[r][c]=true);S.msg=`ヒント：${k+1}つ目の動き（${AR[fc[k][0]]}${fc[k][1]}）をぬりました${wrong?'。まちがってぬったマスも消しました':''}（ヒント ${S.hints}回）。`;}}
  S.msgc='';if(same()){S.done=true;}draw();
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
