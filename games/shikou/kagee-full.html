<script>
(function(){
const PAID=true;
let QS=[];
const ID='kagee';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>かげ絵あて 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* かげ絵あて：立体に光を当てたときのかげ（正面・真上・右横から平行な光）。
   p.kind='shadow'（立体と光の向き→かげを4つからえらぶ：a/ds={s:立体のキー,d}）| 'dir'（かげ→どこから光を当てた？ a:'front'|'top'|'side'）| 'solid'（かげ2〜3つ→立体を4つからえらぶ：views, a, ds）
   p.S={キー:{name,parts}}。かげは、立体の面（ポリゴン）を光の向きに平らにつぶして、ぬりつぶしてつくる。 */
const HINTWORD='ヒントやまちがい';
const LVD={1:'球・立方体・円柱・円すい（正面と真上）',2:'横からの光、ねている立体、光の向きあて',3:'2つのかげから立体をあてる',4:'組み合わせた立体のかげ',5:'3つのかげから立体をあてる'};
const RULES=`<ol class="rules">
  <li>立体に、<b>正面</b>・<b>真上</b>・<b>右横</b>のどれかから、まっすぐな光を当てます。光の反対がわのかべやゆかに、<b>かげ</b>ができます。</li>
  <li>かげは、光の向きから見た立体の<b>りんかく</b>の形です。中は黒くぬりつぶされて、もようは見えません。</li>
  <li>立体は、図の向きのまま動かしません。1つの問題の中のかげの絵は、どれも同じ縮尺でかいてあります（立体の絵とは、大きさがちがうことがあります）。</li>
  <li>4つ（または3つ）の中から答えをえらぼう。まちがえたら、もう一度えらべます。</li></ol>`;
const DN={front:'正面',top:'真上',side:'右横'};
/* ---- 立体のポリゴン ---- */
const NSEG=40;
const v3=(a,b,c)=>[a,b,c],sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
function axisPt(ax,c,t,u,w){ /* 軸方向 t、それに直交する u,w */
  if(ax==='x')return [c[0]+t,c[1]+u,c[2]+w];
  if(ax==='y')return [c[0]+u,c[1]+t,c[2]+w];
  return [c[0]+u,c[1]+w,c[2]+t];
}
function partPolys(p){
  const F=[],E=[]; /* F: 面（点の列）, E: 目立つ辺 [点a,点b,面i,面j] */
  const ring=(fn)=>{const R=[];for(let i=0;i<NSEG;i++){const th=2*Math.PI*i/NSEG;R.push(fn(Math.cos(th),Math.sin(th)));}return R;};
  if(p.k==='box'){const [x,y,z]=p.p,[a,b,c]=p.s,V=[[x,y,z],[x+a,y,z],[x+a,y+b,z],[x,y+b,z],[x,y,z+c],[x+a,y,z+c],[x+a,y+b,z+c],[x,y+b,z+c]];
    const FI=[[0,1,2,3],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]];FI.forEach(f=>F.push(f.map(i=>V[i])));
    const ed={};FI.forEach((f,fi)=>f.forEach((a0,j)=>{const b0=f[(j+1)%4],k=Math.min(a0,b0)+'-'+Math.max(a0,b0);(ed[k]=ed[k]||{a:V[a0],b:V[b0],f:[]}).f.push(fi);}));
    Object.values(ed).forEach(e=>E.push([e.a,e.b,e.f[0],e.f[1]]));}
  else if(p.k==='cyl'||p.k==='frust'){
    const ax=p.k==='cyl'?p.ax:'z', c=p.k==='cyl'?p.c:[p.c[0],p.c[1],p.c[2]+p.h/2], L=p.k==='cyl'?p.L:p.h, r1=p.k==='cyl'?p.r:p.r1, r2=p.k==='cyl'?p.r:p.r2;
    const A=ring((co,si)=>axisPt(ax,c,-L/2,r1*co,r1*si)),B=ring((co,si)=>axisPt(ax,c,L/2,r2*co,r2*si));
    F.push(A.slice());F.push(B.slice());
    for(let i=0;i<NSEG;i++){const j=(i+1)%NSEG;F.push([A[i],A[j],B[j],B[i]]);E.push([A[i],A[j],0,2+i]);E.push([B[i],B[j],1,2+i]);}}
  else if(p.k==='cone'){const z0=p.c[2],apex=[p.c[0],p.c[1],z0+p.up*p.h],A=ring((co,si)=>[p.c[0]+p.r*co,p.c[1]+p.r*si,z0]);
    F.push(A.slice());for(let i=0;i<NSEG;i++){const j=(i+1)%NSEG;F.push([A[i],A[j],apex]);E.push([A[i],A[j],0,1+i]);}}
  else if(p.k==='sph'||p.k==='hemi'){const NL=p.k==='sph'?18:9,NO=32,c=p.c,r=p.r;
    const pt=(i,j)=>{const la=p.k==='sph'?-Math.PI/2+Math.PI*i/NL:Math.PI/2*i/NL,lo=2*Math.PI*j/NO;return [c[0]+r*Math.cos(la)*Math.cos(lo),c[1]+r*Math.cos(la)*Math.sin(lo),c[2]+r*Math.sin(la)];};
    if(p.k==='hemi'){const A=[];for(let j=0;j<NO;j++)A.push(pt(0,j));F.push(A);}
    for(let i=0;i<NL;i++)for(let j=0;j<NO;j++){const q=[pt(i,j),pt(i,(j+1)%NO),pt(i+1,(j+1)%NO),pt(i+1,j)];F.push(q);
      if(p.k==='hemi'&&i===0)E.push([q[0],q[1],0,F.length-1]);}}
  else if(p.k==='pyr'){const [cx,cy,z0]=p.c,s=p.s/2,ap=[cx,cy,z0+p.h],V=[[cx-s,cy-s,z0],[cx+s,cy-s,z0],[cx+s,cy+s,z0],[cx-s,cy+s,z0]];
    F.push(V.slice());for(let i=0;i<4;i++){F.push([V[i],V[(i+1)%4],ap]);E.push([V[i],V[(i+1)%4],0,1+i]);E.push([V[(i+1)%4],ap,1+i,1+(i+1)%4]);}}
  else if(p.k==='prism'){const [cx,cy,z0]=p.c,w=p.w/2,h=p.h,L=p.L/2;let T;
    if(p.ax==='y')T=t=>[[cx-w,cy+t,z0],[cx+w,cy+t,z0],[cx,cy+t,z0+h]];
    else if(p.ax==='x')T=t=>[[cx+t,cy-w,z0],[cx+t,cy+w,z0],[cx+t,cy,z0+h]];
    else T=t=>[[cx-w,cy+h/2,z0+L+t],[cx+w,cy+h/2,z0+L+t],[cx,cy-h/2,z0+L+t]];
    const A=T(-L),B=T(L);F.push(A,B);for(let i=0;i<3;i++){const j=(i+1)%3;F.push([A[i],A[j],B[j],B[i]]);E.push([A[i],A[j],0,2+i]);E.push([B[i],B[j],1,2+i]);E.push([A[j],B[j],2+i,2+j]);}}
  else if(p.k==='wedge'){const [cx,cy,z0]=p.c,r=p.r,h=p.h,top=s=>z0+h*(1-Math.abs(s));
    const A=ring((co,si)=>[cx+r*co,cy+r*si,z0]);F.push(A.slice());
    const T=ring((co,si)=>[cx+r*co,cy+r*si,top(si)]);
    for(let i=0;i<NSEG;i++){const j=(i+1)%NSEG;F.push([A[i],A[j],T[j],T[i]]);E.push([A[i],A[j],0,1+i]);}
    /* ななめの2面：奥がわ（sin>0）と手前がわ（sin<0） */
    const back=[[cx+r,cy,z0+h]],front=[[cx+r,cy,z0+h]];
    for(let i=0;i<=NSEG/2;i++)back.push(T[i]);back.push([cx-r,cy,z0+h]);
    for(let i=NSEG/2;i<=NSEG;i++)front.push(T[i%NSEG]);
    const fb=F.length;F.push(back);F.push(front);
    for(let i=0;i<NSEG/2;i++){E.push([T[i],T[i+1],1+i,fb]);E.push([T[NSEG/2+i],T[(NSEG/2+i+1)%NSEG],1+NSEG/2+i,fb+1]);}
    E.push([[cx-r,cy,z0+h],[cx+r,cy,z0+h],fb,fb+1]);}
  /* 外向きの法線（へこみのない立体なので、まん中から外向きにそろえる） */
  const allP=F.flat(),cen=[0,1,2].map(i=>allP.reduce((a,q)=>a+q[i],0)/allP.length);
  const N=F.map(f=>{let n=[0,0,0];for(let i=0;i<f.length;i++){const a=f[i],b=f[(i+1)%f.length];n[0]+=(a[1]-b[1])*(a[2]+b[2]);n[1]+=(a[2]-b[2])*(a[0]+b[0]);n[2]+=(a[0]-b[0])*(a[1]+b[1]);}
    const l=Math.hypot(...n)||1;n=n.map(x=>x/l);const fc=[0,1,2].map(i=>f.reduce((a,q)=>a+q[i],0)/f.length);if(dot(n,sub(fc,cen))<0)n=n.map(x=>-x);return n;});
  return {F,N,E,cen};
}
/* ---- 見取り図（ななめ上から） ---- */
const AZ=32*Math.PI/180,EL=24*Math.PI/180;
const CU=[Math.cos(AZ),Math.sin(AZ),0],CV=[-Math.sin(AZ)*Math.sin(EL),Math.cos(AZ)*Math.sin(EL),Math.cos(EL)],CD=[Math.sin(AZ)*Math.cos(EL),-Math.cos(AZ)*Math.cos(EL),Math.sin(EL)];
const LT=(()=>{const l=[-0.35,-0.6,0.75],n=Math.hypot(...l);return l.map(x=>x/n);})();
const pr=q=>[dot(q,CU),-dot(q,CV)];
function shade(hex,k){const n=parseInt(hex.slice(1),16),c=[n>>16,(n>>8)&255,n&255].map(x=>Math.round(Math.min(255,x*k)));return `rgb(${c.join(',')})`;}
function solidSVG(sol,light,maxW){
  const parts=sol.parts.map(p=>({p,m:partPolys(p)}));
  parts.sort((a,b)=>dot(a.m.cen,CD)-dot(b.m.cen,CD));
  const all=[];parts.forEach(({m})=>m.F.forEach(f=>f.forEach(q=>all.push(q))));
  const zmax=Math.max(...all.map(q=>q[2])),xmax=Math.max(...all.map(q=>q[0])),ymin=Math.min(...all.map(q=>q[1]));
  const zc=zmax/2;
  const fx0=Math.min(...all.map(q=>q[0]))-0.6,fx1=xmax+0.6,fy0=ymin-0.6,fy1=Math.max(...all.map(q=>q[1]))+0.6;
  const floor=[[fx0,fy0,0],[fx1,fy0,0],[fx1,fy1,0],[fx0,fy1,0]];
  let arrow=null;
  if(light==='front')arrow=[[0,ymin-2.4,zc],[0,ymin-0.35,zc]];
  if(light==='top')arrow=[[0,0,zmax+2.0],[0,0,zmax+0.3]];
  if(light==='side')arrow=[[xmax+2.4,0,zc],[xmax+0.35,0,zc]];
  const pts=floor.map(pr).concat(all.map(pr)).concat(arrow?arrow.map(pr):[]);
  const U=44,mx=Math.min(...pts.map(q=>q[0]))-0.5,my=Math.min(...pts.map(q=>q[1]))-0.5,W=Math.max(...pts.map(q=>q[0]))-mx+0.5,H=Math.max(...pts.map(q=>q[1]))-my+0.4;
  const X=q=>{const [a,b]=pr(q);return [((a-mx)*U).toFixed(1),((b-my)*U).toFixed(1)];};
  const PP=f=>f.map(q=>X(q).join(',')).join(' ');
  let s=`<polygon points="${PP(floor)}" fill="#ece6d8" stroke="#d6ccb8" stroke-width="1"/>`;
  parts.forEach(({p,m})=>{
    const vis=m.F.map((f,i)=>dot(m.N[i],CD)>1e-6);
    const order=m.F.map((f,i)=>i).filter(i=>vis[i]).sort((a,b)=>{const ca=m.F[a].reduce((t,q)=>t+dot(q,CD),0)/m.F[a].length,cb=m.F[b].reduce((t,q)=>t+dot(q,CD),0)/m.F[b].length;return ca-cb;});
    order.forEach(i=>{const k=0.62+0.48*Math.max(0,dot(m.N[i],LT)),c=shade(p.col||'#93c5fd',k);s+=`<polygon points="${PP(m.F[i])}" fill="${c}" stroke="${c}" stroke-width="0.8" stroke-linejoin="round"/>`;});
    m.E.forEach(([a,b,i,j])=>{if(vis[i]||(j!=null&&vis[j])){const A=X(a),B=X(b);s+=`<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="#2a2520" stroke-width="1.6" stroke-linecap="round"/>`;}});
    /* りんかく（凸包） */
    const P2=m.F.flat().map(pr),H2=hull(P2);s+=`<polygon points="${H2.map(([a,b])=>`${((a-mx)*U).toFixed(1)},${((b-my)*U).toFixed(1)}`).join(' ')}" fill="none" stroke="#2a2520" stroke-width="2" stroke-linejoin="round"/>`;
  });
  if(arrow){const A=X(arrow[0]),B=X(arrow[1]);
    s+=`<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" marker-end="url(#kgA)"/>`;
    s+=`<circle cx="${A[0]}" cy="${A[1]}" r="11" fill="#fde047" stroke="#b45309" stroke-width="2"/>`;
    for(let i=0;i<8;i++){const t=i*Math.PI/4;s+=`<line x1="${(+A[0]+15*Math.cos(t)).toFixed(1)}" y1="${(+A[1]+15*Math.sin(t)).toFixed(1)}" x2="${(+A[0]+20*Math.cos(t)).toFixed(1)}" y2="${(+A[1]+20*Math.sin(t)).toFixed(1)}" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>`;}}
  const VW=W*U,VH=H*U;
  return `<svg viewBox="-24 -24 ${(VW+48).toFixed(0)} ${(VH+48).toFixed(0)}" style="width:100%;max-width:${maxW||300}px" role="img" aria-label="${esc(sol.name)}${light?'と、'+DN[light]+'からの光':''}"><defs><marker id="kgA" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#f59e0b"/></marker></defs>${s}</svg>`;
}
function hull(P){P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[],up=[];
  for(const p of P){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}
  for(const p of P.slice().reverse()){while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}
  return lo.slice(0,-1).concat(up.slice(0,-1));}
/* ---- かげ ---- */
const flat=(d,q)=>d==='front'?[q[0],-q[2]]:d==='top'?[q[0],-q[1]]:[q[1],-q[2]];
function shadowPolys(sol,d){const out=[];sol.parts.forEach(p=>{const m=partPolys(p);m.F.forEach(f=>out.push(f.map(q=>flat(d,q))));});return out;}
function shadowBox(sol,d){const P=shadowPolys(sol,d).flat();return [Math.min(...P.map(q=>q[0])),Math.min(...P.map(q=>q[1])),Math.max(...P.map(q=>q[0])),Math.max(...P.map(q=>q[1]))];}
function shadowSVG(sol,d,u,box,lab){
  const PL=shadowPolys(sol,d),[x0,y0,x1,y1]=shadowBox(sol,d),bw=box[0],bh=box[1],pad=8;
  const ox=(bw-(x1-x0))/2-x0,oy=(bh-(y1-y0))/2-y0;
  const wall='#e7e5e4';
  let s=`<rect x="0" y="0" width="${(bw*u+2*pad).toFixed(0)}" height="${(bh*u+2*pad).toFixed(0)}" rx="8" fill="${wall}"/>`;
  s+=`<g fill="#3f3f46" stroke="#3f3f46" stroke-width="0.7" stroke-linejoin="round">${PL.map(f=>`<polygon points="${f.map(([a,b])=>`${(pad+(a+ox)*u).toFixed(1)},${(pad+(b+oy)*u).toFixed(1)}`).join(' ')}"/>`).join('')}</g>`;
  return `<svg viewBox="0 0 ${(bw*u+2*pad).toFixed(0)} ${(bh*u+2*pad).toFixed(0)}" style="width:100%;max-width:${(bw*u+2*pad).toFixed(0)}px" role="img" aria-label="${lab||'かげ'}">${s}</svg>`;
}
/* ---- ゲーム ---- */
function startStage(p){
  P=p;S={hints:0,done:false,msg:'',msgc:'',wrong:[],hint:false};
  if(p.kind==='dir')S.opts=['front','top','side'];
  else S.opts=shuffle([p.a,...p.ds]);
  begin(p);draw();
}
const SO=k=>P.S[k];
function qtext(){
  if(P.kind==='shadow')return `この立体に、<b>${DN[P.a.d]}</b>から光を当てると、どんなかげができる？`;
  if(P.kind==='dir')return `この立体に光を当てたら、右のようなかげができました。光は<b>どこから</b>当てた？`;
  return `${P.views.map(d=>DN[d]).join('・')}から光を当てると、下のようなかげができる立体があります。その立体はどれ？`;
}
function hintText(){
  if(P.kind==='shadow')return `${DN[P.a.d]}から立体をのぞいたつもりで、いちばん外がわのりんかくを考えよう。${P.a.d==='top'?'真上から見ると、とがった先やでっぱりは、形の中にかくれます。':'高さと、いちばん太いところのはばに注目しよう。'}`;
  if(P.kind==='dir')return '正面・真上・右横から立体を見た形を、1つずつ思いうかべて、かげの形と同じものをさがそう。';
  return 'かげを1つずつ調べよう。1つでも合わないかげがある立体は、ちがいます。丸いかげができるのは、丸い面やふくらみがある向きです。';
}
function explain(){
  if(P.kind==='shadow'){const s=SO(P.a.s);return `<p style="margin:0">${esc(s.name)}に${DN[P.a.d]}から光を当てると、${DN[P.a.d]}から見た形のりんかくが、そのままかげになります。${s.note&&s.note[P.a.d]?esc(s.note[P.a.d]):''}</p>`;}
  if(P.kind==='dir'){const s=SO(P.s);return `<p style="margin:0">答えは<b>${DN[P.a]}</b>。${esc(s.name)}を${DN[P.a]}から見ると、このかげと同じ形になります。</p>${viewsRow(P.s,['front','top','side'],'見る')}`;}
  const s=SO(P.a);return `<div class="kg-fig">${solidSVG(s,null,200)}</div><p style="margin:0">答えは<b>${esc(s.name)}</b>。どのかげも合います。ほかの立体は、${P.ds.some(k=>P.why[k].length<P.views.length)?'いくつかのかげは合っても、':''}どれかのかげが合いません。</p>${P.ds.map(k=>{const bad=P.why[k];return `<p class="note" style="margin:2px 0">・${esc(SO(k).name)}：${bad.map(d=>DN[d]).join('と')}からのかげがちがう</p>`;}).join('')}`;
}
function viewsRow(k,ds,word){
  const sol=SO(k),bx=ds.map(d=>shadowBox(sol,d)),bw=Math.max(...bx.map(b=>b[2]-b[0])),bh=Math.max(...bx.map(b=>b[3]-b[1])),u=Math.min(30,90/Math.max(bw,bh,1));
  return `<div class="views kg-views">${ds.map(d=>`<figure>${shadowSVG(sol,d,u,[bw+0.2,bh+0.2],DN[d]+'からのかげ')}<figcaption>${DN[d]}から${word==='見る'?'光':'光'}</figcaption></figure>`).join('')}</div>`;
}
function optBoxes(list){ /* list:[{s,d}] 同じ縮尺 */
  const bx=list.map(o=>shadowBox(SO(o.s),o.d));const bw=Math.max(...bx.map(b=>b[2]-b[0])),bh=Math.max(...bx.map(b=>b[3]-b[1]));
  return {bw:bw+0.3,bh:bh+0.3,u:Math.min(34,118/Math.max(bw+0.3,bh+0.3))};
}
function draw(){
  let fig='',opts='';
  const btn=(i,inner,cls)=>`<button class="ob ${cls||''} ${S.done&&S.opts[i]===P.a?'right':''} ${S.wrong.includes(i)?'wrong':''}" data-i="${i}" ${S.done||S.wrong.includes(i)?'disabled':''}><span class="k">${'アイウエ'[i]}</span>${inner}</button>`;
  if(P.kind==='shadow'){
    fig=`<div class="kg-fig">${solidSVG(SO(P.a.s),P.a.d,280)}<span class="kg-name">${esc(SO(P.a.s).name)}</span></div>`;
    const B=optBoxes(S.opts);opts=`<div class="opts4">${S.opts.map((o,i)=>btn(i,shadowSVG(SO(o.s),o.d,B.u,[B.bw,B.bh],'かげ'+'アイウエ'[i]),'kg-ob')).join('')}</div>`;
  }else if(P.kind==='dir'){
    const sol=SO(P.s),b=shadowBox(sol,P.a),bw=b[2]-b[0]+0.3,bh=b[3]-b[1]+0.3;
    fig=`<div class="kg-two"><div class="kg-fig">${solidSVG(sol,null,220)}<span class="kg-name">${esc(sol.name)}</span></div><figure class="kg-sh">${shadowSVG(sol,P.a,Math.min(30,100/Math.max(bw,bh)),[bw,bh],'できたかげ')}<figcaption>できたかげ</figcaption></figure></div>`;
    opts=`<div class="opts4 txt kg-dir">${S.opts.map((o,i)=>btn(i,`<b style="font-size:19px">${DN[o]}から</b>`)).join('')}</div>`;
  }else{
    fig=viewsRow(P.a,P.views,'光');
    opts=`<div class="opts4">${S.opts.map((k,i)=>btn(i,solidSVG(SO(k),null,150),'kg-ob')).join('')}</div>`;
  }
  app.innerHTML=`${topBar()}
    <p class="qq">${qtext()}</p>
    <div class="boardw">${fig}</div>
    ${opts}
    ${S.hint&&!S.done?`<p class="hintbox">${hintText()}</p>`:''}
    ${S.done?'':`<p class="msg ${S.msgc||''}" id="msg">${S.msg||''}</p><div class="row"><button class="btn" id="hint" ${S.hint?'disabled':''}>ヒント</button></div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(explain());return;}
  app.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(S.opts[i]===P.a){S.done=true;draw();}else{S.wrong.push(i);S.hints++;S.msg='ちがいます。もう一度考えてみよう。';S.msgc='ng';draw();}});
  document.getElementById('hint').onclick=()=>{S.hint=true;S.hints++;S.msg='';draw();};
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
