<title>折り紙・切り紙 100問</title>
<meta name="game:paid" content="利用コード">
<meta name="game:subject" content="思考力">
<meta name="game:unit" content="折り紙・切り紙（図形）">
<meta name="game:grade" content="小3〜">
<meta name="game:players" content="1人">
<meta name="description" content="折り紙・切り紙の有料版。1回折りから3回折りまで、5つのレベルに20問ずつ、全100問。開いていくようすの図つき。">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Old+Mincho:wght@700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: 1列。上に盤、下に操作。紫を差し色に（思考力シリーズ） */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --fg:#2a2520; --muted:#6a625a; --rule:#ddd6cb;
  --ink:#3b2f6b; --seal:#7c3aed; --sealsoft:#ede4fd; --ok:#1d7a4c; --oksoft:#e0f0e6; --ng:#c8352d; --ngsoft:#f8e3e1; --gold:#a97c12; --pick:#efeae1;
  --display:"Dela Gothic One","Hiragino Kaku Gothic StdN",sans-serif;
  --mincho:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15130f; --surface:#1e1b17; --fg:#ece6dc; --muted:#a59c90; --rule:#34302a;
  --ink:#b3a6f0; --seal:#b79cff; --sealsoft:#271c40; --ok:#4cc184; --oksoft:#1b3326; --ng:#f07468; --ngsoft:#3a2220; --gold:#e1b44a; --pick:#28241e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15130f; --surface:#1e1b17; --fg:#ece6dc; --muted:#a59c90; --rule:#34302a;
  --ink:#b3a6f0; --seal:#b79cff; --sealsoft:#271c40; --ok:#4cc184; --oksoft:#1b3326; --ng:#f07468; --ngsoft:#3a2220; --gold:#e1b44a; --pick:#28241e; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 64px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,7.5vw,40px);line-height:1.15;margin:0;color:var(--ink)}
h1 small{display:block;font-family:var(--mincho);font-size:15px;color:var(--seal);letter-spacing:.3em;margin-bottom:4px}
.lead{margin:4px 0 0;color:var(--muted);font-size:14px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px}
.label{font-size:12px;font-weight:700;color:var(--seal);letter-spacing:.1em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--pick)}
.btn.go{background:var(--fg);color:var(--surface)}
.btn.on{background:var(--seal);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.note{font-size:13px;color:var(--muted);margin:0}
.rules{margin:0;padding-left:1.3em;font-size:15px}
.rules li{margin:2px 0}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;color:var(--ink);border:1px solid var(--ink);border-radius:4px;padding:0 6px;white-space:nowrap}
.back{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;padding:0;margin-left:auto}
.boardw{display:flex;justify-content:center;background:#fbfaf6;border:1px solid var(--rule);border-radius:10px;padding:8px}
.boardw svg{width:100%;height:auto;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.msg{font-size:14px;min-height:1.6em;margin:0;color:var(--muted)}
.msg.ok{color:var(--ok);font-weight:700} .msg.ng{color:var(--ng);font-weight:700}
.clear{border:2px solid var(--ok);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--oksoft)}
.clear .v{font-family:var(--display);font-size:24px;color:var(--ok)}
.stars{color:var(--gold);font-size:24px;letter-spacing:2px}
.stars .off{opacity:.25}
.lvtabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lvtabs button{border:2px solid var(--rule);background:var(--surface);border-radius:8px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.lvtabs button b{font-size:15px}
.lvtabs button small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.lvtabs button.cur{border-color:var(--seal);background:var(--sealsoft)}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stg{border:2px solid var(--rule);background:var(--surface);border-radius:8px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.stg b{font-size:17px;font-variant-numeric:tabular-nums}
.stg small{font-size:11px;color:var(--gold);letter-spacing:1px;min-height:1.2em}
.stg.done{border-color:var(--ok)}
.freelist{display:grid;gap:8px}
.freelist .stg{flex-direction:row;justify-content:space-between;padding:10px 14px;text-align:left}
.freelist .stg span{font-weight:700}
.sum{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
.sum .big{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums}
.sum .big small{font-size:14px;font-family:var(--body);color:var(--muted)}
.paid{display:flex;flex-direction:column;gap:2px;border:2px solid var(--seal);border-radius:8px;padding:12px 14px;text-decoration:none;color:var(--fg);background:var(--sealsoft)}
.paid .pt{font-size:15px} .paid .pt b{font-family:var(--display);font-weight:400;color:var(--seal)}
.paid .pd{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.pad{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pad button{min-width:48px;min-height:50px;border:1px solid var(--rule);background:var(--pick);border-radius:10px;font-size:21px;font-weight:700;cursor:pointer;touch-action:manipulation}
.pad button.er{font-size:15px;min-width:60px}
.qq{margin:0;font-size:17px;font-weight:700;line-height:1.7}
.opts4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opts4.txt{grid-template-columns:1fr 1fr}
.ob{border:2px solid var(--rule);background:var(--surface);border-radius:10px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px;justify-content:center}
.ob .k{align-self:flex-start;font-size:12px;font-weight:700;width:22px;height:22px;border-radius:50%;background:var(--pick);display:grid;place-items:center}
.ob:hover:not(:disabled){border-color:var(--ink)}
.ob.right{border-color:var(--ok);background:var(--oksoft)} .ob.wrong{border-color:var(--ng);background:var(--ngsoft);opacity:.6}
.ob:disabled{cursor:default}
.views{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;align-items:flex-end}
.views figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.scales{display:flex;flex-direction:column;gap:2px;align-items:center;width:100%}
.hintbox{margin:0;font-size:14px;background:var(--sealsoft);border-radius:8px;padding:8px 12px}
.prog{min-height:52px;border:2px dashed var(--rule);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;background:#fbfaf6}
.prog .ph{color:var(--muted);font-size:13px}
.palette{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ccard,.pcard{border:2px solid #93c5fd;background:#eff6ff;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:#1e3a8a}
.pcard{align-self:flex-start;padding:3px 10px}
.ccard.loop,.pcard.loop{border-color:#fbbf24;background:#fffbeb;color:#92400e}
.ccard span,.pcard span{font-size:18px}
.ccard:disabled,.pcard:disabled{opacity:.45;cursor:default}

</style>

<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>折り紙・切り紙 100問</h1>
    <p class="lead">紙を折って切りぬき、開いたらどんな形？　5つのレベルに20問ずつ。ヒントやまちがいなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=true;
let QS=[];
const ID='origami';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>折り紙・切り紙 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* 折り紙・切り紙：p={folds:['V'|'H'…]（V=右半分を左へ、H=下半分を上へ）, cuts:[[r,c]…]（折った紙の上）, ans, ds, steps} */
const HINTWORD='ヒントやまちがい';
const LVD={1:'1回折る',2:'2回折る・1〜2か所',3:'2回折る・2〜3か所',4:'3回折る',5:'3回折る・順番いろいろ'};
const RULES=`<ol class="rules">
  <li>正方形の紙を、図のように<b>半分に折って</b>いきます（点線が折り目）。</li>
  <li>折った紙の<b>黒いところ</b>を切りぬきます。</li>
  <li>紙を<b>ぜんぶ開くと</b>、どんな形の穴があいているかな？　4つの中からえらぼう。</li>
  <li>開くときは、折り目について<b>左右（上下）対称</b>に穴ができます。</li></ol>`;
const N=8;
function startStage(p){P=p;S={hints:0,done:false,msg:'',opts:shuffle([p.ans,...p.ds]),wrong:[],showStep:0};begin(p);draw();}
function sizes(){let w=N,h=N;const o=[[w,h]];P.folds.forEach(f=>{if(f==='V')w/=2;else h/=2;o.push([w,h]);});return o;}
function paper(w,h,u,holes,opt){opt=opt||{};let s='';
  s+=`<rect x="0" y="0" width="${w*u}" height="${h*u}" fill="${opt.fill||'#fde68a'}" stroke="#b45309" stroke-width="1.5"/>`;
  if(opt.grid)for(let i=1;i<w;i++)s+=`<line x1="${i*u}" y1="0" x2="${i*u}" y2="${h*u}" stroke="#e8c76a" stroke-width=".7"/>`;
  if(opt.grid)for(let i=1;i<h;i++)s+=`<line x1="0" y1="${i*u}" x2="${w*u}" y2="${i*u}" stroke="#e8c76a" stroke-width=".7"/>`;
  (holes||[]).forEach(([r,c])=>{s+=`<rect x="${c*u}" y="${r*u}" width="${u}" height="${u}" fill="${opt.hole||'#2a2520'}"/>`;});
  return s;}
function foldStrip(){
  const sz=sizes(),u=7;let x=0,out='';
  sz.forEach(([w,h],i)=>{
    out+=`<g transform="translate(${x},${(N-h)*u/2+10})">${paper(w,h,u,[],{})}`;
    if(i<P.folds.length){const f=P.folds[i];
      if(f==='V')out+=`<line x1="${w*u/2}" y1="-4" x2="${w*u/2}" y2="${h*u+4}" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4 3"/><path d="M${w*u*0.85},${h*u/2} Q${w*u/2},${-14} ${w*u*0.18},${h*u/2}" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar)"/>`;
      else out+=`<line x1="-4" y1="${h*u/2}" x2="${w*u+4}" y2="${h*u/2}" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4 3"/><path d="M${w*u/2},${h*u*0.85} Q${w*u+14},${h*u/2} ${w*u/2},${h*u*0.18}" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar)"/>`;}
    out+=`<text x="${w*u/2}" y="${h*u+16}" text-anchor="middle" font-size="11" fill="#6a625a" font-family="sans-serif">${i===0?'はじめ':i+'回目'}</text></g>`;
    x+=w*u+26; if(i<sz.length-1)out+=`<text x="${x-17}" y="${N*u/2+14}" font-size="16" fill="#6a625a">→</text>`;});
  return `<svg viewBox="-6 -6 ${x+6} ${N*7+40}" style="width:100%;max-width:440px" aria-label="折り方"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/></marker></defs>${out}</svg>`;
}
function foldedSVG(){
  const [w,h]=sizes().slice(-1)[0],u=34;let s=paper(w,h,u,P.cuts,{grid:true});
  /* 折り目の位置を、折るたびに追いかける（右半分を左へ折ると、右はしが折り目になり、前の折り目は左右反転する） */
  let W=N,H=N;const cx=[],cy=[];
  P.folds.forEach(f=>{if(f==='V'){for(let k=0;k<cx.length;k++)if(cx[k]>W/2)cx[k]=W-cx[k];cx.push(W/2);W/=2;}else{for(let k=0;k<cy.length;k++)if(cy[k]>H/2)cy[k]=H-cy[k];cy.push(H/2);H/=2;}});
  [...new Set(cx)].forEach(x=>{s+=`<line x1="${x*u}" y1="-6" x2="${x*u}" y2="${h*u+6}" stroke="#7c3aed" stroke-width="3" stroke-dasharray="6 4"/>`;});
  [...new Set(cy)].forEach(y=>{s+=`<line x1="-6" y1="${y*u}" x2="${w*u+6}" y2="${y*u}" stroke="#7c3aed" stroke-width="3" stroke-dasharray="6 4"/>`;});
  s+=`<text x="${w*u+8}" y="${h*u+20}" font-size="12" fill="#7c3aed" font-family="sans-serif">点線＝折り目</text>`;
  return `<svg viewBox="-10 -10 ${w*u+90} ${h*u+40}" style="max-width:${w*u+110}px;width:100%" aria-label="折った紙と切りぬくところ">${s}</svg>`;
}
const optSVG=(cells,u)=>`<svg viewBox="-2 -2 ${N*u+4} ${N*u+4}" style="width:100%">${paper(N,N,u,cells,{grid:true})}</svg>`;
function stepsSVG(){const sz=sizes().slice().reverse();let x=0,out='';const u=9;
  P.steps.forEach((cells,i)=>{const [w,h]=sz[i];out+=`<g transform="translate(${x},0)">${paper(w,h,u,cells,{grid:true})}</g>`;x+=w*u+(i<P.steps.length-1?22:0);
    if(i<P.steps.length-1)out+=`<text x="${x-16}" y="${N*u/2}" font-size="15" fill="#6a625a">→</text>`;});
  return `<svg viewBox="-2 -2 ${x+4} ${N*u+4}" style="width:100%;max-width:440px" aria-label="開いていくようす">${out}</svg>`;}
function draw(){
  app.innerHTML=`${topBar()}
    <div class="label">折り方</div><div class="boardw">${foldStrip()}</div>
    <div class="label">折った紙（黒いところを切りぬく）</div><div class="boardw">${foldedSVG()}</div>
    <p class="qq">紙をぜんぶ開くと、どうなる？</p>
    <div class="opts4">${S.opts.map((o,i)=>`<button class="ob ${S.done&&o===P.ans?'right':''} ${S.wrong.includes(i)?'wrong':''}" data-i="${i}" ${S.done||S.wrong.includes(i)?'disabled':''}><span class="k">${'アイウエ'[i]}</span>${optSVG(o,9)}</button>`).join('')}</div>
    ${S.showStep&&!S.done?`<div class="label">ヒント：1回開いたところ</div><div class="boardw">${(()=>{const [w,h]=sizes().slice().reverse()[1];const u=14;return `<svg viewBox="-2 -2 ${w*u+4} ${h*u+4}" style="max-width:${w*u+10}px;width:100%">${paper(w,h,u,P.steps[1],{grid:true})}</svg>`;})()}</div>`:''}
    ${S.done?'':`<p class="msg ${S.msgc||''}" id="msg">${S.msg||''}</p><div class="row"><button class="btn" id="hint" ${S.showStep?'disabled':''}>ヒント（1回だけ開く）</button></div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(`<div class="label" style="color:var(--ok)">開いていくようす</div><div>${stepsSVG()}</div>`);return;}
  app.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
    if(S.opts[i]===P.ans){S.done=true;draw();}
    else{S.wrong.push(i);S.hints++;S.msg='ちがいます。折り目について、どちらに穴が写るか考えよう。';S.msgc='ng';draw();}});
  document.getElementById('hint').onclick=()=>{S.showStep=1;S.hints++;S.msg='';draw();};
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD} ${S.hints}回でクリアしました。${HINTWORD}なしなら ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
