<script>
(function(){
const PAID=false;
let QS=[{"R":2,"C":2,"edges":[[0,2,0],[1,3,-1],[2,3,-1]],"keys":[[2,0]],"s":3,"g":0,"id":"1-01","lv":1,"min":2,"sol":[3,2,0],"order":[0],"dead":0},{"R":2,"C":3,"edges":[[0,1,0],[0,3,-1],[1,2,-1],[1,4,-1],[4,5,1]],"keys":[[4,1],[0,0]],"s":3,"g":5,"id":"2-01","lv":2,"min":4,"sol":[3,0,1,4,5],"order":[0,4],"dead":0},{"R":3,"C":3,"edges":[[0,1,-1],[0,3,-1],[1,4,-1],[2,5,-1],[3,4,-1],[3,6,1],[4,5,0],[5,8,1],[6,7,-1]],"keys":[[7,1],[4,1],[3,0]],"s":6,"g":8,"id":"3-01","lv":3,"min":6,"sol":[6,7,6,3,4,5,8],"order":[5,6,7],"dead":0},{"R":3,"C":3,"edges":[[0,3,1],[1,2,1],[2,5,-1],[3,4,-1],[3,6,-1],[4,5,1],[4,7,-1],[5,8,0],[6,7,-1]],"keys":[[5,1],[7,1],[1,0]],"s":6,"g":8,"id":"4-01","lv":4,"min":8,"sol":[6,7,4,5,2,1,2,5,8],"order":[5,1,7],"dead":12},{"R":3,"C":4,"edges":[[0,1,-1],[0,4,-1],[1,2,-1],[1,5,-1],[2,3,1],[2,6,0],[4,8,-1],[5,9,-1],[6,10,-1],[7,11,1],[8,9,-1],[9,10,2],[10,11,0]],"keys":[[11,1],[5,2],[3,0],[1,1]],"s":4,"g":7,"id":"5-01","lv":5,"min":11,"sol":[4,0,1,2,3,2,1,5,9,10,11,7],"order":[4,11,12,9],"dead":29}];
const ID='doorkagi';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>ドアとかぎ 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* ドアとかぎ：p={R,C, edges:[[部屋a,部屋b,色(-1は通路)]], keys:[[部屋,色]], s（スタート）, g（宝箱）, min, sol, order, dead}
   部屋の番号は r*C+c。かぎは1回使うとなくなり、同じ色のドアならどれでも開けられる。開けたドアは開いたまま。
   gen_doorkagi.py で、全部の状態をたどる探索をして、宝箱にたどりつけること・最短手数を確かめてある */
const HINTWORD='ヒント';
const LVD={1:'かぎ1つ・ドア1つ',2:'かぎ2つ・ドア2つ',3:'かぎがドアのおくに',4:'同じ色のドアが2つ（行き止まりあり）',5:'大きな地図・3色'};
const RULES=`<ol class="rules">
  <li><b>となりの部屋をタップ</b>して動こう。<b>宝箱</b>の部屋に着いたらクリア！</li>
  <li>部屋にある<b>かぎ</b>は、入ると自動で拾います。</li>
  <li>色のついた<b>ドア</b>は、同じ色のかぎで開きます。かぎは<b>1回使うとなくなります</b>。開けたドアは開いたままです。</li>
  <li>かぎを使うドアをまちがえると、宝箱に行けなくなることがあります（とくにレベル4・5）。そのときは「1手もどる」や「やり直し」を使おう。</li></ol>`;
const DKC=['#e23b3b','#2f6fdf','#e0a800'],DKN=['赤','青','黄'];
const DU=82,DM=8;
function dSym(col,x,y,r,fill){fill=fill||'#fff';
  if(col===0)return `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}"/>`;
  if(col===1)return `<polygon points="${x},${y-r*1.1} ${x+r*1.05},${y+r*.75} ${x-r*1.05},${y+r*.75}" fill="${fill}"/>`;
  return `<rect x="${x-r*.85}" y="${y-r*.85}" width="${r*1.7}" height="${r*1.7}" fill="${fill}"/>`;}
function dKey(col,x,y,s){const c=DKC[col];
  return `<g><circle cx="${x-s*.32}" cy="${y}" r="${s*.26}" fill="${c}" stroke="#2a2520" stroke-width="1.5"/>${dSym(col,x-s*.32,y,s*.1)}<rect x="${x-s*.1}" y="${y-s*.07}" width="${s*.55}" height="${s*.14}" fill="${c}" stroke="#2a2520" stroke-width="1.5"/><rect x="${x+s*.25}" y="${y+s*.05}" width="${s*.09}" height="${s*.16}" fill="${c}" stroke="#2a2520" stroke-width="1.2"/><rect x="${x+.36*s}" y="${y+s*.05}" width="${s*.09}" height="${s*.12}" fill="${c}" stroke="#2a2520" stroke-width="1.2"/></g>`;}
function dChest(x,y,s){return `<rect x="${x-s*.5}" y="${y-s*.15}" width="${s}" height="${s*.55}" rx="3" fill="#b8742e" stroke="#5a3410" stroke-width="2"/><path d="M${x-s*.5},${y-s*.15} Q${x},${y-s*.6} ${x+s*.5},${y-s*.15}Z" fill="#d08a3a" stroke="#5a3410" stroke-width="2"/><rect x="${x-s*.5}" y="${y-s*.17}" width="${s}" height="${s*.1}" fill="#f2c94c" stroke="#5a3410" stroke-width="1.2"/><rect x="${x-s*.09}" y="${y-s*.12}" width="${s*.18}" height="${s*.22}" rx="2" fill="#f2c94c" stroke="#5a3410" stroke-width="1.2"/>`;}
function dHero(x,y,s,happy){return `<circle cx="${x}" cy="${y}" r="${s*.42}" fill="#7c3aed" stroke="#3b2f6b" stroke-width="2"/><circle cx="${x}" cy="${y-s*.02}" r="${s*.3}" fill="#f6d7b8"/><circle cx="${x-s*.11}" cy="${y-s*.06}" r="${s*.045}" fill="#2a2520"/><circle cx="${x+s*.11}" cy="${y-s*.06}" r="${s*.045}" fill="#2a2520"/><path d="M${x-s*.11},${y+s*.08} Q${x},${y+(happy?.2:.15)*s} ${x+s*.11},${y+s*.08}" fill="none" stroke="#a0442a" stroke-width="2" stroke-linecap="round"/><path d="M${x-s*.32},${y-s*.12} Q${x},${y-s*.55} ${x+s*.32},${y-s*.12}" fill="#3b2f6b"/>`;}
const dRC=k=>[Math.floor(k/P.C),k%P.C];
function startStage(p){P=p;S={hints:0,done:false,msg:'',msgc:'',st:dStart(),hist:[],moves:0,hl:-1};begin(p);draw();}
function dStart(){const st={rm:P.s,op:[],pk:[]};dPick(st);return st;}
function dPick(st){P.keys.forEach(([r],ki)=>{if(r===st.rm&&!st.pk.includes(ki))st.pk.push(ki);});}
function dHeld(st,col){return st.pk.filter(ki=>P.keys[ki][1]===col).length-st.op.filter(k=>P.edges[k][2]===col).length;}
function dEdge(a,b){return P.edges.findIndex(e=>(e[0]===a&&e[1]===b)||(e[0]===b&&e[1]===a));}
/* st から動けるか：{ok, st2, msg} */
function dMove(st,to){const k=dEdge(st.rm,to);if(k<0)return {ok:false};const t=P.edges[k][2];const st2={rm:to,op:st.op.slice(),pk:st.pk.slice()};
  if(t>=0&&!st.op.includes(k)){if(dHeld(st,t)<=0)return {ok:false,lock:t};st2.op.push(k);}
  dPick(st2);return {ok:true,st:st2,opened:t>=0&&!st.op.includes(k)?t:-1};}
const dKeyStr=st=>st.rm+'|'+st.op.slice().sort((a,b)=>a-b).join(',')+'|'+st.pk.slice().sort((a,b)=>a-b).join(',');
/* 今の状態から宝箱までの最短の道（なければ null） */
function dBFS(st0){const seen=new Map([[dKeyStr(st0),null]]),q=[[st0,null]];
  for(let h=0;h<q.length;h++){const [st,first]=q[h];if(st.rm===P.g)return {first,dist:0};
    for(let to=0;to<P.R*P.C;to++){const m=dMove(st,to);if(!m.ok)continue;const ks=dKeyStr(m.st);if(seen.has(ks))continue;seen.set(ks,1);q.push([m.st,first===null?to:first]);}}
  return null;}
function boardSVG(){const st=S.st,R_=P.R,C_=P.C,W=C_*DU+2*DM,H=R_*DU+2*DM;let s='';
  const X=c=>DM+c*DU,Y=r=>DM+r*DU;
  for(let k=0;k<R_*C_;k++){const [r,c]=dRC(k);const nb=dEdge(st.rm,k)>=0;
    s+=`<rect class="droom" data-k="${k}" x="${X(c)}" y="${Y(r)}" width="${DU}" height="${DU}" fill="${k===S.hl?'#ede4fd':k===P.g?'#fdf3d7':'#f6efdd'}" style="cursor:pointer"/>`;}
  /* かべ（全部の境目にかいてから、通路とドアを上にかく） */
  s+=`<rect x="${DM}" y="${DM}" width="${C_*DU}" height="${R_*DU}" fill="none" stroke="#5a4a3a" stroke-width="7" rx="3"/>`;
  for(let r=0;r<R_;r++)for(let c=0;c<C_;c++){if(c+1<C_)s+=`<line x1="${X(c+1)}" y1="${Y(r)}" x2="${X(c+1)}" y2="${Y(r+1)}" stroke="#5a4a3a" stroke-width="6"/>`;
    if(r+1<R_)s+=`<line x1="${X(c)}" y1="${Y(r+1)}" x2="${X(c+1)}" y2="${Y(r+1)}" stroke="#5a4a3a" stroke-width="6"/>`;}
  P.edges.forEach(([a,b,t],k)=>{const [r1,c1]=dRC(a),[r2,c2]=dRC(b);const hor=r1===r2;
    const mx=hor?X(c2):X(c1)+DU/2,my=hor?Y(r1)+DU/2:Y(r2),L=DU*.5;
    const G=DU*.62,gap=hor?`<rect x="${mx-5}" y="${my-G/2}" width="10" height="${G}" fill="#f6efdd"/>`:`<rect x="${mx-G/2}" y="${my-5}" width="${G}" height="10" fill="#f6efdd"/>`;
    if(t<0){s+=gap;return;}
    if(st.op.includes(k)){s+=gap+(hor?`<line x1="${mx}" y1="${my-L/2}" x2="${mx+L*.6}" y2="${my-L/2-L*.2}" stroke="${DKC[t]}" stroke-width="5" stroke-linecap="round"/>`:`<line x1="${mx-L/2}" y1="${my}" x2="${mx-L/2-L*.2}" y2="${my-L*.6}" stroke="${DKC[t]}" stroke-width="5" stroke-linecap="round"/>`);return;}
    s+=(hor?`<rect x="${mx-8}" y="${my-L/2}" width="16" height="${L}" rx="3" fill="${DKC[t]}" stroke="#2a2520" stroke-width="2"/>`:`<rect x="${mx-L/2}" y="${my-8}" width="${L}" height="16" rx="3" fill="${DKC[t]}" stroke="#2a2520" stroke-width="2"/>`)+dSym(t,mx,my,5.5);});
  /* 宝箱・かぎ・自分 */
  {const [r,c]=dRC(P.g);s+=dChest(X(c)+DU/2,Y(r)+DU/2+(st.rm===P.g?14:4),st.rm===P.g?34:44);}
  P.keys.forEach(([rm,col],ki)=>{if(st.pk.includes(ki))return;const [r,c]=dRC(rm);s+=dKey(col,X(c)+DU*.5,Y(r)+DU*.74,40);});
  {const [r,c]=dRC(P.s);if(st.rm!==P.s)s+=`<text x="${X(c)+DU/2}" y="${Y(r)+DU-8}" text-anchor="middle" font-size="12" fill="#a59c90" font-family="sans-serif">スタート</text>`;}
  {const [r,c]=dRC(st.rm);s+=dHero(X(c)+DU/2,Y(r)+DU*(st.rm===P.g?.3:.38),46,S.done);}
  if(S.hl>=0){const [r,c]=dRC(S.hl);s+=`<rect x="${X(c)+6}" y="${Y(r)+6}" width="${DU-12}" height="${DU-12}" rx="8" fill="none" stroke="#7c3aed" stroke-width="4" stroke-dasharray="7 5"/>`;}
  return `<svg id="dbd" viewBox="0 0 ${W} ${H}" style="max-width:${Math.min(W*1.15,460)}px" role="img" aria-label="部屋の地図">${s}</svg>`;}
function invHTML(){const st=S.st,out=[];for(const col of [0,1,2]){const n=dHeld(st,col);for(let i=0;i<n;i++)out.push(`<svg viewBox="0 0 44 30" width="44" height="30" aria-label="${DKN[col]}のかぎ">${dKey(col,22,15,40)}</svg>`);}
  return out.length?out.join(''):'<span class="note">なし</span>';}
function draw(){
  app.innerHTML=`${topBar()}
    <div class="boardw">${boardSVG()}</div>
    <div class="row dinv"><span class="label">もっているかぎ</span>${invHTML()}<span class="note" style="margin-left:auto">${S.moves}手</span></div>
    ${S.done?'':`<p class="msg ${S.msgc}" id="msg">${S.msg||'となりの部屋をタップして動こう。'}</p>
    <div class="row"><button class="btn" id="undo" ${S.hist.length?'':'disabled'}>1手もどる</button><button class="btn" id="reset" ${S.hist.length?'':'disabled'}>やり直し</button><button class="btn" id="hint">ヒント</button></div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){const ord=P.order.map(k=>DKN[P.edges[k][2]]+'のドア').join(' → ');
    showClear(`<p style="margin:0">${S.moves}手で宝箱に着きました。いちばん少ない手数は <b>${P.min}手</b> です${S.moves===P.min?'（最短！）':''}。<br>最短の道で開けるドアの順番：${ord}。${P.lv>=4?'<br>同じ色のドアが2つあっても、かぎが1つしかないときは、<b>どちらのドアに使うか</b>を先に考えるのがコツです。':''}</p>`);return;}
  app.querySelectorAll('.droom').forEach(el=>el.addEventListener('click',()=>{const to=+el.dataset.k;if(to===S.st.rm)return;
    const m=dMove(S.st,to);
    if(!m.ok){if(m.lock!==undefined){S.msg=`${DKN[m.lock]}のドアです。${DKN[m.lock]}のかぎがありません。`;}else S.msg=dEdge(S.st.rm,to)<0&&Math.abs(dRC(to)[0]-dRC(S.st.rm)[0])+Math.abs(dRC(to)[1]-dRC(S.st.rm)[1])===1?'かべがあって通れません。':'となりの部屋にしか動けません。';S.msgc='ng';draw();return;}
    S.hist.push(S.st);S.st=m.st;S.moves++;S.hl=-1;S.msgc='';
    const got=m.st.pk.length-S.hist[S.hist.length-1].pk.length;
    S.msg=m.opened>=0?`${DKN[m.opened]}のかぎでドアを開けました。`:got?'かぎを拾いました！':'';
    if(S.st.rm===P.g)S.done=true;draw();}));
  document.getElementById('undo').onclick=()=>{S.st=S.hist.pop();S.moves--;S.hl=-1;S.msg='';S.msgc='';draw();};
  document.getElementById('reset').onclick=()=>{S.st=dStart();S.hist=[];S.moves=0;S.hl=-1;S.msg='';S.msgc='';draw();};
  document.getElementById('hint').onclick=()=>{S.hints++;const b=dBFS(S.st);
    if(!b){S.msg='ヒント：このままでは宝箱に行けません。かぎを使うドアをまちがえたかも。「1手もどる」か「やり直し」をしよう。';S.msgc='ng';S.hl=-1;}
    else{S.hl=b.first;S.msg='ヒント：むらさきの点線の部屋へ進もう。';S.msgc='';}
    draw();};
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
