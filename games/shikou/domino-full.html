<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>ドミノしきつめ 100問</h1>
    <p class="lead">マス2つ分のドミノを置いて、盤をすきまなくうめよう。しきつめられない盤のひみつや、しきつめ方の数も考えます。5つのレベルに20問ずつ。ヒントやまちがいなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=true;
let QS=[];
const ID='domino';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>ドミノしきつめ 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* ドミノしきつめ：p.kind='cover'（しきつめよう）,'all'（しきつめ方を全部見つけよう）,'yn'（しきつめられる？）,'can'（4つの盤から）,'count'（何通り？）
   しきつめの数・できるかどうかは gen_domino.py で動的計画法と二部マッチングの両方で確かめてある。どの正しいしきつめ方でも正解。 */
const HINTWORD='ヒントやまちがい';
const LVD={1:'小さい形をうめる',2:'大きい形・マスの数',3:'白と黒の数・どの盤ならできる？',4:'答えが1つの形・8×8のかど',5:'大きな盤・しきつめ方の数'};
const RULES=`<ol class="rules">
  <li><b>ドミノ</b>は、マス2つ分の長方形です。盤のマスを、ドミノですきまなく、重ならないようにうめよう。</li>
  <li><b>となりあう2つのマス</b>を順にタップすると、ドミノが1まい置けます。置いたドミノをタップすると外れます。</li>
  <li>「しきつめられる？」の問題では、盤を白と黒の<b>市松もよう</b>にぬって考えるのがコツ。ドミノ1まいは、かならず白1つと黒1つをおおいます。</li>
  <li>ヒントを使ったり、まちがえたりすると、星がへります。</li></ol>`;
const DU=40, DC=['#f59e0b','#3b82f6','#ef4444','#22c55e','#a855f7','#ec4899','#14b8a6','#f97316'];
const dKey=(r,c)=>r+','+c;
function dHoles(b){const s=new Set();(b.holes||[]).forEach(([r,c])=>s.add(dKey(r,c)));return s;}
function dBoard(b,o){
  /* o: {dom:[[r1,c1,r2,c2]...], sel:[r,c], color:市松, showHoles, tap, px, hl:index, id} */
  o=o||{};const H=dHoles(b),M=4;let s='';
  for(let r=0;r<b.h;r++)for(let c=0;c<b.w;c++){const x=M+c*DU,y=M+r*DU,k=dKey(r,c);
    if(H.has(k)){if(o.showHoles)s+=`<rect x="${x+1}" y="${y+1}" width="${DU-2}" height="${DU-2}" rx="4" fill="#d6d0c4"/><path d="M${x+11},${y+11}L${x+DU-11},${y+DU-11}M${x+DU-11},${y+11}L${x+11},${y+DU-11}" stroke="#8a8174" stroke-width="3" stroke-linecap="round"/>`;
      else s+=`<rect x="${x+2}" y="${y+2}" width="${DU-4}" height="${DU-4}" rx="3" fill="#e4ded2"/>`;/* 盤の外（うめなくてよい所）は灰色に */
      continue;}
    const dark=o.color&&(r+c)%2===1;
    s+=`<rect data-r="${r}" data-c="${c}" x="${x}" y="${y}" width="${DU}" height="${DU}" fill="${dark?'#5b5347':'#fffdf7'}" stroke="#b9ad99" stroke-width="1.2"/>`;}
  /* 盤のふち（穴やそとに面した辺）を太く */
  for(let r=0;r<b.h;r++)for(let c=0;c<b.w;c++){if(H.has(dKey(r,c)))continue;const x=M+c*DU,y=M+r*DU,out=(rr,cc)=>rr<0||cc<0||rr>=b.h||cc>=b.w||H.has(dKey(rr,cc));
    if(out(r-1,c))s+=`<line x1="${x}" y1="${y}" x2="${x+DU}" y2="${y}" stroke="#6a5f50" stroke-width="3" stroke-linecap="round"/>`;
    if(out(r+1,c))s+=`<line x1="${x}" y1="${y+DU}" x2="${x+DU}" y2="${y+DU}" stroke="#6a5f50" stroke-width="3" stroke-linecap="round"/>`;
    if(out(r,c-1))s+=`<line x1="${x}" y1="${y}" x2="${x}" y2="${y+DU}" stroke="#6a5f50" stroke-width="3" stroke-linecap="round"/>`;
    if(out(r,c+1))s+=`<line x1="${x+DU}" y1="${y}" x2="${x+DU}" y2="${y+DU}" stroke="#6a5f50" stroke-width="3" stroke-linecap="round"/>`;}
  (o.dom||[]).forEach((d,i)=>{const [r1,c1,r2,c2]=d,r=Math.min(r1,r2),c=Math.min(c1,c2),ho=r1===r2,w=ho?2*DU:DU,h=ho?DU:2*DU,x=M+c*DU,y=M+r*DU,col=DC[i%DC.length];
    s+=`<g data-d="${i}" style="cursor:pointer"><rect x="${x+3.5}" y="${y+3.5}" width="${w-7}" height="${h-7}" rx="7" fill="${col}" stroke="${o.hl===i?'#a97c12':'#2a2520'}" stroke-width="${o.hl===i?5:2}"/>`+
      (ho?`<line x1="${x+DU}" y1="${y+10}" x2="${x+DU}" y2="${y+DU-10}" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>`:`<line x1="${x+10}" y1="${y+DU}" x2="${x+DU-10}" y2="${y+DU}" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>`)+
      `<circle cx="${x+DU/2}" cy="${y+DU/2}" r="4" fill="#fff" opacity=".85"/><circle cx="${x+(ho?1.5:0.5)*DU}" cy="${y+(ho?0.5:1.5)*DU}" r="4" fill="#fff" opacity=".85"/></g>`;});
  if(o.sel){const [r,c]=o.sel;s+=`<rect x="${M+c*DU+3}" y="${M+r*DU+3}" width="${DU-6}" height="${DU-6}" rx="5" fill="rgba(124,58,237,.25)" stroke="#7c3aed" stroke-width="3.5" pointer-events="none"/>`;}
  const W=b.w*DU+2*M,Hh=b.h*DU+2*M,px=o.px||Math.min(440,b.w*56);
  return `<svg ${o.id?`id="${o.id}"`:''} viewBox="0 0 ${W} ${Hh}" style="width:100%;max-width:${px}px;display:block" role="img" aria-label="${b.w}×${b.h}の盤">${s}</svg>`;
}
function startStage(p){
  P=p;S={hints:0,done:false,msg:'',msgc:'',wrong:[],hint:false,dom:[],sel:null,hl:null,found:[],busy:false,color:false};
  if(p.kind==='yn')S.opts=['ok','odd','color'];
  if(p.kind==='can')S.opts=[0,1,2,3];
  if(p.kind==='count')S.opts=shuffle([p.a,...p.ds]);
  begin(p);draw();
}
function qText(){
  const p=P;
  if(p.kind==='cover')return `ドミノを置いて、盤を<b>すきまなく</b>うめよう。（ドミノ${(p.w*p.h-p.holes.length)/2}まい）`;
  if(p.kind==='all')return `たて${p.h}マス・よこ${p.w}マスの盤をドミノでうめるしかたは、<b>全部で${p.n}通り</b>あります。ちがううめ方を<b>全部</b>見つけよう。`;
  if(p.kind==='yn')return 'この盤（✕は穴）を、ドミノですきまなくしきつめられる？';
  if(p.kind==='can')return p.ask==='ok'?'✕のマスを取りのぞいた盤です。ドミノで<b>しきつめられる</b>のは どれ？（1つだけ）':'✕のマスを取りのぞいた盤です。ドミノで<b>しきつめられない</b>のは どれ？（1つだけ）';
  return `たて${p.h}マス・よこ${p.w}マスの盤を、ドミノですきまなくしきつめるしかたは、<b>全部で何通り</b>？（回したり裏返したりして同じになるものも、べつに数えます）`;
}
const yName={ok:'しきつめられる',odd:'できない：マスの数が<b>奇数</b>',color:'できない：マスの数は偶数だけど、市松もようの<b>白と黒の数がちがう</b>'};
function whyText(b){
  const n=b.w*b.h-b.holes.length;
  if(b.ok)return 'しきつめられます。';
  if(b.why==='odd')return `マスは${n}こで奇数。ドミノ1まいは2マスなので、奇数のマスはうめられません。`;
  if(b.why==='color')return `市松もようにぬると、白${b.nw}こ・黒${b.nb}こ。ドミノ1まいはかならず白1つ・黒1つをおおうので、数がちがうとうめられません。`;
  return 'ばらばらに分かれた部分のどこかで、白と黒の数がそろいません。';
}
function hintText(){
  const p=P;
  if(p.kind==='yn'||p.kind==='can')return '盤を市松もようにぬりました。ドミノ1まいは、かならず白1つと黒1つをおおいます。白と黒の数をくらべよう。マスの数が奇数でないかも見よう。';
  if(p.kind==='count'){
    if(p.h===2||p.w===2)return '左はしを考えよう。「たて1まい」で始まると、のこりは1列短い盤。「よこ2まい」で始まると、のこりは2列短い盤。小さい盤の数をたしていこう（2×1は1通り、2×2は2通り）。';
    return '左はしの列のうめ方で場合分けしたり、小さい盤から順に数えたりしよう。';
  }
  return '';
}
function dSq(b,o){return dBoard(b,Object.assign({showHoles:true,px:o&&o.px||300},o||{}));}
function explain(){
  const p=P;
  if(p.kind==='cover')return p.n===1?'この形のしきつめ方は、<b>この1通りだけ</b>です。かどや、はしのマスから決めていくと、置き方が1つにしぼれます。':`この形のしきつめ方は、全部で<b>${p.n}通り</b>あります。`;
  if(p.kind==='all')return `この盤のしきつめ方を、${p.n}通り全部見つけました！`;
  if(p.kind==='yn')return `${whyText(p.b)}<div style="margin-top:8px">${dSq(p.b,{color:!p.b.ok,dom:p.b.ok?p.b.sol:[],px:260})}</div>`;
  if(p.kind==='can')return `<ul style="margin:0;padding-left:1.2em">${p.bs.map((b,i)=>`<li><b>${'アイウエ'[i]}</b>：${whyText(b)}</li>`).join('')}</ul>${p.bs.some(b=>{const w=b.w-1,h=b.h-1,H=dHoles(b);return (w+h)%2===0&&((H.has(dKey(0,0))&&H.has(dKey(h,w)))||(H.has(dKey(0,w))&&H.has(dKey(h,0))));})?'<p style="margin:6px 0 0">反対のかど2つは同じ色。2つとも取りのぞくと、白と黒の数がちがってしまいます。</p>':''}`;
  if(p.h===2||p.w===2){const n=Math.max(p.w,p.h),f=[1,1];for(let i=2;i<=n;i++)f.push(f[i-1]+f[i-2]);
    return `2×1, 2×2, 2×3…の数は ${f.slice(1).join(', ')}。前の2つをたすと次の数になります（フィボナッチ数）。2×${n}は<b>${p.a}通り</b>です。`;}
  return `たて${p.h}・よこ${p.w}の盤のしきつめ方は、全部で<b>${p.a}通り</b>です。左はしの列のうめ方で場合分けすると、まちがえずに数えられます。`;
}
function draw(){
  const p=P;let body='';
  if(p.kind==='cover'||p.kind==='all'){
    body=`<div class="boardw">${dBoard(p,{dom:S.dom,sel:S.sel,hl:S.hl,id:'bd'})}</div>`;
    if(p.kind==='all')body+=`<div class="dm-found"><span class="label">見つけたしきつめ方 ${S.found.length} / ${p.n}</span><div class="dm-th">${S.found.map(t=>dBoard(p,{dom:t,px:72})).join('')}${Array(Math.max(0,p.n-S.found.length)).fill(`<div class="dm-q" style="aspect-ratio:${p.w}/${p.h}">？</div>`).join('')}</div></div>`;
  }else if(p.kind==='yn')body=`<div class="boardw">${dSq(p.b,{color:S.hint||S.done,px:340})}</div><div class="opts4 txt dm-yn">${S.opts.map((o,i)=>`<button class="ob ${S.done&&o===p.a?'right':''} ${S.wrong.includes(i)?'wrong':''}" data-i="${i}" ${S.done||S.wrong.includes(i)?'disabled':''}><span class="k">${'アイウ'[i]}</span><span style="font-size:15px">${yName[o]}</span></button>`).join('')}</div>`;
  else if(p.kind==='can')body=`<div class="opts4 dm-can">${S.opts.map((o,i)=>`<button class="ob dm-o ${S.done&&o===p.a?'right':''} ${S.wrong.includes(i)?'wrong':''}" data-i="${i}" ${S.done||S.wrong.includes(i)?'disabled':''}><span class="k">${'アイウエ'[i]}</span>${dSq(p.bs[o],{color:S.hint,px:170})}</button>`).join('')}</div>`;
  else body=`<div class="boardw">${dBoard(p,{px:Math.min(420,p.w*48)})}</div><div class="opts4 txt">${S.opts.map((o,i)=>`<button class="ob ${S.done&&o===p.a?'right':''} ${S.wrong.includes(i)?'wrong':''}" data-i="${i}" ${S.done||S.wrong.includes(i)?'disabled':''}><span class="k">${'アイウエ'[i]}</span><b style="font-size:20px">${o}通り</b></button>`).join('')}</div>`;
  const inter=p.kind==='cover'||p.kind==='all';
  app.innerHTML=`${topBar()}
    <p class="qq">${qText()}</p>
    ${body}
    ${S.hint&&!S.done&&!inter?`<p class="hintbox">${hintText()}</p>`:''}
    ${S.done?'':`<p class="msg ${S.msgc}" id="msg">${S.msg||(inter?'となりあう2つのマスを順にタップしよう。':'えらんでタップしよう。')}</p>
      <div class="row">${inter?`<button class="btn" id="hint">ヒント</button><button class="btn" id="reset">やりなおす</button>`:`<button class="btn" id="hint" ${S.hint?'disabled':''}>ヒント</button>`}</div>
      ${inter?`<p class="note">ヒントを使うと、ドミノを1まい置きます（まちがったドミノがあれば外します）。星がへります。</p>`:''}`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(`<div style="margin:0">${explain()}</div>`);return;}
  if(inter){bindBoard();return;}
  document.getElementById('hint').onclick=()=>{S.hint=true;S.hints++;S.msg='';S.msgc='';draw();};
  app.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,o=S.opts[i];
    if(o===p.a){S.done=true;}else{S.wrong.push(i);S.hints++;S.msg='ちがいます。もう一度考えてみよう。';S.msgc='ng';}draw();});
}
function dFilled(){const f=new Map();S.dom.forEach((d,i)=>{f.set(dKey(d[0],d[1]),i);f.set(dKey(d[2],d[3]),i);});return f;}
function bindBoard(){
  const p=P,bd=document.getElementById('bd');
  bd.addEventListener('click',e=>{
    if(S.busy)return;
    const g=e.target.closest('[data-d]');
    if(g){S.dom.splice(+g.dataset.d,1);S.sel=null;S.hl=null;S.msg='';S.msgc='';draw();return;}
    const t=e.target.closest('[data-r]');if(!t)return;const r=+t.dataset.r,c=+t.dataset.c;
    if(dFilled().has(dKey(r,c)))return;
    if(!S.sel){S.sel=[r,c];S.msg='';draw();return;}
    const [r0,c0]=S.sel;
    if(r0===r&&c0===c){S.sel=null;draw();return;}
    if(Math.abs(r0-r)+Math.abs(c0-c)===1){S.dom.push([r0,c0,r,c]);S.sel=null;S.hl=null;S.msg='';S.msgc='';afterPlace();return;}
    S.sel=[r,c];S.msg='となりのマスをタップしてね。';S.msgc='';draw();
  });
  document.getElementById('reset').onclick=()=>{S.dom=[];S.sel=null;S.hl=null;S.msg='';S.msgc='';draw();};
  document.getElementById('hint').onclick=()=>{S.hints++;doHint();};
}
const dNorm=d=>{const [a,b,c,e]=d;return (a<c||(a===c&&b<e))?[a,b,c,e]:[c,e,a,b];};
const dKeyT=t=>t.map(dNorm).map(x=>x.join(',')).sort().join('|');
function afterPlace(){
  const p=P,need=(p.w*p.h-p.holes.length)/2;
  if(S.dom.length<need){draw();return;}
  if(p.kind==='cover'){S.done=true;draw();return;}
  const k=dKeyT(S.dom);
  if(S.found.some(t=>dKeyT(t)===k)){S.msg='そのうめ方は、もう見つけました。ちがううめ方をさがそう。';S.msgc='ng';draw();return;}
  S.found.push(S.dom.slice());
  if(S.found.length>=p.n){S.done=true;draw();return;}
  S.msg=`${S.found.length}通りめを見つけた！　つぎのうめ方をさがそう。`;S.msgc='ok';S.busy=true;draw();
  setTimeout(()=>{if(!S||P!==p)return;S.dom=[];S.busy=false;draw();},900);
}
/* ヒント用：いま置いたドミノのままで、のこりをうめられるか（いちばん上・左の空きマスから置いていく探索） */
function dSolve(p,dom){
  const H=dHoles(p),f=new Set(H);dom.forEach(d=>{f.add(dKey(d[0],d[1]));f.add(dKey(d[2],d[3]));});
  const out=[];let nodes=0;
  const rec=()=>{
    if(++nodes>300000)return null;
    let r0=-1,c0=-1;
    outer:for(let r=0;r<p.h;r++)for(let c=0;c<p.w;c++)if(!f.has(dKey(r,c))){r0=r;c0=c;break outer;}
    if(r0<0)return true;
    for(const [dr,dc] of [[0,1],[1,0]]){const r=r0+dr,c=c0+dc;if(r<p.h&&c<p.w&&!f.has(dKey(r,c))){
      f.add(dKey(r0,c0));f.add(dKey(r,c));out.push([r0,c0,r,c]);
      const x=rec();if(x)return true;if(x===null)return null;
      out.pop();f.delete(dKey(r0,c0));f.delete(dKey(r,c));}}
    return false;
  };
  const res=rec();return res?out:res;
}
function doHint(){
  const p=P;S.sel=null;
  if(p.kind==='all'){
    const cur=new Set(S.dom.map(dNorm).map(x=>x.join(',')));
    const left=p.tilings.filter(t=>!S.found.some(f=>dKeyT(f)===dKeyT(t)));
    const fit=left.find(t=>{const ts=new Set(t.map(dNorm).map(x=>x.join(',')));return [...cur].every(x=>ts.has(x));});
    if(!fit){S.dom=[];S.msg=`ヒント：いまのならべ方では、まだ見つけていないうめ方になりません。はじめからやり直そう（ヒント ${S.hints}回）。`;S.msgc='';draw();return;}
    const nx=fit.map(dNorm).find(d=>!cur.has(d.join(',')));S.dom.push(nx);S.hl=S.dom.length-1;
    S.msg=`ヒント：ドミノを1まい置きました（ヒント ${S.hints}回）。`;S.msgc='';afterPlace();return;
  }
  let sol=dSolve(p,S.dom);
  if(sol===false||sol===null){
    /* 正しいしきつめ方（保存した答え）にないドミノを1まい外す */
    const ok=new Set(p.sol.map(dNorm).map(x=>x.join(',')));
    let i=S.dom.findIndex(d=>!ok.has(dNorm(d).join(',')));if(i<0)i=S.dom.length-1;
    S.dom.splice(i,1);S.hl=null;S.msg=`ヒント：このままでは、うめきれません。ドミノを1まい外しました（ヒント ${S.hints}回）。`;S.msgc='';draw();return;
  }
  if(!sol.length){draw();return;}
  /* のこりのしきつめのうち、置き方が1つに決まりやすい「かど」のドミノを置く */
  S.dom.push(sol[0]);S.hl=S.dom.length-1;S.msg=`ヒント：ドミノを1まい置きました（ヒント ${S.hints}回）。`;S.msgc='';afterPlace();
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
