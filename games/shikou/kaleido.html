<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>万華鏡もよう</h1>
    <p class="lead">鏡の間に入れた小さなもようが、鏡にうつってどんな円いもようになる？　タップしてもようを完成させたり、形の数や鏡の角度を考えたりしよう。5つのレベルから1問ずつ。ヒントやまちがいなしでクリアすると★3つ。</p>
  </header>

</div>

<script>
(function(){
const PAID=false;
let QS=[{"kind":"tap","m":1,"nc":1,"motif":["11",".111"],"taps":5,"id":"1-01","lv":1,"rings":[2,4]},{"kind":"tap","m":2,"nc":1,"motif":[".","1.","..1"],"taps":6,"id":"2-01","lv":2,"rings":[1,2,3]},{"kind":"tap","m":3,"nc":2,"motif":["2","1.",".1"],"taps":15,"id":"3-01","lv":3,"rings":[1,2,2]},{"kind":"tap","m":4,"nc":2,"motif":["1","..","12"],"taps":21,"id":"4-01","lv":4,"rings":[1,2,2]},{"kind":"tap","m":4,"nc":3,"motif":["1",".2",".."],"taps":14,"id":"5-01","lv":5,"rings":[1,2,2]}];
const ID='kaleido';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>万華鏡もよう 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* 万華鏡もよう：p={kind:'tap'|'pick'|'src'|'count'|'angle', m:部屋の数の半分（鏡の角度＝180/m°。m=1は鏡1まい）, rings:[輪ごとの区切り], motif:[部屋0のもよう], nc:色の数, ds:まちがい}
   全体のもようは「となりの部屋は、さかいの線（鏡）で折り返した形」＝奇数番目の部屋は左右うら返し、で計算する（gen_kaleido.pyで反射の計算と一致を確認ずみ）。 */
const HINTWORD='ヒントやまちがい';
const LVD={1:'鏡1まい・直角の鏡',2:'90°・60°の鏡と形の数',3:'60°の鏡・2色',4:'45°の鏡・角度を考える',5:'45°・30°の鏡・3色'};
const RULES=`<ol class="rules">
  <li>2まいの<b>鏡（太い線）</b>の間に、小さなもようを入れると、鏡にうつって円いもようになります。これが<b>万華鏡</b>のしくみです。</li>
  <li>鏡にうつった形は<b>うら返し</b>になります。となりの部屋は、さかいの線で<b>折り返した</b>形です。</li>
  <li>「完成させよう」では、白いマスを<b>タップ</b>して色をぬります（なぞってもOK）。茶色の部屋が<b>見本</b>です。</li>
  <li>「えらぼう」では、4つの中から正しいものをえらびます。ヒントを使ったり、まちがえたりすると、星がへります。</li></ol>`;
const KC={'1':'#3b82f6','2':'#ef4444','3':'#f59e0b'}, KCN={'1':'あお','2':'あか','3':'きいろ'};
const KR=150;
const kAl=m=>180/m, kOff=m=>m===1?180:-90/m;
const kRad=n=>{const a=[];for(let k=0;k<=n;k++)a.push(KR*Math.sqrt(k/n));return a;};
/* 奇数番目の部屋はうら返し */
const kFull=(m,mo)=>{const F=[];for(let t=0;t<2*m;t++)F.push(mo.map(r=>t%2?[...r].reverse().join(''):r));return F;};
const kPt=(th,r)=>{const a=th*Math.PI/180;return [r*Math.sin(a),-r*Math.cos(a)];};
const f1=x=>Math.round(x*10)/10;
function kCell(m,rg,t,k,j){
  const rs=kRad(rg.length),a=kAl(m),a0=kOff(m)+t*a+j*a/rg[k],a1=a0+a/rg[k],r0=rs[k],r1=rs[k+1];
  const n=Math.max(2,Math.ceil((a1-a0)/3)),pts=[];
  for(let i=0;i<=n;i++)pts.push(kPt(a0+(a1-a0)*i/n,r1));
  if(r0<0.5)pts.push([0,0]);else for(let i=n;i>=0;i--)pts.push(kPt(a0+(a1-a0)*i/n,r0));
  return pts.map(p=>f1(p[0])+','+f1(p[1])).join(' ');
}
/* 円のもよう。o:{only0:部屋0だけ, lock0:部屋0を見本色に, mirror:鏡をかく, tap:id付き, hl:[t,k,j], px:大きさ} */
function kDisc(m,rg,F,o){
  o=o||{};const a=kAl(m);let s=`<circle cx="0" cy="0" r="${KR}" fill="#ffffff" stroke="#c9bfae" stroke-width="1.5"/>`;
  for(let t=0;t<2*m;t++)for(let k=0;k<rg.length;k++)for(let j=0;j<rg[k];j++){
    const v=F?F[t][k][j]:'.',hid=o.only0&&t>0;
    const base=hid?'#ece8e1':(o.lock0&&t===0?'#e9e1d0':'#ffffff');
    const fill=hid?base:(v==='.'?base:KC[v]);
    s+=`<polygon ${o.tap?`id="k${t}_${k}_${j}"`:''} points="${kCell(m,rg,t,k,j)}" fill="${fill}" stroke="#d3cabb" stroke-width="1" data-base="${base}"/>`;}
  /* 部屋のさかい（細い線） */
  for(let t=0;t<2*m;t++){const [x,y]=kPt(kOff(m)+t*a,KR);s+=`<line x1="0" y1="0" x2="${f1(x)}" y2="${f1(y)}" stroke="#a59c90" stroke-width="1" stroke-dasharray="3 3" pointer-events="none"/>`;}
  if(o.hl){const [t,k,j]=o.hl;s+=`<polygon points="${kCell(m,rg,t,k,j)}" fill="none" stroke="#a97c12" stroke-width="4" pointer-events="none"/>`;}
  if(o.mirror!==false){
    const L=KR+10;
    if(m===1){s+=`<line x1="0" y1="${-L}" x2="0" y2="${L}" stroke="#475569" stroke-width="6" stroke-linecap="round" pointer-events="none"/><line x1="0" y1="${-L}" x2="0" y2="${L}" stroke="#e2e8f0" stroke-width="2" pointer-events="none"/>`;}
    else for(const th of [kOff(m),kOff(m)+a]){const [x,y]=kPt(th,L);s+=`<line x1="0" y1="0" x2="${f1(x)}" y2="${f1(y)}" stroke="#475569" stroke-width="6" stroke-linecap="round" pointer-events="none"/><line x1="0" y1="0" x2="${f1(x)}" y2="${f1(y)}" stroke="#e2e8f0" stroke-width="2" pointer-events="none"/>`;}
  }
  const px=o.px||330;
  const vb=o.tight?'-152 -152 304 304':'-164 -164 328 328';
  return `<svg ${o.tap?'id="bd"':''} viewBox="${vb}" style="width:100%;max-width:${px}px" role="img" aria-label="万華鏡のもよう">${s}</svg>`;
}
/* 鏡の角度の図（数を考える問題） */
function kAngleFig(ang,mo){
  const m=180/ang,off=-ang/2,L=150;let s='';
  if(mo){const rg=[1,2,3];for(let k=0;k<3;k++)for(let j=0;j<rg[k];j++){/* 角度に合わせて部屋0だけかく */
    const rs=kRad(3),a0=off+j*ang/rg[k],a1=a0+ang/rg[k],n=Math.max(2,Math.ceil((a1-a0)/3)),pts=[];
    for(let i=0;i<=n;i++)pts.push(kPt(a0+(a1-a0)*i/n,rs[k+1]*0.8));if(k===0)pts.push([0,0]);else for(let i=n;i>=0;i--)pts.push(kPt(a0+(a1-a0)*i/n,rs[k]*0.8));
    const v=mo[k][j];s+=`<polygon points="${pts.map(p=>f1(p[0])+','+f1(p[1])).join(' ')}" fill="${v==='.'?'#ffffff':KC[v]}" stroke="#d3cabb"/>`;}}
  for(const th of [off,off+ang]){const [x,y]=kPt(th,L);s+=`<line x1="0" y1="0" x2="${f1(x)}" y2="${f1(y)}" stroke="#475569" stroke-width="6" stroke-linecap="round"/><line x1="0" y1="0" x2="${f1(x)}" y2="${f1(y)}" stroke="#e2e8f0" stroke-width="2"/>`;}
  const ar=46,n=Math.max(2,Math.ceil(ang/3)),pts=[];for(let i=0;i<=n;i++)pts.push(kPt(off+ang*i/n,ar));
  s+=`<polyline points="${pts.map(p=>f1(p[0])+','+f1(p[1])).join(' ')}" fill="none" stroke="#dc2626" stroke-width="3"/>`;
  s+=`<circle cx="0" cy="0" r="5" fill="#475569"/><text x="0" y="40" text-anchor="middle" font-size="30" font-weight="700" fill="#dc2626" font-family="sans-serif">${ang}°</text>`;
  return `<svg viewBox="-160 -165 320 225" style="width:100%;max-width:300px" role="img" aria-label="${ang}度に合わせた2まいの鏡">${s}</svg>`;
}
/* 1つの形が鏡にうつって円くならんだようす（奇数番目はうら返し） */
function kRing(n){const a=360/n;let s=`<circle cx="0" cy="0" r="150" fill="#ffffff" stroke="#c9bfae" stroke-width="1.5"/>`;
  const sh=`<polygon points="-8,-136 16,-118 -2,-112 6,-84 -12,-84" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/><circle cx="-4" cy="-128" r="3" fill="#fff"/>`;
  for(let t=0;t<n;t++)s+=`<g transform="rotate(${t*a})${t%2?' scale(-1,1)':''}">${sh}</g>`;
  s+=`<circle cx="0" cy="0" r="4" fill="#a59c90"/>`;
  return `<svg viewBox="-164 -164 328 328" style="width:100%;max-width:280px" role="img" aria-label="鏡にうつって円くならんだ形">${s}</svg>`;}
/* 部屋0だけを大きくかく（選たくし用） */
function kWedge(m,rg,mo){const a=kAl(m),off=kOff(m),hw=KR*Math.sin(a/2*Math.PI/180);let s='';
  for(let k=0;k<rg.length;k++)for(let j=0;j<rg[k];j++){const v=mo[k][j];s+=`<polygon points="${kCell(m,rg,0,k,j)}" fill="${v==='.'?'#ffffff':KC[v]}" stroke="#a59c90" stroke-width="1.2"/>`;}
  for(const th of [off,off+a]){const [x,y]=kPt(th,KR+6);s+=`<line x1="0" y1="0" x2="${f1(x)}" y2="${f1(y)}" stroke="#475569" stroke-width="5" stroke-linecap="round"/>`;}
  const W=2*hw+16,H=KR+16;return `<svg viewBox="${f1(-hw-8)} ${-KR-10} ${f1(W)} ${H}" style="width:auto;height:130px;max-width:100%" role="img" aria-label="鏡の間のもよう">${s}</svg>`;}
/* 見えた形の数だけ、小さな形をならべた図 */
function kCopies(n){const per=Math.min(n,8),rows=Math.ceil(n/8);let s='';
  for(let i=0;i<n;i++){const r=Math.floor(i/8),c=i%8,x=20+c*38,y=22+r*40,fl=i%2;
    s+=`<polygon points="${fl?`${x+12},${y-14} ${x-12},${y+12} ${x+10},${y+12}`:`${x-12},${y-14} ${x+12},${y+12} ${x-10},${y+12}`}" fill="#3b82f6" stroke="#1e3a8a" stroke-width="1.5"/>`;}
  return `<svg viewBox="0 0 ${per*38+2} ${rows*40+6}" style="width:100%;max-width:${per*38+2}px" role="img" aria-label="見えた形${n}こ">${s}</svg>`;}
function startStage(p){
  P=p;S={hints:0,done:false,msg:'',msgc:'',hint:false,wrong:[],col:'1'};
  if(p.kind==='tap'){S.T=kFull(p.m,p.motif);S.g=S.T.map((sec,t)=>sec.map(r=>t===0?r:'.'.repeat(r.length)));S.lock={};}
  if(p.kind==='pick')S.opts=shuffle([{m:p.m,F:kFull(p.m,p.motif),ok:true},...p.ds]);
  if(p.kind==='src')S.opts=shuffle([{mo:p.motif,ok:true},...p.ds.map(d=>({mo:d}))]);
  if(p.kind==='count'||p.kind==='angle')S.opts=shuffle([p.a,...p.ds]);
  begin(p);draw();
}
const kName=m=>m===1?'1まいの鏡':`${180/m}°に合わせた2まいの鏡`;
function qText(){
  const p=P;
  if(p.kind==='tap')return p.m===1?'1まいの鏡（太い線）の左がわに、茶色の部屋のもようをかきました。鏡にうつったもようを<b>完成させよう</b>。':`${kName(p.m)}の間に、茶色の部屋のもようを入れました。鏡にうつったもようを<b>完成させよう</b>。`;
  if(p.kind==='pick')return p.m===1?'1まいの鏡の左がわに、このもようをかきました。鏡にうつすと、全体はどんなもように見える？':`${kName(p.m)}の間に、このもようを入れました。のぞくと、どんなもようが見える？`;
  if(p.kind==='src')return `${kName(p.m)}をのぞくと、このもようが見えました。2まいの鏡の間の部屋に入っていたもようは どれ？`;
  if(p.kind==='count')return `2まいの鏡を<b>${p.ang}°</b>に合わせて、間に形を1つ入れました。<b>もとの形もふくめて</b>、形は全部で何こに見える？`;
  if(p.show)return `2まいの鏡の間に<b>1つの形</b>を入れてのぞくと、このように見えました。2まいの鏡は<b>何度</b>に合わせてある？`;
  return `2まいの鏡を合わせたら、<b>もとの形もふくめて ${p.n}こ</b>に見えました。鏡は<b>何度</b>に合わせてある？`;
}
function fig(){
  const p=P;
  if(p.kind==='tap')return kDisc(p.m,p.rings,S.g,{lock0:true,tap:true,hl:S.hl});
  if(p.kind==='pick')return kDisc(p.m,p.rings,kFull(p.m,p.motif),{only0:true,px:250});
  if(p.kind==='src')return kDisc(p.m,p.rings,kFull(p.m,p.motif),{px:280});
  if(p.kind==='count')return kAngleFig(p.ang,p.show?p.motif:null);
  if(p.show)return kRing(p.n);
  return kCopies(p.n);
}
function optHTML(o,i){
  const p=P,dis=S.done||S.wrong.includes(i);
  let body;
  if(p.kind==='pick')body=kDisc(o.m,p.rings,o.F,{mirror:false,px:200,tight:true});
  else if(p.kind==='src')body=kWedge(p.m,p.rings,o.mo);
  else body=`<b style="font-size:22px">${o}${p.kind==='count'?'こ':'°'}</b>`;
  const right=(p.kind==='count'||p.kind==='angle')?o===p.a:!!o.ok;
  return `<button class="ob ${p.kind==='pick'?'kl-o':''} ${S.done&&right?'right':''} ${S.wrong.includes(i)?'wrong':''}" data-i="${i}" ${dis?'disabled':''}><span class="k">${'アイウエ'[i]}</span>${body}</button>`;
}
function hintText(){
  const p=P;
  if(p.kind==='pick')return '鏡にうつると、形は<b>うら返し</b>になります。となりの部屋は、さかいの線で折り返した形。ただ回しただけのもようは まちがいです。部屋の数も数えよう（鏡の角度が小さいほど部屋がふえる）。';
  if(p.kind==='src')return '茶色の部屋は、もようの中の部屋の1つと同じ形です。もようの中の部屋を1つえらんで、選たくしとマスを1つずつくらべよう。となりの部屋はうら返しなので、うら返しの形がまざっていても、もようは同じになることがあります。';
  if(p.kind==='count')return `円の1回りは360°。鏡の間の角度${p.ang}°の部屋が、円の中にいくつならぶかを考えよう（360÷${p.ang}）。どの部屋にも形が1つずつうつります。`;
  return p.show?'まず、見えている形がいくつあるか数えよう。形の数で360°をわると、1つの部屋の角度＝鏡の角度です。':`形が${p.n}こ見えるのは、円が${p.n}この部屋に分かれているから。360°を${p.n}でわろう。`;
}
function explain(){
  const p=P;
  if(p.kind==='tap'||p.kind==='pick'||p.kind==='src'){const n=2*p.m;
    return p.m===1?'1まいの鏡では、鏡の線で折ったように、左右がうら返しの形になります（線対称）。もとの形と鏡の中の形で2こです。'
      :`鏡の角度が${180/p.m}°なので、円は 360÷${180/p.m}＝${n}この部屋に分かれます。となりの部屋は、さかいの線（鏡や、鏡にうつった鏡）で折り返した<b>うら返し</b>の形なので、1つおきに同じ向きの形がならびます。`;}
  if(p.kind==='count')return `360÷${p.ang}＝${p.a}。円が${p.a}この部屋に分かれ、どの部屋にも形がうつるので、もとの形もふくめて${p.a}こです（鏡の中に見えるのは ${p.a-1}こ）。`;
  return `${p.show?`形は${p.n}こ見えています。`:''}${p.n}こに見えるのは、円が${p.n}この部屋に分かれているからです。360÷${p.n}＝${p.a}で、鏡は${p.a}°に合わせてあります。`;
}
function draw(){
  const p=P,tap=p.kind==='tap';
  app.innerHTML=`${topBar()}
    <p class="qq">${qText()}</p>
    <div class="boardw">${fig()}</div>
    ${tap?tapCtl():`<div class="opts4 txt">${S.opts.map(optHTML).join('')}</div>
      ${S.hint&&!S.done?`<p class="hintbox">${hintText()}</p>`:''}
      ${S.done?'':`<p class="msg ${S.msgc}" id="msg">${S.msg||'4つの中からえらぼう。'}</p><div class="row"><button class="btn" id="hint" ${S.hint?'disabled':''}>ヒント</button></div>`}`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(`<p style="margin:0">${explain()}</p>`);return;}
  if(tap){bindTap();return;}
  app.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,o=S.opts[i];
    const right=(p.kind==='count'||p.kind==='angle')?o===p.a:!!o.ok;
    if(right){S.done=true;}else{S.wrong.push(i);S.hints++;S.msg='ちがいます。もう一度よく見てみよう。';S.msgc='ng';}draw();});
  document.getElementById('hint').onclick=()=>{S.hint=true;S.hints++;S.msg='';S.msgc='';draw();};
}
function tapCtl(){
  if(S.done)return '';
  const pal=P.nc>1?`<div class="row ts-pal" style="justify-content:center">${Object.keys(KC).slice(0,P.nc).map(k=>`<button class="ts-c ${S.col===k?'on':''}" data-k="${k}"><span style="background:${KC[k]}"></span>${KCN[k]}</button>`).join('')}<button class="ts-c ${S.col==='.'?'on':''}" data-k="."><span style="background:#fff"></span>けす</button></div>`:'';
  return `${pal}<p class="msg ${S.msgc}" id="msg">${S.msg||(P.nc>1?'色をえらんで、白いマスをタップしよう。':'白いマスをタップすると色がつきます。もう一度タップで消えます。')}</p>
    <div class="row" style="justify-content:center"><button class="btn" id="hint">ヒント</button><button class="btn" id="reset">やりなおす</button></div>
    <p class="note">ヒントを使うと、まちがっているマスかぬるマスを1つ直します（星がへります）。</p>`;
}
function kLocate(x,y){
  const m=P.m,rg=P.rings,r=Math.hypot(x,y);if(r>KR)return null;
  const rs=kRad(rg.length);let k=0;while(k<rg.length-1&&r>=rs[k+1])k++;
  let th=Math.atan2(x,-y)*180/Math.PI;const a=kAl(m);let u=(((th-kOff(m))%360)+360)%360/a;
  const t=Math.floor(u)%(2*m),j=Math.min(rg[k]-1,Math.floor((u-Math.floor(u))*rg[k]));return [t,k,j];
}
function setCell(t,k,j,v){const row=S.g[t][k];S.g[t][k]=row.slice(0,j)+v+row.slice(j+1);
  const el=document.getElementById(`k${t}_${k}_${j}`);if(el)el.setAttribute('fill',v==='.'?el.dataset.base:KC[v]);}
function bindTap(){
  app.querySelectorAll('.ts-c').forEach(b=>b.onclick=()=>{S.col=b.dataset.k;draw();});
  document.getElementById('hint').onclick=hint;
  document.getElementById('reset').onclick=()=>{for(let t=1;t<2*P.m;t++)for(let k=0;k<P.rings.length;k++)for(let j=0;j<P.rings[k];j++)if(!S.lock[`${t}_${k}_${j}`])S.g[t][k]=S.g[t][k].slice(0,j)+'.'+S.g[t][k].slice(j+1);S.hl=null;S.msg='';draw();};
  const svg=document.getElementById('bd');let mode=null,last='';
  const at=e=>{const b=svg.getBoundingClientRect(),k=328/b.width;return kLocate((e.clientX-b.left)*k-164,(e.clientY-b.top)*k-164);};
  const paint=c=>{const [t,k,j]=c;if(t===0||S.lock[`${t}_${k}_${j}`])return;if(S.g[t][k][j]!==mode)setCell(t,k,j,mode);};
  svg.addEventListener('pointerdown',e=>{const c=at(e);if(!c)return;e.preventDefault();
    if(c[0]===0){say('茶色の部屋は見本です。ほかの部屋をぬろう。');return;}
    if(S.lock[c.join('_')])return;
    const cur=S.g[c[0]][c[1]][c[2]],col=P.nc>1?S.col:'1';mode=(col!=='.'&&cur===col)?'.':col;last=c.join('_');paint(c);
    try{svg.setPointerCapture(e.pointerId);}catch(_){}});
  svg.addEventListener('pointermove',e=>{if(mode==null)return;const c=at(e);if(!c)return;const kk=c.join('_');if(kk===last)return;last=kk;paint(c);});
  const end=()=>{if(mode==null)return;mode=null;check();};
  svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
}
function say(m){S.msg=m;S.msgc='';const el=document.getElementById('msg');if(el){el.textContent=m;el.className='msg';}}
function wrongCells(){const L=[];for(let t=1;t<2*P.m;t++)for(let k=0;k<P.rings.length;k++)for(let j=0;j<P.rings[k];j++)if(S.g[t][k][j]!==S.T[t][k][j])L.push([t,k,j]);return L;}
function check(){if(!wrongCells().length){S.done=true;draw();}}
function hint(){
  const W=wrongCells();if(!W.length)return;
  const c=W.find(([t,k,j])=>S.T[t][k][j]!=='.')||W[0],[t,k,j]=c;
  setCell(t,k,j,S.T[t][k][j]);S.lock[c.join('_')]=true;S.hints++;S.hl=c;
  const v=S.T[t][k][j];
  S.msg=`ヒント：光っているマスを直しました（${v==='.'?'ぬらない':KCN[v]}）。となりの部屋とは、さかいの線をはさんで、折り返した位置のマスが同じ色です。`;S.msgc='';
  if(!wrongCells().length)S.done=true;draw();
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
