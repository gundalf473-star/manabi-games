  --ink:#b3a6f0; --seal:#b79cff; --sealsoft:#271c40; --ok:#4cc184; --oksoft:#1b3326; --ng:#f07468; --ngsoft:#3a2220; --gold:#e1b44a; --pick:#28241e; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 64px}

.pad button.er{font-size:15px;min-width:60px}

.ob .k{align-self:flex-start;font-size:12px;font-weight:700;width:22px;height:22px;border-radius:50%;background:var(--pick);display:grid;place-items:center}
.ob:hover:not(:disabled){border-color:var(--ink)}
.ob.right{border-color:var(--ok);background:var(--oksoft)} .ob.wrong{border-color:var(--ng);background:var(--ngsoft);opacity:.6}

.ccard,.pcard{border:2px solid #93c5fd;background:#eff6ff;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:#1e3a8a}
.pcard{align-self:flex-start;padding:3px 10px}
.ccard.loop,.pcard.loop{border-color:#fbbf24;background:#fffbeb;color:#92400e}

.itk{color:#a97c12}
</style>

<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>石とび 100問</h1>
    <p class="lead">となりの石をとびこえて、石を1個までへらそう。5つのレベルに20問ずつ。ヒントや「はじめから」を使わずにクリアすると★3つ（「1手もどす」は何回でも使えます）。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=true;
let QS=[];
const ID='ishitobi';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>石とび 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* 石とび（ペグ・ソリテア）
   p={kind:'one'|'target'|'n', rows:['###',…]（#が穴）, s:[石のある穴の番号], t:★の穴の番号（target）, n:のこす数, sol:[[from,over,to],…]}
   穴の番号は、rows を左上から右へ読んだ順（gen_ishitobi.py と同じ） */
const HINTWORD='ヒントや「はじめから」';
const LVD={1:'1列や小さい形・石3〜5個',2:'石4〜5個・2個のこす問題も',3:'石6〜7個・★の穴にのこす',4:'石8〜11個・大きい盤',5:'十字の盤・石10〜14個'};
const RULES=`<ol class="rules">
  <li>石は、<b>となりの石をとびこえて</b>、すぐ向こうの<b>空いた穴</b>へ動かせます。とびこされた石は取りのぞきます。</li>
  <li>とべるのは<b>たて・横</b>だけ。ななめにはとべません。</li>
  <li>動かしたい石をタップして、光った穴をタップ。</li>
  <li>石を<b>1個だけ</b>のこせばクリア。<b class="itk">★</b>の印がある問題は、★の穴に1個のこします。「2個までへらす」問題もあります。</li>
  <li>動けなくなったら「1手もどす」。<b>「1手もどす」は何回使っても星はへりません</b>。ヒント（次の一手がわかります）と「はじめから」を使うと、星がへります。</li></ol>`;
let GB=null;
function mkBoard(rows){const cells=[],idx={};rows.forEach((row,r)=>[...row].forEach((ch,c)=>{if(ch==='#'){idx[r+','+c]=cells.length;cells.push([r,c]);}}));
  const J=[];cells.forEach(([r,c],a)=>{for(const [dr,dc] of [[0,1],[1,0],[0,-1],[-1,0]]){const b=idx[(r+dr)+','+(c+dc)],t=idx[(r+2*dr)+','+(c+2*dc)];if(b!==undefined&&t!==undefined)J.push([a,b,t]);}});
  return {rows,cells,J,n:cells.length,H:rows.length,W:Math.max(...rows.map(x=>x.length))};}
const cnt=st=>st.reduce((a,b)=>a+(b?1:0),0);
const legalM=st=>GB.J.filter(([a,b,t])=>st[a]&&st[b]&&!st[t]);
function goalOK(st){const k=cnt(st);if(P.kind==='n')return k===P.n;if(k!==1)return false;return P.kind==='one'||st[P.t];}
function solveFrom(st){ /* 今の形から、クリアまでの手順（なければ null）。行き止まりの形をおぼえて探す */
  const dead=new Set();
  const rec=s=>{if(goalOK(s))return [];const k=s.map(x=>x?1:0).join('');if(dead.has(k))return null;
    const c=cnt(s);if(c<=(P.kind==='n'?P.n:1)){dead.add(k);return null;}
    for(const m of legalM(s)){const u=s.slice();u[m[0]]=false;u[m[1]]=false;u[m[2]]=true;const r=rec(u);if(r)return [m].concat(r);}
    dead.add(k);return null;};
  return rec(st);}
function startStage(p){P=p;GB=mkBoard(p.rows);S={hints:0,done:false};reset();begin(p);draw();}
function reset(){S.st=Array.from({length:GB.n},(_,i)=>P.s.includes(i));S.hist=[];S.sel=-1;S.msg='';S.msgc='';S.hint=null;S.last=-1;}
const U=64,MG=10;
const XY=i=>{const [r,c]=GB.cells[i];return [MG+c*U+U/2,MG+r*U+U/2];};
function boardSVG(){
  const W=GB.W*U+2*MG,H=GB.H*U+2*MG;let s='';
  GB.cells.forEach(([r,c])=>{s+=`<rect x="${MG+c*U+2}" y="${MG+r*U+2}" width="${U-4}" height="${U-4}" rx="12" fill="#e9dcc0" stroke="#d2c19e"/>`;});
  const dests=S.sel>=0?legalM(S.st).filter(m=>m[0]===S.sel).map(m=>m[2]):[];
  const hm=S.hint&&S.hint.m;
  GB.cells.forEach((_,i)=>{const [x,y]=XY(i);
    s+=`<circle cx="${x}" cy="${y}" r="${U*0.2}" fill="#bfa77a"/>`;
    if(S.st[i]){const on=i===S.sel,hf=hm&&hm[0]===i;
      if(on||hf)s+=`<circle cx="${x}" cy="${y}" r="${U*0.43}" fill="none" stroke="${on?'#7c3aed':'#facc15'}" stroke-width="5"/>`;
      s+=`<circle cx="${x}" cy="${y+2}" r="${U*0.34}" fill="#3f3a52"/><circle cx="${x}" cy="${y}" r="${U*0.34}" fill="${i===S.last?'#5b4fa8':'#4a4566'}"/><circle cx="${x-U*0.11}" cy="${y-U*0.11}" r="${U*0.09}" fill="#fff" opacity=".45"/>`;}
    if(dests.includes(i))s+=`<circle cx="${x}" cy="${y}" r="${U*0.3}" fill="#ede4fd" stroke="#7c3aed" stroke-width="4" stroke-dasharray="6 4"/>`;
    if(hm&&hm[2]===i&&!dests.includes(i))s+=`<circle cx="${x}" cy="${y}" r="${U*0.3}" fill="#fef9c3" stroke="#facc15" stroke-width="4" stroke-dasharray="6 4"/>`;
    if(!S.st[i]&&P.kind==='target'&&i===P.t)s+=`<path d="${star(x,y,U*0.3,U*0.13)}" fill="none" stroke="#a97c12" stroke-width="3" stroke-linejoin="round"/>`;
    s+=`<rect x="${x-U/2}" y="${y-U/2}" width="${U}" height="${U}" fill="transparent" data-i="${i}" style="cursor:pointer"/>`;});
  return `<svg id="bd" viewBox="0 0 ${W} ${H}" style="max-width:${Math.min(W*1.15,460)}px" role="img" aria-label="石とびの盤">${s}</svg>`;
}
function star(cx,cy,R1,R2){let d='';for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,rr=k%2?R2:R1;d+=(k?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)).toFixed(1);}return d+'Z';}
function goalText(){
  if(P.kind==='n')return `石を<b>${P.n}個</b>までへらそう。`;
  if(P.kind==='target')return `石を<b>1個</b>だけ、<b class="itk">★</b>の穴にのこそう。`;
  return `石を<b>1個</b>だけのこそう。`;
}
function explain(){
  const k=P.s.length-cnt(S.st);
  let t=`${k}回とんで、${P.kind==='n'?`のこり${P.n}個`:'のこり1個'}！ `;
  if(P.kind==='n')t+=`この形は、どうとんでも ${P.n}個より少なくはできません（コンピューターが全部の動かし方を調べて確かめました）。`;
  else if(P.kind==='target')t+='★にのこすには、<b>最後の1回のとび</b>が★に着地しなければなりません。ゴールから逆に考えるのもコツです。';
  else if(P.lv<=2)t+='はなれた石をのこすと、とべなくなります。石どうしを<b>近くに集める</b>ようにとぶのがコツです。';
  else t+='はしにぽつんとのこった石は助けられません。<b>はしの石から先に</b>片づけるのがコツです。';
  return t;
}
function draw(){
  const moves=legalM(S.st),stuck=!S.done&&!moves.length;
  app.innerHTML=`${topBar()}
    <p class="qq" style="font-size:16px">となりの石をとびこえよう。${goalText()}</p>
    <div class="row" style="justify-content:space-between"><span class="note">はじめ ${P.s.length}個</span><b style="font-size:18px">のこり ${cnt(S.st)}個</b></div>
    <div class="boardw">${boardSVG()}</div>
    ${S.done?'':`<p class="msg ${S.msgc}" id="msg">${S.msg||(stuck?'':S.sel>=0?'光った穴をタップしよう。':'動かす石をタップしよう。')}</p>
    ${S.hint&&S.hint.txt?`<p class="hintbox">${S.hint.txt}</p>`:''}
    <div class="row"><button class="btn" id="hint">ヒント</button><button class="btn" id="undo" ${S.hist.length?'':'disabled'}>1手もどす</button><button class="btn" id="restart" ${S.hist.length?'':'disabled'}>はじめから</button></div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(`<p style="margin:0">${explain()}</p>`);return;}
  document.querySelectorAll('#bd [data-i]').forEach(e=>e.addEventListener('click',()=>tap(+e.dataset.i)));
  document.getElementById('hint').onclick=()=>{S.hints++;S.sel=-1;const sol=solveFrom(S.st);
    if(sol&&sol.length){S.hint={m:sol[0],txt:'黄色の石を、黄色の穴へとばそう。'};}
    else S.hint={m:null,txt:'今の形からは、もうクリアできません。「1手もどす」で前の形にもどろう。'};
    S.msg='';draw();};
  document.getElementById('undo').onclick=()=>{if(!S.hist.length)return;S.st=S.hist.pop();S.sel=-1;S.hint=null;S.last=-1;S.msg='1手もどしました。';S.msgc='';draw();};
  document.getElementById('restart').onclick=()=>{if(!S.hist.length)return;S.hints++;reset();draw();};
}
function tap(i){
  if(S.done)return;
  const ms=legalM(S.st);
  if(S.sel>=0&&!S.st[i]){const m=ms.find(m=>m[0]===S.sel&&m[2]===i);
    if(!m){S.msg='そこには行けません。光った穴をえらぼう。';S.msgc='ng';draw();return;}
    S.hist.push(S.st.slice());S.st[m[0]]=false;S.st[m[1]]=false;S.st[m[2]]=true;S.sel=-1;S.last=m[2];S.hint=null;S.msg='';S.msgc='';
    if(goalOK(S.st)){S.done=true;}
    else if(!legalM(S.st).length){const k=cnt(S.st);
      S.msg=P.kind==='target'&&k===1?'1個になったけれど、★の穴ではありません。「1手もどす」でやり直そう。':`もうとべる石がありません（のこり${k}個）。「1手もどす」でやり直そう。`;S.msgc='ng';}
    draw();return;}
  if(S.st[i]){
    if(S.sel===i){S.sel=-1;S.msg='';S.msgc='';draw();return;}
    if(!ms.some(m=>m[0]===i)){S.sel=-1;S.msg='その石は、今はとべません。となりに石があって、その向こうが空いている石をえらぼう。';S.msgc='ng';draw();return;}
    S.sel=i;S.msg='';S.msgc='';draw();return;}
  S.msg=S.sel>=0?'':'先に、動かす石をタップしよう。';S.msgc='';draw();
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
