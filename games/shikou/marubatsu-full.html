<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>○×ならべ 100問</h1>
    <p class="lead">コンピューターと交代に○と×を置いて、3つならべよう。5つのレベルに20問ずつ。ヒントややり直しなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=true;
let QS=[];
const ID='marubatsu';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>○×ならべ 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* ○×ならべ：p={kind:'game'|'puz', n:3|4, b:盤（'.'空き 'o'あなた 'x'コンピューター '#'置けない）, first:'you'|'cpu', cpu:'weak'|'mid'|'perfect',
   goal:'nolose'|'win'（game）, m:何手以内に勝つ（puz）, key:勝てる最初の一手（puz）} */
const HINTWORD='ヒントややり直し';
const LVD={1:'よわい相手・1手で勝つ',2:'ふつうの相手・2手で勝つ',3:'ミスしない相手と引き分け',4:'4×4の盤・先手必勝',5:'4×4・置けないマスあり'};
const RULES=`<ol class="rules">
  <li>あなたは <b class="mo">○</b>、コンピューターは <b class="mx">×</b>。交代にマスに置いて、<b>たて・横・ななめに3つ</b>ならべたら勝ち。</li>
  <li>対戦のステージは、<b>負けなければ（勝つか引き分けで）クリア</b>。「勝ったらクリア」のステージもあります。</li>
  <li>「<b>○手で勝て</b>」の問題は、相手がどう打っても、決まった手数以内に3つならべればクリア。</li>
  <li>レベル4からは 4×4 の盤（3つならべれば勝ち）。<b class="blk">■</b> のマスには置けません。</li>
  <li>ヒントを使うと、おすすめのマスが光ります（星がへります）。</li></ol>`;
const LNS={};
function lines(n){if(LNS[n])return LNS[n];const L=[];for(let r=0;r<n;r++)for(let c=0;c<n;c++)for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){const cs=[];for(let i=0;i<3;i++)cs.push([r+i*dr,c+i*dc]);if(cs.every(([a,b])=>a>=0&&b>=0&&a<n&&b<n))L.push(cs.map(([a,b])=>a*n+b));}return LNS[n]=L;}
function winLine(b){const n=Math.round(Math.sqrt(b.length));for(const l of lines(n)){const a=b[l[0]];if((a==='o'||a==='x')&&b[l[1]]===a&&b[l[2]]===a)return l;}return null;}
const put=(b,i,t)=>b.slice(0,i)+t+b.slice(i+1);
const emp=b=>{const o=[];for(let i=0;i<b.length;i++)if(b[i]==='.')o.push(i);return o;};
const OT={o:'x',x:'o'};
const threats=(b,t)=>emp(b).filter(i=>{const l=winLine(put(b,i,t));return l&&b[l[0]]!==undefined&&put(b,i,t)[l[0]]===t;});
let TT=new Map();
function neg(b,t,a,be){ /* 番の人から見た値：勝ち=正（早いほど大）、引き分け=0、負け=負 */
  if(winLine(b))return -(emp(b).length+1);
  const E=emp(b);if(!E.length)return 0;
  const key=b+t,e=TT.get(key);
  if(e){if(e.f===0)return e.v;if(e.f===1&&e.v>=be)return e.v;if(e.f===-1&&e.v<=a)return e.v;}
  let best=-999;const a0=a;
  for(const i of order(b,E,t)){const v=-neg(put(b,i,t),OT[t],-be,-a);if(v>best)best=v;if(best>a)a=best;if(a>=be)break;}
  TT.set(key,{v:best,f:best<=a0?-1:best>=be?1:0});return best;
}
const CW={};
function order(b,E,t){ /* 先に調べる順：すぐ勝てる手→相手のリーチをふさぐ手→線がたくさん通るマス */
  const n=Math.round(Math.sqrt(b.length));if(!CW[n]){CW[n]=Array(n*n).fill(0);lines(n).forEach(l=>l.forEach(i=>CW[n][i]++));}
  const sc=i=>{let k=CW[n][i];for(const l of lines(n))if(l.includes(i)){let me=0,op=0;for(const j of l){if(b[j]===t)me++;else if(b[j]===OT[t])op++;}if(me===2&&op===0)k+=100;if(op===2&&me===0)k+=50;}return k;};
  return E.map(i=>[sc(i),i]).sort((x,y)=>y[0]-x[0]).map(x=>x[1]);}
function bestMoves(b,t){ /* いちばんよい手を全部（同じ値の手） */
  if(TT.size>2e6)TT=new Map();
  const v=neg(b,t,-999,999),list=[];
  for(const i of emp(b)){const r=neg(put(b,i,t),OT[t],-v,-v+1);if(r<=-v)list.push(i);}
  return {list,v};}
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function cpuMove(){
  const b=S.b,E=emp(b);
  if(P.cpu==='weak')return rnd(E);
  if(P.cpu==='mid'){const w=threats(b,'x');if(w.length)return rnd(w);const bl=threats(b,'o');if(bl.length)return rnd(bl);return rnd(E);}
  return rnd(bestMoves(b,'x').list);
}
const CPUN={weak:'よわい',mid:'ふつう',perfect:'つよい（ミスしない）'};
function startStage(p){P=p;TT=new Map();S={hints:0,done:false};reset();begin(p);draw();if(S.turn==='x')cpuSoon();}
function reset(){S.b=P.b;S.turn=P.first==='you'?'o':'x';S.over=null;S.mine=0;S.last=-1;S.rec=[];S.msg='';S.msgc='';S.hint=0;S.wl=null;S.startX=threats(P.b,'x').length>0;}
function boardSVG(){
  const n=P.n,U=n===3?100:80,M=6,W=n*U+2*M;let s='';
  for(let i=0;i<n*n;i++){const r=Math.floor(i/n),c=i%n,x=M+c*U,y=M+r*U,ch=S.b[i];
    const hl=S.rec.includes(i)&&!S.over&&!S.done, key=(S.done||S.over)&&P.kind==='puz'&&P.key.includes(i);
    s+=`<rect x="${x+3}" y="${y+3}" width="${U-6}" height="${U-6}" rx="10" fill="${ch==='#'?'#57534e':hl?'#fde68a':i===S.last?'#ede4fd':'#fffdf7'}" stroke="${hl?'#d97706':'#d9cfb8'}" stroke-width="${hl?4:2}" data-c="${i}" style="cursor:${ch==='.'?'pointer':'default'}"/>`;
    const cx=x+U/2,cy=y+U/2,k=U*0.28;
    if(ch==='#')s+=`<path d="M${x+14} ${y+U-14}L${x+U-14} ${y+14}" stroke="#78716c" stroke-width="6" pointer-events="none"/>`;
    if(ch==='o')s+=`<circle cx="${cx}" cy="${cy}" r="${k}" fill="none" stroke="#7c3aed" stroke-width="${U*0.1}" pointer-events="none"/>`;
    if(ch==='x')s+=`<path d="M${cx-k} ${cy-k}L${cx+k} ${cy+k}M${cx+k} ${cy-k}L${cx-k} ${cy+k}" stroke="#ea580c" stroke-width="${U*0.1}" stroke-linecap="round" pointer-events="none"/>`;
    if(key&&P.b[i]==='.')s+=`<text x="${x+16}" y="${y+26}" font-size="20" fill="#a97c12" font-weight="700" pointer-events="none">★</text>`;}
  if(S.wl){const p=j=>[M+(j%n)*U+U/2,M+Math.floor(j/n)*U+U/2];const a=p(S.wl[0]),z=p(S.wl[2]);
    s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${z[0]}" y2="${z[1]}" stroke="${S.b[S.wl[0]]==='o'?'#7c3aed':'#ea580c'}" stroke-width="10" stroke-linecap="round" opacity=".45" pointer-events="none"/>`;}
  return `<svg id="bd" viewBox="0 0 ${W} ${W}" style="max-width:${n===3?330:360}px" role="img" aria-label="${n}×${n}の盤">${s}</svg>`;
}
function qline(){
  if(P.kind==='puz')return `【${P.m}手で勝て】あなた（○）の番です。相手がどう打っても、<b>あなたの${P.m===1?'次の1手':'2手目まで'}で3つならべよう</b>。`;
  return `${P.n}×${P.n}の盤。相手：<b>${CPUN[P.cpu]}</b>コンピューター。${P.first==='you'?'<b>あなたが先手</b>':'<b>コンピューターが先手</b>'}。<b>${P.goal==='win'?'勝ったらクリア':'負けなければクリア'}</b>。`;
}
function idea(){
  if(threats(S.b,'o').length)return 'あと1つで3つならぶ所があります。さがしてみよう。';
  if(threats(S.b,'x').length)return '相手（×）があと1つで3つならびそうです。まずは、そこをふさごう。';
  if(P.kind==='puz'&&P.m===2)return '<b>リーチ</b>（あと1つでならぶ形）を<b>2つ同時に</b>つくると、相手は1つしかふさげません。これをダブルリーチといいます。';
  if(P.b.includes('#'))return '置けないマスがあると、ならびの線が少なくなります。相手がダブルリーチをつくれそうな所を先にふさぎ、自分のリーチも作っていこう。';
  if(P.n===4)return '真ん中の4マスは、ならびの線がたくさん通る大事なマス。2つのリーチを同時につくれる形をねらおう。';
  return '真ん中や角は、ならびの線がたくさん通る大事なマスです。相手のダブルリーチの形も先にふさごう。';
}
function explain(){
  if(P.kind==='puz'){
    if(P.m===1)return `★のマスに置くと3つならびます。${S.startX?'相手（×）もリーチでしたが、先に自分が3つならべれば勝ちです。':''}`;
    return `★のマスに置くと、${S.startX?'相手のリーチをふさぎながら、':''}<b>リーチが2つ</b>できます（ダブルリーチ）。相手は1つしかふさげないので、次の手で必ず勝てます。`;}
  const res=S.over==='win'?'勝ち！':'引き分け！';
  if(P.n===3)return `${res} ○×ならべ（3×3）は、おたがいにまちがえなければ、必ず<b>引き分け</b>になるゲームです。相手の<b>リーチ</b>（あと1つで3つならぶ形）をふさぎ、リーチを2つ同時につくられる形（ダブルリーチ）をさけていれば負けません。${S.over==='win'?'相手のミスをのがさず勝てました。':''}`;
  if(P.b.includes('#'))return `${res} 置けないマスがあると、ならびの線がへって、勝ちやすさが変わります。この盤は、あなたが正しく打てば<b>負けない</b>形でした。`;
  return `${res} 4×4の盤で3つならべるルールでは、${P.first==='you'?'<b>先手が正しく打てば必ず勝てます。これを「先手必勝」といいます</b>。':'この形は、あなたが正しく打てば必ず勝てる形でした。何も置いていない4×4の盤なら、<b>先手が正しく打てば必ず勝てます（先手必勝）</b>。'}真ん中の4マスを使って、ダブルリーチをつくるのがコツです。（3×3では先手でも勝ちきれず、引き分けになります。）`;
}
function draw(){
  const youTurn=S.turn==='o'&&!S.over&&!S.done;
  app.innerHTML=`${topBar()}
    <p class="qq" style="font-size:16px">${qline()}</p>
    <div class="boardw">${boardSVG()}</div>
    <p class="msg ${S.msgc}" id="msg">${S.msg||(S.done?'':youTurn?'あなた（○）の番です。マスをタップしよう。':S.over?'':'コンピューター（×）が考えています…')}</p>
    ${S.over&&!S.done?`<div class="row"><button class="btn go" id="retry">もう一度</button></div>`:''}
    ${S.hint&&!S.done&&!S.over?`<p class="hintbox">${idea()}${S.rec.length?'<br>黄色のマスがおすすめです。':''}</p>`:''}
    ${S.done?'':`<div class="row"><button class="btn" id="hint" ${youTurn?'':'disabled'}>ヒント</button><button class="btn" id="restart">はじめから</button></div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(`<p style="margin:0">${explain()}</p>`);return;}
  document.querySelectorAll('#bd [data-c]').forEach(r=>r.addEventListener('click',()=>tap(+r.dataset.c)));
  const h=document.getElementById('hint');if(h)h.onclick=()=>{S.hints++;S.hint=1;S.msg='';
    const bm=bestMoves(S.b,'o');S.rec=bm.list.slice(0,P.kind==='puz'?2:3);draw();};
  document.getElementById('restart').onclick=()=>{if(S.b!==P.b)S.hints++;reset();draw();if(S.turn==='x')cpuSoon();};
  const rt=document.getElementById('retry');if(rt)rt.onclick=()=>{S.hints++;reset();draw();if(S.turn==='x')cpuSoon();};
}
function finish(){
  const wl=winLine(S.b);
  if(wl){S.wl=wl;const w=S.b[wl[0]];S.over=w==='o'?'win':'lose';}
  else if(!emp(S.b).length)S.over='draw';
  else if(P.kind==='puz'&&S.mine>=P.m&&S.turn==='x'){S.over='lose';S.msg=`${P.m}手以内に3つならべられませんでした。もう一度考えよう。`;S.msgc='ng';return true;}
  if(!S.over)return false;
  if(P.kind==='puz'){if(S.over==='win'&&S.mine<=P.m)S.done=true;else{S.msg=S.over==='lose'?'コンピューターに3つならべられてしまいました。':'引き分けになりました。';S.over='lose';S.msgc='ng';}}
  else{const ok=S.over==='win'||(S.over==='draw'&&P.goal==='nolose');
    if(ok)S.done=true;else{S.msg=S.over==='lose'?'コンピューターに3つならべられました。あなたの負け…':'引き分け。このステージは勝たないとクリアになりません。';S.msgc='ng';}}
  return true;
}
function tap(i){
  if(S.done||S.over||S.turn!=='o'||S.b[i]!=='.')return;
  S.b=put(S.b,i,'o');S.mine++;S.last=i;S.rec=[];S.hint=0;S.msg='';S.turn='x';
  if(finish()){draw();return;}
  draw();cpuSoon();
}
function cpuSoon(){const p=P,s=S;setTimeout(()=>{if(P!==p||S!==s||S.over||S.done||S.turn!=='x')return;
  const i=cpuMove();S.b=put(S.b,i,'x');S.last=i;S.turn='o';finish();draw();},550);}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
