<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>一方通行の町</h1>
    <p class="lead">矢印の向きにだけ進める町で、家から学校へ行こう。道順を数えたり、矢印を1本おいたりする問題もあります。5つのレベルから1問ずつ。ヒントやまちがいなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=false;
let QS=[{"R":3,"C":3,"h":["\u003c=",".\u003c","\u003c\u003c"],"v":["v^v","v.v"],"H":[1,2],"G":[1,0],"min":4,"kind":"route","short":false,"id":"1-01","lv":1},{"R":4,"C":4,"h":["=\u003c\u003c","\u003c\u003c>",">>\u003c","..\u003c"],"v":["v^v^","^v^v","v^v|"],"H":[3,3],"G":[0,3],"min":5,"kind":"route","short":false,"id":"2-01","lv":2},{"R":4,"C":4,"h":["\u003c\u003c>","=>\u003c",">=?","==>"],"v":["^|?|","^^^^","v^^^"],"H":[3,3],"G":[0,0],"kind":"fix","valid":[["h",2,2,"\u003c",6],["v",0,2,"^",6]],"id":"3-01","lv":3},{"R":4,"C":4,"h":[">>>","\u003c>>",">\u003c>",">>\u003c"],"v":[".vvv","vvvv","^^vv"],"H":[0,0],"G":[3,2],"kind":"count","a":7,"ds":[6,9,8],"id":"4-01","lv":4},{"R":5,"C":5,"h":[">\u003c>=","\u003c\u003c==",">\u003c>\u003c",">=\u003c=","\u003c>=>"],"v":["v|^vv","^^vv|","vv^v^","^^v^v"],"H":[0,2],"G":[4,2],"K":[2,1],"min":8,"kind":"route","short":true,"id":"5-01","lv":5}];
const ID='ippou';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>一方通行の町 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* 一方通行の町：p={kind:'route'|'count'|'fix', R,C, h:[…], v:[…], H:[r,c], G:[r,c], K?:[r,c], min, short, a, ds, valid}
   h[r][c]: (r,c)-(r,c+1) の道  '.'なし '>'東へ '<'西へ '='両方 '?'矢印が消えた道
   v[r][c]: (r,c)-(r+1,c) の道  '.'なし 'v'南へ '^'北へ '|'両方 '?' */
const HINTWORD='ヒントやまちがい';
const LVD={1:'小さな町で家から学校へ',2:'大きな町・道順を数える',3:'矢印を1本おく・パン屋によって',4:'道順を数える・矢印を1本おく（大きな町）',5:'パン屋によっていちばん近い道・たくさんの道順'};
const RULES=`<ol class="rules">
  <li>道の<b>矢印の向きにだけ</b>進めます。白い点線の道（矢印なし）は、どちら向きにも通れます。</li>
  <li><b>交差点をタップ</b>（または指でなぞる）すると、となりの交差点へ1つずつ進みます。「1つもどる」で取り消せます。</li>
  <li>「パン屋によって」の問題は、パン屋の交差点を通ってから学校へ。「いちばん近い道で」の問題は、通る道の本数がいちばん少なくなるように進もう。</li>
  <li>「<b>？</b>」の道は矢印が消えていて、そのままでは通れません。「矢印を1本おく」問題では、<b>どれか1本の「？」</b>をタップして向きを決め、家から学校へ行けるようにしよう。</li>
  <li>「道順を数える」問題は、家から学校まで、矢印どおりに進む行き方が全部で何通りあるかを答えます。</li></ol>`;
const U=72, M=40;
const key=(r,c)=>r+','+c;
function edgeCh(t,r,c){const x=t==='h'?P.h[r][c]:P.v[r][c];if(x==='?'&&S&&S.fix&&S.fix[0]===t&&S.fix[1]===r&&S.fix[2]===c)return S.fix[3];return x;}
function moves(r,c){const o=[];
  if(c+1<P.C&&'>='.includes(edgeCh('h',r,c)))o.push([r,c+1]);
  if(c>0&&'<='.includes(edgeCh('h',r,c-1)))o.push([r,c-1]);
  if(r+1<P.R&&'v|'.includes(edgeCh('v',r,c)))o.push([r+1,c]);
  if(r>0&&'^|'.includes(edgeCh('v',r-1,c)))o.push([r-1,c]);
  return o;}
function roadBetween(a,b){ /* 道の記号（なければ '.'） */
  if(a[0]===b[0]&&Math.abs(a[1]-b[1])===1)return edgeCh('h',a[0],Math.min(a[1],b[1]));
  if(a[1]===b[1]&&Math.abs(a[0]-b[0])===1)return edgeCh('v',Math.min(a[0],b[0]),a[1]);
  return null;}
const canGo=(a,b)=>moves(a[0],a[1]).some(x=>x[0]===b[0]&&x[1]===b[1]);
const same=(a,b)=>a&&b&&a[0]===b[0]&&a[1]===b[1];
/* (交差点, パン屋によったか) でBFS。goal までの最短の本数と、次の一手 */
function bfsFrom(src,fl){
  const st=k=>k[0]+','+k[1]+','+(k[2]?1:0);const s=[src[0],src[1],fl||(P.K&&same(src,P.K))];
  const d={},pr={};d[st(s)]=0;const q=[s];
  while(q.length){const x=q.shift();
    if(same(x,P.G)&&(!P.K||x[2])){const path=[x];let k=st(x);while(pr[k]){path.unshift(pr[k]);k=st(pr[k]);}return {d:d[st(x)],path};}
    for(const y of moves(x[0],x[1])){const ns=[y[0],y[1],x[2]||(P.K&&same(y,P.K))];const k=st(ns);if(d[k]==null){d[k]=d[st(x)]+1;pr[k]=x;q.push(ns);}}}
  return null;}
function reach(src){const seen={};seen[key(...src)]=1;const q=[src];while(q.length){const x=q.shift();for(const y of moves(x[0],x[1]))if(!seen[key(...y)]){seen[key(...y)]=1;q.push(y);}}return seen;}
function reachTo(dst){const out={};for(let r=0;r<P.R;r++)for(let c=0;c<P.C;c++)if(reach([r,c])[key(...dst)])out[key(r,c)]=1;return out;}
/* 道順の数（DAGの問題だけ）：ways[v]＝家から v までの道順の数 */
function countWays(){const memo={};const H=P.H;
  const pred=(r,c)=>{const o=[];for(const [a,b] of [[r,c-1],[r,c+1],[r-1,c],[r+1,c]])if(a>=0&&b>=0&&a<P.R&&b<P.C&&canGo([a,b],[r,c]))o.push([a,b]);return o;};
  const f=(r,c,depth)=>{const k=key(r,c);if(memo[k]!=null)return memo[k];if(depth>60)return 0;let s=same([r,c],H)?1:0;for(const [a,b] of pred(r,c))s+=f(a,b,depth+1);return memo[k]=s;};
  const w={};for(let r=0;r<P.R;r++)for(let c=0;c<P.C;c++)w[key(r,c)]=f(r,c,0);return w;}
function allPaths(){const out=[];const go=(x,seen,path)=>{if(same(x,P.G)){out.push(path.slice());return;}if(out.length>200)return;
  for(const y of moves(x[0],x[1]))if(!seen[key(...y)]){seen[key(...y)]=1;path.push(y);go(y,seen,path);path.pop();delete seen[key(...y)];}};
  const s={};s[key(...P.H)]=1;go(P.H,s,[P.H]);return out;}
const X=c=>M+c*U, Y=r=>M+r*U;
function icon(kind,cx,cy,sm){
  const s=sm?.6:1;let o=`<g transform="translate(${cx},${cy}) scale(${s})">`;
  if(kind==='H')o+=`<polygon points="-17,-2 0,-19 17,-2" fill="#e0342f" stroke="#7a1d18" stroke-width="2" stroke-linejoin="round"/><rect x="-12" y="-3" width="24" height="18" fill="#fff7e6" stroke="#7a1d18" stroke-width="2"/><rect x="-4" y="5" width="8" height="10" fill="#b45309"/>`;
  if(kind==='G')o+=`<rect x="-17" y="-8" width="34" height="23" fill="#fef3c7" stroke="#1e3a8a" stroke-width="2"/><polygon points="-19,-8 0,-18 19,-8" fill="#2563eb" stroke="#1e3a8a" stroke-width="2" stroke-linejoin="round"/><circle cx="0" cy="-2" r="4" fill="#fff" stroke="#1e3a8a" stroke-width="1.5"/><rect x="-4" y="7" width="8" height="8" fill="#1e3a8a"/><rect x="-13" y="3" width="6" height="5" fill="#93c5fd"/><rect x="7" y="3" width="6" height="5" fill="#93c5fd"/>`;
  if(kind==='K')o+=`<rect x="-15" y="-6" width="30" height="20" fill="#fff" stroke="#92400e" stroke-width="2"/><path d="M-18,-6 L-15,-16 L15,-16 L18,-6 Z" fill="#f59e0b" stroke="#92400e" stroke-width="2" stroke-linejoin="round"/><path d="M-10,-6 v-10 M0,-6 v-10 M10,-6 v-10" stroke="#fff" stroke-width="3"/><ellipse cx="0" cy="5" rx="9" ry="5.5" fill="#d97706" stroke="#92400e" stroke-width="1.5"/><path d="M-4,2 l2,5 M1,1 l2,5" stroke="#fde68a" stroke-width="1.5"/>`;
  o+='</g>';
  if(!sm){const t={H:'家',G:'学校',K:'パン屋'}[kind];o+=`<text x="${cx}" y="${cy+30}" text-anchor="middle" font-size="13" font-weight="700" fill="#2a2520" stroke="#fff" stroke-width="4" paint-order="stroke" font-family="sans-serif">${t}</text>`;}
  return o;}
function arrowAt(x1,y1,x2,y2,col,sz,ln){const mx=(x1+x2)/2,my=(y1+y2)/2,dx=Math.sign(x2-x1),dy=Math.sign(y2-y1);
  return `<polygon points="${mx+dx*sz},${my+dy*sz} ${mx-dx*sz*.7-dy*sz*.85},${my-dy*sz*.7+dx*sz*.85} ${mx-dx*sz*.7+dy*sz*.85},${my-dy*sz*.7-dx*sz*.85}" fill="${col}"${ln?` stroke="${ln}" stroke-width="1.6" stroke-linejoin="round"`:''}/>`;}
function mapSVG(o){
  o=o||{};const sm=!!o.small, W=(P.C-1)*U+2*M, Hh=(P.R-1)*U+2*M;let s=`<rect x="0" y="0" width="${W}" height="${Hh}" rx="10" fill="#eef3e4"/>`;
  for(let r=0;r<P.R-1;r++)for(let c=0;c<P.C-1;c++){const t=(r*5+c*3)%3;
    s+=`<rect x="${X(c)+14}" y="${Y(r)+14}" width="${U-28}" height="${U-28}" rx="6" fill="${t===0?'#d6e7c4':t===1?'#f1e4cc':'#e4dcef'}"/>`;
    if(!sm&&t===1)s+=`<polygon points="${X(c)+U/2-12},${Y(r)+U/2} ${X(c)+U/2},${Y(r)+U/2-11} ${X(c)+U/2+12},${Y(r)+U/2}" fill="#d9b991"/><rect x="${X(c)+U/2-9}" y="${Y(r)+U/2}" width="18" height="11" fill="#e9d3b0"/>`;
    if(!sm&&t===0)s+=`<circle cx="${X(c)+U/2-7}" cy="${Y(r)+U/2+2}" r="7" fill="#9cc48a"/><circle cx="${X(c)+U/2+7}" cy="${Y(r)+U/2-3}" r="8" fill="#86b873"/>`;}
  const edges=[];
  for(let r=0;r<P.R;r++)for(let c=0;c<P.C-1;c++)if(P.h[r][c]!=='.')edges.push(['h',r,c,X(c),Y(r),X(c+1),Y(r)]);
  for(let r=0;r<P.R-1;r++)for(let c=0;c<P.C;c++)if(P.v[r][c]!=='.')edges.push(['v',r,c,X(c),Y(r),X(c),Y(r+1)]);
  for(const [t,r,c,x1,y1,x2,y2] of edges){const raw=t==='h'?P.h[r][c]:P.v[r][c];
    s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${raw==='?'?'#cfc8bc':'#8a8379'}" stroke-width="${sm?14:20}" stroke-linecap="round"/>`;}
  for(const [t,r,c,x1,y1,x2,y2] of edges){const raw=t==='h'?P.h[r][c]:P.v[r][c], ch=edgeCh(t,r,c);
    if(raw==='?'){
      if(ch!=='?'){const fw=(ch==='>'||ch==='v');s+=fw?arrowAt(x1,y1,x2,y2,'#7c3aed',13):arrowAt(x2,y2,x1,y1,'#7c3aed',13);}
      else if(!sm){s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#fff" stroke-width="2" stroke-dasharray="5 5"/><circle cx="${(x1+x2)/2}" cy="${(y1+y2)/2}" r="14" fill="#fff" stroke="#7c3aed" stroke-width="2.5"/><text x="${(x1+x2)/2}" y="${(y1+y2)/2+6}" text-anchor="middle" font-size="18" font-weight="700" fill="#7c3aed" font-family="sans-serif">？</text>`;}
      continue;}
    if(ch==='='||ch==='|'){s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#fff" stroke-width="2.5" stroke-dasharray="7 6" opacity=".9"/>`;continue;}
    const fw=(ch==='>'||ch==='v');s+=fw?arrowAt(x1,y1,x2,y2,'#fff',sm?9:14,'#3b352e'):arrowAt(x2,y2,x1,y1,'#fff',sm?9:14,'#3b352e');}
  if(o.hl){for(const k in o.hl){const [r,c]=k.split(',').map(Number);s+=`<circle cx="${X(c)}" cy="${Y(r)}" r="15" fill="${o.hl[k]}" opacity=".55"/>`;}}
  for(let r=0;r<P.R;r++)for(let c=0;c<P.C;c++)s+=`<circle cx="${X(c)}" cy="${Y(r)}" r="${sm?4:6}" fill="#6f685f"/>`;
  if(o.path&&o.path.length>1)s+=`<polyline points="${o.path.map(([r,c])=>X(c)+','+Y(r)).join(' ')}" fill="none" stroke="#7c3aed" stroke-width="${sm?6:8}" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>`;
  if(o.next)s+=`<circle cx="${X(o.next[1])}" cy="${Y(o.next[0])}" r="17" fill="none" stroke="#a97c12" stroke-width="4" stroke-dasharray="6 4"/>`;
  s+=icon('H',X(P.H[1]),Y(P.H[0]),sm)+icon('G',X(P.G[1]),Y(P.G[0]),sm)+(P.K?icon('K',X(P.K[1]),Y(P.K[0]),sm):'');
  if(o.ways){for(const k in o.ways){const [r,c]=k.split(',').map(Number),n=o.ways[k];if(!n||same([r,c],P.H))continue;
    const gx=X(c)+(same([r,c],P.G)?20:13),gy=Y(r)-(same([r,c],P.G)?20:13);
    s+=`<circle cx="${gx}" cy="${gy}" r="12" fill="${same([r,c],P.G)?'#1d7a4c':'#fff'}" stroke="#1d7a4c" stroke-width="2"/><text x="${gx}" y="${gy+5}" text-anchor="middle" font-size="${n>=10?12:14}" font-weight="700" fill="${same([r,c],P.G)?'#fff':'#1d7a4c'}" font-family="sans-serif">${n}</text>`;}}
  if(o.me){const [r,c]=o.me;s+=`<g transform="translate(${X(c)},${Y(r)})"><circle r="13" fill="#f59e0b" stroke="#fff" stroke-width="3"/><circle cx="-4" cy="-3" r="2" fill="#2a2520"/><circle cx="4" cy="-3" r="2" fill="#2a2520"/><path d="M-5,3 Q0,8 5,3" stroke="#2a2520" stroke-width="2" fill="none" stroke-linecap="round"/></g>`;}
  return `<svg ${o.id?`id="${o.id}"`:''} viewBox="0 0 ${W} ${Hh}" style="max-width:${sm?140:Math.min(W*1.15,460)}px" role="img" aria-label="町の地図">${s}</svg>`;
}
function startStage(p){P=p;S={hints:0,done:false,msg:'',msgc:'',path:[p.H.slice()],next:null,hl:null,fix:null,wrong:[],opts:p.kind==='count'?shuffle([p.a,...p.ds]):null,hint:0,arrived:false,wayK:0};begin(p);draw();}
function qtext(){
  if(P.kind==='count')return '家から学校まで、矢印の向きに進む<b>道順は全部で何通り？</b>';
  if(P.kind==='fix')return '今のままでは、家から学校へ行けません。<b>「？」の道のどれか1本に矢印をおいて</b>、行けるようにしよう。';
  if(P.K&&P.short)return '<b>パン屋によって</b>から学校へ。通る道が<b>いちばん少ない行き方</b>で行こう。';
  if(P.K)return '<b>パン屋によって</b>から、学校へ行こう。';
  return '矢印の向きに進んで、<b>家から学校へ</b>行こう。';
}
const visitedK=()=>!!P.K&&S.path.some(x=>same(x,P.K));
function boardOpts(){
  if(P.kind==='route')return {id:'bd',path:S.path,me:S.path[S.path.length-1],next:S.next};
  if(P.kind==='fix')return {id:'bd',hl:S.hl,path:S.done?S.win:null};
  return {id:'bd',ways:S.done?countWays():S.hint?partialWays():null};
}
function partialWays(){ /* ヒント：家に近い交差点から、道順の数を少しずつ見せる */
  const w=countWays(),r=reach(P.H),ks=Object.keys(w).filter(k=>r[k]&&w[k]&&k!==key(...P.H)&&k!==key(...P.G));
  const dist=k=>{const [a,b]=k.split(',').map(Number);return Math.abs(a-P.H[0])+Math.abs(b-P.H[1]);};
  ks.sort((a,b)=>dist(a)-dist(b));const n=Math.ceil(ks.length*Math.min(S.hint,2)/3),o={};ks.slice(0,n).forEach(k=>o[k]=w[k]);return o;}
function draw(){
  const k=P.kind;
  app.innerHTML=`${topBar()}
    <p class="qq">${qtext()}</p>
    <div class="boardw ip-bw ${k==='route'?'rt':''}">${mapSVG(boardOpts())}</div>
    ${k==='route'?`<div class="row" style="justify-content:space-between"><span class="note" id="stat">${statText()}</span></div>`:''}
    ${k==='count'?`<div class="opts4 txt">${S.opts.map((o,i)=>`<button class="ob ${S.done&&o===P.a?'right':''} ${S.wrong.includes(i)?'wrong':''}" data-i="${i}" ${S.done||S.wrong.includes(i)?'disabled':''}><span class="k">${'アイウエ'[i]}</span><b style="font-size:20px">${o}通り</b></button>`).join('')}</div>`:''}
    ${S.done?'':`<p class="msg ${S.msgc||''}" id="msg">${S.msg||defMsg()}</p>
    <div class="row">${k==='route'?`<button class="btn" id="undo" ${S.path.length<2?'disabled':''}>1つもどる</button><button class="btn" id="reset">はじめから</button>`:''}${k==='fix'?`<button class="btn go" id="chk">たしかめる</button><button class="btn" id="reset">矢印をとる</button>`:''}<button class="btn" id="hint" ${k==='count'&&S.hint>=2?'disabled':''}>ヒント</button></div>
    <p class="note">${hintNote()}</p>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(clearHTML());bindAll();return;}
  if(k==='route'){document.getElementById('undo').onclick=()=>{if(S.path.length>1)S.path.pop();S.next=null;S.msg='';S.msgc='';draw();};
    document.getElementById('reset').onclick=()=>{S.path=[P.H.slice()];S.next=null;S.msg='';S.msgc='';draw();};bindRoute();}
  if(k==='fix'){document.getElementById('chk').onclick=checkFix;document.getElementById('reset').onclick=()=>{S.fix=null;S.msg='';S.msgc='';draw();};bindFix();}
  if(k==='count')app.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(S.opts[i]===P.a){S.done=true;draw();}else{S.wrong.push(i);S.hints++;S.msg='ちがいます。もう一度数えてみよう。';S.msgc='ng';draw();}});
  document.getElementById('hint').onclick=hint;
}
function bindAll(){const d=document.getElementById('allp');if(d)d.addEventListener('toggle',()=>{});}
const defMsg=()=>P.kind==='route'?'となりの交差点をタップして進もう。':P.kind==='fix'?'「？」の道をタップすると、矢印の向きが変わります。':'';
const hintNote=()=>P.kind==='route'?'ヒントを使うと、次に進む交差点を教えます（星がへります）。行き方は1つとはかぎりません。':P.kind==='fix'?'ヒントを使うと、家から行ける交差点に色がつきます（星がへります）。正しい置き方が2つある問題もあります。':'ヒントを使うと、交差点に「そこまでの道順の数」が少しずつ出ます（星がへります）。';
const statText=()=>`通った道 ${S.path.length-1}本${P.K?`　・　パン屋 ${visitedK()?'によった ✓':'まだ'}`:''}${P.short?`　・　いちばん短いのは ${P.min}本`:''}`;
function clearHTML(){
  if(P.kind==='route'){const n=S.path.length-1;
    return `<p style="margin:0;font-size:15px">${n}本の道を通って学校に着きました。${P.short?'これがいちばん少ない本数です。':n===P.min?'いちばん短い行き方です！':`いちばん短い行き方は${P.min}本です。さがしてみよう。`}</p>`;}
  if(P.kind==='fix'){const v=P.valid;return `<p style="margin:0;font-size:15px">家から学校へ行けるようになりました。${v.length>1?`矢印のおき方は${v.length}通りあります。`:'矢印のおき方は、これ1通りだけです。'}</p>`;}
  const ps=allPaths();
  return `<p style="margin:0;font-size:15px">交差点ごとに「家からそこまでの道順の数」を書くと、その交差点に入ってくる矢印の元の数をたした数になります。学校は<b>${P.a}通り</b>です。</p>
    <details id="allp"><summary style="cursor:pointer;font-weight:700;font-size:14px">${ps.length}通りの道順を全部見る</summary><div class="ip-all">${ps.map(p=>mapSVG({small:true,path:p})).join('')}</div></details>`;
}
/* ---- なぞる ---- */
function nodeAt(e,svg){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());
  const c=Math.round((q.x-M)/U),r=Math.round((q.y-M)/U);if(r<0||c<0||r>=P.R||c>=P.C)return null;
  if(Math.hypot(q.x-X(c),q.y-Y(r))>U*0.5)return null;return [r,c];}  /* となりの交差点まで半分の距離まで受けつける */
function tryMove(t,quiet){
  const cur=S.path[S.path.length-1];if(same(t,cur))return false;
  const rd=roadBetween(cur,t);
  if(rd==null){if(!quiet)say('となりの交差点をタップしよう。','ng');return false;}
  if(rd==='.'){say('そこには道がありません。','ng');return false;}
  if(rd==='?'){say('「？」の道は通れません。','ng');return false;}
  if(!canGo(cur,t)){say('その道は一方通行で、反対向きです。通れません。','ng');return false;}
  S.path.push(t);S.next=null;S.msg='';S.msgc='';
  if(same(t,P.G)){
    if(P.K&&!visitedK()){S.msg='学校に着いたけど、まだパン屋によっていません。';S.msgc='ng';}
    else if(P.short&&S.path.length-1>P.min){S.msg=`学校に着いたけど、${S.path.length-1}本です。もっと少ない行き方があります（いちばん少ないのは${P.min}本）。もどって考えよう。`;S.msgc='ng';
      if(!S.arrived){S.arrived=true;S.hints++;}}
    else S.done=true;}
  return true;}
function say(m,c){S.msg=m;S.msgc=c||'';const el=document.getElementById('msg');if(el){el.textContent=m;el.className='msg '+(c||'');}}
function refresh(){const bd=document.getElementById('bd');if(!bd)return;if(S.done){draw();return;}
  const tmp=document.createElement('div');tmp.innerHTML=mapSVG(boardOpts());bd.innerHTML=tmp.firstChild.innerHTML;
  const st=document.getElementById('stat');if(st)st.textContent=statText();const u=document.getElementById('undo');if(u)u.disabled=S.path.length<2;
  const el=document.getElementById('msg');if(el){el.textContent=S.msg||defMsg();el.className='msg '+(S.msgc||'');}}
function bindRoute(){
  const svg=document.getElementById('bd');let drag=false,last=null;
  svg.addEventListener('pointerdown',e=>{const t=nodeAt(e,svg);if(!t)return;drag=true;last=t;try{svg.setPointerCapture(e.pointerId);}catch(_){}
    if(tryMove(t,false))refresh();});
  svg.addEventListener('pointermove',e=>{if(!drag)return;const t=nodeAt(e,svg);if(!t||same(t,last))return;last=t;if(tryMove(t,true))refresh();});
  const up=()=>{drag=false;if(S.done)draw();};svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
}
/* ---- 矢印をおく ---- */
function bindFix(){
  const svg=document.getElementById('bd');
  svg.addEventListener('pointerdown',e=>{const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());
    let best=null,bd=1e9;
    for(let r=0;r<P.R;r++)for(let c=0;c<P.C-1;c++)if(P.h[r][c]==='?'){const d=Math.hypot(q.x-(X(c)+U/2),q.y-Y(r));if(d<bd){bd=d;best=['h',r,c];}}
    for(let r=0;r<P.R-1;r++)for(let c=0;c<P.C;c++)if(P.v[r][c]==='?'){const d=Math.hypot(q.x-X(c),q.y-(Y(r)+U/2));if(d<bd){bd=d;best=['v',r,c];}}
    if(!best||bd>U*0.55){say('「？」の道をタップしよう。');return;}
    const [t,r,c]=best,seq=t==='h'?['>','<']:['v','^'];
    if(S.fix&&S.fix[0]===t&&S.fix[1]===r&&S.fix[2]===c){const i=seq.indexOf(S.fix[3]);S.fix=i===0?[t,r,c,seq[1]]:null;}
    else S.fix=[t,r,c,seq[0]];
    S.msg=S.fix?'向きを決めたら「たしかめる」をおそう。もう一度タップすると向きが変わります。':'';S.msgc='';draw();});
}
function checkFix(){
  if(!S.fix){S.msg='まず「？」の道を1本タップして、矢印をおこう。';S.msgc='ng';draw();return;}
  const b=bfsFrom(P.H);   /* 置いた矢印で、家から学校へ行けるかをBFSで調べる */
  if(b){S.done=true;S.win=b.path.map(x=>[x[0],x[1]]);draw();return;}
  S.hints++;S.msg='まだ学校へ行けません。ほかの「？」や、反対の向きもためそう。';S.msgc='ng';draw();
}
function hint(){
  S.hints++;
  if(P.kind==='route'){const cur=S.path[S.path.length-1],b=bfsFrom(cur,visitedK());
    if(!b){S.msg='ここからは、学校へ行けません。「1つもどる」でもどろう。';S.msgc='ng';draw();return;}
    if(P.short&&(S.path.length-1)+b.d>P.min){S.msg='この行き方では、いちばん少ない本数になりません。もどって考えよう。';S.msgc='ng';draw();return;}
    S.next=[b.path[1][0],b.path[1][1]];S.msg='ヒント：点線の丸の交差点へ進もう。';S.msgc='';draw();return;}
  if(P.kind==='fix'){S.hint++;const fx=S.fix;S.fix=null;const a=reach(P.H),hl={};for(const k in a)hl[k]='#16a34a';
    if(S.hint>=2){const b=reachTo(P.G);for(const k in b)if(!hl[k])hl[k]='#2563eb';}
    S.fix=fx;S.hl=hl;S.msg=S.hint>=2?'ヒント：緑は家から行ける交差点、青は学校へ行ける交差点。緑から青へつなぐ「？」をさがそう。':'ヒント：緑の丸は、今、家から行ける交差点です。ここから先へつなげる「？」はどれかな。';S.msgc='';draw();return;}
  S.hint++;S.msg=S.hint>=2?'ヒント：さらに数を出しました。のこりも同じように、入ってくる矢印の元の数をたしていこう。':'ヒント：その交差点に入ってくる矢印の、元の交差点の数をたすと、そこまでの道順の数になります。家のとなりから書いていこう。';S.msgc='';draw();
}
