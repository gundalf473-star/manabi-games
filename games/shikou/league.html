<script>

const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;

/* ======== パズルごとの部分 ======== */
/* リーグ戦の表：p={n,kind:'a'|'c',teams,draw,pts,clues:[{t,x,y,k,w,l,d,txt}],sol:[組(i<j)ごとに 1:i勝ち 0:分け -1:j勝ち],steps:[[手がかり番号…],組,値,単独で決まるか],games,ask} */
const HINTWORD='ヒントやまちがい';
const LVD={1:'3チーム・引き分けなし',2:'3チーム引き分けあり・4チーム',3:'4チーム・成績と勝った数',4:'4チーム・勝ち点',5:'4〜5チーム・勝ち点と順位'};
const RULES=`<ol class="rules">
  <li><b>リーグ戦</b>は、どのチームとも<b>1回ずつ</b>試合をします。</li>
  <li><b>手がかり</b>を読んで、表のマスをタップしよう。<b>○</b>＝勝ち、<b>×</b>＝負け、<b>△</b>＝引き分け（分け）。</li>
  <li>表は<b>左の名前のチームから見た</b>結果です。1つ書くと、反対がわのマスにも自動で書きこまれます。</li>
  <li>勝ち点のある問題は、<b>勝ち3点・引き分け1点・負け0点</b>です。</li>
  <li>全部うめたら「答え合わせ」。答えは1つに決まります。</li></ol>`;
const LGC=['#f87171','#60a5fa','#fbbf24','#34d399','#c084fc'];
const LGA={'うさぎ':['#ffffff','#f5b8c8'],'くま':['#b07a4a','#7a4f2a'],'ねこ':['#d6d0c8','#7d756b'],'きつね':['#f0953a','#ffffff'],'たぬき':['#a08a74','#4a3b2e']};
function lgIcon(k,sz){
  const nm=P.teams[k];
  if(P.kind==='c')return `<svg viewBox="0 0 48 48" width="${sz}" height="${sz}" aria-hidden="true"><line x1="10" y1="6" x2="10" y2="44" stroke="#6a5a4a" stroke-width="3" stroke-linecap="round"/><path d="M11,8 L40,12 L36,20 L40,28 L11,28Z" fill="${LGC[k]}" stroke="#6a5a4a" stroke-width="1.5"/><text x="24" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="sans-serif">${k+1}</text></svg>`;
  const [a,b]=LGA[nm]||['#ddd','#999'];let e='';
  if(nm==='うさぎ')e=`<ellipse cx="16" cy="10" rx="5" ry="12" fill="${a}" stroke="#8a7a70" stroke-width="1.5"/><ellipse cx="32" cy="10" rx="5" ry="12" fill="${a}" stroke="#8a7a70" stroke-width="1.5"/><ellipse cx="16" cy="11" rx="2" ry="7" fill="${b}"/><ellipse cx="32" cy="11" rx="2" ry="7" fill="${b}"/>`;

  if(nm==='ねこ'||nm==='きつね')e=`<polygon points="8,8 11,28 22,20" fill="${a}" stroke="#6a5a4a" stroke-width="1.5"/><polygon points="40,8 37,28 26,20" fill="${a}" stroke="#6a5a4a" stroke-width="1.5"/>`;
  let f=`<circle cx="24" cy="30" r="15" fill="${a}" stroke="#6a5a4a" stroke-width="1.5"/>`;
  if(nm==='きつね')f+=`<ellipse cx="24" cy="37" rx="9" ry="7" fill="#fff"/>`;
  if(nm==='たぬき')f+=`<ellipse cx="18" cy="28" rx="5" ry="4" fill="${b}"/><ellipse cx="30" cy="28" rx="5" ry="4" fill="${b}"/>`;
  if(nm==='くま')f+=`<ellipse cx="24" cy="36" rx="7" ry="5" fill="#e3c49e"/>`;
  const ey=nm==='たぬき'?'#fff':'#2a2520';

  return `<svg viewBox="0 0 48 48" width="${sz}" height="${sz}" aria-hidden="true">${e}${f}</svg>`;
}
const CN='①②③④⑤⑥⑦⑧⑨⑩';
const PR=n=>{const a=[];for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)a.push([i,j]);return a;};

/* x から見た y との結果：1勝ち 0分け -1負け null まだ */
function rv(x,y,g){const pr=PR(P.n);const k=pr.findIndex(([i,j])=>(i===Math.min(x,y)&&j===Math.max(x,y)));const v=g[k];if(v==null)return null;return x<y?v:-v;}
function stats(g){const n=P.n,o=[];for(let x=0;x<n;x++){let w=0,l=0,d=0,u=0;for(let y=0;y<n;y++){if(y===x)continue;const r=rv(x,y,g);if(r==null)u++;else if(r===1)w++;else if(r===-1)l++;else d++;}o.push({w,l,d,u,pt:3*w+d});}return o;}
function evalClue(c,g){
  const n=P.n,st=stats(g),X=st[c.x];
  switch(c.t){
    case 'rec':return X.w===c.w&&X.l===c.l&&X.d===c.d;
    case 'wins':return X.w===c.k; case 'loss':return X.l===c.k;
    case 'allwin':return X.w===n-1; case 'alllose':return X.l===n-1;
    case 'noloss':return X.l===0; case 'nowin':return X.w===0;
    case 'beat':return rv(c.x,c.y,g)===1; case 'drew':return rv(c.x,c.y,g)===0;
    case 'draws':return st.reduce((a,s)=>a+s.d,0)/2===c.k;
    case 'pts':return X.pt===c.k; case 'more':return X.pt>st[c.y].pt; case 'morew':return X.w>st[c.y].w;
    case 'rank':{const hi=st.filter(s=>s.pt>X.pt).length,eq=st.filter(s=>s.pt===X.pt).length;return hi===c.k-1&&eq===1;}
    case 'topw':return st.every((s,y)=>y===c.x||X.w>s.w);
  }
  return false;
}
const SYM={1:'○','-1':'×',0:'△'};
function tableHTML(){
  const n=P.n,st=stats(S.g),pr=PR(n);
  const cols=['勝','敗'].concat(P.draw?['分']:[]).concat(P.pts?['点']:[]);
  let h=`<div class="lgscroll"><table class="lgt n${n}"><tr><th class="lgc"></th>${P.teams.map((t,k)=>`<th class="lgh">${lgIcon(k,22)}<span>${esc(t)}</span></th>`).join('')}${cols.map(c=>`<th class="lgs">${c}</th>`).join('')}</tr>`;
  for(let x=0;x<n;x++){
    h+=`<tr><th class="lgn">${lgIcon(x,22)}<span>${esc(P.teams[x])}</span></th>`;
    for(let y=0;y<n;y++){
      if(x===y){h+=`<td class="lgd"></td>`;continue;}
      const r=rv(x,y,S.g),k=pr.findIndex(([i,j])=>i===Math.min(x,y)&&j===Math.max(x,y));
      h+=`<td><button class="lgb ${r===1?'w':r===-1?'l':r===0?'d':''} ${S.hl[k]?'h':''}" data-x="${x}" data-y="${y}" ${S.done?'disabled':''} aria-label="${esc(P.teams[x])}対${esc(P.teams[y])}">${r==null?'':SYM[r]}</button></td>`;
    }
    const s=st[x];h+=`<td class="lgs">${s.w}</td><td class="lgs">${s.l}</td>${P.draw?`<td class="lgs">${s.d}</td>`:''}${P.pts?`<td class="lgs pt">${s.pt}</td>`:''}</tr>`;
  }
  return h+`</table></div>`;
}
function askHTML(){
  const g=P.games,n=P.n;
  const opts=[...new Set([g,n*(n-1),n,g+1,g-1].filter(v=>v>0))].slice(0,4).sort((a,b)=>a-b);
  return `<p class="qq">まず考えよう：${n}チームのリーグ戦では、試合は全部で何試合？</p>
    <div class="lgask">${opts.map(v=>`<button class="ob ${S.askWrong.includes(v)?'wrong':''}" data-v="${v}" ${S.askWrong.includes(v)?'disabled':''}><b>${v}試合</b></button>`).join('')}</div>
    <p class="msg ${S.msgc}" id="msg">${S.msg}</p>`;
}
function draw(){
  const filled=S.g.filter(v=>v!=null).length;
  const info=`${P.n}チームのリーグ戦（どのチームとも1回ずつ試合）。${P.draw?'':'<b>引き分けはありません。</b>'}${P.pts?'<br>勝ち点：<b>勝ち3点・引き分け1点・負け0点</b>。':''}`;
  app.innerHTML=`${topBar()}
    <div class="lgteams">${P.teams.map((t,k)=>`<span>${lgIcon(k,40)}<b>${esc(t)}</b></span>`).join('')}</div>
    <p class="lginfo">${info}</p>
    ${!S.asked?askHTML():`
    <div class="lglab">手がかり</div>
    <ol class="lgclues">${P.clues.map((c,i)=>`<li class="${S.bad.includes(i)?'bad':''}"><b>${CN[i]}</b><span>${esc(c.txt)}</span></li>`).join('')}</ol>
    <div class="lglab">対戦表　マスをタップ：○ → × ${P.draw?'→ △ ':''}→ 空　<span class="lgcnt">${filled} / ${P.games}試合</span></div>
    ${tableHTML()}
    ${S.done?'':`<p class="msg ${S.msgc}" id="msg">${S.msg||'左の名前のチームから見て、勝ちなら○、負けなら×。'}</p>
    <div class="row"><button class="btn go" id="chk" ${filled<P.games?'disabled':''}>答え合わせ</button><button class="btn" id="hint">ヒント</button><button class="btn" id="clr">表を消す</button></div>`}`}
    <div id="after"></div>`;
  bindBack();
  if(!S.asked){app.querySelectorAll('.lgask .ob').forEach(b=>b.onclick=()=>askAns(+b.dataset.v));return;}
  if(S.done){showClear(explain());return;}
  app.querySelectorAll('.lgb').forEach(b=>b.onclick=()=>tap(+b.dataset.x,+b.dataset.y));
  document.getElementById('chk').onclick=check;
  document.getElementById('hint').onclick=hint;
  document.getElementById('clr').onclick=()=>{S.g=S.g.map(()=>null);S.hl={};S.bad=[];S.msg='';S.msgc='';draw();};
}
function askAns(v){
  if(v===P.games){S.asked=true;S.msg=`正解！ どのチームも ほかの${P.n-1}チームと試合をするので ${P.n}×${P.n-1}＝${P.n*(P.n-1)}。でも「AとB」「BとA」は同じ試合なので 2でわって ${P.games}試合です。`;S.msgc='ok';draw();return;}
  S.askWrong.push(v);S.hints++;S.msg=`${v}試合ではありません。1チームが何試合するか考えて、同じ試合を2回数えていないか確かめよう。`;S.msgc='ng';draw();
}
function tap(x,y){
  const pr=PR(P.n),k=pr.findIndex(([i,j])=>i===Math.min(x,y)&&j===Math.max(x,y));
  const cur=rv(x,y,S.g);const seq=P.draw?[null,1,-1,0]:[null,1,-1];
  const nx=seq[(seq.indexOf(cur)+1)%seq.length];
  S.g[k]=nx==null?null:(x<y?nx:-nx);delete S.hl[k];S.bad=[];
  if(S.msgc==='ng'){S.msg='';S.msgc='';}
  draw();
}
const vs=(k,v)=>{const [i,j]=PR(P.n)[k];const A=P.teams[i],B=P.teams[j];return `${A}対${B}は ${v===0?'引き分け（△）':(v===1?A:B)+'の勝ち'}`;};
function check(){
  const bad=P.clues.map((c,i)=>evalClue(c,S.g)?-1:i).filter(i=>i>=0);
  if(!bad.length){S.done=true;S.hl={};draw();return;}
  S.bad=bad;S.hints++;
  S.msg=`手がかり ${bad.map(i=>CN[i]).join('・')} に合っていません。赤くなった手がかりを、表の右の数と見くらべよう。`;S.msgc='ng';draw();
}
function reason(st,first){
  const [cs,,, alone]=st;const s=cs.map(i=>CN[i]).join('と');
  if(!cs.length)return 'ここまでに決まった試合から';
  return `手がかり${s}${alone||first?'':'と、ここまでに決まった試合'}から`;
}
function hint(){
  const k=P.steps.findIndex(([,p,v])=>S.g[p]!==v);
  if(k<0){S.msg='表は正しくうまっています。「答え合わせ」をおそう。';S.msgc='';draw();return;}
  /* まちがっているマスは消す */
  S.g=S.g.map((v,p)=>v!=null&&v!==P.sol[p]?null:v);
  const [cs,p,v]=P.steps[k];S.g[p]=v;S.hl={};S.hl[p]=1;S.hints++;S.bad=[];
  S.msg=`ヒント：${reason(P.steps[k],k===0)}、${vs(p,v)}と決まります。`;S.msgc='';draw();
}
function explain(){
  const lines=P.steps.map((st,k)=>`<li>${reason(st,k===0)}、${vs(st[1],st[2])}。</li>`).join('');
  const tot=P.pts?`<p class="note" style="margin:0">ひみつ：引き分けでない試合は 2チームで合わせて3点、引き分けは合わせて2点。だから勝ち点の合計は「3×${P.games}－引き分けの数」になります。</p>`:'';
  return `<p style="margin:0">${P.n}チームのリーグ戦は、全部で <b>${P.n}×${P.n-1}÷2＝${P.games}試合</b>。手がかりから、表がぴったり1通りに決まりました。</p>${tot}
  <details><summary style="cursor:pointer;font-weight:700;font-size:14px">決まっていく順番を見る</summary><ol class="lgsteps">${lines}</ol></details>`;
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
