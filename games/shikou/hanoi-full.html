<title>ハノイの塔 100問</title>
<meta name="game:paid" content="利用コード">
<meta name="game:subject" content="思考力">

<style>

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --ink:#b3a6f0; --seal:#b79cff; --sealsoft:#271c40; --ok:#4cc184; --oksoft:#1b3326; --ng:#f07468; --ngsoft:#3a2220; --gold:#e1b44a; --pick:#28241e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15130f; --surface:#1e1b17; --fg:#ece6dc; --muted:#a59c90; --rule:#34302a;
  --ink:#b3a6f0; --seal:#b79cff; --sealsoft:#271c40; --ok:#4cc184; --oksoft:#1b3326; --ng:#f07468; --ngsoft:#3a2220; --gold:#e1b44a; --pick:#28241e; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 64px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

.paid .pt{font-size:15px} .paid .pt b{font-family:var(--display);font-weight:400;color:var(--seal)}
.paid .pd{font-size:13px;color:var(--muted)}

.pad{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pad button{min-width:48px;min-height:50px;border:1px solid var(--rule);background:var(--pick);border-radius:10px;font-size:21px;font-weight:700;cursor:pointer;touch-action:manipulation}
.pad button.er{font-size:15px;min-width:60px}

.ob .k{align-self:flex-start;font-size:12px;font-weight:700;width:22px;height:22px;border-radius:50%;background:var(--pick);display:grid;place-items:center}
.ob:hover:not(:disabled){border-color:var(--ink)}
.ob.right{border-color:var(--ok);background:var(--oksoft)} .ob.wrong{border-color:var(--ng);background:var(--ngsoft);opacity:.6}
.ob:disabled{cursor:default}
.views{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;align-items:flex-end}
.views figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.scales{display:flex;flex-direction:column;gap:2px;align-items:center;width:100%}
.hintbox{margin:0;font-size:14px;background:var(--sealsoft);border-radius:8px;padding:8px 12px}
.prog{min-height:52px;border:2px dashed var(--rule);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;background:#fbfaf6}
.prog .ph{color:var(--muted);font-size:13px}
.palette{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ccard,.pcard{border:2px solid #93c5fd;background:#eff6ff;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:#1e3a8a}
.pcard{align-self:flex-start;padding:3px 10px}
.ccard.loop,.pcard.loop{border-color:#fbbf24;background:#fffbeb;color:#92400e}
.ccard span,.pcard span{font-size:18px}
.ccard:disabled,.pcard:disabled{opacity:.45;cursor:default}

</style>

<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>ハノイの塔 100問</h1>
    <p class="lead">柱の円盤を1枚ずつ動かして、完成の形にしよう。大きい円盤は小さい円盤の上にのせられません。5つのレベルに20問ずつ。最短の手数でクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=true;
let QS=[];
const ID='hanoi';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>ハノイの塔 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* ハノイの塔：p={kind:'play'|'q', n, s:[円盤ごとの柱], g:[完成の形], opt|a,ds,path?,ex?}  円盤0がいちばん小さい。柱 0=左 1=まん中 2=右 */
const HINTWORD='ヒントや手数のオーバー';
const LVD={1:'円盤2枚・3枚',2:'3枚を1本の柱に集める',3:'完成の形がばらばら・4枚',4:'4枚の塔と、ばらばらの形',5:'5枚・6枚と手数のきまり'};
const RULES=`<ol class="rules">
  <li>柱をタップすると、いちばん上の円盤を持ち上げます。別の柱をタップすると、そこへおろします。</li>
  <li><b>大きい円盤を、小さい円盤の上にのせてはいけません。</b>動かせるのは1回に1枚だけ。</li>
  <li>上の「完成の形」と同じにしたらクリア。<b>最短の手数</b>で完成すると★3つ。</li>
  <li>ヒントは、最短で完成させるための次の一手を教えます。</li>
  <li>「何手で動かせる？」の問題は、4つの中から最短の手数をえらびます。</li></ol>`;
const PN=['左','まん中','右'];
const HC=['#f87171','#fb923c','#fbbf24','#34d399','#38bdf8','#a78bfa'];
function hTops(s){const t=[-1,-1,-1];for(let d=s.length-1;d>=0;d--)t[s[d]]=d;return t;}
/* 完成の形からの最短手数を、全部の並びについて幅優先探索で求める */
const hKey=s=>s.join('');
function hDist(g){
  const d=new Map([[hKey(g),0]]),q=[g];
  for(let h=0;h<q.length;h++){const s=q[h],t=hTops(s),k=d.get(hKey(s));
    for(let a=0;a<3;a++){if(t[a]<0)continue;for(let b=0;b<3;b++){if(a===b||(t[b]>=0&&t[b]<t[a]))continue;
      const u=s.slice();u[t[a]]=b;const ku=hKey(u);if(!d.has(ku)){d.set(ku,k+1);q.push(u);}}}}
  return d;
}
function hNext(s,D){const t=hTops(s),k=D.get(hKey(s));
  for(let a=0;a<3;a++){if(t[a]<0)continue;for(let b=0;b<3;b++){if(a===b||(t[b]>=0&&t[b]<t[a]))continue;
    const u=s.slice();u[t[a]]=b;if(D.get(hKey(u))===k-1)return [a,b];}}return null;}
const isTw=g=>g.every(v=>v===g[0]);
function startStage(p){
  P=p;S={s:p.s.slice(),hold:-1,moves:0,hint:0,hints:0,done:false,msg:'',msgc:'',hl:null,wrong:[],D:null};
  if(p.kind==='q')S.opts=shuffle([p.a,...p.ds]);
  begin(p);draw();
}
/* 柱と円盤の図。big=操作用 */
function hSVG(s,opt){
  opt=opt||{};const n=s.length,W=360,PX=[62,180,298],dh=Math.min(28,168/n),base=40+Math.max(n,3)*dh+10,H=base+(opt.big?36:16);
  const wmin=n>2?34:48,wmax=112,dw=n>1?(wmax-wmin)/(n-1):0;let o='';
  o+=`<rect x="6" y="${base}" width="${W-12}" height="12" rx="4" fill="#8b6f47"/>`;
  PX.forEach((x,i)=>{
    o+=`<rect x="${x-4}" y="${30}" width="8" height="${base-30}" rx="3" fill="#a8885c"/>`;
    if(opt.big)o+=`<text x="${x}" y="${base+30}" text-anchor="middle" font-size="15" font-weight="700" fill="#6a625a" font-family="sans-serif">${PN[i]}</text>`;});
  const cnt=[0,0,0];
  for(let d=n-1;d>=0;d--){const pl=s[d];const w=wmin+d*dw;let x=PX[pl],y;
    if(opt.big&&S.hold===pl&&hTops(s)[pl]===d){y=4;} else {y=base-(cnt[pl]+1)*dh;}
    cnt[pl]++;
    const lifted=opt.big&&S.hold===pl&&hTops(s)[pl]===d;
    o+=`<g><rect x="${x-w/2}" y="${y}" width="${w}" height="${dh-2}" rx="${(dh-2)/2}" fill="${HC[d]}" stroke="${lifted?'#3b2f6b':'rgba(0,0,0,.25)'}" stroke-width="${lifted?3:1}"/>`+
      `<text x="${x}" y="${y+dh*0.7}" text-anchor="middle" font-size="${Math.min(16,dh*0.62)}" font-weight="700" fill="#fff" stroke="rgba(0,0,0,.3)" stroke-width=".8" font-family="sans-serif">${d+1}</text></g>`;}
  if(opt.big&&S.hl){const [a,b]=S.hl,y=22,x1=PX[a],x2=PX[b];
    o+=`<path d="M${x1},${y} Q${(x1+x2)/2},${y-26} ${x2},${y}" fill="none" stroke="#7c3aed" stroke-width="4" stroke-dasharray="7 4"/><path d="M${x2},${y+2} l-9,-12 l14,1 z" fill="#7c3aed"/>`;}
  if(opt.big)PX.forEach((x,i)=>{o+=`<rect class="pole" data-i="${i}" x="${x-59}" y="0" width="118" height="${H}" fill="${S.hold===i?'rgba(124,58,237,.10)':'transparent'}" rx="10" style="cursor:pointer"/>`;});
  return `<svg ${opt.big?'id="bd"':''} viewBox="0 ${opt.big?-14:20} ${W} ${H+(opt.big?14:-20)}" style="max-width:${opt.max||360}px" role="img" aria-label="ハノイの塔">${o}</svg>`;
}
const mv=m=>`${PN[m[0]]}→${PN[m[1]]}`;
function ruleText(n){const L=[];let a=0;for(let k=1;k<=Math.max(n,4);k++){a=a*2+1;L.push(`${k}枚：${a}手`);}
  return `<b>手数のきまり</b>：塔をそっくり別の柱へうつす最短の手数は、${L.join('、')}…。${n}枚を動かすには、①上の${n-1}枚をよける ②いちばん大きい円盤を1手で動かす ③${n-1}枚をその上にのせる。だから<b>「1枚少ないときの手数×2＋1」</b>になります。2を${n}回かけて1をひいた数（2×…×2－1＝${2**n-1}）とも言えます。`;}
function explain(){
  const tw=isTw(P.s)&&isTw(P.g);
  if(P.kind==='q'){
    if(tw)return `最短は <b>${P.a}手</b>。<br>${ruleText(P.n)}`;
    if(P.ex)return P.ex;
    return `最短は <b>${P.a}手</b>。動かし方の例：${P.path.map(mv).join('、')}。`;}
  let t=`あなたは ${S.moves}手、最短は ${P.opt}手でした。${S.moves===P.opt?'最短で完成！':'最短の手数を目指して、もう一度やってみよう。'}`;
  if(tw&&(P.lv>=2||P.n>=3))t+=`<br>${ruleText(P.n)}`;
  else if(tw)t+='<br>2枚なら、小さい円盤をよけて、大きい円盤を動かし、小さい円盤をもどす。これで3手です。';
  return t;
}
function draw(){
  const Q=P.kind==='q';
  if(Q){
    app.innerHTML=`${topBar()}
      <p class="qq">${isTw(P.s)&&isTw(P.g)?`円盤${P.n}枚の塔を、${PN[P.s[0]]}の柱から${PN[P.g[0]]}の柱へ全部うつします。`:'はじめの形から、完成の形にします。'}<b>最短で何手</b>で動かせる？</p>
      <div class="boardw" style="flex-direction:column;align-items:center">${hSVG(P.s,{max:300})}<span class="note">はじめの形</span></div>
      <div class="boardw" style="flex-direction:column;align-items:center">${hSVG(P.g,{max:300})}<span class="note">完成の形</span></div>
      <div class="opts4 txt">${S.opts.map((o,i)=>`<button class="ob ${S.done&&o===P.a?'right':''} ${S.wrong.includes(i)?'wrong':''}" data-i="${i}" ${S.done||S.wrong.includes(i)?'disabled':''}><span class="k">${'アイウエ'[i]}</span><b style="font-size:21px">${o}手</b></button>`).join('')}</div>
      ${S.hint&&!S.done?`<p class="hintbox">${qHint()}</p>`:''}
      ${S.done?'':`<p class="msg ${S.msgc}" id="msg">${S.msg}</p><div class="row"><button class="btn" id="hint" ${S.hint?'disabled':''}>ヒント</button></div>`}
      <div id="after"></div>`;
    bindBack();
    if(S.done){showClear(`<p style="margin:0">${explain()}</p>`);return;}
    app.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
      if(S.opts[i]===P.a){S.done=true;}else{S.wrong.push(i);S.hints++;S.msg='ちがいます。もう一度考えてみよう。';S.msgc='ng';}draw();});
    document.getElementById('hint').onclick=()=>{S.hint=1;S.hints++;S.msg='';draw();};
    return;
  }
  app.innerHTML=`${topBar()}
    <div style="display:flex;flex-direction:column;align-items:center;gap:0"><span class="note" style="font-weight:700">完成の形（この形にしよう）</span>${hSVG(P.g,{max:230})}</div>
    <div class="boardw">${hSVG(S.s,{big:true})}</div>
    <div class="row"><span class="note">手数 <b style="font-size:17px;color:var(--fg)">${S.moves}</b>　・　最短 ${P.opt}手</span></div>
    ${S.done?'':`<p class="msg ${S.msgc}" id="msg">${S.msg||(S.hold>=0?'おろす柱をタップしよう。':'円盤を動かしたい柱をタップしよう。')}</p>
    <div class="row"><button class="btn" id="hint">ヒント</button><button class="btn" id="reset">やりなおす</button></div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){S.hints=S.hint+(S.moves>P.opt?1:0)+(S.moves>P.opt*2+4?1:0);showClear(`<p style="margin:0">${explain()}</p>`);return;}
  app.querySelectorAll('.pole').forEach(r=>r.addEventListener('click',()=>tapPole(+r.dataset.i)));
  document.getElementById('hint').onclick=hint;
  document.getElementById('reset').onclick=()=>{S.s=P.s.slice();S.moves=0;S.hold=-1;S.msg='';S.msgc='';S.hl=null;draw();};
}
function tapPole(i){
  const t=hTops(S.s);S.msgc='';S.msg='';
  if(S.hold<0){if(t[i]<0){S.msg='その柱には円盤がありません。';}else S.hold=i;draw();return;}
  if(S.hold===i){S.hold=-1;draw();return;}
  const d=t[S.hold];
  if(t[i]>=0&&t[i]<d){S.msg=`円盤${d+1}は、小さい円盤${t[i]+1}の上にはのせられません。`;S.msgc='ng';S.hold=-1;draw();return;}
  S.s[d]=i;S.hold=-1;S.moves++;S.hl=null;
  if(S.s.every((v,k)=>v===P.g[k]))S.done=true;
  draw();
}
function hint(){
  if(!S.D)S.D=hDist(P.g);
  const m=hNext(S.s,S.D);if(!m)return;
  S.hint++;S.hold=-1;S.hl=m;S.msg=`ヒント：${PN[m[0]]}の柱のいちばん上の円盤を、${PN[m[1]]}の柱へ（ヒント ${S.hint}回）。`;S.msgc='';draw();
}
function qHint(){
  if(isTw(P.s)&&isTw(P.g))return '1枚なら1手、2枚なら3手、3枚なら7手です。1枚ふえると、手数はどうふえるかな？　上の円盤をよけて、いちばん大きい円盤を動かし、またのせる…と考えよう。';
  return '<b>いちばん大きい円盤</b>から考えよう。それはもう完成の場所にある？　動かすなら、その上やおろす先にある円盤を、どこによけておけばいい？';
}

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
