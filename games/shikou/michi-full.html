body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.75;

<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>道つなぎパズル 100問</h1>
    <p class="lead">5つのレベルに20問ずつ。ヒントなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script type="application/json" id="data">{}</script>
<script>
(function(){
/* 問題データ: id, lv=レベル(1〜5), w×h=盤の大きさ, pairs=[[スタート],[ゴール]]（[行,列,辺] 辺は 0北 1東 2南 3西 で、盤の外がわ）,
   sol=[[種類,回転],…]（左上から横に。S直線 C曲がり X立体交差 B草地）, fix=はじめから置いてあるマス */
const PAID=true;
let QS=[];
const ID='michi';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const COL=['#e0342f','#2563eb','#16a34a'], CNAME=['赤','青','緑'];
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const LVD={1:'3×3 ・ 1組',2:'4×3 ・ 2組',3:'4×4 ・ 2組',4:'5×4 ・ 3組 ・ 立体交差',5:'5×5 ・ 3組 ・ 立体交差'};
const TNAME={S:'直線',C:'曲がり角',X:'立体交差',B:'草地'};
const BASE={S:[[0,2]],C:[[0,1]],X:[[0,2],[1,3]],B:[]};
const DR=[[-1,0],[0,1],[1,0],[0,-1]];
const segs=(t,r)=>BASE[t].map(([a,b])=>[(a+r)%4,(b+r)%4].sort((x,y)=>x-y));
const nrot=t=>t==='C'?4:t==='S'?2:1;
const sameTile=(a,b)=>a&&b&&a.t===b.t&&(a.r%nrot(a.t))===(b.r%nrot(b.t));
const PAIDLINK=`<a class="paid" href="michi-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>道つなぎパズル 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;

/* ---------- タイルの絵 ---------- */
const U=60;
function roadPath(x,y,a,b){ /* マス(x,y)の辺aから辺bへの道の中心線 */
  const m=[[x+U/2,y],[x+U,y+U/2],[x+U/2,y+U],[x,y+U/2]];
  if((b-a)%2===0) return `M${m[a]} L${m[b]}`;
  /* 曲がり角：2つの辺が出会う角を中心に、半径 U/2 の円弧（角の側にふくらまない向き） */
  const sweep=(a===0&&b===3)?1:0;
  return `M${m[a]} A${U/2},${U/2} 0 0 ${sweep} ${m[b]}`;
}
function tileSVG(t,r,x,y,opt){
  opt=opt||{}; const cols=opt.cols||[]; let s='';
  s+=`<rect x="${x+1}" y="${y+1}" width="${U-2}" height="${U-2}" rx="5" fill="${opt.fixed?'#d5e4bf':'#e3eed3'}" stroke="${opt.fixed?'#8a7a52':'#b9c9a2'}" stroke-width="${opt.fixed?2:1}"/>`;
  if(t==='B'){ s+=`<circle cx="${x+20}" cy="${y+24}" r="8" fill="#8bbf6a"/><circle cx="${x+38}" cy="${y+36}" r="10" fill="#76ad55"/><circle cx="${x+40}" cy="${y+18}" r="5" fill="#9fcc80"/>`; }
  const sg=segs(t,r);
  sg.forEach(([a,b],i)=>{
    const d=roadPath(x,y,a,b), c=cols[i]||'#8d939c', bridge=t==='X'&&a%2===0;
    if(bridge) s+=`<path d="${d}" stroke="#fbfaf6" stroke-width="28" fill="none"/><path d="${d}" stroke="#5b616b" stroke-width="24" fill="none"/>`;
    s+=`<path d="${d}" stroke="${c}" stroke-width="18" fill="none" stroke-linecap="butt"/><path d="${d}" stroke="#fff" stroke-width="2" stroke-dasharray="5 5" fill="none" opacity=".85"/>`;
  });
  if(opt.fixed) s+=`<circle cx="${x+9}" cy="${y+9}" r="4" fill="#8a7a52"/>`;
  if(opt.hint) s+=`<rect x="${x+2}" y="${y+2}" width="${U-4}" height="${U-4}" rx="4" fill="none" stroke="#a97c12" stroke-width="3" stroke-dasharray="6 3"/>`;
  return s;
}
const oneTile=(t,r)=>`<svg viewBox="0 0 ${U} ${U}" aria-hidden="true">${tileSVG(t,r,0,0)}</svg>`;

/* ---------- 遊ぶ ---------- */
let P=null, S=null;
function startStage(p){
  P=p; const n=p.w*p.h;
  const board=Array(n).fill(null);
  p.fix.forEach(i=>{const [t,r]=p.sol[i]; board[i]={t,r,lock:'fix'};});
  const cnt={S:0,C:0,X:0,B:0};
  p.sol.forEach(([t],i)=>{if(!p.fix.includes(i))cnt[t]++;});
  const rot={S:Math.floor(Math.random()*2),C:Math.floor(Math.random()*4),X:0,B:0};
  S={board,cnt,rot,types:Object.keys(cnt).filter(t=>cnt[t]>0),sel:null,hints:0,moves:0,del:false,done:false,msg:''};
  track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});
  draw();
}
function portMap(){
  const m={}; P.pairs.forEach(([s,g],ci)=>{m[s.join()]={k:'s',ci};m[g.join()]={k:'g',ci};}); return m;
}
const ends=c=>c?segs(c.t,c.r).flat():[];
/* スタートとゴールから道をたどって、つながっている区間に色をつける */
function trace(){
  const {w,h}=P, B=S.board, col={}, pm=portMap(), reach=[false,false,false];
  for(const [key,o] of Object.entries(pm)){
    let [r,c,e]=key.split(',').map(Number), steps=0;
    while(steps++<200){
      const cell=B[r*w+c]; if(!cell)break;
      const sg=segs(cell.t,cell.r), si=sg.findIndex(x=>x.includes(e)); if(si<0)break;
      const k=(r*w+c)+':'+si; if(col[k]!=null&&col[k]!==o.ci)break; col[k]=o.ci;
      const eo=sg[si][0]===e?sg[si][1]:sg[si][0], nr=r+DR[eo][0], nc=c+DR[eo][1];
      if(nr<0||nr>=h||nc<0||nc>=w){ const t=pm[[r,c,eo].join()]; if(o.k==='s'&&t&&t.k==='g'&&t.ci===o.ci)reach[o.ci]=true; break; }
      r=nr;c=nc;e=(eo+2)%4;
    }
  }
  return {col,reach};
}
/* クリアの条件：すべてのマスがうまり、とちゅうで切れた道がなく、スタートが同じ色のゴールにつながる */
function solved(){
  const {w,h}=P, B=S.board, pm=portMap();
  if(B.some(c=>!c))return false;
  for(let r=0;r<h;r++)for(let c=0;c<w;c++)for(const e of ends(B[r*w+c])){
    const nr=r+DR[e][0], nc=c+DR[e][1];
    if(nr<0||nr>=h||nc<0||nc>=w){ if(!pm[[r,c,e].join()])return false; }
    else if(!ends(B[nr*w+nc]).includes((e+2)%4))return false;
  }
  for(const key of Object.keys(pm)){const [r,c,e]=key.split(',').map(Number); if(!ends(B[r*w+c]).includes(e))return false;}
  return trace().reach.slice(0,P.pairs.length).every(Boolean);
}
function boardSVG(){
  const {w,h}=P, M=34, VW=w*U+2*M, VH=h*U+2*M, {col,reach}=trace();
  let s='';
  /* スタートとゴール（盤の外）。道の入り口に短い道をかく */
  P.pairs.forEach(([sp,gp],ci)=>{[[sp,'S'],[gp,'G']].forEach(([[r,c,e],lb])=>{
    const cx=M+c*U+U/2, cy=M+r*U+U/2, ex=cx+DR[e][1]*U/2, ey=cy+DR[e][0]*U/2, px=cx+DR[e][1]*(U/2+M/2), py=cy+DR[e][0]*(U/2+M/2);
    s+=`<line x1="${ex}" y1="${ey}" x2="${px}" y2="${py}" stroke="${COL[ci]}" stroke-width="10" opacity=".45"/>`;
    s+= lb==='S'?`<circle cx="${px}" cy="${py}" r="14" fill="${COL[ci]}"/>`:`<rect x="${px-13}" y="${py-13}" width="26" height="26" rx="4" fill="${COL[ci]}"/>`;
    s+=`<text x="${px}" y="${py+5}" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" font-family="sans-serif">${lb}</text>`;
  });});
  for(let r=0;r<h;r++)for(let c=0;c<w;c++){
    const i=r*w+c, x=M+c*U, y=M+r*U, cell=S.board[i];
    if(cell){ const sg=segs(cell.t,cell.r); const cs=sg.map((_,si)=>{const v=col[i+':'+si]; return v==null?null:COL[v];});
      s+=tileSVG(cell.t,cell.r,x,y,{cols:cs,fixed:cell.lock==='fix',hint:cell.lock==='hint'}); }
    else s+=`<rect x="${x+2}" y="${y+2}" width="${U-4}" height="${U-4}" rx="5" fill="#f1ede4" stroke="#c9c0b0" stroke-width="1.5" stroke-dasharray="5 4"/>`;
    s+=`<rect class="cellhit" data-i="${i}" x="${x}" y="${y}" width="${U}" height="${U}" fill="transparent"/>`;
  }
  return {svg:`<svg id="bd" viewBox="0 0 ${VW} ${VH}" style="max-width:${Math.min(VW*1.05,480)}px" role="img" aria-label="パズルの盤">${s}</svg>`,reach};
}
function draw(){
  const p=P, {svg,reach}=boardSVG(), left=Object.values(S.cnt).reduce((a,b)=>a+b,0);
  app.innerHTML=`<div class="top"><span class="tag">${LVN[p.lv]}</span><b>${PAID?'第'+(+p.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>
    <div class="boardw">${svg}</div>
    <div class="pairs">${p.pairs.map((_,ci)=>`<span class="${reach[ci]?'done':''}" style="--c:${COL[ci]}"><i></i>${CNAME[ci]}${reach[ci]?' つながった':''}</span>`).join('')}</div>
    ${S.done?'':`<div class="label">手持ちのタイル（のこり ${left}まい）</div>
    <div class="tray">${['S','C','X','B'].filter(t=>S.types.includes(t)).map(t=>`<button class="stk ${S.sel===t?'sel':''}" data-t="${t}" ${S.cnt[t]?'':'disabled'} aria-label="${TNAME[t]} のこり${S.cnt[t]}まい">${oneTile(t,S.rot[t])}<span class="nm">${TNAME[t]}</span><span class="n">× ${S.cnt[t]}</span></button>`).join('')}${left?'':'<p class="note">全部置きました。</p>'}</div>
    <p class="msg" id="msg">${S.msg||(S.sel?'置きたいマスをタップしよう。もう一度タイルをタップすると向きが変わります。':'タイルをえらんでマスに置こう。置いたタイルはタップで回ります。')}</p>
    <div class="row"><button class="btn ${S.del?'on':''}" id="del">${S.del?'もどすのをやめる':'タイルをもどす'}</button><button class="btn" id="hint">ヒント</button><button class="btn" id="reset">やりなおす</button></div>
    <p class="note">置いたタイルを長おししても、手持ちにもどせます。ヒントを使うと、正しいタイルを1まい置きます（星がへります）。</p>`}
    <div id="after"></div>`;
  document.getElementById('back').onclick=home;
  if(S.done){ showClear(); return; }
  app.querySelectorAll('.stk').forEach(b=>b.onclick=()=>{const t=b.dataset.t; if(S.sel===t){S.rot[t]=(S.rot[t]+1)%4;} else S.sel=t; S.del=false; S.msg=''; draw();});
  document.getElementById('del').onclick=()=>{S.del=!S.del;S.sel=null;S.msg=S.del?'もどしたいタイルをタップしよう。':'';draw();};
  document.getElementById('hint').onclick=hint;
  document.getElementById('reset').onclick=()=>{S.board.forEach((c,i)=>{if(c&&!c.lock){S.cnt[c.t]++;S.board[i]=null;}});S.sel=null;S.del=false;S.msg='';draw();};
  bindBoard();
}
function bindBoard(){
  const bd=document.getElementById('bd'); let timer=null, longed=false, downI=null;
  bd.oncontextmenu=e=>e.preventDefault();
  bd.addEventListener('pointerdown',e=>{const el=e.target.closest('.cellhit'); if(!el)return; downI=+el.dataset.i; longed=false;
    clearTimeout(timer); timer=setTimeout(()=>{longed=true; removeAt(downI);},480);});
  const cancel=()=>{clearTimeout(timer);};
  bd.addEventListener('pointerleave',cancel); bd.addEventListener('pointercancel',cancel);
  bd.addEventListener('pointerup',e=>{clearTimeout(timer); const el=e.target.closest('.cellhit'); if(!el||longed||+el.dataset.i!==downI)return; tap(+el.dataset.i);});
}
function say(m){S.msg=m;}
function removeAt(i){
  const c=S.board[i]; if(!c){return;} if(c.lock){say(c.lock==='fix'?'はじめから置いてあるタイルは動かせません。':'ヒントで置いたタイルは動かせません。');draw();return;}
  S.cnt[c.t]++; S.board[i]=null; S.moves++; say(''); draw();
}
function tap(i){
  const c=S.board[i];
  if(S.del){ removeAt(i); return; }
  if(c&&c.lock){ say(c.lock==='fix'?'はじめから置いてあるタイルは動かせません。':'ヒントで置いたタイルは動かせません。'); draw(); return; }
  if(S.sel&&S.cnt[S.sel]>0){
    if(c){ if(c.t===S.sel){ c.r=(c.r+1)%4; S.moves++; afterMove(); return; } S.cnt[c.t]++; }
    S.board[i]={t:S.sel,r:S.rot[S.sel]}; S.cnt[S.sel]--; S.moves++;
    if(S.cnt[S.sel]===0)S.sel=null;
    afterMove(); return;
  }
  if(c){ c.r=(c.r+1)%4; S.moves++; afterMove(); return; }
  say('下の手持ちのタイルをえらんでから、マスをタップしよう。'); draw();
}
function afterMove(){ say(''); if(solved()){ S.done=true; S.sel=null; } draw(); }
function hint(){
  const {sol}=P, B=S.board;
  const want=i=>({t:sol[i][0],r:sol[i][1]});
  const wrong=B.map((c,i)=>i).filter(i=>!sameTile(B[i],want(i)));
  if(!wrong.length)return;
  /* 道のつながりが分かりやすいよう、スタートに近いマスからヒントを出す */
  const pm=P.pairs.flat(); const dist=i=>Math.min(...pm.map(([r,c])=>Math.abs(r-Math.floor(i/P.w))+Math.abs(c-i%P.w)));
  /* 草地より道のタイルを先に。道の中では、スタートやゴールに近いマスから */
  const isB=i=>sol[i][0]==='B'?1:0;
  wrong.sort((a,b)=>isB(a)-isB(b)||dist(a)-dist(b)||a-b);
  const i=wrong[0], w=want(i);
  if(B[i]&&B[i].t===w.t){ B[i].r=w.r; B[i].lock='hint'; }
  else{
    if(B[i]){ S.cnt[B[i].t]++; B[i]=null; }
    if(S.cnt[w.t]===0){ /* 手持ちにないときは、まちがった場所に置いてある同じ種類のタイルをもどす */
      const j=B.findIndex((c,k)=>c&&!c.lock&&c.t===w.t&&!sameTile(c,want(k))); if(j>=0){S.cnt[w.t]++;B[j]=null;}
    }
    S.cnt[w.t]--; B[i]={t:w.t,r:w.r,lock:'hint'};
  }
  S.hints++; S.sel=null; S.del=false;
  say(`ヒント：1まい置きました（ヒント ${S.hints}回）。`);
  if(solved())S.done=true;
  draw();
}
function showClear(){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints,moves:S.moves}); }
  const list=PAID?QS:QS, idx=list.indexOf(p), nx=list[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`ヒント ${S.hints}回でクリアしました。ヒントなしなら ★3つです。`:'ヒントなしでクリア！'}</span>
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
}

/* ---------- ホーム ---------- */
const RULES=`<ol class="rules">
  <li>下の<b>手持ちのタイル</b>をえらんで、盤のマスに置こう。</li>
  <li>置いたタイルは、タップすると<b>90°ずつ回ります</b>。</li>
  <li><b>同じ色</b>のスタート <b>S</b> とゴール <b>G</b> を、道でつなごう。</li>
  <li>タイルは<b>全部</b>使います。とちゅうで切れた道があってはいけません。</li>
  <li>レベル4・5には<b>立体交差</b>があります。たての道と横の道が、交わらずに通りぬけます。</li></ol>
  <div class="legend">${['S','C','X','B'].map(t=>`<figure>${oneTile(t,t==='C'?1:t==='S'?1:0)}<figcaption>${TNAME[t]}</figcaption></figure>`).join('')}</div>`;
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:'michi.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
