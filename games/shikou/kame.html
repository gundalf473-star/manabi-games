<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>カメの線</h1>
    <p class="lead">カメに「前へ」「右へ90°」「くり返す」と命令して、線をかこう。5つのレベルから1問ずつ。ヒントやまちがいなしでクリアすると★3つ。</p>
  </header>

<script>
(function(){
const PAID=false;
let QS=[{"kind":"build","sol":["F2","R90","F2"],"pal":["F1","F2","F3","R90","L90"],"lim":5,"minflat":3,"lv":1,"id":"1-01"},{"kind":"build","sol":["P4","F2","R90","E"],"pal":["F1","F2","F3","R90","L90","P2","P3","P4","E"],"lim":5,"minflat":7,"lv":2,"id":"2-01"},{"kind":"blank","prog":["P3","F3","R120","E"],"bi":2,"a":"R120","ds":["R45","R108","R60"],"once":false,"shape":"正三角形","lv":3,"id":"3-01"},{"kind":"build","sol":["P3","F2","R120","E"],"pal":["F1","F2","F3","R60","R90","R120","L60","L90","L120","P2","P3","P4","P5","P6","E"],"lim":5,"minflat":5,"lv":4,"id":"4-01"},{"kind":"blank","prog":["P5","F3","R144","E"],"bi":2,"a":"R144","ds":["R72","R108","R120"],"once":false,"lv":5,"id":"5-01"}];
const ID='kame';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>カメの線 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* カメの線：命令 'F2'（前へ2）, 'R90'（右へ90°）, 'L90'（左へ90°）, 'P4'（くり返す4回）…'E'（ここまで）
   p.kind='build'（sol, pal, lim）/ 'pick'（prog, opts[0]が正解）/ 'blank'（prog, bi:空らん, a, ds, once）
   線は「同じ直線上の線をつないだ集まり」でくらべるので、かく順番・重ねがきによらず、見本と同じ線ならどんなプログラムでも正解 */
const HINTWORD='ヒントやまちがい';
const LVD={1:'前へ・右へ・左へ（90°）',2:'くり返すを使おう',3:'正多角形と360°',4:'いろいろな角度・ぬけたカード',5:'星形と、くり返しの中のくり返し'};
const RULES=`<ol class="rules">
  <li>カメは、命令カードのとおりに動いて<b>線をかきます</b>。はじめは上を向いています。</li>
  <li>「<b>前へ 2</b>」は、向いている方へ2マス進んで線をかく。</li>
  <li>「<b>右へ 90°</b>」は、その場で<b>右を向く</b>（直角に向きをかえる。線はかかない）。「左へ 90°」は左を向く。右・左は<b>カメから見た</b>右・左です。</li>
  <li>90°（90度）は直角のこと。90°を4回で1周（360°）です。レベル3からは、60°や120°など、ほかの角度も出てきます。</li>
  <li>「<b>くり返す 4回</b>」と「<b>ここまで</b>」の間のカードは、4回くり返します。</li>
  <li>問題は3しゅるい：かける線を<b>予想する</b>／<b>？のカード</b>を当てる／カードをならべて<b>見本と同じ線</b>をかく。</li></ol>`;
const KM_U=40;
const kmLab=t=>t[0]==='F'?['➜',`前へ ${t.slice(1)}`]:t[0]==='R'?['↻',`右へ ${t.slice(1)}°`]:t[0]==='L'?['↺',`左へ ${t.slice(1)}°`]:t[0]==='P'?['🔁',`くり返す ${t.slice(1)}回`]:['⏹','ここまで'];
function kmParse(toks){const st=[[]],cnt=[];for(const t of toks){if(t[0]==='P'){st.push([]);cnt.push(+t.slice(1));}else if(t==='E'){if(st.length<2)return null;const b=st.pop(),n=cnt.pop();for(let i=0;i<n;i++)st[st.length-1].push(...b);}else st[st.length-1].push(t);}return st.length===1?st[0]:null;}
const kmRad=h=>h*Math.PI/180;
/* steps を動かして、線と各ステップのカメの位置を返す */
function kmSim(steps){let x=0,y=0,h=0;const segs=[],trace=[{x,y,h,n:0}];
  for(const t of steps){if(t[0]==='F'){const n=+t.slice(1),nx=x+n*Math.sin(kmRad(h)),ny=y-n*Math.cos(kmRad(h));segs.push([x,y,nx,ny,h]);x=nx;y=ny;}
    else if(t[0]==='R')h=((h+ +t.slice(1))%360+360)%360;else if(t[0]==='L')h=((h- +t.slice(1))%360+360)%360;
    trace.push({x,y,h,n:segs.length});}
  return {segs,trace};}
const r4=v=>{v=Math.round(v*1e4)/1e4;return Object.is(v,-0)?0:v;};
function kmCanon(segs){const L={};
  for(const [x1,y1,x2,y2,h] of segs){const a=h%180,s=Math.sin(kmRad(a)),c=Math.cos(kmRad(a)),o=r4(x1*c+y1*s),t1=x1*s-y1*c,t2=x2*s-y2*c,k=a+'|'+o;(L[k]=L[k]||[]).push([Math.min(t1,t2),Math.max(t1,t2)]);}
  const out=[];Object.keys(L).sort().forEach(k=>{const iv=L[k].sort((p,q)=>p[0]-q[0]);let cur=iv[0].slice();
    for(const [a,b] of iv.slice(1)){if(a<=cur[1]+1e-6)cur[1]=Math.max(cur[1],b);else{out.push(k+'|'+r4(cur[0])+'|'+r4(cur[1]));cur=[a,b];}}out.push(k+'|'+r4(cur[0])+'|'+r4(cur[1]));});
  return out.join(';');}
const kmSegsOf=toks=>{const st=kmParse(toks);return st?kmSim(st).segs:[];};
function kmBox(segsList){let x0=0,x1=0,y0=0,y1=0;segsList.forEach(ss=>ss.forEach(([a,b,c,d])=>{x0=Math.min(x0,a,c);x1=Math.max(x1,a,c);y0=Math.min(y0,b,d);y1=Math.max(y1,b,d);}));return {x0,x1,y0,y1};}
const kmLattice=toks=>toks.every(t=>!(t[0]==='R'||t[0]==='L')||(+t.slice(1))%90===0);
function kmTurtle(x,y,h,U,sc){sc=sc||1;const r=U*0.26*sc;
  return `<g transform="translate(${x*U},${y*U}) rotate(${h})"><ellipse cx="${-r*0.75}" cy="${-r*0.75}" rx="${r*0.3}" ry="${r*0.22}" fill="#4d7c3a"/><ellipse cx="${r*0.75}" cy="${-r*0.75}" rx="${r*0.3}" ry="${r*0.22}" fill="#4d7c3a"/><ellipse cx="${-r*0.75}" cy="${r*0.75}" rx="${r*0.3}" ry="${r*0.22}" fill="#4d7c3a"/><ellipse cx="${r*0.75}" cy="${r*0.75}" rx="${r*0.3}" ry="${r*0.22}" fill="#4d7c3a"/><circle cx="0" cy="${-r*1.15}" r="${r*0.38}" fill="#65a34b" stroke="#2f5a22" stroke-width="1.5"/><ellipse rx="${r*0.85}" ry="${r}" fill="#3f8a3a" stroke="#2f5a22" stroke-width="2"/><path d="M0,${-r*0.6} L${r*0.5},0 L0,${r*0.6} L${-r*0.5},0Z" fill="#7cc06a" opacity=".8"/></g>`;}
/* 図：target=灰色の見本, drawn=むらさきの線, turtle=[x,y,h] */
function kmSVG(o){const U=o.U||KM_U,box=o.box||kmBox([o.target||[],o.drawn||[]]),pad=o.pad||0.75;
  const X0=(box.x0-pad)*U,Y0=(box.y0-pad)*U,W=(box.x1-box.x0+2*pad)*U,H=(box.y1-box.y0+2*pad)*U;let s='';
  if(o.grid){for(let x=Math.ceil(box.x0-pad);x<=box.x1+pad;x++)for(let y=Math.ceil(box.y0-pad);y<=box.y1+pad;y++)s+=`<circle cx="${x*U}" cy="${y*U}" r="${U*0.045}" fill="#c9bfa8"/>`;}
  (o.target||[]).forEach(([a,b,c,d])=>{s+=`<line x1="${a*U}" y1="${b*U}" x2="${c*U}" y2="${d*U}" stroke="#cfc6b4" stroke-width="${U*0.2}" stroke-linecap="round"/>`;});
  (o.drawn||[]).forEach(([a,b,c,d])=>{s+=`<line x1="${a*U}" y1="${b*U}" x2="${c*U}" y2="${d*U}" stroke="${o.col||'#7c3aed'}" stroke-width="${U*(o.thin?0.1:0.09)}" stroke-linecap="round"/>`;});
  if(o.start)s+=`<circle cx="0" cy="0" r="${U*0.1}" fill="#e0342f"/>`;
  if(o.turtle)s+=kmTurtle(o.turtle[0],o.turtle[1],o.turtle[2],U,o.tsc);
  return `<svg ${o.id?`id="${o.id}"`:''} viewBox="${X0} ${Y0} ${W} ${H}" style="width:100%;max-width:${o.max||330}px;max-height:${o.maxh||330}px" role="img" aria-label="${o.label||'カメのかいた線'}">${s}</svg>`;}
const kmProgBox=(toks,inner)=>`<div class="prog" style="border-style:solid;${toks.some(t=>t[0]==='P')?'':'flex-direction:row;flex-wrap:wrap'}">${inner}</div>`;
function progHTML(toks,o){o=o||{};if(!toks.length)return '<span class="ph">ここにカードがならびます</span>';
  let depth=0;return toks.map((t,i)=>{if(t==='E')depth=Math.max(0,depth-1);const ind=depth;if(t[0]==='P')depth++;
    const bl=o.blank===i,lab=bl?(o.fill?kmLab(o.fill):['？','？']):kmLab(t),loop=(bl?(o.fill||P.a):t),isL=loop[0]==='P'||loop==='E';
    return `<${o.btn?'button':'span'} class="pcard ${isL?'loop':''} ${bl?'blank':''}" data-i="${i}" style="margin-left:${ind*16}px" ${o.btn&&S.run?'disabled':''}>${bl&&!o.fill?'<b style="padding:0 10px">？</b>':`<span>${lab[0]}</span>${lab[1]}`}</${o.btn?'button':'span'}>`;}).join('');}
let kmAnim=0;
function startStage(p){kmAnim++;P=p;S={hints:0,done:false,msg:'',prog:[],run:null,drawn:[],turtle:[0,0,0],wrong:[],elim:[],hint:0};
  if(p.kind==='pick')S.order=shuffle([0,1,2,3]);if(p.kind==='blank')S.opts=shuffle([p.a,...p.ds]);begin(p);draw();}
const kmTarget=()=>kmSegsOf(P.kind==='build'?P.sol:P.prog);
function boardHTML(){
  if(P.kind==='pick'&&!S.done&&S.run==null)return kmProgBox(P.prog,progHTML(P.prog));
  const T=kmTarget(),grid=kmLattice(P.kind==='build'?P.sol:P.prog);
  const show=P.kind==='pick'?[]:T;
  return `<div class="boardw">${kmSVG({id:'kmb',target:show,drawn:S.drawn,turtle:S.turtle,grid,box:kmBox([T,S.drawn]),start:false})}</div>`;
}
function qtext(){
  if(P.kind==='build')return `カードをならべて、灰色の<b>見本と同じ線</b>をかこう。`;
  if(P.kind==='pick')return `このプログラムでカメが動くと、<b>どんな線</b>がかける？`;
  return `見本の線をかくプログラムです。<b>？</b>に入るカードはどれ？${P.once?'（同じ線を2回なぞらずにかきます）':''}`;
}
function hintText(){
  const prog=P.kind==='build'?P.sol:P.prog,poly=kmPoly(prog);
  if(P.kind==='pick')return `カメになったつもりで、上のカードから1まいずつ動いてみよう。「くり返す」の間は、決まった回数だけくり返します。まちがいを${S.elim.length}つ消しました。`;
  const lap=poly?(poly.k===1?'<b>360°</b>（1周）':`360°の${poly.k}倍の <b>${360*poly.k}°</b>（星の形は${poly.k}周してもどります）`):'';
  if(poly&&P.a[0]==='P')return `カメがぐるっと回って元の向きにもどるまでに、まわる角度の合計は${lap}。1回に${poly.a}°ずつまわるなら、何回まわればよい？　まちがいを${S.elim.length}つ消しました。`;
  if(poly&&P.a[0]!=='F')return `カメがぐるっと回って元の向きにもどるまでに、まわる角度の合計は${lap}。${poly.n}回まわって元にもどるなら、1回に何度？　まちがいを${S.elim.length}つ消しました。`;
  return `？のカードに、それぞれの答えを入れて、カメを動かしてみよう。まちがいを${S.elim.length}つ消しました。`;
}
/* P n [F s, R a] の形なら {n,a,k:何周} */
function kmPoly(prog){if(prog.length===4&&prog[0][0]==='P'&&prog[1][0]==='F'&&prog[2][0]==='R'&&prog[3]==='E'){const n=+prog[0].slice(1),a=+prog[2].slice(1);if((n*a)%360===0)return {n,a,k:n*a/360};}return null;}
function optSVGs(){
  const L=P.opts.map(o=>kmSegsOf(o)),boxes=L.map(s=>kmBox([s]));
  const w=Math.max(...boxes.map(b=>b.x1-b.x0)),h=Math.max(...boxes.map(b=>b.y1-b.y0));
  return L.map((s,i)=>{const b=boxes[i],cx=(b.x0+b.x1)/2,cy=(b.y0+b.y1)/2;
    return kmSVG({drawn:s,box:{x0:cx-w/2,x1:cx+w/2,y0:cy-h/2,y1:cy+h/2},U:KM_U,max:150,maxh:150,thin:true,start:true,pad:0.4,label:'線の絵'});});
}
function draw(){
  const K=P.kind;
  let body='';
  if(K==='build'){
    body=S.done?'':`<div class="row" style="justify-content:space-between"><span class="label">プログラム</span><span class="note">カード ${S.prog.length} / ${P.lim}まい</span></div>
    <div class="prog">${progHTML(S.prog,{btn:true})}</div>
    <div class="palette">${P.pal.map(t=>`<button class="ccard ${t[0]==='P'||t==='E'?'loop':''}" data-t="${t}" ${S.run||S.prog.length>=P.lim?'disabled':''}><span>${kmLab(t)[0]}</span>${kmLab(t)[1]}</button>`).join('')}</div>
    <p class="msg ${S.msgc||''}" id="msg">${S.msg||'カードをタップしてならべよう。ならべたカードをタップすると消えます。'}</p>
    <div class="row"><button class="btn go" id="run" ${S.run||!S.prog.length?'disabled':''}>▶ スタート</button><button class="btn" id="back1" ${S.run?'disabled':''}>1まい消す</button><button class="btn" id="clr" ${S.run?'disabled':''}>全部消す</button><button class="btn" id="hint" ${S.run?'disabled':''}>ヒント</button></div>
    <p class="note">ヒントを使うと、正しいプログラムのはじめのほうのカードがならびます。見本と同じ線がかければ、どんなプログラムでも正解です。</p>`;
  }else if(K==='pick'){
    const sv=optSVGs();
    body=`<div class="opts4">${S.order.map((j,i)=>`<button class="ob ${S.done&&j===0?'right':''} ${S.wrong.includes(j)||S.elim.includes(j)?'wrong':''}" data-j="${j}" ${S.done||S.run||S.wrong.includes(j)||S.elim.includes(j)?'disabled':''}><span class="k">${'アイウエ'[i]}</span>${sv[j]}</button>`).join('')}</div>
      <p class="note">赤い点は、カメがスタートした場所です。</p>`;
  }else{
    body=`${kmProgBox(P.prog,progHTML(P.prog,{blank:P.bi,fill:S.done||S.run?P.a:null}))}
      <div class="opts4 txt">${S.opts.map((o,i)=>`<button class="ob ${S.done&&o===P.a?'right':''} ${S.wrong.includes(o)||S.elim.includes(o)?'wrong':''}" data-o="${o}" ${S.done||S.run||S.wrong.includes(o)||S.elim.includes(o)?'disabled':''}><span class="k">${'アイウエ'[i]}</span><b style="font-size:17px">${kmLab(o)[1]}</b></button>`).join('')}</div>`;
  }
  app.innerHTML=`${topBar()}
    ${K==='pick'&&!S.done&&S.run==null?'':boardHTML()}
    <p class="qq">${qtext()}</p>
    ${K==='pick'&&!S.done&&S.run==null?boardHTML():K==='pick'?kmProgBox(P.prog,progHTML(P.prog)):''}
    ${body}
    ${K!=='build'&&S.hint&&!S.done?`<p class="hintbox">${hintText()}</p>`:''}
    ${K!=='build'&&!S.done?`<p class="msg ${S.msgc||''}" id="msg">${S.msg||''}</p><div class="row"><button class="btn" id="hint" ${S.hint>=2||S.run?'disabled':''}>ヒント</button></div>`:''}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(explain());return;}
  const hb=document.getElementById('hint');
  if(K==='build'){
    app.querySelectorAll('.ccard').forEach(b=>b.onclick=()=>{if(S.prog.length<P.lim){S.prog.push(b.dataset.t);reset();draw();}});
    app.querySelectorAll('.pcard').forEach(b=>b.onclick=()=>{S.prog.splice(+b.dataset.i,1);reset();draw();});
    document.getElementById('run').onclick=go;
    document.getElementById('back1').onclick=()=>{S.prog.pop();reset();draw();};
    document.getElementById('clr').onclick=()=>{S.prog=[];reset();draw();};
    hb.onclick=()=>{S.hints++;const k=Math.min(P.sol.length,Math.ceil(P.sol.length*S.hints/3));S.prog=P.sol.slice(0,k);reset();
      S.msg=`ヒント：はじめの${k}まいをならべました（ヒント ${S.hints}回）。${k>=P.sol.length?'このままスタートしよう。':'つづきを考えよう。'}`;S.msgc='';draw();};
    return;
  }
  if(K==='pick')app.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;
    if(j===0){S.msg='せいかい！　カメが線をかきます…';S.msgc='ok';play(P.prog,()=>{S.done=true;draw();});}
    else{S.wrong.push(j);S.hints++;S.msg='ちがいます。もう一度、カードを順に追ってみよう。';S.msgc='ng';draw();}});
  if(K==='blank')app.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{const o=b.dataset.o;
    if(o===P.a){S.msg='せいかい！　カメが線をかきます…';S.msgc='ok';play(P.prog,()=>{S.done=true;draw();});}
    else{S.wrong.push(o);S.hints++;S.msg='ちがいます。そのカードだと、見本と同じ線になりません。';S.msgc='ng';draw();}});
  hb.onclick=()=>{S.hint++;S.hints++;S.msg='';
    const c=K==='pick'?[1,2,3].filter(j=>!S.wrong.includes(j)&&!S.elim.includes(j)):S.opts.filter(o=>o!==P.a&&!S.wrong.includes(o)&&!S.elim.includes(o));
    if(c.length>1)S.elim.push(c[0]);draw();};
}
function reset(){kmAnim++;S.drawn=[];S.turtle=[0,0,0];S.msg='';S.msgc='';S.run=null;}
/* プログラムを動かしてアニメーション */
function play(toks,onEnd){
  const steps=kmParse(toks),{segs,trace}=kmSim(steps),my=++kmAnim,me=P;S.run=true;S.drawn=[];S.turtle=[0,0,0];draw();
  let i=0;const dt=Math.max(45,Math.min(320,4200/steps.length));
  const tick=()=>{if(my!==kmAnim||P!==me)return;
    if(i>=trace.length-1){S.run=null;onEnd();return;}
    i++;const t=trace[i];S.drawn=segs.slice(0,t.n);S.turtle=[t.x,t.y,t.h];
    const el=document.getElementById('kmb');if(el){const T=kmTarget();el.outerHTML=kmSVG({id:'kmb',target:P.kind==='pick'?[]:T,drawn:S.drawn,turtle:S.turtle,grid:kmLattice(P.kind==='build'?P.sol:P.prog),box:kmBox([T,segs])});}
    setTimeout(tick,dt);};
  setTimeout(tick,300);
}
function go(){
  const steps=kmParse(S.prog);
  if(!steps){S.msg='「くり返す」と「ここまで」の数が合っていません。';S.msgc='ng';draw();return;}
  if(S.prog.filter(t=>t[0]==='P').length!==S.prog.filter(t=>t==='E').length){S.msg='「くり返す」と「ここまで」の数が合っていません。';S.msgc='ng';draw();return;}
  play(S.prog,()=>{
    const ok=kmCanon(kmSim(steps).segs)===kmCanon(kmSegsOf(P.sol));
    if(ok){S.done=true;}else{S.msg='見本とちがう線になりました。灰色の線と見くらべて、プログラムを直そう。';S.msgc='ng';}
    draw();});
}
function explain(){
  const prog=P.kind==='build'?P.sol:P.prog,poly=kmPoly(prog),flat=kmParse(prog).length;
  let t='';
  if(poly&&poly.k===1)t+=`<p style="margin:0">カメは${poly.n}回まわって、ちょうど1周（360°）で元の向きにもどります。だから1回に <b>360° ÷ ${poly.n} ＝ ${poly.a}°</b> まわると、${({3:'正三角形',4:'正方形',5:'正五角形',6:'正六角形',8:'正八角形'})[poly.n]||'正多角形'}がかけます。</p>`;
  else if(poly)t+=`<p style="margin:0">${poly.a}°ずつ${poly.n}回まわると、合計 ${poly.a} × ${poly.n} ＝ ${poly.a*poly.n}°。<b>${poly.k}周</b>して元の向きにもどるので、とがった星の形になります。</p>`;
  if(P.kind==='build'){const mine=S.prog.length;
    t+=`<p style="margin:0">あなたのプログラムはカード${mine}まい。${prog.some(x=>x[0]==='P')?`<br>れい：<span class="note">${prog.map(x=>kmLab(x)[1]).join('、')}</span>`:''}</p>`;}
  if(prog.some(x=>x[0]==='P'))t+=`<p style="margin:0">くり返しを使わずに書くと、カードは${flat}まいになります。くり返しを使うと、${prog.length}まいですみます。</p>`;
  if(!t)t=`<p style="margin:0">カードを上から順に動かすと、この線がかけます。</p>`;
  return t;
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
