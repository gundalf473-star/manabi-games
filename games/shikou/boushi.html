/* ======== パズルごとの部分 ======== */
/* ぼうしの色パズル：p={n,vis:'circle'|'line',wall,rule,hats:[1赤0白],events:[{t:'say',who,know}|{t:'round',knowers}],q:'hat'|'who',H:[？の人],ans,combos,el,kn,se,txt:{rule,vis,ev}} */
const HINTWORD='ヒントやまちがい';

const RULES=`<ol class="rules">
  <li>みんな、<b>自分のぼうしは見えません</b>。見えるのは、ほかの人のぼうしだけ。</li>
  <li>みんな<b>かしこくて、うそはつきません</b>。ぼうしの数のきまりや先生の話は、全員が知っています。</li>

  <li>「わからない」「だれも手をあげない」も、<b>大事な手がかり</b>です。</li>

const SH=['#3b82f6','#16a34a','#f59e0b','#a855f7'],NMS=['A','B','C','D'];
const RED='#e0342f',WHT='#ffffff';

  const hid=c==null, fill=hid?'#d8d3cc':c?RED:WHT, st=hid?'#8a8178':c?'#9b1c17':'#8a8178';

}

  /* side=true: 右を向いた横顔（1列）。false: 正面 */
  const sc=SH[i];let g='';
  g+=`<rect x="${x-20}" y="${y+20}" width="40" height="40" rx="14" fill="${sc}"/>`;
  g+=`<circle cx="${x}" cy="${y}" r="21" fill="#fde2c4" stroke="#b98a5e" stroke-width="1.5"/>`;
  if(side){g+=`<circle cx="${x+11}" cy="${y-2}" r="2.6" fill="#2a2520"/><path d="M${x+20},${y+3} l5,3 l-5,2" fill="#fde2c4" stroke="#b98a5e" stroke-width="1.2"/><path d="M${x+6},${y+11} q5,3 10,0" stroke="#b5523b" stroke-width="1.6" fill="none"/>`;}
  else{g+=`<circle cx="${x-7}" cy="${y-1}" r="2.6" fill="#2a2520"/><circle cx="${x+7}" cy="${y-1}" r="2.6" fill="#2a2520"/><path d="M${x-5},${y+9} q5,4 10,0" stroke="#b5523b" stroke-width="1.6" fill="none"/>`;}
  const c=P.H.includes(i)?(S.pick[i]==null?null:S.pick[i]):P.hats[i];
  const canTap=!S.done&&P.q==='hat'&&P.H.includes(i);
  g+=`<g class="${canTap?'bshat':''}" data-i="${i}" ${canTap?'style="cursor:pointer"':''}>${canTap?`<rect x="${x-26}" y="${y-48}" width="52" height="36" fill="transparent"/>`:''}${hat(x,y-15,1,c)}</g>`;
  if(sel)g+=`<rect x="${x-28}" y="${y-44}" width="56" height="112" rx="12" fill="none" stroke="${'#7c3aed'}" stroke-width="3"/><circle cx="${x+24}" cy="${y+56}" r="11" fill="#7c3aed"/><path d="M${x+19},${y+56} l4,4 l7,-8" stroke="#fff" stroke-width="2.6" fill="none"/>`;
  g+=`<text x="${x}" y="${y+46}" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" font-family="sans-serif">${NMS[i]}</text>`;
  return `<g class="${!S.done&&P.q==='who'?'bswho':''}" data-i="${i}" ${!S.done&&P.q==='who'?'style="cursor:pointer"':''}>${P.q==='who'?`<rect x="${x-28}" y="${y-44}" width="56" height="112" fill="transparent"/>`:''}${g}</g>`;
}
function figure(){
  const n=P.n;let s='',W=340,H;
  if(P.vis==='line'){
    const gap=n===4?78:n===3?96:120, x0=W/2-gap*(n-1)/2;H=150;
    s+=`<rect x="4" y="120" width="${W-8}" height="10" rx="5" fill="#e9e1d3"/>`;
    for(let i=0;i<n;i++){const x=x0+i*gap;s+=person(i,x,62,true,S.sel.includes(i));}
    if(P.wall!=null){const wx=x0+(P.wall-0.5)*gap;s+=`<rect x="${wx-5}" y="8" width="10" height="122" rx="3" fill="#a8896a" stroke="#6f5640" stroke-width="1.5"/><text x="${wx}" y="146" text-anchor="middle" font-size="11" fill="#6f5640" font-family="sans-serif">かべ</text>`;}
    s+=`<text x="${W-8}" y="146" text-anchor="end" font-size="12" font-weight="700" fill="#7c3aed" font-family="sans-serif">前 →</text><text x="8" y="146" font-size="12" fill="#6a625a" font-family="sans-serif">後ろ</text>`;
  }else{
    H=n===2?150:206;const cx=W/2,cy=n===2?80:110;
    s+=`<ellipse cx="${cx}" cy="${cy+30}" rx="${n===2?70:96}" ry="${n===2?26:46}" fill="#efe6d6" stroke="#d9ccb5" stroke-width="2"/>`;
    const pos=n===2?[[cx-80,60],[cx+80,60]]:n===3?[[cx-110,92],[cx,52],[cx+110,92]]:[[cx-122,104],[cx-44,52],[cx+44,52],[cx+122,104]];
    for(let i=0;i<n;i++)s+=person(i,pos[i][0],pos[i][1],false,S.sel.includes(i));
  }
  return `<svg id="bsfig" viewBox="0 0 ${W} ${H}" style="max-width:420px" role="img" aria-label="ぼうしをかぶった${n}人">${s}</svg>`;
}
function seesText(){
  if(P.vis==='circle')return `<ul class="bssee"><li>どの人も、<b>自分いがいの全員のぼうし</b>が見える（自分のぼうしだけ見えない）。</li></ul>`;
  return `<ul class="bssee">${P.se.map((l,i)=>`<li><b style="color:${SH[i]}">${NMS[i]}さん</b>に見える：${l.length?l.map(j=>NMS[j]+'さん').join('・')+'のぼうし':'だれのぼうしも見えない'}</li>`).join('')}</ul>`;
}
function mini(w,cls,label){
  return `<div class="bscb ${cls}">${w.map(c=>`<svg viewBox="0 0 34 26" width="${P.n===4?18:22}" height="${P.n===4?14:17}" aria-hidden="true">${hat(17,22,.62,c)}</svg>`).join('')}${label?`<span>${label}</span>`:''}</div>`;
}
const CN='①②③④⑤⑥';
function comboPanel(level,final){
  /* level：0=表だけ、k=k番目の発言まで消す、E+1=見えるぼうしで消す */
  const E=P.events.length;
  const head=`<div class="bscb hd">${NMS.slice(0,P.n).map(c=>`<b style="width:${P.n===4?18:22}px">${c}</b>`).join('')}</div>`;
  const items=P.combos.map((w,k)=>{const e=P.el[k];
    let cls='',lab='';
    if(e>0&&e<=E&&e<=level){cls='x';lab=CN[e-1]+'で消える';}
    else if(e===99&&level>E){cls='x';lab='見えている色とちがう';}
    else if(final&&w.join()===P.hats.join()){cls='me';lab='ほんとう';}
    return mini(w,cls,lab);}).join('');
  return `<div class="bspanel"><div class="bslab">ありえる組み合わせ（赤＝<span style="color:${RED}">●</span> 白＝○）</div><div class="bscombos">${head}${items}</div></div>`;
}
function startStage(p){
  P=p;S={pick:{},sel:[],hl:-1,hints:0,done:false,msg:'',msgc:'',hmsg:[]};
  begin(p);draw();
}
function qText(){
  if(P.q==='hat')return P.H.length===1?`${NMS[P.H[0]]}さんのぼうし（？）は 何色？ タップして色を決めよう。`:`？のぼうしは それぞれ何色？ タップして色を決めよう。`;
  return `今、<b>自分のぼうしの色がわかっている人</b>はだれ？ 全部タップしてえらぼう（いなければ、えらばずに決定）。`;
}
function draw(){
  const E=P.events.length;
  app.innerHTML=`${topBar()}
    <div class="bsstory"><p>${esc(P.txt.rule)}</p><p>${esc(P.txt.vis)}</p>${E?`<p>みんな かしこくて、うそはつきません。${P.events[0].t==='say'?'①から順番に1人ずつ話し、話したことは 全員に聞こえます。':'手は 全員がいっせいにあげ、だれが手をあげたかは 全員にわかります。'}</p>`:''}</div>
    <div class="boardw">${figure()}</div>
    ${seesText()}
    ${E?`<div class="bslab">そのあと…</div><ol class="bsev">${P.txt.ev.map((t,k)=>`<li><b>${CN[k]}</b><span>${esc(t)}</span></li>`).join('')}</ol>`:''}
    <p class="qq">${qText()}</p>
    ${S.done?'':`<p class="msg ${S.msgc}" id="msg">${S.msg}</p>
    <div class="row"><button class="btn go" id="ok">${P.q==='who'&&!S.sel.length?'「だれもわからない」で決定':'決定'}</button><button class="btn" id="hint">ヒント</button></div>
    ${S.hl>=0?comboPanel(S.hl,false)+`<div class="hintbox">${S.hmsg.map(t=>`<p style="margin:2px 0">${t}</p>`).join('')}</div>`:''}`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(explain());return;}
  app.querySelectorAll('.bshat').forEach(g=>g.addEventListener('click',()=>{const i=+g.dataset.i;S.pick[i]=S.pick[i]===1?0:1;S.msg='';S.msgc='';draw();}));
  app.querySelectorAll('.bswho').forEach(g=>g.addEventListener('click',()=>{const i=+g.dataset.i;S.sel=S.sel.includes(i)?S.sel.filter(x=>x!==i):S.sel.concat(i).sort();S.msg='';S.msgc='';draw();}));
  document.getElementById('ok').onclick=answer;
  document.getElementById('hint').onclick=hint;
}
function answer(){
  if(P.q==='hat'){
    if(P.H.some(i=>S.pick[i]==null)){S.msg='？のぼうしを全部タップして、赤か白に決めよう。';S.msgc='ng';draw();return;}
    if(P.H.every(i=>S.pick[i]===P.hats[i])){S.done=true;draw();return;}
    S.hints++;S.msg='ちがいます。ありえる組み合わせを、1つずつ考えてみよう（ヒントも使えます）。';S.msgc='ng';draw();return;
  }
  if(S.sel.join()===P.ans.join()){S.done=true;draw();return;}
  S.hints++;S.msg='ちがいます。1人ずつ、その人の目になって「見えるぼうし」と「聞いた話」から考えよう。';S.msgc='ng';draw();
}
function evReason(k){
  const e=P.events[k],c=CN[k];
  if(e.t==='say'){const X=NMS[e.who]+'さん';
    return e.know?`${c} ${X}は「わかった」。消えた組み合わせだったら、${X}に見えるぼうしが同じで ${X}の色だけちがう組み合わせも残っていて、${X}はまようはず。だから、それはありません。`
      :`${c} ${X}は「わからない」。消えた組み合わせだったら、${X}は 見えるぼうしだけで自分の色がわかってしまうはず。だから、それはありません。`;}
  return `${c} ${e.knowers.length?e.knowers.map(i=>NMS[i]+'さん').join('・')+'だけが手をあげた':'だれも手をあげなかった'}。消えた組み合わせだったら、手をあげる人がちがっていたはず。だから、それはありません。`;
}
function finalReason(){
  if(P.q==='hat')return `見えているぼうしと色がちがう組み合わせを消すと、残りは1つ。だから ${P.H.map(i=>`${NMS[i]}さんは${P.hats[i]?'赤':'白'}`).join('、')}です。`;
  return `残った組み合わせの中に、その人に見えるぼうしが同じで、その人の色だけがちがう組み合わせがあれば「わからない」、なければ「わかる」。${P.kn.map((k,i)=>`${NMS[i]}さん：${k?'わかる':'わからない'}`).join('、')}。`;
}
function hint(){
  const E=P.events.length;
  if(S.hl>=E+1){S.msg='ヒントはここまで。表を見て答えよう。';S.msgc='';draw();return;}
  S.hl++;S.hints++;
  if(S.hl===0)S.hmsg=['ヒント：きまりに合う「ありえる組み合わせ」は、これで全部です（左からA・B…の順）。'];
  else if(S.hl<=E)S.hmsg.push(evReason(S.hl-1));
  else S.hmsg.push(P.q==='hat'?'見えているぼうしと色がちがう組み合わせも消してみよう。':'残った組み合わせで、1人ずつ「その人の色だけがちがう組み合わせ」があるか見てみよう。');
  S.msg='';draw();
}
function explain(){
  const E=P.events.length;
  const lines=[];for(let k=0;k<E;k++)lines.push(`<li>${evReason(k)}</li>`);lines.push(`<li>${finalReason()}</li>`);
  return `<p style="margin:0">${P.q==='hat'?`？のぼうしは ${P.H.map(i=>`${NMS[i]}さん＝<b>${P.hats[i]?'赤':'白'}</b>`).join('、')}。`:`わかる人は ${P.ans.length?P.ans.map(i=>`<b>${NMS[i]}さん</b>`).join('・'):'<b>だれもいない</b>'}。`}</p>
    <details open><summary style="cursor:pointer;font-weight:700;font-size:14px">考え方を見る</summary>${comboPanel(E+1,true)}<ol class="bssteps">${lines.join('')}</ol></details>`;
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
