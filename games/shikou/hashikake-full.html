<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>橋かけパズル 100問</h1>
    <p class="lead">島と島のあいだをタップして橋をかけよう。島の数字は、そこから出る橋の本数。5つのレベルに20問ずつ。ヒントなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=true;
let QS=[];
const ID='hashikake';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>橋かけパズル 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* 橋かけパズル：p={w,h,isl:[[r,c,n],…],sol:[[i,j,本数],…],taps} 島の数＝その島から出る橋の本数。橋は交わらない。全部の島が1つにつながる */
const HINTWORD='ヒント';
const LVD={1:'4×4 ・ 島3〜4こ',2:'5×5 ・ 島5〜6こ',3:'6×6 ・ 島7〜9こ',4:'7×7 ・ 島10〜13こ',5:'8×8・9×9 ・ 島13〜20こ'};
const RULES=`<ol class="rules">
  <li>丸い<b>島</b>どうしを、<b>橋</b>でつなごう。島と島の<b>あいだをタップ</b>すると、橋が 1本 → 2本 → なし と変わります。</li>
  <li>島の<b>数字</b>は、その島から出る<b>橋の本数</b>です。</li>
  <li>橋は<b>たて・横</b>にまっすぐだけ。ほかの橋と<b>交わってはいけません</b>。</li>
  <li>すべての島が橋で<b>1つにつながったら</b>クリア。</li></ol>`;
const U=56, M=8;
let HE=null, HX=null;
function hkEdges(p){
  const at={}; p.isl.forEach(([r,c],i)=>{at[r+','+c]=i;});
  const E=[];
  p.isl.forEach(([r,c],i)=>{[[0,1],[1,0]].forEach(([dr,dc])=>{let rr=r+dr,cc=c+dc;const cells=[];
    while(rr<p.h&&cc<p.w&&at[rr+','+cc]==null){cells.push(rr+','+cc);rr+=dr;cc+=dc;}
    if(rr<p.h&&cc<p.w)E.push({i,j:at[rr+','+cc],cells,hor:dr===0});});});
  const X=E.map((e,a)=>E.map((f,b)=>b).filter(b=>b!==a&&E[b].cells.some(x=>e.cells.includes(x))));
  return [E,X];
}
function startStage(p){
  P=p; [HE,HX]=hkEdges(p);
  S={v:HE.map(()=>0),lock:HE.map(()=>false),hints:0,taps:0,done:false,msg:'',sel:null};
  begin(p); draw();
}
const solVal=k=>{const e=HE[k];const s=P.sol.find(([a,b])=>(a===e.i&&b===e.j)||(a===e.j&&b===e.i));return s?s[2]:0;};
const cnt=i=>HE.reduce((s,e,k)=>s+((e.i===i||e.j===i)?S.v[k]:0),0);
function linked(){
  const n=P.isl.length,par=[...Array(n).keys()],f=x=>{while(par[x]!==x)x=par[x]=par[par[x]];return x;};
  HE.forEach((e,k)=>{if(S.v[k])par[f(e.i)]=f(e.j);});
  return new Set(par.map((_,x)=>f(x))).size===1;
}
const allNum=()=>P.isl.every((x,i)=>cnt(i)===x[2]);
const cx=c=>M+c*U+U/2, cy=r=>M+r*U+U/2;
function boardInner(){
  let s='';
  for(let r=0;r<P.h;r++)for(let c=0;c<P.w;c++)s+=`<circle cx="${cx(c)}" cy="${cy(r)}" r="2" fill="#d6cdbd"/>`;
  HE.forEach((e,k)=>{const a=P.isl[e.i],b=P.isl[e.j];const x1=cx(a[1]),y1=cy(a[0]),x2=cx(b[1]),y2=cy(b[0]);
    if(!S.v[k]){ if(!S.done)s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#c9bfae" stroke-width="2" stroke-dasharray="3 6"/>`; return; }
    const col=S.lock[k]?'#7c3aed':'#8b5a2b', w=7;
    if(S.v[k]===1)s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;
    else{const o=7,dx=e.hor?0:o,dy=e.hor?o:0;
      s+=`<line x1="${x1-dx}" y1="${y1-dy}" x2="${x2-dx}" y2="${y2-dy}" stroke="${col}" stroke-width="${w-1}" stroke-linecap="round"/><line x1="${x1+dx}" y1="${y1+dy}" x2="${x2+dx}" y2="${y2+dy}" stroke="${col}" stroke-width="${w-1}" stroke-linecap="round"/>`;}
  });
  P.isl.forEach(([r,c,n],i)=>{const k=cnt(i);
    const st=k===n?['#d4f0dc','#1d7a4c']:k>n?['#f8e3e1','#c8352d']:['#fff','#3b2f6b'];
    const sel=S.sel===i;
    const big=P.w>=8;
    s+=`<circle cx="${cx(c)}" cy="${cy(r)}" r="${U*(big?0.41:0.36)}" fill="${st[0]}" stroke="${sel?'#f59e0b':st[1]}" stroke-width="${sel?5:3}"/>
      <text x="${cx(c)}" y="${cy(r)+(big?11:9)}" text-anchor="middle" font-size="${big?31:26}" font-weight="700" fill="${st[1]}" font-family="sans-serif">${n}</text>`;});
  return s;
}
function boardSVG(){const VW=P.w*U+2*M,VH=P.h*U+2*M;return `<svg id="bd" viewBox="0 0 ${VW} ${VH}" style="max-width:${Math.min(VW*1.05,480)}px" role="img" aria-label="橋かけパズルの盤">${boardInner()}</svg>`;}
const statText=()=>`数がぴったりの島 ${P.isl.filter((x,i)=>cnt(i)===x[2]).length} / ${P.isl.length}　・　タップ ${S.taps}回`;
function draw(){
  app.innerHTML=`${topBar()}
    <div class="boardw">${boardSVG()}</div>
    <div class="row"><span class="note" id="stat">${statText()}</span></div>
    ${S.done?'':`<p class="msg ${S.msgc||''}" id="msg">${S.msg||'島と島のあいだをタップして、橋をかけよう。'}</p>
    <div class="row"><button class="btn" id="hint">ヒント</button><button class="btn" id="reset">やりなおす</button></div>
    <p class="note">数がぴったりの島は<b style="color:var(--ok)">緑</b>、多すぎる島は<b style="color:var(--ng)">赤</b>になります。島を1つタップしてから、となりの島をタップしても橋をかけられます。ヒントを使うと、正しい橋を1か所かけます（星がへります）。</p>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(explain());return;}
  document.getElementById('hint').onclick=hint;
  document.getElementById('reset').onclick=()=>{S.v=S.v.map((x,k)=>S.lock[k]?x:0);S.sel=null;S.msg='';S.msgc='';draw();};
  bind();
}
function explain(){
  const tot=P.sol.reduce((s,x)=>s+x[2],0);
  const tip=P.lv<=2?'「数字が、行ける方向の数×2」の島は、どの方向にも2本ずつかけると決まります。':
    P.lv<=3?'まず、行ける方向が少ない島から考えよう。「3」の島が2方向にしか行けないなら、どちらにも少なくとも1本はかかります。':
    '「全部の島がつながる」というルールも手がかりです。「1」と「1」の島どうしをつなぐと、そこだけで閉じてしまうので、つなげません。';
  return `<p style="margin:0">橋は全部で <b>${tot}本</b>。いちばん少ないタップは <b>${P.taps}回</b>（あなたは ${S.taps}回）。</p><p style="margin:0" class="note">コツ：${tip}</p>`;
}
function ptOf(e,svg){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());return [(q.y-M)/U-0.5,(q.x-M)/U-0.5];}
function edgeAt(y,x){
  /* 近い候補の中で、すでに橋がある線 → 交わらずにかけられる線 → 近い線 の順にえらぶ（交差点のあたりでのタップのずれを防ぐ） */
  let best=null,bk=null;
  HE.forEach((e,k)=>{const a=P.isl[e.i],b=P.isl[e.j];let d=null;
    if(e.hor){const t=Math.abs(y-a[0]);if(t<0.5&&x>a[1]+0.3&&x<b[1]-0.3)d=t;}
    else{const t=Math.abs(x-a[1]);if(t<0.5&&y>a[0]+0.3&&y<b[0]-0.3)d=t;}
    if(d==null)return;
    const key=[S.v[k]?0:1, HX[k].some(z=>S.v[z])?1:0, d];
    if(!bk||key[0]<bk[0]||(key[0]===bk[0]&&(key[1]<bk[1]||(key[1]===bk[1]&&key[2]<bk[2])))){bk=key;best=k;}});
  return best;
}
function islAt(y,x){return P.isl.findIndex(([r,c])=>Math.hypot(r-y,c-x)<0.45);}
function bind(){
  const svg=document.getElementById('bd');
  svg.addEventListener('pointerdown',ev=>{
    ev.preventDefault();
    const [y,x]=ptOf(ev,svg); const i=islAt(y,x);
    if(i>=0){
      if(S.sel==null||S.sel===i){S.sel=S.sel===i?null:i;refresh();say(S.sel==null?'':'つなぎたい島をタップしよう。');return;}
      const k=HE.findIndex(e=>(e.i===S.sel&&e.j===i)||(e.j===S.sel&&e.i===i));
      S.sel=null;
      if(k<0){refresh();say('その2つの島は、まっすぐ見えていないので、つなげません。',1);return;}
      return tap(k);
    }
    const k=edgeAt(y,x); S.sel=null;
    if(k==null){refresh();return;}
    tap(k);
  });
}
function tap(k){
  if(S.lock[k]){refresh();say('ヒントでかけた橋は動かせません。',1);return;}
  const nv=(S.v[k]+1)%3;
  if(nv>0&&HX[k].some(x=>S.v[x])){refresh();say('ほかの橋と交わるので、かけられません。',1);return;}
  S.v[k]=nv; S.taps++;
  if(allNum()){
    if(linked()){S.done=true;draw();return;}
    refresh();say('数は全部ぴったり！でも、島が1つにつながっていません。',1);return;
  }
  refresh();say('');
}
function refresh(){const bd=document.getElementById('bd');if(bd)bd.innerHTML=boardInner();const st=document.getElementById('stat');if(st)st.textContent=statText();}
function say(m,ng){const el=document.getElementById('msg');if(el){el.textContent=m||'島と島のあいだをタップして、橋をかけよう。';el.className='msg '+(ng?'ng':'');}}
function hint(){
  /* まちがっている橋（多すぎる橋を先に）を1か所、正しくする */
  let ks=HE.map((_,k)=>k).filter(k=>!S.lock[k]&&S.v[k]!==solVal(k));
  if(!ks.length)return;
  ks.sort((a,b)=>(S.v[b]>solVal(b))-(S.v[a]>solVal(a))||solVal(b)-solVal(a));
  const k=ks.find(k=>solVal(k)>0)??ks[0];
  const sv=solVal(k);
  if(sv>0)HX[k].forEach(x=>{if(!S.lock[x])S.v[x]=0;});
  S.v[k]=sv; S.lock[k]=sv>0; S.hints++; S.sel=null;
  const e=HE[k];
  S.msg=sv?`ヒント：むらさきの橋は${sv}本が正しい（ヒント ${S.hints}回）。`:`ヒント：そこの橋はいりません。消しました（ヒント ${S.hints}回）。`; S.msgc='';
  if(allNum()&&linked())S.done=true;
  draw();
}

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
