<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>ナイトの旅 100問</h1>
    <p class="lead">L字にとぶナイトを動かして、旗をめざしたり、★を全部回ったり、コンピューターと競争したりしよう。5つのレベルに20問ずつ。ヒントややり直しなし、最短の手数でクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=true;
let QS=[];
const ID='knight';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>ナイトの旅 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* ナイトの旅：p.kind='reach'（start→goal、opt最短）| 'visit'（marksを全部、opt最短）| 'race'（you/cpu/goal、cpulv weak|strong、win＝必勝の手数）
   rocks＝岩。座標は [行,列]。 */
const HINTWORD='ヒントややり直し・遠回り';
const LVD={1:'1〜2手でゴール',2:'岩をよけて3〜4手',3:'★を全部回る',4:'コンピューターと競争',5:'★をたくさん・つよい相手'};
const RULES=`<ol class="rules">
  <li><b>ナイト（桂馬のような動き）</b>は、<b>たて2マス・横1マス</b>か、<b>横2マス・たて1マス</b>の「L字」の先へとびます。前後左右どの向きでも動けます。</li>
  <li>とちゅうに岩があってもとびこえられますが、<b>岩のマスには止まれません</b>。</li>
  <li>動けるマスに <b style="color:#7c3aed">●</b> が出ます。タップしてナイトを動かそう。</li>
  <li><b>ゴールへ</b>：旗のマスまで行こう。<b>最短の手数</b>で着くと★3つ。　<b>全部回る</b>：★のマスを全部通ろう（順番は自由）。</li>
  <li><b>競争</b>：あなた（むらさき）とコンピューター（オレンジ）が交代に1回ずつ動かします。<b>先に旗に着くか、相手のナイトのマスに入って、つかまえたら勝ち</b>。勝てばクリアです。動けないときは1回休み。</li>
  <li>ヒントを使うと、おすすめのマスが光ります（星がへります）。</li></ol>`;
const KM=[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
const key=p=>p[0]*8+p[1];
const same=(a,b)=>a[0]===b[0]&&a[1]===b[1];
function kmoves(p){const out=[];for(const [dr,dc] of KM){const r=p[0]+dr,c=p[1]+dc;if(r>=0&&c>=0&&r<P.h&&c<P.w&&!S.rock.has(r*8+c))out.push([r,c]);}return out;}
function bfsFrom(g){const d=new Map([[key(g),0]]),dq=[g];while(dq.length){const p=dq.shift();for(const q of kmoves(p))if(!d.has(key(q))){d.set(key(q),d.get(key(p))+1);dq.push(q);}}return d;}
/* ★を全部回る：(位置, 通ったマーク) で BFS して、最短の次の一手 */
function visitNext(){const M=P.marks,full=(1<<M.length)-1,mi=p=>M.findIndex(m=>same(m,p));
  let m0=0;M.forEach((m,i)=>{if(S.got[i])m0|=1<<i;});const st=[S.pos,m0,null];const seen=new Set([key(S.pos)+'|'+m0]);const dq=[st];
  while(dq.length){const [p,m,f]=dq.shift();if(m===full)return f;for(const q of kmoves(p)){const i=mi(q),nm=i>=0?m|(1<<i):m,k=key(q)+'|'+nm;if(seen.has(k))continue;seen.add(k);dq.push([q,nm,f||q]);}}
  return null;}
/* 競争：全部の局面を後ろから解く。val[me|op] は手番の人から見て +k=k手で勝ち、-k=k手で負け、なし=引き分け */
let RV=null;
function raceSolve(){const cells=[];for(let r=0;r<P.h;r++)for(let c=0;c<P.w;c++)if(!S.rock.has(r*8+c)&&!(r===P.goal[0]&&c===P.goal[1]))cells.push([r,c]);
  const val=new Map();let ch=true;
  while(ch){ch=false;for(const a of cells)for(const b of cells){if(same(a,b))continue;const k=key(a)*64+key(b);if(val.has(k))continue;
    const L=kmoves(a);if(L.some(q=>same(q,P.goal)||same(q,b))){val.set(k,1);ch=true;continue;}
    const nx=L.length?L.map(q=>key(b)*64+key(q)):[key(b)*64+key(a)];const vs=nx.map(t=>val.get(t));
    const w=vs.filter(v=>v!==undefined&&v<0).map(v=>-v);if(w.length){val.set(k,Math.min(...w)+1);ch=true;continue;}
    if(vs.every(v=>v!==undefined&&v>0)){val.set(k,-(Math.max(...vs)+1));ch=true;}}}
  return val;}
/* me が q に動いたあと、me から見た値（大きいほどよい） */
function moveScore(me,op,q){if(same(q,P.goal)||same(q,op))return 1000;const v=RV.get(key(op)*64+key(q));if(v===undefined)return 0;return v<0?500+v:-500+v;}
function bestRace(me,op){const L=kmoves(me);if(!L.length)return [];let b=-1e9;L.forEach(q=>b=Math.max(b,moveScore(me,op,q)));return L.filter(q=>moveScore(me,op,q)===b);}
function startStage(p){P=p;S={hints:0,hint:0,retry:0,done:false,rock:new Set(p.rocks.map(key))};
  if(p.kind==='race'){RV=raceSolve();}
  reset();begin(p);draw();}
function reset(){S.moves=0;S.hl=null;S.msg='';S.msgc='';S.trail=[];S.over=null;S.busy=false;
  if(P.kind==='race'){S.pos=P.you.slice();S.cpu=P.cpu.slice();S.turn='you';}
  else{S.pos=P.start.slice();S.got=(P.marks||[]).map(()=>false);}}
function horse(cx,cy,s,col){const x=v=>cx-s/2+v*s,y=v=>cy-s/2+v*s;
  return `<g pointer-events="none"><ellipse cx="${cx}" cy="${y(0.9)}" rx="${s*0.32}" ry="${s*0.07}" fill="rgba(0,0,0,.18)"/><path d="M${x(.3)},${y(.88)} L${x(.74)},${y(.88)} L${x(.71)},${y(.6)} C${x(.8)},${y(.46)} ${x(.8)},${y(.28)} ${x(.66)},${y(.18)} L${x(.63)},${y(.06)} L${x(.54)},${y(.15)} C${x(.42)},${y(.15)} ${x(.3)},${y(.24)} ${x(.21)},${y(.4)} L${x(.15)},${y(.52)} C${x(.13)},${y(.6)} ${x(.2)},${y(.64)} ${x(.27)},${y(.6)} L${x(.42)},${y(.52)} C${x(.42)},${y(.64)} ${x(.35)},${y(.74)} ${x(.3)},${y(.88)} Z" fill="${col}" stroke="#2a2520" stroke-width="2" stroke-linejoin="round"/><circle cx="${x(.47)}" cy="${y(.3)}" r="${s*0.045}" fill="#fff"/><path d="M${x(.62)},${y(.2)} C${x(.76)},${y(.32)} ${x(.76)},${y(.5)} ${x(.66)},${y(.62)}" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="3"/></g>`;}
function star(cx,cy,r,fill){let pts=[];for(let i=0;i<10;i++){const rr=i%2?r*0.45:r,t=-Math.PI/2+i*Math.PI/5;pts.push(`${cx+rr*Math.cos(t)},${cy+rr*Math.sin(t)}`);}return `<polygon points="${pts.join(' ')}" fill="${fill}" stroke="#a16207" stroke-width="1.5" pointer-events="none"/>`;}
function boardSVG(){
  const U=P.w>=6?56:64,M=4,W=P.w*U+2*M,H=P.h*U+2*M;let s='';
  const myTurn=!S.done&&!S.over&&!S.busy&&(P.kind!=='race'||S.turn==='you');
  const dots=myTurn?kmoves(S.pos):[];
  for(let r=0;r<P.h;r++)for(let c=0;c<P.w;c++){const x=M+c*U,y=M+r*U,dark=(r+c)%2===1,rk=S.rock.has(r*8+c);
    const dot=dots.some(q=>q[0]===r&&q[1]===c),hl=S.hl&&S.hl.some(q=>q[0]===r&&q[1]===c);
    s+=`<rect x="${x}" y="${y}" width="${U}" height="${U}" fill="${hl?'#fde68a':dark?'#e9e1cf':'#fbf7ee'}" stroke="#d6ccb6" data-r="${r}" data-c="${c}" class="kn-c" style="cursor:${dot?'pointer':'default'}"/>`;
    if(S.trail.some(q=>q[0]===r&&q[1]===c))s+=`<circle cx="${x+U/2}" cy="${y+U/2}" r="${U*0.1}" fill="#7c3aed" opacity=".25" pointer-events="none"/>`;
    if(rk)s+=`<path d="M${x+U*0.18},${y+U*0.8} Q${x+U*0.12},${y+U*0.42} ${x+U*0.38},${y+U*0.26} Q${x+U*0.6},${y+U*0.12} ${x+U*0.8},${y+U*0.4} Q${x+U*0.92},${y+U*0.62} ${x+U*0.82},${y+U*0.8} Z" fill="#9ca3af" stroke="#4b5563" stroke-width="2" pointer-events="none"/><path d="M${x+U*0.35},${y+U*0.45} q${U*0.12},${-U*0.08} ${U*0.22},0" stroke="#e5e7eb" stroke-width="2" fill="none" pointer-events="none"/>`;
    if(P.goal&&r===P.goal[0]&&c===P.goal[1])s+=`<line x1="${x+U*0.34}" y1="${y+U*0.16}" x2="${x+U*0.34}" y2="${y+U*0.86}" stroke="#2a2520" stroke-width="3" pointer-events="none"/><polygon points="${x+U*0.34},${y+U*0.16} ${x+U*0.8},${y+U*0.3} ${x+U*0.34},${y+U*0.46}" fill="#e0342f" pointer-events="none"/>`;
    if(P.marks){const i=P.marks.findIndex(m=>m[0]===r&&m[1]===c);if(i>=0)s+=S.got[i]?`<circle cx="${x+U/2}" cy="${y+U/2}" r="${U*0.3}" fill="#bbf7d0" stroke="#16a34a" stroke-width="2" pointer-events="none"/><path d="M${x+U*0.36},${y+U*0.5} l${U*0.1},${U*0.1} l${U*0.18},${-U*0.2}" stroke="#16a34a" stroke-width="4" fill="none" pointer-events="none"/>`:star(x+U/2,y+U/2,U*0.34,'#facc15');}
    if(dot)s+=`<circle cx="${x+U/2}" cy="${y+U/2}" r="${U*0.16}" fill="#7c3aed" opacity=".75" pointer-events="none"/>`;}
  const at=p=>[M+p[1]*U+U/2,M+p[0]*U+U/2];
  if(P.kind==='race'&&!(S.over==='you'&&same(S.cpu,S.pos))){const [a,b]=at(S.cpu);s+=horse(a,b,U*0.9,'#fb923c');}
  {const [a,b]=at(S.pos);s+=horse(a,b,U*0.9,'#a78bfa');}
  return `<svg id="bd" viewBox="0 0 ${W} ${H}" style="max-width:${Math.min(W*1.05,420)}px" role="img" aria-label="ナイトの盤">${s}</svg>`;
}
function qline(){
  if(P.kind==='reach')return `<b>ゴールへ</b>：ナイトを旗のマスまで動かそう。最短は <b>${P.opt}手</b>。`;
  if(P.kind==='visit')return `<b>全部回る</b>：★のマスを全部通ろう（${P.marks.length}こ）。最短は <b>${P.opt}手</b>。`;
  return `<b>競争</b>：相手は<b>${P.cpulv==='weak'?'よわい':'つよい（ミスしない）'}</b>コンピューター。あなたが先に動きます。先に旗に着くか、相手をつかまえたら勝ち。`;
}
function status(){
  if(P.kind==='race')return `<span class="note">${S.done?'<b style="color:#1d7a4c">あなたの勝ち！</b>':S.over?'':S.turn==='you'?'<b style="color:#7c3aed">あなたの番</b>':'<b style="color:#ea580c">コンピューターの番…</b>'}</span><span class="note">あなたの手 ${S.moves}</span>`;
  return `<span class="note">手数 <b>${S.moves}</b>　・　最短 ${P.opt}手</span>${P.marks?`<span class="note">★ ${S.got.filter(x=>x).length} / ${P.marks.length}</span>`:''}`;
}
function draw(){
  app.innerHTML=`${topBar()}
    <p class="qq" style="font-size:15px">${qline()}</p>
    <div class="boardw">${boardSVG()}</div>
    <div class="row" style="justify-content:space-between">${status()}</div>
    ${S.done?'':`<p class="msg ${S.msgc||''}" id="msg">${S.msg||(P.kind==='race'?'● のマスをタップして動こう。':'● のマスをタップしてナイトを動かそう。')}</p>
    <div class="row">${S.over?`<button class="btn go" id="again1">もう一度たたかう</button>`:`<button class="btn" id="hint" ${S.busy?'disabled':''}>ヒント</button><button class="btn" id="reset" ${S.busy?'disabled':''}>やりなおす</button>`}</div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){
    if(P.kind!=='race')S.hints=S.hint+S.retry+(S.moves>P.opt?1:0)+(S.moves>P.opt+3?1:0);else S.hints=S.hint+S.retry;
    showClear(explain());return;}
  document.querySelectorAll('.kn-c').forEach(e=>e.addEventListener('pointerdown',()=>tap(+e.dataset.r,+e.dataset.c)));
  if(S.over){document.getElementById('again1').onclick=()=>{S.retry++;reset();draw();};return;}
  document.getElementById('hint').onclick=hint;
  document.getElementById('reset').onclick=()=>{if(S.moves>0)S.retry++;reset();draw();};
}
function tap(r,c){
  if(S.done||S.over||S.busy)return;if(P.kind==='race'&&S.turn!=='you')return;
  const q=[r,c];if(!kmoves(S.pos).some(x=>same(x,q)))return;
  S.trail.push(S.pos);S.pos=q;S.moves++;S.hl=null;S.msg='';S.msgc='';
  if(P.kind==='reach'){if(same(q,P.goal))S.done=true;draw();return;}
  if(P.kind==='visit'){P.marks.forEach((m,i)=>{if(same(m,q))S.got[i]=true;});if(S.got.every(x=>x))S.done=true;draw();return;}
  if(same(q,P.goal)){S.done=true;S.how='goal';draw();return;}
  if(same(q,S.cpu)){S.done=true;S.how='catch';draw();return;}
  S.turn='cpu';S.busy=true;draw();setTimeout(cpuTurn,650);
}
function cpuTurn(){
  if(!S||!P||P.kind!=='race'||S.turn!=='cpu')return;
  const L=kmoves(S.cpu);let q=null;
  if(L.length){const win=L.filter(x=>same(x,P.goal)||same(x,S.pos));
    if(win.length)q=win[0];else if(P.cpulv==='weak')q=L[Math.floor(Math.random()*L.length)];else{const b=bestRace(S.cpu,S.pos);q=b[Math.floor(Math.random()*b.length)];}}
  S.busy=false;S.turn='you';
  if(!q){S.msg='コンピューターは動けないので、1回休みです。';S.msgc='';}
  else{S.cpu=q;
    if(same(q,P.goal)){S.over='cpu';S.msg='コンピューターが先に旗に着きました。もう一度ちょうせんしよう。';S.msgc='ng';draw();return;}
    if(same(q,S.pos)){S.over='cpu';S.msg='つかまってしまいました。相手のナイトが入れるマスには気をつけよう。';S.msgc='ng';draw();return;}}
  if(!kmoves(S.pos).length){S.msg='あなたは動けないので、1回休みです。';S.turn='cpu';S.busy=true;draw();setTimeout(cpuTurn,900);return;}
  draw();
}
function hint(){
  let h=null;
  if(P.kind==='reach'){const d=bfsFrom(P.goal);const L=kmoves(S.pos);const m=Math.min(...L.map(q=>d.has(key(q))?d.get(key(q)):99));h=L.filter(q=>d.get(key(q))===m);}
  else if(P.kind==='visit'){const f=visitNext();if(f)h=[f];}
  else h=bestRace(S.pos,S.cpu);
  if(!h||!h.length)return;S.hint++;S.hl=h;
  S.msg=`ヒント：光っているマスがおすすめです（ヒント ${S.hint}回）。`+(P.kind==='race'?'':'');S.msgc='';draw();}
function explain(){
  if(P.kind==='reach')return `<p style="margin:0">あなたは ${S.moves}手、最短は ${P.opt}手でした。${S.moves===P.opt?'最短でゴール！':'最短の手数を目指してみよう。'}</p><p class="note">コツ：ゴールから<b>さかさまに</b>「1手で来られるマス」「2手で来られるマス」…と考えると、最短の道が見つかります。</p>`;
  if(P.kind==='visit')return `<p style="margin:0">あなたは ${S.moves}手、最短は ${P.opt}手でした。${S.moves===P.opt?'最短で全部回れました！':'回る順番を変えると、もっと少なくなるかも。'}</p><p class="note">コツ：★と★の間が何手かを考えて、<b>回る順番</b>を決めよう。ナイトは1手ごとに、マスの色（明るい・暗い）が必ずかわります。</p>`;
  return `<p style="margin:0">${S.how==='catch'?'相手のナイトをつかまえて':'先に旗に着いて'}、あなたの勝ち！</p><p class="note">コツ：動く前に「相手は次にどこへ行けるか」を考えよう。相手が入れるマスに行くと、つかまってしまいます。また、旗まであと何手か、自分と相手の両方を数えてくらべよう。</p>`;
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
