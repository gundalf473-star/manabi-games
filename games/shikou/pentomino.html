<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>ペントミノのはこづめ</h1>
    <p class="lead">ピースを回したり裏返したりして、家や船の形をすきまなくうめよう。5つのレベルから1問ずつ。ヒントなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=false;
let QS=[{"id":"1-01","lv":1,"name":"2×3の長方形","mask":["###","###"],"nsol":2,"pieces":[{"k":"l3","show":[[0,1],[1,0],[1,1]],"sol":[[0,2],[1,1],[1,2]]},{"k":"l3","show":[[0,1],[1,0],[1,1]],"sol":[[0,0],[0,1],[1,0]]}]},{"id":"2-01","lv":2,"name":"小さな家","mask":[".##.","####","####"],"nsol":2,"pieces":[{"k":"P","show":[[0,0],[0,1],[1,0],[1,1],[1,2]],"sol":[[0,1],[0,2],[1,1],[1,2],[1,3]]},{"k":"L","show":[[0,0],[1,0],[1,1],[1,2],[1,3]],"sol":[[1,0],[2,0],[2,1],[2,2],[2,3]]}]},{"id":"3-01","lv":3,"name":"4×5の長方形","mask":["#####","#####","#####","#####"],"nsol":12,"pieces":[{"k":"F","show":[[0,0],[0,1],[1,1],[1,2],[2,1]],"sol":[[1,1],[2,1],[2,2],[2,3],[3,2]]},{"k":"U","show":[[0,0],[0,1],[1,1],[2,0],[2,1]],"sol":[[1,3],[1,4],[2,4],[3,3],[3,4]]},{"k":"Y","show":[[0,2],[1,0],[1,1],[1,2],[1,3]],"sol":[[0,1],[0,2],[0,3],[0,4],[1,2]]},{"k":"L","show":[[0,0],[0,1],[1,1],[2,1],[3,1]],"sol":[[0,0],[1,0],[2,0],[3,0],[3,1]]}]},{"id":"4-01","lv":4,"name":"5×5の正方形","mask":["#####","#####","#####","#####","#####"],"nsol":64,"pieces":[{"k":"V","show":[[0,0],[1,0],[2,0],[2,1],[2,2]],"sol":[[0,1],[0,2],[0,3],[1,3],[2,3]]},{"k":"T","show":[[0,1],[1,1],[2,0],[2,1],[2,2]],"sol":[[0,0],[1,0],[1,1],[1,2],[2,0]]},{"k":"L","show":[[0,0],[0,1],[1,0],[2,0],[3,0]],"sol":[[3,0],[4,0],[4,1],[4,2],[4,3]]},{"k":"I","show":[[0,0],[0,1],[0,2],[0,3],[0,4]],"sol":[[0,4],[1,4],[2,4],[3,4],[4,4]]},{"k":"P","show":[[0,1],[1,0],[1,1],[2,0],[2,1]],"sol":[[2,1],[2,2],[3,1],[3,2],[3,3]]}]},{"id":"5-01","lv":5,"name":"5×7の長方形","mask":["#######","#######","#######","#######","#######"],"nsol":92,"pieces":[{"k":"Z","show":[[0,0],[1,0],[1,1],[1,2],[2,2]],"sol":[[0,0],[1,0],[1,1],[1,2],[2,2]]},{"k":"N","show":[[0,2],[0,3],[1,0],[1,1],[1,2]],"sol":[[0,1],[0,2],[0,3],[1,3],[1,4]]},{"k":"Y","show":[[0,0],[0,1],[0,2],[0,3],[1,2]],"sol":[[2,3],[3,1],[3,2],[3,3],[3,4]]},{"k":"P","show":[[0,1],[1,0],[1,1],[2,0],[2,1]],"sol":[[0,4],[0,5],[0,6],[1,5],[1,6]]},{"k":"L","show":[[0,0],[1,0],[2,0],[3,0],[3,1]],"sol":[[3,5],[4,2],[4,3],[4,4],[4,5]]},{"k":"U","show":[[0,0],[0,1],[0,2],[1,0],[1,2]],"sol":[[2,0],[2,1],[3,0],[4,0],[4,1]]},{"k":"V","show":[[0,0],[0,1],[0,2],[1,0],[2,0]],"sol":[[2,4],[2,5],[2,6],[3,6],[4,6]]}]}];
const ID='pentomino';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>ペントミノのはこづめ 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* ペントミノのはこづめ：p={name, mask:['####',…], nsol, pieces:[{k:'F', show:[[r,c],…], sol:[[r,c],…]}]}
   手持ちのピースを回したり裏返したりして、名前のついた形をすきまなくうめる。どんなうめ方でも、すきまなくうまれば正解。 */
const HINTWORD='ヒント';
const PCOL={F:'#ef4444',I:'#3b82f6',L:'#22c55e',N:'#f59e0b',P:'#a855f7',T:'#06b6d4',U:'#ec4899',V:'#84cc16',W:'#f97316',X:'#14b8a6',Y:'#6366f1',Z:'#a16207',
  i3:'#3b82f6',l3:'#ef4444',i4:'#06b6d4',o4:'#f59e0b',t4:'#a855f7',s4:'#22c55e',l4:'#f97316'};
const PENT='FILNPTUVWXYZ';
const LVD={1:'小さなブロック 2〜3こ',2:'ペントミノ 2〜3こ',3:'ペントミノ 4こ',4:'ペントミノ 5〜6こ',5:'ペントミノ 7〜8こ'};
const RULES=`<ol class="rules">
  <li>下のピースを指で形の上へ<b>ドラッグ</b>すると置けます。ピースをえらんでから、形のマスをタップしても置けます。</li>
  <li>「<b>↻ 回す</b>」「<b>⇋ 裏返す</b>」で向きを変えられます。えらんだピースをもう一度タップしても回ります。</li>
  <li>全部のピースで、形を<b>すきまなく</b>うめたらクリア。うめ方は1通りとはかぎりません。</li>
  <li>置いたピースをタップすると、手持ちにもどります。</li></ol>
  <p class="note">ペントミノは、正方形5こを辺でつなげた形。全部で<b>12種類</b>あり、形がにているアルファベット（F・I・L・N・P・T・U・V・W・X・Y・Z）の名前でよばれます。レベル1は3こ・4こつなぎの小さなブロックです。</p>`;
const U=44;
const norm=cs=>{const mr=Math.min(...cs.map(x=>x[0])),mc=Math.min(...cs.map(x=>x[1]));return cs.map(([r,c])=>[r-mr,c-mc]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);};
const rotC=cs=>norm(cs.map(([r,c])=>[c,-r]));
const mirC=cs=>norm(cs.map(([r,c])=>[r,-c]));
const key=cs=>norm(cs).map(x=>x.join(',')).join(';');
const orients=cs=>{const m=new Map();let cur=norm(cs);for(let f=0;f<2;f++){for(let k=0;k<4;k++){m.set(key(cur),cur);cur=rotC(cur);}cur=mirC(cur);}return [...m.values()];};
function startStage(p){
  P=p; const cells=[]; p.mask.forEach((row,r)=>[...row].forEach((ch,c)=>{if(ch==='#')cells.push([r,c]);}));
  S={cells,shape:p.pieces.map(x=>norm(x.show)),pos:p.pieces.map(()=>null),sel:0,hints:0,done:false,lock:p.pieces.map(()=>false),msg:''};
  begin(p); draw();
}
const H=()=>P.mask.length, W=()=>Math.max(...P.mask.map(r=>r.length));
const inside=(r,c)=>r>=0&&c>=0&&r<H()&&P.mask[r][c]==='#';
function occ(){const o={};S.pos.forEach((ps,k)=>{if(ps)ps.forEach(([r,c])=>{o[r+','+c]=k;});});return o;}
const solved=()=>S.pos.every(Boolean);
const colOf=k=>PCOL[P.pieces[k].k]||'#7c3aed';
const isPent=k=>PENT.includes(P.pieces[k].k);
function boardSVG(){
  const M=6, VW=W()*U+2*M, VH=H()*U+2*M, o=occ(); let s='';
  /* 形のりんかく */
  S.cells.forEach(([r,c])=>{const x=M+c*U,y=M+r*U;
    [[-1,0,`M${x},${y} H${x+U}`],[1,0,`M${x},${y+U} H${x+U}`],[0,-1,`M${x},${y} V${y+U}`],[0,1,`M${x+U},${y} V${y+U}`]].forEach(([dr,dc,d])=>{if(!inside(r+dr,c+dc))s+=`<path d="${d}" stroke="#8a7f6e" stroke-width="3" stroke-linecap="round"/>`;});});
  S.cells.forEach(([r,c])=>{const k=o[r+','+c];const x=M+c*U, y=M+r*U;
    s+=k==null?`<rect x="${x+2}" y="${y+2}" width="${U-4}" height="${U-4}" rx="5" fill="#f1ede4" stroke="#cfc5b3" stroke-width="1.5" stroke-dasharray="4 3"/>`
      :`<rect x="${x+1}" y="${y+1}" width="${U-2}" height="${U-2}" rx="5" fill="${colOf(k)}" stroke="rgba(0,0,0,.15)" stroke-width="1"/><rect x="${x+6}" y="${y+5}" width="${U-12}" height="${U*.26}" rx="4" fill="#fff" opacity=".28"/>`;
    s+=`<rect class="hit" data-r="${r}" data-c="${c}" x="${x}" y="${y}" width="${U}" height="${U}" fill="transparent" style="cursor:pointer"/>`;});
  S.pos.forEach((ps,k)=>{if(!ps)return;const has=new Set(ps.map(x=>x.join(',')));ps.forEach(([r,c])=>{const x=M+c*U,y=M+r*U;
    [[-1,0,`M${x},${y} H${x+U}`],[1,0,`M${x},${y+U} H${x+U}`],[0,-1,`M${x},${y} V${y+U}`],[0,1,`M${x+U},${y} V${y+U}`]].forEach(([dr,dc,d])=>{if(!has.has((r+dr)+','+(c+dc)))s+=`<path d="${d}" stroke="#2a2520" stroke-width="2.5" stroke-linecap="round" pointer-events="none"/>`;});});
    /* ピースの名前（ペントミノのみ）と、ヒントで置いた印 */
    const [cr,cc]=ps.reduce((b,x)=>{const m=[ps.reduce((a,y)=>a+y[0],0)/ps.length,ps.reduce((a,y)=>a+y[1],0)/ps.length];return (Math.hypot(x[0]-m[0],x[1]-m[1])<Math.hypot(b[0]-m[0],b[1]-m[1]))?x:b;},ps[0]);
    if(isPent(k))s+=`<text x="${M+cc*U+U/2}" y="${M+cr*U+U/2+7}" text-anchor="middle" font-size="20" font-weight="700" fill="#fff" stroke="rgba(0,0,0,.35)" stroke-width="3" paint-order="stroke" font-family="sans-serif" pointer-events="none">${P.pieces[k].k}</text>`;
    if(S.lock[k]){const [lr,lc]=ps[ps.length-1];s+=`<circle cx="${M+lc*U+U-9}" cy="${M+lr*U+U-9}" r="4" fill="#fff" opacity=".95" pointer-events="none"/>`;}});
  return `<svg id="bd" viewBox="0 0 ${VW} ${VH}" style="max-width:${Math.min(VW*1.15,520)}px" role="img" aria-label="うめる形：${esc(P.name)}">${s}</svg>`;
}
function pieceSVG(cs,k,u){
  u=u||13; const h=Math.max(...cs.map(x=>x[0]))+1, w=Math.max(...cs.map(x=>x[1]))+1;
  return `<svg viewBox="-2 -2 ${w*u+4} ${h*u+4}" width="${w*u+4}" height="${h*u+4}" aria-hidden="true">${cs.map(([r,c])=>`<rect x="${c*u+.5}" y="${r*u+.5}" width="${u-1}" height="${u-1}" rx="2.5" fill="${colOf(k)}" stroke="rgba(0,0,0,.25)"/>`).join('')}</svg>`;
}
function draw(){
  const left=S.pos.filter(x=>!x).length;
  app.innerHTML=`${topBar()}
    <p class="qq" style="text-align:center">「${esc(P.name)}」を うめよう</p>
    <div class="boardw">${boardSVG()}</div>
    ${S.done?'':`<div class="label">手持ちのピース（のこり ${left}こ）</div>
    <div class="tray">${S.shape.map((cs,k)=>S.pos[k]?'':`<button class="pc ${S.sel===k?'sel':''}" data-k="${k}" aria-label="ピース${isPent(k)?P.pieces[k].k:k+1}">${pieceSVG(cs,k)}${isPent(k)?`<span class="pn">${P.pieces[k].k}</span>`:''}</button>`).join('')}${left?'':'<p class="note">全部置きました。</p>'}</div>
    <div class="row" style="justify-content:center"><button class="btn" id="rot" ${S.sel==null?'disabled':''}>↻ 回す</button><button class="btn" id="flip" ${S.sel==null?'disabled':''}>⇋ 裏返す</button><button class="btn" id="hint">ヒント</button><button class="btn" id="reset">やりなおす</button></div>
    <p class="msg ${S.msgc||''}" id="msg">${S.msg||(S.sel!=null?'置きたいところのマスをタップしよう。':'手持ちのピースをえらぼう。')}</p>
    <p class="note">ヒントを使うと、ピースを1こ正しい場所に置きます（星がへります）。</p>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(explain());return;}
  bindDrag();
  app.querySelectorAll('.pc').forEach(b=>b.onclick=()=>{if(DRAGGED)return;const k=+b.dataset.k; if(S.sel===k){S.shape[k]=rotC(S.shape[k]);} S.sel=k; S.msg=''; S.msgc=''; draw();});
  const rb=document.getElementById('rot'); rb.onclick=()=>{if(S.sel==null)return;S.shape[S.sel]=rotC(S.shape[S.sel]);draw();};
  const fb=document.getElementById('flip'); fb.onclick=()=>{if(S.sel==null)return;S.shape[S.sel]=mirC(S.shape[S.sel]);draw();};
  document.getElementById('hint').onclick=hint;
  document.getElementById('reset').onclick=()=>{S.pos=S.pos.map((x,k)=>S.lock[k]?x:null);S.sel=S.pos.findIndex(x=>!x);if(S.sel<0)S.sel=null;S.msg='';draw();};
  app.querySelectorAll('#bd .hit').forEach(h=>h.onclick=()=>tap(+h.dataset.r,+h.dataset.c));
}
function explain(){
  const ks=P.pieces.map(x=>x.k), pent=ks.every(k=>PENT.includes(k));
  return `<p style="margin:0">${pent?`使ったペントミノは <b>${ks.slice().sort().join('・')}</b> の${ks.length}こ（12種類のうち${ks.length}種類）。`:`小さなブロック${ks.length}こで、${P.mask.join('').split('#').length-1}マスをうめました。`}
    この形のうめ方は、全部で <b>${P.nsol}通り</b> あります（全体を回したり裏返したりすると重なるうめ方も、べつべつに数えています）。</p>`;
}
/* ドラッグで置く：つかんだマスが、指をはなしたマスに来るように置く */
let DR=null, DRAGGED=false;
function bindDrag(){
  app.querySelectorAll('.pc').forEach(b=>{
    b.addEventListener('pointerdown',e=>{
      const k=+b.dataset.k, cs=S.shape[k], sv=b.querySelector('svg'); if(!sv)return;
      const sb=sv.getBoundingClientRect(), u=13, vw=(Math.max(...cs.map(x=>x[1]))+1)*u+4, sc=sb.width/vw;
      const lx=(e.clientX-sb.left)/sc-2, ly=(e.clientY-sb.top)/sc-2;
      const g=cs.reduce((bs,x)=>{const d=Math.hypot(x[1]*u+u/2-lx,x[0]*u+u/2-ly);return d<bs[1]?[x,d]:bs;},[cs[0],1e9])[0];
      DR={k,g,x0:e.clientX,y0:e.clientY,on:false,id:e.pointerId,el:null};
      try{b.setPointerCapture(e.pointerId);}catch(_){}
    });
    b.addEventListener('pointermove',e=>{
      if(!DR||DR.id!==e.pointerId)return;
      if(!DR.on){if(Math.hypot(e.clientX-DR.x0,e.clientY-DR.y0)<8)return; DR.on=true; ghost();}
      e.preventDefault(); moveGhost(e.clientX,e.clientY);
    });
    b.addEventListener('pointerup',e=>{
      if(!DR||DR.id!==e.pointerId)return; const d=DR; DR=null; if(!d.on)return;
      if(d.el)d.el.remove(); DRAGGED=true; setTimeout(()=>{DRAGGED=false;},60); drop(d,e.clientX,e.clientY);
    });
    b.addEventListener('pointercancel',()=>{if(DR){if(DR.el)DR.el.remove();DR=null;}});
  });
}
function ghost(){
  const bd=document.getElementById('bd'), bb=bd.getBoundingClientRect(), vw=+bd.getAttribute('viewBox').split(' ')[2];
  const cu=bb.width/vw*U, cs=S.shape[DR.k], el=document.createElement('div');
  el.style.cssText='position:fixed;left:0;top:0;pointer-events:none;z-index:50;opacity:.8';
  el.innerHTML=pieceSVG(cs,DR.k,cu); DR.el=el; DR.cu=cu; document.body.appendChild(el);
}
function moveGhost(x,y){const d=DR; if(!d||!d.el)return; d.el.style.transform=`translate(${x-2-(d.g[1]+.5)*d.cu}px,${y-2-(d.g[0]+.5)*d.cu}px)`;}
function drop(d,x,y){
  const hit=document.elementsFromPoint(x,y).find(e=>e.classList&&e.classList.contains('hit'));
  S.sel=d.k;
  if(!hit){S.msg='形のマスの上で指をはなそう。';S.msgc='ng';draw();return;}
  const r=+hit.dataset.r, c=+hit.dataset.c, cs=S.shape[d.k], o=occ(), dr=r-d.g[0], dc=c-d.g[1];
  if(!canPut(cs,dr,dc,o)){S.msg='そこには置けません。回したり、裏返したり、場所を変えたりしてみよう。';S.msgc='ng';draw();return;}
  S.pos[d.k]=cs.map(([a,b])=>[a+dr,b+dc]);
  const nx=S.pos.findIndex(v=>!v); S.sel=nx<0?null:nx; S.msg=''; S.msgc=''; if(solved())S.done=true; draw();
}
const canPut=(cs,dr,dc,o)=>cs.every(([r,c])=>inside(r+dr,c+dc)&&o[(r+dr)+','+(c+dc)]==null);
function tap(r,c){
  const o=occ(), k0=o[r+','+c];
  if(k0!=null){ if(S.lock[k0]){say('ヒントで置いたピースは動かせません。');return;} S.pos[k0]=null; S.sel=k0; S.msg=''; draw(); return; }
  if(S.sel==null){say('先に、手持ちのピースをえらぼう。');return;}
  const cs=S.shape[S.sel];
  for(const [ar,ac] of cs){const dr=r-ar, dc=c-ac; if(canPut(cs,dr,dc,o)){
    S.pos[S.sel]=cs.map(([a,b])=>[a+dr,b+dc]);
    const nx=S.pos.findIndex(x=>!x); S.sel=nx<0?null:nx; S.msg=''; if(solved())S.done=true; draw(); return; }}
  say('そこには置けません。回したり、裏返したり、場所を変えたりしてみよう。',true);
}
function say(m,bad){S.msg=m;S.msgc=bad?'ng':'';const el=document.getElementById('msg');if(el){el.textContent=m;el.className='msg '+S.msgc;}}
/* しきつめの探索：fixed のピースはそのままにして、残りでうめる置き方をさがす（見つからなければ null） */
function search(fixed){
  const used=new Set(), res=fixed.slice();
  fixed.forEach(ps=>{if(ps)ps.forEach(x=>used.add(x.join(',')));});
  const order=S.cells.map(x=>x.join(',')).sort((a,b)=>{const [ar,ac]=a.split(',').map(Number),[br,bc]=b.split(',').map(Number);return ar-br||ac-bc;});
  const OR=P.pieces.map(x=>orients(x.show));
  let nodes=0;
  function dfs(){
    if(++nodes>400000)return false;
    const e=order.find(x=>!used.has(x)); if(!e)return true;
    const [er,ec]=e.split(',').map(Number), tried=new Set();
    for(let k=0;k<P.pieces.length;k++){ if(res[k]||tried.has(P.pieces[k].k))continue; tried.add(P.pieces[k].k);
      for(const o of OR[k]){const [ar,ac]=o[0], pl=o.map(([a,b])=>[a+er-ar,b+ec-ac]);
        if(pl.every(([a,b])=>inside(a,b)&&!used.has(a+','+b))){ pl.forEach(x=>used.add(x.join(','))); res[k]=pl;
          if(dfs())return true; res[k]=null; pl.forEach(x=>used.delete(x.join(','))); }}}
    return false;
  }
  return dfs()?res:null;
}
function hint(){
  let sol=search(S.pos), k;
  if(sol){ k=S.pos.findIndex(x=>!x); }
  else{ sol=search(S.pos.map((x,i)=>S.lock[i]?x:null)); if(!sol)return;
    /* いまの置き方ではうめられない：まちがっているピースを1こ直す */
    const sk=ps=>ps?ps.map(x=>x.join(',')).sort().join(';'):'';
    k=S.pos.findIndex((x,i)=>!S.lock[i]&&x&&sk(x)!==sk(sol[i]));
    if(k<0)k=S.pos.findIndex((x,i)=>!S.lock[i]);
    const set=new Set(sol[k].map(x=>x.join(',')));
    S.pos.forEach((ps,i)=>{if(i!==k&&!S.lock[i]&&ps&&ps.some(x=>set.has(x.join(','))))S.pos[i]=null;});
  }
  if(k<0)return;
  S.pos[k]=sol[k].map(x=>x.slice()); S.shape[k]=norm(sol[k]); S.lock[k]=true; S.hints++;
  const nx=S.pos.findIndex(x=>!x); S.sel=nx<0?null:nx;
  S.msg=`ヒント：ピースを1こ置きました（ヒント ${S.hints}回）。`; S.msgc='';
  if(solved())S.done=true; draw();
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
