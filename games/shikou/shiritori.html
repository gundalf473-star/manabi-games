<title>しりとり迷路</title>
<meta name="game:subject" content="思考力">
<meta name="game:unit" content="ことば遊び">
<meta name="game:grade" content="小2〜">
<meta name="game:players" content="1人">
<meta name="description" content="スタートのことばから、さいごの字ではじまることばのマスへ進み、しりとりでゴールまでつなぐことば遊びの迷路。「ん」で終わるわなに注意。5つのレベルから1問ずつ、全5問。">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Old+Mincho:wght@700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: 1列。上に盤、下に操作。紫を差し色に（思考力シリーズ） */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --fg:#2a2520; --muted:#6a625a; --rule:#ddd6cb;
  --ink:#3b2f6b; --seal:#7c3aed; --sealsoft:#ede4fd; --ok:#1d7a4c; --oksoft:#e0f0e6; --ng:#c8352d; --ngsoft:#f8e3e1; --gold:#a97c12; --pick:#efeae1;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15130f; --surface:#1e1b17; --fg:#ece6dc; --muted:#a59c90; --rule:#34302a;
  --ink:#b3a6f0; --seal:#b79cff; --sealsoft:#271c40; --ok:#4cc184; --oksoft:#1b3326; --ng:#f07468; --ngsoft:#3a2220; --gold:#e1b44a; --pick:#28241e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15130f; --surface:#1e1b17; --fg:#ece6dc; --muted:#a59c90; --rule:#34302a;
  --ink:#b3a6f0; --seal:#b79cff; --sealsoft:#271c40; --ok:#4cc184; --oksoft:#1b3326; --ng:#f07468; --ngsoft:#3a2220; --gold:#e1b44a; --pick:#28241e; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 64px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,7.5vw,40px);line-height:1.15;margin:0;color:var(--ink)}
h1 small{display:block;font-family:var(--mincho);font-size:15px;color:var(--seal);letter-spacing:.3em;margin-bottom:4px}

button{font:inherit;color:inherit}

.paid .pt{font-size:15px} .paid .pt b{font-family:var(--display);font-weight:400;color:var(--seal)}
.paid .pd{font-size:13px;color:var(--muted)}

.pad{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pad button{min-width:48px;min-height:50px;border:1px solid var(--rule);background:var(--pick);border-radius:10px;font-size:21px;font-weight:700;cursor:pointer;touch-action:manipulation}
.pad button.er{font-size:15px;min-width:60px}
.qq{margin:0;font-size:17px;font-weight:700;line-height:1.7}
.opts4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opts4.txt{grid-template-columns:1fr 1fr}
.ob{border:2px solid var(--rule);background:var(--surface);border-radius:10px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px;justify-content:center}
.ob .k{align-self:flex-start;font-size:12px;font-weight:700;width:22px;height:22px;border-radius:50%;background:var(--pick);display:grid;place-items:center}
.ob:hover:not(:disabled){border-color:var(--ink)}
.ob.right{border-color:var(--ok);background:var(--oksoft)} .ob.wrong{border-color:var(--ng);background:var(--ngsoft);opacity:.6}
.ob:disabled{cursor:default}
.views{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;align-items:flex-end}
.views figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.scales{display:flex;flex-direction:column;gap:2px;align-items:center;width:100%}
.hintbox{margin:0;font-size:14px;background:var(--sealsoft);border-radius:8px;padding:8px 12px}
.prog{min-height:52px;border:2px dashed var(--rule);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;background:#fbfaf6}
.prog .ph{color:var(--muted);font-size:13px}
.palette{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ccard,.pcard{border:2px solid #93c5fd;background:#eff6ff;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:#1e3a8a}
.pcard{align-self:flex-start;padding:3px 10px}
.ccard.loop,.pcard.loop{border-color:#fbbf24;background:#fffbeb;color:#92400e}
.ccard span,.pcard span{font-size:18px}
.ccard:disabled,.pcard:disabled{opacity:.45;cursor:default}

</style>

<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>しりとり迷路</h1>
    <p class="lead">となりのマスへ、しりとりでつないでゴールを目指そう。「ん」で終わることばはわな！ 5つのレベルから1問ずつ。ヒントなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=false;
let QS=[{"w":3,"h":3,"grid":[["つばめ","えき","きりん"],["くつ","きく","いちご"],["つなひき","きゅうり","とら"]],"start":[0,1],"goal":[2,1],"sol":[[0,1],[1,1],[1,0],[2,0],[2,1]],"opt":5,"lasts":[["め","き","ん"],["つ","く","ご"],["き","り","ら"]],"id":"1-01","lv":1},{"w":3,"h":4,"grid":[["かもめ","いか","カーテン"],["めがね","ねんど","はさみ"],["つくし","ドーナツ","さくら"],["しゅくだい","つめ","せんぷうき"]],"start":[0,1],"goal":[3,0],"sol":[[0,1],[0,0],[1,0],[1,1],[2,1],[2,0],[3,0]],"opt":7,"lasts":[["め","か","ん"],["ね","ど","み"],["し","つ","ら"],["い","め","き"]],"id":"2-01","lv":2},{"w":4,"h":4,"grid":[["こい","しまうま","あし","ごはん"],["みのむし","りす","しりとり","りんご"],["あらいぐま","やかん","かばん","ごぼう"],["やきいも","かぼちゃ","めだか","うめ"]],"start":[0,2],"goal":[3,0],"sol":[[0,2],[1,2],[1,3],[2,3],[3,3],[3,2],[3,1],[3,0]],"opt":8,"lasts":[["い","ま","し","ん"],["し","す","り","ご"],["ま","ん","ん","う"],["も","や","か","め"]],"id":"3-01","lv":3},{"w":4,"h":5,"grid":[["チョーク","いす","うんどうかい","ちょう"],["みずたまり","やぎ","いちりんしゃ","やきとり"],["メロン","うどん","ごはん","りんご"],["セーター","にんぎょう","うに","ごぼう"],["めだか","うめ","めがね","ねこ"]],"start":[0,3],"goal":[4,3],"sol":[[0,3],[0,2],[1,2],[1,3],[2,3],[3,3],[3,2],[3,1],[4,1],[4,2],[4,3]],"opt":11,"lasts":[["く","す","い","う"],["り","ぎ","や","り"],["ん","ん","ん","ご"],["あ","う","に","う"],["か","め","ね","こ"]],"id":"4-01","lv":4},{"w":4,"h":6,"grid":[["あやとり","たけ","めがね","しりとり"],["けむし","ライオン","ゴリラ","りんご"],["すごろく","りす","らくだ","ごはん"],["くつ","きり","だるまおとし","しまうま"],["つき","まめまき","しゃぼんだま","まつげ"],["きょうかしょ","ヨット","まつ","とんぼ"]],"start":[0,3],"goal":[5,1],"sol":[[0,3],[1,3],[1,2],[2,2],[3,2],[4,2],[4,1],[3,1],[2,1],[2,0],[3,0],[4,0],[5,0],[5,1]],"opt":14,"lasts":[["り","け","ね","り"],["し","ん","ら","ご"],["く","す","だ","ん"],["つ","り","し","ま"],["き","き","ま","げ"],["よ","と","つ","ぼ"]],"id":"5-01","lv":5}];
const ID='shiritori';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>しりとり迷路 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* しりとり迷路：p={w,h,grid:[[ことば]],lasts:[[おしりの字]],start:[r,c],goal:[r,c],sol:[[r,c]…],opt} */
const HINTWORD='ヒント';
const LVD={1:'3×3 ・ 5マスでゴール',2:'3×4 ・ 6〜7マス',3:'4×4 ・ 小さい字（ゃゅょ）',4:'4×5 ・ のばす音（ー）',5:'4×6 ・ 12〜14マスの長い道'};
const RULES=`<ol class="rules">
  <li><b>スタート</b>のことばから、<b>となり</b>（上・下・左・右）のマスへ、<b>しりとり</b>でつながるように進もう。</li>
  <li>つぎのことばは、いまのことばの<b>さいごの字ではじまる</b>ことば。（例：りん<b>ご</b> → <b>ご</b>はん）</li>
  <li><b>ゴール</b>のマスに着いたらクリア。道は1つとはかぎりません。</li>
  <li>小さい字は大きい字にします（でんし<b>ゃ</b> → <b>や</b>）。のばす音「ー」で終わるときは、その前の字をのばした音にします（カレ<b>ー</b> → <b>え</b>、スキ<b>ー</b> → <b>い</b>）。</li>
  <li>「が」と「か」のように、<b>゛や゜</b>のある字とない字は、ちがう字です。</li>
  <li><b>「ん」で終わることば</b>は<b>わな</b>です。しりとりが終わってしまうので、入れません。</li>
  <li>進んだマスをタップすると、そこまでもどれます。</li></ol>`;
const CW=80,CH=66,M=6;
const H2=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const firstK=w=>H2(w)[0];
function startStage(p){P=p;S={path:[p.start.slice()],hints:0,done:false,msg:'',msgc:'',hl:null,shake:null};begin(p);draw();}
const W=(r,c)=>P.grid[r][c];
const LAST=(r,c)=>P.lasts[r][c];
const onPath=(r,c)=>S.path.findIndex(v=>v[0]===r&&v[1]===c);
const tail=()=>S.path[S.path.length-1];
/* 5字以上のことばは2行に分けて、字が細くつぶれないようにする（小さい字・ー・んは行の頭にしない） */
function wordText(w,x,y,isCur){
  const chs=[...w],n=chs.length;
  const ts=(arr,off)=>arr.map((ch,j)=>{const i=off+j,last=i===n-1,firstc=i===0;
    return `<tspan ${isCur&&last?'fill="#c8352d"':''} ${!isCur&&firstc&&S.showFirst?'fill="#7c3aed"':''}>${esc(ch)}</tspan>`;}).join('');
  const T=(yy,fs,body,fit)=>`<text x="${x}" y="${yy}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="#2a2520" font-family="'BIZ UDPGothic',sans-serif" ${fit?`textLength="${CW-14}" lengthAdjust="spacingAndGlyphs"`:''}>${body}</text>`;
  if(n<=4){const fs=n<=3?21:18;return T(y+8,fs,ts(chs,0),n*fs>CW-14);}
  let k=Math.ceil(n/2);if(k<n-1&&/[ぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮーん]/.test(chs[k]))k++;
  const fs=19;
  return T(y,fs,ts(chs.slice(0,k),0),k*fs>CW-14)+T(y+20,fs,ts(chs.slice(k),k),(n-k)*fs>CW-14);
}
function boardInner(){
  const {w,h}=P;let s='';
  const [tr,tc]=tail();
  /* 道の線 */
  if(S.path.length>1)s+=`<polyline points="${S.path.map(([r,c])=>`${M+c*CW+CW/2},${M+r*CH+CH/2}`).join(' ')}" fill="none" stroke="#a78bfa" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>`;
  for(let r=0;r<h;r++)for(let c=0;c<w;c++){
    const x=M+c*CW,y=M+r*CH,i=onPath(r,c),isS=r===P.start[0]&&c===P.start[1],isG=r===P.goal[0]&&c===P.goal[1];
    const cur=r===tr&&c===tc, hl=S.hl&&S.hl[0]===r&&S.hl[1]===c, sh=S.shake&&S.shake[0]===r&&S.shake[1]===c;
    let fill=i>=0?'#ede4fd':'#fffdf7', stroke='#d6cdbd', sw=1.5;
    if(isG){fill=i>=0?'#d1f0dc':'#fff4d6';stroke='#d4a017';sw=2.5;}
    if(cur){stroke='#7c3aed';sw=3.5;}
    if(hl){stroke='#f59e0b';sw=4;}
    if(sh){fill='#f8e3e1';stroke='#c8352d';sw=3;}
    s+=`<g class="cell" data-r="${r}" data-c="${c}" style="cursor:pointer"><rect x="${x+3}" y="${y+3}" width="${CW-6}" height="${CH-6}" rx="9" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
    if(isS)s+=`<text x="${x+9}" y="${y+16}" font-size="10" font-weight="700" fill="#7c3aed" font-family="sans-serif">スタート</text>`;
    if(isG)s+=`<text x="${x+9}" y="${y+16}" font-size="10" font-weight="700" fill="#a97c12" font-family="sans-serif">★ゴール</text>`;
    s+=wordText(W(r,c),x+CW/2,y+(isS||isG?37:33)-([...W(r,c)].length>4?2:0),cur);
    if(i>0&&!cur)s+=`<circle cx="${x+CW-12}" cy="${y+12}" r="8" fill="#7c3aed"/><text x="${x+CW-12}" y="${y+16}" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="sans-serif">${i+1}</text>`;
    s+=`</g>`;
  }
  return s;
}
function boardSVG(){const VW=P.w*CW+2*M,VH=P.h*CH+2*M;return `<svg id="bd" viewBox="0 0 ${VW} ${VH}" style="max-width:${Math.min(VW*1.15,480)}px" role="img" aria-label="しりとり迷路">${boardInner()}</svg>`;}
function nextInfo(){const [r,c]=tail();const w=W(r,c),k=LAST(r,c);
  const why=/ー$/.test(w)?`（「ー」の前の字をのばすと「${k}」）`:/[ぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮ]$/.test(w)?`（小さい字は大きく）`:'';
  return `「${esc(w)}」のつぎは、「<b>${k}</b>」ではじまることば${why}。`;}
function draw(){
  app.innerHTML=`${topBar()}
    <div class="boardw">${boardSVG()}</div>
    <div class="row" style="justify-content:space-between"><span class="note">進んだマス <b>${S.path.length}</b>　・　いちばん短い道は ${P.opt}マス</span></div>
    ${S.done?'':`<p class="msg ${S.msgc}" id="msg">${S.msg||(P.lv<=3?nextInfo():'となりのマスをタップして、しりとりでゴールを目指そう。')}</p>
    <div class="row"><button class="btn" id="hint">ヒント</button><button class="btn" id="back1" ${S.path.length<2?'disabled':''}>1つもどる</button><button class="btn" id="reset">さいしょから</button></div>
    <p class="note">ヒントを使うと、つぎに進むマスを教えます（星がへります）。</p>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){
    const route=S.path.map(([r,c])=>esc(W(r,c))).join(' → ');
    showClear(`<p style="margin:0">${route}</p><p class="note" style="margin:0">${S.path.length}マスでゴール！（いちばん短い道は ${P.opt}マス）</p>`);return;}
  app.querySelectorAll('.cell').forEach(g=>g.addEventListener('click',()=>tap(+g.dataset.r,+g.dataset.c)));
  document.getElementById('hint').onclick=hint;
  document.getElementById('back1').onclick=()=>{if(S.path.length>1)S.path.pop();S.hl=null;S.msg='';S.msgc='';draw();};
  document.getElementById('reset').onclick=()=>{S.path=[P.start.slice()];S.hl=null;S.msg='';S.msgc='';draw();};
}
function say(m,c){S.msg=m;S.msgc=c||'';}
function tap(r,c){
  if(S.done)return;
  S.hl=null;S.shake=null;
  const i=onPath(r,c);
  if(i>=0){if(i<S.path.length-1){S.path=S.path.slice(0,i+1);say(`「${W(r,c)}」までもどりました。`);}draw();return;}
  const [tr,tc]=tail();
  if(Math.abs(tr-r)+Math.abs(tc-c)!==1){say('進めるのは、いまのマスの上・下・左・右のとなりだけです。','ng');S.shake=[r,c];draw();return;}
  const need=LAST(tr,tc),w=W(r,c),f=firstK(w);
  if(f!==need){say(`「${W(tr,tc)}」のつぎは「${need}」ではじまることば。「${w}」は「${f}」ではじまるので、つながりません。`,'ng');S.shake=[r,c];draw();return;}
  if(LAST(r,c)==='ん'&&!(r===P.goal[0]&&c===P.goal[1])){say(`「${w}」は「ん」で終わる<b>わな</b>！しりとりが終わってしまうので、入れません。`,'ng');S.shake=[r,c];draw();return;}
  S.path.push([r,c]);say('');
  if(r===P.goal[0]&&c===P.goal[1])S.done=true;
  draw();
}
/* いまの道から、まだ通っていないマスだけを通ってゴールまで行けるか（幅優先探索） */
function route(from,blocked){
  const key=(r,c)=>r*P.w+c, prev={}; prev[key(...from)]=-1; const q=[from];
  while(q.length){const [r,c]=q.shift();
    if(r===P.goal[0]&&c===P.goal[1]){const out=[];let k=key(r,c);while(k!==-1){out.push([Math.floor(k/P.w),k%P.w]);k=prev[k];}return out.reverse();}
    if(LAST(r,c)==='ん')continue;
    for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){const nr=r+dr,nc=c+dc;
      if(nr<0||nc<0||nr>=P.h||nc>=P.w)continue;const k=key(nr,nc);
      if(k in prev||blocked.has(k))continue;
      if(firstK(W(nr,nc))!==LAST(r,c))continue;
      prev[k]=key(r,c);q.push([nr,nc]);}}
  return null;
}
function hint(){
  S.hints++;
  for(let n=S.path.length;n>=1;n--){
    const pre=S.path.slice(0,n),blocked=new Set(pre.slice(0,-1).map(([r,c])=>r*P.w+c));
    const rt=route(pre[pre.length-1],blocked);
    if(rt&&rt.length>1){
      if(n<S.path.length){S.path=pre;say(`ヒント：そのままではゴールに行けません。「${W(...pre[n-1])}」までもどしました。つぎは光っているマスへ（ヒント ${S.hints}回）。`);}
      else say(`ヒント：つぎは光っているマスへ進もう（ヒント ${S.hints}回）。`);
      S.hl=rt[1];draw();return;}
  }
  draw();
}

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
