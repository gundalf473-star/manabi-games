const KM_DX=102,KM_DY=90,KM_M=34;

function kmShopAt(n){return P.shops.findIndex(s=>s.n===n);}
function kmInfo(w){ /* 時間・はじめて行った時刻・順番 */
  let t=0;const first={},order=[];
  for(let i=1;i<w.length;i++){t+=kmW(w[i-1],w[i]);const j=kmShopAt(w[i]);if(j>=0&&!(j in first)){first[j]=t;order.push(j);}}

const kmDone=w=>{const f=kmInfo(w);return f.all&&f.home;};

const kmName=k=>KM_SH[k][0];

  const r=P.rule;if(!r)return '';

  if(r.t==='first'&&ord[0]!==r.k)return `${kmName(r.k)}がはじめの店になっていません。`;
  if(r.t==='cold')for(const k of r.k){const j=ks.indexOf(k),d=f.t-f.first[j];if(d>r.m)return `${kmName(k)}に着いてから家まで${d}分かかりました（${r.m}分以内のきまり）。`;}

}
function startStage(p){P=p;S={hints:0,ph:'route',w:[p.home],msg:'',msgc:'',si:0,order:[],q:null,bought:false,chg:null,spent:[],lines:null,sh:0,done:false};begin(p);draw();}

/* ---------- 絵 ---------- */
function kmShopIcon(k,x,y,sc){sc=sc||1;const [nm,col]=KM_SH[k],w=56*sc,h=42*sc,x0=x-w/2,y0=y-h/2;let s=`<rect x="${x0}" y="${y0+10*sc}" width="${w}" height="${h-10*sc}" rx="${4*sc}" fill="#fffdf8" stroke="${col}" stroke-width="${2*sc}"/>`;

function kmHome(x,y){return `<polygon points="${x-26},${y-4} ${x},${y-24} ${x+26},${y-4}" fill="#3b2f6b"/><rect x="${x-20}" y="${y-5}" width="40" height="26" rx="3" fill="#fffdf8" stroke="#3b2f6b" stroke-width="2"/><text x="${x}" y="${y+15}" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2f6b" font-family="sans-serif">家</text>`;}
function mapSVG(){
  const W=2*KM_M+(P.Cn-1)*KM_DX,H=2*KM_M+(P.Rn-1)*KM_DY,w=S.w,f=kmInfo(w),fin=kmDone(w),end=w[w.length-1];

  P.E.forEach(([a,b])=>{s+=`<line x1="${kmX(a)}" y1="${kmY(a)}" x2="${kmX(b)}" y2="${kmY(b)}" stroke="#d3cbbd" stroke-width="16" stroke-linecap="round"/><line x1="${kmX(a)}" y1="${kmY(a)}" x2="${kmX(b)}" y2="${kmY(b)}" stroke="#fff" stroke-width="2" stroke-dasharray="6 6" opacity=".8"/>`;});

function clockSVG(t){

const coinSVG=`<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#f0c95c" stroke="#a97c12" stroke-width="2"/><text x="12" y="16.5" text-anchor="middle" font-size="11" font-weight="700" fill="#6b4e05" font-family="sans-serif">円</text></svg>`;
const kmLeft=()=>P.W-S.spent.reduce((a,b)=>a+b,0);
function walletHTML(){

/* ---------- 道順 ---------- */
function drawRoute(){

/* ---------- 買い物 ---------- */
const kmCur=()=>P.shops[S.order[S.si]];
function kmEnter(){const s=kmCur();S.q=s.it.map(()=>0);S.bought=false;S.chg=null;S.lines=null;S.sh=0;S.msg='';S.msgc='';S.hintText='';}
function kmCost(s,q){let t=0;s.it.forEach((it,i)=>t+=it.p*q[i]);if(s.disc&&t>=s.disc[0])t=t*(10-s.disc[1])/10;return t;}
const kmRaw=(s,q)=>s.it.reduce((a,it,i)=>a+it.p*q[i],0);
const kmAmt=(s,q,sc)=>sc.reduce((a,i)=>a+s.it[i].a*q[i],0);
function kmAllowed(s){const a=new Set();s.cs.forEach(c=>(c.s||[]).forEach(i=>a.add(i)));return a;}
function kmOk(s,q,c){
  if(c.t==='amt'){const v=kmAmt(s,q,c.s);return c.op==='=='?v===c.v:v>=c.v;}
  if(c.t==='kinds'){const ch=c.s.filter(i=>q[i]>0);return ch.length===c.v&&(!c.e||ch.every(i=>q[i]===c.e));}
  if(c.t==='le')return kmCost(s,q)<=c.v;

}
function kmObj(s,q,c){if(c.o==='minc')return kmCost(s,q);if(c.o==='maxc')return -kmCost(s,q);if(c.o==='maxamt')return -kmAmt(s,q,c.s);return kmCost(s,q)/kmAmt(s,q,c.s);}
function kmBest(s,c){ /* メモのほかの条件に合う買い方を全部しらべて、いちばんよい値を出す */
  const al=[...kmAllowed(s)],q=s.it.map(()=>0);let best=Infinity;
  const rec=k=>{if(k===al.length){if(s.cs.every(x=>x.t==='opt'||kmOk(s,q,x))&&(c.o!=='minu'||kmAmt(s,q,c.s)>0))best=Math.min(best,kmObj(s,q,c));return;}
    for(let v=0;v<=s.mx;v++){q[al[k]]=v;rec(k+1);}q[al[k]]=0;};
  rec(0);return best;
}
function kmItemRow(s,it,i){
  const v=S.q[i],shown=it.c==='g'?(v*100)+'g':it.c==='パック'?v+'パック':kmCn(v,it.c);

}
function drawShop(){

    `<span class="km-tot">かごの合計 <b>${tot}</b>円</span>${s.disc&&raw>=s.disc[0]?`<small>${raw}円の${s.disc[1]}わり引き</small>`:''}`;

    else after=`<div class="km-got"><b>買えた！</b><p>${s.ex}</p>${s.chg?`<p>${s.chg.x}ではらって、おつりは${s.chg.a}円。</p>`:''}<button class="btn go" id="nxs">${S.si+1<S.order.length?'つぎの店へ':'家に帰る'}</button></div>`;
  }

    <div class="km-head"><svg viewBox="0 0 64 50" width="64" height="50" aria-hidden="true">${kmShopIcon(s.k,32,25,1.05)}</svg><div><b style="color:${col}">${nm}</b><small>${S.si+1}けんめ／${S.order.length}けん</small></div><span class="km-wal">${walletHTML()}</span></div>
    <div class="km-memo"><div class="label">メモ（${nm}）</div><ul class="km-list">${lines}</ul>${s.disc?`<p class="km-line km-rule">お店のお知らせ：全部で${s.disc[0]}円以上買うと、${s.disc[1]}わり引き。</p>`:''}</div>
    <div class="km-items">${s.it.map((it,i)=>kmItemRow(s,it,i)).join('')}</div>

    ${S.bought?'':`<p class="msg ${S.msgc}" id="msg">${S.msg||'＋と−で数を決めて、「レジで買う」をおそう。'}</p>
    <div class="row"><button class="btn go" id="buy">レジで買う</button><button class="btn" id="zero">0にもどす</button><button class="btn" id="hint">ヒント</button></div>`}
    ${after}<div id="after"></div>`;
  bindBack();
  app.querySelectorAll('.km-pm').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;S.q[i]=Math.max(0,Math.min(s.mx,S.q[i]+ +b.dataset.d));S.lines=null;S.msg='';S.msgc='';draw();});
  if(!S.bought){
    document.getElementById('zero').onclick=()=>{S.q=s.it.map(()=>0);S.lines=null;S.msg='';draw();};

function kmBuy(s){

  else if(S.lines.includes(false))why='メモに合っていない所があります（✗の所）。';

    if(oc){const ci=s.cs.indexOf(oc),b=kmBest(s,oc),mine=kmObj(s,q,oc);S.lines[ci]=Math.abs(mine-b)<1e-9;

  if(why){S.hints++;S.msg=why+(s.hide&&q.some(v=>v>0)?`（レジの合計は${tot}円でした）`:'');S.msgc='ng';draw();return;}
  S.bought=true;S.spent.push(tot);S.lines=s.cs.map(()=>true);
  if(s.chg)S.chg={opts:shuffle([s.chg.a,...s.chg.ds]),wrong:[],ok:false};
  draw();
}
/* ---------- 家に着いた ---------- */
function drawHome(){
  const ks=P.shops.map(s=>s.k),spent=S.spent.reduce((a,b)=>a+b,0);
  const best=P.tours[0],free=P.tours.filter(t=>!t[2]).sort((a,b)=>a[1]-b[1])[0];
  const ordTxt=o=>'家→'+o.map(kmName).join('→')+'→家';
  let ex=`<p style="margin:0"><b>道順：</b>いちばん早いのは「${ordTxt(best[0])}」で${best[1]}分。${P.rev?'（店を反対の順に回っても同じ時間です）':''}</p>`;
  const others=P.tours.filter(t=>t[2]).slice(1,3);
  if(others.length)ex+=`<p class="note" style="margin:0">ほかの順番：${others.map(t=>`${ordTxt(t[0])} ${t[1]}分`).join('、')}</p>`;
  if(P.rule&&free&&free[1]<best[1])ex+=`<p class="note" style="margin:0">きまりがなければ「${ordTxt(free[0])}」の${free[1]}分が早いけれど、きまりに合いません。</p>`;
  app.innerHTML=`${topBar()}
    <div class="km-res"><div class="km-res-t">ただいま！ おつかい成功</div>
      <div class="km-res-g"><div>${clockSVG(S.time)}<span>時間<b>${S.time}分</b><small>${P.lim}分以内</small></span></div>
      <div>${coinSVG}<span>のこったお金<b>${P.W-spent}円</b><small>${P.W}円 − 使った${spent}円</small></span></div></div>
      <ul class="km-list">${S.order.map((j,i)=>{const s=P.shops[j];return `<li class="ok">✓ ${i+1}. ${kmName(s.k)}：${s.ex.split('。')[0]}（${S.spent[i]}円）</li>`;}).join('')}
      ${P.rule?`<li class="ok">✓ きまり：${P.rule.x}</li>`:''}</ul></div>
    <div class="boardw km-mapw">${mapSVG()}</div>
    <div id="after"></div>`;
  bindBack();
  showClear(ex);
}
function draw(){if(S.ph==='route')drawRoute();else if(S.ph==='shop')drawShop();else drawHome();}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
