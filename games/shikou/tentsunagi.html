/* 点つなぎ絵：p={pic, closed, fill, det:[絵のかざり], dots:[[x,y]…]（つなぐ順）, lab, lp:ラベルの位置, dec/dlab/dlp:まどわせる点, rt:つなぐ順のルール, a:絵の名前, ds} */

const RULES=`<ol class="rules">

function startStage(p){P=p;S={k:0,hints:0,phase:'dots',hl:-1,msg:'',msgc:'',wrong:[],opts:shuffle([p.a,...p.ds]),flash:-1};begin(p);draw();}
const N=()=>P.dots.length;
const showNext=()=>P.lv<=2||S.hl===S.k;
function detSVG(){return P.det.map(d=>{
  if(d.k==='c')return `<circle cx="${d.x}" cy="${d.y}" r="${d.r}" fill="${d.f}" stroke="#2a2520" stroke-width=".5"/>`;
  if(d.k==='r')return `<rect x="${d.x}" y="${d.y}" width="${d.w}" height="${d.h}" fill="${d.f}" stroke="#2a2520" stroke-width=".5"/>`;
  if(d.k==='p')return `<polygon points="${d.p.map(q=>q.join(',')).join(' ')}" fill="${d.f}" stroke="#2a2520" stroke-width=".5" stroke-linejoin="round"/>`;
  return `<polyline points="${d.p.map(q=>q.join(',')).join(' ')}" fill="none" stroke="#2a2520" stroke-width="1.1" stroke-linecap="round"/>`;}).join('');}
function boardInner(){
  const D=P.dots,k=S.k,full=k===N();let s='';
  if(full&&P.closed)s+=`<polygon points="${D.map(q=>q.join(',')).join(' ')}" fill="${P.fill}" fill-opacity="${S.phase==='done'?1:.55}" stroke="none"/>`;
  else if(full)s+=`<polygon points="${(P.fp||D).map(q=>q.join(',')).join(' ')}" fill="${P.fill}" fill-opacity="${S.phase==='done'?.85:.45}" stroke="none"/>`;
  if(S.phase!=='dots')s+=detSVG();
  if(k>=2){const pts=D.slice(0,k).concat(full&&P.closed?[D[0]]:[]);
    s+=`<polyline points="${pts.map(q=>q.join(',')).join(' ')}" fill="none" stroke="${full?'#2a2520':'#7c3aed'}" stroke-width="${full?1.3:1.1}" stroke-linejoin="round" stroke-linecap="round"/>`;}
  if(S.phase==='dots'){
    const lab=(x,y,t,c)=>`<text x="${x}" y="${y+2}" text-anchor="middle" font-size="5.6" font-weight="700" fill="${c}" font-family="sans-serif" pointer-events="none">${t}</text>`;

    D.forEach((q,i)=>{const done=i<k,nx=i===k;
      if(nx&&showNext())s+=`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="#ede4fd" stroke="#7c3aed" stroke-width=".8"><animate attributeName="r" values="3.4;5;3.4" dur="1.4s" repeatCount="indefinite"/></circle>`;
      s+=`<circle cx="${q[0]}" cy="${q[1]}" r="${done?1.3:1.8}" fill="${done?'#7c3aed':S.flash===i?'#c8352d':'#2a2520'}"/>`;
      s+=lab(P.lp[i][0],P.lp[i][1],P.lab[i],done?'#b9aee0':S.flash===i?'#c8352d':'#2a2520');});
  }
  return s;
}
function boardSVG(){return `<svg id="bd" viewBox="-7 -7 114 114" style="max-width:460px" role="img" aria-label="点つなぎの絵">${boardInner()}</svg>`;}
function draw(){
  const ask=S.phase==='ask',done=S.phase==='done';
  app.innerHTML=`${topBar()}
    <div class="tt-rule"><span class="tt-tag">ルール</span><span>${esc(P.rt)}</span></div>
    <div class="boardw">${boardSVG()}</div>
    <div class="row" style="justify-content:space-between"><span class="note" id="stat">${statText()}</span></div>
    ${ask||done?`<p class="qq">${done?'正解！':'できた！ これは何の絵かな？'}</p>
      <div class="opts4 txt">${S.opts.map((o,i)=>`<button class="ob ${done&&o===P.a?'right':''} ${S.wrong.includes(i)?'wrong':''}" data-i="${i}" ${done||S.wrong.includes(i)?'disabled':''}><span class="k">${'アイウエ'[i]}</span><b style="font-size:19px">${esc(o)}</b></button>`).join('')}</div>`:''}
    ${done?'':`<p class="msg ${S.msgc}" id="msg">${S.msg||(ask?'4つの中からえらぼう。':'ルールの順に、点をタップしよう。')}</p>
    <div class="row">${ask?'':'<button class="btn" id="hint">ヒント（次の点）</button><button class="btn" id="reset">やりなおす</button>'}</div>`}
    <div id="after"></div>`;
  bindBack();
  if(done){showClear(`<p style="margin:0">「${esc(P.a)}」の絵でした。${N()}この点を「${esc(P.rn)}」でつなぎました。</p>`);return;}
  if(ask){app.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
    if(S.opts[i]===P.a){S.phase='done';}else{S.wrong.push(i);S.hints++;S.msg='ちがうよ。絵をよく見てみよう。';S.msgc='ng';}draw();});return;}
  document.getElementById('hint').onclick=()=>{if(S.hl!==S.k){S.hl=S.k;S.hints++;}S.msg=`ヒント：光っている点が つぎの「${P.lab[S.k]}」です。`;S.msgc='';draw();};
  document.getElementById('reset').onclick=()=>{S.k=0;S.hl=-1;S.msg='';S.msgc='';draw();};
  bind();
}
const statText=()=>S.phase==='dots'?`つないだ点 ${S.k} / ${N()}${S.k?`　・　いま「${P.lab[S.k-1]}」まで`:''}`:`${N()}この点を ぜんぶ つなぎました`;
function bind(){
  const svg=document.getElementById('bd');
  svg.addEventListener('pointerdown',e=>{
    e.preventDefault();
    const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());
    const D=P.dots,k=S.k,dd=a=>Math.hypot(a[0]-q.x,a[1]-q.y);
    /* タップした所にいちばん近い点（その点か、その数字）をさがす。つぎの点がいちばん近ければ正解 */
    const all=D.concat(P.dec), labs=P.lp.concat(P.dlp);
    let near=-1,nd=1e9;
    all.forEach((a,i)=>{const d=Math.min(dd(a),dd(labs[i])+1);if(d<nd){nd=d;near=i;}});
    if(near>=0&&near<k)return;   /* もうつないだ点（2度おしなど）は何もしない */
    if(near===k&&nd<=7){
      S.k++;S.msg='';S.msgc='';S.flash=-1;
      if(S.k===N()){S.phase='ask';S.msg='';draw();return;}
      refresh();return;}
    if(near<0||nd>6)return;
    const best=near;
    S.hints++;S.flash=best;
    const lb=best<N()?P.lab[best]:P.dlab[best-N()];
    S.msg=`「${lb}」ではないよ。${k?`「${P.lab[k-1]}」の つぎは どれかな？`:'さいしょの点をさがそう。'}`;S.msgc='ng';
    refresh();
  });
}
function refresh(){const bd=document.getElementById('bd');if(bd)bd.innerHTML=boardInner();const st=document.getElementById('stat');if(st)st.textContent=statText();const m=document.getElementById('msg');if(m){m.textContent=S.msg||'ルールの順に、点をタップしよう。';m.className='msg '+S.msgc;}}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
