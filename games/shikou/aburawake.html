<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>油分け算・川わたり</h1>
    <p class="lead">入れ物で油をはかったり、ルールを守ってボートで川をわたったり。最短の手数を目指そう。5つのレベルから1問ずつ。最短で、ヒントなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=false;
let QS=[{"lv":1,"t":"oil","caps":[12,7],"init":[0,0],"tank":true,"goal":{"any":5},"opt":2,"sol":[["F",0],["P",0,1]],"id":"1-01"},{"lv":2,"t":"oil","caps":[5,3],"init":[0,0],"tank":true,"goal":{"any":4},"opt":6,"sol":[["F",0],["P",0,1],["E",1],["P",0,1],["F",0],["P",0,1]],"id":"2-01"},{"title":"大人1人と子ども2人が、1そうの小さなボートで向こう岸へわたります。","items":[{"n":"大人","w":2,"r":true,"g":false,"k":""},{"n":"子ども","w":1,"r":true,"g":false,"k":""},{"n":"子ども","w":1,"r":true,"g":false,"k":""}],"W":2,"cap":2,"eat":[],"ws":false,"over":"ボートに乗れるのは、大人1人か、子ども2人までです。","rules":["ボートに乗れるのは、\u003cb>大人1人\u003c/b>か、\u003cb>子ども2人\u003c/b>まで（子ども1人でもよい）。大人と子どもはいっしょに乗れません。","だれでもボートをこげますが、だれも乗っていないボートは動きません。"],"lv":3,"t":"river","opt":5,"sol":[[1,2],[1],[0],[2],[1,2]],"id":"3-01"},{"lv":4,"t":"oil","caps":[11,6,3],"init":[0,0,0],"tank":true,"goal":{"any":1},"opt":4,"sol":[["F",1],["P",1,0],["F",1],["P",1,0]],"id":"4-01"},{"lv":5,"t":"oil","caps":[12,7,5],"init":[0,0,0],"tank":true,"goal":{"any":8},"opt":7,"sol":[["F",2],["P",2,0],["F",2],["P",2,0],["F",2],["P",0,1],["P",2,0]],"id":"5-01"}];
const ID='aburawake';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>油分け算・川わたり 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* 油分け算・川わたり
   t='oil'  ：caps, init, tank(タンクあり), goal:{any:g}|{each:[..]}, opt:最短手数, sol:[['F',i]|['E',i]|['P',i,j]…]
   t='river'：title, items:[{n,w,r(こげる),g(見はり),k('W'|'S')}], W(重さの上限・0はなし), cap(人数), eat:[[a,b,'動詞']], ws, rules, opt, sol:[[乗る人…]…] */
const HINTWORD='ヒントや手数のオーバー';
const LVD={1:'油分け（2つのます・やさしい）',2:'油分け（2つのます・手数が多い）',3:'川わたり',4:'油分け（3つの入れ物）',5:'油分け・川わたりの難問'};
const RULES=`<ol class="rules">
  <li><b>油分け算</b>：目もりのない入れ物を使って、決められた量の油をはかります。</li>
  <li>「<b>満タン</b>」はタンクから入れ物をいっぱいにする、「<b>からに</b>」は入れ物の油をタンクにもどす、「<b>〜へ注ぐ</b>」は、注ぐ側がからになるか、注がれる側がいっぱいになるまで注ぐ。</li>
  <li>タンクのない問題では、入れ物から入れ物へ注ぐことしかできません。</li>
  <li><b>川わたり</b>：みんなをボートで向こう岸へ運びます。乗せたいものをタップしてボートに乗せ、「わたる」をおします。ルールに合わない動きはできません。</li>
  <li>1回の操作（注ぐ・満タン・からに・ボートで1回わたる）が<b>1手</b>。<b>最短の手数</b>でできると★3つ。ヒントは最短の次の一手を教えます。</li></ol>`;
const isOil=()=>P.t==='oil';
function startStage(p){P=p;
  S={hints:0,hint:0,moves:0,done:false,msg:'',msgc:'',hl:[],hist:[]};
  if(p.t==='oil'){S.s=p.init.slice();S.log=[p.init.slice()];}else{S.mask=0;S.side=0;S.boat=[];}
  begin(p);draw();}
/* ---------- 油分け ---------- */
function oilMoves(s){const c=P.caps,n=c.length,out=[];
  for(let i=0;i<n;i++){if(P.tank&&s[i]<c[i]){const t=s.slice();t[i]=c[i];out.push([['F',i],t]);}if(P.tank&&s[i]>0){const t=s.slice();t[i]=0;out.push([['E',i],t]);}}
  for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(i!==j&&s[i]>0&&s[j]<c[j]){const a=Math.min(s[i],c[j]-s[j]),t=s.slice();t[i]-=a;t[j]+=a;out.push([['P',i,j],t]);}
  return out;}
const oilGoal=s=>P.goal.any!=null?s.includes(P.goal.any):P.goal.each.every((g,i)=>g==null||g===s[i]);
function oilNext(s0){const k=s=>s.join(','),prev=new Map([[k(s0),null]]),q=[s0];
  while(q.length){const s=q.shift();if(oilGoal(s)){let x=s,first=null;while(prev.get(k(x))){const [a,p]=prev.get(k(x));first=a;x=p;}return first;}
    for(const [a,t] of oilMoves(s))if(!prev.has(k(t))){prev.set(k(t),[a,s]);q.push(t);}}
  return null;}
const cn=i=>`${P.caps[i]}L`;
function oilGoalText(){if(P.goal.any!=null)return `どれかの入れ物に、ちょうど <b>${P.goal.any}L</b> の油をはかりとろう。`;
  const g=P.goal.each;const parts=g.map((v,i)=>v==null?null:[i,v]).filter(x=>x&&x[1]>0);
  return `${parts.map(([i])=>cn(i)+'の入れ物').join('と')}に、<b>${parts[0][1]}Lずつ</b>分けよう${g.some((v,i)=>v===0)?'（'+g.map((v,i)=>v===0?cn(i)+'の入れ物':null).filter(Boolean).join('・')+'はからにする）':''}。`;}
function oilSVG(){const n=P.caps.length,mx=Math.max(...P.caps),u=Math.min(16,190/mx),W=330,col=W/n,bw=n===2?72:62,top=34,base=top+mx*u;let o='';
  P.caps.forEach((c,i)=>{const cx=col*i+col/2,x=cx-bw/2,h=c*u,y=base-h,v=S.s[i],hl=S.hl.includes(i);
    o+=`<text x="${cx}" y="${y-10}" text-anchor="middle" font-size="20" font-weight="700" fill="${oilGoalHit(i)?'#1d7a4c':'#2a2520'}" font-family="sans-serif">${v}L</text>`;
    o+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="#fff" stroke="${hl?'#f59e0b':'#6a625a'}" stroke-width="${hl?5:2.5}" rx="3"/>`;
    if(v>0)o+=`<rect x="${x+2}" y="${base-v*u}" width="${bw-4}" height="${v*u-1.5}" fill="#f2b632"/><rect x="${x+2}" y="${base-v*u}" width="${bw-4}" height="3" fill="#d99a12"/>`;
    /* 目もりのない入れ物なので、目もり線はかかない */
    o+=`<text x="${cx}" y="${base+22}" text-anchor="middle" font-size="14" fill="#6a625a" font-family="sans-serif">${c}L入る</text>`;});
  return `<svg id="bd" viewBox="0 0 ${W} ${base+32}" style="max-width:420px" role="img" aria-label="油の入れ物">${o}</svg>`;}
function oilGoalHit(i){return P.goal.any!=null?S.s[i]===P.goal.any:false;}
function actName(a){return a[0]==='F'?`${cn(a[1])}を満タン`:a[0]==='E'?`${cn(a[1])}をからに`:`${cn(a[1])}から${cn(a[2])}へ注ぐ`;}
function oilDraw(){
  const n=P.caps.length,ms=oilMoves(S.s),can=a=>ms.some(([b])=>b.join()===a.join()),hk=S.hla?S.hla.join():'';
  const btn=(a,label)=>`<button class="btn ${hk===a.join()?'on':''}" data-a="${a.join(',')}" ${can(a)?'':'disabled'}>${label}</button>`;
  return `<p class="qq">${oilGoalText()}</p>
    <p class="note">${P.tank?'タンクには油がいくらでもあります。入れ物をいっぱいにしたり、からにしたりできます。':'<b>タンクはありません。</b>入れ物から入れ物へ注ぐことしかできません。'}</p>
    <div class="boardw">${oilSVG()}</div>
    <div class="note">手数 <b>${S.moves}</b>　・　最短 ${P.opt}手</div>
    ${S.done?'':`<div class="ogrid" style="grid-template-columns:repeat(${n},1fr)">${P.caps.map((c,i)=>`<div class="ocol"><span class="label" style="text-align:center">${cn(i)}</span>
      ${P.tank?btn(['F',i],'満タン')+btn(['E',i],'からに'):''}${P.caps.map((d,j)=>j===i?'':btn(['P',i,j],`${cn(j)}へ注ぐ`)).join('')}</div>`).join('')}</div>`}
    <p class="note olog">記録：${S.log.map(s=>s.join('・')).join(' → ')}</p>`;}
function oilAct(a){const m=oilMoves(S.s).find(([b])=>b.join()===a.join());if(!m)return;
  S.hist.push(S.s.slice());S.s=m[1];S.log.push(S.s.slice());S.moves++;S.hl=[];S.hla=null;S.msg=actName(a)+'。';S.msgc='';
  if(oilGoal(S.s))S.done=true;draw();}
/* ---------- 川わたり ---------- */
const onR=i=>(S.mask>>i&1)===1;
const hiki=n=>n+({1:'ぴき',3:'びき',6:'ぴき',8:'ぴき'}[n]||'ひき');
/* 乗せる組の名前（同じ名前はまとめて「子ども2人」「オオカミ2ひき」） */
function grpName(g,sep){const c=new Map();g.forEach(i=>{const it=P.items[i],n=it.n.split(' ')[0];if(!c.has(n))c.set(n,[0,it.k]);c.get(n)[0]++;});
  return [...c].map(([n,[k,t]])=>k>1?n+(t?hiki(k):k+'人'):n).join(sep);}
function bankOK(bank){const it=P.items;
  if(!bank.some(i=>it[i].g))for(const [a,b,v] of P.eat)if(bank.includes(a)&&bank.includes(b))return `${it[a].n}が${it[b].n}を${v}しまいます`;
  if(P.ws){const w=bank.filter(i=>it[i].k==='W').length,s=bank.filter(i=>it[i].k==='S').length;if(s>0&&w>s)return `オオカミ（${hiki(w)}）のほうがヒツジ（${hiki(s)}）より多くなり、ヒツジがおそわれてしまいます`;}
  return null;}
function crossErr(mask,side,grp){const it=P.items;
  if(!grp.length)return 'ボートにだれも乗っていません。';
  if(grp.length>P.cap)return P.over||`ボートに乗れるのは${P.cap}つまでです。`;
  const w=grp.reduce((a,i)=>a+it[i].w,0);if(P.W&&w>P.W)return P.over||`合わせて${w}kgになり、ボートの${P.W}kgをこえてしまいます。`;
  if(!grp.some(i=>it[i].r)){const rw=it.filter(x=>x.r).map(x=>x.n.split(' ')[0]);const ru=[...new Set(rw)];return `ボートをこげる人が乗っていません（こげるのは${ru.join('・')}${ru.length===1?'だけ':''}）。`;}
  let nm=mask;grp.forEach(i=>nm^=1<<i);
  const L=[],R=[];it.forEach((x,i)=>(nm>>i&1?R:L).push(i));
  const eL=bankOK(L),eR=bankOK(R);
  if(eL)return `こちらの岸で、${eL}。`;if(eR)return `向こう岸で、${eR}。`;return null;}
function rivNext(){const n=P.items.length,goal=((1<<n)-1)+'|1',k=(m,s)=>m+'|'+s,prev=new Map([[k(S.mask,S.side),null]]),q=[[S.mask,S.side]];
  while(q.length){const [m,s]=q.shift();const key=k(m,s);
    if(key===goal){let x=key,first=null;while(prev.get(x)){const [g,p]=prev.get(x);first=g;x=p;}return first;}
    const here=[];for(let i=0;i<n;i++)if((m>>i&1)===s)here.push(i);
    for(let sub=1;sub<1<<here.length;sub++){const grp=here.filter((_,j)=>sub>>j&1);if(crossErr(m,s,grp))continue;
      let nm=m;grp.forEach(i=>nm^=1<<i);const nk=k(nm,1-s);if(!prev.has(nk)){prev.set(nk,[grp,key]);q.push([nm,1-s]);}}}
  return null;}
function tagSVG(x,y,i,inBoat){const it=P.items[i],hl=S.hl.includes(i);
  const fill=it.g?'#ede4fd':it.k==='W'?'#e5e1da':it.k==='S'?'#fffdf5':'#fff',st=it.g?'#7c3aed':'#6a625a';
  return `<g class="tg" data-i="${i}" style="cursor:pointer"><rect x="${x-4}" y="${y-3}" width="98" height="38" fill="rgba(0,0,0,0)"/><rect x="${x}" y="${y}" width="90" height="32" rx="8" fill="${fill}" stroke="${hl?'#f59e0b':st}" stroke-width="${hl?4:1.5}"/><text x="${x+45}" y="${y+21}" text-anchor="middle" font-size="${it.n.length>6?12:14}" font-weight="700" fill="#2a2520" font-family="sans-serif">${it.n}</text></g>`;}
function boatSlots(){let k=Math.min(P.cap,P.items.length);if(P.W){const ws=P.items.map(x=>x.w).sort((a,b)=>a-b);let t=0,m=0;for(const w of ws){if(t+w>P.W)break;t+=w;m++;}k=Math.min(k,Math.max(m,1));}return Math.max(k,S.boat.length,1);}
function rivSVG(){const n=P.items.length,rows=Math.max(n,2),H=rows*38+40,bslots=boatSlots(),bh=bslots*38+12;let o='';
  o+=`<rect x="0" y="0" width="100" height="${H}" fill="#d9ead0"/><rect x="240" y="0" width="100" height="${H}" fill="#d9ead0"/><rect x="100" y="0" width="140" height="${H}" fill="#cfe4f4"/>`;
  for(let k=0;k<4;k++)o+=`<path d="M${112+k*30},${20+k*37%H} q8,-6 16,0" stroke="#9cc5e6" stroke-width="2" fill="none"/>`;
  o+=`<text x="50" y="${H-6}" text-anchor="middle" font-size="11" fill="#4d6b3f" font-family="sans-serif">こちらの岸</text><text x="290" y="${H-6}" text-anchor="middle" font-size="11" fill="#4d6b3f" font-family="sans-serif">向こう岸</text>`;
  const bx=S.side?140:104,by=Math.max(4,(H-22-bh)/2);
  o+=`<path d="M${bx-6},${by+bh-18} h108 q-6,26 -22,26 h-64 q-16,0 -22,-26 z" fill="#b07a45" stroke="#7a4f27" stroke-width="2"/><rect x="${bx-2}" y="${by}" width="100" height="${bh-8}" rx="10" fill="#f1e2c6" stroke="#7a4f27" stroke-width="2"/>`;
  P.items.forEach((x,i)=>{if(S.boat.includes(i))return;o+=tagSVG(onR(i)?245:5,8+i*38,i);});
  S.boat.forEach((i,k)=>{o+=tagSVG(bx+3,by+5+k*38,i,true);});
  if(!S.boat.length)o+=`<text x="${bx+48}" y="${by+bh/2}" text-anchor="middle" font-size="12" fill="#7a4f27" font-family="sans-serif">ボート</text>`;
  return `<svg id="bd" viewBox="0 0 340 ${H}" style="max-width:440px" role="img" aria-label="川とボート">${o}</svg>`;}
function rivDraw(){const w=S.boat.reduce((a,i)=>a+P.items[i].w,0);
  return `<p class="qq">${P.title}</p><ul class="rules">${P.rules.map(r=>`<li>${r}</li>`).join('')}</ul>
    <div class="boardw">${rivSVG()}</div>
    <div class="row" style="justify-content:space-between"><span class="note">手数 <b>${S.moves}</b>　・　最短 ${P.opt}手</span>${P.unit==='kg'?`<span class="note">ボート ${w}kg / ${P.W}kg</span>`:''}</div>
    ${S.done?'':`<button class="btn go" id="cross">${S.side?'← こちらの岸へもどる':'→ 向こう岸へわたる'}</button>`}`;}
function tapItem(i){if(S.done)return;S.msgc='';
  if(S.boat.includes(i)){S.boat=S.boat.filter(x=>x!==i);S.msg='';draw();return;}
  if(onR(i)!==(S.side===1)){S.msg='ボートは反対の岸にあります。';draw();return;}
  S.boat.push(i);S.msg='';draw();}
function cross(){const e=crossErr(S.mask,S.side,S.boat);
  if(e){S.msg=e+(S.boat.length&&!e.startsWith('ボート')?'　その動きはできません。':'');S.msgc='ng';draw();return;}
  S.hist.push([S.mask,S.side]);S.boat.forEach(i=>S.mask^=1<<i);S.side=1-S.side;S.boat=[];S.moves++;S.hl=[];S.msg='';
  if(S.mask===(1<<P.items.length)-1)S.done=true;draw();}
/* ---------- 共通 ---------- */
function draw(){
  app.innerHTML=`${topBar()}${isOil()?oilDraw():rivDraw()}
    ${S.done?'':`<p class="msg ${S.msgc}" id="msg">${S.msg||(isOil()?'ボタンをおして油を動かそう。':'乗せたいものをタップしてボートに乗せよう。')}</p>
    <div class="row mrow"><button class="btn" id="undo" ${S.hist.length?'':'disabled'}>1手もどす</button><button class="btn" id="reset">やりなおす</button><button class="btn" id="hint">ヒント</button></div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){S.hints=S.hint+(S.moves>P.opt?1:0)+(S.moves>2*P.opt?1:0);showClear(explain());return;}
  if(isOil())app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>oilAct(b.dataset.a.split(',').map((v,k)=>k?+v:v)));
  else{app.querySelectorAll('.tg').forEach(g=>g.addEventListener('pointerdown',ev=>{ev.preventDefault();tapItem(+g.dataset.i);}));document.getElementById('cross').onclick=cross;}
  document.getElementById('undo').onclick=()=>{const h=S.hist.pop();if(!h)return;if(isOil()){S.s=h;S.log.pop();}else{[S.mask,S.side]=h;S.boat=[];}S.moves--;S.hl=[];S.hla=null;S.msg='1手もどしました（手数は数えなおし）。';S.msgc='';draw();};
  document.getElementById('reset').onclick=()=>{const h=S.hint;startStage(P);S.hint=h;};
  document.getElementById('hint').onclick=hint;
}
function hint(){S.hint++;S.msgc='';
  if(isOil()){const a=oilNext(S.s);if(!a){S.msg='ここからは目標にできません。「やりなおす」をおそう。';draw();return;}
    S.hla=a;S.hl=a[0]==='P'?[a[1],a[2]]:[a[1]];S.msg=`ヒント：次は「${actName(a)}」（ヒント ${S.hint}回）。`;draw();return;}
  S.boat=[];const g=rivNext();if(!g){S.msg='ここからは全員をわたらせられません。';draw();return;}
  S.hl=g;S.msg=`ヒント：光っている${grpName(g,'と')}を乗せて、わたろう（ヒント ${S.hint}回）。`;draw();}
function explain(){
  const head=`<p style="margin:0">あなたは ${S.moves}手、最短は ${P.opt}手でした。${S.moves===P.opt?'最短でできました！':'最短の手数を目指して、もう一度やってみよう。'}</p>`;
  let steps;
  if(isOil()){let s=P.init.slice();steps=P.sol.map(a=>{s=oilMoves(s).find(([b])=>b.join()===a.join())[1];return `<li>${actName(a)}　→ ${s.join('・')}</li>`;});
    return head+`<details><summary style="cursor:pointer;font-weight:700;font-size:14px">最短の手順の一例</summary><p class="note">はじめ ${P.init.join('・')}（${P.caps.map(c=>c+'L').join('・')}の順）</p><ol class="rules">${steps.join('')}</ol></details>
      <p class="note">コツ：大きい入れ物から小さい入れ物へ注いで「あまり」を作ると、ちがう量がはかれます。</p>`;}
  steps=P.sol.map((g,k)=>`<li>${k%2?'←':'→'} ${grpName(g,'・')}</li>`);
  return head+`<details><summary style="cursor:pointer;font-weight:700;font-size:14px">最短の手順の一例</summary><ol class="rules">${steps.join('')}</ol></details>
    <p class="note">コツ：向こう岸へ運んだものを、いったん<b>つれてもどる</b>ことが解決のかぎになる問題が多くあります。</p>`;}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
