<style>

<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>何曜日？</h1>
    <p class="lead">「今日は月曜日。3日後は？」曜日の輪をタップして答えよう。○日後、次の月の同じ日、うるう年のある1月1日まで、5つのレベルから1問ずつ。ヒントやまちがいなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=false;
let QS=[{"id":"1-01","q":"今日は\u003cb>金曜日\u003c/b>です。\u003cb>あした\u003c/b>は何曜日？","w0":5,"c1":"今日","c2":"あした","d":1,"a":6,"hint":"輪の上で、金曜日から時計まわりに1つ進もう。","ex":"金→土 と、1つ進んで\u003cb>土曜日\u003c/b>。","mode":"tap","lv":1},{"q":"今日は\u003cb>月曜日\u003c/b>です。\u003cb>11日後\u003c/b>は何曜日？","w0":1,"c1":"今日","c2":"11日後","d":11,"a":5,"hint":"7日ごとに同じ曜日にもどります。11日を「7日のかたまり」と「のこり」に分けよう。","ex":"11÷7＝1あまり4。7日ごとに同じ曜日にもどるので、月曜日から、あまりの4つだけ進んで\u003cb>金曜日\u003c/b>です。","mode":"tap","id":"2-01","lv":2},{"q":"\u003cb>6月18日\u003c/b>は\u003cb>水曜日\u003c/b>です。同じ年の\u003cb>7月18日\u003c/b>は何曜日？","w0":3,"c1":"6/18","c2":"7/18","d":30,"a":5,"hint":"6月は何日まであるかな？　6月が30日まであると、次の月の同じ日は30日後。28日（4週間）より何日多い？","ex":"6月は30日まであるので、7月18日は30日後。30÷7＝4あまり2。7日ごとに同じ曜日にもどるので、水曜日から、あまりの2つだけ進んで\u003cb>金曜日\u003c/b>です。","mode":"tap","id":"3-01","lv":3},{"q":"\u003cb>2027年1月1日\u003c/b>は\u003cb>金曜日\u003c/b>です。同じ年の\u003cb>3月1日\u003c/b>は何曜日？（2027年はうるう年ではありません）","w0":5,"c1":"2027/1/1","c2":"3/1","d":59,"a":1,"hint":"3月1日は1月1日の何日後かな？　1月は31日まで、2月は28日まで。","ex":"1月は31日、2月は28日なので、3月1日は1月1日の59日後。59÷7＝8あまり3。7日ごとに同じ曜日にもどるので、金曜日から、あまりの3つだけ進んで\u003cb>月曜日\u003c/b>です。","mode":"tap","id":"4-01","lv":4},{"q":"\u003cb>2026年1月1日\u003c/b>は\u003cb>木曜日\u003c/b>です。\u003cb>2030年1月1日\u003c/b>は何曜日？","w0":4,"c1":"2026/1/1","c2":"2030/1/1","d":1461,"a":2,"hint":"1年ごとに曜日は1つ（うるう年は2つ）ずれます。2026年から2029年までに、うるう年（4でわり切れる年）はいくつあるかな？","ex":"1年（365日）で曜日は1つ、うるう年（366日）なら2つずれます。2026年から2029年までの4年のうち、うるう年は2028年。ずれは4＋1＝5。5つ進んで\u003cb>火曜日\u003c/b>です。","mode":"tap","id":"5-01","lv":5}];
const ID='youbi';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>何曜日？ 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* 何曜日？：p={mode:'tap'|'ch', q, w0（もとの曜日 0=日）, d（何日後。前はマイナス）, a（答えの曜日 0〜6／chは数）, ds?, unit?, c1,c2（輪のまん中の文字）, hint, ex}
   答えは gen_youbi.py で「日数 mod 7」と本物のカレンダー（datetime）の2つの方法で計算して一致を確かめてある */
const HINTWORD='ヒントやまちがい';
const LVD={1:'あした・きのう・○日後',2:'7日より先・同じ月の日',3:'月をまたぐ・100日後',4:'1年のカレンダー（うるう年）',5:'何年も先・2100年・53回ある曜日'};
const RULES=`<ol class="rules">
  <li>問題を読んで、答えの<b>曜日を輪の中からタップ</b>しよう。</li>
  <li>1週間は7日。<b>7日たつと、同じ曜日にもどります</b>。○日後は、○を7でわったあまりの分だけ進めます。</li>
  <li>月の日数：<b>2月は28日</b>、<b>4・6・9・11月は30日</b>、ほかの月は31日。</li>
  <li><b>うるう年</b>は2月が29日まであり、1年が366日。4でわり切れる年がうるう年です（ただし2100年のように100でわり切れる年は、400でわり切れないとうるう年ではありません）。</li>
  <li>レベル5には、4つから答えをえらぶ問題もあります。</li></ol>`;
const YW='日月火水木金土';
const YCX=160,YCY=150,YR=106,YRC=31;
const yPos=k=>{const t=(-90+k*360/7)*Math.PI/180;return [YCX+YR*Math.cos(t),YCY+YR*Math.sin(t)];};
function startStage(p){P=p;S={hints:0,done:false,msg:'',msgc:'',wrong:[],hint:false,opts:p.mode==='ch'?shuffle([p.a,...p.ds]):null};begin(p);draw();}
function ringSVG(){
  const tap=P.mode!=='ch'&&!S.done;let s='';
  /* 外の輪（時計まわりの矢じるし）。答えのあとは、進んだ（もどった）ところをむらさきに */
  const n=S.done&&P.mode!=='ch'?Math.abs(P.d)%7:0,dir=P.d>0?1:-1,on=new Set();
  for(let i=0;i<n;i++)on.add(dir>0?(P.w0+i)%7:(P.w0-i-1+70)%7);
  s+=`<circle cx="${YCX}" cy="${YCY}" r="${YR}" fill="none" stroke="#e4dccb" stroke-width="10"/>`;
  for(let k=0;k<7;k++){const [x1,y1]=yPos(k),[x2,y2]=yPos(k+1),hl=on.has(k);
    if(hl)s+=`<path d="M${x1},${y1} A${YR},${YR} 0 0 1 ${x2},${y2}" fill="none" stroke="#7c3aed" stroke-width="10"/>`;
    const t=(-90+(k+.5)*360/7)*Math.PI/180,mx=YCX+YR*Math.cos(t),my=YCY+YR*Math.sin(t),ang=(-90+(k+.5)*360/7)+90+(hl&&dir<0?180:0);
    s+=`<g transform="translate(${mx},${my}) rotate(${ang})"><polygon points="${hl?'-7,-8 8,0 -7,8':'-5,-5 5,0 -5,5'}" fill="${hl?'#fff':'#cbbfa8'}" ${hl?'stroke="#7c3aed" stroke-width="2"':''}/></g>`;}
  for(let k=0;k<7;k++){const [x,y]=yPos(k);const base=k===P.w0,ans=S.done&&P.mode!=='ch'&&k===P.a,wr=S.wrong.includes(k);
    const fill=ans?'#e0f0e6':wr?'#f8e3e1':base?'#ede4fd':'#ffffff',st=ans?'#1d7a4c':wr?'#c8352d':base?'#7c3aed':'#a59c90';
    const tc=k===0?'#c8352d':k===6?'#2563eb':'#2a2520';
    s+=`<g class="yday" data-k="${k}" ${tap&&!wr?`role="button" tabindex="0" aria-label="${YW[k]}曜日" style="cursor:pointer"`:''} opacity="${wr?.5:1}">
      <circle cx="${x}" cy="${y}" r="${YRC}" fill="${fill}" stroke="${st}" stroke-width="${base||ans?4:2}"/>
      <text x="${x}" y="${y+10}" text-anchor="middle" font-size="29" font-weight="700" fill="${tc}" font-family="sans-serif">${YW[k]}</text></g>`;
    if(base){const bt=P.c1.length<=5?P.c1:'ここから',bw=Math.max(40,bt.length*13+12);s+=`<rect x="${x-bw/2}" y="${y-YRC-12}" width="${bw}" height="19" rx="9.5" fill="#7c3aed"/><text x="${x}" y="${y-YRC+2.5}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff" font-family="sans-serif">${esc(bt)}</text>`;}
    if(wr)s+=`<line x1="${x-14}" y1="${y-14}" x2="${x+14}" y2="${y+14}" stroke="#c8352d" stroke-width="3"/><line x1="${x+14}" y1="${y-14}" x2="${x-14}" y2="${y+14}" stroke="#c8352d" stroke-width="3"/>`;}
  /* まん中 */
  const fs=t=>t.length>8?15:t.length>5?17:20;
  s+=`<text x="${YCX}" y="${YCY-20}" text-anchor="middle" font-size="${fs(P.c1)}" font-weight="700" fill="#3b2f6b" font-family="sans-serif">${esc(P.c1)}は${YW[P.w0]}</text>
    <text x="${YCX}" y="${YCY+6}" text-anchor="middle" font-size="18" fill="#7c3aed" font-family="sans-serif">↓</text>
    <text x="${YCX}" y="${YCY+32}" text-anchor="middle" font-size="${fs(P.c2)}" font-weight="700" fill="#3b2f6b" font-family="sans-serif">${esc(P.c2)}${S.done&&P.mode!=='ch'?'は'+YW[P.a]:P.mode==='ch'?'':'は？'}</text>`;
  return `<svg viewBox="0 0 320 300" style="max-width:340px" role="img" aria-label="曜日の輪"><defs><marker id="yar" markerWidth="4" markerHeight="4" refX="2.4" refY="2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L4,2 L0,4 z" fill="#7c3aed"/></marker></defs>${s}</svg>`;
}
function draw(){
  const ch=P.mode==='ch';
  app.innerHTML=`${topBar()}
    <p class="qq">${P.q}</p>
    <div class="boardw">${ringSVG()}</div>
    ${ch?`<div class="opts4 txt">${S.opts.map((o,i)=>`<button class="ob ${S.done&&o===P.a?'right':''} ${S.wrong.includes('o'+i)?'wrong':''}" data-i="${i}" ${S.done||S.wrong.includes('o'+i)?'disabled':''}><span class="k">${'アイウエ'[i]}</span><b style="font-size:21px">${o}${P.unit}</b></button>`).join('')}</div>`:''}
    ${S.hint&&!S.done?`<p class="hintbox">${P.hint}</p>`:''}
    ${S.done?'':`<p class="msg ${S.msgc}" id="msg">${S.msg||(ch?'4つの中から答えをえらぼう。':'答えの曜日をタップしよう。')}</p><div class="row"><button class="btn" id="hint" ${S.hint?'disabled':''}>ヒント</button></div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(`<p style="margin:0">${P.ex}</p>`);return;}
  const ng=()=>{S.hints++;S.msg='ちがいます。もう一度考えてみよう。';S.msgc='ng';draw();};
  if(ch)app.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(S.opts[i]===P.a){S.done=true;draw();}else{S.wrong.push('o'+i);ng();}});
  else app.querySelectorAll('.yday[role=button]').forEach(g=>{const f=()=>{const k=+g.dataset.k;if(k===P.a){S.done=true;draw();}else{S.wrong.push(k);ng();}};
    g.addEventListener('click',f);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f();}});});
  document.getElementById('hint').onclick=()=>{S.hint=true;S.hints++;S.msg='';S.msgc='';draw();};
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
