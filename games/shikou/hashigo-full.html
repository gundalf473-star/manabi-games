<script>
(function(){
const PAID=true;
let QS=[];
const ID='hashigo';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};

const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

const bindBack=()=>{document.getElementById('back').onclick=home;};

/* ======== パズルごとの部分 ======== */
/* ことばのはしご：p={n:文字数, s:スタート, g:ゴール, opt:最短の手数, mode:'pick'|'pad', sol:[最短の道の1つ], pad:[使える字]} */
/* DICT は gen_hashigo.py が書きこむ（問題づくりと同じことばの表） */
const DICT={2:"あう あお あか あき あく あさ あし あじ あせ あな あみ あむ あめ あり あわ いう いえ いか いく いけ いし いす いた いと いぬ いね いも いろ いわ うし うた うで うま うみ うめ うら うる えき えさ えだ えび おか おく おす おと おに おゆ かい かう かお かき かぎ かく かぐ かさ かす かぜ かた かつ かど かに かば かぶ かべ かみ かむ かめ かも かわ きく きず きた きば きり きる くぎ くさ くし くじ くち くつ くび くま くも くり ける こえ こぐ こし こな こま こめ ごま ごみ さか さけ さす さめ さら さる しお しか した しま しろ すし すず すな すむ せき せみ そこ そで そと そば そら たい たか たき たけ たこ たつ たね たび たま だす ちず つき つく つち つな つの つむ つめ つゆ つる てら でる とし とぶ とら とり とる なく なし なす なつ なべ なみ なる にく にじ にる にわ ぬう ぬぐ ぬの ねぎ ねこ ねじ ねつ ねる のど のむ のり のる はく はこ はし はた はち はと はな はね はり はる はれ ばら ひげ ひざ ひじ ひも ひる ふえ ふく ふね ふむ ふゆ ふる ふろ ぶた へそ へび へや ほし ほね ほる ほん まく まち まつ まど まめ みず みせ みそ みち みみ みる むぎ むし むね もち もつ もも もり やぎ やく やね やま ゆか ゆき ゆび ゆめ よこ よぶ よむ よる わし わた わに",3:"あおい あかい あくび あける あげる あさい あさひ あそぶ あたま あたる あつい あひる あびる あまい あまる あらう あらし あるく いそぐ いたい いちご いなか いのち いのる いるか いれる いわし うえる うかぶ うきわ うける うごく うさぎ うしろ うすい うたう うちわ うつす うつる うどん うまい うめる えのぐ えほん えらい えらぶ おおい おかし おかず おきる おくる おこる おそい おちる おとす おとな おどる おなか おばけ おもい おもう おもち おやつ およぐ おりる おわる かえす かえる かかし かかと かかる かがみ かくす かける かざる かじる かぞく かたい かたち かたな かばん かぶと かぶる かもめ かゆい からい からす からだ かるい かわく かわる きえる きつい きつね きなこ きのこ きまる きめる きもち きもの くさい くじら くすり くばる くもり くもる くらい くらす くるま くるみ くれる くろい けむり こいぬ こえる こおり こころ こたえ こたつ ことば ことり こども こねこ こまる ころぶ こわい ごはん ごぼう さいふ さかな さがす さくら さける さげる さとう さむい さわぐ さわる しかく しかる しずく しばる しまう しまる しめる しろい すいか すがた すくう すごい すすむ すずめ すてる すなば すべる すみれ すわる ずるい せなか せまい そだつ たいこ たおす たかい たから たたく たてる たぬき たべる たまご ためる だんご ちかい ちかう ちくわ つかう つかむ つくえ つくし つくる つける つつむ つなぐ つばさ つばめ つもる つよい てがみ てらす とおい とおる とかす とけい とける とじる とどく とばす とまる とめる とんぼ なおす なおる なかま ながい ながす なげる なでる なまえ なみだ ならう ならす ならぶ にがい にげる にもつ ぬらす ぬるい ぬれる ねがう ねずみ ねむい ねむる のこす のこる のせる のはら のばす のびる のぼる はいる はかる はがき はこぶ はさみ はさむ はしご はしら はしる はずむ はたけ はなす はなび はねる はやい ひかり ひかる ひくい ひだり ひつじ ひよこ ひらく ひろい ひろう ふえる ふかい ふくむ ふくろ ふとい ふとる ふとん ふやす ふるい へこむ へらす ほうき ほえる ほそい ほたる ほどく ほめる ぼうし まがる まくら まける まげる まぜる まつり まもる まよう まるい まわす まわる みえる みかん みがく みずぎ みせる みどり みのる むかう むかし むすぶ めがね めだか めだま もえる もぐら もぐる もどる もみじ もらう やかん やける やさい やすい やすむ やめる ゆうひ ゆかた ゆでる ゆらす ゆるい ゆれる よける よごす よわい わかい わかめ わかる わける わさび わたす わたる わらう わるい われる"};
const HINTWORD='ヒント・まちがい・遠回り';
const LVD={1:'2文字のことば・2手でゴール',2:'2文字のことば・3手でゴール',3:'3文字のことば・2〜3手',4:'字を入れてつくる・3〜4手',5:'字を入れてつくる・4〜5手'};
const RULES=`<ol class="rules">
  <li>上の<b>スタート</b>のことばの字を、<b>1文字だけ</b>かえて、べつのことばにしよう。これをくり返して、下の<b>ゴール</b>のことばまで、はしごをおりよう。<br>（例：ね<b>こ</b> → <b>ね</b>ぎ → <b>く</b>ぎ）</li>
  <li>字の<b>場所</b>は動かしません。「か」を「が」にするように、<b>゛をつけたりとったり</b>するのも1文字かえたことになります。</li>
  <li>とちゅうのことばも、ふだん使うことばだけ。このゲームの<b>ことばリスト</b>にあることばが使えます。</li>
  <li>レベル1〜3は、下のことばから次の1だんを<b>えらびます</b>。レベル4・5は、かえたい字を<b>タップ</b>してから、下の字をえらびます。</li>
  <li><b>最短の手数</b>でゴールすると★3つ。「1つもどる」でやりなおせます。</li></ol>`;
const WS={};for(const k in DICT)WS[k]=DICT[k].split(' ');
const ham=(a,b)=>{let d=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i])d++;return d;};
const diffAt=(a,b)=>{for(let i=0;i<a.length;i++)if(a[i]!==b[i])return i;return -1;};
/* ゴールからの手数。pad があるときは、v→u で入れる字 u[i] がパッドにあるときだけ進める */
function bfsFrom(g,pad){const L=g.length,ws=WS[L],dist={[g]:0},q=[g];
  for(let h=0;h<q.length;h++){const u=q[h];for(const v of ws){if(dist[v]===undefined&&ham(u,v)===1&&(!pad||pad.includes(u[diffAt(u,v)]))){dist[v]=dist[u]+1;q.push(v);}}}return dist;}
function startStage(p){P=p;S={chain:[p.s],hints:0,miss:0,done:false,msg:'',msgc:'',sel:null,hl:null,hk:null,dg:bfsFrom(p.g,p.mode==='pad'?p.pad:null)};
  if(p.mode==='pick')makeCand();begin(p);draw();}
const cur=()=>S.chain[S.chain.length-1];
function makeCand(){
  const w=cur(),ws=WS[P.n],d0=S.dg[w];
  const nb=ws.filter(u=>ham(u,w)===1&&!S.chain.includes(u));
  let good=shuffle(nb.filter(u=>S.dg[u]===d0-1));
  if(good.includes(P.g)){good.splice(good.indexOf(P.g),1);good.unshift(P.g);}
  /* 近づくことばが、もう通ったものしかないとき：まだ通っていない、いちばんゴールに近いことばを出す */
  if(!good.length&&nb.length){const m=Math.min(...nb.map(u=>S.dg[u]));good=shuffle(nb.filter(u=>S.dg[u]===m));}
  if(!good.length){S.cand=[];S.good=null;S.msg='ここからは、まだ通っていないことばに すすめません。「1つもどる」で、ちがう道をためそう。';S.msgc='';return;}
  const other=shuffle(nb.filter(u=>S.dg[u]>=d0&&u!==good[0]));
  /* まちがいの候補：2文字以上かわることば。ゴールににたものほどまよいやすい */
  const far=shuffle(ws.filter(u=>ham(u,w)>=2&&u!==P.g&&!S.chain.includes(u))).sort((a,b)=>ham(a,P.g)-ham(b,P.g)).slice(0,8);
  const c=[good[0]];
  if(P.lv>=2&&other.length)c.push(other[0]);
  if(P.lv>=3&&good.length>1)c.push(good[1]);
  for(const u of shuffle(far)){if(c.length>=4)break;if(!c.includes(u))c.push(u);}
  S.cand=shuffle(c);S.good=good[0];
}
const tile=(ch,cls,attr)=>`<span class="hs-t ${cls||''}" ${attr||''}>${esc(ch)}</span>`;
function rung(w,prev,opts){opts=opts||{};const di=prev?diffAt(prev,w):-1;
  return `<div class="hs-r ${opts.cls||''}">${opts.tag?`<span class="hs-tag">${opts.tag}</span>`:''}<span class="hs-w">${[...w].map((ch,i)=>{
    if(opts.edit)return `<button class="hs-t hs-e ${S.sel===i?'sel':''} ${S.hl===i?'hl':''}" data-i="${i}" aria-label="${i+1}文字目">${esc(ch)}</button>`;
    return tile(ch,i===di?'ch':'');}).join('')}</span></div>`;}
function ladder(){
  const ch=S.chain,steps=ch.length-1;let o='';
  ch.forEach((w,i)=>{const last=i===ch.length-1;
    o+=rung(w,i?ch[i-1]:null,{tag:i===0?'スタート':S.done&&last?'ゴール':i+'手',cls:last?(S.done?'goal':'now'):'',edit:last&&!S.done&&P.mode==='pad'&&w!==P.g});});
  if(!S.done){const rest=Math.max(1,(S.dg[cur()]||1)-1);
    for(let i=0;i<rest;i++)o+=`<div class="hs-r empty"><span class="hs-w">${[...P.g].map(()=>'<span class="hs-t emp"></span>').join('')}</span></div>`;
    o+=rung(P.g,null,{tag:'ゴール',cls:'goal'});}
  return `<div class="hs-lad">${o}</div>`;
}
function draw(){
  const steps=S.chain.length-1;
  app.innerHTML=`${topBar()}
    <div class="boardw hs-bw">${ladder()}</div>
    <div class="row" style="justify-content:space-between"><span class="note">手数 <b>${steps}</b>　・　最短 ${P.opt}手</span></div>
    ${S.done?'':`${P.mode==='pick'?`<div class="label">次の1だんは どれ？</div><div class="opts4 txt">${S.cand.map((u,i)=>`<button class="ob hs-c ${S.hl===u?'right':''}" data-u="${u}"><span class="k">${'アイウエ'[i]}</span><b style="font-size:24px;letter-spacing:.12em">${u}</b></button>`).join('')}</div>`
      :`<div class="cw-pad hs-pad">${P.pad.map(k=>`<button data-k="${k}" class="${S.hk===k?'hl':''}">${k}</button>`).join('')}</div>`}
    <p class="msg ${S.msgc||''}" id="msg">${S.msg||(P.mode==='pick'?'1文字だけかわることばを えらぼう。':(S.sel===null?'かえたい字を タップしよう（むらさきのだん）。':`${S.sel+1}文字目を、何に かえる？`))}</p>
    <div class="row"><button class="btn" id="undo" ${steps?'':'disabled'}>1つもどる</button><button class="btn" id="hint">ヒント</button><button class="btn" id="reset" ${steps?'':'disabled'}>はじめから</button></div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){
    S.hints=S.miss+(steps>P.opt?1:0);
    showClear(`<p style="margin:0">${steps===P.opt?`最短の${P.opt}手でゴール！`:`あなたは${steps}手、最短は${P.opt}手でした。`}　${steps===P.opt&&S.chain.join()===P.sol.join()?'':`最短の道の例：${P.sol.join(' → ')}`}</p>`);return;}
  app.querySelectorAll('.hs-c').forEach(b=>b.onclick=()=>pick(b.dataset.u));
  app.querySelectorAll('.hs-e').forEach(b=>b.onclick=()=>{S.sel=+b.dataset.i;S.msg='';S.msgc='';draw();});
  app.querySelectorAll('.hs-pad button').forEach(b=>b.onclick=()=>typeK(b.dataset.k));
  document.getElementById('undo').onclick=()=>{if(S.chain.length>1){S.chain.pop();S.sel=null;S.hl=null;S.hk=null;S.msg='';if(P.mode==='pick')makeCand();draw();}};
  document.getElementById('reset').onclick=()=>{S.chain=[P.s];S.sel=null;S.hl=null;S.hk=null;S.msg='';if(P.mode==='pick')makeCand();draw();};
  document.getElementById('hint').onclick=hint;
}
function step(u){
  S.chain.push(u);S.sel=null;S.hl=null;S.hk=null;
  if(u===P.g){S.done=true;draw();return;}
  const d=S.dg[u];S.msg=`「${u}」！　いいね。`;S.msgc='ok';
  if(P.mode==='pick')makeCand();draw();
}
function pick(u){
  const w=cur();
  if(ham(u,w)!==1){S.miss++;S.msg=`「${w}」→「${u}」は ${ham(u,w)}文字 かわっています。1文字だけ かえたことばを えらぼう。`;S.msgc='ng';draw();return;}
  step(u);
}
function typeK(k){
  if(S.sel===null){S.msg='先に、かえたい字（むらさきのだんの字）を タップしてね。';S.msgc='';draw();return;}
  const w=cur(),a=[...w];a[S.sel]=k;const u=a.join('');
  if(u===w){S.msg='同じ字です。べつの字をえらぼう。';S.msgc='';draw();return;}
  if(S.chain.includes(u)){S.msg=`「${u}」は もう通ったことばです。`;S.msgc='';draw();return;}
  if(!WS[P.n].includes(u)){S.msg=`「${u}」は、このゲームのことばリストに入っていないので、使えません。ごめんね。ほかの字も ためしてみよう。`;S.msgc='';draw();return;}
  step(u);
}
function hint(){
  const w=cur(),d0=S.dg[w];
  const nx=WS[P.n].filter(u=>ham(u,w)===1&&S.dg[u]===d0-1&&!S.chain.includes(u)&&(P.mode!=='pad'||P.pad.includes(u[diffAt(w,u)])));
  const u=nx.includes(P.g)?P.g:(P.mode==='pick'&&nx.includes(S.good)?S.good:nx[0]);
  if(!u){S.msg='「1つもどる」で、ちがう道をためしてみよう。';S.msgc='';draw();return;}
  S.miss++;
  if(P.mode==='pick'){S.hl=u;S.msg=`ヒント：「${u}」にすると、ゴールに近づきます（ヒント ${S.miss}回）。`;}
  else{const i=diffAt(w,u);S.sel=i;S.hl=i;S.hk=u[i];S.msg=`ヒント：${i+1}文字目を「${u[i]}」にかえてみよう（ヒント ${S.miss}回）。`;}
  S.msgc='';draw();
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
