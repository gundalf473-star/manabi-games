<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>点と線の陣取り 100問</h1>
    <p class="lead">点と点を線でつないで、箱をたくさん取ろう。5つのレベルに20問ずつ。ヒントややり直しなしでクリアすると★3つ。</p>
  </header>

</div>

<script>
(function(){
const PAID=true;
let QS=[];
const ID='jintori';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>点と線の陣取り 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* 点と線の陣取り（ドット・アンド・ボックス）
   p={kind:'game'|'end', r,c:箱のたて・横の数, m0:はじめに引いてある線（ビット）, first:'you'|'cpu', cpu:'weak'|'greedy'|'safe'|'strong'|'perfect', sd:打ち方の番号,
      t:目標の箱の数（end）, rem:のこりの箱, greedy:全部取る作戦で取れる数}
   線の番号：横線 r*C+c（r=0..R）、つづいて たて線 nH+r*(C+1)+c */
const HINTWORD='ヒントややり直し';
const LVD={1:'小さい盤・よわい相手',2:'3本目の線に気をつける',3:'短い列からわたす',4:'わざとゆずる・強い相手',5:'大きい盤・強い相手'};
const RULES=`<ol class="rules">
  <li>点と点の間の<b>線を1本ずつ</b>、コンピューターと交代に引きます（線のあたりをタップ）。</li>
  <li>箱の<b>4本目の線</b>を引いた人が、その箱をもらえます（あなたは <b class="jo">○</b>、相手は <b class="jx">×</b>）。</li>
  <li><b>箱を取ったら、もう1回</b>続けて引きます。</li>
  <li>対戦は、全部の線が引かれたとき、<b>箱が相手より多ければクリア</b>。</li>
  <li>「<b>終盤の問題</b>」は、相手がミスしなくても取れる、いちばん多い数（目標）を取ればクリア。</li>
  <li>ヒントを使うと、おすすめの線が黄色く光ります（星がへります）。</li></ol>`;
const BDS={};
function BD(R,C){const k=R+'x'+C;if(BDS[k])return BDS[k];
  const nH=(R+1)*C,L=nH+R*(C+1),boxes=[],lb=Array.from({length:L},()=>[]);
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){const bx=[r*C+c,(r+1)*C+c,nH+r*(C+1)+c,nH+r*(C+1)+c+1];bx.forEach(l=>lb[l].push(boxes.length));boxes.push(bx);}
  return BDS[k]={R,C,nH,L,boxes,lb,full:L===31?0x7fffffff:(1<<L)-1,memo:new Map()};}
const has=(m,l)=>((m>>l)&1)===1;
const bit=l=>1<<l;
function gain(B,m,l){let k=0;for(const bi of B.lb[l])if(B.boxes[bi].every(x=>x===l||has(m,x)))k++;return k;}
const sides=(B,m,bi)=>B.boxes[bi].reduce((a,x)=>a+(has(m,x)?1:0),0);
const und=(B,m)=>{const o=[];for(let l=0;l<B.L;l++)if(!has(m,l))o.push(l);return o;};
const doneN=(B,m)=>B.boxes.filter((_,bi)=>sides(B,m,bi)===4).length;
function f(B,m){ /* 番の人から見た（自分−相手）の最大。相手も最善 */
  if(m===B.full)return 0;const r=B.memo.get(m);if(r!==undefined)return r;
  let best=-99;for(let l=0;l<B.L;l++)if(!has(m,l)){const k=gain(B,m,l),nm=m|bit(l),v=k?k+f(B,nm):-f(B,nm);if(v>best)best=v;}
  B.memo.set(m,best);return best;}
function pick(c,m,sd){let S=0,n=0;for(let i=0;i<31;i++)if(has(m,i)){S+=i+1;n++;}return c[(S*31+n*17+sd*7)%c.length];}
const caps=(B,m)=>und(B,m).filter(l=>gain(B,m,l)>0);
const safes=(B,m)=>und(B,m).filter(l=>B.lb[l].every(bi=>sides(B,m,bi)<2));
function greedyTake(B,m){let t=0;for(;;){const c=caps(B,m);if(!c.length)return t;t+=gain(B,m,c[0]);m|=bit(c[0]);}}
function exactMoves(B,m){const u=und(B,m),vs=u.map(l=>{const k=gain(B,m,l),nm=m|bit(l);return k?k+f(B,nm):-f(B,nm);});const mx=Math.max(...vs);return u.filter((_,i)=>vs[i]===mx);}
const E_STRONG=14;
function policy(B,m,kind,sd){ /* gen_jintori.py の policy と同じ打ち方 */
  const u=und(B,m);
  if(kind==='weak')return pick(u,m,sd);
  if(kind==='perfect'||(kind==='strong'&&u.length<=E_STRONG))return pick(exactMoves(B,m),m,sd);
  const c=caps(B,m);if(c.length)return pick(c,m,sd);
  if(kind==='greedy')return pick(u,m,sd);
  const s=safes(B,m);if(s.length)return pick(s,m,sd);
  const cost=u.map(l=>greedyTake(B,m|bit(l)));const mn=Math.min(...cost);return pick(u.filter((_,i)=>cost[i]===mn),m,sd);}
const CPUN={weak:'よわい',greedy:'箱は取る',safe:'かしこい',strong:'とても強い',perfect:'ミスしない'};
function startStage(p){P=p;S={hints:0,done:false};B0=BD(p.r,p.c);reset();begin(p);draw();if(S.turn==='cpu')cpuSoon();}
let B0=null;
function reset(){S.m=P.m0;S.by={};S.own={};S.me=0;S.you=0;S.turn=P.kind==='end'||P.first==='you'?'me':'cpu';S.over=null;S.msg='';S.msgc='';S.rec=-1;S.hint=0;S.last=-1;S.moved=false;}
const U=84,MG=30;
function dotXY(r,c){return [MG+c*U,MG+r*U];}
function lineEnds(l){const B=B0;if(l<B.nH){const r=Math.floor(l/B.C),c=l%B.C;return [dotXY(r,c),dotXY(r,c+1),'h',r,c];}const k=l-B.nH,r=Math.floor(k/(B.C+1)),c=k%(B.C+1);return [dotXY(r,c),dotXY(r+1,c),'v',r,c];}
function boardSVG(){
  const B=B0,W=B.C*U+2*MG,H=B.R*U+2*MG;let s='';
  B.boxes.forEach((bx,bi)=>{const r=Math.floor(bi/B.C),c=bi%B.C,[x,y]=dotXY(r,c);const o=S.own[bi];
    if(o)s+=`<rect x="${x+4}" y="${y+4}" width="${U-8}" height="${U-8}" rx="6" fill="${o==='me'?'#ede4fd':'#ffedd5'}"/>`+(o==='me'?`<circle cx="${x+U/2}" cy="${y+U/2}" r="${U*0.22}" fill="none" stroke="#7c3aed" stroke-width="7"/>`:`<path d="M${x+U*0.3} ${y+U*0.3}L${x+U*0.7} ${y+U*0.7}M${x+U*0.7} ${y+U*0.3}L${x+U*0.3} ${y+U*0.7}" stroke="#ea580c" stroke-width="7" stroke-linecap="round"/>`);
    else if(sides(B,S.m,bi)===3&&!S.done)s+=`<rect x="${x+8}" y="${y+8}" width="${U-16}" height="${U-16}" rx="6" fill="#fef3c7"/>`;});
  for(let l=0;l<B.L;l++){const [a,z]=lineEnds(l),d=has(S.m,l),who=S.by[l];
    const col=!d?(l===S.rec?'#facc15':'#d6d3d1'):who==='me'?'#7c3aed':who==='cpu'?'#ea580c':'#57534e';
    s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${z[0]}" y2="${z[1]}" stroke="${col}" stroke-width="${d?9:l===S.rec?14:4}" stroke-linecap="round" ${!d&&l!==S.rec?'stroke-dasharray="2 9"':''}/>`;
    if(l===S.last)s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${z[0]}" y2="${z[1]}" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>`;}
  for(let r=0;r<=B.R;r++)for(let c=0;c<=B.C;c++){const [x,y]=dotXY(r,c);s+=`<circle cx="${x}" cy="${y}" r="7" fill="#2a2520"/>`;}
  /* 大きなタップ領域：線の両はしの点と、両がわの箱の中心を結ぶひし形 */
  for(let l=0;l<B.L;l++){if(has(S.m,l))continue;const [a,z,t]=lineEnds(l),mx=(a[0]+z[0])/2,my=(a[1]+z[1])/2,h=U/2;
    const pts=t==='h'?[a,[mx,my-h],z,[mx,my+h]]:[a,[mx-h,my],z,[mx+h,my]];
    s+=`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="transparent" data-l="${l}" style="cursor:pointer"/>`;}
  return `<svg id="bd" viewBox="0 0 ${W} ${H}" style="max-width:${Math.min(W*1.25,440)}px" role="img" aria-label="点と線の盤">${s}</svg>`;
}
function qline(){
  if(P.kind==='end')return `【終盤の問題】あなたの番です。のこりの箱は${P.rem}個。相手がミスしなくても、<b>${P.t}個</b>取れます。<b>${P.t}個取ればクリア</b>。`;
  return `${P.r}×${P.c}の箱。相手：<b>${CPUN[P.cpu]}</b>コンピューター。${P.first==='you'?'<b>あなたが先</b>':'<b>コンピューターが先</b>'}。箱が相手より多ければクリア。`;
}
const futureBest=()=>{const B=B0,rem=B.boxes.length-doneN(B,S.m);if(rem===0)return 0;const v=f(B,S.m);return (rem+(S.turn==='me'?v:-v))/2;};
const small=()=>und(B0,S.m).length<=16||B0.L<=17;
function idea(){
  const B=B0,c=caps(B,S.m);
  if(c.length&&P.lv>=4)return '3本かこまれた箱は取れます。でも、<b>全部取らずに最後の2個を相手にわたす</b>（わざとゆずる）と、相手は次の列を開けなければならず、もっと多く取れることもあります。';
  if(c.length)return '3本の線でかこまれた箱（黄色）は、あと1本で取れます。取ったら、もう1回引けます。';
  if(safes(B,S.m).length)return '箱の<b>3本目の線</b>を引くと、相手に取られてしまいます。まだ2本以下の箱だけにふれる線を引こう。';
  return 'どこに引いても箱をあげてしまう形です。<b>あげる箱がいちばん少ない所</b>（短い列）から開けよう。';
}
function explain(){
  if(P.kind==='end'){
    if(P.greedy<P.t&&P.dd)return `目標の${P.t}個を取れました！ ここでは、取れる箱を全部取ってしまうと${P.greedy}個しか取れません。<b>最後の2個をわざと相手にわたす</b>と、相手はそのあと次の列を開けるしかなく、長い列をあなたが取れます。`;
    if(P.greedy<P.t)return `目標の${P.t}個を取れました！ ここでは、「取れる箱は全部取り、開けるときは短い列から」というやり方だけでは${P.greedy}個しか取れません。<b>どの列をいつ相手にわたすか</b>を、相手の次の手まで考えて決めるのがポイントでした。`;
    return `目標の${P.t}個を取れました！ 取れる箱は取り、開けるしかないときは、<b>いちばん短い列から</b>開けるのがコツです。`;}
  let s=`${S.me}対${S.you}であなたの勝ち！ `;
  if(P.cpu==='weak'||P.cpu==='greedy')s+='箱の3本目の線を引かないようにすると、相手に箱をあげずにすみます。';
  else if(P.cpu==='perfect')s+=`この盤は、${P.first==='you'?'先に打つ人':'あとから打つ人'}が正しく打てば必ず勝てる形です。最後は、長い列（くさり）をどちらが開けるかで勝負が決まります。`;
  else s+='3本目を引かない線がなくなったら、長い列（くさり）の取り合いです。相手に列をわたされたら、全部取らずに最後の2個をゆずる作戦で、主導権をにぎれます。';
  return s;
}
function draw(){
  const myTurn=S.turn==='me'&&!S.over&&!S.done;
  app.innerHTML=`${topBar()}
    <p class="qq" style="font-size:16px">${qline()}</p>
    <div class="jscore"><span class="jo">あなた ○ <b>${S.me}</b></span><span class="note">${P.kind==='end'?'目標 '+P.t+'個':'のこり '+(B0.boxes.length-S.me-S.you)+'個'}</span><span class="jx"><b>${S.you}</b> × 相手</span></div>
    <div class="boardw">${boardSVG()}</div>
    <p class="msg ${S.msgc}" id="msg">${S.msg||(S.done?'':myTurn?(S.moved?'箱を取った！ もう1回引けます。':'あなたの番です。線を引こう。'):S.over?'':'コンピューターが考えています…')}</p>
    ${S.over&&!S.done?`<div class="row"><button class="btn go" id="retry">もう一度</button></div>`:''}
    ${S.hint&&!S.done&&!S.over?`<p class="hintbox">${idea()}${S.rec>=0?'<br>黄色の線がおすすめです。':''}</p>`:''}
    ${S.done?'':`<div class="row"><button class="btn" id="hint" ${myTurn?'':'disabled'}>ヒント</button><button class="btn" id="restart">はじめから</button></div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(`<p style="margin:0">${explain()}</p>`);return;}
  document.querySelectorAll('#bd [data-l]').forEach(e=>e.addEventListener('click',()=>tap(+e.dataset.l)));
  const h=document.getElementById('hint');if(h)h.onclick=()=>{S.hints++;S.hint=1;S.msg='';const B=B0,m=S.m;
    if(small()){const ex=exactMoves(B,m);S.rec=ex[0];}
    else{const c=caps(B,m),s=safes(B,m);if(c.length)S.rec=c[0];else if(s.length)S.rec=s[Math.floor(Math.random()*s.length)];else{const u=und(B,m),cost=u.map(l=>greedyTake(B,m|bit(l)));S.rec=u[cost.indexOf(Math.min(...cost))];}}
    draw();};
  document.getElementById('restart').onclick=()=>{if(S.m!==P.m0)S.hints++;reset();draw();if(S.turn==='cpu')cpuSoon();};
  const rt=document.getElementById('retry');if(rt)rt.onclick=()=>{S.hints++;reset();draw();if(S.turn==='cpu')cpuSoon();};
}
function apply(l,who){
  const B=B0,k=gain(B,S.m,l);
  for(const bi of B.lb[l])if(B.boxes[bi].every(x=>x===l||has(S.m,x)))S.own[bi]=who;
  S.m|=bit(l);S.by[l]=who;S.last=l;
  if(who==='me')S.me+=k;else S.you+=k;
  if(!k)S.turn=who==='me'?'cpu':'me';
  S.moved=k>0&&who==='me';
  if(S.m===B.full){
    const ok=P.kind==='end'?S.me>=P.t:S.me>S.you;
    if(ok)S.done=true;else{S.over='lose';S.msg=P.kind==='end'?`${S.me}個でした。目標の${P.t}個にとどきませんでした。`:S.me===S.you?`${S.me}対${S.you}の引き分け。相手より多く取ろう。`:`${S.me}対${S.you}であなたの負け…`;S.msgc='ng';}
    return;}
  if(P.kind==='end'&&S.me+futureBest()<P.t){S.over='lose';S.msg=`このままでは、相手がミスしないと目標の${P.t}個にとどきません。もう一度考えよう。`;S.msgc='ng';}
}
function tap(l){
  if(S.done||S.over||S.turn!=='me'||has(S.m,l))return;
  S.rec=-1;S.hint=0;S.msg='';apply(l,'me');draw();if(S.turn==='cpu'&&!S.over&&!S.done)cpuSoon();
}
function cpuSoon(){const p=P,s=S;setTimeout(()=>{if(P!==p||S!==s||S.over||S.done||S.turn!=='cpu')return;
  const kind=P.kind==='end'?'perfect':P.cpu;const l=policy(B0,S.m,kind,P.kind==='end'?0:P.sd);
  apply(l,'cpu');draw();if(S.turn==='cpu'&&!S.over&&!S.done)cpuSoon();},520);}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
