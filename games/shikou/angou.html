<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>暗号解読</h1>
    <p class="lead">ひみつの暗号を、ルールにしたがって元にもどそう。五十音表でずらす暗号、たぬき暗号、数字の暗号まで。5つのレベルから1問ずつ。ヒントやまちがいなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=false;
let QS=[{"id":"1-01","lv":1,"kind":"shift","mode":"pick","N":1,"code":["ふ","ら","さ"],"a":"ひよこ","ds":["たいこ","きのこ","へりし"],"rule":"五十音表で、どの字も\u003cb>1つうしろ\u003c/b>の字に ずらしてあります（あ→い、い→う、お→か）。\u003cb>1つ前\u003c/b>にもどして読もう。"},{"id":"2-01","lv":2,"kind":"shift","mode":"pick","N":2,"code":["す","こ","る","す","え","つ","り"],"a":"さくらさいたよ","ds":["さくらきれいね","さくらさくころ","うめもさいたよ"],"rule":"五十音表で、どの字も\u003cb>2つうしろ\u003c/b>の字に ずらしてあります。\u003cb>2つ前\u003c/b>にもどして読もう。（「ん」の次は「あ」にもどります）"},{"id":"3-01","lv":3,"kind":"drop","mode":"pick","ks":["た"],"rev":false,"code":["た","お","に","た","ぎ","た","り","お","い","し","い"],"a":"おにぎりおいしい","ds":["おにぎりたべたい","おむすびおいしい","おにぎりつくろう"],"rule":"\u003cb>たぬき\u003c/b>の暗号です。「た」をぬいて読もう。"},{"id":"4-01","lv":4,"kind":"num","mode":"pad","code":["45","75","41゛","42"],"a":"ともだち","rule":"十の位が\u003cb>行\u003c/b>（あ行1・か行2…わ行0）、一の位が\u003cb>段\u003c/b>（1〜5）です。あ＝11、か＝21、こ＝25。や行は や＝81・ゆ＝83・よ＝85、\u003cb>わ行は わ＝01・を＝02・ん＝03\u003c/b>（下の表の0の行）。「゛」がついていたら、にごる字です（21゛＝が）。"},{"id":"5-01","lv":5,"kind":"key","mode":"pad","kw":"さくら","ktab":["さ","く","ら","あ","い","う","え","お","か","き","け","こ","し","す","せ","そ","た","ち","つ","て","と","な","に","ぬ","ね","の","は","ひ","ふ","へ","ほ","ま","み","む","め","も","や","ゆ","よ","り","る","れ","ろ","わ","を","ん"],"part":false,"code":["そ","う","よ","の","え","ね","こ","そ","な","さ","る"],"a":"たからはきのしたにある","rule":"かぎのことば「\u003cb>さくら\u003c/b>」で作った表です。表の\u003cb>はじめに「さくら」\u003c/b>の字を入れ、のこりのマスには、まだ使っていない字を\u003cb>五十音の順\u003c/b>に入れました。暗号の字を下の表で見つけ、\u003cb>同じ場所\u003c/b>にある五十音表の字に直そう。"}];
const ID='angou';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>暗号解読 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* 暗号解読：p={kind:'shift'|'drop'|'num'|'key', mode:'pick'|'pad', code:[暗号の字や数], a:答え, ds:[まちがいの答え3つ], rule:ルールの文, N, ks, rev, kw, ktab:[かぎの表46字], part:表の半分をかくす} */
const HINTWORD='ヒントやまちがい';
const LVD={1:'1つずらす暗号（ことば）',2:'いくつかずらす暗号（みじかい文）',3:'たぬき暗号・〇ぬき暗号',4:'数字の暗号（あ＝11）',5:'かぎのことばの表の暗号'};
const RULES=`<ol class="rules">
  <li>暗号（ひみつの文）を、<b>ルール</b>にしたがって元にもどそう。ルールは問題ごとに書いてあります。</li>
  <li><b>ずらす暗号</b>：五十音表の中で、字を前やうしろにずらしてあります。表を左から右へ、上の行から下の行へ数えます（空いているマスはとばす）。この表では、わ行に「わ・を・ん」をならべています（…ろ→わ→を→ん→あ… の順）。</li>
  <li><b>たぬき暗号</b>：「た」をぬいて読みます。ほかの字をぬく暗号もあります。</li>
  <li><b>数字の暗号</b>：十の位が行、一の位が段。あ＝11、い＝12、か＝21です。わ行は0で、<b>わ＝01・を＝02・ん＝03</b>（この表だけの決まり）。や行は や＝81・ゆ＝83・よ＝85です。</li>
  <li>レベル1〜3は4つの中からえらびます。レベル4・5は、下の表の字をタップして答えを1字ずつ入れます。</li></ol>`;
const ROWS=['あいうえお','かきくけこ','さしすせそ','たちつてと','なにぬねの','はひふへほ','まみむめも','や・ゆ・よ','らりるれろ','わをん・・'];
const GOJU=ROWS.join('').replace(/・/g,'');
const DAK={};'かきくけこさしすせそたちつてとはひふへほ'.split('').forEach((c,i)=>{DAK[c]='がぎぐげござじずぜぞだぢづでどばびぶべぼ'[i];});
const UNDAK={};for(const k in DAK)UNDAK[DAK[k]]=k;
function startStage(p){P=p;S={hints:0,done:false,msg:'',msgc:'',wrong:[],hint:false,inp:p.code.map(()=>''),cur:0,last:-1,bad:{},full:!p.part};
  if(p.mode==='pick')S.opts=shuffle([p.a,...p.ds]);begin(p);draw();}
function codeHTML(){
  if(P.mode==='pick')return `<div class="ag-code">${P.code.map(t=>`<span class="ag-c">${esc(t)}</span>`).join('')}</div>`;
  return `<div class="ag-code">${P.code.map((t,i)=>`<button class="ag-col ${i===S.cur&&!S.done?'cur':''} ${S.bad[i]?'bad':''}" data-i="${i}"><span class="ag-t ${t.length>1?'num':''}">${esc(t.replace('゛',''))}${t.endsWith('゛')?'<span class="ag-dk">゛</span>':''}</span><span class="ag-in">${esc(S.inp[i]||'')}</span></button>`).join('')}</div>`;
}
/* 表：kind に合わせて、ふつうの五十音表・かぎの表・入力パッドをかく */
function table(opt){
  const lab=opt.labels;let o=`<div class="ag-tb ${opt.pad?'pad':''} ${lab?'lab':''}">`;
  if(lab)o+=`<span class="ag-h">行＼段</span>${[1,2,3,4,5].map(k=>`<span class="ag-h">${k}</span>`).join('')}`;
  ROWS.forEach((row,ri)=>{
    if(lab)o+=`<span class="ag-h">${(ri+1)%10}<small>${row[0]}行</small></span>`;
    [...row].forEach((ch,ci)=>{
      if(ch==='・'){o+='<span class="ag-x"></span>';return;}
      let show=ch;
      if(opt.key){const gi=GOJU.indexOf(ch),kn=[...new Set(P.kw)].length;show=(S.full||gi<kn||ci===0)?P.ktab[gi]:'';
        o+=`<button class="ag-k ag-km ${gi<kn?'kw':''} ${S.mark===ch?'mk':''}" data-m="${ch}" aria-label="かぎの表のマス">${show||'<i>？</i>'}</button>`;return;}
      if(opt.pad)o+=`<button class="ag-p ${S.mark===ch?'mk':''}" data-k="${ch}">${ch}</button>`;
      else o+=`<span class="ag-k">${ch}</span>`;});
  });
  return o+'</div>';
}
function qtext(){return `<p class="ag-rule">${P.rule}</p>`;}
function hintText(){
  if(P.kind==='shift')return `はじめの字「${P.code[0]}」を表で見つけて、${Math.abs(P.N)}つ${P.N>0?'前':'うしろ'}へもどると「${P.a[0]}」。のこりの字も同じようにしよう。`;
  if(P.kind==='drop')return `${P.rev?'さかさまに読むので、さいごの字から読みます。':''}「${P.ks.join('」「')}」を指でかくしながら読むと、はじめは「${P.a.slice(0,3)}」です。`;
  return '';
}
function explain(){
  if(P.kind==='shift')return `「${P.code.join('')}」を${Math.abs(P.N)}つ${P.N>0?'前':'うしろ'}へもどすと「<b>${P.a}</b>」。`;
  if(P.kind==='drop')return `「${P.ks.join('」「')}」をぬくと${P.rev?'「'+[...P.a].reverse().join('')+'」、さかさまに読んで':''}「<b>${P.a}</b>」。`;
  if(P.kind==='num')return `<span class="ag-ex">${P.code.map((t,i)=>`<span>${t}<b>${P.a[i]}</b></span>`).join('')}</span>`;
  return `答えは「<b>${P.a}</b>」。かぎの表：<span class="ag-ex">${P.code.map((t,i)=>`<span>${t}<b>${P.a[i]}</b></span>`).join('')}</span>`;
}
function draw(){
  const pick=P.mode==='pick';
  app.innerHTML=`${topBar()}
    <div class="label">暗号</div>
    ${codeHTML()}
    ${qtext()}
    ${pick?`${P.kind==='shift'?`<details class="ag-ref" open><summary>五十音表</summary>${table({})}</details>`:''}
      <p class="qq">元の${P.lv===1?'ことば':'文'}は どれ？</p>
      <div class="opts4 txt ${Math.max(...S.opts.map(o=>o.length))>5?'ag-one':''}">${S.opts.map((o,i)=>`<button class="ob ${S.done&&o===P.a?'right':''} ${S.wrong.includes(i)?'wrong':''}" data-i="${i}" ${S.done||S.wrong.includes(i)?'disabled':''}><span class="k">${'アイウエ'[i]}</span><b class="ag-o">${esc(o)}</b></button>`).join('')}</div>
      ${S.hint&&!S.done?`<p class="hintbox">${hintText()}</p>`:''}
      ${S.done?'':`<p class="msg ${S.msgc||''}" id="msg">${S.msg||''}</p><div class="row"><button class="btn" id="hint" ${S.hint?'disabled':''}>ヒント</button></div>`}`
    :`${P.kind==='key'?`<div class="label">かぎ「${P.kw}」の表（暗号の字をさがしてタップ）</div>${table({key:true})}<div class="label">五十音表（同じ場所の字をタップ）</div>`:`<div class="label">五十音表（タップして答えを入れる）</div>`}
      ${S.done?'':`${table({pad:true,labels:P.kind==='num'})}
      <div class="row ag-keys"><button class="btn" id="dak">゛をつける</button><button class="btn" id="bs">1字けす</button></div>
      <p class="msg ${S.msgc||''}" id="msg">${S.msg||`むらさきのわくの暗号を とこう。（${S.cur+1}字目）`}</p>
      <div class="row"><button class="btn" id="hint">ヒント（1字）</button><button class="btn" id="reset">全部けす</button></div>`}`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(`<p style="margin:0">${explain()}</p>`);return;}
  if(pick){
    app.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(S.opts[i]===P.a){S.done=true;draw();}else{S.wrong.push(i);S.hints++;S.msg=P.kind==='drop'?`ちがいます。「${P.ks.join('」「')}」を指でかくしながら、1字ずつ もう一度読んでみよう。`:'ちがいます。暗号の字を1つずつ、もう一度もどしてみよう。';S.msgc='ng';draw();}});
    document.getElementById('hint').onclick=()=>{S.hint=true;S.hints++;S.msg='';draw();};
    return;
  }
  app.querySelectorAll('.ag-col').forEach(b=>b.onclick=()=>{S.cur=+b.dataset.i;S.msg='';S.msgc='';draw();});
  app.querySelectorAll('.ag-p').forEach(b=>b.onclick=()=>typeK(b.dataset.k));
  app.querySelectorAll('.ag-km').forEach(b=>b.onclick=()=>{S.mark=S.mark===b.dataset.m?null:b.dataset.m;S.msg=S.mark?'下の五十音表の、同じ場所のマスに 印をつけました。':'';S.msgc='';draw();});
  document.getElementById('dak').onclick=()=>{const i=S.last>=0?S.last:S.cur-1;const ch=S.inp[i];
    if(!ch){S.msg='先に字を入れてから、゛をつけよう。';S.msgc='';draw();return;}
    if(DAK[ch])S.inp[i]=DAK[ch];else if(UNDAK[ch])S.inp[i]=UNDAK[ch];else{S.msg=`「${ch}」には ゛はつけられません。`;S.msgc='';draw();return;}
    delete S.bad[i];S.msg='';S.msgc='';check();};
  document.getElementById('bs').onclick=()=>{let i=S.inp[S.cur]?S.cur:S.cur-1;if(i<0)return;S.inp[i]='';delete S.bad[i];S.cur=i;S.last=-1;S.msg='';draw();};
  document.getElementById('hint').onclick=hint;
  document.getElementById('reset').onclick=()=>{S.inp=P.code.map(()=>'');S.cur=0;S.last=-1;S.bad={};S.msg='';draw();};
}
function typeK(k){
  S.mark=null;const i=S.cur;if(i>=P.code.length)return;
  S.inp[i]=k;delete S.bad[i];S.last=i;
  let j=i+1;while(j<P.code.length&&S.inp[j])j++;
  S.cur=j<P.code.length?j:Math.min(i+1,P.code.length-1);
  S.msg='';S.msgc='';check();
}
function check(){
  if(S.inp.some(x=>!x)){draw();return;}
  if(S.inp.join('')===P.a){S.done=true;draw();return;}
  S.hints++;S.bad={};S.inp.forEach((x,i)=>{if(x!==P.a[i])S.bad[i]=1;});
  S.msg=`全部入ったけど、赤いところがちがいます（${Object.keys(S.bad).length}字）。もう一度たしかめよう。`;S.msgc='ng';draw();
}
function hint(){
  S.hints++;
  if(!S.full){S.full=true;S.msg=`ヒント：かぎの表をぜんぶ見せました。「${P.kw}」のあとは、使っていない字が五十音の順にならんでいます（ヒント ${S.hints}回）。`;S.msgc='';draw();return;}
  const i=S.inp.findIndex((x,k)=>x!==P.a[k]);if(i<0)return;
  S.inp[i]=P.a[i];delete S.bad[i];S.last=i;
  S.msg=P.kind==='num'?`ヒント：${P.code[i]} は「${P.a[i]}」（ヒント ${S.hints}回）。`:`ヒント：「${P.code[i]}」は「${P.a[i]}」（ヒント ${S.hints}回）。`;S.msgc='';
  let j=S.inp.findIndex((x,k)=>x!==P.a[k]&&!x);S.cur=j<0?i:j;
  if(S.inp.every(x=>x)){if(S.inp.join('')===P.a){S.done=true;}}
  draw();
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
