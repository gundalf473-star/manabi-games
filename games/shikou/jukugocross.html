<title>じゅくごクロス</title>
<meta name="game:subject" content="思考力">
<meta name="game:unit" content="ことば遊び">
<meta name="game:grade" content="小3〜">
<meta name="game:players" content="1〜4人">

*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.7;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 76px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

.lead{margin:4px 0 0;color:var(--muted);font-size:14px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
rt{font-size:.55em;letter-spacing:0}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.label{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.1em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--rule);border-radius:10px;padding:10px 16px;min-height:44px;font-weight:700;cursor:pointer;background:var(--pick);color:var(--fg)}
.btn.go{background:var(--accent);border-color:var(--accent);color:#fff}

.btn:disabled{opacity:.45;cursor:default}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--rule);background:var(--surface);border-radius:99px;padding:8px 14px;min-height:42px;font-weight:700;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#1a0e0a}

.note{font-size:13px;color:var(--muted);margin:0}
.seat{display:grid;grid-template-columns:14px 1fr;gap:6px 8px;align-items:center;border:1px solid var(--rule);border-radius:10px;padding:8px 10px}
.seat .dot{width:14px;height:14px;border-radius:50%}

.seat .ctl{grid-column:2;display:flex;gap:6px;align-items:center}
.rec{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.rec b{font-size:20px;color:var(--ink)}

.scores{display:flex;gap:6px;flex-wrap:wrap}
.sc{flex:1 1 0;min-width:72px;border:2px solid var(--rule);border-radius:10px;padding:4px 8px;background:var(--surface);line-height:1.25;position:relative}
.sc.on{border-color:var(--pc);box-shadow:0 0 0 2px var(--pc) inset}
.sc .nm{font-size:12px;font-weight:700;color:var(--pc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.sc .pt{font-size:22px;font-weight:700}
.sc .pt small{font-size:11px;color:var(--muted);font-weight:400;margin-left:2px}
.sc .sub{display:block;font-size:11px;color:var(--muted)}
.info{display:flex;justify-content:space-between;align-items:center;gap:4px 8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools .btn{min-height:36px;padding:4px 10px;font-size:13px}
.msg{min-height:46px;border-radius:10px;padding:8px 12px;background:var(--accentsoft);font-size:14px;line-height:1.6}
.msg.ng{background:var(--ngsoft);color:var(--fg)}
.msg.ok{background:var(--oksoft)}
.msg .say{min-height:32px;min-width:36px;font-size:15px;vertical-align:middle;margin-left:4px}
.boardwrap{width:100%;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:10px}

.cell{aspect-ratio:1;border:0;background:var(--cell);padding:0;margin:0;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;min-width:0;border-radius:3px;font-family:var(--tilefont);font-weight:700;color:var(--tileink);line-height:1}
.cell.mid{background:var(--center)}
.cell.t{background:var(--tile);box-shadow:inset 0 -3px 0 var(--oc,var(--tileedge));font-size:var(--fs,16px)}
.cell.t.pend{box-shadow:inset 0 0 0 2px var(--accent),inset 0 -3px 0 var(--accent);cursor:pointer}
.cell.t.pend.new{animation:pop .18s ease-out}
.cell.t.cpu{animation:pop .22s ease-out}
.cell.t.sel{outline:3px solid var(--gold);outline-offset:-3px}
.cell.hint{outline:3px dashed var(--gold);outline-offset:-3px;color:var(--gold);font-size:var(--fs,16px)}
.cell.last{box-shadow:inset 0 -3px 0 var(--oc,var(--tileedge)),inset 0 0 0 2px var(--oc)}

.rank{display:flex;flex-direction:column;gap:6px}
.rk{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;border:1px solid var(--rule);border-left:6px solid var(--pc);border-radius:10px;padding:8px 10px;background:var(--surface)}

.rk .s{font-size:24px;font-weight:700}
.rk .d{font-size:12px;color:var(--muted)}
.wlist{display:flex;flex-direction:column;gap:2px}
.wl{display:grid;grid-template-columns:minmax(4.6em,auto) 1fr auto;align-items:center;gap:2px 8px;border-bottom:1px solid var(--rule);padding:5px 0}

.wl .say{min-height:36px;min-width:40px;font-size:16px}
details.pw{border:1px solid var(--rule);border-left:6px solid var(--pc);border-radius:10px;padding:8px 12px;background:var(--surface)}

.kset{display:flex;flex-wrap:wrap;gap:4px}
.kset span{font-family:var(--tilefont);font-weight:700;font-size:18px;width:32px;height:34px;display:inline-flex;align-items:center;justify-content:center;background:var(--tile);color:var(--tileink);border:1px solid var(--tileedge);border-radius:6px}

/* 低学年：大きめのボタンと文字 */
body.big{font-size:17px}
body.big .btn{min-height:52px;font-size:17px}
body.big .acts .btn{font-size:16px}
body.big .tl{width:min(50px,calc((100vw - 32px - 14px - 35px) / 8));height:60px;font-size:27px}

@media (min-width:700px){.tl{width:52px;height:58px;font-size:28px} .tl .ty{font-size:10px}}
</style>

<script>

// ふりがな： 低学年のページはルビ、それ以外は漢字だけ
const H = (s) => esc(s).replace(RB, (m, a, b, r) => KANA ? '<ruby>' + (a || b) + '<rt>' + r + '</rt></ruby>' : (a || b));

// 熟語の表示：低学年はルビ、それ以外は漢字（よみは別に出す）

// 1字の漢字のよみ（低学年のページだけ）
const YOMI = DATA.yomi || null;
const yomiOf = (ch) => (YOMI && YOMI[ch]) || '';
const tileYomi = (ch) => { const y = yomiOf(ch); return y ? y.split('・')[0] : ''; };

/* ---------- 音声（よみの読み上げ） ---------- */
const TTS = (() => { try { return 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined'; } catch (e) { return false; } })();
let jaVoice = null;
function pickVoice() { try { const vs = speechSynthesis.getVoices() || []; jaVoice = vs.find((v) => v.lang === 'ja-JP') || vs.find((v) => /^ja/i.test(v.lang)) || null; } catch (e) {} }
if (TTS) { pickVoice(); try { speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {} }
function speak(y) {
  if (!TTS || !y) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(y); u.lang = 'ja-JP'; u.rate = 0.9; if (jaVoice) u.voice = jaVoice; speechSynthesis.speak(u); } catch (e) {}
}
const sayBtn = (w, y) => TTS ? `<button type="button" class="say" data-say="${esc(y)}" aria-label="${esc(w)}（${esc(y)}）の読《よ》みを聞《き》く">🔊</button>`.replace(RB, (m, a, b) => a || b) : '';
document.addEventListener('click', (ev) => { const b = ev.target.closest('[data-say]'); if (b) { ev.preventDefault(); ev.stopPropagation(); speak(b.getAttribute('data-say')); } }, true);

const themeOK = (L) => E.themeCounts(DATA, L).map((n) => n >= 60);
function fixTheme() { if (S.theme >= 0 && !themeOK(S.level)[S.theme]) S.theme = -1; }

const handFor = (L) => (L === 3 ? 9 : 8);
const kanjiFor = (L) => (L === 3 ? 34 : 40);
const capFor = (n) => (n >= 4 ? 20 : n === 3 ? 24 : 30);
const bagFor = (n) => 72 + 12 * n;

function renderSetup() {
  fixTheme();
  const rec = store.get(REC_KEY, null) || {};
  const ok = themeOK(S.level);
  const levelBtns = CFG.levels.map((L) => `<button type="button" data-lv="${L}" aria-pressed="${S.level === L}">${H(LEVELS[L])}</button>`).join('');
  const themeBtns = [`<button type="button" data-th="-1" aria-pressed="${S.theme < 0}">すべて</button>`]
    .concat(THEMES.map((t, i) => ok[i] ? `<button type="button" data-th="${i}" aria-pressed="${S.theme === i}">${H(t)}</button>` : '')).join('');
  const nTheme = ok.filter(Boolean).length;
  const seats = S.seats.map((s, i) => `<div class="seat" style="--pc:${PCOL[i]}"><span class="dot" style="background:${PCOL[i]}"></span>
      <input type="text" maxlength="12" value="${esc(s.name)}" data-name="${i}" aria-label="${i + 1}${P('人目《にんめ》の名前《なまえ》')}">
      <span class="ctl"><select data-kind="${i}" aria-label="${i + 1}${P('人目《にんめ》は人《ひと》かコンピューターか')}"><option value="human"${s.kind === 'human' ? ' selected' : ''}>${KANA ? 'ひと' : '人'}</option>
        <option value="cpu:weak"${s.kind === 'cpu' && s.cpu === 'weak' ? ' selected' : ''}>コンピューター（よわい）</option>
        <option value="cpu:normal"${s.kind === 'cpu' && s.cpu === 'normal' ? ' selected' : ''}>コンピューター（ふつう）</option>

  app.innerHTML = `

    <h1><small>${H(CFG.kicker)}</small>じゅくごクロス</h1>

    <p class="note">${nH === 0 ? H('人《ひと》が｜1人《ひとり》もいません。｜1人《ひとり》は「人《ひと》」にしてね。') : nH >= 2 ? H('人《ひと》が｜2人《ふたり》以上《いじょう》のときは、番《ばん》がかわるたびに「つぎは○○さん」の画面《がめん》が出《で》ます。手《て》もとのタイルを見《み》せないように、交代《こうたい》してね。') : H('コンピューターの強《つよ》さは よわい・ふつう・つよい からえらべます。')}</p>
  </section>
  <section class="box">
    <div class="label">${H('熟語《じゅくご》のレベル')}</div>
    <div class="seg" id="levels">${levelBtns}</div>

  <p class="note">${HB('タイルの漢字《かんじ》は、毎回《まいかい》 熟語《じゅくご》を作《つく》りやすい組《く》み合《あ》わせで40種類《しゅるい》（四字熟語《よじじゅくご》のレベルは34種類《しゅるい》）えらばれます。よく使《つか》う漢字《かんじ》ほど、ふくろに多《おお》く入《はい》っています。')}</p>

function showRules() {

let ovEl = null;

}

/* ---------- ゲーム ---------- */
let G = null;
function startGame() {
  const dict = E.buildDict(DATA, { level: S.level, theme: S.theme });
  if (dict.list.length < 40) { alert(P('熟語《じゅくご》が少《すく》なすぎます。テーマを「すべて」にしてください。')); return; }
  const players = S.seats.map((s, i) => ({ name: (s.name || '').trim() || (s.kind === 'cpu' ? 'コンピューター' : 'プレイヤー' + (i + 1)), kind: s.kind, cpu: s.cpu, color: PCOL[i] }));
  const n = players.length;
  const st = E.newGame({ dict, rule: S.rule, bonus: S.bonus, N: CFG.N, handSize: handFor(S.level), kanjiCount: kanjiFor(S.level), bagSize: bagFor(n), roundCap: capFor(n), players });
  G = { st, pend: [], sel: null, mode: 'place', swapSel: [], hint: null, busy: false, msg: '', msgCls: '', zoom: false, last: [], cpuShow: [], look: -1 };
  G.humans = players.filter((p) => p.kind === 'human').length;
  track('level_start', { level_name: ID + '-' + LVKEY[S.level] + '-' + S.rule + (S.theme >= 0 ? '-t' + S.theme : '') });
  const e0 = dict.get(st.startWord);
  setMsg(`${H('はじめの熟語《じゅくご》は')}${WQ(e0)}${sayBtn(e0.w, e0.y)}<br>${esc(e0.m)}`, '');
  beginTurn();
}
function setMsg(html, cls) { G.msg = html; G.msgCls = cls || ''; const m = document.getElementById('msg'); if (m) { m.innerHTML = html; m.className = 'msg ' + (cls || ''); } }
const curP = () => G.st.players[G.st.turn];

function beginTurn() {
  const st = G.st;
  G.pend = []; G.sel = null; G.mode = 'place'; G.swapSel = []; G.hint = null; G.look = -1;
  const p = curP();
  if (p.kind === 'cpu') { renderGame(); cpuTurn(); return; }
  if (G.humans >= 2) {
    renderGame(true);
    overlay(`<div class="cover" style="--pc:${p.color};display:flex;flex-direction:column;gap:10px;align-items:center">
      <p class="note">${H(`ラウンド ${st.round} / ${st.roundCap}`)}</p>
      <div class="big">${H('つぎは')} ${esc(p.name)} ${H('さん')}</div>
      <p class="note">${H('ほかの人《ひと》は、画面《がめん》を見《み》ないでね。')}</p>
      ${G.lastNote ? `<p class="msg" style="width:100%">${G.lastNote}</p>` : ''}
      <button type="button" class="btn go" data-close style="min-width:12em">${H('はじめる')}</button></div>`, { cls: 'cover', onclose: () => { renderGame(); } });

}

function scoresHtml() {
  const st = G.st;
  return st.players.map((p, i) => `<div class="sc ${i === st.turn && !st.over ? 'on' : ''}" style="--pc:${p.color}"><span class="nm">${i === st.turn && !st.over ? '▶ ' : ''}${esc(p.name)}</span>
    <span class="pt">${p.score}<small>${H('点《てん》')}</small></span><span class="sub">${H('手《て》もと')} ${p.hand.length}${H('枚《まい》')}${p.kind === 'cpu' ? '・' + CPU_LV[p.cpu] : ''}</span></div>`).join('');
}
function tileBtn(ch, i, p, pressed) {
  const y = KANA ? tileYomi(ch) : '';
  return `<button type="button" class="tl" data-hi="${i}" style="--pcol:${p.color}" aria-pressed="${pressed}" aria-label="${P('タイル')} ${esc(ch)}${y ? '（' + esc(yomiOf(ch)) + '）' : ''}">${esc(ch)}${y ? `<span class="ty${y.length > 4 ? ' long' : ''}" aria-hidden="true">${esc(y)}</span>` : ''}</button>`;
}
function renderGame(hidden) {
  const st = G.st, p = curP(), N = st.N, human = p.kind === 'human';
  const pk = new Map(G.pend.map((t) => [t.r * N + t.c, t]));
  const hk = new Map(G.hint ? G.hint.tiles.map((t) => [t.r * N + t.c, t]) : []);
  const ck = new Map(G.cpuShow.map((t) => [t.r * N + t.c, t]));
  const lastK = new Set(G.last);
  const mid = Math.floor(N / 2);
  let cells = '';
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const k = r * N + c, b = st.board[r][c], pd = pk.get(k), h = hk.get(k), cp = ck.get(k);
    const lbl = `${r + 1}${P('行《ぎょう》')}${c + 1}${P('列《れつ》')}`;
    if (b) {
      const oc = b.o >= 0 ? st.players[b.o].color : 'var(--pstart)';
      cells += `<button type="button" class="cell t${lastK.has(k) ? ' last' : ''}${G.look === k ? ' sel' : ''}" style="--oc:${oc}" data-look="${k}" aria-label="${lbl} ${esc(b.ch)}（${P('タップで熟語《じゅくご》を見《み》る')}）">${esc(b.ch)}</button>`;
    } else if (pd) cells += `<button type="button" class="cell t pend${pd.n ? ' new' : ''}" style="--oc:${p.color}" data-cell="${k}" aria-label="${lbl} ${esc(pd.ch)}（${P('タップでもどす')}）">${esc(pd.ch)}</button>`;
    else if (cp) cells += `<div class="cell t cpu" style="--oc:${p.color}" aria-label="${lbl} ${esc(cp.ch)}">${esc(cp.ch)}</div>`;
    else cells += `<button type="button" class="cell${r === mid && c === mid ? ' mid' : ''}${h ? ' hint' : ''}" data-cell="${k}" aria-label="${lbl}${h ? ' ' + P('ヒント') + ' ' + esc(h.ch) : ' ' + P('あき')}">${h ? esc(h.ch) : ''}</button>`;
  }
  G.pend.forEach((t) => { t.n = false; });
  const used = new Set(G.pend.map((t) => t.hi));
  let rack = '';
  if (hidden) rack = p.hand.map(() => `<span class="tl back">?</span>`).join('');
  else if (!human) rack = p.hand.map(() => `<span class="tl back" aria-hidden="true">?</span>`).join('') + `<span class="note" style="width:100%;text-align:center">${esc(p.name)} ${H('の番《ばん》です')}</span>`;
  else rack = p.hand.map((ch, i) => used.has(i) ? '' : tileBtn(ch, i, p, G.mode === 'swap' ? G.swapSel.includes(i) : G.sel === i)).join('') || `<span class="note">${H('ぜんぶ置《お》いたよ。「決定《けってい》」をおしてね')}</span>`;
  const dis = !human || G.busy || hidden ? 'disabled' : '';
  let acts;
  if (G.mode === 'swap') {
    acts = `<button type="button" class="btn go wide" id="doswap" ${dis} ${G.swapSel.length ? '' : 'disabled'}>${H(`この${G.swapSel.length}枚《まい》を交換《こうかん》する`)}</button>
      <button type="button" class="btn wide" id="cancelswap" ${dis}>${H('交換《こうかん》をやめる')}</button>`;
  } else {
    acts = `<button type="button" class="btn go wide" id="ok" ${dis} ${G.pend.length ? '' : 'disabled'}>${H('決定《けってい》')}</button>
      <button type="button" class="btn" id="undo" ${dis} ${G.pend.length ? '' : 'disabled'}>${H('もどす')}</button>
      <button type="button" class="btn" id="hint" ${dis}>${H('ヒント')}<small style="font-weight:400">（−1）</small></button>
      <button type="button" class="btn" id="mix" ${dis}>${H('まぜる')}</button>
      <button type="button" class="btn" id="pass" ${dis}>${H('パス')}<small style="font-weight:400">${st.bag.length ? H('（＋1枚《まい》）') : ''}</small></button>
      <button type="button" class="btn" id="swap" ${dis} ${st.bag.length ? '' : 'disabled'}>${H('交換《こうかん》')}</button>
      ${G.hint ? `<button type="button" class="btn" id="usehint" ${dis}>${H('ヒントどおり置《お》く')}</button>` : '<span></span>'}`;
  }
  const lvName = H(LEVELS[S.level]) + (S.theme >= 0 ? '・' + H(THEMES[S.theme]) : '') + '・' + (st.rule === 'easy' ? H('簡単《かんたん》') : H('上級《じょうきゅう》'));
  app.innerHTML = `
  <div class="scores" aria-live="polite">${scoresHtml()}</div>
  <div class="info"><span>${lvName}・${H('ふくろ')} ${st.bag.length}${H('枚《まい》')}・${H('ラウンド')} ${st.round}/${st.roundCap}</span>
    <span class="tools"><button type="button" class="btn sm" id="zoom">${G.zoom ? H('ばんを戻《もど》す') : H('ばんを大《おお》きく')}</button><button type="button" class="btn sm" id="kanjibtn">${H('漢字《かんじ》')}</button><button type="button" class="btn sm" id="rulesbtn">${H('あそびかた')}</button><button type="button" class="btn sm" id="quit">${H('やめる')}</button></span></div>
  <div id="msg" class="msg ${G.msgCls}" aria-live="polite">${G.msg}</div>
  <div class="boardwrap${G.zoom ? ' zoom' : ''}" id="bw"><div class="board" id="board" style="--n:${N};grid-template-columns:repeat(${N},1fr)">${cells}</div></div>
  <div class="rack" id="rack">${rack}</div>
  <div class="acts">${acts}</div>`;
  fitFont();

}
function fitFont() {
  const b = document.getElementById('board'); if (!b) return;
  const w = b.getBoundingClientRect().width / G.st.N;
  b.style.setProperty('--fs', Math.max(11, Math.round(w * 0.62)) + 'px');
}
addEventListener('resize', () => { if (G && document.getElementById('board')) fitFont(); });

/* ばんの漢字をタップしたとき：その漢字をふくむ熟語を見せる */
function lookAt(k) {
  const st = G.st, N = st.N, r = Math.floor(k / N), c = k % N;
  const seqs = E.boardSequences(st).filter((s) => s.d === 'H' ? (s.r === r && c >= s.c && c < s.c + s.w.length) : (s.c === c && r >= s.r && r < s.r + s.w.length));
  const es = seqs.map((s) => st.dict.get(s.w) || (st.full && st.full.get(s.w))).filter(Boolean);
  G.look = k;
  if (!es.length) { setMsg(H(`「${st.board[r][c].ch}」`), ''); renderGame(); return; }
  setMsg(es.map((e) => `${WQ(e)}${sayBtn(e.w, e.y)}<br>${esc(e.m)}`).join('<br>'), '');
  renderGame();
}
function showKanji() {
  const st = G.st;
  const ks = st.kanji.slice().sort((a, b) => (st.dict.deg.get(b) || 0) - (st.dict.deg.get(a) || 0));
  overlay(`<h2>${H('このゲームの漢字《かんじ》')}</h2><p class="note">${H(`今回《こんかい》 ふくろに入《はい》っている漢字《かんじ》（${ks.length}種類《しゅるい》）です。左《ひだり》ほど、熟語《じゅくご》をたくさん作《つく》れる漢字《かんじ》です。`)}</p>
    <div class="kset">${ks.map((c) => `<span${KANA && yomiOf(c) ? ` title="${esc(yomiOf(c))}"` : ''}>${esc(c)}</span>`).join('')}</div>
    <button type="button" class="btn go" data-close>${H('とじる')}</button>`);
}

function bindGame() {
  const st = G.st, p = curP();
  const q = (id) => document.getElementById(id);
  q('zoom').onclick = () => { G.zoom = !G.zoom; renderGame(); };
  q('rulesbtn').onclick = showRules;
  q('kanjibtn').onclick = showKanji;
  q('quit').onclick = () => {
    overlay(`<h2>${H('ゲームをやめますか？')}</h2><p>${H('ここまでの結果《けっか》を見《み》て、おわりにします。')}</p>
      <div class="row"><button type="button" class="btn go" id="qyes">${H('やめて結果《けっか》を見《み》る')}</button><button type="button" class="btn" data-close>${H('つづける')}</button></div>`);
    document.getElementById('qyes').onclick = () => { closeOverlay(); st.over = true; st.reason = 'quit'; renderEnd(); };
  };
  const board = q('board');
  board.onclick = (ev) => {
    const lk = ev.target.closest('[data-look]'); if (lk) { lookAt(+lk.dataset.look); return; }
    if (p.kind !== 'human' || G.busy) return;
    const c = ev.target.closest('[data-cell]'); if (!c) return;
    const k = +c.dataset.cell, r = Math.floor(k / st.N), cc = k % st.N;
    tapCell(r, cc);
  };
  if (p.kind !== 'human' || G.busy) return;
  q('rack').onclick = (ev) => {
    const t = ev.target.closest('[data-hi]'); if (!t) return;
    if (G._dragged) { G._dragged = false; return; }
    const i = +t.dataset.hi;
    if (G.mode === 'swap') {
      const j = G.swapSel.indexOf(i);
      if (j >= 0) G.swapSel.splice(j, 1);
      else if (G.swapSel.length < Math.min(3, st.bag.length)) G.swapSel.push(i);
      else setMsg(H(`交換《こうかん》できるのは${Math.min(3, st.bag.length)}枚《まい》までです。`), 'ng');
      renderGame(); return;
    }
    G.sel = G.sel === i ? null : i;
    if (G.sel != null && !G.pend.length) {
      const y = yomiOf(p.hand[i]);
      setMsg(H(`「${p.hand[i]}」${y ? '（' + y + '）' : ''}をえらんだよ。置《お》きたいマスをタップしてね。`), '');
    }
    renderGame();
  };
  bindDrag();
  if (G.mode === 'swap') {
    q('doswap').onclick = doSwap;
    q('cancelswap').onclick = () => { G.mode = 'place'; G.swapSel = []; setMsg(H('交換《こうかん》をやめました。'), ''); renderGame(); };
    return;
  }
  q('ok').onclick = submit;
  q('undo').onclick = () => { G.pend = []; G.sel = null; setMsg(H('タイルを手《て》もとにもどしたよ。'), ''); renderGame(); };
  q('hint').onclick = doHint;
  q('mix').onclick = () => { if (G.pend.length) { G.pend = []; } G.sel = null; E.shuffle(p.hand, Math.random); renderGame(); };
  q('pass').onclick = doPass;
  q('swap').onclick = () => { G.pend = []; G.sel = null; G.mode = 'swap'; G.swapSel = []; setMsg(H(`交換《こうかん》するタイルを${Math.min(3, st.bag.length)}枚《まい》までえらんでね。`), ''); renderGame(); };
  if (q('usehint')) q('usehint').onclick = () => {
    const h = G.hint; G.pend = []; const usedI = new Set();
    for (const t of h.tiles) { const i = p.hand.findIndex((ch, j) => ch === t.ch && !usedI.has(j)); if (i < 0) return; usedI.add(i); G.pend.push({ r: t.r, c: t.c, ch: t.ch, hi: i }); }
    G.hint = null; setMsg(H('ヒントのとおりに置《お》いたよ。「決定《けってい》」をおしてね。'), ''); renderGame();
  };
}
function tapCell(r, c) {
  const st = G.st, p = curP();
  if (G.mode === 'swap') return;
  const pi = G.pend.findIndex((t) => t.r === r && t.c === c);
  if (pi >= 0) { G.pend.splice(pi, 1); renderGame(); return; }
  if (st.board[r][c]) return;
  if (G.sel == null) {
    const free = p.hand.map((_, i) => i).filter((i) => !G.pend.some((t) => t.hi === i));
    if (!free.length) return;
    setMsg(H('先《さき》に、下《した》のタイルを1枚《まい》えらんでね。'), ''); renderGame(); return;
  }
  G.pend.push({ r, c, ch: p.hand[G.sel], hi: G.sel, n: true });
  G.sel = null;
  renderGame();
}
/* パソコンのマウスでは、タイルをドラッグしてマスに置ける */
function bindDrag() {
  const rack = document.getElementById('rack');
  rack.querySelectorAll('[data-hi]').forEach((el) => {
    el.addEventListener('pointerdown', (ev) => {
      if (ev.pointerType !== 'mouse' || ev.button !== 0 || G.mode !== 'place') return;
      const i = +el.dataset.hi, sx = ev.clientX, sy = ev.clientY; let gh = null, over = null;
      const mv = (e) => {
        if (!gh && Math.hypot(e.clientX - sx, e.clientY - sy) < 6) return;
        if (!gh) { gh = el.cloneNode(true); gh.classList.add('ghost'); document.body.appendChild(gh); }
        gh.style.left = (e.clientX - 23) + 'px'; gh.style.top = (e.clientY - 25) + 'px';
        const t = document.elementFromPoint(e.clientX, e.clientY), c = t && t.closest && t.closest('.cell[data-cell]');
        if (over && over !== c) over.classList.remove('drop');
        over = c && !c.classList.contains('t') ? c : null; if (over) over.classList.add('drop');
      };
      const up = () => {
        removeEventListener('pointermove', mv); removeEventListener('pointerup', up);
        if (gh) { gh.remove(); G._dragged = true; setTimeout(() => { G._dragged = false; }, 0);
          if (over) { const k = +over.dataset.cell; G.sel = i; tapCell(Math.floor(k / G.st.N), k % G.st.N); } }
      };
      addEventListener('pointermove', mv); addEventListener('pointerup', up);
    });
  });
}

const ERR = {
  none: '下《した》のタイルをえらんで、ばんのマスに置《お》いてね。',
  out: 'そこには置《お》けないよ。', occupied: 'そこには置《お》けないよ。',

  gap: 'タイルとタイルの間《あいだ》があいているよ。つづけて置《お》いてね。',
  noBoardEasy: 'ばんの上《うえ》の漢字《かんじ》を1つ使《つか》って、交《まじ》わるように熟語《じゅくご》を作《つく》ってね。（はなれ置《お》きは、2字《じ》以上《いじょう》の熟語《じゅくご》だけ）',
  noBoardAdv: 'ばんの上《うえ》のタイルに、くっつけて置《お》いてね。（はなれ置《お》きは、2字《じ》以上《いじょう》の熟語《じゅくご》だけ）',
  islandNear: 'はなれ置《お》きのときは、ほかのタイルと ななめにも くっつかない場所《ばしょ》に置《お》いてね。',
  tooMany: '簡単《かんたん》ルールでは、ばんの漢字《かんじ》はちょうど1つだけ使《つか》うよ（熟語《じゅくご》の前《まえ》や後《うし》ろにつなげて長《なが》くするのもなし）。',
  hand: 'そのタイルは持《も》っていないよ。',
};
function submit() {
  const st = G.st, p = curP();
  const tiles = G.pend.map((t) => ({ r: t.r, c: t.c, ch: t.ch }));
  const res = E.place(st, tiles);
  if (!res.ok) {
    if (res.err === 'notWord') {
      G.pend = []; G.sel = null;
      setMsg(H(`${res.cross ? 'となりとくっついてできた' : ''}「${res.word}」は、このレベルの熟語《じゅくご》リストにないみたい。タイルを手《て》もとにもどしたよ。もう一度《いちど》やってみよう！`), 'ng');
    } else setMsg(H(ERR[res.err === 'noBoard' ? (st.rule === 'easy' ? 'noBoardEasy' : 'noBoardAdv') : res.err] || ERR.none), 'ng');
    renderGame(); return;
  }
  G.last = tiles.map((t) => t.r * st.N + t.c);
  G.pend = [];
  for (const w of res.words) track('answer_question', { correct: true, question: w.w });
  showWord(res, p, false, () => advance(`${esc(p.name)}：${WJ(res.main, res.words[0].entry.y)}（+${res.gain}${H('点《てん》')}）`));
}
function wordRows(res) {
  return res.words.map((w) => `<div class="wd ${!w.main ? 'small' : ''}"><span class="kj">${WJ(w.w, w.entry.y)}</span>${sayBtn(w.w, w.entry.y)}<span></span>${KANA ? '' : `<span class="yo">${esc(w.entry.y)}</span>`}<span class="jp">${esc(w.entry.m)}</span></div>`).join('');
}
function showWord(res, p, auto, cb) {
  const gainTxt = `+${res.gain}${H('点《てん》')}（${H('タイル')}${res.tilesUsed}${H('枚《まい》')}${res.bonus ? '＋' + H('ボーナス') + res.bonus : ''}${res.island ? '−' + H('はなれ置《お》き') + '1' : ''}）`;
  overlay(`<div style="--pc:${p.color}"><p class="note" style="color:${p.color};font-weight:700">${esc(p.name)}${res.island ? '　' + H('はなれ置《お》き') : ''}</p></div>
    ${wordRows(res)}
    <p class="gain">${gainTxt}</p>
    <button type="button" class="btn go" data-close>${auto ? H('つぎへ') : H('OK')}</button>`, { onclose: () => { clearTimeout(G._t); cb && cb(); } });
  if (!auto) speak(res.words[0].entry.y);
  if (auto) G._t = setTimeout(() => { if (ovEl) { closeOverlay(); cb && cb(); } }, 2600);
}
function info(html, cb, auto) {
  overlay(`${html}<button type="button" class="btn go" data-close>${H('OK')}</button>`, { onclose: () => { clearTimeout(G._t); cb && cb(); } });
  if (auto) G._t = setTimeout(() => { if (ovEl) { closeOverlay(); cb && cb(); } }, auto);
}
function hintText(m) {
  const e = G.st.dict.get(m.word);
  return H(m.island ? 'ヒント：ばんの漢字《かんじ》を使《つか》える場所《ばしょ》がないので、はなれ置《お》きで' : 'ヒント：') + WQ(e) + H('を、点線《てんせん》のマスに置《お》けるよ。');
}
function doHint() {
  const st = G.st;
  G.pend = []; G.sel = null;
  if (G.hint) { setMsg(hintText(G.hint), ''); renderGame(); return; }   // 同じ番に2回おしても、点数はへらさない
  const m = E.hint(st);
  if (!m) { setMsg(H('いまの手《て》もとでは、置《お》ける場所《ばしょ》が見《み》つからないよ。パスか交換《こうかん》をしよう（点数《てんすう》はへらないよ）。'), ''); renderGame(); return; }
  E.useHint(st);
  G.hint = m;
  setMsg(hintText(m) + H('（−1点《てん》）'), '');
  renderGame();
}
function doPass() {
  const st = G.st, p = curP();
  G.pend = []; G.sel = null;
  const full = st.bag.length && p.hand.length >= st.maxHand;
  const r = E.pass(st);
  const txt = r.drew ? H('パスして、タイルを1枚《まい》もらったよ。') : full ? H(`手《て》もとが${st.maxHand}枚《まい》でいっぱいなので、もらわずにパスしたよ。`) : H('ふくろが空《から》なので、そのままパスしたよ。');
  info(`<h2>${H('パス')}</h2><p>${txt}</p>`, () => advance(`${esc(p.name)}：${H('パス')}`));
}
function doSwap() {
  const st = G.st, p = curP();
  const r = E.swap(st, G.swapSel);
  G.mode = 'place'; G.swapSel = [];
  if (!r.ok) { setMsg(H('交換《こうかん》できませんでした。'), 'ng'); renderGame(); return; }
  info(`<h2>${H('交換《こうかん》')}</h2><p>${H(`${r.n}枚《まい》を交換《こうかん》したよ。`)}</p><p style="font-family:var(--tilefont);font-size:24px;font-weight:700">${r.out.map(esc).join(' ')} → ${r.got.map(esc).join(' ')}</p>`, () => advance(`${esc(p.name)}：${H('交換《こうかん》')} ${r.n}${H('枚《まい》')}`));
}
function advance(note) {
  const st = G.st;
  G.lastNote = note || '';
  if (st.over) { renderEnd(); return; }
  E.next(st);
  if (st.over) { renderEnd(); return; }
  setMsg(note || '', '');
  beginTurn();
}

/* ---------- コンピューターの番 ---------- */
function cpuTurn() {
  const st = G.st, p = curP();
  G.busy = true;
  setMsg(esc(p.name) + H(' が考《かんが》えています…'), '');
  renderGame();
  setTimeout(() => {
    const ch = E.cpuChoose(st, p.cpu);
    if (ch.type === 'place') {
      const tiles = ch.move.tiles.slice();
      let k = 0;
      const step = () => {
        if (k < tiles.length) { G.cpuShow.push(tiles[k++]); renderGame(); setTimeout(step, 280); return; }
        G.cpuShow = [];
        const res = E.place(st, tiles);
        G.busy = false;
        if (!res.ok) { advance(); return; }   // 念のため
        G.last = tiles.map((t) => t.r * st.N + t.c);
        renderGame();
        showWord(res, p, true, () => advance(`${esc(p.name)}：${WJ(res.main, res.words[0].entry.y)}（+${res.gain}${H('点《てん》')}）`));
      };
      step();
    } else if (ch.type === 'swap') {
      const r = E.swap(st, ch.idx);
      G.busy = false;
      info(`<p><b style="color:${p.color}">${esc(p.name)}</b> ${H(`は タイルを${r.n || 0}枚《まい》交換《こうかん》しました。`)}</p>`, () => advance(`${esc(p.name)}：${H('交換《こうかん》')}`), 1500);
    } else {
      const r = E.pass(st);
      G.busy = false;
      info(`<p><b style="color:${p.color}">${esc(p.name)}</b> ${r.drew ? H('は パスして、タイルを1枚《まい》もらいました。') : H('は パスしました。')}</p>`, () => advance(`${esc(p.name)}：${H('パス')}`), 1500);
    }
  }, 650);
}

/* ---------- おわり ---------- */
function renderEnd() {
  closeOverlay();
  const st = G.st;
  const R = E.ranking(st);
  const why = { out: 'タイルを使《つか》いきった人《ひと》がいたので、おわり！', pass: 'ふくろが空《から》で、全員《ぜんいん》がパスしたので、おわり！', cap: `${st.roundCap}ラウンドになったので、おわり！`, stall: '全員《ぜんいん》が2回《かい》つづけてパスしたので、おわり！', quit: 'ゲームをやめました。' }[st.reason] || 'おわり！';
  // 記録（この端末だけ）
  const humans = st.players.filter((p) => p.kind === 'human');
  const rec = store.get(REC_KEY, null) || {};
  const best = Math.max(rec.best || 0, ...humans.map((p) => p.score));
  const newBest = humans.some((p) => p.score > (rec.best || 0) && p.score > 0);
  const nw = humans.reduce((a, p) => a + p.words.length, 0);
  store.set(REC_KEY, { best, words: (rec.words || 0) + nw, games: (rec.games || 0) + 1, last: new Date().toISOString().slice(0, 10) });
  track('level_end', { level_name: ID + '-' + LVKEY[S.level] + '-' + st.rule + (S.theme >= 0 ? '-t' + S.theme : ''), success: true });
  const top = R.filter((x) => x.rank === 1).map((x) => esc(x.p.name));
  const rows = R.map((x) => `<div class="rk" style="--pc:${x.p.color}"><span class="n">${x.rank}</span><span><b>${esc(x.p.name)}</b>${x.p.kind === 'cpu' ? `<span class="d">（${CPU_LV[x.p.cpu]}）</span>` : ''}<br>
      <span class="d">${H('タイル')} ${x.p.tiles}${H('枚《まい》')}・${H('ボーナス')} ${x.p.bonus}・${H('ヒント')} ${x.p.hints}${H('回《かい》')}・${H('熟語《じゅくご》')} ${x.p.words.length}</span></span><span class="s">${x.p.score}<small style="font-size:12px">${H('点《てん》')}</small></span></div>`).join('');
  const lists = st.players.map((p) => {
    const seen = new Set(), ws = p.words.filter((w) => !seen.has(w.w) && seen.add(w.w));
    return `<details class="pw" style="--pc:${p.color}" ${p.kind === 'human' || st.players.every((q) => q.kind === 'cpu') ? 'open' : ''}><summary>${esc(p.name)}（${ws.length}${H('語《ご》')}）</summary>
      <div class="wlist">${ws.length ? ws.map((w) => `<div class="wl"><span class="kj">${WJ(w.w, w.y)}${KANA ? '' : `<small>${esc(w.y)}</small>`}</span><span class="jp">${esc(w.m)}</span>${sayBtn(w.w, w.y)}</div>`).join('') : `<p class="note">${H('まだ熟語《じゅくご》はありません。')}</p>`}</div></details>`;
  }).join('');
  app.innerHTML = `
  <header><h1><small>${H('結果《けっか》')}</small>${top.length > 1 ? H('同点《どうてん》で') + ' ' + top.join('・') + ' ' + H('の勝《か》ち！') : top[0] + ' ' + H('の勝《か》ち！')}</h1>
  <p class="lead">${H(why)}</p></header>
  ${newBest ? `<div class="msg ok">${H(`この端末《たんまつ》のベスト記録《きろく》（${best}点《てん》）！`)}</div>` : ''}
  <section class="rank">${rows}</section>
  <section class="box"><div class="label">${H('今日《きょう》つくった熟語《じゅくご》')}</div>${lists}
    <p class="note">${TTS ? H('🔊 をおすと、熟語《じゅくご》の読《よ》みが聞《き》けます。') : H('この端末《たんまつ》では、音声《おんせい》は使《つか》えません。')}</p></section>
  <div class="row"><button type="button" class="btn go" id="again" style="flex:1">${H('同《おな》じ設定《せってい》でもう一度《いちど》')}</button><button type="button" class="btn" id="tosetup">${H('設定《せってい》にもどる')}</button></div>`;
  document.getElementById('again').onclick = startGame;
  document.getElementById('tosetup').onclick = () => { G = null; renderSetup(); scrollTo(0, 0); };
  scrollTo(0, 0);
}

window.WCUI = { get G() { return G; }, S, startGame, renderSetup };
renderSetup();
})();
</script>
