<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>ひものからまり 100問</h1>
    <p class="lead">からまったひもの両はしを引っぱると、まっすぐになる？　それとも むすび目がのこる？　重なりの上・下をよく見て考えよう。5つのレベルに20問ずつ。ヒントやまちがいなしでクリアすると★3つ。</p>
  </header>

<script>
(function(){
const PAID=true;
let QS=[];
const ID='himo';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>ひものからまり 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* ひものからまり：p.kind='yn'（引っぱるとどうなる？）,'pick'（どのひも？）,'flip'（1か所だけ上下を入れかえる）
   ひも r={pts:[x,y,…], cr:[{x,y,a,b,top,n,s1,s2}], k:むすび目か, mv:ほどける手順(R1/R2)}
   答えは gen_himo.py でジョーンズ多項式（カウフマンのかっこ）とライデマイスター移動・3色ぬり分けで確かめてある。 */
const HINTWORD='ヒントやまちがい';
const LVD={1:'重なりが少ないひも',2:'3本から むすび目をさがす',3:'1か所入れかえてほどく',4:'1か所入れかえて むすぶ',5:'重なり4つの からまり'};
const RULES=`<ol class="rules">
  <li>ひもが重なっているところでは、<b>上を通るひもがつながって</b>見え、<b>下を通るひもは切れて</b>見えます。</li>
  <li>ひもの<b>両はしを持って引っぱる</b>と、まっすぐになる（ほどける）か、<b>むすび目</b>がのこるかを考えよう。</li>
  <li>「入れかえ」の問題では、重なりを<b>タップ</b>すると、そこの上と下が入れかわります。</li>
  <li>ひもを、はしから指でたどってみよう。<b>上・下・上・下…</b>と交互になっているかがポイントです。</li>
  <li>1つの重なりだけでできた小さな<b>ねじれのわっか</b>は、引っぱると消えます。</li>
  <li>ヒントを使ったり、まちがえたりすると、星がへります。</li></ol>`;
const HB='#fbfaf6';
function hSeq(r){
  const ev=[];r.cr.forEach((c,i)=>{ev.push([c.s1,i,0]);ev.push([c.s2,i,1]);});ev.sort((a,b)=>a[0]-b[0]);
  return ev.map(([s,i,k])=>r.cr[i].top===k?'上':'下');
}
/* ねじれのわっか：はしからたどって、同じ重なりを続けて2回通るところ */
function hKinks(r){
  const ev=[];r.cr.forEach((c,i)=>{ev.push([c.s1,i]);ev.push([c.s2,i]);});ev.sort((a,b)=>a[0]-b[0]);
  const k=[];for(let j=0;j+1<ev.length;j++)if(ev[j][1]===ev[j+1][1])k.push(ev[j][1]);return k;
}
/* ねじれのわっかをのぞいてたどった上・下 */
function hSeqCore(r){
  const K=hKinks(r),ev=[];r.cr.forEach((c,i)=>{if(K.includes(i))return;ev.push([c.s1,i,0]);ev.push([c.s2,i,1]);});ev.sort((a,b)=>a[0]-b[0]);
  return ev.map(([s,i,k])=>r.cr[i].top===k?'上':'下');
}
const hKinkText=r=>{const K=hKinks(r);return K.length?`<b>${K.map(i=>r.cr[i].n+'番').join('・')}</b>の重なりは、小さな<b>ねじれのわっか</b>です（引っぱると消えます）。それをのぞいてたどると「${hSeqCore(r).join('・')||'重なりなし'}」。`:'';};
function hPiece(r,c,k){
  /* 上を通るほうのひもを、交わりの前後だけかき直す（となりの交わりの手前まで） */
  const s=k===0?c.s1:c.s2,all=[];r.cr.forEach(d=>{all.push(d.s1,d.s2);});all.sort((a,b)=>a-b);
  const j=all.indexOf(s),prev=j>0?all[j-1]:-1e9,next=j<all.length-1?all[j+1]:1e9,n=r.pts.length/2;
  const i0=Math.max(0,Math.ceil(Math.max(s-4,(s+prev)/2))),i1=Math.min(n-1,Math.floor(Math.min(s+4,(s+next)/2)));
  const fl=Math.floor(s),fr=s-fl;
  /* 交わりの点そのものを入れて、ちょうど真ん中で切れないように */
  const pts=[];for(let i=i0;i<=i1;i++){pts.push(r.pts[2*i]+','+r.pts[2*i+1]);if(i===fl&&fr>0&&i<n-1){pts.push(c.x+','+c.y);}}
  return pts.join(' ');
}
function hRope(r,o){
  o=o||{};const pl=[];for(let i=0;i<r.pts.length;i+=2)pl.push(r.pts[i]+','+r.pts[i+1]);
  const P=pl.join(' '),n=r.pts.length;
  let s=`<polyline points="${P}" fill="none" stroke="#6b3f1d" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><polyline points="${P}" fill="none" stroke="#e3ad70" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`;
  r.cr.forEach((c,i)=>{const pc=hPiece(r,c,c.top);
    s+=`<polyline points="${pc}" fill="none" stroke="${HB}" stroke-width="24" stroke-linecap="butt" stroke-linejoin="round"/><polyline points="${pc}" fill="none" stroke="#6b3f1d" stroke-width="12" stroke-linecap="butt" stroke-linejoin="round"/><polyline points="${pc}" fill="none" stroke="#e3ad70" stroke-width="7" stroke-linecap="butt" stroke-linejoin="round"/>`;});
  /* はし（持つところ）と引っぱる矢印 */
  const ex=[[r.pts[0],r.pts[1],r.pts[2],r.pts[3]],[r.pts[n-2],r.pts[n-1],r.pts[n-4],r.pts[n-3]]];
  ex.forEach(([x,y,x2,y2])=>{const dx=x-x2,dy=y-y2,l=Math.hypot(dx,dy)||1,ux=dx/l,uy=dy/l;
    s+=`<circle cx="${x}" cy="${y}" r="6.5" fill="#7c3aed" stroke="#3b2f6b" stroke-width="1.5"/>`;
    if(o.arrows!==false){const ax=x+ux*12,ay=y+uy*12,bx=x+ux*26,by=y+uy*26;
      s+=`<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="#c8352d" stroke-width="3" stroke-linecap="round"/><polygon points="${bx+ux*6},${by+uy*6} ${bx-uy*5},${by+ux*5} ${bx+uy*5},${by-ux*5}" fill="#c8352d"/>`;}});
  if(o.nums)r.cr.forEach(c=>{s+=`<circle cx="${c.x+14}" cy="${c.y-14}" r="8" fill="#a97c12"/><text x="${c.x+14}" y="${c.y-10.5}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">${c.n}</text>`;});
  if(o.tap)r.cr.forEach((c,i)=>{const hl=S.flash===i;s+=`<circle data-c="${i}" cx="${c.x}" cy="${c.y}" r="17" fill="${hl?'rgba(124,58,237,.25)':'rgba(124,58,237,.08)'}" stroke="#7c3aed" stroke-width="${hl?2.5:1.2}" stroke-dasharray="${hl?'':'4 3'}" style="cursor:pointer"/>`;});
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(let i=0;i<n;i+=2){x0=Math.min(x0,r.pts[i]);x1=Math.max(x1,r.pts[i]);y0=Math.min(y0,r.pts[i+1]);y1=Math.max(y1,r.pts[i+1]);}
  const m=o.arrows===false?10:12,mx=o.arrows===false?10:36;x0-=mx;x1+=mx;y0-=m;y1+=m;
  return `<svg ${o.id?`id="${o.id}"`:''} viewBox="${x0} ${y0} ${x1-x0} ${y1-y0}" style="width:100%;max-width:${o.px||440}px;display:block" role="img" aria-label="ひも">${s}</svg>`;
}
function startStage(p){
  P=p;S={hints:0,done:false,msg:'',msgc:'',wrong:[],hint:false,flash:null,busy:false};
  if(p.kind==='flip'){S.r=JSON.parse(JSON.stringify(p.r));S.flip=null;}
  if(p.kind==='yn')S.opts=['U','K'];
  if(p.kind==='pick')S.opts=p.rs.map((_,i)=>i);
  begin(p);draw();
}
function qText(){
  const p=P;
  if(p.kind==='yn')return 'ひもの<b>両はし</b>を持って、矢印のほうへ引っぱると、どうなる？';
  if(p.kind==='pick')return p.ask==='K'?'両はしを引っぱったとき、<b>むすび目がのこる</b>ひもは どれ？（1本だけ）':'両はしを引っぱったとき、<b>まっすぐになる（ほどける）</b>ひもは どれ？（1本だけ）';
  return p.goal==='U'?'このひもは、引っぱるとむすび目がのこります。重なりを<b>1か所だけ</b>タップして上下を入れかえ、<b>ほどける</b>ひもにしよう。':'このひもは、引っぱるとほどけます。重なりを<b>1か所だけ</b>タップして上下を入れかえ、<b>むすび目ができる</b>ひもにしよう。';
}
const mvText=mv=>{
  if(!mv.length)return '重なりがないので、そのまままっすぐです。';
  const t=mv.map(m=>m==='R1'?'<b>ねじれのわっか</b>がくるっともどる（重なり1つ消える）':'<b>重なった2本</b>がすべってはずれる（重なり2つ消える）');
  return '引っぱると、'+t.join(' → ')+' → <b>まっすぐ</b>になります。';
};
const knotText=r=>`${hKinks(r).length?hKinkText(r)+'のこりの':`はしからたどると「${hSeq(r).join('・')}」。`}3つの重なりが上・下交互にからみ合った「<b>ひとつ結び</b>」の形なので、引っぱるとむすび目がきゅっとしまって<b>のこります</b>。`;
const ropeExplain=r=>r.k?knotText(r):`はしからたどると「${hSeq(r).join('・')||'重なりなし'}」。${mvText(r.mv)}`;
function hintText(){
  const p=P;
  if(p.kind==='pick')return 'それぞれのひもを左のはしから指でたどり、重なりで「上」か「下」かを言ってみよう。重なりが3つあって、<b>上・下・上・下・上・下</b>と交互になっていると、ひとつ結びのむすび目です。ねじれのわっか1つだけは、引っぱると消えます。';
  const r=p.kind==='flip'?S.r:p.r,K=hKinks(r);
  let t=`黄色い番号は、左のはしから進んだときに はじめて通る順番です。たどると「${hSeq(r).join('・')}」。`;
  if(K.length)t+=hKinkText(r);
  if(p.kind==='flip')t+=p.goal==='U'?(K.length?'のこりの3つの交互をくずしてみよう。ねじれのわっかを入れかえても、むすび目はのこるよ。':'交互になっているところをくずしてみよう。'):'上・下が<b>交互</b>になるようにしてみよう。';
  else if(r.cr.length<3)t+='むすび目ができるには、重なりが<b>少なくとも3つ</b>いります。';
  else t+='3つの重なりが交互にからむと、ひとつ結びです。';
  return t;
}
function optHTML(o,i){
  const p=P,right=S.done&&o===p.a,wr=S.wrong.includes(i),dis=S.done||wr?'disabled':'';
  if(p.kind==='yn'){
    const ic=o==='U'?`<svg viewBox="0 0 120 30" style="width:110px;height:28px"><line x1="8" y1="15" x2="112" y2="15" stroke="#6b3f1d" stroke-width="8" stroke-linecap="round"/><line x1="8" y1="15" x2="112" y2="15" stroke="#e3ad70" stroke-width="4" stroke-linecap="round"/></svg>`
      :`<svg viewBox="0 0 120 30" style="width:110px;height:28px"><path d="M8,18 C40,18 50,26 60,15 C66,6 52,4 54,15 C56,26 80,18 112,18" fill="none" stroke="#6b3f1d" stroke-width="8" stroke-linecap="round"/><path d="M8,18 C40,18 50,26 60,15 C66,6 52,4 54,15 C56,26 80,18 112,18" fill="none" stroke="#e3ad70" stroke-width="4" stroke-linecap="round"/></svg>`;
    return `<button class="ob ${right?'right':''} ${wr?'wrong':''}" data-i="${i}" ${dis}><span class="k">${'アイ'[i]}</span>${ic}<b style="font-size:16px">${o==='U'?'まっすぐになる（ほどける）':'むすび目がのこる'}</b></button>`;
  }
  return `<button class="ob hm-o ${right?'right':''} ${wr?'wrong':''}" data-i="${i}" ${dis}><span class="k">${'アイウエ'[i]}</span>${hRope(p.rs[o],{px:260,arrows:false,nums:S.hint})}</button>`;
}
function draw(){
  const p=P;
  let body='';
  if(p.kind==='yn')body=`<div class="boardw">${hRope(p.r,{nums:S.hint})}</div><div class="opts4 txt hm-yn">${S.opts.map(optHTML).join('')}</div>`;
  else if(p.kind==='pick')body=`<div class="opts4 txt hm-pick">${S.opts.map(optHTML).join('')}</div>`;
  else body=`<div class="boardw">${hRope(S.r,{tap:!S.done&&!S.busy,nums:S.hint,id:'bd'})}</div>`;
  app.innerHTML=`${topBar()}
    <p class="qq">${qText()}</p>
    ${body}
    ${S.hint&&!S.done?`<p class="hintbox">${hintText()}</p>`:''}
    ${S.done?'':`<p class="msg ${S.msgc}" id="msg">${S.msg||(p.kind==='flip'?'むらさきの丸（重なり）をタップしよう。':p.kind==='yn'?'2つの中からえらぼう。':'えらんでタップしよう。')}</p><div class="row"><button class="btn" id="hint" ${S.hint?'disabled':''}>ヒント</button></div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){
    let ex='';
    if(p.kind==='yn')ex=ropeExplain(p.r);
    else if(p.kind==='pick')ex=p.rs.map((r,i)=>`<li><b>${'アイウエ'[i]}</b>：${r.k?'むすび目がのこる。':'ほどける。'}${i===p.a?ropeExplain(r):''}</li>`).join('');
    else {const af=p.after[S.flip];ex=p.goal==='U'?`入れかえると「${hSeq(S.r).join('・')}」。${mvText(af.mv)}${p.ok.length<p.r.cr.length?`<br>（ほかに正しい場所：${p.ok.length>1?p.ok.filter(c=>c!==S.flip).map(c=>p.r.cr[c].n+'番').join('・'):'なし'}。ねじれのわっかを入れかえても、むすび目はのこります）`:''}`:knotText(S.r);}
    showClear(p.kind==='pick'?`<ul style="margin:0;padding-left:1.2em">${ex}</ul>`:`<p style="margin:0">${ex}</p>`);return;
  }
  document.getElementById('hint').onclick=()=>{S.hint=true;S.hints++;S.msg='';S.msgc='';draw();};
  if(p.kind==='flip'){
    const bd=document.getElementById('bd');
    bd.addEventListener('click',e=>{const t=e.target.closest('[data-c]');if(!t||S.busy)return;const c=+t.dataset.c;
      S.r.cr[c].top^=1;S.flash=c;
      if(p.ok.includes(c)){S.flip=c;S.done=true;S.flash=null;draw();return;}
      S.busy=true;S.hints++;S.msg=p.goal==='U'?'そこを入れかえても、まだむすび目がのこります。もとにもどすね。':'そこを入れかえても、まだほどけてしまいます。もとにもどすね。';S.msgc='ng';draw();
      const s0=S;setTimeout(()=>{if(S!==s0||P!==p)return;S.r.cr[c].top^=1;S.flash=null;S.busy=false;S.msg='';S.msgc='';draw();},1300);});
    return;
  }
  app.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,o=S.opts[i];
    if(o===p.a){S.done=true;}else{S.wrong.push(i);S.hints++;S.msg='ちがいます。ひもを はしからたどってみよう。';S.msgc='ng';}draw();});
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
