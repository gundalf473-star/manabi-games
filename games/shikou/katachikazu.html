(function(){

const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>形は何種類？ 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* 形は何種類？：p.kind = 'find'（盤で形を作って全種類さがす）| 'same'（見本と同じ形）| 'odd'（仲間はずれ）| 'count'（何種類？4択）
   p.t = 'sq'（正方形 [r,c]）| 'tri'（正三角形 [a,b,up]：格子点(a,b)→x=a+b/2）| 'cube'（立方体 [x,y,z]）
   回したり裏返したりして重なる形は、同じ形として1種類と数える。 */
const HINTWORD='ヒントやまちがい';
const LVD={1:'正方形3こ・三角形4こ／回すと同じ形',2:'正方形4こ・三角形5こ／裏返しもある',3:'ペントミノ12種／1マスちがいに注意',4:'ふたのない箱の展開図・三角形6こ・立方体4こ',5:'立方体の展開図11種・正方形6こ・7この形'};
const RULES=`<ol class="rules">
  <li>正方形（や正三角形）を、<b>辺と辺がぴったり重なるように</b>つなげて形を作ります。</li>
  <li>正方形や正三角形でできた<b>平らな形</b>は、<b>回したり、裏返したりして重なれば、同じ形</b>です。1種類と数えます（裏返すと鏡にうつした形になるので、鏡にうつした形も同じ形）。</li>
  <li>立方体をつなげた<b>立体</b>は、回したりひっくり返したりして重なれば、同じ形です。ただし、立体はどう動かしても<b>鏡にうつした形にはならない</b>ことがあります。そのような<b>鏡うつしの2つの立体は、べつの形</b>と数えます。</li>
  <li>「さがそう」の問題は、盤のマスをタップして形を作り、「この形を登録」をおそう。ちがう形を全部見つけたらクリア。</li>
  <li>「えらぼう」の問題は、4つの中から答えをえらぼう。まちがえたら、もう一度えらべます。</li></ol>`;
const KC=['#ef4444','#3b82f6','#f59e0b','#22c55e','#a855f7','#06b6d4','#ec4899','#84cc16','#f97316','#14b8a6','#6366f1','#a16207'];
const TH=Math.sqrt(3)/2;
/* ---- 形の正規化 ---- */
const nsq=cs=>{const mr=Math.min(...cs.map(x=>x[0])),mc=Math.min(...cs.map(x=>x[1]));return cs.map(([r,c])=>[r-mr,c-mc]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);};
const triV=([a,b,u])=>u?[[a,b],[a+1,b],[a,b+1]]:[[a+1,b],[a,b+1],[a+1,b+1]];
const fromV=vs=>{const a=Math.min(...vs.map(v=>v[0])),b=Math.min(...vs.map(v=>v[1]));return vs.some(v=>v[0]===a&&v[1]===b)?[a,b,1]:[a,b,0];};
const ntri=ts=>{const V=ts.flatMap(triV),ma=Math.min(...V.map(v=>v[0])),mb=Math.min(...V.map(v=>v[1]));
  return ts.map(t=>fromV(triV(t).map(([x,y])=>[x-ma,y-mb]))).sort((p,q)=>p[0]-q[0]||p[1]-q[1]||p[2]-q[2]);};
const K=cs=>cs.map(x=>x.join(',')).join(';');
function tfs(t,cs){ /* 全部の向き（はじめの4つ／6つが回すだけ） */
  const out=[];
  if(t==='sq'){let cur=cs.map(x=>x.slice());for(let m=0;m<2;m++){for(let k=0;k<4;k++){out.push(nsq(cur));cur=cur.map(([r,c])=>[c,-r]);}cur=cur.map(([r,c])=>[r,-c]);}}
  else{const vs=cs.map(triV);for(let m=0;m<2;m++){let cur=vs.map(v=>v.map(([a,b])=>m?[b,a]:[a,b]));for(let k=0;k<6;k++){out.push(ntri(cur.map(fromV)));cur=cur.map(v=>v.map(([a,b])=>[-b,a+b]));}}}
  return out;
}
const canon=(t,cs)=>tfs(t,cs).map(K).sort()[0];
const rotOnly=(t,a,b)=>{const kb=K(t==='sq'?nsq(b):ntri(b));return tfs(t,a).slice(0,t==='sq'?4:6).some(x=>K(x)===kb);};
const triNb=t=>{const vs=new Set(triV(t).map(v=>v.join(','))),out=[];
  for(let da=-1;da<=1;da++)for(let db=-1;db<=1;db++)for(const u of [0,1]){const c=[t[0]+da,t[1]+db,u];if(K([c])===K([t]))continue;
    if(triV(c).filter(v=>vs.has(v.join(','))).length===2)out.push(c);}return out;};
function isConn(t,cs){if(!cs.length)return false;const S0=new Set(cs.map(x=>x.join(','))),seen=new Set([cs[0].join(',')]),st=[cs[0]];
  while(st.length){const p=st.pop();const nb=t==='sq'?[[p[0]+1,p[1]],[p[0]-1,p[1]],[p[0],p[1]+1],[p[0],p[1]-1]]:triNb(p);
    nb.forEach(q=>{const k=q.join(',');if(S0.has(k)&&!seen.has(k)){seen.add(k);st.push(q);}});}return seen.size===cs.length;}
/* ---- 絵 ---- */
function bbox(t,cs){
  if(t==='sq')return {w:Math.max(...cs.map(x=>x[1]))+1,h:Math.max(...cs.map(x=>x[0]))+1,x0:Math.min(...cs.map(x=>x[1])),y0:Math.min(...cs.map(x=>x[0]))};
  const V=cs.flatMap(triV).map(([a,b])=>[a+b/2,b*TH]);const x0=Math.min(...V.map(v=>v[0])),y0=Math.min(...V.map(v=>v[1]));
  return {w:Math.max(...V.map(v=>v[0]))-x0,h:Math.max(...V.map(v=>v[1]))-y0,x0,y0};
}
function shapeSVG(t,cs,u,col,opt){
  opt=opt||{}; const b=bbox(t,cs),pad=3; let s='';
  if(t==='sq'){const w=b.w-b.x0,h=b.h-b.y0;
    cs.forEach(([r,c])=>{s+=`<rect x="${pad+(c-b.x0)*u}" y="${pad+(r-b.y0)*u}" width="${u}" height="${u}" fill="${col}" stroke="#2a2520" stroke-width="1.6" stroke-linejoin="round"/>`;});
    return `<svg viewBox="0 0 ${w*u+2*pad} ${h*u+2*pad}" width="${w*u+2*pad}" height="${h*u+2*pad}" ${opt.lab?`role="img" aria-label="${opt.lab}"`:'aria-hidden="true"'}>${s}</svg>`;}
  cs.forEach(tr=>{const pts=triV(tr).map(([a,c])=>`${(pad+(a+c/2-b.x0)*u).toFixed(1)},${(pad+(c*TH-b.y0)*u).toFixed(1)}`).join(' ');
    s+=`<polygon points="${pts}" fill="${col}" stroke="#2a2520" stroke-width="1.6" stroke-linejoin="round"/>`;});
  return `<svg viewBox="0 0 ${(b.w*u+2*pad).toFixed(1)} ${(b.h*u+2*pad).toFixed(1)}" width="${(b.w*u+2*pad).toFixed(0)}" height="${(b.h*u+2*pad).toFixed(0)}" ${opt.lab?`role="img" aria-label="${opt.lab}"`:'aria-hidden="true"'}>${s}</svg>`;
}
function cubeSVG(cs,a){ /* 立方体を組んだ形（ななめ上から） */
  a=a||16; const k=a*0.866,k2=a*0.5,P2=(x,y,z)=>[(x-y)*k,(x+y)*k2-z*a];
  const cubes=cs.slice().sort((A,B)=>(A[0]+A[1]+A[2])-(B[0]+B[1]+B[2])||A[2]-B[2]);

    s+=`<polygon points="${pp([[x,y,z+1],[x+1,y,z+1],[x+1,y+1,z+1],[x,y+1,z+1]])}" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="1.2" stroke-linejoin="round"/>`;});

const UNAME={sq:'正方形',tri:'正三角形',cube:'立方体'};

function boardSVG(){

  if(P.t==='sq'){const [Rn,Cn]=P.board,U=56,M=4;
    for(let r=0;r<Rn;r++)for(let c=0;c<Cn;c++){const on=sel.has(r+','+c);
      s+=`<rect class="hit" data-k="${r},${c}" x="${M+c*U+2}" y="${M+r*U+2}" width="${U-4}" height="${U-4}" rx="6" fill="${on?'#7c3aed':'#fffdf8'}" stroke="${on?'#3b2f6b':'#cfc5b3'}" stroke-width="2" style="cursor:pointer"/>`;}
    return `<svg id="bd" viewBox="0 0 ${Cn*U+2*M} ${Rn*U+2*M}" style="max-width:${Cn*U+2*M}px" role="img" aria-label="マスの盤">${s}</svg>`;}
  const U=64,M=6,V=P.cells.flatMap(triV).map(([a,b])=>[a+b/2,b*TH]),x0=Math.min(...V.map(v=>v[0])),W=Math.max(...V.map(v=>v[0]))-x0,H=Math.max(...V.map(v=>v[1]));
  P.cells.forEach(tr=>{const k=tr.join(','),on=sel.has(k),pts=triV(tr).map(([a,b])=>`${(M+(a+b/2-x0)*U).toFixed(1)},${(M+b*TH*U).toFixed(1)}`).join(' ');
    s+=`<polygon class="hit" data-k="${k}" points="${pts}" fill="${on?'#7c3aed':'#fffdf8'}" stroke="${on?'#3b2f6b':'#b8ad99'}" stroke-width="2" stroke-linejoin="round" style="cursor:pointer"/>`;});
  return `<svg id="bd" viewBox="0 0 ${(W*U+2*M).toFixed(0)} ${(H*U+2*M).toFixed(0)}" style="max-width:${(W*U+2*M).toFixed(0)}px" role="img" aria-label="三角形の盤">${s}</svg>`;
}
function foundHTML(){

function tapCell(k){

      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
