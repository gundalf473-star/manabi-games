<style>

:root[data-theme="dark"]{

.ccard,.pcard{border:2px solid #93c5fd;background:#eff6ff;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:#1e3a8a}

@media (max-width:420px){.boardw{margin:0 -10px;padding:4px}}
</style>

<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>計算ブロック</h1>
    <p class="lead">たて・横に1つずつ数を入れて、ブロックの計算を合わせよう。5つのレベルから1問ずつ。ヒントなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=false;
let QS=[{"id":"1-01","lv":1,"n":3,"cg":[[[[1,2]],"=",3],[[[2,1],[2,2]],"+",4],[[[0,0],[1,0]],"+",4],[[[0,1],[0,2],[1,1]],"+",5],[[[2,0]],"=",2]],"sol":[[3,1,2],[1,2,3],[2,3,1]]},{"id":"2-01","lv":2,"n":4,"cg":[[[[2,0],[3,0]],"-",3],[[[0,2],[0,3]],"+",5],[[[1,2],[1,3],[2,3]],"+",9],[[[2,2],[3,1],[3,2]],"+",7],[[[1,0],[1,1]],"+",3],[[[0,0],[0,1]],"-",1],[[[2,1]],"=",3],[[[3,3]],"=",3]],"sol":[[3,2,4,1],[2,1,3,4],[4,3,1,2],[1,4,2,3]]},{"id":"3-01","lv":3,"n":4,"cg":[[[[1,0],[2,0]],"+",4],[[[1,3],[2,3]],"-",2],[[[0,2],[0,3]],"/",2],[[[2,2],[3,2]],"*",12],[[[2,1]],"=",4],[[[3,3]],"=",3],[[[0,0],[0,1]],"*",12],[[[3,0],[3,1]],"/",2],[[[1,1],[1,2]],"-",1]],"sol":[[4,3,2,1],[3,2,1,4],[1,4,3,2],[2,1,4,3]]},{"id":"4-01","lv":4,"n":5,"cg":[[[[1,1],[2,1]],"+",6],[[[0,2],[0,3]],"/",2],[[[1,2],[2,2],[3,2]],"*",30],[[[4,2],[4,3]],"-",4],[[[0,0],[0,1]],"-",2],[[[2,4],[3,3],[3,4],[4,4]],"+",16],[[[3,0],[4,0]],"/",2],[[[1,0],[2,0]],"+",7],[[[0,4],[1,3],[1,4],[2,3]],"*",6],[[[3,1],[4,1]],"+",6]],"sol":[[5,3,4,2,1],[4,1,5,3,2],[3,5,2,1,4],[1,2,3,4,5],[2,4,1,5,3]]},{"id":"5-01","lv":5,"n":6,"cg":[[[[2,2],[2,3]],"-",1],[[[3,0],[4,0],[5,0]],"+",12],[[[1,5],[2,4],[2,5]],"*",24],[[[4,4],[4,5],[5,5]],"*",20],[[[4,1],[5,1],[5,2]],"*",12],[[[1,1],[2,1],[3,1]],"*",72],[[[0,3],[0,4],[0,5]],"*",18],[[[3,4],[3,5]],"+",8],[[[4,3],[5,3],[5,4]],"*",48],[[[0,0],[0,1],[1,0],[2,0]],"+",14],[[[3,2],[3,3]],"*",2],[[[4,2]],"=",3],[[[1,3],[1,4]],"+",8],[[[0,2],[1,2]],"/",4]],"sol":[[2,5,4,3,6,1],[6,4,1,5,3,2],[1,3,5,4,2,6],[4,6,2,1,5,3],[5,2,3,6,1,4],[3,1,6,2,4,5]]}];
const ID='keisanblock';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>計算ブロック 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* 計算ブロック：p={n, cg:[[[[r,c]…], 計算('+','-','*','/','='), 目標]], sol} */
const HINTWORD='ヒント';
const LVD={1:'3×3 ・ たし算',2:'4×4 ・ たし算・ひき算',3:'4×4 ・ ＋－×÷',4:'5×5 ・ ＋－×÷',5:'6×6 ・ ＋－×÷'};
const KU=60;
const KOP={'+':'＋','-':'－','*':'×','/':'÷','=':''};
const KTINT=['#fdf2d8','#e3f0fb','#e6f4e4','#f7e6f0','#efe9fb'];
let KOWN=null,KCOL=null;
function startStage(p){P=p;const n=p.n;
  KOWN=Array.from({length:n},()=>Array(n).fill(-1));p.cg.forEach((cg,i)=>cg[0].forEach(([r,c])=>{KOWN[r][c]=i;}));
  /* となりあうブロックが同じ色にならないように色をつける */
  KCOL=[];p.cg.forEach((cg,i)=>{const used=new Set();cg[0].forEach(([r,c])=>[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{const y=r+dr,x=c+dc;if(y>=0&&y<n&&x>=0&&x<n&&KOWN[y][x]!==i&&KCOL[KOWN[y][x]]!=null)used.add(KCOL[KOWN[y][x]]);}));
    let k=0;while(used.has(k))k++;KCOL[i]=k;});
  S={g:Array.from({length:n},()=>Array(n).fill(0)),lock:Array.from({length:n},()=>Array(n).fill(false)),sel:[0,0],hints:0,done:false,msg:'',msgc:'',chk:{}};begin(p);draw();}
function kCalc(op,v){if(op==='+')return v.reduce((a,b)=>a+b,0);if(op==='*')return v.reduce((a,b)=>a*b,1);
  if(op==='-')return Math.max(...v)-Math.min(...v);if(op==='/'){const a=Math.max(...v),b=Math.min(...v);return a%b?null:a/b;}return v[0];}
function kState(i){const [cs,op,t]=P.cg[i],v=cs.map(([r,c])=>S.g[r][c]);const full=v.every(x=>x);return {full,ok:full&&kCalc(op,v)===t};}
function kDup(r,c){const v=S.g[r][c];if(!v)return false;for(let k=0;k<P.n;k++){if(k!==c&&S.g[r][k]===v)return true;if(k!==r&&S.g[k][c]===v)return true;}return false;}
function kSolved(){const n=P.n;for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(!S.g[r][c]||kDup(r,c))return false;return P.cg.every((_,i)=>kState(i).ok);}
const kLabel=(op,t)=>op==='='?`${t}`:`${t}${KOP[op]}`;
function kBoard(){
  const n=P.n,U=KU,M=4;let s='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){const x=M+c*U,y=M+r*U,i=KOWN[r][c],v=S.g[r][c],sel=S.sel&&S.sel[0]===r&&S.sel[1]===c,dup=kDup(r,c),wr=S.chk[r+','+c];
    s+=`<rect x="${x}" y="${y}" width="${U}" height="${U}" fill="${wr?'#f8e3e1':S.lock[r][c]?'#ddd3f7':KTINT[KCOL[i]%5]}" stroke="#cfc7b8" stroke-width="1"/>`;
    if(v)s+=`<text x="${x+U/2}" y="${y+U*.78}" text-anchor="middle" font-size="${U*.5}" font-weight="700" fill="${dup||wr?'#c8352d':S.lock[r][c]?'#7c3aed':'#2a2520'}" font-family="sans-serif">${v}</text>`;
    if(wr)s+=`<line x1="${x+10}" y1="${y+U-6}" x2="${x+U-8}" y2="${y+18}" stroke="#c8352d" stroke-width="2" opacity=".5"/>`;
    if(sel)s+=`<rect x="${x+3}" y="${y+3}" width="${U-6}" height="${U-6}" rx="5" fill="none" stroke="#7c3aed" stroke-width="4"/>`;}
  /* ブロックの太いわく */
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){const x=M+c*U,y=M+r*U,i=KOWN[r][c];
    if(c+1<n&&KOWN[r][c+1]!==i)s+=`<line x1="${x+U}" y1="${y}" x2="${x+U}" y2="${y+U}" stroke="#2a2520" stroke-width="3.5" stroke-linecap="round"/>`;
    if(r+1<n&&KOWN[r+1][c]!==i)s+=`<line x1="${x}" y1="${y+U}" x2="${x+U}" y2="${y+U}" stroke="#2a2520" stroke-width="3.5" stroke-linecap="round"/>`;}
  s+=`<rect x="${M}" y="${M}" width="${n*U}" height="${n*U}" fill="none" stroke="#2a2520" stroke-width="4"/>`;
  P.cg.forEach(([cs,op,t],i)=>{const [r,c]=cs[0],x=M+c*U,y=M+r*U,st=kState(i),lb=kLabel(op,t);
    /* 5×5・6×6はスマホで小さく見えるので、左上の数を大きめにする */
    const big=n>=5,FS=big?19:16,col=st.full?(st.ok?'#1d7a4c':'#c8352d'):'#3b2f6b',w=String(t).length*(big?11:9.5)+(op==='='?0:(big?19:16))+(big?5:7);
    s+=`<rect x="${x+2}" y="${y+2}" width="${Math.min(w,U-3)}" height="${big?22:19}" rx="4" fill="${st.full?(st.ok?'#e0f0e6':'#f8e3e1'):'rgba(255,255,255,.75)'}"/>`;
    s+=`<text x="${x+4}" y="${y+(big?19:17)}" font-size="${FS}" font-weight="700" fill="${col}" font-family="sans-serif">${lb}</text>`;});
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)s+=`<rect class="hit" data-r="${r}" data-c="${c}" x="${M+c*U}" y="${M+r*U}" width="${U}" height="${U}" fill="transparent" style="cursor:pointer"/>`;
  const VW=n*U+2*M;
  return `<svg id="bd" viewBox="0 0 ${VW} ${VW}" style="max-width:${Math.min(VW,420)}px" role="img" aria-label="計算ブロックの盤">${s}</svg>`;
}
function kSelInfo(){
  if(!S.sel)return '';const i=KOWN[S.sel[0]][S.sel[1]],[cs,op,t]=P.cg[i];
  if(op==='=')return `このブロックは1マス。<b>${t}</b> が入ります。`;
  const w={'+':'の数をたすと','-':'で、大きい方から小さい方をひくと','*':'の数をかけると','/':'で、大きい方を小さい方でわると'}[op];
  return `このブロック（${cs.length}マス）${w} <b>${t}</b>`;
}
function draw(){
  const n=P.n;
  app.innerHTML=`${topBar()}
    <div class="boardw">${kBoard()}</div>
    ${S.done?'':`<p class="msg" style="text-align:center;color:var(--fg)">${kSelInfo()}</p>
    <div class="pad">${[...Array(n).keys()].map(i=>`<button data-v="${i+1}">${i+1}</button>`).join('')}<button data-v="0" class="er">消す</button></div>
    <p class="msg ${S.msgc||''}" id="msg">${S.msg||''}</p>
    <div class="row"><button class="btn" id="chk">まちがいチェック</button><button class="btn" id="hint">ヒント</button><button class="btn" id="reset">やりなおす</button></div>
    <p class="note">ブロックがうまると、左上の数が<b style="color:var(--ok)">緑</b>（合っている）か<b style="color:var(--ng)">赤</b>（合っていない）になります。同じ列・行に同じ数があると赤くなります。「まちがいチェック」はまちがっているマスに印をつけます（まちがいがあったときだけ星がへります）。「ヒント」は1マスの答えを入れます（星がへります）。</p>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(kExplain());return;}
  app.querySelectorAll('#bd .hit').forEach(h=>h.onclick=()=>{S.sel=[+h.dataset.r,+h.dataset.c];S.msg='';S.msgc='';draw();});
  app.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>put(+b.dataset.v));
  document.getElementById('hint').onclick=hint;
  document.getElementById('chk').onclick=check;
  document.getElementById('reset').onclick=()=>{S.g=S.g.map((row,r)=>row.map((v,c)=>S.lock[r][c]?v:0));S.chk={};S.msg='';draw();};
}
function put(v){
  if(!S.sel)return; const [r,c]=S.sel,n=P.n;
  if(S.lock[r][c]){S.msg='ヒントで入れたマスは変えられません。';S.msgc='';draw();return;}
  S.g[r][c]=v; delete S.chk[r+','+c]; S.msg=''; S.msgc='';
  if(v){for(let k=1;k<=n*n;k++){const i=(r*n+c+k)%(n*n),rr=Math.floor(i/n),cc=i%n;if(!S.g[rr][cc]){S.sel=[rr,cc];break;}}}
  if(S.g.every(row=>row.every(x=>x))){ if(kSolved())S.done=true; else {S.msg='全部うまりましたが、どこかちがいます。赤いところを見なおそう。';S.msgc='ng';} }
  draw();
}
function check(){
  S.chk={};let m=0,f=0;const n=P.n;
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(S.g[r][c]){f++;if(S.g[r][c]!==P.sol[r][c]){S.chk[r+','+c]=1;m++;}}
  if(!f){S.msg='まだ数字が入っていません。';S.msgc='';draw();return;}
  /* まちがいがないときは星をへらさない */
  if(m)S.hints++;
  S.msg=m?`まちがっているマスが ${m}つ あります（赤い印）。（ヒント ${S.hints}回）`:'今入っている数字は、全部合っています！（このチェックでは星はへりません）';S.msgc=m?'ng':'ok';draw();
}
function hint(){
  const n=P.n,cand=[];
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(S.g[r][c]!==P.sol[r][c])cand.push([r,c]);
  if(!cand.length)return;
  cand.sort((a,b)=>(S.g[b[0]][b[1]]?1:0)-(S.g[a[0]][a[1]]?1:0));
  const [r,c]=S.sel&&cand.some(x=>x[0]===S.sel[0]&&x[1]===S.sel[1])?S.sel:cand[0];
  S.g[r][c]=P.sol[r][c]; S.lock[r][c]=true; delete S.chk[r+','+c]; S.hints++;
  S.msg=`ヒント：1マス入れました（ヒント ${S.hints}回）。`; S.msgc='';
  if(kSolved())S.done=true; draw();
}
/* 2マスのブロックで、使える2つの数が1通りしかないものを解き方のポイントとして見せる */
function kExplain(){
  const n=P.n,pts=[];
  P.cg.forEach(([cs,op,t])=>{if(cs.length!==2||pts.length>=2)return;const pr=[];
    for(let a=1;a<=n;a++)for(let b=a+1;b<=n;b++)if(kCalc(op,[a,b])===t)pr.push([a,b]);
    if(pr.length===1){const [a,b]=pr[0];pts.push(`「${kLabel(op,t)}」の2マスは、1〜${n}では <b>${a}と${b}</b> しかない（${op==='+'?a+'＋'+b:op==='*'?a+'×'+b:op==='-'?b+'－'+a:b+'÷'+a}＝${t}）`);}});
  return `<p class="note" style="color:var(--fg)">${pts.length?'ポイント：'+pts.join('。<br>')+'。<br>数の組が1通りに決まるブロックから考え、たて・横に同じ数が入らないことを使うと早く解けます。':'1マスのブロックや、数の組が少ないブロックから考えると解きやすくなります。'}</p>`;
}
document.addEventListener('keydown',e=>{if(!S||S.done||!P||!P.cg||!document.getElementById('bd'))return;
  if(/^[1-9]$/.test(e.key)&&+e.key<=P.n)put(+e.key);else if(e.key==='Backspace'||e.key==='Delete'||e.key==='0')put(0);
  else{const d={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];if(d&&S.sel){e.preventDefault();S.sel=[(S.sel[0]+d[0]+P.n)%P.n,(S.sel[1]+d[1]+P.n)%P.n];draw();}}});
function kExample(){
  const U=50;let s='';
  [[2,1],[1,2]].forEach((row,r)=>row.forEach((v,c)=>{s+=`<rect x="${4+c*U}" y="${4+r*U}" width="${U}" height="${U}" fill="${c===0?'#fdf2d8':'#e3f0fb'}" stroke="#cfc7b8"/><text x="${4+c*U+U/2}" y="${4+r*U+U*.78}" text-anchor="middle" font-size="24" font-weight="700" fill="#2a2520" font-family="sans-serif">${v}</text>`;}));
  s+=`<line x1="${4+U}" y1="4" x2="${4+U}" y2="${4+2*U}" stroke="#2a2520" stroke-width="3.5"/><rect x="4" y="4" width="${2*U}" height="${2*U}" fill="none" stroke="#2a2520" stroke-width="4"/>`;
  s+=`<text x="8" y="20" font-size="14" font-weight="700" fill="#3b2f6b" font-family="sans-serif">3＋</text><text x="${8+U}" y="20" font-size="14" font-weight="700" fill="#3b2f6b" font-family="sans-serif">2×</text>`;
  s+=`<text x="${2*U+20}" y="${U*.75}" font-size="14" font-weight="700" fill="#3b2f6b" font-family="sans-serif">2＋1＝3</text><text x="${2*U+20}" y="${U*1.4}" font-size="14" font-weight="700" fill="#3b2f6b" font-family="sans-serif">1×2＝2</text>`;
  return `<svg viewBox="0 0 ${2*U+110} ${2*U+8}" style="width:100%;max-width:240px" aria-label="例：3＋のブロックは2と1、2×のブロックは1と2">${s}</svg>`;
}
const RULES=`<ol class="rules">
  <li>どの<b>たての列</b>にも<b>横の行</b>にも、数を<b>1つずつ</b>入れよう。3×3の盤なら <b>1・2・3</b>、4×4なら <b>1〜4</b> を使います。</li>
  <li>太いわくの<b>ブロック</b>の左上に、目標の数と計算が書いてあります。<b style="white-space:nowrap">「5＋」</b>は、ブロックの中の数を<b>たすと5</b>になるという意味です。<span style="white-space:nowrap">「6×」</span>なら<b>かけると6</b>です。</li>
  <li><b>ひき算（－）・わり算（÷）</b>は2マスのブロックだけで、大きい方から小さい方をひく・わります。数だけのブロックは1マスで、その数が入ります。</li>
  <li>同じ列・行でなければ、1つのブロックに同じ数が入ることもあります。</li>
  <li>マスをタップしてえらび、下の数字ボタンで入れよう。答えは1つに決まります。</li></ol>
  <div style="display:flex;justify-content:center">${kExample()}</div>`;

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
