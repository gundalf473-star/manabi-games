<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>鏡の時計 100問</h1>
    <p class="lead">鏡や水面にうつった時計、さかさまの時計を見て、本当の時刻を当てよう。5つのレベルに20問ずつ。ヒントやまちがいなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=true;
let QS=[];
const ID='kagamidokei';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>鏡の時計 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* 鏡の時計：kind='read'（うつった時計 img から本当の時刻 a）、'pick'（本当の時刻 t、うつった時計をえらぶ a=[面,短針,長針]）、
   'after'（鏡の時計から d 分後に鏡の中で見える時刻）、'dread'（デジタル時計）。tf='lr' 鏡（左右）・'ud' 水面（上下）・'rot' さかさま（180°） */
const HINTWORD='ヒントやまちがい';
const LVD={1:'鏡の時計・ちょうど○時',2:'鏡の時計・30分と15分',3:'水面の時計・さかさまの時計',4:'鏡・水面・さかさまのデジタル時計',5:'数字のない時計・時間がたつと'};
const RULES=`<ol class="rules">
  <li>時計の<b>横に立てた鏡</b>にうつると、右と左が反対に見えます。時計の<b>下にある池の水面</b>にうつると、上と下が反対に見えます。</li>
  <li><b>さかさま</b>は、時計を上下さかさまに（くるりと半回転）おいたときの見え方です。</li>
  <li>うつった時計を見て<b>本当の時刻</b>を、または本当の時計を見て<b>うつった時計</b>をえらぼう。数字の向きもヒントになります。</li>
  <li>4つの中から答えをえらぼう。まちがえても、もう一度えらべます。</li></ol>`;
const TFN={lr:'鏡にうつった',ud:'水面にうつった',rot:'さかさまにおいた',none:'ふつうの'};
const TFV={lr:'横に立てた鏡にうつす',ud:'下にある池の水面にうつす',rot:'上下さかさまに（くるりと半回転させて）おく'};
const tstr=t=>{const h=Math.floor(t/60)%12||12,m=t%60;return m?`${h}時${m}分`:`${h}時`;};
const dur=t=>{const h=Math.floor(t/60),m=t%60;return (h?h+'時間':'')+(m?m+'分':'')||'0分';};
const hands=t=>[(t*0.5)%360,(t%60)*6];
const tfa=(tf,a)=>tf==='lr'?(360-a)%360:tf==='ud'?(540-a)%360:tf==='rot'?(a+180)%360:a;
const imgOf=(tf,t)=>{const h=hands(t);return [tfa(tf,h[0]),tfa(tf,h[1])];};
const GT={lr:'scale(-1,1)',ud:'scale(1,-1)',rot:'rotate(180)',none:''};
let UID=0;
/* アナログ時計：面（数字・目もり）は tf で変換して描き、針は角度そのままで描く */
function clockSVG(tf,face,h,m,o){o=o||{};const mw=o.mw||220,id='k'+(UID++);let f='';
  f+=`<circle r="100" fill="#fff" stroke="#3b2f6b" stroke-width="5"/>`;
  for(let i=0;i<60;i++){const a=i*6*Math.PI/180,big=i%5===0,r1=big?84:90;
    f+=`<line x1="${(Math.sin(a)*r1).toFixed(2)}" y1="${(-Math.cos(a)*r1).toFixed(2)}" x2="${(Math.sin(a)*96).toFixed(2)}" y2="${(-Math.cos(a)*96).toFixed(2)}" stroke="${big?'#3b2f6b':'#b9ae9c'}" stroke-width="${big?3.5:1.5}"/>`;}
  if(face==='num')for(let n=1;n<=12;n++){const a=n*30*Math.PI/180;f+=`<text x="${(Math.sin(a)*70).toFixed(2)}" y="${(-Math.cos(a)*70+8).toFixed(2)}" text-anchor="middle" font-size="23" font-weight="700" fill="${n===12?'#c8352d':'#2a2520'}" font-family="sans-serif">${n}</text>`;}
  else f+=`<circle cx="0" cy="-72" r="8" fill="#c8352d"/>`;
  const hand=(a,L,w,c)=>{const r=a*Math.PI/180;return `<line x1="${(-Math.sin(r)*12).toFixed(2)}" y1="${(Math.cos(r)*12).toFixed(2)}" x2="${(Math.sin(r)*L).toFixed(2)}" y2="${(-Math.cos(r)*L).toFixed(2)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;};
  let bg='';
  if(tf==='lr')bg=`<rect x="-118" y="-118" width="236" height="236" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="3"/><path d="M-100,-60 L-60,-100 M-104,-30 L-30,-104" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".8"/>`;
  if(tf==='ud')bg=`<rect x="-118" y="-118" width="236" height="236" rx="14" fill="#cdeee9"/>${[-80,0,80].map(y=>`<path d="M-112,${y+104} q14,-8 28,0 t28,0 t28,0 t28,0 t28,0 t28,0 t28,0 t28,0" fill="none" stroke="#5eb8ac" stroke-width="3"/>`).join('')}`;
  return `<svg viewBox="-120 -120 240 240" style="width:100%;max-width:${mw}px" role="img" aria-label="${o.label||'時計'}">${bg}<g transform="${GT[tf]}">${f}</g>${hand(h,52,9,'#2a2520')}${hand(m,84,5,'#2563eb')}<circle r="7" fill="#2a2520"/></svg>`;}
/* デジタル時計（7つの棒）。本当の数字を描いて、まるごと tf で変換する */
const SEG={0:'abcdef',1:'bc',2:'abged',3:'abgcd',4:'fgbc',5:'afgcd',6:'afgedc',7:'abc',8:'abcdefg',9:'abcdfg'};
function digit(x,d){const W=40,H=76,T=8,y=12;
  const S={a:[x+T,y,W-2*T,T],d:[x+T,y+H-T,W-2*T,T],g:[x+T,y+H/2-T/2,W-2*T,T],f:[x,y+T,T,H/2-T*1.5],b:[x+W-T,y+T,T,H/2-T*1.5],e:[x,y+H/2+T/2,T,H/2-T*1.5],c:[x+W-T,y+H/2+T/2,T,H/2-T*1.5]};
  return Object.entries(S).map(([k,[a,b,w,h]])=>`<rect x="${a}" y="${b}" width="${w}" height="${h}" rx="3" fill="${d!=null&&SEG[d].includes(k)?'#ff5a4e':'#2c2522'}"/>`).join('');}
function digSVG(tf,t,o){o=o||{};const h=Math.floor(t/60)%12||12,m=t%60,ds=[h>=10?1:null,h%10,Math.floor(m/10),m%10],X=[18,70,134,186];
  let s=ds.map((d,i)=>digit(X[i],d)).join('')+`<circle cx="122" cy="34" r="5" fill="#ff5a4e"/><circle cx="122" cy="66" r="5" fill="#ff5a4e"/>`;
  const tr=tf==='lr'?'translate(244,0) scale(-1,1)':tf==='ud'?'translate(0,100) scale(1,-1)':tf==='rot'?'rotate(180,122,50)':'';
  let bg=`<rect x="0" y="0" width="244" height="100" rx="12" fill="#1f1a17"/>`;
  let fr=tf==='lr'?`<rect x="-10" y="-10" width="264" height="120" rx="16" fill="#dbeafe" stroke="#93c5fd" stroke-width="3"/>`:tf==='ud'?`<rect x="-10" y="-10" width="264" height="120" rx="16" fill="#cdeee9"/>`:'';
  const wave=tf==='ud'?`<path d="M-6,104 q11,-6 22,0 t22,0 t22,0 t22,0 t22,0 t22,0 t22,0 t22,0 t22,0 t22,0 t22,0 t22,0" fill="none" stroke="#5eb8ac" stroke-width="3"/>`:'';
  return `<svg viewBox="-12 -12 268 124" style="width:100%;max-width:${o.mw||300}px" role="img" aria-label="${o.label||'デジタル時計'}">${fr}${bg}<g transform="${tr}">${s}</g>${wave}</svg>`;}
function startStage(p){P=p;S={hints:0,done:false,msg:'',opts:shuffle([0,1,2,3]),wrong:[],hint:false};begin(p);draw();}
const all=()=>[P.a,...P.ds];
function figure(){
  if(P.kind==='pick'){const h=hands(P.t);return `<figure class="kd-fig">${clockSVG('none','num',h[0],h[1],{mw:200,label:'本当の時計'})}<figcaption>本当の時計</figcaption></figure>`;}
  if(P.kind==='dread')return `<figure class="kd-fig">${digSVG(P.tf,P.a,{label:TFN[P.tf]+'デジタル時計'})}<figcaption>${TFN[P.tf]}デジタル時計</figcaption></figure>`;
  return `<figure class="kd-fig">${clockSVG(P.tf,P.face,P.img[0],P.img[1],{label:TFN[P.tf]+'時計'})}<figcaption>${TFN[P.tf]}時計${P.face==='tick'?'（数字なし。<b style="color:#c8352d">赤い丸が12</b>のところ）':''}</figcaption></figure>`;}
function qtext(){
  const hm=P.step>=60?'何時':'何時何分';
  if(P.kind==='pick')return `本当の時刻は <b>${tstr(P.t)}</b> です。この時計を<b>${TFV[P.tf]}</b>と、どう見えますか。`;
  if(P.kind==='after')return `時計の横に立てた鏡にうつった時計が、上のように見えました。このときから <b>${P.d}分</b>たつと、<b>鏡の中の時計</b>は何時何分に見えますか。`;
  const w={lr:'時計の横に立てた鏡にうつった',ud:'時計の下にある池の水面にうつった',rot:'上下さかさまに（くるりと半回転させて）おいた'}[P.tf];
  return `${w}${P.kind==='dread'?'デジタル':''}時計が、上のように見えました。<b>本当の時刻</b>は${hm}ですか。`;}
function optInner(j){const o=all()[j];
  if(P.kind==='pick')return clockSVG(o[0],'num',o[1],o[2],{mw:130,label:'時計'});
  return `<b style="font-size:20px">${tstr(o)}</b>`;}
function hintText(){
  if(P.kind==='after')return '鏡の中では、時計の針が<b>反対回り</b>に進みます。まず本当の時刻を考えて、そこから'+P.d+'分すすめ、もう一度鏡にうつしてみよう。';
  if(P.kind==='dread')return {lr:'鏡では、字のならびも左右反対です。いちばん右に見える字が、本当はいちばん左の字。1つずつ、字を左右反対にもどして読もう。',
    ud:'水面では上と下が反対です。字のならびの順番はそのまま。1つずつ、字の上と下を反対にもどして読もう。',
    rot:'さかさまにすると、字のならびも反対になり、字も半回転します。図を頭の中でくるりと半回転させて読もう。'}[P.tf];
  return {lr:'鏡では右と左が反対です。12と6を結ぶ<b>たての線</b>で折り返して、針がどこをさすか考えよう。見えた時刻と本当の時刻をたすと、ちょうど12時間になります。',
    ud:'水面では上と下が反対です。12が下にあります。3と9を結ぶ<b>横の線</b>で折り返して、針がどこをさすか考えよう。',
    rot:'12が下にあります。図をくるりと半回転させて考えよう。短い針と長い針が、それぞれどの数字の近くにあるかを読もう。'}[P.tf];}
function explain(){
  if(P.kind==='dread')return `<div class="kd-ex">本当の時刻は <b>${tstr(P.a)}</b> です。${P.tf==='lr'?'鏡では字のならびも、字の形も左右反対になります。':P.tf==='ud'?'水面では、字の上と下が反対になります（ならびの順番はそのまま）。':'さかさまにすると、ならびも字も半回転します。'}</div>
    <div class="kd-pair"><figure class="kd-fig">${digSVG(P.tf,P.a,{mw:200})}<figcaption>${TFN[P.tf]}時計</figcaption></figure><figure class="kd-fig">${digSVG('none',P.a,{mw:200})}<figcaption>本当の時計</figcaption></figure></div>`;
  if(P.kind==='pick'){const h=hands(P.t);return `<div class="kd-ex">${TFV[P.tf]}と、数字の形も、針の向きも${P.tf==='lr'?'左右':P.tf==='ud'?'上下':'上下・左右とも'}反対になります。</div>
    <div class="kd-pair"><figure class="kd-fig">${clockSVG('none','num',h[0],h[1],{mw:130})}<figcaption>本当の時計</figcaption></figure><figure class="kd-fig">${clockSVG(P.a[0],'num',P.a[1],P.a[2],{mw:130})}<figcaption>${TFN[P.tf]}時計</figcaption></figure></div>`;}
  const real=P.kind==='after'?(720-P.a-P.d+1440)%720:P.a,h=hands(real),pair=(t2,cap2)=>{const g=hands(t2);return `<div class="kd-pair"><figure class="kd-fig">${clockSVG(P.tf,P.face,P.img[0],P.img[1],{mw:130})}<figcaption>${TFN[P.tf]}時計</figcaption></figure><figure class="kd-fig">${clockSVG('none',P.face,g[0],g[1],{mw:130})}<figcaption>${cap2}</figcaption></figure></div>`;};
  if(P.kind==='after'){const seen0=(720-real)%720,t2=(real+P.d)%720;
    return `<div class="kd-ex">鏡の時計は、見えたままだと ${tstr(seen0)} に見えます。本当の時刻は、12時間からそれをひいた <b>${tstr(real)}</b>。${P.d}分たつと本当は ${tstr(t2)} で、鏡の中では 12時間−${dur(t2)}＝<b>${tstr(P.a)}</b> に見えます。<br>鏡の中の時計は反対回りなので、見えた時刻から${P.d}分<b>もどった</b>時刻になります。</div>${pair(real,'本当の時計（はじめ）')}`;}
  if(P.tf==='lr'){const seen=(720-real)%720;return `<div class="kd-ex">見えたままに読むと ${tstr(seen)}。鏡では左右が反対なので、本当の時刻は12時間からひいた <b>${tstr(real)}</b> です（${dur(seen)}＋${dur(real)}＝12時間）。</div>${pair(real,'本当の時計')}`;}
  return `<div class="kd-ex">${P.tf==='ud'?'横の線（3と9を結ぶ線）で上下に折り返す':'図を半回転させる'}と、本当の時刻は <b>${tstr(real)}</b> です。</div>${pair(real,'本当の時計')}`;}
function draw(){
  app.innerHTML=`${topBar()}
    <div class="boardw">${figure()}</div>
    <p class="qq">${qtext()}</p>
    <div class="opts4 ${P.kind==='pick'?'':'txt'}">${S.opts.map((j,i)=>`<button class="ob ${S.done&&j===0?'right':''} ${S.wrong.includes(i)?'wrong':''}" data-i="${i}" ${S.done||S.wrong.includes(i)?'disabled':''}><span class="k">${'アイウエ'[i]}</span>${optInner(j)}</button>`).join('')}</div>
    ${S.hint&&!S.done?`<p class="hintbox">${hintText()}</p>`:''}
    ${S.done?'':`<p class="msg ${S.msgc||''}" id="msg">${S.msg||''}</p><div class="row"><button class="btn" id="hint" ${S.hint?'disabled':''}>ヒント</button></div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(explain());return;}
  app.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
    if(S.opts[i]===0){S.done=true;draw();}else{S.wrong.push(i);S.hints++;S.msg='ちがいます。もう一度考えてみよう。';S.msgc='ng';draw();}});
  document.getElementById('hint').onclick=()=>{S.hint=true;S.hints++;S.msg='';draw();};
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
