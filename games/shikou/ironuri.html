<style>

<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>色ぬりパズル</h1>
    <p class="lead">となり合う地域がちがう色になるように、地図をぬろう。いちばん少ない色の数や、★の色が何色に決まるかも考えよう。5つのレベルから1問ずつ。ヒントやまちがいなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=false;
let QS=[{"id":"1-01","lv":1,"mode":"free","map":["CAAAA","CCEEB","CDEEB","DDEBB"],"n":5,"k":3,"pre":{},"nsol":6,"chi":3,"adj":[[1,2,4],[0,4],[0,3,4],[2,4],[0,1,2,3]]},{"id":"2-01","lv":2,"mode":"free","map":["GGFAA.","EGFAAA","EEFDDC","BHHDDC","BBHH.C"],"n":8,"k":3,"pre":{"4":0,"0":1},"nsol":1,"chi":3,"adj":[[2,3,5],[4,7],[0,3],[0,2,5,7],[1,5,6,7],[0,3,4,6,7],[4,5],[1,3,4,5]]},{"id":"3-01","lv":3,"mode":"min","map":["AABBCC","BBBBBB","BBBBDB","DDDDDD","EEDDFF"],"n":6,"k":4,"chi":2,"wit":{"t":"edge","a":[0,1]},"pre":{},"adj":[[1],[0,2,3],[1],[1,4,5],[3],[3]]},{"id":"4-01","lv":4,"mode":"star","map":["G.BFFFA","GGBBFAA","GCBBFFA","HCIIIFA","HCIEEEA","H...EDD"],"n":9,"k":3,"pre":{"5":0,"0":1},"star":8,"ans":1,"depth":2,"steps":[[4,2],[8,1]],"chi":3,"adj":[[3,4,5],[2,5,6,8],[1,6,7,8],[0,4],[0,3,5,8],[0,1,4,8],[1,2,7],[2,6],[1,2,4,5]]},{"id":"5-01","lv":5,"mode":"star","map":["HHHKKII.","HHHKKIII",".HHLIIIB","FFHLJJBB","FDDLJBBC","EDGGGBCC","EAAGGCCC",".AA....."],"n":12,"k":3,"pre":{"0":0,"3":1,"4":2},"star":2,"ans":1,"depth":5,"steps":[[6,2],[11,0],[9,1],[1,0],[2,1]],"chi":3,"adj":[[3,4,6],[2,6,8,9],[1,6],[0,4,5,6,7,11],[0,3,5],[3,4,7],[0,1,2,3,9,11],[3,5,10,11],[1,9,10,11],[1,6,8,11],[7,8,11],[3,6,7,8,9,10]]}];
const ID='ironuri';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>色ぬりパズル 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* 色ぬりパズル：p={mode:'free'|'min'|'star', map:['AAB.',…], n, adj:[[…]], k, pre:{地域:色}, chi, wit, star, ans, steps:[[地域,色],…]}
   地図の地域をタップして色をぬる。となり合う（辺でくっつく）地域は同じ色にしない。 */
const HINTWORD='ヒントやまちがい';
const ICOL=['#ef4444','#3b82f6','#facc15','#22c55e'], ICN=['あか','あお','きいろ','みどり'];
const LVD={1:'3色で小さな地図をぬろう',2:'色のついた地域がある地図',3:'いちばん少ない色で',4:'★の色は何色に決まる？',5:'大きな地図で、★の色・いちばん少ない色'};
const RULES=`<ol class="rules">
  <li>色をえらんで地域をタップすると、ぬれます。<b>となり合う地域は、ちがう色</b>にしよう。</li>
  <li>線（辺）でくっついている地域が「となり」です。同じ色のとなりがあると、さかい目が<b style="color:#dc2626">赤く</b>光ります。</li>
  <li>●の印の地域は、はじめから色が決まっています。</li>
  <li>「いちばん少ない色で」の問題は、できるだけ少ない色の数でぬろう。「★」の問題は、★の地域が何色に決まるかを考えて、★をぬって答えよう。</li></ol>`;
function regCells(){const R=[];for(let i=0;i<P.n;i++)R.push([]);P.map.forEach((row,r)=>[...row].forEach((ch,c)=>{if(ch!=='.')R[ch.charCodeAt(0)-65].push([r,c]);}));return R;}
const rid=(r,c)=>{if(r<0||c<0||r>=P.map.length||c>=P.map[0].length)return -1;const ch=P.map[r][c];return ch==='.'?-1:ch.charCodeAt(0)-65;};
function startStage(p){
  P=p; const pre={}; Object.entries(p.pre||{}).forEach(([v,x])=>pre[+v]=x);
  S={col:0,c:Array(p.n).fill(null),lock:Array(p.n).fill(false),pre,hints:0,done:false,msg:'',chiShown:false,showSteps:false};
  Object.entries(pre).forEach(([v,x])=>{S.c[v]=x;S.lock[v]=true;});
  S.cells=regCells();
  /* 地域のまん中に近いマス（印や★を置く場所） */
  S.ctr=S.cells.map(cs=>{const mr=cs.reduce((a,x)=>a+x[0],0)/cs.length,mc=cs.reduce((a,x)=>a+x[1],0)/cs.length;return cs.reduce((b,x)=>Math.hypot(x[0]-mr,x[1]-mc)<Math.hypot(b[0]-mr,b[1]-mc)?x:b,cs[0]);});
  begin(p); draw();
}
const CU=()=>Math.floor(Math.min(52,340/Math.max(P.map[0].length,P.map.length*0.9)));
const conflicts=()=>{const L=[];for(let v=0;v<P.n;v++)for(const u of P.adj[v])if(u>v&&S.c[v]!=null&&S.c[v]===S.c[u])L.push([v,u]);return L;};
function boardSVG(){
  const U=CU(),M=8,H=P.map.length,W=P.map[0].length,VW=W*U+2*M,VH=H*U+2*M; let s='';
  const bad=new Set(conflicts().map(([a,b])=>a+'-'+b));
  const hi=new Set(S.done&&P.mode==='min'&&P.wit?[...P.wit.a,...(P.wit.c!=null?[P.wit.c]:[])]:[]);
  if(!S.done&&S.hl!=null)hi.add(S.hl);
  s+=`<rect x="0" y="0" width="${VW}" height="${VH}" rx="8" fill="#dbeafe"/>`;
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){const v=rid(r,c);if(v<0)continue;const x=M+c*U,y=M+r*U;
    s+=`<rect x="${x}" y="${y}" width="${U+.6}" height="${U+.6}" fill="${S.c[v]==null?'#fffdf8':ICOL[S.c[v]]}" data-v="${v}" class="hit" style="cursor:pointer"/>`;}
  /* さかい目 */
  for(let r=0;r<=H;r++)for(let c=0;c<=W;c++){
    const x=M+c*U,y=M+r*U;
    if(c<W){const a=rid(r-1,c),b=rid(r,c);if(a!==b){const k=Math.min(a,b)+'-'+Math.max(a,b),red=bad.has(k);s+=`<line x1="${x}" y1="${y}" x2="${x+U}" y2="${y}" stroke="${red?'#dc2626':'#2a2520'}" stroke-width="${red?6:3}" stroke-linecap="round" pointer-events="none"/>`;}}
    if(r<H){const a=rid(r,c-1),b=rid(r,c);if(a!==b){const k=Math.min(a,b)+'-'+Math.max(a,b),red=bad.has(k);s+=`<line x1="${x}" y1="${y}" x2="${x}" y2="${y+U}" stroke="${red?'#dc2626':'#2a2520'}" stroke-width="${red?6:3}" stroke-linecap="round" pointer-events="none"/>`;}}}
  /* 印 */
  for(let v=0;v<P.n;v++){const [r,c]=S.ctr[v],cx=M+c*U+U/2,cy=M+r*U+U/2;
    if(hi.has(v))S.cells[v].forEach(([rr,cc])=>{const x=M+cc*U,y=M+rr*U,d=6,o=(a,b)=>rid(rr+a,cc+b)!==v;const L=o(0,-1),Rr=o(0,1),T=o(-1,0),B=o(1,0);
      const ln=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#fff" stroke-width="3.5" stroke-dasharray="6 4" pointer-events="none"/>`;
      if(T)s+=ln(x+(L?d:0),y+d,x+U-(Rr?d:0),y+d); if(B)s+=ln(x+(L?d:0),y+U-d,x+U-(Rr?d:0),y+U-d);
      if(L)s+=ln(x+d,y+(T?d:0),x+d,y+U-(B?d:0)); if(Rr)s+=ln(x+U-d,y+(T?d:0),x+U-d,y+U-(B?d:0));});
    if(S.pre[v]!=null)s+=`<circle cx="${cx}" cy="${cy}" r="${U*.16}" fill="#2a2520" stroke="#fff" stroke-width="2.5" pointer-events="none"/>`;
    if(P.mode==='star'&&v===P.star)s+=`<text x="${cx}" y="${cy+U*.2}" text-anchor="middle" font-size="${U*.62}" fill="#2a2520" stroke="#fff" stroke-width="3" paint-order="stroke" pointer-events="none">★</text>`;
    if(S.done&&P.mode==='min'&&P.wit&&P.wit.c===v)s+=`<text x="${cx}" y="${cy+U*.16}" text-anchor="middle" font-size="${U*.5}" font-weight="700" fill="#2a2520" stroke="#fff" stroke-width="3" paint-order="stroke" pointer-events="none">◎</text>`;
    if(S.showSteps&&P.steps){const i=P.steps.findIndex(x=>x[0]===v);if(i>=0&&v!==P.star)s+=`<circle cx="${cx}" cy="${cy}" r="${U*.24}" fill="#fff" stroke="#2a2520" stroke-width="1.5" pointer-events="none"/><text x="${cx}" y="${cy+U*.12}" text-anchor="middle" font-size="${U*.32}" font-weight="700" fill="#2a2520" pointer-events="none">${i+1}</text>`;}
  }
  return `<svg id="bd" viewBox="0 0 ${VW} ${VH}" style="max-width:${VW}px" role="img" aria-label="地図">${s}</svg>`;
}
function qtext(){
  if(P.mode==='free')return `<b>${ICN.slice(0,P.k).join('・')}</b>の${P.k}色で、となり合う地域がちがう色になるようにぬろう。`;
  if(P.mode==='min')return `となり合う地域がちがう色になるように、<b>できるだけ少ない色の数</b>でぬろう。`;
  return `${ICN.slice(0,3).join('・')}の3色でぬるとき、<b>★の地域は何色</b>に決まる？　★をその色でぬって答えよう。`;
}
function draw(){
  const used=new Set(S.c.filter(x=>x!=null)).size;
  app.innerHTML=`${topBar()}
    <p class="qq">${qtext()}</p>
    <div class="boardw iw">${boardSVG()}</div>
    ${S.done?'':`<div class="row ir-pal">${ICOL.slice(0,P.k).map((x,i)=>`<button class="ir-c ${S.col===i?'on':''}" data-k="${i}" aria-label="${ICN[i]}"><span style="background:${x}"></span>${ICN[i]}</button>`).join('')}<button class="ir-c ${S.col==='e'?'on':''}" data-k="e" aria-label="けす"><span style="background:#fffdf8"></span>けす</button></div>
    ${P.mode==='min'?`<p class="note" style="text-align:center">使っている色：<b>${used}色</b>${S.chiShown?`（めあて：${P.chi}色）`:''}</p>`:''}
    <div class="row" style="justify-content:center"><button class="btn" id="hint">ヒント</button><button class="btn" id="reset">やりなおす</button></div>
    <p class="msg ${S.msgc||''}" id="msg">${S.msg||'色をえらんで、地域をタップしよう。'}</p>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(explain());return;}
  app.querySelectorAll('.ir-c').forEach(b=>b.onclick=()=>{S.col=b.dataset.k==='e'?'e':+b.dataset.k;S.msg='';draw();});
  document.getElementById('hint').onclick=hint;
  document.getElementById('reset').onclick=()=>{for(let v=0;v<P.n;v++)if(!S.lock[v])S.c[v]=null;S.msg='';S.msgc='';draw();};
  app.querySelectorAll('#bd .hit').forEach(h=>h.onclick=()=>tap(+h.dataset.v));
}
function tap(v){
  S.hl=null;
  if(S.lock[v]){S.msg=S.pre[v]!=null?'●の地域は、はじめから色が決まっています。':'ヒントでぬった地域は変えられません。';S.msgc='';draw();return;}
  if(P.mode==='star'&&v===P.star){
    if(S.col==='e')return;
    if(S.col===P.ans){S.c[v]=S.col;S.done=true;S.showSteps=true;P.steps.forEach(([u,y])=>{S.c[u]=y;});draw();return;}
    S.hints++; S.msg=`★は${ICN[S.col]}ではありません。もう一度考えよう（まちがい ${S.hints}回）。`; S.msgc='ng'; draw(); return;
  }
  S.c[v]=(S.col==='e'||S.c[v]===S.col)?null:S.col; S.msg=''; S.msgc='';
  check(); draw();
}
function check(){
  if(P.mode==='star')return;
  if(S.c.some(x=>x==null)){ if(conflicts().length){S.msg='赤いさかい目の両がわが、同じ色になっています。';S.msgc='ng';} return; }
  if(conflicts().length){S.msg='赤いさかい目の両がわが、同じ色になっています。';S.msgc='ng';return;}
  if(P.mode==='free'){S.done=true;return;}
  const used=new Set(S.c).size;
  if(used<=P.chi){S.done=true;return;}
  S.msg=`正しくぬれました！でも、${used}色より少ない色でもぬれます。ちょうせんしよう。`; S.msgc='';
}
/* ぬり方の探索：lock された地域はそのまま、なるべく今の色を生かす。maxc 色以内（使う色の種類） */
function searchColoring(maxc){
  const c=S.c.map((x,v)=>S.lock[v]?x:null), order=[...Array(P.n).keys()].filter(v=>!S.lock[v]).sort((a,b)=>P.adj[b].length-P.adj[a].length);
  let nodes=0;
  function dfs(i){
    if(++nodes>200000)return false;
    if(i===order.length)return true;
    const v=order[i], usedSet=new Set(c.filter(x=>x!=null));
    const pref=[S.c[v],...usedSet,0,1,2,3].filter((x,j,a)=>x!=null&&x<P.k&&a.indexOf(x)===j);
    for(const x of pref){ if(P.adj[v].some(u=>c[u]===x))continue; if(!usedSet.has(x)&&usedSet.size>=maxc)continue;
      c[v]=x; if(dfs(i+1))return true; c[v]=null; }
    return false;
  }
  return dfs(0)?c:null;
}
function hint(){
  if(P.mode==='min'&&!S.chiShown){S.chiShown=true;S.hints++;S.msg=`ヒント：この地図は ${P.chi}色 でぬり分けられます。`;S.msgc='';draw();return;}
  if(P.mode==='star'){
    const st=P.steps.find(([v,x])=>!(S.lock[v]&&S.c[v]===x)); if(!st)return;
    const [v,x]=st, nb=[...new Set(P.adj[v].filter(u=>S.lock[u]).map(u=>S.c[u]))].filter(y=>y!==x);
    S.hints++;
    if(v===P.star){S.c[v]=x;S.done=true;S.showSteps=true;P.steps.forEach(([u,y])=>{S.c[u]=y;});draw();return;}
    S.c[v]=x; S.lock[v]=true; S.hl=v;
    S.msg=`ヒント：この地域は、となりに${nb.map(y=>ICN[y]).join('と')}があるので、${ICN[x]}に決まります。`; S.msgc='';
    draw(); return;
  }
  const sol=searchColoring(P.mode==='min'?P.chi:P.k); if(!sol)return;
  let v=S.c.findIndex((x,i)=>!S.lock[i]&&x!==sol[i]&&x!=null&&conflicts().some(([a,b])=>a===i||b===i));
  if(v<0)v=S.c.findIndex((x,i)=>!S.lock[i]&&x!==sol[i]);
  if(v<0)return;
  /* 解に合わせて、まずこの地域を直す。今の色が解とちがう地域は、そのまま（自分で直す） */
  S.c[v]=sol[v]; S.lock[v]=true; S.hints++;
  S.hl=v; check();
  if(!S.done&&!S.msg.startsWith('正しくぬれました')){const bad=conflicts().length;
    S.msg=`ヒント：地域を1つぬりました（白い点線のわく）。${bad?'赤いさかい目の両がわが同じ色なので、そこも直そう。':'ほかの地域も、となりと同じ色にならないようにぬろう。'}`; S.msgc=bad?'ng':'';}
  draw();
}
function explain(){
  if(P.mode==='free')return `<p style="margin:0">となり合う地域が、どこもちがう色になりました。色のぬり方は、全部で ${P.nsol}通り あります（色の名前を入れかえたぬり方も、べつに数えます）。</p>`;
  if(P.mode==='star'){const L=P.steps.length;
    return `<p style="margin:0">★の地域は <b>${ICN[P.ans]}</b> に決まります。●の地域から順に、「となりに2色あれば、のこりの1色に決まる」をくり返すと、地図の番号の順（${L-1}つの地域）に色が決まって、★にたどりつきます。</p>`;}
  const w=P.wit, m=w.a.length;
  let why;
  if(P.chi===2)why='となり合う地域があるので、1色ではぬれません。だから<b>2色</b>がいちばん少ない色の数です。';
  else if(P.chi===3)why=m===3?'白い点線のわくの3つの地域は、どの2つもとなり合っているので、ちがう色が3ついります。だから<b>3色</b>がいちばん少ない色の数です。'
    :`白い点線のわくの${m}この地域は、輪のようにつながっています。数が奇数なので、2色で交互にぬると、さいごの地域が最初の地域と同じ色になってしまいます。だから<b>3色</b>いります。`;
  else why=m===3?'白い点線のわくの4つの地域は、どの2つもとなり合っているので、<b>4色</b>いります。'
    :`◎の地域のまわりを、${m}この地域（奇数）が輪のように取りかこんでいます。まわりの輪には3色いるので、◎にはもう1色、全部で<b>4色</b>いります。`;
  return `<p style="margin:0">${P.chi}色でぬれました！ ${why}</p>${P.lv===5?'<p class="note" style="margin:0">どんな地図でも、4色あればとなり合う地域をぬり分けられることが知られています（四色定理）。</p>':''}`;
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
