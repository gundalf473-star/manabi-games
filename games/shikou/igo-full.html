<script>
(function(){
const PAID=true;
let QS=[];
const ID='igo';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>石取りゲーム（囲碁入門） 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* 石取りゲーム（囲碁入門）
   p={kind:'cap'|'save'|'ladder'|'game', n:盤の大きさ, b0:'.'空き 'x'黒（あなた） 'o'白 の文字列（左上から右へ）,
      cap/save/ladder: t:印の石の1つ, mk:印の石, a:正解の手（探索で1か所だけ）, ladder: d:何手で取れるか, net:ゲタ
      game: cpu:0〜3（コンピューターの強さ）, sd:打ち方の番号, sol:勝てる手順の一例（gen_igo.py で確かめた）}
   石の取り方・打てない手（自殺手・コウ）・取る探索・コンピューターの打ち方は gen_igo.py と同じ */
const HINTWORD='ヒント・まちがい・やり直し';
const LVD={1:'1手で石を取ろう（アタリ）',2:'石をにがそう・よわい相手と対戦',3:'よく読んでにがす・短いシチョウ・対戦',4:'シチョウで追いかける・強い相手',5:'長いシチョウ・とても強い相手'};
const RULES=`<ol class="rules">
  <li>あなたは<b>黒</b>。線が交わる点に、石を1つずつ打ちます。上下左右にとなり合う同じ色の石は、<b>つながった仲間</b>です。</li>
  <li>石の上下左右の空いている点が「<b>にげ道</b>」。相手の石のにげ道を<b>全部ふさぐと、その石を取れます</b>。にげ道が1つだけの石を「<b>アタリ</b>」といいます。</li>
  <li>にげ道が1つもなくなる点には打てません。ただし、<b>そこに打つと相手の石が取れるときは打てます</b>。</li>
  <li>問題は3しゅるい：<b>▲の白い石を取る</b>／<b>▲の黒い石をにがす</b>／<b>▲の白い石を追いかけて取る</b>（白はにげます。<b>取ればクリア</b>）。</li>
  <li>アタリ、アタリと続けて追いかけ、はしや黒い石の所まで追いつめて取る方法を「<b>シチョウ</b>」といいます。すぐにアタリにしないで、少しはなれた所に打って、にげられないようにかこむ方法は「<b>ゲタ</b>」といいます。</li>
  <li>対戦は「<b>先に相手の石を1つでも取ったほうが勝ち</b>」。あなたが先に打ちます。<b>勝てばクリア</b>です（負け・引き分けはクリアになりません）。</li>
  <li>ヒントを使うと、にげ道やおすすめの点が光ります（ヒント・まちがい・やり直しで星がへります）。</li></ol>`;
const CPUN=['のんびりした','ふつうの','強い','とても強い'];
const DEP=14;
let GN=5,NBR=[];
function setN(n){GN=n;NBR=[];for(let r=0;r<n;r++)for(let c=0;c<n;c++){const a=[];for(const [dr,dc] of [[-1,0],[0,-1],[0,1],[1,0]]){const rr=r+dr,cc=c+dc;if(rr>=0&&rr<n&&cc>=0&&cc<n)a.push(rr*n+cc);}NBR.push(a);}}
const srt=a=>a.sort((x,y)=>x-y);
function group(b,i){const col=b[i],st=[i],seen=new Set([i]),libs=new Set();
  for(let k=0;k<st.length;k++)for(const x of NBR[st[k]]){if(b[x]===0)libs.add(x);else if(b[x]===col&&!seen.has(x)){seen.add(x);st.push(x);}}
  return [srt(st),srt([...libs])];}
function play(b,p,i,ko){if(ko===undefined)ko=-1;if(b[i]||i===ko)return null;const nb=b.slice();nb[i]=p;let caps=[];
  for(const x of NBR[i])if(nb[x]===3-p){const [st,lb]=group(nb,x);if(!lb.length){for(const y of st)nb[y]=0;caps=caps.concat(st);}}
  const [st,lb]=group(nb,i);if(!lb.length)return null;srt(caps);
  return [nb,caps,caps.length===1&&st.length===1&&lb.length===1?caps[0]:-1];}
function legal(b,p,ko){const o=[];for(let i=0;i<GN*GN;i++)if(play(b,p,i,ko))o.push(i);return o;}
function attC(b,t,libs){const att=3-b[t],c=new Set(libs);
  if(libs.length===2)for(const l of libs)for(const x of NBR[l])if(b[x]===0)c.add(x);
  for(const s of group(b,t)[0])for(const x of NBR[s])if(b[x]===att){const [st2,lb]=group(b,x);if(lb.length===1){c.add(lb[0]);
    /* アタリの攻める側の石は、となりのアタリの石を取ってもにげられる */
    for(const y of st2)for(const z of NBR[y])if(b[z]===b[t]){const l3=group(b,z)[1];if(l3.length===1)c.add(l3[0]);}}}
  return srt([...c]);}
function defC(b,t,libs){const att=3-b[t],c=new Set(libs);
  for(const s of group(b,t)[0])for(const x of NBR[s])if(b[x]===att){const lb=group(b,x)[1];if(lb.length<=2)lb.forEach(y=>c.add(y));}
  return srt([...c]);}
/* t の石を、攻める側（t と反対の色）が取れるか。tm：番の色。depth：攻める側があと何手打てるか */
/* 画面で使うときは、考える時間に上限をつける（スマホでも止まらないように）。時間切れなら null */
const TO={};let NODES=0,DL=0;
function capT(b,t,tm,depth,ko,ms){NODES=0;DL=Date.now()+(ms||600);try{return canCap(b,t,tm,depth,ko);}catch(e){if(e!==TO)throw e;return null;}finally{DL=0;}}
function canCap(b,t,tm,depth,ko,memo){
  if(DL&&(++NODES&127)===0&&Date.now()>DL)throw TO;
  if(b[t]===0)return true;memo=memo||new Map();
  const dc=b[t],att=3-dc,key=b.join('')+'|'+t+'|'+tm+'|'+depth+'|'+ko;
  if(memo.has(key))return memo.get(key);
  const libs=group(b,t)[1];let res;
  if(tm===att){
    if(libs.length===1&&play(b,att,libs[0],ko))res=true;
    else if(libs.length>=3||depth===0)res=false;
    else{res=false;for(const m of attC(b,t,libs)){const r=play(b,att,m,ko);if(r&&canCap(r[0],t,dc,depth-1,r[2],memo)){res=true;break;}}}
  }else{
    if(libs.length>=3)res=false;
    else{res=true;let moved=false;
      for(const m of defC(b,t,libs)){const r=play(b,dc,m,ko);if(!r)continue;moved=true;if(!canCap(r[0],t,att,depth,r[2],memo)){res=false;break;}}
      if(res&&!moved)res=canCap(b,t,att,depth,-1,memo);}
  }
  memo.set(key,res);return res;}
/* ---- 対戦：コンピューターの打ち方（gen_igo.py の policy と同じ） ---- */
function pickR(c,b,sd){let S_=0,n=0;for(let i=0;i<b.length;i++)if(b[i]){S_+=(i+1)*b[i];n++;}return c[(S_*31+n*17+sd*7)%c.length];}
function bestOf(ms,vs){const mx=Math.max(...vs);return ms.filter((_,k)=>vs[k]===mx);}
function oppCanCap(b,p){for(let i=0;i<GN*GN;i++){const r=play(b,p,i);if(r&&r[1].length)return true;}return false;}
function score(b,me,m,lv){const nb=play(b,me,m)[0],op=3-me;
  if(oppCanCap(nb,op))return -1000;
  let s=10*Math.min(group(nb,m)[1].length,4);const seen=new Set();
  for(const x of NBR[m])if(nb[x]===op&&!seen.has(x)){const [st,l2]=group(nb,x);st.forEach(y=>seen.add(y));
    if(l2.length===1)s+=30;else if(l2.length===2)s+=8;
    if(lv>=3&&l2.length<=2&&canCap(nb,x,op,4,-1))s+=500;}
  if(lv>=3){const sn=new Set();for(let i=0;i<GN*GN;i++)if(nb[i]===me&&!sn.has(i)){const [st,l2]=group(nb,i);st.forEach(y=>sn.add(y));
    if(l2.length===2&&canCap(nb,i,op,4,-1)){s-=400;break;}}}
  return s;}
function policy(b,me,lv,sd){
  const ms=legal(b,me);if(!ms.length)return -1;
  if(lv===0)return pickR(ms,b,sd);
  const caps=ms.filter(m=>play(b,me,m)[1].length);if(caps.length)return pickR(caps,b,sd);
  const op=3-me,resc=[],seen=new Set();
  for(let i=0;i<GN*GN;i++)if(b[i]===me&&!seen.has(i)){const [st,lb]=group(b,i);st.forEach(y=>seen.add(y));
    if(lb.length===1&&ms.includes(lb[0])){const nb=play(b,me,lb[0])[0];if(group(nb,lb[0])[1].length>=2&&(lv<2||!oppCanCap(nb,op)))resc.push(lb[0]);}}
  if(resc.length)return pickR(srt([...new Set(resc)]),b,sd);
  if(lv===1){const safe=ms.filter(m=>group(play(b,me,m)[0],m)[1].length>=2);return pickR(safe.length?safe:ms,b,sd);}
  return pickR(bestOf(ms,ms.map(m=>score(b,me,m,lv))),b,sd);}
const parseB=s=>[...s].map(ch=>ch==='x'?1:ch==='o'?2:0);
/* ---------------- 画面 ---------------- */
function startStage(p){P=p;setN(p.n);S={hints:0,done:false};reset();begin(p);draw();}
function reset(){S.tok=(S.tok||0)+1;S.b=parseB(P.b0);S.ko=-1;S.turn=1;S.ym=[];S.over=null;S.fail=false;S.msg='';S.msgc='';S.hint=0;S.rec=-1;S.last=-1;S.capd=[];S.libs=[];S.busy=false;S.steps=0;}
function boardSVG(){
  const n=GN,U=n===5?62:n===6?54:47,M=U*0.62,W=(n-1)*U+2*M,X=c=>M+c*U;let s=`<rect x="2" y="2" width="${W-4}" height="${W-4}" rx="8" fill="#e8c27a" stroke="#b98a3e" stroke-width="2"/>`;
  for(let k=0;k<n;k++)s+=`<line x1="${X(0)}" y1="${X(k)}" x2="${X(n-1)}" y2="${X(k)}" stroke="#5b4220" stroke-width="${k===0||k===n-1?2.4:1.4}"/><line x1="${X(k)}" y1="${X(0)}" x2="${X(k)}" y2="${X(n-1)}" stroke="#5b4220" stroke-width="${k===0||k===n-1?2.4:1.4}"/>`;
  const mk=new Set(P.kind==='game'?[]:P.mk.filter(i=>S.b[i]));
  for(let i=0;i<n*n;i++){const r=Math.floor(i/n),c=i%n,cx=X(c),cy=X(r),v=S.b[i];
    if(v){s+=`<circle cx="${cx+1}" cy="${cy+2}" r="${U*0.45}" fill="#000" opacity=".25"/><circle cx="${cx}" cy="${cy}" r="${U*0.45}" fill="${v===1?'#26221f':'#fbfbf8'}" stroke="${v===1?'#000':'#8a8278'}" stroke-width="1.5"/>`;
      if(mk.has(i)){const k=U*0.2;s+=`<polygon points="${cx},${cy-k*1.1} ${cx+k},${cy+k*0.7} ${cx-k},${cy+k*0.7}" fill="#e0342f"/>`;}
      else if(i===S.last)s+=`<circle cx="${cx}" cy="${cy}" r="${U*0.11}" fill="#e0342f"/>`;}
    else{if(S.capd.includes(i))s+=`<g stroke="#e0342f" stroke-width="3" stroke-linecap="round" opacity=".8"><line x1="${cx-U*0.2}" y1="${cy-U*0.2}" x2="${cx+U*0.2}" y2="${cy+U*0.2}"/><line x1="${cx+U*0.2}" y1="${cy-U*0.2}" x2="${cx-U*0.2}" y2="${cy+U*0.2}"/></g>`;
      if(S.libs.includes(i))s+=`<circle cx="${cx}" cy="${cy}" r="${U*0.16}" fill="#3b82f6" opacity=".75"/>`;}
    if(i===S.rec)s+=`<circle cx="${cx}" cy="${cy}" r="${U*0.42}" fill="none" stroke="#facc15" stroke-width="5"/>`;
    s+=`<rect x="${cx-U/2}" y="${cy-U/2}" width="${U}" height="${U}" fill="transparent" data-i="${i}" style="cursor:pointer"/>`;}
  return `<svg id="bd" viewBox="0 0 ${W} ${W}" style="max-width:${Math.min(W*1.05,420)}px" role="img" aria-label="${n}×${n}の碁盤">${s}</svg>`;
}
function qline(){
  if(P.kind==='cap')return `▲の印がついた<b>白い石を、1手で取ろう</b>。`;
  if(P.kind==='save')return `▲の<b>黒い石</b>がアタリ（にげ道が1つ）です。<b>1手で、取られないようににがそう</b>。`;
  if(P.kind==='ladder')return `▲の<b>白い石を追いかけて取ろう</b>。あなたが打つと、白はにげます。<b>どうにげても取れる</b>ように打とう。`;
  return `${GN}×${GN}の盤。相手：<b>${CPUN[P.cpu]}</b>コンピューター（白）。あなたが先。<b>先に石を取ったほうが勝ち</b>。`;
}
function tips(){
  if(P.kind==='cap')return '青い点が、▲の白い石の<b>にげ道</b>です。そこをふさぐと取れます。';
  if(P.kind==='save')return '青い点が、▲の黒い石のにげ道です。<b>にげ道をふやす</b>手を考えよう。のばす方法と、<b>となりの白い石を取る</b>方法があります。のばしても、またすぐアタリにされないか、よく読もう。';
  if(P.kind==='ladder')return '青い点が、白い石のにげ道（2つ）です。どちらかをふさいでアタリにすると、白はもう1つの方へにげます。<b>白がはしや黒い石の方へにげるように</b>追いかけよう。白い石の方へにげられると、つながってにげられます。はなれた所に打ってふさぐ「<b>ゲタ</b>」という手もあります。';
  return '相手の石を<b>アタリ</b>にしよう。自分の石がアタリにならないように気をつけて。<b>にげ道が2つしかない石</b>は、追いかけると取れることがあります。';
}
function explain(){
  if(P.kind==='cap'){const sur=NBR[P.a[0]].every(x=>parseB(P.b0)[x]===2);
    return `にげ道を全部ふさいだので、白い石を${P.mk.length}つ取れました。${sur?'白にかこまれた点でも、<b>相手の石が取れるときは打てます</b>。':'にげ道が1つ（アタリ）の石は、次の1手で取れます。'}`;}
  if(P.kind==='save'){const ext=P.how==='ext';
    return (ext?'にげ道の方へ<b>のばして</b>、にげ道がふえました。':'となりの<b>白い石を取って</b>、にげ道がふえました。')+(P.lv>=3?'ほかの手では、白に追いかけられて取られてしまいます。':'これで、白にすぐ取られることはありません。');}
  if(P.kind==='ladder')return P.net?'はなれた所からにげ道をふさぐ「<b>ゲタ</b>」で取れました。白がどちらへのびても、にげ道はふえません。':`アタリ、アタリと追いかけて、はしや黒い石の所まで追いつめました。この追いかけ方を「<b>シチョウ</b>」といいます。${P.lv>=5?'とちゅうに白い石があると、つながってにげられます。どちらから追うか、先まで読むのが大切です。':''}`;
  return `先に取って勝ち！${S.ym.length}手で取れました。相手の石を<b>アタリ</b>にして、にげられない形を作るのがコツです。`;
}
function draw(){
  const myTurn=!S.done&&!S.over&&!S.fail&&!S.busy;
  app.innerHTML=`${topBar()}
    <p class="qq" style="font-size:16px">${qline()}</p>
    <div class="boardw" style="background:#f6ead0">${boardSVG()}</div>
    ${S.done?'':`<p class="msg ${S.msgc}" id="msg">${S.msg||(myTurn?'打つ点をタップしよう。':'')}</p>
    ${S.over||S.fail?`<div class="row"><button class="btn go" id="retry">やり直す</button></div>`:''}
    ${S.hint&&myTurn?`<p class="hintbox">${tips()}${S.rec>=0?'<br>黄色の丸の点がおすすめです。':''}</p>`:''}
    <div class="row"><button class="btn" id="hint" ${myTurn?'':'disabled'}>ヒント</button>${P.kind==='game'||P.kind==='ladder'?'<button class="btn" id="restart">はじめから</button>':''}</div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(`<p style="margin:0">${explain()}</p>`);return;}
  document.querySelectorAll('#bd [data-i]').forEach(e=>e.addEventListener('click',()=>tap(+e.dataset.i)));
  document.getElementById('hint').onclick=giveHint;
  const rs=document.getElementById('restart');if(rs)rs.onclick=()=>{if(S.ym.length)S.hints++;reset();draw();};
  const rt=document.getElementById('retry');if(rt)rt.onclick=()=>{reset();draw();};
}
function libsOf(i){return S.b[i]?group(S.b,i)[1]:[];}
function goodLadder(b){ /* 今の局面で、取れる手（はじめの手は答え） */
  if(!S.ym.length)return P.a[0];
  const t=P.t,cand=attC(b,t,group(b,t)[1]);
  const T0=Date.now();for(const m of cand.concat(legal(b,1,S.ko).filter(x=>!cand.includes(x)))){if(Date.now()-T0>1500)break;const r=play(b,1,m,S.ko);if(r&&(r[0][t]===0||capT(r[0],t,2,DEP-1,r[2],300)))return m;}
  return -1;}
function giveHint(){
  S.hints++;S.hint++;S.msg='';S.msgc='';
  if(P.kind==='game'){const k=S.ym.length,on=P.sol&&k<P.sol.length&&S.ym.every((m,j)=>m===P.sol[j])&&play(S.b,1,P.sol[k]);
    S.rec=on?P.sol[k]:policy(S.b,1,3,0);}
  else{S.libs=libsOf(P.t);if(S.hint>=2)S.rec=P.kind==='ladder'?goodLadder(S.b):P.a[0];}
  draw();
}
function illegalMsg(i){if(S.b[i])return 'そこにはもう石があります。';if(i===S.ko)return '取られた石は、すぐには取り返せません（コウ）。';return 'そこに打つと、にげ道がなくなるので打てません。';}
function tap(i){
  if(S.done||S.over||S.fail||S.busy)return;
  const r=play(S.b,1,i,S.ko);
  if(!r){S.msg=illegalMsg(i);S.msgc='ng';draw();return;}
  S.rec=-1;S.libs=[];S.hint=0;
  if(P.kind==='cap'){
    if(r[0][P.t]===0){S.b=r[0];S.capd=r[1];S.last=i;S.done=true;draw();return;}
    S.hints++;S.msg='そこでは、▲の石は取れません。▲の石のにげ道はどこかな？';S.msgc='ng';draw();return;}
  if(P.kind==='save'){
    S.b=r[0];S.capd=r[1];S.last=i;
    if(P.a.includes(i)){S.done=true;draw();return;}
    S.hints++;S.busy=true;S.msg='';draw();
    const s1=S,k1=S.tok;setTimeout(()=>{if(S!==s1||S.tok!==k1)return;S.busy=false;const t=P.t,lb=group(S.b,t)[1];let w=-1;
      for(const m of lb.concat(attC(S.b,t,lb).filter(x=>!lb.includes(x)))){const r2=play(S.b,2,m,r[2]);if(r2&&capT(r2[0],t,1,DEP-1,r2[2],250)){w=m;break;}}
      if(w>=0){const r2=play(S.b,2,w,r[2]);S.b=r2[0];S.capd=r2[1];S.last=w;}
      S.fail=true;S.msg=w<0?'その手では、▲の石はにげきれません。べつの手を考えよう。':S.b[t]?'白にこう打たれると、▲の石はもうにげられません。べつの手を考えよう。':'白に取られてしまいました。べつの手を考えよう。';S.msgc='ng';draw();},600);
    return;}
  if(P.kind==='ladder'){
    S.ym.push(i);S.b=r[0];S.capd=r[1];S.last=i;S.ko=r[2];
    if(S.b[P.t]===0){S.done=true;draw();return;}
    const ok=S.ym.length===1?P.a.includes(i):capT(S.b,P.t,2,DEP-1,S.ko)!==false; /* 1手目は gen_igo.py で調べた答え。時間切れのときは取れる形として続ける */S.busy=true;S.msg='白が考えています…';S.msgc='';draw();
    const s1=S,k1=S.tok;setTimeout(()=>{if(S!==s1||S.tok!==k1)return;S.busy=false;const t=P.t,ms=defC(S.b,t,group(S.b,t)[1]);let w=-1,bv=-1;
      for(const m of ms){const r2=play(S.b,2,m,S.ko);if(!r2)continue;
        const esc=capT(r2[0],t,1,DEP-1,r2[2],150)===false,v=(esc?100:0)+group(r2[0],t)[1].length;if(v>bv){bv=v;w=m;}}
      if(w>=0){const r2=play(S.b,2,w,S.ko);S.b=r2[0];S.capd=r2[1];S.last=w;S.ko=r2[2];}
      if(!ok){S.hints++;S.fail=true;S.msg='白にうまくにげられてしまいました。もう、かならず取れる形ではありません。はじめから考えなおそう。';S.msgc='ng';}
      else S.msg=group(S.b,t)[1].length===1?'白はにげました。さあ、どうする？':'白がにげました。追いかけよう。';
      draw();},550);
    return;}
  /* 対戦 */
  S.ym.push(i);S.b=r[0];S.capd=r[1];S.last=i;
  if(r[1].length){S.done=true;draw();return;}
  S.busy=true;S.msg='相手が考えています…';S.msgc='';draw();
  const p0=P,s0=S,k0=S.tok;
  setTimeout(()=>{if(P!==p0||S!==s0||S.tok!==k0)return;S.busy=false;cpuMove();},550);
}
function cpuMove(){
  const w=policy(S.b,2,P.cpu,P.sd);
  if(w<0){S.msg='相手は打てる点がないのでパスしました。';S.msgc='';}
  else{const r=play(S.b,2,w);S.b=r[0];S.capd=r[1];S.last=w;
    if(r[1].length){S.over='lose';S.msg=`白に石を${r[1].length}つ取られて、あなたの負け…。もう一度ちょうせんしよう。`;S.msgc='ng';draw();return;}
    S.msg='';}
  if(!legal(S.b,1).length){
    if(w<0||!legal(S.b,2).length){S.over='draw';S.msg='どちらも打てる点がなくなり、引き分けです。勝つとクリア。もう一度ちょうせんしよう。';S.msgc='ng';draw();return;}
    S.msg='あなたは打てる点がないのでパスです。';draw();S.busy=true;const p0=P,s0=S,k0=S.tok;setTimeout(()=>{if(P!==p0||S!==s0||S.tok!==k0)return;S.busy=false;cpuMove();},700);return;}
  draw();
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
