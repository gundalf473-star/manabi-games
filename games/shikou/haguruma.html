<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>くるくる歯車もよう</h1>
    <p class="lead">輪の中で歯車をころがすと、どんなもようがかける？　予想して当てると、歯車がまわってもようをかきます。5つのレベルから1問ずつ。ヒントやまちがいなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=false;
let QS=[{"kind":"pts","a":12,"b":4,"ans":3,"ds":[4,6,2],"id":"1-01","lv":1,"pen":0.8},{"kind":"pick","a":20,"b":5,"ans":[20,5],"ds":[[28,4],[24,4],[20,4]],"id":"2-01","lv":2,"pen":0.8},{"kind":"pts","a":25,"b":10,"ans":5,"ds":[2,4,6],"id":"3-01","lv":3,"pen":0.8},{"kind":"pick","a":15,"b":6,"ans":[15,6],"ds":[[20,4],[14,4],[16,4]],"id":"4-01","lv":4,"pen":0.8},{"kind":"pair","a":49,"b":14,"ans":[49,14],"ds":[[50,20],[50,5],[54,6]],"id":"5-01","lv":5,"pen":0.8}];
const ID='haguruma';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>くるくる歯車もよう 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* くるくる歯車もよう：p={kind:'pts'|'laps'|'pick'|'pair', a:輪の歯, b:歯車の歯, pen, ans, ds}
   形はすべて a,b から計算してえがく（内側を転がる円のペンの曲線）。とがり=a/gcd、周回=b/gcd */
const HINTWORD='ヒントやまちがい';
const LVD={1:'とがりを数えよう（色の区切りつき）',2:'わり算でとがりを予想',3:'何周でもとにもどる？',4:'どのもようになる？',5:'もようから歯車の組を当てる'};
const RULES=`<ol class="rules">
  <li>大きな<b>輪</b>の内側で、小さな<b>歯車</b>をころがします。歯車の穴にさしたペンで、もようがかけます。</li>
  <li>どんなもようになるか<b>予想</b>して、4つの中からえらぼう。当たると、歯車がまわってもようをかきます。</li>
  <li>もようの<b>とがった所</b>の数は、輪の歯の数と歯車の歯の数で決まります。そのひみつを見つけよう！</li></ol>`;
const HG_R=120, HG_COL=['#f9a8d4','#93c5fd','#fcd34d','#86efac','#c4b5fd','#fdba74'];
const hgGcd=(x,y)=>{while(y){[x,y]=[y,x%y];}return x;};
const hgSig=(a,b)=>{const g=hgGcd(a,b);return {p:a/g,l:b/g,g};};
let hgAnim=0;
function startStage(p){hgAnim++;P=p;S={hints:0,done:false,msg:'',opts:shuffle([p.ans,...p.ds]),wrong:[],hint:false};begin(p);draw();}
/* 時計の12時を0として、時計回りの角度 */
const hgC=(ph,rad)=>[rad*Math.sin(ph),-rad*Math.cos(ph)];
function hgCurve(a,b,pen,scale,perLap){
  const {p,l}=hgSig(a,b),Rr=HG_R*scale,r=Rr*b/a,d=pen*r,N=l*(perLap||Math.max(240,50*p)),out=[];
  for(let i=0;i<=N;i++){const t=2*Math.PI*l*i/N,ps=-(Rr-r)/r*t,c=hgC(t,Rr-r),e=hgC(ps,d);out.push([c[0]+e[0],c[1]+e[1]]);}
  return out;
}
const hgPts=arr=>arr.map(([x,y])=>x.toFixed(1)+','+y.toFixed(1)).join(' ');
function hgPattern(a,b,px){
  const raw=hgCurve(a,b,P.pen||0.8,1),m=Math.max(...raw.map(([x,y])=>Math.hypot(x,y))),k=100/m;
  return `<svg viewBox="-108 -108 216 216" style="width:100%;max-width:${px}px" role="img" aria-label="もようの絵"><circle r="104" fill="#fff" stroke="#e5ddcc"/><polyline points="${hgPts(raw.map(([x,y])=>[x*k,y*k]))}" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linejoin="round"/></svg>`;
}
function hgTooth(n,rad,h,inward){ /* 台形の歯がならんだ輪かく（inward=輪の内向きの歯） */
  const base=inward?rad+h/2:rad-h/2, tip=inward?rad-h/2:rad+h/2, f=[[0,base],[0.12,base],[0.3,tip],[0.62,tip],[0.8,base]];
  let s=[];for(let i=0;i<n;i++)for(let j=1;j<5;j++){const [u,rr]=f[j];s.push(hgC(2*Math.PI*(i+u-0.46+(inward?0.5:0))/n,rr).map(v=>v.toFixed(1)).join(','));}
  return s.join(' ');
}
/* 歯車の組の図。opt.aid=色の区切り, opt.marks=とがりの場所, opt.anim=アニメ用のid */
function hgSetup(a,b,opt){
  opt=opt||{};const R=HG_R,r=R*b/a,pitch=2*Math.PI*R/a,h=Math.min(9,pitch*0.62),pen=P.pen||0.8,{p,l}=hgSig(a,b);
  let s=`<circle r="${R+16}" fill="#e7e1d4" stroke="#a89a80" stroke-width="1.5"/>`;
  if(opt.aid){for(let k=0;k<a/b;k++){const t0=2*Math.PI*k*b/a,t1=2*Math.PI*(k+1)*b/a,A=hgC(t0,R+9),B=hgC(t1,R+9);
    s+=`<path d="M${A[0]},${A[1]} A${R+9},${R+9} 0 ${t1-t0>Math.PI?1:0} 1 ${B[0]},${B[1]}" fill="none" stroke="${HG_COL[k%6]}" stroke-width="12"/>`;
    const E=hgC(t0,R+16),F=hgC(t0,R+2);s+=`<line x1="${E[0]}" y1="${E[1]}" x2="${F[0]}" y2="${F[1]}" stroke="#6a625a" stroke-width="2"/>`;}}
  s+=`<polygon points="${hgTooth(a,R,h,true)}" fill="#fbfaf6" stroke="#a89a80" stroke-width="1.2"/>`;
  if(opt.marks){for(let k=0;k<p;k++){const pos=(k*b)%a,t=2*Math.PI*pos/a,D=hgC(t,R+9),T=hgC(t,R+27);
    s+=`<circle cx="${D[0]}" cy="${D[1]}" r="5" fill="#e0342f"/><text x="${T[0]}" y="${T[1]+5}" text-anchor="middle" font-size="${p>12?11:13}" font-weight="700" fill="#c8352d" font-family="sans-serif">${k+1}</text>`;}}
  const c0=hgC(0,R-r);
  s+=`<g id="${opt.anim||'hgs'}T"></g>`;
  s+=`<g id="${opt.anim||'hgs'}G" transform="translate(${c0[0].toFixed(1)},${c0[1].toFixed(1)})"><polygon points="${hgTooth(b,r,h,false)}" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="1.2" opacity=".92"/><circle r="${Math.max(2,r*0.12)}" fill="#1e3a8a"/><circle id="${opt.anim||'hgs'}P" cx="0" cy="${(-pen*r).toFixed(1)}" r="4" fill="#7c3aed" stroke="#fff" stroke-width="1.5"/></g>`;
  return `<svg ${opt.anim?`id="${opt.anim}"`:''} viewBox="-152 -152 304 304" style="width:100%;max-width:330px" role="img" aria-label="輪の歯${a}こ、歯車の歯${b}こ">${s}</svg>`;
}
function hgRun(id,a,b,onEnd){
  const my=++hgAnim,R=HG_R,r=R*b/a,pen=P.pen||0.8,{p,l}=hgSig(a,b),pts=hgCurve(a,b,pen,1,Math.max(360,60*p)),N=pts.length-1;
  const dur=Math.min(11000,Math.max(3200,2600*l)),t0=performance.now(),lab=document.getElementById(id+'L');
  const step=now=>{
    if(my!==hgAnim)return;const G=document.getElementById(id+'G'),T=document.getElementById(id+'T');if(!G||!T)return;
    const f=Math.min(1,(now-t0)/dur),th=2*Math.PI*l*f,c=hgC(th,R-r),ps=-(R-r)/r*th*180/Math.PI;
    G.setAttribute('transform',`translate(${c[0].toFixed(2)},${c[1].toFixed(2)}) rotate(${ps.toFixed(2)})`);
    T.innerHTML=`<polyline points="${hgPts(pts.slice(0,Math.floor(f*N)+1))}" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-linejoin="round"/>`;
    if(lab)lab.textContent=f<1?`歯車が ${Math.min(l,Math.floor(f*l)+1)}周目 を まわっています…`:`歯車が ${l}周 して、ペンがもとの場所にもどりました！　とがりは ${p}こ。`;
    if(f<1)requestAnimationFrame(step);else if(onEnd)onEnd();
  };
  requestAnimationFrame(step);
}
function qtext(){
  const {l}=hgSig(P.a,P.b);
  if(P.kind==='pts')return `この歯車をまわすと、もようの<b>とがった所</b>はいくつできる？`;
  if(P.kind==='laps')return `小さい歯車が輪の中を<b>何周</b>すると、ペンがはじめの場所にもどる？`;
  if(P.kind==='pick')return `この歯車をまわすと、<b>どんなもよう</b>になる？`;
  return `このもようは、小さい歯車が輪の中を<b>${l}周</b>してかけました。どの歯車の組でかいた？`;
}
const hgInfo=()=>`<p class="note" style="text-align:center;font-size:15px;color:var(--fg)"><span style="white-space:nowrap">大きい輪の歯：<b>${P.a}こ</b></span>　<span style="white-space:nowrap">小さい歯車の歯：<b>${P.b}こ</b></span></p>`;
function fig(){
  if(P.kind==='pair')return `<div class="boardw">${hgPattern(P.a,P.b,260)}</div>`;
  return `<div class="boardw">${hgSetup(P.a,P.b,{aid:P.lv===1,marks:S.hint&&P.lv>1})}</div>${hgInfo()}`;
}
function hintText(){
  const {p,l}=hgSig(P.a,P.b);
  if(P.kind==='pair')return `まず、とがりの数を数えよう（${p}こ）。それから、それぞれの組の歯の数を、同じ数でわれるだけわって小さくしよう。小さくした「輪の数」がとがりの数、「歯車の数」が何周でもどるかです。`;
  if(P.lv===1)return `輪のまわりの<b>色の区切り</b>を数えよう。区切り1つ分は、歯車の歯の数（${P.b}こ）と同じ長さ。歯車がそこをころがるたびに、とがりが1つできます。`;
  if(l===1)return `赤い点は、とがりができる場所です。歯車が1回まわると、輪の歯を${P.b}こ分すすみます。${P.a}こを${P.b}こずつ区切ると、いくつ？`;
  return `赤い点は、とがりができる場所（できる順の番号）です。歯車が1回まわるごとに、輪の歯を${P.b}こ分すすみます。番号が1の場所にもどるまでに、点は何こ？　輪を何周した？`;
}
function explain(){
  const {p,l,g}=hgSig(P.a,P.b);
  let s=P.lv===1?`輪の色の区切りは<b>${p}つ</b>（${P.a} ÷ ${P.b} ＝ ${p}）。歯車が輪を1周する間に、とがりが<b>${p}こ</b>できて、もとにもどります。`:l===1?`${P.a} ÷ ${P.b} ＝ ${p}。歯車が輪を1周する間に、とがりが<b>${p}こ</b>できて、もとにもどります。`
    :`輪の歯${P.a}こと歯車の歯${P.b}こを、どちらも<b>${g}</b>でわると <b>${p}</b> と <b>${l}</b>。だから、とがりは<b>${p}こ</b>、歯車が<b>${l}周</b>すると、ペンはもとの場所にもどります。`;
  if(l>1)s+=` 線は、とがりから<b>${l}こ先</b>のとがりへとびながらつながっていきます。`;
  return s;
}
function optHTML(o){
  if(P.kind==='pts')return `<b style="font-size:20px">${o}こ</b>`;
  if(P.kind==='laps')return `<b style="font-size:20px">${o}周</b>`;
  if(P.kind==='pick')return hgPattern(o[0],o[1],140);
  return `<span style="font-size:14px">輪の歯 <b style="font-size:19px">${o[0]}</b>こ</span><span style="font-size:14px">歯車の歯 <b style="font-size:19px">${o[1]}</b>こ</span>`;
}
const same=(x,y)=>JSON.stringify(x)===JSON.stringify(y);
function draw(){
  hgAnim++;
  app.innerHTML=`${topBar()}
    ${S.done?'':fig()}
    ${S.done?'':`<p class="qq">${qtext()}</p>`}
    <div class="opts4 ${P.kind==='pick'?'':'txt'}">${S.opts.map((o,i)=>`<button class="ob ${S.done&&same(o,P.ans)?'right':''} ${S.wrong.includes(i)?'wrong':''}" data-i="${i}" ${S.done||S.wrong.includes(i)?'disabled':''}><span class="k">${'アイウエ'[i]}</span>${optHTML(o)}</button>`).join('')}</div>
    ${S.hint&&!S.done?`<p class="hintbox">${hintText()}</p>`:''}
    ${S.done?'':`<p class="msg ${S.msgc||''}" id="msg">${S.msg||''}</p><div class="row"><button class="btn" id="hint" ${S.hint?'disabled':''}>ヒント</button></div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){
    showClear(`<div class="boardw">${hgSetup(P.a,P.b,{anim:'hgA'})}</div><p class="note" id="hgAL" style="text-align:center;color:var(--fg);font-weight:700;min-height:1.6em"></p>
      <div class="row" style="justify-content:center"><button class="btn" id="hgRe">もう一度まわす</button></div><p style="margin:0">${explain()}</p>`);
    const run=()=>hgRun('hgA',P.a,P.b);run();document.getElementById('hgRe').onclick=run;return;}
  app.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(same(S.opts[i],P.ans)){S.done=true;draw();}else{S.wrong.push(i);S.hints++;S.msg='ちがいます。もう一度考えてみよう。';S.msgc='ng';draw();}});
  document.getElementById('hint').onclick=()=>{S.hint=true;S.hints++;S.msg='';draw();};
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
