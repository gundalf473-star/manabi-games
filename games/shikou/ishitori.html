<title>石取りゲームの必勝法</title>
<meta name="game:subject" content="思考力">

<meta name="game:grade" content="小3〜">
<meta name="game:players" content="1人">
<meta name="description" content="コンピューターと交代に石を取り、最後の1個を取ったら勝ち（または負け）の対戦ゲーム。相手に「負けの数」を残す必勝法を見つける思考力パズル。5つのレベルから1問ずつ、全5問。">

<style>

:root[data-theme="dark"]{
  --bg:#15130f; --surface:#1e1b17; --fg:#ece6dc; --muted:#a59c90; --rule:#34302a;
  --ink:#b3a6f0; --seal:#b79cff; --sealsoft:#271c40; --ok:#4cc184; --oksoft:#1b3326; --ng:#f07468; --ngsoft:#3a2220; --gold:#e1b44a; --pick:#28241e; color-scheme:dark}

  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 64px}

.ob{border:2px solid var(--rule);background:var(--surface);border-radius:10px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px;justify-content:center}
.ob .k{align-self:flex-start;font-size:12px;font-weight:700;width:22px;height:22px;border-radius:50%;background:var(--pick);display:grid;place-items:center}

.views{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;align-items:flex-end}
.views figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.scales{display:flex;flex-direction:column;gap:2px;align-items:center;width:100%}
.hintbox{margin:0;font-size:14px;background:var(--sealsoft);border-radius:8px;padding:8px 12px}
.prog{min-height:52px;border:2px dashed var(--rule);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;background:#fbfaf6}
.prog .ph{color:var(--muted);font-size:13px}
.palette{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ccard,.pcard{border:2px solid #93c5fd;background:#eff6ff;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:#1e3a8a}
.pcard{align-self:flex-start;padding:3px 10px}
.ccard.loop,.pcard.loop{border-color:#fbbf24;background:#fffbeb;color:#92400e}
.ccard span,.pcard span{font-size:18px}

.itake{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

.ilog .you{background:var(--sealsoft);color:var(--ink)}
.ilog .cpu{background:var(--pick);color:var(--muted)}

<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>石取りゲームの必勝法</h1>
    <p class="lead">コンピューターと交代に石を取って、必ず勝てる取り方を見つけよう。5つのレベルから1問ずつ。ヒントややり直しなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=false;
let QS=[{"kind":"game","piles":[5],"take":[1,2],"mis":false,"first":"you","id":"1-01","lv":1},{"kind":"game","piles":[16],"take":[1,2,3],"mis":false,"first":"cpu","id":"2-01","lv":2},{"kind":"game","piles":[7],"take":[1,2,3],"mis":true,"first":"you","id":"3-01","lv":3},{"kind":"game","piles":[20],"take":[1,2,5],"mis":false,"first":"you","id":"4-01","lv":4},{"kind":"game","piles":[6,4],"take":null,"mis":false,"first":"you","id":"5-01","lv":5}];
const ID='ishitori';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>石取りゲームの必勝法 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* 石取りゲーム：kind='game'（piles:[N]か[a,b], take:[取れる数]かnull=何個でも, mis:最後を取ったら負け, first:'you'|'cpu'）'first'（最初の一手 a:[山,個数]）'pick'（負けの数 a） */
const HINTWORD='ヒントややり直し';
const LVD={1:'1〜2個・1〜3個取る',2:'石が多い・後手もある',3:'最後の1個を取ったら負け',4:'取れる数が決まっている',5:'2つの山・むずかしいルール'};
const RULES=`<ol class="rules">
  <li>コンピューターと<b>交代に</b>石を取るゲームです。パスはできません。</li>
  <li>1回に取れる数は、ステージごとに決まっています（例：1〜3個）。</li>
  <li>ふつうは<b>最後の1個を取った人が勝ち</b>。「最後の1個を取った人が<b>負け</b>」のステージもあります。</li>
  <li>コンピューターはミスをしません。でも、どのステージも<b>正しく取れば、あなたが必ず勝てる</b>ようにできています。</li>
  <li>負けたら「もう一度」。ヒントで<b>必勝法</b>の考え方がわかります（やり直しやヒントで星がへります）。</li>
  <li>ときどき、答えをえらぶ問題もあります。</li></ol>`;
const PN='AB';
let MEMO=new Map();
const tk=p=>p.take;
function legal(piles,take){const o=[];piles.forEach((n,pi)=>{const am=take?take.filter(a=>a<=n):Array.from({length:n},(_,i)=>i+1);am.forEach(a=>{const t=piles.slice();t[pi]-=a;o.push({pi,a,t});});});return o;}
function win(piles){const s=piles.reduce((a,b)=>a+b,0);if(s===0)return P.mis;const k=piles.join(',');if(MEMO.has(k))return MEMO.get(k);
  const r=legal(piles,tk(P)).some(m=>!win(m.t));MEMO.set(k,r);return r;}
const winMoves=piles=>legal(piles,tk(P)).filter(m=>!win(m.t));
const consec=t=>t&&t.every((a,i)=>a===i+1);
const takeText=()=>P.take===null?'<b>どちらか1つの山から、好きな数</b>（1個以上）':consec(P.take)?`<b>1〜${P.take.length}個</b>`:`<b>${P.take.join('個・')}個</b>のどれか`;
const endText=()=>P.mis?'<b>最後の1個を取った人が負け</b>':'<b>最後の1個を取った人が勝ち</b>';
const loseList=max=>{const o=[];for(let n=1;n<=max;n++)if(!win([n]))o.push(n);return o;};
function idea(full){
  /* 4択の問題のヒントでは、答えがそのまま見えないように、小さい「負けの数」だけを見せる */
  let N=Math.max(P.piles?P.piles[0]:P.hi||20,20);
  if(!full&&P.kind!=='game'&&P.take){const cap=P.kind==='pick'?P.lo-1:P.piles[0]-Math.max(...P.take)-1;const l=loseList(40);N=Math.max(cap,l[1]||1);}
  if(P.take===null)return `相手の番に、<b>2つの山が同じ数</b>になるように取ろう。そのあと相手がどちらかの山から取ったら、あなたは<b>もう1つの山から同じ数</b>だけ取る（まねっこ作戦）。そうすれば、最後の1個はかならずあなたが取れます。`;
  if(consec(P.take)){const k=P.take.length;
    if(!P.mis)return `相手の番に、のこりの石が <b>${k+1}の倍数</b>（${loseList(N).join('、')}…）になるように取ろう。相手が□個取ったら、あなたは「${k+1}－□」個取れば、また${k+1}の倍数にもどせます。`;
    return `最後の1個を相手に取らせれば勝ち。だから、相手の番に、のこりの石が <b>${k+1}の倍数＋1</b>（${loseList(N).join('、')}…）になるように取ろう。`;}
  return `相手の番に、のこりの石が <b>${loseList(N).join('、')}…</b> のどれかになるように取ろう。この数で自分の番が来ると、どう取っても負けてしまう「負けの数」です。${P.mis?'（このルールでは、1個のこりで番が来ると負けです）':''}小さい数から順に、勝ちか負けかを調べるとわかります。`;
}
function startStage(p){
  P=p;MEMO=new Map();S={hints:0,done:false,msg:'',msgc:'',wrong:[],hint:0,rec:null};
  if(p.kind==='game')resetGame();
  else S.opts=shuffle([p.a,...p.ds]);
  begin(p);draw();
  if(p.kind==='game'&&p.first==='cpu')cpuSoon();
}
function resetGame(){S.piles=P.piles.slice();S.turn=P.first;S.log=[];S.over=null;S.sel=0;S.rec=null;S.last=null;S.msg="";S.msgc="";}
function stonesSVG(){
  const two=S.piles.length>1;let o='',W=0,H=0;
  if(!two){const N=P.piles[0],n=S.piles[0],per=10,rows=Math.ceil(N/per);W=per*30+8;H=rows*30+8;
    for(let i=0;i<N;i++){const x=19+(i%per)*30,y=19+Math.floor(i/per)*30;
      o+=i<n?`<circle cx="${x}" cy="${y}" r="12" fill="#a8a29e" stroke="#57534e" stroke-width="2"/><circle cx="${x-4}" cy="${y-4}" r="3.5" fill="#fff" opacity=".55"/>`:`<circle cx="${x}" cy="${y}" r="11" fill="none" stroke="#d6d3d1" stroke-width="1.5" stroke-dasharray="3 3"/>`;}}
  else{const mx=Math.max(...P.piles);W=40+mx*30+8;H=2*44+8;
    S.piles.forEach((n,pi)=>{const y=26+pi*44,N=P.piles[pi];
      o+=`<rect x="2" y="${y-19}" width="${W-4}" height="38" rx="8" fill="${!S.done&&S.sel===pi&&S.turn==='you'&&!S.over?'#ede4fd':'transparent'}"/><text x="18" y="${y+7}" text-anchor="middle" font-size="20" font-weight="700" fill="#3b2f6b" font-family="sans-serif">${PN[pi]}</text>`;
      for(let i=0;i<N;i++){const x=48+i*30;o+=i<n?`<circle cx="${x}" cy="${y}" r="12" fill="${pi?'#93c5fd':'#fca5a5'}" stroke="${pi?'#1e40af':'#991b1b'}" stroke-width="2"/><circle cx="${x-4}" cy="${y-4}" r="3.5" fill="#fff" opacity=".55"/>`:`<circle cx="${x}" cy="${y}" r="11" fill="none" stroke="#d6d3d1" stroke-width="1.5" stroke-dasharray="3 3"/>`;}});}
  return `<svg id="bd" viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${Math.min(W*1.15,420)}px" role="img" aria-label="石">${o}</svg>`;
}
const remain=()=>S.piles.length>1?`Aの山 <b>${S.piles[0]}</b>個・Bの山 <b>${S.piles[1]}</b>個`:`のこり <b>${S.piles[0]}</b>個`;
const mvText=m=>S.piles.length>1?`${PN[m.pi]}の山から${m.a}個`:`${m.a}個`;
function ruleLine(withFirst){
  const st=P.piles?(P.piles.length>1?`石の山が2つ（Aが${P.piles[0]}個、Bが${P.piles[1]}個）`:`石が${P.piles[0]}個`):'';
  return `${st?st+'。':''}1回に${takeText()}取れます。${endText()}。`+(withFirst?(P.first==='you'?'<b>あなたが先手</b>（先に取る）です。':'<b>コンピューターが先手</b>、あなたは後手です。'):'');
}
function controls(){
  if(S.over||S.turn!=='you')return `<p class="msg">${S.over?'':'コンピューターが考えています…'}</p>`;
  const two=S.piles.length>1;
  if(!two){const n=S.piles[0];return `<div class="itake">${P.take.map(a=>`<button class="btn go" data-a="${a}" data-pi="0" ${a>n?'disabled':''}>${a}個取る</button>`).join('')}</div>`;}
  const n=S.piles[S.sel];
  return `<div class="row" style="justify-content:center"><span class="note">どの山から？</span>${S.piles.map((m,pi)=>`<button class="btn ${S.sel===pi?'on':''}" data-sel="${pi}" ${m?'':'disabled'}>${PN[pi]}の山</button>`).join('')}</div>
    <div class="itake">${Array.from({length:n},(_,i)=>i+1).map(a=>`<button class="btn go" data-a="${a}" data-pi="${S.sel}">${a}個</button>`).join('')}</div>`;
}
function drawGame(){
  const over=S.over==='lose';
  app.innerHTML=`${topBar()}
    <p class="qq" style="font-size:16px">${ruleLine(true)}</p>
    <div class="boardw" style="flex-direction:column;align-items:center">${stonesSVG()}<p class="note" style="font-size:15px">${remain()}</p></div>
    ${S.done?'':`<p class="msg ${S.msgc||''}" id="msg">${S.msg||(S.turn==='you'&&!S.over?'あなたの番です。何個取る？':'')}</p>${controls()}`}
    ${over?`<div class="row"><button class="btn go" id="retry">もう一度</button></div>`:''}
    ${S.hint&&!S.done?`<p class="hintbox">${idea()}${S.rec?`<br><b>おすすめ：いまは ${mvText(S.rec)} 取ろう。</b>`:S.hint>1&&S.recNone?'<br>いまは、必ず勝てる取り方がありません。相手のミスを待とう（またはもう一度やり直そう）。':''}</p>`:''}
    ${S.done?'':`<div class="row"><button class="btn" id="hint" ${S.turn!=='you'||S.over?'disabled':''}>${S.hint?'ヒント（次の一手）':'ヒント'}</button><button class="btn" id="restart">はじめから</button></div>`}
    <div class="ilog">${S.log.map(l=>`<span class="${l[0]}">${l[1]}</span>`).join('')}</div>
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(`<p style="margin:0">あなたの勝ち！ ${idea()}</p>`);return;}
  app.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{S.sel=+b.dataset.sel;draw();});
  app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>doMove('you',{pi:+b.dataset.pi,a:+b.dataset.a}));
  const h=document.getElementById('hint');if(h)h.onclick=()=>{S.hints++;S.hint++;if(S.hint>1){const w=winMoves(S.piles);S.rec=w[0]||null;S.recNone=!w.length;}S.msg='';draw();};
  const rs=document.getElementById('restart');if(rs)rs.onclick=()=>{if(S.log.length)S.hints++;resetGame();S.msg='';draw();if(P.first==='cpu')cpuSoon();};
  const rt=document.getElementById('retry');if(rt)rt.onclick=()=>{S.hints++;resetGame();S.msg='';draw();if(P.first==='cpu')cpuSoon();};
}
function doMove(who,m){
  if(S.over||S.done||S.turn!==who)return;
  S.piles[m.pi]-=m.a;S.rec=null;S.recNone=false;
  S.log.push([who,`${who==='you'?'あなた':'コンピューター'}：${mvText(m)}取った（${remain().replace(/<\/?b>/g,'')}）`]);
  if(S.piles.length>1&&!S.piles[S.sel])S.sel=S.piles.findIndex(n=>n>0);
  if(S.piles.every(n=>n===0)){const youWin=(who==='you')!==P.mis;
    if(youWin){S.done=true;}else{S.over='lose';S.msg=P.mis?(who==='you'?'最後の1個を取ってしまいました。あなたの負け…':'') :'コンピューターに最後の1個を取られました。あなたの負け…';
      if(!S.msg)S.msg='あなたの負け…';S.msgc='ng';}
    draw();return;}
  S.turn=who==='you'?'cpu':'you';S.msg='';draw();
  if(S.turn==='cpu')cpuSoon();
}
function cpuSoon(){const p=P,s=S;setTimeout(()=>{if(P!==p||S!==s||S.over||S.done||S.turn!=='cpu')return;
  const w=winMoves(S.piles),ms=w.length?w:legal(S.piles,tk(P));const m=ms[Math.floor(Math.random()*ms.length)];doMove('cpu',m);},750);}
/* ---- 4択の問題 ---- */
const optText=o=>P.kind==='pick'?o+'個':(P.piles.length>1?`${PN[o[0]]}の山から${o[1]}個`:o[1]+'個');
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
function qtext(){
  if(P.kind==='first')return `${ruleLine(false)}あなたが先手です。<b>必ず勝つには、最初に何個取ればよい？</b>`;
  return `1回に${takeText()}取れます。${endText()}。自分の番で、石が次の数だけのこっているとき、相手が正しく取ると<b>必ず負けてしまう</b>のはどれ？`;
}
function qexplain(){
  if(P.kind==='first'){const t=P.piles.slice();t[P.a[0]]-=P.a[1];
    return `${optText(P.a)}取ると、相手の番に ${t.length>1?`Aが${t[0]}個・Bが${t[1]}個`:t[0]+'個'} がのこります。これは相手にとって「負けの形」です。${idea(true)}`;}
  return `${P.a}個は「負けの数」です。どう取っても、相手に「負けの数」をわたされてしまいます。${idea(true)}`;
}
function drawQ(){
  app.innerHTML=`${topBar()}
    ${P.piles?`<div class="boardw" style="flex-direction:column;align-items:center">${stonesSVG()}</div>`:''}
    <p class="qq">${qtext()}</p>
    <div class="opts4 txt">${S.opts.map((o,i)=>`<button class="ob ${S.done&&same(o,P.a)?'right':''} ${S.wrong.includes(i)?'wrong':''}" data-i="${i}" ${S.done||S.wrong.includes(i)?'disabled':''}><span class="k">${'アイウエ'[i]}</span><b style="font-size:19px">${optText(o)}</b></button>`).join('')}</div>
    ${S.hint&&!S.done?`<p class="hintbox">${idea()}</p>`:''}
    ${S.done?'':`<p class="msg ${S.msgc||''}" id="msg">${S.msg||''}</p><div class="row"><button class="btn" id="hint" ${S.hint?'disabled':''}>ヒント</button></div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(`<p style="margin:0">${qexplain()}</p>`);return;}
  app.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(same(S.opts[i],P.a)){S.done=true;draw();}else{S.wrong.push(i);S.hints++;S.msg=P.kind==='pick'?'ちがいます。その数なら、相手に「負けの数」をわたす取り方があります。もう一度考えよう。':'ちがいます。その取り方だと、相手が勝ててしまいます。相手に「負けの形」をわたせる取り方を考えよう。';S.msgc='ng';draw();}});
  document.getElementById('hint').onclick=()=>{S.hint=1;S.hints++;S.msg='';draw();};
}
function draw(){
  if(P.kind==='game')return drawGame();
  if(P.kind==='first'){S.piles=P.piles.slice();S.sel=-1;}
  drawQ();
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
