<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>同じ形に分けよう 100問</h1>
    <p class="lead">マスの形を、色をぬって同じ形・同じ大きさに分けよう。5つのレベルに20問ずつ。ヒントなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=true;
let QS=[];
const ID='wakeru';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>同じ形に分けよう 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* 同じ形に分けよう：p={k:分ける数, n:1つ分のマス数, cells:[[r,c]…], sol:[[[r,c]…]…]（分け方の例）, nsol:分け方の数}
   色をえらんでマスをぬり、同じ色のマスを1つの形とする。マスの数・つながり・形（回す・裏返すと同じ）を調べるので、どんな正しい分け方でも正解。 */
const HINTWORD='ヒント';
const LVD={1:'2つに分ける（小さな形）',2:'2つ・3つに分ける',3:'3つ・4つに分ける',4:'3つ・4つに分ける（大きな形）',5:'4つ・5つに分ける（答えは1〜2通り）'};
const RULES=`<ol class="rules">
  <li>形を、<b>同じ形・同じ大きさ</b>の${'<b>いくつか</b>'}に分けよう。いくつに分けるかは、問題に書いてあります。</li>
  <li>色をえらんで、マスをタップ（またはなぞる）すると、ぬれます。<b>同じ色のマスが1つの形</b>になります。同じ色のマスをもう一度タップすると消えます。</li>
  <li>分けた形は、<b>回したり裏返したりして、ぴったり重なれば同じ形</b>です。1つの形のマスは、辺でつながっていないといけません。</li>
  <li>全部のマスをぬって、正しく分けられていればクリア。分け方は1通りとはかぎりません。</li></ol>`;
const WC=['#f87171','#60a5fa','#facc15','#4ade80','#c084fc'],WN=['あか','あお','きいろ','みどり','むらさき'];
const nsq=cs=>{const mr=Math.min(...cs.map(x=>x[0])),mc=Math.min(...cs.map(x=>x[1]));return cs.map(([r,c])=>[r-mr,c-mc]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);};
const canon=cs=>{const out=[];let cur=cs.map(x=>x.slice());for(let m=0;m<2;m++){for(let k=0;k<4;k++){out.push(nsq(cur).map(x=>x.join(',')).join(';'));cur=cur.map(([r,c])=>[c,-r]);}cur=cur.map(([r,c])=>[r,-c]);}return out.sort()[0];};
const conn=cs=>{if(!cs.length)return false;const s=new Set(cs.map(x=>x.join(','))),seen=new Set([cs[0].join(',')]),st=[cs[0]];
  while(st.length){const [r,c]=st.pop();[[r+1,c],[r-1,c],[r,c+1],[r,c-1]].forEach(q=>{const k=q.join(',');if(s.has(k)&&!seen.has(k)){seen.add(k);st.push(q);}});}return seen.size===cs.length;};
function startStage(p){P=p;S={hints:0,done:false,msg:'',msgc:'',col:0,c:{},lock:{}};begin(p);draw();}
const H=()=>Math.max(...P.cells.map(x=>x[0]))+1,W=()=>Math.max(...P.cells.map(x=>x[1]))+1;
const U=()=>Math.floor(Math.min(56,320/W(),380/H()));
const inR=(r,c)=>P.cells.some(x=>x[0]===r&&x[1]===c);
function groups(){const g=[];for(let i=0;i<P.k;i++)g.push([]);P.cells.forEach(([r,c])=>{const v=S.c[r+','+c];if(v!=null)g[v].push([r,c]);});return g;}
function boardSVG(){
  const u=U(),M=6,VW=W()*u+2*M,VH=H()*u+2*M,set=new Set(P.cells.map(x=>x.join(',')));let s='';
  P.cells.forEach(([r,c])=>{const v=S.c[r+','+c],x=M+c*u,y=M+r*u;
    s+=`<rect class="hit" data-k="${r},${c}" x="${x}" y="${y}" width="${u}" height="${u}" fill="${v==null?'#fffdf8':WC[v]}" stroke="#cfc5b3" stroke-width="1"/>`;
    if(S.lock[r+','+c])s+=`<circle cx="${x+u-8}" cy="${y+8}" r="3.5" fill="#fff" pointer-events="none"/>`;});
  /* 色のさかい目と、形のりんかく */
  P.cells.forEach(([r,c])=>{const v=S.c[r+','+c],x=M+c*u,y=M+r*u;
    [[0,1,`M${x+u},${y} V${y+u}`],[1,0,`M${x},${y+u} H${x+u}`],[0,-1,`M${x},${y} V${y+u}`],[-1,0,`M${x},${y} H${x+u}`]].forEach(([dr,dc,d])=>{
      const k=(r+dr)+','+(c+dc),out=!set.has(k),w=S.c[k];
      if(out)s+=`<path d="${d}" stroke="#2a2520" stroke-width="3.5" stroke-linecap="round" pointer-events="none"/>`;
      else if((dr>0||dc>0)&&v!=null&&w!=null&&v!==w)s+=`<path d="${d}" stroke="#2a2520" stroke-width="2.5" stroke-linecap="round" pointer-events="none"/>`;});});
  return `<svg id="bd" viewBox="0 0 ${VW} ${VH}" style="max-width:${VW}px" role="img" aria-label="分ける形">${s}</svg>`;
}
function statusHTML(){const g=groups();return g.map((x,i)=>`<span class="wk-st ${x.length===P.n?'ok':x.length>P.n?'ng':''}"><i style="background:${WC[i]}"></i>${x.length}/${P.n}</span>`).join('');}
function check(){
  const g=groups(),filled=P.cells.every(([r,c])=>S.c[r+','+c]!=null);
  if(!filled)return null;
  const bad=g.findIndex(x=>x.length!==P.n);
  if(bad>=0)return `${WN[bad]}のマスが${g[bad].length}こです。どの色も${P.n}こずつにしよう。`;
  const nc=g.findIndex(x=>!conn(x));
  if(nc>=0)return `${WN[nc]}のマスが、はなれています。1つの形は、辺でつながるようにしよう。`;
  const k0=canon(g[0]),d=g.findIndex(x=>canon(x)!==k0);
  if(d>=0)return `${WN[0]}と${WN[d]}の形がちがいます。回したり裏返したりしても重なりません。`;
  return 'ok';
}
function after(){
  const r=check();
  if(r==='ok'){S.done=true;draw();return;}
  S.msg=r||'';S.msgc=r?'ng':'';
  const bd=document.getElementById('bd');if(bd){bd.outerHTML=boardSVG();bindBoard();}
  const st=document.getElementById('st');if(st)st.innerHTML=statusHTML();
  const m=document.getElementById('msg');if(m){m.textContent=S.msg||'色をえらんで、マスをぬろう。';m.className='msg '+S.msgc;}
}
let PAINT=null;
function paint(k,first){
  if(!k)return;if(S.lock[k])return;
  if(first){PAINT=(S.c[k]===S.col)?'erase':'paint';}
  if(PAINT==='erase'){if(S.c[k]===S.col)delete S.c[k];}else S.c[k]=S.col;
}
function bindBoard(){
  const wr=document.querySelector('.boardw.wk-w');if(!wr||wr.dataset.b)return;wr.dataset.b='1';
  const keyAt=(x,y)=>{const e=document.elementFromPoint(x,y);return e&&e.classList&&e.classList.contains('hit')?e.dataset.k:null;};
  let last=null;
  wr.addEventListener('pointerdown',e=>{const k=keyAt(e.clientX,e.clientY);if(!k)return;e.preventDefault();try{wr.setPointerCapture(e.pointerId);}catch(_){}paint(k,true);last=k;after();});
  wr.addEventListener('pointermove',e=>{if(!PAINT)return;const k=keyAt(e.clientX,e.clientY);if(k&&k!==last){last=k;paint(k,false);after();}});
  const up=()=>{PAINT=null;last=null;};wr.addEventListener('pointerup',up);wr.addEventListener('pointercancel',up);
}
function pieceSVG(cs,u,col){const n=nsq(cs),h=Math.max(...n.map(x=>x[0]))+1,w=Math.max(...n.map(x=>x[1]))+1;
  return `<svg viewBox="-2 -2 ${w*u+4} ${h*u+4}" width="${w*u+4}" height="${h*u+4}" aria-hidden="true">${n.map(([r,c])=>`<rect x="${c*u}" y="${r*u}" width="${u}" height="${u}" fill="${col}" stroke="#2a2520" stroke-width="1.5"/>`).join('')}</svg>`;}
function explain(){
  const g=groups();
  return `<p style="margin:0">${P.k}つの同じ形に分けられました。1つ分の形は、この形です。</p><div class="row" style="justify-content:center">${pieceSVG(g[0],16,WC[0])}</div>
    <p class="note" style="margin:0">この形の分け方は、全部で <b>${P.nsol}通り</b> です${P.nsol>1?'（どれでも正解。左右や上下が反対になった分け方も、べつに数えています）':''}。</p>`;
}
function draw(){
  const LC=new Set(Object.keys(S.lock).map(k=>S.c[k]));if(LC.has(S.col)){const f=[...Array(P.k).keys()].find(i=>!LC.has(i));if(f!=null)S.col=f;}
  app.innerHTML=`${topBar()}
    <p class="qq">この形を、<b>同じ形の${P.k}つ</b>に分けよう。1つ分は<b>${P.n}マス</b>です。</p>
    <div class="boardw wk-w">${boardSVG()}</div>
    ${S.done?'':`<div class="row wk-pal">${WC.slice(0,P.k).map((x,i)=>`<button class="wk-c ${S.col===i?'on':''}" data-i="${i}" aria-label="${WN[i]}" ${LC.has(i)?'disabled':''}><span style="background:${x}"></span>${WN[i]}</button>`).join('')}</div>
    <div class="row wk-sts" id="st">${statusHTML()}</div>
    <p class="msg ${S.msgc||''}" id="msg">${S.msg||'色をえらんで、マスをぬろう。'}</p>
    <div class="row"><button class="btn" id="hint">ヒント</button><button class="btn" id="reset">やりなおす</button></div>
    <p class="note">ヒントを使うと、分け方の例から1つ分の形をぬります（星がへります）。</p>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(explain());return;}
  bindBoard();
  app.querySelectorAll('.wk-c').forEach(b=>b.onclick=()=>{S.col=+b.dataset.i;draw();});
  document.getElementById('reset').onclick=()=>{Object.keys(S.c).forEach(k=>{if(!S.lock[k])delete S.c[k];});S.msg='';S.msgc='';draw();};
  document.getElementById('hint').onclick=hint;
}
function hint(){
  /* まだヒントでぬっていない、例の形を1つぬる（その色の、ほかのマスは消す） */
  const used=new Set(Object.keys(S.lock).map(k=>S.lock[k]));
  const i=P.sol.findIndex((pc,j)=>!used.has(j+1));if(i<0||used.size>=P.k-1){S.msg='もうヒントはありません。';S.msgc='';draw();return;}
  const col=used.size; /* ヒントの形は あか→あお… の順 */
  Object.keys(S.c).forEach(k=>{if(S.c[k]===col&&!S.lock[k])delete S.c[k];});
  P.sol[i].forEach(([r,c])=>{const k=r+','+c;S.c[k]=col;S.lock[k]=i+1;});
  /* ヒントの色は使えなくする：ヒントで使った色をのぞいた最初の色をえらぶ */
  S.hints++;S.col=Math.min(P.k-1,col+1);
  S.msg=`ヒント：${WN[col]}で1つ分をぬりました（ヒント ${S.hints}回）。`;S.msgc='';
  const r=check();if(r==='ok'){S.done=true;}
  draw();
}

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
