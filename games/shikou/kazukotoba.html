.kz-w.sel{border-color:var(--seal);background:var(--sealsoft);box-shadow:0 0 0 3px var(--sealsoft)}

<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>数のことば</h1>
    <p class="lead">「一石二鳥」「三日坊主」。数が入ったことばの□をうめたり、意味をつないだり、ことばの数で計算したりしよう。5つのレベルから1問ずつ。ヒントやまちがいなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=false;
let QS=[{"id":"1-01","kind":"fill","t":"{一|いち|1}を{聞|き}いて{十|じゅう|10}を{知|し}る","b":[1],"a":"十","ds":["七","九","八"],"m":"少し聞いただけで、全体がわかるほどかしこいこと。","lv":1},{"id":"2-01","kind":"fill","t":"{四|し|4}{捨|しゃ}{五|ご|5}{入|にゅう}","b":[0,1],"a":"四・五","ds":["五・四","三・三","八・五"],"m":"はしたが4以下なら切り捨て、5以上なら切り上げること。","lv":2},{"id":"3-01","kind":"match","w":["{一|いっ|1}{石|せき}{二|に|2}{鳥|ちょう}","{二|に|2}{度|ど}あることは{三|さん|3}{度|ど}ある","{百|ひゃく|100}{聞|ぶん}は{一|いっ|1}{見|けん}にしかず"],"ms":["一つのことをして、二つのとくをすること。","二回あったことは、もう一回おこりやすい。","何回も話を聞くより、一回自分の目で見るほうがよくわかる。"],"lv":3},{"id":"4-01","kind":"calc","ws":[["{石|いし}の{上|うえ}にも{三|さん|3}{年|ねん}",0],["{百|ひゃく|100}{聞|ぶん}は{一|いっ|1}{見|けん}にしかず",1]],"f":["ア","+","イ"],"a":4,"ds":[3,2,5],"vs":[3,1],"ms":["つらくても、しんぼう強くつづければ、いつかはうまくいく。","何回も話を聞くより、一回自分の目で見るほうがよくわかる。"],"lv":4},{"id":"5-01","kind":"calc","ws":[["{一|いち|1}{難|なん}{去|さ}ってまた{一|いち|1}{難|なん}",1],["{一|いっ|1}{心|しん}{同体|どうたい}",0],["{千|せん|1000}{客|きゃく}{万|ばん|10000}{来|らい}",0]],"f":["ア","+","イ","+","ウ"],"a":1002,"ds":[1003,1011,1001],"vs":[1,1,1000],"ms":["一つのこまったことが終わったと思ったら、また次のこまったことがおこる。","二人以上の人が、心も体も一つのように強く結びついていること。","たくさんのお客が、次々にやって来ること。"],"lv":5}];
const ID='kazukotoba';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>数のことば 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* 数のことば：p={kind:'fill', t:ことば(トークン), b:[穴にする数の番号], a, ds, m:意味} / {kind:'calc', ws:[[ことば,穴の番号]…], f:式, a, ds, vs} / {kind:'match', w:[ことば…], ms:[意味…]}
   ことばの書き方：{漢字|よみ} はふりがな、{漢字|よみ|値} は数 */
const HINTWORD='ヒントやまちがい';
const LVD={1:'□に入る数は？',2:'□が2つ・大きな数も',3:'ことばと意味をつなごう（3組）',4:'ことばの数で計算しよう',5:'3つのことばで計算・4組つなぐ'};
const RULES=`<ol class="rules">
  <li>「一石二鳥」「三日坊主」のように、<b>数が入ったことば</b>のパズルです。</li>
  <li><b>穴うめ</b>：□（ア・イ）に入る数を、4つの中からえらぼう。</li>
  <li><b>意味あわせ</b>：ことばをタップしてから、そのことばの<b>意味</b>をタップ。全部つなげたらクリア。</li>
  <li><b>計算</b>：ことばの□に入る数を思いうかべて、式の答えをえらぼう。</li>
  <li>まちがえたり、ヒントを使ったりすると、星がへります。クリアすると、ことばの意味がわかります。</li></ol>`;
const KZT=/\{([^|}]+)\|([^|}]+)(?:\|(\d+))?\}|[^{]+/g;
const LB='アイウ';
/* bl: {数の番号: ラベル}。ラベルがあれば、その数を□にする */
function kzHTML(t,bl){let k=0,out='';
  for(const m of t.matchAll(KZT)){
    if(m[1]===undefined){out+=esc(m[0]);continue;}
    if(m[3]!==undefined){const lab=bl&&bl[k];k++;
      if(lab!==undefined){out+=`<span class="kz-b">${lab}</span>`;continue;}}
    out+=`<ruby>${esc(m[1])}<rt>${esc(m[2])}</rt></ruby>`;}
  return out;}
const kzPlain=t=>t.replace(/\{([^|}]+)\|[^}]+\}/g,'$1');
const OPS={'+':'＋','-':'−','x':'×','/':'÷','(':'（',')':'）'};
const fstr=f=>f.map(c=>OPS[c]||c).join(' ');
const fnum=n=>Number(n).toLocaleString('ja-JP');
function startStage(p){
  P=p;S={hints:0,done:false,msg:'',msgc:'',wrong:[],hint:0,got:[],sel:null,bad:null};
  if(p.kind==='match'){S.W=shuffle(p.w.map((x,i)=>i));S.M=shuffle(p.ms.map((x,i)=>i));}
  else S.opts=shuffle([p.a,...p.ds]);
  begin(p);draw();
}
function optLabel(o){
  if(P.kind==='calc')return `<b class="kz-on">${fnum(o)}</b>`;
  const parts=String(o).split('・');
  if(parts.length===1)return `<b class="kz-ok">${esc(o)}</b>`;
  return `<span class="kz-pair">${parts.map((x,i)=>`<span><i>${LB[i]}</i><b>${esc(x)}</b></span>`).join('')}</span>`;
}
function fillHTML(){
  const bl={};P.b.forEach((k,i)=>bl[k]=P.b.length>1?LB[i]:'');
  return `<div class="kz-card"><div class="kz-ex">${kzHTML(P.t,bl)}</div></div>
    <p class="qq">${P.b.length>1?'ア・イに入る数の組み合わせは？':'□に入る数は？'}</p>`;
}
function calcHTML(){
  return `<div class="kz-list">${P.ws.map(([t,i],k)=>`<div class="kz-card sm"><span class="kz-lab">${LB[k]}</span><div class="kz-ex">${kzHTML(t,S.hint>k||S.done?{}:{[i]:LB[k]})}</div></div>`).join('')}</div>
    <p class="qq">${P.ws.length===3?'ア・イ・ウ':'ア・イ'}に入る数を使って計算しよう。<br><span class="kz-f">${fstr(P.f)} ＝ ？</span></p>`;
}
function calcEx(){ /* 値の入った式 */
  return fstr(P.f.map(c=>LB.includes(c)?fnum(P.vs[LB.indexOf(c)]):c))+' ＝ '+fnum(P.a);
}
function matchHTML(){
  const num=i=>S.got.indexOf(i)+1;
  return `<p class="qq">ことばをタップしてから、その<b>意味</b>をタップしよう。</p>
  <div class="kz-words">${S.W.map(i=>{const n=num(i);return `<button class="kz-w ${n?'got':''} ${S.sel===i?'sel':''}" data-i="${i}" ${n?'disabled':''}>${n?`<i>${n}</i>`:''}${kzHTML(P.w[i])}</button>`;}).join('')}</div>
  <div class="label">意味</div>
  <div class="kz-means">${S.M.map(i=>{const n=num(i);return `<button class="kz-m ${n?'got':''} ${S.bad===i?'bad':''}" data-i="${i}" ${n?'disabled':''}>${n?`<i>${n}</i>`:''}${esc(P.ms[i])}</button>`;}).join('')}</div>`;
}
function hintText(){
  if(P.kind==='fill')return `ヒント：このことばの意味は「${esc(P.m)}」です。${P.b.length>1?'2つの数の順番にも気をつけよう。':''}`;
  return '';
}
function explainHTML(){
  if(P.kind==='fill')return `<div class="kz-done"><div class="kz-ex">${kzHTML(P.t)}</div><p>${esc(P.m)}</p></div>`;
  if(P.kind==='calc')return `<p style="margin:0;font-weight:700">${calcEx()}</p>`+P.ws.map(([t,i],k)=>`<div class="kz-done"><div class="kz-ex"><span class="kz-lab">${LB[k]}</span>${kzHTML(t)}</div><p>${LB[k]}は ${fnum(P.vs[k])}。${esc(P.ms[k])}</p></div>`).join('');
  return P.w.map((t,i)=>`<div class="kz-done"><div class="kz-ex">${kzHTML(t)}</div><p>${esc(P.ms[i])}</p></div>`).join('');
}
function draw(){
  const p=P;
  let body;
  if(p.kind==='match')body=matchHTML();
  else body=(p.kind==='fill'?fillHTML():calcHTML())+`<div class="opts4 txt">${S.opts.map((o,i)=>`<button class="ob ${S.done&&o===p.a?'right':''} ${S.wrong.includes(i)?'wrong':''}" data-i="${i}" ${S.done||S.wrong.includes(i)?'disabled':''}>${optLabel(o)}</button>`).join('')}</div>`;
  const hb=p.kind==='fill'&&S.hint&&!S.done?`<p class="hintbox">${hintText()}</p>`:'';
  const hnote=p.kind==='fill'?'ヒントで意味がわかります':p.kind==='calc'?'ヒントで□の数が1つずつわかります':'ヒントで1組つながります';
  app.innerHTML=`${topBar()}${body}${hb}
    ${S.done?'':`<p class="msg ${S.msgc}" id="msg">${S.msg}</p>
    <div class="row"><button class="btn" id="hint" ${(p.kind==='fill'&&S.hint)||(p.kind==='calc'&&S.hint>=p.ws.length)?'disabled':''}>ヒント</button><span class="note">${hnote}（星がへります）</span></div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(explainHTML());return;}
  document.getElementById('hint').onclick=()=>{
    S.hints++;S.hint++;S.msgc='';
    if(p.kind==='calc'){const k=S.hint-1;S.msg=`ヒント：${LB[k]}に入る数は「${fnum(p.vs[k])}」です。`;}
    else if(p.kind==='match'){const k=[...p.w.keys()].find(i=>!S.got.includes(i));S.got.push(k);S.sel=null;S.bad=null;
      S.msg=`ヒント：「${kzPlain(p.w[k])}」をつなぎました。`;if(S.got.length===p.w.length)S.done=true;}
    else S.msg='';
    draw();};
  if(p.kind==='match'){
    app.querySelectorAll('.kz-w').forEach(b=>b.onclick=()=>{S.sel=+b.dataset.i;S.bad=null;S.msg=`「${kzPlain(p.w[S.sel])}」の意味をタップしよう。`;S.msgc='';draw();});
    app.querySelectorAll('.kz-m').forEach(b=>b.onclick=()=>{
      if(S.sel==null){S.msg='先に、上のことばをタップしよう。';S.msgc='';draw();return;}
      const j=+b.dataset.i;
      if(j===S.sel){S.got.push(j);S.sel=null;S.bad=null;S.msg='せいかい！';S.msgc='ok';if(S.got.length===p.w.length)S.done=true;}
      else{S.hints++;S.bad=j;S.msg=`「${kzPlain(p.w[S.sel])}」の意味ではありません。もう一度考えよう。`;S.msgc='ng';}
      draw();});
    return;
  }
  app.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
    if(S.opts[i]===p.a){S.done=true;draw();}
    else{S.wrong.push(i);S.hints++;S.msg='ちがいます。もう一度考えてみよう。';S.msgc='ng';draw();}});
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
