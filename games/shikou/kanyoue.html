<title>体のことばの慣用句</title>
<meta name="game:subject" content="思考力">
<meta name="game:unit" content="ことば遊び">

<style>

}

:root[data-theme="dark"]{

  --ink:#b3a6f0; --seal:#b79cff; --sealsoft:#271c40; --ok:#4cc184; --oksoft:#1b3326; --ng:#f07468; --ngsoft:#3a2220; --gold:#e1b44a; --pick:#28241e; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.75;

.ky-card{background:var(--bg);border:1px solid var(--rule);border-left:6px solid var(--seal);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}

#body .ky-chip.ng text{fill:#c8352d}
.ob svg{display:block}

<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>体のことばの慣用句</h1>
    <p class="lead">「顔が広い」「手を焼く」「耳が痛い」。（　）に入る体の部分を、人の絵でタップしよう。意味や場面に合う慣用句もえらぼう。5つのレベルから1問ずつ。ヒントやまちがいなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=false;
let QS=[{"kind":"tap","rest":"を長くする","mean":"今か今かと 楽しみにまつ","a":"首","yomi":"くび","ex":"「首を長くする」は「今か今かと 楽しみにまつ」という意味です。","lv":1,"id":"1-01"},{"kind":"tap","rest":"が下がる","mean":"感心して、うやまう気持ちになる","a":"頭","yomi":"あたま","ex":"「頭が下がる」は「感心して、うやまう気持ちになる」という意味です。","lv":2,"id":"2-01"},{"kind":"tap","rest":"を並べる","mean":"同じくらいの力をもつ","a":"肩","yomi":"かた","ex":"「肩を並べる」は「同じくらいの力をもつ」という意味です。","lv":3,"id":"3-01"},{"kind":"sit","s":"おばあさんは、本当に よいやきものを すぐに見分けられる。","a":"目が高い","ds":["目がない","目を通す","目に余る"],"ex":"「目が高い」は「よいものを 見分ける力がある」という意味です。ほかの3つも同じ体の部分ですが、意味がちがいます。","lv":4,"id":"4-01"},{"kind":"pair2","items":[["をかかえる","がまんできずに 大わらいする"],["をわる","本当の気持ちを かくさずに話す"]],"a":"腹","ds":["頭","足","肩"],"ex":"「腹をかかえる」（がまんできずに 大わらいする）と「腹をわる」（本当の気持ちを かくさずに話す）。どちらも「腹（はら）」が入ります。","lv":5,"id":"5-01"}];
const ID='kanyoue';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>体のことばの慣用句 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* 体のことばの慣用句：p={kind:'tap'(rest,mean,a:体の部分), 'mean'(w→a:意味), 'sit'(s:場面→a:慣用句), 'use'(w→a:場面), 'pair2'(items:[[うしろ,意味]×2]→a:体の部分)} */
const HINTWORD='ヒントやまちがい';
const LVD={1:'やさしい慣用句をタップ',2:'タップ・意味・場面',3:'場面に合う慣用句',4:'同じ体の部分で意味のちがい',5:'2つに入る体の部分'};
const RULES=`<ol class="rules">
  <li>「顔が広い」「手を焼く」のように、<b>体の部分</b>を使って、もとの意味とはちがう意味をあらわすことばを<b>慣用句</b>といいます。</li>
  <li>「（　）が広い」のような問題では、意味を読んで、<b>人の絵の体の部分</b>（または名前の札）をタップしよう。</li>
  <li>ほかの問題は、4つの中から えらびます。</li>
  <li>ヒントを見たり、まちがえたりすると、星がへります。</li></ol>`;
const KY={'頭':'あたま','顔':'かお','目':'め','耳':'みみ','鼻':'はな','口':'くち','首':'くび','肩':'かた','胸':'むね','腹':'はら','腕':'うで','手':'て','足':'あし','歯':'は','舌':'した','へそ':'へそ'};
/* 札の位置 [体の部分, 左右, 札のy, 線の先x, 線の先y] */
const KCHIP=[['頭','L',18,150,50],['耳','L',62,126,78],['口','L',106,168,106],['肩','L',150,130,148],['腕','L',196,114,196],['手','L',242,98,252],['足','L',314,152,318],
  ['顔','R',18,214,96],['目','R',62,204,75],['鼻','R',106,186,90],['首','R',150,190,126],['胸','R',196,204,170],['腹','R',242,204,236]];
function bodySVG(){
  const st=pt=>{const w=S.wrong.includes(pt),ok=S.done&&pt===P.a;return {w,ok};};
  const R_=(pt,el)=>{const {w,ok}=st(pt);return el.replace('<',`<`).replace(/\/?>$/,` data-part="${pt}" class="ky-p ${w?'ng':''} ${ok?'ok':''}"/>`);};
  let s='';
  /* 体（下から順に重ねる） */
  s+=R_('足','<path d="M150 266 h26 v92 h-26 z M184 266 h26 v92 h-26 z M140 352 q0 -8 22 -8 q16 0 16 12 h-38 z M182 356 q0 -12 16 -12 q22 0 22 8 v4 h-38 z" fill="#475569"/>');
  s+=R_('腕','<path d="M126 140 l18 12 l-22 86 l-20 -6 z M234 140 l-18 12 l22 86 l20 -6 z" fill="#93c5fd" stroke="#3b6fb6" stroke-width="1.5"/>');
  s+=R_('手','<path d="M106 250 m-14 0 a14 14 0 1 0 28 0 a14 14 0 1 0 -28 0 M254 250 m-14 0 a14 14 0 1 0 28 0 a14 14 0 1 0 -28 0" fill="#fde2c4" stroke="#b07a4a" stroke-width="1.5"/>');
  s+=R_('腹','<path d="M144 202 h72 l-4 66 h-64 z" fill="#60a5fa" stroke="#3b6fb6" stroke-width="1.5"/>');
  s+=R_('胸','<path d="M140 136 h80 l-4 66 h-72 z" fill="#93c5fd" stroke="#3b6fb6" stroke-width="1.5"/>');
  s+=R_('肩','<path d="M118 150 q0 -16 24 -16 h4 v22 h-28 z M242 150 q0 -16 -24 -16 h-4 v22 h28 z" fill="#bfdbfe" stroke="#3b6fb6" stroke-width="1.5"/>');
  s+=R_('首','<path d="M168 112 h24 v26 h-24 z" fill="#f6cfa6" stroke="#b07a4a" stroke-width="1.5"/>');
  s+=R_('耳','<path d="M132 78 m-8 0 a8 12 0 1 0 16 0 a8 12 0 1 0 -16 0 M228 78 m-8 0 a8 12 0 1 0 16 0 a8 12 0 1 0 -16 0" fill="#f6cfa6" stroke="#b07a4a" stroke-width="1.5"/>');
  s+=R_('顔','<circle cx="180" cy="74" r="46" fill="#fde2c4" stroke="#b07a4a" stroke-width="1.5"/>');
  s+=R_('頭','<path d="M134 70 A46 46 0 0 1 226 70 Q212 46 180 50 Q150 46 134 70 Z" fill="#5b3a1e"/>');
  /* 目・鼻・口（見た目＋タップしやすい大きめの範囲） */
  s+=`<circle cx="163" cy="76" r="5" fill="#2a2520" pointer-events="none"/><circle cx="197" cy="76" r="5" fill="#2a2520" pointer-events="none"/>`;
  s+=R_('目','<path d="M163 76 m-12 0 a12 10 0 1 0 24 0 a12 10 0 1 0 -24 0 M197 76 m-12 0 a12 10 0 1 0 24 0 a12 10 0 1 0 -24 0" fill="transparent"/>');
  s+=`<path d="M180 80 l-5 12 h10 z" fill="#e8b48a" stroke="#b07a4a" stroke-width="1.2" pointer-events="none"/>`;
  s+=R_('鼻','<circle cx="180" cy="88" r="8" fill="transparent"/>');
  s+=`<path d="M168 102 q12 10 24 0" fill="none" stroke="#b91c1c" stroke-width="3" stroke-linecap="round" pointer-events="none"/>`;
  s+=R_('口','<ellipse cx="180" cy="105" rx="15" ry="8" fill="transparent"/>');
  /* 札と線 */
  KCHIP.forEach(([pt,side,y,tx,ty])=>{const x=side==='L'?4:286,{w,ok}=st(pt),ex=side==='L'?x+70:x;
    s+=`<line x1="${ex}" y1="${y+16}" x2="${tx}" y2="${ty}" stroke="${ok?'#1d7a4c':'#a59c90'}" stroke-width="${ok?2.5:1.2}" pointer-events="none"/><circle cx="${tx}" cy="${ty}" r="3" fill="${ok?'#1d7a4c':'#a59c90'}" pointer-events="none"/>`;
    s+=`<g data-part="${pt}" class="ky-chip ${w?'ng':''} ${ok?'ok':''}"><rect x="${x}" y="${y}" width="70" height="32" rx="8"/><text x="${x+20}" y="${y+23}" text-anchor="middle" font-size="19" font-weight="700">${pt}</text><text x="${x+50}" y="${y+21}" text-anchor="middle" font-size="11">${KY[pt]}</text></g>`;});
  return `<svg id="body" viewBox="0 0 360 372" style="width:100%;max-width:400px" role="img" aria-label="体の部分の絵">${s}</svg>`;
}
function startStage(p){
  P=p;S={hints:0,done:false,msg:'',msgc:'',hint:false,wrong:[]};
  if(p.kind!=='tap')S.opts=shuffle([p.a,...p.ds]);
  begin(p);draw();
}
const blank=(rest,fill)=>`<span class="ky-blank ${fill?'on':''}">${fill?esc(fill):'？'}</span>${esc(rest)}`;
function card(){
  const p=P;
  if(p.kind==='tap')return `<div class="ky-card"><div class="ky-big">${blank(p.rest,S.done?p.a:'')}</div><p class="ky-mean">意味：${esc(p.mean)}</p></div><p class="qq">（　）に入る<b>体の部分</b>を、絵か札でタップしよう。</p>`;
  if(p.kind==='mean')return `<div class="ky-card"><div class="ky-big">${esc(p.w)}</div></div><p class="qq">この慣用句の<b>意味</b>は どれ？</p>`;
  if(p.kind==='use')return `<div class="ky-card"><div class="ky-big">${esc(p.w)}</div></div><p class="qq">この慣用句が いちばんぴったり合う<b>場面</b>は どれ？</p>`;
  if(p.kind==='sit')return `<div class="ky-card"><p class="ky-sit">${esc(p.s)}</p></div><p class="qq">この場面に いちばん合う<b>慣用句</b>は どれ？</p>`;
  return `<div class="ky-card">${p.items.map(([r,m])=>`<div><div class="ky-big" style="text-align:left">${blank(r,S.done?p.a:'')}</div><p class="ky-mean">意味：${esc(m)}</p></div>`).join('')}</div><p class="qq">2つの（　）には、<b>同じ体の部分</b>が入ります。どれ？</p>`;
}
function hintText(){
  const p=P;
  if(p.kind==='tap')return `答えの体の部分は、ひらがなで「${'○'.repeat(p.yomi.length)}」の${p.yomi.length}文字です。その意味のとき、体のどこが どうなるようすか 思いうかべてみよう。`;
  if(p.kind==='mean'||p.kind==='use')return '体の部分が「どうなる」と言っているかを思いうかべよう。たとえば「首を長くする」は、首をのばして遠くを見ながら まっているようすから来ています。';
  if(p.kind==='sit')return 'その場面の人は、どんな気持ち？　「おこる」「ほっとする」「こまる」など、気持ちをひとことで言ってから、同じ意味の慣用句をさがそう。';
  return `答えは、ひらがなで ${KY[p.a].length}文字の体の部分です。片方の慣用句だけに合う部分は まちがいです。2つとも 意味に合うものをさがそう。`;
}
function draw(){
  const p=P,tap=p.kind==='tap';
  app.innerHTML=`${topBar()}${card()}
    ${tap?`<div class="boardw">${bodySVG()}</div>`:`<div class="opts4 txt ${p.kind==='use'?'ky-one':''}">${S.opts.map((o,i)=>`<button class="ob ${S.done&&o===p.a?'right':''} ${S.wrong.includes(i)?'wrong':''}" data-i="${i}" ${S.done||S.wrong.includes(i)?'disabled':''}><span class="k">${'アイウエ'[i]}</span><b class="${p.kind==='sit'||p.kind==='pair2'?'ky-o':'ky-ot'}">${esc(o)}${p.kind==='pair2'?`<small>（${KY[o]}）</small>`:''}</b></button>`).join('')}</div>`}
    ${S.hint&&!S.done?`<p class="hintbox">${hintText()}</p>`:''}
    ${S.done?'':`<p class="msg ${S.msgc}" id="msg">${S.msg||(tap?'体の部分をタップしよう。':'4つの中からえらぼう。')}</p><div class="row"><button class="btn" id="hint" ${S.hint?'disabled':''}>ヒント</button></div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(`<p style="margin:0">${p.kind==='tap'?`<b>${esc(p.a+p.rest)}</b>（${KY[p.a]}${esc(p.rest)}）<br>`:''}${esc(p.ex)}</p>`);return;}
  document.getElementById('hint').onclick=()=>{S.hint=true;S.hints++;S.msg='';S.msgc='';draw();};
  if(tap){
    document.getElementById('body').addEventListener('click',e=>{const el=e.target.closest('[data-part]');if(!el)return;const pt=el.dataset.part;
      if(S.wrong.includes(pt))return;
      if(pt===p.a)S.done=true;else{S.wrong.push(pt);S.hints++;S.msg=`「${pt}${p.rest}」ではありません。もう一度考えよう。`;S.msgc='ng';}
      draw();});
    return;
  }
  app.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
    if(S.opts[i]===p.a)S.done=true;else{S.wrong.push(i);S.hints++;S.msg='ざんねん！ もう一度考えてみよう。';S.msgc='ng';}draw();});
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
