<style>
/* Layout: 1列。上に盤、下に操作。紫を差し色に（思考力シリーズ） */

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --ink:#b3a6f0; --seal:#b79cff; --sealsoft:#271c40; --ok:#4cc184; --oksoft:#1b3326; --ng:#f07468; --ngsoft:#3a2220; --gold:#e1b44a; --pick:#28241e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15130f; --surface:#1e1b17; --fg:#ece6dc; --muted:#a59c90; --rule:#34302a;
  --ink:#b3a6f0; --seal:#b79cff; --sealsoft:#271c40; --ok:#4cc184; --oksoft:#1b3326; --ng:#f07468; --ngsoft:#3a2220; --gold:#e1b44a; --pick:#28241e; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 64px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,7.5vw,40px);line-height:1.15;margin:0;color:var(--ink)}

.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.back{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;padding:0;margin-left:auto}

.boardw svg{width:100%;height:auto;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

.msg.ok{color:var(--ok);font-weight:700} .msg.ng{color:var(--ng);font-weight:700}

.ob .k{align-self:flex-start;font-size:12px;font-weight:700;width:22px;height:22px;border-radius:50%;background:var(--pick);display:grid;place-items:center}
.ob:hover:not(:disabled){border-color:var(--ink)}
.ob.right{border-color:var(--ok);background:var(--oksoft)} .ob.wrong{border-color:var(--ng);background:var(--ngsoft);opacity:.6}

.views{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;align-items:flex-end}
.views figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.scales{display:flex;flex-direction:column;gap:2px;align-items:center;width:100%}
.hintbox{margin:0;font-size:14px;background:var(--sealsoft);border-radius:8px;padding:8px 12px}

.prog .ph{color:var(--muted);font-size:13px}
.palette{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ccard,.pcard{border:2px solid #93c5fd;background:#eff6ff;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:#1e3a8a}
.pcard{align-self:flex-start;padding:3px 10px}
.ccard.loop,.pcard.loop{border-color:#fbbf24;background:#fffbeb;color:#92400e}
.ccard span,.pcard span{font-size:18px}
.ccard:disabled,.pcard:disabled{opacity:.45;cursor:default}
@media (max-width:420px){.boardw{margin:0 -10px;padding:4px}}
</style>

<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>たし算クロス 100問</h1>
    <p class="lead">白いマスに1〜9を入れて、たてと横の合計を合わせよう。5つのレベルに20問ずつ。ヒントなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=true;
let QS=[];
const ID='tashicross';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>たし算クロス 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* たし算クロス：p={b:[行の文字列（'#'黒・'.'白）], cl:[[r,c,たての合計,横の合計]]（0はなし）, sol:[[数]]} */
const HINTWORD='ヒント';
const LVD={1:'2×2・2×3 ・ 小さい数',2:'3×3・3×4',3:'4×4',4:'5×5',5:'6×6'};
const TU=60;
let TRUNS=null;
function tRuns(){
  const b=P.b,H=b.length,W=b[0].length,clue={},out=[];
  P.cl.forEach(([r,c,d,a])=>{clue[r+','+c]=[d,a];});
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){if(b[r][c]!=='#')continue;const k=clue[r+','+c];if(!k)continue;
    if(k[1]){const cs=[];for(let x=c+1;x<W&&b[r][x]==='.';x++)cs.push([r,x]);out.push({d:'a',r,c,s:k[1],cs});}
    if(k[0]){const cs=[];for(let y=r+1;y<H&&b[y][c]==='.';y++)cs.push([y,c]);out.push({d:'d',r,c,s:k[0],cs});}}
  return out;
}
function startStage(p){P=p;TRUNS=tRuns();const H=p.b.length,W=p.b[0].length;
  let sel=null;for(let r=0;r<H&&!sel;r++)for(let c=0;c<W;c++)if(p.b[r][c]==='.'){sel=[r,c];break;}
  S={g:Array.from({length:H},()=>Array(W).fill(0)),lock:Array.from({length:H},()=>Array(W).fill(false)),sel,hints:0,done:false,msg:'',msgc:'',chk:{}};begin(p);draw();}
const tIn=(run,r,c)=>run.cs.some(q=>q[0]===r&&q[1]===c);
function tState(run){const v=run.cs.map(([r,c])=>S.g[r][c]),f=v.filter(x=>x);
  const dup=new Set(f).size<f.length, full=f.length===v.length, sum=f.reduce((a,b)=>a+b,0);
  return {dup,full,sum,ok:full&&!dup&&sum===run.s,bad:dup||(full&&sum!==run.s)||sum>run.s};}
function tDup(r,c){const v=S.g[r][c];if(!v)return false;return TRUNS.some(run=>tIn(run,r,c)&&run.cs.some(([y,x])=>(y!==r||x!==c)&&S.g[y][x]===v));}
function tSolved(){return TRUNS.every(run=>tState(run).ok);}
function tBoard(){
  const b=P.b,H=b.length,W=b[0].length,U=TU;let s='';
  /* 大きい盤はスマホで小さく見えるので、合計の数字を大きめにする */
  const FS=W>=6?25:21,CR=W>=6?18:15;
  const st={};TRUNS.forEach(run=>{st[run.d+run.r+','+run.c]=tState(run);});
  const selRuns=S.sel?TRUNS.filter(run=>tIn(run,S.sel[0],S.sel[1])):[];
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){const x=c*U,y=r*U;
    if(b[r][c]==='#'){
      const cl=P.cl.find(q=>q[0]===r&&q[1]===c);
      if(!cl){s+=`<rect x="${x}" y="${y}" width="${U}" height="${U}" fill="#5b5470"/>`;continue;}
      s+=`<rect x="${x}" y="${y}" width="${U}" height="${U}" fill="#e6e0f3"/><line x1="${x}" y1="${y}" x2="${x+U}" y2="${y+U}" stroke="#8b80b0" stroke-width="2"/>`;
      if(!cl[3])s+=`<polygon points="${x},${y} ${x+U},${y} ${x+U},${y+U}" fill="#5b5470"/>`;
      if(!cl[2])s+=`<polygon points="${x},${y} ${x},${y+U} ${x+U},${y+U}" fill="#5b5470"/>`;
      for(const [k,v,tx,ty] of [['a',cl[3],x+U*.7,y+U*.42],['d',cl[2],x+U*.3,y+U*.86]]){if(!v)continue;
        const t=st[k+r+','+c],hl=selRuns.some(run=>run.d===k&&run.r===r&&run.c===c);
        const col=t.ok?'#1d7a4c':t.bad?'#c8352d':'#3b2f6b';
        if(hl)s+=`<circle cx="${tx}" cy="${ty-FS/3}" r="${CR}" fill="#fff" stroke="#7c3aed" stroke-width="2.5"/>`;
        s+=`<text x="${tx}" y="${ty}" text-anchor="middle" font-size="${FS}" font-weight="700" fill="${col}" font-family="sans-serif">${v}</text>`;}
      continue;}
    const v=S.g[r][c],sel=S.sel&&S.sel[0]===r&&S.sel[1]===c,inSel=selRuns.some(run=>tIn(run,r,c)),dup=tDup(r,c),wr=S.chk[r+','+c];
    s+=`<rect x="${x+1}" y="${y+1}" width="${U-2}" height="${U-2}" rx="4" fill="${wr?'#f8e3e1':S.lock[r][c]?'#efe9fb':inSel?'#f3effc':'#fff'}" stroke="#bdb4a6" stroke-width="1.5"/>`;
    if(v)s+=`<text x="${x+U/2}" y="${y+U*.7}" text-anchor="middle" font-size="${U*.52}" font-weight="700" fill="${dup||wr?'#c8352d':S.lock[r][c]?'#7c3aed':'#2a2520'}" font-family="sans-serif">${v}</text>`;
    if(wr)s+=`<line x1="${x+8}" y1="${y+U-8}" x2="${x+U-8}" y2="${y+8}" stroke="#c8352d" stroke-width="2" opacity=".5"/>`;
    if(sel)s+=`<rect x="${x+3}" y="${y+3}" width="${U-6}" height="${U-6}" rx="5" fill="none" stroke="#7c3aed" stroke-width="4"/>`;
    s+=`<rect class="hit" data-r="${r}" data-c="${c}" x="${x}" y="${y}" width="${U}" height="${U}" fill="transparent" style="cursor:pointer"/>`;}
  s+=`<rect x="1" y="1" width="${W*U-2}" height="${H*U-2}" fill="none" stroke="#3b2f6b" stroke-width="2"/>`;
  return `<svg id="bd" viewBox="0 0 ${W*U} ${H*U}" style="max-width:${Math.min(W*U,420)}px" role="img" aria-label="たし算クロスの盤">${s}</svg>`;
}
function tSelInfo(){
  if(!S.sel)return '白いマスをえらんで、数字を入れよう。';
  return TRUNS.filter(run=>tIn(run,S.sel[0],S.sel[1])).map(run=>{const t=tState(run);
    return `${run.d==='a'?'横':'たて'}：${run.cs.length}マスで合計 <b>${run.s}</b>（今 ${t.sum}）`;}).join('　');
}
function draw(){
  app.innerHTML=`${topBar()}
    <div class="boardw">${tBoard()}</div>
    ${S.done?'':`<p class="msg" style="text-align:center;color:var(--fg)">${tSelInfo()}</p>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(i=>`<button data-v="${i}">${i}</button>`).join('')}<button data-v="0" class="er">消す</button></div>
    <p class="msg ${S.msgc||''}" id="msg">${S.msg||''}</p>
    <div class="row"><button class="btn" id="chk">まちがいチェック</button><button class="btn" id="hint">ヒント</button><button class="btn" id="reset">やりなおす</button></div>
    <p class="note">ならびがうまると、合計の数が<b style="color:var(--ok)">緑</b>（合っている）か<b style="color:var(--ng)">赤</b>（合っていない）になります。同じならびに同じ数字があると赤くなります。「まちがいチェック」はまちがっているマスに印をつけます（まちがいがあったときだけ星がへります）。「ヒント」は1マスの答えを入れます（星がへります）。</p>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(tExplain());return;}
  app.querySelectorAll('#bd .hit').forEach(h=>h.onclick=()=>{S.sel=[+h.dataset.r,+h.dataset.c];S.msg='';S.msgc='';draw();});
  app.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>put(+b.dataset.v));
  document.getElementById('hint').onclick=hint;
  document.getElementById('chk').onclick=check;
  document.getElementById('reset').onclick=()=>{S.g=S.g.map((row,r)=>row.map((v,c)=>S.lock[r][c]?v:0));S.chk={};S.msg='';draw();};
}
function tNext(r,c){const H=P.b.length,W=P.b[0].length,N=H*W;
  for(let k=1;k<N;k++){const i=(r*W+c+k)%N,rr=Math.floor(i/W),cc=i%W;if(P.b[rr][cc]==='.'&&!S.g[rr][cc])return [rr,cc];}return [r,c];}
function put(v){
  if(!S.sel)return; const [r,c]=S.sel;
  if(S.lock[r][c]){S.msg='ヒントで入れたマスは変えられません。';S.msgc='';draw();return;}
  S.g[r][c]=v; delete S.chk[r+','+c]; S.msg=''; S.msgc='';
  if(v)S.sel=tNext(r,c);
  const all=P.b.every((row,rr)=>[...row].every((ch,cc)=>ch!=='.'||S.g[rr][cc]));
  if(all){ if(tSolved())S.done=true; else {S.msg='全部うまりましたが、どこかちがいます。赤いところを見なおそう。';S.msgc='ng';} }
  draw();
}
function check(){
  S.chk={};let n=0,f=0;
  P.b.forEach((row,r)=>[...row].forEach((ch,c)=>{if(ch==='.'&&S.g[r][c]){f++;if(S.g[r][c]!==P.sol[r][c]){S.chk[r+','+c]=1;n++;}}}));
  if(!f){S.msg='まだ数字が入っていません。';S.msgc='';draw();return;}
  /* まちがいがないときは星をへらさない */
  if(n)S.hints++;
  S.msg=n?`まちがっているマスが ${n}つ あります（赤い印）。（ヒント ${S.hints}回）`:'今入っている数字は、全部合っています！（このチェックでは星はへりません）';S.msgc=n?'ng':'ok';draw();
}
function hint(){
  const cand=[];P.b.forEach((row,r)=>[...row].forEach((ch,c)=>{if(ch==='.'&&S.g[r][c]!==P.sol[r][c])cand.push([r,c]);}));
  if(!cand.length)return;
  cand.sort((a,b)=>(S.g[b[0]][b[1]]?1:0)-(S.g[a[0]][a[1]]?1:0));
  const [r,c]=S.sel&&cand.some(x=>x[0]===S.sel[0]&&x[1]===S.sel[1])?S.sel:cand[0];
  S.g[r][c]=P.sol[r][c]; S.lock[r][c]=true; delete S.chk[r+','+c]; S.hints++;
  S.msg=`ヒント：1マス入れました（ヒント ${S.hints}回）。`; S.msgc='';
  if(tSolved())S.done=true; draw();
}
/* 合計とマスの数から、使える数字の組が1通りしかないならびを見つけて、解き方のポイントとして見せる */
function tCombos(k,s){const out=[];const rec=(st,a)=>{if(a.length===k){if(a.reduce((x,y)=>x+y,0)===s)out.push(a.slice());return;}for(let d=st;d<=9;d++){a.push(d);rec(d+1,a);a.pop();}};rec(1,[]);return out;}
function tExplain(){
  const one=TRUNS.map(run=>({run,cm:tCombos(run.cs.length,run.s)})).filter(x=>x.cm.length===1).slice(0,2);
  let t=one.map(({run,cm})=>`${run.cs.length}マスで合計${run.s}になるのは <b>${cm[0].join('と')}</b> の組だけ`).join('。<br>');
  return `<p class="note" style="color:var(--fg)">${t?'ポイント：'+t+'。<br>こういう「1通りしかない」ならびから考えると、早く解けます。':'たてと横の合計を両方使って、数字をしぼりこめましたね。'}</p>`;
}
document.addEventListener('keydown',e=>{if(!S||S.done||!P||!P.b||!document.getElementById('bd'))return;
  if(/^[1-9]$/.test(e.key))put(+e.key);else if(e.key==='Backspace'||e.key==='Delete'||e.key==='0')put(0);
  else{const d={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];if(d&&S.sel){e.preventDefault();
    const H=P.b.length,W=P.b[0].length;let [r,c]=S.sel;for(let k=0;k<Math.max(H,W);k++){r=(r+d[0]+H)%H;c=(c+d[1]+W)%W;if(P.b[r][c]==='.'){S.sel=[r,c];break;}}draw();}}});
function tExample(){
  /* 例：横に2マスで合計3 → 1と2 */
  const U=50;let s='';
  s+=`<rect x="0" y="0" width="${U}" height="${U}" fill="#e6e0f3"/><line x1="0" y1="0" x2="${U}" y2="${U}" stroke="#8b80b0" stroke-width="2"/><polygon points="0,0 0,${U} ${U},${U}" fill="#5b5470"/>`;
  s+=`<text x="${U*.7}" y="${U*.42}" text-anchor="middle" font-size="18" font-weight="700" fill="#3b2f6b" font-family="sans-serif">3</text>`;
  [1,2].forEach((v,i)=>{s+=`<rect x="${U*(i+1)+1}" y="1" width="${U-2}" height="${U-2}" rx="4" fill="#fff" stroke="#bdb4a6" stroke-width="1.5"/><text x="${U*(i+1.5)}" y="${U*.7}" text-anchor="middle" font-size="26" font-weight="700" fill="#2a2520" font-family="sans-serif">${v}</text>`;});
  s+=`<text x="${U*3+10}" y="${U*.62}" font-size="15" fill="#3b2f6b" font-family="sans-serif" font-weight="700">1＋2＝3</text>`;
  return `<svg viewBox="0 0 ${U*3+90} ${U}" style="width:100%;max-width:280px" aria-label="例：横の合計が3なら1と2">${s}</svg>`;
}
const RULES=`<ol class="rules">
  <li>白いマスに <b>1〜9</b> の数字を入れよう。</li>
  <li>ななめ線のマスの<b>上の数</b>は、その右にならぶ白いマスの<b>横の合計</b>です。<b>下の数</b>は、その下にならぶ白いマスの<b>たての合計</b>です。</li>
  <li>1つのならびの中では、<b>同じ数字を2回使えません</b>。</li>
  <li>マスをタップしてえらび、下の数字ボタンで入れよう。答えは1つに決まります。</li></ol>
  <div style="display:flex;justify-content:center">${tExample()}</div>`;

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
