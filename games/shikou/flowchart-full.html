  <header>
    <h1><small>思考力パズル</small>フローチャートをたどろう 100問</h1>
    <p class="lead">矢印をたどって、どの出口に出るか、どんな数が出るかを考えよう。5つのレベルに20問ずつ。ヒントやまちがいなしでクリアすると★3つ。</p>

<script>
(function(){
const PAID=true;
let QS=[];
const ID='flowchart';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>フローチャートをたどろう 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* フローチャートをたどろう
   p={kind:'where'|'which'|'out'|'fill', ch:図（部品の列）, inp:入れるもの, a:答え, ds:ほかの3つ, opts:出口, tgt, exs:表の例, fx:？の答え, path:通る部品の番号, ex:説明, why}
   図の部品：S はじめ, i 数を入れる, b 四角（すること）, o 書き出す, e おわり・出口, d ひし形（y:はい の列, n:いいえ の列）, l もどる矢印つきのひし形（bk:もどる答え, to:もどる先）
   答えはすべて gen_flowchart.py で図を実際に動かして計算してある */
const HINTWORD='ヒントやまちがい';
const LVD={1:'形を分ける（しつもん1〜2こ）',2:'しつもん3こ・どれが出る？・？のしつもん',3:'数の計算と分かれ道',4:'くり返し（もどる矢印）',5:'？の箱をうめる・分かれ道入りのくり返し'};
const RULES=`<ol class="rules">
  <li>フローチャートは、することの<b>順番を矢印でつないだ図</b>です。「スタート」や「はじめ」から、<b>矢印の向き</b>に1つずつ進みます。</li>
  <li><b>四角</b>は「すること」。<b>ひし形</b>は「しつもん」です。答えが「<b>はい</b>」か「<b>いいえ</b>」かで、進む矢印が変わります。</li>
  <li>矢印が<b>上にもどる</b>所では、また同じことを<b>くり返し</b>ます。</li>
  <li>丸い形は「<b>おわり</b>」や「<b>出口</b>」です。「数を書き出す」に来たら、そのときの数が答えになります。</li>
  <li>問題は「どの出口に出る？」「書き出される数は？」「どれを入れた？」「？に入るのは？」の4しゅるい。</li>
  <li>ヒントを使うと、はじめのほうの道が光ります（ヒントやまちがいで星がへります）。</li></ol>`;
const FS=15;
const tw=s=>{let w=0;for(const ch of String(s))w+=ch===' '?FS*0.32:/[\x20-\x7e]/.test(ch)?FS*0.62:FS;return w;};
function wrap(t,mx){if(tw(t)<=mx)return [t];let best=null;[...t].forEach((c,i)=>{if(c!==' ')return;const a=t.slice(0,i),b=t.slice(i+1),m=Math.max(tw(a),tw(b));if(!best||m<best[0])best=[m,a,b];});return best?[best[1],best[2]]:[t];}
const lw=ls=>Math.max(...ls.map(tw));
const COLR={r:'#e0342f',b:'#2f6fe0',y:'#f2c200'},COLN={r:'赤',b:'青',y:'黄色'},SHN={c:'まる',t:'三角',s:'四角'};
const itemName=it=>(it[2]==='B'?'大きい ':'小さい ')+COLN[it[0]]+'の'+SHN[it[1]];
function itemShape(it,cx,cy,U){const k=it[2]==='B'?1:0.58,s=U*k,c=COLR[it[0]],st='stroke="#2a2520" stroke-width="2"';
  if(it[1]==='c')return `<circle cx="${cx}" cy="${cy}" r="${s/2}" fill="${c}" ${st}/>`;
  if(it[1]==='t')return `<polygon points="${cx},${cy-s/2} ${cx+s/2},${cy+s*0.42} ${cx-s/2},${cy+s*0.42}" fill="${c}" ${st}/>`;
  return `<rect x="${cx-s*0.43}" y="${cy-s*0.43}" width="${s*0.86}" height="${s*0.86}" fill="${c}" ${st}/>`;}
const itemSVG=(it,px)=>`<svg viewBox="0 0 60 60" width="${px}" height="${px}" role="img" aria-label="${itemName(it)}"><rect x="1" y="1" width="58" height="58" rx="8" fill="#fbfaf6" stroke="#ddd6cb"/>${itemShape(it,30,30,46)}</svg>`;
const isShape=v=>typeof v==='string'&&v.length===3;
const lbl=n=>n.t==='e'&&n.x.length===1?'出口'+n.x:n.x;
function size(n){
  if(n.h){return n.t==='b'?{w:96,h:38,ls:['？']}:{w:104,h:58,ls:['？']};}
  const t=lbl(n);
  if(n.t==='S'||n.t==='e'){const ls=[t];return {w:Math.max(tw(t)+30,66),h:34,ls};}
  if(n.t==='i'||n.t==='o'){const ls=[t];return {w:tw(t)+44,h:36,ls};}
  if(n.t==='b'){const ls=wrap(t,140);return {w:Math.max(lw(ls)+26,92),h:ls.length>1?54:38,ls};}
  const ls=wrap(t,100);return {w:Math.max(lw(ls)*(ls.length>1?1.55:1.4)+28,100),h:ls.length>1?78:58,ls};
}
const leaf=sq=>sq.length===1&&sq[0].t==='e';
const hasExit=sq=>sq.some(n=>n.t==='e'||(n.t==='d'&&(hasExit(n.y)||hasExit(n.n))));
/* 図の置き方：列 c・行 r のマスに部品を置き、矢印の通り方（ty）を決める */
function layout(ch,q){
  const pos={},edges=[],loops=[];
  function link(prev,k){
    if(prev.merge){
      edges.push(prev.yl!==null?{f:prev.yl,t:k,ty:'v'}:{f:prev.d,t:k,ty:'v',lab:'はい'});
      edges.push(prev.nl!==null?{f:prev.nl,t:k,ty:'M'}:{f:prev.d,t:k,ty:'RM',lab:'いいえ'});
    }else edges.push({f:prev.k,t:k,ty:'v',lab:prev.lab});
  }
  function place(seq,c,r){
    let prev=null,w=1;const r0=r;
    for(const n of seq){
      pos[n.k]={n,c,r};if(prev)link(prev,n.k);
      if(n.t==='d'){
        if(hasExit(n.y)||hasExit(n.n)){
          let right,down,rl,dl;
          if(leaf(n.y)&&leaf(n.n)){down=n.y;right=n.n;dl='はい';rl='いいえ';}
          else if(leaf(n.y)){right=n.y;down=n.n;rl='はい';dl='いいえ';}
          else{right=n.n;down=n.y;rl='いいえ';dl='はい';}
          pos[right[0].k]={n:right[0],c:c+1,r};edges.push({f:n.k,t:right[0].k,ty:'H',lab:rl});
          edges.push({f:n.k,t:down[0].k,ty:'v',lab:dl});
          const A=place(down,c,r+1);return {w:Math.max(w,2,A.w),h:r+1-r0+A.h};}
        n.y.forEach((m,j)=>{pos[m.k]={n:m,c,r:r+1+j};if(j)edges.push({f:n.y[j-1].k,t:m.k,ty:'v'});});
        n.n.forEach((m,j)=>{pos[m.k]={n:m,c:c+1,r:r+1+j};if(j)edges.push({f:n.n[j-1].k,t:m.k,ty:'v'});});
        if(n.y.length)edges.push({f:n.k,t:n.y[0].k,ty:'v',lab:'はい'});
        if(n.n.length)edges.push({f:n.k,t:n.n[0].k,ty:'R',lab:'いいえ'});
        w=Math.max(w,2);
        prev={merge:true,d:n.k,yl:n.y.length?n.y[n.y.length-1].k:null,nl:n.n.length?n.n[n.n.length-1].k:null};
        r+=1+Math.max(n.y.length,n.n.length);continue;}
      if(n.t==='l'){loops.push(n);edges.push({f:n.k,t:n.to,ty:'B',lab:n.bk==='y'?'はい':'いいえ'});}
      prev={k:n.k,lab:n.t==='l'?(n.bk==='y'?'いいえ':'はい'):null};r++;
    }
    return {w,h:r-r0};
  }
  const A=place(ch,0,0);
  const sz={};Object.values(pos).forEach(p=>sz[p.n.k]=size(p.n));
  const nc=Math.max(A.w,1+Math.max(...Object.values(pos).map(p=>p.c))),nr=1+Math.max(...Object.values(pos).map(p=>p.r));
  const colW=Array(nc).fill(70),rowH=Array(nr).fill(40);
  Object.values(pos).forEach(p=>{const s=sz[p.n.k];colW[p.c]=Math.max(colW[p.c],s.w+20);rowH[p.r]=Math.max(rowH[p.r],s.h+30);});
  const padL=Array(nc).fill(0);edges.forEach(e=>{if(e.ty==='H')padL[pos[e.t].c]=38;});
  const LM=loops.length?40:6,cx=[],cy=[];let x=LM;colW.forEach((w,i)=>{x+=padL[i];cx[i]=x+w/2;x+=w;});const W=x+6;
  let y=6;rowH.forEach((h,i)=>{cy[i]=y+h/2;y+=h;});const H=y-14;
  const P_={};Object.values(pos).forEach(p=>{const s=sz[p.n.k];P_[p.n.k]={x:cx[p.c],y:cy[p.r],w:s.w,h:s.h,ls:s.ls,n:p.n,c:p.c};});
  const boxes=Object.values(P_).map(p=>({k:p.n.k,x1:p.x-p.w/2,x2:p.x+p.w/2,y1:p.y-p.h/2,y2:p.y+p.h/2}));
  /* 矢印の道すじ */
  edges.forEach(e=>{const a=P_[e.f],b=P_[e.t],top=b.y-b.h/2,bot=a.y+a.h/2;
    if(e.ty==='v'){e.pts=[[a.x,bot],[b.x,top]];e.lp=[a.x+6,bot+14,'start'];}
    else if(e.ty==='H'){e.pts=[[a.x+a.w/2,a.y],[b.x-b.w/2,b.y]];e.lp=[a.x+a.w/2+6,a.y-7,'start'];}
    else if(e.ty==='R'){e.pts=[[a.x+a.w/2,a.y],[b.x,a.y],[b.x,top]];e.lp=[a.x+a.w/2+6,a.y-7,'start'];}
    else if(e.ty==='M'){const my=top-12;e.pts=[[a.x,bot],[a.x,my],[b.x,my],[b.x,top]];}
    else if(e.ty==='RM'){const my=top-12,X1=cx[a.c+1];e.pts=[[a.x+a.w/2,a.y],[X1,a.y],[X1,my],[b.x,my],[b.x,top]];e.lp=[a.x+a.w/2+6,a.y-7,'start'];}
    else if(e.ty==='B'){const lx=18;e.pts=[[a.x-a.w/2,a.y],[lx,a.y],[lx,b.y],[b.x-b.w/2,b.y]];e.lp=[lx+5,a.y+17,'start'];}
  });
  return {W,H,pos:P_,edges,boxes};
}
const tx=(x,y,t,c,fs)=>`<text x="${x}" y="${y}" font-size="${fs||FS}" font-weight="700" fill="${c||'#2a2520'}" text-anchor="middle" font-family="sans-serif">${esc(t)}</text>`;
const tx2=(x,cy,ls,c)=>ls.map((l,i)=>tx(x,cy+5+(i-(ls.length-1)/2)*19,l,c)).join('');
function nodeSVG(p,hl,tap){const {x,y,w,h,n}=p,G='#1d7a4c',sw=hl?3.6:2;let o='';
  if(n.h){o=n.t==='b'?`<rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="6" fill="#fff" stroke="#c8352d" stroke-width="2.6" stroke-dasharray="6 4"/>`
      :`<polygon points="${x},${y-h/2} ${x+w/2},${y} ${x},${y+h/2} ${x-w/2},${y}" fill="#fff" stroke="#c8352d" stroke-width="2.6" stroke-dasharray="6 4"/>`;
    return o+tx(x,y+6,'？','#c8352d',20);}
  if(n.t==='S'||n.t==='e'){const ex=n.t==='e'&&n.x.length===1;
    o=`<rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="${h/2}" fill="${ex?'#fde68a':'#e7e1d4'}" stroke="${hl?G:ex?'#b45309':'#a89a80'}" stroke-width="${hl?3.6:2}"/>`+tx(x,y+5,lbl(n),ex?'#7c2d12':'#3b2f6b');
    if(tap&&ex)o=`<g class="exit" data-x="${n.x}" style="cursor:pointer">${o}<rect x="${x-w/2-6}" y="${y-h/2-6}" width="${w+12}" height="${h+12}" fill="transparent"/></g>`;
    return o;}
  if(n.t==='i'||n.t==='o'){const k=10;return `<polygon points="${x-w/2+k},${y-h/2} ${x+w/2+k},${y-h/2} ${x+w/2-k},${y+h/2} ${x-w/2-k},${y+h/2}" fill="#fef3c7" stroke="${hl?G:'#d97706'}" stroke-width="${sw}"/>`+tx2(x,y,p.ls);}
  if(n.t==='b')return `<rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="6" fill="#eff6ff" stroke="${hl?G:'#3b82f6'}" stroke-width="${sw}"/>`+tx2(x,y,p.ls);
  return `<polygon points="${x},${y-h/2} ${x+w/2},${y} ${x},${y+h/2} ${x-w/2},${y}" fill="#ede4fd" stroke="${hl?G:'#7c3aed'}" stroke-width="${sw}"/>`+tx2(x,y,p.ls);
}
function chartSVG(ch,hlPath,tap){
  const L=layout(ch,P),on=new Set(hlPath||[]),pairs=new Set();
  (hlPath||[]).forEach((k,i)=>{if(i)pairs.add(hlPath[i-1]+'-'+k);});
  let s=`<defs><marker id="fah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a625a"/></marker><marker id="fag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d7a4c"/></marker></defs>`;
  const ed=e=>{const h=pairs.has(e.f+'-'+e.t);return `<polyline points="${e.pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${h?'#1d7a4c':'#6a625a'}" stroke-width="${h?3.6:2}" marker-end="url(#${h?'fag':'fah'})"/>`;};
  L.edges.filter(e=>!pairs.has(e.f+'-'+e.t)).forEach(e=>s+=ed(e));
  L.edges.filter(e=>pairs.has(e.f+'-'+e.t)).forEach(e=>s+=ed(e));
  L.edges.forEach(e=>{if(e.lab&&e.lp)s+=`<text x="${e.lp[0]}" y="${e.lp[1]}" font-size="14.5" font-weight="700" fill="${e.lab==='はい'?'#1d7a4c':'#c8352d'}" text-anchor="${e.lp[2]}" font-family="sans-serif">${e.lab}</text>`;});
  Object.values(L.pos).forEach(p=>s+=nodeSVG(p,on.has(p.n.k),tap));
  return `<svg id="fc" viewBox="0 0 ${L.W} ${L.H}" style="max-width:${Math.min(L.W*1.12,520)}px" role="img" aria-label="フローチャート">${s}</svg>`;
}
/* ---------------- 画面 ---------------- */
function startStage(p){P=p;S={hints:0,done:false,msg:'',msgc:'',wrong:[],hl:0,hint:false,
  opts:p.kind==='where'?p.opts.slice().sort():shuffle([p.a,...p.ds])};begin(p);draw();}
const valHTML=v=>isShape(v)?`<span class="itm">${itemSVG(v,46)}<span>${itemName(v)}</span></span>`:`<b class="numv">${v}</b>`;
const resHTML=r=>typeof r==='string'?'出口'+r:`<b>${r}</b> を書き出す`;
function qtext(){
  if(P.kind==='where')return isShape(P.inp)?'この形を入れると、<b>どの出口</b>に出る？':`<b>${P.inp}</b> を入れると、<b>どの出口</b>に出る？`;
  if(P.kind==='out')return `<b>${P.inp}</b> を入れると、<b>書き出される数</b>は？`;
  if(P.kind==='which'){if(isShape(P.a))return `<b>出口${P.tgt}</b>に出るのは、どれ？`;
    return typeof P.tgt==='string'?`<b>出口${P.tgt}</b>に出る数は、どれ？`:`書き出される数が <b>${P.tgt}</b> になるのは、どの数を入れたとき？`;}
  return `<b>？の${P.ht==='d'?'ひし形（しつもん）':'四角（すること）'}</b>に入るのはどれ？ 下の表のとおりになるものをえらぼう。`;
}
function exTable(){return `<table class="fct"><tr><th>入れたもの</th><th>結果</th></tr>${P.exs.map(([x,r])=>`<tr><td>${valHTML(x)}</td><td>${resHTML(r)}</td></tr>`).join('')}</table>`;}
function hintText(){
  if(P.kind==='where'||P.kind==='out')return 'はじめから矢印を1つずつたどろう。緑の道が、とちゅうまでの正しい道です。ひし形では、そのときの答えで「はい」「いいえ」を決めます。';
  if(P.kind==='which')return '4つを1つずつ入れて、たどってみよう。ちがうものに×をつけました。';
  return '表の1行目を入れて、それぞれの答えでためしてみよう。合わないものに×をつけました。';
}
function cur(){ /* 今かく図：fill はクリア後に？をうめる */
  if(P.kind!=='fill'||!S.done)return P.ch;
  const c=JSON.parse(JSON.stringify(P.ch));const f=sq=>{for(const n of sq){if(n.k===P.hk){delete n.h;n.x=P.fx;}if(n.t==='d'){f(n.y);f(n.n);}}};f(c);return c;}
function draw(){
  const tapEx=P.kind==='where'&&!S.done;
  const hlp=S.done?P.path:S.hl?P.path.slice(0,S.hl):null;
  let opts='';
  if(P.kind==='where')opts=`<div class="exrow">${S.opts.map((o,i)=>`<button class="ob exb ${S.done&&o===P.a?'right':''} ${S.wrong.includes(i)?'wrong':''}" data-i="${i}" ${S.done||S.wrong.includes(i)?'disabled':''}>出口${o}</button>`).join('')}</div>`;
  else if(P.kind==='fill')opts=`<div class="opts4 one">${S.opts.map((o,i)=>`<button class="ob ${S.done&&o===P.a?'right':''} ${S.wrong.includes(i)?'wrong':''}" data-i="${i}" ${S.done||S.wrong.includes(i)?'disabled':''}><span class="k">${'アイウエ'[i]}</span><b>${esc(o)}</b></button>`).join('')}</div>`;
  else opts=`<div class="opts4">${S.opts.map((o,i)=>`<button class="ob ${S.done&&o===P.a?'right':''} ${S.wrong.includes(i)?'wrong':''}" data-i="${i}" ${S.done||S.wrong.includes(i)?'disabled':''}><span class="k">${'アイウエ'[i]}</span>${valHTML(o)}</button>`).join('')}</div>`;
  app.innerHTML=`${topBar()}
    <p class="qq">${qtext()}</p>
    ${P.kind==='where'||P.kind==='out'?`<div class="inbox"><span class="label">入れるもの</span>${valHTML(P.inp)}</div>`:''}
    ${P.kind==='fill'?exTable():''}
    <div class="boardw fl">${chartSVG(cur(),hlp,tapEx)}</div>
    ${tapEx?'<p class="note" style="text-align:center">図の出口か、下のボタンをタップしよう。</p>':''}
    ${opts}
    ${S.hint&&!S.done?`<p class="hintbox">${hintText()}</p>`:''}
    ${S.done?'':`<p class="msg ${S.msgc}" id="msg">${S.msg}</p><div class="row"><button class="btn" id="hint">ヒント</button></div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(explain());return;}
  app.querySelectorAll('.ob').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  app.querySelectorAll('#fc .exit').forEach(g=>g.addEventListener('click',()=>{const i=S.opts.indexOf(g.dataset.x);if(i>=0&&!S.wrong.includes(i))answer(i);}));
  document.getElementById('hint').onclick=giveHint;
}
function answer(i){
  if(S.done)return;
  if(S.opts[i]===P.a){S.done=true;S.hint=false;draw();return;}
  S.wrong.push(i);S.hints++;S.msg=P.kind==='fill'?'ちがいます。表の例を、その答えでたどってみよう。':'ちがいます。もう一度、矢印をたどってみよう。';S.msgc='ng';draw();
}
function giveHint(){
  S.hints++;S.hint=true;S.msg='';S.msgc='';
  if(P.kind==='where'||P.kind==='out'){const n=P.path.length;S.hl=Math.min(n-1,Math.max(3,Math.ceil(n*(S.hl?0.66:0.4))));}
  else{const w=S.opts.map((o,i)=>i).filter(i=>S.opts[i]!==P.a&&!S.wrong.includes(i));if(w.length>1)S.wrong.push(w[0]);}
  draw();
}
function explain(){
  let s=`<p style="margin:0">緑の道が、${P.kind==='fill'?'表の1行目（'+(isShape(P.exs[0][0])?itemName(P.exs[0][0]):P.exs[0][0])+'）の':''}たどり方です。</p><p class="fex">${P.ex.map(esc).join(' → ')}</p>`;
  if(P.kind==='where')s+=`<p style="margin:0">だから、答えは<b>出口${P.a}</b>です。</p>`;
  if(P.kind==='out')s+=`<p style="margin:0">書き出される数は <b>${P.a}</b> です。</p>`;
  if(P.kind==='which')s+=`<p style="margin:0">ほかのものは：${P.why.map(([d,r])=>`${isShape(d)?itemName(d):d} → ${typeof r==='string'?'出口'+r:r}`).join('、')}</p>`;
  if(P.kind==='fill')s+=`<p style="margin:0">？には「<b>${esc(P.fx)}</b>」が入ります。</p><p class="note">${P.why.map(([t,x,r])=>`「${esc(t)}」だと、${isShape(x)?itemName(x):x} を入れたとき ${typeof r==='string'?'出口'+r+'に出る':r+' を書き出す'}ことになり、表と合いません。`).join('<br>')}</p>`;
  return s;
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
