<style>

<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>犯人さがし 100問</h1>
    <p class="lead">ケーキを食べたのはだれ？ 花びんをたおしたのはだれ？ 手がかりを表に○×で書きこんで、犯人を見つけよう。5つのレベルに20問ずつ。ヒントやまちがいなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=true;
let QS=[];
const ID='hannin';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>犯人さがし 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* 犯人さがし：p={model:'P'(場所)|'T'(台所に入った時間), n, names, cols, scene, story, clues, isal?, alibi?, floors?, ans, sol, steps:[[理由,[[r,c,v]…]]…]} */
const HINTWORD='ヒントやまちがい';
const LVD={1:'3人・場所',2:'3人・場所と時間',3:'4人・時間表',4:'4〜5人・階と「すぐ次」の手がかり',5:'5人・むずかしい推理'};
const RULES=`<ol class="rules">
  <li>おはなしと<b>手がかり</b>を読んで、<ruby>犯人<rt>はんにん</rt></ruby>（やった人）をさがそう。</li>
  <li>下の<b>表</b>のマスをタップすると、<b>×</b>（ちがう）→ <b>○</b>（そう）→ 空 と変わります。わかったことを書きこもう。</li>
  <li>1人は1つの場所（時間）だけ。たて・横の1列に、<b>○は1つずつ</b>です。</li>
  <li>わかったら「犯人はだれ？」のボタンで答えよう。答えは1つに決まります。</li></ol>`;
const AC={'うさぎ':['#ffffff','#f5b8c8'],'くま':['#b07a4a','#7a4f2a'],'ねこ':['#c9c4bd','#7d756b'],'きつね':['#f0953a','#ffffff'],'たぬき':['#9b8570','#4a3b2e']};
function face(nm,sz){const [a,b]=AC[nm]||['#ddd','#999'];let e='';
  if(nm==='うさぎ')e=`<ellipse cx="15" cy="9" rx="5" ry="13" fill="${a}" stroke="#8a7a70" stroke-width="1.5"/><ellipse cx="33" cy="9" rx="5" ry="13" fill="${a}" stroke="#8a7a70" stroke-width="1.5"/><ellipse cx="15" cy="10" rx="2.2" ry="8" fill="${b}"/><ellipse cx="33" cy="10" rx="2.2" ry="8" fill="${b}"/>`;
  if(nm==='くま'||nm==='たぬき')e=`<circle cx="11" cy="15" r="7" fill="${a}" stroke="${b}" stroke-width="1.5"/><circle cx="37" cy="15" r="7" fill="${a}" stroke="${b}" stroke-width="1.5"/>`;
  if(nm==='ねこ'||nm==='きつね')e=`<polygon points="7,8 10,28 22,20" fill="${a}" stroke="#6a5a4a" stroke-width="1.5"/><polygon points="41,8 38,28 26,20" fill="${a}" stroke="#6a5a4a" stroke-width="1.5"/>`;
  let f=`<circle cx="24" cy="30" r="15" fill="${a}" stroke="#6a5a4a" stroke-width="1.5"/>`;
  if(nm==='きつね')f+=`<ellipse cx="24" cy="37" rx="9" ry="7" fill="#fff"/>`;
  if(nm==='たぬき')f+=`<ellipse cx="18" cy="28" rx="5" ry="4" fill="${b}"/><ellipse cx="30" cy="28" rx="5" ry="4" fill="${b}"/>`;
  if(nm==='くま')f+=`<ellipse cx="24" cy="36" rx="7" ry="5" fill="#e3c49e"/>`;
  f+=`<circle cx="18" cy="28" r="2" fill="${nm==='たぬき'?'#fff':'#2a2520'}"/><circle cx="30" cy="28" r="2" fill="${nm==='たぬき'?'#fff':'#2a2520'}"/><circle cx="24" cy="34" r="2" fill="#2a2520"/>`;
  if(nm==='ねこ')f+=`<path d="M10,33 L19,34 M10,37 L19,36 M38,33 L29,34 M38,37 L29,36" stroke="#6a5a4a" stroke-width="1"/>`;
  return `<svg viewBox="0 0 48 48" width="${sz}" height="${sz}" aria-hidden="true">${e}${f}</svg>`;}
function icon(o,sz){let s='';
  if(o==='cake')s=`<polygon points="6,34 42,34 42,22 6,30" fill="#fde7c4" stroke="#b07a4a" stroke-width="1.5"/><polygon points="6,30 42,22 42,17 6,26" fill="#fff" stroke="#b07a4a" stroke-width="1.5"/><circle cx="36" cy="15" r="4" fill="#e0342f"/>`;
  if(o==='vase')s=`<path d="M18,8 L30,8 L28,14 Q38,22 32,40 L16,40 Q10,22 20,14Z" fill="#60a5fa" stroke="#1e3a8a" stroke-width="1.5"/><path d="M12,42 L18,36 M36,42 L30,37" stroke="#1e3a8a" stroke-width="1.5"/>`;
  if(o==='pot')s=`<polygon points="10,20 38,20 34,40 14,40" fill="#c2703d" stroke="#7a3f1d" stroke-width="1.5" transform="rotate(25 24 30)"/><circle cx="12" cy="40" r="5" fill="#8b5a2b"/><circle cx="20" cy="43" r="4" fill="#8b5a2b"/>`;
  if(o==='juice')s=`<path d="M14,10 L34,10 L31,40 L17,40Z" fill="#fff" stroke="#6a625a" stroke-width="1.5"/><path d="M15.5,20 L32.5,20 L31,40 L17,40Z" fill="#f59e0b"/><line x1="28" y1="4" x2="25" y2="22" stroke="#e0342f" stroke-width="2"/>`;
  if(o==='cookie')s=`<rect x="8" y="16" width="32" height="24" rx="4" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.5"/><rect x="6" y="11" width="36" height="7" rx="3" fill="#60a5fa" stroke="#1e3a8a" stroke-width="1.5"/><circle cx="24" cy="29" r="6" fill="#d9a066" stroke="#8b5a2b"/>`;
  if(o==='shirt')s=`<path d="M14,10 L20,8 Q24,12 28,8 L34,10 L40,18 L34,21 L33,40 L15,40 L14,21 L8,18Z" fill="#86efac" stroke="#166534" stroke-width="1.5"/>`;
  if(o==='pudding')s=`<path d="M14,16 L34,16 L38,38 L10,38Z" fill="#fcd34d" stroke="#a16207" stroke-width="1.5"/><path d="M14,16 L34,16 L35,22 Q24,26 13,22Z" fill="#92400e"/><ellipse cx="24" cy="40" rx="18" ry="3" fill="#e5e7eb"/>`;
  return `<svg viewBox="0 0 48 48" width="${sz}" height="${sz}" aria-hidden="true">${s}</svg>`;}
function houseSVG(){
  /* 使う場所だけを、家の図（2階・1階・庭）にかく */
  const fl={2:[],1:[],0:[]}; P.cols.forEach((c,i)=>fl[P.floors[i]].push(i));
  const W=320, hasG=fl[0].length>0, HW=hasG?236:W-8, rows=[2,1].filter(f=>fl[f].length);
  let s=`<polygon points="4,${rows.length===2?40:40} ${HW/2+4},6 ${HW+4},40" fill="#e9d7bd" stroke="#8b5a2b" stroke-width="2"/>`;
  let y=40; const rh=54;
  rows.forEach(f=>{const list=fl[f], w=HW/list.length;
    s+=`<rect x="4" y="${y}" width="${HW}" height="${rh}" fill="#fbf6ec" stroke="#8b5a2b" stroke-width="2"/><text x="10" y="${y+14}" font-size="11" fill="#8b5a2b" font-family="sans-serif">${f}階</text>`;
    list.forEach((i,k)=>{const x=4+k*w;if(k)s+=`<line x1="${x}" y1="${y}" x2="${x}" y2="${y+rh}" stroke="#8b5a2b" stroke-width="2"/>`;
      s+=room(i,x+w/2,y+rh/2,i===P.scene);});
    y+=rh;});
  if(hasG){s+=`<rect x="${HW+12}" y="${y-rh}" width="${W-HW-16}" height="${rh}" rx="8" fill="#d4f0dc" stroke="#16a34a" stroke-width="2"/>`;s+=room(fl[0][0],HW+12+(W-HW-16)/2,y-rh/2,fl[0][0]===P.scene);}
  return `<svg viewBox="0 0 ${W} ${y+6}" style="width:100%;max-width:380px" role="img" aria-label="家の図">${s}</svg>`;
}
function room(i,x,y,sc){return (sc?`<g transform="translate(${x-12},${y-26}) scale(.5)">${icon(P.o,48).replace(/^<svg[^>]*>|<\/svg>$/g,'')}</g>`:'')+
  `<text x="${x}" y="${y+(sc?16:5)}" text-anchor="middle" font-size="13" font-weight="700" fill="${sc?'#c8352d':'#3b2f6b'}" font-family="sans-serif">${P.cols[i]}</text>`;}
function alibiTable(){
  if(!P.alibi||!P.alibi.length)return '';
  const m={};P.alibi.forEach(([x,t,w])=>{m[x+','+t]=w;});
  return `<div class="hnlab">時間表（アリバイ：そのとき、ほかの場所にいた）</div><div class="hnscroll"><table class="hntt ${P.n>=5?'n5':''}"><tr><th></th>${P.cols.map(c=>`<th>${c}</th>`).join('')}</tr>
    ${P.names.map((nm,x)=>`<tr><th>${nm}</th>${P.cols.map((_,t)=>`<td>${m[x+','+t]?esc(m[x+','+t]):''}</td>`).join('')}</tr>`).join('')}</table></div>`;
}
const CN='①②③④⑤⑥⑦⑧⑨⑩';
function clueNo(){ /* アリバイ以外の手がかりに番号 */
  const no=[];let k=0;P.clues.forEach((_,i)=>{no.push(P.isal&&P.isal[i]?null:CN[k++]);});return no;}
function startStage(p){
  P=p; S={g:Array.from({length:p.n},()=>Array(p.n).fill(0)),hc:{},hints:0,done:false,msg:'',msgc:'',wrong:[],step:0};
  begin(p); draw();
}
function gridHTML(){
  const head=P.model==='P'?'場所':'台所に入った時間';
  return `<div class="hnlab">表（${head}）　マスをタップ：× → ○ → 空</div><div class="hnscroll"><table class="hngrid ${P.n>=5?'n5':''}"><tr><th></th>${P.cols.map((c,i)=>`<th class="${P.model==='P'&&i===P.scene?'sc':''}">${c}</th>`).join('')}</tr>
    ${P.names.map((nm,r)=>`<tr><th><span class="hnnm">${P.n>=5?'':face(nm,26)}${nm}</span></th>${P.cols.map((_,c)=>{const v=S.g[r][c];
      return `<td><button class="hc ${v===1?'x':v===2?'o':''} ${S.hc[r+','+c]?'h':''}" data-r="${r}" data-c="${c}" ${S.done?'disabled':''} aria-label="${nm}・${P.cols[c]}">${v===1?'×':v===2?'○':''}</button></td>`;}).join('')}</tr>`).join('')}</table></div>`;
}
function draw(){
  const no=clueNo();
  app.innerHTML=`${topBar()}
    <div class="hnstory">${icon(P.o,44)}<p>${esc(P.story)}</p></div>
    <div class="hnsus">${P.names.map(nm=>`<span>${face(nm,40)}<b>${nm}さん</b></span>`).join('')}</div>
    ${P.model==='P'?`<div class="boardw">${houseSVG()}</div>`:alibiTable()}
    <div class="hnlab">手がかり</div>
    <ol class="hnclues">${P.clues.map((c,i)=>no[i]?`<li><b>${no[i]}</b>${esc(c)}</li>`:'').join('')}</ol>
    ${gridHTML()}
    <p class="qq">${esc(P.ask)}</p>
    <div class="hnans">${P.names.map((nm,x)=>`<button class="ob ${S.done&&x===P.ans?'right':''} ${S.wrong.includes(x)?'wrong':''}" data-x="${x}" ${S.done||S.wrong.includes(x)?'disabled':''}>${face(nm,36)}<b>${nm}さん</b></button>`).join('')}</div>
    ${S.done?'':`<p class="msg ${S.msgc}" id="msg">${S.msg}</p><div class="row"><button class="btn" id="hint">ヒント</button><button class="btn" id="clr">表を消す</button></div>
    <p class="note">ヒントを使うと、手がかりからわかることを表に書きこみます（星がへります）。</p>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(explain());return;}
  app.querySelectorAll('.hc').forEach(b=>b.onclick=()=>{const r=+b.dataset.r,c=+b.dataset.c;S.g[r][c]=(S.g[r][c]+1)%3;delete S.hc[r+','+c];
    b.className='hc '+(S.g[r][c]===1?'x':S.g[r][c]===2?'o':'');b.textContent=S.g[r][c]===1?'×':S.g[r][c]===2?'○':'';});
  app.querySelectorAll('.hnans .ob').forEach(b=>b.onclick=()=>answer(+b.dataset.x));
  document.getElementById('hint').onclick=hint;
  document.getElementById('clr').onclick=()=>{S.g=S.g.map(r=>r.map(()=>0));S.hc={};S.msg='';draw();};
}
const truth=(r,c)=>P.sol[r]===c?2:1;
function answer(x){
  if(x===P.ans){fillAll();S.done=true;draw();return;}
  S.wrong.push(x);S.hints++;
  const bad=S.g.some((row,r)=>row.some((v,c)=>v&&v!==truth(r,c)));
  S.msg=`${P.names[x]}さんではありません。`+(bad?'表の中に、まちがった○×があるかもしれません。手がかりを1つずつ見直そう。':'手がかりを1つずつ表に書きこんでみよう。');
  S.msgc='ng';draw();
}
function reason(i){const no=clueNo();
  if(i===-1)return '表のきまり（たて・横に○は1つずつ）から';
  if(i===-2)return 'すべての手がかりを合わせると';
  const one=j=>P.isal&&P.isal[j]?'時間表のアリバイ':`手がかり${no[j]}`;
  if(Array.isArray(i))return `${one(i[0])}と${one(i[1])}を合わせると`;
  return `${one(i)}から`;}
function cellsText(cells){
  const o=cells.filter(x=>x[2]),xs=cells.filter(x=>!x[2]);
  const t=[];o.forEach(([r,c])=>t.push(`${P.names[r]}さんは<b>${P.cols[c]}</b>（○）`));
  if(xs.length)t.push(xs.map(([r,c])=>`${P.names[r]}さん・${P.cols[c]}`).join('、')+' は×');
  return t.join('。');}
function hint(){
  /* 考え方の順に、まだ表に正しく書けていない最初のステップを書きこむ */
  const k=P.steps.findIndex(([_,cells])=>cells.some(([r,c,v])=>S.g[r][c]!==(v?2:1)));
  if(k<0){S.msg='表は全部うまっています。○がついている人を見て、答えよう。';S.msgc='';draw();return;}
  const [why,cells]=P.steps[k];
  /* まちがっているマスがあれば消しておく */
  S.g.forEach((row,r)=>row.forEach((v,c)=>{if(v&&v!==truth(r,c))S.g[r][c]=0;}));
  cells.forEach(([r,c,v])=>{S.g[r][c]=v?2:1;S.hc[r+','+c]=1;});
  S.hints++; S.msg=`ヒント：${reason(why)}、${cellsText(cells).replace(/<\/?b>/g,'')}。`; S.msgc=''; draw();
}
function fillAll(){S.g=S.g.map((row,r)=>row.map((_,c)=>truth(r,c)));}
function explain(){
  const lines=P.steps.map(([why,cells])=>`<li>${reason(why)}、${cellsText(cells)}。</li>`).join('');
  return `<p style="margin:0">${P.model==='P'?`${P.cols[P.scene]}にいたのは`:`${P.cols[P.scene]}に台所に入ったのは`} <b>${P.names[P.ans]}さん</b>。だから犯人は ${P.names[P.ans]}さんです。</p>
  <details><summary style="cursor:pointer;font-weight:700;font-size:14px">考え方の順番を見る</summary><ol class="hnsteps">${lines}</ol></details>`;
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
