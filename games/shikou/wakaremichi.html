<style>

<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>わかれ道のプログラム</h1>
    <p class="lead">「もし前がかべなら右を向く、そうでなければ進む」。ルールどおりに動くロボットが、どこへ行くかを考えよう。5つのレベルから1問ずつ。ヒントやまちがいなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=false;
let QS=[{"id":"1-01","g":["#..","...","..."],"st":[1,0,0],"rules":[["fw","R"],["else","F"]],"flags":[[1,2,"A"],[2,1,"B"]],"moves":2,"turns":1,"steps":3,"a":"A","lv":1,"kind":"where"},{"id":"2-01","g":["...#","....","....","...."],"st":[3,3,1],"flags":[[0,0,"G"]],"opts":[[["fw","R"],["else","F"]],[["fw","L"],["else","F"]],[["fw","B"],["else","F"]]],"a":0,"lv":2,"kind":"which"},{"id":"3-01","g":["...#","b.#.","....","b..."],"st":[0,2,3],"flags":[[1,1,"G"]],"rules":[["blue","LF"],["fw","L"],["else","F"]],"blanks":[[0,["RF","LF"]],[1,["R","L","B"]]],"sol":["LF","L"],"nsol":1,"lv":3,"kind":"make"},{"id":"4-01","g":[".....",".##..","...#.","...#.","#...."],"st":[0,2,3],"rules":[["lo","LF"],["fo","F"],["else","R"]],"flags":[[4,3,"A"],[3,0,"B"],[3,1,"C"],[4,4,"D"]],"moves":9,"turns":4,"steps":10,"a":"A","lv":4,"kind":"where"},{"id":"5-01","g":["......","....#.","......","....#.","#..#.#",".#...."],"st":[0,1,1],"flags":[[3,0,"G"]],"opts":[[["fo","F"],["ro","RF"],["lo","LF"],["else","B"]],[["lo","LF"],["ro","RF"],["fo","F"],["else","B"]],[["ro","RF"],["lo","LF"],["fo","F"],["else","B"]],[["ro","RF"],["fo","F"],["lo","LF"],["else","B"]]],"a":0,"lv":5,"kind":"which"}];
const ID='wakaremichi';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>わかれ道のプログラム 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* わかれ道のプログラム
   p={kind:'where'|'which'|'make'|'count', g:盤（.ゆか #かべ b青 r赤）, st:[r,c,向き 0北1東2南3西], flags:[[r,c,'A'|'G']],
      rules:[[条件,動き]…], a:答え, opts:(which)ルールの組4つ（0番が正解）, blanks/sol/nsol:(make), ds:(count)}
   条件 fw/fo 前がかべ/あいている, rw/ro 右, lw/lo 左, blue/red マスの色, else それ以外
   動き F 1マス進む, R/L/B 右/左/うしろを向く, RF/LF 右/左を向いて1マス進む
   ゲームの中でも同じルールでロボットを動かして判定する（どんな正しい答えでも正解になる） */
const HINTWORD='ヒントやまちがい';
const LVD={1:'前がかべなら曲がる（旗2本）',2:'うしろを向く・どのルール？',3:'色のマス・□をうめる',4:'右・左のセンサー（3つのルール）',5:'ルールの順番・何マス進む？'};
const RULES=`<ol class="rules">
  <li>ロボットは、<b>ルールを上から順に見て、はじめに合ったものを1つ</b>します。これを何回もくり返します。</li>
  <li><b>旗のマスに着いたら止まります</b>。</li>
  <li>「右」「左」は、<b>ロボットから見た</b>右・左です。ロボットは白い矢印の向きを向いています。</li>
  <li>灰色のブロックと、<b>盤の外はかべ</b>です。かべに向かって進むと、ぶつかってしまいます。</li>
  <li>問題は「どの旗で止まる？」「どのルールなら旗に着く？」「□に入る動きは？」「何マス進む？」の4しゅるい。</li>
  <li>まちがえたり、ヒントを使ったりすると星がへります。「□をうめる」問題は、何回ためしてもだいじょうぶ。</li></ol>`;
const DR=[[-1,0],[0,1],[1,0],[0,-1]], U=50, M=6;
const CN={fw:'前が かべ',fo:'前が あいている',rw:'右が かべ',ro:'右が あいている',lw:'左が かべ',lo:'左が あいている',
  blue:'<span class="wkc b">青</span>いマスにいる',red:'<span class="wkc r">赤</span>いマスにいる'};
const AN={F:'1マス進む',R:'右を向く',L:'左を向く',B:'うしろを向く',RF:'右を向いて1マス進む',LF:'左を向いて1マス進む'};
const MV={F:1,RF:1,LF:1};
function isw(g,r,c){return r<0||c<0||r>=g.length||c>=g[0].length||g[r][c]==='#';}
function cok(g,r,c,d,cd){
  if(cd==='else')return true; if(cd==='blue')return g[r][c]==='b'; if(cd==='red')return g[r][c]==='r';
  const dd=(d+{f:0,r:1,l:3}[cd[0]])%4, w=isw(g,r+DR[dd][0],c+DR[dd][1]); return cd[1]==='w'?w:!w;}
function sim(rules,stops){
  const g=P.g; let [r,c,d]=P.st; const sts=[[r,c,d,-1]], seen=new Set([r+','+c+','+d]); let moves=0,turns=0;
  for(let k=0;k<600;k++){
    const ri=rules.findIndex(([cd])=>cok(g,r,c,d,cd)), a=rules[ri][1];
    if(a==='R'||a==='RF')d=(d+1)%4; else if(a==='L'||a==='LF')d=(d+3)%4; else if(a==='B')d=(d+2)%4;
    if(a!=='F')turns++;
    if(MV[a]){const nr=r+DR[d][0],nc=c+DR[d][1];
      if(isw(g,nr,nc)){sts.push([r,c,d,ri]);return {res:'crash',sts,moves,turns};}
      r=nr;c=nc;moves++;}
    sts.push([r,c,d,ri]);
    if(stops.has(r+','+c))return {res:'stop',cell:[r,c],sts,moves,turns};
    const key=r+','+c+','+d; if(seen.has(key))return {res:'loop',sts,moves,turns}; seen.add(key);
  }
  return {res:'loop',sts,moves,turns};
}
const stopSet=()=>new Set(P.flags.map(f=>f[0]+','+f[1]));
function startStage(p){
  P=p; S={hints:0,hh:0,done:false,msg:'',msgc:'',wrong:[],view:null,ghost:null,hk:0,anim:false,elim:[],
    order:p.kind==='which'?shuffle(p.opts.map((_,i)=>i)):null,
    nums:p.kind==='count'?shuffle([p.a,...p.ds]):null,
    fill:p.kind==='make'?p.blanks.map(()=>null):null,lock:p.kind==='make'?p.blanks.map(()=>false):null};
  if(p.kind==='where'||p.kind==='count')S.sol=sim(p.rules,stopSet());
  if(p.kind==='which')S.sol=sim(p.opts[p.a],stopSet());
  begin(p); draw();
}
/* ---- 盤の絵 ---- */
function flagSVG(x,y,lab){
  return `<g><line x1="${x+U*0.32}" y1="${y+U*0.14}" x2="${x+U*0.32}" y2="${y+U*0.88}" stroke="#2a2520" stroke-width="3" stroke-linecap="round"/>
    <rect x="${x+U*0.32}" y="${y+U*0.14}" width="${U*0.5}" height="${U*0.38}" rx="3" fill="${lab==='G'?'#e0342f':'#f59e0b'}" stroke="#2a2520" stroke-width="1.5"/>
    ${lab==='G'?'':`<text x="${x+U*0.57}" y="${y+U*0.45}" text-anchor="middle" font-size="17" font-weight="700" fill="#2a2520" font-family="sans-serif">${lab}</text>`}</g>`;}
function robotSVG(r,c,d,bad){
  const cx=M+c*U+U/2, cy=M+r*U+U/2;
  return `<g transform="translate(${cx},${cy}) rotate(${d*90})"><circle r="${U*0.34}" fill="${bad?'#c8352d':'#2f6fe0'}" stroke="#1e3a8a" stroke-width="2.5"/>
    <polygon points="0,${-U*0.29} ${U*0.2},${U*0.02} ${U*0.07},${U*0.02} ${U*0.07},${U*0.2} ${-U*0.07},${U*0.2} ${-U*0.07},${U*0.02} ${-U*0.2},${U*0.02}" fill="#fff"/></g>`;}
function pathSVG(sts,col,dash){
  if(!sts||sts.length<2)return '';
  const pts=sts.map(s=>`${M+s[1]*U+U/2},${M+s[0]*U+U/2}`).join(' ');
  return `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".55" ${dash?'stroke-dasharray="2 9"':''}/>`;}
function boardSVG(){
  const g=P.g,h=g.length,w=g[0].length; let s=`<rect x="2" y="2" width="${w*U+2*M-4}" height="${h*U+2*M-4}" rx="8" fill="none" stroke="#6b7280" stroke-width="4"/>`;
  for(let r=0;r<h;r++)for(let c=0;c<w;c++){const x=M+c*U,y=M+r*U,ch=g[r][c];
    if(ch==='#'){s+=`<rect x="${x+1}" y="${y+1}" width="${U-2}" height="${U-2}" rx="4" fill="#8a8f98" stroke="#5b6069"/>
      <path d="M${x+2} ${y+U/3}H${x+U-2}M${x+2} ${y+2*U/3}H${x+U-2}M${x+U/2} ${y+2}V${y+U/3}M${x+U/4} ${y+U/3}V${y+2*U/3}M${x+3*U/4} ${y+U/3}V${y+2*U/3}M${x+U/2} ${y+2*U/3}V${y+U-2}" stroke="#6b7079" stroke-width="2"/>`;continue;}
    s+=`<rect x="${x+1}" y="${y+1}" width="${U-2}" height="${U-2}" rx="6" fill="${ch==='b'?'#7fb3f5':ch==='r'?'#f59a9a':'#f6efdd'}" stroke="#d9cfb8"/>`;}
  const [sr,sc]=P.st; s+=`<rect x="${M+sc*U+5}" y="${M+sr*U+5}" width="${U-10}" height="${U-10}" rx="5" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4 3"/>`;
  P.flags.forEach(([r,c,l])=>{s+=`<g class="wkf" data-f="${l}" style="cursor:${P.kind==='where'?'pointer':'default'}"><rect x="${M+c*U}" y="${M+r*U}" width="${U}" height="${U}" fill="transparent"/>${flagSVG(M+c*U,M+r*U,l)}</g>`;});
  if(S.ghost){s+=pathSVG(S.ghost.sts,'#f97316',false);}
  if(S.hk&&S.sol)s+=pathSVG(S.sol.sts.slice(0,S.hk+1),'#7c3aed',true);
  let rb=P.st, bad=false;
  if(S.view){const v=S.view; s+=pathSVG(v.run.sts.slice(0,v.k+1),'#7c3aed',false); rb=v.run.sts[v.k]; bad=v.run.res==='crash'&&v.k===v.run.sts.length-1;}
  else if(S.ghost){const e=S.ghost.sts[S.ghost.sts.length-1]; rb=e; bad=S.ghost.res==='crash';}
  if(bad){const cx=M+rb[1]*U+U/2,cy=M+rb[0]*U+U/2,ex=cx+DR[rb[2]][1]*U*0.46,ey=cy+DR[rb[2]][0]*U*0.46;
    s+=`<line x1="${cx}" y1="${cy}" x2="${ex}" y2="${ey}" stroke="#f97316" stroke-width="6" stroke-linecap="round"/><g transform="translate(${ex},${ey})" stroke="#c8352d" stroke-width="4" stroke-linecap="round"><line x1="-6" y1="-6" x2="6" y2="6"/><line x1="-6" y1="6" x2="6" y2="-6"/></g>`;}
  s+=robotSVG(rb[0],rb[1],rb[2],bad);
  const W=w*U+2*M,H=h*U+2*M;
  return `<svg id="bd" viewBox="0 0 ${W} ${H}" style="max-width:${Math.min(W*1.25,400)}px" role="img" aria-label="ロボットの盤">${s}</svg>`;
}
/* ---- ルールの表示 ---- */
function rulesHTML(rules,on,blank){
  const nc=rules.filter(x=>x[0]!=='else').length;
  return `<div class="wkr">${rules.map(([cd,a],i)=>{
    const head=cd==='else'?(nc>1?'どれでもなければ':'そうでなければ'):(i===0?`もし <b>${CN[cd]}</b> なら`:`そうでなく <b>${CN[cd]}</b> なら`);
    let act=`<b class="wka">${AN[a]}</b>`;
    if(blank){const bi=P.blanks.findIndex(b=>b[0]===i); if(bi>=0){const v=S.fill[bi];
      act=`<button class="wkbl ${v?'set':''}" data-b="${bi}" ${S.lock[bi]||S.anim||S.done?'disabled':''}>${v?AN[v]:'？ タップ'}</button>`;}}
    return `<div class="wkl ${on===i?'on':''}"><span class="wkn">${i+1}</span><span>${head} → ${act}</span></div>`;}).join('')}</div>`;
}
const whyTxt=res=>res==='crash'?'かべにぶつかってしまいます':'同じところをぐるぐる回って、旗に着きません';
function qtext(){
  if(P.kind==='where')return 'ロボットがこのルールで動くと、<b>どの旗で止まる</b>？';
  if(P.kind==='count')return '旗に着くまでに、ロボットは<b>何マス進む</b>？（その場で向きを変えるだけの動きは数えません）';
  if(P.kind==='which')return '旗に着くことができるのは、<b>どのルール</b>？';
  return '<b>？</b>をタップして動きをえらび、ロボットが旗に着くルールを作ろう。';
}
function curRule(){ if(!S.view)return -1; const st=S.view.run.sts[S.view.k]; return st?st[3]:-1; }
function draw(){
  const k=P.kind, on=curRule();
  let body='';
  if(k==='where'||k==='count')body+=rulesHTML(P.rules,on);
  if(k==='make')body+=rulesHTML(S.fill.reduce((rs,v,bi)=>{if(v)rs[P.blanks[bi][0]][1]=v;return rs;},P.rules.map(x=>x.slice())),on,true);
  body+=`<p class="qq">${qtext()}</p>`;
  const dis=i=>S.done||S.anim||S.wrong.includes(i);
  if(k==='where'){const fl=P.flags.map(f=>f[2]).sort();
    body+=`<div class="opts4">${fl.map(l=>`<button class="ob ${S.done&&l===P.a?'right':''} ${S.wrong.includes(l)?'wrong':''}" data-l="${l}" ${S.done||S.anim||S.wrong.includes(l)?'disabled':''}><b style="font-size:20px">${l} の旗</b></button>`).join('')}</div>`;}
  if(k==='count')body+=`<div class="opts4">${S.nums.map((n,i)=>`<button class="ob ${S.done&&n===P.a?'right':''} ${S.wrong.includes(i)?'wrong':''}" data-i="${i}" ${dis(i)?'disabled':''}><span class="k">${'アイウエ'[i]}</span><b style="font-size:20px">${n}マス</b></button>`).join('')}</div>`;
  if(k==='which')body+=`<div class="wkopts">${S.order.map((oi,i)=>{const sel=S.view&&S.view.oi===oi;
    return `<button class="ob ${S.done&&oi===P.a?'right':''} ${S.wrong.includes(oi)||S.elim.includes(oi)?'wrong':''}" data-o="${oi}" ${S.done||S.anim||S.wrong.includes(oi)||S.elim.includes(oi)?'disabled':''}><span class="k">${'アイウエ'[i]}</span>${rulesHTML(P.opts[oi],sel?on:-1)}</button>`;}).join('')}</div>`;
  app.innerHTML=`${topBar()}<div class="boardw">${boardSVG()}</div>${body}
    ${S.done?'':`<p class="msg ${S.msgc}" id="msg">${S.msg}</p><div class="row">${k==='make'?`<button class="btn go" id="run" ${S.anim||S.fill.includes(null)?'disabled':''}>▶ 動かす</button>`:''}<button class="btn" id="hint" ${S.anim||hintMax()?'disabled':''}>ヒント</button></div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(explain());return;}
  if(k==='where'){
    app.querySelectorAll('.ob').forEach(b=>b.onclick=()=>pickFlag(b.dataset.l));
    app.querySelectorAll('.wkf').forEach(f=>f.addEventListener('click',()=>{if(!S.anim&&!S.wrong.includes(f.dataset.f))pickFlag(f.dataset.f);}));}
  if(k==='count')app.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
    if(S.nums[i]===P.a)win(S.sol);else{S.wrong.push(i);S.hints++;S.msg='ちがいます。1マスずつ指でたどって数えてみよう。';S.msgc='ng';draw();}});
  if(k==='which')app.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{const oi=+b.dataset.o;
    if(oi===P.a){S.ghost=null;win(S.sol,oi);return;}
    S.wrong.push(oi);S.hints++;const r=sim(P.opts[oi],stopSet());S.ghost=r;
    S.msg=`ちがいます。${'アイウエ'[S.order.indexOf(oi)]}のルールだと、${whyTxt(r.res)}（オレンジの線）。`;S.msgc='ng';draw();});
  if(k==='make'){
    app.querySelectorAll('.wkbl').forEach(b=>b.onclick=()=>{const bi=+b.dataset.b,ch=P.blanks[bi][1],v=S.fill[bi];
      S.fill[bi]=ch[(v?ch.indexOf(v)+1:0)%ch.length];S.ghost=null;S.view=null;S.msg='';S.msgc='';draw();});
    document.getElementById('run').onclick=()=>{const rs=filled(),r=sim(rs,stopSet());S.ghost=null;
      animate(r,null,()=>{if(r.res==='stop')S.done=true;else{S.msg=`このルールだと、${whyTxt(r.res)}。□の動きを変えてみよう。`;S.msgc='ng';}draw();});};
  }
  document.getElementById('hint').onclick=hint;
  if(!S.msg){const m=document.getElementById('msg');if(m)m.textContent=k==='make'?'？をうめたら「動かす」をおそう。':k==='where'?'旗のボタンか、盤の旗をタップしよう。':'';}
}
function filled(){const rs=P.rules.map(x=>x.slice());S.fill.forEach((v,bi)=>{rs[P.blanks[bi][0]][1]=v;});return rs;}
function pickFlag(l){
  if(S.done||S.anim)return;
  if(l===P.a){win(S.sol);return;}
  if(!S.wrong.includes(l)){S.wrong.push(l);S.hints++;}
  S.msg=`${l}の旗ではありません。ルールを上から見ながら、1つずつ動かしてみよう。`;S.msgc='ng';draw();
}
function win(run,oi){animate(run,oi,()=>{S.done=true;draw();});}
function animate(run,oi,end){
  S.anim=true;S.msg='ロボットが動いています…';S.msgc='';S.view={run,k:0,oi};draw();
  const n=run.sts.length-1, dt=Math.max(110,Math.min(380,5200/Math.max(n,1)));
  const tick=()=>{
    if(!S||!S.view||S.view.run!==run)return;
    if(S.view.k>=n){S.anim=false;S.msg='';end();return;}
    S.view.k++;
    const bd=document.getElementById('bd');if(bd)bd.outerHTML=boardSVG();
    const on=curRule();
    app.querySelectorAll('.wkr').forEach(box=>{const owner=box.closest('.ob');
      if(owner&&+owner.dataset.o!==oi)return;
      box.querySelectorAll('.wkl').forEach((l,i)=>l.classList.toggle('on',i===on));});
    setTimeout(tick,dt);
  };
  setTimeout(tick,350);
}
function hintMax(){
  if(P.kind==='where'||P.kind==='count')return S.hh>=2;
  if(P.kind==='which')return P.opts.filter((_,i)=>i!==P.a&&!S.wrong.includes(i)&&!S.elim.includes(i)).length<=1;
  return S.lock.every(x=>x);
}
function hint(){
  S.hints++;S.msgc='';
  if(P.kind==='where'||P.kind==='count'){const n=S.sol.sts.length-1;S.hh++;S.hk=Math.max(1,Math.min(n-1,Math.ceil(n*S.hh/3)));
    S.msg='ヒント：はじめのほうの動きを、点線で見せています。そのつづきを考えよう。';}
  else if(P.kind==='which'){const c=P.opts.map((_,i)=>i).filter(i=>i!==P.a&&!S.wrong.includes(i)&&!S.elim.includes(i));
    const oi=c[0];S.elim.push(oi);const r=sim(P.opts[oi],stopSet());S.ghost=r;
    S.msg=`ヒント：${'アイウエ'[S.order.indexOf(oi)]}のルールだと、${whyTxt(r.res)}（オレンジの線）。`;}
  else{const bi=S.lock.findIndex(x=>!x);S.fill[bi]=P.sol[bi];S.lock[bi]=true;S.ghost=null;S.view=null;
    S.msg=`ヒント：${P.blanks[bi][0]+1}番目のルールは「${AN[P.sol[bi]]}」です。`;}
  draw();
}
function explain(){
  const r=S.view?S.view.run:S.sol;
  if(P.kind==='where')return `<p style="margin:0">ロボットは ${r.moves}マス進み、${r.turns}回向きを変えて、<b>${P.a}の旗</b>で止まりました。ほかの旗には、それより前に通りません。</p>`;
  if(P.kind==='count'){const only=r.sts.slice(1).filter(s=>!MV[P.rules[s[3]][1]]).length;
    return `<p style="margin:0">1マス進んだのは <b>${r.moves}回</b>です。その場で向きを変えただけの動きは${only}回ありました（合わせると${r.sts.length-1}回ルールを使っています）。</p>`;}
  if(P.kind==='which')return `<p style="margin:0">正しいルールで、ロボットは ${r.moves}マス進んで旗に着きました。</p><ul style="margin:0;padding-left:1.2em;font-size:14px">${S.order.filter(oi=>oi!==P.a).map(oi=>`<li>${'アイウエ'[S.order.indexOf(oi)]}のルールだと、${whyTxt(sim(P.opts[oi],stopSet()).res)}。</li>`).join('')}</ul>${P.lv===5?'<p class="note">同じルールでも、<b>上から見る順番</b>がちがうと、ロボットの動きが変わります。</p>':''}`;
  const mine=S.fill.join(), ans=P.sol.join();
  return `<p style="margin:0">ロボットは ${r.moves}マス進んで旗に着きました。${P.nsol>1?(mine===ans?'じつは、ほかの組み合わせでも旗に着けます。さがしてみよう。':'あなたのルールでも旗に着けました。ほかに「'+P.sol.map(a=>AN[a]).join('」「')+'」の組み合わせでも着けます。'):''}</p>`;
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
