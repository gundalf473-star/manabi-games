<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>積み木の数</h1>
    <p class="lead">積み木の図を見て、数や表面の面の数を答えよう。5つのレベルから1問ずつ。ヒントやまちがいなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=false;
let QS=[{"lv":1,"kind":"count","h":[[1,1],[1,0],[1,0]],"ans":4,"id":"1-01"},{"lv":2,"kind":"count","h":[[2,1,1],[1,1,1],[1,1,1]],"ans":10,"id":"2-01"},{"lv":3,"kind":"count","h":[[5,4,1,1],[3,2,0,0],[2,0,0,0]],"ans":18,"id":"3-01"},{"lv":4,"kind":"box","h":[[3,1,1],[3,1,0],[3,0,0]],"ans":15,"id":"4-01"},{"lv":5,"kind":"cube","h":[[4,3,2],[1,0,0],[1,0,0]],"ans":53,"id":"5-01"}];
const ID='tsumiki';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>積み木の数 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* 積み木の数：p={kind:'count'|'box'|'cube'|'surface', h:[[高さ…]…]（奥の列から。左ほど・奥ほど高い）, ans} */
const HINTWORD='ヒントやまちがい';
const LVD={1:'数える（10個まで）',2:'数える（25個まで）',3:'数える・あと何個で直方体',4:'表面の数・直方体',5:'表面の数・あと何個で立方体'};
const RULES=`<ol class="rules">
  <li>同じ大きさの<b>立方体の積み木</b>が積んであります。</li>
  <li>積み木は宙にういていません。<b>上の面が見えている積み木の下には、必ず積み木があります</b>。</li>
  <li>問題を読んで、答えの数を数字のボタンで入れよう。</li>
  <li>「ヒント」で<b>真上から見た図</b>（それぞれの場所に何個積んであるか）が見られます（星がへります）。</li></ol>`;
const QTEXT={count:'積み木は、全部で何個ありますか。',
  box:'積み木を足して、すきまのない<b>直方体</b>にします。いちばん少なくて、あと何個必要ですか。',
  cube:'積み木を足して、すきまのない<b>立方体</b>にします。いちばん少なくて、あと何個必要ですか。',
  surface:'この立体の表面にある正方形の面は、全部で何面ですか。<b>床についている面もふくみます</b>。'};
const LAYER=[['#fca5a5','#ef4444','#b91c1c'],['#fcd34d','#f59e0b','#b45309'],['#86efac','#22c55e','#15803d'],['#93c5fd','#3b82f6','#1d4ed8'],['#d8b4fe','#a855f7','#7e22ce']];
function startStage(p){P=p;S={inp:'',hints:0,done:false,msg:'',top:false};begin(p);draw();}
const tot=h=>h.reduce((s,r)=>s+r.reduce((a,b)=>a+b,0),0);
function isoSVG(h){
  const R=h.length, C=h[0].length, a=34, k=a*0.866, k2=a*0.5, Z=a;
  const P2=(x,y,z)=>[(x-y)*k,(x+y)*k2-z*Z];
  const cubes=[]; for(let r=0;r<R;r++)for(let c=0;c<C;c++)for(let z=0;z<h[r][c];z++)cubes.push([r,c,z]);
  cubes.sort((A,B)=>(A[0]+A[1])-(B[0]+B[1])||A[2]-B[2]);
  const pts=[];cubes.forEach(([r,c,z])=>{[[c,r,z],[c+1,r+1,z],[c+1,r,z+1],[c,r+1,z+1],[c,r,z+1],[c+1,r+1,z+1]].forEach(q=>pts.push(P2(...q)));});
  /* 床 */
  [[0,0,0],[C,0,0],[C,R,0],[0,R,0]].forEach(q=>pts.push(P2(...q)));
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]), mx=Math.min(...xs)-8, my=Math.min(...ys)-8, W=Math.max(...xs)-mx+8, Hh=Math.max(...ys)-my+8;
  const pp=q=>q.map(x=>{const [sx,sy]=P2(...x);return `${(sx-mx).toFixed(1)},${(sy-my).toFixed(1)}`;}).join(' ');
  let s=`<polygon points="${pp([[0,0,0],[C,0,0],[C,R,0],[0,R,0]])}" fill="#e7e1d4" stroke="#cfc5b3"/>`;
  for(let r=0;r<=R;r++)s+=`<polyline points="${pp([[0,r,0],[C,r,0]])}" stroke="#d6cdbd" fill="none"/>`;
  for(let c=0;c<=C;c++)s+=`<polyline points="${pp([[c,0,0],[c,R,0]])}" stroke="#d6cdbd" fill="none"/>`;
  cubes.forEach(([r,c,z])=>{const L=LAYER[z%LAYER.length];
    s+=`<polygon points="${pp([[c,r+1,z],[c+1,r+1,z],[c+1,r+1,z+1],[c,r+1,z+1]])}" fill="${L[1]}" stroke="#2a2520" stroke-width="1.3" stroke-linejoin="round"/>`;
    s+=`<polygon points="${pp([[c+1,r,z],[c+1,r+1,z],[c+1,r+1,z+1],[c+1,r,z+1]])}" fill="${L[2]}" stroke="#2a2520" stroke-width="1.3" stroke-linejoin="round"/>`;
    s+=`<polygon points="${pp([[c,r,z+1],[c+1,r,z+1],[c+1,r+1,z+1],[c,r+1,z+1]])}" fill="${L[0]}" stroke="#2a2520" stroke-width="1.3" stroke-linejoin="round"/>`;});
  return `<svg viewBox="0 0 ${W.toFixed(0)} ${Hh.toFixed(0)}" style="max-width:${Math.min(W*1.25,440).toFixed(0)}px" role="img" aria-label="積み木の図">${s}</svg>`;
}
function topSVG(h){
  const R=h.length,C=h[0].length,u=34;let s='';
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){const v=h[r][c];s+=`<rect x="${c*u+1}" y="${r*u+1}" width="${u-2}" height="${u-2}" rx="4" fill="${v?'#ede4fd':'#f6f3ec'}" stroke="#bfb3d9"/>${v?`<text x="${c*u+u/2}" y="${r*u+u/2+6}" text-anchor="middle" font-size="17" font-weight="700" fill="#3b2f6b" font-family="sans-serif">${v}</text>`:''}`;}
  return `<figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:4px"><svg viewBox="-1 -1 ${C*u+2} ${R*u+2}" width="${C*u+2}" height="${R*u+2}" aria-label="真上から見た図">${s}</svg><figcaption class="note">真上から見た図（数字は、そこに積んである個数）</figcaption></figure>`;
}
function explain(){
  const h=P.h,R=h.length,C=h[0].length,T=tot(h),mh=Math.max(...h.flat());
  const sumx=h.flat().filter(x=>x).join('＋');
  if(P.kind==='count')return `真上から見た図に高さを書いて、たします。${sumx}＝<b>${T}個</b>`;
  if(P.kind==='box')return `いちばん小さい直方体は、たて${R}・横${C}・高さ${mh}なので ${R}×${C}×${mh}＝${R*C*mh}個。今ある積み木は ${T}個なので、${R*C*mh}－${T}＝<b>${P.ans}個</b>`;
  if(P.kind==='cube'){const n=Math.max(R,C,mh);return `いちばん長いところが ${n}個分なので、1辺 ${n}個の立方体にします。${n}×${n}×${n}＝${n**3}個。今ある積み木は ${T}個なので、${n**3}－${T}＝<b>${P.ans}個</b>`;}
  const top=h.flat().filter(x=>x).length, front=[...Array(C).keys()].reduce((s,c)=>s+Math.max(...h.map(r=>r[c])),0), side=h.reduce((s,r)=>s+Math.max(...r),0);
  return `真上から見ると ${top}面、左手前の向きから見ると ${front}面、右手前の向きから見ると ${side}面。反対の向き（真下・右おく・左おく）からも同じ数だけ見えるので、（${top}＋${front}＋${side}）×2＝<b>${P.ans}面</b>。<br><small>この立体は、手前に来るほど低い「階だん」の形なので、この数え方が使えます。</small>`;
}
function draw(){
  app.innerHTML=`${topBar()}
    <div class="boardw">${isoSVG(P.h)}</div>
    <p class="qq">${QTEXT[P.kind]}</p>
    ${S.top||S.done?`<div class="row" style="justify-content:center">${topSVG(P.h)}</div>`:''}
    ${S.done?'':`<div class="ans"><output id="out">${S.inp||'&nbsp;'}</output><span>${P.kind==='surface'?'面':'個'}</span></div>
    <p class="msg ${S.msgc||''}" id="msg">${S.msg||''}</p>
    <div class="keys">${['7','8','9','⌫','4','5','6','C','1','2','3','','0','OK'].map(k=>k===''?'<span></span>':`<button data-k="${k}" class="${k==='OK'?'go':''}" ${k==='OK'?'style="grid-column:span 2"':''}>${k==='OK'?'答える':k}</button>`).join('')}</div>
    <div class="row"><button class="btn" id="hint" ${S.top?'disabled':''}>ヒント（真上から見た図）</button></div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(`<div class="ex">${explain()}</div>`);return;}
  app.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>key(b.dataset.k));
  document.getElementById('hint').onclick=()=>{S.top=true;S.hints++;S.msg='ヒント：真上から見た図を出しました。';S.msgc='';draw();};
}
function key(k){
  if(k==='OK'){if(!S.inp)return; const v=+S.inp;
    if(v===P.ans){S.done=true;draw();return;}
    S.hints++; S.msg=`${v}${P.kind==='surface'?'面':'個'}ではありません。もう一度数えてみよう。`; S.msgc='ng'; S.inp=''; draw(); return;}
  if(k==='⌫')S.inp=S.inp.slice(0,-1); else if(k==='C')S.inp=''; else if(S.inp.length<3)S.inp=(S.inp+k).replace(/^0+(?=\d)/,'');
  document.getElementById('out').innerHTML=S.inp||'&nbsp;';
}
document.addEventListener('keydown',e=>{if(!S||S.done||!document.getElementById('out'))return;if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('⌫');else if(e.key==='Enter')key('OK');});

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
