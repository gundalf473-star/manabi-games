</style>

<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>トーナメントの数 100問</h1>
    <p class="lead">勝ちぬき戦の試合は全部で何試合？ シードは何人？ だれとだれが何回戦で当たる？ 手がかりから結果もうめよう。5つのレベルに20問ずつ。ヒントやまちがいなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=true;
let QS=[];
const ID='tournament';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>トーナメントの数 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* トーナメントの数：p.kind='fill'（N,kids,clues,sol…結果をうめる）か 'q'（q=count|cw|games|byes|r1|meet|canmeet|rev|minplay, a, ds） */
const HINTWORD='ヒントやまちがい';
const LVD={1:'4人の結果・試合を数える',2:'シードあり・何試合？',3:'シードは何人？・8人',4:'何回戦で当たる？・3位決定戦',5:'試合数から人数・むずかしい推理'};
const RULES=`<ol class="rules">
  <li><b>トーナメント</b>は勝ちぬき戦です。勝った人が次の試合に進み、負けた人はそこで終わり。<b>引き分けはありません</b>。</li>
  <li>結果をうめる問題では、<b>勝った人の丸をタップ</b>すると、その人が次の試合へ進みます（赤い線）。もう一度タップすると取り消せます。手がかりに合うように、優勝まで全部うめよう。</li>
  <li><b>シード</b>は、1回戦をしないで2回戦から出る人です。</li>
  <li>数を答える問題は、4つの中から答えをえらぼう。</li></ol>`;
const LT='ABCDEFGHIJKLMNOP';
const rname=(r,top)=>r===top?'決勝':r+'回戦';
function tinfo(N,kids){
  const par={},root=N+kids.length-1;kids.forEach(([a,c],j)=>{par[a]=N+j;par[c]=N+j;});
  const dep=v=>{let d=0;while(v!==root){v=par[v];d++;}return d;};
  let top=0;for(let i=0;i<N;i++)top=Math.max(top,dep(i));
  const rnd={};for(let j=0;j<kids.length;j++)rnd[N+j]=top-dep(N+j);
  const order=[];const go=v=>{if(v<N){order.push(v);return;}go(kids[v-N][0]);go(kids[v-N][1]);};go(root);
  return {par,root,top,rnd,order};
}
/* W: 試合→勝者（なければ未定）。opt: {tap:true, hi:[選手], show:結果を全部表示するか} */
function bracketSVG(N,kids,W,opt){
  opt=opt||{};const T=tinfo(N,kids),big=N>8,rowH=big?24:(N<=4?52:40),VW=340,X0=big?30:36,cr=big?10:13,fs=big?12:15;
  const top=T.top,colW=(VW-X0-58)/top,H=26+N*rowH+6;
  const xs=v=>v<N?X0:X0+T.rnd[v]*colW;const pos={};
  T.order.forEach((v,i)=>pos[v]=[X0,30+i*rowH+rowH/2]);
  kids.forEach(([a,c],j)=>{const v=N+j;pos[v]=[xs(v),(pos[a][1]+pos[c][1])/2];});
  const win=v=>v<N?v:W[v];
  let s='',ch='';
  for(let r=1;r<=top;r++)s+=`<text x="${X0+r*colW}" y="15" text-anchor="middle" font-size="12" font-weight="700" fill="#6a625a" font-family="sans-serif">${rname(r,top)}</text>`;
  const RED='#dc2626',GR='#9a8f80';
  kids.forEach(([a,c],j)=>{const v=N+j,xv=pos[v][0],yv=pos[v][1],w=W[v];
    [a,c].forEach(u=>{const on=w!=null&&win(u)===w,[xu,yu]=pos[u];
      s+=`<line x1="${xu}" y1="${yu}" x2="${xv}" y2="${yu}" stroke="${on?RED:GR}" stroke-width="${on?4:2}" stroke-linecap="round"/>`;
      s+=`<line x1="${xv}" y1="${yu}" x2="${xv}" y2="${yv}" stroke="${on?RED:GR}" stroke-width="${on?4:2}" stroke-linecap="round"/>`;});
  });
  const rt=T.root,[xr,yr]=pos[rt],cw=W[rt]!=null;
  s+=`<line x1="${xr}" y1="${yr}" x2="${xr+34}" y2="${yr}" stroke="${cw?RED:GR}" stroke-width="${cw?4:2}" stroke-linecap="round"/>`;
  s+=`<g transform="translate(${xr+32},${yr-34})"><path d="M-9,0 H9 L7,10 Q0,16 -7,10 Z" fill="#fcd34d" stroke="#a97c12" stroke-width="1.5"/><rect x="-3" y="13" width="6" height="5" fill="#a97c12"/><rect x="-7" y="18" width="14" height="3" rx="1" fill="#a97c12"/></g>`;
  const chip=(x,y,pl,at,cls)=>{const hi=(opt.hi||[]).includes(pl);
    return `<g class="tnchip ${opt.tap?'tap':''}" data-p="${pl}" data-at="${at}" ${opt.tap?`role="button" aria-label="${LT[pl]}さん"`:''}><circle cx="${x}" cy="${y}" r="${opt.tap?cr+8:cr}" fill="transparent"/><circle cx="${x}" cy="${y}" r="${cr}" fill="${hi?'#fde68a':cls==='w'?'#fee2e2':'#fff'}" stroke="${hi?'#a97c12':cls==='w'?RED:'#3b2f6b'}" stroke-width="2"/><text x="${x}" y="${y+fs*0.36}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="#2a2520" font-family="sans-serif">${LT[pl]}</text></g>`;};
  for(let i=0;i<N;i++)ch+=chip(X0-cr-4,pos[i][1],i,i,'');
  kids.forEach(([a,c],j)=>{const v=N+j,[xv,yv]=pos[v],off=v===rt?32:Math.min(22,colW/2.6);
    if(W[v]!=null)ch+=chip(xv+off,yv,W[v],v,'w');
    else if(opt.tap&&win(a)!=null&&win(c)!=null)ch+=`<circle cx="${xv+off}" cy="${yv}" r="${cr-2}" fill="#fff" stroke="#b9a88f" stroke-width="1.5" stroke-dasharray="3 2"/><text x="${xv+off}" y="${yv+4}" text-anchor="middle" font-size="12" fill="#b9a88f" font-family="sans-serif">?</text>`;});
  return `<svg id="bk" viewBox="0 0 ${VW} ${H}" style="max-width:${VW*1.15}px" role="img" aria-label="トーナメント表">${s}${ch}</svg>`;
}
function startStage(p){P=p;S={W:{},hints:0,done:false,msg:'',msgc:'',bad:[],opts:p.kind==='q'?shuffle([p.a,...p.ds]):null,wrong:[],hint:false};begin(p);draw();}
function draw(){ if(P.kind==='fill')drawFill(); else drawQ(); }

/* ---------- 結果をうめる ---------- */
const CNUM='①②③④⑤⑥⑦⑧';
function games(W){const g=[];P.kids.forEach(([a,c],j)=>{const v=P.N+j,wa=a<P.N?a:W[a],wc=c<P.N?c:W[c];g.push([v,wa,wc,W[v]]);});return g;}
function evalClue(c,W){
  const g=games(W),T=tinfo(P.N,P.kids),x=c.x,y=c.y,wins=q=>g.filter(e=>e[3]===q).length,meet=(p,q)=>g.some(e=>(e[1]===p&&e[2]===q)||(e[1]===q&&e[2]===p));
  switch(c.t){
    case 'beat':return g.some(e=>((e[1]===x&&e[2]===y)||(e[1]===y&&e[2]===x))&&e[3]===x);
    case 'lostin':return g.some(e=>T.rnd[e[0]]===c.k&&(e[1]===x||e[2]===x)&&e[3]!==x);
    case 'champ':return W[T.root]===x; case 'notchamp':return W[T.root]!==x;
    case 'wins':return wins(x)===c.k; case 'met':return meet(x,y); case 'notmet':return !meet(x,y);
    case 'more':return wins(x)>wins(y); case 'final':{const e=g[g.length-1];return e[1]===x||e[2]===x;}}
  return false;
}
function fixW(){P.kids.forEach(([a,c],j)=>{const v=P.N+j,wa=a<P.N?a:S.W[a],wc=c<P.N?c:S.W[c];if(S.W[v]!=null&&S.W[v]!==wa&&S.W[v]!==wc)delete S.W[v];});}
function drawFill(){
  const all=P.kids.every((_,j)=>S.W[P.N+j]!=null);
  app.innerHTML=`${topBar()}
    <p class="note" style="margin:0">${P.N}人のトーナメントの結果を、手がかりから うめよう。勝った人の丸をタップすると、次へ進みます。</p>
    <div class="tnlab">手がかり</div>
    <ol class="tnclues">${P.clues.map((c,i)=>`<li class="${S.bad.includes(i)?'bad':''}"><b>${CNUM[i]}</b><span>${esc(c.txt)}</span></li>`).join('')}</ol>
    <div class="boardw" id="bw">${bracketSVG(P.N,P.kids,S.W,{tap:!S.done})}</div>
    ${S.done?'':`<p class="msg ${S.msgc}" id="msg">${S.msg||'勝った人の丸をタップ。もう一度タップで取り消し。'}</p>
    <div class="row"><button class="btn go" id="chk" ${all?'':'disabled'}>答え合わせ</button><button class="btn" id="hint">ヒント</button><button class="btn" id="clr">やりなおす</button></div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){const T=tinfo(P.N,P.kids);showClear(`<p style="margin:0">結果は、この1通りだけです。優勝は <b>${LT[S.W[T.root]]}さん</b>。試合は全部で ${P.N-1}試合でした（1試合ごとに1人ずつ負けるので、${P.N}人−1）。</p>`);return;}
  app.querySelectorAll('.tnchip.tap').forEach(g=>g.addEventListener('click',()=>{
    const pl=+g.dataset.p,at=+g.dataset.at,T=tinfo(P.N,P.kids),pa=T.par[at];if(pa==null)return;
    if(S.W[pa]===pl)delete S.W[pa];else S.W[pa]=pl;fixW();S.bad=[];if(S.msgc==='ng'){S.msg='';S.msgc='';}draw();}));
  document.getElementById('chk').onclick=()=>{
    const bad=P.clues.map((c,i)=>evalClue(c,S.W)?-1:i).filter(i=>i>=0);
    if(!bad.length){S.done=true;draw();return;}
    S.bad=bad;S.hints++;S.msg=`手がかり ${bad.map(i=>CNUM[i]).join('・')} に合っていません。赤い手がかりを見直そう。`;S.msgc='ng';draw();};
  document.getElementById('hint').onclick=fillHint;
  document.getElementById('clr').onclick=()=>{S.W={};S.bad=[];S.msg='';S.msgc='';draw();};
}

/* ヒント：どの手がかりから、どの試合の勝ちがわかるかを見つけて教える */
function allOut(){if(P._out)return P._out;const n=P.kids.length,res=[];
  for(let b=0;b<(1<<n);b++){const W={};for(let j=0;j<n;j++){const [a,c]=P.kids[j],wa=a<P.N?a:W[a],wc=c<P.N?c:W[c];W[P.N+j]=(b>>j)&1?wc:wa;}res.push(W);}
  P._M=P.clues.map(c=>res.map(W=>evalClue(c,W)));return P._out=res;}
function fillHint(){
  const T=tinfo(P.N,P.kids),OUT=allOut(),nc=P.clues.length,sol=v=>P.sol[v-P.N];
  const vs=P.kids.map((_,j)=>P.N+j).sort((u,v)=>T.rnd[u]-T.rnd[v]||u-v),todo=vs.filter(v=>S.W[v]!==sol(v));
  if(!todo.length){S.msg='全部正しくうまっています。「答え合わせ」をおそう。';S.msgc='';draw();return;}
  const known=vs.filter(v=>S.W[v]===sol(v)),subs=[];
  for(let m=0;m<(1<<nc);m++)subs.push(m);subs.sort((a,b)=>pc(a)-pc(b)||a-b);
  function pc(m){let k=0;while(m){k+=m&1;m>>=1;}return k;}
  const forced=(m,useK,v)=>OUT.every((W,i)=>{for(let c=0;c<nc;c++)if((m>>c)&1&&!P._M[c][i])return true;
    if(useK&&known.some(u=>W[u]!==sol(u)))return true;return W[v]===sol(v);});
  let pick=null;
  for(const m of subs){for(const v of todo)if(forced(m,true,v)){pick=[m,v];break;}if(pick)break;}
  const [m,v]=pick,alone=forced(m,false,v),w=sol(v);
  /* その人がその試合まで勝ち進んだ線も、いっしょにうめる */
  let u=w;while(u!==v){u=T.par[u];S.W[u]=w;}fixW();S.hints++;S.bad=[];
  const cs=[];for(let c=0;c<nc;c++)if((m>>c)&1)cs.push(CNUM[c]);
  const from=cs.length?`手がかり${cs.join('と')}${alone?'':'と、正しくうめた結果'}から`:'正しくうめた結果から';
  const [a,c]=P.kids[v-P.N],wa=a<P.N?a:S.W[a],wc=c<P.N?c:S.W[c];
  const what=wa!=null&&wc!=null?`${rname(T.rnd[v],T.top)}の ${LT[wa]}さんと ${LT[wc]}さんの試合は、${LT[w]}さんの勝ち`:v===T.root?`${LT[w]}さんが 優勝する`:`${rname(T.rnd[v],T.top)}の ${LT[w]}さんの試合は、${LT[w]}さんの勝ち`;
  S.msg=`ヒント：${from}、${what}とわかります。`;S.msgc='';draw();}

/* ---------- 数を答える ---------- */
const SETUP='回戦の数が いちばん少なくなるように組みます。シードがあるのは1回戦だけで、2回戦からは 全員が試合をして、人数がちょうど半分ずつへります。';
const NODRAW='どの試合も、かならず どちらかが勝ちます。';
function qtext(){const p=P,X=p.x!=null?LT[p.x]+'さん':'',Y=p.y!=null?LT[p.y]+'さん':'';
  switch(p.q){
    case 'count':return 'この図のトーナメントで、試合は <b>全部で何試合</b>？';
    case 'cw':return `<span class="tnhi">${X}</span>が 優勝するには、<b>何回 勝たないといけない</b>？`;
    case 'games':return `${p.N}人で トーナメント戦をします。${NODRAW}${p.third?'さらに、<b>3位決定戦</b>（準決勝で負けた2人の試合）もします。':''}試合は <b>全部で何試合</b>？`;
    case 'byes':return `${p.N}人で トーナメント戦をします。${SETUP}1回戦をしないで2回戦から出る人（<b>シード</b>）は <b>何人</b>？`;
    case 'r1':return `${p.N}人で トーナメント戦をします。${SETUP}<b>1回戦は 何試合</b>？`;
    case 'meet':return `<span class="tnhi">${X}</span>と <span class="tnhi">${Y}</span>が 2人とも勝ち進んだら、<b>何回戦</b>で 試合をする？`;
    case 'canmeet':return `<span class="tnhi">${X}</span>が <b>${rname(p.r,p.top)}</b>で 試合をするかもしれない相手は、<b>何人</b>？`;
    case 'rev':return `トーナメント戦をしたら、試合は 全部で ${p.T}試合でした${p.third?'（<b>3位決定戦</b>の1試合もふくみます）':''}。${NODRAW}出た人は <b>何人</b>？`;
    case 'minplay':return `${p.N}人で トーナメント戦をします。${SETUP}優勝した人が した試合の数は、<b>${p.ask==='min'?'いちばん少ないとき':'いちばん多いとき'}で何試合</b>？`;}
}
function unit(){return {count:'試合',cw:'回',games:'試合',byes:'人',r1:'試合',canmeet:'人',rev:'人',minplay:'試合'}[P.q]||'';}
function optLabel(o){return P.q==='meet'?(o===0?'当たらない':o===P.top?'決勝':o+'回戦'):o+unit();}
function bye2(n){let M=1;while(M*2<n)M*=2;return {M,m:n-M,b:2*M-n,k:Math.log2(M)+1};}
function hintText(){const p=P,N=p.N;switch(p.q){
  case 'count':{const e=N===4?3:4;return `1試合をすると、負ける人が ちょうど1人 決まります。優勝した人のほかは、みんな1回だけ負けます。たとえば ${e}人なら、負ける人は ${e-1}人なので ${e-1}試合。図の人数で考えてみよう。`;}
  case 'games':{const e=N===8?4:8;return `1試合をすると、負ける人が ちょうど1人 決まります。たとえば ${e}人なら、優勝する1人のほかの ${e-1}人が1回ずつ負けるので ${e-1}試合。${p.third?'3位決定戦は、トーナメントの試合とは べつの1試合です。':''}`;}
  case 'rev':{const e=p.T===7?3:7;return `トーナメントの試合の数は「人数−1」です。だから、反対に 人数は「試合の数＋1」。たとえば ${e}試合なら ${e+1}人です。${p.third?'でも、3位決定戦は トーナメントの試合ではないので、先に1試合 引いておこう。':''}`;}
  case 'cw':return `${LT[p.x]}さんの丸から 優勝カップまで 線をたどり、通る試合（線が合わさる所）を数えよう。シードの人は1回戦をしないので、そのぶん少なくなります。`;
  case 'minplay':{const e=N===6?12:6,B=bye2(e);return `まず、決勝が何回戦かを考えよう。たとえば ${e}人なら、2回戦は ${B.M}人なので、決勝は ${B.k}回戦。1回戦から出た人が優勝すると ${B.k}試合、シードの人が優勝すると ${B.k-1}試合です。`;}
  case 'byes':case 'r1':{const e=N===6?10:6,B=bye2(e);return `2回戦に出る人数は、全員の人数より少ない 2・4・8・16・32・64… のうち いちばん大きい数です。たとえば ${e}人なら、2回戦は ${B.M}人。1回戦の1試合で1人へるので、1回戦は ${e}−${B.M}＝${B.m}試合。1回戦に出るのは ${B.m}×2＝${B.m*2}人で、シードは ${e}−${B.m*2}＝${B.b}人です。`;}
  case 'meet':return '2人の丸から それぞれ線をたどり、2本の線が はじめて合わさる所をさがそう。その所の 上に書いてある回戦が、2人が当たる試合です。';
  case 'canmeet':return `1回戦の相手は 1人だけです。${rname(p.r,p.top)}で当たる相手は、${LT[p.x]}さんの線と ${rname(p.r,p.top)}で合わさる、となりの「グループ」から 勝ち上がってくる人です。そのグループに 何人いるか、図の線をたどって数えよう。`;}}
function explain(){const p=P,N=p.N;
  switch(p.q){
    case 'count':return `1試合で1人ずつ負けます。優勝した1人のほかの ${N-1}人が1回ずつ負けるので、${N}−1＝<b>${p.a}試合</b>です。`;
    case 'games':return `1試合で1人ずつ負けるので、トーナメントだけで ${N}−1＝${N-1}試合。${p.third?`3位決定戦の1試合をたして、<b>${p.a}試合</b>です。`:`答えは <b>${p.a}試合</b>です。`}`;
    case 'rev':return `トーナメントの試合の数は「人数−1」です。${p.third?`3位決定戦の1試合を引くと ${p.T}−1＝${p.T-1}試合なので、人数は ${p.T-1}＋1＝<b>${p.a}人</b>。`:`だから人数は ${p.T}＋1＝<b>${p.a}人</b>です。`}`;
    case 'cw':{const T=tinfo(N,p.kids),seed=T.rnd[T.par[p.x]]>=2;return `${LT[p.x]}さんは ${seed?'シードなので2回戦から出ます。':'1回戦から出ます。'}優勝までに <b>${p.a}回</b>勝つ必要があります。`;}
    case 'byes':case 'r1':{const M=p.m+p.b;return `2回戦に出る人数は、${N}人より少ない 2・4・8・16…のうち いちばん大きい ${M}人です。1回戦の1試合で1人へるので、1回戦は ${N}−${M}＝<b>${p.m}試合</b>。1回戦に出るのは ${p.m}×2＝${p.m*2}人なので、シードは ${N}−${p.m*2}＝<b>${p.b}人</b>です。`;}
    case 'meet':return `2人の線がはじめて合わさるのが、2人が当たる試合で、<b>${rname(p.a,p.top)}</b>です。2人とも、そこまで勝ち進んだときだけ試合をします。トーナメントでは、どの2人も 勝ち進めば かならず どこかで当たります。`;
    case 'canmeet':return `${rname(p.r,p.top)}の相手は、となりの ${p.a}人のグループから勝ちあがった人です。だから <b>${p.a}人</b>のだれかです。`;
    case 'minplay':{const k=Math.ceil(Math.log2(N));return `${N}人だと、決勝は ${k}回戦です。1回戦から出た人が優勝すると ${k}試合、シードの人が優勝すると ${k-1}試合。${p.ask==='min'?'少ないとき':'多いとき'}は <b>${p.a}試合</b>です。`;}}
}
function figQ(){
  const p=P;
  if(p.q==='count'||p.q==='cw'||p.q==='meet'||p.q==='canmeet')return `<div class="boardw">${bracketSVG(p.N,p.kids,{},{hi:[p.x,p.y].filter(v=>v!=null)})}</div>`;
  if(p.q==='rev'||p.q==='games')return `<div class="tnbig"><svg viewBox="0 0 64 48" width="64" height="48" aria-hidden="true"><path d="M8,46 V34 H20 V46 M44,46 V34 H56 V46 M14,34 V24 H50 V34 M32,24 V18" fill="none" stroke="#9a8f80" stroke-width="3" stroke-linejoin="round"/><path d="M24,2 H40 L38,10 Q32,15 26,10 Z" fill="#fcd34d" stroke="#a97c12" stroke-width="1.5"/><rect x="30" y="13" width="4" height="4" fill="#a97c12"/></svg><span>${p.q==='rev'?p.T+'試合':p.N+'人'}</span></div>`;
  return `<div class="tnbig"><svg viewBox="0 0 64 48" width="64" height="48" aria-hidden="true"><path d="M8,46 V34 H20 V46 M44,46 V34 H56 V46 M14,34 V24 H50 V34 M32,24 V18" fill="none" stroke="#9a8f80" stroke-width="3" stroke-linejoin="round"/><path d="M24,2 H40 L38,10 Q32,15 26,10 Z" fill="#fcd34d" stroke="#a97c12" stroke-width="1.5"/><rect x="30" y="13" width="4" height="4" fill="#a97c12"/></svg><span>${p.N}人</span></div>`;
}
function drawQ(){
  app.innerHTML=`${topBar()}
    ${figQ()}
    <p class="qq">${qtext()}</p>
    <div class="opts4 txt">${S.opts.map((o,i)=>`<button class="ob ${S.done&&o===P.a?'right':''} ${S.wrong.includes(i)?'wrong':''}" data-i="${i}" ${S.done||S.wrong.includes(i)?'disabled':''}><span class="k">${'アイウエ'[i]}</span><b style="font-size:20px">${optLabel(o)}</b></button>`).join('')}</div>
    ${S.hint&&!S.done?`<p class="hintbox">${hintText()}</p>`:''}
    ${S.done?'':`<p class="msg ${S.msgc||''}" id="msg">${S.msg||''}</p><div class="row"><button class="btn" id="hint" ${S.hint?'disabled':''}>ヒント</button></div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){const ex=(P.q==='byes'||P.q==='r1'||P.q==='minplay')&&P.kids?`<div class="boardw">${bracketSVG(P.N,P.kids,{},{})}</div><p class="note">組み方の一例です（シードの人は、線が長く2回戦につながっています）。</p>`:'';
    showClear(`<p style="margin:0">${explain()}</p>${ex}`);return;}
  app.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(S.opts[i]===P.a){S.done=true;draw();}else{S.wrong.push(i);S.hints++;S.msg='ちがいます。もう一度考えてみよう。';S.msgc='ng';draw();}});
  document.getElementById('hint').onclick=()=>{S.hint=true;S.hints++;S.msg='';draw();};
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
