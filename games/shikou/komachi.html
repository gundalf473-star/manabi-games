<title>小町算</title>
<meta name="game:subject" content="思考力">
<meta name="game:unit" content="数のパズル">
<meta name="game:grade" content="小2〜">
<meta name="game:players" content="1人">
<meta name="description" content="ならんだ数字のすき間に ＋ － × ÷ を入れたり、数字をつないだりして、めざす数を作る計算パズル。すき間をタップするだけで遊べます。5つのレベルから1問ずつ、全5問。">

</style>

<div class="wrap">
  <header>
    <h1><small>思考力パズル</small>小町算</h1>
    <p class="lead">数字のすき間をタップして ＋ や － を入れ、めざす数を作ろう。5つのレベルから1問ずつ。ヒントなしでクリアすると★3つ。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=false;
let QS=[{"ds":[3,2,1],"t":2,"ops":"+-","sol":"-+","n":1,"lv":1,"id":"1-01"},{"ds":[1,2,3,4,5],"t":7,"ops":"+-","sol":"++-+","n":1,"lv":2,"id":"2-01"},{"ds":[1,2,3,4,5],"t":14,"ops":"+-c","sol":"c++-","n":1,"lv":3,"id":"3-01"},{"ds":[2,8,6,4,3],"t":108,"ops":"+-*","sol":"**+*","n":1,"lv":4,"id":"4-01"},{"ds":[1,2,3,4,5,6,7,8,9],"t":100,"ops":"+-c","sol":"++-+++c+","n":11,"lv":5,"id":"5-01"}];
const ID='komachi';
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKEY=PAID?ID+'-p-stars':ID+'-f-stars';
let stars=store.get(SKEY,{});
const LVN={1:'レベル1',2:'レベル2',3:'レベル3',4:'レベル4',5:'レベル5'};
const PAIDLINK=`<a class="paid" href="${ID}-full.html" id="paid-link"><span class="pt">もっと遊びたい人へ　<b>小町算 100問</b>（有料版）</span><span class="pd">無料版の5問もふくむ全100問。5つのレベルに20問ずつ。クリアした問題に星がつきます。</span></a>`;
let P=null, S=null;
const topBar=()=>`<div class="top"><span class="tag">${LVN[P.lv]}</span><b>${PAID?'第'+(+P.id.split('-')[1])+'問':''}</b><button class="back" id="back">問題えらびへ</button></div>`;
const bindBack=()=>{document.getElementById('back').onclick=home;};
const begin=p=>track('level_start',{level_name:(PAID?ID+'-p-':ID+'-')+p.id});

/* ======== パズルごとの部分 ======== */
/* 小町算：p={ds:[数字], t:めざす数, ops:使える記号の文字列（+ - * / と c=つなぐ）, sol, n:答えの数}
   計算は ×÷ を先に（分数のまま正しく計算）。めざす数になれば、どの式でも正解 */
const HINTWORD='ヒント';
const LVD={1:'3〜4この数字・＋と－',2:'5〜6この数字・＋と－',3:'数字をつなげて大きな数に',4:'×も使う（かけ算が先）',5:'1〜9で100・÷も使う'};
const RULES=`<ol class="rules">
  <li>数字のあいだの<b>すき間をタップ</b>すると、＋ → － → … と記号がかわります。</li>
  <li>式の答えが<b>めざす数</b>になったらクリア！　答えがいくつもある問題もあります。</li>
  <li>レベル3から、すき間を<b>つなぐ</b>が使えます（1と2をつなぐと「12」、1と2と3をつなぐと「123」）。</li>
  <li>レベル4から×、レベル5から÷も使えます。×や÷があるときは、<b>×と÷を先に</b>計算します（1＋2×3 は 1＋6 ＝ 7）。そのあと、左から順に計算します。</li></ol>`;
const KO_SYM={'+':'＋','-':'－','*':'×','/':'÷','c':''};
const koG=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;};
const fr=(n,d)=>{if(d<0){n=-n;d=-d;}const g=koG(n,d);return [n/g,d/g];};
const fadd=(a,b,s)=>fr(a[0]*b[1]+s*b[0]*a[1],a[1]*b[1]);
const fstr=a=>a[1]===1?String(a[0]):`${a[0]<0?'－':''}${Math.abs(a[0])}/${a[1]}`;
function koNums(ds,ops){const nums=[ds[0]],os=[];ops.forEach((o,i)=>{if(o==='c')nums[nums.length-1]=nums[nums.length-1]*10+ds[i+1];else{nums.push(ds[i+1]);os.push(o);}});return {nums,os};}
/* 計算と、説明用の途中式 */
function koEval(ds,ops){const {nums,os}=koNums(ds,ops),terms=[{v:[nums[0],1],txt:String(nums[0]),mul:false}],sg=[];
  nums.slice(1).forEach((n,i)=>{const o=os[i],T=terms[terms.length-1];
    if(o==='*'){T.v=fr(T.v[0]*n,T.v[1]);T.txt+='×'+n;T.mul=true;}
    else if(o==='/'){T.v=fr(T.v[0],T.v[1]*n);T.txt+='÷'+n;T.mul=true;}
    else{terms.push({v:[n,1],txt:String(n),mul:false});sg.push(o);}});
  let v=terms[0].v;terms.slice(1).forEach((t,i)=>{v=fadd(v,t.v,sg[i]==='+'?1:-1);});
  return {v,nums,os,terms,sg};}
const koExpr=(ds,ops)=>ds.map((d,i)=>i?(KO_SYM[ops[i-1]]+d):String(d)).join('');
function koAll(){const n=P.ds.length-1,A=[...P.ops],out=[];const ops=Array(n).fill('+');
  const rec=i=>{if(i===n){const v=koEval(P.ds,ops).v;if(v[1]===1&&v[0]===P.t)out.push(ops.join(''));return;}for(const o of A){ops[i]=o;rec(i+1);}};rec(0);return out;}
function startStage(p){P=p;S={hints:0,done:false,ops:Array(p.ds.length-1).fill('+'),lock:[],msg:'',all:null};begin(p);draw();}
function cur(){return koEval(P.ds,S.ops);}
function draw(){
  const e=cur(),ok=e.v[1]===1&&e.v[0]===P.t;
  if(ok&&!S.done){S.done=true;}
  const big=P.ds.length>=8;
  app.innerHTML=`${topBar()}
    <div class="kmgoal">めざす数　<b>${P.t}</b></div>
    <div class="kmx ${big?'big':''}">${P.ds.map((d,i)=>`${i?`<button class="kgap ${S.ops[i-1]==='c'?'cat':''} ${S.lock.includes(i-1)?'lk':''}" data-g="${i-1}" ${S.done||S.lock.includes(i-1)?'disabled':''} aria-label="すき間${i}">${KO_SYM[S.ops[i-1]]||'<small>つなぐ</small>'}</button>`:''}<span class="kd">${d}</span>`).join('')}<span class="keq">＝ ${e.v[0]<0?'<small style="font-size:17px">0より小さい</small>':fstr(e.v)}</span></div>
    <p class="note" style="text-align:center">使える記号：${[...P.ops].map(o=>o==='c'?'つなぐ':KO_SYM[o]).join('　')}</p>
    ${/[*\/]/.test(P.ops)?`<p class="note" style="text-align:center;color:var(--fg)"><b>${P.ops.includes('/')?'×と÷':'×'}を先に</b>計算します（れい：1＋2×3 ＝ 1＋6 ＝ 7）</p>`:''}
    ${S.done?'':`<p class="msg ${S.msgc||''}" id="msg">${S.msg||(e.v[0]<0?'ひきすぎて、0より小さくなったよ。':e.v[0]/e.v[1]>P.t?`いまは ${fstr(e.v)}。めざす数より大きいよ。`:`いまは ${fstr(e.v)}。めざす数より小さいよ。`)}</p>
    <div class="row"><button class="btn" id="reset">はじめにもどす</button><button class="btn" id="hint">ヒント</button></div>`}
    <div id="after"></div>`;
  bindBack();
  if(S.done){showClear(explain());return;}
  app.querySelectorAll('.kgap').forEach(b=>b.onclick=()=>{const g=+b.dataset.g,A=[...P.ops];S.ops[g]=A[(A.indexOf(S.ops[g])+1)%A.length];S.msg='';S.msgc='';draw();});
  document.getElementById('reset').onclick=()=>{S.ops=S.ops.map((o,i)=>S.lock.includes(i)?o:'+');S.msg='';draw();};
  document.getElementById('hint').onclick=()=>{
    if(!S.all)S.all=koAll();
    const okL=S.all.filter(s=>S.lock.every(i=>s[i]===S.ops[i]));
    const best=okL.map(s=>[s,[...s].filter((o,i)=>o===S.ops[i]).length]).sort((a,b)=>b[1]-a[1])[0][0];
    const g=[...best].findIndex((o,i)=>o!==S.ops[i]&&!S.lock.includes(i));
    S.hints++;S.ops[g]=best[g];S.lock.push(g);
    S.msg=`ヒント：${g+1}番目のすき間は「${best[g]==='c'?'つなぐ':KO_SYM[best[g]]}」です（色のついたすき間は固定）。`;S.msgc='';draw();};
}
function explain(){
  const e=cur(),ex=koExpr(P.ds,S.ops);let t=`<p style="margin:0;font-size:18px;font-weight:700;text-align:center">${ex} ＝ ${P.t}</p>`;
  if(S.ops.includes('c'))t+=`<p style="margin:0">つないだ数：${e.nums.filter((n,i)=>n>9).join('、')}</p>`;
  if(e.terms.some(x=>x.mul)){
    t+=`<p style="margin:0">×と÷を先に計算：${e.terms.filter(x=>x.mul).map(x=>`${x.txt} ＝ ${fstr(x.v)}`).join('、')}</p>`;
    if(e.terms.length>1)t+=`<p style="margin:0">それから左から順に：${e.terms.map((x,i)=>(i?(e.sg[i-1]==='+'?'＋':'－'):'')+fstr(x.v)).join('')} ＝ ${P.t}</p>`;
  }else if(e.terms.length>2){
    let v=e.terms[0].v,st=[];e.terms.slice(1).forEach((x,i)=>{const nv=fadd(v,x.v,e.sg[i]==='+'?1:-1);st.push(`${fstr(v)}${e.sg[i]==='+'?'＋':'－'}${fstr(x.v)}＝${fstr(nv)}`);v=nv;});
    t+=`<p style="margin:0">左から順に：${st.join('、')}</p>`;
  }
  if(P.n>1){const all=S.all||koAll(),other=all.find(s=>s!==S.ops.join(''));
    t+=`<p style="margin:0">この問題の答えは、全部で <b>${P.n}通り</b> あります。${other?`たとえば ${koExpr(P.ds,[...other])} も正解。`:''}</p>`;}
  else t+=`<p style="margin:0">この問題の答えは、この1通りだけです。</p>`;
  return t;
}

/* ================================ */

function showClear(extra){
  const p=P, st=S.hints===0?3:S.hints<=2?2:1, prev=stars[p.id]||0;
  if(!S.saved){ S.saved=true; if(st>prev){stars[p.id]=st;store.set(SKEY,stars);}
    track('level_end',{level_name:(PAID?ID+'-p-':ID+'-')+p.id,success:true,score:st,hints:S.hints}); }
  const idx=QS.indexOf(p), nx=QS[idx+1];
  document.getElementById('after').innerHTML=`<div class="clear"><span class="v">クリア！</span>
    <span class="stars" aria-label="星${st}つ">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</span>
    <span>${S.hints?`${HINTWORD}が ${S.hints}回ありました。${HINTWORD}なしでクリアすると ★3つです。`:HINTWORD+'なしでクリア！'}</span>${extra||''}
    <div class="row">${nx?`<button class="btn go" id="nx">次の問題へ</button>`:''}<button class="btn" id="again">もう一度</button><button class="btn" id="home2">問題えらびへ</button></div></div>
    ${PAID?'':PAIDLINK}`;
  if(nx)document.getElementById('nx').onclick=()=>{ if(PAID)store.set(ID+'-p-lv',nx.lv); startStage(nx); };
  document.getElementById('again').onclick=()=>startStage(p);
  document.getElementById('home2').onclick=home;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
const starStr=n=>n?'★'.repeat(n)+'☆'.repeat(3-n):'';
function home(){
  P=null; S=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>${RULES}
    <div class="label">問題をえらぶ</div>
    <div class="freelist">${QS.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><span>${LVN[p.lv]}</span><span class="note">${LVD[p.lv]}</span><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
    ${PAIDLINK}`;
  app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
}
function homePaid(){
  let lv=store.get(ID+'-p-lv',1);
  const totalStars=Object.values(stars).reduce((a,b)=>a+b,0), cleared=QS.filter(p=>stars[p.id]).length;
  const render=()=>{
    const L=QS.filter(p=>p.lv===lv);
    app.innerHTML=`<div class="sum"><span class="big">${cleared}<small> / ${QS.length}問クリア</small></span><span class="big" style="color:var(--gold)">★${totalStars}<small> / ${QS.length*3}</small></span></div>
      <details><summary style="cursor:pointer;font-weight:700;font-size:14px">あそびかた</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">${RULES}</div></details>
      <div class="label">レベルをえらぶ</div>
      <div class="lvtabs">${[1,2,3,4,5].map(k=>{const n=QS.filter(p=>p.lv===k&&stars[p.id]).length;return `<button class="${k===lv?'cur':''}" data-lv="${k}"><b>${k}</b><small>${n}/20</small></button>`;}).join('')}</div>
      <p class="note" style="text-align:center">${LVN[lv]}：${LVD[lv]}</p>
      <div class="stages">${L.map(p=>`<button class="stg ${stars[p.id]?'done':''}" data-id="${p.id}"><b>${+p.id.split('-')[1]}</b><small>${starStr(stars[p.id])}</small></button>`).join('')}</div>
      <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
    app.querySelectorAll('.lvtabs button').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;store.set(ID+'-p-lv',lv);render();});
    app.querySelectorAll('.stg').forEach(b=>b.onclick=()=>startStage(QS.find(p=>p.id===b.dataset.id)));
    document.getElementById('reset').onclick=()=>{
      document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
      document.getElementById('yes').onclick=()=>{stars={};store.set(SKEY,stars);homePaid();};
      document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
    };
  };
  render();
}
async function decrypt(){ return mnAccess.load(ID); }
function lockScreen(err){ mnAccess.lock(app,{game:ID,err:err,free:ID+'.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
