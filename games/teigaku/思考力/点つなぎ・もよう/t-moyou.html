  /* てこ・棒・ばねの図。線は濃い色、おもりは四角、ばねばかりの引く力は矢印 */
  const L=(a,b,c,d)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}"/>`;
  const T=(x,y,t,cls,anc)=>`<text x="${x}" y="${y}" class="${cls||'lb'}" text-anchor="${anc||'middle'}">${esc(t)}</text>`;
  const W=(x,y,lb)=>`<rect x="${x-14}" y="${y}" width="28" height="20" rx="2" fill="#dfe3ea"/>`+T(x,y+36,lb);
  const UP=(x,y1,y2,lb)=>L(x,y1,x,y2)+`<path d="M${x-6},${y2+9} L${x},${y2} L${x+6},${y2+9}"/>`+T(x,y2-6,lb);
  const DN=(x,y1,y2,lb)=>L(x,y1,x,y2)+`<path d="M${x-6},${y2-9} L${x},${y2} L${x+6},${y2-9}"/>`+T(x,y2+16,lb);
  const spr=(x,y1,y2)=>{const n=8,h=(y2-y1-12)/n;let d=`M${x},${y1} L${x},${y1+6}`;for(let i=0;i<n;i++)d+=` L${x+(i%2?-9:9)},${y1+6+h*(i+.5)}`;d+=` L${x},${y2-6} L${x},${y2}`;return `<path d="${d}"/>`;};
  const sprH=(x1,x2,y)=>{const n=8,w=(x2-x1-12)/n;let d=`M${x1},${y} L${x1+6},${y}`;for(let i=0;i<n;i++)d+=` L${x1+6+w*(i+.5)},${y+(i%2?-9:9)}`;d+=` L${x2-6},${y} L${x2},${y}`;return `<path d="${d}"/>`;};
  const ceil=(a,b)=>L(a,14,b,14)+Array.from({length:Math.floor((b-a)/12)},(_,i)=>L(a+6+i*12,14,a+i*12,6)).join('');
  let g='',vb='0 0 320 170';
  if(f.lev){ const o=f.lev,c=160,u=22,y=48; vb='0 0 320 140';
    g+=`<rect x="${c-6*u-10}" y="${y-3}" width="${12*u+20}" height="6" rx="2" fill="#c9ced8"/>`;
    for(let i=1;i<=6;i++){ g+=L(c-i*u,y-3,c-i*u,y+3)+L(c+i*u,y-3,c+i*u,y+3)+T(c-i*u,y-9,String(i),'tk')+T(c+i*u,y-9,String(i),'tk'); }
    g+=`<path d="M${c},${y+3} L${c-10},${y+28} L${c+10},${y+28} Z" fill="#c9ced8"/>`+L(c-15,y+28,c+15,y+28);
    const hang=(x,lb,k)=>{ if(lb[0]==='↓') return DN(x,y+3,y+60,lb.slice(1)); return L(x,y+3,x,y+42+k*0)+W(x,y+42,lb); };
    o.L.forEach(([p,lb])=>g+=hang(c-p*u,lb,0)); o.R.forEach(([p,lb])=>g+=hang(c+p*u,lb,0));
  }
  if(f.bar){ const o=f.bar,x0=30,x1=290,y=74,X=p=>x0+p/o.len*(x1-x0); vb='0 0 320 175';
    g+=`<rect x="${x0}" y="${y-4}" width="${x1-x0}" height="8" rx="2" fill="#c9ced8"/>`+T(160,y-34,'棒の長さ '+o.len+'cm','tk');
    g+=L(x0,y-24,x0,y-16)+L(x1,y-24,x1,y-16)+L(x0,y-20,x1,y-20);
    if(o.f!=null){ const fx=X(o.f); g+=`<path d="M${fx},${y+4} L${fx-12},${y+28} L${fx+12},${y+28} Z" fill="#c9ced8"/>`+T(fx,y+42,'支点','tk'); if(o.f>0&&o.f<o.len) g+=T((x0+fx)/2,y+18,o.f+'cm','tk'); }
    if(o.m) g+=`<circle cx="160" cy="${y}" r="3.5" fill="#232a36" stroke="none"/>`+T(160,y+60,'棒の重さ '+o.m+'（一様）','tk');
    (o.w||[]).forEach(([p,lb])=>{const x=X(p); g+=L(x,y+4,x,y+20)+W(x,y+20,lb); if(p>0&&p<o.len) g+=T((x0+x)/2,y+18,p+'cm','tk');});
    (o.up||[]).forEach(([p,lb])=>{const x=X(p); g+=UP(x,y-4,y-46+12,lb).replace('','');});
  }
  if(f.spr){ const o=f.spr,w=o.w; vb='0 0 320 200';
    if(o.t==='one') g+=ceil(130,190)+spr(160,14,110)+W(160,110,w[0]);
    if(o.t==='ser') g+=ceil(130,190)+spr(160,14,72)+`<circle cx="160" cy="76" r="4" fill="#232a36" stroke="none"/>`+spr(160,80,140)+W(160,140,w[0])+T(184,48,'A','tk','start')+T(184,114,'A','tk','start');
    if(o.t==='ser2') g+=ceil(130,190)+spr(160,14,66)+`<rect x="146" y="66" width="28" height="20" rx="2" fill="#dfe3ea"/>`+T(186,81,w[0],'lb','start')+spr(160,86,142)+W(160,142,w[1]);
    if(o.t==='par') g+=ceil(80,240)+spr(110,14,104)+spr(210,14,104)+`<rect x="90" y="104" width="140" height="6" rx="2" fill="#c9ced8"/>`+L(160,110,160,124)+W(160,124,w[0]);
    if(o.t==='paroff') g+=ceil(80,240)+spr(100,14,104)+spr(220,14,104)+`<rect x="96" y="104" width="128" height="6" rx="2" fill="#c9ced8"/>`+L(140,110,140,124)+W(140,124,w[0])+T(120,100,'10cm','tk')+T(180,100,'20cm','tk');
    if(o.t==='wall') g+=sprH(100,220,40)+L(70,40,100,40)+L(220,40,250,40)+`<circle cx="70" cy="52" r="12"/><circle cx="250" cy="52" r="12"/>`+L(58,52,58,110)+L(262,52,262,110)+W(58,110,w[0])+W(262,110,w[1])+L(70,64,250,64);
  }
  return `<div class="fig"><svg viewBox="${vb}" role="img" aria-label="問題の図"><g stroke="#232a36" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">${g}</g></svg></div>`;
}
function newQ(){ const q=G.list[G.i]; G.ch=q.fix?[q.a,...q.d].sort():shuffle([q.a,...q.d]); G.done=false; G.pick=null; render(); }
function render(){
  const q=G.list[G.i], d=G.done;
  app.innerHTML=`<div class="top"><div class="prog" aria-hidden="true"><i style="width:${G.i/G.n*100}%"></i></div><span class="nums">${G.i+1} / ${G.n}</span><span class="tag">${CATS[q.c][0]}</span></div>
    <p class="q">${qhtml(q.q)}</p>${q.img?`<div class="pic">${q.img}</div>`:''}<div class="row"><button class="btn say" id="say">🔊 よみあげ</button></div>
    ${q.fig?figSVG(q.fig):''}
    <div class="ch">${G.ch.map((c,i)=>`<button class="op ${d?(c===q.a?'right':c===G.pick?'wrong':''):''}" data-i="${i}" ${d?'disabled':''}><span class="k">${'アイウエ'[i]}</span><span>${rb(c)}</span></button>`).join('')}</div>
    <div id="after"></div>`;
  app.querySelectorAll('.op').forEach(b=>b.onclick=()=>{hush();pick(G.ch[+b.dataset.i]);});const sb=document.getElementById('say');if(sb){if(!('speechSynthesis' in window))sb.hidden=true;sb.onclick=()=>say(q.say||(yomi(q.q)+'。'+G.ch.map((c,i)=>'アイウエ'[i]+'、'+yomi(c)).join('。')));}
  if(d)explain();
}
function pick(c){
  if(G.done)return;
  const q=G.list[G.i];
  G.done=true; G.pick=c; G.ok=c===q.a; G.newM=record(q,G.ok);
  if(G.ok)G.score++; else G.miss.push(q);
  track('answer_question',{category:'t-moyou-'+q.c,question:q.q.slice(0,90),correct:G.ok});
  render();
}
function explain(){
  const q=G.list[G.i], last=G.i===G.n-1;
  document.getElementById('after').innerHTML=`<div class="box" style="padding:14px;gap:12px;border-color:${G.ok?'var(--ok)':'var(--ng)'}">
    <div class="res"><div class="seal ${G.ok?'':'x'}" aria-hidden="true">${G.ok?'◯':'△'}</div>
      <div class="t"><span class="v ${G.ok?'ok':'ng'}">${G.ok?'せいかい！':'おしい！'}${G.newM?'<span style="font-size:13px;margin-left:8px;color:var(--ok);font-family:var(--body);font-weight:700">覚えた！</span>':''}</span>
      <span>こたえ：<b>${rb(q.a)}</b></span></div></div>
    <div class="ex">${rb(q.e)}</div><div class="row"><button class="btn say" id="sayx">🔊 せつめいを よみあげ</button></div>
    <div class="row"><button class="btn go" id="next">${last?'けっかを見る':'つぎの問題へ'}</button></div></div>`;
  const sx=document.getElementById('sayx');if(sx){if(!('speechSynthesis' in window))sx.hidden=true;sx.onclick=()=>say(yomi(q.e));}const nx=document.getElementById('next'); nx.onclick=()=>{hush();next();}; nx.focus({preventScroll:true});
}
function next(){ if(++G.i<G.n)newQ(); else result(); }
function result(){
  const n=G.n,s=G.score,r=s/n;
  const rank=r===1?'まんてん':r>=.8?'すごい':r>=.6?'よし！':r>=.4?'あと少し':'もう一回';const got=r>=.6?addStamp():0;
  track('level_end',{level_name:(PAID?'t-moyou-p-':'t-moyou-')+course,success:s===n,score:s,total:n});
  const bk=PAID?(CATS[course]||course==='all'?course:null):'free';
  if(bk&&(best[bk]==null||s>best[bk])){best[bk]=s;store.set(PAID?'t-moyou-p-best':'t-moyou-best',best);}
  app.innerHTML=`<div class="label">けっか</div>${got?`<div class="stampget">🌸 スタンプ ゲット！ これまで <b>${got}</b> こ</div>`:''}
    <div class="score"><div class="big">${s}<small> / ${n}問</small></div><div class="rank">${rank}</div></div>
    <p style="margin:0">${r===1?'ぜんぶ せいかい！ すばらしい！':r>=.6?'よくできました。まちがえた問題の せつめいを 読んでみよう。':'せつめいを 読んで、もう一回 ちょうせんしよう。'}</p>
    <div class="row"><button class="btn go" id="again">${PAID?'レベルをえらぶ':'もう一度'}</button>${G.miss.length?'<button class="btn" id="retry">まちがえた問題だけ</button>':''}</div>
    ${PAID?'':PAIDLINK}
    ${G.miss.length?`<div class="label" style="color:var(--fg)">まちがえた問題</div>${G.miss.map(q=>`<div class="rv">${q.img?`<div class="pic sm">${q.img}</div>`:''}${rb(q.q)}<br>→ <b>${rb(q.a)}</b></div>`).join('')}`:''}`;
  document.getElementById('again').onclick=()=>PAID?home():(course='free',start(shuffle(QS)));
  const rt=document.getElementById('retry'); if(rt)rt.onclick=()=>{course='retry';start(shuffle(G.miss));};
}
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
