  const go=()=>{const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=0.9;const vs=S.getVoices(),ja=vs.filter(v=>/^ja(-|_)/i.test(v.lang));

    <div class="row">${SAYB}</div></div>`;
  document.getElementById('back').onclick=home;
  sayBtn('say',()=>(prev?(pf[1]+'の いきものカードを 手に 入れた。ここからは、あなたは '):'あなたは ')+f[1]+'。'+yomi(f[2]));
  const nx=document.getElementById('nx'); nx.onclick=()=>{hush();o.k==='e'?ending(o):render(id);};
  top0(); nx.focus({preventScroll:true});
}
function render(id){
  hush(); const s=G.s, o=s.sc[id];
  const ch=o.k==='q'?shuffle(o.c):null;
  app.innerHTML=`${head(o)}<div class="pic">${o.p}</div><p class="txt">${rb(o.t)}</p>${kotoba(o)}
    ${o.k==='q'?`<p class="ask">${rb(o.a)}</p><div class="ch">${ch.map((c,i)=>`<button class="op" data-i="${i}"><span class="k">${i+1}</span><span>${rb(c[0])}</span></button>`).join('')}</div>`
      :`<div class="row"><button class="btn go" id="nx">つぎへ ▶</button></div>`}
    <div class="row">${SAYB}</div>`;
  document.getElementById('back').onclick=home;
  sayBtn('say',()=>yomi(o.t)+(o.d?'。'+o.d.map(e=>'ことば。'+yomi(e[0])+'、'+yomi(e[1])).join('。'):'')+(ch?'。'+yomi(o.a)+'。'+ch.map((c,i)=>(i+1)+'ばん、'+yomi(c[0])).join('。'):''));
  if(ch)app.querySelectorAll('.op').forEach(b=>b.onclick=()=>{const c=ch[+b.dataset.i];const ok=s.sc[c[1]].k!=='x';
    track('answer_question',{category:'t-ikinari-'+s.id,question:id,correct:ok});
    if(!ok){G.from=id;G.pick=c[0];G.overs++;bump(s.id,1);} show(c[1]);});
  else document.getElementById('nx').onclick=()=>show(o.nx);
  top0();
}
function over(o){
  const s=G.s;
  app.innerHTML=`${head(s.sc[G.from]||{})}<div class="over"><h2>${rb('おっと！ ほんとうは ちがうよ')}</h2>
    <p class="pick">あなたが えらんだのは：<b>${rb(G.pick)}</b></p>
    <div class="pic">${o.p}</div><p class="txt">${rb(o.t)}</p><p class="hint"><b>💡 おぼえておこう</b>${rb(o.h)}</p>
    <div class="row"><button class="btn go" id="retry">この ばめんから やりなおす</button><button class="btn" id="first">さいしょから</button></div>
    <div class="row">${SAYB}<button class="linkbtn" id="list">${rb(JOB+'を えらぶ')}</button></div></div>`;
  document.getElementById('back').onclick=home;
  sayBtn('say',()=>'おっと！ ほんとうは ちがうよ。'+yomi(o.t)+'。おぼえておこう。'+yomi(o.h));
  const rt=document.getElementById('retry');rt.onclick=()=>render(G.from);
  document.getElementById('first').onclick=()=>{G.who=null;show(s.start);};
  document.getElementById('list').onclick=home;
  top0(); rt.focus({preventScroll:true});
}
function ending(o){
  hush(); const s=G.s, stars=G.overs===0?3:G.overs<=2?2:1;
  if(G.who)collect(s.id,G.who);
  bump(s.id,0); const got=addStamp();
  track('level_end',{level_name:'t-ikinari-'+s.id,success:true,score:stars});
  const ix=ST.indexOf(s), nx=ST[ix+1];
  app.innerHTML=`${head(o)}<p class="endh">🎉 「${rb(s.title)}」 クリア！</p><div class="pic">${o.p}</div><p class="txt">${rb(o.t)}</p>${kotoba(o)}
    <div class="konna"><b>${rb('この 生《い》き物《もの》は こんな 生《い》き物《もの》')}</b><ul>${s.points.map(p=>`<li>${rb(p)}</li>`).join('')}</ul></div>
    <div class="flow"><b>${rb('育《そだ》ち方《かた》')}</b><ol>${s.flow.map((p,i)=>`<li>${i?'<span class="ar" aria-hidden="true">→</span>':''}<span class="fs">${rb(p)}</span></li>`).join('')}</ol></div>
    <div class="care"><b>${rb('せわの ポイント')}</b><ul>${s.care.map(p=>`<li>${rb(p)}</li>`).join('')}</ul></div>
    <p class="more"><b>${rb('もっと 知《し》りたい')}</b>${rb(s.more)}</p>
    <div class="row"><span class="stars" aria-label="ほし ${stars}こ">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</span><span class="note">${G.overs?'ゲームオーバー '+G.overs+'かい。つぎは ノーミスを めざそう！':'ノーミスで さいごまで いけたね！'}</span></div>
    <div class="stampget">🌸 スタンプ ゲット！ これまで <b>${got}</b> こ</div>
    <div class="label">${rb('なりきった 生《い》き物《もの》・人《ひと》（'+CARDN)} ${nCards()} / ${ALLFIG.length}まい）</div><div class="figrow">${s.figs.map(f=>figCard(s,f)).join('')}</div>
    <div class="row">${nx?`<button class="btn go" id="next">${rb('つぎの 生《い》き物《もの》「'+nx.title+'」')}</button>`:''}<button class="btn${nx?'':' go'}" id="list">${rb(JOB+'を えらぶ')}</button></div>
    <div class="row">${SAYB}<button class="linkbtn" id="again">もう いちど あそぶ</button></div>${PAID?'':PAIDLINK}`;
  document.getElementById('back').onclick=home;
  sayBtn('say',()=>yomi(s.title)+'、クリア。'+yomi(o.t)+'。この いきものは こんな いきもの。'+s.points.map(yomi).join('。')+'。そだちかた。'+s.flow.map(yomi).join('、')+'。せわの ポイント。'+s.care.map(yomi).join('。')+'。もっと 知りたい。'+yomi(s.more));
  if(nx)document.getElementById('next').onclick=()=>play(nx);
  document.getElementById('list').onclick=home;
  document.getElementById('again').onclick=()=>play(s);
  top0();
}
async function decrypt(){ return mnAccess.load('t-ikinari'); }
function lockScreen(err){ mnAccess.lock(app,{game:'t-ikinari',err:err,free:'t-ikinari.html',onOpen:async()=>{ ST=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ ST=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
