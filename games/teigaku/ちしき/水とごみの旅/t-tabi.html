const ckey=(id,nm)=>id+':'+nm;
const collect=(id,nm)=>{const k=ckey(id,nm);const isNew=!cards[k];if(isNew){cards[k]=Date.now();store.set(CARDK,cards);}return isNew;};
const ALLFIG=TITLES.flatMap(t=>t[4].map(nm=>ckey(t[0],nm)));
const nCards=()=>ALLFIG.filter(k=>cards[k]).length;
const CARDN='すがたカード', JOB='旅《たび》';
const HOWTO='水《みず》や ごみに なって、町《まち》の 中《なか》を 旅《たび》しよう。ばめんごとに 「つぎは どうなる？」「どう する？」を 2つから えらぶよ。ほんとうの しくみの とおりに えらぶと、旅《たび》が つづきます。とちゅうで すがたが かわる ことも あるよ。🔊で 読《よ》みあげます。';
let G=null;
const top0=()=>{try{const y=app.getBoundingClientRect().top+window.scrollY-8;if(window.scrollY>y)window.scrollTo(0,y);}catch(e){}};
const sayBtn=(id,txt)=>{const b=document.getElementById(id);if(!b)return;if(!('speechSynthesis' in window)){b.hidden=true;return;}b.onclick=()=>say(txt(),b);};
const SAYB='<button class="btn say" id="say">🔊 よみあげ</button>';
const figOf=(s,nm)=>s.figs.find(f=>f[0]===nm)||[nm,'','',''];
const fname=f=>f[1]&&f[1]!==f[0]?`<ruby>${esc(f[0])}<rt>${esc(f[1])}</rt></ruby>`:esc(f[0]);
const figCard=(s,f)=>{const got=!!cards[ckey(s.id,f[0])];
  return got?`<div class="fc"><span class="fp">${f[3]}</span><span class="fn">${fname(f)}</span><span class="fr">${rb(f[2])}</span></div>`
            :`<div class="fc no"><span class="fp">？</span><span class="fn">？？？</span><span class="fr">${s.no}「${rb(s.title)}」</span></div>`;};
const kotoba=o=>o.d?`<p class="kotoba">${o.d.map(e=>`<span><b>ことば</b>${rb(e[0])}… ${rb(e[1])}</span>`).join('')}</p>`:'';
function home(){
  G=null; hush();
  const row=([id,no,title,kind,figs,ok])=>{const s=ST.find(c=>c.id===id);
    if(s){const r=rec[id]||[0,0];
      return `<button class="st" data-id="${id}"><span class="th">${s.sc[s.start].p}</span><span><span class="no">${no}　${rb(kind)}</span><span class="nm">${rb(title)}</span>
        <span class="ds">${rb(s.sub)}</span>
        ${r[0]?`<span class="bd ok">✓ クリア${r[0]>1?'（'+r[0]+'かい）':''}</span>`:'<span class="bd no">まだ</span>'}${r[1]?` <span class="note" style="display:inline">ゲームオーバー ${r[1]}かい</span>`:''}</span></button>`;}
    if(!PAID)return `<a class="st lockd" href="t-tabi-full.html"><span class="th">🔒</span><span><span class="no">${no}　${rb(kind)}</span><span class="nm">${rb(title)}</span><span class="ds">${rb('有料版《ゆうりょうばん》で あそべます')}</span></span></a>`;
    return `<div class="st soon"><span class="th">⏳</span><span><span class="no">${no}　${rb(kind)}</span><span class="nm">${rb(title)}</span><span class="ds">じゅんび<ruby>中<rt>ちゅう</rt></ruby></span></span></div>`;};
  const has=t=>ST.some(c=>c.id===t[0]);
  const rows=PAID?TITLES.map(row).join(''):TITLES.filter(has).map(row).join('')+`<div class="label" style="margin-top:6px">${rb('有料版《ゆうりょうばん》で あそべる 旅《たび》')}</div>`+TITLES.filter(t=>!has(t)).map(row).join('');
  const total=ALLFIG.length, got=nCards();
  const gal=ST.map(s=>s.figs.map(f=>figCard(s,f)).join('')).join('');
  const done=ST.filter(s=>(rec[s.id]||[0])[0]>0).length;
  app.innerHTML=`${STAMPBOX()}<div class="label">あそびかた</div>
    <p style="margin:0;font-size:17px;line-height:2.05">${rb(HOWTO)}</p>
    <div class="row" style="justify-content:space-between"><span class="label" style="color:var(--fg)">${rb(CARDN)}</span><span class="cnt">${got}<small> / ${total}まい</small></span></div>
    <details class="cards"><summary>${rb(CARDN+'を 見《み》る')}</summary><div class="figrow" style="margin-top:8px">${gal}</div></details>
    <div class="row" style="justify-content:space-between"><span class="label">${rb(JOB+'を えらぶ')}</span><span class="note">クリア ${done} / ${ST.length}</span></div>
    ${PAID?'':`<p class="free">${rb(ST.map(s=>s.title).join('・')+'は 無料《むりょう》。🔒の 旅《たび》も、有料版《ゆうりょうばん》なら 全部《ぜんぶ》で '+TITLES.length+'しゅるい あそべます。')}</p>`}
    <div class="row">${SAYB}</div>
    <div class="list">${rows}</div>${PAID?`<div><button class="linkbtn" id="reset">きろくを けす</button> <span id="resetq"></span></div>`:PAIDLINK}`;
  sayBtn('say',()=>yomi(HOWTO));
  app.querySelectorAll('button.st').forEach(b=>b.onclick=()=>play(ST.find(s=>s.id===b.dataset.id)));
  const rs=document.getElementById('reset');
  if(rs)rs.onclick=()=>{document.getElementById('resetq').innerHTML=rb('ほんとうに けしますか？（すがたカードも きえます）')+' <button class="linkbtn" id="yes" style="color:var(--ng)">けす</button> <button class="linkbtn" id="no">やめる</button>';
    document.getElementById('yes').onclick=()=>{rec={};saveRec();cards={};store.set(CARDK,cards);home();};document.getElementById('no').onclick=home;};
}
function play(s){ G={s:s,who:null,from:null,pick:'',overs:0}; track('level_start',{level_name:'t-tabi-'+s.id}); show(s.start); }
function head(o){ const n=(o&&o.n)||0, f=G.who?figOf(G.s,G.who):null;
  return `<div class="top"><button class="linkbtn" id="back">← もどる</button><div class="prog" aria-hidden="true"><i style="width:${Math.round(n/G.s.len*100)}%"></i></div>${f?`<span class="whochip">${fname(f)}</span>`:''}</div>`; }
function show(id){
  hush(); const s=G.s, o=s.sc[id];
  if(o.k==='x')return over(o);
  if(o.w&&o.w!==G.who)return switchCard(id);
  if(o.k==='e')return ending(o);
  render(id);
}
function switchCard(id){
  const s=G.s, o=s.sc[id], prev=G.who, f=figOf(s,o.w), pf=prev?figOf(s,prev):null;
  if(prev)collect(s.id,prev);
  G.who=o.w;
  const nth=s.figs.findIndex(x=>x[0]===o.w)+1;
  app.innerHTML=`${head(o)}<div class="sw" role="group" aria-label="すがたが かわる">
    <div class="swl">${s.no}「${rb(s.title)}」　${nth?'すがた '+nth:''}</div>
    ${pf?`<p class="got">✓「${fname(pf)}」の ${rb(CARDN+'を 手《て》に 入《い》れた！')}</p>`:''}
    <div class="swp">${f[3]}</div>
    <p class="swt">${prev?'ここからは、あなたは':'あなたは'}</p>
    <p class="swn">${fname(f)}。</p>
    <p class="swr">${rb(f[2])}</p>
    <button class="btn go" id="nx">${fname(f)}に なって すすむ ▶</button>
    <div class="row">${SAYB}</div></div>`;
  document.getElementById('back').onclick=home;
  sayBtn('say',()=>(prev?(pf[1]+'の すがたカードを 手に 入れた。ここからは、あなたは '):'あなたは ')+f[1]+'。'+yomi(f[2]));
  const nx=document.getElementById('nx'); nx.onclick=()=>{hush();o.k==='e'?ending(o):render(id);};
  top0(); nx.focus({preventScroll:true});
}
function render(id){
  hush(); const s=G.s, o=s.sc[id];
  const ch=o.k==='q'?shuffle(o.c):null;
  app.innerHTML=`${head(o)}<div class="pic">${o.p}</div><p class="txt">${rb(o.t)}</p>${kotoba(o)}
    ${o.k==='q'?`<p class="ask">${rb(o.a)}</p><div class="ch">${ch.map((c,i)=>`<button class="op" data-i="${i}"><span class="k">${i+1}</span><span>${rb(c[0])}</span></button>`).join('')}</div>`
      :`<div class="row"><button class="btn go" id="nx">つぎへ ▶</button></div>`}
    <div class="row">${SAYB}</div>`;
  document.getElementById('back').onclick=home;
  sayBtn('say',()=>yomi(o.t)+(o.d?'。'+o.d.map(e=>'ことば。'+yomi(e[0])+'、'+yomi(e[1])).join('。'):'')+(ch?'。'+yomi(o.a)+'。'+ch.map((c,i)=>(i+1)+'ばん、'+yomi(c[0])).join('。'):''));
  if(ch)app.querySelectorAll('.op').forEach(b=>b.onclick=()=>{const c=ch[+b.dataset.i];const ok=s.sc[c[1]].k!=='x';
    track('answer_question',{category:'t-tabi-'+s.id,question:id,correct:ok});
    if(!ok){G.from=id;G.pick=c[0];G.overs++;bump(s.id,1);} show(c[1]);});
  else document.getElementById('nx').onclick=()=>show(o.nx);
  top0();
}
function over(o){
  const s=G.s;
  app.innerHTML=`${head(s.sc[G.from]||{})}<div class="over"><h2>${rb('おっと！ ほんとうの しくみと ちがうよ')}</h2>
    <p class="pick">あなたが えらんだのは：<b>${rb(G.pick)}</b></p>
    <div class="pic">${o.p}</div><p class="txt">${rb(o.t)}</p><p class="hint"><b>💡 おぼえておこう</b>${rb(o.h)}</p>
    <div class="row"><button class="btn go" id="retry">この ばめんから やりなおす</button><button class="btn" id="first">さいしょから</button></div>
    <div class="row">${SAYB}<button class="linkbtn" id="list">${rb(JOB+'を えらぶ')}</button></div></div>`;
  document.getElementById('back').onclick=home;
  sayBtn('say',()=>'おっと！ ほんとうの しくみと ちがうよ。'+yomi(o.t)+'。おぼえておこう。'+yomi(o.h));
  const rt=document.getElementById('retry');rt.onclick=()=>render(G.from);
  document.getElementById('first').onclick=()=>{G.who=null;show(s.start);};
  document.getElementById('list').onclick=home;
  top0(); rt.focus({preventScroll:true});
}
function ending(o){
  hush(); const s=G.s, stars=G.overs===0?3:G.overs<=2?2:1;
  if(G.who)collect(s.id,G.who);
  bump(s.id,0); const got=addStamp();
  track('level_end',{level_name:'t-tabi-'+s.id,success:true,score:stars});
  const ix=ST.indexOf(s), nx=ST[ix+1];
  app.innerHTML=`${head(o)}<p class="endh">🎉 「${rb(s.title)}」 クリア！</p><div class="pic">${o.p}</div><p class="txt">${rb(o.t)}</p>${kotoba(o)}
    <div class="konna"><b>${rb('この 旅《たび》で わかった こと')}</b><ul>${s.points.map(p=>`<li>${rb(p)}</li>`).join('')}</ul></div>
    <div class="dougu"><b>${rb('旅《たび》の みちすじ')}</b><ol class="flow">${s.flow.map(p=>`<li>${rb(p)}</li>`).join('')}</ol></div>
    <p class="itsu"><b>${rb('わたしたちに できる こと')}</b>${rb(s.dekiru)}</p>
    <p class="more"><b>${rb('もっと 知《し》りたい')}</b>${rb(s.more)}</p>
    <div class="row"><span class="stars" aria-label="ほし ${stars}こ">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</span><span class="note">${G.overs?'ゲームオーバー '+G.overs+'かい。つぎは ノーミスを めざそう！':'ノーミスで さいごまで いけたね！'}</span></div>
    <div class="stampget">🌸 スタンプ ゲット！ これまで <b>${got}</b> こ</div>
    <div class="label">${rb('なりきった すがた（'+CARDN)} ${nCards()} / ${ALLFIG.length}まい）</div><div class="figrow">${s.figs.map(f=>figCard(s,f)).join('')}</div>
    <div class="row">${nx?`<button class="btn go" id="next">${rb('つぎの 旅《たび》「'+nx.title+'」')}</button>`:''}<button class="btn${nx?'':' go'}" id="list">${rb(JOB+'を えらぶ')}</button></div>
    <div class="row">${SAYB}<button class="linkbtn" id="again">もう いちど あそぶ</button></div>${PAID?'':PAIDLINK}`;
  document.getElementById('back').onclick=home;
  sayBtn('say',()=>yomi(s.title)+'、クリア。'+yomi(o.t)+'。この たびで わかった こと。'+s.points.map(yomi).join('。')+'。たびの みちすじ。'+s.flow.map(yomi).join('、それから ')+'。わたしたちに できる こと。'+yomi(s.dekiru)+'。もっと 知りたい。'+yomi(s.more));
  if(nx)document.getElementById('next').onclick=()=>play(nx);
  document.getElementById('list').onclick=home;
  document.getElementById('again').onclick=()=>play(s);
  top0();
}
async function decrypt(){ return mnAccess.load('t-tabi'); }
function lockScreen(err){ mnAccess.lock(app,{game:'t-tabi',err:err,free:'t-tabi.html',onOpen:async()=>{ ST=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ ST=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
