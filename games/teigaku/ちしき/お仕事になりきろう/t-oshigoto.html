<title>お仕事になりきろう</title>
<meta name="game:course" content="teigaku"><meta name="game:subject" content="ちしき">
<meta name="game:unit" content="お仕事になりきろう">
<meta name="game:grade" content="小1〜">

:root{

}

body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 64px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

.lead{margin:4px 0 0;color:var(--muted);font-size:15px;line-height:2}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
ruby rt{font-size:.5em;font-weight:400}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px}
.label{font-size:13px;font-weight:700;color:var(--seal);letter-spacing:.1em}
.note{font-size:13px;color:var(--muted);margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.btn.go{background:var(--fg);color:var(--surface)}
.btn.say{padding:6px 14px;font-size:15px;background:var(--surface);border:2px solid var(--rule)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px;padding:0}

.top{display:flex;align-items:center;gap:10px}
.prog{flex:1;height:8px;background:var(--rule);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--seal);transition:width .3s}
.whochip{font-size:13px;font-weight:700;color:var(--ink);border:1px solid var(--ink);border-radius:6px;padding:0 6px;white-space:nowrap;line-height:2}

.pic svg{display:block;width:100%;height:auto}
.txt{margin:0;white-space:pre-line;font-size:20px;line-height:2.1}
.ask{margin:0;font-size:20px;font-weight:700;color:var(--ink);line-height:2}
.ch{display:grid;gap:10px}
.op{border:2px solid var(--rule);background:var(--surface);border-radius:14px;padding:14px 16px;font-size:19px;line-height:1.95;text-align:left;font-weight:700;cursor:pointer;display:flex;gap:12px;align-items:center;min-height:64px}

.op:active{transform:scale(.98)}
.kotoba{margin:0;font-size:16px;line-height:2;border:2px dotted var(--rule);border-radius:10px;padding:6px 12px}

.kotoba span{display:block}

.stars{font-size:28px;color:var(--gold);letter-spacing:.1em;line-height:1}
.figrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}

.fc .fr{padding:0 8px 6px;color:var(--muted)}
.fc.no .fp{display:grid;place-items:center;aspect-ratio:3/2;background:var(--pick);font-size:28px;line-height:1;color:var(--muted)}

.cnt{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.cnt small{font-size:13px;color:var(--muted);font-family:var(--body)}
.list{display:grid;gap:10px}

    <details class="cards"><summary>${rb(CARDN+'を 見《み》る')}</summary><div class="figrow" style="margin-top:8px">${gal}</div></details>
    <div class="row" style="justify-content:space-between"><span class="label">${rb(JOB+'を えらぶ')}</span><span class="note">クリア ${done} / ${ST.length}</span></div>
    ${PAID?'':`<p class="free">${rb(ST.map(s=>s.title).join('・')+'は 無料《むりょう》。🔒の お仕事《しごと》も、有料版《ゆうりょうばん》なら 全部《ぜんぶ》で '+TITLES.length+'しゅるい あそべます。')}</p>`}
    <div class="row">${SAYB}</div>
    <div class="list">${rows}</div>${PAID?`<div><button class="linkbtn" id="reset">きろくを けす</button> <span id="resetq"></span></div>`:PAIDLINK}`;
  sayBtn('say',()=>yomi(HOWTO));
  app.querySelectorAll('button.st').forEach(b=>b.onclick=()=>play(ST.find(s=>s.id===b.dataset.id)));
  const rs=document.getElementById('reset');
  if(rs)rs.onclick=()=>{document.getElementById('resetq').innerHTML=rb('ほんとうに けしますか？（お仕事《しごと》カードも きえます）')+' <button class="linkbtn" id="yes" style="color:var(--ng)">けす</button> <button class="linkbtn" id="no">やめる</button>';
    document.getElementById('yes').onclick=()=>{rec={};saveRec();cards={};store.set(CARDK,cards);home();};document.getElementById('no').onclick=home;};
}
function play(s){ G={s:s,who:null,from:null,pick:'',overs:0}; track('level_start',{level_name:'t-oshigoto-'+s.id}); show(s.start); }
function head(o){ const n=(o&&o.n)||0, f=G.who?figOf(G.s,G.who):null;
  return `<div class="top"><button class="linkbtn" id="back">← もどる</button><div class="prog" aria-hidden="true"><i style="width:${Math.round(n/G.s.len*100)}%"></i></div>${f?`<span class="whochip">${fname(f)}</span>`:''}</div>`; }
function show(id){
  hush(); const s=G.s, o=s.sc[id];
  if(o.k==='x')return over(o);
  if(o.w&&o.w!==G.who)return switchCard(id);
  if(o.k==='e')return ending(o);
  render(id);
}
function switchCard(id){
  const s=G.s, o=s.sc[id], prev=G.who, f=figOf(s,o.w), pf=prev?figOf(s,prev):null;
  if(prev)collect(s.id,prev);
  G.who=o.w;
  const nth=s.figs.findIndex(x=>x[0]===o.w)+1;
  app.innerHTML=`${head(o)}<div class="sw" role="group" aria-label="お仕事の こうたい">
    <div class="swl">${s.no}「${rb(s.title)}」　${nth?nth+'ばんめ':''}</div>
    ${pf?`<p class="got">✓「${fname(pf)}」の ${rb(CARDN+'を 手《て》に 入《い》れた！')}</p>`:''}
    <div class="swp">${f[3]}</div>
    <p class="swt">${prev?'ここからは、あなたは':'あなたは'}</p>
    <p class="swn">${fname(f)}。</p>
    <p class="swr">${rb(f[2])}</p>
    <button class="btn go" id="nx">${fname(f)}に なって すすむ ▶</button>
    <div class="row">${SAYB}</div></div>`;
  document.getElementById('back').onclick=home;
  sayBtn('say',()=>(prev?(pf[1]+'の お仕事カードを 手に 入れた。ここからは、あなたは '):'あなたは ')+f[1]+'。'+yomi(f[2]));
  const nx=document.getElementById('nx'); nx.onclick=()=>{hush();o.k==='e'?ending(o):render(id);};
  top0(); nx.focus({preventScroll:true});
}
function render(id){
  hush(); const s=G.s, o=s.sc[id];
  const ch=o.k==='q'?shuffle(o.c):null;
  app.innerHTML=`${head(o)}<div class="pic">${o.p}</div><p class="txt">${rb(o.t)}</p>${kotoba(o)}
    ${o.k==='q'?`<p class="ask">${rb(o.a)}</p><div class="ch">${ch.map((c,i)=>`<button class="op" data-i="${i}"><span class="k">${i+1}</span><span>${rb(c[0])}</span></button>`).join('')}</div>`
      :`<div class="row"><button class="btn go" id="nx">つぎへ ▶</button></div>`}
    <div class="row">${SAYB}</div>`;
  document.getElementById('back').onclick=home;
  sayBtn('say',()=>yomi(o.t)+(o.d?'。'+o.d.map(e=>'ことば。'+yomi(e[0])+'、'+yomi(e[1])).join('。'):'')+(ch?'。'+yomi(o.a)+'。'+ch.map((c,i)=>(i+1)+'ばん、'+yomi(c[0])).join('。'):''));
  if(ch)app.querySelectorAll('.op').forEach(b=>b.onclick=()=>{const c=ch[+b.dataset.i];const ok=s.sc[c[1]].k!=='x';
    track('answer_question',{category:'t-oshigoto-'+s.id,question:id,correct:ok});
    if(!ok){G.from=id;G.pick=c[0];G.overs++;bump(s.id,1);} show(c[1]);});
  else document.getElementById('nx').onclick=()=>show(o.nx);
  top0();
}
function over(o){
  const s=G.s;
  app.innerHTML=`${head(s.sc[G.from]||{})}<div class="over"><h2>${rb('おっと！ ほんとうの お仕事《しごと》と ちがうよ')}</h2>
    <p class="pick">あなたが えらんだのは：<b>${rb(G.pick)}</b></p>
    <div class="pic">${o.p}</div><p class="txt">${rb(o.t)}</p><p class="hint"><b>💡 おぼえておこう</b>${rb(o.h)}</p>
    <div class="row"><button class="btn go" id="retry">この ばめんから やりなおす</button><button class="btn" id="first">さいしょから</button></div>
    <div class="row">${SAYB}<button class="linkbtn" id="list">${rb(JOB+'を えらぶ')}</button></div></div>`;
  document.getElementById('back').onclick=home;
  sayBtn('say',()=>'おっと！ ほんとうの おしごとと ちがうよ。'+yomi(o.t)+'。おぼえておこう。'+yomi(o.h));
  const rt=document.getElementById('retry');rt.onclick=()=>render(G.from);
  document.getElementById('first').onclick=()=>{G.who=null;show(s.start);};
  document.getElementById('list').onclick=home;
  top0(); rt.focus({preventScroll:true});
}
function ending(o){
  hush(); const s=G.s, stars=G.overs===0?3:G.overs<=2?2:1;
  if(G.who)collect(s.id,G.who);
  bump(s.id,0); const got=addStamp();
  track('level_end',{level_name:'t-oshigoto-'+s.id,success:true,score:stars});
  const ix=ST.indexOf(s), nx=ST[ix+1];
  app.innerHTML=`${head(o)}<p class="endh">🎉 「${rb(s.title)}」 クリア！</p><div class="pic">${o.p}</div><p class="txt">${rb(o.t)}</p>${kotoba(o)}
    <div class="konna"><b>${rb('この お仕事《しごと》は こんな お仕事《しごと》')}</b><ul>${s.points.map(p=>`<li>${rb(p)}</li>`).join('')}</ul></div>
    <div class="dougu"><b>${rb('つかう 道具《どうぐ》')}</b><ul>${s.tools.map(p=>`<li>${rb(p)}</li>`).join('')}</ul></div>
    <p class="itsu"><b>${rb('町《まち》の だれを たすけている？')}</b>${rb(s.helps)}</p>
    <p class="more"><b>${rb('もっと 知《し》りたい')}</b>${rb(s.more)}</p>
    <div class="row"><span class="stars" aria-label="ほし ${stars}こ">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</span><span class="note">${G.overs?'ゲームオーバー '+G.overs+'かい。つぎは ノーミスを めざそう！':'ノーミスで さいごまで いけたね！'}</span></div>
    <div class="stampget">🌸 スタンプ ゲット！ これまで <b>${got}</b> こ</div>
    <div class="label">${rb('なりきった お仕事《しごと》（'+CARDN)} ${nCards()} / ${ALLFIG.length}まい）</div><div class="figrow">${s.figs.map(f=>figCard(s,f)).join('')}</div>
    <div class="row">${nx?`<button class="btn go" id="next">${rb('つぎの お仕事《しごと》「'+nx.title+'」')}</button>`:''}<button class="btn${nx?'':' go'}" id="list">${rb(JOB+'を えらぶ')}</button></div>
    <div class="row">${SAYB}<button class="linkbtn" id="again">もう いちど あそぶ</button></div>${PAID?'':PAIDLINK}`;
  document.getElementById('back').onclick=home;
  sayBtn('say',()=>yomi(s.title)+'、クリア。'+yomi(o.t)+'。この おしごとは こんな おしごと。'+s.points.map(yomi).join('。')+'。つかう どうぐ。'+s.tools.map(yomi).join('、')+'。まちの だれを たすけている？ '+yomi(s.helps)+'。もっと 知りたい。'+yomi(s.more));
  if(nx)document.getElementById('next').onclick=()=>play(nx);
  document.getElementById('list').onclick=home;
  document.getElementById('again').onclick=()=>play(s);
  top0();
}
async function decrypt(){ return mnAccess.load('t-oshigoto'); }
function lockScreen(err){ mnAccess.lock(app,{game:'t-oshigoto',err:err,free:'t-oshigoto.html',onOpen:async()=>{ ST=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ ST=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
