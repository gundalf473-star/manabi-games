<script>
(function(){

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* データ: [語A, 読みA, 意味A, 語B, 読みB, 意味B, 種類, 別の反対語] */
const PAID=false;
const norm=s=>s.normalize('NFKC').toLowerCase().replace(/[\s\-ー－]/g,'');
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let P=[], shopUrl='';
const ROUND=10, PREFIX=PAID?'hantaigo-p':'hantaigo';
let opp={}, allWords=[], typeOf={}, fillable=[];
const isKanji=w=>/^[\u4e00-\u9fff々]+$/.test(w);
function init(data){
  P=data; opp={};
  const addOpp=(a,b)=>{(opp[a]=opp[a]||new Set()).add(b);};
  P.forEach(p=>{addOpp(p[0],p[3]);addOpp(p[3],p[0]);if(p[7]){addOpp(p[0],p[7]);addOpp(p[7],p[0]);}});
  allWords=[...new Set(P.flatMap(p=>[p[0],p[3]]))];
  typeOf={};P.forEach(p=>{typeOf[p[0]]=p[6];typeOf[p[3]]=p[6];});
  fillable=P.filter(p=>isKanji(p[0])&&isKanji(p[3])&&p[0].length>=2&&p[3].length>=2);
}

async function decrypt(pass){
  const p=JSON.parse(document.getElementById('data').textContent);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(pass)),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(p.salt),iterations:p.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(p.iv)},k,b64(p.data))));
}

      <div class="row" style="justify-content:flex-start"><button class="btn go" id="open" type="submit">ひらく</button></div>
    </form>
    <div class="shop">合言葉をお持ちでない方へ：${shopUrl?`<a href="${esc(shopUrl)}" target="_blank" rel="noopener">こちらから購入できます</a>`:'販売ページは準備中です。'}<br>無料版は <a href="hantaigo.html">反対語クイズ</a> で遊べます。</div>
  </section>`;
  document.getElementById('f').onsubmit=async e=>{
    e.preventDefault();
    const v=document.getElementById('pass').value; if(!norm(v)){document.getElementById('err').textContent='合言葉を入れてください。';return;}
    const bt=document.getElementById('open'); bt.disabled=true; bt.textContent='確かめています…';
    try{ init(await decrypt(v)); store.set(PREFIX+'-pass',v); track('unlock',{product:'hantaigo'}); home(); }
    catch(err){ bt.disabled=false; bt.textContent='ひらく'; document.getElementById('err').textContent='合言葉がちがいます。全角・半角や、つづりを確かめてもう一度入れてください。'; }
  };
}

    const cnt={master:0,weak:0,new:0,try:0}; P.forEach(p=>cnt[state(p)]++);

  }
  app.innerHTML=`<section class="box">${recHTML}
    <div><div class="h2" style="margin-bottom:8px">出題する言葉</div>
      <div class="chips">${Object.entries(TYPES).filter(([k,[nm,f]])=>k==='weak'||k==='fresh'||P.filter(f).length).map(([k,[nm,f]])=>{const n=P.filter(f).length;return `<button class="chip" id="th-${k}" data-t="${k}" aria-pressed="${k===theme}" ${n?'':'disabled'}>${nm}（${n}組）</button>`;}).join('')}</div></div>
    <div><div class="h2" style="margin-bottom:8px">あそびかた</div>
      <div class="modes">${Object.entries(MODES).map(([k,[nm,ds]])=>{const n=pool(k).length;return `<button class="mode" id="mode-${k}" data-m="${k}" ${n?'':'disabled'}><span class="nm">${nm}</span><span class="ds">${ds}${n?'':'（この言葉では遊べません）'}</span><span class="best">${best[k+'-'+theme]!=null?`ベスト ${best[k+'-'+theme]}/${Math.min(ROUND,n)}`:''}</span></button>`;}).join('')}</div></div>
    <p class="note">「積極⇔消極」のように1字だけちがう組や、「主観⇔客観」のように形がにた組は、漢字ごと覚えると入試で役立ちます。</p>
    ${PAID?'<div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>':PAIDLINK}
  </section>`;
  const rs=document.getElementById('reset');
  if(rs)rs.onclick=()=>{
    document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
    document.getElementById('yes').onclick=()=>{rec={};saveRec();home();};
    document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
  };
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{theme=b.dataset.t;home();});
  app.querySelectorAll('.mode').forEach(b=>b.onclick=()=>start(b.dataset.m));
}
function pool(mode){return (mode==='fill'?fillable:P).filter(TYPES[theme][1]);}
function makeQ(p,mode){
  let flip=Math.random()<.5;
  if(mode==='fill'){const bb=flip?p[0]:p[3], aa=flip?p[3]:p[0]; if([...bb].every(ch=>aa.includes(ch)))flip=!flip;}
  const [a,ya,ma,b,yb,mb]=flip?[p[3],p[4],p[5],p[0],p[1],p[2]]:[p[0],p[1],p[2],p[3],p[4],p[5]];
  const q={p,a,ya,ma,b,yb,mb};
  if(mode==='choice'){
    const okW=opp[a];
    const cand=shuffle(allWords.filter(w=>w!==a&&!okW.has(w)));
    const same=cand.filter(w=>typeOf[w]===typeOf[a]), other=cand.filter(w=>typeOf[w]!==typeOf[a]);
    q.ch=shuffle([b,...[...same,...other].slice(0,3)]);
  } else {
    // aと共通でない字の位置をうめる（積極→消極なら「消」）
    let pos=[...b].findIndex((c,i)=>!a.includes(c)); if(pos<0)pos=0;
    q.pos=pos; q.right=b[pos];
    const pool=shuffle([...new Set(P.flatMap(x=>[...x[0],...x[3]]).filter(c=>isKanji(c)&&c!==q.right&&!b.includes(c)))]);
    // ほかの字を入れると、別の反対語ができてしまう場合はのぞく
    const ok=c=>{const w=b.slice(0,pos)+c+b.slice(pos+1);return !(opp[a]&&opp[a].has(w));};
    q.ch=shuffle([q.right,...pool.filter(ok).slice(0,3)]);
  }
  return q;
}
function start(mode,list){
  const src=list||shuffle(pool(mode)).slice(0,ROUND);
  G={mode,qs:src.map(p=>makeQ(p,mode)),i:0,score:0,combo:0,maxCombo:0,miss:[],done:false,newly:[],retry:!!list};
  track('level_start',{level_name:`${PREFIX}-${mode}-${theme}`});
  show();
}
const bar=()=>`<div class="bar"><div class="prog" aria-hidden="true"><i style="width:${G.i/G.qs.length*100}%"></i></div><span class="nums">${G.i+1} / ${G.qs.length}</span>${G.combo>=2?`<span class="combo">${G.combo}連続</span>`:''}</div>`;
function fillWord(q,shown,cls){return [...q.b].map((c,i)=>i===q.pos?`<span class="sq2 ${cls||''}">${shown?esc(shown):''}</span>`:esc(c)).join('');}
function show(){
  const q=G.qs[G.i];
  if(G.mode==='choice'){
    app.innerHTML=`<section class="box">${bar()}
      <div class="pair"><div class="word">${esc(q.a)}<small>${esc(q.ya)}</small></div><span class="arrow">⇔</span><div class="word"><span class="q" id="ans">？</span></div></div>
      <p class="note" style="text-align:center">「${esc(q.a)}」の反対の意味の言葉は？</p>
      <div class="choices ch2">${q.ch.map((c,j)=>`<button class="ch" id="ch${j}" data-j="${j}">${esc(c)}</button>`).join('')}</div>
      <div id="after"></div></section>`;
    app.querySelectorAll('.ch').forEach(b=>b.onclick=()=>judge(+b.dataset.j));
  } else {
    app.innerHTML=`<section class="box">${bar()}
      <div class="pair"><div class="word">${esc(q.a)}<small>${esc(q.ya)}</small></div><span class="arrow">⇔</span><div class="word" id="fw">${fillWord(q)}<small>${esc(q.yb)}</small></div></div>
      <p class="note" style="text-align:center">□に入る漢字は？</p>
      <div class="kch">${q.ch.map((c,j)=>`<button class="kc" id="kc${j}" data-j="${j}">${esc(c)}</button>`).join('')}</div>
      <div id="after"></div></section>`;
    app.querySelectorAll('.kc').forEach(b=>b.onclick=()=>judge(+b.dataset.j));
  }
}
function judge(j){
  if(G.done)return; G.done=true;
  const q=G.qs[G.i];
  const right=G.mode==='choice'?q.b:q.right, ok=q.ch[j]===right;
  const sel=G.mode==='choice'?'.ch':'.kc';
  app.querySelectorAll(sel).forEach((b,k)=>{b.disabled=true;if(q.ch[k]===right)b.classList.add('right');else if(k===j)b.classList.add('wrong');else if(sel==='.kc')b.classList.add('dim');});
  if(G.mode==='choice')document.getElementById('ans').outerHTML=`<span>${esc(q.b)}</span>`;
  else document.getElementById('fw').innerHTML=`${fillWord(q,right,ok?'ok':'ng')}<small>${esc(q.yb)}</small>`;
  let nowMaster=false;
  if(PAID){const before=state(q.p);const r=rec[rk(q.p)]||[0,0]; r[ok?0:1]++; rec[rk(q.p)]=r; saveRec(); nowMaster=state(q.p)==='master'&&before!=='master'; if(nowMaster)G.newly.push(q.p);}
  if(ok){G.score++;G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);}else{G.combo=0;G.miss.push(q.p);}
  track('answer_question',{category:`${PREFIX}-${G.mode}-${q.p[6]}`,question:`${q.a}-${q.b}`,correct:ok});
  const alt=[...opp[q.a]].filter(w=>w!==q.b);
  const last=G.i===G.qs.length-1;
  document.getElementById('after').innerHTML=`<div class="verdict ${ok?'ok':'ng'}">${ok?'正解！':'ざんねん'}${nowMaster?'<span class="newmark">覚えた！</span>':''}</div>
    <div class="exp ex2"><div><b>${esc(q.a)}</b>（${esc(q.ya)}）…${esc(q.ma)}</div><div><b>${esc(q.b)}</b>（${esc(q.yb)}）…${esc(q.mb)}</div>${alt.length?`<div class="note" style="font-size:13px">「${esc(q.a)}」の反対語には「${alt.map(esc).join('」「')}」もあります。</div>`:''}</div>
    <div class="row"><button class="btn go" id="next">${last?'結果を見る':'次の問題へ'}</button></div>`;
  const nx=document.getElementById('next'); nx.onclick=next; nx.focus({preventScroll:true});
}
function next(){ G.done=false; if(++G.i<G.qs.length)show(); else result(); }
function result(){
  const n=G.qs.length,s=G.score,r=s/n;
  const rank=r===1?'満点':r>=.8?'特選':r>=.6?'入選':r>=.4?'佳作':'もう一歩';
  const k=G.mode+'-'+theme; let isNew=false;
  if(!G.retry&&(best[k]==null||s>best[k])){best[k]=s;store.set(PREFIX+'-best',best);isNew=true;}
  track('level_end',{level_name:`${PREFIX}-${G.mode}-${theme}`,success:s===n,score:s,total:n});
  app.innerHTML=`<section class="box">
    <h2 class="h2">${MODES[G.mode][0]}・${TYPES[theme][0]}の結果</h2>
    <div class="score"><div class="big">${s}<small> / ${n}問</small></div><div class="seal">${rank}</div></div>
    <p style="margin:0">${PAID?`${G.newly.length?`新しく${G.newly.length}組を覚えました。`:''}覚えた反対語は ${P.filter(p=>state(p)==='master').length} / ${P.length}組です。`:(r===1?'全問正解！反対語はばっちりです。':r>=.6?'よくできました。まちがえた組を、意味といっしょに見直そう。':'2つの言葉の意味をセットで覚えると、ぐっと解きやすくなります。')}${G.maxCombo>=3?`　最高${G.maxCombo}連続正解！`:''}${isNew&&s>0?'　自己ベスト更新！':''}</p>
    <div class="row" style="justify-content:flex-start"><button class="btn go" id="again">もう一度</button>${G.miss.length?'<button class="btn" id="retry">まちがえた組だけ</button>':''}<button class="btn" id="home">はじめにもどる</button></div>
    ${PAID?'':PAIDLINK}
    ${G.miss.length?`<div class="h2" style="font-size:17px">おぼえておこう</div><div class="review">${G.miss.map(p=>`<div class="rv"><span class="w">${esc(p[0])} ⇔ ${esc(p[3])}</span><div>${esc(p[0])}：${esc(p[2])}／${esc(p[3])}：${esc(p[5])}</div></div>`).join('')}</div>`:''}
  </section>`;
  document.getElementById('again').onclick=()=>start(G.mode);
  document.getElementById('home').onclick=home;
  const rt=document.getElementById('retry'); if(rt)rt.onclick=()=>start(G.mode,shuffle(G.miss));
}
document.addEventListener('keydown',e=>{
  if(!G||G.done)return;
  const k={'1':0,'2':1,'3':2,'4':3}[e.key]; if(k!=null)judge(k);
});
(async()=>{
  if(!PAID){ init(JSON.parse(document.getElementById('data').textContent)); home(); return; }
  try{const d=await (await fetch('../games.json',{cache:'no-cache'})).json(); shopUrl=(d.site&&d.site.shopUrl)||'';}catch(e){}
  const saved=store.get(PREFIX+'-pass','');
  if(saved){ try{ init(await decrypt(saved)); home(); return; }catch(e){ store.set(PREFIX+'-pass',''); lockScreen('合言葉が変わりました。新しい合言葉を入れてください。'); return; } }
  lockScreen();
})();
})();
</script>
