async function decrypt(pass){
  const p=JSON.parse(document.getElementById('data').textContent);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(pass)),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(p.salt),iterations:p.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(p.iv)},k,b64(p.data))));
}

function qtext(q){

function render(){

function tap(i){

  if(ok)G.score++; else G.miss.push(G.list[G.i]);
  track('answer_question',{category:'kakariuke-'+q.type,question:q.bun.join(''),correct:ok});
  render();
}
function arcPath(from,to,cls,lift){
  const sw=document.getElementById('sw').getBoundingClientRect();
  const a=document.getElementById('b'+from).getBoundingClientRect(), b=document.getElementById('b'+to).getBoundingClientRect();
  const ax=a.left+a.width/2-sw.left, bx=b.left+b.width/2-sw.left;
  const aT=a.top-sw.top, aB=a.bottom-sw.top, bT=b.top-sw.top, bB=b.bottom-sw.top;
  const head=(x,y,up)=>up?`<polygon class="${cls}" points="${x-5},${y+8} ${x+5},${y+8} ${x},${y}"/>`:`<polygon class="${cls}" points="${x-5},${y-8} ${x+5},${y-8} ${x},${y}"/>`;
  if(Math.abs(aT-bT)<10){ // 同じ行：上にアーチ
    const top=aT-Math.min(40,(lift||16)+Math.abs(bx-ax)/6);
    return `<path class="${cls}" d="M${ax} ${aT} C ${ax} ${top}, ${bx} ${top}, ${bx} ${bT-6}"/>`+head(bx,bT-1,false);
  }
  if(aT<bT){ // 上の行から下の行へ：行のすきまを通る
    const mid=(aB+bT)/2;
    return `<path class="${cls}" d="M${ax} ${aB} C ${ax} ${mid+10}, ${bx} ${mid-10}, ${bx} ${bT-6}"/>`+head(bx,bT-1,false);
  }
  const mid=(bB+aT)/2; // 下の行から上の行へ
  return `<path class="${cls}" d="M${ax} ${aT} C ${ax} ${mid-10}, ${bx} ${mid+10}, ${bx} ${bB+6}"/>`+head(bx,bB+1,true);
}
function drawArcs(){
  const q=getQ(G.list[G.i]), svg=document.getElementById('arc'); let s='';
  if(q.type==='to'){ G.sel.forEach(i=>{if(i!==q.ans[0])s+=arcPath(q.src,i,'wrong');}); s+=arcPath(q.src,q.ans[0],''); }
  else if(q.type==='multi'){ G.sel.forEach(i=>{if(!q.ans.includes(i))s+=arcPath(i,q.target,'wrong',12);}); q.ans.forEach((i,k)=>s+=arcPath(i,q.target,'',12+k*14)); }
  else if(q.link){ s+=arcPath(q.link[0],q.link[1],''); }
  svg.innerHTML=s;
}
function explain(){
  const q=getQ(G.list[G.i]);
  const show=[...new Set([...G.sel,...q.ans,...(q.trap!=null?[q.trap]:[])])].filter(i=>i!==q.src&&i!==q.target);
  const item=i=>{
    const c=q.check[i], good=q.ans.includes(i);
    let ph,why;
    if(c){ph=c[0];why=c[1];}
    else if(q.type==='to'){ph=strip(q.bun[q.src])+strip(q.bun[i]);why=i<q.src?'かかる先は、ふつうその言葉より後ろにあります。':'つなげても意味が通りません。';}
    else if(q.type==='multi'){ph=strip(q.bun[i])+strip(q.bun[q.target]);why='つなげても意味が通りません。';}
    else {ph=strip(q.bun[i]);why=q.type==='subj'?'「だれが・何が」にあたる言葉ではありません。':'文の終わりにある、「どうする・どんなだ・何だ」にあたる言葉ではありません。';}
    return `<li><span class="mk ${good?'o':'x'}">${good?'〇':'×'}</span><span><span class="ph">${esc(ph)}</span><br><span class="why">${esc(why)}</span></span></li>`;
  };
  const last=G.i===G.list.length-1;
  const ansText=q.ans.map(i=>`「${esc(strip(q.bun[i]))}」`).join('と');
  document.getElementById('after').innerHTML=`<div class="box" style="padding:14px;gap:12px;border-color:${G.ok?'var(--ok)':'var(--ng)'}">
    <div class="verdict ${G.ok?'ok':'ng'}">${G.ok?'正解！':'ざんねん'}${G.newM?'<span style="font-size:13px;margin-left:8px;color:var(--ok);font-family:var(--body);font-weight:700">覚えた！</span>':''}　答えは${ansText}</div>
    <div class="label" style="color:var(--fg)">${q.type==='subj'||q.type==='pred'?'ひとつずつ確かめよう':'つなげて読んでみよう'}</div>
    <ul class="check">${show.map(item).join('')}</ul>
    <div class="tip">${q.tip}</div>
    <div class="row"><button class="btn go" id="next">${last?'結果を見る':'次の問題へ'}</button></div></div>`;
  const nx=document.getElementById('next'); nx.onclick=next; nx.focus({preventScroll:true});
}
function next(){ G.done=false; G.sel=new Set(); G.pick=null; if(++G.i<G.list.length)render(); else result(); }
function result(){
  const n=G.list.length,s=G.score,r=s/n;
  const rank=r===1?'満点':r>=.8?'特選':r>=.6?'入選':r>=.4?'佳作':'もう一歩';
  track('level_end',{level_name:PAID?'kakariuke-p-'+course:'kakariuke',success:s===n,score:s,total:n});
  if(PAID&&/^[123]$/.test(course)&&(best['lv'+course]==null||s>best['lv'+course])){best['lv'+course]=s;store.set('kakariuke-p-best',best);}
  app.innerHTML=`<div class="label">結果</div>
    <div class="score"><div class="big">${s}<small> / ${n}問</small></div><div class="seal">${rank}</div></div>
    <p style="margin:0">${r===1?'全問正解！係り受けはばっちりです。':r>=.6?'よくできました。まちがえた問題を、つなげ読みで確かめよう。':'2つの言葉をつなげて読む方法を使うと、ぐっと解きやすくなります。'}</p>
    <div class="row"><button class="btn go" id="again">${PAID?'コースをえらぶ':'もう一度'}</button>${G.miss.length?'<button class="btn" id="retry">まちがえた問題だけ</button>':''}</div>
    ${PAID?'':PAIDLINK}
    ${G.miss.length?`<div class="label" style="color:var(--fg)">まちがえた問題</div>${G.miss.map(k=>{const q=getQ(k);if(q.type==='comma')return `<div class="rv"><b>${esc(q.tok.slice(0,q.ans+1).join('')+'、'+q.tok.slice(q.ans+1).join(''))}</b><br>${esc(q.meaning.replace(/ように$/,''))}</div>`;return `<div class="rv"><b>${esc(q.bun.join(' '))}</b><br>${KIND[q.type]}：${q.ans.map(i=>'「'+esc(strip(q.bun[i]))+'」').join('と')}</div>`;}).join('')}`:''}`;
  document.getElementById('again').onclick=()=>PAID?home():start(typeof G.list[0]==='string'?CQ.map((q,i)=>'c'+i):QS.map((q,i)=>i));
  const rt=document.getElementById('retry'); if(rt)rt.onclick=()=>start(G.miss.slice());
}
const redraw=()=>{if(!G||!G.done)return; if(getQ(G.list[G.i]).type==='comma')renderComma(); else drawArcs();};
window.addEventListener('resize',redraw);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(redraw);
if(document.fonts&&document.fonts.addEventListener)document.fonts.addEventListener('loadingdone',redraw);
(async()=>{
  if(!PAID){ home(); return; }
  try{const d=await (await fetch('../games.json',{cache:'no-cache'})).json(); shopUrl=(d.site&&d.site.shopUrl)||'';}catch(e){}
  const saved=store.get('kakariuke-p-pass','');
  if(saved){ try{ QS=await decrypt(saved); home(); return; }catch(e){ store.set('kakariuke-p-pass',''); lockScreen('合言葉が変わりました。新しい合言葉を入れてください。'); return; } }
  lockScreen();
})();
})();
</script>
