<title>慣用句クイズ300</title>
<meta name="game:subject" content="国語">
<meta name="game:unit" content="慣用句">
<meta name="game:grade" content="小4〜">
<meta name="game:players" content="1人">
<meta name="game:paid" content="利用コード">
<meta name="description" content="中学入試に出る慣用句300語を、レベル別・分類別に練習できる有料版。覚えた慣用句の記録と苦手だけの復習つき。">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Old+Mincho:wght@700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: 1列。慣用句の一文（空らんは原稿用紙のマス）→ 意味 → 札か選択肢。国語シリーズ共通の原稿用紙の赤茶 */
:root{
  --bg:#f5f6f3; --surface:#ffffff; --fg:#23262b; --muted:#646a70; --rule:#dadcd6;
  --grid:#c4553a; --gridsoft:#f6e4de; --ok:#2f7a52; --ng:#c8352d; --pick:#eceee8; --gold:#b88a1e;
  --display:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --kanji:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141615; --surface:#1d201f; --fg:#e8eae6; --muted:#9ea4a0; --rule:#323634;
  --grid:#e47a5f; --gridsoft:#3a2520; --ok:#5cc28c; --ng:#f07468; --pick:#262a28; --gold:#e1b44a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141615; --surface:#1d201f; --fg:#e8eae6; --muted:#9ea4a0; --rule:#323634;
  --grid:#e47a5f; --gridsoft:#3a2520; --ok:#5cc28c; --ng:#f07468; --pick:#262a28; --gold:#e1b44a; color-scheme:dark}

body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 64px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-size:clamp(30px,8vw,40px);line-height:1.2;margin:0;letter-spacing:.06em}
.badge{display:inline-block;font-family:var(--body);font-size:12px;font-weight:700;color:var(--surface);background:var(--grid);border-radius:4px;padding:1px 8px;vertical-align:middle;margin-left:8px;letter-spacing:.05em}
.lead{margin:4px 0 0;color:var(--muted);font-size:14px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:16px}
.h2{font-family:var(--display);font-size:20px;margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:transparent;border-radius:99px;padding:4px 14px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip:disabled{opacity:.4;cursor:default}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.modes{grid-template-columns:1fr}}
.mode{border:2px solid var(--rule);background:var(--surface);border-radius:8px;padding:14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px}
.mode:hover{border-color:var(--grid)}
.mode .nm{font-family:var(--display);font-size:20px}
.mode .ds{font-size:13px;color:var(--muted);line-height:1.5}
.mode .best{font-size:12px;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);margin:0}
.bar{display:flex;align-items:center;gap:10px}
.prog{flex:1;height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--grid);transition:width .3s}
.nums{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.combo{color:var(--grid);font-weight:700;font-size:14px}
.cat{font-size:12px;font-weight:700;color:var(--grid);border:1px solid var(--grid);border-radius:4px;padding:0 6px}
.phrase{font-family:var(--kanji);font-weight:600;font-size:clamp(26px,7.5vw,36px);line-height:1.6;text-align:center;text-wrap:balance}
.blank{display:inline-grid;place-items:center;min-width:1.25em;height:1.25em;padding:0 .1em;border:2px solid var(--grid);background:var(--gridsoft);vertical-align:middle;margin:0 .08em;line-height:1}
.blank.ok{color:var(--ok);background:var(--surface)} .blank.ng{color:var(--ng);background:var(--surface)}
.meaning{border-left:4px solid var(--grid);padding:4px 0 4px 14px}
.meaning .lab{font-size:12px;font-weight:700;color:var(--grid);letter-spacing:.1em}
.meaning p{margin:2px 0 0;font-size:18px;font-weight:700;line-height:1.7}
.choices{display:grid;gap:10px}
.ch{border:2px solid var(--rule);background:var(--surface);border-radius:8px;padding:12px 14px;cursor:pointer;font-family:var(--kanji);font-weight:600;font-size:clamp(19px,5.4vw,22px);text-align:left}
.ch:hover:not(:disabled){border-color:var(--grid)}
.ch:disabled{cursor:default}
.ch.right{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.ch.wrong{border-color:var(--ng);color:var(--ng);background:color-mix(in srgb,var(--ng) 8%,var(--surface))}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px;margin:0 auto;width:100%}
.tile{min-height:56px;border:1px solid var(--rule);border-radius:8px;background:var(--pick);cursor:pointer;font-family:var(--kanji);font-weight:600;font-size:clamp(18px,5.6vw,24px);padding:4px;line-height:1.2}
.tile:hover:not(:disabled){border-color:var(--grid)}
.tile:disabled{cursor:default;opacity:.45}
.tile.right{opacity:1;border:2px solid var(--ok);color:var(--ok);background:var(--surface)}
.tile.wrong{opacity:1;border:2px solid var(--ng);color:var(--ng);background:var(--surface)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{border:0;border-radius:8px;padding:10px 20px;font-weight:700;cursor:pointer;background:var(--pick)}
.btn.go{background:var(--fg);color:var(--surface)}
.btn:disabled{opacity:.4;cursor:default}
.verdict{text-align:center;font-family:var(--display);font-size:24px;line-height:1.3}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.newmark{font-size:12px;font-weight:700;color:var(--ok);margin-left:6px;font-family:var(--body)}
.exp{background:var(--bg);border-radius:8px;padding:12px 14px;font-size:15px}
.exp b{font-family:var(--kanji);font-size:19px}
.exp .y{color:var(--muted);font-size:13px}
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.big{font-family:var(--display);font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:22px}
.seal{width:92px;height:92px;border-radius:50%;border:5px solid var(--grid);color:var(--grid);display:grid;place-items:center;font-family:var(--display);font-size:22px;transform:rotate(-10deg);text-align:center;line-height:1.1}
.review{display:grid;gap:10px}
.rv{border:1px solid var(--rule);border-radius:8px;padding:10px 14px;font-size:14px}
.rv .w{font-family:var(--kanji);font-weight:600;font-size:20px}
.paid{display:flex;flex-direction:column;gap:2px;border:2px solid var(--grid);border-radius:8px;padding:12px 14px;text-decoration:none;color:var(--fg);background:var(--gridsoft)}
.paid .pt{font-size:15px} .paid .pt b{font-family:var(--display);color:var(--grid)}
.paid .pd{font-size:13px;color:var(--muted)}
.lock input{font:inherit;font-size:20px;letter-spacing:.06em;padding:10px 12px;border:2px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--fg);width:100%;box-sizing:border-box}
.lock input:focus{border-color:var(--grid);outline:none}
.err{color:var(--ng);font-size:14px;margin:0;min-height:1.5em}
.shop{background:var(--bg);border-radius:8px;padding:12px 14px;font-size:14px}
.shop a{color:var(--grid);font-weight:700}
.master{display:flex;flex-direction:column;gap:6px}
.master .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.master .cnt{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.master .cnt small{font-size:14px;color:var(--muted);font-family:var(--body)}
.mbar{height:10px;background:var(--rule);border-radius:5px;overflow:hidden;display:flex}
.mbar i{display:block;height:100%}
.mbar .m{background:var(--ok)} .mbar .w{background:var(--gold)}
.mleg{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.mleg span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle;background:var(--c)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>

<div class="wrap">
  <header>
    <h1>慣用句クイズ<span style="font-variant-numeric:tabular-nums">300</span><span class="badge">有料版</span></h1>
    <p class="lead">中学入試に出る慣用句300語。覚えた慣用句が記録され、苦手なものだけを集中して練習できます。</p>
  </header>
  <main id="app"></main>
</div>
<script type="application/json" id="data">{}</script>

<script>
(function(){
const PAID=true;
const app=document.getElementById('app');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.normalize('NFKC').toLowerCase().replace(/[\s\-ー－]/g,'');
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const PREFIX=PAID?'kan300':'kan60', ROUND=10;
let W=null, shopUrl='';

/* 慣用句のデータ: [空らんを{}でかこんだ文, 空らんの読み, 意味, レベル, 分類] */
const word=w=>w[0].match(/\{([^}]+)\}/)[1];
const plain=w=>w[0].replace(/[{}]/g,'');
const phraseHTML=(w,fill,cls)=>esc(w[0]).replace(/\{([^}]+)\}/,(m,x)=>`<span class="blank ${cls||''}">${fill?esc(fill):''}</span>`);

/* ---------- 合言葉（有料版） ---------- */
async function decrypt(){ return mnAccess.load('kanyouku300'); }
function lockScreen(err){ mnAccess.lock(app,{game:'kanyouku300',err:err,free:'kanyouku.html',onOpen:async()=>{ W=await decrypt(); home(); }}); }

/* ---------- 記録（有料版） ---------- */
let rec=store.get(PREFIX+'-rec',{});
const saveRec=()=>store.set(PREFIX+'-rec',rec);
const state=w=>{const r=rec[plain(w)];if(!r)return 'new';if(r[0]>=2&&r[0]>r[1])return 'master';if(r[1]>0)return 'weak';return 'try';};
const THEMES={
  all:['ぜんぶ',w=>true],
  体:['体',w=>w[4]==='体'],動物:['動物・虫',w=>w[4]==='動物'],自然:['自然・植物',w=>w[4]==='自然'],その他:['その他',w=>w[4]==='その他'],
  ...(PAID?{lv1:['基本',w=>w[3]===1],lv2:['標準',w=>w[3]===2],lv3:['発展',w=>w[3]===3],weak:['にがて',w=>state(w)==='weak'],fresh:['まだやっていない',w=>state(w)==='new']}:{})
};
const MODES={fill:['うめる','空らんに入ることばを、8まいの札からえらぶ。'],choice:['えらぶ','意味に合う慣用句を、4つの中からえらぶ。']};
let theme='all', G=null, best=store.get(PREFIX+'-best',{});
const PAIDLINK=`<a class="paid" href="kanyouku300.html" id="paid-link"><span class="pt">もっと覚えたい人へ　<b>慣用句クイズ300</b>（有料版）</span><span class="pd">中学入試に出る300語。レベル別の練習、覚えた慣用句の記録、苦手だけの復習つき。</span></a>`;

function home(){
  G=null;
  const pool=W.filter(THEMES[theme][1]);
  let rec_html='';
  if(PAID){
    const cnt={master:0,weak:0,new:0,try:0}; W.forEach(w=>cnt[state(w)]++);
    rec_html=`<div class="master"><div class="top"><span class="h2">覚えた慣用句</span><span class="cnt">${cnt.master}<small> / ${W.length}語</small></span></div>
      <div class="mbar" aria-hidden="true"><i class="m" style="width:${cnt.master/W.length*100}%"></i><i class="w" style="width:${cnt.weak/W.length*100}%"></i></div>
      <div class="mleg"><span style="--c:var(--ok)">覚えた ${cnt.master}</span><span style="--c:var(--gold)">にがて ${cnt.weak}</span><span style="--c:var(--rule)">まだ ${cnt.new}</span></div>
      <p class="note">2回以上正解し、正解がまちがいより多くなると「覚えた」になります。</p></div>`;
  }
  app.innerHTML=`<section class="box">${rec_html}
    <div><div class="h2" style="margin-bottom:8px">練習する慣用句</div>
      <div class="chips">${Object.entries(THEMES).map(([k,[nm,f]])=>{const n=W.filter(f).length;return `<button class="chip" id="th-${k}" data-t="${k}" aria-pressed="${k===theme}" ${n?'':'disabled'}>${nm}（${n}）</button>`;}).join('')}</div></div>
    <div><div class="h2" style="margin-bottom:8px">あそびかた</div>
      <div class="modes">${Object.entries(MODES).map(([k,[nm,ds]])=>`<button class="mode" id="mode-${k}" data-m="${k}" ${pool.length?'':'disabled'}><span class="nm">${nm}</span><span class="ds">${ds}</span><span class="best">${best[k+'-'+theme]!=null?`ベスト ${best[k+'-'+theme]}/${Math.min(ROUND,pool.length)}`:''}</span></button>`).join('')}</div></div>
    <p class="note">${pool.length<ROUND?`この練習は${pool.length}語なので、${pool.length}問になります。`:'1回10問です。'}${PAID?'':'　体の一部や動物の名前が入る慣用句は、入試の空らん問題によく出ます。'}</p>
    ${PAID?'<div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>':PAIDLINK}
  </section>`;
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{theme=b.dataset.t;home();});
  app.querySelectorAll('.mode').forEach(b=>b.onclick=()=>start(b.dataset.m));
  const rs=document.getElementById('reset');
  if(rs)rs.onclick=()=>{
    document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
    document.getElementById('yes').onclick=()=>{rec={};saveRec();home();};
    document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
  };
}
function start(mode,list){
  const pool=W.filter(THEMES[theme][1]);
  const qs=(list||shuffle(pool).slice(0,ROUND)).map(w=>{
    if(mode==='choice'){
      const same=shuffle(W.filter(x=>x!==w&&x[4]===w[4])), other=shuffle(W.filter(x=>x!==w&&x[4]!==w[4]));
      return {w,ch:shuffle([w,...[...same,...other].slice(0,3)])};
    }
    const right=word(w);
    const all=new Set(W.map(plain)), fits=x=>all.has(w[0].replace(/\{[^}]+\}/,x));
    const cand=[...new Set([...shuffle(W.filter(x=>x[4]===w[4])),...shuffle(W)].map(word))].filter(x=>x!==right&&!fits(x));
    return {w,tiles:shuffle([right,...cand.slice(0,7)])};
  });
  G={mode,qs,i:0,score:0,combo:0,maxCombo:0,miss:[],done:false,newly:[],retry:!!list};
  track('level_start',{level_name:`${PREFIX}-${mode}-${theme}`});
  show();
}
function head(){
  const w=G.qs[G.i].w;
  return `<div class="bar"><div class="prog" aria-hidden="true"><i style="width:${G.i/G.qs.length*100}%"></i></div>
    <span class="nums">${G.i+1} / ${G.qs.length}</span>${G.combo>=2?`<span class="combo">${G.combo}連続</span>`:''}<span class="cat">${THEMES[w[4]][0]}</span></div>`;
}
function show(){
  const it=G.qs[G.i], w=it.w;
  if(G.mode==='choice'){
    app.innerHTML=`<section class="box">${head()}
      <div class="meaning"><div class="lab">意味</div><p>${esc(w[2])}</p></div>
      <div class="choices">${it.ch.map((c,j)=>`<button class="ch" id="ch${j}" data-j="${j}">${esc(plain(c))}</button>`).join('')}</div>
      <div id="after"></div></section>`;
    app.querySelectorAll('.ch').forEach(b=>b.onclick=()=>judge(it.ch[+b.dataset.j]===w,+b.dataset.j));
  } else {
    app.innerHTML=`<section class="box">${head()}
      <div class="phrase" id="phrase">${phraseHTML(w)}</div>
      <div class="meaning"><div class="lab">意味</div><p>${esc(w[2])}</p></div>
      <div class="tiles">${it.tiles.map((c,j)=>`<button class="tile" id="tile${j}" data-j="${j}">${esc(c)}</button>`).join('')}</div>
      <div id="after"></div></section>`;
    app.querySelectorAll('.tile').forEach(b=>b.onclick=()=>judge(it.tiles[+b.dataset.j]===word(w),+b.dataset.j));
  }
}
function judge(ok,j){
  if(G.done)return; G.done=true;
  const it=G.qs[G.i], w=it.w, before=PAID?state(w):null;
  if(G.mode==='choice'){
    app.querySelectorAll('.ch').forEach((b,k)=>{b.disabled=true;if(it.ch[k]===w)b.classList.add('right');else if(k===j)b.classList.add('wrong');});
  } else {
    app.querySelectorAll('.tile').forEach((b,k)=>{b.disabled=true;if(it.tiles[k]===word(w))b.classList.add('right');else if(k===j)b.classList.add('wrong');});
    document.getElementById('phrase').innerHTML=phraseHTML(w,word(w),ok?'ok':'ng');
  }
  let nowMaster=false;
  if(PAID){const r=rec[plain(w)]||[0,0]; r[ok?0:1]++; rec[plain(w)]=r; saveRec(); nowMaster=state(w)==='master'&&before!=='master'; if(nowMaster)G.newly.push(w);}
  if(ok){G.score++;G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);}else{G.combo=0;G.miss.push(w);}
  track('answer_question',{category:`${PREFIX}-${G.mode}-${w[4]}`,question:plain(w),correct:ok});
  const last=G.i===G.qs.length-1;
  document.getElementById('after').innerHTML=`<div class="verdict ${ok?'ok':'ng'}">${ok?'正解！':'ざんねん'}${nowMaster?'<span class="newmark">覚えた！</span>':''}</div>
    <div class="exp"><b>${esc(plain(w))}</b>　<span class="y">（空らん：${esc(word(w))}＝${esc(w[1])}）</span><br>${esc(w[2])}</div>
    <div class="row"><button class="btn go" id="next">${last?'結果を見る':'次の問題へ'}</button></div>`;
  const nx=document.getElementById('next'); nx.onclick=next; nx.focus({preventScroll:true});
}
function next(){ G.done=false; if(++G.i<G.qs.length)show(); else result(); }
function result(){
  const n=G.qs.length,s=G.score,r=s/n;
  const rank=r===1?'満点':r>=.8?'特選':r>=.6?'入選':r>=.4?'佳作':'もう一歩';
  const k=G.mode+'-'+theme; let isNew=false;
  if(!G.retry&&(best[k]==null||s>best[k])){best[k]=s;store.set(PREFIX+'-best',best);isNew=true;}
  track('level_end',{level_name:`${PREFIX}-${G.mode}-${theme}`,success:s===n,score:s,total:n});
  const m=PAID?W.filter(w=>state(w)==='master').length:0;
  app.innerHTML=`<section class="box">
    <h2 class="h2">${MODES[G.mode][0]}・${THEMES[theme][0]}の結果</h2>
    <div class="score"><div class="big">${s}<small> / ${n}問</small></div><div class="seal">${rank}</div></div>
    <p style="margin:0">${PAID?`${G.newly.length?`新しく${G.newly.length}語を覚えました。`:''}覚えた慣用句は ${m} / ${W.length}語です。`:(r===1?'全問正解！すばらしい。':r>=.6?'よくできました。まちがえた慣用句を見直そう。':'空らんのことばと意味をセットで覚えると、ぐっと解きやすくなります。')}${G.maxCombo>=3?`　最高${G.maxCombo}連続正解！`:''}${isNew&&s>0?'　自己ベスト更新！':''}</p>
    <div class="row" style="justify-content:flex-start"><button class="btn go" id="again">もう一度</button>${G.miss.length?'<button class="btn" id="retry">まちがえた慣用句だけ</button>':''}<button class="btn" id="home">はじめにもどる</button></div>
    ${PAID?'':PAIDLINK}
    ${G.miss.length?`<div class="h2" style="font-size:17px">おぼえておこう</div><div class="review">${G.miss.map(w=>`<div class="rv"><span class="w">${esc(plain(w))}</span><div>${esc(w[2])}</div></div>`).join('')}</div>`:''}
  </section>`;
  document.getElementById('again').onclick=()=>start(G.mode);
  document.getElementById('home').onclick=home;
  const rt=document.getElementById('retry'); if(rt)rt.onclick=()=>start(G.mode,shuffle(G.miss));
}
document.addEventListener('keydown',e=>{
  if(!G||G.done||G.mode!=='choice')return;
  const k={'1':0,'2':1,'3':2,'4':3}[e.key]; if(k!=null){const it=G.qs[G.i];judge(it.ch[k]===it.w,k);}
});

(async()=>{
  if(!PAID){ W=JSON.parse(document.getElementById('data').textContent); home(); return; }
  try{ W=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
