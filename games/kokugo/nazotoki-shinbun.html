.tmpl{font-size:16px;line-height:2.1;background:#fff;border-radius:12px;padding:10px 12px}
.blank{display:inline-block;min-width:4.5em;border-bottom:3px solid #24304a;text-align:center;font-weight:800;color:#8a3b12;padding:0 4px;margin:0 2px;cursor:pointer}

  else if(s.t==='inv')investigate();
  else if(s.t==='test')testimony(s.id);
  else if(s.t==='end')ending();
  else if(s.t==='lock')freeEnd();
}

/* ---------- 無料版は ここまで ---------- */
function freeEnd(){
  $('btnQuit').classList.add('hidden');  // 画面の中に 大きな「タイトルへ」が あるので、下の 小さい ほうは かくす
  setStage('tsubasa','つづきは 有料版');$('talkName').textContent='ツバサ';$('talkName').style.background=P.tsubasa.col;
  $('talkText').innerHTML='手がかりは そろった。ここから 先は <b>有料版</b>で、証言の おかしい ところを 見つけて なぞを 解こう！';$('talkNext').classList.add('hidden');$('talk').classList.remove('tap');
  track('free_end',{level_name:'nazotoki-shinbun-ep'+epNo});
  $('area').innerHTML='<a class="big" href="nazotoki-shinbun-full.html" style="text-align:center;text-decoration:none;background:#d6453d;color:#fff;border-color:#a32b25;box-shadow:0 4px 0 #a32b25">🔓 つづきは 有料版で<small style="color:#fff">証言3人・指摘4回・見のがしファイルつき</small></a>'
   +'<button class="big" id="goEp1">第1話　にせもののお知らせ<small>さいごまで 無料で あそべます</small></button>'
   +'<button class="big" id="goTitle">タイトルへ</button>';
  $('goTitle').onclick=()=>{started=false;titleInit();};
  $('goEp1').onclick=()=>{setEp(1);started=false;titleInit();};
}

/* ---------- 調査 ---------- */
function investigate(){
  curPlace='調査';setStage('tsubasa','調査パート');
  const seen=new Set();const ready=()=>INV.req.every(r=>seen.has(r));
  const draw=()=>{
    $('talkName').textContent='ツバサ';$('talkName').style.background=P.tsubasa.col;
    $('talkText').innerHTML=ready()?'よし、手がかりが そろってきた。証言を 聞きに 行こう！':'証拠を 集めよう。どこを 調べる？';
    $('talkNext').classList.add('hidden');
    $('area').innerHTML=INV.places.map(x=>'<button class="big place" data-p="'+x[0]+'"><span class="ic">'+x[1]+'</span><span>'+x[2]+(seen.has(x[0])?' ✅':'')+'<small>'+x[3]+'</small></span></button>').join('')
      +(ready()?'<button class="big" id="goTest" style="background:#d6453d;color:#fff;border-color:#a32b25;box-shadow:0 4px 0 #a32b25">証言を 聞きに 行く</button>':'');
    $('area').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const x=INV.places.find(p=>p[0]===b.dataset.p);curPlace=x[2];$('area').innerHTML='';say(x[4],()=>{seen.add(x[0]);draw();});});
    if($('goTest'))$('goTest').onclick=()=>{step++;run();};
  };
  draw();
}
function gainQuiet(n){if(!ev[n].have){ev[n].have=1;newEv.add(n);}}

/* ---------- 証言 ---------- */
function testimony(id){
  cur=T[id];cur.id=id;sel=-1;cur.lastHint='';cur.wrongN=0;cur.reasonN=0;curPlace=cur.title;setStage(cur.who,cur.title,'');
  $('talkName').textContent=P[cur.who].name;$('talkName').style.background=P[cur.who].col;
  $('talkText').innerHTML='<b>'+cur.title+'</b><br><span style="font-size:14px">おかしいと思う文を タップして、「ききこみ」か「証拠を 見せる」を えらぼう。</span>';
  $('talkNext').classList.add('hidden');$('talk').classList.remove('tap');
  drawStmts();
}
function drawStmts(){
  $('area').innerHTML=cur.stmts.map((s,i)=>'<button class="stmt'+(i===sel?' sel':'')+'" data-i="'+i+'"><span class="no">'+'①②③④'[i]+'</span>'+s+'</button>').join('')
   +'<div id="acts"><button id="aPress" '+(sel<0?'disabled':'')+'>🔍 ききこみ</button><button id="aShout" class="shout" '+(sel<0?'disabled':'')+'>📒 証拠を 見せる</button></div>';
  $('area').querySelectorAll('.stmt').forEach(b=>b.onclick=()=>{sel=+b.dataset.i;drawStmts();});
  $('aPress').onclick=()=>press();$('aShout').onclick=()=>openEv(true);
}
function press(){
  const lines=(cur.press&&cur.press[sel])||[['me','もう少し くわしく 教えて。'],[cur.who,'それ以上の ことは 知らないよ。']];
  $('area').innerHTML='';say(lines,()=>{testimonyKeep();});
}
function testimonyKeep(){
  setStage(cur.who,cur.title);
  $('talkName').textContent=P[cur.who].name;$('talkName').style.background=P[cur.who].col;
  $('talkText').innerHTML='<b>'+cur.title+'</b><br><span style="font-size:14px">'+(cur.lastHint?'💡 '+cur.lastHint:'ほかの文も 調べてみよう。')+'</span>';drawStmts();
}

/* 証拠ノート */
function openEv(pick){
  const list=Object.keys(ev).filter(k=>ev[k].have);
  $('sheet').innerHTML='<h2>📒 証拠ノート'+(pick?'<span style="font-size:14px;font-weight:500">　見せる 証拠を えらぼう</span>':'')+'</h2>'
   +list.map(k=>'<button class="ev'+(pick?' pick':'')+(newEv.has(+k)?' new':'')+'" data-k="'+k+'"><span class="ic">'+ev[k].ic+'</span><span><b>'+ev[k].name+(newEv.has(+k)?' 🆕':'')+'</b>'+ev[k].text+'</span></button>').join('')
   +'<button class="big" id="evClose">とじる</button>';
  $('modal').classList.remove('hidden');
  $('evClose').onclick=()=>{$('modal').classList.add('hidden');newEv.clear();};
  if(pick)$('sheet').querySelectorAll('.ev').forEach(b=>b.onclick=()=>{$('modal').classList.add('hidden');newEv.clear();present(+b.dataset.k);});
}
$('btnEv').onclick=()=>openEv(false);

function present(k){
  const key=sel+'-'+k;
  const S=[].concat(cur.ans.s);
  if(S.includes(sel)&&cur.ans.ev.includes(k)){shout(()=>afterHit());return;}
  if(cur.near&&cur.near[key]){const n=cur.near[key];if(n.flag)flags[n.flag]=1;$('area').innerHTML='';say(n.lines,testimonyKeep);return;}
  // まだ 決め手の証拠を 持っていない ときは、減点せずに ききこみを すすめる
  if(cur.needEv&&!ev[cur.needEv].have){$('area').innerHTML='';cur.lastHint=cur.noEvHint;say([[cur.who,'え？ それが どうしたの？'],['tsubasa',cur.noEvHint]],testimonyKeep);return;}
  // まちがい
  firstTry=false;mistakes++;miss.add(cur.rev);
  gauge--;drawGauge();$('app').classList.add('shake');setTimeout(()=>$('app').classList.remove('shake'),400);
  let h=cur.hint;
  if(cur.special){if(cur.special[key])h=cur.special[key];else if(cur.special[String(sel)])h=cur.special[String(sel)];}
  const noEv=cur.needEv&&!ev[cur.needEv].have;if(noEv)h=cur.noEvHint;
  cur.wrongN=(cur.wrongN||0)+1;
  if(!noEv){
    if(cur.wrongN>=3)h='ヒント：'+'①②③④'[S[0]]+'の文に、「'+ev[cur.ans.ev[0]].name+'」を 見せてみよう！';
    else if(cur.wrongN>=2)h=h+'<br>ヒント：あやしいのは '+'①②③④'[S[0]]+'の文だよ。';
  }
  $('area').innerHTML='';
  if(gauge<=0){say([[cur.who,'……それ、関係 ないよね？'],['tsubasa','信頼が なくなってしまった……。もう一度、この証言から やり直そう。']],()=>{gauge=5;drawGauge();testimony(cur.id);});return;}
  cur.lastHint=h;say([[cur.who,'え？ それが どうしたの？'],['tsubasa',h]],testimonyKeep);
}
function shout(fn){$('area').innerHTML='';$('shoutText').textContent='そこだ！';$('shout').classList.remove('hidden');setTimeout(()=>{$('shout').classList.add('hidden');fn();},900);}
function afterHit(){
  if(cur.follow){followQ();return;}
  reasonQ();
}
function followQ(){
  const f=cur.follow;
  $('talkName').textContent='ツバサ';$('talkName').style.background=P.tsubasa.col;$('talkText').innerHTML=f.q;$('talkNext').classList.add('hidden');
  $('area').innerHTML='<div class="quote" style="font-size:14px">明日の学習発表会で、新聞クラブの展示は中止します。空いた理科室は、演劇クラブがお使いします。　担当　森</div>'
   +shuf(f.opts.length).map(i=>'<button class="choice" data-i="'+i+'">'+f.opts[i]+'</button>').join('');
  $('area').querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
    if(+b.dataset.i===f.ci){reasonQ();return;}
    firstTry=false;mistakes++;miss.add(cur.rev);gauge=Math.max(1,gauge-1);drawGauge();
    $('talkText').innerHTML='<span class="ng">ちがうみたい。</span>'+((f.wrongs&&f.wrongs[+b.dataset.i])||f.wrong);
  });
}

/* ---------- 理由文 ---------- */
function reasonQ(){
  const r=cur.reason;const mode=cur.reasonChoiceOnly?1:lv;
  $('talkName').textContent='ツバサ';$('talkName').style.background=P.tsubasa.col;
  $('talkText').innerHTML='いいぞ！ じゃあ、<b>なぜ おかしいのか</b> 記事に 書けるように まとめよう。';$('talkNext').classList.add('hidden');
  if(mode===1){
    $('area').innerHTML=shuf(r.choices.length).map(i=>'<button class="choice" data-i="'+i+'">'+r.choices[i]+'</button>').join('');
    $('area').querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
      if(+b.dataset.i===r.ci)reasonOK();else{reasonNG();b.disabled=true;b.style.opacity=.35;}});
    return;
  }
  const parts=r.tmpl.split(/【(\d)】/);let fill=r.blanks.map(()=>null),curB=0,glow=null;
  const draw=()=>{
    let h='<div class="tmpl">';
    parts.forEach((p,i)=>{if(i%2===0)h+=p;else{const b=+p;
      if(mode===2)h+='<span class="blank'+(b===curB?' cur':'')+'" data-b="'+b+'">'+(fill[b]||'　')+'</span>';
      else h+='<span class="blank"><input data-b="'+b+'" value="'+(fill[b]||'')+'" placeholder="？"></span>';}});
    h+='</div>';
    if(mode===2)h+='<div class="cards">'+r.cards.map(c=>'<button data-c="'+c+'" class="'+(fill.includes(c)?'used':'')+(c===glow?' glow':'')+'">'+c+'</button>').join('')+'</div>';
    h+='<button class="big" id="rOK">これで 決まり！</button>';
    $('area').innerHTML=h;
    if(mode===2){
      $('area').querySelectorAll('.blank').forEach(s=>s.onclick=()=>{const b=+s.dataset.b;if(fill[b]){fill[b]=null;}curB=b;draw();});
      $('area').querySelectorAll('.cards button').forEach(c=>c.onclick=()=>{if(fill.includes(c.dataset.c))return;fill[curB]=c.dataset.c;const n=fill.indexOf(null);curB=n<0?curB:n;draw();});
    }else{
      $('area').querySelectorAll('input').forEach(inp=>inp.oninput=()=>{fill[+inp.dataset.b]=inp.value;});
    }
    $('rOK').onclick=()=>{
      if(fill.some(f=>!f||!String(f).trim())){$('talkText').innerHTML='まだ 空いている ところが あるよ。';return;}
      const norm=s=>String(s).replace(/[\s　「」、。]/g,'');
      const ok=r.blanks.every((alts,i)=>alts.some(a=>mode===2?fill[i]===a:norm(fill[i]).includes(norm(a))));
      if(ok){reasonOK();return;}
      const bad=r.blanks.map((alts,i)=>!alts.some(a=>mode===2?fill[i]===a:norm(fill[i]).includes(norm(a))));
      reasonNG();cur.reasonN=(cur.reasonN||0)+1;
      if(cur.reasonN>=3){fill=r.blanks.map(a=>a[0]);draw();$('talkText').innerHTML='<span class="ng">こたえは こうだよ。</span>文を 読んでから「これで 決まり！」を おしてね。';glow=null;return;}
      bad.forEach((b,i)=>{if(b)fill[i]=null;});curB=fill.indexOf(null);if(curB<0)curB=0;
      glow=cur.reasonN>=2?r.blanks[curB][0]:null;draw();
      $('talkText').innerHTML='<span class="ng">ちがっていた らんを 空にしたよ。</span>入る ことばを えらびなおそう。'+(glow?'<br>ヒント：光っている カードを 入れてみよう。':'')+(mode===3&&glow?'<br>ヒント：「'+glow+'」と 書いてみよう。':'');
    };
  };
  draw();
}
function reasonNG(){
  firstTry=false;mistakes++;miss.add(cur.rev);
  gauge=Math.max(1,gauge-1);drawGauge();
  $('talkText').innerHTML='<span class="ng">うーん、記事にするには 少し ちがうかも。</span><br>もう一度 えらんでみよう。';
}
function reasonOK(){
  const r=cur.reason;
  $('talkText').innerHTML='<span class="ok">◎ ばっちり！</span><br><span style="font-size:15px">'+r.explain+'</span>';
  $('talkNext').classList.add('hidden');
  $('area').innerHTML='<button class="big" id="rNext">つぎへ</button>';
  $('rNext').onclick=()=>{$('area').innerHTML='';say(cur.after,()=>{step++;run();});};
  if(!cur.after.length){$('rNext').onclick=()=>{step++;run();};}
}

/* ---------- エンディング ---------- */
function ending(){
  $('btnQuit').classList.add('hidden');  // 画面の中に 大きな「タイトルへ」が あるので、下の 小さい ほうは かくす
  const stars=mistakes<=1?3:mistakes<=4?2:1;
  const badges=['🗞 新人記者'];if(flags.observer)badges.push('🔎 観察の達人');if(firstTry)badges.push('⚡ 一発突破');
  const sv=loadSave();sv.clear=1;sv.best=Math.max(sv.best||0,stars);sv.badges=Array.from(new Set([...(sv.badges||[]),...badges]));
  sv.miss=Array.from(new Set([...(sv.miss||[]),...miss]));putSave(sv);
  track('level_end',{level_name:'nazotoki-shinbun-ep'+epNo+'-lv'+lv,score:stars,success:true});
  setStage('tsubasa','第'+EP.no+'話 クリア');$('talkName').textContent='第'+EP.no+'話　解決！';$('talkName').style.background='#d6453d';
  $('talkText').innerHTML=EP.clear;$('talkNext').classList.add('hidden');
  $('area').innerHTML='<div class="stars">'+'★'.repeat(stars)+'☆'.repeat(3-stars)+'</div>'
   +'<div class="res">まちがえた回数：'+mistakes+'回<br>'+badges.map(b=>'<span class="badge">'+b+'</span>').join('')+'</div>'
   +'<div class="box"><b>きょう 使った ことばの きまり</b><br>'+EP.rules+'</div>'
   +(miss.size?'<button class="big" id="goRev">📁 見のがしファイルで ふくしゅう（'+miss.size+'）</button>':'')
   +(EPS[epNo+1]?'<button class="big" id="goNext" style="background:#d6453d;color:#fff;border-color:#a32b25;box-shadow:0 4px 0 #a32b25">つぎの話へ　第'+(epNo+1)+'話<small style="color:#fff">'+EPS[epNo+1].name+(locked(epNo+1)?'（おためし）':'')+'</small></button>':'')
   +'<button class="big" id="goTitle">タイトルへ</button>';
  if($('goRev'))$('goRev').onclick=()=>openReview();
  $('goTitle').onclick=()=>{started=false;titleInit();};
  if($('goNext'))$('goNext').onclick=()=>{setEp(epNo+1);started=false;titleInit();};
}

/* ---------- 見のがしファイル ---------- */
function openReview(){
  const sv=loadSave();const ids=(sv.miss||[]).filter(k=>REV[k]);show('review');
  if(!ids.length){$('revBody').innerHTML='<div class="box">見のがしは ありません。すばらしい！</div>';return;}
  let i=0;
  const q=()=>{const r=REV[ids[i]];
    $('revBody').innerHTML='<div class="box"><span class="badge">'+r.tag+'</span>　'+(i+1)+' / '+ids.length+'<br>'+r.q+'</div>'+shuf(r.opts.length).map(j=>'<button class="choice" data-j="'+j+'">'+r.opts[j]+'</button>').join('')+'<div id="revMsg"></div>';
    $('revBody').querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
      if(+b.dataset.j===r.ci){const s=loadSave();s.miss=(s.miss||[]).filter(x=>x!==ids[i]);putSave(s);
        $('revMsg').innerHTML='<div class="box"><span class="ok">◎ 正解！ ファイルから 消えたよ。</span><br>'+r.ex+'</div><button class="big" id="revNext">'+(i+1<ids.length?'つぎへ':'おわり')+'</button>';
        $('revNext').onclick=()=>{i++;if(i<ids.length)q();else{$('revBody').innerHTML='<div class="box">ふくしゅう おわり！</div>';}};
      }else{$('revMsg').innerHTML='<div class="box"><span class="ng">ちがうよ。</span>もう一度 考えてみよう。</div>';}
    });};
  q();
}
$('btnReview').onclick=openReview;
$('btnRevBack').onclick=()=>titleInit();

/* ---------- タイトル ---------- */
function titleInit(){
  show('title');const sv=loadSave();
  $('epList').innerHTML=Object.keys(EPS).map(n=>{const s=loadSave(+n),e=EPS[n];const tag=PAID?'':e.GAME?' <span class="badge" style="background:#8a5a00;font-size:12px">有料</span>':' <span class="badge" style="background:#1f7a3c;font-size:12px">無料</span>';return '<button class="big epbtn'+(+n===epNo?' on':'')+'" data-ep="'+n+'">第'+n+'話　'+e.name+tag+'<small>'+(s.clear?'クリアずみ　'+'★'.repeat(s.best||1):locked(+n)?'無料は 調査まで（おためし）':'まだ あそんでいない')+'</small></button>';}).join('');
  $('epList').querySelectorAll('.epbtn').forEach(b=>b.onclick=()=>{setEp(+b.dataset.ep);titleInit();});
  $('epIntro').textContent=EP.intro;$('epTags').textContent=EP.tags;
  document.querySelectorAll('.lvbtn').forEach(b=>b.classList.toggle('on',+b.dataset.lv===lv));
  const n=(sv.miss||[]).filter(k=>REV[k]).length;
  $('btnReview').classList.toggle('hidden',!n);$('reviewN').textContent=n?n+'問 のこっている':'';
  $('btnStart').textContent='第'+epNo+'話の 取材を はじめる'+(locked(epNo)?'（おためし）':'');
  $('freeNote').classList.toggle('hidden',!locked(epNo));
  $('bestLine').textContent=sv.clear?'クリアずみ　最高 '+'★'.repeat(sv.best||1)+'　称号：'+(sv.badges||[]).join('・'):'';
}
document.querySelectorAll('.lvbtn').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;titleInit();});
$('btnStart').onclick=newGame;
$('btnQuit').onclick=()=>{started=false;titleInit();};

/* ---------- テスト用 ---------- */
$('btnTest').onclick=()=>$('testPanel').classList.toggle('hidden');
$('testPanel').onclick=e=>{const t=e.target.dataset.t;if(!t)return;
  const go=id=>{for(const k in ev)ev[k].have=1;$('modal').classList.add('hidden');const i=FLOW.findIndex(s=>s.id===id||s.t===id);if(i<0)return;step=i;run();};
  if(t==='ans'){if(cur&&T[cur.id]){$('talkText').innerHTML='🛠 こたえ：文'+[].concat(cur.ans.s).map(i=>'①②③④'[i]).join('か')+' × 証拠'+cur.ans.ev.join('・');}return;}
  if(t==='miss'){const s=loadSave();s.miss=Object.keys(REV);putSave(s);$('talkText').innerHTML='🛠 見のがしファイルに 全部 入れた';return;}
  if(t==='reset'){putSave({});$('talkText').innerHTML='🛠 記録を消した';return;}
  if(t==='end'){step=FLOW.length-1;run();return;}
  go(t);
};

/* ---- 有料版：利用コードを 確かめて、第2話・第3話の パックを 受け取ってから 始める ---- */
const PACK_EPS=Object.keys(EPS).filter(n=>EPS[n].GAME).map(Number);
async function loadPacks(){const ps=await Promise.all(PACK_EPS.map(n=>mnAccess.load(EPS[n].GAME)));PACK_EPS.forEach((n,i)=>applyPack(n,ps[i]));setEp(epNo);}
function lockScreen(err){
  show('lock');
  if(!window.mnAccess){$('lockBox').textContent='有料版は、サイトの 上で ひらいて ください。';return;}
  mnAccess.lock($('lockBox'),{game:'nazotoki-shinbun',err:err,free:'nazotoki-shinbun.html',onOpen:async()=>{await loadPacks();titleInit();}});
}
if(PAID){
  show('lock');$('lockBox').textContent='よみこみ中…';
  (window.mnAccess?loadPacks():Promise.reject({error:'net'})).then(()=>titleInit()).catch(lockScreen);
}else{titleInit();}
</script>
