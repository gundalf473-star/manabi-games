<script>
// ことばスライド 共通ルール（画面に関係しない部分）
var Core = (function () {
  var N = 4;

  // 「表記|よみ」を空白区切りで読む
  function parsePhrase(p) {
    var toks = [], yomi = [];
    p.t.split(' ').forEach(function (w) {
      var a = w.split('|');
      toks.push(a[0]);
      yomi.push(a[1] || a[0]);
    });
    return { toks: toks, yomi: yomi, m: p.m, g: p.g || '', text: toks.join(''), kana: yomi.join('') };
  }

  // a と b（文節のならび）が「となりどうし」としてつながるか
  function findJoin(a, b, phrases) {
    var orders = [a.concat(b), b.concat(a)], first = null;
    for (var o = 0; o < 2; o++) {
      var seq = orders[o];
      for (var pi = 0; pi < phrases.length; pi++) {
        var pt = phrases[pi].toks;
        if (seq.length > pt.length) continue;
        for (var s = 0; s + seq.length <= pt.length; s++) {
          var ok = true;
          for (var k = 0; k < seq.length; k++) if (pt[s + k] !== seq[k]) { ok = false; break; }
          if (!ok) continue;
          var cand = { seq: seq, pi: pi, complete: seq.length === pt.length };
          if (cand.complete) return cand;
          if (!first) first = cand;
        }
      }
    }
    return first;
  }

  function newState(stage, rnd) {
    var phrases = stage.list.map(parsePhrase);
    var order = phrases.map(function (_, i) { return i; });
    for (var i = order.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1)), t = order[i]; order[i] = order[j]; order[j] = t;
    }
    var S = { phrases: phrases, cap: stage.cap || 3, tiles: [], done: [], active: [], queue: order,
      moves: 0, nextId: 1, rnd: rnd };
    refill(S);
    return S;
  }

  function refill(S) {
    while (S.active.length < S.cap && S.queue.length) S.active.push(S.queue.shift());
  }

  function missing(S) {
    var need = {}, out = [];
    S.active.forEach(function (pi) {
      S.phrases[pi].toks.forEach(function (t) { need[t] = (need[t] || 0) + 1; });
    });
    S.tiles.forEach(function (tl) {
      tl.toks.forEach(function (t) { if (need[t]) need[t]--; });
    });
    Object.keys(need).forEach(function (t) { for (var i = 0; i < need[t]; i++) out.push(t); });
    return out;
  }

  function emptyCells(S, avoid) {
    var used = {}, out = [];
    S.tiles.forEach(function (t) { used[t.r * N + t.c] = 1; });
    (avoid || []).forEach(function (k) { used[k] = 1; });
    for (var k = 0; k < N * N; k++) if (!used[k]) out.push(k);
    return out;
  }

  function spawn(S, avoid) {
    var miss = missing(S);
    if (!miss.length) return null;
    var cells = emptyCells(S, avoid);
    if (!cells.length) cells = emptyCells(S);
    if (!cells.length) return null;
    var k = cells[Math.floor(S.rnd() * cells.length)];
    var tile = { id: S.nextId++, toks: [miss[Math.floor(S.rnd() * miss.length)]], r: Math.floor(k / N), c: k % N };
    S.tiles.push(tile);
    return tile;
  }

  function complete(S, pi) {
    if (S.done.indexOf(pi) < 0) S.done.push(pi);
    var i = S.active.indexOf(pi); if (i >= 0) S.active.splice(i, 1);
    i = S.queue.indexOf(pi); if (i >= 0) S.queue.splice(i, 1);
    refill(S);
  }

  // dir: 0=上 1=右 2=下 3=左
  function move(S, dir) {
    var grid = [], r, c, i;
    for (i = 0; i < N * N; i++) grid.push(null);
    S.tiles.forEach(function (t) { grid[t.r * N + t.c] = t; });
    var res = { changed: false, merges: [] }, keep = [];
    for (var line = 0; line < N; line++) {
      var cells = [];
      for (i = 0; i < N; i++) {
        if (dir === 0) { r = i; c = line; }
        else if (dir === 2) { r = N - 1 - i; c = line; }
        else if (dir === 3) { r = line; c = i; }
        else { r = line; c = N - 1 - i; }
        cells.push([r, c]);
      }
      var out = [];
      cells.forEach(function (rc) {
        var t = grid[rc[0] * N + rc[1]];
        if (!t) return;
        var last = out[out.length - 1];
        var j = last && !last.merged ? findJoin(last.tile.toks, t.toks, S.phrases) : null;
        if (j) {
          var nt = { id: S.nextId++, toks: j.seq, r: 0, c: 0 };
          out[out.length - 1] = { tile: nt, merged: true, from: [last.tile.id, t.id], join: j };
        } else out.push({ tile: t, merged: false });
      });
      out.forEach(function (o, idx) {
        var rc = cells[idx];
        if (o.merged) {
          res.changed = true;
          o.tile.r = rc[0]; o.tile.c = rc[1];
          res.merges.push({ from: o.from, tile: o.tile, r: rc[0], c: rc[1], complete: o.join.complete, pi: o.join.pi });
          if (!o.join.complete) keep.push(o.tile);
        } else {
          if (o.tile.r !== rc[0] || o.tile.c !== rc[1]) res.changed = true;
          o.tile.r = rc[0]; o.tile.c = rc[1];
          keep.push(o.tile);
        }
      });
    }
    if (res.changed) {
      S.tiles = keep;
      S.moves++;
      res.merges.forEach(function (m) { if (m.complete) complete(S, m.pi); });
    }
    return res;
  }

  function shuffle(S) {
    var cells = [];

    idle = (res.merges.length || sp) ? 0 : idle + 1;
    hud();
    if (Core.isClear(S)) { over = true; finish(); clearTimer = setTimeout(startReview, 2200); }
  }
  // クリアした その場で 記録する（★は まず1つ。おさらいの 正解数で ふえる）
  function putStar(n) {
    var k = cur.gi + '-' + cur.si;
    if ((save.stars[k] || 0) < n) { save.stars[k] = n; store(); }
  }
  function finish() {
    var k = cur.gi + '-' + cur.si;
    if (!save.best || typeof save.best !== 'object') save.best = {};
    if (S.moves > 0 && (!(save.best[k] > 0) || S.moves < save.best[k])) save.best[k] = S.moves;
    store(); putStar(1);
    result = { n: 1, moves: S.moves, ok: 0 };
  }
  // ---- おさらい（3問）----
  var rv = null;
  function startReview() {
    if (!S || !over || !result) return;
    hideToast();
    var order = Core.shuf(S.phrases.map(function (_, i) { return i; }), Math.random).slice(0, 3);
    rv = { n: 0, ok: 0, order: order, done: false, q: null };
    $('review').classList.remove('hide'); nextQ();
  }
  function nextQ() {
    var q = rv.q = Core.makeQuiz(S.phrases, rv.order[rv.n], Math.random() < 0.5 ? 'A' : 'B', Math.random, cur.st.hard ? 4 : 3);
    rv.done = false;
    $('rvNo').textContent = 'おさらい ' + (rv.n + 1) + ' / ' + rv.order.length + ' 問め';
    if (q.type === 'A') {
      $('rvLead').innerHTML = esc('いみ：' + S.phrases[q.pi].m) + '<small>？に 入る ことばは どれ？</small>';
      $('rvEx').innerHTML = q.toks.map(function (t, i) { return i === q.pos ? '<span class="bl">？</span>' : tokHtml(t, true); }).join('');
    } else {
      $('rvLead').textContent = 'この ことばの いみは どれ？';
      $('rvEx').innerHTML = phraseHtml(q.toks);
    }
    $('cho').className = 'cho' + (q.type === 'B' ? ' m' : '');
    $('cho').innerHTML = q.choices.map(function (c, i) {
      return '<button data-i="' + i + '">' + (q.type === 'A' ? tokHtml(c.label, true) : esc(c.label)) + '</button>';
    }).join('');
    $('rvWhy').classList.add('hide'); $('rvNext').classList.add('hide');
    $('review').scrollTop = 0;
  }
  $('cho').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || !rv || rv.done) return;
    rv.done = true;
    var q = rv.q, hit = q.choices[+b.dataset.i].ok, P = S.phrases[q.pi];
    if (hit) { rv.ok++; sfx.merge(); } else sfx.mix();
    Array.prototype.forEach.call($('cho').children, function (x, i) {
      if (q.choices[i].ok) x.classList.add('ok'); else if (x === b) x.classList.add('ng');
    });
    $('rvWhy').innerHTML = '<div class="res">' + (hit ? '⭕ せいかい！' : '❌ おしい！') + '</div><b>' + phraseHtml(P.toks) + '</b><div>' + esc(P.m) + '</div>';
    $('rvWhy').classList.remove('hide');
    if (rv.n + 1 >= rv.order.length) {
      result.ok = rv.ok; result.n = rv.ok >= 3 ? 3 : rv.ok === 2 ? 2 : 1; putStar(result.n);
      track('level_end', { level_name: GAME.id + '-' + cur.gi + '-' + cur.si, score: rv.ok, success: true });
    }
    $('rvNext').textContent = rv.n + 1 < rv.order.length ? 'つぎへ ▶' : 'けっかを 見る ▶';
    $('rvNext').classList.remove('hide');
  });
  $('rvNext').onclick = function () {
    if (!rv || !rv.done) return;
    rv.n++;
    if (rv.n < rv.order.length) { nextQ(); return; }
    result.ok = rv.ok; result.n = rv.ok >= 3 ? 3 : rv.ok === 2 ? 2 : 1; putStar(result.n);
    $('review').classList.add('hide'); showClear();
  };
  function showClear() {
    if (!S || !over || !result) return;
    var n = result.n, k = cur.gi + '-' + cur.si;
    hideToast();
    $('clStars').innerHTML = starsHtml(n);
    $('clMoves').innerHTML = result.moves + '手で クリア<br>おさらい ' + result.ok + ' / 3 問 せいかい → ★' + n + 'つ<br><small>これまでの さいこう：★' + (save.stars[k] || n) + 'つ ／ ' + (save.best[k] ? 'いちばん 少ない 手数：' + save.best[k] + '手' : '') + '</small>';
    $('rev').innerHTML = S.phrases.map(function (p) {
      return '<li><b>' + phraseHtml(p.toks) + '</b><span>' + esc(p.m) + '</span></li>';
    }).join('');
    var nx = nextOf(), nf = nextReady();
    $('btnNext').classList.toggle('hide', !nf);
    $('btnNext').textContent = nf && nx && !ready(nx.st) ? 'つぎの 無料ステージへ' : 'つぎの ステージへ';
    $('clPaid').classList.toggle('hide', !nx || ready(nx.st) || PAID);
    $('clPaid').href = GAME.id + '-full.html';
    $('clear').classList.remove('hide'); $('clear').scrollTop = 0;
    sfx.clear();
  }
  function nextReady() {   // つぎに あそべる ステージ（無料版では 有料を とばす）
    var on = false;
    for (var i = 0; i < FLAT.length; i++) {
      if (on && ready(FLAT[i].st)) return FLAT[i];
      if (FLAT[i].gi === cur.gi && FLAT[i].si === cur.si) on = true;
    }
    return null;
  }
  function nextOf() {
    for (var i = 0; i < FLAT.length; i++) if (FLAT[i].gi === cur.gi && FLAT[i].si === cur.si) return FLAT[i + 1] || null;
    return null;
  }
  function goHome() {
    clearTimeout(clearTimer); result = null; hideToast();
    $('play').classList.add('hide'); $('clear').classList.add('hide'); $('review').classList.add('hide'); $('lock').classList.add('hide'); $('home').classList.remove('hide');
    S = null; renderHome(); window.scrollTo(0, 0);
  }

  // そうさ
  var p0 = null;
  board.addEventListener('pointerdown', function (e) { p0 = { x: e.clientX, y: e.clientY }; try { board.setPointerCapture(e.pointerId); } catch (x) {} });
  board.addEventListener('pointerup', function (e) {
    if (!p0) return;
    var dx = e.clientX - p0.x, dy = e.clientY - p0.y; p0 = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
    doMove(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
  });
  board.addEventListener('pointercancel', function () { p0 = null; });
  document.addEventListener('keydown', function (e) {
    if ($('play').classList.contains('hide') || !$('clear').classList.contains('hide') || !$('review').classList.contains('hide')) return;
    var m = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3, w: 0, d: 1, s: 2, a: 3 }[e.key];
    if (m === undefined) return;
    e.preventDefault(); doMove(m);
  });
  window.addEventListener('resize', function () {
    if (!S) return;
    board.querySelectorAll('.tile').forEach(function (el) { if (el._toks) fit(el, el._toks); });
  });

  $('btnBack').onclick = goHome;
  $('btnHome').onclick = goHome;
  $('btnRetry').onclick = function () { start(cur.gi, cur.si); };
  $('btnAgain').onclick = function () { start(cur.gi, cur.si); };
  $('btnNext').onclick = function () { var n = nextReady(); if (n) start(n.gi, n.si); };
  $('btnMix').onclick = function () {
    if (over || lock || !S.tiles.length) return;
    Core.shuffle(S); S.moves += 2; idle = 0; sfx.mix();
    S.tiles.forEach(function (t) { if (els[t.id]) place(els[t.id], t.r, t.c); });
    hud();
  };
  $('btnRuby').onclick = function () { save.ruby = !rubyOn(); store(); redrawAll(); hud(); };
  $('btnSnd').onclick = function () { save.snd = save.snd === false; store(); hud(); if (save.snd !== false) sfx.merge(); };
  $('btnTest').onclick = function () {   // テストサイトだけ：のこりを すべて かんせいに する
    if (over) return;
    S.phrases.forEach(function (_, i) { if (S.done.indexOf(i) < 0) S.done.push(i); });
    S.active = []; S.queue = []; over = true; hud(); finish(); startReview();
  };

  // ---- 有料版：利用コードを 確かめて、パックを 受け取ってから 始める ----
  function lockScreen(err) {
    $('home').classList.add('hide'); $('lock').classList.remove('hide');
    $('lockH1').textContent = GAME.kanji;
    if (!window.mnAccess) { $('lockBox').textContent = '有料版は、サイトの 上で ひらいて ください。'; return; }
    mnAccess.lock($('lockBox'), { game: GAME.id, err: err, free: GAME.id + '.html', onOpen: function () {
      return mnAccess.load(GAME.id).then(function (p) { applyPack(p); goHome(); });
    } });
  }
  if (PAID) {
    $('home').classList.add('hide'); $('lock').classList.remove('hide');
    $('lockH1').textContent = GAME.kanji; $('lockBox').textContent = 'よみこみ中…';
    (window.mnAccess ? mnAccess.load(GAME.id) : Promise.reject({ error: 'net' }))
      .then(function (p) { applyPack(p); goHome(); }).catch(lockScreen);
  } else renderHome();
})();
</script>
</body>
</html>
