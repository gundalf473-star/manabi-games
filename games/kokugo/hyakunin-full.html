<title>百人一首クイズ 100首</title>
<meta name="game:paid" content="利用コード">
<meta name="game:subject" content="国語">
<meta name="game:unit" content="百人一首">
<meta name="game:grade" content="小4〜">
<meta name="game:players" content="1人">
<meta name="description" content="百人一首クイズの有料版。100首すべて、20首ずつのコースと苦手復習、下の句→上の句の練習つき。">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Old+Mincho:wght@700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: 1列。上の句（読み札）→ 縦書きの取り札4まい → 歌の全文・作者・意味 */
:root{
  --bg:#f5f6f3; --surface:#ffffff; --fg:#23262b; --muted:#646a70; --rule:#dadcd6;
  --grid:#c4553a; --gridsoft:#f6e4de; --ok:#2f7a52; --oksoft:#e2f0e7; --ng:#c8352d; --ngsoft:#f8e3e1; --pick:#eceee8; --gold:#b88a1e;
  --card:#fbf7ec; --cardedge:#c9b98f;
  --display:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --kanji:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141615; --surface:#1d201f; --fg:#e8eae6; --muted:#9ea4a0; --rule:#323634;
  --grid:#e47a5f; --gridsoft:#3a2520; --ok:#5cc28c; --oksoft:#1d3328; --ng:#f07468; --ngsoft:#3a2220; --pick:#262a28; --gold:#d9ab45;
  --card:#26231b; --cardedge:#6b5f42; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141615; --surface:#1d201f; --fg:#e8eae6; --muted:#9ea4a0; --rule:#323634;
  --grid:#e47a5f; --gridsoft:#3a2520; --ok:#5cc28c; --oksoft:#1d3328; --ng:#f07468; --ngsoft:#3a2220; --pick:#262a28; --gold:#d9ab45;
  --card:#26231b; --cardedge:#6b5f42; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 64px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-size:clamp(28px,7.5vw,38px);line-height:1.2;margin:0;letter-spacing:.06em}
.lead{margin:4px 0 0;color:var(--muted);font-size:14px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--grid);outline-offset:2px}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:16px}
.label{font-size:12px;font-weight:700;color:var(--grid);letter-spacing:.1em}
.top{display:flex;align-items:center;gap:10px}
.prog{flex:1;height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--grid)}
.nums{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.yomi{background:var(--card);border:2px solid var(--cardedge);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.yomi .au{font-size:13px;color:var(--muted);font-weight:700}
.yomi .tx{font-family:var(--kanji);font-weight:600;font-size:clamp(20px,5.6vw,26px);line-height:1.6}
.yomi .tx span{display:inline-block;margin-right:.6em}
.yomi .tx .blank{color:var(--muted);letter-spacing:.2em}
.q{margin:0;font-size:15px;font-weight:700}
.fuda{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.fuda.sk .fd{font-size:clamp(13px,3.7vw,17px)}
.fuda.sk .fd .v{gap:.2em}
.fd{background:var(--card);border:2px solid var(--cardedge);border-radius:8px;cursor:pointer;padding:10px 4px;display:flex;justify-content:center;min-height:190px;overflow:hidden;font-family:var(--kanji);font-weight:600;font-size:clamp(15px,4.4vw,19px);line-height:1.5;color:var(--fg)}
.fd .v{writing-mode:vertical-rl;text-orientation:upright;display:flex;flex-direction:column;gap:.3em;letter-spacing:.04em;line-height:1.25}
.fd:hover:not(:disabled){border-color:var(--grid)}
.fd:disabled{cursor:default;opacity:.4}
.fd.right{opacity:1;border-color:var(--ok);background:var(--oksoft);color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.fd.wrong{opacity:1;border-color:var(--ng);background:var(--ngsoft);color:var(--ng)}
.verdict{font-family:var(--display);font-size:24px;line-height:1.3}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.uta{font-family:var(--kanji);font-weight:600;font-size:clamp(17px,4.8vw,21px);line-height:1.7;margin:0}
.uta .lo{color:var(--ok)}
.meta{font-size:13px;color:var(--muted);font-weight:700}
.tip{border-left:4px solid var(--grid);padding:4px 0 4px 12px;font-size:15px}
.mine{background:var(--bg);border-radius:8px;padding:8px 12px;font-size:14px}
.mine b{font-family:var(--kanji)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:8px;padding:10px 20px;font-weight:700;cursor:pointer;background:var(--pick)}
.btn.go{background:var(--fg);color:var(--surface)}
.note{font-size:13px;color:var(--muted);margin:0}
.howto{margin:0;padding-left:1.3em;font-size:15px;display:grid;gap:4px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:99px;padding:3px;background:var(--surface)}
.seg button{border:0;background:none;border-radius:99px;padding:6px 14px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--surface)}
.courses{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.courses{grid-template-columns:1fr}}
.course{border:2px solid var(--rule);background:var(--surface);border-radius:8px;padding:12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.course:hover:not(:disabled){border-color:var(--grid)}
.course:disabled{opacity:.4;cursor:default}
.course .nm{font-family:var(--display);font-size:19px}
.course .ds{font-size:13px;color:var(--muted);line-height:1.5}
.course .best{font-size:12px;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.big{font-family:var(--display);font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:22px}
.seal{width:92px;height:92px;border-radius:50%;border:5px solid var(--grid);color:var(--grid);display:grid;place-items:center;font-family:var(--display);font-size:22px;transform:rotate(-10deg)}
.rv{border:1px solid var(--rule);border-radius:8px;padding:10px 14px;font-size:14px}
.rv b{font-family:var(--kanji);font-size:16px}
.paid{display:flex;flex-direction:column;gap:2px;border:2px solid var(--grid);border-radius:8px;padding:12px 14px;text-decoration:none;color:var(--fg);background:var(--gridsoft)}
.paid .pt{font-size:15px} .paid .pt b{font-family:var(--display);color:var(--grid)}
.paid .pd{font-size:13px;color:var(--muted)}
.lock input{font:inherit;font-size:20px;padding:10px 12px;border:2px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--fg);width:100%;box-sizing:border-box}
.err{color:var(--ng);font-size:14px;margin:0;min-height:1.5em}
.shop{background:var(--bg);border-radius:8px;padding:12px 14px;font-size:14px}
.shop a{color:var(--grid);font-weight:700}
.master{display:flex;flex-direction:column;gap:6px}
.master .tp{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.master .cnt{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.master .cnt small{font-size:14px;color:var(--muted);font-family:var(--body)}
.mbar{height:10px;background:var(--rule);border-radius:5px;overflow:hidden;display:flex}
.mbar i{display:block;height:100%}
.mbar .m{background:var(--ok)} .mbar .w2{background:var(--gold)}
.mleg{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.mleg span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle;background:var(--c)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
</style>

<div class="wrap">
  <header>
    <h1>百人一首クイズ 100首</h1>
    <p class="lead">上の句と下の句をつなごう。100首、コースをえらんで1回10首。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script type="application/json" id="data">{}</script>
<script>
(function(){
/* 歌のデータ: n=歌番号, au=作者, k=上の句（5・7・5、空白で区切る）, s=下の句（7・7）, m=意味, x=1 は無料版で「まぎらわしい札」にだけ使う歌 */
const PAID=true;
let QS=[];
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const norm=s=>s.normalize('NFKC').toLowerCase().replace(/[\s\-ー－]/g,'');
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let G=null, shopUrl='', course=null, dir=store.get('hyakunin-dir','ks');   // ks=上の句→下の句, sk=下の句→上の句
let best=store.get(PAID?'hyakunin-p-best':'hyakunin-best',{}), rec=store.get('hyakunin-p-rec',{});
const saveRec=()=>store.set('hyakunin-p-rec',rec);
const qkey=q=>`${q.n}番 ${q.k} ${q.s}`;   // 保護者ページの「まちがえた問題」と同じ書き方にそろえる
const state=q=>{const r=rec[qkey(q)];if(!r)return 'new';if(r[0]>=2&&r[0]>r[1])return 'master';if(r[1]>0)return 'weak';return 'try';};
const record=(q,ok)=>{if(!PAID)return false;const before=state(q);const r=rec[qkey(q)]||[0,0];r[ok?0:1]++;rec[qkey(q)]=r;saveRec();return state(q)==='master'&&before!=='master';};
const POEMS=()=>QS.filter(q=>!q.x);
const RANGES=[[1,20],[21,40],[41,60],[61,80],[81,100]];
const PAIDLINK=`<a class="paid" href="hyakunin-full.html" id="paid-link"><span class="pt">100首ぜんぶ練習したい人へ　<b>百人一首 100首</b>（有料版）</span><span class="pd">無料版の5首もふくむ全100首。20首ずつのコース、苦手だけの復習、下の句→上の句の練習つき。</span></a>`;

// まぎらわしい札をえらぶ：同じ言葉や字が多い歌ほど、えらばれやすくする
const PLAIN='のにはをてもがとやかなりけるしつぬれば　 ';
function sim(a,b){
  let s=0; const A=new Set([...a].filter(c=>!PLAIN.includes(c)));
  [...new Set(b)].forEach(c=>{if(A.has(c))s+=/[一-鿿]/.test(c)?2:1;});
  if(a[0]===b[0])s+=3;
  if(a.slice(-3)===b.slice(-3))s+=3;
  return s+Math.random()*2;
}
function choicesFor(q){
  const key=dir==='ks'?'s':'k';
  const others=QS.filter(p=>p.n!==q.n).map(p=>[p,sim(q[key],p[key])]).sort((a,b)=>b[1]-a[1]).slice(0,7).map(x=>x[0]);
  return shuffle([q,...shuffle(others).slice(0,3)]);
}

async function decrypt(){ return mnAccess.load('hyakunin'); }
function lockScreen(err){ mnAccess.lock(app,{game:'hyakunin',err:err,free:'hyakunin.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }
const DIRSEG=()=>`<div class="row"><span class="note" style="font-weight:700;color:var(--fg)">問題の形</span><div class="seg" role="group" aria-label="問題の形">
  <button data-d="ks" aria-pressed="${dir==='ks'}">上の句 → 下の句</button><button data-d="sk" aria-pressed="${dir==='sk'}">下の句 → 上の句</button></div></div>`;
function bindSeg(){app.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{dir=b.dataset.d;store.set('hyakunin-dir',dir);home();});}
function home(){
  G=null;
  if(PAID)return homePaid();
  const P=POEMS();
  app.innerHTML=`<div class="label">あそびかた</div>
    <ol class="howto"><li>上の句（5・7・5）を読みます。</li><li>つづく下の句（7・7）を、4まいの取り札からえらびます。</li><li>答えたあとに、歌の意味を確かめよう。</li></ol>
    ${DIRSEG()}
    <div class="row"><button class="btn go" id="go">はじめる（${P.length}首）</button></div>
    <p class="note">出てくる歌：${P.map(p=>`${p.n}番 ${esc(p.au)}`).join('、')}</p>${PAIDLINK}`;
  bindSeg();
  document.getElementById('go').onclick=()=>{course='free';start(shuffle(P));};
}
function homePaid(){
  const cnt={master:0,weak:0,new:0,try:0}; QS.forEach(q=>cnt[state(q)]++);
  const weak=QS.filter(q=>state(q)==='weak'), fresh=QS.filter(q=>state(q)==='new');
  app.innerHTML=`<div class="master"><div class="tp"><span class="label" style="font-size:14px;color:var(--fg)">覚えた歌</span><span class="cnt">${cnt.master}<small> / 100首</small></span></div>
      <div class="mbar" aria-hidden="true"><i class="m" style="width:${cnt.master}%"></i><i class="w2" style="width:${cnt.weak}%"></i></div>
      <div class="mleg"><span style="--c:var(--ok)">覚えた ${cnt.master}</span><span style="--c:var(--gold)">にがて ${cnt.weak}</span><span style="--c:var(--rule)">まだ ${cnt.new}</span></div></div>
    ${DIRSEG()}
    <div class="label">コースをえらぶ（1回10首）</div>
    <div class="courses">${RANGES.map(([a,b],i)=>{const m=QS.filter(q=>q.n>=a&&q.n<=b&&state(q)==='master').length;return `<button class="course" data-l="r${i}"><span class="nm">${a}〜${b}番</span><span class="ds">覚えた ${m} / 20首</span><span class="best">${best['r'+i]!=null?`ベスト ${best['r'+i]}/10`:''}</span></button>`;}).join('')}
      <button class="course" data-l="all"><span class="nm">100首からランダム</span><span class="ds">どこから出るかわからない10首。</span><span class="best">${best.all!=null?`ベスト ${best.all}/10`:''}</span></button>
      <button class="course" data-l="weak" ${weak.length?'':'disabled'}><span class="nm">にがて</span><span class="ds">まちがえたことのある歌だけ（${weak.length}首）</span></button>
      <button class="course" data-l="fresh" ${fresh.length?'':'disabled'}><span class="nm">まだやっていない</span><span class="ds">一度も出ていない歌だけ（${fresh.length}首）</span></button></div>
    <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
  bindSeg();
  app.querySelectorAll('.course').forEach(b=>b.onclick=()=>{
    const l=b.dataset.l; course=l;
    let pool=l==='weak'?weak:l==='fresh'?fresh:l==='all'?QS:(()=>{const [a,z]=RANGES[+l.slice(1)];return QS.filter(q=>q.n>=a&&q.n<=z);})();
    start(shuffle(pool).slice(0,10));
  });
  document.getElementById('reset').onclick=()=>{
    document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
    document.getElementById('yes').onclick=()=>{rec={};saveRec();homePaid();};
    document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
  };
}
function start(list){
  G={list,i:0,score:0,miss:[],n:list.length};
  track('level_start',{level_name:(PAID?'hyakunin-p-':'hyakunin-')+course+'-'+dir});
  newQ();
}
function newQ(){ const q=G.list[G.i]; G.ch=choicesFor(q); G.done=false; G.pick=null; render(); }
const cols=t=>t.split(' ').map(x=>`<span>${esc(x)}</span>`).join('');
function render(){
  const q=G.list[G.i], d=G.done, ks=dir==='ks';
  const shown=ks?q.k:q.s;
  app.innerHTML=`<div class="top"><div class="prog" aria-hidden="true"><i style="width:${G.i/G.n*100}%"></i></div><span class="nums">${G.i+1} / ${G.n}</span></div>
    <div class="yomi"><span class="au">${q.n}番　${esc(q.au)}</span>
      <div class="tx">${ks?cols(shown)+'<span class="blank">……</span>':'<span class="blank">……</span>'+cols(shown)}</div></div>
    <p class="q">${ks?'つづく下の句はどれですか。':'この下の句の、上の句はどれですか。'}</p>
    <div class="fuda ${ks?'':'sk'}" role="group" aria-label="取り札">${G.ch.map(p=>`<button class="fd ${d?(p.n===q.n?'right':p.n===G.pick?'wrong':''):''}" data-n="${p.n}" ${d?'disabled':''} aria-label="${esc(ks?p.s:p.k)}"><span class="v">${cols(ks?p.s:p.k)}</span></button>`).join('')}</div>
    <div id="after"></div>`;
  app.querySelectorAll('.fd').forEach(b=>b.onclick=()=>pick(+b.dataset.n));
  if(d)explain();
}
function pick(n){
  if(G.done)return;
  const q=G.list[G.i];
  G.done=true; G.pick=n; G.ok=n===q.n; G.newM=record(q,G.ok);
  if(G.ok)G.score++; else G.miss.push(q);
  track('answer_question',{category:'hyakunin-'+dir,question:`${q.n}番 ${q.k} ${q.s}`,correct:G.ok,picked:n});
  render();
}
function explain(){
  const q=G.list[G.i], last=G.i===G.n-1, me=QS.find(p=>p.n===G.pick), ks=dir==='ks';
  document.getElementById('after').innerHTML=`<div class="box" style="padding:14px;gap:10px;border-color:${G.ok?'var(--ok)':'var(--ng)'}">
    <div class="verdict ${G.ok?'ok':'ng'}">${G.ok?'正解！':'ざんねん'}${G.newM?'<span style="font-size:13px;margin-left:8px;color:var(--ok);font-family:var(--body);font-weight:700">覚えた！</span>':''}</div>
    <p class="uta">${ks?esc(q.k)+'<br><span class="lo">'+esc(q.s)+'</span>':'<span class="lo">'+esc(q.k)+'</span><br>'+esc(q.s)}</p>
    <span class="meta">${q.n}番　${esc(q.au)}</span>
    <div class="tip">${esc(q.m)}</div>
    ${G.ok||!me?'':`<div class="mine">あなたがえらんだ札は、${me.n}番（${esc(me.au)}）の${ks?'下の句':'上の句'}です。<br><b>${esc(me.k)}　${esc(me.s)}</b></div>`}
    <div class="row"><button class="btn go" id="next">${last?'結果を見る':'次の歌へ'}</button></div></div>`;
  const nx=document.getElementById('next'); nx.onclick=next; nx.focus({preventScroll:true});
}
function next(){ if(++G.i<G.n)newQ(); else result(); }
function result(){
  const n=G.n,s=G.score,r=s/n;
  const rank=r===1?'満点':r>=.8?'特選':r>=.6?'入選':r>=.4?'佳作':'もう一歩';
  track('level_end',{level_name:(PAID?'hyakunin-p-':'hyakunin-')+course+'-'+dir,success:s===n,score:s,total:n});
  const bk=PAID?(/^r\d$/.test(course)||course==='all'?course:null):'free';
  if(bk&&(best[bk]==null||s>best[bk])){best[bk]=s;store.set(PAID?'hyakunin-p-best':'hyakunin-best',best);}
  app.innerHTML=`<div class="label">結果</div>
    <div class="score"><div class="big">${s}<small> / ${n}首</small></div><div class="seal">${rank}</div></div>
    <p style="margin:0">${r===1?'全問正解！上の句と下の句がしっかりつながっています。':r>=.6?'よくできました。まちがえた歌は、声に出して読むと覚えやすくなります。':'歌の意味といっしょに覚えると、上の句と下の句がつながりやすくなります。'}</p>
    <div class="row"><button class="btn go" id="again">${PAID?'コースをえらぶ':'もう一度'}</button>${G.miss.length?'<button class="btn" id="retry">まちがえた歌だけ</button>':''}</div>
    ${PAID?'':PAIDLINK}
    ${G.miss.length?`<div class="label" style="color:var(--fg)">まちがえた歌</div>${G.miss.map(q=>`<div class="rv"><span class="meta">${q.n}番　${esc(q.au)}</span><br><b>${esc(q.k)}<br>${esc(q.s)}</b></div>`).join('')}`:''}`;
  document.getElementById('again').onclick=()=>PAID?home():(course='free',start(shuffle(POEMS())));
  const rt=document.getElementById('retry'); if(rt)rt.onclick=()=>{course='retry';start(shuffle(G.miss));};
}
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
