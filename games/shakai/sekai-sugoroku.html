<title>世界一周 地理すごろく</title>
<meta name="game:subject" content="社会">
<meta name="game:unit" content="地理・世界の国々">
<meta name="game:grade" content="小5〜">
<meta name="game:players" content="1人">
<meta name="description" content="サイコロをふってアジアの国々をめぐる世界地理すごろく。止まった国の4択クイズに正解するとスタンプがもらえる。首都・貿易・気候・文化・世界遺産・時差から12問。">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: 1列。世界地図の上のすごろく盤（今いる場所に寄って動く）→ サイコロ・クイズの台 → ゴールで結果とスタンプ帳。
   日本一周 地理すごろくと同じ海の青・陸の白に、旅の朱色を差し色に。州ごとにスタンプの色を変える。国境は描かない */
:root{
  --bg:#f2f5f8; --surface:#ffffff; --fg:#1f2a37; --muted:#5d6878; --rule:#d5dce5;
  --sea:#dcebf7; --land:#ffffff; --edge:#8a95a3; --grid:#9fb6cf; --ocean:#6f8fb3; --ink:#1f4e8c; --hit:#e0602f; --hitsoft:#fbe6dc;
  --ok:#1d8150; --oksoft:#e0f1e6; --ng:#c8352d; --ngsoft:#f8e3e1; --gold:#a97c12; --pick:#e9eef5;
  --road:#f3c98b; --roadline:#ffffff; --stampbg:#fffaf0; --offbg:#f1f3f6; --star:#e8a317;
  --display:"Dela Gothic One","Hiragino Kaku Gothic StdN",sans-serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151d; --surface:#18202b; --fg:#e4e9f1; --muted:#9aa6b8; --rule:#2a3546;
  --sea:#13253a; --land:#2a3442; --edge:#6f7b8e; --grid:#35506f; --ocean:#7d9cc4; --ink:#8fb0f0; --hit:#f08a5d; --hitsoft:#3a261d;
  --ok:#4cc184; --oksoft:#1b3326; --ng:#f07468; --ngsoft:#3a2220; --gold:#e1b44a; --pick:#222c3a;
  --road:#8a6a3c; --roadline:#d9c29a; --stampbg:#f6efe0; --offbg:#222b37; --star:#f0bd45; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151d; --surface:#18202b; --fg:#e4e9f1; --muted:#9aa6b8; --rule:#2a3546;
  --sea:#13253a; --land:#2a3442; --edge:#6f7b8e; --grid:#35506f; --ocean:#7d9cc4; --ink:#8fb0f0; --hit:#f08a5d; --hitsoft:#3a261d;
  --ok:#4cc184; --oksoft:#1b3326; --ng:#f07468; --ngsoft:#3a2220; --gold:#e1b44a; --pick:#222c3a;
  --road:#8a6a3c; --roadline:#d9c29a; --stampbg:#f6efe0; --offbg:#222b37; --star:#f0bd45; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.7;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 64px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,7.2vw,40px);line-height:1.15;margin:0;color:var(--ink)}
h1 small{display:block;font-family:var(--body);font-weight:700;font-size:14px;color:var(--hit);letter-spacing:.2em;margin-bottom:4px}
.lead{margin:4px 0 0;color:var(--muted);font-size:14px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.label{font-size:12px;font-weight:700;color:var(--hit);letter-spacing:.1em}
.howto{margin:0;padding-left:1.3em;font-size:15px;display:grid;gap:4px}
.note{font-size:13px;color:var(--muted);margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:8px;padding:10px 20px;font-weight:700;cursor:pointer;background:var(--pick)}
.btn.go{background:var(--fg);color:var(--surface)}
.btn.big{font-size:18px;padding:12px 26px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.src{font-size:12px;color:var(--muted);margin:0}
a{color:var(--ink)}
/* ホーム */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:2px solid var(--rule);background:var(--surface);border-radius:8px;padding:10px 8px;font-weight:700;cursor:pointer;line-height:1.4}
.seg button small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--hit);background:var(--hitsoft)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:560px){.cats{grid-template-columns:repeat(3,1fr)}}
.cat{border:2px solid var(--rule);background:var(--surface);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.cat:hover:not(:disabled){border-color:var(--ink)}
.cat:disabled{opacity:.5;cursor:default}
.cat .nm{font-weight:700;font-size:16px;line-height:1.35}
.cat .ds{font-size:12px;color:var(--muted);line-height:1.5}
.cat .best{font-size:12px;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.cat.wide{grid-column:1/-1;background:var(--fg);border-color:var(--fg);color:var(--surface)}
.cat.wide .ds,.cat.wide .best{color:var(--surface);opacity:.85}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:13px;margin:0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:6px;min-width:0;line-height:1.45}
.legend svg{flex:none}
.prog{display:flex;flex-direction:column;gap:6px}
.prog .tp{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.prog .cnt{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.prog .cnt small{font-size:14px;color:var(--muted);font-family:var(--body)}
.bar{height:12px;background:var(--rule);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--hit),var(--gold));border-radius:6px}
.regbar{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;font-size:12px;font-weight:700}
.regbar .b{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.regbar .b i{display:block;height:100%;background:var(--c)}
.regbar .n{font-variant-numeric:tabular-nums;color:var(--muted)}
/* スタンプ帳 */
.card47{display:flex;flex-direction:column;gap:10px}
.card47 h3{margin:0;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.card47 h3 i{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px}
.sgrid svg{width:100%;height:auto;display:block}
.stamp .sb{fill:var(--stampbg);stroke:var(--c);stroke-width:3}
.stamp .sr{fill:none;stroke:var(--c);stroke-width:1;stroke-dasharray:2 2}
.stamp .st{font-weight:700;fill:var(--c);font-family:var(--body)}
.stamp.off .sb{fill:var(--offbg);stroke:var(--rule)}
.stamp.off .sr{stroke:var(--rule)}
.stamp.off .sy{opacity:.13;filter:grayscale(1)}
.stamp.off .st{fill:var(--muted)}
.stamp.new{animation:pon .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pon{from{transform:scale(2.2) rotate(-25deg);opacity:0}to{transform:scale(1) rotate(-6deg);opacity:1}}
/* すごろく盤 */
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.hud .cn{font-weight:700;flex:1 1 100%;min-width:0;line-height:1.4}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;background:var(--pick);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.me{background:var(--hitsoft);color:var(--hit)}
.chip.cpu{background:#e3edfb;color:#2557a7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.cpu{background:#1d2b44;color:#8fb0f0}}
:root[data-theme="dark"] .chip.cpu{background:#1d2b44;color:#8fb0f0}
.bwrap{position:relative;border-radius:10px;overflow:hidden;background:var(--sea);touch-action:manipulation}
.bwrap svg.bd{display:block;width:100%;height:auto;aspect-ratio:100/82}
.bd .lnd{fill:var(--land)}
.bd .cst{fill:var(--land);stroke:var(--edge);stroke-linejoin:round}
.bd .gl{fill:none;stroke:var(--grid);vector-effect:non-scaling-stroke;stroke-width:1.2}
.bd .gl.dl{stroke-dasharray:6 5;stroke-width:1.6}
.bd .ol text{font-family:var(--body);font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none;fill:var(--ocean);font-size:12px;letter-spacing:.25em}
.bd .ol.ln text{font-size:10px;letter-spacing:.05em}
.bd .ol.jp text{fill:var(--muted);font-size:11px;letter-spacing:0}
.bd .rd{fill:none;stroke:var(--road);stroke-width:7;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.bd .rd2{fill:none;stroke:var(--roadline);stroke-width:1.6;stroke-dasharray:4 5;vector-effect:non-scaling-stroke}
.bd .sq circle.o{stroke-width:3}
.bd .sq text{font-family:var(--body);font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.bd .sq .lb rect{fill:var(--surface);stroke:var(--c);stroke-width:1.2;opacity:.95}
.bd .sq .lb text{font-size:11px;fill:var(--fg)}
.bd .sq.p circle.o{fill:var(--surface);stroke:var(--c)}
.bd .sq.p.got circle.o{fill:var(--c)}
.bd .sq.p .ck{fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.bd .sq.p.got .ck{opacity:1}
.bd .sq.x circle.o{fill:var(--c);stroke:var(--surface)}
.bd .sq.x text.i{font-size:12px;fill:#fff}
.bd .sq.k-go2 text.i{fill:#3a2e00}
.bd .tk .sh{fill:#000;opacity:.18}
.bview{position:absolute;top:8px;right:8px;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;cursor:pointer;opacity:.92}
.pan{display:flex;flex-direction:column;gap:10px;min-height:120px}
.msg{display:flex;gap:12px;align-items:flex-start}
.msg .ic{flex:none}
.msg h2{margin:0;font-size:18px;line-height:1.4}
.msg p{margin:2px 0 0;font-size:15px}
.die{border:0;background:none;padding:0;cursor:pointer;width:84px;height:84px;flex:none}
.die svg{width:100%;height:100%;display:block}
.die .df{fill:var(--surface);stroke:var(--fg);stroke-width:2.4}
.die .dp{fill:var(--fg)} .die .dp.one{fill:var(--ng)}
.die.roll svg{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
.rollrow{display:flex;gap:14px;align-items:center}
.tag{font-size:12px;font-weight:700;color:var(--ink);border:1px solid var(--ink);border-radius:4px;padding:0 6px;white-space:nowrap}
.qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qh b{font-size:18px;color:var(--hit)}
.q{margin:0;font-size:17px;font-weight:700}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choices.one{grid-template-columns:1fr}
.ch{border:2px solid var(--rule);background:var(--surface);border-radius:8px;padding:10px 10px;font-weight:700;font-size:16px;cursor:pointer;line-height:1.45;text-align:center}
.choices.one .ch{text-align:left;font-size:15px}
.ch:hover:not(:disabled){border-color:var(--ink);background:var(--pick)}
.ch:disabled{cursor:default;opacity:.45}
.ch.right{opacity:1;border-color:var(--ok);background:var(--oksoft);color:var(--ok)}
.ch.wrong{opacity:1;border-color:var(--ng);background:var(--ngsoft);color:var(--ng)}
.res{border:2px solid var(--ok);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.res.ng{border-color:var(--ng)}
.res .v{font-family:var(--display);font-size:20px}
.res .v.ok{color:var(--ok)} .res .v.ng{color:var(--ng)}
.res .tip{border-left:4px solid var(--hit);padding-left:10px;font-size:15px}
.res .get{display:flex;gap:12px;align-items:center;font-weight:700}
.res .get svg{width:78px;height:78px;flex:none}
.cpulog{margin:0;padding-left:1.2em;font-size:15px;display:grid;gap:2px}
/* 結果 */
.goal{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.big{font-family:var(--display);font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:20px;font-family:var(--body)}
.stars{font-size:34px;letter-spacing:.08em;color:var(--star);line-height:1}
.stars .off{color:var(--rule)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:0;font-size:15px}
.facts dt{color:var(--muted);font-weight:700} .facts dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.cheer{margin:0;font-weight:700;font-size:17px;color:var(--hit)}
.vs{border:1px solid var(--rule);border-radius:10px;padding:10px 14px;font-weight:700}
.got1{display:flex;flex-wrap:wrap;gap:6px}
.got1 svg{width:64px;height:64px}
@media (prefers-reduced-motion:reduce){.stamp.new,.die.roll svg{animation:none}}
</style>

function measure(){ if(svg){const w=svg.getBoundingClientRect().width; if(w>0)pxw=w;} }
function tokPos(i){const P=G.pl[i], s=G.c.sq[P.pos]; return {x:s.x,y:s.y,dy:0};}
function setCam(c){
  cam=c; if(!svg)return;
  const H=c.W*ASP; svg.setAttribute('viewBox',`${(c.x-c.W/2).toFixed(2)} ${(c.y-H/2).toFixed(2)} ${c.W.toFixed(2)} ${H.toFixed(2)}`);

  svg.querySelectorAll('.ol').forEach(g=>{g.setAttribute('transform',`translate(${g.dataset.x},${g.dataset.y}) scale(${u0.toFixed(4)})`);});
  G.pl.forEach((P,i)=>{const t=document.getElementById('tk'+i); if(!t)return; const p=P.tp||tokPos(i);
    const other=G.pl[1-i], same=G.cpu&&other&&other.pos===P.pos&&!P.tp; const ox=same?(i?9:-9):0;
    t.setAttribute('transform',`translate(${(p.x+ox*u).toFixed(2)},${(p.y-(p.dy||0)*u).toFixed(2)}) scale(${u.toFixed(4)})`);});
}
function camAt(i){const s=G.c.sq[i]; return {x:s.x,y:s.y+s.W*ASP*.08,W:s.W,s:1};}
function camAll(){const xs=G.c.sq.map(s=>s.x), ys=G.c.sq.map(s=>s.y);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const W=Math.max((x1-x0)*1.18,(y1-y0)*1.22/ASP,60); return {x:(x0+x1)/2,y:(y0+y1)/2,W,s:Math.max(.34,Math.min(.62,.62*360/W))};}   /* 広いコースほどマスを小さく */
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
function tween(ms,fn){ if(RM)ms=1; return new Promise(res=>{const t0=performance.now();const f=t=>{const k=Math.max(0,Math.min(1,(t-t0)/ms));fn(k);if(k<1)requestAnimationFrame(f);else res();};requestAnimationFrame(f);}); }
async function camTo(c2,ms){ const c1=Object.assign({},cam); await tween(ms||500,k=>{const e=ease(k);setCam({x:c1.x+(c2.x-c1.x)*e,y:c1.y+(c2.y-c1.y)*e,W:c1.W+(c2.W-c1.W)*e,s:c1.s+(c2.s-c1.s)*e});}); }
async function hop(i,to){
  const P=G.pl[i], a=G.c.sq[P.pos], b=G.c.sq[to], d=Math.hypot(b.x-a.x,b.y-a.y);
  const ms=Math.max(260,Math.min(1500,180+d*4)), c1=Object.assign({},cam), follow=!overview;
  const wa=c1.W, wb=follow?b.W:c1.W, bump=follow?Math.max(0,d*1.3-Math.max(wa,wb)):0;
  await tween(ms,k=>{const e=ease(k); P.tp={x:a.x+(b.x-a.x)*e,y:a.y+(b.y-a.y)*e,dy:Math.sin(Math.PI*k)*(d>40?16:7)};
    if(follow){const tc=camAt(to);setCam({x:c1.x+(tc.x-c1.x)*e,y:c1.y+(tc.y-c1.y)*e,W:wa+(wb-wa)*e+bump*Math.sin(Math.PI*k),s:1});} else setCam(cam);});
  P.pos=to; P.tp=null; setCam(cam);
}
async function move(i,n){
  const last=G.c.sq.length-1, P=G.pl[i], dir=n<0?-1:1;
  for(let s=0;s<Math.abs(n);s++){ const to=P.pos+dir; if(to<0||to>last)break; await hop(i,to); if(to===last)break; }
}

/* ---------- ゲームの進み方 ---------- */
function start(c){
  G={c,cpu:mode==='cpu',day:1,asked:new Set(),hint:{},visits:0,newSt:new Set(),
     pl:[{pos:0,st:new Set(),rest:0,done:false,bonus:false}]};
  if(G.cpu)G.pl.push({pos:0,st:new Set(),rest:0,done:false,bonus:false,cpu:true});
  track('level_start',{level_name:'sekaisugo-'+c.id+(G.cpu?'-cpu':'')});
  overview=false;
  app.innerHTML=`<div class="hud" id="hud"></div>${boardHTML()}<div class="pan" id="pan" aria-live="polite"></div>`;
  svg=document.getElementById('bd'); measure(); hud();
  document.getElementById('bview').onclick=async()=>{overview=!overview;document.getElementById('bview').textContent=overview?'近くを見る':'全体を見る';await camTo(overview?camAll():camAt(G.pl[G.turn||0].pos),600);};
  setCam(camAll()); paintGot();
  loop();
}
window.addEventListener('resize',()=>{if(G&&svg){measure();setCam(cam);}});
const pan=()=>document.getElementById('pan');
function say(o){ return new Promise(res=>{
  pan().innerHTML=`<div class="msg">${o.icon||''}<div><h2>${o.t}</h2>${o.m?`<p>${o.m}</p>`:''}</div></div>${o.extra||''}<div class="row"><button class="btn go" id="ok">${o.btn||'つぎへ'}</button></div>`;
  const b=document.getElementById('ok'); b.onclick=()=>res(); b.focus({preventScroll:true});
});}
const PIPS={1:[[2,2]],2:[[1,1],[3,3]],3:[[1,1],[2,2],[3,3]],4:[[1,1],[3,1],[1,3],[3,3]],5:[[1,1],[3,1],[2,2],[1,3],[3,3]],6:[[1,1],[3,1],[1,2],[3,2],[1,3],[3,3]]};
const dieSVG=n=>`<svg viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="2" width="36" height="36" rx="8" class="df"/>${PIPS[n].map(([c,r])=>`<circle cx="${c*10}" cy="${r*10}" r="${n===1?5:3.6}" class="dp ${n===1?'one':''}"/>`).join('')}</svg>`;
function rollUI(who,again){ return new Promise(res=>{
  const cpu=who==='cpu';
  pan().innerHTML=`<div class="rollrow"><button class="die" id="die" aria-label="サイコロをふる">${dieSVG(Math.ceil(Math.random()*6))}</button>
    <div><h2 style="margin:0;font-size:18px">${cpu?CPU_NAME+'のばん':'あなたのばん'}${again?'（もう1回！）':''}</h2><p class="note" id="dn">${cpu?'サイコロをふっています…':'サイコロをタップしてふろう'}</p></div></div>
    ${cpu?'':'<div class="row"><button class="btn go big" id="rb">サイコロをふる</button></div>'}`;
  const die=document.getElementById('die');
  const go=async()=>{ if(die.dataset.busy)return; die.dataset.busy=1; const rb=document.getElementById('rb'); if(rb)rb.disabled=true;
    die.classList.add('roll'); const n=Math.ceil(Math.random()*6);
    for(let t=0;t<(RM?1:9);t++){die.innerHTML=dieSVG(Math.ceil(Math.random()*6));await sleep(65);}
    die.classList.remove('roll'); die.innerHTML=dieSVG(n); document.getElementById('dn').innerHTML=`<b style="font-size:20px;color:var(--hit)">${n}</b> が出た！ ${n}マス進もう`;
    await sleep(650); res(n); };
  if(cpu){ setTimeout(go,500); } else { die.onclick=go; document.getElementById('rb').onclick=go; document.getElementById('rb').focus({preventScroll:true}); }
});}
async function loop(){
  await sleep(700); await camTo(camAt(0),900);
  for(;;){
    G.turn=0; if(!G.pl[0].done){ await turn(0); }
    if(G.pl[0].done)break;
    if(G.cpu&&!G.pl[1].done){ G.turn=1; await turn(1); if(!overview)await camTo(camAt(G.pl[0].pos),500); }
    G.day++; hud();
  }
  result();
}
async function turn(i){
  const P=G.pl[i], cpu=!!P.cpu;
  if(!overview)await camTo(camAt(P.pos),cpu?450:350);
  if(P.rest>0){ P.rest--; await say({icon:icon('boke'),t:cpu?CPU_NAME+'は1回休み':'今回は1回休み',m:cpu?'ひと休み中です。':'ひと休みしたので、元気いっぱい！次のばんからまた進もう。',btn:cpu?'あなたのばんへ':'つぎへ'}); return; }
  const log=[]; let again=false;
  for(;;){
    const n=await rollUI(cpu?'cpu':'me',again);
    if(cpu&&again)log.push(`もう1回サイコロ：${n}が出た！`); else if(cpu)log.push(`サイコロ：${n}が出た！`);
    await move(i,n); if(!cpu)G.visits++;
    hud();
    await land(i,log,false);
    if(P.bonus&&!P.done){ P.bonus=false; again=true; continue; }
    P.bonus=false; break;
  }
  if(cpu) await say({icon:cpuIcon(),t:CPU_NAME+'のばん',extra:`<ul class="cpulog">${log.map(l=>`<li>${l}</li>`).join('')}</ul>`,btn:'あなたのばんへ'});
  hud();
}
const cpuIcon=()=>`<svg class="ic" width="30" height="30" viewBox="-15 -15 30 30" aria-hidden="true"><circle r="13" fill="#2f6fd6"/><rect x="-7" y="-5" width="14" height="10" rx="3" fill="#fff"/><circle cx="-3" cy="0" r="1.6" fill="#2f6fd6"/><circle cx="3" cy="0" r="1.6" fill="#2f6fd6"/></svg>`;
function nextCo(from){ for(let j=from+1;j<G.c.sq.length;j++)if(G.c.sq[j].k==='P')return G.c.sq[j].p; return null; }
async function land(i,log,forced){
  const P=G.pl[i], cpu=!!P.cpu, s=G.c.sq[P.pos];
  if(s.k==='G'){ P.done=true;
    if(cpu){ log.push(`${CPU_NAME}がゴールに着きました！`); return; }
    const left=G.c.prefs.filter(p=>!P.st.has(p));
    await say({icon:icon('G'),t:'ゴール！',m:left.length?'ゴール記念に、まだスタンプのない国・地域からボーナスクイズ1問！':'すべての国・地域のスタンプを集めてゴールしました！',btn:left.length?'ボーナスクイズへ':'結果を見る'});
    if(left.length) await quiz(0,shuffle(left)[0],'ゴール記念クイズ',log);
    return; }
  if(s.k==='P'){ await quiz(i,s.p,null,log); return; }
  if(s.k==='go2'){
    const idx=p=>G.c.sq.findIndex(q=>q.p===p), dist=p=>Math.abs(idx(p)-P.pos);
    const cand=G.c.prefs.filter(p=>!P.st.has(p)), pool=(cand.length>=2?cand:G.c.prefs).slice().sort((a,b)=>dist(a)-dist(b));
    const two=shuffle(pool.slice(0,4)).sort((a,b)=>cpu?0:(col[a]>0)-(col[b]>0)).slice(0,2);   /* 近くの国から、まだ集めていない国を優先 */
    if(!cpu) await say({icon:icon('go2'),t:'ご当地クイズ2問！',m:`${esc(NM(two[0]))}と${esc(NM(two[1]))}のクイズにチャレンジ。正解するとスタンプ2つのチャンス！`,btn:'1問目へ'});
    else log.push('ご当地クイズ2問にチャレンジ！');
    await quiz(i,two[0],'ご当地クイズ 1問目',log); await quiz(i,two[1],'ご当地クイズ 2問目',log); return; }
  if(s.k==='plane'){
    if(cpu)log.push(`飛行機に乗って${s.n}マス進んだ！`); else await say({icon:icon('plane'),t:`飛行機で ${s.n}マス進む！`,m:esc(s.t),btn:'乗る！'});
    await move(i,s.n); hud(); const s2=G.c.sq[P.pos];
    if(s2.k==='P'||s2.k==='G') await land(i,log,true); return; }
  if(s.k==='ship'){
    if(cpu)log.push('船で海をこえて近道！'); else await say({icon:icon('ship'),t:'船で近道！',m:esc(s.t),btn:'乗る！'});
    await hop(i,s.to); hud(); await land(i,log,true); return; }
  if(s.k==='boke'){ P.rest=1;
    if(cpu)log.push('時差ボケでひと休み（次は1回休み）。'); else await say({icon:icon('boke'),t:'時差ボケでひと休み',m:esc(s.t)}); return; }
  if(s.k==='dline'){ P.bonus=true;
    if(cpu)log.push('日付変更線をこえて、もう1回サイコロ！'); else await say({icon:icon('dline'),t:'日付変更線をこえた！',m:esc(s.t),btn:'もう1回ふる！'}); return; }
  if(s.k==='ten'){
    const back=s.e==='back1'?1:0;
    if(!back)P.rest=1;
    const how=back?`${back}マスもどる`:'次は1回休み';
    if(cpu)log.push(`${TENN[s.w]}で${how}。`);
    else await say({icon:icon('ten',TENI[s.w]),t:`${TENN[s.w]}で${how}`,m:esc(s.t)});
    if(back){ await move(i,-back); hud(); } return; }
  if(s.k==='mame'){
    const p=nextCo(P.pos);
    if(cpu){ log.push('まめ知識を読んだ。'); return; }
    if(p==null){ await say({icon:icon('mame'),t:`まめ知識：${esc(s.nm)}`,m:'ゴールはもうすぐ！'}); return; }
    const q=pickQ(p,false); G.hint[p]=q;
    await say({icon:icon('mame'),t:`まめ知識：${esc(s.nm)}`,m:`次は${esc(NM(p))}。${esc(q.e)}`,extra:'<p class="note">このあとのクイズのヒントになるかも！</p>'}); return; }
}
function pickQ(p,mark){
  const pool=QS.filter(q=>q.p===p);
  if(mark&&G.hint[p]){const h=G.hint[p];delete G.hint[p];G.asked.add(h.q);return h;}
  let c=pool.filter(q=>!G.asked.has(q.q)); if(!c.length)c=pool;
  const used=new Set([...G.asked].map(t=>(QS.find(q=>q.q===t)||{}).c));
  const fresh=c.filter(q=>!used.has(q.c)); if(fresh.length>1)c=fresh;   /* 同じ旅の中では、ちがう分野の問題を出す */
  const mn=Math.min(...c.map(q=>seen[q.k]||0)); c=c.filter(q=>(seen[q.k]||0)===mn);
  const q=c[Math.floor(Math.random()*c.length)];
  if(mark)G.asked.add(q.q);
  return q;
}
async function quiz(i,p,head,log){
  const P=G.pl[i];
  if(P.cpu){ const ok=Math.random()<CPU_RATE; const had=P.st.has(p); if(ok)P.st.add(p);
    log.push(`${esc(NM(p))}のクイズに${ok?'正解！'+(had?'（スタンプはもう持っています）':'スタンプゲット'):'まちがえた…'}`); hud(); return; }
  const q=pickQ(p,true); seen[q.k]=(seen[q.k]||0)+1; store.set(KSEEN,seen);
  const ch=shuffle([q.a,...q.d]), one=ch.some(c=>c.length>9);
  pan().innerHTML=`<div class="qh">${head?`<span class="tag" style="color:var(--hit);border-color:var(--hit)">${esc(head)}</span>`:''}<b>${esc(NM(p))}</b><span class="tag">${esc(q.t||CATN[q.c])}</span></div>
    <p class="q">${esc(q.q)}</p>
    <div class="choices ${one?'one':''}">${ch.map((c,j)=>`<button class="ch" data-j="${j}">${esc(c)}</button>`).join('')}</div><div id="after"></div>`;
  pan().scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'});
  const pick=await new Promise(res=>pan().querySelectorAll('.ch').forEach(b=>b.onclick=()=>res(+b.dataset.j)));
  const ok=ch[pick]===q.a;
  pan().querySelectorAll('.ch').forEach((b,j)=>{b.disabled=true;if(ch[j]===q.a)b.classList.add('right');else if(j===pick)b.classList.add('wrong');});
  track('answer_question',{category:'sekaisugo-'+q.c,question:q.q,correct:ok,picked:ch[pick]});
  const had=P.st.has(p);
  let get='';
  if(ok){ P.st.add(p); if(!had){ col[p]=(col[p]||0)+1; store.set(KS,col); G.newSt.add(p); }
    get=`<div class="get">${stampSVG(p,true,had?'':'new')}<span>${had?`${esc(NM(p))}のスタンプは、もう持っています。`:`${esc(NM(p))}のスタンプをゲット！`}</span></div>`; paintGot(); hud(); }
  document.getElementById('after').innerHTML=`<div class="res ${ok?'':'ng'}"><span class="v ${ok?'ok':'ng'}">${ok?'正解！':'ざんねん'}</span>
    ${ok?'':`<p class="note" style="color:var(--ng);font-weight:700;margin:0">正解は「${esc(q.a)}」です。スタンプはもらえませんでした。</p>`}
    ${get}<div class="tip">${esc(q.e)}</div><div class="row"><button class="btn go" id="nx">つぎへ</button></div></div>`;
  const nx=document.getElementById('nx'); nx.focus({preventScroll:true});
  document.getElementById('after').scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'});
  await new Promise(res=>nx.onclick=res);
}

/* ---------- 結果 ---------- */
function result(){
  const c=G.c, P=G.pl[0], n=P.st.size, T=c.prefs.length;
  const goal_=Math.min(T,Math.round(c.sq.length/3.5)), stars=n>=Math.ceil(goal_*.8)?3:n>=Math.ceil(goal_*.5)?2:n>=1?1:0;   /* 1回の旅でとまれるマスの数をもとに星を決める */
  const prev=rec[c.id]; const best=prev==null||n>prev; if(best){rec[c.id]=n;store.set(KR,rec);}
  track('level_end',{level_name:'sekaisugo-'+c.id+(G.cpu?'-cpu':''),success:true,score:n,total:T});
  const all=nCol(), left=NC-all;
  const cheer=all===NC?`世界制覇！${NC}の国・地域のスタンプがぜんぶそろいました！`:
    left<=6?`スタンプ${n}こ！ もう少しで世界制覇。あと${left}の国・地域！`:
    stars===3?`スタンプ${n}こ！ すばらしい旅でした。世界制覇まであと${left}の国・地域！`:
    n>0?`スタンプ${n}こ！ ほかのコースも旅して、世界制覇をめざそう。あと${left}の国・地域！`:
    'スタンプはまだ0こ。まめ知識をヒントにして、もう一度旅してみよう！';
  let vs='';
  if(G.cpu){const m=G.pl[1].st.size; vs=`<div class="vs">${n>m?'あなたの勝ち！':n<m?CPU_NAME+'の勝ち… 次はがんばろう！':'引き分け！'}　あなた ${n}こ ・ ${CPU_NAME} ${m}こ</div>`;}
  const got=c.prefs.filter(p=>P.st.has(p));
  svg=null;
  app.innerHTML=`<div class="label">ゴール！ ${esc(c.name)}</div>
    <div class="goal"><div class="big">${n}<small> こ / ${T}の国・地域</small></div><div class="stars" aria-label="星${stars}つ">${'★'.repeat(stars)}<span class="off">${'★'.repeat(3-stars)}</span></div></div>
    <p class="cheer">${cheer}</p>${vs}
    <dl class="facts"><dt>今回のスタンプ</dt><dd>${n}こ${best&&prev!=null?'（ベスト更新！）':''}</dd><dt>とまったマス</dt><dd>${G.visits}マス</dd><dt>旅の日数</dt><dd>${G.day}日</dd></dl>
    ${got.length?`<div class="got1">${got.map(p=>stampSVG(p,true)).join('')}</div>`:''}
    <div class="row"><button class="btn go" id="again">もう一度この旅へ</button><button class="btn" id="home">コースをえらぶ</button></div>
    ${PAID?'':'<p class="note">ほかの州のコースと「世界一周コース」は <a href="sekai-sugoroku-full.html">有料版</a> で遊べます。</p>'}
    <div class="label">スタンプ帳</div>${progress()}${card(G.newSt)}`;
  document.getElementById('again').onclick=()=>start(c);
  document.getElementById('home').onclick=()=>{showCard=false;home();window.scrollTo(0,0);};
  window.scrollTo({top:0,behavior:RM?'auto':'smooth'});
}

/* ---------- はじめ ---------- */
QS.forEach(q=>{q.k=q.p+'-'+q.c+'-'+q.a;});
home();
})();
</script>
