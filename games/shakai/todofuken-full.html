  };
  const c=CENT[q.n], small=c[2]<26&&c[3]<26, showPin=small&&(show||state.done);
  return `<svg viewBox="0 0 ${MAP.w} ${MAP.h}" role="img" aria-label="日本地図">
    <rect class="okibox" x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}" rx="6"/><text class="okilabel" x="${b[0]+6}" y="${b[1]+16}">沖縄県</text>
    ${Object.keys(MAP.paths).map(k=>`<path d="${MAP.paths[k]}" data-n="${k}" class="${cls(+k)}"><title>${state.done?NAMES[k]:''}</title></path>`).join('')}
    ${showPin?`<circle class="pin ${state.done?'ok':''}" cx="${c[0]}" cy="${c[1]}" r="${Math.max(c[2],c[3])/2+12}"/>`:''}
  </svg>`;
}
async function decrypt(){ const d=await mnAccess.load('todofuken'); DATA=d; QS=[]; d.forEach(p=>Object.keys(MODES).forEach(m=>QS.push({id:p.n+'-'+m,n:p.n,m,reg:p.reg}))); return QS; }
function lockScreen(err){ mnAccess.lock(app,{game:'todofuken',err:err,free:'todofuken.html',onOpen:async()=>{ await decrypt(); home(); }}); }
function home(){
  G=null;
  const cnt={master:0,weak:0,new:0,try:0}; QS.forEach(q=>cnt[state(q)]++);
  const weak=QS.filter(q=>state(q)==='weak'), fresh=QS.filter(q=>state(q)==='new');
  const btn=(k,nm,ds,pool)=>{const m=pool.filter(q=>state(q)==='master').length;return `<button class="cat" data-l="${k}"><span class="nm">${nm}</span><span class="ds">${ds}<br>覚えた ${m} / ${pool.length}問</span><span class="best">${best[k]!=null?`ベスト ${best[k]}/10`:''}</span></button>`;};
  app.innerHTML=`<div class="master"><div class="tp"><span class="label" style="font-size:14px;color:var(--fg)">覚えた問題</span><span class="cnt">${cnt.master}<small> / ${QS.length}問</small></span></div>
      <div class="mbar" aria-hidden="true"><i class="m" style="width:${cnt.master/QS.length*100}%"></i><i class="w2" style="width:${cnt.weak/QS.length*100}%"></i></div>
      <div class="mleg"><span style="--c:var(--ok)">覚えた ${cnt.master}</span><span style="--c:var(--gold)">にがて ${cnt.weak}</span><span style="--c:var(--rule)">まだ ${cnt.new}</span></div></div>
    <div class="label">地方をえらぶ（1回10問）</div>
    <div class="cats">${Object.entries(AREAS).map(([k,[nm,regs]])=>btn(k,nm,regs.join('・'),QS.filter(q=>regs.includes(q.reg)))).join('')}</div>
    <div class="label">問題の種類をえらぶ（1回10問）</div>
    <div class="cats">${Object.entries(MODES).map(([k,[nm,ds]])=>btn(k,nm,ds,QS.filter(q=>q.m===k))).join('')}
      <button class="cat mix" data-l="all"><span class="nm">全国まるごと</span><span class="ds">47都道府県・4種類からランダムに10問</span><span class="best">${best.all!=null?`ベスト ${best.all}/10`:''}</span></button>
      ${window.mnReview?(()=>{const n=QS.filter(q=>mnReview.isDue(RVID,qkey(q))).length;return `<button class="cat" data-l="review" ${n?'':'disabled'}><span class="nm">今日の解き直し</span><span class="ds">前にまちがえた問題を、日をあけてもう一度（${n}問）</span></button>`;})():''}
      <button class="cat" data-l="weak" ${weak.length?'':'disabled'}><span class="nm">にがて</span><span class="ds">まちがえたことのある問題（${weak.length}問）</span></button>
      <button class="cat" data-l="fresh" ${fresh.length?'':'disabled'}><span class="nm">まだやっていない</span><span class="ds">一度も出ていない問題（${fresh.length}問）</span></button></div>
    <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
  app.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{
    const l=b.dataset.l; course=l;
    const pool=l==='review'?QS.filter(q=>mnReview.isDue(RVID,qkey(q))):l==='weak'?weak:l==='fresh'?fresh:l==='all'?QS:AREAS[l]?QS.filter(q=>AREAS[l][1].includes(q.reg)):QS.filter(q=>q.m===l);
    start(shuffle(pool).slice(0,10));
  });
  document.getElementById('reset').onclick=()=>{
    document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
    document.getElementById('yes').onclick=()=>{rec={};saveRec();home();};
    document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
  };
}
function start(list){ G={list,i:0,score:0,miss:[],n:list.length}; track('level_start',{level_name:'tdfk-p-'+course}); newQ(); }
function newQ(){
  const q=G.list[G.i];
  G.s={done:false,pick:null};
  if(q.m!=='tap'){ const nb=near(q.n); G.s.ch=shuffle([q.n,...shuffle(nb.slice(0,5)).slice(0,3)]); }
  render();
}
function prompt(q){
  if(q.m==='name')return '地図で色がついている都道府県はどこですか。';
  if(q.m==='tap')return `<b>${esc(NAMES[q.n])}</b> はどこですか。地図の上でタップしよう。`;
  if(q.m==='cap')return `地図で色がついている <b>${esc(NAMES[q.n])}</b> の${q.n===13?'都庁':'県庁'}所在地はどこですか。`;
  return '次の特色にあてはまる都道府県はどれですか。';
}
function render(){
  const q=G.list[G.i], s=G.s;
  app.innerHTML=`<div class="top"><div class="prog" aria-hidden="true"><i style="width:${G.i/G.n*100}%"></i></div><span class="nums">${G.i+1} / ${G.n}</span><span class="tag">${MODES[q.m][0]}</span></div>
    <p class="q">${prompt(q)}</p>
    ${q.m==='tok'?`<div class="hint">${esc(D(q.n).h)}</div>`:''}
    <div class="mapwrap ${q.m==='tap'&&!s.done?'tap':''}" id="map">${mapSVG(q,s)}</div>
    ${q.m!=='tap'?`<div class="choices">${s.ch.map(i=>`<button class="ch ${s.done?(i===q.n?'right':i===s.pick?'wrong':''):''}" data-n="${i}" ${s.done?'disabled':''}>${esc(label(q,i))}</button>`).join('')}</div>`:(s.done?'':'<p class="note">都道府県の形をタップしてください。</p>')}
    <div id="after"></div>`;
  if(!s.done){
    if(q.m!=='tap') app.querySelectorAll('.ch').forEach(b=>b.onclick=()=>answer(+b.dataset.n));
    else app.querySelectorAll('#map path').forEach(p=>p.onclick=()=>answer(+p.dataset.n));
  } else explain();
}
function answer(n){
  const q=G.list[G.i]; if(G.s.done)return;
  G.s.done=true; G.s.pick=n; G.ok=n===q.n;
  if(G.ok)G.score++; else G.miss.push(q);
  G.mastered=record(q,G.ok);
  track('answer_question',{category:'tdfk-p-'+q.m,question:NAMES[q.n],correct:G.ok,picked:NAMES[n]});
  render();
}
function explain(){
  const q=G.list[G.i], d=D(q.n), last=G.i===G.n-1;
  const picked=q.m==='cap'?`${esc(D(G.s.pick).cap)}（${esc(NAMES[G.s.pick])}の${G.s.pick===13?'都庁':'県庁'}所在地）`:esc(NAMES[G.s.pick]);
  document.getElementById('after').innerHTML=`<div class="card ${G.ok?'':'ng'}">
    <span class="v ${G.ok?'ok':'ng'}">${G.ok?'正解！':'ざんねん'}　${esc(NAMES[q.n])}</span>
    ${G.ok?(G.mastered?'<span class="new">この問題を覚えました！</span>':''):`<p class="note" style="color:var(--ng);font-weight:700">あなたがえらんだのは ${picked} です。</p>`}
    <dl><dt>${q.n===13?'都庁所在地':'県庁所在地'}</dt><dd>${esc(d.cap)}</dd><dt>地方</dt><dd>${esc(d.reg)}</dd></dl>
    <div class="tip">${esc(d.t)}</div>
    <div class="row"><button class="btn go" id="next">${last?'結果を見る':'次の問題へ'}</button></div></div>`;
  const nx=document.getElementById('next'); nx.onclick=next; nx.focus({preventScroll:true});
}
function next(){ if(++G.i<G.n)newQ(); else result(); }
function result(){
  const n=G.n,s=G.score,r=s/n;
  const rank=r===1?'満点':r>=.8?'特選':r>=.6?'入選':r>=.4?'佳作':'もう一歩';
  track('level_end',{level_name:'tdfk-p-'+course,success:s===n,score:s,total:n});
  const bk=(AREAS[course]||MODES[course]||course==='all')?course:null;
  if(bk&&(best[bk]==null||s>best[bk])){best[bk]=s;store.set('tdfk-p-best',best);}
  app.innerHTML=`<div class="label">結果</div>
    <div class="score"><div class="big">${s}<small> / ${n}問</small></div><div class="rank">${rank}</div></div>
    <p style="margin:0">${r===1?'全問正解！この調子で、ほかの地方や問題の種類にも挑戦しよう。':'まちがえた都道府県は、となりの県といっしょに覚えると忘れにくくなります。'}</p>
    <div class="row"><button class="btn go" id="again">コースをえらぶ</button>${G.miss.length?'<button class="btn" id="retry">まちがえた問題だけ</button>':''}</div>
    ${G.miss.length?`<div class="label" style="color:var(--fg)">まちがえた問題</div>${G.miss.map(q=>`<div class="rv"><b>${esc(NAMES[q.n])}</b>（${esc(MODES[q.m][0])}・${esc(q.reg)}・${q.n===13?'都庁':'県庁'}所在地 ${esc(D(q.n).cap)}）</div>`).join('')}`:''}`;
  document.getElementById('again').onclick=home;
  const rt=document.getElementById('retry'); if(rt)rt.onclick=()=>{course='retry';start(shuffle(G.miss));};
}
(async()=>{ try{ await decrypt(); home(); }catch(e){ lockScreen(e); } })();
})();
</script>
