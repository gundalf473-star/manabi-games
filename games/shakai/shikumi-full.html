<title>しくみになりきろう（政治・裁判） 全10章</title>
<meta name="game:paid" content="利用コード">
<meta name="game:subject" content="社会">
<meta name="game:unit" content="公民・しくみになりきろう">
<meta name="game:grade" content="小5〜">
<meta name="game:players" content="1人">
<meta name="description" content="しくみになりきろうの有料版。選挙・国会・予算・内閣・裁判・地方自治・国連まで、全10章。架空の人になりきって選びながら、手続きの順番・決める所・日数や人数と、受験で出る用語を確かめます。役わりカード集めつき。">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Old+Mincho:wght@700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: 1列。章の一覧 → 役わりの交代カード → 場面（札・絵・文・選択肢）→ ゲームオーバー（実際のしくみでは…）／章のまとめ（流れ図・用語）。紺を基本に、朱を差し色に */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --fg:#23262b; --muted:#5f646b; --rule:#d9dcd6;
  --ink:#2a3f6b; --seal:#b0442a; --sealsoft:#f6e4dc; --ok:#1d7a4c; --oksoft:#e0f0e6; --ng:#c8352d; --ngsoft:#f8e3e1; --gold:#9a6f0e; --pick:#eceee8;
  --flow:#e6ecf6; --flowline:#2a3f6b;
  --display:"Dela Gothic One","Hiragino Kaku Gothic StdN",sans-serif;
  --mincho:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131518; --surface:#1c1f23; --fg:#e8eaec; --muted:#a0a6ad; --rule:#33373d;
  --ink:#a9bdf0; --seal:#f0805e; --sealsoft:#3a241d; --ok:#4cc184; --oksoft:#1b3326; --ng:#f07468; --ngsoft:#3a2220; --gold:#e1b44a; --pick:#262a2f;
  --flow:#1f2a3d; --flowline:#a9bdf0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131518; --surface:#1c1f23; --fg:#e8eaec; --muted:#a0a6ad; --rule:#33373d;
  --ink:#a9bdf0; --seal:#f0805e; --sealsoft:#3a241d; --ok:#4cc184; --oksoft:#1b3326; --ng:#f07468; --ngsoft:#3a2220; --gold:#e1b44a; --pick:#262a2f;
  --flow:#1f2a3d; --flowline:#a9bdf0; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 64px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,7.5vw,40px);line-height:1.2;margin:0;color:var(--ink)}
h1 small{display:block;font-family:var(--mincho);font-size:15px;color:var(--seal);letter-spacing:.3em;margin-bottom:4px}
h1 .ns{font-size:.5em;letter-spacing:.02em;white-space:nowrap;display:inline-block}
.lead{margin:4px 0 0;color:var(--muted);font-size:14px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
ruby rt{font-size:.5em;font-weight:400}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px}
.label{font-size:12px;font-weight:700;color:var(--seal);letter-spacing:.1em}
.note{font-size:13px;color:var(--muted);margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:8px;padding:12px 22px;font-size:16px;font-weight:700;cursor:pointer;background:var(--pick)}
.btn.go{background:var(--fg);color:var(--surface)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.top{display:flex;align-items:center;gap:10px}
.prog{flex:1;height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);transition:width .3s}
.whochip{font-size:12px;font-weight:700;color:var(--ink);border:1px solid var(--ink);border-radius:4px;padding:0 6px;white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}
.yr{align-self:flex-start;font-weight:700;font-size:15px;color:var(--ink);border:2px solid var(--ink);border-radius:6px;padding:0 10px;line-height:1.6;font-variant-numeric:tabular-nums}
.pic{background:#fff;border:1px solid var(--rule);border-radius:10px;overflow:hidden;line-height:0}
.pic svg{display:block;width:100%;height:auto}
.txt{margin:0;white-space:pre-line;font-size:17px;line-height:1.95}
.ask{margin:0;font-size:18px;font-weight:700;color:var(--ink);line-height:1.8}
.ch{display:grid;gap:8px}
.op{border:2px solid var(--rule);background:var(--surface);border-radius:8px;padding:12px 14px;font-size:16px;line-height:1.75;text-align:left;font-weight:700;cursor:pointer;display:flex;gap:12px;align-items:center;min-height:56px}
.op:hover:not(:disabled){border-color:var(--ink);background:var(--pick)}
.op .k{flex:none;width:28px;height:28px;border-radius:50%;background:var(--pick);display:grid;place-items:center;font-size:14px}
.op .ic{flex:none;width:48px;height:48px}.op .ic svg{width:48px;height:48px;display:block;border-radius:6px}
.op:active{transform:scale(.98)}
.sw{border:3px solid var(--ink);border-radius:14px;padding:18px 16px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;background:var(--flow)}
.sw .swl{font-size:13px;font-weight:700;color:var(--ink);letter-spacing:.12em}
.sw .got{margin:0;font-size:14px;font-weight:700;color:var(--ok);background:var(--surface);border-radius:99px;padding:2px 14px}
.sw .swp{width:100%;max-width:340px;border-radius:10px;overflow:hidden;line-height:0;border:1px solid var(--rule);background:#fff}
.sw .swp svg{display:block;width:100%;height:auto}
.sw .swt{margin:0;font-size:17px;font-weight:700}
.sw .swy{margin:0;font-size:13px;color:var(--muted);letter-spacing:.08em;line-height:1.3}
.sw .swn{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(24px,7.4vw,34px);line-height:1.35;color:var(--ink)}
.sw .swr{margin:0;font-size:15px;color:var(--muted)}
.over{border:3px dashed var(--gold);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.over h2,.endh{margin:0;font-family:var(--display);font-weight:400;font-size:21px;color:var(--gold);line-height:1.5}
.endh{color:var(--ok)}
.pick{margin:0;font-size:14px;color:var(--muted)}
.pick b{color:var(--fg)}
.hint{font-size:15px;line-height:1.85;background:var(--pick);border-radius:8px;padding:8px 12px;margin:0}
.hint b{color:var(--seal);display:block;font-size:12px;letter-spacing:.1em}
.lesson{font-size:16px;line-height:1.9;border-left:5px solid var(--ok);background:var(--oksoft);border-radius:0 8px 8px 0;padding:8px 12px;margin:0}
.lesson b{display:block;color:var(--ok);font-size:13px}
.stars{font-size:26px;color:var(--gold);letter-spacing:.1em;line-height:1}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;align-items:stretch;gap:22px;counter-reset:fl}
.flow li{position:relative;border:2px solid var(--flowline);background:var(--flow);border-radius:8px;padding:6px 12px 6px 44px;font-weight:700;font-size:15px;line-height:1.6;counter-increment:fl}
.flow li::before{content:counter(fl);position:absolute;left:10px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:var(--flowline);color:var(--surface);display:grid;place-items:center;font-size:13px}
.flow li:not(:last-child)::after{content:"";position:absolute;left:50%;bottom:-19px;transform:translateX(-50%);border:8px solid transparent;border-top:11px solid var(--flowline);border-bottom:0}
.words{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.words li{border:1px solid var(--rule);border-radius:8px;padding:6px 12px;font-size:14px;line-height:1.7;background:var(--surface)}
.words li b{font-size:16px;color:var(--ink);margin-right:8px}
.figrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.fc{border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--surface);font-size:12px;line-height:1.5;display:flex;flex-direction:column}
.fc .fp{line-height:0;background:#fff}.fc .fp svg{display:block;width:100%;height:auto}
.fc .fn{padding:4px 8px;font-weight:700;font-size:13px}
.fc .fr{padding:0 8px 6px;color:var(--muted)}
.fc.no .fp{display:grid;place-items:center;aspect-ratio:3/2;background:var(--pick);font-size:28px;line-height:1;color:var(--muted)}
.list{display:grid;gap:8px}
.st{border:2px solid var(--rule);background:var(--surface);border-radius:10px;padding:8px;cursor:pointer;text-align:left;display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--fg)}
.st:hover{border-color:var(--ink)}
.st .th{flex:none;width:96px;border-radius:6px;overflow:hidden;line-height:0;border:1px solid var(--rule);background:#fff}
.st .th svg{width:96px;height:64px;display:block}
.st .no{display:block;font-size:12px;font-weight:700;color:var(--seal);letter-spacing:.08em;line-height:1.4}
.st .nm{font-weight:700;font-size:17px;display:block;line-height:1.45}
.st .ds{font-size:13px;color:var(--muted);display:block;line-height:1.6}
.st .bd{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:0 10px;margin-top:2px}
.st .bd.ok{background:var(--oksoft);color:var(--ok)}
.st .bd.new{background:var(--pick);color:var(--muted)}
.st.lockd{opacity:.78}
.st.lockd .th,.st.soon .th{display:grid;place-items:center;height:64px;background:var(--pick);font-size:24px;line-height:1}
.st.soon{opacity:.55;cursor:default}
.free{border:1px dashed var(--seal);border-radius:8px;padding:8px 12px;font-size:14px;margin:0;background:var(--sealsoft)}
.cnt{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.cnt small{font-size:13px;color:var(--muted);font-family:var(--body)}
details.cards summary{cursor:pointer;font-weight:700;font-size:14px}
.paid{display:flex;flex-direction:column;gap:2px;border:2px solid var(--seal);border-radius:8px;padding:12px 14px;text-decoration:none;color:var(--fg);background:var(--sealsoft)}
.paid .pt{font-size:15px} .paid .pt b{font-family:var(--display);font-weight:400;color:var(--seal)}
.paid .pd{font-size:13px;color:var(--muted)}
.lock input{font:inherit;font-size:20px;padding:10px 12px;border:2px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--fg);width:100%;box-sizing:border-box}
.err{color:var(--ng);font-size:14px;margin:0;min-height:1.5em}
.shop{background:var(--pick);border-radius:8px;padding:12px 14px;font-size:14px}
.shop a{color:var(--seal);font-weight:700}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}.op:active{transform:none}}
</style>

<div class="wrap">
  <header>
    <h1><small>公民ゲーム</small>しくみになりきろう<span class="ns">（政治・裁判） 全10章</span></h1>
    <p class="lead">選挙から国会・内閣・裁判・地方自治・国連まで、全10章。しくみの中の人になりきって、次にどうなるかを選ぼう。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=true;
let ST=[];
const TITLES=[["senkyo",1,"はじめての選挙","選挙",["18歳の高校生 ひなたさん","選挙管理委員会の職員 けんさん","高校の新聞部員 あおいさん"],true],["shugiin",2,"法律ができるまで","国会（立法）",["衆議院議員 さくらさん","衆議院の委員長 たかぎさん","参議院議員 ゆうきさん"],true],["sangiin",3,"参議院と二院制","国会（立法）",["参議院議員 みどりさん","衆議院議員 だいちさん","参議院議員 そらさん"],true],["yosan",4,"予算ができるまで","国会と内閣（財政）",["財務省の職員 みなとさん","衆議院議員 はるとさん","参議院議員 れいさん","会計検査院の職員 しおりさん"],true],["naikaku",5,"内閣のしごと","内閣（行政）",["衆議院議員 かいさん","内閣総理大臣 あおばさん","文部科学大臣 しずくさん"],true],["minji",6,"民事裁判","裁判所（司法）",["工務店の社長 みのるさん","地方裁判所の裁判官 あおいさん","家の持ち主 ふみさん"],true],["saibanin",7,"裁判員裁判","裁判所（司法）",["裁判員 ゆいさん","検察官 ごうさん","弁護人 なおさん"],true],["saikousai",8,"憲法の番人と三権分立","裁判所（司法）と三権分立",["地方裁判所の裁判官 りょうさん","最高裁判所の裁判官 なぎささん","衆議院議員 けいさん","有権者 まこさん"],true],["chihou",9,"市のしくみと住民の力","地方自治",["市議会議員 なつきさん","市長 たくみさん","市民 はるかさん"],true],["kokuren",10,"国連の会議","国際社会",["日本の外交官 みさきさん","ユニセフの職員 りくさん","ユネスコの職員 ゆいさん"],true]];
const app=document.getElementById('app');
const RB=/(?:｜([^｜《》]+)|([一-鿿々〆ヶ]+))《([^《》]+)》/g;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rb=s=>esc(s).replace(RB,(m,a,b,r)=>'<ruby>'+(a||b)+'<rt>'+r+'</rt></ruby>');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const PAIDLINK="<a class=\"paid\" href=\"shikumi-full.html\" id=\"paid-link\"><span class=\"pt\">ほかのしくみもやりたい人へ　<b>しくみになりきろう 全10章</b>（有料版）</span><span class=\"pd\">無料版の第2章もふくむ全10章。選挙、参議院、予算、内閣、民事裁判、裁判員裁判、最高裁判所と三権分立、地方自治、国連まで。役わりカード集めつき。</span></a>";

/* ST=章 [{id,no,title,area,sub,start,len,roles:[[名前,よみ,仕事,絵]],flow:[手続き],words:[[用語,説明]],
         sc:{場面id:{k:n/q/x/e,t:文,p:絵,nx:次,a:問い,c:[[ことば,行き先,icon?]],h:覚えておこう,l:まとめ,n:何番目,w:役わり,y:札}}}]
   TITLES=[[id,第何章,題名,しくみ,[役わり名],できているか]] */
const REC='shikumi-p-rec', CARDK='shikumi-cards';
let rec=store.get(REC,{}); if(!rec||typeof rec!=='object'||Array.isArray(rec))rec={}; const saveRec=()=>store.set(REC,rec);
let cards=store.get(CARDK,{}); if(!cards||typeof cards!=='object'||Array.isArray(cards))cards={};
const bump=(id,i)=>{const r=Array.isArray(rec[id])?rec[id]:[0,0];r[i]++;rec[id]=r;saveRec();};
const ckey=(id,nm)=>id+':'+nm;
const collect=(id,nm)=>{const k=ckey(id,nm);const isNew=!cards[k];if(isNew){cards[k]=Date.now();store.set(CARDK,cards);}return isNew;};
const ALLROLE=TITLES.flatMap(t=>t[4].map(nm=>ckey(t[0],nm)));
const nCards=()=>ALLROLE.filter(k=>cards[k]).length;
const fy=y=>typeof y==='number'?y+'年':String(y);
let G=null;
const top0=()=>{try{const y=app.getBoundingClientRect().top+window.scrollY-8;if(window.scrollY>y)window.scrollTo(0,y);}catch(e){}};
const roleOf=(s,nm)=>s.roles.find(f=>f[0]===nm)||[nm,'','',''];
const roleCard=(s,f)=>{const got=!!cards[ckey(s.id,f[0])];
  return got?`<div class="fc"><span class="fp">${f[3]}</span><span class="fn">${esc(f[0])}</span><span class="fr">${rb(f[2])}</span></div>`
            :`<div class="fc no"><span class="fp">？</span><span class="fn">？？？</span><span class="fr">第${s.no}章「${rb(s.title)}」</span></div>`;};
function home(){
  G=null;
  const row=([id,no,title,area,roles,ok])=>{const s=ST.find(c=>c.id===id);
    if(s){const r=rec[id]||[0,0];
      return `<button class="st" data-id="${id}"><span class="th">${s.sc[s.start].p}</span><span><span class="no">第${no}章　${rb(area)}</span><span class="nm">${rb(title)}</span>
        <span class="ds">${s.roles.map(f=>esc(f[0])).join(' → ')}</span>
        ${r[0]?`<span class="bd ok">✓ クリア${r[0]>1?'（'+r[0]+'回）':''}</span>`:'<span class="bd new">まだ</span>'}${r[1]?` <span class="note" style="display:inline">ゲームオーバー ${r[1]}回</span>`:''}</span></button>`;}
    if(!PAID)return `<a class="st lockd" href="shikumi-full.html"><span class="th">🔒</span><span><span class="no">第${no}章　${rb(area)}</span><span class="nm">${rb(title)}</span><span class="ds">利用コードで遊べます</span></span></a>`;
    return `<div class="st soon"><span class="th">⏳</span><span><span class="no">第${no}章　${rb(area)}</span><span class="nm">${rb(title)}</span><span class="ds">じゅんび中</span></span></div>`;};
  const has=t=>ST.some(c=>c.id===t[0]);
  const rows=PAID?TITLES.map(row).join(''):TITLES.filter(has).map(row).join('')+`<div class="label" style="margin-top:6px">利用コードで遊べる章</div>`+TITLES.filter(t=>!has(t)).map(row).join('');
  const total=ALLROLE.length, got=nCards();
  const gal=ST.map(s=>s.roles.map(f=>roleCard(s,f)).join('')).join('');
  const done=ST.filter(s=>(rec[s.id]||[0])[0]>0).length;
  app.innerHTML=`<div class="label">あそびかた</div>
    <p style="margin:0">章をえらぶと、国会・内閣・裁判所などで はたらく人（架空の人）になりきります。場面ごとに「次にどうなる？どうする？」を選ぼう。実際のしくみのとおりに選ぶと話が続き、ちがうと「実際のしくみでは…」で本当の手続きと理由がわかります。とちゅうで役わりが交代します。</p>
    <div class="row" style="justify-content:space-between"><span class="label" style="color:var(--fg)">集めた役わりカード</span><span class="cnt">${got}<small> / ${total}まい</small></span></div>
    <details class="cards"><summary>役わりカードを見る</summary><div class="figrow" style="margin-top:8px">${gal}</div></details>
    <div class="row" style="justify-content:space-between"><span class="label">章をえらぶ</span><span class="note">クリアした章 ${done} / ${ST.length}</span></div>
    ${PAID?'':`<p class="free">第${ST.map(s=>s.no).join('・')}章は無料。🔒の章は<b>利用コードで全${TITLES.length}章</b>遊べます。</p>`}
    <div class="list">${rows}</div>${PAID?`<div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`:PAIDLINK}`;
  app.querySelectorAll('button.st').forEach(b=>b.onclick=()=>play(ST.find(s=>s.id===b.dataset.id)));
  const rs=document.getElementById('reset');
  if(rs)rs.onclick=()=>{document.getElementById('resetq').innerHTML='本当に消しますか？（役わりカードも消えます） <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
    document.getElementById('yes').onclick=()=>{rec={};saveRec();cards={};store.set(CARDK,cards);home();};document.getElementById('no').onclick=home;};
}
function play(s){ G={s:s,who:null,from:null,pick:'',overs:0}; track('level_start',{level_name:'shikumi-'+s.id}); show(s.start); }
function head(o){ const n=(o&&o.n)||0; return `<div class="top"><button class="linkbtn" id="back">← 章をえらぶ</button><div class="prog" aria-hidden="true"><i style="width:${Math.round(n/G.s.len*100)}%"></i></div>${G.who?`<span class="whochip">${esc(G.who)}</span>`:''}</div>`; }
function show(id){
  const s=G.s, o=s.sc[id];
  if(o.k==='x')return over(o);
  if(o.w&&o.w!==G.who)return switchCard(id);
  if(o.k==='e')return ending(o);
  render(id);
}
function switchCard(id){
  const s=G.s, o=s.sc[id], prev=G.who, f=roleOf(s,o.w);
  if(prev)collect(s.id,prev);
  G.who=o.w;
  const nth=s.roles.findIndex(x=>x[0]===o.w)+1;
  app.innerHTML=`${head(o)}<div class="sw" role="group" aria-label="役わりの交代">
    <div class="swl">第${s.no}章　${rb(s.title)}　${nth?nth+'つめの役わり':''}</div>
    ${prev?`<p class="got">✓「${esc(prev)}」の役わりカードを手に入れた！</p>`:''}
    <div class="swp">${f[3]}</div>
    <p class="swt">${prev?'ここからは、あなたは':'あなたは'}</p>
    <p class="swy">${esc(f[1])}</p><p class="swn">${esc(f[0])}。</p>
    <p class="swr">${rb(f[2])}</p>
    <button class="btn go" id="nx">この役わりで進む ▶</button></div>`;
  document.getElementById('back').onclick=home;
  const nx=document.getElementById('nx'); nx.onclick=()=>o.k==='e'?ending(o):render(id);
  top0(); nx.focus({preventScroll:true});
}
function render(id){
  const s=G.s, o=s.sc[id];
  const ch=o.k==='q'?shuffle(o.c):null;
  app.innerHTML=`${head(o)}${o.y!=null?`<span class="yr">${esc(fy(o.y))}</span>`:''}<div class="pic">${o.p}</div><p class="txt">${rb(o.t)}</p>
    ${o.k==='q'?`<p class="ask">${rb(o.a)}</p><div class="ch">${ch.map((c,i)=>`<button class="op" data-i="${i}"><span class="k">${'アイウ'[i]}</span>${c[2]?`<span class="ic">${c[2]}</span>`:''}<span>${rb(c[0])}</span></button>`).join('')}</div>`
      :`<div class="row"><button class="btn go" id="nx">次へ ▶</button></div>`}`;
  document.getElementById('back').onclick=home;
  if(ch)app.querySelectorAll('.op').forEach(b=>b.onclick=()=>{const c=ch[+b.dataset.i];const ok=s.sc[c[1]].k!=='x';
    track('answer_question',{category:'shikumi-'+s.id,question:id,correct:ok});
    if(!ok){G.from=id;G.pick=c[0];G.overs++;bump(s.id,1);} show(c[1]);});
  else document.getElementById('nx').onclick=()=>show(o.nx);
  top0();
}
function over(o){
  const s=G.s;
  app.innerHTML=`${head(s.sc[G.from]||{})}<div class="over"><h2>おっと、実際のしくみとちがうよ！</h2>
    <p class="pick">あなたが選んだのは：<b>${rb(G.pick)}</b></p>
    <div class="pic">${o.p}</div><p class="txt">${rb(o.t)}</p>${o.h?`<p class="hint"><b>覚えておこう</b>${rb(o.h)}</p>`:''}
    <div class="row"><button class="btn go" id="retry">この場面からやりなおす</button><button class="btn" id="first">最初から</button></div>
    <div><button class="linkbtn" id="list">章をえらぶ</button></div></div>`;
  document.getElementById('back').onclick=home;
  const rt=document.getElementById('retry');rt.onclick=()=>render(G.from);
  document.getElementById('first').onclick=()=>{G.who=null;show(s.start);};
  document.getElementById('list').onclick=home;
  top0(); rt.focus({preventScroll:true});
}
function ending(o){
  const s=G.s, stars=G.overs===0?3:G.overs<=2?2:1;
  if(G.who)collect(s.id,G.who);
  bump(s.id,0);
  track('level_end',{level_name:'shikumi-'+s.id,success:true,score:stars});
  const ix=ST.indexOf(s), nx=ST[ix+1];
  app.innerHTML=`${head(o)}<p class="endh">🎉 第${s.no}章「${rb(s.title)}」クリア！</p>${o.y!=null?`<span class="yr">${esc(fy(o.y))}</span>`:''}<div class="pic">${o.p}</div><p class="txt">${rb(o.t)}</p>
    <p class="lesson"><b>この章のまとめ</b>${rb(o.l)}</p>
    <div class="row"><span class="stars" aria-label="星 ${stars}こ">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</span><span class="note">${G.overs?'ゲームオーバー '+G.overs+'回。次はノーミスをめざそう！':'ノーミスで最後まで進めた！'}</span></div>
    <div class="label">しくみの流れ　${rb(s.area)}</div>
    <ol class="flow">${s.flow.map(e=>`<li>${rb(e)}</li>`).join('')}</ol>
    <div class="label">受験で出る用語</div>
    <ul class="words">${s.words.map(w=>`<li><b>${rb(w[0])}</b>${rb(w[1])}</li>`).join('')}</ul>
    <div class="label">なりきった役わり（役わりカード ${nCards()} / ${ALLROLE.length}まい）</div><div class="figrow">${s.roles.map(f=>roleCard(s,f)).join('')}</div>
    <div class="row">${nx?`<button class="btn go" id="next">次の章「${rb(nx.title)}」</button>`:''}<button class="btn${nx?'':' go'}" id="list">章をえらぶ</button><button class="linkbtn" id="again">もう一度この章を</button></div>${PAID?'':PAIDLINK}`;
  document.getElementById('back').onclick=home;
  if(nx)document.getElementById('next').onclick=()=>play(nx);
  document.getElementById('list').onclick=home;
  document.getElementById('again').onclick=()=>play(s);
  top0();
}
async function decrypt(){ return mnAccess.load('shikumi'); }
function lockScreen(err){ mnAccess.lock(app,{game:'shikumi',err:err,free:'shikumi.html',onOpen:async()=>{ ST=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ ST=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
