<meta name="game:subject" content="社会">

<style>

:root{
  --bg:#f2f5f8; --surface:#ffffff; --fg:#1f2a37; --muted:#5d6878; --rule:#d5dce5;
  --sea:#e3eef7; --land:#ffffff; --edge:#8a95a3; --ink:#1f4e8c; --hit:#e0602f; --hitsoft:#fbe6dc; --line:#d23b3b;

  --display:"Dela Gothic One","Hiragino Kaku Gothic StdN",sans-serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151d; --surface:#18202b; --fg:#e4e9f1; --muted:#9aa6b8; --rule:#2a3546;
  --sea:#142436; --land:#2a3442; --edge:#6d798c; --ink:#8fb0f0; --hit:#f08a5d; --hitsoft:#3a261d; --line:#ff7a6e;
  --ok:#4cc184; --oksoft:#1b3326; --ng:#f07468; --ngsoft:#3a2220; --gold:#e1b44a; --pick:#222c3a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151d; --surface:#18202b; --fg:#e4e9f1; --muted:#9aa6b8; --rule:#2a3546;
  --sea:#142436; --land:#2a3442; --edge:#6d798c; --ink:#8fb0f0; --hit:#f08a5d; --hitsoft:#3a261d; --line:#ff7a6e;
  --ok:#4cc184; --oksoft:#1b3326; --ng:#f07468; --ngsoft:#3a2220; --gold:#e1b44a; --pick:#222c3a; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 72px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,7.5vw,40px);line-height:1.15;margin:0;color:var(--ink)}
h1 small{display:block;font-family:var(--body);font-weight:700;font-size:14px;color:var(--hit);letter-spacing:.2em;margin-bottom:4px}
.lead{margin:4px 0 0;color:var(--muted);font-size:14px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.label{font-size:12px;font-weight:700;color:var(--hit);letter-spacing:.1em}
.top{display:flex;align-items:center;gap:10px}
.prog{flex:1;height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--hit)}
.nums{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.tag{font-size:12px;font-weight:700;color:var(--ink);border:1px solid var(--ink);border-radius:4px;padding:0 6px;white-space:nowrap}
.q{margin:0;font-size:18px;font-weight:700}
.q b{color:var(--hit);font-size:22px}
.mapwrap{background:var(--sea);border-radius:10px;overflow:hidden}
.mapwrap svg{display:block;width:100%;height:auto}
.mapwrap path{fill:var(--land);stroke:var(--edge);stroke-width:.6;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.mapwrap path.hit{fill:var(--hit)}
.mapwrap path.right{fill:var(--ok)}
.mapwrap .pin{fill:none;stroke:var(--hit);stroke-width:2.5;vector-effect:non-scaling-stroke}
.mapwrap .pin.ok{stroke:var(--ok)}
.mapwrap .ln{stroke:var(--line);stroke-width:2.5;vector-effect:non-scaling-stroke}
.mapwrap .mk{fill:var(--hit);stroke:var(--surface);stroke-width:1.5;vector-effect:non-scaling-stroke;paint-order:stroke}
.mapwrap .capdot{fill:var(--fg);stroke:var(--surface);stroke-width:2;vector-effect:non-scaling-stroke}
.mapwrap .caplb{fill:var(--fg);font-family:var(--body);font-weight:700;stroke:var(--surface);stroke-width:3;paint-order:stroke;vector-effect:non-scaling-stroke}
.flagq{display:flex;justify-content:center;padding:8px 0}
.flagq img{width:min(240px,70%);aspect-ratio:4/3;border:1px solid var(--rule);border-radius:4px;box-shadow:0 2px 8px rgb(0 0 0 / .12);background:#fff}
.mini{width:54px;aspect-ratio:4/3;border:1px solid var(--rule);border-radius:3px;vertical-align:middle;background:#fff}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ch{border:2px solid var(--rule);background:var(--surface);border-radius:8px;padding:12px 8px;font-weight:700;font-size:17px;line-height:1.4;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.choices.long{grid-template-columns:1fr}
.choices.long .ch{font-size:16px;text-align:left;padding:10px 14px}
.ch:hover:not(:disabled){border-color:var(--ink);background:var(--pick)}
.ch:disabled{cursor:default;opacity:.45}
.ch.right{opacity:1;border-color:var(--ok);background:var(--oksoft);color:var(--ok)}
.ch.wrong{opacity:1;border-color:var(--ng);background:var(--ngsoft);color:var(--ng)}
.note{font-size:13px;color:var(--muted);margin:0}
.card{border:2px solid var(--ok);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card.ng{border-color:var(--ng)}
.card .v{font-family:var(--display);font-size:20px}
.card .v.ok{color:var(--ok)} .card .v.ng{color:var(--ng)}
.card .info{display:flex;gap:12px;align-items:center}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:0 12px;margin:0;font-size:15px}
.card dt{color:var(--muted);font-weight:700}
.card dd{margin:0;font-weight:700}
.card .tip{border-left:4px solid var(--hit);padding-left:10px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:8px;padding:10px 20px;font-weight:700;cursor:pointer;background:var(--pick)}
.btn.go{background:var(--fg);color:var(--surface)}
.howto{margin:0;padding-left:1.3em;font-size:15px;display:grid;gap:4px}
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.big{font-family:var(--display);font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:20px;font-family:var(--body)}
.rank{width:92px;height:92px;border-radius:50%;border:5px solid var(--hit);color:var(--hit);display:grid;place-items:center;font-family:var(--display);font-size:20px;transform:rotate(-10deg)}
.rv{border:1px solid var(--rule);border-radius:8px;padding:10px 14px;font-size:14px;background:var(--surface)}
.rv b{color:var(--ok)}
.src{font-size:12px;color:var(--muted);margin:0}
.paid{display:flex;flex-direction:column;gap:2px;border:2px solid var(--hit);border-radius:8px;padding:12px 14px;text-decoration:none;color:var(--fg);background:var(--hitsoft)}
.paid .pt{font-size:15px} .paid .pt b{font-family:var(--display);font-weight:400;color:var(--hit)}
.paid .pd{font-size:13px;color:var(--muted)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.cats{grid-template-columns:1fr}}
.cat{border:2px solid var(--rule);background:var(--surface);border-radius:8px;padding:12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.cat:hover:not(:disabled){border-color:var(--ink)}
.cat:disabled{opacity:.4;cursor:default}
.cat .nm{font-weight:700;font-size:17px}
.cat .ds{font-size:12px;color:var(--muted);line-height:1.5}
.cat .best{font-size:12px;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.lock input{font:inherit;font-size:20px;padding:10px 12px;border:2px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--fg);width:100%;box-sizing:border-box}
.err{color:var(--ng);font-size:14px;margin:0;min-height:1.5em}
.shop{background:var(--pick);border-radius:8px;padding:12px 14px;font-size:14px}
.shop a{color:var(--hit);font-weight:700}
.master{display:flex;flex-direction:column;gap:6px}
.master .tp{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.master .cnt{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.master .cnt small{font-size:14px;color:var(--muted);font-family:var(--body)}
.mbar{height:10px;background:var(--rule);border-radius:5px;overflow:hidden;display:flex}
.mbar i{display:block;height:100%}
.mbar .m{background:var(--ok)} .mbar .w2{background:var(--gold)}
.mleg{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.mleg span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle;background:var(--c)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
</style>

/* ---------- 地図 ---------- */
const W=MAP.w, H=MAP.h;
function viewFor(k){
  const b=MAP.bb[k], cx=(b[0]+b[2])/2, cy=(b[1]+b[3])/2;
  let w=Math.max((b[2]-b[0])*1.7,(b[3]-b[1])*1.7*4/3,120); w=Math.min(w,W,H*4/3);
  const h=w*3/4;
  const x=Math.min(Math.max(cx-w/2,0),W-w), y=Math.min(Math.max(cy-h/2,0),H-h);
  return [x,y,w,h];
}
function mapSVG(o){
  /* o: {k:中心にする国, hl:[色をつける国], cls:'hit'|'right', ln, mk, cap:[x,y,名前]} */
  const vb=o.k?viewFor(o.k):[0,0,W,H], u=vb[2]/320;
  const hl=new Set(o.hl||[]);
  const paths=Object.keys(MAP.paths).map(k=>`<path d="${MAP.paths[k]}"${hl.has(k)?` class="${o.cls||'hit'}"`:''}/>`).join('');
  let extra='';
  (o.hl&&o.hl.length<=5?o.hl:[]).forEach(k=>{const b=MAP.bb[k]; if(!b)return; const s=Math.max(b[2]-b[0],b[3]-b[1]);
    if(s<vb[2]/28) extra+=`<circle class="pin ${o.cls==='right'?'ok':''}" cx="${(b[0]+b[2])/2}" cy="${(b[1]+b[3])/2}" r="${s/2+u*12}"/>`;});
  const L=o.ln||'';
  if(L.includes('eq')) extra+=`<line class="ln" x1="0" x2="${W}" y1="${MAP.ln.eq[1]}" y2="${MAP.ln.eq[1]}"/>`;
  ['pm','dl','135'].forEach(n=>{ if(L===n||(n==='pm'&&L==='eqpm')) extra+=`<line class="ln" y1="0" y2="${H}" x1="${MAP.ln[n][1]}" x2="${MAP.ln[n][1]}"/>`; });
  if(o.mk) extra+=`<text class="mk" x="${o.mk[0]}" y="${o.mk[1]}" font-size="${u*30}" text-anchor="middle" dominant-baseline="central">★</text>`;
  if(o.cap){ const tw=o.cap[2].length*u*14, rt=o.cap[0]+u*7+tw>vb[0]+vb[2];
    extra+=`<circle class="capdot" cx="${o.cap[0]}" cy="${o.cap[1]}" r="${u*4}"/><text class="caplb" x="${rt?o.cap[0]-u*7:o.cap[0]+u*7}" text-anchor="${rt?'end':'start'}" y="${o.cap[1]-u*6}" font-size="${u*14}">${esc(o.cap[2])}</text>`; }
  return `<div class="mapwrap"><svg viewBox="${vb.map(v=>+v.toFixed(1)).join(' ')}" role="img" aria-label="世界地図">${paths}${extra}</svg></div>`;
}
const contHL=c=>MAP.cont[c]||[];
const flagImg=(k,cls)=>`<img class="${cls}" src="${FLAGS[k]}" alt="国旗">`;

function start(list){ G={list,i:0,score:0,miss:[],n:list.length}; track('level_start',{level_name:(PAID?SP+'-p-':SP+'-')+course}); newQ(); }
function newQ(){ const q=G.list[G.i]; G.ch=shuffle([q.a,...q.d]); G.done=false; G.pick=null; render(); }
function qText(q){
  if(q.c==='name')return '地図で色がついている国はどこですか。';
  if(q.c==='cap')return `<b>${esc(CO[q.k].n)}</b> の首都はどこですか。`;
  if(q.c==='flag')return 'この国旗は、どこの国の国旗ですか。';
  return esc(q.q);
}
function figure(q,d){
  const c=q.k&&CO[q.k];
  if(q.c==='name') return mapSVG({k:q.k,hl:[q.k],cls:d?'right':'hit',cap:d?[...c.cp,c.cap]:null});
  if(q.c==='cap') return mapSVG({k:q.k,hl:[q.k],cls:d?'right':'hit',cap:d?[...c.cp,c.cap]:null});
  if(q.c==='flag') return d?mapSVG({k:q.k,hl:[q.k],cls:'right',cap:[...c.cp,c.cap]}):`<div class="flagq">${flagImg(q.k,'')}</div>`;
  const v=q.v||{};
  if(q.c==='geo'){
    const hl=v.cont?contHL(v.cont):(v.hl||[]);
    const showHl=v.cont||d;   /* 大陸は問題として色をつける。国の色は答えのあとに */
    if(!v.cont&&!v.ln&&!v.mk&&!(d&&v.hl)) return '';
    return mapSVG({hl:showHl?hl:[],cls:v.cont?'hit':'right',ln:v.ln,mk:v.mk});
  }
  if(q.c==='trade') return d&&v.hl?mapSVG({hl:v.hl,cls:'right'}):'';
  return '';
}
function render(){
  const q=G.list[G.i], d=G.done, long=G.ch.some(c=>c.length>9);
  app.innerHTML=`<div class="top"><div class="prog" aria-hidden="true"><i style="width:${G.i/G.n*100}%"></i></div><span class="nums">${G.i+1} / ${G.n}</span><span class="tag">${CATS[q.c][0]}・${LVN[q.lv]}</span></div>
    <p class="q">${qText(q)}</p>
    ${figure(q,d)}
    <div class="choices ${long?'long':''}">${G.ch.map((c,i)=>`<button class="ch ${d?(c===q.a?'right':c===G.pick?'wrong':''):''}" data-i="${i}" ${d?'disabled':''}>${esc(c)}</button>`).join('')}</div>
    <div id="after"></div>`;
  app.querySelectorAll('.ch').forEach(b=>b.onclick=()=>pick(G.ch[+b.dataset.i]));
  if(d)explain();
}
function pick(c){
  if(G.done)return;
  const q=G.list[G.i];
  G.done=true; G.pick=c; G.ok=c===q.a; G.newM=record(q,G.ok);
  if(G.ok)G.score++; else G.miss.push(q);
  track('answer_question',{category:SP+'-'+q.c,question:(q.k?q.c+':'+CO[q.k].n:q.q).slice(0,90),correct:G.ok});
  render();
}
function explain(){
  const q=G.list[G.i], last=G.i===G.n-1, c=q.k&&CO[q.k];
  document.getElementById('after').innerHTML=`<div class="card ${G.ok?'':'ng'}">
    <span class="v ${G.ok?'ok':'ng'}">${G.ok?'正解！':'ざんねん'}　${esc(q.a)}${G.newM?'<span style="font-size:13px;margin-left:8px;color:var(--ok);font-family:var(--body);font-weight:700">覚えた！</span>':''}</span>
    ${G.ok?'':`<p class="note" style="color:var(--ng);font-weight:700">あなたがえらんだのは「${esc(G.pick)}」です。</p>`}
    ${c?`<div class="info">${flagImg(q.k,'mini')}<dl><dt>国名</dt><dd>${esc(c.n)}</dd><dt>首都</dt><dd>${esc(c.cap)}</dd><dt>州</dt><dd>${esc(REGS[c.reg])}</dd></dl></div>`:''}
    <div class="tip">${esc(q.e)}</div>
    ${c&&q.c!=='name'?`<p class="note">${esc(c.t)}</p>`:''}
    <div class="row"><button class="btn go" id="next">${last?'結果を見る':'次の問題へ'}</button></div></div>`;
  const nx=document.getElementById('next'); nx.onclick=next; nx.focus({preventScroll:true});
}
function next(){ if(++G.i<G.n)newQ(); else result(); }
function result(){
  const n=G.n,s=G.score,r=s/n;
  const rank=r===1?'満点':r>=.8?'特選':r>=.6?'入選':r>=.4?'佳作':'もう一歩';
  track('level_end',{level_name:(PAID?SP+'-p-':SP+'-')+course,success:s===n,score:s,total:n});
  const bk=PAID?(['weak','fresh','retry'].includes(course)?null:course):'free';
  if(bk&&(best[bk]==null||s>best[bk])){best[bk]=s;store.set(PAID?SP+'-p-best':SP+'-best',best);}
  const lab=q=>q.k?`${CATS[q.c][0]}：${esc(CO[q.k].n)}`:esc(q.q);
  app.innerHTML=`<div class="label">結果</div>
    <div class="score"><div class="big">${s}<small> / ${n}問</small></div><div class="rank">${rank}</div></div>
    <p style="margin:0">${r===1?'全問正解！世界の国々はばっちりです。':r>=.6?'よくできました。まちがえた国は、地図で場所を確かめておこう。':'国の場所・首都・国旗を、いっしょに覚えると忘れにくくなります。'}</p>
    <div class="row"><button class="btn go" id="again">${PAID?'コースをえらぶ':'もう一度'}</button>${G.miss.length?'<button class="btn" id="retry">まちがえた問題だけ</button>':''}</div>
    ${PAID?'':PAIDLINK}
    ${G.miss.length?`<div class="label" style="color:var(--fg)">まちがえた問題</div>${G.miss.map(q=>`<div class="rv">${lab(q)}<br>→ <b>${esc(q.a)}</b></div>`).join('')}`:''}`;
  document.getElementById('again').onclick=()=>PAID?home():(course='free',start(shuffle(QS)));
  const rt=document.getElementById('retry'); if(rt)rt.onclick=()=>{course='retry';start(shuffle(G.miss));};
}
(async()=>{
  if(!PAID){ home(); return; }
  try{ unlock(await decrypt()); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
