const SIM=(function(){

  }
  function envOf(G,st,alloc,yrs,year){

  app.innerHTML=`${head()}<p class="endh">🎉 シナリオ${s.no}「${rb(s.title)}」おしまい！</p>
    <div class="rank"><span class="rp">${rk.pic}</span><div><span class="label">あなたは</span><p class="rn">${esc(rk.name)}</p><p class="note" style="color:var(--fg)">${esc(rk.t)}</p>${isNew?'<p class="got">✓ 新しいはんこを手に入れた！</p>':''}
      <span class="stars" aria-label="星 ${stars}こ">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</span></div></div>
    <div class="label">通信簿　あなたの${REALM} と ${REALW}</div><div class="axes">${axes}</div>
    <div class="label">はじめ → おわり</div><table class="chg">${cmp}</table>
    <p class="lesson"><b>まとめ</b>${rb(s.real_end)}</p>
    <div class="label">年表　${esc(s.years)}</div><dl class="timeline">${nen.map(e=>`<dt>${esc(e[0])}</dt><dd>${rb(e[1])}</dd>`).join('')}</dl>
    <div class="label">${esc(G.words_label||'用語')}</div><ul class="words">${s.words.map(w=>`<li><b>${rb(w[0])}</b>${rb(w[1])}</li>`).join('')}</ul>
    <div class="row">${nx?`<button class="btn go" id="next">次のシナリオ「${rb(nx.title)}」</button>`:''}<button class="btn${nx?'':' go'}" id="list">シナリオ一覧</button><button class="linkbtn" id="again">もう一度このシナリオを</button></div>${PAID?'':PAIDLINK}`;
  on('back',home); on('list',home); on('again',()=>intro(s)); if(nx)on('next',()=>intro(nx));
  top0();
}
return {home:home};
})();
async function decrypt(){ return mnAccess.load(GAME.id); }
function lockScreen(err){ mnAccess.lock(app,{game:GAME.id,err:err,free:GAME.id+'.html',onOpen:async()=>{ SCN=await decrypt(); UI.home(); }}); }
(async()=>{
  if(!PAID){ UI.home(); return; }
  try{ SCN=await decrypt(); UI.home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
