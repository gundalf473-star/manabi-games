  const r=SIM.step(G,s,st,Object.assign({},P.alloc),P.tax,true);
  const rows=MAIN.concat(SUB).map(x=>{const d=st.v[x.k]-before[x.k];const small=Math.abs(d)<0.5*Math.pow(10,-x.d);
    return `<tr><th>${esc(x.name)}</th><td>${fmt(x.k,before[x.k])}</td><td>→</td><td><b>${fmt(x.k,st.v[x.k])}</b>${esc(x.unit)}</td><td class="${small?'eq':d>0?'up':'dn'}">${small?'±0':(d>0?'+':'')+fmt(x.k,d)}</td></tr>`;}).join('');
  const E=T.ev;
  const evh=E?`<div class="evc"><span class="yr">${yf(E.y)}年</span><h2 class="nt">${rb(E.title)}</h2><div class="pic">${E.pic}</div><p class="txt">${rb(E.t)}</p>${r.case?`<p class="case">${rb(r.case)}</p>`:''}</div>`:'';
  if(r.fail)return fail(r,evh);
  const last=st.done;
  app.innerHTML=`${head()}<span class="yr">${yspan(T.y,T.yrs)} の結果</span>${evh}
    <div class="label">${T.yrs>1?T.yrs+'年間で':'この1年で'}、${REALM}はこう変わった</div><table class="chg">${rows}</table>
    <div class="pic map">${G.map}</div>
    <div class="row"><button class="btn go" id="nx">${last?'通信簿を見る ▶':'次へ ▶'}</button></div>`;
  paintMap(app,st);
  on('back',home); on('nx',last?report:news); top0();
}
/* ---- 失敗（やさしい説明と、3ターン前から） ---- */
function fail(r,evh){
  const s=P.s, f=G.fails.find(x=>x.k===r.fail), ti=P.st.log[P.st.log.length-1].t, back=Math.max(0,ti-2);
  bump(s.id,1);
  app.innerHTML=`${head()}${evh}<div class="over"><h2>${rb(f.title)}</h2><div class="pic">${f.pic}</div><p class="txt">${rb(f.t)}</p>
    <div class="real"><b>実際にも…</b><p>${rb(s.fail_t[f.k].replace(/^実際にも、?/,''))}</p></div>
    <p class="note">このシナリオは、ここで終わりです。でも、だいじょうぶ。配り方を変えて、もう一度ためしてみよう。</p>
    <div class="row"><button class="btn go" id="retry">${ti-back+1}ターン前（${yf(s.turns[back].y)}年）からやりなおす</button><button class="btn" id="first">最初から</button></div>
    <div><button class="linkbtn" id="list">シナリオ一覧</button></div></div>`;
  on('back',home); on('list',home);
  on('retry',()=>restore(back)); on('first',()=>restore(0));
  top0(); const b=document.getElementById('retry'); b&&b.focus({preventScroll:true});
}
function restore(i){const sn=P.snaps[i];P.st=clone(sn.st);P.alloc=clone(sn.alloc);P.tax=P.st.tax;P.snaps=P.snaps.slice(0,i);news();}
/* ---- 通信簿 ---- */
function report(){
  const s=P.s, st=P.st, rep=SIM.report(G,st), rk=G.ranks.find(x=>x.k===rep.rank)||G.ranks[G.ranks.length-1];
  const key=s.id+':'+rk.k, isNew=!stamps[key]; if(isNew){stamps[key]=Date.now();store.set(STK,stamps);}
  bump(s.id,0);
  const tot=rep.axes.reduce((a,x)=>a+x[2],0), stars=tot>=6?3:tot>=3?2:1;
  track('level_end',{level_name:ID+'-'+s.id,success:true,score:stars});
  const mark=['△ もう少し','○ ふつう','◎ よくできた'];
  const axes=rep.axes.map((a,i)=>`<div class="ax"><div class="axh"><b>${esc(a[0])}</b><span class="g g${a[2]}">${mark[a[2]]}</span></div>
     <span class="bar big" aria-hidden="true"><i style="width:${Math.round(a[1])}%"></i></span><p class="axs">${esc(G.axes[i].say||'')}</p>
     <p class="axr"><b>${REALW}では</b>${rb(s.real[i])}</p></div>`).join('');
  const st0=P.snaps[0]?P.snaps[0].st.v:st.s0;
  const cmp=MAIN.map(x=>`<tr><th>${esc(x.name)}</th><td>${fmt(x.k,st0[x.k])}</td><td>→</td><td><b>${fmt(x.k,st.v[x.k])}</b>${esc(x.unit)}</td></tr>`).join('');
  const nen=[];
  s.turns.forEach(T=>{nen.push([yspan(T.y,1),T.title]); if(T.ev&&plain(T.ev.title)!==plain(T.title))nen.push([yf(T.ev.y)+'年',T.ev.title]);});
  const ix=SCN.indexOf(s), nx=SCN[ix+1];
  app.innerHTML=`${head()}<p class="endh">🎉 シナリオ${s.no}「${rb(s.title)}」おしまい！</p>
    <div class="rank"><span class="rp">${rk.pic}</span><div><span class="label">あなたは</span><p class="rn">${esc(rk.name)}</p><p class="note" style="color:var(--fg)">${esc(rk.t)}</p>${isNew?'<p class="got">✓ 新しいはんこを手に入れた！</p>':''}
      <span class="stars" aria-label="星 ${stars}こ">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</span></div></div>
    <div class="label">通信簿　あなたの${REALM} と ${REALW}</div><div class="axes">${axes}</div>
    <div class="label">はじめ → おわり</div><table class="chg">${cmp}</table>
    <p class="lesson"><b>まとめ</b>${rb(s.real_end)}</p>
    <div class="label">年表　${esc(s.years)}</div><dl class="timeline">${nen.map(e=>`<dt>${esc(e[0])}</dt><dd>${rb(e[1])}</dd>`).join('')}</dl>
    <div class="label">${esc(G.words_label||'用語')}</div><ul class="words">${s.words.map(w=>`<li><b>${rb(w[0])}</b>${rb(w[1])}</li>`).join('')}</ul>
    <div class="row">${nx?`<button class="btn go" id="next">次のシナリオ「${rb(nx.title)}」</button>`:''}<button class="btn${nx?'':' go'}" id="list">シナリオ一覧</button><button class="linkbtn" id="again">もう一度このシナリオを</button></div>${PAID?'':PAIDLINK}`;
  on('back',home); on('list',home); on('again',()=>intro(s)); if(nx)on('next',()=>intro(nx));
  top0();
}
return {home:home};
})();
async function decrypt(){ return mnAccess.load(GAME.id); }
function lockScreen(err){ mnAccess.lock(app,{game:GAME.id,err:err,free:GAME.id+'.html',onOpen:async()=>{ SCN=await decrypt(); UI.home(); }}); }
(async()=>{
  if(!PAID){ UI.home(); return; }
  try{ SCN=await decrypt(); UI.home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
