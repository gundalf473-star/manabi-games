      const hit=(f,a,i)=>{if(mode===2)return f===a;f=norm(f);a=norm(a);if((r.ng&&r.ng[i]||[]).some(x=>f.includes(x)))return false;
        if(/^\d+$/.test(a)){const m=f.match(/\d+/g)||[];return m.length===1&&m[0]===a;}
        if(/^[一二三四五六七八九十百]+$/.test(a)){const m=f.match(/[一二三四五六七八九十百]+/g)||[];return m.length===1&&m[0]===a;}
        return f.includes(a);};
      const ok=r.blanks.every((alts,i)=>alts.some(a=>hit(fill[i],a,i)));
      if(ok){reasonOK();return;}
      const bad=r.blanks.map((alts,i)=>!alts.some(a=>hit(fill[i],a,i)));
      reasonNG();cur.reasonN=(cur.reasonN||0)+1;
      if(cur.reasonN>=3){fill=r.blanks.map(a=>a[0]);draw();$('talkText').innerHTML='<span class="ng">こたえは こうだよ。</span>文を 読んでから「これで 決まり！」を おしてね。';glow=null;return;}
      bad.forEach((b,i)=>{if(b)fill[i]=null;});curB=fill.indexOf(null);if(curB<0)curB=0;
      glow=cur.reasonN>=2?r.blanks[curB][0]:null;draw();
      $('talkText').innerHTML='<span class="ng">ちがっていた らんを 空にしたよ。</span>入る ことばを えらびなおそう。'+(glow?'<br>ヒント：光っている カードを 入れてみよう。':'')+(mode===3&&glow?'<br>ヒント：「'+glow+'」と 書いてみよう。':'');
    };
  };
  draw();
}
function reasonNG(){
  firstTry=false;mistakes++;miss.add(cur.rev);
  gauge=Math.max(1,gauge-1);drawGauge();
  $('talkText').innerHTML='<span class="ng">うーん、理由としては 少し ちがうかも。</span><br>もう一度 えらんでみよう。';
}
function reasonOK(){
  const r=cur.reason;
  $('talkText').innerHTML='<span class="ok">◎ ばっちり！</span><br><span style="font-size:15px">'+r.explain+'</span>';
  $('talkNext').classList.add('hidden');
  $('area').innerHTML='<button class="big" id="rNext">つぎへ</button>';
  $('rNext').onclick=()=>{$('area').innerHTML='';say(cur.after,()=>{step++;run();});};
  if(!cur.after.length){$('rNext').onclick=()=>{step++;run();};}
}

/* ---------- エンディング ---------- */
function ending(){
  $('btnQuit').classList.add('hidden');  // 画面の中に 大きな「タイトルへ」が あるので、下の 小さい ほうは かくす
  const stars=mistakes<=1?3:mistakes<=4?2:1;
  const badges=['🔬 新人たんてい部員'];if(firstTry)badges.push('⚡ 一発突破');
  const sv=loadSave();sv.clear=1;sv.best=Math.max(sv.best||0,stars);sv.badges=Array.from(new Set([...(sv.badges||[]),...badges]));
  sv.miss=Array.from(new Set([...(sv.miss||[]),...miss]));putSave(sv);
  track('level_end',{level_name:'nazotoki-kagaku-ep'+epNo+'-lv'+lv,score:stars,success:true});
  setStage('hikari','第'+EP.no+'話 クリア');$('talkName').textContent='第'+EP.no+'話　解決！';$('talkName').style.background='#d6453d';
  $('talkText').innerHTML=EP.clear;$('talkNext').classList.add('hidden');
  $('area').innerHTML='<div class="stars">'+'★'.repeat(stars)+'☆'.repeat(3-stars)+'</div>'
   +'<div class="res">まちがえた回数：'+mistakes+'回<br>'+badges.map(b=>'<span class="badge">'+b+'</span>').join('')+'</div>'
   +'<div class="box"><b>きょう 使った 理科の きまり</b><br>'+SUM+'</div>'
   +(miss.size?'<button class="big" id="goRev">📁 見のがしファイルで ふくしゅう（'+miss.size+'）</button>':'')
   +(EPS[epNo+1]?'<button class="big" id="goNext" style="background:#d6453d;color:#fff;border-color:#a32b25;box-shadow:0 4px 0 #a32b25">つぎの 話へ ▶<small style="color:#fff">第'+(epNo+1)+'話　'+EPS[epNo+1].name+(locked(epNo+1)?'（おためし）':'')+'</small></button>':'')
   +'<button class="big" id="goTitle">タイトルへ</button>';
  if($('goRev'))$('goRev').onclick=()=>openReview();
  $('goTitle').onclick=()=>{started=false;titleInit();};
  if($('goNext'))$('goNext').onclick=()=>{setEp(epNo+1);started=false;titleInit();};
}

/* ---------- 見のがしファイル ---------- */
function openReview(){
  const sv=loadSave();const ids=(sv.miss||[]).filter(k=>REV[k]);show('review');
  if(!ids.length){$('revBody').innerHTML='<div class="box">見のがしは ありません。すばらしい！</div>';return;}
  let i=0;
  const q=()=>{const r=REV[ids[i]];
    $('revBody').innerHTML='<div class="box"><span class="badge">'+r.tag+'</span>　'+(i+1)+' / '+ids.length+'<br>'+r.q+'</div>'+shuf(r.opts.length).map(j=>'<button class="choice" data-j="'+j+'">'+r.opts[j]+'</button>').join('')+'<div id="revMsg"></div>';
    $('revBody').querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
      if(+b.dataset.j===r.ci){const s=loadSave();s.miss=(s.miss||[]).filter(x=>x!==ids[i]);putSave(s);
        $('revMsg').innerHTML='<div class="box"><span class="ok">◎ 正解！ ファイルから 消えたよ。</span><br>'+r.ex+'</div><button class="big" id="revNext">'+(i+1<ids.length?'つぎへ':'おわり')+'</button>';
        $('revNext').onclick=()=>{i++;if(i<ids.length)q();else{$('revBody').innerHTML='<div class="box">ふくしゅう おわり！</div>';}};
      }else{$('revMsg').innerHTML='<div class="box"><span class="ng">ちがうよ。</span>もう一度 考えてみよう。</div>';}
    });};
  q();
}
$('btnReview').onclick=openReview;
$('btnRevBack').onclick=()=>titleInit();

/* ---------- タイトル ---------- */
function titleInit(){
  show('title');const sv=loadSave();
  $('epList').innerHTML=Object.keys(EPS).map(n=>{const s=loadSave(+n),e=EPS[n],on=+n===epNo;
    const tag=PAID?'':e.GAME?' <span class="badge" style="background:#8a5a00;font-size:12px">有料</span>':' <span class="badge" style="background:#1f7a3c;font-size:12px">無料</span>';
    return '<button class="big epbtn'+(on?' on':'')+'" data-ep="'+n+'">第'+n+'話　'+e.name+tag+'<small>'+(s.clear?'クリアずみ　'+'★'.repeat(s.best||1):locked(+n)?'無料は 調査まで（おためし）':'まだ あそんでいない')+'</small></button>';}).join('');
  $('epList').querySelectorAll('.epbtn').forEach(b=>b.onclick=()=>{setEp(+b.dataset.ep);titleInit();});
  $('epIntro').textContent=EP.intro;$('epTags').textContent=EP.tags;
  $('freeNote').classList.toggle('hidden',!locked(epNo));
  $('btnStart').textContent='第'+epNo+'話の 調査を はじめる'+(locked(epNo)?'（おためし）':'');
  document.querySelectorAll('.lvbtn').forEach(b=>b.classList.toggle('on',+b.dataset.lv===lv));
  const n=(sv.miss||[]).filter(k=>REV[k]).length;
  $('btnReview').classList.toggle('hidden',!n);$('reviewN').textContent=n?n+'問 のこっている':'';
  $('bestLine').textContent=sv.clear?'クリアずみ　最高 '+'★'.repeat(sv.best||1)+'　称号：'+(sv.badges||[]).join('・'):'';
}
document.querySelectorAll('.lvbtn').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;titleInit();});
$('btnStart').onclick=newGame;
$('btnQuit').onclick=()=>{started=false;titleInit();};

/* ---------- テスト用 ---------- */
$('btnTest').onclick=()=>$('testPanel').classList.toggle('hidden');
$('testPanel').onclick=e=>{const t=e.target.dataset.t;if(!t)return;
  const go=id=>{for(const k in ev)ev[k].have=1;$('modal').classList.add('hidden');step=FLOW.findIndex(s=>s.id===id||s.t===id);run();};
  if(t==='ans'){if(cur&&T[cur.id]){$('talkText').innerHTML='🛠 こたえ：文'+[].concat(cur.ans.s).map(i=>'①②③④'[i]).join('か')+' × 証拠'+cur.ans.ev.join('・');}return;}
  if(t==='miss'){const s=loadSave();s.miss=Object.keys(REV);putSave(s);$('talkText').innerHTML='🛠 見のがしファイルに 全部 入れた';return;}
  if(t==='reset'){putSave({});$('talkText').innerHTML='🛠 記録を消した';return;}
  if(t==='end'){step=FLOW.length-1;run();return;}
  go(t);
};

/* ---- 有料版：利用コードを 確かめて、第2話・第3話の パックを 受け取ってから 始める ---- */
const PACK_EPS=Object.keys(EPS).filter(n=>EPS[n].GAME).map(Number);
async function loadPacks(){const ps=await Promise.all(PACK_EPS.map(n=>mnAccess.load(EPS[n].GAME)));PACK_EPS.forEach((n,i)=>applyPack(n,ps[i]));setEp(epNo);}
function lockScreen(err){
  show('lock');
  if(!window.mnAccess){$('lockBox').textContent='有料版は、サイトの 上で ひらいて ください。';return;}
  mnAccess.lock($('lockBox'),{game:'nazotoki-kagaku',err:err,free:'nazotoki-kagaku.html',onOpen:async()=>{await loadPacks();titleInit();}});
}
if(PAID){
  show('lock');$('lockBox').textContent='よみこみ中…';
  (window.mnAccess?loadPacks():Promise.reject({error:'net'})).then(()=>titleInit()).catch(lockScreen);
}else{$('btnTest').classList.add('hidden');titleInit();}
</script>
