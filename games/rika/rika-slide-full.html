<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="game:paid" content="利用コード">
<meta name="game:subject" content="理科">
<meta name="game:unit" content="生物・化学・地学・スライドパズル">
<meta name="game:grade" content="小4〜">
<meta name="game:players" content="1人">
<meta name="description" content="スライドパズル「りかスライド」の 有料版。無料版の 10ステージに 26ステージを 足した 全36ステージ。植物（合弁花・離弁花、種子の養分、冬ごし、食べている部分）、人のからだ（臓器・消化と吸収・血液と心臓・目と耳）、水よう液（とけているもの・色の変化・発生する気体）、実験器具（図と名前・使いみち）、星と星座（大三角・季節の星座・星の色）まで あそべる。">
<title>りかスライド 全36ステージ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
  :root{
    --bg:#f3efe4; --ink:#2b2a33; --sub:#6b6875; --board:#cdbfa6; --cell:#ded3bd;
    --a:#fffaf0; --b:#dcefff; --g:#fff1c9; --accent:#2f7d5b; --accent2:#d9643a; --line:#b7a98c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic","Noto Sans JP",system-ui,sans-serif;}
  body{display:flex;justify-content:center;overscroll-behavior:none}
  #app{width:100%;max-width:460px;padding:10px 12px 20px}
  h1{font-size:22px;margin:6px 0 2px;letter-spacing:.04em}
  h1 small{font-size:12px;color:var(--sub);font-weight:normal;margin-left:6px}
  .lead{font-size:13px;color:var(--sub);margin:0 0 10px;line-height:1.6}
  .hidden{display:none !important}
  button{font:inherit;color:inherit;cursor:pointer}

  /* ステージ一覧 */
  .subhead{font-size:16px;margin:16px 2px 8px;padding-left:8px;border-left:6px solid var(--accent)}
  .group{background:#fff;border-radius:14px;padding:10px 12px 12px;margin-bottom:10px;box-shadow:0 2px 0 var(--line)}
  .group h2{font-size:15px;margin:0 0 2px}
  .group p{font-size:12px;color:var(--sub);margin:0 0 8px;line-height:1.5}
  .stages{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .stagebtn{border:2px solid var(--line);background:var(--a);border-radius:10px;padding:8px 8px;text-align:left;font-size:13px;line-height:1.35}
  .stagebtn b{display:block;font-size:14px}
  .stagebtn span{font-size:11px;color:var(--sub)}
  .stagebtn.cleared{border-color:var(--accent);background:#eaf6ef}
  .stagebtn:active{transform:translateY(1px)}
  a.stagebtn{display:block;text-decoration:none;color:#7a8296}
  .figs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 4px;text-align:center}
  .fig svg{width:36px;height:36px;display:block;margin:0 auto}
  .fig i{font-style:normal;font-size:9px;letter-spacing:-.02em;line-height:1.25;display:block;white-space:nowrap}
  div.stagebtn{color:#7a8296}
  .stagebtn.lock{background:#ece6d8;border-color:#b3ab99}
  .paid{display:block;text-align:center;border-radius:12px;padding:10px 12px;margin:0 0 12px;font-weight:800;font-size:15px;text-decoration:none;color:var(--ink);background:#fff3c9;border:2px solid #c98f12;box-shadow:0 3px 0 #c98f12}
  .paid small{display:block;font-weight:500;font-size:12px}
  .paid.on{background:#d8efe0;border-color:#1c5a36;box-shadow:none;color:#1c5a36;font-size:13px;padding:4px 12px}
  #lockBox{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;margin-top:14px;font-size:15px}

  /* プレイ画面 */
  .topbar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .topbar .title{flex:1;font-weight:bold;font-size:15px;line-height:1.3}
  .iconbtn{border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font-size:13px}
  .stats{display:flex;gap:6px;margin-bottom:6px}
  .stat{flex:1;background:#fff;border-radius:10px;padding:4px 8px;font-size:11px;color:var(--sub);text-align:center}
  .stat b{display:block;font-size:17px;color:var(--ink)}
  #banner{min-height:44px;background:#fff;border-radius:10px;padding:6px 10px;font-size:14px;line-height:1.45;
    display:flex;align-items:center;justify-content:center;text-align:center;margin-bottom:8px;border:2px solid transparent}
  #banner.hit{border-color:var(--accent);background:#eaf6ef}
  #banner.done{border-color:var(--accent2);background:#fff0e8;font-weight:bold}
  #boardwrap{position:relative;width:100%;aspect-ratio:1/1;background:var(--board);border-radius:14px;touch-action:none;user-select:none}
  .cellbg{position:absolute;background:var(--cell);border-radius:9px}
  .tile{position:absolute;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;font-weight:bold;line-height:1.15;transition:transform .12s ease-out;box-shadow:0 2px 0 rgba(0,0,0,.18);
    overflow:hidden;padding:3px;will-change:transform;word-break:break-all}
  .tile.a{background:var(--a)} .tile.b{background:var(--b)} .tile.g{background:var(--g)}
  .tile.gm{background:#ffd27a}
  .tile.new{animation:pop .16s ease-out}
  .tile.bye{animation:bye .28s ease-in forwards;z-index:5}
  .tile svg{width:78%;height:auto;max-height:78%;display:block}
  .tile.flag svg{width:86%;border:1px solid #999;border-radius:2px}
  .tile .cnt{font-size:.62em;color:#7a4b00;font-weight:normal;margin-top:2px}
  .tile .ch{display:block;line-height:1.15}
  .tile .ch+.cnt{font-size:1em;margin:1px 0;font-weight:bold}
  .tile .mem{font-size:.42em;color:#5d4a1f;font-weight:normal;line-height:1.2;margin-top:1px}
  @keyframes pop{from{scale:.3;opacity:.2}to{scale:1;opacity:1}}
  @keyframes bye{0%{scale:1}40%{scale:1.18;filter:brightness(1.15)}100%{scale:.2;opacity:0}}
  .hint{font-size:12px;color:var(--sub);text-align:center;margin:8px 0 0;line-height:1.6}
  .pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,44px);gap:5px;justify-content:center;margin-top:8px}
  .pad button{border:2px solid var(--line);background:#fff;border-radius:10px;font-size:18px}
  .pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}

  /* かさねる画面 */
  #overlay{position:fixed;inset:0;background:rgba(40,36,30,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
  .card{background:#fff;border-radius:16px;padding:16px 16px 14px;width:100%;max-width:400px;max-height:92vh;overflow:auto}
  .card h3{margin:0 0 6px;font-size:18px}
  .card p{margin:0 0 10px;font-size:14px;line-height:1.6}
  .big{display:block;width:100%;border:0;background:var(--accent);color:#fff;border-radius:12px;padding:11px;font-size:16px;font-weight:bold;margin-top:8px}
  .big.sub{background:#fff;color:var(--ink);border:2px solid var(--line)}
  .qbox{background:var(--bg);border-radius:12px;padding:10px;display:flex;align-items:center;justify-content:center;text-align:center;min-height:92px;font-size:22px;line-height:1.3;font-weight:bold;margin-bottom:8px}
  .qbox svg{height:76px;width:auto}
  .qbox.flag svg{border:1px solid #999}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .choice{border:2px solid var(--line);background:var(--a);border-radius:10px;padding:10px 6px;font-size:14px;font-weight:bold;line-height:1.3}
  .choice.ok{border-color:var(--accent);background:#d9f0e2}
  .choice.ng{border-color:var(--accent2);background:#ffe1d6}
  .list{max-height:38vh;overflow:auto;font-size:13px;line-height:1.7;background:var(--bg);border-radius:10px;padding:8px 10px;margin-bottom:6px}
  #btnMix{display:block;margin:10px auto 0;border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 18px;font-size:14px;font-weight:bold}
  #btnMix.pulse{background:var(--accent2);border-color:var(--accent2);color:#fff;animation:mixpulse 1s infinite}
  @keyframes mixpulse{50%{transform:scale(1.06)}}
  #btnTest{display:block;margin:12px auto 0;background:#7a4fd0;color:#fff;border:none;border-radius:999px;padding:8px 16px;font-size:13px}
  .tile.flag img{width:86%;height:auto;border:1px solid #999;border-radius:2px;display:block}
  .qbox img{height:76px;width:auto;border:1px solid #999}
  .src{font-size:11px;color:var(--sub);line-height:1.6;margin:10px 2px 0}
</style>
<script>/* 🛠 テストボタンは テストサイトでだけ出す（本番では出ない）。出してよい場所：manabi-games-test.pages.dev・○○-test / ○○-dev の pages.dev・自分のパソコン */(function(){var h=location.hostname;if(/(^|\.)manabi-games-test\.pages\.dev$/.test(h)||/-(test|dev)\.pages\.dev$/.test(h)||h==='localhost'||h==='127.0.0.1'||location.protocol==='file:')return;var s=document.createElement('style');s.textContent='#btnTest,#btest,#testBtn,#bTest,[data-k="test"],#testPanel{display:none!important}';document.head.appendChild(s);})();</script>
</head>

</div>
<div id="overlay" class="hidden"><div class="card" id="card"></div></div>

/* ---- 無料版と 有料版（rika-slide-full.html）は 同じ プログラム。有料版だけが パックを 受け取って 🔒 の ステージを 開く ---- */
const GAME_ID='rika-slide';
const PAID=!!document.querySelector('meta[name="game:paid"]');
const ready=(s)=>!!(s&&(s.groups||s.pairs||s.chain));
const isStr=(x)=>typeof x==='string'&&x.length>0;
function okGroups(o){ const k=o&&typeof o==='object'&&!Array.isArray(o)?Object.keys(o):[]; return k.length>0&&k.every(n=>Array.isArray(o[n])&&o[n].length>1&&o[n].every(isStr)); }
function okPairs(a){ return Array.isArray(a)&&a.length>1&&a.every(p=>p&&p.a&&p.b&&isStr(p.b.t)&&(isStr(p.a.t)||isStr(p.a.svg))&&isStr(p.say)); }
function applyPack(pack){
  const P=pack&&pack.stages; if(!P||typeof P!=='object') throw {error:'no_data'};
  GROUPS.forEach(g=>g.stages.forEach(s=>{
    const p=P[s.id]; if(!s.paid||!p) return;
    if(s.type==='group'&&okGroups(p.groups)) s.groups=p.groups;
    if(s.type==='pair'&&okPairs(p.pairs)) s.pairs=p.pairs;
  }));
}

let actx=null;
function beep(freqs,dur){
  if(!save.sound) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    let t=actx.currentTime;
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(actx.destination);
      const st=t+i*(dur||0.08);
      g.gain.setValueAtTime(0.0001,st); g.gain.exponentialRampToValueAtTime(0.15,st+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,st+(dur||0.08)+0.06);
      o.start(st); o.stop(st+(dur||0.08)+0.08);
    });
  }catch(e){}
}

const N=4;

const shuffle=(a)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
let G=null;   // いまのゲーム

function findStage(id){ for(const g of GROUPS) for(const s of g.stages) if(s.id===id) return {g,s}; return null; }

function startStage(id){
  closeCard();

  const {g,s}=fs0;

  G.groups = s.groups || null;

    G.usedPairs=ps;
    ps.forEach((p)=>{ G.pool.push({kind:'pair',ans:p.b.t,side:'a',face:p.a,say:p.say}); G.pool.push({kind:'pair',ans:p.b.t,side:'b',face:p.b,say:p.say}); });

// 盤の大きさ（%）で位置を決める
const GAP=2.4, CELL=(100-GAP*(N+1))/N;
function place(el,r,c,asTransform){
  el.style.width=CELL+'%'; el.style.height=CELL+'%';
  if(asTransform){
    el.style.left='0'; el.style.top='0';
    const x=(GAP+c*(CELL+GAP))/CELL*100, y=(GAP+r*(CELL+GAP))/CELL*100;
    el.style.transform=`translate(${x}%,${y}%)`;

    el.style.left=(GAP+c*(CELL+GAP))+'%'; el.style.top=(GAP+r*(CELL+GAP))+'%';
  }
}
// 文字の はば（半角は 0.55字ぶん）
function vlen(s){ let n=0; for(const ch of s) n+= /[\x20-\x7e]/.test(ch)?0.55:1; return n; }
// タイルに 入るように 行を分ける。もどり値：{html, font}
function fitText(text){
  const n=vlen(text);
  const lines = n<=5.2?1 : n<=10?2 : n<=18?3 : 4;
  let rows=[text], wrapped=false;
  // 空白・＋・見えない 切れ目（\u200b：長い ことばの 中に データで 入れてある）で 分ける
  const toks=(text.match(/[^ ＋\u200b]*[ ＋\u200b]?/g)||[]).map(x=>x.replace(/\u200b/g,'')).filter(x=>x!=='');
  const tokMax=Math.max(...toks.map(x=>vlen(x.trim())));
  if(lines>1 && toks.length>1 && tokMax<=7.2){
    // 空白や ＋ の ところで 切る：行数が lines+1（4行まで）に おさまる、いちばん せまい はばを さがす
    const maxL=Math.min(4,lines+1);
    for(let W=tokMax; W<=n+1 && !wrapped; W+=0.25){
      const r=[]; let cur='';
      toks.forEach(tk=>{ if(cur && vlen((cur+tk).trim())>W){ r.push(cur.trim()); cur=tk; } else cur+=tk; });
      if(cur.trim()) r.push(cur.trim());
      if(r.length<=maxL){ rows=r; wrapped=true; }
    }
  }
  if(lines>1 && !wrapped){
    const per=n/lines; rows=[]; let cur='', w=0; const chars=[...text];
    chars.forEach((ch,i)=>{
      const cw=/[\x20-\x7e]/.test(ch)?0.55:1;
      const next=chars[i+1];
      cur+=ch; w+=cw;
      // 行のあたまに 来てはいけない字の前では 切らない
      if(w>=per-0.01 && rows.length<lines-1 && next && !/[ー・、。ゃゅょっャュョッァィゥェォ々〜)）]/.test(next)){ rows.push(cur); cur=''; w=0; }
    });
    if(cur) rows.push(cur);
  }
  const widest=Math.max(...rows.map(vlen));
  const cap=[8.4,5.6,4.4,3.6][rows.length-1]||3.4;
  const size=Math.min(cap,19.2/widest);
  return {html:rows.join('<br>'), font:'calc('+size.toFixed(2)+' * min(92vw, 436px) / 100)'};
}
function chainLabel(t){
  const c=G.stage.chain;
  if(t.lo===t.hi) return c[t.lo].t;
  return c[t.lo].t+'〜'+c[t.hi].t;
}
function faceHTML(t){
  if(t.kind==='group'){
    if(t.members.length===1){ const f=fitText(t.members[0]); return {cls:'g',html:f.html,font:f.font}; }
    const tot=G.groups[t.group].length;

  }

    if(t.lo===t.hi){ const f=fitText(G.stage.chain[t.lo].t); return {cls:'g',html:f.html,font:f.font}; }
    const c=G.stage.chain, f=fitText(c[t.lo].t);

  }

  if(t.face.svg) return {cls:t.side,html:t.face.svg,font:''};
  const f=fitText(t.face.t);
  return {cls:t.side,html:f.html,font:f.font};

function makeEl(t,r,c,isNew){
  const el=document.createElement('div');
  const f=faceHTML(t);
  el.className='tile '+f.cls+(isNew?' new':'');
  el.innerHTML=f.html; if(f.font) el.style.fontSize=f.font;
  place(el,r,c,true);
  $('boardwrap').appendChild(el); G.els[t.id]=el;
  return el;
}
function refreshEl(t){
  const el=G.els[t.id]; if(!el) return;
  const f=faceHTML(t); el.className='tile '+f.cls; el.innerHTML=f.html; el.style.fontSize=f.font||'';
}

function boardTiles(){ const a=[]; for(let r=0;r<N;r++)for(let c=0;c<N;c++) if(G.grid[r][c]) a.push(G.grid[r][c]); return a; }
function emptyCells(){ const a=[]; for(let r=0;r<N;r++)for(let c=0;c<N;c++) if(!G.grid[r][c]) a.push([r,c]); return a; }
function canMerge(x,y){
  if(!x||!y||x.done||y.done||x.kind!==y.kind) return false;
  if(x.kind==='pair') return x.ans===y.ans && x.side!==y.side;
  if(x.kind==='chain') return x.hi+1===y.lo || y.hi+1===x.lo;
  return x.group===y.group;
}

// 向きつきの判定：near は かべに近い方。年表つなぎは「古い方が 左か 上」のときだけ つながる
function canMergeDir(near,far,dir){
  if(!canMerge(near,far)) return false;
  if(near.kind!=='chain') return true;
  const first=(dir==='left'||dir==='up')?near:far, second=(first===near)?far:near;
  return first.hi+1===second.lo;
}
// 次に出すブロックを選ぶ：相手のいないブロックが たまりすぎないようにする
function pickFromPool(){
  if(!G.pool.length) return null;
  const on=boardTiles();
  let idx=-1;
  if(G.stage.type==='pair'){
    const orphans=on.filter(t=>!on.some(u=>u!==t&&canMerge(t,u)));
    if(orphans.length>=3 || emptyCells().length<=5){
      const cand=[]; G.pool.forEach((p,i)=>{ if(orphans.some(o=>canMerge(o,p))) cand.push(i); });
      if(cand.length) idx=cand[Math.floor(Math.random()*cand.length)];
    }
  }else if(G.stage.type==='chain'){
    // つなげられる 組が 盤面に ないときは、いまある ブロックの となりを 出しやすくする
    const any=on.some(t=>on.some(u=>u!==t&&canMerge(t,u)));
    if(!any && on.length && Math.random()<0.7){
      const cand=[]; G.pool.forEach((p,i)=>{ if(on.some(o=>canMerge(o,p))) cand.push(i); });
      if(cand.length) idx=cand[Math.floor(Math.random()*cand.length)];
    }
  }else{
    const groups=[...new Set(on.map(t=>t.group))];
    if(groups.length>=3 || emptyCells().length<=5){
      const cand=[]; G.pool.forEach((p,i)=>{ if(groups.includes(p.group)) cand.push(i); });
      if(cand.length) idx=cand[Math.floor(Math.random()*cand.length)];
    }
  }
  if(idx<0) idx=Math.floor(Math.random()*G.pool.length);
  return G.pool.splice(idx,1)[0];
}
function spawn(){
  const e=emptyCells(); if(!e.length) return false;
  const t=pickFromPool(); if(!t) return false;
  t.id=uid++;
  const [r,c]=e[Math.floor(Math.random()*e.length)];
  G.grid[r][c]=t; makeEl(t,r,c,true);
  return true;
}

function setBanner(text,cls){ const b=$('banner'); b.textContent=text; b.className=cls||''; }
function leftCount(){
  if(G.stage.type==='pair') return (G.pool.length+boardTiles().length)/2;
  if(G.stage.type==='chain') return Math.max(0,G.pool.length+boardTiles().length-1);
  // のこりの地方の数
  const s=new Set(G.pool.map(p=>p.group)); boardTiles().forEach(t=>s.add(t.group)); return s.size;
}
function updateStats(){
  $('sMoves').textContent=G.moves;
  $('sLeft').textContent=leftCount()+(G.stage.type==='pair'?'組':G.stage.type==='chain'?'回':G.suffix==='地方'?'地方':'なかま');
  const b=save.best[G.stage.id]; $('sBest').textContent=b?b+'手':'-';
  $('btnMix').classList.toggle('pulse', G.idle>=4);
}

const DIRS={left:[0,-1],right:[0,1],up:[-1,0],down:[1,0]};
function move(dir){
  if(!G||G.over||G.busy) return;
  const [dr,dc]=DIRS[dir];
  let moved=false, reverseHit=false; const gone=[]; const msgs=[];
  const newGrid=[...Array(N)].map(()=>Array(N).fill(null));
  for(let i=0;i<N;i++){
    // かべ側から順に ならべる
    const line=[];
    for(let k=0;k<N;k++){
      const r = dr===0? i : (dr<0? k : N-1-k);
      const c = dc===0? i : (dc<0? k : N-1-k);
      if(G.grid[r][c]) line.push({t:G.grid[r][c],r,c});
    }
    const out=[];
    line.forEach(item=>{
      const prev=out[out.length-1];
      if(prev && !prev.merged && canMergeDir(prev.t,item.t,dir)){
        prev.merged=true; prev.eat=item.t;
      }else{
        if(prev && !prev.merged && item.t.kind==='chain' && canMerge(prev.t,item.t)) reverseHit=true;
        out.push({t:item.t});
      }
      item.slot=out.length-1;
    });
    out.forEach((o,k)=>{
      const r = dr===0? i : (dr<0? k : N-1-k);
      const c = dc===0? i : (dc<0? k : N-1-k);
      o.r=r; o.c=c; newGrid[r][c]=o.t;
    });
    line.forEach(item=>{
      const o=out[item.slot];
      if(item.r!==o.r||item.c!==o.c) moved=true;
      place(G.els[item.t.id],o.r,o.c,true);
    });
    out.forEach(o=>{
      if(!o.merged) return;
      moved=true;
      const keep=o.t, eat=o.eat;
      gone.push(eat);
      if(keep.kind==='pair'){
        keep.done=true; gone.push(keep); msgs.push({text:(keep.side==='a'?keep:eat).say,cls:'hit'});
      }else if(keep.kind==='chain'){
        const c=G.stage.chain, first=keep.lo<eat.lo?keep:eat, second=first===keep?eat:keep;
        const A=c[first.hi], B=c[second.lo];
        keep.lo=Math.min(keep.lo,eat.lo); keep.hi=Math.max(keep.hi,eat.hi);
        if(keep.lo===0 && keep.hi===c.length-1){
          keep.done=true; gone.push(keep);
          msgs.push({text:'年表 完成！ '+c[0].t+' から '+c[c.length-1].t+' まで',cls:'done'});
        }else{
          keep.changed=true;
          msgs.push({text:`${A.y?A.y+' ':''}${A.t} → ${B.y?B.y+' ':''}${B.t}`,cls:'hit'});
        }
      }else{
        keep.members=keep.members.concat(eat.members);
        const tot=G.groups[keep.group].length;
        if(keep.members.length===tot){
          keep.done=true; gone.push(keep);
          const all=G.groups[keep.group].map(m=>m.replace(/[都府県]$/,'')).join('・');
          msgs.push({text:`${keep.group}${G.suffix} 完成！ `+(all.length<=34?all:''),cls:'done'});
        }else{
          keep.changed=true;
          msgs.push({text:`${keep.group}${G.suffix} ${keep.members.length} / ${tot}`,cls:'hit'});
        }
      }
    });
  }
  if(!moved) return;
  G.grid=newGrid; G.moves++; G.busy=true;
  G.idle = msgs.length ? 0 : G.idle+1;
  if(msgs.length){
    const m=msgs.find(x=>x.cls==='done')||msgs[msgs.length-1]; setBanner(m.text,m.cls);
    beep(m.cls==='done'?[523,659,784,1047]:[660,880]);
  }else if(reverseHit){
    setBanner('じゅんばんが ぎゃく！ 古い ほうを 左か 上に して ぶつけよう','');
  }
  setTimeout(()=>{
    // 合体したあとの見た目に なおす
    gone.forEach(t=>{
      const el=G.els[t.id]; if(!el) return;
      if(t.done && t.kind){ el.classList.add('bye'); setTimeout(()=>el.remove(),280); }
      else el.remove();
      delete G.els[t.id];
    });
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){
      const t=G.grid[r][c]; if(!t) continue;
      if(t.done) G.grid[r][c]=null;
      else if(t.changed){ t.changed=false; refreshEl(t); G.els[t.id].classList.add('new'); }
    }
    spawn();
    updateStats();
    G.busy=false;
    checkEnd();
    if(!G.over && !G.pool.length && !mergeReachable(G.grid)) reshuffle();
  },125);
}

/* ---- 行きづまり対策 ----
   新しいブロックが出なくなったあと、どう動かしても ぶつけられない形
   （例：2×2で ペアが ななめ同士）になることがある。そのときは 自動で ならべかえる。 */
function simSlide(grid,dir){
  const [dr,dc]=DIRS[dir]; let merged=false, moved=false;
  const ng=[...Array(N)].map(()=>Array(N).fill(null));
  for(let i=0;i<N;i++){
    const out=[]; let lastMerged=false;
    for(let k=0;k<N;k++){
      const r = dr===0? i : (dr<0? k : N-1-k), c = dc===0? i : (dc<0? k : N-1-k);
      const t=grid[r][c]; if(!t) continue;
      if(out.length && !lastMerged && canMergeDir(out[out.length-1],t,dir)){ merged=true; lastMerged=true; }
      else{ if(out.length!==k) moved=true; out.push(t); lastMerged=false; }
    }
    out.forEach((t,k)=>{
      const r = dr===0? i : (dr<0? k : N-1-k), c = dc===0? i : (dc<0? k : N-1-k);
      ng[r][c]=t;
    });
  }
  return {g:ng,merged,moved};
}
function mergeReachable(grid){
  const key=(g)=>g.map(row=>row.map(t=>t?t.id:0).join(',')).join('/');
  const seen=new Set([key(grid)]); const q=[grid]; let guard=0;
  while(q.length && guard++<4000){
    const g=q.shift();
    for(const d in DIRS){
      const s=simSlide(g,d);
      if(s.merged) return true;
      if(s.moved){ const k=key(s.g); if(!seen.has(k)){ seen.add(k); q.push(s.g); } }
    }
  }
  return false;
}
function reshuffle(msg){
  const tiles=boardTiles(); if(tiles.length<2) return;
  let ng=null;
  for(let n=0;n<80;n++){
    const cells=shuffle([...Array(N*N).keys()]).slice(0,tiles.length);
    ng=[...Array(N)].map(()=>Array(N).fill(null));
    tiles.forEach((t,i)=>{ ng[Math.floor(cells[i]/N)][cells[i]%N]=t; });
    if(mergeReachable(ng)) break;
  }
  G.grid=ng;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){ const t=G.grid[r][c]; if(t) place(G.els[t.id],r,c,true); }
  setBanner(msg||'ぶつけられない形に なったので、ならべかえたよ','');
}
// 「まぜる」ボタン：盤面の ブロックを ならべかえる（手数 +2）。いっぱいで うごかせないときも 使える
function mixBoard(){
  if(!G||G.busy||boardTiles().length<2) return;
  G.over=false; G.moves+=2; G.idle=0;
  reshuffle('盤面を まぜたよ（+2手）');
  beep([440,554,659],0.05);
  updateStats();
}
// 「食べられた」側は done ではないので すぐ消す。上の gone 処理で区別するための印
function checkEnd(){
  const on=boardTiles();
  if(!G.pool.length && on.length===0){ G.over=true; setTimeout(showClear,350); return; }
  if(emptyCells().length===0){
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){
      const t=G.grid[r][c];
      if(c+1<N&&canMergeDir(t,G.grid[r][c+1],'left')) return;
      if(r+1<N&&canMergeDir(t,G.grid[r+1][c],'up')) return;
    }
    G.over=true; setTimeout(showStuck,300);
  }
}

/* =========================================================
   クリア・おさらい
   ========================================================= */
function openCard(html){ $('card').innerHTML=html; $('overlay').classList.remove('hidden'); }
function closeCard(){ $('overlay').classList.add('hidden'); }
function showStuck(){
  beep([330,262],0.12);
  openCard(`<h3>うごかせなくなった…</h3><p>ブロックが いっぱいに なりました。まぜると つづけられるよ。</p>
    <button class="big" id="mixBtn">🔀 まぜて つづける（+2手）</button><button class="big sub" id="againBtn">さいしょから</button><button class="big sub" id="menuBtn">ステージを えらぶ</button>`);
  $('mixBtn').onclick=()=>{closeCard();mixBoard();};
  $('againBtn').onclick=()=>{closeCard();startStage(G.stage.id);};
  $('menuBtn').onclick=()=>{closeCard();showMenu();};
}
function buildQuiz(){
  const s=G.stage, qs=[];
  if(s.type==='group'){
    const mine=Object.keys(G.groups);
    // えらぶ なかまが 4つに 足りないときは、同じ種類の ほかの なかまから 足す
    const pool=s.pool||mine;
    if(mine.length<=2){
      const order=shuffle(mine), bag={}; mine.forEach(r=>bag[r]=shuffle(G.groups[r]));
      for(let k=0;k<3;k++){
        const r=order[k%order.length], a=bag[r][Math.floor(k/order.length)%bag[r].length];
        const oth=shuffle([].concat(...mine.filter(x=>x!==r).map(x=>G.groups[x]))).slice(0,3);
        qs.push({q:{t:'「'+r+G.suffix+'」'},ask:'は どれ？',ans:a,choices:shuffle([a,...oth])});
      }
      return qs;
    }
    const items=shuffle([].concat(...mine.map(r=>G.groups[r].map(p=>({p,r}))))).slice(0,3);
    items.forEach(({p,r})=>{
      const others=shuffle(pool.filter(x=>x!==r)).slice(0,3);
      qs.push({q:{t:p},ask:G.suffix==='地方'?'は 何地方？':'は どの なかま？',ans:r+G.suffix,choices:shuffle([r,...others]).map(x=>x+G.suffix)});
    });
  }else if(s.type==='chain'){
    const c=s.chain;
    shuffle([...Array(c.length-1).keys()]).slice(0,3).forEach(i=>{
      const others=shuffle(c.map((x,k)=>k).filter(k=>k!==i&&k!==i+1)).slice(0,3).map(k=>c[k].t);
      qs.push({q:{t:c[i].t},ask:'の すぐ あとは どれ？',ans:c[i+1].t,choices:shuffle([c[i+1].t,...others])});
    });
  }else{
    const ps=shuffle(G.usedPairs).slice(0,3);
    const labels=[...new Set(s.pairs.map(p=>p.b.t))];
    const qfit=(t)=>t;
    ps.forEach(p=>{
      const others=shuffle(labels.filter(x=>x!==p.b.t)).slice(0,3);
      qs.push({q:p.a,ask:s.ask||'の 相手は どれ？',ans:p.b.t,choices:shuffle([p.b.t,...others])});
    });
  }
  return qs;
}
function showClear(){
  beep([523,659,784,1047,1319],0.1);
  const id=G.stage.id, prev=save.best[id];
  const isBest=!prev||G.moves<prev;
  if(isBest){ save.best[id]=G.moves; persist(); }
  openCard(`<h3>クリア！</h3><p>${G.moves}手で クリアしました。${isBest&&prev?'ベスト こうしん！':''}<br>さいごに おさらいを 3問。</p>
    <button class="big" id="quizBtn">おさらいへ</button>`);
  $('quizBtn').onclick=()=>runQuiz(buildQuiz(),0,0);
}
function runQuiz(qs,i,score){
  if(i>=qs.length){
    let list='';
    if(G.stage.type==='group') list=Object.keys(G.groups).map(r=>`<b>${r}${G.suffix}</b>：`+G.groups[r].map(m=>m.replace(/[都府県]$/,'')).join('・')).join('<br>');
    else if(G.stage.type==='chain') list=G.stage.chain.map(c=>(c.y?c.y+'　':'')+c.t).join('<br>');
    else if(G.usedPairs[0].a.t) list=G.usedPairs.map(p=>`${p.a.t} ― ${p.b.t}`).join('<br>');
    else if(G.usedPairs[0].a.svg) list='<div class="figs">'+G.usedPairs.map(p=>'<span class="fig">'+p.a.svg+'<i>'+p.b.t+'</i></span>').join('')+'</div>';
    openCard(`<h3>おさらい：${qs.length}問中 ${score}問 正解</h3><p>${score===qs.length?'ぜんぶ 正解！ かんぺき。':'まちがえた ところを もういちど 見ておこう。'}</p>
      ${list?'<div class="list">'+list+'</div>':''}
      <button class="big" id="againBtn">もういちど あそぶ</button><button class="big sub" id="menuBtn">ステージを えらぶ</button>
      ${(!PAID&&GROUPS.some(g=>g.stages.some(x=>!ready(x))))?'<a class="paid" style="margin:10px 0 0" href="'+GAME_ID+'-full.html">🔒 つづきの ステージは 有料版で あそべます</a>':''}`);
    $('againBtn').onclick=()=>{closeCard();startStage(G.stage.id);};
    $('menuBtn').onclick=()=>{closeCard();showMenu();};
    return;
  }
  const q=qs[i];
  const qh=q.q.img?'<img src="'+q.q.img+'" alt="">':(q.q.svg?q.q.svg:q.q.t);
  openCard(`<h3>おさらい ${i+1} / ${qs.length}</h3>
    <div class="qbox">${qh}</div><p>${q.ask}</p>
    <div class="choices">${q.choices.map((c,k)=>`<button class="choice" data-k="${k}">${c}</button>`).join('')}</div>`);
  let answered=false;
  $('card').querySelectorAll('.choice').forEach(b=>{
    b.onclick=()=>{
      if(answered) return; answered=true;
      const ok=q.choices[+b.dataset.k]===q.ans;
      b.classList.add(ok?'ok':'ng');
      $('card').querySelectorAll('.choice').forEach(x=>{ if(q.choices[+x.dataset.k]===q.ans) x.classList.add('ok'); });
      beep(ok?[784,1047]:[294,247],0.09);
      setTimeout(()=>runQuiz(qs,i+1,score+(ok?1:0)),ok?700:1500);
    };
  });
}

/* =========================================================
   メニュー・入力
   ========================================================= */
function showMenu(){
  G=null; $('play').classList.add('hidden'); $('menu').classList.remove('hidden');
  const all=GROUPS.reduce((n,g)=>n+g.stages.length,0), nLock=GROUPS.reduce((n,g)=>n+g.stages.filter(s=>!ready(s)).length,0);
  $('paidNote').innerHTML = PAID ? '<div class="paid on">🔓 有料版：全'+all+'ステージ'+(nLock?'（'+nLock+'ステージは じゅんび中）':'')+'</div>'
    : nLock ? '<a class="paid" href="'+GAME_ID+'-full.html">🔓 有料版は 全'+all+'ステージ<small>🔒 の '+nLock+'ステージも あそべます</small></a>' : '';
  const box=$('groups'); box.innerHTML='';
  GROUPS.forEach(g=>{
    if(g.sub){ const hd=document.createElement('h2'); hd.className='subhead'; hd.textContent=g.sub; box.appendChild(hd); }
    const d=document.createElement('div'); d.className='group';
    d.innerHTML=`<h2>${g.title}</h2><p>${g.desc}</p><div class="stages"></div>`;
    g.stages.forEach((s,i)=>{
      if(!ready(s)){   // 🔒 中身が まだ ない（無料版では 有料の ステージ）
        const a=document.createElement(PAID?'div':'a'); a.className='stagebtn lock'; if(!PAID) a.href=GAME_ID+'-full.html';
        a.innerHTML=`<b>🔒 ${i+1}. ${s.name}</b><span>${PAID?'じゅんび中':'有料版で あそべます'}</span>`;
        d.querySelector('.stages').appendChild(a); return;
      }
      const b=document.createElement('button'); const best=save.best[s.id];
      b.className='stagebtn'+(best?' cleared':'');
      b.innerHTML=`<b>${best?'★ ':''}${i+1}. ${s.name}</b><span>${best?'ベスト '+best+'手':'まだ クリアしていない'}</span>`;
      b.onclick=()=>startStage(s.id);
      d.querySelector('.stages').appendChild(b);
    });
    box.appendChild(d);
  });
}
$('backBtn').onclick=showMenu;
$('retryBtn').onclick=()=>{ if(G) startStage(G.stage.id); };
$('btnMix').onclick=mixBoard;
function drawSound(){ $('soundBtn').textContent=save.sound?'🔊':'🔇'; }
$('soundBtn').onclick=()=>{ save.sound=!save.sound; persist(); drawSound(); };
drawSound();
document.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>move(b.dataset.d));
window.addEventListener('keydown',e=>{
  const m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];
  if(m && G && $('overlay').classList.contains('hidden')){ e.preventDefault(); move(m); }
});
(function(){
  const w=$('boardwrap'); let sx=0,sy=0,on=false;
  w.addEventListener('pointerdown',e=>{on=true;sx=e.clientX;sy=e.clientY;});
  window.addEventListener('pointerup',e=>{
    if(!on) return; on=false;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.max(Math.abs(dx),Math.abs(dy))<18) return;
    move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));
  });
  window.addEventListener('pointercancel',()=>{on=false;});
})();
// テストボタン：テストサイトで開いたときだけ出る。あと 1組（1なかま）で クリアに する
$('btnTest').onclick=function(){
  if(!G||G.over||G.busy) return;
  boardTiles().forEach(t=>{ G.els[t.id].remove(); delete G.els[t.id]; });
  G.grid=[...Array(N)].map(()=>Array(N).fill(null));
  let keep;
  if(G.stage.type==='pair'){ const p=G.usedPairs[G.usedPairs.length-1]; keep=[{kind:'pair',ans:p.b.t,side:'a',face:p.a,say:p.say},{kind:'pair',ans:p.b.t,side:'b',face:p.b,say:p.say}]; }
  else if(G.stage.type==='chain'){ const n=G.stage.chain.length; keep=[{kind:'chain',lo:0,hi:n-2},{kind:'chain',lo:n-1,hi:n-1}]; }
  else{ const r=Object.keys(G.groups)[0], m=G.groups[r]; keep=[{kind:'group',group:r,members:m.slice(0,m.length-1)},{kind:'group',group:r,members:m.slice(m.length-1)}]; }
  G.pool=[];
  [[0,0],[3,3]].forEach(([r,c],i)=>{ const t=keep[i]; t.id=uid++; G.grid[r][c]=t; makeEl(t,r,c,true); });
  updateStats();
};
window.__game={ get G(){return G;}, move:move, start:startStage };   // 自動テスト用

// ---- 有料版：利用コードを 確かめて、パックを 受け取ってから 始める ----
function openGame(){ $('lock').classList.add('hidden'); showMenu(); }
function lockScreen(err){
  $('menu').classList.add('hidden'); $('play').classList.add('hidden'); $('lock').classList.remove('hidden');
  if(!window.mnAccess){ $('lockBox').textContent='有料版は、サイトの 上で ひらいて ください。'; return; }
  mnAccess.lock($('lockBox'),{game:GAME_ID,err:err,free:GAME_ID+'.html',onOpen:function(){
    return mnAccess.load('rika-slide').then(function(p){ applyPack(p); openGame(); });
  }});
}
if(PAID){
  $('menu').classList.add('hidden'); $('lock').classList.remove('hidden'); $('lockBox').textContent='よみこみ中…';
  (window.mnAccess?mnAccess.load('rika-slide'):Promise.reject({error:'net'}))
    .then(function(p){ applyPack(p); openGame(); }).catch(lockScreen);
}else showMenu();
</script>
