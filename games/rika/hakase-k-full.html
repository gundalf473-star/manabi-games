<style>
/* Layout: 1列。章の一覧 → 人の交代カード → 場面（年・実験の札・絵・安全メモ・文・選択肢）→ ゲームオーバー（実際には…）／章のまとめ（実験ノート・流れ・年表・カード・用語）。フラスコの緑。むらさき（BTB・リトマスの色）を差し色に */
:root{

  --mincho:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --ink:#a9e0cf; --seal:#5fd1b2; --sealsoft:#123329; --acc:#c79af0; --accsoft:#2e1f3d;
  --ok:#4cc184; --oksoft:#1b3326; --ng:#f07468; --ngsoft:#3a2220; --gold:#e1b44a; --pick:#262a31; --paper:#1f2126; --grid:#2a2f37; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121418; --surface:#1b1e23; --fg:#e7eaee; --muted:#a0a7b0; --rule:#30353d;
  --ink:#a9e0cf; --seal:#5fd1b2; --sealsoft:#123329; --acc:#c79af0; --accsoft:#2e1f3d;
  --ok:#4cc184; --oksoft:#1b3326; --ng:#f07468; --ngsoft:#3a2220; --gold:#e1b44a; --pick:#262a31; --paper:#1f2126; --grid:#2a2f37; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.75;

.hint{font-size:15px;line-height:1.85;background:var(--pick);border-radius:8px;padding:8px 12px;margin:0}

.lab{border:2px solid var(--seal);border-radius:10px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;
  background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:14px 14px}
.lab h3{margin:0;font-family:var(--display);font-weight:400;font-size:20px;color:var(--seal);line-height:1.4}
.lab h3::before{content:"📓 "}
.lab dl{margin:0;display:grid;gap:8px}
.lab dt{font-size:13px;font-weight:700;color:var(--acc)}
.lab dd{margin:0;font-size:17px;font-weight:700;line-height:1.7;background:var(--surface);border-left:4px solid var(--seal);border-radius:0 6px 6px 0;padding:4px 10px}
.lesson{font-size:16px;line-height:1.9;border-left:5px solid var(--ok);background:var(--oksoft);border-radius:0 8px 8px 0;padding:8px 12px;margin:0}
.lesson b{display:block;color:var(--ok);font-size:13px}
.stars{font-size:26px;color:var(--gold);letter-spacing:.1em;line-height:1}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px}
.flow li{display:flex;align-items:center;gap:4px}
.flow .fs{border:2px solid var(--seal);background:var(--sealsoft);border-radius:10px;padding:4px 10px;display:flex;flex-direction:column;align-items:center;line-height:1.45;min-width:3.5em}
.flow .fs b{font-size:16px;color:var(--ink)}
.flow .fs small{font-size:11px;color:var(--muted)}
.flow .ar{color:var(--seal);font-weight:700;font-size:18px;line-height:1}
.timeline{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px;margin:0}
.timeline dt{font-weight:700;color:var(--seal);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.timeline dd{margin:0}
.words{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.words li{border:1px solid var(--rule);border-radius:8px;padding:6px 12px;font-size:14px;line-height:1.7;background:var(--surface)}
.words li b{font-size:16px;color:var(--ink);margin-right:8px}
.figrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.fc{border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--surface);font-size:12px;line-height:1.5;display:flex;flex-direction:column}
.fc .fp{line-height:0;background:#fff}.fc .fp svg{display:block;width:100%;height:auto}
.fc .fn{padding:4px 8px;font-weight:700;font-size:14px}
.fc .fr{padding:0 8px 6px;color:var(--muted)}
.fc .gen{margin:0 8px 6px;align-self:flex-start;font-size:11px}
.fc.no .fp{display:grid;place-items:center;aspect-ratio:3/2;background:var(--pick);font-size:28px;line-height:1;color:var(--muted)}
.list{display:grid;gap:8px}
.st{border:2px solid var(--rule);background:var(--surface);border-radius:10px;padding:8px;cursor:pointer;text-align:left;display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--fg)}
.st:hover{border-color:var(--ink)}
.st .th{flex:none;width:96px;border-radius:6px;overflow:hidden;line-height:0;border:1px solid var(--rule);background:#fff}
.st .th svg{width:96px;height:64px;display:block}
.st .no{display:block;font-size:12px;font-weight:700;color:var(--seal);letter-spacing:.08em;line-height:1.4}
.st .nm{font-weight:700;font-size:17px;display:block;line-height:1.45}
.st .ds{font-size:13px;color:var(--muted);display:block;line-height:1.6}
.st .bd{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:0 10px;margin-top:2px}
.st .bd.ok{background:var(--oksoft);color:var(--ok)}
.st .bd.new{background:var(--pick);color:var(--muted)}
.st.lockd{opacity:.78}
.st.lockd .th,.st.soon .th{display:grid;place-items:center;height:64px;background:var(--pick);font-size:24px;line-height:1}
.st.soon{opacity:.55;cursor:default}
.free{border:1px dashed var(--seal);border-radius:8px;padding:8px 12px;font-size:14px;margin:0;background:var(--sealsoft)}
.cnt{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.cnt small{font-size:13px;color:var(--muted);font-family:var(--body)}
details.cards summary{cursor:pointer;font-weight:700;font-size:14px}
.paid{display:flex;flex-direction:column;gap:2px;border:2px solid var(--seal);border-radius:8px;padding:12px 14px;text-decoration:none;color:var(--fg);background:var(--sealsoft)}
.paid .pt{font-size:15px} .paid .pt b{font-family:var(--display);font-weight:400;color:var(--seal)}
.paid .pd{font-size:13px;color:var(--muted)}
.lock input{font:inherit;font-size:20px;padding:10px 12px;border:2px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--fg);width:100%;box-sizing:border-box}
.err{color:var(--ng);font-size:14px;margin:0;min-height:1.5em}
.shop{background:var(--pick);border-radius:8px;padding:12px 14px;font-size:14px}
.shop a{color:var(--seal);font-weight:700}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}.op:active{transform:none}}
</style>

<div class="wrap">
  <header>
    <h1><small>理科ゲーム・化学</small>化学者になりきろう（実験） 全6章</h1>
    <p class="lead">燃焼・気体・水溶液から、とけ方・状態変化まで、全6章。科学者になりきって、実験の次の一手を選ぼう。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script>
(function(){
const PAID=true;
const GID='hakase-k';
let ST=[];
const TITLES=[["lavoisier",1,"ラボアジエと燃焼の実験","ものの燃え方・質量保存",["実験クラブの小学生","ラボアジエ"],true],["boyle",2,"ボイルと空気・気体","空気の性質・気体の発生",["ボイル","実験クラブの小学生"],true],["suiyoueki",3,"水溶液のなかま分け","水溶液の性質・中和",["実験クラブの小学生","水溶液の研究者"],true],["yokai",4,"もののとけ方の研究","溶解度・再結晶・ろ過",["実験クラブの小学生","とけ方の研究者"],true],["joutai",5,"水のすがたの変化","状態変化・ふっとう",["実験クラブの小学生","ブラック"],true],["curie",6,"ドルトンとキュリー夫人","つぶの考え・研究の進め方",["ドルトン","実験クラブの小学生","キュリー夫人"],true]];
const app=document.getElementById('app');
const RB=/(?:｜([^｜《》]+)|([一-鿿々〆ヶ]+))《([^《》]+)》/g;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rb=s=>esc(s).replace(RB,(m,a,b,r)=>'<ruby>'+(a||b)+'<rt>'+r+'</rt></ruby>');
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const PAIDLINK="<a class=\"paid\" href=\"hakase-k-full.html\" id=\"paid-link\"><span class=\"pt\">ほかの実験もやりたい人へ　<b>化学者になりきろう（実験） 全6章</b>（有料版）</span><span class=\"pd\">無料版の第1章もふくむ全6章。ボイルと気体・水溶液と中和・溶解度と再結晶・水の状態変化・ドルトンとキュリー夫人。科学者カード集めつき。</span></a>";

/* ST=章 [{id,no,title,field,sub,start,len,figs:[[名前,よみ,説明,絵,generic]],note:[[名前,式]],nen:[[年,表示,できごと]],flow:[[名前,ひとこと]],ftitle,words:[[用語,説明]],
         sc:{場面id:{k:n/q/x/e,t:文,p:絵,nx:次,a:問い,c:[[ことば,行き先,icon?]],h:覚えておこう,l:まとめ,n:何番目,w:人,y:年の表示,ex:実験の札,sf:安全メモ}}}]
   TITLES=[[id,第何章,題名,分野,[人の名前],できているか]] */
const REC='hakase-k-p-rec', CARDK='hakase-k-cards';
let rec=store.get(REC,{}); if(!rec||typeof rec!=='object'||Array.isArray(rec))rec={}; const saveRec=()=>store.set(REC,rec);
let cards=store.get(CARDK,{}); if(!cards||typeof cards!=='object'||Array.isArray(cards))cards={};
const bump=(id,i)=>{const r=Array.isArray(rec[id])?rec[id]:[0,0];r[i]++;rec[id]=r;saveRec();};
const ckey=(id,nm)=>id+':'+nm;
const collect=(id,nm)=>{const k=ckey(id,nm);const isNew=!cards[k];if(isNew){cards[k]=Date.now();store.set(CARDK,cards);}return isNew;};
const ALLFIG=TITLES.flatMap(t=>t[4].map(nm=>ckey(t[0],nm)));
const nCards=()=>ALLFIG.filter(k=>cards[k]).length;
const GEN='実在の1人ではありません';
let G=null;
const top0=()=>{try{const y=app.getBoundingClientRect().top+window.scrollY-8;if(window.scrollY>y)window.scrollTo(0,y);}catch(e){}};
const figOf=(s,nm)=>s.figs.find(f=>f[0]===nm)||[nm,'','','',0];
const nameR=f=>f[1]?`<ruby>${esc(f[0])}<rt>${esc(f[1])}</rt></ruby>`:esc(f[0]);
const figCard=(s,f)=>{const got=!!cards[ckey(s.id,f[0])];
  return got?`<div class="fc"><span class="fp">${f[3]}</span><span class="fn">${nameR(f)}</span><span class="fr">${rb(f[2])}</span>${f[4]?`<span class="gen">${GEN}</span>`:''}</div>`
            :`<div class="fc no"><span class="fp">？</span><span class="fn">？？？</span><span class="fr">第${s.no}章「${rb(s.title)}」</span></div>`;};
function home(){
  G=null;
  const row=([id,no,title,field,figs,ok])=>{const s=ST.find(c=>c.id===id);
    if(s){const r=rec[id]||[0,0];
      return `<button class="st" data-id="${id}"><span class="th">${s.sc[s.start].p}</span><span><span class="no">第${no}章　${rb(field)}</span><span class="nm">${rb(title)}</span>
        <span class="ds">${s.figs.map(f=>esc(f[0])).join(' → ')}</span>
        ${r[0]?`<span class="bd ok">✓ クリア${r[0]>1?'（'+r[0]+'回）':''}</span>`:'<span class="bd new">まだ</span>'}${r[1]?` <span class="note" style="display:inline">ゲームオーバー ${r[1]}回</span>`:''}</span></button>`;}
    if(!PAID)return `<a class="st lockd" href="${GID}-full.html"><span class="th">🔒</span><span><span class="no">第${no}章　${rb(field)}</span><span class="nm">${rb(title)}</span><span class="ds">利用コードで遊べます</span></span></a>`;
    return `<div class="st soon"><span class="th">⏳</span><span><span class="no">第${no}章　${rb(field)}</span><span class="nm">${rb(title)}</span><span class="ds">じゅんび中</span></span></div>`;};
  const has=t=>ST.some(c=>c.id===t[0]);
  const rows=PAID?TITLES.map(row).join(''):TITLES.filter(has).map(row).join('')+`<div class="label" style="margin-top:6px">利用コードで遊べる章</div>`+TITLES.filter(t=>!has(t)).map(row).join('');
  const total=ALLFIG.length, got=nCards();
  const gal=ST.map(s=>s.figs.map(f=>figCard(s,f)).join('')).join('');
  const done=ST.filter(s=>(rec[s.id]||[0])[0]>0).length;
  app.innerHTML=`<div class="label">あそびかた</div>
    <p style="margin:0">章をえらぶと、有名な科学者（や、同じ実験をする現代の小学生）になりきって、発見のもとになった実験を進めます。場面ごとに「次にどうするか」を選ぼう。正しく選ぶと実験が進み、ちがうと「実際には…」で本当のことと理由がわかります。章の最後に「実験ノート」ができます。</p>
    <div class="row" style="justify-content:space-between"><span class="label" style="color:var(--fg)">集めた科学者カード</span><span class="cnt">${got}<small> / ${total}まい</small></span></div>
    <details class="cards"><summary>科学者カードを見る</summary><div class="figrow" style="margin-top:8px">${gal}</div></details>
    <div class="row" style="justify-content:space-between"><span class="label">章をえらぶ</span><span class="note">クリアした章 ${done} / ${ST.length}</span></div>
    ${PAID?'':`<p class="free">第${ST.map(s=>s.no).join('・')}章は無料。🔒の章は<b>利用コードで全${TITLES.length}章</b>遊べます。</p>`}
    <div class="list">${rows}</div>${PAID?`<div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`:PAIDLINK}`;
  app.querySelectorAll('button.st').forEach(b=>b.onclick=()=>play(ST.find(s=>s.id===b.dataset.id)));
  const rs=document.getElementById('reset');
  if(rs)rs.onclick=()=>{document.getElementById('resetq').innerHTML='本当に消しますか？（科学者カードも消えます） <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
    document.getElementById('yes').onclick=()=>{rec={};saveRec();cards={};store.set(CARDK,cards);home();};document.getElementById('no').onclick=home;};
}
function play(s){ G={s:s,who:null,from:null,pick:'',overs:0}; track('level_start',{level_name:GID+'-'+s.id}); show(s.start); }
function head(o){ const n=(o&&o.n)||0;
  return `<div class="top"><button class="linkbtn" id="back">← 章をえらぶ</button><div class="prog" aria-hidden="true"><i style="width:${Math.round(n/G.s.len*100)}%"></i></div>${G.who?`<span class="whochip">${esc(G.who)}</span>`:''}</div>`; }
const badges=o=>(o.y||o.ex)?`<div class="badges">${o.y?`<span class="yr">${esc(o.y)}</span>`:''}${o.ex?`<span class="ex${o.ex==='計算'?' calc':''}">${esc(o.ex)}</span>`:''}</div>`:'';
const safeBox=o=>o.sf?`<p class="safe"><b>⚠ 安全のために</b>${rb(o.sf)}</p>`:'';
function show(id){
  const s=G.s, o=s.sc[id];
  if(o.k==='x')return over(o);
  if(o.w&&o.w!==G.who)return switchCard(id);
  if(o.k==='e')return ending(o);
  render(id);
}
function switchCard(id){
  const s=G.s, o=s.sc[id], prev=G.who, f=figOf(s,o.w);
  if(prev)collect(s.id,prev);
  G.who=o.w;
  const nth=s.figs.findIndex(x=>x[0]===o.w)+1;
  app.innerHTML=`${head(o)}<div class="sw" role="group" aria-label="なりきる人の交代">
    <div class="swl">第${s.no}章　${rb(s.title)}　${nth?nth+'人目の人物':''}</div>
    ${prev?`<p class="got">✓「${esc(prev)}」の科学者カードを手に入れた！</p>`:''}
    <div class="swp">${f[3]}</div>
    <p class="swt">${prev?'ここからは、あなたは':'あなたは'}</p>
    <p class="swn">${nameR(f)}。</p>
    <p class="swr">${rb(f[2])}</p>${f[4]?`<span class="gen">${GEN}</span>`:''}
    <button class="btn go" id="nx">${esc(f[0])}になって進む ▶</button></div>`;
  document.getElementById('back').onclick=home;
  const nx=document.getElementById('nx'); nx.onclick=()=>o.k==='e'?ending(o):render(id);
  top0(); nx.focus({preventScroll:true});
}
function render(id){
  const s=G.s, o=s.sc[id];
  const ch=o.k==='q'?shuffle(o.c):null;
  app.innerHTML=`${head(o)}${badges(o)}<div class="pic">${o.p}</div>${safeBox(o)}<p class="txt">${rb(o.t)}</p>
    ${o.k==='q'?`<p class="ask">${rb(o.a)}</p><div class="ch">${ch.map((c,i)=>`<button class="op" data-i="${i}"><span class="k">${'アイウ'[i]}</span>${c[2]?`<span class="ic">${c[2]}</span>`:''}<span>${rb(c[0])}</span></button>`).join('')}</div>`
      :`<div class="row"><button class="btn go" id="nx">次へ ▶</button></div>`}`;
  document.getElementById('back').onclick=home;
  if(ch)app.querySelectorAll('.op').forEach(b=>b.onclick=()=>{const c=ch[+b.dataset.i];const ok=s.sc[c[1]].k!=='x';
    track('answer_question',{category:GID+'-'+s.id,question:id,correct:ok});
    if(!ok){G.from=id;G.pick=c[0];G.overs++;bump(s.id,1);} show(c[1]);});
  else document.getElementById('nx').onclick=()=>show(o.nx);
  top0();
}
function over(o){
  const s=G.s;
  app.innerHTML=`${head(s.sc[G.from]||{})}<div class="over"><h2>おっと、実験の結果とちがうみたい！</h2>
    <p class="pick">あなたが選んだのは：<b>${rb(G.pick)}</b></p>
    <div class="pic">${o.p}</div><p class="txt">${rb(o.t)}</p>${o.h?`<p class="hint"><b>覚えておこう</b>${rb(o.h)}</p>`:''}
    <div class="row"><button class="btn go" id="retry">この場面からやりなおす</button><button class="btn" id="first">最初から</button></div>
    <div><button class="linkbtn" id="list">章をえらぶ</button></div></div>`;
  document.getElementById('back').onclick=home;
  const rt=document.getElementById('retry');rt.onclick=()=>render(G.from);
  document.getElementById('first').onclick=()=>{G.who=null;show(s.start);};
  document.getElementById('list').onclick=home;
  top0(); rt.focus({preventScroll:true});
}
function flowHTML(s){
  return `<ol class="flow" aria-label="${esc(s.ftitle)}">${s.flow.map((e,i)=>`<li>${i?'<span class="ar" aria-hidden="true">→</span>':''}<span class="fs"><b>${rb(e[0])}</b>${e[1]?`<small>${rb(e[1])}</small>`:''}</span></li>`).join('')}</ol>`;
}
function ending(o){
  const s=G.s, stars=G.overs===0?3:G.overs<=2?2:1;
  if(G.who)collect(s.id,G.who);
  bump(s.id,0);
  track('level_end',{level_name:GID+'-'+s.id,success:true,score:stars});
  const ix=ST.indexOf(s), nx=ST[ix+1];
  app.innerHTML=`${head(o)}<p class="endh">🎉 第${s.no}章「${rb(s.title)}」クリア！</p>${badges(o)}<div class="pic">${o.p}</div><p class="txt">${rb(o.t)}</p>
    <section class="lab" aria-label="実験ノート"><h3>実験ノート</h3><dl>${s.note.map(e=>`<dt>${rb(e[0])}</dt><dd>${rb(e[1])}</dd>`).join('')}</dl></section>
    <p class="lesson"><b>この章のまとめ</b>${rb(o.l)}</p>
    <div class="row"><span class="stars" aria-label="星 ${stars}こ">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</span><span class="note">${G.overs?'ゲームオーバー '+G.overs+'回。次はノーミスをめざそう！':'ノーミスで最後まで進めた！'}</span></div>
    ${s.flow.length?`<div class="label">${rb(s.ftitle)}</div>${flowHTML(s)}`:''}
    ${s.nen.length?`<div class="label">年表</div><dl class="timeline">${s.nen.map(e=>`<dt>${esc(e[1])}</dt><dd>${rb(e[2])}</dd>`).join('')}</dl>`:''}
    <div class="label">なりきった人（科学者カード ${nCards()} / ${ALLFIG.length}まい）</div><div class="figrow">${s.figs.map(f=>figCard(s,f)).join('')}</div>
    <div class="label">受験で出る用語　${rb(s.field)}</div>
    <ul class="words">${s.words.map(w=>`<li><b>${rb(w[0])}</b>${rb(w[1])}</li>`).join('')}</ul>
    <div class="row">${nx?`<button class="btn go" id="next">次の章「${rb(nx.title)}」</button>`:''}<button class="btn${nx?'':' go'}" id="list">章をえらぶ</button><button class="linkbtn" id="again">もう一度この章を</button></div>${PAID?'':PAIDLINK}`;
  document.getElementById('back').onclick=home;
  if(nx)document.getElementById('next').onclick=()=>play(nx);
  document.getElementById('list').onclick=home;
  document.getElementById('again').onclick=()=>play(s);
  top0();
}
async function decrypt(){ return mnAccess.load('hakase-k'); }
function lockScreen(err){ mnAccess.lock(app,{game:'hakase-k',err:err,free:'hakase-k.html',onOpen:async()=>{ ST=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ ST=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
