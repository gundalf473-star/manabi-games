<title>比と比例・反比例クイズ</title>

<meta name="game:subject" content="算数">
<meta name="game:unit" content="比と比例・反比例">

}

body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.75;

.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

.lead{margin:4px 0 0;color:var(--muted);font-size:14px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px}
.label{font-size:12px;font-weight:700;color:var(--seal);letter-spacing:.1em}
.top{display:flex;align-items:center;gap:10px}
.prog{flex:1;height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--seal)}
.nums{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.tag{font-size:12px;font-weight:700;color:var(--ink);border:1px solid var(--ink);border-radius:4px;padding:0 6px;white-space:nowrap}
.q{margin:0;font-size:18px;font-weight:700;line-height:1.7}
.q em{font-style:normal;color:var(--seal);border-bottom:2px solid var(--seal)}
.ch{display:grid;gap:8px}
.op{border:2px solid var(--rule);background:var(--surface);border-radius:8px;padding:12px 14px;text-align:left;font-weight:700;cursor:pointer;line-height:1.5;display:flex;gap:10px;align-items:flex-start}
.op .k{flex:none;width:24px;height:24px;border-radius:50%;background:var(--pick);display:grid;place-items:center;font-size:13px}
.op:hover:not(:disabled){border-color:var(--ink);background:var(--pick)}
.op:disabled{cursor:default;opacity:.5}
.op.right{opacity:1;border-color:var(--ok);background:var(--oksoft);color:var(--ok)}
.op.wrong{opacity:1;border-color:var(--ng);background:var(--ngsoft);color:var(--ng)}
.res{display:flex;gap:14px;align-items:flex-start}
.seal{flex:none;width:64px;height:64px;border-radius:8px;border:3px solid var(--seal);color:var(--seal);display:grid;place-items:center;font-family:var(--mincho);font-size:26px;transform:rotate(-6deg)}

.res .t{display:flex;flex-direction:column;gap:6px}
.res .v{font-family:var(--display);font-size:20px}
.res .v.ok{color:var(--ok)} .res .v.ng{color:var(--ng)}
.ex{font-size:15px;border-left:4px solid var(--seal);padding:2px 0 2px 12px}

.matome{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0}
.matome dt{font-weight:700;color:var(--seal)}
.matome dd{margin:0}
.fig .gh{fill:#d9c8fb;stroke:#232a36;stroke-width:1.6;stroke-linejoin:round}
.fig .gw{fill:#fbfaf6;stroke:#232a36;stroke-width:1.6;stroke-linejoin:round}
.fig .gn{fill:none;stroke:#232a36;stroke-width:1.6;stroke-linejoin:round}

.fig .glab{fill:#232a36}
.tblw{overflow-x:auto}
.dtbl{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tblcap{font-size:13px;color:var(--muted);margin:0 0 6px}
.dtbl th,.dtbl td{border:1px solid var(--rule);padding:6px 4px;text-align:center}

.dtbl .rh{text-align:left;width:34%;font-size:13px}
.fig .tk{font-size:11px;fill:#5d6878;stroke:none;font-family:var(--body)}
.fig .pm{font-size:13px;fill:#232a36;stroke:none;font-weight:700}
.fig .lb{font-size:14px;fill:#1f7a5a;stroke:none;font-weight:700;font-family:var(--body)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:8px;padding:10px 20px;font-weight:700;cursor:pointer;background:var(--pick)}

.note{font-size:13px;color:var(--muted);margin:0}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.cat{border:2px solid var(--rule);background:var(--surface);border-radius:8px;padding:12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.cat:hover:not(:disabled){border-color:var(--ink)}
.cat:disabled{opacity:.4;cursor:default}
.cat .nm{font-weight:700;font-size:17px}
.cat .ds{font-size:12px;color:var(--muted);line-height:1.5}
.cat .best{font-size:12px;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}

.timeline dd{margin:0}
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.big{font-family:var(--display);font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:20px;font-family:var(--body)}
.rank{width:92px;height:92px;border-radius:50%;border:5px solid var(--seal);color:var(--seal);display:grid;place-items:center;font-family:var(--mincho);font-size:22px;transform:rotate(-10deg)}
.rv{border:1px solid var(--rule);border-radius:8px;padding:10px 14px;font-size:14px;background:var(--surface)}
.rv b{color:var(--ok)}
.paid{display:flex;flex-direction:column;gap:2px;border:2px solid var(--seal);border-radius:8px;padding:12px 14px;text-decoration:none;color:var(--fg);background:var(--sealsoft)}

const TIMELINE=`<dl class="matome"><dt>比を簡単にする</dt><dd>両方の数に同じ数をかけても、同じ数でわっても比は等しい。小数・分数の比は整数になおしてから約分する</dd><dt>比例</dt><dd>xが2倍、3倍…になると、yも2倍、3倍…。式は y＝決まった数×x。グラフは原点Oを通る直線</dd><dt>反比例</dt><dd>xが2倍、3倍…になると、yは1/2倍、1/3倍…。x×yが一定で、式は y＝決まった数÷x。グラフはなめらかな曲線</dd><dt>比例配分</dt><dd>全体をa：bに分けると、小さい方＝全体×a/(a＋b)。差や一方がわかるときは、比の1にあたる量を求める</dd><dt>連比</dt><dd>A：B＝2：3、B：C＝4：5 は、Bを3と4の最小公倍数12にそろえて A：B：C＝8：12：15</dd><dt>歯車</dt><dd>かみ合う歯車は、歯数×回転数が等しい。回転数の比は歯数の比の逆。同じ軸の歯車は回転数が同じ</dd><dt>輪じく・てこ</dt><dd>重さ×（支点や中心からの）きょり が左右で等しいとつり合う。輪じくでは 重さ×半径</dd><dt>速さ・時間・道のり</dt><dd>道のりが同じ → 速さの比と時間の比は逆。時間が同じ → 速さの比＝道のりの比。速さが同じ → 時間の比＝道のりの比</dd></dl>`;

    <div class="cats">${Object.entries(CATS).map(([k,[nm,ds]])=>{const m=QS.filter(q=>q.c===k&&state(q)==='master').length;const n=QS.filter(q=>q.c===k).length;
        return `<button class="cat" data-l="${k}"><span class="nm">${nm}</span><span class="ds">${ds}<br>覚えた ${m} / ${n}問</span><span class="best">${best[k]!=null?`ベスト ${best[k]}/10`:''}</span></button>`;}).join('')}
      <button class="cat" data-l="all"><span class="nm">比と比例・反比例まるごと</span><span class="ds">5つのレベルからランダムに10問</span><span class="best">${best.all!=null?`ベスト ${best.all}/10`:''}</span></button>
      ${window.mnReview?(()=>{const n=QS.filter(q=>mnReview.isDue(RVID,qkey(q))).length;return `<button class="cat" data-l="review" ${n?'':'disabled'}><span class="nm">今日の解き直し</span><span class="ds">前にまちがえた問題を、日をあけてもう一度（${n}問）</span></button>`;})():''}
      <button class="cat" data-l="weak" ${weak.length?'':'disabled'}><span class="nm">にがて</span><span class="ds">まちがえたことのある問題（${weak.length}問）</span></button>
      <button class="cat" data-l="fresh" ${fresh.length?'':'disabled'}><span class="nm">まだやっていない</span><span class="ds">一度も出ていない問題（${fresh.length}問）</span></button></div>
    <details><summary style="cursor:pointer;font-weight:700;font-size:14px">比と比例・反比例のまとめを見る</summary><div style="margin-top:8px">${TIMELINE}</div></details>
    <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
  app.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{
    const l=b.dataset.l; course=l;
    const pool=l==='review'?QS.filter(q=>mnReview.isDue(RVID,qkey(q))):l==='weak'?weak:l==='fresh'?fresh:l==='all'?QS:QS.filter(q=>q.c===l);
    start(shuffle(pool).slice(0,10));
  });
  document.getElementById('reset').onclick=()=>{
    document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
    document.getElementById('yes').onclick=()=>{rec={};saveRec();homePaid();};
    document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
  };
}
function start(list){
  G={list,i:0,score:0,miss:[],n:list.length};
  track('level_start',{level_name:(PAID?'hirei-p-':'hirei-')+course});
  newQ();
}
function geoSVG(G){
  /* 図形の図。座標はcm、yは上向き。色つき＝gh、くりぬき＝gw */
  const P=[]; const add=(x,y)=>P.push([x,y]);
  const rad=a=>a*Math.PI/180;
  G.forEach(e=>{const t=e[0];
    if(t==='poly') e[1].forEach(p=>add(p[0],p[1]));
    if(t==='circ'){add(e[1]-e[3],e[2]-e[3]);add(e[1]+e[3],e[2]+e[3]);}
    if(t==='sect'||t==='arc'){const [,cx,cy,r,a1,a2]=e; if(t==='sect')add(cx,cy); for(let a=a1;a<=a2+1e-9;a+=Math.min(15,a2-a1||15)) add(cx+r*Math.cos(rad(a)),cy+r*Math.sin(rad(a))); add(cx+r*Math.cos(rad(a2)),cy+r*Math.sin(rad(a2)));}
    if(t==='path') e[1].forEach(c=>add(c[c.length-2],c[c.length-1]));
    if(t==='seg'||t==='dim'){add(e[1],e[2]);add(e[3],e[4]);}
    if(t==='lab'||t==='dot'||t==='ra') add(e[1],e[2]);
  });
  const xs=P.map(p=>p[0]), ys=P.map(p=>p[1]);
  const mnx=Math.min(...xs), mxx=Math.max(...xs), mny=Math.min(...ys), mxy=Math.max(...ys);
  const W=Math.max(mxx-mnx,1), H=Math.max(mxy-mny,1), s=Math.min(236/W,160/H), pad=40, VW=320, ox=(VW-W*s)/2;
  const X=x=>+(ox+(x-mnx)*s).toFixed(1), Y=y=>+(pad+(mxy-y)*s).toFixed(1);
  const cls=f=>f==='h'?'gh':f==='w'?'gw':'gn';
  const pt=(cx,cy,r,a)=>[X(cx+r*Math.cos(rad(a))),Y(cy+r*Math.sin(rad(a)))];
  let o='';
  G.forEach(e=>{const t=e[0];
    if(t==='poly') o+=`<path class="${cls(e[2])}" d="M${e[1].map(p=>X(p[0])+','+Y(p[1])).join(' L')} Z"/>`;
    if(t==='circ') o+=`<circle class="${cls(e[4])}" cx="${X(e[1])}" cy="${Y(e[2])}" r="${(e[3]*s).toFixed(1)}"/>`;
    if(t==='sect'||t==='arc'){const [,cx,cy,r,a1,a2]=e, f=e[6], R=(r*s).toFixed(1), p1=pt(cx,cy,r,a1), p2=pt(cx,cy,r,a2), lg=(a2-a1)>180?1:0;
      o+= t==='sect'?`<path class="${cls(f)}" d="M${X(cx)},${Y(cy)} L${p1} A${R},${R} 0 ${lg} 0 ${p2} Z"/>`:`<path class="gn" d="M${p1} A${R},${R} 0 ${lg} 0 ${p2}"/>`;}
    if(t==='path'){ let d=''; e[1].forEach(c=>{ if(c[0]==='M')d+=`M${X(c[1])},${Y(c[2])} `; if(c[0]==='L')d+=`L${X(c[1])},${Y(c[2])} `; if(c[0]==='A'){const R=(c[1]*s).toFixed(1); d+=`A${R},${R} 0 ${c[2]} ${c[3]?0:1} ${X(c[4])},${Y(c[5])} `;} }); o+=`<path class="${cls(e[2])}" d="${d}Z"/>`; }
    if(t==='seg') o+=`<line class="gn${e[5]?' gd':''}" x1="${X(e[1])}" y1="${Y(e[2])}" x2="${X(e[3])}" y2="${Y(e[4])}"/>`;
    if(t==='dot') o+=`<circle class="gdot" cx="${X(e[1])}" cy="${Y(e[2])}" r="2.6"/>`;
    if(t==='lab') o+=`<text class="glab" x="${X(e[1])}" y="${Y(e[2])+4}" text-anchor="middle">${esc(e[3])}</text>`;
    if(t==='ra'){const [,x,y,ux,uy,vx,vy]=e, lu=Math.hypot(ux,uy), lv=Math.hypot(vx,vy), k=7;
      const a=[X(x)+ux/lu*k, Y(y)-uy/lu*k], b=[X(x)+ux/lu*k+vx/lv*k, Y(y)-uy/lu*k-vy/lv*k], c=[X(x)+vx/lv*k, Y(y)-vy/lv*k];
      o+=`<path class="gn gthin" d="M${a} L${b} L${c}"/>`;}
    if(t==='dim'){const [,x1,y1,x2,y2,txt,off]=e; const sx1=X(x1),sy1=Y(y1),sx2=X(x2),sy2=Y(y2); const dx=sx2-sx1, dy=sy2-sy1, L=Math.hypot(dx,dy)||1;
      const nx=dy/L, ny=-dx/L, k=off*13; const a=[sx1+nx*k,sy1+ny*k], b=[sx2+nx*k,sy2+ny*k];
      const tk=(p)=>`<line class="gdim" x1="${p[0]-nx*4}" y1="${p[1]-ny*4}" x2="${p[0]+nx*4}" y2="${p[1]+ny*4}"/>`;
      const m=[(a[0]+b[0])/2+nx*(off>0?9:-9)*Math.sign(off||1)*0+nx*Math.sign(off||1)*9,(a[1]+b[1])/2+ny*Math.sign(off||1)*9];
      o+=`<line class="gdim" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>${tk(a)}${tk(b)}<text class="gdt" x="${m[0].toFixed(1)}" y="${(m[1]+4).toFixed(1)}" text-anchor="middle">${esc(txt)}</text>`;}
  });
  return `<div class="fig"><svg viewBox="0 0 ${VW} ${(H*s+2*pad).toFixed(0)}" role="img" aria-label="問題の図">${o}</svg></div>`;
}
function figSVG(f){
  if(f.geo) return geoSVG(f.geo);
  if(f.tbl){ const t=f.tbl; return `<div class="tblw">${t.cap?`<p class="tblcap">${esc(t.cap)}</p>`:''}<table class="dtbl"><tr>${t.head.map((h,i)=>`<th${i?'':' class="rh"'}>${esc(h)}</th>`).join('')}</tr>${t.rows.map(r=>`<tr>${r.map((c,i)=>i?`<td>${esc(c)}</td>`:`<th class="rh">${esc(c)}</th>`).join('')}</tr>`).join('')}</table></div>`; }
  /* てこ・棒・ばねの図。線は濃い色、おもりは四角、ばねばかりの引く力は矢印 */
  const L=(a,b,c,d)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}"/>`;
  const T=(x,y,t,cls,anc)=>`<text x="${x}" y="${y}" class="${cls||'lb'}" text-anchor="${anc||'middle'}">${esc(t)}</text>`;
  const W=(x,y,lb)=>`<rect x="${x-14}" y="${y}" width="28" height="20" rx="2" fill="#dfe3ea"/>`+T(x,y+36,lb);
  const UP=(x,y1,y2,lb)=>L(x,y1,x,y2)+`<path d="M${x-6},${y2+9} L${x},${y2} L${x+6},${y2+9}"/>`+T(x,y2-6,lb);
  const DN=(x,y1,y2,lb)=>L(x,y1,x,y2)+`<path d="M${x-6},${y2-9} L${x},${y2} L${x+6},${y2-9}"/>`+T(x,y2+16,lb);
  const spr=(x,y1,y2)=>{const n=8,h=(y2-y1-12)/n;let d=`M${x},${y1} L${x},${y1+6}`;for(let i=0;i<n;i++)d+=` L${x+(i%2?-9:9)},${y1+6+h*(i+.5)}`;d+=` L${x},${y2-6} L${x},${y2}`;return `<path d="${d}"/>`;};
  const sprH=(x1,x2,y)=>{const n=8,w=(x2-x1-12)/n;let d=`M${x1},${y} L${x1+6},${y}`;for(let i=0;i<n;i++)d+=` L${x1+6+w*(i+.5)},${y+(i%2?-9:9)}`;d+=` L${x2-6},${y} L${x2},${y}`;return `<path d="${d}"/>`;};
  const ceil=(a,b)=>L(a,14,b,14)+Array.from({length:Math.floor((b-a)/12)},(_,i)=>L(a+6+i*12,14,a+i*12,6)).join('');
  let g='',vb='0 0 320 170';
  if(f.lev){ const o=f.lev,c=160,u=22,y=48; vb='0 0 320 140';
    g+=`<rect x="${c-6*u-10}" y="${y-3}" width="${12*u+20}" height="6" rx="2" fill="#c9ced8"/>`;
    for(let i=1;i<=6;i++){ g+=L(c-i*u,y-3,c-i*u,y+3)+L(c+i*u,y-3,c+i*u,y+3)+T(c-i*u,y-9,String(i),'tk')+T(c+i*u,y-9,String(i),'tk'); }
    g+=`<path d="M${c},${y+3} L${c-10},${y+28} L${c+10},${y+28} Z" fill="#c9ced8"/>`+L(c-15,y+28,c+15,y+28);
    const hang=(x,lb,k)=>{ if(lb[0]==='↓') return DN(x,y+3,y+60,lb.slice(1)); return L(x,y+3,x,y+42+k*0)+W(x,y+42,lb); };
    o.L.forEach(([p,lb])=>g+=hang(c-p*u,lb,0)); o.R.forEach(([p,lb])=>g+=hang(c+p*u,lb,0));
  }
  if(f.bar){ const o=f.bar,x0=30,x1=290,y=74,X=p=>x0+p/o.len*(x1-x0); vb='0 0 320 175';
    g+=`<rect x="${x0}" y="${y-4}" width="${x1-x0}" height="8" rx="2" fill="#c9ced8"/>`+T(160,y-34,'棒の長さ '+o.len+'cm','tk');
    g+=L(x0,y-24,x0,y-16)+L(x1,y-24,x1,y-16)+L(x0,y-20,x1,y-20);
    if(o.f!=null){ const fx=X(o.f); g+=`<path d="M${fx},${y+4} L${fx-12},${y+28} L${fx+12},${y+28} Z" fill="#c9ced8"/>`+T(fx,y+42,'支点','tk'); if(o.f>0&&o.f<o.len) g+=T((x0+fx)/2,y+18,o.f+'cm','tk'); }
    if(o.m) g+=`<circle cx="160" cy="${y}" r="3.5" fill="#232a36" stroke="none"/>`+T(160,y+60,'棒の重さ '+o.m+'（一様）','tk');
    (o.w||[]).forEach(([p,lb])=>{const x=X(p); g+=L(x,y+4,x,y+20)+W(x,y+20,lb); if(p>0&&p<o.len) g+=T((x0+x)/2,y+18,p+'cm','tk');});
    (o.up||[]).forEach(([p,lb])=>{const x=X(p); g+=UP(x,y-4,y-46+12,lb).replace('','');});
  }
  if(f.spr){ const o=f.spr,w=o.w; vb='0 0 320 200';
    if(o.t==='one') g+=ceil(130,190)+spr(160,14,110)+W(160,110,w[0]);
    if(o.t==='ser') g+=ceil(130,190)+spr(160,14,72)+`<circle cx="160" cy="76" r="4" fill="#232a36" stroke="none"/>`+spr(160,80,140)+W(160,140,w[0])+T(184,48,'A','tk','start')+T(184,114,'A','tk','start');
    if(o.t==='ser2') g+=ceil(130,190)+spr(160,14,66)+`<rect x="146" y="66" width="28" height="20" rx="2" fill="#dfe3ea"/>`+T(186,81,w[0],'lb','start')+spr(160,86,142)+W(160,142,w[1]);
    if(o.t==='par') g+=ceil(80,240)+spr(110,14,104)+spr(210,14,104)+`<rect x="90" y="104" width="140" height="6" rx="2" fill="#c9ced8"/>`+L(160,110,160,124)+W(160,124,w[0]);
    if(o.t==='paroff') g+=ceil(80,240)+spr(100,14,104)+spr(220,14,104)+`<rect x="96" y="104" width="128" height="6" rx="2" fill="#c9ced8"/>`+L(140,110,140,124)+W(140,124,w[0])+T(120,100,'10cm','tk')+T(180,100,'20cm','tk');
    if(o.t==='wall') g+=sprH(100,220,40)+L(70,40,100,40)+L(220,40,250,40)+`<circle cx="70" cy="52" r="12"/><circle cx="250" cy="52" r="12"/>`+L(58,52,58,110)+L(262,52,262,110)+W(58,110,w[0])+W(262,110,w[1])+L(70,64,250,64);
  }
  return `<div class="fig"><svg viewBox="${vb}" role="img" aria-label="問題の図"><g stroke="#232a36" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">${g}</g></svg></div>`;
}
function newQ(){ const q=G.list[G.i]; G.ch=shuffle([q.a,...q.d]); G.done=false; G.pick=null; render(); }
function render(){
  const q=G.list[G.i], d=G.done;
  app.innerHTML=`<div class="top"><div class="prog" aria-hidden="true"><i style="width:${G.i/G.n*100}%"></i></div><span class="nums">${G.i+1} / ${G.n}</span><span class="tag">${CATS[q.c][0]}</span></div>
    <p class="q">${qhtml(q.q)}</p>
    ${q.fig?figSVG(q.fig):''}
    <div class="ch">${G.ch.map((c,i)=>`<button class="op ${d?(c===q.a?'right':c===G.pick?'wrong':''):''}" data-i="${i}" ${d?'disabled':''}><span class="k">${'アイウエ'[i]}</span><span>${esc(c)}</span></button>`).join('')}</div>
    <div id="after"></div>`;
  app.querySelectorAll('.op').forEach(b=>b.onclick=()=>pick(G.ch[+b.dataset.i]));
  if(d)explain();
}
function pick(c){
  if(G.done)return;
  const q=G.list[G.i];
  G.done=true; G.pick=c; G.ok=c===q.a; G.newM=record(q,G.ok);
  if(G.ok)G.score++; else G.miss.push(q);
  track('answer_question',{category:'hirei-'+q.c,question:q.q.slice(0,90),correct:G.ok});
  render();
}
function explain(){
  const q=G.list[G.i], last=G.i===G.n-1;
  document.getElementById('after').innerHTML=`<div class="box" style="padding:14px;gap:12px;border-color:${G.ok?'var(--ok)':'var(--ng)'}">
    <div class="res"><div class="seal ${G.ok?'':'x'}" aria-hidden="true">${G.ok?'正':'惜'}</div>
      <div class="t"><span class="v ${G.ok?'ok':'ng'}">${G.ok?'正解！':'ざんねん'}${G.newM?'<span style="font-size:13px;margin-left:8px;color:var(--ok);font-family:var(--body);font-weight:700">覚えた！</span>':''}</span>
      <span>答え：<b>${esc(q.a)}</b></span></div></div>
    <div class="ex">${esc(q.e)}</div>
    <div class="row"><button class="btn go" id="next">${last?'結果を見る':'次の問題へ'}</button></div></div>`;
  const nx=document.getElementById('next'); nx.onclick=next; nx.focus({preventScroll:true});
}
function next(){ if(++G.i<G.n)newQ(); else result(); }
function result(){
  const n=G.n,s=G.score,r=s/n;
  const rank=r===1?'満点':r>=.8?'特選':r>=.6?'入選':r>=.4?'佳作':'もう一歩';
  track('level_end',{level_name:(PAID?'hirei-p-':'hirei-')+course,success:s===n,score:s,total:n});
  const bk=PAID?(CATS[course]||course==='all'?course:null):'free';
  if(bk&&(best[bk]==null||s>best[bk])){best[bk]=s;store.set(PAID?'hirei-p-best':'hirei-best',best);}
  app.innerHTML=`<div class="label">結果</div>
    <div class="score"><div class="big">${s}<small> / ${n}問</small></div><div class="rank">${rank}</div></div>
    <p style="margin:0">${r===1?'全問正解！比と比例・反比例はばっちりです。':r>=.6?'よくできました。まちがえた問題の解説を読み直そう。':'まちがえた問題の解き方を読み直して、もう一度ちょうせんしよう。'}</p>
    <div class="row"><button class="btn go" id="again">${PAID?'分野をえらぶ':'もう一度'}</button>${G.miss.length?'<button class="btn" id="retry">まちがえた問題だけ</button>':''}</div>
    ${PAID?'':PAIDLINK}
    ${G.miss.length?`<div class="label" style="color:var(--fg)">まちがえた問題</div>${G.miss.map(q=>`<div class="rv">${esc(q.q)}<br>→ <b>${esc(q.a)}</b></div>`).join('')}`:''}`;
  document.getElementById('again').onclick=()=>PAID?home():(course='free',start(shuffle(QS)));
  const rt=document.getElementById('retry'); if(rt)rt.onclick=()=>{course='retry';start(shuffle(G.miss));};
}
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
