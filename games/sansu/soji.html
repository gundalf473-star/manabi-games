function geoSVG(G){

    if(t==='sect'||t==='arc'){const [,cx,cy,r,a1,a2]=e; if(t==='sect')add(cx,cy); for(let a=a1;a<=a2+1e-9;a+=Math.min(15,a2-a1||15)) add(cx+r*Math.cos(rad(a)),cy+r*Math.sin(rad(a))); add(cx+r*Math.cos(rad(a2)),cy+r*Math.sin(rad(a2)));}

    if(t==='circ') o+=`<circle class="${cls(e[4])}" cx="${X(e[1])}" cy="${Y(e[2])}" r="${(e[3]*s).toFixed(1)}"/>`;

      o+= t==='sect'?`<path class="${cls(f)}" d="M${X(cx)},${Y(cy)} L${p1} A${R},${R} 0 ${lg} 0 ${p2} Z"/>`:`<path class="gn" d="M${p1} A${R},${R} 0 ${lg} 0 ${p2}"/>`;}
    if(t==='path'){ let d=''; e[1].forEach(c=>{ if(c[0]==='M')d+=`M${X(c[1])},${Y(c[2])} `; if(c[0]==='L')d+=`L${X(c[1])},${Y(c[2])} `; if(c[0]==='A'){const R=(c[1]*s).toFixed(1); d+=`A${R},${R} 0 ${c[2]} ${c[3]?0:1} ${X(c[4])},${Y(c[5])} `;} }); o+=`<path class="${cls(e[2])}" d="${d}Z"/>`; }

        else o+=`<line class="gn gthin" x1="${(px-uy*6).toFixed(1)}" y1="${(py+ux*6).toFixed(1)}" x2="${(px+uy*6).toFixed(1)}" y2="${(py-ux*6).toFixed(1)}"/>`; } }
    if(t==='dim'){const [,x1,y1,x2,y2,txt,off]=e; const sx1=X(x1),sy1=Y(y1),sx2=X(x2),sy2=Y(y2); const dx=sx2-sx1, dy=sy2-sy1, L=Math.hypot(dx,dy)||1;
      const nx=dy/L, ny=-dx/L, k=off*13; const a=[sx1+nx*k,sy1+ny*k], b=[sx2+nx*k,sy2+ny*k];
      const tk=(p)=>`<line class="gdim" x1="${p[0]-nx*4}" y1="${p[1]-ny*4}" x2="${p[0]+nx*4}" y2="${p[1]+ny*4}"/>`;
      const m=[(a[0]+b[0])/2+nx*(off>0?9:-9)*Math.sign(off||1)*0+nx*Math.sign(off||1)*9,(a[1]+b[1])/2+ny*Math.sign(off||1)*9];

}

  app.innerHTML=`<div class="label">結果</div>
    <div class="score"><div class="big">${s}<small> / ${n}問</small></div><div class="rank">${rank}</div></div>
    <p style="margin:0">${r===1?'全問正解！図形の相似はばっちりです。':r>=.6?'よくできました。まちがえた問題の解説を読み直そう。':'まちがえた問題は、どの三角形とどの三角形が相似か、対応する辺はどれかを、解き方で確かめよう。'}</p>
    <div class="row"><button class="btn go" id="again">${PAID?'分野をえらぶ':'もう一度'}</button>${G.miss.length?'<button class="btn" id="retry">まちがえた問題だけ</button>':''}</div>
    ${PAID?'':PAIDLINK}
    ${G.miss.length?`<div class="label" style="color:var(--fg)">まちがえた問題</div>${G.miss.map(q=>`<div class="rv">${esc(q.q)}<br>→ <b>${esc(q.a)}</b></div>`).join('')}`:''}`;
  document.getElementById('again').onclick=()=>PAID?home():(course='free',start(shuffle(QS)));
  const rt=document.getElementById('retry'); if(rt)rt.onclick=()=>{course='retry';start(shuffle(G.miss));};
}
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
