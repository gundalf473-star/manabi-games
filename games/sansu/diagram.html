<title>鉄道ダイヤを作ろう</title>
<meta name="game:subject" content="算数">
<meta name="game:unit" content="鉄道ダイヤを作ろう（速さ）">
<meta name="game:grade" content="小5〜">
<meta name="game:players" content="1人">
<meta name="description" content="架空の鉄道「はこにわ鉄道」の運転士やダイヤ係になりきって、速さの文章題を解く算数ゲーム。第1章「運転士デビューの日」では、速さ・時間・道のりの関係と、時速・分速・秒速の換算を、式と計算で確かめます。ダイヤ係ノートと受験で出る用語のまとめつき。">

.sw .got{margin:0;font-size:14px;font-weight:700;color:var(--ok);background:var(--surface);border-radius:99px;padding:2px 14px}

.sw .swt{margin:0;font-size:17px;font-weight:700}

.stars{font-size:26px;color:var(--gold);letter-spacing:.1em;line-height:1}

.flow .fs b{font-size:16px;color:var(--ink)}

.list{display:grid;gap:8px}

.st .bd.new{background:var(--pick);color:var(--muted)}

</style>

const REC='diagram-p-rec', CARDK='diagram-cards';
let rec=store.get(REC,{}); if(!rec||typeof rec!=='object'||Array.isArray(rec))rec={}; const saveRec=()=>store.set(REC,rec);
let cards=store.get(CARDK,{}); if(!cards||typeof cards!=='object'||Array.isArray(cards))cards={};
const bump=(id,i)=>{const r=Array.isArray(rec[id])?rec[id]:[0,0];r[i]++;rec[id]=r;saveRec();};
const ckey=(id,nm)=>id+':'+nm;
const collect=(id,nm)=>{const k=ckey(id,nm);const isNew=!cards[k];if(isNew){cards[k]=Date.now();store.set(CARDK,cards);}return isNew;};
const ALLFIG=TITLES.flatMap(t=>t[4].map(nm=>ckey(t[0],nm)));
const nCards=()=>ALLFIG.filter(k=>cards[k]).length;
const GEN='実在の1人ではありません';
let G=null;

const nameR=f=>f[1]?`<ruby>${esc(f[0])}<rt>${esc(f[1])}</rt></ruby>`:esc(f[0]);
const figCard=(s,f)=>{const got=!!cards[ckey(s.id,f[0])];
  return got?`<div class="fc"><span class="fp">${f[3]}</span><span class="fn">${nameR(f)}</span><span class="fr">${rb(f[2])}</span>${f[4]?`<span class="gen">${GEN}</span>`:''}</div>`
            :`<div class="fc no"><span class="fp">？</span><span class="fn">？？？</span><span class="fr">第${s.no}章「${rb(s.title)}」</span></div>`;};
function home(){
  G=null;
  const row=([id,no,title,field,figs,ok])=>{const s=ST.find(c=>c.id===id);
    if(s){const r=rec[id]||[0,0];
      return `<button class="st" data-id="${id}"><span class="th">${s.sc[s.start].p}</span><span><span class="no">第${no}章　${rb(field)}</span><span class="nm">${rb(title)}</span>
        <span class="ds">${s.figs.map(f=>esc(f[0])).join(' → ')}</span>
        ${r[0]?`<span class="bd ok">✓ クリア${r[0]>1?'（'+r[0]+'回）':''}</span>`:'<span class="bd new">まだ</span>'}${r[1]?` <span class="note" style="display:inline">ゲームオーバー ${r[1]}回</span>`:''}</span></button>`;}
    if(!PAID)return `<a class="st lockd" href="${GID}-full.html"><span class="th">🔒</span><span><span class="no">第${no}章　${rb(field)}</span><span class="nm">${rb(title)}</span><span class="ds">利用コードで遊べます</span></span></a>`;
    return `<div class="st soon"><span class="th">⏳</span><span><span class="no">第${no}章　${rb(field)}</span><span class="nm">${rb(title)}</span><span class="ds">じゅんび中</span></span></div>`;};
  const has=t=>ST.some(c=>c.id===t[0]);
  const rows=PAID?TITLES.map(row).join(''):TITLES.filter(has).map(row).join('')+`<div class="label" style="margin-top:6px">利用コードで遊べる章</div>`+TITLES.filter(t=>!has(t)).map(row).join('');
  const total=ALLFIG.length, got=nCards();
  const gal=ST.map(s=>s.figs.map(f=>figCard(s,f)).join('')).join('');
  const done=ST.filter(s=>(rec[s.id]||[0])[0]>0).length;
  app.innerHTML=`<div class="label">あそびかた</div>
    <p style="margin:0">章をえらぶと、架空の鉄道「はこにわ鉄道」の運転士やダイヤ係になりきって、列車の時刻や速さを決めていきます。場面ごとに、答えの数や解き方を選ぼう。正しく選ぶと列車が進み、ちがうと「実際には…」で正しい答えと理由がわかります。章の最後に「ダイヤ係ノート」ができます。</p>
    <div class="row" style="justify-content:space-between"><span class="label" style="color:var(--fg)">集めた乗務員カード</span><span class="cnt">${got}<small> / ${total}まい</small></span></div>
    <details class="cards"><summary>乗務員カードを見る</summary><div class="figrow" style="margin-top:8px">${gal}</div></details>
    <div class="row" style="justify-content:space-between"><span class="label">章をえらぶ</span><span class="note">クリアした章 ${done} / ${ST.length}</span></div>
    ${PAID?'':`<p class="free">第${ST.map(s=>s.no).join('・')}章は無料。🔒の章は<b>利用コードで全${TITLES.length}章</b>遊べます。</p>`}
    <div class="list">${rows}</div>${PAID?`<div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`:PAIDLINK}`;
  app.querySelectorAll('button.st').forEach(b=>b.onclick=()=>play(ST.find(s=>s.id===b.dataset.id)));
  const rs=document.getElementById('reset');
  if(rs)rs.onclick=()=>{document.getElementById('resetq').innerHTML='本当に消しますか？（乗務員カードも消えます） <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
    document.getElementById('yes').onclick=()=>{rec={};saveRec();cards={};store.set(CARDK,cards);home();};document.getElementById('no').onclick=home;};
}
function play(s){ G={s:s,who:null,from:null,pick:'',overs:0}; track('level_start',{level_name:GID+'-'+s.id}); show(s.start); }
function head(o){ const n=(o&&o.n)||0;
  return `<div class="top"><button class="linkbtn" id="back">← 章をえらぶ</button><div class="prog" aria-hidden="true"><i style="width:${Math.round(n/G.s.len*100)}%"></i></div>${G.who?`<span class="whochip">${esc(G.who)}</span>`:''}</div>`; }
const badges=o=>o.ex?`<div class="badges">${o.ex?`<span class="ex${o.ex==='計算'?' calc':''}">${esc(o.ex)}</span>`:''}</div>`:'';
function show(id){
  const s=G.s, o=s.sc[id];
  if(o.k==='x')return over(o);
  if(o.w&&o.w!==G.who)return switchCard(id);
  if(o.k==='e')return ending(o);
  render(id);
}
function switchCard(id){
  const s=G.s, o=s.sc[id], prev=G.who, f=figOf(s,o.w);
  if(prev)collect(s.id,prev);
  G.who=o.w;
  const nth=s.figs.findIndex(x=>x[0]===o.w)+1;
  app.innerHTML=`${head(o)}<div class="sw" role="group" aria-label="なりきる人の交代">
    <div class="swl">第${s.no}章　${rb(s.title)}　${nth?nth+'人目の人物':''}</div>
    ${prev?`<p class="got">✓「${esc(prev)}」の乗務員カードを手に入れた！</p>`:''}
    <div class="swp">${f[3]}</div>
    <p class="swt">${prev?'ここからは、あなたは':'あなたは'}</p>
    <p class="swn">${nameR(f)}。</p>
    <p class="swr">${rb(f[2])}</p>${f[4]?`<span class="gen">${GEN}</span>`:''}
    <button class="btn go" id="nx">${esc(f[0])}になって進む ▶</button></div>`;
  document.getElementById('back').onclick=home;
  const nx=document.getElementById('nx'); nx.onclick=()=>o.k==='e'?ending(o):render(id);
  top0(); nx.focus({preventScroll:true});
}
function render(id){
  const s=G.s, o=s.sc[id];
  const ch=o.k==='q'?shuffle(o.c):null;
  app.innerHTML=`${head(o)}${badges(o)}<div class="pic">${o.p}</div><p class="txt">${rb(o.t)}</p>
    ${o.k==='q'?`<p class="ask">${rb(o.a)}</p><div class="ch">${ch.map((c,i)=>`<button class="op" data-i="${i}"><span class="k">${'アイウ'[i]}</span>${c[2]?`<span class="ic">${c[2]}</span>`:''}<span>${rb(c[0])}</span></button>`).join('')}</div>`
      :`<div class="row"><button class="btn go" id="nx">次へ ▶</button></div>`}`;
  document.getElementById('back').onclick=home;
  if(ch)app.querySelectorAll('.op').forEach(b=>b.onclick=()=>{const c=ch[+b.dataset.i];const ok=s.sc[c[1]].k!=='x';
    track('answer_question',{category:GID+'-'+s.id,question:id,correct:ok});
    if(!ok){G.from=id;G.pick=c[0];G.overs++;bump(s.id,1);} show(c[1]);});
  else document.getElementById('nx').onclick=()=>show(o.nx);
  top0();
}
function over(o){
  const s=G.s;
  app.innerHTML=`${head(s.sc[G.from]||{})}<div class="over"><h2>おっと、計算が合わないみたい！</h2>
    <p class="pick">あなたが選んだのは：<b>${rb(G.pick)}</b></p>
    <div class="pic">${o.p}</div><p class="txt">${rb(o.t)}</p>${o.h?`<p class="hint"><b>覚えておこう</b>${rb(o.h)}</p>`:''}
    <div class="row"><button class="btn go" id="retry">この場面からやりなおす</button><button class="btn" id="first">最初から</button></div>
    <div><button class="linkbtn" id="list">章をえらぶ</button></div></div>`;
  document.getElementById('back').onclick=home;
  const rt=document.getElementById('retry');rt.onclick=()=>render(G.from);
  document.getElementById('first').onclick=()=>{G.who=null;show(s.start);};
  document.getElementById('list').onclick=home;
  top0(); rt.focus({preventScroll:true});
}
function flowHTML(s){
  return `<ol class="flow" aria-label="${esc(s.ftitle)}">${s.flow.map((e,i)=>`<li>${i?'<span class="ar" aria-hidden="true">→</span>':''}<span class="fs"><b>${rb(e[0])}</b>${e[1]?`<small>${rb(e[1])}</small>`:''}</span></li>`).join('')}</ol>`;
}
function ending(o){
  const s=G.s, stars=G.overs===0?3:G.overs<=2?2:1;
  if(G.who)collect(s.id,G.who);
  bump(s.id,0);
  track('level_end',{level_name:GID+'-'+s.id,success:true,score:stars});
  const ix=ST.indexOf(s), nx=ST[ix+1];
  app.innerHTML=`${head(o)}<p class="endh">🎉 第${s.no}章「${rb(s.title)}」クリア！</p>${badges(o)}<div class="pic">${o.p}</div><p class="txt">${rb(o.t)}</p>
    <section class="lab" aria-label="ダイヤ係ノート"><h3>ダイヤ係ノート</h3><dl>${s.note.map(e=>`<dt>${rb(e[0])}</dt><dd>${rb(e[1])}</dd>`).join('')}</dl></section>
    <p class="lesson"><b>この章のまとめ</b>${rb(o.l)}</p>
    <div class="row"><span class="stars" aria-label="星 ${stars}こ">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</span><span class="note">${G.overs?'ゲームオーバー '+G.overs+'回。次はノーミスをめざそう！':'ノーミスで最後まで進めた！'}</span></div>
    ${s.flow.length?`<div class="label">${rb(s.ftitle)}</div>${flowHTML(s)}`:''}
    <div class="label">なりきった人（乗務員カード ${nCards()} / ${ALLFIG.length}まい）</div><div class="figrow">${s.figs.map(f=>figCard(s,f)).join('')}</div>
    <div class="label">受験で出る用語　${rb(s.field)}</div>
    <ul class="words">${s.words.map(w=>`<li><b>${rb(w[0])}</b>${rb(w[1])}</li>`).join('')}</ul>
    <div class="row">${nx?`<button class="btn go" id="next">次の章「${rb(nx.title)}」</button>`:''}<button class="btn${nx?'':' go'}" id="list">章をえらぶ</button><button class="linkbtn" id="again">もう一度この章を</button></div>${PAID?'':PAIDLINK}`;
  document.getElementById('back').onclick=home;
  if(nx)document.getElementById('next').onclick=()=>play(nx);
  document.getElementById('list').onclick=home;
  document.getElementById('again').onclick=()=>play(s);
  top0();
}
async function decrypt(){ return mnAccess.load('diagram'); }
function lockScreen(err){ mnAccess.lock(app,{game:'diagram',err:err,free:'diagram.html',onOpen:async()=>{ ST=await decrypt(); home(); }}); }
(async()=>{
  if(!PAID){ home(); return; }
  try{ ST=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>
