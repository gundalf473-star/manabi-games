<title>立体七目</title>
<meta name="game:subject" content="思考力">
<meta name="game:unit" content="対戦ゲーム">
<meta name="game:grade" content="だれでも">
<meta name="game:players" content="1〜2人">
<meta name="description" content="立方体の盤で13方向に7つ並べたら勝ちの、3次元の七目並べ。">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 上に立体ビュー(回転可)、下に「段」を選んで打つ碁盤。広い画面では左右に並ぶ */
:root{
  --bg:#eceeea; --surface:#fbfbf9; --fg:#1d2220; --muted:#66706a; --rule:#d3d8d3;
  --accent:#2c4a7e; --accent-soft:#dde4f0;
  --wood:#e3c48f; --wood-line:#7b5a2c; --win:#c2362b;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131615; --surface:#1c201f; --fg:#e7eae6; --muted:#97a19b; --rule:#2e3532;
  --accent:#8fb0e8; --accent-soft:#24324a;
  --wood:#a88553; --wood-line:#3a2a14; --win:#ef6b5e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131615; --surface:#1c201f; --fg:#e7eae6; --muted:#97a19b; --rule:#2e3532;
  --accent:#8fb0e8; --accent-soft:#24324a;
  --wood:#a88553; --wood-line:#3a2a14; --win:#ef6b5e; color-scheme:dark}

body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1.1;margin:0;letter-spacing:.04em}
h1 small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted);letter-spacing:.02em;margin-left:10px}
.controls{display:flex;flex-wrap:wrap;gap:8px}
select,button{font:inherit;color:var(--fg)}
select{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:6px 8px}
.btn{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:6px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.status{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:10px 14px}
.turnstone{width:22px;height:22px;border-radius:50%;flex:none}
.status .msg{font-weight:700;min-width:0}
.status .sub{color:var(--muted);font-size:13px;margin-left:auto;font-variant-numeric:tabular-nums}
.status.over{border-color:var(--win)}
.status.over .msg{color:var(--win)}

.main{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:860px){.main{grid-template-columns:1fr 1fr;align-items:start}}
.panel{display:flex;flex-direction:column;gap:10px;min-width:0}
.label{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.view{position:relative;background:var(--surface);border:1px solid var(--rule);border-radius:8px;overflow:hidden;touch-action:none;cursor:grab}
.view:active{cursor:grabbing}
canvas{display:block;width:100%}
.view .hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--muted);pointer-events:none}

.layers{display:flex;gap:4px;align-items:center}
.layers .step{flex:none;width:36px;height:36px;padding:0;border-radius:6px}
.tabs{display:flex;gap:4px;flex:1;min-width:0}
.tab{flex:1;min-width:0;height:36px;border:1px solid var(--rule);background:var(--surface);border-radius:6px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;font-variant-numeric:tabular-nums;padding:0;position:relative}
.tab b{font-size:13px}
.tab span{font-size:10px;color:var(--muted)}
.tab.on{background:var(--accent);border-color:var(--accent)}
.tab.on b,.tab.on span{color:var(--surface)}
.tab.last::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--win)}

.boardbox{background:var(--wood);border-radius:6px;padding:10px;width:100%;max-width:500px;align-self:center;box-sizing:border-box;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--wood-line) 35%,transparent)}
.grid{position:relative;display:grid;aspect-ratio:1;width:100%}
.lines{position:absolute;pointer-events:none;border-right:1px solid var(--wood-line);border-bottom:1px solid var(--wood-line);
  background-image:linear-gradient(to right,var(--wood-line) 1px,transparent 1px),linear-gradient(to bottom,var(--wood-line) 1px,transparent 1px)}
.cell{position:relative;border:0;background:transparent;padding:0;cursor:pointer;display:grid;place-items:center}
.cell:disabled{cursor:default}
.stone{width:86%;height:86%;border-radius:50%;position:relative;z-index:1}
.s1{background:radial-gradient(circle at 34% 30%,#6a6a6a,#1b1b1b 55%,#050505)}
.s2{background:radial-gradient(circle at 34% 30%,#ffffff,#ecece6 55%,#bdbdb4);box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.cell.last .stone::after{content:"";position:absolute;inset:34%;border-radius:50%;border:2px solid var(--win)}
.cell.win .stone{box-shadow:0 0 0 3px var(--win)}
.ghost{position:absolute;width:30%;height:30%;border-radius:50%;opacity:.55;z-index:0}
.ghost.up{top:4%;right:4%}
.ghost.down{bottom:4%;left:4%}
.cell:not(:disabled):hover::before{content:"";width:60%;height:60%;border-radius:50%;background:var(--accent);opacity:.25;position:absolute}
.legend{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:4px;vertical-align:middle}

.rules{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:14px 18px;font-size:14px;max-width:none}
.rules h2{font-family:var(--display);font-size:18px;margin:0 0 6px}
.rules ul{margin:0;padding-left:1.2em;display:grid;gap:2px}
.rules p{margin:6px 0 0;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>立体七目<small>3次元の七目並べ</small></h1>
    <div class="controls">
      <select id="mode" aria-label="対戦モード">
        <option value="2">CPU対戦（あなたが黒・先手）</option>
        <option value="1">CPU対戦（あなたが白・後手）</option>
        <option value="0">2人対戦</option>
      </select>
      <select id="size" aria-label="盤の大きさ">
        <option value="7">7×7×7</option>
        <option value="9" selected>9×9×9</option>
        <option value="11">11×11×11</option>
      </select>
      <button class="btn" id="undo">待った</button>
      <button class="btn primary" id="reset">新しい対局</button>
    </div>
  </header>

  <div class="status" id="status" role="status">
    <div class="turnstone" id="turnstone"></div>
    <div class="msg" id="msg"></div>
    <div class="sub" id="sub"></div>
  </div>

  <div class="main">
    <section class="panel">
      <div class="label">立体ビュー　ドラッグで回転</div>
      <div class="view" id="view"><canvas id="cv"></canvas><div class="hint">青い面が今の段</div></div>
    </section>
    <section class="panel">
      <div class="label" id="layerlabel">段を選んで打つ</div>
      <div class="layers">
        <button class="btn step" id="down" aria-label="下の段へ">▼</button>
        <div class="tabs" id="tabs"></div>
        <button class="btn step" id="up" aria-label="上の段へ">▲</button>
      </div>
      <div class="boardbox"><div class="grid" id="grid"></div></div>
      <div class="legend"><span><i></i>右上の小石＝真上の段</span><span><i></i>左下の小石＝真下の段</span></div>
    </section>
  </div>

  <div class="rules">
    <h2>遊び方</h2>
    <ul>
      <li>黒と白が交互に、立方体の空いている点に石を置きます（重力なし・どこでも置けます）。</li>
      <li>縦・横・高さ、平面の斜め、立方体を貫く斜めの<b>13方向</b>のどれかに<b>7つ</b>連続で並べたら勝ちです。</li>
      <li>右の盤で段（1が最下段）を切り替えて打ちます。キーボードの ↑↓ でも段を移動できます。</li>
    </ul>
    <p>平面の五目並べは4方向ですが、立体では13方向。守るべき線が一気に増えます。</p>
  </div>
</div>

<script>
(function(){
const WIN=7;
let N=9, board, history=[], turn=1, over=false, winCells=[], layer=0, cpu=2, busy=false, hover=-1, note="";
let yaw=-0.6, pitch=0.55;
const DIRS=[];
for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)for(let dz=-1;dz<=1;dz++){
  if(!dx&&!dy&&!dz)continue;
  if(dz>0||(dz===0&&dy>0)||(dz===0&&dy===0&&dx>0))DIRS.push([dx,dy,dz]);
}
const $=id=>document.getElementById(id);
const idx=(x,y,z)=>x+y*N+z*N*N;
const xyz=i=>[i%N,Math.floor(i/N)%N,Math.floor(i/(N*N))];
const inb=(x,y,z)=>x>=0&&y>=0&&z>=0&&x<N&&y<N&&z<N;

function newGame(){
  N=+$('size').value; cpu=+$('mode').value;
  board=new Uint8Array(N*N*N); history=[]; turn=1; over=false; winCells=[]; note="";
  layer=Math.floor(N/2); buildGrid(); render();
  window.mnTrack&&mnTrack('level_start',{level_name:'rittai7',size:N,mode:cpu});
  maybeCpu();
}
function checkWin(i){
  const [x,y,z]=xyz(i), c=board[i];
  for(const [dx,dy,dz] of DIRS){
    const line=[i];
    for(const s of [1,-1]){
      let k=1;
      while(true){const X=x+dx*k*s,Y=y+dy*k*s,Z=z+dz*k*s;
        if(!inb(X,Y,Z)||board[idx(X,Y,Z)]!==c)break; line.push(idx(X,Y,Z)); k++;}
    }
    if(line.length>=WIN)return line;
  }
  return null;
}
function place(i){
  if(over||board[i])return;
  board[i]=turn; history.push(i);
  const w=checkWin(i);
  if(w){over=true;winCells=w;window.mnTrack&&mnTrack('level_end',{level_name:'rittai7',success:!cpu||board[i]!==cpu,moves:history.length,size:N});}
  else if(history.length===N*N*N){over=true;}
  else turn=3-turn;
  render();
  maybeCpu();
}
function human(i){ if(busy||(cpu&&turn===cpu))return; note=""; place(i); }
function maybeCpu(){
  if(over||!cpu||turn!==cpu)return;
  busy=true; render();
  setTimeout(()=>{
    const m=cpuMove(); busy=false;
    layer=xyz(m)[2]; note=`CPUは第${layer+1}段に打ちました`;
    place(m);
  },320);
}
const W=[0,1,6,30,160,900,6000];
function cpuMove(){
  const c=Math.floor(N/2);
  if(!history.length)return idx(c,c,c);
  const me=turn, op=3-turn; let best=-1,bs=-1;
  for(let i=0;i<board.length;i++){
    if(board[i])continue;
    const [x,y,z]=xyz(i); let atk=0,def=0;
    for(const [dx,dy,dz] of DIRS){
      for(let off=-(WIN-1);off<=0;off++){
        const sx=x+dx*off,sy=y+dy*off,sz=z+dz*off, ex=sx+dx*(WIN-1),ey=sy+dy*(WIN-1),ez=sz+dz*(WIN-1);
        if(!inb(sx,sy,sz)||!inb(ex,ey,ez))continue;
        let m=0,o=0;
        for(let k=0;k<WIN;k++){const v=board[idx(sx+dx*k,sy+dy*k,sz+dz*k)]; if(v===me)m++; else if(v===op)o++;}
        if(!o){ atk+= m===WIN-1?1e7:W[m]; }
        if(!m){ def+= o===WIN-1?1e6:W[o]*0.9; }
      }
    }
    const cen=-(Math.abs(x-c)+Math.abs(y-c)+Math.abs(z-c))*0.3;
    const s=atk+def+cen+Math.random()*0.5;
    if(s>bs){bs=s;best=i;}
  }
  return best;
}
function undo(){
  if(busy||!history.length)return;
  const next=()=>history.length%2===0?1:2;
  const pop=()=>{board[history.pop()]=0;};
  pop();
  if(cpu){ const human=3-cpu; while(history.length && next()!==human) pop(); }
  turn=next(); over=false; winCells=[]; note="";
  if(history.length) layer=xyz(history[history.length-1])[2];
  render(); maybeCpu();
}

/* ---- 盤(2D) ---- */
let cells=[];
function buildGrid(){
  const g=$('grid'); g.innerHTML=""; cells=[];
  g.style.gridTemplateColumns=`repeat(${N},1fr)`;
  const L=document.createElement('div'); L.className='lines';
  const inset=`calc(50% / ${N})`; L.style.inset=inset;
  L.style.backgroundSize=`calc(100% / ${N-1}) calc(100% / ${N-1})`;
  g.appendChild(L);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const b=document.createElement('button'); b.className='cell'; b.id=`c${x}_${y}`;
    b.addEventListener('click',()=>human(idx(x,y,layer)));
    b.addEventListener('pointerenter',()=>{hover=idx(x,y,layer);draw();});
    b.addEventListener('pointerleave',()=>{hover=-1;draw();});
    g.appendChild(b); cells.push(b);
  }
  const tabs=$('tabs'); tabs.innerHTML="";
  for(let z=0;z<N;z++){
    const t=document.createElement('button'); t.className='tab'; t.id=`t${z}`;
    t.addEventListener('click',()=>{layer=z;render();});
    tabs.appendChild(t);
  }
}
const stoneName=c=>c===1?'黒':'白';
function render(){
  const last=history[history.length-1]??-1;
  const ws=new Set(winCells);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const b=cells[y*N+x], i=idx(x,y,layer), v=board[i];
    let h="";
    if(layer<N-1){const u=board[idx(x,y,layer+1)]; if(u)h+=`<span class="ghost up s${u}"></span>`;}
    if(layer>0){const d=board[idx(x,y,layer-1)]; if(d)h+=`<span class="ghost down s${d}"></span>`;}
    if(v)h+=`<span class="stone s${v}"></span>`;
    b.innerHTML=h;
    b.disabled=!!v||over;
    b.classList.toggle('last',i===last);
    b.classList.toggle('win',ws.has(i));
    b.setAttribute('aria-label',`第${layer+1}段 ${x+1}-${y+1} ${v?stoneName(v):'空き'}`);
  }
  const lastZ= last>=0?xyz(last)[2]:-1;
  for(let z=0;z<N;z++){
    let n=0; const base=z*N*N; for(let k=0;k<N*N;k++) if(board[base+k])n++;
    const t=$(`t${z}`); t.innerHTML=`<b>${z+1}</b><span>${n||''}</span>`;
    t.classList.toggle('on',z===layer); t.classList.toggle('last',z===lastZ);
    t.setAttribute('aria-label',`第${z+1}段 石${n}個`);
  }
  $('layerlabel').textContent=`第${layer+1}段（全${N}段・1が最下段）`;
  const st=$('status'), ts=$('turnstone');
  st.classList.toggle('over',over);
  let msg;
  if(over&&winCells.length){
    const w=board[winCells[0]];
    msg=`${stoneName(w)}の勝ち！ 七つ並びました`+(cpu?(w===cpu?'（CPUの勝ち）':'（あなたの勝ち）'):'');
    ts.className=`turnstone s${w}`;
  } else if(over){ msg='引き分け'; ts.className='turnstone'; }
  else {
    ts.className=`turnstone s${turn}`;
    msg = cpu ? (turn===cpu?'CPUが考えています…':`あなたの番（${stoneName(turn)}）`) : `${stoneName(turn)}の番`;
    if(note&&turn!==cpu) msg+=`　${note}`;
  }
  $('msg').textContent=msg;
  $('sub').textContent=`${history.length}手目`;
  $('undo').disabled=!history.length||busy;
  draw();
}

/* ---- 立体ビュー ---- */
const cv=$('cv'), ctx=cv.getContext('2d'); let CW=0,CH=0;
function resize(){
  const r=$('view').getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  CW=r.width; CH=Math.min(Math.round(r.width*0.85),520);
  cv.width=CW*dpr; cv.height=CH*dpr; cv.style.height=CH+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0); draw();
}
const tok=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function proj(x,y,z){
  const c=(N-1)/2, px=x-c, py=y-c, pz=z-c;
  const cy=Math.cos(yaw), sy=Math.sin(yaw), cp=Math.cos(pitch), sp=Math.sin(pitch);
  const rx=px*cy-py*sy, ry=px*sy+py*cy;
  const sx=rx, syy=-pz*cp+ry*sp, d=ry*cp+pz*sp;
  const D=N*2.6, f=D/(D+d), s=Math.min(CW,CH)/(N*1.75);
  return {x:CW/2+sx*s*f, y:CH/2+syy*s*f, d, f, s};
}
function draw(){
  if(!CW||!board)return;
  const fg=tok('--fg'), muted=tok('--muted'), acc=tok('--accent'), win=tok('--win'), rule=tok('--rule');
  ctx.clearRect(0,0,CW,CH);
  // 外枠
  const m=-0.5, M=N-0.5;
  const corners=[]; for(const a of[m,M])for(const b of[m,M])for(const c of[m,M])corners.push([a,b,c]);
  ctx.strokeStyle=rule; ctx.lineWidth=1;
  for(let i=0;i<8;i++)for(let j=i+1;j<8;j++){
    const a=corners[i],b=corners[j]; let diff=0; for(let k=0;k<3;k++)if(a[k]!==b[k])diff++;
    if(diff!==1)continue; const p=proj(...a),q=proj(...b);
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();
  }
  // 今の段の面
  const q=[[m,m],[M,m],[M,M],[m,M]].map(([a,b])=>proj(a,b,layer));
  ctx.beginPath(); q.forEach((p,k)=>k?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.closePath();
  ctx.globalAlpha=.14; ctx.fillStyle=acc; ctx.fill(); ctx.globalAlpha=.7; ctx.strokeStyle=acc; ctx.stroke(); ctx.globalAlpha=1;
  // 点と石
  const items=[];
  for(let i=0;i<board.length;i++){
    const [x,y,z]=xyz(i), p=proj(x,y,z);
    if(board[i]||z===layer||i===hover) items.push({i,p,v:board[i],z});
  }
  items.sort((a,b)=>b.p.d-a.p.d);
  const last=history[history.length-1], ws=new Set(winCells);
  for(const it of items){
    const {p,v}=it, r=p.s*0.36*p.f;
    if(!v){
      if(it.i===hover&&!over){ctx.globalAlpha=.5;ctx.fillStyle=acc;ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill();ctx.globalAlpha=1;}
      else{ctx.fillStyle=muted;ctx.globalAlpha=.45;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1,r*0.14),0,7);ctx.fill();ctx.globalAlpha=1;}
      continue;
    }
    const g=ctx.createRadialGradient(p.x-r*.35,p.y-r*.4,r*.1,p.x,p.y,r);
    if(v===1){g.addColorStop(0,'#707070');g.addColorStop(.5,'#1c1c1c');g.addColorStop(1,'#040404');}
    else{g.addColorStop(0,'#ffffff');g.addColorStop(.6,'#ebebe4');g.addColorStop(1,'#b4b4aa');}
    ctx.globalAlpha= (it.z===layer||ws.has(it.i))?1:.82;
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,r,0,7); ctx.fill();
    if(v===2){ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=.8;ctx.stroke();}
    ctx.globalAlpha=1;
    if(ws.has(it.i)){ctx.strokeStyle=win;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(p.x,p.y,r+2,0,7);ctx.stroke();}
    else if(it.i===last){ctx.strokeStyle=win;ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,r*.45,0,7);ctx.stroke();}
  }
  if(winCells.length){
    const pts=winCells.map(i=>proj(...xyz(i)));
    let a=pts[0],b=pts[0],best=0;
    for(const p1 of pts)for(const p2 of pts){const d=(p1.x-p2.x)**2+(p1.y-p2.y)**2; if(d>best){best=d;a=p1;b=p2;}}
    ctx.strokeStyle=win; ctx.lineWidth=3; ctx.globalAlpha=.8;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); ctx.globalAlpha=1;
  }
  // 段の目盛り
  ctx.fillStyle=muted; ctx.font='11px '+tok('--body');
  for(let z=0;z<N;z+= (N>9?2:1)){const p=proj(-0.9,N-0.5+0.4,z); ctx.fillText(String(z+1),p.x-8,p.y+4);}
}
let drag=null;
const view=$('view');
view.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};view.setPointerCapture(e.pointerId);});
view.addEventListener('pointermove',e=>{
  if(!drag)return; yaw+=(e.clientX-drag.x)*0.01; pitch=Math.max(0.05,Math.min(1.45,pitch+(e.clientY-drag.y)*0.01));
  drag={x:e.clientX,y:e.clientY}; draw();
});
['pointerup','pointercancel'].forEach(t=>view.addEventListener(t,()=>drag=null));

$('up').onclick=()=>{if(layer<N-1){layer++;render();}};
$('down').onclick=()=>{if(layer>0){layer--;render();}};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT')return;
  if(e.key==='ArrowUp'){e.preventDefault();$('up').click();}
  if(e.key==='ArrowDown'){e.preventDefault();$('down').click();}
});
$('reset').onclick=newGame;
$('size').onchange=newGame;
$('mode').onchange=newGame;
$('undo').onclick=undo;
new ResizeObserver(resize).observe(view);
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);}catch(e){}
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

newGame();
})();
</script>
