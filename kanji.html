.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.top{display:flex;justify-content:space-between;align-items:center;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.dots{display:flex;gap:6px}

  const n=streak();
  app.innerHTML=`<section class="box"><div class="streak"><span class="n">${n}<small>日連続</small></span><span class="s">${D.days[today]!=null?'今日の5問はおわりました。':'今日の5問にちょうせんしよう。'}</span></div>
    <div class="grades">${Object.entries(GL).map(([k,[nm,ds]])=>{const r=D.g[today+'-'+k];return `<button class="gr" data-g="${k}" aria-pressed="${k===grade}"><span class="nm">${nm}</span><span class="ds">${ds}</span><span class="st">${r!=null?r+' / 5':''}</span></button>`;}).join('')}</div>
    <div class="row"><button class="btn" id="go">${D.g[today+'-'+grade]!=null?'もう一度とく（記録は1回目）':'スタート'}</button><button class="btn sub" id="more">べつの5問で練習</button></div></section>`;
  app.querySelectorAll('.gr').forEach(b=>b.onclick=()=>{grade=b.dataset.g;D.grade=grade;save();home();});
  document.getElementById('go').onclick=()=>start(makeSet(grade,today+'#'+grade),true);
  document.getElementById('more').onclick=()=>start(makeSet(grade,null),false);
}
function start(set,daily){S={set,daily,i:0,res:[]};track('level_start',{level_name:'漢字'+GL[grade][0]+(daily?'・今日の5問':'・練習')});draw();}
function draw(){
  const p=S.set[S.i], done=S.res.length>S.i;
  app.innerHTML=`<section class="box"><div class="top"><span>漢字・${GL[grade][0]}　${S.i+1} / 5</span><div class="dots">${S.set.map((_,j)=>`<i class="${j<S.res.length?(S.res[j]?'ok':'ng'):j===S.i?'now':''}"></i>`).join('')}</div></div>
    <p class="kind">${p.t==='y'?'読みは？':'漢字で書くと？'}</p>
    <div class="word">${p.t==='y'?esc(p.w):'「'+esc(p.w)+'」'}</div>
    <div class="ch">${p.ch.map((c,i)=>`<button data-i="${i}" ${done?'disabled':''} class="${done?(c===p.a?'ok':c===S.pick?'ng':''):''}">${esc(c)}</button>`).join('')}</div>
    ${done?`<p class="fb ${S.res[S.i]?'ok':'ng'}">${S.res[S.i]?'せいかい！':'答えは「'+esc(p.a)+'」'}</p>${p.m?`<p class="mean">意味：${esc(p.m)}</p>`:''}<div class="row" style="justify-content:center"><button class="btn" id="nx">${S.i<4?'つぎへ':'結果を見る'}</button></div>`:''}</section>`;
  if(done){document.getElementById('nx').onclick=()=>{S.i++;S.i<5?draw():result();};return;}
  app.querySelectorAll('.ch button').forEach(b=>b.onclick=()=>{S.pick=p.ch[+b.dataset.i];S.res.push(S.pick===p.a);draw();});
}
function result(){
  const s=S.res.filter(Boolean).length;
  if(S.daily){if(D.days[today]==null)D.days[today]=s;const k=today+'-'+grade;if(D.g[k]==null)D.g[k]=s;save();}
  track('level_end',{level_name:'漢字'+GL[grade][0]+(S.daily?'・今日の5問':'・練習'),score:s,total:5});
  app.innerHTML=`<section class="box"><div class="big">${s} / 5</div><p style="margin:0;text-align:center">${s===5?'ぜんぶ正解！':s>=3?'よくできました。':'まちがえた漢字を書いて覚えよう。'}${S.daily?'　'+streak()+'日連続です。':''}</p>
    <ul class="list">${S.set.map((p,j)=>`<li class="${S.res[j]?'':'ng'}">${p.t==='y'?esc(p.w)+' → '+esc(p.a):esc(p.w)+' → '+esc(p.a)}${p.m?` <small>（${esc(p.m)}）</small>`:''}</li>`).join('')}</ul>
    <div class="row"><button class="btn" id="hm">レベルをえらぶ</button><button class="btn sub" id="more">べつの5問で練習</button></div></section>`;
  document.getElementById('hm').onclick=home;
  document.getElementById('more').onclick=()=>start(makeSet(grade,null),false);
}
home();
})();
</script>
</body>
