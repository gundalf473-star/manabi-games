# worker（manabi-api）を GitHub Actions から自動で出すための設定。
# 変数（SITE_URL など）とシークレット（STRIPE_SECRET_KEY・ADMIN_KEY など）は Cloudflare の画面に入っているものをそのまま使う（keep_vars）。
name = "manabi-api"
main = "worker.js"
compatibility_date = "2026-10-27"
workers_dev = true
keep_vars = true

[[kv_namespaces]]
binding = "MN"
id = "354983acd4bb49e2a3762014dc43e424"

# Cloudflare の画面で「Workers Logs」をオンにしているので、自動反映でもオンのままにする
[observability]
enabled = true
