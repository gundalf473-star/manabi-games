<style>

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

.btn{border:0;border-radius:8px;padding:11px 22px;font-weight:700;cursor:pointer;background:var(--pick);color:var(--ink)}

.rv{border:1px solid var(--rule);border-radius:8px;padding:10px 14px;font-size:14px}
.rv .rq{font-weight:700}
.rv .ra{color:var(--ok);font-weight:700}
@media (prefers-reduced-motion:reduce){.stamp.pop{animation:none}.prog i{transition:none}}
</style>

['chiho','首長や地方議会の議員をやめさせるよう求めること（リコール）の請求先は？','選挙管理委員会','首長','監査委員','地方裁判所','解職請求は<b>選挙管理委員会</b>に出し、住民投票で過半数の賛成があればやめさせられます。'],

['zaisei','消費税のように、税を納める人と実際に負担する人がちがう税を何という？','間接税','直接税','地方税','関税','<b>間接税</b>です。お店が納めますが、負担しているのは買い物をした人です。所得税のように納める人と負担する人が同じ税は直接税です。'],
['zaisei','所得が多い人ほど税率が高くなるしくみを何という？','累進課税','軽減税率','間接税','定額税','<b>累進課税</b>で、所得税などに取り入れられています。所得の差を小さくするはたらきがあります。'],

['zaisei','国が足りないお金を借りるために発行するものは？','国債','紙幣','株式','条例','<b>国債</b>です。国の借金で、利子をつけて返さなければなりません。'],
['zaisei','社会保障の4つの柱のうち、生活保護があてはまるのは？','公的扶助','社会保険','社会福祉','公衆衛生','生活に困っている人を助ける<b>公的扶助</b>です。年金や医療保険は社会保険にあたります。'],
['zaisei','40歳以上の人が保険料を納め、介護が必要になったときにサービスを受けられる制度は？','介護保険','雇用保険','国民年金','生活保護','2000年に始まった<b>介護保険</b>です。'],
['zaisei','日本の紙幣を発行している銀行は？','日本銀行','財務省','ゆうちょ銀行','国際通貨基金','紙幣（日本銀行券）は<b>日本銀行</b>が発行します。日本銀行は「発券銀行」「銀行の銀行」「政府の銀行」とよばれます。'],

['kokusai','国際連合の本部がある都市は？','ニューヨーク','ジュネーブ','ロンドン','パリ','本部は<b>ニューヨーク</b>にあります。'],
['kokusai','国連の安全保障理事会の常任理事国でないのは？','日本','アメリカ','中国','フランス','常任理事国は<b>アメリカ・イギリス・フランス・ロシア・中国</b>の5か国です。'],
['kokusai','常任理事国が1か国でも反対すると安全保障理事会で決められない、この権利を何という？','拒否権','黙秘権','参政権','請願権','<b>拒否権</b>です。'],
['kokusai','日本が国際連合に加盟したのは何年？','1956年','1945年','1951年','1972年','日ソ共同宣言でソ連との国交が回復し、<b>1956年</b>に加盟しました。'],
['kokusai','世界遺産の登録などを行う国連の専門機関は？','ユネスコ','ユニセフ','WHO','WTO','<b>ユネスコ</b>（国連教育科学文化機関）です。ユニセフは子どもを助ける国連児童基金です。'],
['kokusai','2030年までに達成をめざす、国連で決められた17の目標は？','SDGs','PKO','ODA','NGO','<b>SDGs</b>（持続可能な開発目標）です。PKOは平和維持活動、ODAは政府開発援助、NGOは非政府組織です。'],
['kokusai','日本の非核三原則は「持たず、つくらず、…」の次は？','持ちこませず','売らず','使わず','見せず','非核三原則は<b>持たず、つくらず、持ちこませず</b>です。'],
['kokusai','紛争地域で停戦の監視などを行う国連の活動は？','PKO（平和維持活動）','ODA（政府開発援助）','SDGs','APEC','<b>PKO</b>です。日本は1992年にPKO協力法をつくり、自衛隊などが参加するようになりました。'],
];
const CATS={kenpo:['日本国憲法','三大原則・人権・改正'],kokkai:['国会','衆議院と参議院・選挙'],naikaku:['内閣','総理大臣・議院内閣制'],
  saiban:['裁判所・三権分立','三審制・裁判員'],chiho:['地方自治','条例・直接請求'],zaisei:['財政とくらし','税・予算・社会保障'],kokusai:['国際社会','国連・SDGs']};
const ROUND=10;
const app=document.getElementById('app');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
let best={}; try{best=JSON.parse(localStorage.getItem('koumin-best')||'{}');}catch(e){}
const saveBest=()=>{try{localStorage.setItem('koumin-best',JSON.stringify(best));}catch(e){}};
let G=null;

function home(){
  G=null;
  const n=c=>Q.filter(q=>q[0]===c).length;
  app.innerHTML=`<section class="box"><h2 class="h2">分野をえらぶ</h2>
   <div class="cats">
    <button class="cat mix" id="cat-mix" data-c="mix"><span class="nm">ミックス（全分野から10問）</span><span class="ds">全${Q.length}問から出題</span><span class="best">${best.mix!=null?`ベスト ${best.mix}/10`:'まだ挑戦していません'}</span></button>
    ${Object.entries(CATS).map(([k,[nm,ds]])=>`<button class="cat" id="cat-${k}" data-c="${k}"><span class="nm">${nm}</span><span class="ds">${ds}（${n(k)}問）</span><span class="best">${best[k]!=null?`ベスト ${best[k]}/${Math.min(ROUND,n(k))}`:''}</span></button>`).join('')}
   </div>
   <p class="note">選択肢の順番は毎回変わります。数字や制度は2026年10月時点の内容です。</p></section>`;
  app.querySelectorAll('.cat').forEach(b=>b.onclick=()=>start(b.dataset.c));
}
function start(c){
  const pool=c==='mix'?Q:Q.filter(q=>q[0]===c);
  const qs=shuffle(pool).slice(0,ROUND).map(q=>({q,ch:shuffle([q[2],q[3],q[4],q[5]])}));
  G={c,qs,i:0,score:0,combo:0,maxCombo:0,miss:[],answered:false};
  window.mnTrack&&mnTrack('level_start',{level_name:c});
  show();
}
function show(){
  const it=G.qs[G.i], [cat]=it.q;
  app.innerHTML=`<section class="box">
    <div class="bar"><span class="pill">${CATS[cat][0]}</span><div class="prog" aria-hidden="true"><i style="width:${G.i/G.qs.length*100}%"></i></div>
      <span class="nums">${G.i+1} / ${G.qs.length}</span>${G.combo>=2?`<span class="combo">${G.combo}連続正解中</span>`:''}</div>
    <div class="qwrap"><p class="q">${it.q[1]}</p><div id="stamp"></div></div>
    <div class="choices">${it.ch.map((t,j)=>`<button class="ch" id="ch${j}" data-j="${j}"><span class="lb">${'アイウエ'[j]}</span><span>${t}</span></button>`).join('')}</div>
    <div id="after"></div></section>`;
  app.querySelectorAll('.ch').forEach(b=>b.onclick=()=>answer(+b.dataset.j));
}
function answer(j){
  if(G.answered)return; G.answered=true;
  const it=G.qs[G.i], ok=it.ch[j]===it.q[2];
  app.querySelectorAll('.ch').forEach((b,k)=>{b.disabled=true; if(it.ch[k]===it.q[2])b.classList.add('right'); else if(k===j)b.classList.add('wrong');});
  if(ok){G.score++;G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
    document.getElementById('stamp').innerHTML='<div class="stamp pop">正解</div>';}
  else{G.combo=0;G.miss.push(it.q);}
  window.mnTrack&&mnTrack('answer_question',{category:it.q[0],question:it.q[1].slice(0,90),correct:ok});
  const last=G.i===G.qs.length-1;
  document.getElementById('after').innerHTML=`<div class="exp">${ok?'':'<b>ざんねん。</b>'}${it.q[6]}</div>
    <div class="row" style="margin-top:12px"><button class="btn go" id="next">${last?'結果を見る':'次の問題へ'}</button></div>`;
  const nx=document.getElementById('next'); nx.onclick=next; nx.focus({preventScroll:true});
}
function next(){ G.answered=false; if(++G.i<G.qs.length)show(); else result(); }
function result(){
  const n=G.qs.length, s=G.score, r=s/n;
  const rank=r===1?'免許<br>皆伝':r>=.8?'師範':r>=.6?'初段':r>=.4?'一級':'見習い';
  const msg=r===1?'全問正解！公民マスターです。':r>=.8?'よくできました。まちがえた問題を見直して全問正解をめざそう。':r>=.6?'あと少し！復習してもう一度挑戦しよう。':'解説を読んでから、もう一度やってみよう。';
  window.mnTrack&&mnTrack('level_end',{level_name:G.c,success:s===n,score:s,total:n});
  const isNew=best[G.c]==null||s>best[G.c]; if(isNew){best[G.c]=s;saveBest();}
  app.innerHTML=`<section class="box">
    <h2 class="h2">${G.c==='mix'?'ミックス':CATS[G.c][0]}の結果</h2>
    <div class="score"><div class="big">${s}<small> / ${n}問</small></div><div class="rank">${rank}</div></div>
    <p style="margin:0">${msg}${G.maxCombo>=3?`　最高${G.maxCombo}連続正解！`:''}${isNew&&s>0?'　自己ベスト更新！':''}</p>
    <div class="row"><button class="btn go" id="again">もう一度</button>${G.miss.length?'<button class="btn" id="retry">まちがえた問題だけ解く</button>':''}<button class="btn" id="home">分野えらびへ</button></div>
    ${G.miss.length?`<h3 class="h2" style="font-size:17px">復習ノート</h3><div class="review">${G.miss.map(q=>`<div class="rv"><div class="rq">${q[1]}</div><div class="ra">こたえ：${q[2]}</div><div>${q[6]}</div></div>`).join('')}</div>`:''}
  </section>`;
  document.getElementById('again').onclick=()=>start(G.c);
  document.getElementById('home').onclick=home;
  const rt=document.getElementById('retry'); if(rt)rt.onclick=()=>{const m=G.miss,c=G.c;G={c,qs:shuffle(m).map(q=>({q,ch:shuffle([q[2],q[3],q[4],q[5]])})),i:0,score:0,combo:0,maxCombo:0,miss:[],answered:false};show();};
}
document.addEventListener('keydown',e=>{
  if(!G)return;
  const k={'1':0,'2':1,'3':2,'4':3}[e.key];
  if(k!=null&&!G.answered&&document.getElementById('ch'+k))answer(k);
});
home();
})();
</script>
