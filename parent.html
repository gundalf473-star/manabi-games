<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>保護者ページ | {{SITE_NAME}}</title>
<meta name="robots" content="noindex">
{{GA}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@500&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: 連絡帳のように上から「まとめの数字 → 日ごとのグラフ → ゲームごと → にがて → 最近の記録」 */
:root{
  --bg:#f2f5f9; --surface:#ffffff; --fg:#1d2b3d; --muted:#5d6a7c; --rule:#d6dde7; --ink:#1f3a6e;
  --bar:#2667d6; --barsoft:#c9d9f5; --ok:#1d8150; --ng:#c8352d; --gold:#a8760a;
  --s1:#2667d6; --s2:#d4432a; --s3:#1d8150; --s4:#8a5bc7; --s5:#c98a12; --s6:#127f8a;
  --display:"Kiwi Maru","Hiragino Maru Gothic ProN",serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151d; --surface:#18212d; --fg:#e4e9f1; --muted:#9aa6b8; --rule:#2a3546; --ink:#8fb0f0;
  --bar:#6c9ff0; --barsoft:#2a3d5e; --ok:#4cc184; --ng:#f07468; --gold:#e8b54a;
  --s1:#6c9ff0; --s2:#f07a62; --s3:#4cc184; --s4:#b493ea; --s5:#e8b54a; --s6:#4fc3cc; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151d; --surface:#18212d; --fg:#e4e9f1; --muted:#9aa6b8; --rule:#2a3546; --ink:#8fb0f0;
  --bar:#6c9ff0; --barsoft:#2a3d5e; --ok:#4cc184; --ng:#f07468; --gold:#e8b54a;
  --s1:#6c9ff0; --s2:#f07a62; --s3:#4cc184; --s4:#b493ea; --s5:#e8b54a; --s6:#4fc3cc; color-scheme:dark}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:500;font-size:clamp(28px,7vw,40px);line-height:1.2;margin:0;color:var(--ink)}
h2{font-family:var(--display);font-weight:500;font-size:20px;margin:0;color:var(--ink)}
.lead{margin:6px 0 0;color:var(--muted);font-size:14px;max-width:40em}
a{color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--s5);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.note{font-size:13px;color:var(--muted);margin:0}
.bar-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:99px;background:var(--surface);padding:3px}
.seg button{border:0;background:none;border-radius:99px;padding:5px 14px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:6px 14px;font-weight:700;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px 14px}
.kpi .k{font-size:12px;font-weight:700;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:30px;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .v small{font-family:var(--body);font-size:13px;color:var(--muted);margin-left:2px}
.kpi .d{font-size:12px;color:var(--muted)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.glist{display:flex;flex-direction:column}
.grow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;border-top:1px solid var(--rule);padding:10px 0}
.grow .prog{grid-column:1/-1}
.gst{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
@media (max-width:480px){.grow{grid-template-columns:1fr}.gst{text-align:left}}
.chart .grid{stroke:var(--rule);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .b{fill:var(--bar);pointer-events:none}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover+.b,.chart g.on .b{fill:var(--ink)}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--surface);font-size:12px;line-height:1.5;padding:6px 10px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px;display:none;z-index:2}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:8px 6px;border-top:1px solid var(--rule);text-align:left;vertical-align:middle}
.tbl thead th{border-top:0;font-size:12px;color:var(--muted);font-weight:700}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.gname{display:flex;align-items:center;gap:8px;font-weight:700}
.dot{flex:none;width:10px;height:10px;border-radius:2px;background:var(--c,var(--ink))}
.prog{display:flex;flex-direction:column;gap:3px;min-width:110px}
.prog .pb{height:6px;border-radius:3px;background:var(--rule);overflow:hidden;display:flex}
.prog .pb i{display:block;height:100%}
.prog .m{background:var(--ok)} .prog .w{background:var(--gold)}
.prog span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;margin:0 -6px;padding:0 6px}
.weak{display:flex;flex-direction:column;gap:12px}
.weak h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:3px 9px;font-size:14px}
.chip b{color:var(--ng);font-size:12px;margin-left:4px}
.chip mark{background:none;color:var(--ng);font-weight:700;text-decoration:underline}
.log{display:flex;flex-direction:column}
.log details{border-top:1px solid var(--rule);padding:8px 0}
.log summary{display:grid;grid-template-columns:88px 1fr auto;gap:10px;align-items:baseline;cursor:pointer;list-style:none}
.log summary::-webkit-details-marker{display:none}
.log .when{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.log .what{font-weight:700;font-size:14px}
.log .what small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.log .sc{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.log .sc.good{color:var(--ok)}
.log .body{padding:6px 0 2px 98px;font-size:13px;color:var(--muted)}
@media (max-width:480px){.log summary{grid-template-columns:86px 1fr auto}.log .body{padding-left:0}}
.empty{text-align:center;padding:28px 8px;color:var(--muted)}
.sample{background:#fff4d6;color:#5a4300;border-radius:8px;padding:8px 12px;font-size:14px;font-weight:700}
:root[data-theme="dark"] .sample{background:#3a3016;color:#f3dc9a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sample{background:#3a3016;color:#f3dc9a}}
.confirm{font-size:14px}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;font-size:14px}
footer{font-size:13px;color:var(--muted)}
@media print{
  body{background:#fff;padding:0}
  .tools,.seg,footer,.linkbtn,.noprint{display:none!important}
  .card,.kpi{break-inside:avoid;border-color:#bbb}
  .log details{break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>保護者ページ</h1>
    <p class="lead">この端末で遊んだゲームの記録をまとめて見られます。記録はこの端末のブラウザの中だけにあり、どこにも送られません。</p>
  </header>
  <div id="app"><p class="empty">記録を読みこんでいます…</p></div>
  <footer><a href="index.html">← ゲーム一覧へ</a>　・　<a href="privacy.html">プライバシーポリシー</a></footer>
</div>
<script>
(async function(){
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const read=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}};
const DAY=86400000;
const ymd=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const md=t=>{const d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate();};
const hm=t=>{const d=new Date(t);return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');};
const WD='日月火水木金土';
const mins=e=>Math.min(Math.max(0,(e.e||e.t)-e.t),60*60000);   // 1回は最大60分として数える（放置した時間を入れない）
const pct=(k,a)=>a?Math.round(k/a*100):null;

// 有料版の「覚えた・にがて」の記録（各ゲームがこの端末に保存しているもの）
const REC={
  'yoji300-rec':{f:'yojijukugo300.html',total:300},
  'kan300-rec':{f:'kanyouku300.html',total:300},
  'yojikanji-p-rec':{f:'yojikanji-full.html',total:173},
  'kotowaza-p-rec':{f:'kotowaza-full.html',total:142},
  'hantaigo-p-rec':{f:'hantaigo-full.html',total:196},
  'kakariuke-p-rec':{f:'kakariuke-full.html',total:100},
  'hinshi-p-rec':{f:'hinshi-full.html',total:100},
  'sanji-p-rec':{f:'sanji-full.html',total:100},
  'chusho-p-rec':{f:'chusho-full.html',total:75},
  'hyakunin-p-rec':{f:'hyakunin-full.html',total:100},
  'kufu-p-rec':{f:'keisan-kufu-full.html',total:50},
  'asuka-p-rec':{f:'asuka-full.html',total:100},
  'nara-p-rec':{f:'nara-full.html',total:100},
  'kamakura-p-rec':{f:'kamakura-full.html',total:100},
  'sengoku-p-rec':{f:'sengoku-full.html',total:100},
  'edo1-p-rec':{f:'edo-zenki-full.html',total:100},
  'edo2-p-rec':{f:'edo-chuki-full.html',total:80},
  'edo3-p-rec':{f:'edo-koki-full.html',total:100},
  'meiji1-p-rec':{f:'meiji-zenki-full.html',total:100},
  'meiji2-p-rec':{f:'meiji-koki-full.html',total:100},
  'sekai-p-rec':{f:'sekai-chizu-full.html',total:200},
  'chizukigou-p-rec':{f:'chizukigou-full.html',total:100},
  'tentai-p-rec':{f:'tentai-full.html',total:100},
  'denki-p-rec':{f:'denki-full.html',total:100},
  'tekobane-p-rec':{f:'tekobane-full.html',total:100},
  'suiyoeki-p-rec':{f:'suiyoeki-full.html',total:100},
  'wariai-p-rec':{f:'wariai-full.html',total:100},
  'hayasa-p-rec':{f:'hayasa-full.html',total:100},
  'menseki-p-rec':{f:'menseki-full.html',total:100},
  'kisoku-p-rec':{f:'kisoku-full.html',total:100},
  'tenkai-p-rec':{f:'tenkai-full.html',total:100},
  'ronri-p-rec':{f:'ronri-full.html',total:100}};
const STARS={'tokushu-p-stars':{f:'tokushu-puzzle-full.html',total:60},'tokushu-f-stars':{f:'tokushu-puzzle.html',total:null}};
const state=r=>{if(!r)return 'new';if(r[0]>=2&&r[0]>r[1])return 'master';if(r[1]>0)return 'weak';return 'try';};
// 問題の記録の見せ方（品詞は { } の中が問われた言葉、係り受けは | から後ろを消す）
const showQ=s=>esc(String(s).replace(/\|.*$/,'')).replace(/\{(.+?)\}/,'<mark>$1</mark>');

// コース名を読みやすく
const WORD={all:'ぜんぶ',lv1:'基本',lv2:'標準',lv3:'発展',weak:'にがて',fresh:'まだやっていない',num:'数字が入る',
  choice:'えらぶ',fill:'うめる',write:'ならべる',normal:'じっくり',speed:'スピード',comma:'読点',mix:'ミックス',
  kenpo:'日本国憲法',kokkai:'国会',naikaku:'内閣',saiban:'裁判所・三権分立',chiho:'地方自治',zaisei:'財政とくらし',kokusai:'国際社会',
  tsuru:'つるかめ算',kabu:'過不足算',bun:'分配算',ueki:'植木算',wasa:'和差算',one:'1つずつ',dice:'サイコロ',collect:'11種類あつめ'};
function course(e){
  const lvName=/^(hinshi|kakariuke)/.test(e.f)?{1:'基本',2:'標準',3:'発展'}:e.f==='yojijukugo.html'?{1:'基本',2:'発展'}:{};
  const out=[];
  String(e.c||'').split('-').forEach(t=>{
    if(lvName[t])out.push(lvName[t]);
    else if(/^stage\d+$/.test(t))out.push('ステージ'+(+t.slice(5)+1));
    else if(t==='lv1'&&/^tokushu/.test(e.f))out.push('ステージ1');
    else if(WORD[t])out.push(WORD[t]);
    else if(/[^\x00-\x7f]/.test(t))out.push(t);   // 日本語のテーマ名はそのまま
  });
  return [...new Set(out)].join('・');
}

// サイトのゲーム一覧（教科の色とリンク用）
let games=[];
try{games=(await (await fetch('games.json',{cache:'no-cache'})).json()).games||[];}catch(e){}
const order=['算数','国語','理科','社会','思考力'];
const subjOf={},urlOf={};
games.forEach(g=>{const f=decodeURIComponent(g.url.split('/').pop());subjOf[f]=g.subject;urlOf[f]=g.url;});
const COLORS=['--s1','--s2','--s3','--s4','--s5','--s6'];
const color=s=>{const i=order.indexOf(s);return `var(${COLORS[(i<0?5:i)%6]})`;};

let H=read('mn-history',[]); if(!Array.isArray(H))H=[];
let sample=false, range=read('mn-parent-range',7);

function makeSample(){
  // 見本：この2週間に、いくつかのゲームを遊んだという架空の記録（保存はしません）
  const G=[['hinshi-full.html','品詞クイズ 100問',['hinshi-p-1','hinshi-p-2','hinshi-p-3'],['{でも}負けた。','部屋には本が{ない}。','{ある}日、手紙が届いた。','兄は{はやく}走った。']],
    ['kotowaza-full.html','ことわざクイズ 完全版',['kotowaza-p-choice-all','kotowaza-p-fill-all'],['ぬかにくぎ','情けは人のためならず','急がば回れ']],
    ['kakariuke-full.html','係り受けクイズ 100問',['kakariuke-p-2'],['ぼくは駅で友だちと会った。']],
    ['tokushu-puzzle.html','特殊算パズル',['tokushu-f-tsuru-lv1'],[]]];
  const out=[], now=Date.now(); let seed=7; const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  for(let d=13;d>=0;d--){
    if(rnd()<.3)continue;
    const n=1+Math.floor(rnd()*3);
    for(let j=0;j<n;j++){
      const g=G[Math.floor(rnd()*G.length)], t=now-d*DAY-(3-j)*3600000;
      if(g[0].startsWith('tokushu')){out.push({id:'s'+d+j,t,e:t+240000,f:g[0],g:g[1],c:g[2][0],a:0,k:0,m:[],s:1+Math.floor(rnd()*3),star:1});continue;}
      const k=6+Math.floor(rnd()*5), m=[];for(let x=0;x<10-k;x++)m.push(g[3][Math.floor(rnd()*g[3].length)]);
      out.push({id:'s'+d+j,t,e:t+300000+rnd()*300000,f:g[0],g:g[1],c:g[2][Math.floor(rnd()*g[2].length)],a:10,k,m:[...new Set(m)],s:k,n:10});
    }
  }
  return out;
}

function render(){
  const data=sample?makeSample():H;
  if(!data.length&&!sample){
    app.innerHTML=`<div class="card empty"><p style="margin:0">この端末には、まだ記録がありません。<br>ゲームで1回遊ぶと、ここに記録が出てきます。</p>
      <p class="note">記録は、子どもが遊んだのと<b>同じ端末・同じブラウザ</b>で、このページを開いたときに見られます。</p>
      <div><button class="btn" id="smp">見本のデータで見てみる</button></div></div>`;
    document.getElementById('smp').onclick=()=>{sample=true;render();};
    return;
  }
  const now=Date.now(), today=new Date(ymd(now)).getTime();
  const from=range==='all'?0:today-(range-1)*DAY;
  const L=data.filter(e=>e.t>=from).sort((a,b)=>b.t-a.t);
  const ans=L.reduce((s,e)=>s+(e.a||0),0), ok=L.reduce((s,e)=>s+(e.k||0),0);
  const days=new Set(L.map(e=>ymd(e.t))).size, time=Math.round(L.reduce((s,e)=>s+mins(e),0)/60000);
  const last=data.reduce((m,e)=>Math.max(m,e.t),0);

  // 日ごとのグラフ（ぜんぶのときは最近30日）
  const span=range==='all'?30:range;
  const byDay=[];
  for(let i=span-1;i>=0;i--){const t=today-i*DAY,k=ymd(t);const es=data.filter(e=>ymd(e.t)===k);byDay.push({t,a:es.reduce((s,e)=>s+(e.a||0),0),k:es.reduce((s,e)=>s+(e.k||0),0),n:es.length,m:Math.round(es.reduce((s,e)=>s+mins(e),0)/60000)});}

  // ゲームごと
  const byG={};
  data.forEach(e=>{const g=byG[e.f]||(byG[e.f]={f:e.f,g:e.g,n:0,a:0,k:0,last:0,miss:{}});g.g=e.g||g.g;g.last=Math.max(g.last,e.t);
    if(e.t>=from){g.n++;g.a+=e.a||0;g.k+=e.k||0;(e.m||[]).forEach(q=>g.miss[q]=(g.miss[q]||0)+1);}});
  const recInfo={};
  Object.entries(REC).forEach(([key,o])=>{const r=read(key,null);if(!r||typeof r!=='object')return;
    const c={master:0,weak:0,try:0,list:[]};Object.entries(r).forEach(([q,v])=>{const s=state(v);if(s!=='new')c[s]++;if(s==='weak')c.list.push([q,v[1]]);});
    if(c.master+c.weak+c.try===0)return;
    recInfo[o.f]=Object.assign(c,{total:o.total});
    if(!byG[o.f])byG[o.f]={f:o.f,g:(games.find(g=>g.url.endsWith(encodeURIComponent(o.f)))||{}).title||o.f,n:0,a:0,k:0,last:0,miss:{}};});
  const starInfo={};
  Object.entries(STARS).forEach(([key,o])=>{const r=read(key,null);if(!r||typeof r!=='object')return;const v=Object.values(r).filter(x=>x>0);if(!v.length)return;starInfo[o.f]={clear:v.length,stars:v.reduce((a,b)=>a+b,0),total:o.total};});
  const glist=Object.values(byG).sort((a,b)=>b.last-a.last);

  const W=Math.max(300,Math.round((app.clientWidth||640)-38)),Hh=W<480?170:190,pl=30,pr=6,pt=10,pb=26, maxA=Math.max(10,...byDay.map(d=>d.a));
  const step=Math.ceil(maxA/4/5)*5||5, top=step*4, bw=(W-pl-pr)/byDay.length;
  const y=v=>pt+(Hh-pt-pb)*(1-v/top);
  const labEvery=span>14?(W<480?7:5):span>7?2:(W<400?2:1);
  const svg=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="日ごとの解いた問題数">
    ${[0,1,2,3,4].map(i=>`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(i*step)}" y2="${y(i*step)}"/><text class="axis" x="${pl-6}" y="${y(i*step)+4}" text-anchor="end">${i*step}</text>`).join('')}
    ${byDay.map((d,i)=>{const x=pl+i*bw, w=Math.max(2,Math.min(28,bw-4)), cx=x+bw/2, h=y(0)-y(d.a);
      const r=Math.min(4,w/2,h);
      const path=d.a?`M${cx-w/2} ${y(0)} V${y(d.a)+r} Q${cx-w/2} ${y(d.a)} ${cx-w/2+r} ${y(d.a)} H${cx+w/2-r} Q${cx+w/2} ${y(d.a)} ${cx+w/2} ${y(d.a)+r} V${y(0)} Z`:'';
      const wd=new Date(d.t).getDay();
      return `<g data-i="${i}"><rect class="hit" x="${x}" y="${pt}" width="${bw}" height="${Hh-pt-pb}"/>${path?`<path class="b" d="${path}"/>`:''}
        ${(byDay.length-1-i)%labEvery===0?`<text class="axis" x="${cx}" y="${Hh-8}" text-anchor="middle" ${wd===0?'style="fill:var(--ng)"':''}>${md(d.t)}</text>`:''}</g>`;}).join('')}
  </svg>`;

  const weakBlocks=glist.map(g=>{
    const items={};
    const nk=q=>{let k=String(q).replace(/\|.*$/,'');if(/^hantaigo/.test(g.f))k=k.replace('-','⇔');return k;};
    Object.entries(g.miss).forEach(([q,c])=>{const k=nk(q);items[k]=Math.max(items[k]||0,c);});
    (recInfo[g.f]?.list||[]).forEach(([q,c])=>{const k=nk(q);items[k]=Math.max(items[k]||0,c);});
    const arr=Object.entries(items).sort((a,b)=>b[1]-a[1]);
    if(!arr.length)return '';
    const shown=arr.slice(0,12);
    return `<div><h3><span class="dot" style="--c:${color(subjOf[g.f])}"></span>${esc(g.g)}</h3>
      <div class="chips">${shown.map(([q,c])=>`<span class="chip">${showQ(q)}${c>1?`<b>×${c}</b>`:''}</span>`).join('')}${arr.length>12?`<span class="chip">ほか${arr.length-12}問</span>`:''}</div></div>`;
  }).filter(Boolean);

  const label={7:'この7日間',30:'この30日間',all:'これまで'}[range];
  app.innerHTML=`<div style="display:flex;flex-direction:column;gap:18px">
    ${sample?`<div class="sample">見本のデータを表示しています（架空の記録です）。 <button class="linkbtn" id="unsmp">見本を閉じる</button></div>`:''}
    <div class="bar-row"><div class="seg" role="group" aria-label="期間">${[[7,'7日'],[30,'30日'],['all','ぜんぶ']].map(([v,t])=>`<button data-r="${v}" aria-pressed="${String(range)===String(v)}">${t}</button>`).join('')}</div>
      <div class="tools"><button class="btn" id="print">印刷する</button></div></div>
    <div class="kpis">
      <div class="kpi"><div class="k">学習した日</div><div class="v">${days}<small>日</small></div><div class="d">${label}</div></div>
      <div class="kpi"><div class="k">解いた問題</div><div class="v">${ans}<small>問</small></div><div class="d">${L.length}回あそんだ</div></div>
      <div class="kpi"><div class="k">正答率</div><div class="v">${ans?pct(ok,ans):'—'}<small>${ans?'%':''}</small></div><div class="d">${ans?`${ok}問 正解`:'問題を解いた記録なし'}</div></div>
      <div class="kpi"><div class="k">学習時間</div><div class="v">${time}<small>分</small></div><div class="d">最後に遊んだ日 ${last?md(last):'—'}</div></div>
    </div>
    <section class="card"><h2>日ごとの解いた問題数</h2>
      <div class="chart" id="chart">${svg}<div class="tip" id="tip"></div></div>
      <p class="note">${range==='all'?'最近30日を表示しています。':''}棒にさわると、その日の正答率と時間が出ます。パズルのように問題数で数えないゲームは、下の「最近の記録」で確かめられます。</p></section>
    <section class="card"><h2>ゲームごと</h2>
      ${glist.length?`<div class="glist">
      ${glist.map(g=>{const r=recInfo[g.f],st=starInfo[g.f];
        const prog=r?`<div class="prog"><div class="pb"><i class="m" style="width:${r.master/r.total*100}%"></i><i class="w" style="width:${r.weak/r.total*100}%"></i></div><span>覚えた ${r.master} / ${r.total}問・にがて ${r.weak}問</span></div>`
          :st?`<div class="prog"><span>クリア ${st.clear}${st.total?' / '+st.total:''}ステージ・★${st.stars}</span></div>`:'';
        const name=urlOf[g.f]?`<a href="${esc(urlOf[g.f])}">${esc(g.g)}</a>`:esc(g.g);
        return `<div class="grow"><span class="gname"><span class="dot" style="--c:${color(subjOf[g.f])}"></span>${name}</span>
          <span class="gst">${g.n}回${g.a?`・正答率 ${pct(g.k,g.a)}%`:''}・最後 ${g.last?md(g.last):'—'}</span>${prog}</div>`;}).join('')}
      </div><p class="note">回数・正答率は${label}のぶん。「覚えた問題」は有料版の記録（2回以上正解して、まちがいより正解が多い問題）です。</p>`:'<p class="note">記録がありません。</p>'}</section>
    <section class="card"><h2>にがての問題</h2>
      ${weakBlocks.length?`<div class="weak">${weakBlocks.join('')}</div><p class="note">${label}にまちがえた問題と、有料版で「にがて」になっている問題です。×の数はまちがえた回数。</p>`:`<p class="note">${label}にまちがえた問題はありません。</p>`}</section>
    <section class="card"><h2>最近の記録</h2>
      ${L.length?`<div class="log">${L.slice(0,60).map(e=>{
        const sc=e.star?`${'★'.repeat(Math.max(0,Math.min(3,e.s)))}${'☆'.repeat(Math.max(0,3-Math.min(3,e.s)))} クリア`:e.n!=null?`${e.s} / ${e.n}`:e.a?`${e.k} / ${e.a}`:'—';
        const good=e.n!=null?e.s/e.n>=.8:e.a?e.k/e.a>=.8:false;
        const c=course(e), m=e.m||[];
        return `<details><summary><span class="when">${md(e.t)}（${WD[new Date(e.t).getDay()]}）<br>${hm(e.t)}</span>
          <span class="what">${esc(e.g||e.f)}${c?`<small>${esc(c)}</small>`:''}</span><span class="sc ${good?'good':''}">${sc}</span></summary>
          <div class="body">${Math.max(1,Math.round(mins(e)/60000))}分　${m.length?'まちがえた問題：'+m.map(q=>showQ(/^hantaigo/.test(e.f)?String(q).replace('-','⇔'):q)).join('、'):e.a?'まちがえた問題はありません。':''}</div></details>`;}).join('')}</div>
        ${L.length>60?`<p class="note">新しいものから60件を表示しています。</p>`:''}`:`<p class="note">${label}の記録はありません。</p>`}</section>
    ${sample?'':`<div class="noprint"><button class="linkbtn" id="clear" style="color:var(--muted)">学習の記録を消す</button> <span id="cq" class="confirm"></span>
      <p class="note">記録は、ブラウザの「閲覧データの削除」をしたときにも消えます。</p></div>`}
  </div>`;
  app.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{range=b.dataset.r==='all'?'all':+b.dataset.r;try{localStorage.setItem('mn-parent-range',JSON.stringify(range));}catch(e){}render();});
  document.getElementById('print').onclick=()=>window.print();
  const un=document.getElementById('unsmp'); if(un)un.onclick=()=>{sample=false;render();};
  const cl=document.getElementById('clear');
  if(cl)cl.onclick=()=>{document.getElementById('cq').innerHTML='本当に消しますか？（「覚えた問題」の記録は残ります） <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
    document.getElementById('yes').onclick=()=>{try{localStorage.removeItem('mn-history');}catch(e){}H=[];render();};
    document.getElementById('no').onclick=()=>{document.getElementById('cq').textContent='';};};
  // グラフのツールチップ
  const chart=document.getElementById('chart'), tip=document.getElementById('tip');
  chart.querySelectorAll('g[data-i]').forEach(g=>{
    const show=()=>{const d=byDay[+g.dataset.i];chart.querySelectorAll('g.on').forEach(x=>x.classList.remove('on'));g.classList.add('on');
      const r=g.querySelector('.hit').getBoundingClientRect(), c=chart.getBoundingClientRect(), b=g.querySelector('.b');
      const yTop=b?b.getBoundingClientRect().top:r.bottom-30;
      tip.innerHTML=`<b>${md(d.t)}（${WD[new Date(d.t).getDay()]}）</b><br>${d.a?`${d.a}問・正答率 ${pct(d.k,d.a)}%`:d.n?'問題数で数えないゲーム':'記録なし'}${d.n?`<br>${d.n}回・${d.m}分`:''}`;
      tip.style.display='block';
      const half=tip.offsetWidth/2, x=Math.min(Math.max(r.left+r.width/2-c.left,half),c.width-half);
      tip.style.left=x+'px'; tip.style.top=(yTop-c.top)+'px';};
    g.addEventListener('mouseenter',show); g.addEventListener('click',show);
  });
  chart.addEventListener('mouseleave',()=>{tip.style.display='none';chart.querySelectorAll('g.on').forEach(x=>x.classList.remove('on'));});
}
render();
})();
</script>
</body>
</html>
