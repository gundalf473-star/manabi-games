<script>
/* 有料版の利用コード（まなびゲーム箱）。サーバー（site.json の apiBase）に利用コードを確かめてもらい、
   期限内のときだけ問題データを受け取ります。この端末には「利用コード・期限・通行証」だけを保存します。 */
(function(){
var API="", KEY='mn-access', DEV='mn-device';
var SUBJ={'国語':'kokugo','算数':'sansu','社会':'shakai','理科':'rika'}, SNAME={kokugo:'国語',sansu:'算数',shakai:'社会',rika:'理科',all:'全教科'};
var PNAME={d1:'1日',w1:'1週間',m1:'1ヵ月',y1:'1年'};
function ls(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function device(){var d=ls(DEV,'');if(!d){var a=new Uint8Array(12);crypto.getRandomValues(a);d=Array.from(a,function(b){return b.toString(16).padStart(2,'0');}).join('');lsSet(DEV,d);}return d;}
function list(){var l=ls(KEY,[]);return Array.isArray(l)?l:[];}
function save(l){lsSet(KEY,l);}
function upsert(e){var l=list().filter(function(x){return x.code!==e.code;});l.push(e);save(l);return e;}
function remove(code){save(list().filter(function(x){return x.code!==code;}));}
function fmt(t){var d=new Date(t);return (d.getFullYear()!==new Date().getFullYear()?d.getFullYear()+'年':'')+(d.getMonth()+1)+'月'+d.getDate()+'日 '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');}
function left(t){var ms=t-Date.now();if(ms<=0)return '終了';var d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);return d>0?'あと'+d+'日'+(d<3?h+'時間':''):h>0?'あと'+h+'時間'+m+'分':'あと'+m+'分';}
var ERR={not_found:'この利用コードは見つかりません。文字をもう一度確かめてください。',expired:'この利用コードは、利用期間が終わっています。',revoked:'この利用コードは使えなくなっています。',
  devices:'この利用コードは、すでに3台の端末で使われています。ほかの端末で使うときは、お問い合わせください。',bad_code:'利用コードは「MN-」から始まる12文字です。',subject:'このプランでは、この教科のゲームは使えません。',
  no_data:'問題データの準備中です。しばらくしてからもう一度ためしてください。',net:'通信できませんでした。インターネットにつながっているか確かめてください。',noapi:'有料版の販売は準備中です。'};
function call(path,opt){
  if(!API)return Promise.reject({error:'noapi'});
  return fetch(API.replace(/\/$/,'')+path,opt).then(function(r){return r.json().catch(function(){return {};}).then(function(d){if(!r.ok){d=d||{};d.status=r.status;throw d;}return d;});},function(){throw {error:'net'};});
}
function activate(code){
  return call('/api/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code,device:device()})})
    .then(function(d){return upsert({code:d.code,s:d.subject,p:d.period,exp:d.exp,token:d.token});});
}
function covers(e,s){return e.s==='all'||e.s===s;}
function pageSubject(){var m=document.querySelector('meta[name="game:subject"]');return m?SUBJ[m.content]||'':'';}
/* ゲームのデータを受け取る。使えるプランがなければ {error} を投げる */
function load(game,subject){
  var s=subject||pageSubject(), now=Date.now();
  var cand=list().filter(function(e){return covers(e,s);});
  var live=cand.filter(function(e){return e.exp>now;}).sort(function(a,b){return b.exp-a.exp;});
  if(!live.length)return Promise.reject(cand.length?{error:'expired',exp:Math.max.apply(null,cand.map(function(e){return e.exp;}))}:{error:'none'});
  var i=0, lastErr=null;
  function tryOne(){
    if(i>=live.length)return Promise.reject(lastErr||{error:'none'});
    var e=live[i++];
    var get=function(tok){return call('/api/pack/'+game,{headers:{Authorization:'Bearer '+tok}});};
    return get(e.token).catch(function(err){
      if(err.error==='renew'||err.error==='bad_token') return activate(e.code).then(function(n){return get(n.token);});
      throw err;
    }).catch(function(err){
      if(err.error==='net'||err.error==='no_data')throw err;
      if(err.error==='expired'){e.exp=Math.min(e.exp,Date.now());upsert(e);}
      if(err.error==='revoked'||err.error==='not_found')remove(e.code);
      lastErr=err; return tryOne();
    });

}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function base(){var p=location.pathname;return p.indexOf('/games/')>=0?'../':'';}

function lock(el,opt){

  var msg=err.error==='expired'?'利用期間が終わりました'+(err.exp?'（'+fmt(err.exp)+'まで）':'')+'。続けて使うときは、新しいプランをお買い求めください。':
          err.error&&err.error!=='none'?(ERR[err.error]||'うまく読みこめませんでした。'):'';
  el.innerHTML='<div class="mn-lock" style="display:flex;flex-direction:column;gap:12px">'
   +'<div style="font-size:12px;font-weight:700;letter-spacing:.1em;opacity:.8">有料版</div>'
   +'<p style="margin:0;font-weight:700">この有料版は「'+esc(SNAME[s]||'')+'」または「全教科」のプランで使えます。購入したときの<b>利用コード</b>を入れてください。</p>'
   +'<form id="mn-f" autocomplete="off" style="display:flex;flex-direction:column;gap:10px">'
   +'<label for="mn-code" style="font-weight:700">利用コード</label>'
   +'<input id="mn-code" inputmode="latin" autocapitalize="characters" spellcheck="false" placeholder="MN-XXXX-XXXX-XXXX" style="font:inherit;font-size:20px;letter-spacing:.05em;padding:10px 12px;border:2px solid currentColor;border-radius:8px;background:transparent;color:inherit;width:100%;box-sizing:border-box;opacity:.9">'
   +'<p id="mn-err" role="alert" style="margin:0;min-height:1.5em;font-size:14px;color:#c8352d;font-weight:700">'+esc(msg)+'</p>'
   +'<div><button id="mn-go" type="submit" style="font:inherit;font-weight:700;border:0;border-radius:8px;padding:10px 22px;cursor:pointer;background:var(--fg,#1f2a37);color:var(--surface,#fff)">使う</button></div></form>'
   +'<div style="border-radius:8px;padding:12px 14px;font-size:14px;background:rgba(127,127,127,.12);line-height:1.8">'
   +(API?'<a href="'+b+'buy.html?s='+(s||'all')+'" style="font-weight:700;color:inherit">料金プランを見る・購入する</a><br>':'有料版の販売は準備中です。<br>')
   +'<a href="'+b+'plan.html" style="color:inherit">利用中のプランを確かめる</a>'
   +(opt.free?'<br>無料版は <a href="'+esc(opt.free)+'" style="color:inherit">こちら</a> で遊べます。':'')+'</div></div>';
  var f=el.querySelector('#mn-f');
  f.onsubmit=function(ev){ev.preventDefault();
    var v=el.querySelector('#mn-code').value, bt=el.querySelector('#mn-go'), er=el.querySelector('#mn-err');
    if(!v.trim()){er.textContent='利用コードを入れてください。';return;}
    bt.disabled=true;bt.textContent='確かめています…';
    activate(v).then(function(e){
      if(!covers(e,s)){bt.disabled=false;bt.textContent='使う';er.textContent='この利用コードは「'+SNAME[e.s]+'」のプランです。このゲームは「'+SNAME[s]+'」のプランで使えます。';return;}
      try{window.mnTrack&&mnTrack('unlock',{product:opt.game,plan:e.s+'-'+e.p});}catch(x){}
      return opt.onOpen();
    }).catch(function(e){bt.disabled=false;bt.textContent='使う';er.textContent=ERR[e&&e.error]||'うまくいきませんでした。もう一度ためしてください。';});
  };
}
window.mnAccess={api:API,list:list,remove:remove,activate:activate,load:load,lock:lock,fmt:fmt,left:left,SNAME:SNAME,PNAME:PNAME,ERR:ERR,device:device,call:call};
})();
</script>

const PREFIX=PAID?'kotowaza-p':'kotowaza', ROUND=10;
let W=null, shopUrl='';

/* ことわざのデータ: [空らんを{}でかこんだ文, 空らんの読み, 意味, レベル, 分類] */
const word=w=>w[0].match(/\{([^}]+)\}/)[1];
const plain=w=>w[0].replace(/[{}]/g,'');
const phraseHTML=(w,fill,cls)=>esc(w[0]).replace(/\{([^}]+)\}/,(m,x)=>`<span class="blank ${cls||''}">${fill?esc(fill):''}</span>`);

/* ---------- 合言葉（有料版） ---------- */
async function decrypt(){ return mnAccess.load('kotowaza'); }
function lockScreen(err){ mnAccess.lock(app,{game:'kotowaza',err:err,free:'kotowaza.html',onOpen:async()=>{ W=await decrypt(); home(); }}); }

/* ---------- 記録（有料版） ---------- */
let rec=store.get(PREFIX+'-rec',{});
const saveRec=()=>store.set(PREFIX+'-rec',rec);
const state=w=>{const r=rec[plain(w)];if(!r)return 'new';if(r[0]>=2&&r[0]>r[1])return 'master';if(r[1]>0)return 'weak';return 'try';};
const THEMES={
  all:['ぜんぶ',w=>true],
  体:['体',w=>w[4]==='体'],動物:['動物・虫',w=>w[4]==='動物'],自然:['自然・植物',w=>w[4]==='自然'],その他:['その他',w=>w[4]==='その他'],
  ...(PAID?{lv1:['基本',w=>w[3]===1],lv2:['標準',w=>w[3]===2],lv3:['発展',w=>w[3]===3],weak:['にがて',w=>state(w)==='weak'],fresh:['まだやっていない',w=>state(w)==='new']}:{})
};
const MODES={fill:['うめる','空らんに入ることばを、8まいの札からえらぶ。'],choice:['えらぶ','意味に合うことわざを、4つの中からえらぶ。']};
let theme='all', G=null, best=store.get(PREFIX+'-best',{});
const PAIDLINK=`<a class="paid" href="kotowaza-full.html" id="paid-link"><span class="pt">もっと覚えたい人へ　<b>ことわざクイズ 完全版</b>（有料版）</span><span class="pd">小学生から中学入試までによく出る142語。レベル別の練習、覚えたことわざの記録、苦手だけの復習つき。</span></a>`;

function home(){
  G=null;
  const pool=W.filter(THEMES[theme][1]);
  let rec_html='';
  if(PAID){
    const cnt={master:0,weak:0,new:0,try:0}; W.forEach(w=>cnt[state(w)]++);
    rec_html=`<div class="master"><div class="top"><span class="h2">覚えたことわざ</span><span class="cnt">${cnt.master}<small> / ${W.length}語</small></span></div>
      <div class="mbar" aria-hidden="true"><i class="m" style="width:${cnt.master/W.length*100}%"></i><i class="w" style="width:${cnt.weak/W.length*100}%"></i></div>
      <div class="mleg"><span style="--c:var(--ok)">覚えた ${cnt.master}</span><span style="--c:var(--gold)">にがて ${cnt.weak}</span><span style="--c:var(--rule)">まだ ${cnt.new}</span></div>
      <p class="note">2回以上正解し、正解がまちがいより多くなると「覚えた」になります。</p></div>`;
  }
  app.innerHTML=`<section class="box">${rec_html}
    <div><div class="h2" style="margin-bottom:8px">練習することわざ</div>
      <div class="chips">${Object.entries(THEMES).map(([k,[nm,f]])=>{const n=W.filter(f).length;return `<button class="chip" id="th-${k}" data-t="${k}" aria-pressed="${k===theme}" ${n?'':'disabled'}>${nm}（${n}）</button>`;}).join('')}</div></div>
    <div><div class="h2" style="margin-bottom:8px">あそびかた</div>
      <div class="modes">${Object.entries(MODES).map(([k,[nm,ds]])=>`<button class="mode" id="mode-${k}" data-m="${k}" ${pool.length?'':'disabled'}><span class="nm">${nm}</span><span class="ds">${ds}</span><span class="best">${best[k+'-'+theme]!=null?`ベスト ${best[k+'-'+theme]}/${Math.min(ROUND,pool.length)}`:''}</span></button>`).join('')}</div></div>
    <p class="note">${pool.length<ROUND?`この練習は${pool.length}語なので、${pool.length}問になります。`:'1回10問です。'}${PAID?'':'　「情けは人のためならず」のように、意味をまちがえやすいことわざは入試によく出ます。'}</p>
    ${PAID?'<div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>':PAIDLINK}
  </section>`;
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{theme=b.dataset.t;home();});
  app.querySelectorAll('.mode').forEach(b=>b.onclick=()=>start(b.dataset.m));
  const rs=document.getElementById('reset');
  if(rs)rs.onclick=()=>{
    document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
    document.getElementById('yes').onclick=()=>{rec={};saveRec();home();};
    document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
  };
}
function start(mode,list){
  const pool=W.filter(THEMES[theme][1]);
  const qs=(list||shuffle(pool).slice(0,ROUND)).map(w=>{
    if(mode==='choice'){
      const ok=x=>x!==w&&!(w[5]&&x[5]===w[5])&&x[2]!==w[2];const same=shuffle(W.filter(x=>ok(x)&&x[4]===w[4])), other=shuffle(W.filter(x=>ok(x)&&x[4]!==w[4]));
      return {w,ch:shuffle([w,...[...same,...other].slice(0,3)])};
    }
    const right=word(w);
    const all=new Set(W.map(plain)), fits=x=>all.has(w[0].replace(/\{[^}]+\}/,x));
    const cand=[...new Set([...shuffle(W.filter(x=>x[4]===w[4])),...shuffle(W)].map(word))].filter(x=>x!==right&&!fits(x));
    return {w,tiles:shuffle([right,...cand.slice(0,7)])};
  });
  G={mode,qs,i:0,score:0,combo:0,maxCombo:0,miss:[],done:false,newly:[],retry:!!list};
  track('level_start',{level_name:`${PREFIX}-${mode}-${theme}`});
  show();
}
function head(){
  const w=G.qs[G.i].w;
  return `<div class="bar"><div class="prog" aria-hidden="true"><i style="width:${G.i/G.qs.length*100}%"></i></div>
    <span class="nums">${G.i+1} / ${G.qs.length}</span>${G.combo>=2?`<span class="combo">${G.combo}連続</span>`:''}<span class="cat">${THEMES[w[4]][0]}</span></div>`;
}
function show(){
  const it=G.qs[G.i], w=it.w;
  if(G.mode==='choice'){
    app.innerHTML=`<section class="box">${head()}
      <div class="meaning"><div class="lab">意味</div><p>${esc(w[2])}</p></div>
      <div class="choices">${it.ch.map((c,j)=>`<button class="ch" id="ch${j}" data-j="${j}">${esc(plain(c))}</button>`).join('')}</div>
      <div id="after"></div></section>`;
    app.querySelectorAll('.ch').forEach(b=>b.onclick=()=>judge(it.ch[+b.dataset.j]===w,+b.dataset.j));
  } else {
    app.innerHTML=`<section class="box">${head()}
      <div class="phrase" id="phrase">${phraseHTML(w)}</div>
      <div class="meaning"><div class="lab">意味</div><p>${esc(w[2])}</p></div>
      <div class="tiles">${it.tiles.map((c,j)=>`<button class="tile" id="tile${j}" data-j="${j}">${esc(c)}</button>`).join('')}</div>
      <div id="after"></div></section>`;
    app.querySelectorAll('.tile').forEach(b=>b.onclick=()=>judge(it.tiles[+b.dataset.j]===word(w),+b.dataset.j));
  }
}
function judge(ok,j){
  if(G.done)return; G.done=true;
  const it=G.qs[G.i], w=it.w, before=PAID?state(w):null;
  if(G.mode==='choice'){
    app.querySelectorAll('.ch').forEach((b,k)=>{b.disabled=true;if(it.ch[k]===w)b.classList.add('right');else if(k===j)b.classList.add('wrong');});
  } else {
    app.querySelectorAll('.tile').forEach((b,k)=>{b.disabled=true;if(it.tiles[k]===word(w))b.classList.add('right');else if(k===j)b.classList.add('wrong');});
    document.getElementById('phrase').innerHTML=phraseHTML(w,word(w),ok?'ok':'ng');
  }
  let nowMaster=false;
  if(PAID){const r=rec[plain(w)]||[0,0]; r[ok?0:1]++; rec[plain(w)]=r; saveRec(); nowMaster=state(w)==='master'&&before!=='master'; if(nowMaster)G.newly.push(w);}
  if(ok){G.score++;G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);}else{G.combo=0;G.miss.push(w);}
  track('answer_question',{category:`${PREFIX}-${G.mode}-${w[4]}`,question:plain(w),correct:ok});
  const last=G.i===G.qs.length-1;
  document.getElementById('after').innerHTML=`<div class="verdict ${ok?'ok':'ng'}">${ok?'正解！':'ざんねん'}${nowMaster?'<span class="newmark">覚えた！</span>':''}</div>
    <div class="exp"><b>${esc(plain(w))}</b>　<span class="y">（空らん：${esc(word(w))}＝${esc(w[1])}）</span><br>${esc(w[2])}</div>
    <div class="row"><button class="btn go" id="next">${last?'結果を見る':'次の問題へ'}</button></div>`;
  const nx=document.getElementById('next'); nx.onclick=next; nx.focus({preventScroll:true});
}
function next(){ G.done=false; if(++G.i<G.qs.length)show(); else result(); }
function result(){
  const n=G.qs.length,s=G.score,r=s/n;
  const rank=r===1?'満点':r>=.8?'特選':r>=.6?'入選':r>=.4?'佳作':'もう一歩';
  const k=G.mode+'-'+theme; let isNew=false;
  if(!G.retry&&(best[k]==null||s>best[k])){best[k]=s;store.set(PREFIX+'-best',best);isNew=true;}
  track('level_end',{level_name:`${PREFIX}-${G.mode}-${theme}`,success:s===n,score:s,total:n});
  const m=PAID?W.filter(w=>state(w)==='master').length:0;
  app.innerHTML=`<section class="box">
    <h2 class="h2">${MODES[G.mode][0]}・${THEMES[theme][0]}の結果</h2>
    <div class="score"><div class="big">${s}<small> / ${n}問</small></div><div class="seal">${rank}</div></div>
    <p style="margin:0">${PAID?`${G.newly.length?`新しく${G.newly.length}語を覚えました。`:''}覚えたことわざは ${m} / ${W.length}語です。`:(r===1?'全問正解！すばらしい。':r>=.6?'よくできました。まちがえたことわざを見直そう。':'空らんのことばと意味をセットで覚えると、ぐっと解きやすくなります。')}${G.maxCombo>=3?`　最高${G.maxCombo}連続正解！`:''}${isNew&&s>0?'　自己ベスト更新！':''}</p>
    <div class="row" style="justify-content:flex-start"><button class="btn go" id="again">もう一度</button>${G.miss.length?'<button class="btn" id="retry">まちがえたことわざだけ</button>':''}<button class="btn" id="home">はじめにもどる</button></div>
    ${PAID?'':PAIDLINK}
    ${G.miss.length?`<div class="h2" style="font-size:17px">おぼえておこう</div><div class="review">${G.miss.map(w=>`<div class="rv"><span class="w">${esc(plain(w))}</span><div>${esc(w[2])}</div></div>`).join('')}</div>`:''}
  </section>`;
  document.getElementById('again').onclick=()=>start(G.mode);
  document.getElementById('home').onclick=home;
  const rt=document.getElementById('retry'); if(rt)rt.onclick=()=>start(G.mode,shuffle(G.miss));
}
document.addEventListener('keydown',e=>{
  if(!G||G.done||G.mode!=='choice')return;
  const k={'1':0,'2':1,'3':2,'4':3}[e.key]; if(k!=null){const it=G.qs[G.i];judge(it.ch[k]===it.w,k);}
});

(async()=>{
  if(!PAID){ W=JSON.parse(document.getElementById('data').textContent); home(); return; }
  try{ W=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>

<a href="index.html" style="position:fixed;left:calc(10px + env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:99;background:#1d2b45;color:#fff;font:700 13px/1 system-ui,sans-serif;padding:9px 12px;border-radius:99px;text-decoration:none;opacity:.88">← ゲーム一覧</a>
<!-- ご意見ボタン・問題のお知らせ・ワンタップ評価。build.mjs が全ゲームの最後に自動で入れます。 -->
<style>
.mnfb-btn{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:99;background:#1d2b45;color:#fff;font:700 13px/1 system-ui,sans-serif;padding:9px 12px;border-radius:99px;border:0;opacity:.88;cursor:pointer}
.mnfb-sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(52px + env(safe-area-inset-bottom,0px));z-index:100;box-sizing:border-box;width:min(420px,calc(100vw - 24px));background:#fff;color:#1d2b3d;border:1px solid #d6dde7;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.2);padding:14px 16px;font:15px/1.6 "BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;display:flex;flex-direction:column;gap:10px;text-align:left}
.mnfb-sheet[hidden]{display:none}
.mnfb-sheet .mnfb-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.mnfb-sheet .mnfb-x{border:0;background:none;color:#5d6a7c;font:700 20px/1 system-ui,sans-serif;cursor:pointer;padding:2px 6px}
.mnfb-sheet .mnfb-note{font-size:12px;color:#5d6a7c;margin:0}
.mnfb-sheet .mnfb-opt{display:block;width:100%;box-sizing:border-box;text-align:left;border:1px solid #d6dde7;background:#f2f5f9;color:#1d2b3d;border-radius:8px;padding:10px 12px;font:700 15px/1.5 inherit;font-family:inherit;cursor:pointer;text-decoration:none}
.mnfb-sheet .mnfb-opt small{display:block;font-weight:400;font-size:12px;color:#5d6a7c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mnfb-sheet .mnfb-opt:hover{border-color:#1f3a6e}
.mnfb-rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mnfb-rate button{border:1px solid #d6dde7;background:#f2f5f9;color:#1d2b3d;border-radius:10px;padding:8px 4px;font:700 13px/1.3 inherit;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.mnfb-rate button span{font-size:26px;line-height:1.1}
.mnfb-rate button:hover{border-color:#1f3a6e}
.mnfb-btn:focus-visible,.mnfb-sheet button:focus-visible,.mnfb-sheet a:focus-visible{outline:3px solid #c98a12;outline-offset:2px}
@media (prefers-color-scheme:dark){
  .mnfb-sheet{background:#18212d;color:#e4e9f1;border-color:#2a3546}
  .mnfb-sheet .mnfb-note,.mnfb-sheet .mnfb-x,.mnfb-sheet .mnfb-opt small{color:#9aa6b8}
  .mnfb-sheet .mnfb-opt,.mnfb-rate button{background:#10151d;color:#e4e9f1;border-color:#2a3546}
}
@media print{.mnfb-btn,.mnfb-sheet{display:none!important}}
</style>
<script>
(function(){
var CFG=null;            // site.json の feedbackForm から作った設定（なければ null）
var base=window.mnTrack, lastQ=null, lastLv='';
function file(){try{return decodeURIComponent(location.pathname.split('/').pop()||'');}catch(e){return '';}}
function clean(s){return String(s).replace(/\{(.+?)\}/g,'【$1】');}
function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function formUrl(kind,q){
  var u=CFG.base+'?usp=pp_url';
  if(CFG.type)u+='&'+CFG.type+'='+encodeURIComponent(kind==='q'?CFG.machigai:CFG.kansou);
  if(CFG.game)u+='&'+CFG.game+'='+encodeURIComponent(document.title);
  if(CFG.question&&q)u+='&'+CFG.question+'='+encodeURIComponent(q);
  return u;
}
var sheet=el('<div class="mnfb-sheet" role="dialog" aria-label="ご意見" hidden></div>');
document.body.appendChild(sheet);
function close(){sheet.hidden=true;sheet.innerHTML='';}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!sheet.hidden)close();});
// わくの外をさわったら閉じる（評価は「答えなかった」として、その日はもう出さない）
document.addEventListener('click',function(e){
  if(sheet.hidden||sheet.contains(e.target)||(e.target.closest&&e.target.closest('.mnfb-btn')))return;
  if(sheet.dataset.k==='rate')markRated();
  close();
},true);

// 1・2. ご意見ボタン（感想フォーム／いまの問題のまちがいを知らせる）
if(CFG){
  var btn=el('<button class="mnfb-btn" type="button" aria-haspopup="dialog">ご意見</button>');
  document.body.appendChild(btn);
  btn.onclick=function(){
    if(!sheet.hidden&&sheet.dataset.k==='menu'){close();return;}
    var q=lastQ||(lastLv?'コース：'+lastLv:'');
    sheet.dataset.k='menu';
    sheet.innerHTML='<div class="mnfb-h"><span>ご意見をお聞かせください</span><button class="mnfb-x" type="button" aria-label="閉じる">×</button></div>'
      +(lastQ?'<a class="mnfb-opt" data-kind="question" target="_blank" rel="noopener" href="'+esc(formUrl('q',q))+'">いまの問題のまちがいを知らせる<small>'+esc(q)+'</small></a>':'')
      +'<a class="mnfb-opt" data-kind="comment" target="_blank" rel="noopener" href="'+esc(formUrl('k',lastLv?'コース：'+lastLv:''))+'">感想・ご意見を送る<small>'+esc(document.title)+'</small></a>'
      +'<p class="mnfb-note">保護者の方向けのフォームが新しいページで開きます。お子さんのお名前や学校名は書かないでください。</p>';
    sheet.hidden=false;
    sheet.querySelector('.mnfb-x').onclick=close;
    sheet.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){try{base&&base('feedback_open',{kind:a.dataset.kind});}catch(e){}setTimeout(close,0);});});
  };
}

// 3. ワンタップ評価（ゲームを1回終えたとき。同じゲームは1日1回まで）
function rated(){try{var r=JSON.parse(localStorage.getItem('mn-rated')||'{}');return r[file()]===new Date().toDateString();}catch(e){return false;}}
function markRated(){try{var r=JSON.parse(localStorage.getItem('mn-rated')||'{}');r[file()]=new Date().toDateString();localStorage.setItem('mn-rated',JSON.stringify(r));}catch(e){}}
function askRating(lv){
  if(rated()||!sheet.hidden)return;
  sheet.dataset.k='rate';
  sheet.innerHTML='<div class="mnfb-h"><span>このゲーム、どうだった？</span><button class="mnfb-x" type="button" aria-label="閉じる">×</button></div>'
    +'<div class="mnfb-rate"><button type="button" data-r="fun"><span>😊</span>たのしかった</button><button type="button" data-r="ok"><span>🙂</span>ふつう</button><button type="button" data-r="hard"><span>😣</span>むずかしすぎた</button></div>';
  sheet.hidden=false;
  sheet.querySelector('.mnfb-x').onclick=function(){markRated();close();};
  sheet.querySelectorAll('[data-r]').forEach(function(b){b.onclick=function(){
    try{base&&base('game_rating',{rating:b.dataset.r,level_name:lv||''});}catch(e){}
    markRated();
    sheet.innerHTML='<div class="mnfb-h"><span>ありがとう！</span></div>';
    setTimeout(function(){if(sheet.dataset.k==='rate')close();},1200);
  };});
}
window.mnTrack=function(n,p){p=p||{};try{base&&base(n,p);}catch(e){}
  try{
    if(n==='level_start'){lastLv=String(p.level_name||'');if(sheet.dataset.k==='rate')close();}
    else if(n==='answer_question'){if(sheet.dataset.k==='rate')close();if(p.question!=null)lastQ=clean(p.question).slice(0,120);}
    else if(n==='level_end'){if(p.level_name)lastLv=String(p.level_name);setTimeout(function(){askRating(lastLv);},700);}
  }catch(e){}};
})();
</script>
