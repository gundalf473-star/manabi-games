function file(){try{return decodeURIComponent(location.pathname.split('/').pop()||'');}catch(e){return '';}}
function load(){try{var h=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(h)?h:[];}catch(e){return [];}}
function save(){if(!S||(!S.a&&S.s==null))return;try{var h=load(),i=-1;for(var j=h.length-1;j>=0&&j>=h.length-60;j--){if(h[j].id===S.id){i=j;break;}}
var e={id:S.id,t:S.t,e:Date.now(),f:file(),g:document.title,c:S.c,a:S.a,k:S.k,m:S.m};if(S.s!=null){e.s=S.s;if(S.n!=null)e.n=S.n;else e.star=1;}
if(i>=0)h[i]=e;else h.push(e);if(h.length>3000)h=h.slice(-3000);localStorage.setItem(KEY,JSON.stringify(h));}catch(x){}}
function begin(c){save();S={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:Date.now(),c:c||'',a:0,k:0,m:[],s:null,n:null};}

<script>
/* 有料版の利用コード（まなびゲーム箱）。サーバー（site.json の apiBase）に利用コードを確かめてもらい、
   期限内のときだけ問題データを受け取ります。この端末には「利用コード・期限・通行証」だけを保存します。 */
(function(){
var API="", KEY='mn-access', DEV='mn-device';
var SUBJ={'国語':'kokugo','算数':'sansu','社会':'shakai','理科':'rika'}, SNAME={kokugo:'国語',sansu:'算数',shakai:'社会',rika:'理科',all:'全教科'};
var PNAME={d1:'1日',w1:'1週間',m1:'1ヵ月',y1:'1年'};
function ls(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function device(){var d=ls(DEV,'');if(!d){var a=new Uint8Array(12);crypto.getRandomValues(a);d=Array.from(a,function(b){return b.toString(16).padStart(2,'0');}).join('');lsSet(DEV,d);}return d;}
function list(){var l=ls(KEY,[]);return Array.isArray(l)?l:[];}
function save(l){lsSet(KEY,l);}
function upsert(e){var l=list().filter(function(x){return x.code!==e.code;});l.push(e);save(l);return e;}
function remove(code){save(list().filter(function(x){return x.code!==code;}));}
function fmt(t){var d=new Date(t);return (d.getFullYear()!==new Date().getFullYear()?d.getFullYear()+'年':'')+(d.getMonth()+1)+'月'+d.getDate()+'日 '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');}
function left(t){var ms=t-Date.now();if(ms<=0)return '終了';var d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);return d>0?'あと'+d+'日'+(d<3?h+'時間':''):h>0?'あと'+h+'時間'+m+'分':'あと'+m+'分';}
var ERR={not_found:'この利用コードは見つかりません。文字をもう一度確かめてください。',expired:'この利用コードは、利用期間が終わっています。',revoked:'この利用コードは使えなくなっています。',
  devices:'この利用コードは、すでに3台の端末で使われています。ほかの端末で使うときは、お問い合わせください。',bad_code:'利用コードは「MN-」から始まる12文字です。',subject:'このプランでは、この教科のゲームは使えません。',
  no_data:'問題データの準備中です。しばらくしてからもう一度ためしてください。',net:'通信できませんでした。インターネットにつながっているか確かめてください。',noapi:'有料版の販売は準備中です。'};
function call(path,opt){
  if(!API)return Promise.reject({error:'noapi'});
  return fetch(API.replace(/\/$/,'')+path,opt).then(function(r){return r.json().catch(function(){return {};}).then(function(d){if(!r.ok){d=d||{};d.status=r.status;throw d;}return d;});},function(){throw {error:'net'};});
}
function activate(code){
  return call('/api/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code,device:device()})})
    .then(function(d){return upsert({code:d.code,s:d.subject,p:d.period,exp:d.exp,token:d.token});});
}
function covers(e,s){return e.s==='all'||e.s===s;}
function pageSubject(){var m=document.querySelector('meta[name="game:subject"]');return m?SUBJ[m.content]||'':'';}
/* ゲームのデータを受け取る。使えるプランがなければ {error} を投げる */
function load(game,subject){
  var s=subject||pageSubject(), now=Date.now();
  var cand=list().filter(function(e){return covers(e,s);});
  var live=cand.filter(function(e){return e.exp>now;}).sort(function(a,b){return b.exp-a.exp;});
  if(!live.length)return Promise.reject(cand.length?{error:'expired',exp:Math.max.apply(null,cand.map(function(e){return e.exp;}))}:{error:'none'});
  var i=0, lastErr=null;
  function tryOne(){
    if(i>=live.length)return Promise.reject(lastErr||{error:'none'});
    var e=live[i++];
    var get=function(tok){return call('/api/pack/'+game,{headers:{Authorization:'Bearer '+tok}});};
    return get(e.token).catch(function(err){
      if(err.error==='renew'||err.error==='bad_token') return activate(e.code).then(function(n){return get(n.token);});
      throw err;
    }).catch(function(err){
      if(err.error==='net'||err.error==='no_data')throw err;
      if(err.error==='expired'){e.exp=Math.min(e.exp,Date.now());upsert(e);}
      if(err.error==='revoked'||err.error==='not_found')remove(e.code);
      lastErr=err; return tryOne();
    });
  }
  return tryOne();
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function base(){var p=location.pathname;return p.indexOf('/games/')>=0?'../':'';}
/* 利用コードを入れる画面。opt: {game, err, onOpen, free(無料版のファイル名)} */
function lock(el,opt){
  var s=pageSubject(), err=opt.err||{}, b=base();
  var msg=err.error==='expired'?'利用期間が終わりました'+(err.exp?'（'+fmt(err.exp)+'まで）':'')+'。続けて使うときは、新しいプランをお買い求めください。':
          err.error&&err.error!=='none'?(ERR[err.error]||'うまく読みこめませんでした。'):'';
  el.innerHTML='<div class="mn-lock" style="display:flex;flex-direction:column;gap:12px">'
   +'<div style="font-size:12px;font-weight:700;letter-spacing:.1em;opacity:.8">有料版</div>'
   +'<p style="margin:0;font-weight:700">この有料版は「'+esc(SNAME[s]||'')+'」または「全教科」のプランで使えます。購入したときの<b>利用コード</b>を入れてください。</p>'
   +'<form id="mn-f" autocomplete="off" style="display:flex;flex-direction:column;gap:10px">'
   +'<label for="mn-code" style="font-weight:700">利用コード</label>'
   +'<input id="mn-code" inputmode="latin" autocapitalize="characters" spellcheck="false" placeholder="MN-XXXX-XXXX-XXXX" style="font:inherit;font-size:20px;letter-spacing:.05em;padding:10px 12px;border:2px solid currentColor;border-radius:8px;background:transparent;color:inherit;width:100%;box-sizing:border-box;opacity:.9">'
   +'<p id="mn-err" role="alert" style="margin:0;min-height:1.5em;font-size:14px;color:#c8352d;font-weight:700">'+esc(msg)+'</p>'
   +'<div><button id="mn-go" type="submit" style="font:inherit;font-weight:700;border:0;border-radius:8px;padding:10px 22px;cursor:pointer;background:var(--fg,#1f2a37);color:var(--surface,#fff)">使う</button></div></form>'
   +'<div style="border-radius:8px;padding:12px 14px;font-size:14px;background:rgba(127,127,127,.12);line-height:1.8">'
   +(API?'<a href="'+b+'buy.html?s='+(s||'all')+'" style="font-weight:700;color:inherit">料金プランを見る・購入する</a><br>':'有料版の販売は準備中です。<br>')
   +'<a href="'+b+'plan.html" style="color:inherit">利用中のプランを確かめる</a>'
   +(opt.free?'<br>無料版は <a href="'+esc(opt.free)+'" style="color:inherit">こちら</a> で遊べます。':'')+'</div></div>';
  var f=el.querySelector('#mn-f');
  f.onsubmit=function(ev){ev.preventDefault();
    var v=el.querySelector('#mn-code').value, bt=el.querySelector('#mn-go'), er=el.querySelector('#mn-err');
    if(!v.trim()){er.textContent='利用コードを入れてください。';return;}
    bt.disabled=true;bt.textContent='確かめています…';
    activate(v).then(function(e){
      if(!covers(e,s)){bt.disabled=false;bt.textContent='使う';er.textContent='この利用コードは「'+SNAME[e.s]+'」のプランです。このゲームは「'+SNAME[s]+'」のプランで使えます。';return;}
      try{window.mnTrack&&mnTrack('unlock',{product:opt.game,plan:e.s+'-'+e.p});}catch(x){}
      return opt.onOpen();
    }).catch(function(e){bt.disabled=false;bt.textContent='使う';er.textContent=ERR[e&&e.error]||'うまくいきませんでした。もう一度ためしてください。';});
  };
}
window.mnAccess={api:API,list:list,remove:remove,activate:activate,load:load,lock:lock,fmt:fmt,left:left,SNAME:SNAME,PNAME:PNAME,ERR:ERR,device:device,call:call};
})();
</script>

<script>
(function(){
/* 問題データ
   type: to=かかり先 / subj=主語 / pred=述語 / multi=かかる言葉を2つ
   bun: 文節、src: 問う文節（to）、target: かかられる文節（multi）、ans: 正解、link: 答えたあとに引く矢印 [から,へ]
   check: 文節ごとの「つなげ読み」と理由、tip: まとめ */
const PAID=true;
let CQ=[];
let QS=[];
const KIND={to:'かかり先',subj:'主語',pred:'述語',multi:'かかる言葉を2つ',comma:'読点'};
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const strip=s=>s.replace(/[。、]/g,'');
let G=null;
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const norm=s=>s.normalize('NFKC').toLowerCase().replace(/[\s\-ー－]/g,'');
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let shopUrl='', rec=store.get('kakariuke-p-rec',{}), best=store.get(PAID?'kakariuke-p-best':'kakariuke-best',{}), course=null;
const saveRec=()=>store.set('kakariuke-p-rec',rec);
const state=q=>{const r=rec[qkey(q)];if(!r)return 'new';if(r[0]>=2&&r[0]>r[1])return 'master';if(r[1]>0)return 'weak';return 'try';};
const record=(q,ok)=>{if(!PAID)return false;const before=state(q);const r=rec[qkey(q)]||[0,0];r[ok?0:1]++;rec[qkey(q)]=r;saveRec();return state(q)==='master'&&before!=='master';};
const LV={1:['基本','ようすを表す言葉・いつを表す言葉のかかり先、かんたんな主語と述語。'],2:['標準','言葉をとばしてかかる問題、「たぶん〜だろう」などの組になる言葉、かかる言葉を2つえらぶ問題。'],3:['発展','長い文、言葉の順番が入れかわる文（倒置）、読点で意味が変わる問題。']};
const PAIDLINK=`<a class="paid" href="kakariuke-full.html" id="paid-link"><span class="pt">もっと練習したい人へ　<b>係り受けクイズ 100問</b>（有料版）</span><span class="pd">基本・標準・発展の3コース、全100問。覚えた問題の記録と、苦手だけの復習つき。</span></a>`;
async function decrypt(){ return mnAccess.load('kakariuke'); }
function lockScreen(err){ mnAccess.lock(app,{game:'kakariuke',err:err,free:'kakariuke.html',onOpen:async()=>{ QS=await decrypt(); home(); }}); }

function home(){
  G=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">コースをえらぶ</div>
    <div class="courses">
      <button class="course" id="go"><span class="nm">係り受け</span><span class="ds">文節の札をタップして、かかり先・主語・述語を答える。${QS.length}問。</span></button>
      <button class="course" id="go2"><span class="nm">読点で意味が変わる</span><span class="ds">言葉のすき間をタップして読点「、」を打ち、言われた意味の文にする。${CQ.length}問。</span></button>
    </div>
    <p class="note">答えたあとは、矢印でかかり先を確かめよう。</p>${PAID?'':PAIDLINK}`;
  document.getElementById('go').onclick=()=>start(QS.map((q,i)=>i));
  document.getElementById('go2').onclick=()=>start(CQ.map((q,i)=>'c'+i));
}
const getQ=k=>typeof k==='string'?Object.assign({type:'comma'},CQ[+k.slice(1)]):QS[k];
const qkey=q=>(q.bun||q.tok).join('')+'|'+(q.meaning||q.type);
function homePaid(){
  const cnt={master:0,weak:0,new:0,try:0}; QS.forEach(q=>cnt[state(q)]++);
  const pools={1:QS.filter(q=>q.lv===1),2:QS.filter(q=>q.lv===2),3:QS.filter(q=>q.lv===3)};
  const weak=QS.filter(q=>state(q)==='weak'), fresh=QS.filter(q=>state(q)==='new');
  app.innerHTML=`<div class="master"><div class="tp"><span class="label" style="font-size:14px;color:var(--fg)">覚えた問題</span><span class="cnt">${cnt.master}<small> / ${QS.length}問</small></span></div>
      <div class="mbar" aria-hidden="true"><i class="m" style="width:${cnt.master/QS.length*100}%"></i><i class="w" style="width:${cnt.weak/QS.length*100}%"></i></div>
      <div class="mleg"><span style="--c:var(--ok)">覚えた ${cnt.master}</span><span style="--c:#b88a1e">にがて ${cnt.weak}</span><span style="--c:var(--rule)">まだ ${cnt.new}</span></div></div>
    <div class="label">コースをえらぶ（1回10問）</div>
    <div class="courses">${[1,2,3].map(l=>`<button class="course" id="lv${l}" data-l="${l}"><span class="nm">${LV[l][0]}</span><span class="ds">${LV[l][1]}（${pools[l].length}問）</span><span class="best">${best['lv'+l]!=null?`ベスト ${best['lv'+l]}/10`:''}</span></button>`).join('')}
      <button class="course" id="lvweak" data-l="weak" ${weak.length?'':'disabled'}><span class="nm">にがて</span><span class="ds">まちがえたことのある問題だけ（${weak.length}問）</span></button>
      <button class="course" id="lvfresh" data-l="fresh" ${fresh.length?'':'disabled'}><span class="nm">まだやっていない</span><span class="ds">一度も出ていない問題だけ（${fresh.length}問）</span></button></div>
    <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
  app.querySelectorAll('.course').forEach(b=>b.onclick=()=>{
    const l=b.dataset.l; course=l;
    const pool=l==='weak'?weak:l==='fresh'?fresh:pools[l];
    start(shuffle(pool).slice(0,10).map(q=>QS.indexOf(q)));
  });
  document.getElementById('reset').onclick=()=>{
    document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
    document.getElementById('yes').onclick=()=>{rec={};saveRec();homePaid();};
    document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
  };
}
function start(list){
  G={list,i:0,score:0,miss:[],done:false,sel:new Set()};
  track('level_start',{level_name:typeof list[0]==='string'?'kakariuke-comma':'kakariuke'});
  render();
}
function qtext(q){
  if(q.type==='to')return `<span class="src">${esc(q.bun[q.src])}</span> はどの言葉にかかりますか。`;
  if(q.type==='subj')return `この文の<b>主語</b>はどれですか。`;
  if(q.type==='pred')return `この文の<b>述語</b>はどれですか。`;
  return `<span class="src">${esc(q.bun[q.target])}</span> にかかる言葉を<b>2つ</b>えらびましょう。`;
}
function render(){
  if(getQ(G.list[G.i]).type==='comma')return renderComma();
  const q=getQ(G.list[G.i]), d=G.done, ans=new Set(q.ans);
  const cls=i=>{
    let c='';
    if(q.type==='to'&&i===q.src)c+=' src';
    if(q.type==='multi'&&i===q.target)c+=' target';
    if(!d&&G.sel.has(i))c+=' sel';
    if(d&&ans.has(i))c+=' right';
    if(d&&G.sel.has(i)&&!ans.has(i))c+=' wrong';
    return c;
  };
  const fixed=i=>(q.type==='to'&&i===q.src)||(q.type==='multi'&&i===q.target);
  app.innerHTML=`<div class="top"><div class="prog" aria-hidden="true"><i style="width:${G.i/G.list.length*100}%"></i></div><span class="nums">${G.i+1} / ${G.list.length}</span><span class="kind">${KIND[q.type]}</span></div>
    <p class="q">${qtext(q)}</p>
    <div class="sentwrap" id="sw"><svg class="arc" id="arc" aria-hidden="true"></svg>
      <div class="sent">${q.bun.map((b,i)=>`<button class="bun${cls(i)}" id="b${i}" data-i="${i}" ${fixed(i)||d?'disabled':''} aria-pressed="${G.sel.has(i)}">${esc(b)}</button>`).join('')}</div></div>
    ${q.type==='multi'&&!d?`<div class="row"><span class="note" id="cnt">${G.sel.size} / 2 えらんでいます</span><button class="btn go" id="ok" ${G.sel.size===2?'':'disabled'}>こたえる</button></div>`:''}
    <div id="after"></div>`;
  app.querySelectorAll('.bun').forEach(b=>b.onclick=()=>tap(+b.dataset.i));
  const ok=document.getElementById('ok'); if(ok)ok.onclick=judge;
  if(d){drawArcs();explain();}
}
function renderComma(){
  const q=getQ(G.list[G.i]), d=G.done, n=q.tok.length, pick=G.pick;
  const gap=i=>{
    let c='', t='';
    if(d&&i===q.ans){c='right';t='、';}
    else if(d&&i===pick){c='wrong';t='、';}
    return `<button class="gap ${c}" id="g${i}" data-i="${i}" ${d?'disabled':''} aria-label="ここに読点を打つ">${t}</button>`;
  };
  app.innerHTML=`<div class="top"><div class="prog" aria-hidden="true"><i style="width:${G.i/G.list.length*100}%"></i></div><span class="nums">${G.i+1} / ${G.list.length}</span><span class="kind">読点</span></div>
    <p class="q">${esc(q.meaning)}、読点「、」を1つ打ちましょう。</p>
    <p class="note">言葉と言葉のすき間（点線のわく）をタップすると、そこに読点が入ります。</p>
    <div class="sentwrap" id="sw"><svg class="arc" id="arc" aria-hidden="true"></svg>
      <div class="sent cm ${q.chars?'chars':''}">${q.tok.map((t,i)=>`<span class="tok ${d&&G.ok&&(i===q.mod||i===q.to)?'mod':''}" id="b${i}">${esc(t)}</span>${i<n-1?gap(i):''}`).join('')}</div></div>
    <div id="after"></div>`;
  app.querySelectorAll('.gap').forEach(b=>b.onclick=()=>{if(G.done)return;G.pick=+b.dataset.i;const ok=G.pick===q.ans;G.done=true;G.ok=ok;G.newM=record(q,ok);if(ok)G.score++;else G.miss.push(G.list[G.i]);track('answer_question',{category:'kakariuke-comma',question:q.tok.join(''),correct:ok});renderComma();});
  if(d){
    const svg=document.getElementById('arc'); let s='';
    const w=q.gaps[pick];
    if(!G.ok&&w&&w[2]!=null)s+=arcPath(w[2],w[3],'wrong');
    if(q.mod!=null)s+=arcPath(q.mod,q.to,'');
    svg.innerHTML=s;
    const right=q.tok.slice(0,q.ans+1).join('')+'、'+q.tok.slice(q.ans+1).join('');
    const mine=G.ok?null:(w?w[0]:q.tok.slice(0,pick+1).join('')+'、'+q.tok.slice(pick+1).join(''));
    const last=G.i===G.list.length-1;
    document.getElementById('after').innerHTML=`<div class="box" style="padding:14px;gap:12px;border-color:${G.ok?'var(--ok)':'var(--ng)'}">
      <div class="verdict ${G.ok?'ok':'ng'}">${G.ok?'正解！':'ざんねん'}${G.newM?'<span style="font-size:13px;margin-left:8px;color:var(--ok);font-family:var(--body);font-weight:700">覚えた！</span>':''}</div>
      <ul class="check">
        <li><span class="mk o">〇</span><span><span class="ph">${esc(right)}</span><br><span class="why">${esc(q.meaning.replace(/ように$/,''))}という意味になります。</span></span></li>
        ${mine?`<li><span class="mk x">×</span><span><span class="ph">${esc(mine)}</span><br><span class="why">${esc(w?w[1]:'この位置に読点を打っても、言われた意味にははっきりなりません。')}</span></span></li>`:''}
      </ul>
      <div class="tip">${q.tip}</div>
      <div class="row"><button class="btn go" id="next">${last?'結果を見る':'次の問題へ'}</button></div></div>`;
    const nx=document.getElementById('next'); nx.onclick=next; nx.focus({preventScroll:true});
  }
}
function tap(i){
  if(G.done)return;
  const q=getQ(G.list[G.i]);
  if(q.type==='multi'){ if(G.sel.has(i))G.sel.delete(i); else if(G.sel.size<2)G.sel.add(i); render(); return; }
  G.sel=new Set([i]); judge();
}
function judge(){
  const q=getQ(G.list[G.i]);
  const ok=G.sel.size===q.ans.length&&q.ans.every(i=>G.sel.has(i));
  G.done=true; G.ok=ok;
  G.newM=record(q,ok);
  if(ok)G.score++; else G.miss.push(G.list[G.i]);
  track('answer_question',{category:'kakariuke-'+q.type,question:q.bun.join(''),correct:ok});
  render();
}
function arcPath(from,to,cls,lift){
  const sw=document.getElementById('sw').getBoundingClientRect();
  const a=document.getElementById('b'+from).getBoundingClientRect(), b=document.getElementById('b'+to).getBoundingClientRect();
  const ax=a.left+a.width/2-sw.left, bx=b.left+b.width/2-sw.left;
  const aT=a.top-sw.top, aB=a.bottom-sw.top, bT=b.top-sw.top, bB=b.bottom-sw.top;
  const head=(x,y,up)=>up?`<polygon class="${cls}" points="${x-5},${y+8} ${x+5},${y+8} ${x},${y}"/>`:`<polygon class="${cls}" points="${x-5},${y-8} ${x+5},${y-8} ${x},${y}"/>`;
  if(Math.abs(aT-bT)<10){ // 同じ行：上にアーチ
    const top=aT-Math.min(40,(lift||16)+Math.abs(bx-ax)/6);
    return `<path class="${cls}" d="M${ax} ${aT} C ${ax} ${top}, ${bx} ${top}, ${bx} ${bT-6}"/>`+head(bx,bT-1,false);
  }
  if(aT<bT){ // 上の行から下の行へ：行のすきまを通る
    const mid=(aB+bT)/2;
    return `<path class="${cls}" d="M${ax} ${aB} C ${ax} ${mid+10}, ${bx} ${mid-10}, ${bx} ${bT-6}"/>`+head(bx,bT-1,false);
  }
  const mid=(bB+aT)/2; // 下の行から上の行へ
  return `<path class="${cls}" d="M${ax} ${aT} C ${ax} ${mid-10}, ${bx} ${mid+10}, ${bx} ${bB+6}"/>`+head(bx,bB+1,true);
}
function drawArcs(){
  const q=getQ(G.list[G.i]), svg=document.getElementById('arc'); let s='';
  if(q.type==='to'){ G.sel.forEach(i=>{if(i!==q.ans[0])s+=arcPath(q.src,i,'wrong');}); s+=arcPath(q.src,q.ans[0],''); }
  else if(q.type==='multi'){ G.sel.forEach(i=>{if(!q.ans.includes(i))s+=arcPath(i,q.target,'wrong',12);}); q.ans.forEach((i,k)=>s+=arcPath(i,q.target,'',12+k*14)); }
  else if(q.link){ s+=arcPath(q.link[0],q.link[1],''); }
  svg.innerHTML=s;
}
function explain(){
  const q=getQ(G.list[G.i]);
  const show=[...new Set([...G.sel,...q.ans,...(q.trap!=null?[q.trap]:[])])].filter(i=>i!==q.src&&i!==q.target);
  const item=i=>{
    const c=q.check[i], good=q.ans.includes(i);
    let ph,why;
    if(c){ph=c[0];why=c[1];}
    else if(q.type==='to'){ph=strip(q.bun[q.src])+strip(q.bun[i]);why=i<q.src?'かかる先は、ふつうその言葉より後ろにあります。':'つなげても意味が通りません。';}
    else if(q.type==='multi'){ph=strip(q.bun[i])+strip(q.bun[q.target]);why='つなげても意味が通りません。';}
    else {ph=strip(q.bun[i]);why=q.type==='subj'?'「だれが・何が」にあたる言葉ではありません。':'文の終わりにある、「どうする・どんなだ・何だ」にあたる言葉ではありません。';}
    return `<li><span class="mk ${good?'o':'x'}">${good?'〇':'×'}</span><span><span class="ph">${esc(ph)}</span><br><span class="why">${esc(why)}</span></span></li>`;
  };
  const last=G.i===G.list.length-1;
  const ansText=q.ans.map(i=>`「${esc(strip(q.bun[i]))}」`).join('と');
  document.getElementById('after').innerHTML=`<div class="box" style="padding:14px;gap:12px;border-color:${G.ok?'var(--ok)':'var(--ng)'}">
    <div class="verdict ${G.ok?'ok':'ng'}">${G.ok?'正解！':'ざんねん'}${G.newM?'<span style="font-size:13px;margin-left:8px;color:var(--ok);font-family:var(--body);font-weight:700">覚えた！</span>':''}　答えは${ansText}</div>
    <div class="label" style="color:var(--fg)">${q.type==='subj'||q.type==='pred'?'ひとつずつ確かめよう':'つなげて読んでみよう'}</div>
    <ul class="check">${show.map(item).join('')}</ul>
    <div class="tip">${q.tip}</div>
    <div class="row"><button class="btn go" id="next">${last?'結果を見る':'次の問題へ'}</button></div></div>`;
  const nx=document.getElementById('next'); nx.onclick=next; nx.focus({preventScroll:true});
}
function next(){ G.done=false; G.sel=new Set(); G.pick=null; if(++G.i<G.list.length)render(); else result(); }
function result(){
  const n=G.list.length,s=G.score,r=s/n;
  const rank=r===1?'満点':r>=.8?'特選':r>=.6?'入選':r>=.4?'佳作':'もう一歩';
  track('level_end',{level_name:PAID?'kakariuke-p-'+course:'kakariuke',success:s===n,score:s,total:n});
  if(PAID&&/^[123]$/.test(course)&&(best['lv'+course]==null||s>best['lv'+course])){best['lv'+course]=s;store.set('kakariuke-p-best',best);}
  app.innerHTML=`<div class="label">結果</div>
    <div class="score"><div class="big">${s}<small> / ${n}問</small></div><div class="seal">${rank}</div></div>
    <p style="margin:0">${r===1?'全問正解！係り受けはばっちりです。':r>=.6?'よくできました。まちがえた問題を、つなげ読みで確かめよう。':'2つの言葉をつなげて読む方法を使うと、ぐっと解きやすくなります。'}</p>
    <div class="row"><button class="btn go" id="again">${PAID?'コースをえらぶ':'もう一度'}</button>${G.miss.length?'<button class="btn" id="retry">まちがえた問題だけ</button>':''}</div>
    ${PAID?'':PAIDLINK}
    ${G.miss.length?`<div class="label" style="color:var(--fg)">まちがえた問題</div>${G.miss.map(k=>{const q=getQ(k);if(q.type==='comma')return `<div class="rv"><b>${esc(q.tok.slice(0,q.ans+1).join('')+'、'+q.tok.slice(q.ans+1).join(''))}</b><br>${esc(q.meaning.replace(/ように$/,''))}</div>`;return `<div class="rv"><b>${esc(q.bun.join(' '))}</b><br>${KIND[q.type]}：${q.ans.map(i=>'「'+esc(strip(q.bun[i]))+'」').join('と')}</div>`;}).join('')}`:''}`;
  document.getElementById('again').onclick=()=>PAID?home():start(typeof G.list[0]==='string'?CQ.map((q,i)=>'c'+i):QS.map((q,i)=>i));
  const rt=document.getElementById('retry'); if(rt)rt.onclick=()=>start(G.miss.slice());
}
const redraw=()=>{if(!G||!G.done)return; if(getQ(G.list[G.i]).type==='comma')renderComma(); else drawArcs();};
window.addEventListener('resize',redraw);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(redraw);
if(document.fonts&&document.fonts.addEventListener)document.fonts.addEventListener('loadingdone',redraw);
(async()=>{
  if(!PAID){ home(); return; }
  try{ QS=await decrypt(); home(); }catch(e){ lockScreen(e); }
})();
})();
</script>

.mnfb-rate button{border:1px solid #d6dde7;background:#f2f5f9;color:#1d2b3d;border-radius:10px;padding:8px 4px;font:700 13px/1.3 inherit;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.mnfb-rate button span{font-size:26px;line-height:1.1}
.mnfb-rate button:hover{border-color:#1f3a6e}
.mnfb-btn:focus-visible,.mnfb-sheet button:focus-visible,.mnfb-sheet a:focus-visible{outline:3px solid #c98a12;outline-offset:2px}
@media (prefers-color-scheme:dark){
  .mnfb-sheet{background:#18212d;color:#e4e9f1;border-color:#2a3546}
  .mnfb-sheet .mnfb-note,.mnfb-sheet .mnfb-x,.mnfb-sheet .mnfb-opt small{color:#9aa6b8}
  .mnfb-sheet .mnfb-opt,.mnfb-rate button{background:#10151d;color:#e4e9f1;border-color:#2a3546}
}
@media print{.mnfb-btn,.mnfb-sheet{display:none!important}}
</style>
<script>
(function(){
var CFG=null;            // site.json の feedbackForm から作った設定（なければ null）
var base=window.mnTrack, lastQ=null, lastLv='';
function file(){try{return decodeURIComponent(location.pathname.split('/').pop()||'');}catch(e){return '';}}
function clean(s){return String(s).replace(/\{(.+?)\}/g,'【$1】');}
function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function formUrl(kind,q){
  var u=CFG.base+'?usp=pp_url';
  if(CFG.type)u+='&'+CFG.type+'='+encodeURIComponent(kind==='q'?CFG.machigai:CFG.kansou);
  if(CFG.game)u+='&'+CFG.game+'='+encodeURIComponent(document.title);
  if(CFG.question&&q)u+='&'+CFG.question+'='+encodeURIComponent(q);
  return u;
}
var sheet=el('<div class="mnfb-sheet" role="dialog" aria-label="ご意見" hidden></div>');
document.body.appendChild(sheet);
function close(){sheet.hidden=true;sheet.innerHTML='';}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!sheet.hidden)close();});
// わくの外をさわったら閉じる（評価は「答えなかった」として、その日はもう出さない）
document.addEventListener('click',function(e){
  if(sheet.hidden||sheet.contains(e.target)||(e.target.closest&&e.target.closest('.mnfb-btn')))return;
  if(sheet.dataset.k==='rate')markRated();
  close();
},true);

// 1・2. ご意見ボタン（感想フォーム／いまの問題のまちがいを知らせる）
if(CFG){
  var btn=el('<button class="mnfb-btn" type="button" aria-haspopup="dialog">ご意見</button>');
  document.body.appendChild(btn);
  btn.onclick=function(){
    if(!sheet.hidden&&sheet.dataset.k==='menu'){close();return;}
    var q=lastQ||(lastLv?'コース：'+lastLv:'');
    sheet.dataset.k='menu';
    sheet.innerHTML='<div class="mnfb-h"><span>ご意見をお聞かせください</span><button class="mnfb-x" type="button" aria-label="閉じる">×</button></div>'
      +(lastQ?'<a class="mnfb-opt" data-kind="question" target="_blank" rel="noopener" href="'+esc(formUrl('q',q))+'">いまの問題のまちがいを知らせる<small>'+esc(q)+'</small></a>':'')
      +'<a class="mnfb-opt" data-kind="comment" target="_blank" rel="noopener" href="'+esc(formUrl('k',lastLv?'コース：'+lastLv:''))+'">感想・ご意見を送る<small>'+esc(document.title)+'</small></a>'
      +'<p class="mnfb-note">保護者の方向けのフォームが新しいページで開きます。お子さんのお名前や学校名は書かないでください。</p>';
    sheet.hidden=false;
    sheet.querySelector('.mnfb-x').onclick=close;
    sheet.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){try{base&&base('feedback_open',{kind:a.dataset.kind});}catch(e){}setTimeout(close,0);});});
  };
}

// 3. ワンタップ評価（ゲームを1回終えたとき。同じゲームは1日1回まで）
function rated(){try{var r=JSON.parse(localStorage.getItem('mn-rated')||'{}');return r[file()]===new Date().toDateString();}catch(e){return false;}}
function markRated(){try{var r=JSON.parse(localStorage.getItem('mn-rated')||'{}');r[file()]=new Date().toDateString();localStorage.setItem('mn-rated',JSON.stringify(r));}catch(e){}}
function askRating(lv){
  if(rated()||!sheet.hidden)return;
  sheet.dataset.k='rate';
  sheet.innerHTML='<div class="mnfb-h"><span>このゲーム、どうだった？</span><button class="mnfb-x" type="button" aria-label="閉じる">×</button></div>'
    +'<div class="mnfb-rate"><button type="button" data-r="fun"><span>😊</span>たのしかった</button><button type="button" data-r="ok"><span>🙂</span>ふつう</button><button type="button" data-r="hard"><span>😣</span>むずかしすぎた</button></div>';
  sheet.hidden=false;
  sheet.querySelector('.mnfb-x').onclick=function(){markRated();close();};
  sheet.querySelectorAll('[data-r]').forEach(function(b){b.onclick=function(){
    try{base&&base('game_rating',{rating:b.dataset.r,level_name:lv||''});}catch(e){}
    markRated();
    sheet.innerHTML='<div class="mnfb-h"><span>ありがとう！</span></div>';
    setTimeout(function(){if(sheet.dataset.k==='rate')close();},1200);
  };});
}
window.mnTrack=function(n,p){p=p||{};try{base&&base(n,p);}catch(e){}
  try{
    if(n==='level_start'){lastLv=String(p.level_name||'');if(sheet.dataset.k==='rate')close();}
    else if(n==='answer_question'){if(sheet.dataset.k==='rate')close();if(p.question!=null)lastQ=clean(p.question).slice(0,120);}
    else if(n==='level_end'){if(p.level_name)lastLv=String(p.level_name);setTimeout(function(){askRating(lastLv);},700);}
  }catch(e){}};
})();
</script>

</body></html>
