<title>品詞クイズ</title>

<meta name="game:subject" content="国語">
<meta name="game:unit" content="文法・品詞">
<meta name="game:grade" content="小5〜">
<meta name="game:players" content="1人">
<meta name="description" content="文の中の言葉の品詞を、10品詞すべての中からえらぶクイズ。15問。">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Old+Mincho:wght@700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: 1列。色のついた言葉がある一文 → 10品詞のボタン（いつも同じ並び）→ 見分け方の道すじで理由を見せる */
:root{
  --bg:#f5f6f3; --surface:#ffffff; --fg:#23262b; --muted:#646a70; --rule:#dadcd6;
  --grid:#c4553a; --gridsoft:#f6e4de; --ok:#2f7a52; --oksoft:#e2f0e7; --ng:#c8352d; --ngsoft:#f8e3e1; --pick:#eceee8; --gold:#b88a1e;
  --display:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --kanji:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141615; --surface:#1d201f; --fg:#e8eae6; --muted:#9ea4a0; --rule:#323634;
  --grid:#e47a5f; --gridsoft:#3a2520; --ok:#5cc28c; --oksoft:#1d3328; --ng:#f07468; --ngsoft:#3a2220; --pick:#262a28; --gold:#d9ab45; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141615; --surface:#1d201f; --fg:#e8eae6; --muted:#9ea4a0; --rule:#323634;
  --grid:#e47a5f; --gridsoft:#3a2520; --ok:#5cc28c; --oksoft:#1d3328; --ng:#f07468; --ngsoft:#3a2220; --pick:#262a28; --gold:#d9ab45; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-size:clamp(28px,7.5vw,38px);line-height:1.2;margin:0;letter-spacing:.06em}
.lead{margin:4px 0 0;color:var(--muted);font-size:14px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--grid);outline-offset:2px}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:16px}
.label{font-size:12px;font-weight:700;color:var(--grid);letter-spacing:.1em}
.q{margin:0;font-size:16px;font-weight:700}
.sent{font-family:var(--kanji);font-weight:600;font-size:clamp(22px,6.4vw,30px);line-height:1.8;margin:0;padding:14px 4px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);word-break:keep-all;overflow-wrap:anywhere}
.sent mark{background:var(--gridsoft);color:var(--grid);border-bottom:3px solid var(--grid);padding:0 3px;border-radius:3px 3px 0 0}
.pos{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media (max-width:460px){.pos{grid-template-columns:repeat(2,1fr)}}
.pb{border:2px solid var(--rule);background:var(--surface);border-radius:8px;padding:10px 4px;font-weight:700;font-size:16px;cursor:pointer;min-height:48px}
.pb:hover:not(:disabled){border-color:var(--grid);background:var(--gridsoft)}
.pb:disabled{cursor:default;opacity:.45}
.pb.right{opacity:1;border-color:var(--ok);background:var(--oksoft);color:var(--ok)}
.pb.wrong{opacity:1;border-color:var(--ng);background:var(--ngsoft);color:var(--ng)}
.note{font-size:13px;color:var(--muted);margin:0}
.verdict{font-family:var(--display);font-size:24px;line-height:1.3}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0;padding:0;list-style:none}
.path li{background:var(--bg);border-radius:6px;padding:4px 10px;font-size:14px;font-weight:700}
.path li+li::before{content:"→";margin-right:6px;color:var(--muted);font-weight:400}
.path li:last-child{background:var(--ok);color:var(--surface)}
.path li:last-child::before{color:var(--surface)}
.tip{border-left:4px solid var(--grid);padding:4px 0 4px 12px;font-size:15px}
.mine{background:var(--bg);border-radius:8px;padding:8px 12px;font-size:14px}
.mine b{color:var(--ng)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:8px;padding:10px 20px;font-weight:700;cursor:pointer;background:var(--pick)}
.btn.go{background:var(--fg);color:var(--surface)}
.top{display:flex;align-items:center;gap:10px}
.prog{flex:1;height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--grid)}
.nums{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.big{font-family:var(--display);font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:22px}
.seal{width:92px;height:92px;border-radius:50%;border:5px solid var(--grid);color:var(--grid);display:grid;place-items:center;font-family:var(--display);font-size:22px;transform:rotate(-10deg)}
.rv{border:1px solid var(--rule);border-radius:8px;padding:10px 14px;font-size:14px}
.rv b{font-family:var(--kanji);font-size:17px}
.rv mark{background:var(--gridsoft);color:var(--grid)}
.howto{margin:0;padding-left:1.3em;font-size:15px;display:grid;gap:4px}
.courses{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.courses{grid-template-columns:1fr}}
.course{border:2px solid var(--rule);background:var(--surface);border-radius:8px;padding:14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px}
.course:hover:not(:disabled){border-color:var(--grid)}
.course .nm{font-family:var(--display);font-size:20px}
.course .ds{font-size:13px;color:var(--muted);line-height:1.5}
.course .best{font-size:12px;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.course:disabled{opacity:.4;cursor:default}
details.tree{border:1px solid var(--rule);border-radius:8px;padding:10px 14px}
details.tree summary{cursor:pointer;font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.tbl th,.tbl td{border-top:1px solid var(--rule);padding:6px 6px;text-align:left;vertical-align:top}
.tbl th{white-space:nowrap;font-weight:700}
.tbl .g{color:var(--muted);font-size:12px;white-space:nowrap}
.paid{display:flex;flex-direction:column;gap:2px;border:2px solid var(--grid);border-radius:8px;padding:12px 14px;text-decoration:none;color:var(--fg);background:var(--gridsoft)}
.paid .pt{font-size:15px} .paid .pt b{font-family:var(--display);color:var(--grid)}
.paid .pd{font-size:13px;color:var(--muted)}
.lock input{font:inherit;font-size:20px;padding:10px 12px;border:2px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--fg);width:100%;box-sizing:border-box}
.err{color:var(--ng);font-size:14px;margin:0;min-height:1.5em}
.shop{background:var(--bg);border-radius:8px;padding:12px 14px;font-size:14px}
.shop a{color:var(--grid);font-weight:700}
.master{display:flex;flex-direction:column;gap:6px}
.master .tp{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.master .cnt{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.master .cnt small{font-size:14px;color:var(--muted);font-family:var(--body)}
.mbar{height:10px;background:var(--rule);border-radius:5px;overflow:hidden;display:flex}
.mbar i{display:block;height:100%}
.mbar .m{background:var(--ok)} .mbar .w{background:var(--gold)}
.mleg{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.mleg span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle;background:var(--c)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
</style>

<div class="wrap">
  <header>
    <h1>品詞クイズ</h1>
    <p class="lead">色のついた言葉の品詞を、10品詞の中からえらぼう。全15問。</p>
  </header>
  <section class="box" id="app"></section>
</div>

<script type="application/json" id="data">{}</script>
<script>
(function(){
/* 問題データ: s=文（{ }の中が問う単語）, p=正しい品詞, e=解説, lv=難しさ（1基本 2標準 3発展） */
const PAID=false;
let QS=[{"s":"弟は{犬}が大好きだ。","p":"名詞","e":"物の名前を表し、「が」をつけて主語になれる言葉は名詞です。","lv":1},{"s":"鳥が空を{飛ぶ}。","p":"動詞","e":"動きを表し、言い切りの形が「ウ段」の音で終わる言葉は動詞です。","lv":1},{"s":"この花はとても{美しい}。","p":"形容詞","e":"ようすを表し、言い切りの形が「い」で終わる言葉は形容詞です。","lv":1},{"s":"図書館は{静かだ}。","p":"形容動詞","e":"ようすを表し、言い切りの形が「だ」で終わる言葉は形容動詞です。","lv":1},{"s":"{大きな}犬がほえた。","p":"連体詞","e":"「大きな」は名詞（犬）だけをくわしくし、形が変わらない連体詞です。「大きい」は形容詞です。","lv":2},{"s":"{大きい}犬がほえた。","p":"形容詞","e":"「大きい」は「い」で終わる形容詞。「大きな」は連体詞なので区別しよう。","lv":2},{"s":"かめが{ゆっくり}歩く。","p":"副詞","e":"「ゆっくり」は動き（歩く）をくわしくし、形が変わらない副詞です。","lv":1},{"s":"雨がふった。{しかし}試合は行われた。","p":"接続詞","e":"前の文と後ろの文をつなぐ言葉で、接続詞です。","lv":1},{"s":"{ああ}、きれいな空だ。","p":"感動詞","e":"おどろきや感動を表し、ほかの言葉と直接つながらない言葉です。","lv":1},{"s":"ぼくは学校へ行か{ない}。","p":"助動詞","e":"動詞の後について打ち消しを表す「ない」は助動詞です。「ぬ」に言いかえられます（行かぬ）。「本がない」の「ない」（形容詞）と区別しよう。","lv":2},{"s":"部屋には本が{ない}。","p":"形容詞","e":"「本がない」の「ない」は「ある」の反対で、それだけで意味がわかるので形容詞です。「行かない」の「ない」（助動詞）と区別しよう。","lv":3},{"s":"鳥{が}鳴く。","p":"助詞","e":"名詞などの後について、言葉と言葉の関係を表す、形の変わらない付属語です。","lv":1},{"s":"机の上に本が{ある}。","p":"動詞","e":"「ある」は、ものがあることを表す動詞です。「ある日」の「ある」（連体詞）と区別しよう。","lv":2},{"s":"{ある}日、手紙が届いた。","p":"連体詞","e":"「ある日」の「ある」は、名詞「日」をくわしくする連体詞です。「本がある」の「ある」（動詞）と区別しよう。","lv":3},{"s":"練習した。{でも}負けた。","p":"接続詞","e":"文の初めにある「でも」は、前と反対のことをつなぐ接続詞です。「子どもでも」の「でも」（助詞）と区別しよう。","lv":3}];
const POS=['名詞','動詞','形容詞','形容動詞','連体詞','副詞','接続詞','感動詞','助動詞','助詞'];
const PATH={
  名詞:['自立語','活用しない','「が」をつけて主語になれる'],
  動詞:['自立語','活用する','言い切りがウ段（う・く・す・る…）'],
  形容詞:['自立語','活用する','言い切りが「い」'],
  形容動詞:['自立語','活用する','言い切りが「だ」'],
  連体詞:['自立語','活用しない','名詞だけをくわしくする'],
  副詞:['自立語','活用しない','おもに動き・ようすをくわしくする'],
  接続詞:['自立語','活用しない','前と後ろをつなぐ'],
  感動詞:['自立語','活用しない','感動・呼びかけ・返事・あいさつ'],
  助動詞:['付属語','活用する'],
  助詞:['付属語','活用しない']};
const EX={名詞:'山・わたし・三つ・こと',動詞:'走る・ある・いる',形容詞:'美しい・大きい・ない',形容動詞:'静かだ・きれいだ',連体詞:'この・大きな・ある（日）',副詞:'とても・ゆっくり・けっして',接続詞:'しかし・だから・または',感動詞:'ああ・はい・おい',助動詞:'ない・た・だ・らしい',助詞:'が・を・も・から'};
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const track=(n,p)=>{try{window.mnTrack&&mnTrack(n,p);}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const sent=s=>esc(s).replace(/\{(.+?)\}/,'<mark>$1</mark>');
const word=s=>s.match(/\{(.+?)\}/)[1];
let G=null;
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const norm=s=>s.normalize('NFKC').toLowerCase().replace(/[\s\-ー－]/g,'');
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let shopUrl='', rec=store.get('hinshi-p-rec',{}), best=store.get(PAID?'hinshi-p-best':'hinshi-best',{}), course=null;
const saveRec=()=>store.set('hinshi-p-rec',rec);
const qkey=q=>q.s;
const state=q=>{const r=rec[qkey(q)];if(!r)return 'new';if(r[0]>=2&&r[0]>r[1])return 'master';if(r[1]>0)return 'weak';return 'try';};
const record=(q,ok)=>{if(!PAID)return false;const before=state(q);const r=rec[qkey(q)]||[0,0];r[ok?0:1]++;rec[qkey(q)]=r;saveRec();return state(q)==='master'&&before!=='master';};
const LV={1:['基本','10品詞それぞれの、代表的な言葉。'],2:['標準','形が変わった言葉（はやく・閉め）、組になる副詞、「〜な」の言葉。'],3:['発展','まぎらわしい言葉の見分け（ある・ない・でも・だ など）。']};
const PAIDLINK=`<a class="paid" href="hinshi-full.html" id="paid-link"><span class="pt">もっと練習したい人へ　<b>品詞クイズ 100問</b>（有料版）</span><span class="pd">基本・標準・発展の3コース、全100問。覚えた問題の記録と、苦手だけの復習つき。</span></a>`;
const TREE=`<details class="tree"><summary>品詞の見分け方（表）</summary>
  <table class="tbl"><tbody>${POS.map(p=>`<tr><th>${p}</th><td>${PATH[p].join(' → ')}<br><span class="g">例：${EX[p]}</span></td></tr>`).join('')}</tbody></table>
  <p class="note" style="margin-top:8px">自立語＝それだけで意味がわかる言葉。付属語＝ほかの言葉の後ろについて使う言葉。活用＝後ろにつく言葉によって形が変わること。</p></details>`;
async function decrypt(pass){
  const p=JSON.parse(document.getElementById('data').textContent);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(pass)),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(p.salt),iterations:p.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(p.iv)},k,b64(p.data))));
}
function lockScreen(msg){
  app.innerHTML=`<div class="label">合言葉</div>
    <p class="q">ご購入時にお知らせした合言葉を入れると、全100問で遊べます。一度入れれば、この端末では次から入力はいりません。</p>
    <form id="f" class="lock" autocomplete="off" style="display:flex;flex-direction:column;gap:12px">
      <label for="pass" style="font-weight:700">合言葉</label>
      <input id="pass" name="pass" inputmode="latin" autocapitalize="off" spellcheck="false" placeholder="例：hinshi-xxxx-xxxx">
      <p class="err" id="err" role="alert">${msg||''}</p>
      <div class="row"><button class="btn go" id="open" type="submit">ひらく</button></div>
    </form>
    <div class="shop">合言葉をお持ちでない方へ：${shopUrl?`<a href="${esc(shopUrl)}" target="_blank" rel="noopener">こちらから購入できます</a>`:'販売ページは準備中です。'}<br>無料版（15問）は <a href="hinshi.html">品詞クイズ</a> で遊べます。</div>`;
  document.getElementById('f').onsubmit=async e=>{
    e.preventDefault();
    const v=document.getElementById('pass').value; if(!norm(v)){document.getElementById('err').textContent='合言葉を入れてください。';return;}
    const bt=document.getElementById('open'); bt.disabled=true; bt.textContent='確かめています…';
    try{ QS=await decrypt(v); store.set('hinshi-p-pass',v); track('unlock',{product:'hinshi'}); home(); }
    catch(err){ bt.disabled=false; bt.textContent='ひらく'; document.getElementById('err').textContent='合言葉がちがいます。全角・半角や、つづりを確かめてもう一度入れてください。'; }
  };
}
function home(){
  G=null;
  if(PAID)return homePaid();
  app.innerHTML=`<div class="label">あそびかた</div>
    <ol class="howto"><li>文の中の、色のついた言葉を見ます。</li><li>その言葉の品詞を、10個の中からえらびます。</li><li>答えたあとに「見分け方の道すじ」で理由を確かめよう。</li></ol>
    ${TREE}
    <div class="row"><button class="btn go" id="go">はじめる（${QS.length}問）</button></div>${PAIDLINK}`;
  document.getElementById('go').onclick=()=>start(shuffle(QS.map((q,i)=>i)));
}
function homePaid(){
  const cnt={master:0,weak:0,new:0,try:0}; QS.forEach(q=>cnt[state(q)]++);
  const pools={1:QS.filter(q=>q.lv===1),2:QS.filter(q=>q.lv===2),3:QS.filter(q=>q.lv===3)};
  const weak=QS.filter(q=>state(q)==='weak'), fresh=QS.filter(q=>state(q)==='new');
  app.innerHTML=`<div class="master"><div class="tp"><span class="label" style="font-size:14px;color:var(--fg)">覚えた問題</span><span class="cnt">${cnt.master}<small> / ${QS.length}問</small></span></div>
      <div class="mbar" aria-hidden="true"><i class="m" style="width:${cnt.master/QS.length*100}%"></i><i class="w" style="width:${cnt.weak/QS.length*100}%"></i></div>
      <div class="mleg"><span style="--c:var(--ok)">覚えた ${cnt.master}</span><span style="--c:var(--gold)">にがて ${cnt.weak}</span><span style="--c:var(--rule)">まだ ${cnt.new}</span></div></div>
    <div class="label">コースをえらぶ（1回10問）</div>
    <div class="courses">${[1,2,3].map(l=>`<button class="course" id="lv${l}" data-l="${l}"><span class="nm">${LV[l][0]}</span><span class="ds">${LV[l][1]}（${pools[l].length}問）</span><span class="best">${best['lv'+l]!=null?`ベスト ${best['lv'+l]}/10`:''}</span></button>`).join('')}
      <button class="course" id="lvweak" data-l="weak" ${weak.length?'':'disabled'}><span class="nm">にがて</span><span class="ds">まちがえたことのある問題だけ（${weak.length}問）</span></button>
      <button class="course" id="lvfresh" data-l="fresh" ${fresh.length?'':'disabled'}><span class="nm">まだやっていない</span><span class="ds">一度も出ていない問題だけ（${fresh.length}問）</span></button></div>
    ${TREE}
    <div><button class="linkbtn" id="reset">記録を消す</button> <span id="resetq"></span></div>`;
  app.querySelectorAll('.course').forEach(b=>b.onclick=()=>{
    const l=b.dataset.l; course=l;
    const pool=l==='weak'?weak:l==='fresh'?fresh:pools[l];
    start(shuffle(pool).slice(0,10).map(q=>QS.indexOf(q)));
  });
  document.getElementById('reset').onclick=()=>{
    document.getElementById('resetq').innerHTML='本当に消しますか？ <button class="linkbtn" id="yes" style="color:var(--ng)">消す</button> <button class="linkbtn" id="no">やめる</button>';
    document.getElementById('yes').onclick=()=>{rec={};saveRec();homePaid();};
    document.getElementById('no').onclick=()=>{document.getElementById('resetq').textContent='';};
  };
}
function start(list){
  G={list,i:0,score:0,miss:[],done:false,pick:null};
  track('level_start',{level_name:PAID?'hinshi-p-'+course:'hinshi'});
  render();
}
function render(){
  const q=QS[G.list[G.i]], d=G.done;
  const cls=p=>d?(p===q.p?' right':p===G.pick?' wrong':''):'';
  app.innerHTML=`<div class="top"><div class="prog" aria-hidden="true"><i style="width:${G.i/G.list.length*100}%"></i></div><span class="nums">${G.i+1} / ${G.list.length}</span></div>
    <p class="q">色のついた言葉「${esc(word(q.s))}」の品詞はどれですか。</p>
    <p class="sent">${sent(q.s)}</p>
    <div class="pos" role="group" aria-label="品詞をえらぶ">${POS.map(p=>`<button class="pb${cls(p)}" data-p="${p}" ${d?'disabled':''}>${p}</button>`).join('')}</div>
    <div id="after"></div>`;
  app.querySelectorAll('.pb').forEach(b=>b.onclick=()=>pick(b.dataset.p));
  if(d)explain();
}
function pick(p){
  if(G.done)return;
  const q=QS[G.list[G.i]], ok=p===q.p;
  G.done=true; G.ok=ok; G.pick=p; G.newM=record(q,ok);
  if(ok)G.score++; else G.miss.push(G.list[G.i]);
  track('answer_question',{category:'hinshi-'+q.p,question:q.s,correct:ok});
  render();
}
function explain(){
  const q=QS[G.list[G.i]], last=G.i===G.list.length-1;
  document.getElementById('after').innerHTML=`<div class="box" style="padding:14px;gap:12px;border-color:${G.ok?'var(--ok)':'var(--ng)'}">
    <div class="verdict ${G.ok?'ok':'ng'}">${G.ok?'正解！':'ざんねん'}${G.newM?'<span style="font-size:13px;margin-left:8px;color:var(--ok);font-family:var(--body);font-weight:700">覚えた！</span>':''}　答えは${q.p}</div>
    <div class="label" style="color:var(--fg)">見分け方の道すじ</div>
    <ul class="path">${PATH[q.p].map(s=>`<li>${esc(s)}</li>`).join('')}<li>${q.p}</li></ul>
    <div class="tip">${esc(q.e)}</div>
    ${G.ok?'':`<div class="mine">あなたの答えの<b>${esc(G.pick)}</b>は「${esc(PATH[G.pick].join(' → '))}」の言葉です。</div>`}
    <div class="row"><button class="btn go" id="next">${last?'結果を見る':'次の問題へ'}</button></div></div>`;
  const nx=document.getElementById('next'); nx.onclick=next; nx.focus({preventScroll:true});
}
function next(){ G.done=false; G.pick=null; if(++G.i<G.list.length)render(); else result(); }
function result(){
  const n=G.list.length,s=G.score,r=s/n;
  const rank=r===1?'満点':r>=.8?'特選':r>=.6?'入選':r>=.4?'佳作':'もう一歩';
  track('level_end',{level_name:PAID?'hinshi-p-'+course:'hinshi',success:s===n,score:s,total:n});
  if(PAID&&/^[123]$/.test(course)&&(best['lv'+course]==null||s>best['lv'+course])){best['lv'+course]=s;store.set('hinshi-p-best',best);}
  app.innerHTML=`<div class="label">結果</div>
    <div class="score"><div class="big">${s}<small> / ${n}問</small></div><div class="seal">${rank}</div></div>
    <p style="margin:0">${r===1?'全問正解！品詞の見分けはばっちりです。':r>=.6?'よくできました。まちがえた問題を、見分け方の道すじで確かめよう。':'まず「自立語か付属語か」「活用するか」の2つから考えると、ぐっと解きやすくなります。'}</p>
    <div class="row"><button class="btn go" id="again">${PAID?'コースをえらぶ':'もう一度'}</button>${G.miss.length?'<button class="btn" id="retry">まちがえた問題だけ</button>':''}</div>
    ${PAID?'':PAIDLINK}
    ${G.miss.length?`<div class="label" style="color:var(--fg)">まちがえた問題</div>${G.miss.map(k=>{const q=QS[k];return `<div class="rv"><b>${sent(q.s)}</b><br>「${esc(word(q.s))}」は${q.p}</div>`;}).join('')}`:''}`;
  document.getElementById('again').onclick=()=>PAID?home():start(shuffle(QS.map((q,i)=>i)));
  const rt=document.getElementById('retry'); if(rt)rt.onclick=()=>start(G.miss.slice());
}
(async()=>{
  if(!PAID){ home(); return; }
  try{const d=await (await fetch('../games.json',{cache:'no-cache'})).json(); shopUrl=(d.site&&d.site.shopUrl)||'';}catch(e){}
  const saved=store.get('hinshi-p-pass','');
  if(saved){ try{ QS=await decrypt(saved); home(); return; }catch(e){ store.set('hinshi-p-pass',''); lockScreen('合言葉が変わりました。新しい合言葉を入れてください。'); return; } }
  lockScreen();
})();
})();
</script>
